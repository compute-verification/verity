# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "console/top-goals-running"
title = "Top goals with a running number"
owner = "console"
unit = "goals"
axis = "Top goals on the Metrics dashboard whose first number has a target, a value newer than its schedule and a mark."
better = "higher"
# reading the dashboard takes a site key, which one machine holds (`~/.research/jobs/token`), so the row names it
command = "research run --on vy-nebius-cpu-9 --project verity --source . --cwd source -- uv run python benchmarks/dashboard/run.py"
every = "1d"
goal = "console/one-dashboard"
