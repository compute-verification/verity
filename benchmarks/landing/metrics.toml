# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# a local research run from a checkout on an agent VM with the team's keys: it reads the control pod, GitHub and the store's
# labels, which no CPU node reaches (benchmarks/landing/README.md)
[[metric]]
id = "ci/plain-mark-to-main-p90"
title = "Time to merge"
owner = "ci"
unit = "hours"
axis = "Hours from validated to merged, 90th percentile over the last 7 days, for branches with no Lean change."
better = "lower"
command = "research run --project verity --cwd source -- bash benchmarks/landing/run.sh"
every = "12h"
goal = "ci/landing-two-hours"

[[metric]]
id = "ci/lean-mark-to-main-p90"
title = "Time to merge, Lean changes"
owner = "ci"
unit = "hours"
axis = "Hours from validated to merged, 90th percentile over the last 7 days, for branches that change Lean."
better = "lower"
command = "research run --project verity --cwd source -- bash benchmarks/landing/run.sh"
every = "12h"
goal = "ci/lean-landing-two-hours"
