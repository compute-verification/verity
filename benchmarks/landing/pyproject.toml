# Mark to `main` (README.md, `landing.py`). Not a package: the suite holds the computation (landings, marks across restacks,
# the split, each class's numbers) and the result it writes to a small fixture, with stand-ins for the control pod, GitHub,
# the store and git, so nothing is read from them (`uv run tools/verity/check/suites.py benchmarks/landing`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the marks and percentiles are the queue table's own functions; the result is written through the harness kit's writer,
# whose settings.py is built on verity_config's registry
inputs = [
    "tools/research/src/research/__init__.py",
    "tools/research/src/research/auto.py",
    "tools/research/src/research/queue_table.py",
    "tools/research/src/research/reds.py",
    "tools/config/verity_config",
    "verity/__init__.py",
    "tools/config/verity_config/verity_settings.py",
    "benchmarks/harness/verity_bench/__init__.py",
    "benchmarks/harness/verity_bench/kit.py",
    "benchmarks/harness/verity_bench/settings.py",
]
