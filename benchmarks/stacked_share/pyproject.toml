# The stacked-share tool and its tests. Not a package: units.py runs on a Build's Program where vLLM's registry is importable
# (job.sh, on a GPU node), share.py anywhere; their toys run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/stacked_share`).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# units.py reads property/v1 and census/v1 (verity.ml.circuits); share.py imports nothing of verity
inputs = ["verity/__init__.py", "verity/ml/__init__.py", "verity/ml/circuits"]
