# The stacked-share tool and its tests. Not a package: units.py runs on a Build's Program where vLLM's registry is importable
# (job.sh, on a GPU node), share.py anywhere; their toys run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/stacked_share`).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# units.py and beta.py read property/v1 and census/v1 (verity.ml.circuits), beta.py the data products' pass beside it
# (property_redteam/products_pass.py); share.py imports nothing of verity
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/kernels/__init__.py",
          "verity/ml/kernels/tc.py", "benchmarks/property_redteam/products_pass.py"]
