# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "top/tree-not-yet-lines"
title = "Files left to reorganize"
owner = "top"
unit = "lines"
axis = "Paths on main still outside the new repository layout."
better = "lower"
command = "research run --on auto --cwd source -- uv run python benchmarks/tree/not_yet.py"
every = "1d"
goal = "top/repo-cleaned-up"

[[metric]]
id = "top/architecture-not-built-rows"
title = "Architecture left to build"
owner = "top"
unit = "rows"
axis = "Things the architecture requires that main doesn't do yet, one row each of its table of code to write."
better = "lower"
command = "research run --on auto --cwd source -- uv run python benchmarks/tree/not_built.py"
every = "1d"
goal = "top/architecture-implemented"

[[metric]]
id = "top/lint-sites-found"
title = "Sites the lints find"
owner = "top"
unit = "sites"
axis = "Sites on main that the ratchet lints find, summed over every lint and file, in total and for each lead."
better = "lower"
command = "research run --on auto --cwd source -- uv run --all-packages --extra torch-cpu python benchmarks/tree/lint_sites.py"
every = "1d"
goal = "top/slices-clean"

[[metric]]
id = "top/lint-sites-allowed"
title = "Sites the allowlists permit"
owner = "top"
unit = "sites"
axis = "Sites on main that the ratchet lints' committed allowlists permit, in total and for each lead."
better = "lower"
command = "research run --on auto --cwd source -- uv run --all-packages --extra torch-cpu python benchmarks/tree/lint_sites.py"
every = "1d"

[[metric]]
id = "top/lint-sites-past-entries"
title = "Sites past their allowlist entries"
owner = "top"
unit = "sites"
axis = "Sites on main that the ratchet lints find past what their allowlist entries allow, summed by key and never netted, in total and for each lead."
better = "lower"
command = "research run --on auto --cwd source -- uv run --all-packages --extra torch-cpu python benchmarks/tree/lint_sites.py"
every = "1d"
