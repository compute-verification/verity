# te_core, the training-efficiency search's fixed core (README.md). Not a package: its commands run from
# `benchmarks/covert_witness/` as `python -m te_core.<module>`, and its tests run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/covert_witness/te_core`) on CPU torch.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Script mode runs `tests/cw_fake/`'s island against its own fake `prepare`; test_formats reads covert_witness's real one,
# whose E formats and rebuild costs it checks, the fixed modules it imports (data_v3.py and model.py among them) and the
# starts' digests it reads; test_evaluate runs covert_witness's evaluation job on a stub prepare; test_flops counts the
# ANDs of verity's gather circuit, which `flops.gather_selects` prices; test_gates compiles verity's Definitions and
# reads the pins beside them, under verity/definitions, in the circuit language of verity/circuits; test_pilot_start
# runs launch.py's pilot-start refusal, which imports pin.py; test_rescore reads the scorer's state through the analysis
# rescore loads; test_rho_vectors measures the capture's fixture circuits with te_core.capture.circuit and reads each
# circuit's op log beside it, and test_io_bound and test_formalism capture steps with te_core.capture, so the capture
# package is read whole; test_frontier_fit holds the v3 ladder's manifest to the registered v3 starts.
inputs = ["benchmarks/covert_witness/prepare.py", "benchmarks/covert_witness/sealed.py",
          "benchmarks/covert_witness/data_v3.py", "benchmarks/covert_witness/model.py",
          "benchmarks/covert_witness/starts_store.py", "benchmarks/covert_witness/starts_store.json",
          "benchmarks/covert_witness/evaluate.py", "benchmarks/covert_witness/launch.py",
          "benchmarks/covert_witness/pin.py", "benchmarks/covert_witness/analysis/rescore_v1.py",
          "benchmarks/covert_witness/islands/ladder-v3/ladder_store.json",
          "benchmarks/covert_witness/te_core/capture", "verity/__init__.py", "verity/errors.py",
          "verity/circuits", "verity/definitions"]
