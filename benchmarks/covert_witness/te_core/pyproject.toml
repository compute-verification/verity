# te_core, the training-efficiency search's fixed core (README.md). Not a package: its commands run from
# `benchmarks/covert_witness/` as `python -m te_core.<module>`, and its tests run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/covert_witness/te_core`) on CPU torch.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# The tests read te_core alone: script mode runs `tests/cw_fake/`'s island against its own fake `prepare`.
inputs = []
