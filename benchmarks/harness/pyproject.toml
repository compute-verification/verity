[project]
name = "verity-bench"
version = "0.1.0"
description = "Shared benchmark harnesses for Verity integrations and backends."
requires-python = ">=3.12"
dependencies = ["verity-config", "verity-vllm"]

[project.scripts]
verity-bench = "verity_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_bench"]

[tool.uv.sources]
verity-config = { workspace = true }
verity-vllm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The harness is a user of the vLLM integration. Its fake-engine tests import
# the public hook set and exercise the integration-facing arm contract.
inputs = ["benchmarks/specs", "integrations/vllm/verity_vllm/engine/hooks.py"]
