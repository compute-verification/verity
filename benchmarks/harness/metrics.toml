# This directory's numbers, one [[metric]] each, by the rules of tests/test_metrics_registry.py,
# which enforces them.

# Each is a row of the served table (`served_overhead.py`, `verity-bench served-table`): a protocol's arm over stock FP8
# as served (compiled), in time per output token, paired by rep, on Llama-3.1-8B at batch 32 with 512-token mixed
# prompts, read from the store's runs; a member is the same on another model or card, and a metric of members only
# has no reading of its own.
[[metric]]
id = "benchmarks/served-overhead-commit"
title = "Served overhead of committing values"
owner = "benchmarks"
unit = "percent"
axis = "Percent that committing every value of every served step adds to vLLM's time per output token serving Llama 3.1 8B, over stock FP8 on the H200 at batch 32."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/harness/served_overhead.py"
every = "7d"
goal = "benchmarks/six-directories-wired"

[[metric]]
id = "benchmarks/served-overhead-pous-bandwidth-audit"
title = "Served overhead of the bandwidth audit"
owner = "benchmarks"
unit = "percent"
axis = "Percent that PoUS's bandwidth audit adds to vLLM's time per output token over stock FP8 at batch 32, serving Llama 3.1 8B on the RTX PRO 6000, and as members Llama 3.1 8B (llama-3.1-8b-h200) and Llama 3.2 1B (llama-3.2-1b-h200) on one H200."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/harness/served_overhead.py"
every = "7d"
goal = "benchmarks/six-directories-wired"

[[metric]]
id = "benchmarks/served-overhead-pouw"
title = "Served overhead of useful work"
owner = "benchmarks"
unit = "percent"
axis = "Percent that PoUW's useful work (Pearl-C on sm_90a) adds to vLLM's time per output token over stock FP8 compiled, as vLLM serves it, at batch 32 with 512-token mixed prompts, every reading a member naming its model and card: Llama 3.2 1B on one H100 (llama-3.2-1b-h100); the reading on this row is from `main` before the shared-interfaces change of 18 Nov 2026; on the tree after it, the same arm measured about 22 times compiled stock FP8 on an H200 in a trial, 77 to 86 percent more time than on that card before; the cause is being named; no run of record is taken from the new tree until that is cured or this line is rewritten to say the figure is the slower one."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/harness/served_overhead.py"
every = "7d"
goal = "benchmarks/harness-runs-on-h100"
