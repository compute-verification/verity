schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-1gpu-pouw-h1"
# PoUW's H1 + fx1 (`pouw:eps1-sm120-h1fx1`, `verity_vllm.protocols.pouw.h1`) on the eager int8_exact engine of the
# int8 Llama-3.1-8B pin (int8_exact "all": every linear and attention layer on the plain exact-int8 arm), timed against
# that engine without PoUW (`stock-int8`), its token control: H1's arm serves its own y, so its tokens must equal exact
# int8's on every gate and timed rep. T (`rows`) is the engine's max_num_batched_tokens, 64 as in served_h1 and
# the Dither rows, with max_num_seqs 64 (vLLM refuses more sequences than a step's tokens).
#
# The harness builds H1 through `verity_vllm.LLM`'s `protocols` with only its public parameters (the LLM fills the
# engine's model runner and coins after the build), one window a run (gate, warm-up and timed rep) opened by `reinstall`,
# its S the run's step bound (`arms.window_steps`), opened before the clock starts and closed after it stops; each
# window's coins are in-process (a salt coin and S round coins, the Lean verifier's entropy), so it credits nothing
# (`pouw_h1.IN_PROCESS`): this row measures cost only. Each served call commits its A table and its z/y records' table
# inside the forward, with the row-table kernels on the GPU (`pouw_h1_tables_device`); no receipts are computed (that is a
# listener's, the Dither arm). The arm's own gate: every window static (each call inside its S steps and T rows, in
# order), the credit gate passing every served call, every request entered. Three reps, for an interval: a b32 window is
# about 290 steps of commitments, five a point.
#
# At T = 64 every quick prompt is chunked: int8_exact's attention takes each chunk as the last rows of its window,
# one batched call per layer step over the step's requests (`verity_vllm.engine.int8_ops.paged_attention`).
arms = ["stock-int8", "pouw:eps1-sm120-h1fx1"]
sweep = "quick"
reps = 3
eager = true
setup = "benchmarks/harness/setup/int8_pin.sh"

[arm_settings."pouw:eps1-sm120-h1fx1"]
control = "stock-int8"

[arm_settings."pouw:eps1-sm120-h1fx1".protocols_config.pouw]
rows = 64
admission = "per-round"

[preset]
id = "llama31-8b-1gpu-pouw-h1"
model = "verity-int8/Llama-3.1-8B-INT8"
revision = "723d342ac443b040931242c768df342b0f6f15a7"
case = "LLAMA31_8B_INT8"
precision = "int8_exact"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = false
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 64
max_num_seqs = 64
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
