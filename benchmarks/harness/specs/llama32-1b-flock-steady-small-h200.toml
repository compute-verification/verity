schema = "verity-bench/steady-spec/v0"
id = "llama32-1b-flock-steady-small-h200"
# Llama 3.2 1B's census block types other than its attention, each under its census name, then its three Boolean attention
# cut units, at one prover on one H200 with ten cores: a statement of `full` instances (`benchmarks/served_units/stage.py`) for a type at
# k_log 24 or below, one block a statement for one at 2^25 or 2^26. Launch with `verity-bench run SPEC --direct NODE`.
workload = "llama32-1b"
card = "h200"
cores = 10
sessions = 24
ahead = 2
driver = "595.91.07"
cuda_toolkit = "13.3.73"
setup = "benchmarks/harness/setup/flock_prover.sh"

[env]
RUST_MIN_STACK = "67108864"

[admission]
max_minutes = 60
mem_gb = 300

