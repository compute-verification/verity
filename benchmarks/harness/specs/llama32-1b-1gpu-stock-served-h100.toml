schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama32-1b-1gpu-stock-served-h100"
cards = ["h100"]
# `llama32-1b-1gpu-pouw-protocol-served`'s two stock arms on the H100 alone: no setup, so a machine with no CUDA toolkit
# runs it.
arms = ["stock-fp8", "stock-fp8@compiled"]
sweep = "b32"
reps = 6
eager = true

[arm_settings."stock-fp8@compiled"]
control = "none"

[preset]
id = "llama32-1b-1gpu-stock-served-h100"
model = "unsloth/Llama-3.2-1B"
revision = "9535bd9b1d1dea6acafbdc4813b728796aeb28da"
case = "LLAMA32_1B"
precision = "fp8"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 8192
max_num_seqs = 128
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
