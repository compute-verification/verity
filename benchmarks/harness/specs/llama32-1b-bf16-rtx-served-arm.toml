schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama32-1b-bf16-rtx-served-arm"
# G2's served arm (benchmarks/served_commit/served_arm.py): the Commit at rows-sha512's 4 KiB rows, compiled (G2's
# served-commit-rows-4k, control stock@compiled) and eager (commit-rows-4k-eager, control stock), against stock as vLLM
# serves it (stock@compiled) and the batch-invariant eager stock every eager row is timed against (stock), interleaved
# rep by rep on one RTX PRO 6000, over G2's width sweep.
arms = ["stock", "stock@compiled", "served-commit-rows-4k", "commit-rows-4k-eager"]
arm_modules = ["served_commit.served_arm:ROWS_4K", "served_commit.served_arm:EAGER_ROWS_4K"]
sweep = "width"
reps = 3
eager = true

[arm_settings."stock@compiled"]
control = "none"

[preset]
id = "llama32-1b-bf16-rtx-served-arm"
model = "unsloth/Llama-3.2-1B"
revision = "9535bd9b1d1dea6acafbdc4813b728796aeb28da"
case = "LLAMA32_1B"
precision = "bfloat16"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
max_model_len = 4096
# Four engines resident on one RTX PRO 6000 (about 2.5 GB of weights each, the pinned pool, and the Commits' buffers).
resident_gpu_memory_utilization = 0.15
block_gpu_memory_utilization = 0.80
resident_kv_cache_memory_bytes = 4294967296
block_kv_cache_memory_bytes = 4294967296

[admission]
max_minutes = 120
