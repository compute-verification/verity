schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama32-1b-1gpu-pearl-c-whole-served"
cards = ["h100"]
# `llama32-1b-1gpu-pouw-protocol-served` on one H100 with Pearl-C's whole-step arm (`bench_arm.PearlCWholeArm`, as in
# `llama31-8b-1gpu-pearl-c-whole-served`) beside its three arms, in one run under one host load. The whole-step arm
# is the ceiling of the served useful-work arm under one CUDA graph a decode step, not the protocol arm served through
# the adapter, which refuses its engine (`pouw.refusals`). The arm sets its own step's tokens (`PEARLC_STEP_TOKENS`).
arms = ["stock-fp8", "pearl-plus", "stock-fp8@compiled", "pouw-pearl-c-whole"]
arm_modules = ["benchmarks.pouw.pearl_c_vllm.bench_arm:PEARL_C_WHOLE"]
sweep = "b32"
reps = 6
eager = true
setup = "benchmarks/harness/setup/pearl_c_sm90.sh"

[arm_settings."pearl-plus"]
precision = "bfloat16"
control = "none"

[arm_settings."pearl-plus".protocols_config."pearl-plus"]
device = "cuda"
kernel = "$PEARLC_KERNEL"
cubin = "$PEARLC_CUBIN"

[arm_settings."stock-fp8@compiled"]
control = "none"

[preset]
id = "llama32-1b-1gpu-pearl-c-whole-served"
model = "unsloth/Llama-3.2-1B"
case = "LLAMA32_1B"
precision = "fp8"
gpu_count = 1

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 8192
max_num_seqs = 128
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
