schema = "verity-bench/steady-spec/v0"
id = "glm53-flock-steady-head-block-h200-c24"
# `glm53-flock-steady-head-block-h200`'s two four-prover points on 24 cores instead of ten: six a prover, all on the
# card's NUMA node on a node whose NUMA nodes hold 24 cores each. `cores` is in a point's identity, so these are other
# points than the ten-core spec's. Launch with `verity-bench run SPEC --direct NODE`, NODE an H200 node of
# `verity_bench.jobs.DIRECT_NODES` with a GPU slot of 24 cores on one NUMA node.
workload = "glm53"
card = "h200"
cores = 24
sessions = 120
ahead = 2
driver = "595.91.07"
cuda_toolkit = "13.3.73"
setup = "benchmarks/harness/setup/flock_prover.sh"

[env]
RUST_MIN_STACK = "67108864"

