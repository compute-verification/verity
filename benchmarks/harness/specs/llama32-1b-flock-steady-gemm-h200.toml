schema = "verity-bench/steady-spec/v0"
id = "llama32-1b-flock-steady-gemm-h200"
# Llama 3.2 1B's `Gemm_v2` block at K 2,048 and N 16 (the statement `benchmarks/kernels/wide_leaf/statement.toml` names),
# at one prover on one H200 with ten cores, the witness's units walked on the host's CPUs (`FC_UNIT_WALK` unset): its
# `-walk` sibling is the same point with the walk on the card. Run it as the harness's README says.
workload = "llama32-1b"
card = "h200"
cores = 10
sessions = 120
ahead = 2
driver = "595.91.07"
cuda_toolkit = "13.3.73"
setup = "benchmarks/harness/setup/flock_prover.sh"

[env]
RUST_MIN_STACK = "67108864"

[admission]
max_minutes = 40
mem_gb = 300

