schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-fp8-1gpu-bandwidth-served-reps6"
cards = ["rtx-pro-6000", "h200"]
# PoUS's bandwidth audit on served inference: the bandwidth audit's plain stack (bandwidth-plain) and its encoded,
# receipted stack (bandwidth-audit, gated against bandwidth-plain), each with the fill-sk16 filler over the paged KV pool,
# beside stock FP8 on the same graph path and stock FP8 as vLLM serves it, so the audit has a ratio to compiled serving as
# well as to stock on its own graph path. 6 reps, an even count, so drift over the run cancels in each arm's mean (the
# harness README's "How a point is timed"). The graph arms replay decode-only CUDA graphs at capture_sizes with no
# torch.compile (compilation mode 0, FULL_DECODE_ONLY); `stock-fp8@compiled` builds at vLLM's serving defaults
# (torch.compile, vLLM's own CUDA-graph mode and capture sizes). Compiled and graph-path FP8 tokens differ, so the compiled
# arm is uncontrolled and timed on its own gated tokens. On an H200 its rows differ from the RTX PRO 6000's in the device
# alone; only the RTX PRO 6000 builds FlashInfer for its own target (`[card_settings.rtx-pro-6000]`).
arms = ["stock-fp8", "bandwidth-plain", "bandwidth-audit", "stock-fp8@compiled"]
arm_modules = ["benchmarks.vllm_encoded.bench_arm:PLAIN", "benchmarks.vllm_encoded.bench_arm:AUDIT"]
sweep = "quick"
reps = 6
# A bandwidth engine's first one to three runs stall on their first prefill step:
# each engine warms until two consecutive runs agree.
warmups = 2
max_warmups = 8
eager = false
# The arms' libraries, built from the dispatched commit.
setup = "benchmarks/harness/setup/vllm_encoded.sh"

[arm_settings."stock-fp8@compiled"]
control = "none"

[env]
VERITY_VLLM_BENCH_KV_RECEIPTS = "on"

# A node-local checkpoint pinned by its content (`checkpoints-local.json`; its build refuses files that hash otherwise).
[preset]
id = "llama31-8b-fp8-1gpu-bandwidth-served-reps6"
model = "/workspace/pouw/mvp-e2e/models/llama-3.1-8b-instruct"
revision = "sha256:98e25b0ecbb3eff924ea9fad4673feea9ea6457d2f45db5b5b60e88205de1daa"
case = "LLAMA31_8B_INSTRUCT_LOCAL"
precision = "fp8"
gpu_count = 1

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 16384
# Every isolated (`blocks`) engine of one arm group gets the same exact KV pool (llama31-8b-fp8-1gpu's).
block_kv_cache_memory_bytes = 60129542144
batch_invariant = false

[admission]
max_minutes = 120

[card_settings.rtx-pro-6000.env]
FLASHINFER_CUDA_ARCH_LIST = "12.0f"
