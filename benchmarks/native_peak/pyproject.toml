[project]
name = "verity-native-peak"
version = "0.0.0"
description = "Measures a GPU's native dense peak for the benchmark tables."
requires-python = ">=3.12"
dependencies = ["research", "numpy"]

[project.optional-dependencies]
torch = ["torch>=2.4"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["benchmarks/census"]
