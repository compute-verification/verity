# The one-stage audit runs (a0 ... a11). Not a package: the suite tests a5's coin sources (`a5_coins.py`) on a toy window
# through `service.Stream` and the Lean verifier of record (`sampled-proofs-verifier`, built with lake on first use).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: the stream and its verifiers of record, and the Lean packages `sampled-proofs-verifier` builds from.
inputs = ["verity"]
