# The E2E demo's interfaces: the drawn-unit replay bundle and the block record. Not a package: the suite checks the drawn-unit replay bundle
# (`verity_e2e_demo.replay_bundle`) and the block record (`verity_e2e_demo.block_record`) against their schemas and
# fixtures.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: windows, commitments, the Definitions a unit replays and core's registered values.
# `benchmarks/torch_gpu/commit_slots/slots.py`: kernels' commit call, which builds the bundle's step commitments.
inputs = ["verity", "benchmarks/torch_gpu/commit_slots/slots.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_replay_bundle.py"]
paths = ["verity/circuits"]
