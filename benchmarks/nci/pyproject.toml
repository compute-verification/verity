[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_statement.py"]
# The calculator's lower bound cites guarantees by name; the tests check that the lock lists them. ReferenceLayered's
# falsification test (test_tiers.py) checks the parameters its Lean statements state against tiers.py's, with the
# Dot width read from the BF16 GEMM's step (gemm.py's GEMM_HOPPER).
inputs = [
  "Security/lean-audit.json",
  "Security/Definitions/InferenceOnly/Assumptions/Layered.lean",
  "Security/Definitions/InferenceOnly/Guarantees/Layered.lean",
  "verity/ml/circuits/ops/boolean/gemm.py",
  # tiers.CARD pins the ACCEL model's sm_120 card table, and CREDITED_CLOCK_HZ PoUW's H1 record (test_tiers.py)
  "Security/Definitions/Core/Accel/Sm120.lean",
  "verity/ml/protocols/pouw/circuit/h1device.py",
  # the slowdown D is the slowdown calculator's (statement.py, fit.py, imported by path)
  "benchmarks/slowdown/slowdown/__init__.py",
  "benchmarks/slowdown/slowdown/theorem.py",
]
