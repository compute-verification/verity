# The SPOT post's figures and their tests. Not a package: `figures.py` writes Figures 1-3's JSON and renders from the
# cards (`cards.py`), and the card schema, the workload card's generator, the cost model, the curves' bisection and
# the renders run here as a suite (`uv run tools/verity/check/suites.py benchmarks/spot_figures`).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# figure1.py plans with the sampled-proofs planner (optimize.py, which reads the integrity profile and the one-stage
# partition's size classes); the monitoring periods are core's reporting grid's (`reporting.PERIODS`); the world (the
# census and rho's world fleet, its locations' GPUs), the datacenter (the census), the H200's peak (the census), the
# output cap and the references (rho's reference), a MAC's AND gates (the FP8 MoE coordinate's circuit-check pin).
# The figure of record's driver (breakeven/headline.py) counts GLM-5.3's sparse-MLA heads from the registry
# (`sparse_mla.SPARSE_MLA_GLM53`): that module and what its import opens. Its 128k lever (breakeven/mla128.py) counts
# the serve plan's requests (`serve_tax/prefix_plan.jsonl`) by the registry's split rule (`sparse_mla_split.py`): that
# module, what its import opens, and the table a split row's bind reads. Its table's row of a census block's Boolean
# version is paired with the block by `verity bench prove`'s pairing (`verity_bench.boolean`, and the census name's
# spelling, `verity_bench.prove`), which loads every registered Boolean Definition: the registry, ops and numerics
# whole, and what their imports open beside them. The binding bound's instances (`binding.LEAN`) are held to the Lean
# theorems they name, read from their file.
inputs = ["verity/__init__.py", "verity/errors.py", 
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/boolean.py",
          "benchmarks/harness/verity_bench/prove.py", "adapters/vllm/verity_vllm/definitions/boolean.py", "verity/circuits/call_scope.py",
          "adapters/vllm/verity_vllm/definitions/registry", "verity/circuits/ops", "adapters/vllm/verity_vllm/definitions/numerics",
          "verity/circuits/silicon/fp32.py", "verity/circuits/silicon/fp4.py", "verity/circuits/silicon/tc_step.py",
          "verity/hardware/record.py", "verity/protocols/proofs/spot/verifier/profile.py", "verity/protocols/reporting.py",
          "verity/protocols/proofs/spot", "verity/claims", "verity/circuits",
          "verity/circuits/kernels", "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness",
          "benchmarks/census/adversary.json", "benchmarks/census/deployments.json", "benchmarks/census/hardware.json",
          "benchmarks/rho/data/reference.toml", "benchmarks/rho/data/hardware.toml",
          "adapters/vllm/verity_vllm/definitions/registry/boolean_fp8_moe.circuit-check.json",
          "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py",
          "adapters/vllm/verity_vllm/definitions/__init__.py", "adapters/vllm/verity_vllm/definitions/registry/__init__.py",
          "adapters/vllm/verity_vllm/definitions/registry/sparse_mla.py", "adapters/vllm/verity_vllm/definitions/registry/b1.py",
          "adapters/vllm/verity_vllm/definitions/registry/dead_free.py", "adapters/vllm/verity_vllm/definitions/registry/dense.py",
          "adapters/vllm/verity_vllm/definitions/registry/fa2_check_inf.py", "adapters/vllm/verity_vllm/definitions/registry/fa2_softcap.py",
          "adapters/vllm/verity_vllm/definitions/registry/fa3_check_inf.py", "adapters/vllm/verity_vllm/definitions/registry/hopper.py",
          "adapters/vllm/verity_vllm/definitions/registry/prims.py", "adapters/vllm/verity_vllm/definitions/registry/ref_prims.py",
          "adapters/vllm/verity_vllm/definitions/registry/sampling.py", "adapters/vllm/verity_vllm/definitions/registry/topp_geometry.py",
          "adapters/vllm/verity_vllm/definitions/registry/topp_keep_builder.py", "adapters/vllm/verity_vllm/definitions/registry/topp_word_gates.py",
          "adapters/vllm/verity_vllm/definitions/registry/topp_words.py", "adapters/vllm/verity_vllm/definitions/evidence.py", "adapters/vllm/verity_vllm/definitions/evidence.json",
