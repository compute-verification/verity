# The SPOT post's figures and their tests. Not a package: `figures.py` writes Figures 1-3's JSON and renders from the
# cards (`cards.py`), and the card schema, the workload card's generator, the cost model, the curves' bisection and
# the renders run here as a suite (`uv run tools/verity/check/suites.py benchmarks/spot_figures`).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# figure1.py plans with the sampled-proofs planner (optimize.py, which reads the integrity profile and the one-stage
# partition's size classes); the monitoring periods are core's reporting grid's (`reporting.PERIODS`); the world (the
# census and rho's world fleet, its locations' GPUs), the datacenter (the census), the H200's peak (the census), the
# output cap and the references (rho's reference), a MAC's AND gates (the FP8 MoE coordinate's circuit-check pin).
inputs = ["verity/__init__.py", "verity/errors.py", 
          "verity/hardware/record.py", "verity/protocols/spot/verifier/profile.py", "verity/protocols/reporting.py",
          "verity/protocols/spot", "verity/claims", "verity/circuits",
          "verity/definitions/kernels", "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness",
          "benchmarks/census/adversary.json", "benchmarks/census/deployments.json", "benchmarks/census/hardware.json",
          "verity/protocols/inference_only/rho/data/reference.toml", "verity/protocols/inference_only/rho/data/hardware.toml",
          "verity/definitions/registry/boolean_fp8_moe.circuit-check.json",
          "verity/hardware/__init__.py", "verity/protocols/__init__.py",
          "verity/definitions/__init__.py", "verity/definitions/registry/__init__.py"]
