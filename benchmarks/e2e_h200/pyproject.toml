# The H200 walking skeleton's step driver (CMP-96), run by `verity bench e2e_h200`. Not a package: its tests run in the
# workspace environment (torch from the workspace's torch-cpu extra), and `run.py` puts this directory on its path.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = [
    # the Definitions replay evaluates, P2's keys, and the commitments the commit call builds on
    "verity",
    # the per-step commit call (`row_tables.step_roots`, and `host_step`'s C++ twin with the sources it builds)
    "integrations/vllm/verity_vllm/__init__.py",
    "integrations/vllm/verity_vllm/commit/__init__.py",
    "integrations/vllm/verity_vllm/commit/row_tables.py",
    "integrations/vllm/verity_vllm/commit/row_tables_device.py",
    "integrations/vllm/verity_vllm/protocol_options/pouw_cuda/ncp2.cuh",
    "integrations/vllm/verity_vllm/protocol_options/pouw_cuda/row_table.cuh",
    "integrations/vllm/verity_vllm/protocol_options/pouw_cuda/row_table_host.cpp",
    "integrations/vllm/verity_vllm/protocol_options/pouw_cuda/row_table.cu",
    # the P2 v4 reference encode and decode the store runs
    "benchmarks/pous/p2_v1/__init__.py",
    "benchmarks/pous/p2_v1/reference.py",
]
