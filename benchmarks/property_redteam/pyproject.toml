# The property red team's refusal suite: Programs a stacking property (property/v1) must refuse or fully budget, the honest
# steps.py shapes it must pass (`cases.py`), and a runner that grades any check, a function from a Program to a verdict
# (`run.py`). Not a package: the tests put this directory on sys.path, like benchmarks/word_codec. `demo.py` is round 1's
# registry-evaluator demo. `renorm.py` searches toy fields for circuits of 6b's model (a port of Model.lean) that return a
# square's digits with few budgeted gates: the falsification test of the re-normalization conjecture N_L.
# `tests/test_key_binding_order.py` checks KeyBinding's ideal step against the codec's {x, p − x} symmetry; KB-1's
# regression test is remote_bandwidth's `test_append_order.py`. `squaring.py` ports Model.lean at p1024 and builds squaring
# circuits measured in its units (EncodeChainHardness's e a squaring); `free_codec.py` builds the whole codec word from the
# one-word gather Model.lean counted as free before #2420.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The cases are built from the circuits IR and evaluated by its reference evaluator, from core's registered primitives (ops,
# PoUW's words) and the Definitions' integer, gather and cast primitives (`verity_vllm.program.registry`, which imports
# their twins in `verity_vllm.program.kernels`), and the integration's quarantine, difftest and relation modules.
# The key-binding test reads the remote audit, on the commitments, the randomness, the profile and the kernels' plans.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits",
          "verity/ml/kernels", "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness",
          "verity/core/__init__.py", "verity/core/protocols/__init__.py", "verity/core/protocols/profile.py",
          "verity/core/protocols/remote_bandwidth", "verity/core/protocols/sampled_proofs/__init__.py",
          "verity/core/claims/__init__.py",
          "verity/core/protocols/sampled_proofs/challenger.py", "verity/core/protocols/sampled_proofs/remote.py",
          "verity/core/protocols/pouw/__init__.py",
          "verity/core/protocols/pouw/circuit", "integrations/vllm/verity_vllm/__init__.py",
          "integrations/vllm/verity_vllm/program/__init__.py", "verity/ml/definitions/__init__.py",
          "integrations/vllm/verity_vllm/program/registry",
          "integrations/vllm/verity_vllm/program/kernels", "integrations/vllm/verity_vllm/commit/__init__.py",
          "integrations/vllm/verity_vllm/commit/challenge.py",
          "integrations/vllm/verity_vllm/program/registry/quarantine",
          "integrations/vllm/verity_vllm/program/registry/mla_capture.py",
          "integrations/vllm/verity_vllm/program/registry/moe_difftest.py",
          "integrations/vllm/verity_vllm/program/registry/layer_norm_difftest.py",
          "integrations/vllm/verity_vllm/program/kernels/relations.py",
          "integrations/vllm/verity_vllm/program/kernels/sampling_rng.py",
          "integrations/vllm/verity_vllm/program/kernels/libdevice_sampling.py",
          "integrations/vllm/verity_vllm/program/kernels/rmsnorm_fused_sweep.py",
          "integrations/vllm/verity_vllm/program/kernels/gemm_target_correspondence.py",
          "integrations/vllm/verity_vllm/program/kernels/compiled_relations.py",
          "integrations/vllm/verity_vllm/program/kernels/compiled_norm_literal.py"]
