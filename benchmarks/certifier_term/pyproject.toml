# `verity bench certifier_term` (`run.py`). Not a package: the suite holds the result the runner writes with `--out` to
# the calculator's document and to the harness kit's writer (`uv run tools/verity/check/suites.py benchmarks/certifier_term`).
# What the runner prints with no `--out`, and the calculator's numbers, are benchmarks/network_traces' suite's.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# The runner loads the calculator of K by its file, benchmarks/network_traces/leak_bounds.py. It imports the network
# certifier's classes and calibration and the reporting δ, with the modules of `verity` those import (the circuits, the
# commitments, SPOT), and reads rho's world fleet and hardware data and the census; a scope's requests are by
# default the break-even planner's case, built from Figure 1's lines and the cards they read. The result is written by
# the harness kit's writer, which reads its settings through verity_config, and capacity is read from a registration
# log through the log's Python (registration's verifier, with the two package files above it) and the Site.
inputs = [
    "benchmarks/network_traces/leak_bounds.py",
    "benchmarks/census/deployments.json",
    "benchmarks/census/adversary.json",
    "benchmarks/census/hardware.json",
    "benchmarks/spot_figures/cards",
    "benchmarks/spot_figures/cards.py",
    "benchmarks/spot_figures/figure1.py",
    "benchmarks/spot_figures/total_cost.py",
    "benchmarks/spot_figures/breakeven",
    "benchmarks/harness/verity_bench/__init__.py",
    "benchmarks/harness/verity_bench/kit.py",
    "benchmarks/harness/verity_bench/settings.py",
    "verity/__init__.py",
    "verity/errors.py",
    "tools/config/verity_config/verity_settings.py",
    "verity/claims",
    "verity/circuits",
    "verity/commitments",
    "verity/commitments/crypto",
    "verity/commitments/randomness",
    "verity/runtime/__init__.py",
    "tools/config/verity_config",
    "verity/channel.py", "verity/runtime/handshake.py", "verity/tests",
    "verity/definitions/__init__.py",
    "verity/circuits/census.py",
    "verity/definitions/registry/boolean_fp8_moe.circuit-check.json",
    "verity/hardware/__init__.py",
    "verity/protocols/accounting/registration/__init__.py",
    "verity/protocols/accounting/registration/verifier/__init__.py",
    "verity/protocols/accounting/registration/verifier/registration.py",
    "verity/device.py",
    "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/accounting/__init__.py",
    "verity/protocol.py",
    "verity/protocols/accounting/certifier",
    "verity/protocols/proofs/spot",
    "benchmarks/rho/data/reference.toml",
    "benchmarks/rho/data/hardware.toml",
]
