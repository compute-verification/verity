# all-protocols' legs that answer a period of the torch loop with a protocol's own verifier (`pouw.py`: PoUW's). Not a
# package: its tests run in the workspace environment, with the torch loop (an integration, not a workspace package) on
# their path to serve the period they answer.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../../examples/toy"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: PoUW's window check and credit, and the interface the loop writes its period through.
# `examples/toy`: the loop the tests serve a period of.
inputs = ["verity", "examples/toy"]
