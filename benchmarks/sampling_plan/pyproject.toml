# The sampling plans' models and their tests. Not a package: the plans run as scripts (`int8_llama.py`,
# `transformer.py`, `h200.py`, `demo_a.py`, `served_window.py`), and the transformer's DAG, certificates and hand-off,
# the H200 plan, Demo A's frontier, the int8 row's replay and the served window's modes run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/sampling_plan`).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# transformer.py plans with the sampled-proofs planner and core's Stratified law over the primitive circuits'
# Definitions and their circuit-check pins (verity.circuits, which reads verity.definitions.kernels); the large model's test
# reads the card's memory from the census; Demo A's tile stratum reads PoUW's `eps_at` (pouw/window.py, with the
# commitments and randomness it imports); the reporting deltas and monitoring periods are core's reporting grid's
# (`verity.protocols.reporting`).
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/hardware/record.py",
          "verity/protocols/spot/verifier/profile.py", "verity/protocols/spot", "verity/claims",
          "verity/protocols/pouw/verifier/__init__.py", "verity/protocols/pouw/verifier/window.py",
          "verity/protocols/reporting.py", "verity/ml/__init__.py",
          "verity/circuits", "verity/definitions/kernels", "verity/commitments", "verity/commitments/crypto",
          "verity/commitments/randomness", "benchmarks/census/hardware.json",
          "verity/commitments/windows",  # inputs.cap reads C-Flock's composer's sizes (verity.commitments.windows.interface)
          # recursion.py's and served_window.py's datacenter (the census) and world fleet (rho's reference, its
          # locations' GPUs), and served_window.py's output cap (rho's reference)
          "benchmarks/census/deployments.json", "verity/protocols/inference_only/rho/data/reference.toml",
          "verity/protocols/inference_only/rho/data/hardware.toml",
          "verity/definitions/__init__.py", "verity/definitions/circuits", "verity/definitions/ops", "verity/definitions/silicon", "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/pouw/__init__.py"]
