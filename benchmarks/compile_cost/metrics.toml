# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "circuits/window-compile-minutes"
title = "Workload compile time"
owner = "circuits"
unit = "minutes"
axis = "Wall minutes on one core to compile a workload window's request Programs, each point naming its model, window, the card it compiles for and machine."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --mem-gb 64 --timeout 60m -- bash -lc 'uv run --extra torch-cpu python benchmarks/compile_cost/run.py --card h200-sxm-141gb --window long-w0; a=$?; uv run --extra torch-cpu python benchmarks/compile_cost/run.py --card h200-sxm-141gb --model llama-3.2-1b --out \"$RESEARCH_RUN_DIR/out/llama-3.2-1b\"; b=$?; [ $a = 0 ] && [ $b = 0 ]'"
every = "7d"

[[metric]]
id = "circuits/window-compile-peak-memory"
title = "Workload compile memory"
owner = "circuits"
unit = "GiB"
axis = "Peak resident memory compiling a workload window's request Programs, each point naming its model, window, the card it compiles for and machine."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --mem-gb 64 --timeout 60m -- bash -lc 'uv run --extra torch-cpu python benchmarks/compile_cost/run.py --card h200-sxm-141gb --window long-w0; a=$?; uv run --extra torch-cpu python benchmarks/compile_cost/run.py --card h200-sxm-141gb --model llama-3.2-1b --out \"$RESEARCH_RUN_DIR/out/llama-3.2-1b\"; b=$?; [ $a = 0 ] && [ $b = 0 ]'"
every = "7d"
