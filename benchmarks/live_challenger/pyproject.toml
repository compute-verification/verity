# The proof service's challenger on its auditor host: `serve.py` over `verity.core.protocols.sampled_proofs.remote`, which
# `auditor.py` runs there as the auditor user, one session a window under its signed ledger (`run.sh`: a research run's
# session elsewhere). Not a package: the suite runs serve.py as a process over loopback with a test key, the Lean verifier's
# coins stubbed (`tests/stub_serve.py`).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/profile.py", "verity/core/protocols/sampled_proofs/__init__.py",
          "verity/core/claims/__init__.py",
          "verity/core/protocols/sampled_proofs/challenger.py", "verity/core/protocols/sampled_proofs/remote.py",
          "verity/core/protocols/sampled_proofs/one_stage", "verity/ml/__init__.py", "verity/ml/circuits",
          "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness", "verity/core/protocols/pouw",
          "verity/ml/kernels/__init__.py", "verity/ml/kernels/tc.py"]
