# Training's slowdown code (the `training_slowdown` package) and its suite. Not a distribution: the suite and its commands
# run from this directory.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: the circuits' Definitions the gate prices compile and the Boolean gather the counter's tests price;
# `integrations/vllm/verity_vllm`: the training-step frontend `capture.lower` lowers a step to; the lf model
# (`train_step_lf.py`), loaded by path, whose shapes the policy states; the slowdown calculator (`benchmarks/rho`), whose
# registry, fleets and periods `calculator.py` reads, and the census's deployments, whose reference window it reads
inputs = ["verity", "integrations/vllm/verity_vllm", "integrations/vllm/tests/program/train_step_lf.py",
          "benchmarks/rho", "benchmarks/census/deployments.json"]
