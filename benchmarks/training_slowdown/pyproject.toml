# Training's slowdown code (the `training_slowdown` package) and its suite. Not a distribution: the suite and its commands
# run from this directory.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: the circuits' Definitions the gate prices compile and the Boolean gather the counter's tests price;
# `adapters/vllm/verity_vllm`: the training-step frontend `capture.lower` lowers a step to; the lf model
# (`train_step_lf.py`), loaded by path, whose shapes the policy states; the slowdown calculator (`verity/protocols/inference_only/rho`), whose
# registry, fleets and periods `calculator.py` reads and whose min-cut module and rows of β(k) test_min_cut holds
# formalism's copy to; the inference-only policy's calibrations, which the calculator's registry loads from outside its
# directory; and the census's deployments, whose reference window `calculator.py` reads
inputs = ["verity", "adapters/vllm/verity_vllm", "adapters/vllm/tests/program/train_step_lf.py",
          "adapters/vllm/tests/__init__.py", "adapters/vllm/tests/program/__init__.py",
          "verity/protocols/inference_only/rho", "benchmarks/census/deployments.json",
          "verity/protocols/inference_only/nci/calibrations.json"]
