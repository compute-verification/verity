# Training's slowdown code (the `training_slowdown` package) and its suite. Not a distribution: the suite and its commands
# run from this directory.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: the circuits' Definitions the gate prices compile and the Boolean gather the counter's tests price;
# `integrations/vllm/verity_vllm`: the training-step frontend `capture.lower` lowers a step to; the lf model
# (`train_step_lf.py`), loaded by path, whose shapes the policy states; the slowdown calculator (`verity/protocols/inference_only/rho`), whose
# registry, fleets and periods `calculator.py` reads and whose min-cut module and rows of β(k) test_min_cut holds
# formalism's copy to, with the files outside its directory it may load them from: the census's deployments (the
# reference window, which `calculator.py` reads too) and the inference-only policy's calibrations
inputs = ["verity", "integrations/vllm/verity_vllm", "integrations/vllm/tests/program/train_step_lf.py",
          "integrations/vllm/tests/__init__.py", "integrations/vllm/tests/program/__init__.py",
          "verity/protocols/inference_only/rho", "benchmarks/census/deployments.json",
          "verity/protocols/inference_only/nci/calibrations.json"]
