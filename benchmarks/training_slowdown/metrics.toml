# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "training/library-least-slowdown"
title = "Least slowdown in the library"
owner = "training"
unit = "slowdown factor"
axis = "The least slowdown (calculator.slowdown, at least one) of any library entry's traced step at the entry's own policy, a measured figure because it is the calculator's slowdown at the registry's rates over the run's own traces, over the entries that have one: an entry whose E keeps less than its trained weights, or whose step the entry point gives none, is left out, its row saying why (the capture refused the step, the step breaks a premise the rows' rates take, the trace isn't classified at the policy's k, or the k is past the last one (H) states a β at)."
better = "higher"
command = "research run --on auto --cwd source -- bash -lc 'uv sync -q --all-packages --extra torch-cpu && uv run python benchmarks/training_slowdown/training_slowdown/library.py --out \"$OUT\"'"
every = "7d"
goal = "training/search-frontier-in-library"
