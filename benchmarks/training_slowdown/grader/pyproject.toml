# The grader (grader.py). Not a package: the suite tests the hand-over, what the grader reads of the lf model's tiny training
# step (f32, with bf16 matrix products, and with those on sm_120's cuBLAS routes) against the step's ATen graph, the comparison
# with a trace of training's slowdown code, |C|'s pricing, the loader of that code on a stand-in, and the command line.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_slowdown_code.py"]
# `verity`: the circuits' codec, census and Boolean prices the grader reads with; `adapters/vllm/verity_vllm`: the
# training-step frontend that derives the steps (`step_program`, `primitives`); its tests' lf model (`train_step_lf.py`),
# the step the tests derive, loaded by path; `verity/configuration/config/verity_config`: settings.py's registry;
# `benchmarks/training_slowdown/training_slowdown`: training's slowdown code, which the cross-check reads where it sits when
# VERITY_GRADER_SLOWDOWN_CODE names this tree's.
inputs = ["verity", "adapters/vllm/verity_vllm", "adapters/vllm/tests/program/train_step_lf.py",
          "verity/configuration/config/verity_config", "benchmarks/training_slowdown/training_slowdown"]
