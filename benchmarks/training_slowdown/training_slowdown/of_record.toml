# The run of record each entry of attacks/ that ports a run is held to. `training_slowdown.of_record` reads it and
# checks every record it opens against it.
#
# An entry: `run` is the run, `art` the store artifact holding its record, `path` the record's file there and `sha256`
# that file's.
#
# `record_only`, where an entry has it, lists the lines of the record's own program that the route rightly does not
# compute, each a table `[[held."ENTRY".record_only]]`: the line's `phase`, `kind`, `op` and `shapes` as the command
# prints them, the `count` and `macs` the record's step has of it over the config's (all of the line where the config
# has none of it), and `why` the route does not compute it. The command prints such a line as named and counts the
# entry equal; a line named here that the record's step does not have over the config's as named is a difference.

