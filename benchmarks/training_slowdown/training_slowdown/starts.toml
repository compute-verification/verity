# The starts an attack trains from, and the data they were trained and are scored on. `training_slowdown.starts` and
# `training_slowdown.data` read it and check every file they open against it.
#
# A start: `art` is the store artifact holding it and `path` its directory there (theta.safetensors, start.json);
# `installed` is where a node holds the same directories. `digest` is θ's digest as start.json records it. `c0_macs` is
# the counted MACs of the start's own training (start.json's provenance.c0.macs, a float because the largest is past
# TOML's integers) and `l0_bpb` θ's bits per byte on the whole search pool (provenance.search_pool.bpb).
#
# A data: its tokenizer, the sha256 of its built stream's manifest and tokenizer.json, the selection the stream was
# built from (a fixture in fixtures/artifacts.json, which the manifest names by sha256), each held-out set's tokens by
# sha256, and where a node holds each.

