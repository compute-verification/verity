# The start deepened from 6 to 15 blocks, each block a copy of the start's ⌊6j/15⌋-th with a repeated copy's output
# projections zeroed, so the grown model is the start's function at its first step; Muon on every matrix of the blocks,
# each normalized by its norm as a scalar, and AdamW on the gains and the embedding at rates of their own, in four
# forwards of 32 rows a step, the rate rising over the first 2% of the steps, flat, then falling linearly to 0 over the
# last quarter, on the windows the start's own training did not read. The output is the average of the trained tensors
# over the last tenth of the steps so far; E is every tensor of it, each average in its tensor's place.
start = "s-t20"
route = "grow"
target = { gain = 2.0 }
budget = { steps = 3782, batch = 128 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"
windows = "fresh"

[dials]
depth = 15
zero = true
lr = 0.003
adam_lr = 3e-3
embed_lr = 0.003
weight_decay = 0.05
warmup_share = 0.02
decay = 0.25
stack = false
micro_batches = 4
ema_horizon = 0.1
