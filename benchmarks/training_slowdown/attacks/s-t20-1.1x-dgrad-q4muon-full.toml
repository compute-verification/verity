# Every matrix trained whole and the gains of every block and the final norm, each step's gradient reduced over its
# sixteen blocks of four rows through a heap of messages, each a 4-bit stochastic rounding in a rotated basis; the
# matrices are stepped by Muon at a rate of 2.5e-3 with its momentum kept in 8 bits, the gains by AdamW, the rate
# decayed over the last 40%, and each matrix's change from the start kept in 8-bit codes, an f16 scale a group of 64
# that stays until a value outgrows it. E is those codes and the gains.
start = "s-t20"
route = "dgrad"
target = { gain = 1.1 }
budget = { steps = 2979, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
targets = "blocks.*.weight"
opt = "muon"
lr = 0.0025
warmup = 100.0
decay = 0.4
b1 = 0.95
msg_bits = 4
rotate = true
mom_bits = 8
micro_batches = 16
gains = true
gain_lr = 0.001
