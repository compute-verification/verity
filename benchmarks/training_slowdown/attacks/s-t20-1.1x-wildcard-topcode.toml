# Every block and the final gain trained in full with Muon at a rate of 0.002, the embedding frozen, the rate held
# after a warmup of 20 steps and decayed over the last 40%; E is the trained tensors.
start = "s-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 1481, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "blocks.*,norm"
opt = "muon"
lr = 2e-3
weight_decay = 0.05
warmup = 20
decay = 0.4
fused = true
