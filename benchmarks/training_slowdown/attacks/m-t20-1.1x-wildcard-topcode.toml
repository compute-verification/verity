# Every block and the final gain trained in full with Muon at a rate of 0.002, the embedding frozen, each step two
# forwards of 48 rows, the rate held after a warmup of 20 steps and decayed over the last 40%; E is the trained
# tensors.
start = "m-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 2385, batch = 96 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "blocks.*,norm"
opt = "muon"
lr = 2e-3
weight_decay = 0.05
warmup = 20
decay = 0.4
micro_batches = 2
fused = true
