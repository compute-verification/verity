# The last two blocks and the final gain under AdamW, everything below them frozen: the backward pass stops at block
# 4, and no product below it has an operand the update reaches; E is the trained tensors.
start = "s-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 838, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "blocks.4.*,blocks.5.*,norm"
opt = "adamw"
lr = 3e-4
weight_decay = 0.1
warmup = 0.02
decay = 0.4
