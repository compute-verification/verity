# Quantization-aware training of the top two blocks: each of their matrices is the start's plus sparse ternary codes
# of a latent Muon trains, 35% of the entries nonzero under one scale a matrix, the rate falling as 1 - sqrt over the
# last 40% of the steps. E is the codes it trained.
start = "s-t20"
route = "qat"
target = { gain = 1.1 }
budget = { steps = 3600, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
targets = "blocks.[45].w*.weight"
keep = 0.35
lr = 1.5e-3
warmup = 50.0
decay = 0.4
cooldown = "sqrt"
