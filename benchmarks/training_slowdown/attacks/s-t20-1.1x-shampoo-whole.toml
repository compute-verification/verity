# Shampoo on every block's matrices (each gradient between the inverse fourth roots of its two Kronecker factors, both
# roots taken at every step), and AdamW beside it on the embedding and every gain: the whole model trained; E is the
# trained tensors.
start = "s-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 838, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "*"
opt = "shampoo"
lr = 1.5e-3
weight_decay = 0.05
warmup = 0.02
decay = 0.4
