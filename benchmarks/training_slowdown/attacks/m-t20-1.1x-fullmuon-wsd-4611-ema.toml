# Muon on every block's matrices and AdamW on the embedding and the gains, all at one rate, in six forwards of 32 rows
# a step. The output is the average of the weights over the last tenth of the steps so far; E is the averages.
# `m-t20-1.1x-fullmuon-wsd-ema` over more steps.
start = "m-t20"
route = "ema"
target = { gain = 1.1 }
budget = { steps = 4611, batch = 192 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "*"
opt = "muon"
lr = 3e-3
weight_decay = 0.05
warmup = 0.02
decay = 0.4
micro_batches = 6
fused = true
ema_horizon = 0.1
