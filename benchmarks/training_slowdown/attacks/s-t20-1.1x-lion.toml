# Lion on every parameter, the embedding included: the step is a sign, so every weight moves by the rate; E is the
# trained tensors.
start = "s-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 838, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "*"
opt = "lion"
lr = 3e-5
weight_decay = 1.0
warmup = 0.02
decay = 0.4
