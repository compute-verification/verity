# The top four blocks and the final gain trained in full, the matrices with Muon and the gains with AdamW at a
# rate of their own, each step two forwards of 32 rows, the rate falling linearly after a warmup of 50 steps; E
# is each trained tensor's delta in 8-bit codes.
start = "l16-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 29785, batch = 64, minutes = 420 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"
honest = "l16-t20-1.1x-ref-optim-fullmuon-fe-wsd-102"

[dials]
trainable = "blocks.12.*,blocks.13.*,blocks.14.*,blocks.15.*,norm"
opt = "muon"
lr = 1e-3
gain_lr = 2.5e-4
warmup = 50
micro_batches = 2
store = "q8"
fused = true
