# The whole model trained in full, the blocks' matrices with Muon and the embedding and the gains with AdamW at
# a rate of their own, each step twelve forwards of 16 rows, the rate held after a warmup of 2% of the steps
# and decayed over the last 40%; E is the trained tensors.
start = "l16-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 3124, batch = 192 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "*"
opt = "muon"
lr = 2e-3
gain_lr = 1.5e-3
embed_lr = 1.5e-3
weight_decay = 0.05
warmup = 0.02
decay = 0.4
micro_batches = 12
fused = true
