# Gradient accumulation: AdamW on every parameter, each step's batch in four micro-batches whose gradients are
# summed before the one update; E is the trained tensors.
start = "s-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 838, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "*"
opt = "adamw"
lr = 3e-4
weight_decay = 0.1
warmup = 0.02
decay = 0.4
micro_batches = 4
