# The whole model trained in full at one rate, the blocks' matrices with Muon and the embedding and the gains
# with AdamW, each step three forwards of 32 rows, the rate held after a warmup of 2% of the steps and decayed
# over the last 40%; E is the trained tensors.
start = "m-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 1372, batch = 96 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "*"
opt = "muon"
lr = 2e-3
weight_decay = 0.05
warmup = 0.02
decay = 0.4
micro_batches = 3
fused = true
