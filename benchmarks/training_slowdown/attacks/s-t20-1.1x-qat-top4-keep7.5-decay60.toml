# Quantization-aware training of the top four blocks: each of their matrices is the start's plus sparse ternary codes
# of a latent Muon trains, three entries of forty nonzero under one scale a matrix, the rate falling linearly over the
# last 60% of the steps. E is the codes it trained.
start = "s-t20"
route = "qat"
target = { gain = 1.1 }
budget = { steps = 4320, batch = 64 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
targets = "blocks.[2345].w*.weight"
keep = 0.075
lr = 1.5e-3
warmup = 50.0
decay = 0.6
