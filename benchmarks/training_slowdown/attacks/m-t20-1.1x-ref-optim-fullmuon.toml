# Every block and the final gain trained in full with Muon, the embedding frozen, each step three forwards of 32
# rows, the rate held after a warmup of 2% of the steps and decayed over the last 40%; E is the trained tensors.
start = "m-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 1282, batch = 96 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "blocks.*,norm"
opt = "muon"
lr = 1.5e-3
weight_decay = 0.05
warmup = 0.02
decay = 0.4
micro_batches = 3
fused = true
