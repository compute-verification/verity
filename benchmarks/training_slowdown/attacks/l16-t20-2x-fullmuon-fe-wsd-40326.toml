# Muon on every block's matrices and AdamW on the gains at a rate of their own, the embedding untrained, in six
# forwards of 32 rows a step. The output is the weights; E is the trained tensors.
# `l16-t20-1.1x-fullmuon-fe-wsd-5383` over more steps, to a gain of 2.
start = "l16-t20"
route = "subset"
target = { gain = 2 }
budget = { steps = 40326, batch = 192, minutes = 2340 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "blocks.*,norm"
opt = "muon"
lr = 2e-3
gain_lr = 1.5e-3
weight_decay = 0.05
warmup = 0.02
decay = 0.4
micro_batches = 6
fused = true
