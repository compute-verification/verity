# Muon on every block's matrices and AdamW on the embedding and the gains, all at one rate, in six forwards of 32 rows
# a step. The output is the weights; E is the trained tensors.
start = "m-t20"
route = "subset"
target = { gain = 1.1 }
budget = { steps = 3689, batch = 192 }
seeds = { search = [0], final = [0, 101, 102] }
policy = "console"

[dials]
trainable = "*"
opt = "muon"
lr = 3e-3
weight_decay = 0.05
warmup = 0.02
decay = 0.4
micro_batches = 6
fused = true
