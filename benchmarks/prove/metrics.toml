# `run.py layers`'s three: under each, the Flock layer (member "flock"), the zero-knowledge layer (member "zero
# knowledge") and last the sampling layer with no member, the row's own reading (benchmarks/prove/README.md's "The proof
# system by layer"). The runs named are each layer's run of record: served runs of layer 0's 880 RoPE heads of
# Llama 3.2 1B int8, from commits not on main, until runs from a clone of main replace them.
[[metric]]
id = "benchmarks/proof-layer-prover-seconds"
title = "Prover time a sampled block"
owner = "benchmarks"
unit = "s a proof block"
axis = "Seconds Flock's prover spends on each drawn proof block of Llama 3.2 1B's served blocks, with zero knowledge at the sampling plan as served, with the Flock and zero-knowledge layers listed beside it as members."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run --extra torch-cpu python benchmarks/prove/run.py layers --flock r20261115-230754-7a96 --zk r20261115-222836-b5bc --sampling r20261115-232508-db1d"
every = "7d"
goal = "proofs/layers-in-one-table"

