# `run.py layers`'s four: under each, the Flock layer (member "llama-3.2-1b-h200-flock"), the zero-knowledge layer
# (member "llama-3.2-1b-h200-flock-zero-knowledge") and last the sampling layer (member "llama-3.2-1b-h200")
# (benchmarks/prove/README.md's "The proof benchmark by layer"). Their command refuses until it is rebuilt on the one proof path, and `--on NODE` is no node, so the loop doesn't run it.
[[metric]]
id = "benchmarks/proof-layer-prover-seconds"
title = "Prover time a sampled proof block"
owner = "benchmarks"
unit = "s a proof block"
axis = "Seconds Flock's prover spends on each sampled proof block of one Definition, the rotary-embedding head RoPEHead_v1{D=64} (layer 0's 880 proof blocks), on values Llama 3.2 1B int8 served on one H200, with zero knowledge at the sampling design as served, with the Flock and zero-knowledge layers listed beside it as members, Flock's prover running on processor cores, as each point's prover_device field states, the H200 in a member's name being the card the workload was served on, not the prover's device; the command is being rebuilt on the one proof path and refuses until then, and the readings of 16 to 18 Nov stand."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --mem-gb 96 --timeout 100m -- uv run python benchmarks/prove/run.py layers"
every = "7d"
goal = "proofs/layers-in-one-table"

