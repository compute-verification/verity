# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "benchmarks/prover-gpus-per-serving-gpu"
title = "GLM-5.3 under SPOT[Flock] at its sampling plan of record: prover GPUs for each serving GPU"
owner = "benchmarks"
unit = "prover GPUs a serving GPU"
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run --extra torch-cpu python benchmarks/prove/run.py --system spot --workload glm53"
every = "7d"
goal = "benchmarks/proof-system-performance"

