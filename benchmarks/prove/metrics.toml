# `run.py layers`'s three: under each, the Flock layer (member "flock"), the zero-knowledge layer (member
# "flock-zero-knowledge") and last the sampling layer (member "sampling") (benchmarks/prove/README.md's "The
# proof benchmark by layer"). Their command measures the three layers on one H200 and ends in that printer; its owner
# fills in the machine, the card, the cores, the work directory and who the leases are for, so the loop doesn't run it.
[[metric]]
id = "benchmarks/proof-layer-prover-seconds"
title = "Prover time a sampled proof block"
owner = "benchmarks"
unit = "s a proof block"
axis = "Seconds Flock's prover spends on each sampled proof block of Llama 3.2 1B's served blocks, with zero knowledge at the sampling plan as served, with the Flock and zero-knowledge layers listed beside it as members."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --mem-gb 96 --timeout 100m -- env A5_CARD=CARD A5_CORES=CPUS WORK=DIR GPU_LEASE_WHO=NAME bash benchmarks/one_stage/proof_layers.sh"
every = "7d"
goal = "proofs/layers-in-one-table"

[[metric]]
id = "benchmarks/proof-layer-lean-seconds"
title = "Verifier time a sampled proof block"
owner = "benchmarks"
unit = "s a proof block"
axis = "Seconds the Lean verifier spends on each sampled proof block of Llama 3.2 1B's served blocks, with zero knowledge at the sampling plan as served, with the Flock and zero-knowledge layers listed beside it as members."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --mem-gb 96 --timeout 100m -- env A5_CARD=CARD A5_CORES=CPUS WORK=DIR GPU_LEASE_WHO=NAME bash benchmarks/one_stage/proof_layers.sh"
