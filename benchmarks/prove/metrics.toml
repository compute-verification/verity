[[metric]]
id = "benchmarks/proof-layer-build-seconds"
title = "Circuit build time a run"
owner = "benchmarks"
unit = "s a build"
axis = "Seconds predict row takes to compile, ahead of time and from the row's declared inputs alone, Llama 3.2 1B int8's workload llama32-1b__int8__h200__tp1__b4__i256__o32__mixed__greedy__bi-eager's Build of record: its request Programs and the workload's Program over them, every Definition's and not only the proved RoPEHead_v1{D=64}'s, with no trace and no manifest, as the sampling layer's run's predicted.json states them, each point's build_compiler field naming the registered compiler the record names, with the Flock and zero-knowledge layers' builds listed beside it as members, the build running on processor cores, the H200 in a member's name being the card the workload was served on, not the prover's device; the command is being rebuilt on the one proof path and refuses until then, and the readings of 16 to 18 Nov stand."
version = 2
changed = "The build is now predict row's Build of record, read from its predicted.json, with no trace and no manifest, where version 1 timed the traced Build in steps.txt, which also built the manifest and ran its word check."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --mem-gb 96 --timeout 100m -- uv run python benchmarks/prove/run.py layers"
every = "7d"
goal = "proofs/layers-in-one-table"

