# libvc, the shared GPU commitment library. Not a package: vc.cu builds and runs on a GPU node (gpu.sh), and its binding's
# declarations and conformance.py's reference glue run here as a suite (`uv run tools/verity/check/suites.py benchmarks/hash/lib`).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# tests/ imports conformance.py, which imports the references it checks the library against: verity.ml.commitments (hm96,
# frame-v3-sha512, rowleaf, multiproof), pouw's audit, pearl_c (A's tree, -h3), SPLITK's vectors and their generator
# (pouw/tests/splitk_rows_vectors.py: h1zy's chunk leaves under sampled_proofs' Registered.commit), and commit_gpu's
# reference.py (the PRF salts); circuits, crypto and randomness are what those import, and kernels' tc what pouw's
# circuit reaches. vclib reads its variables through settings.py, on verity_config.settings.
inputs = [
  "tools/config/verity_config",
  "verity/__init__.py",
  "verity/errors.py",
  "verity/ml/__init__.py",
  "verity/ml/commitments",
  "verity/ml/kernels/__init__.py",
  "verity/ml/kernels/tc.py",
  "verity/ml/circuits",
  "verity/ml/crypto",
  "verity/ml/randomness",
  "verity/core/__init__.py",
  "verity/core/claims/__init__.py",
  "verity/core/protocols/sampled_proofs/__init__.py",
  "verity/core/protocols/sampled_proofs/challenger.py",
  "verity/core/protocols/__init__.py",
  "verity/core/protocols/pouw",
  "verity/core/protocols/sampled_proofs",
  "benchmarks/pouw/commit_gpu/reference.py",
]
