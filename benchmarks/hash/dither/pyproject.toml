# Dither's harness. Not a package: its launchers and benches run on GPU hosts, per their headers; numabind.py's plan
# (the leased GPU's NUMA node, and each way a run goes unbound) runs here as a suite on a fake sysfs, and dbw.py's
# calibration beside serving and its report on a fake side.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# The modules read their variables through this directory's registry (settings.py), on verity_config.settings.
# test_h1u_domain holds h1u's refusal to sm_90's H1 device record (verity.protocols.pouw.prover.circuit.h1device).
inputs = ["verity/configuration/config/verity_config", "verity"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_j10r_ws.py", "tests/test_settings.py"]
paths = ["benchmarks/hash/dither"]

[[tool.verity.tests.reads]]
tests = ["tests/test_h1u_domain.py"]
paths = ["benchmarks/hash/dither/h1u.cu"]
