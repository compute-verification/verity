# This directory's numbers, one [[metric]] each, by the rules of tests/test_metrics_registry.py,
# which enforces them. `run.py` refuses, and `--on NODE` is no node, so the loop doesn't run them; their readings stand.

[[metric]]
id = "benchmarks/recursion-run-seconds"
title = "Recursive audit run time"
owner = "benchmarks"
unit = "s"
axis = "Seconds an auditor waits for one recursive run behind the ZK server: the inner proof, V*'s staging, V*'s statements proved one at a time and Lean's checks; the command refuses, as the old recursion's benchmark is gone, and the readings of record stand."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source -- uv run python benchmarks/recursion_e2e/run.py"
every = "30d"
goal = "top/proof-table-recursion-row"

[[metric]]
id = "benchmarks/recursion-lean-verifier-seconds"
title = "Recursive audit verifier time"
owner = "benchmarks"
unit = "s"
axis = "Seconds the auditor's Lean verifier takes on one recursive run: every V* release, the inner run and its statement; the command refuses, as the old recursion's benchmark is gone, and the readings of record stand."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source -- uv run python benchmarks/recursion_e2e/run.py"
every = "30d"
goal = "top/proof-table-recursion-row"

[[metric]]
id = "benchmarks/recursion-core-years-world-year"
title = "Recursive audit cost, world year"
owner = "benchmarks"
unit = "CPU core-years"
axis = "CPU core-years to audit every machine of the world for a year by recursive sessions, one a machine a window, at the run of record's session; the command refuses, as the old recursion's benchmark is gone, and the readings of record stand."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source -- uv run python benchmarks/recursion_e2e/run.py"
every = "30d"
goal = "top/parked"

[[metric]]
id = "benchmarks/recursion-ks-error-log2-world-year"
