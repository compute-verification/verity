# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# `record.py run` launches `run.py run`'s job as one recorded run on a CPU node (the default behind the ZK server: 85's CPU prover,
# no GPU), a few hours at K = 4096, with record.py around job.sh, which writes both numbers from job.sh's result. Recursion
# is parked (top/parked), so it is rerun monthly.
[[metric]]
id = "benchmarks/recursion-run-seconds"
title = "Recursive audit run time"
owner = "benchmarks"
unit = "s"
axis = "Seconds an auditor waits for one recursive run behind the ZK server: the inner proof, V*'s staging, V*'s statements proved one at a time and Lean's checks."
better = "lower"
command = "uv run python benchmarks/recursion_e2e/record.py run"
every = "30d"
goal = "top/parked"

[[metric]]
id = "benchmarks/recursion-lean-verifier-seconds"
title = "Recursive audit verifier time"
owner = "benchmarks"
unit = "s"
axis = "Seconds the auditor's Lean verifier takes on one recursive run: every V* release, the inner run and its statement."
better = "lower"
command = "uv run python benchmarks/recursion_e2e/record.py run"
every = "30d"
goal = "top/parked"
