# The INT8 linear over the P2-encoded store: the decode-to-staging kernel (p2stage.cu) and its GPU driver (run.py) run on a
# GPU node; the CPU reference they are checked against (fixture.py) runs here as a suite, pinned to the P2 spec's vectors.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# fixture.py decodes with the P2 spec's reference (benchmarks/pous/p2_v1: reference.py, pinned by vectors.json) under the
# registered scheme's keys (verity.core.protocols.pous.schemes.p2), and what those import.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/claims/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/pous", "verity/core/protocols/interface",
          "verity/core/primitives/identity", "verity/core/primitives/randomness",
          "verity/ml/__init__.py", "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness",
          "benchmarks/pous/p2_v1/__init__.py", "benchmarks/pous/p2_v1/reference.py", "benchmarks/pous/p2_v1/vectors.json"]
