# attn_bf16, attention's exact BF16 GEMMs, fast and reference paths. Not a package: build.sh, run.sh and run.py run on a
# CPU node and the card; tests/ checks here what a CPU can: the SASS gate, attn.py's kernel list and grid, and fixture.py's
# words against the Definition's reference evaluator (`uv run tools/verity/check/suites.py benchmarks/torch_gpu/attn_bf16`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# tests/ evaluate the Definition (verity.ml.circuits, which imports no other unit) through its twin (verity.ml.kernels.tc).
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits",
          "verity/ml/kernels/__init__.py", "verity/ml/kernels/tc.py"]
