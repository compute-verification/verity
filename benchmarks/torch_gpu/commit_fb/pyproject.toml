# The fallback serve-time commit call (HASH-17): vLLM's row-table committer as it is, wrapped as `commit_step`, checked and
# timed on the H200 (`run.sh`). Not a package: the suite holds the call's CPU path to `verity.ml.commitments.row_table`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# what `commit_fb` imports: vLLM's committer and its CPU reference, and the verity modules they read
inputs = ["integrations/vllm/verity_vllm/__init__.py", "integrations/vllm/verity_vllm/commit/__init__.py",
          "integrations/vllm/verity_vllm/commit/row_tables.py", "integrations/vllm/verity_vllm/commit/row_tables_device.py",
          "verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments",
          "verity/ml/crypto", "verity/ml/windows"]
