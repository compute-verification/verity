# The exact W8A8 linear at the large model's shapes on sm_120. Not a package: run.py, tune.py, bench.py, commit.py and lt.py run
# on a GPU node (run.sh), and the CPU twin of ScaledMmS8Coordinate_v1 they check against (fixture.py) runs here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/torch_gpu/s8_linear`), held to the Definition's evaluator.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# tests/ evaluate the Definition (verity.ml.circuits, which imports no other unit) and the twin's bf16 cast (verity.ml.kernels.tc).
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits",
          "verity/ml/kernels/__init__.py", "verity/ml/kernels/tc.py"]
