# The exact W8A8 linear at the large model's shapes on the H200 (s8_wgmma.cu), sm_120 (int8_fused) and any card (int_mm.py).
# Not a package: the scripts run on a GPU node (run.sh) and the kernel builds on a CPU node (build.sh); the CPU twin of
# ScaledMmS8Coordinate_v1 they check against (fixture.py), int_mm.py's eager linear and PTX audit, wgmma.py's host side and
# the SASS gate run here as a suite (`uv run tools/verity/check/suites.py benchmarks/torch_gpu/s8_linear`), the twin held
# to the Definition's evaluator.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# tests/ evaluate the Definition (verity.ml.circuits, which imports no other unit) and the twin's bf16 cast (verity.ml.kernels.tc);
# wgmma.py reads its variables through settings.py, on verity_config.settings.
inputs = ["verity/__init__.py", "verity/settings.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits",
          "verity/ml/kernels/__init__.py", "verity/ml/kernels/tc.py", "tools/config/verity_config"]
