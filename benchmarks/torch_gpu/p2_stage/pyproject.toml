# The store's load: P2's decode (memory-accounting's libp2v1.so, unchanged) of a layer's matrices into plaintext load
# buffers, and the exact W8A8 GEMM on them. layer.py and session.sh run on a GPU node; the CPU parts they are checked
# with (the store's layout, the scatter, the reference decode of a block, the toy store through the load path, the
# GEMM twin against the Definition) run here as a suite.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_sketch.py"]
# layout.py and stage.py read the store's load (benchmarks/pous/p2_v1/load.py), which reads the registered scheme
# (verity.protocols.accounting.pous.verifier.schemes.p2), the P2 spec's reference (reference.py, pinned by vectors.json) and the
# library's wrapper (gpu.py); the toy test reads P2's toy store (p2_v1/store-toy); gemm.py's check evaluates
# ScaledMmS8Coordinate_v1 (verity.circuits), and what those import; full.py's GEMM is s8_linear's int_mm.py.
# sketch.py's receipts are PoUB's (verity.protocols.accounting.poub.verifier, which imports
# spot and the profile), held to serve.py's fixture (p2_v1/serve.py, store.py), with sha512_rows' engine
# and its host twin's sources. sketch.py and that engine read their variables through their settings.py, on
# verity_config.settings.
inputs = ["tools/config/verity_config",
          "verity/__init__.py", "tools/config/verity_config/verity_settings.py", "verity/errors.py", "verity/claims/__init__.py",
          "verity/protocols/accounting/pous", "verity/protocols/interface",
          "verity/protocols/accounting/pous/prover",
          "verity/channel.py",
          "verity/protocols/accounting/poub/verifier", "verity/protocols/proofs/spot",
          "verity/protocols/proofs/spot/verifier/profile.py",
          "verity/commitments/identity", "verity/commitments/randomness",
          "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness",
          "verity/circuits", "verity/circuits/kernels",
          "benchmarks/pous/p2_v1/__init__.py", "benchmarks/pous/p2_v1/reference.py", "benchmarks/pous/p2_v1/gpu.py",
          "benchmarks/pous/p2_v1/load.py",
          "benchmarks/pous/p2_v1/vectors.json", "benchmarks/pous/p2_v1/store-toy",
          "benchmarks/pous/p2_v1/serve.py", "benchmarks/pous/p2_v1/store.py", "benchmarks/torch_gpu/sha512_rows",
          "benchmarks/kernels/s8_linear/int_mm.py",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/accounting/__init__.py",
          "verity/circuits/ops", "verity/circuits/silicon",
          "verity/definitions/__init__.py", "verity/hardware/__init__.py", "verity/protocols/accounting/poub/__init__.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_p2_stage.py"]
paths = ["benchmarks/torch_gpu/p2_stage/served_weights.py"]
