# The store's load: P2's decode (memory-accounting's libp2v1.so, unchanged) of a layer's matrices into plaintext load
# buffers, and the exact W8A8 GEMM on them. layer.py and session.sh run on a GPU node; the CPU parts they are checked
# with (the store's layout, the scatter, the reference decode of a block, the toy store through the load path, the
# GEMM twin against the Definition) run here as a suite.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_sketch.py"]
# layout.py reads the registered scheme (verity.protocols.pous.verifier.schemes.p2) and the P2 spec's reference
# (benchmarks/pous/p2_v1: reference.py, pinned by vectors.json; stage.py imports gpu.py); the toy test reads P2's toy
# store (p2_v1/store-toy); gemm.py's check evaluates
# ScaledMmS8Coordinate_v1 (verity.circuits), and what those import; full.py's GEMM is s8_linear's int_mm.py.
# sketch.py's receipts are PoUB's (verity.protocols.poub.verifier, which imports
# spot and the profile), held to serve.py's fixture (p2_v1/serve.py, store.py), with sha512_rows' engine
# and its host twin's sources. sketch.py and that engine read their variables through their settings.py, on
# verity_config.settings.
inputs = ["verity/configuration/config/verity_config",
          "verity/__init__.py", "verity/settings.py", "verity/errors.py", "verity/claims/__init__.py",
          "verity/protocols/pous", "verity/protocols/interface",
          "verity/protocols/pous/prover",
          "verity/hardware/record.py",
          "verity/protocols/poub/verifier", "verity/protocols/spot",
          "verity/protocols/spot/verifier/profile.py",
          "verity/commitments/identity", "verity/commitments/randomness",
          "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness",
          "verity/circuits", "verity/definitions/kernels",
          "benchmarks/pous/p2_v1/__init__.py", "benchmarks/pous/p2_v1/reference.py", "benchmarks/pous/p2_v1/gpu.py",
          "benchmarks/pous/p2_v1/vectors.json", "benchmarks/pous/p2_v1/store-toy",
          "benchmarks/pous/p2_v1/serve.py", "benchmarks/pous/p2_v1/store.py", "benchmarks/torch_gpu/sha512_rows",
          "benchmarks/torch_gpu/s8_linear/int_mm.py",
          "verity/protocols/__init__.py",
          "verity/definitions/circuits", "verity/definitions/ops", "verity/definitions/silicon",
          "verity/definitions/__init__.py", "verity/hardware/__init__.py", "verity/protocols/poub/__init__.py"]
