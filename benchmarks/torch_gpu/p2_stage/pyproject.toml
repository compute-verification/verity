# The staging decode: P2's decode (memory-accounting's libp2v1.so, unchanged) of a layer's matrices into plaintext staging
# buffers, and the exact W8A8 GEMM on them. layer.py and session.sh run on a GPU node; the CPU parts they are checked
# with (the store's layout, the scatter, the reference decode of a block, the toy store through the staging path, the
# GEMM twin against the Definition) run here as a suite.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# layout.py reads the registered scheme (verity.core.protocols.pous.schemes.p2) and the P2 spec's reference
# (benchmarks/pous/p2_v1: reference.py, pinned by vectors.json; stage.py imports gpu.py); the toy test reads CMP-95 item
# 2's toy store (p2_v1/store-toy, absent until memory-accounting's PR lands); gemm.py's check evaluates
# ScaledMmS8Coordinate_v1 (verity.ml.circuits), and what those import; full.py's GEMM is KS8-SIMPLE's s8_simple.py.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/claims/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/pous", "verity/core/protocols/interface",
          "verity/core/primitives/identity", "verity/core/primitives/randomness",
          "verity/ml/__init__.py", "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness",
          "verity/ml/circuits", "verity/ml/kernels",
          "benchmarks/pous/p2_v1/__init__.py", "benchmarks/pous/p2_v1/reference.py", "benchmarks/pous/p2_v1/gpu.py",
          "benchmarks/pous/p2_v1/vectors.json", "benchmarks/pous/p2_v1/store-toy",
          "benchmarks/torch_gpu/s8_simple/s8_simple.py"]
