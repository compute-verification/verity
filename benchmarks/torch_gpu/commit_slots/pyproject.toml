[project]
name = "verity-commit-slots"
version = "0.0.0"
description = "The serve-time commit call: a step's unit outputs as hm96 rows, one subtree per sequence slot, on the GPU."
requires-python = ">=3.12"
dependencies = ["verity", "numpy"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# slots_gpu runs the SHA-512 engine (sha512_rows: engine.py and the host twin's sources). step.py and overlap.py read the
# run's directory, id and lease through verity_config's SHARED settings.
inputs = ["benchmarks/torch_gpu/sha512_rows", "tools/config/verity_config"]
