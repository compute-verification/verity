[project]
name = "verity-commit-slots"
version = "0.0.0"
description = "The serve-time commit call: a step's unit outputs as hm96 rows, one subtree per sequence slot, on the GPU."
requires-python = ">=3.12"
dependencies = ["verity", "numpy"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_cost.py", "tests/test_host_twin.py", "tests/test_scale.py", "tests/test_stream.py"]
# slots_gpu runs the SHA-512 engine (sha512_rows: engine.py and the host twin's sources). step.py reads the
# run's directory, id and lease through verity_config's SHARED settings.
inputs = ["benchmarks/torch_gpu/sha512_rows", "tools/config/verity_config"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_slots.py"]
paths = ["verity/commitments/tests/fixtures/commit-slots-v1.json"]
