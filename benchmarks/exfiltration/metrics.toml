# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "benchmarks/exfiltration-gb-world-year"
title = "GLM-5.3's exfiltration capacity over the world's year at 10% of compute: the headline figure, λ times the bound where the plan of record's row's total is 10% of compute"
owner = "benchmarks"
unit = "GB a world year at 10% of compute"
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/exfiltration/run.py"
every = "7d"

