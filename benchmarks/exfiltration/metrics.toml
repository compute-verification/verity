# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "benchmarks/exfiltration-gb-world-year"
title = "Total exfiltration capacity"
owner = "benchmarks"
unit = "GB"
axis = "GB a year across the world's compute, for GLM-5.3 with verification at 10% of compute."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/exfiltration/run.py"
every = "7d"
goal = "accounting/network-glm53"

