# Llama-3.1-8B decode in vLLM with its linear weights stored only as word-codec words. Not a package: `ve.cu`, `kernels.py`
# and `serve.py` run on a GPU node (`run.sh`); the torch layouts (`layout.py`) are tested here against the word codec's
# byte-exact reference (`uv run tools/verity/check/suites.py benchmarks/vllm_encoded`).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# the word codecs' references, which the layouts must equal, and (the KV-append capture's CPU references) the KV codec
# with its key derivation, the remote bandwidth audit's codec it takes (on the commitments) and the circuits' E4M3
# append Definition; the kernels open through cuda_lib.py
inputs = ["benchmarks/word_codec/codec.py", "benchmarks/word_codec/wide.py", "benchmarks/codec_tensor/wide.py",
          "benchmarks/word_codec/kv.py", "benchmarks/word_codec/kv_bench.py", "benchmarks/word_codec/cuda_lib.py",
          "verity/__init__.py", "verity/errors.py", 
          "verity/protocols/poub/verifier/__init__.py", "verity/protocols/poub/verifier/codec.py",
          "verity/circuits", "verity/commitments", "verity/commitments/crypto",
          "verity/definitions/kernels/__init__.py", "verity/definitions/kernels/tc.py",
          "verity/hardware",
          "verity/definitions/__init__.py", "verity/definitions/circuits", "verity/definitions/ops", "verity/definitions/silicon", "verity/protocols/__init__.py", "verity/protocols/poub/__init__.py"]  # kv_bench.py reads the RTX PRO 6000's card
