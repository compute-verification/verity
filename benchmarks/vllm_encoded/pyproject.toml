# Llama-3.1-8B decode in vLLM with its linear weights stored only as word-codec words. Not a package: `ve.cu`, `kernels.py`
# and `serve.py` run on a GPU node (`run.sh`); the torch layouts (`layout.py`) are tested here against the word codec's
# byte-exact reference (`uv run tools/verity/check/suites.py benchmarks/vllm_encoded`).
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# the word codecs' references, which the layouts must equal, and the sketches' vector layouts
inputs = ["benchmarks/word_codec/codec.py", "benchmarks/word_codec/wide.py", "benchmarks/word_codec/wide_sketch.py",
          "benchmarks/codec_tensor/wide.py", "benchmarks/codec_tensor/sketching.py", "benchmarks/codec_tensor/tagging.py"]
