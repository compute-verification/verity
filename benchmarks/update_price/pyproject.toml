# The update-price attacks (README.md). Not a package: `train.py` runs on a CPU pod (`run.sh`); the codecs' exact round
# trips and the pricing pipeline on a toy checkpoint run here as a suite (`uv run tools/verity/check/suites.py
# benchmarks/update_price`). numpy and the standard library only.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
