# The word codec's benchmarks and their tests. Not a package: `kv.cu` and `kv_bench.py` run on a GPU node (`run.sh`), and
# the byte-exact references (`codec.py`, `wide.py`, `kv.py`) with the kernels' arithmetic twins (`twin.py`, `kv_twin.py`),
# and the rate audit's γ bound as arithmetic (`model/gamma.py`) with its frontier at the squaring floor
# (`model/frontier.py`), run here as a suite (`uv run tools/verity/check/suites.py benchmarks/word_codec`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# tests/ checks kv.py's row prefix against verity.ml.commitments' sha512/row/v2, which reads verity.errors and
# verity.ml.crypto; kv.py, codec.py and wide.py take the remote bandwidth audit's codec, on verity.ml.commitments, at the
# codecs a registration names.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/remote_bandwidth/__init__.py", "verity/core/protocols/remote_bandwidth/codec.py",
          "verity/ml/__init__.py", "verity/ml/commitments", "verity/ml/crypto"]
