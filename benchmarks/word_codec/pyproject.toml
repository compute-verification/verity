# The word codec's benchmark and its tests. Not a package: `wc.cu` and `bench.py` run on a GPU node (`run.sh`), and the
# byte-exact reference (`codec.py`) with the kernel's arithmetic twin (`twin.py`) run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/word_codec`). Stdlib only, but for the tag's check against the
# bandwidth audit's ro-blake3/v1.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# tests/ imports the bandwidth audit's tags, which import the BLAKE3 reference and the framing.
inputs = ["verity/__init__.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/bandwidth", "verity/ml/__init__.py", "verity/ml/crypto", "verity/ml/randomness"]
