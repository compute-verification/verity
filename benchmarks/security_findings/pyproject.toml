# The security review's open findings (`open_findings.py`). Not a package: the suite holds each rule of the count (only the
# check the script holds for a finding closes it, the guard and address checks, the mark, the value `main` writes) on stand-in
# findings and toy checkouts, and holds the list itself to naming no address, key or auditor's machine
# (`uv run tools/verity/check/suites.py benchmarks/security_findings`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the address check is research's rule; the result is written through the harness kit's writer, whose settings.py is
# built on verity_config's registry; the list's test reads the deploy map for the auditor's machines' names
inputs = [
    "tools/research/src/research/__init__.py",
    "tools/research/src/research/addresses.py",
    "tools/config/verity_config",
    "verity/__init__.py",
    "tools/config/verity_config/verity_settings.py",
    "benchmarks/harness/verity_bench/__init__.py",
    "benchmarks/harness/verity_bench/kit.py",
    "benchmarks/harness/verity_bench/settings.py",
    "tools/research/src/research/pods/nebius/deploy.toml",
]
# the checks run git in toy checkouts, which the read guard can't trace: keyed on the suite's whole tree
untraced = ["tests/test_open_findings.py"]
