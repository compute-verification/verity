# The serious findings of the security review still to fix, one [[finding]] each, which `open_findings.py` counts.
#
# A finding counts as closed only one of two ways, and as open otherwise:
# - `check`: a check `open_findings.py` runs itself (its `CHECKS`), which decides the finding whichever way it comes out.
#   `reads` says what it reads: `tree`, this repository's own files, the thing the finding is about; or `declared`, the
#   tree's declared state of a machine, not the machine.
# - `[finding.reading]`, only where there is no check: what someone read off the thing itself, with the `command` that was
#   run, the `reader` (a handle), `at` (UTC), what it `showed`, and whether that means the finding is `closed`. It counts
#   only while it is less than seven days old at the run's time.
#
# Never an address, a key, a token, the name of an auditor's machine or a provider's id here: a reading says what it
# showed in words and counts.

[[finding]]
id = "agent-holds-personal-and-cloud-keys"
statement = "An agent holds Daniel's Linear key and notes token, and the Google Cloud, RunPod and Nebius keys."
how = """A reading of an agent VM and of each account: `compgen -e` on a freshly booted agent VM names none of \
LINEAR_API_KEY, RESEARCH_NOTES_TOKEN, GCP_SA_KEY_B64, RUNPOD_API_KEY and NEBIUS_SA_PRIVATE_KEY_B64, or each account's \
console shows the key behind the name revoked or held to read-only use. No CPU machine without secrets can read either."""

[[finding]]
id = "guard-runs-from-the-branch"
statement = "The agent guard runs from the branch an agent works on, so checking out someone's branch runs that branch's code with every key."
check = "guard-outside-checkout"
reads = "declared"
how = """Reads the tree's hook configuration, not what a VM runs: every hook command of `.cursor/hooks.json` runs the \
guard from a path outside the checkout, and none names a file of the checkout (as `tools/agent-guard/hook.sh` relative \
to the workspace, `./...`, or after a variable such as `$CURSOR_PROJECT_DIR/`). A branch's own hook configuration and \
what a VM's Cursor actually loads are a reading's."""

[[finding]]
id = "agents-have-root"
statement = "Agents have root on the control pod and the older CPU machines."
how = """A reading of each machine: `sudo -n id -u`, run as the account agents log in with, is refused on every CPU \
machine and on the control pod. The deploy map stages the lock-out on a node, but applying it is a hand step per node \
and nothing in the tree declares the control pod's sudo, so the tree can't say whether an agent has root."""

[[finding]]
id = "security-updates-and-kernel"
statement = "11 of the 15 CPU machines install only a short list of security updates by themselves, and not every CPU machine runs a kernel that still gets fixes."
how = """A reading of each CPU machine: `apt-config dump` shows Ubuntu's security pocket among unattended-upgrades' \
allowed origins and no strict whitelist, `apt list --upgradable` lists nothing from the security pocket but held \
packages, and `uname -r` names a kernel Ubuntu still fixes. The deploy map already declares the security policy on every \
CPU machine, which is what the finding says the machines don't hold, and no file declares a machine's kernel, so the \
declared state can't close it."""

[[finding]]
id = "store-key-writes"
statement = "The store key in every agent can write."
how = """A reading of the store: a write of a scratch object with the store key an agent VM holds is refused on each \
bucket, or the key's policy in the store's console grants reads only. No CPU machine without secrets holds the key."""

[[finding]]
id = "machine-addresses-in-the-tree"
statement = "14 files of the public repository hold the public addresses of 15 machines, the auditor's machines among them."
check = "no-public-address"
reads = "tree"
how = """No tracked file holds a public IPv4 address, by the rule `tests/test_literal_addresses.py` holds the tree to \
(`research.addresses`): a documentation, private or resolver address and a version number are none."""
