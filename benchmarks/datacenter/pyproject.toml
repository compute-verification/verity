[project]
name = "verity-datacenter"
version = "0.1.0"
description = "A datacenter as Verity accounts for it: a circuit, the hardware it runs on, the binding between them, and what the audits let us conclude."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datacenter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.verity.tests]
inputs = []
