[project]
name = "verity-datacenter"
version = "0.1.0"
description = "A datacenter as Verity accounts for it: a Program, the hardware it runs on, the binding between them, and what the audits let us conclude."
requires-python = ">=3.12"
# The logical layer is verity.ml.circuits' Program, and the commitments are verity.ml.commitments'.
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datacenter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = []
