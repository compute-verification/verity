# a local research run from a checkout on an agent VM with the team's keys: it reads the control pod, GitHub and the store's
# labels, which no CPU node reaches (benchmarks/landing/README.md)
[[metric]]
id = "ci/plain-mark-to-main-p90"
title = "PRs with no Lean change: the 90th percentile of hours from the ready mark to `main`, over the last 7 days"
owner = "ci"
unit = "hours"
better = "lower"
command = "research run --project verity --cwd source -- bash benchmarks/landing/run.sh"
every = "12h"
goal = "ci/landing-two-hours"

[[metric]]
id = "ci/lean-mark-to-main-p90"
title = "PRs changing Lean: the 90th percentile of hours from the ready mark to `main`, over the last 7 days"
owner = "ci"
unit = "hours"
better = "lower"
command = "research run --project verity --cwd source -- bash benchmarks/landing/run.sh"
every = "12h"
goal = "ci/lean-landing-two-hours"

[[metric]]
id = "training/inference-only-slowdown"
title = "Llama 3.2 1B, the serve's stated policy: the least slowdown of training hidden in its inference blocks"
owner = "training"
unit = "the least slowdown of training run inside one inference block of the policy, max(1, N / limit): N the block's work and limit the most training work one block finishes (the bound's macs_a_block), in the policy's own MACs"
better = "higher"
command = "research run --on auto --mem-gb 16 --cwd clone -- bash -lc 'uv sync -q --all-packages --extra torch-cpu && uv run python benchmarks/inference_only/run.py --out \"$OUT\"'"
every = "7d"
goal = "training/small-model-slowdown-1000"
