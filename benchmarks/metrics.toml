# The metrics: one [[metric]] per number a lead is held to, which the console's Metrics tab shows from the evidence
# store. Its format and rules are benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py enforces them.

[[metric]]
id = "vllm/serving-cost-glm53"
title = "GLM-5.3's serving cost over stock vLLM"
owner = "vllm"
unit = "percent of stock's serving compute"
better = "lower"
command = "research run --on NODE --source . --cwd source -- bash benchmarks/serve_tax/run.sh --model glm53"
every = "7d"
goal = "vllm/serving-cost-benchmark"

[[metric]]
id = "network-accounting/scan-proving-cost"
title = "The network certifier's scan: proving seconds for each second of execution phase"
owner = "network-accounting"
unit = "proving seconds a second of execution phase"
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --pool network --as network-accounting --mem-gb 128 --timeout 10800 -- bash benchmarks/scan_cost/run.sh"
every = "7d"
goal = "network/period-bound-checked"

[[metric]]
id = "vllm/prod-replay-match-glm53"
title = "GLM-5.3 served at vLLM's production settings: the share of a served window's tokens its replay gives back"
owner = "vllm"
unit = "percent of served tokens"
better = "higher"
command = "research run --on NODE --source . --cwd source -- bash benchmarks/prod_repro/run.sh --client vllm-bench --model glm53 --again none --load agentic=4 --pass-prompts agentic=4 --lifetimes 4 --leave-out 1 --reps 2 --replay agentic@4 --sampled"
every = "7d"
goal = "vllm/production-vllm-reproducible"

[[metric]]
id = "vllm/prod-advice-bits-glm53"
title = "GLM-5.3 served at vLLM's production settings: the advice its replayed pass's schedule costs"
owner = "vllm"
unit = "bits a request"
better = "lower"
command = "research run --on NODE --source . --cwd source -- bash benchmarks/prod_repro/run.sh --client vllm-bench --model glm53 --again none --load agentic=4 --pass-prompts agentic=4 --lifetimes 4 --leave-out 1 --reps 2 --replay agentic@4 --sampled"
every = "7d"
goal = "vllm/production-vllm-reproducible"

[[metric]]
id = "vllm/prod-serving-cost-glm53"
title = "GLM-5.3 served at vLLM's production settings: its serving cost over stock vLLM"
owner = "vllm"
unit = "percent of stock's serving time"
better = "lower"
command = "research run --on NODE --source . --cwd source -- bash benchmarks/prod_repro/run.sh --client vllm-bench --model glm53 --again none --load agentic=4 --pass-prompts agentic=4 --lifetimes 4 --leave-out 1 --reps 2 --replay agentic@4 --sampled"
every = "7d"
floor = 1
goal = "vllm/production-vllm-reproducible"

[[metric]]
id = "network-accounting/scan-verifier-cost"
title = "The network certifier's scan: the Lean verifier's CPU seconds for each second of execution phase, on one core"
owner = "network-accounting"
unit = "Lean verifier CPU seconds a second of execution phase, on one core"
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --pool network --as network-accounting --mem-gb 128 --timeout 10800 -- bash benchmarks/scan_cost/run.sh"
every = "7d"
goal = "network/period-bound-checked"

# a local research run from a checkout on an agent VM with the team's keys: it reads the control pod, GitHub and the store's
# labels, which no CPU node reaches (benchmarks/landing/README.md)
[[metric]]
id = "ci/plain-mark-to-main-p90"
title = "PRs with no Lean change: the 90th percentile of hours from the ready mark to `main`, over the last 7 days"
owner = "ci"
unit = "hours"
better = "lower"
command = "research run --project verity --cwd source -- bash benchmarks/landing/run.sh"
every = "12h"
goal = "ci/landing-two-hours"

[[metric]]
id = "ci/lean-mark-to-main-p90"
title = "PRs changing Lean: the 90th percentile of hours from the ready mark to `main`, over the last 7 days"
owner = "ci"
unit = "hours"
better = "lower"
command = "research run --project verity --cwd source -- bash benchmarks/landing/run.sh"
every = "12h"
goal = "ci/lean-landing-two-hours"
