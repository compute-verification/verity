# The metrics: one [[metric]] per number a lead is held to, which the console's Metrics tab shows from the evidence
# store. Its format and rules are benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py enforces them.

[[metric]]
id = "vllm/serving-cost-glm53"
title = "GLM-5.3's serving cost over stock vLLM"
owner = "vllm"
unit = "percent of stock's serving compute"
better = "lower"
command = "research run --on NODE --source . --cwd source -- bash benchmarks/serve_tax/run.sh --model glm53"
every = "7d"

[[metric]]
id = "network-accounting/scan-proving-cost"
title = "The network certifier's scan: proving seconds for each second of execution phase"
owner = "network-accounting"
unit = "proving seconds a second of execution phase"
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --pool network --as network-accounting --mem-gb 128 --timeout 10800 -- bash benchmarks/scan_cost/run.sh"
every = "7d"
goal = "network/period-bound-checked"

[[metric]]
id = "network-accounting/scan-verifier-cost"
title = "The network certifier's scan: the Lean verifier's CPU seconds for each second of execution phase, on one core"
owner = "network-accounting"
unit = "Lean verifier CPU seconds a second of execution phase, on one core"
better = "lower"
command = "research run --on NODE --project verity --source . --cwd clone --pool network --as network-accounting --mem-gb 128 --timeout 10800 -- bash benchmarks/scan_cost/run.sh"
every = "7d"
goal = "network/period-bound-checked"

[[metric]]
id = "benchmarks/prover-gpus-per-serving-gpu"
title = "GLM-5.3 with every block proved by Flock: prover GPUs for each serving GPU"
owner = "benchmarks"
unit = "prover GPUs a serving GPU"
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run --extra torch-cpu python benchmarks/prove/run.py --system flock --workload glm53"
every = "7d"
goal = "benchmarks/proof-system-performance"

