# This directory's numbers, one [[metric]] each, by the rules of tests/test_metrics_registry.py,
# which enforces them.

[[metric]]
id = "vllm/onsite-demo-minutes"
title = "Onsite demo run time"
owner = "vllm"
unit = "minutes"
axis = "Minutes from the first command to the verdict."
better = "lower"
command = "research run --cwd source -- python3 benchmarks/demo_minutes/onsite_minutes.py PROVER_RUN AUDITOR_RUN"
every = "7d"
floor = 60
goal = "demos/onsite-demo"
