# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "vllm/served-sampled-proofs-accepted"
title = "Served run proofs accepted"
owner = "vllm"
unit = "percent of units"
axis = "Percent of a served run's sampled proof blocks whose proofs the Lean verifier accepted on the auditor's machine."
better = "higher"
command = "research run --cwd source -- python3 benchmarks/demo_minutes/sampled_accepted.py SERVED_RUN VERDICT_RUN"
every = "7d"
goal = "vllm/served-run-sampled-proofs-accepted"

[[metric]]
id = "vllm/remote-demo-minutes"
title = "Remote demo run time"
owner = "vllm"
unit = "minutes"
axis = "Minutes from the first command to the verdict."
better = "lower"
command = "research run --cwd source -- python3 benchmarks/demo_minutes/minutes.py FIRST_RUN [RUN ...] VERDICT_RUN"
every = "7d"
floor = 60
goal = "demos/remote-demo"

[[metric]]
id = "vllm/onsite-demo-minutes"
title = "Onsite demo run time"
owner = "vllm"
unit = "minutes"
axis = "Minutes from the first command to the verdict."
better = "lower"
command = "research run --cwd source -- python3 benchmarks/demo_minutes/onsite_minutes.py PROVER_RUN AUDITOR_RUN"
every = "7d"
floor = 60
goal = "demos/onsite-demo"
