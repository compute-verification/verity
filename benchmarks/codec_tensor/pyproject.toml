# The tensor-core wide-word codec's benchmark and its tests. Not a package: `wt.cu` and `bench.py` run on a GPU node
# (`run.sh`), and the byte-exact reference with the kernel's tensor-core decomposition and lane-by-lane carries (`wide.py`)
# run here as a suite (`uv run tools/verity/check/suites.py benchmarks/codec_tensor`), on the remote bandwidth audit's
# codec (`wide.py`'s field, keys and rounds).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test_sketching checks the sketches' arithmetic on the host (sketching.py, numpy and the stdlib modules it
# imports); test_sketch_receipt and test_redteam_impl the GEMM's and attention's blocks under the remote bandwidth
# driver's receipts (and its commitments); test_step_plan the step's pass (step.py, which imports word_codec's kv
# modules) under the driver's block layout.
inputs = ["benchmarks/word_codec/kv.py", "benchmarks/word_codec/kv_bench.py", "benchmarks/word_codec/kv_exhaust.py",
          "verity/hardware/record.py",
          "benchmarks/word_codec/kv_twin.py",
          "benchmarks/word_codec/cuda_lib.py",  # the loader step.py's kernels open through (bench.py, kv_bench.py)
          "verity/__init__.py", "verity/errors.py", 
          "verity/protocols/poub/verifier",
          "verity/protocols/spot/verifier/profile.py",  # with verity/circuits, what store.store_salt's audit import reads
          "verity/protocols/spot/verifier/__init__.py",
          "verity/claims/__init__.py",
          "verity/hardware",  # kv_bench.py reads the RTX PRO 6000's card
          "verity/protocols/spot/device/challenger.py", "verity/protocols/spot/device/remote.py",
          "verity/commitments/crypto",
          "verity/circuits", "verity/commitments", "verity/commitments/randomness",
          "verity/protocols/__init__.py", "verity/protocols/poub/__init__.py", "verity/protocols/spot/__init__.py", "verity/protocols/spot/device/__init__.py"]
