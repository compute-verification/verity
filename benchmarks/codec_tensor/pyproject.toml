# The tensor-core wide-word codec's benchmark and its tests. Not a package: `wt.cu` and `bench.py` run on a GPU node
# (`run.sh`), and the byte-exact reference with the kernel's tensor-core decomposition and lane-by-lane carries (`wide.py`)
# run here as a suite (`uv run tools/verity/check/suites.py benchmarks/codec_tensor`). Stdlib only.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test_tagging checks the store's tags against the bandwidth audit's ro-blake3/v1 (tags.py and the stdlib modules it
# imports); test_sketch_receipt the GEMM's blocks under the remote bandwidth driver's receipts (and its commitments).
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/bandwidth/__init__.py", "verity/core/protocols/bandwidth/tags.py",
          "verity/core/protocols/remote_bandwidth", "verity/ml/__init__.py", "verity/ml/crypto",
          "verity/ml/commitments", "verity/ml/randomness"]
