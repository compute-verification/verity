# The spot capture's staging (`stage.py`) on captures its tests write with `capture.py`'s recorder. Not a package: the tests
# load both scripts from this directory.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# verity_vllm's `pipeline.serving_rows` resolves a rate law by SPOT's service, so its imports reach that and what it imports too.
# stage.py binds each block through verity_vllm's serving templates to its registered Definition, which the tests evaluate and
# hold to the numpy model of FlashInfer's kernel (`tp_allreduce_check`); verity_vllm's imports reach the one-stage protocol and
# verity.ml's commitments, crypto, windows and the tc kernel; capture.py's site copies the SHA-512 header its device kernel
# includes
inputs = ["verity/__init__.py", "verity/errors.py", "verity/circuits", "verity/definitions",
          "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness/__init__.py", "verity/commitments/windows",
          "verity/definitions/kernels/__init__.py", "verity/definitions/kernels/tc.py", "verity/definitions/kernels/sha512.cuh",
          "verity/protocols/spot/verifier/profile.py",
          "verity/hardware/record.py", "verity/claims/__init__.py", "verity/protocols/spot/verifier/__init__.py",
          "verity/protocols/spot/verifier/one_stage", "verity/protocols/spot/verifier/service.py",
          "verity/protocols/spot/device/coins.py", "verity/protocols/spot/device/challenger.py",
          "verity/protocols/spot/device/remote.py", "verity/protocols/spot/verifier/second_stage.py",
          "verity/protocols/spot/verifier/schedule.py", "adapters/vllm/verity_vllm",
          "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/pouw/__init__.py", "verity/protocols/spot/__init__.py", "verity/protocols/spot/device/__init__.py"]
