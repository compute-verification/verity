# The spot capture's staging (`stage.py`) on captures its tests write with `capture.py`'s recorder. Not a package: the tests
# load both scripts from this directory.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# verity_vllm's `pipeline.serving_rows` resolves a rate law by SPOT's service, so its imports reach that and what it imports too.
# stage.py binds each block through verity_vllm's serving templates to its registered Definition, which the tests evaluate and
# hold to the numpy model of FlashInfer's kernel (`tp_allreduce_check`); verity_vllm's imports reach the one-stage protocol and
# verity.ml's commitments, crypto, windows and the tc kernel; capture.py's site copies the SHA-512 header its device kernel
# includes
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/definitions",
          "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness/__init__.py", "verity/ml/windows",
          "verity/ml/kernels/__init__.py", "verity/ml/kernels/tc.py", "verity/ml/kernels/sha512.cuh",
          "verity/core/__init__.py", "verity/core/protocols/__init__.py", "verity/core/protocols/profile.py",
          "verity/core/protocols/record.py", "verity/core/claims/__init__.py", "verity/core/protocols/spot/__init__.py",
          "verity/core/protocols/spot/one_stage", "verity/core/protocols/spot/service.py",
          "verity/core/protocols/spot/coins.py", "verity/core/protocols/spot/challenger.py",
          "verity/core/protocols/spot/remote.py", "verity/core/protocols/spot/second_stage.py",
          "integrations/vllm/verity_vllm"]
