# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "kernels/exact-linear-decode-over-stock"
title = "Exact linear time over stock"
owner = "kernels"
unit = "times stock"
axis = "The int8-exact linears' time for one decode step at batch 32 over vLLM's stock W8A8 int8 on one card, each point naming its model and card."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source -- env GPU_LEASE_WHO=kernels gpu-lease 1 --wait --on CARD --cores CORES --max-min 30 -- bash benchmarks/kernels/exactlin/kbench.sh --models llama-3.2-1b"
every = "7d"
goal = "kernels/code-at-overhaul-bar"
