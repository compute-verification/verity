# The reference datacenter (ruled): the world's
# committed inference, about 2e16 requests a year of DeepSeek-V4-Pro in FP8 at about 4,500 input tokens each (the
# census's world-inference-2027, benchmarks/census/adversary.json, 2.12e16 of them, is the figure of record), on two
# fleets (8-GPU H200 servers; NVL72 racks, a rack one location), unregistered share 0.1% and 1%, side channels 1 kb/s per
# server, monitoring periods a week, a month and a year; and the work and exfiltration references that make the
# overhead interpretable.

# n_active is the census's active parameters, stated here: the registry reads no census, and tests/test_params.py
# holds it equal to it.
[model.deepseek-v4-pro]
n_total = { value = 1.6e12, unit = "param", source = "ruled: the reference datacenter (1.6T total)", status = "ruled" }
n_active = { value = 4.9e10, unit = "param", source = "benchmarks/census/adversary.json world-inference-2027 active_params (ruled: the reference datacenter, 49B active)", status = "ruled" }
d_model = { value = 7168, source = "tests/adapters/vllm/tests/check/fixtures/deepseek_v4/config.json hidden_size", status = "datasheet" }
layers = { value = 61, source = "tests/adapters/vllm/tests/check/fixtures/deepseek_v4/config.json num_hidden_layers", status = "datasheet" }
vocab = { value = 129280, source = "tests/adapters/vllm/tests/check/fixtures/deepseek_v4/config.json vocab_size", status = "datasheet" }
mtp = { value = 1, source = "tests/adapters/vllm/tests/check/fixtures/deepseek_v4/config.json num_nextn_predict_layers", status = "datasheet" }
fanin = { value = 1536, source = "the least d_in of a layer's matrices, wq_b's (and the indexer's) 1536-wide query latent (models.toml model.deepseek-v4-pro.matrices, instances.derived_fanin)", status = "derived" }
fanout = { value = 65536, source = "the widest layer matrix's output, wq_b's 128 query heads x 512 (models.toml model.deepseek-v4-pro.matrices, instances.derived_fanout), above the MoE input's 384 + 2 x 3072 x (6 routed + 1 shared) = 43,392, which understates aOut", status = "derived" }

[run.v4-pretrain]
model = "deepseek-v4-pro"
kind = "pretrain"
tokens = { value = 3.3e13, unit = "token", source = "ruled: the work reference (33T tokens)", status = "ruled" }
compute = { value = 9.7e24, unit = "FLOP", source = "ruled: 6 x 49e9 x 33e12", status = "ruled" }

# k's range is not set here: the registry reads it from the inference-only policy's calibrations
# (benchmarks/nci/calibrations.json: low kimi-k2-1m-coded, high kimi-k2-11mb-raw; slowdown/params.py). gamma is the
# session's tokens at the census's FLOP per active parameter per token and active parameters, stated here: the registry
# reads no census, and tests/test_params.py holds it equal to that product.
[policy.v4-pro-session]
gamma = { value = 9.8e16, unit = "FLOP", source = "a 1M-token session (benchmarks/nci/calibrations.json kimi-k2-1m-raw's K at its b_tok bits a token) at benchmarks/census/adversary.json world-inference-2027's FLOP per active parameter per token and active parameters", status = "derived" }
k = { value = 2e7, unit = "bit", source = "ruled: a session returns at most 2.5 MB (1M tokens at 20 bits)", status = "ruled" }
inference_overhead = { value = nan, unit = "x", source = "not modeled: a placeholder for the honest inference workload's overhead under this partition; this package models no honest inference circuit to partition" }

# A policy's k, its range, and gamma are not set here: the registry reads them from the inference-only policy's
# calibrations (benchmarks/nci/calibrations.json, slowdown/params.py).
[policy.kimi-k2-1m-raw]
inference_overhead = { value = nan, unit = "x", source = "not modeled: a placeholder for the honest inference workload's overhead under this partition; this package models no honest inference circuit to partition" }

# Each fleet is the whole world's compute: sized to serve the census's world-inference-2027
# (benchmarks/census/adversary.json total_flop, 2.12e16 requests x 4,500 tokens x 2 x 49e9 = 9.36e30 FLOP over its
# one-year monitoring period, prefill only), at the fleet's serving MFU: count = total_flop / (phi x
# monitoring_period_s x mfu_serve) (tests/test_hardware.py holds it there).
[fleet.world-h200]
location = "h200-hgx"
count = { value = 4.687e7, unit = "location", source = "benchmarks/census/adversary.json world-inference-2027: 9.36e30 / (1.58312e16 x 3.1536e7 x 0.4)", status = "derived" }
eps_unreg = { value = 0.001, low = 0.0001, high = 0.01, source = "ruled: mainline 0.1%; one connected unencumbered pool (operating points 0.1% and 1%); high: the earlier 1% point", status = "ruled" }
mfu_train = { value = 0.4, low = 0.3, high = 0.55, source = "frontier pretraining MFU", status = "assumed" }
mfu_serve = { value = 0.4, low = 0.2, high = 0.6, source = "the served work's MFU, prefill-heavy", status = "assumed" }

[fleet.world-nvl72]
location = "gb200-nvl72"
count = { value = 2.061e6, unit = "location", source = "benchmarks/census/adversary.json world-inference-2027: 9.36e30 / (3.6e17 x 3.1536e7 x 0.4)", status = "derived" }
eps_unreg = { value = 0.001, low = 0.0001, high = 0.01, source = "ruled: mainline 0.1%; one connected unencumbered pool (operating points 0.1% and 1%); high: the earlier 1% point", status = "ruled" }
mfu_train = { value = 0.4, low = 0.3, high = 0.55, source = "frontier pretraining MFU", status = "assumed" }
mfu_serve = { value = 0.4, low = 0.2, high = 0.6, source = "the served work's MFU, prefill-heavy", status = "assumed" }

[work.v4-step]
flops = { value = 2.84e19, unit = "FLOP", source = "ruled: one optimizer step (about 4 H100-hours)", status = "ruled" }

[work.v4-pretrain]
flops = { value = 9.7e24, unit = "FLOP", source = "ruled: the pretraining run (33T tokens)", status = "ruled" }

[exfil.sparseloco-1000]
bits = { value = 1.36e14, unit = "bit", source = "ruled: 1,000 SparseLoCo syncs (17 TB)", status = "ruled" }

[exfil.rl-rollouts]
