# The min-cut bound's two conjectures, keyed by their claim ids (their lock entries' `id`,
# verity/commitments/claim_ids.json). slowdown/min_cut.py reads `lean` and `beta` from this file itself: it is standard
# library only, loaded by path. An assumption has its `standing` for blocks of at most `credible_bits` fresh input bits
# and its `beyond` above.
# `beta`: (H)'s β for an activation by block size, rows (k bits, β bits a value), k rising. Past the last row there is
# no β, and the class bounds no block.
[premise.training-cut-hardness]
lean = "Slowdown.Cut.Assumptions.Hardness"
standing = "assumed"
beyond = "contested"
credible_bits = { value = 8e8, unit = "bit", source = "beta's last k: no β is stated past it, and the min-cut class bounds no block there", status = "derived" }
beta = { value = [[145568, 15.9], [800000, 15.3], [8e6, 10.8], [8e7, 2.7], [8e8, 0.37]], unit = "(bit, bit/value)", source = "measured: the least ratio κ(S) / |val(S ∩ X)| a red team of (H) found over its sets S with κ(S) ≤ k, on one traced step of a small dense model in bf16. (H) is refuted there at any β above a row, and a row is not evidence (H) holds at it. That least only falls as k rises, so between two rows it is at least the next row's value and at most the one before's, and the rows say nothing more: slowdown/min_cut.py takes the next row's, the largest β no set behind the rows refutes between them. The red team's generator is not in the tree", status = "assumed" }

[premise.training-cut-exports]
lean = "Slowdown.Cut.Assumptions.Exports"
standing = "assumed"
beyond = "assumed"
credible_bits = { value = inf, unit = "bit", source = "a property of the work's MACs and outputs (a set of computed gates pays b cut gates for each output it finishes), not of a block's bits", status = "derived" }
