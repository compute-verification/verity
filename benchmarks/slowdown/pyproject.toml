[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Every estimate's status is read from the locks (slowdown/lean.py), and the tests check each cited Lean name is in one.
# tests/test_envelopes.py holds the remote regime to tiers.py's terms at its DEFAULTS (imported by path), and
# tests/test_hardware.py holds the locations to the census's devices and the world fleets to its adversary.
# test_classes and test_attacks cross-check the threaded class and the shard attack against benchmarks/nci's
# implementations, imported by path (slowdown.py imports catalog.py). families.Nci reads the `benchmarks/nci` library's algorithms
# and their traits. test_envelopes pins theorem.multiple_bound to Lean's remoteSlowdown and SlowdownRemote's text.
# The monitoring periods are core's reporting grid's (slowdown/params.py), stdlib only.
inputs = ["Security/lean-audit.json", "Security/Properties/lean-audit.json", "benchmarks/nci/tiers.py",
          "Security/Definitions/InferenceOnly/Remote.lean", "Security/Definitions/InferenceOnly/Guarantees/Remote.lean",
          "benchmarks/census/hardware.json", "benchmarks/census/adversary.json", "benchmarks/nci/slowdown.py",
          "benchmarks/nci/catalog.py", "benchmarks/nci/algorithms.json",
          "verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/reporting.py"]
