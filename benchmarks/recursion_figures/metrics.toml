# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# Each is modeled from the recursion bench's run of record, the run its command names, read from the evidence store
# with this tree's reader, and written for each fleet's week,
# month and year; the world's year, the one each id names, is written last. Recursion is parked (top/parked), so the
# figures are redrawn monthly, from a newer run once one is recorded.
[[metric]]
id = "benchmarks/recursion-core-years-world-year"
title = "CPU core-years to audit every machine of the world for a year by recursive sessions, one a machine a window, at the run of record's session"
owner = "benchmarks"
unit = "CPU core-years a world year"
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/recursion_figures/figures.py --from r20261106-010929-a7ae"
every = "30d"
goal = "top/parked"

[[metric]]
id = "benchmarks/recursion-ks-error-log2-world-year"
title = "The recursive sessions' knowledge-soundness error over the world's year, log₂, against the world's GPUs' SHA-512 calls: the proved per-session and per-call terms, union-bounded over the year's sessions"
owner = "benchmarks"
unit = "log₂ of the knowledge-soundness error a world year"
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/recursion_figures/figures.py --from r20261106-010929-a7ae"
every = "30d"
goal = "top/parked"

[[metric]]
id = "benchmarks/recursion-stop-leak-bits-world-year"
title = "The bits the ZK server's stops can leak over the world's year, a stream a machine and a session a window, at the run of record's parts"
owner = "benchmarks"
unit = "stop-leak bits a world year"
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/recursion_figures/figures.py --from r20261106-010929-a7ae"
every = "30d"
goal = "top/parked"
