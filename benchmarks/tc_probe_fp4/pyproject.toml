[project]
name = "verity-tc-probe-fp4"
version = "0.0.0"
description = "Blackwell FP4-path tensor-core probes and W1 price microbenchmarks (sm_120 mma.sync, sm_100 tcgen05)."
requires-python = ">=3.12"
dependencies = ["research", "verity", "numpy"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity` (`verity.ml.circuits`), of `research` (its store's tool declarations) and of `verity_config`
# (the SHARED settings the probes read the run's id, commit and devices through), in place of the three trees.
inputs_only = true
inputs = ["verity/__init__.py", "verity/settings.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits",
          "tools/research/src/research/__init__.py", "tools/research/src/research/pythonpath.py", "tools/research/src/research/store",
          "tools/config/verity_config"]
