# The KV filler's benchmark and its tests. Not a package: `topup.cu`, `bench.py` and `serve.py` run on a GPU node
# (`run.sh`); the conversion-lag replay (`lag.py`) and the filler plan (`plan.py`) run here as a suite.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# bench.py puts benchmarks/word_codec on the path for kv.py, which imports blake3 through the verity package
inputs = ["benchmarks/word_codec/kv.py", "verity/__init__.py", "verity/ml/__init__.py", "verity/ml/crypto/__init__.py",
          "verity/ml/crypto/blake3.py"]
