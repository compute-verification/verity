[[metric]]
id = "benchmarks/serving-cost-priced"
title = "Serving cost, priced from copy"
owner = "benchmarks"
unit = "percent"
axis = "Extra serving time of the real model as a percent of stock's, priced from a small copy's unit costs and the real model's counts; each point's member names its model, card and arm, and each lists the parts and code paths it could not price."
better = "lower"
command = "research run --on auto --store-read --source . --cwd source -- uv run python benchmarks/serving_cost/run.py price --capture CAPTURE --minify MINIFY --units UNITS"
every = "7d"
goal = "benchmarks/serving-cost-in-five-stages"
