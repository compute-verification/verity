# One card's sustained int8 rate per operand class. Not a package: class_rate.cu and run.sh run on an H200 under
# gpu-lease, and the suite holds summarize.py's reading to made-up arms and wgmma_i8.cuh to its generator.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.verity.tests]
# summarize.py reads θ from the H200's card (the Site's reader, `verity.device`, which imports `verity.errors` and the
# wire, `verity.channel`); gen_wgmma.py reads the standard library alone.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/hardware/__init__.py", "hardware/cards", "verity/device.py",
          "verity/channel.py"]
