[project]
name = "verity-network-sim"
version = "0.0.0"
description = "The device graph and a mock datacenter of network namespaces that runs the network certifier."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# graph.py exports datacenter's declarations and records.py replays network_traces' active_replay; neither directory is
# an installed package, so both are imported by path. The tests pin the declared tensor-core rates to the census.
inputs = ["benchmarks/datacenter", "benchmarks/network_traces", "benchmarks/census/hardware.json"]
