# Honest at L = 128 on the H200 (sm_90), a model profile (no kernel measured at this spacing yet): one
# IGMMA.64x256x32.S8.S8, then duo on each committed word (LOP3 + IMAD + LEA.HI); the accumulator is in registers, so a
# committed word needs no load.
name = "dc90-l128"
status = "provisional"
source = "from this device's census: duo is LOP3 + IMAD + LEA.HI a word on sm_90, 32 committed words a lane a MMA at L = 128"
L = 128

[mma]
kind = "IGMMA.64x256x32.S8.S8"
# wgmma m64n256k32 s8 (SS): a warp's 4096 of the warpgroup's 16384 words, 128 SMSP-cycles on the tensor pipe, 128
# words/SM/clk
class = "IGMMA_S8_N256"
words = 4096
depth = 32

[per_mma]       # warp instructions a MMA: the MMA and the fold (LEA.HI on ALU's row)
IGMMA_S8_N256 = 1
ALU = 64
IMAD = 32

[operands]      # the least operand delivery any program pays a MMA when the design names none
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]          # lane instructions a committed word
name = "duo"
ALU = 2
IMAD = 1
