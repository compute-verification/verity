# Dither-C's P.V a MMA as measured: pv_l7qs (benchmarks/pouw/edited_gemm/cpv.cu), e_l7qs's mainloop over one unit (a
# 128-query tile x 128 channels over one 256-key block B, p_block = 256) with the tail stage P_A = [-U | U | -U M_d |
# 127 M_d] against DG's [A_0 | A_1 | X_diag | 0] (O' = T_last - U A_0 - (U M) X_diag, D_1 = U A_1, each absorbed) and
# the served epilogue f = float(2 O + 127 S) s_q s_ch, Llama-3.1-8B's attention at 2,048 tokens (32 query heads, 8 KV
# heads: 2,304 units, 1,792 full and 512 diagonal). Counts are the kernel's executed mix (ncu; 1.52 MMAs a useful one:
# the tail's 4 a full unit's 8); WAIT is left out (0.1058 a MMA). Each unit writes its own 128 x 128 f slab, so the
# store binds, not the issue rows: eps_sched 0.76 here and 0.85 for pv_plain (the same units, no edit), and honest's
# time is 1.402x pv_plain's (1.371x at 4,096 tokens).
name = "pv-l7qs"
status = "measured"
source = "BC-KERNEL's pv_l7qs (benchmarks/pouw/edited_gemm/cpv.cu) at s = 2048, H = 32, rep = 4, `eps_profile.py OUT --toml`, census VF3n-16's classes (bit-exact against checked_strip's pv_words and pv_served, cpv_ref.py)"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold included)
MMA = 1
ALU = 9.6330
IMAD = 4.8763
NOROW = 1.4154
FFMA = 0.6987
LDSM_X4 = 0.4807
LDG32 = 0.4789
UNI = 0.1061
SEL = 0.1038
IMADW = 0.0771
LDG128 = 0.0116
UTMA16K = 0.0075

[measured]
cycles_per_mma = 100.68         # the hot median at its clock; ncu 80.1904; work bound 24.1701 on JI3n_0 (eps_sched 0.759)
source = "pv_l7qs at s = 2048, H = 32, rep = 4: hot 0.2170 ms against pv_plain's 0.1548"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a MMA at L = 32)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
