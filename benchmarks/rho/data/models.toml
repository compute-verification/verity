# DeepSeek-V4-Pro's sizes are in reference.toml. Its matrices, from
# integrations/vllm/tests/check/fixtures/deepseek_v4/config.json: q_lora_rank 1536, one 512-wide kv head, 128 query heads
# of 512, the output projected in 16 groups of 8 heads (o_lora_rank 1024), a 64 x 128 indexer query in the 30 CSA
# layers; 384 routed experts of 3072, 6 active, 1 shared, in every layer. The compressors, the mHC mixing and the MTP
# module are left out (under 2% of the parameters). reference.toml's legs (1536) and fanout (65536, wq_b's output) are
# derived from these.
[model.deepseek-v4-pro.matrices]
attention = [["wq_a", 7168, 1536, 61, 61], ["wkv", 7168, 512, 61, 61], ["wq_b", 1536, 65536, 61, 61],
             ["wo_a", 4096, 1024, 976, 976], ["wo_b", 16384, 7168, 61, 61], ["indexer_wq_b", 1536, 8192, 30, 30]]
experts = [["gate", 7168, 3072, 23424, 366], ["up", 7168, 3072, 23424, 366], ["down", 3072, 7168, 23424, 366]]
shared = [["gate", 7168, 3072, 61, 61], ["up", 7168, 3072, 61, 61], ["down", 3072, 7168, 61, 61]]
router = [["gate", 7168, 384, 61, 61]]
head = [["head", 7168, 129280, 1, 1]]

