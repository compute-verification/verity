# Model architectures and training runs (rho/instances.py): the one place a model's shape is stated, which the other
# benchmarks read through instances.models (benchmarks/nci/kappa.py, benchmarks/circuit_properties' references). A model's
# matrices are, by group, rows of [name, d_in, d_out, copies in the model, copies a token uses]; legs and fanout are
# derived from them (instances.derived_legs, instances.derived_fanout) wherever their status is "derived". Its attention
# table is the attention as its config.json states it (kind "gqa" or "mla"), which the attention matrices follow from
# (instances.attention_matrices). A dense MLP without a gate row is a GELU one.

