# Layer 3, the exclusion: the elementary uncertified cap q_U(U) = omega_max U / s_times (rho/classes.py Structure), what
# an uncertified or a dark gate holds under a bound. A scenario picks one by `structure` (default: reference).
# s_times and units.gates_per_flop must come from one source (basis, as units.basis says it; Structure.check refuses a
# mix): the bound holds a gate at u/w = omega_max 2G / (kappa s_times) of the reference's weight.

# s_times at the reference's gates per counted product, 2G / kappa of the adversary's family (831 gates at
# units.gates_per_flop 250 and family.full's kappa 0.602), so it moves with both and G cancels (u = w): the dark leaves
# count at the dark hardware's datasheet product rate (kappa/2 a datasheet FLOP, Layer 1), not at any Boolean structural
# minimum, and only under draft:no-straddle. A measured minimum replaces it in gates of one Boolean design, with
# units.gates_per_flop counted on the same design: #4826's 681 gates a bf16 product (AmpereBF16TcDot16_v3) beside
# G = 250 would lower onsite-h200's bound by about 18%.
[structure.reference]
s_times = { value = "reference", unit = "gate", source = "the reference's gates per counted product, 2G / kappa, standing in for the fewest gates in any counted operation's subcircuit until a measurement program (another worker's) supplies that minimum", status = "assumed" }
omega_max = { value = 1, source = "a counted product's weight (rho/theorem.py: every counted product weighs 1)", status = "declared" }
basis = "flop-model"

# The elementary cap: one counted operation per gate, at most (each charged to its output gate, so none straddles).
[structure.elementary]
s_times = { value = 1, unit = "gate", source = "a counted operation has at least one gate, its output", status = "derived" }
omega_max = { value = 1, source = "as structure.reference", status = "declared" }
