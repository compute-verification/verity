# The reference datacenter Daniel named (25 Oct 10:05 PM PDT, relayed by top in thread 1792987543.379119): the world's
# committed inference, about 2e16 requests a year of DeepSeek-V4-Pro in FP8 at about 4,500 input tokens each, on two
# fleets (8-GPU H200 servers; NVL72 racks, a rack one location), dark share 0.1% and 1%, side channels 1 kb/s per
# server, horizons a week, a month and a year; and the work and exfiltration references that make rho interpretable.
# Its regimes are data/envelopes.toml's onsite (a wipe every 24 h leaving 5 GB of each server's whole memory, Daniel
# 26 Oct 12:16 PM PDT), onsite-today (today's wipe, about 12 GB a server plus the boot disk), onsite-per-device (10 GB
# a device and the host unwiped: the sensitivity) and remote. A scenario with structure = "elementary" counts the
# uncertified and dark gates at one counted operation a gate (data/exclusion.toml).

