# The elementary uncertified cap's premise (rho/classes.py Structure): q_U(U) = omega_max U / s_times counts an
# uncertified or dark gate's operations at s_times gates each only if no counted operation has gates on both sides of
# the certified boundary. Not in Lean; an operation split across it is counted by neither side's cap.
[premise.no-straddle]
lean = "draft:no-straddle"
standing = "assumed"
beyond = "assumed"
credible_bits = { value = inf, unit = "bit", source = "a property of the circuit's operations, not of a block's bits", status = "derived" }
