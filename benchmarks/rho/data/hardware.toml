# The physical model: the conversion to gates, locations, fleets (the inventory), horizons (rho/hardware.py).

# The one conversion from the FLOP model's inputs to Boolean gates (hardware.Units). The overhead and the time to the
# target don't depend on it (tests/test_hardware.py); what it sets is the gate counts printed beside them. basis says where it
# comes from: "flop-model" (an assumed conversion) or "boolean:<design>" (counted on one Boolean design); a structure's
# s_times must come from the same one (data/exclusion.toml, classes.Structure.check).
[units]
gates_per_flop = { value = 250, unit = "gate/FLOP", low = 50, high = 1000, source = "an FP8 E4M3 multiply-add (2 FLOPs) as two-input Boolean gates: a 4 x 4 mantissa product, a 5-bit exponent sum and an FP32 accumulate's align, add and normalize, about 500 gates; low: the mantissa product alone; high: a BF16 product into an FP32 accumulator", status = "assumed" }
basis = "flop-model"

# A location is the largest set of devices joined by links no certifier sees. flops is the datasheet's dense FLOP/s at
# the training precision (FP8), which Units turns into Φ in gates per second; hosts are servers or compute trays, each
# with its own NICs, certifier and side channels; links is the line rate across the location's boundary. Disks are
# unplugged (benchmarks/nci/tiers.py disk_gb 0; a DGX's 8 x 3.84 TB NVMe would set disk to 2.5e14 bits).

[location.h100-hgx]
devices = { value = 8, unit = "GPU", source = "NVIDIA DGX H100 datasheet: 8 x H100 SXM5 on one NVLink switch domain", status = "datasheet" }
flops = { value = 1.58312e16, unit = "FLOP/s", low = 7.9152e15, high = 1.58312e16, source = "benchmarks/census/hardware.json h100-sxm5-80gb/e4m3 x 8; low: h100-sxm5-80gb/bf16 x 8", status = "datasheet" }
memory = { value = 5.49755813888e12, unit = "bit", source = "benchmarks/census/hardware.json h100-sxm5-80gb memory_bytes x 8 GPUs", status = "datasheet" }
hosts = { value = 1, unit = "server", source = "one DGX H100", status = "datasheet" }
host_memory = { value = 1.6e13, unit = "bit", source = "NVIDIA DGX H100 datasheet: 2 TB system memory", status = "datasheet" }
host_ops = { value = 4.5875e14, unit = "op/s", source = "2 x Xeon Platinum 8480C (DGX H100 datasheet): 112 cores x 2,048 INT8 AMX ops per cycle x 2.0 GHz base, tiers' host_share method", status = "derived" }
links = { value = 4.8e12, unit = "bit/s", low = 3.2e12, high = 4.8e12, source = "NVIDIA DGX H100 datasheet: 8 x ConnectX-7 at 400 Gb/s and 2 dual-port BlueField-3 at up to 400 Gb/s a port; low: the compute fabric alone", status = "datasheet" }

