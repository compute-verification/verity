# The remote envelopes plus a wipe every 24 h at Daniel's operating point (5 GB per server, of its whole memory M_s), a
# certifier on each host and side channels. Wipe: wipe_s, per, k_wipe, game_delta_coin, prf_advantage; certifier:
# intake, timing, side.
[regime.onsite]
kind = "onsite"
base = "remote"
wipe_s = { value = 86400, unit = "s", low = 3600, high = 604800, source = "ruling: Daniel 25 Oct, 24 h wipes", status = "ruled" }
per = "server"
k_wipe = { value = 4e10, unit = "bit/server", low = 2e10, high = 9.32e11, source = "ruling: Daniel 26 Oct 12:16 PM PDT, the wipe leaves at most 5 GB of the server's assumed memory capacity M_s, every tier included (the operating point; the per-server statement is memory-accounting's, Wed 28 Oct 06:00Z); low: half; high: the per-device measurement's 116.5 GB a server (8 x 10 GB of HBM and 36.5 GB of host, DPU, BMC and flash unwiped: regime.onsite-per-device)", status = "ruled" }
