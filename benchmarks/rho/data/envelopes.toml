residual = { value = 0.323, low = 0.01, high = 1, source = "benchmarks/nci/tiers.py DEFAULTS residual: the floor credit at the locked clock, honest kernels at 1.72x the floor (run r20261017-123922-e558); low: best plausible design; high: nothing credited, as in a training window today", status = "measured" }
