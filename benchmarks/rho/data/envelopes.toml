# PoUW as deployed on the demo H200: per-call J10-R, every static INT8 matmul a unit (f = 1), credit all or nothing
# per period (H1J10RCheckedCreditPeriod), which credits words, not time, so no clock is credited. C is the H200's INT8
# tensor capacity over the step at the ACCEL model's card table (Verity.Accel.H200:
# 4,096 MACs a SM-clock on 132 SMs at the clock's ceiling, 1,980 MHz, 1.0705e15 MACs/s), so the clock term is 0; W_cert
# the step's served MACs at batch 4,096. host is 0: hosts carry no compute. The remote and onsite-today H200 regimes carry the same
# three keys (tests/test_envelopes.py holds them).
[regime.remote-h200-pouw]
base = "remote"
residual = { value = 0.958, low = 0, high = 1, source = "1 - W_cert/C on the demo H200 server at batch 4,096: W_cert = 5.722e14 MACs a step (52 layers x 2.686e9 + the head's 4.19e6 MACs a token, x 4,096) over C = 12.60 s x 1.0705e15 MACs/s (the ACCEL card table's 1,980 MHz ceiling; 0.954 at the sheet's 1,830 MHz), so 4.2% credited. The step, measured: the served step 3.78 s (forward 3.22 + attention 0.56), the commit at 1 KiB rows +0.42 s, PoUW's units 5.59 s and their commit 2.81 s. A commit-bound 82.94 s step (the slot commit holding the forward at about 75 s) gives 0.993. low: PoUW fills the GPU with credited work at the tensor rate (0.298 at the served wgmma's measured 76% of the sheet's 1,830 MHz rate, over the table's 1,980); high: nothing credited", status = "measured" }
clock_share = { value = 0, low = 0, high = 0.082, source = "the ACCEL model's card table (Verity.Accel.H200): C counts the tensor at 1,980 MHz, the H200 SXM's clock ceiling (H100 whitepaper V1.04 Table 3 boost clock; the driver's maximum on the demo H200 servers, with memory at 3,201 MHz and 700 W), and J10-R credits words, not a clock (H1J10RCheckedCreditPeriod), so no capacity runs above what C counts; high: C at the sheet's 1,830 MHz tensor clock (H1's SM90 record tensor_mhz), 1980/1830 - 1", status = "datasheet" }
host = { value = 0, source = "as regime.remote host: hosts carry no compute; 1 would add location.h200-hgx's two Xeon 8480Cs at 2.9% of Phi (J10-R credits GPU words only)", status = "ruled" }

[regime.onsite-today-h200-pouw]
