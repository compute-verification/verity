# Layer 2, the envelopes (rho/envelopes.py): the NCI check's registration (a policy) and each regime's envelopes, one
# flat table per regime whose every key is a field of one envelope (Pouw, Detection, Wipe, Certifier) or the regime's
# own form. A regime's `base` is a table it inherits and overrides.

[policy.kimi-k2-1m-raw]
gamma = { value = 6.4e16, unit = "FLOP", source = "benchmarks/nci/calibrations.json kimi-k2-1m-raw: 1M tokens x 2 x 32B active", status = "declared" }
k = { value = 2e7, unit = "bit", low = 2.2e6, high = 8.8e7, source = "benchmarks/nci/calibrations.json kimi-k2-1m-raw (2.5 MB); low: kimi-k2-1m-coded; high: kimi-k2-11mb-raw", status = "declared" }
inference_overhead = { value = nan, unit = "x", source = "not modeled: a placeholder for the honest inference workload's overhead under this partition; rho models no honest inference circuit to partition" }

[regime.unmonitored]
kind = "unmonitored"

