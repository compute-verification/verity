# The proof of forward computation (rho/pofc.py), from Daniel's Notion page "Proof of forward computation": the rules'
# numbers, the forward-only links of its physical instantiation, and the two models its toll tables price. The page
# gives n_max's range, the precisions and the models; every other number is ours, marked assumed or derived.

[pofc.rules.reference]
n_max = { value = 1e6, low = 1e4, high = 1e6, unit = "token", source = "Daniel's Notion page Proof of forward computation: the toll tables' n_max of 1e4, 1e5 and 1e6; value: policy.v4-pro-session's 1M-token session", status = "assumed" }
write = { value = 1, unit = "d_model values/position", source = "Daniel's Notion page Proof of forward computation: rule 5, s about d_model values at serving precision", status = "assumed" }
act_bits = { value = 4, low = 4, high = 8, unit = "bit/value", source = "Daniel's Notion page Proof of forward computation: serving at 4-bit activations; high: FP8 activations, as the reference datacenter serves", status = "assumed" }
weight_bits = { value = 16, low = 8, high = 32, unit = "bit/param", source = "Daniel's Notion page Proof of forward computation: training needs 16-bit weights; low: FP8 training's matmul weights; high: FP32 master weights", status = "assumed" }
commit_bits = { value = 8, low = 4, high = 16, unit = "bit/param", source = "the honest model's committed weights: FP8, as the reference datacenter serves DeepSeek-V4-Pro (data/reference.toml)", status = "assumed" }
commit = { value = 1.0, low = 1.0, high = 3.0, unit = "x honest model", source = "Daniel's Notion page Proof of forward computation: rule P, no value given; value: P is the honest model's commitment; high: room to commit every layer again at 16 bits over 8-bit serving (the palindrome)", status = "assumed" }
per_operator = { value = 1.0, low = 1.0, high = 4.0, unit = "x honest layer", source = "Daniel's Notion page Proof of forward computation: rule p, one operator per transformer layer, no value given", status = "assumed" }
input_bits = { value = 20, low = 2.2, high = 88, unit = "bit/token", source = "Daniel's Notion page Proof of forward computation: rule 3, X, no value given; policy.v4-pro-session's k over its 1M tokens (low: coded; high: 11 MB raw)", status = "assumed" }
output_bits = { value = 20, unit = "bit/token", source = "Daniel's Notion page Proof of forward computation: rule 4, Y, no value given; policy.v4-pro-session's 20 bits a returned token", status = "assumed" }
episodes_per_day = { value = 1.24e6, unit = "episode/location/day", source = "Daniel's Notion page Proof of forward computation: one inference request an episode; 2e16 requests a year (data/reference.toml) / 4.42e7 servers / 365 days", status = "derived" }

# The physical instantiation: each GPU reads only its own static memory and sends forward only, so the bandwidth to the
# next GPU is the write allowance of the location's narrowest forward cut.
[pofc.link.h200-hgx]
bandwidth = { value = 3.6e12, low = 5.12e11, high = 7.2e12, unit = "bit/s", source = "Daniel's Notion page Proof of forward computation: forward-only NVLink; NVIDIA H200 NVLink 900 GB/s a GPU both ways, 450 GB/s forward; low: a PCIe 5 x16 link (64 GB/s); high: every link turned forward", status = "assumed" }

[pofc.link.nvl72]
bandwidth = { value = 7.2e12, low = 7.2e12, high = 1.44e13, unit = "bit/s", source = "Daniel's Notion page Proof of forward computation: forward-only NVLink; GB200 NVLink 5 1.8 TB/s a GPU both ways, 900 GB/s forward; high: every link turned forward", status = "assumed" }

[pofc.model.llama-3.1-405b]
n_total = { value = 4.05e11, unit = "param", source = "Daniel's Notion page Proof of forward computation: Llama-405B, dense, 126 layers of about 3.2B params", status = "datasheet" }
layers = { value = 126, source = "Daniel's Notion page Proof of forward computation: Llama-405B, 126 layers", status = "datasheet" }
d_model = { value = 16384, source = "Daniel's Notion page Proof of forward computation: Llama-405B, d_model 16384", status = "datasheet" }

[pofc.model.kimi-k3]
n_total = { value = 2.78e12, unit = "param", source = "Daniel's Notion page Proof of forward computation: Kimi K3, MoE, 2.78T params", status = "assumed" }
layers = { value = 61, low = 61, high = 64, source = "Daniel's Notion page Proof of forward computation: about 61 layers; high: its table's top 64 (whole)", status = "assumed" }
d_model = { value = 7168, source = "Daniel's Notion page Proof of forward computation: Kimi K3, d_model 7168", status = "assumed" }
