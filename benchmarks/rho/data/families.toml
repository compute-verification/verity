# Algorithm families (rho/families.py). A family is a kind (families.KINDS) with its parameters; `premises = "<family>"`
# takes the premise numbers it doesn't give from that family. efficiency.<run kind>: compute to reach that kind of
# target (instances.RUN_KINDS), in multiples of the reference algorithm's; a kind left out can't be reached.

[family.full]
kind = "full"
kappa = { value = 0.602, low = 0.294, high = 0.667, source = "Nci.Cover.Guarantees.FanOutIntensity docstring: alpha0 = 0.301 with Dgrad on the forward's tokens (c = 2); low: forward only (0.147)", status = "derived" }
state_bits_per_param = { value = 16, low = 2.5, high = 96, source = "the state an exact run carries across wipes: FP8 weights and one 8-bit moment; low: lossy weights only (benchmarks/nci/parameters.json b_w.pretrained/frontier-lossy); high: FP32 master weights and Adam's two moments", status = "assumed" }
b = { value = 2.5, low = 0.8, high = 4.5, source = "UpdateHardness at Kimi K2 (FanOutIntensity docstring); range: b_w.pretrained/frontier-lossy", status = "conjecture" }
b_w = { value = 2.5, low = 0.8, high = 4.5, source = "benchmarks/nci/parameters.json b_w.pretrained/frontier-lossy", status = "measured" }
b_a = { value = 4, low = 1, high = 16, source = "benchmarks/nci/parameters.json b_a.activation", status = "assumed" }
f = { value = 4, low = 1, high = 8, source = "FanOutReadIntensity docstring (Kimi K2 at f = 4)", status = "conjecture" }
width = { value = 390, low = 48, high = 512, source = "PartialSumCoverBound docstring (a = 390)", status = "derived" }
per_param = { value = 2, low = 1, high = 2, source = "Dgrad on the forward's tokens (FanOutIntensity docstring)", status = "derived" }
bcol = { value = 1, low = 1, high = 2.5, source = "ColumnsIncompressible at Kimi K2 (FanOutIntensity docstring)", status = "conjecture" }
beta_x = { value = 0.87, low = 0.39, high = 0.94, source = "measured: replay-consistent, exact block on Qwen2.5-1.5B; the best coder's rate, so an upper bound on what the premise may assume, carried to other models at fixed F/d", status = "assumed" }
thread_d = { value = 10, source = "benchmarks/nci/rows.json pretrain-full", status = "derived" }
thread_c = { value = 2, source = "benchmarks/nci/rows.json pretrain-full", status = "derived" }
thread_k = { value = 2e7, unit = "bit", source = "Nci.Guarantees.ReferenceThreaded: the Threading certificate checked for Kimi K2 at S = 2e7 bits (benchmarks/nci/rows.json pretrain-full)", status = "declared" }
c_w = { value = 2.5, low = 0.8, high = 3.4, source = "Nci.Cover.Guarantees.CoveringBoundAdditive docstring (c_w = 2.5 at Kimi K2, b_w.pretrained/frontier-lossy); low: b_w's; high: Nci.Guarantees.CoveringBoundPriced docstring, a uniform c_w is at most the cheapest 1%'s 2.3-3.4", status = "conjecture" }
c_a = { value = 4, low = 1, high = 16, source = "Nci.Cover.Guarantees.CoveringBoundAdditive docstring: each counted product's output reads all four bits of its FP4 activation; high: CoveringBoundPriced's bf16 activation, 16", status = "derived" }
price = { value = 2.8, low = 2.3, high = 6.7, source = "Nci.Guarantees.CoveringBoundPriced docstring at Kimi K2: a uniform price at most the cheapest 1%'s 2.3-3.4; high: priced per parameter, the weights' mean, 6.7 bits", status = "derived" }
price_max = { value = 8, low = 8, high = 16, unit = "bit", source = "Nci.Guarantees.CoveringBoundPriced docstring: t is at most a weight's width, 8 bits in FP8; high: bf16's 16", status = "derived" }
gamma = { value = 1, source = "E1 Proposition 3': the splitting margin of H_gamma^t; exact coverings measured splitting at 1.1-1.5x (premise.e1-h-gamma)", status = "assumed" }
beta_v = { value = 0.63, low = 0.18, high = 0.63, unit = "bit", source = "E1 Proposition 6b: beta_v^R 0.18-0.63 at FP8 (premise.e1-output-premise)", status = "derived" }
h_eff = { value = 17, unit = "bit", source = "E1 Corollary 4a: a partial sum held at a 17-bit token's bits", status = "derived" }
b_ps = { value = 1, low = 1, high = 16, unit = "bit", source = "E1 Corollary 4a: bits per weight-gradient accumulator read, its two cases 1 and 16 (bf16)", status = "conjecture" }
step_tokens = { value = 6.7e7, unit = "token", source = "Kimi K2 report (arXiv 2507.20534): 67M tokens a batch (benchmarks/nci/kappa.py batch_tokens); a run that states its batch sets its own", status = "datasheet" }
beta_x_marginal = { value = 2.6, low = 0.87, high = 4, unit = "bit", source = "E1's column tile at the margin (draft:E1-tile): fresh bits per extra activation occurrence; low: the exact block's beta_x; high: an FP4 activation's width", status = "assumed" }
psum_bits = { value = 16, unit = "bit", source = "a bf16 partial sum handed to the next tile", status = "declared" }
tile_weight_bits = { value = 8, unit = "bit", source = "an FP8 weight read at its stored width (a precision caps it at its own)", status = "datasheet" }
token_bits = { value = 20, low = 17, high = 20, unit = "bit", source = "ruled: a session returns at most 2.5 MB, 1M tokens at 20 bits (policy.v4-pro-session.k); low: E1's 17-bit token", status = "ruled" }
grad_bits = { value = 16, low = 8, high = 32, unit = "bit", source = "a bf16 gradient accumulator per updated weight inside an optimizer step; low: FP8; high: FP32", status = "assumed" }

[family.full.efficiency]
pretrain = { value = 1.0, source = "the reference algorithm", status = "declared" }

# Number formats: precision.<name> sets beta_x, caps b_a and f at its bits, and multiplies the family's efficiency.

[precision.fp8]
beta_x = { value = 0.87, low = 0.39, high = 0.94, source = "measured: replay-consistent exact blocks on Qwen2.5-1.5B GRPO, 0.39-0.87; high: the cheapest boundary's 0.87-0.94; coders' rates, so upper bounds on what the premise may assume", status = "assumed" }
bits = { value = 8, unit = "bit", source = "E4M3: 8 bits an entry", status = "datasheet" }

[precision.fp8.efficiency]
pretrain = { value = 1.0, low = 1.0, high = 1.053, source = "benchmarks/nci/parameters.json train.compute_multiplier/w8a8 (0.95, 1, 1), inverted", status = "measured" }
sft = { value = 1.0, low = 1.0, high = 1.053, source = "train.compute_multiplier/w8a8 (pretraining at 7B-175B), taken for SFT", status = "assumed" }
rl-elicit = { value = 1.67, low = 1.0, high = 1.67, source = "A1, measured: FP8 weights and activations train GRPO at about 60% of bf16's gain in 100 steps, inverted; low: w8a8's parity in pretraining", status = "measured" }
rl-agentic = { value = 1.67, low = 1.0, high = 1.67, source = "as rl-elicit (A1's GRPO), untested on agentic RL", status = "conjecture" }

[precision.nvfp4]
beta_x = { value = 0.26, low = 0.195, high = 0.26, source = "measured: at most 0.26 at NVFP4; low: the cheapest boundary's 0.195; a coder's rate, so an upper bound on what the premise may assume", status = "assumed" }
bits = { value = 4.5, unit = "bit", source = "NVFP4: a 4-bit entry and an 8-bit scale per 16", status = "datasheet" }

[precision.nvfp4.efficiency]
pretrain = { value = 1.33, low = 1.11, high = 1.82, source = "benchmarks/nci/parameters.json train.compute_multiplier/w4a4 (0.55, 0.75, 0.9), inverted", status = "measured" }
sft = { value = 1.0, low = 1.0, high = 1.75, source = "A1's follow-up, measured: NVFP4 SFT matches bf16 on the 88-bit and 2.4-kbit keys at about 1.75x and 1.0x its FLOPs", status = "measured" }
rl-elicit = { value = 1.75, low = 1.0, high = 3.0, source = "no NVFP4 RL run: between FP8 GRPO's 1/0.6 (A1) and NVFP4 SFT's 1.75 (A1 follow-up); high assumed", status = "conjecture" }
rl-agentic = { value = 1.75, low = 1.0, high = 3.0, source = "as rl-elicit", status = "conjecture" }

# The NCI library's attacker convention, for families of kind nci and nci:<id>; the carried state as family.full's.
[nci]
state_bits_cap = { value = 16, unit = "bit/param", source = "as family.full.state_bits_per_param: an exact run carries FP8 weights and one 8-bit moment", status = "assumed" }
rate_cap = { value = 2.5, unit = "bit/param", source = "benchmarks/nci/library.py ATTACKER_RATES: b_w.pretrained/frontier-lossy central", status = "declared" }
boundary_bits_cap = { value = 4, unit = "bit", source = "benchmarks/nci/library.py ATTACKER_RATES: b_a.activation/boundary-training central", status = "declared" }

