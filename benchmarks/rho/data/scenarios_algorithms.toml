# The small-model case: Qwen2.5-7B's whole state at 16 bits a parameter (1.2e11 bits) fits a server's window budget
# (about 7e11 bits), so the state-fits attack trains it unthrottled.
[scenario.onsite-h200-qwen7b]
fleet = "reference-h200"
regime = "onsite"
policy = "kimi-k2-1m-raw"
horizon = "year"
run = "qwen25-7b-pretrain"
families = ["full", "full-nvfp4", "diloco", "frozen-third", "distill-online"]

