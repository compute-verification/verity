# Scenarios over the algorithm families (rho/scenario.py): one target each, the families an adversary could train it
# with. Same keys as scenarios.toml.

[scenario.onsite-h200-kimi-rl]
fleet = "reference-h200"
regime = "onsite"
policy = "kimi-k2-1m-raw"
horizon = "year"
run = "kimi-k2-rl"
families = ["full-rl", "full-rl-nvfp4", "lora-r16", "lora-r32-attn", "lora-r1", "tinylora", "es"]

[scenario.remote-h200-kimi-rl]
