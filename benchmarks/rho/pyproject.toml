[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Every estimate's status is read from the locks (rho/lean.py), and the tests check each cited Lean name is in one.
# tests/test_envelopes.py holds the remote regime to tiers.py's terms at its DEFAULTS (imported by path), and
# tests/test_hardware.py holds the locations to the census's devices and the world fleets to its adversary.
# test_classes and test_attacks cross-check the threaded class and the shard attack against benchmarks/nci's
# implementations, imported by path (bracket.py imports catalog.py). families.Nci reads the `benchmarks/nci` library's algorithms
# and their traits. test_envelopes pins theorem.multiple_bound to the Lean text of the remote slowdown's definition
# and guarantee, and test_min_cut pins rho/min_cut.py to the min-cut bound's (alphaHE, shareF, workHEOn, and HE's,
# HEShared's and HECharged's conclusions).
# The monitoring periods are core's reporting grid's (rho/params.py: `verity/protocol.py`, which imports the wire). The output bits an incorrect proof
# block injects are the widest public size class of a block's outputs (rho/params.py and tiers.py read
# verity.circuits.partition_v2, which imports its package). The registry also reads core's per-window delta
# (profile.py, which imports verity.circuits) and the inference-only policy's calibrations (rho/params.py). It reads
# no census: data/ states the reference datacenter's machines and the world's active parameters, and
# tests/test_params.py and tests/test_hardware.py hold them to the census's deployments and adversary.
inputs = ["security/lean-audit.json", "security/Properties/lean-audit.json", "benchmarks/nci/tiers.py",
          "security/Definitions/InferenceOnly/Remote.lean", "security/Definitions/InferenceOnly/Guarantees/Remote.lean",
          "security/Definitions/InferenceOnly/Cut.lean", "security/Definitions/InferenceOnly/Guarantees/Cut.lean",
          "benchmarks/census/hardware.json", "benchmarks/census/adversary.json", "benchmarks/nci/bracket.py",
          "benchmarks/nci/catalog.py", "benchmarks/nci/algorithms.json",
          "verity/__init__.py", "verity/errors.py", 
          "verity/protocol.py", "verity/channel.py", "verity/circuits",
          "verity/protocols/proofs/spot/verifier/profile.py", "benchmarks/census/deployments.json", "benchmarks/nci/calibrations.json",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/policy/__init__.py", "verity/protocols/proofs/spot/__init__.py", "verity/protocols/proofs/spot/verifier/__init__.py",
          "verity/protocols/policy/inference_only/__init__.py"]
