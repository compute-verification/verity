[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Every estimate's status is read from the locks (rho/lean.py), and the tests check each cited Lean name is in one.
# tests/test_regimes.py holds the remote regime to tiers.py's terms at its DEFAULTS (imported by path), and
# tests/test_hardware.py holds the locations to the census's devices.
inputs = ["Security/lean-audit.json", "Security/Properties/lean-audit.json", "benchmarks/nci/tiers.py",
          "benchmarks/census/hardware.json"]
