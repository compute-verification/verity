[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Every estimate's status is read from the locks (rho/lean.py), and the tests check each cited Lean name is in one.
inputs = ["Security/lean-audit.json", "Security/Properties/lean-audit.json",
          # families.Nci reads the NCI library's algorithms and their traits
          "benchmarks/nci/algorithms.json"]
