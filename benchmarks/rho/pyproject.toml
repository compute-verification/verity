[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Every estimate's status is read from the locks (rho/lean.py), and the tests check each cited Lean name is in one.
# test_classes and test_attacks cross-check the threaded class and the shard attack against benchmarks/nci's
# implementations, imported by path (slowdown.py imports catalog.py).
inputs = ["Security/lean-audit.json", "Security/Properties/lean-audit.json", "benchmarks/nci/slowdown.py",
          "benchmarks/nci/catalog.py"]
