[project]
name = "verity-proof-throughput"
version = "0.1.0"
description = "The proof system's throughput on GLM-5.3's dot products: VU per second over the batch size."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-numerical", "verity-flock", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_proof_throughput"]

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-numerical = { workspace = true }
verity-flock = { workspace = true }

[tool.verity.tests]
# The contract (verity_numerical.bench.contract) reads the census when it is imported; verity_flock.class_statement, which
# draws the instances, imports circuit_check without declaring it.
inputs = ["benchmarks/census", "tools/verity/circuit_check/src/circuit_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
