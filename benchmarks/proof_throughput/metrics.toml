[[metric]]
id = "proofs/proof-throughput-blocks-per-second"
title = "Proof blocks proved a second"
owner = "proofs"
unit = "proof blocks a second"
axis = "Proof blocks a second Flock's prover proves, zero knowledge off, on one model's bf16 dot-product coordinate at its served K (Llama 3.2 1B's K = 2048, GLM-5.3's K = 6144) over stand-in values, 64 proof blocks a session sampled by the verifier's stratified design, counting only sessions the Lean verifier accepted; one line a model and prover count, as its member names it (the model, the card, then how many provers prove at once, each on a card and cores of its own on one node, which the reading names)."
better = "higher"
command = "research run --on NODE --project verity --source . --cwd source --timeout 60m -- uv run --extra torch-cpu python benchmarks/proof_throughput/run.py record --workload bf16-k2048 --B 64 --provers 1,2 --cards CARDS --cores CORES"
every = "7d"
