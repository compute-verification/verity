# PoUS's benchmarks and their tests. Not a package: the drivers run on a GPU pod (torch/Triton), their CPU reference
# invariants run here as a suite (`uv run tools/check/suites.py benchmarks/pous`), so `check` keeps them pinned.
[tool.pytest.ini_options]
testpaths = ["hbm_audit/tests", "erase_calib/tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
