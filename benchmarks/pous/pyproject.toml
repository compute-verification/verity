# PoUS's benchmarks and their tests. Not a package: the drivers run on a GPU pod (torch/Triton), their CPU reference
# invariants run here as a suite (`uv run tools/verity/check/suites.py benchmarks/pous`), so `check` keeps them pinned.
[tool.pytest.ini_options]
testpaths = ["tests", "hbm_audit/tests", "erase_calib/tests", "fast_decode/tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# tests/ checks the harness against PoUS itself (verity.core.protocols.pous) and the census's hardware ids;
# pod.sh runs bench/placement.py's deployment gate (GATE_ROLE). Of `verity`, what the tests import, and what the `lake` they
# run and the Lean programs they start (pous-timed-audit, memory-challenger-verdict) read, which no tracer sees: those
# packages and their path dependencies (each lakefile's `[[require]]`).
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/claims/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/pous", "verity/core/protocols/interface",
          "verity/core/protocols/record.py",
          "verity/core/service/flock", "verity/core/primitives/identity", "verity/core/primitives/randomness",
          "verity/core/primitives/lms", "verity/core/difftest", "verity/core/devices/memory_challenger",
          "verity/ml/__init__.py", "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness",
          "benchmarks/census/hardware.json", "benchmarks/numerical/python/verity_numerical/bench/placement.py",
          # the remote bandwidth audit over the P2 store, which p2_v1/serve.py runs, and what it imports
          "verity/core/protocols/remote_bandwidth", "verity/core/protocols/profile.py",
          "verity/core/protocols/sampled_proofs/__init__.py", "verity/core/protocols/sampled_proofs/challenger.py",
          "verity/core/protocols/sampled_proofs/remote.py", "verity/ml/circuits",
          # p2_v1/bandwidth.py serves the store through kernels' staging decode, whose modules it imports
          "benchmarks/torch_gpu/p2_stage/layout.py", "benchmarks/torch_gpu/p2_stage/stage.py",
          "benchmarks/torch_gpu/p2_stage/full.py", "benchmarks/torch_gpu/p2_stage/gemm.py",
          # served_piece.py holds the served weights as C* through the vLLM adapter, which imports these
          "integrations/vllm/verity_vllm/__init__.py", "integrations/vllm/verity_vllm/config.py",
          "integrations/vllm/verity_vllm/settings.py", "integrations/vllm/verity_vllm/records/__init__.py",
          "integrations/vllm/verity_vllm/records/fields.py", "integrations/vllm/verity_vllm/records/workload.py",
          "integrations/vllm/verity_vllm/protocols/__init__.py", "integrations/vllm/verity_vllm/protocols/interface.py",
          "integrations/vllm/verity_vllm/protocols/pous.py", "integrations/vllm/verity_vllm/engine/__init__.py",
          "integrations/vllm/verity_vllm/engine/hooks.py",
          # its test reads the answer back as the composed run does: its row (and the core answer's decoder, with what
          # that module imports) and the block record's leg
          "benchmarks/one_stage/served_verdicts.py", "demos/h200/interfaces/verity_e2e_demo/block_record.py",
          "verity/core/protocols/pouw/__init__.py", "verity/core/protocols/pouw/audit.py",
          "verity/core/protocols/pouw/coins.py", "verity/core/protocols/pouw/core_check.py",
          "verity/core/protocols/pouw/protocol.py", "verity/core/protocols/pouw/salt.py",
          "verity/core/protocols/pouw/window.py", "verity/core/protocols/sampled_proofs/one_stage/__init__.py",
          "verity/core/protocols/sampled_proofs/one_stage/partition.py",
          "verity/core/protocols/sampled_proofs/one_stage/registered.py",
          # the deployment layer and its wire, which the memory challenger's and the wipe's sides are started through
          # (`deploy.stream.Side`) and the challenger's parties run on
          "verity/core/deploy", "verity/core/wire"]
