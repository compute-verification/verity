# PoUS's benchmarks and their tests. Not a package: the drivers run on a GPU pod (torch/Triton), their CPU reference
# invariants run here as a suite (`uv run tools/verity/check/suites.py benchmarks/pous`), so `check` keeps them pinned.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_pous_harness.py",
    "tests/test_pous_onsite_cases.py",
    "tests/test_pous_p2_bandwidth.py",
    "tests/test_pous_p2v1.py",
    "tests/test_pous_served_case.py",
    "tests/test_pous_served_piece_sh.py",
    "tests/test_pous_served_wipe.py",
]
# tests/ checks the harness against PoUS itself (verity.protocols.accounting.pous.verifier) and the census's hardware ids;
# pod.sh runs bench/placement.py's deployment gate (GATE_ROLE). Of `verity`, what the tests import, and what the `lake` they
# run and the Lean programs they start (pous-timed-audit, memory-challenger-verdict) read, which no tracer sees: those
# packages and their path dependencies (each lakefile's `[[require]]`).
inputs = ["verity/protocols/proofs/spot/device/coins.py", "verity/protocols/proofs/spot/verifier/one_stage/link_points.py",
          "verity/__init__.py", "verity/errors.py", "verity/claims/__init__.py", "verity/protocols/accounting/pous",
          "verity/protocols/interface", "verity/protocols/accounting/pous/prover",
          "verity/protocols/proofs/flock/verifier", "verity/commitments/identity", "verity/commitments/randomness",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "verity/commitments/lms", "tools/difftest", "verity/protocols/accounting/pous/device",
          "verity/commitments", "verity/commitments/crypto",
          "verity/commitments/randomness",
          "benchmarks/census/hardware.json", "benchmarks/numerical/python/verity_numerical/bench/placement.py",
          # the remote bandwidth audit over the P2 store, which p2_v1/serve.py runs, and what it imports; its party's
          # Lean verifier, `remote-audit-verifier`, which `p2_party` has `lake` build in remote_bandwidth/lean
          "verity/protocols/accounting/poub/verifier", "verity/protocols/proofs/spot/verifier/profile.py",
          "verity/protocols/proofs/spot/verifier/__init__.py", "verity/protocols/proofs/spot/device/challenger.py",
          "verity/protocols/proofs/spot/device/remote.py", "verity/circuits",
          # p2_v1/bandwidth.py serves the store through kernels' staging decode, whose modules it imports
          "benchmarks/torch_gpu/p2_stage/layout.py", "benchmarks/torch_gpu/p2_stage/stage.py",
          "benchmarks/torch_gpu/p2_stage/full.py", "benchmarks/torch_gpu/p2_stage/gemm.py",
          # served_piece.py holds the served weights as C* through the vLLM adapter, which imports these
          "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/config.py",
          "adapters/vllm/verity_vllm/settings.py", "tools/config/verity_config/verity_settings.py", "adapters/vllm/verity_vllm/records/__init__.py",
          "adapters/vllm/verity_vllm/records/fields.py", "adapters/vllm/verity_vllm/records/workload.py",
          "adapters/vllm/verity_vllm/protocols/__init__.py", "adapters/vllm/verity_vllm/protocols/interface.py",
          "adapters/vllm/verity_vllm/protocols/pous.py", "adapters/vllm/verity_vllm/engine/__init__.py",
          "adapters/vllm/verity_vllm/engine/hooks.py",
          # its test reads the answer back as the composed run does: its row (and the core answer's decoder, with what
          # that module imports) and the block record's leg
          "benchmarks/one_stage/served_verdicts.py", "benchmarks/one_stage/interfaces/verity_e2e_demo/block_record.py",
          "benchmarks/census/deployments.json",
          "verity/protocols/accounting/pouw/verifier/__init__.py", "verity/protocols/accounting/pouw/verifier/audit.py",
          "verity/protocols/accounting/pouw/verifier/coins.py", "verity/protocols/accounting/pouw/verifier/core_check.py",
          "verity/protocols/proofs/spot/verifier/one_stage/registration.py",
          "verity/protocols/proofs/spot/verifier/one_stage/draw.py",
          "verity/protocols/proofs/spot/verifier/one_stage/verdict.py",
          "verity/protocols/accounting/pouw/verifier/protocol.py", "verity/protocols/accounting/pouw/verifier/salt.py",
          "verity/protocols/accounting/pouw/verifier/window.py", "verity/protocols/proofs/spot/verifier/one_stage/__init__.py",
          "verity/protocols/proofs/spot/verifier/one_stage/partition.py",
          "verity/protocols/proofs/spot/verifier/one_stage/registered.py",
          # the deployment layer and its wire, which the memory challenger's and the wipe's sides are started through
          # (`deploy.stream.Side`) and the challenger's parties run on
          "verity/config.py", "verity/party.py", "verity/protocol.py", "verity/runtime", "verity/channel.py", "verity/tests/tests/test_channel.py",
          "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/poub/__init__.py", "verity/protocols/proofs/spot/__init__.py", "verity/protocols/proofs/spot/device/__init__.py",
          "verity/protocols/accounting/pouw/__init__.py", "benchmarks/numerical/python/verity_numerical/__init__.py", "benchmarks/one_stage/interfaces/verity_e2e_demo/__init__.py", "benchmarks/numerical/python/verity_numerical/bench/__init__.py",
          # p2_v1/store.py gives the store as the circuit requirement's `Store`, whose module reads the census
          "verity/definitions/__init__.py",
          "verity/circuits/census.py", "verity/circuits/requirement.py",
          # the P2 store's default weights generator (`p2_v1/store.py`'s `GENERATOR`), which its test lays out and commits
          "benchmarks/torch_gpu/p2_stage/served_weights.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_pous_wipe_resume.py"]
paths = ["verity/config.py", "verity/party.py", "verity/protocol.py", "verity/runtime", "verity/protocols/accounting/pous", "verity/channel.py", "verity/tests/tests/test_channel.py"]
