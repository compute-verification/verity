# PoUS's benchmarks and their tests. Not a package: the drivers run on a GPU pod (torch/Triton), their CPU reference
# invariants run here as a suite (`uv run tools/verity/check/suites.py benchmarks/pous`), so `check` keeps them pinned.
[tool.pytest.ini_options]
testpaths = ["tests", "hbm_audit/tests", "erase_calib/tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# tests/ checks the harness against PoUS itself (verity.experimental.protocols.pous) and the census's hardware ids;
# pod.sh runs bench/placement.py's deployment gate (GATE_ROLE).
inputs = ["verity", "benchmarks/census/hardware.json", "benchmarks/numerical/python/verity_numerical/bench/placement.py"]
