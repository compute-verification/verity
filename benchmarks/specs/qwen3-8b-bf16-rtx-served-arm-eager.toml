schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "qwen3-8b-bf16-rtx-served-arm-eager"
# qwen3-8b-bf16-rtx-served-arm with the eager Commit (commit-rows-4k-eager, control stock) in place of the compiled one.
arms = ["stock", "stock@compiled", "commit-rows-4k-eager"]
arm_modules = ["served_commit.served_arm:EAGER_ROWS_4K"]
sweep = "width"
reps = 3
eager = true

[arm_settings."stock@compiled"]
control = "none"

[preset]
id = "qwen3-8b-bf16-rtx-served-arm-eager"
model = "Qwen/Qwen3-8B"
revision = "b968826d9c46dd6066d109eabc6255188de91218"
case = "QWEN3_8B"
precision = "bfloat16"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
max_model_len = 4096
resident_gpu_memory_utilization = 0.25
block_gpu_memory_utilization = 0.80
resident_kv_cache_memory_bytes = 4294967296
block_kv_cache_memory_bytes = 4294967296

[admission]
max_minutes = 120
