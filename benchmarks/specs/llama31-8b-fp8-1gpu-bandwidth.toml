schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-fp8-1gpu-bandwidth"
# PoUS's bandwidth audit on served inference: memory accounting's plain stack (bandwidth-plain) and its encoded,
# receipted stack (bandwidth-audit, gated against bandwidth-plain), each with the fill-sk16 filler over the paged KV pool.
arms = ["stock-fp8", "bandwidth-plain", "bandwidth-audit"]
arm_modules = ["benchmarks.vllm_encoded.bench_arm:PLAIN", "benchmarks.vllm_encoded.bench_arm:AUDIT"]
sweep = "quick"
reps = 3
eager = false
# The arms' libraries, built from the dispatched commit.
setup = "benchmarks/harness/setup/vllm_encoded.sh"

[env]
FLASHINFER_CUDA_ARCH_LIST = "12.0f"
# The re-baseline's quoted quick ratios (14 Oct, art:c3ee801d...) are with KV receipts on.
VERITY_VLLM_BENCH_KV_RECEIPTS = "on"

[preset]
id = "llama31-8b-fp8-1gpu-bandwidth"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 16384
# MEM-15: every isolated (block-mode) engine of one arm group gets the same exact KV pool (llama31-8b-fp8-1gpu's).
block_kv_cache_memory_bytes = 60129542144

[admission]
max_minutes = 120
