schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-fp8-1gpu-compiled-full"
# llama31-8b-fp8-1gpu-compiled (its arms, preset and settings, the preset renamed with the spec) over the full sweep: the factor that restates
# an eager ratio as a served one, at batch 1/8/32/128, prompt 512 and 8192, and decode-heavy, prefill-heavy and mixed
# traffic, since the quick sweep's two points disagreed (b32 0.559x, b8 0.346x under host load ~200).
arms = ["stock-fp8", "stock-fp8@eager", "stock-fp8@compiled"]
sweep = "full"
reps = 3
eager = true

[arm_settings."stock-fp8@eager"]
control = "none"

[arm_settings."stock-fp8@compiled"]
control = "none"

[preset]
id = "llama31-8b-fp8-1gpu-compiled-full"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 4096
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
