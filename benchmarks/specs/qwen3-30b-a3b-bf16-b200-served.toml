schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "qwen3-30b-a3b-bf16-b200-served"
# The Commit as served_commit measures it: rows-sha512 (prof_arm's rows arm). Its runs before 27 Oct measured served-commit and
# served-commit-noretain, vllm-v1 (SHA-256), which their arms now refuse to run.
arms = ["stock", "served-commit-rows"]
arm_modules = ["served_commit.prof_arm:SERVED_COMMIT_ROWS"]
sweep = "served"
reps = 3
eager = false

[preset]
id = "qwen3-30b-a3b-bf16-b200-served"
model = "Qwen/Qwen3-30B-A3B"
revision = "ad44e777bcd18fa416d9da3bd8f70d33ebb85d39"
case = "QWEN3_30B_A3B"
precision = "bfloat16"
gpu_id = "b200"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
serving_defaults = true
max_model_len = 4096
# About 57 GiB of weights per engine: the second engine's startup refuses on free memory, so the arms run in blocks.
resident_gpu_memory_utilization = 0.60
block_gpu_memory_utilization = 0.80
resident_kv_cache_memory_bytes = 10737418240
block_kv_cache_memory_bytes = 10737418240
# As the B200 Build's row declares: on cc 10.0 vLLM would serve FlashInfer attention and TRT-LLM bf16 experts, which have no
# Definitions; Triton's fused_moe_kernel experts are bound (acquire.served_moe).
attention_backend = "FLASH_ATTN"
attention_config = { flash_attn_version = 2 }
moe_backend = "triton"

[admission]
max_minutes = 120
