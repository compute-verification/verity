schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-1gpu-pearl-c-whole-served-h200"
# `llama31-8b-1gpu-pearl-c-whole-served` on one H200 (sm_90a): Pearl-C's whole-step arm (`bench_arm.PearlCWholeArm`) on
# pearl_c_sm90's kernels under `pearl-c-h100-v1-h3` (the setup exports PEARLC_KERNEL and PEARLC_CUBIN), beside vLLM's
# serving defaults (`stock-fp8@compiled`), in one run under one host load. The preset and the whole arm's settings are that
# spec's: vLLM's FULL_DECODE_ONLY graphs at the capture sizes without torch.compile, at the `compiled` label, the serial
# schedule with `whole_defer` and `whole_defer_a`, and as its gate the call check with the calls graphed and
# `e2e.whole_check`. The PoUW option's protocol arm runs sm_120's kernels alone, so it isn't here.
arms = ["stock-fp8@compiled", "pouw-pearl-c-whole"]
arm_modules = ["benchmarks.pouw.pearl_c_vllm.bench_arm:PEARL_C_WHOLE"]
sweep = "quick"
reps = 3
eager = true
setup = "benchmarks/harness/setup/pearl_c_sm90.sh"

[arm_settings."stock-fp8@compiled"]
control = "none"

[preset]
id = "llama31-8b-1gpu-pearl-c-whole-served-h200"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "h200"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 4096
max_num_seqs = 128
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
