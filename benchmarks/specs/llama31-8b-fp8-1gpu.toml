schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-fp8-1gpu"
arms = ["stock", "stock-fp8"]
sweep = "quick"
reps = 3
eager = false

[preset]
id = "llama31-8b-fp8-1gpu"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 16384
# Every isolated (`blocks`) engine of one arm group gets the same exact KV pool, or vLLM schedules the arms
# differently at over-pool points and their greedy tokens can diverge (the kv-pool gate catches it).
block_kv_cache_memory_bytes = 60129542144

[admission]
max_minutes = 120
