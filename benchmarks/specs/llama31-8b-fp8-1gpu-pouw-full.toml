schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-fp8-1gpu-pouw-full"
# llama31-8b-fp8-1gpu-pouw over the full sweep: the Pearl-C arm against stock FP8, eager.
arms = ["stock-fp8", "pouw-pearl-c"]
arm_modules = ["benchmarks.pouw.pearl_c_vllm.bench_arm:PEARL_C"]
sweep = "full"
reps = 3
eager = true
# The arm's cubin, built and SASS-gated from the dispatched commit.
setup = "benchmarks/harness/setup/pearl_c.sh"

[preset]
id = "llama31-8b-fp8-1gpu-pouw-full"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 16384
# MEM-15: every isolated (block-mode) engine of one arm group gets the same exact KV pool, or vLLM schedules the arms
# differently at over-pool points and their greedy tokens can diverge (#2036's kv-pool gate catches it).
block_kv_cache_memory_bytes = 60129542144

[admission]
max_minutes = 120
