schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-fp8-1gpu-compiled"
# Stock FP8 as vLLM serves it, against the eager stock FP8 every protocol row is timed against: the factor that restates
# an eager ratio R as a served one (the protocol's eager time over stock's compiled time is R times this row's
# stock-fp8 / stock-fp8@compiled). The preset is llama31-8b-1gpu-pouw-protocol's (its 4,096-token step budget and 8 GiB
# KV pin in both modes), so `stock-fp8` is that row's baseline engine: eager through verity_vllm.LLM, which builds it
# batch invariant (`bi-eager`). `stock-fp8@eager` is the same engine at vLLM's serving defaults, eager and not batch
# invariant, and `stock-fp8@compiled` at its serving defaults compiled (torch.compile with vLLM's CUDA-graph mode), so
# the factor splits into batch invariance's cost and compilation's gain.
#
# Neither variant is token-controlled: each execution runs other kernels and its greedy tokens differ, with equal KV
# pools (65536 tokens). Gated at 11b103ff, `@eager` against `stock-fp8` diverged at the first output token (b8: 1 of 8
# requests, r20261023-193006-847b; b32: 20 of 32, r20261023-193036-5e48) and `@compiled` against `@eager` within three
# (b8: 1 of 8 at position 0; b32: 19 of 32, first at position 2). Each is timed on its own gated tokens (timed-tokens).
arms = ["stock-fp8", "stock-fp8@eager", "stock-fp8@compiled"]
sweep = "quick"
reps = 3
eager = true

[arm_settings."stock-fp8@eager"]
control = "none"

[arm_settings."stock-fp8@compiled"]
control = "none"

[preset]
id = "llama31-8b-fp8-1gpu-compiled"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 4096
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
