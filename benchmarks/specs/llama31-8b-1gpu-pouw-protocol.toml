schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-1gpu-pouw-protocol"
# PoUW through its protocol option (`pouw:pearl-c-sm120-v1-h3`, `verity_vllm.LLM(protocols=...)`), gated token for token
# against stock FP8. Pearl-C reads the BF16 checkpoint's weights (widened to FP32 words) and quantizes them itself, so the
# arm's engine loads BF16; its pouw settings are the device, the kernel directory, the cubin the setup builds from the
# dispatched commit, and the served (deferred) schedule; the harness adds an in-process challenger of epoch 0 as its coins
# and makes each engine step one Pearl-C pass. PoUW refuses compiled execution, so every arm runs eager. The step budget
# (4,096 tokens, every arm's, so the control sees the same schedule) bounds Pearl-C's per-shape buffers, which sit beside
# vLLM's budget, and the KV pool is pinned for every arm in either mode.
arms = ["stock-fp8", "pouw:pearl-c-sm120-v1-h3"]
sweep = "quick"
reps = 3
eager = true
setup = "benchmarks/harness/setup/pearl_c.sh"

[arm_settings."pouw:pearl-c-sm120-v1-h3"]
precision = "bfloat16"
control = "stock-fp8"

[arm_settings."pouw:pearl-c-sm120-v1-h3".protocols_config.pouw]
device = "cuda"
kernel = "benchmarks/pouw/pearl_c_sm120"
cubin = "$PEARLC_CUBIN"
schedule = "deferred"

[preset]
id = "llama31-8b-1gpu-pouw-protocol"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 4096
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
