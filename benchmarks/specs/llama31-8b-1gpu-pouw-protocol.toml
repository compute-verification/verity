schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-1gpu-pouw-protocol"
# PoUW through its protocol option (`pouw:pearl-c-sm120-v1-h3`, `verity_vllm.LLM(protocols=...)`), timed against stock FP8.
# Pearl-C reads the BF16 checkpoint's weights (widened to FP32 words) and quantizes them itself, so the arm's engine loads
# BF16; its pouw settings are the device, the kernel directory, the cubin the setup builds from the dispatched commit, and
# the served (deferred) schedule; the harness adds an in-process challenger of epoch 0 as its coins and makes each engine
# step one Pearl-C pass. PoUW refuses compiled execution, so every arm runs eager. The step budget (4,096 tokens, every
# arm's) bounds Pearl-C's per-shape buffers, which sit beside vLLM's budget, and the KV pool is pinned for every arm.
#
# No stock arm is its token control: Pearl-C's y carries the epoch's live salt, so its tokens repeat within one install
# and differ across installs. Against stock FP8 the quick points diverged at the first output token (b8: 3 of 8
# requests, r20261020-234327-ca7c; b32: 27 of 32, r20261020-234348-0a1b), against stock BF16 within two tokens (b8: 5 of
# 8, r20261020-234356-9bf3; b32: 21 of 32, r20261020-234405-d1fa). Its own gate is the experimental arm's call check on
# the installed run (y against x·Wᵀ at every (n, k), the commitment twice, the negative control), before and after the
# timed reps.
arms = ["stock-fp8", "pouw:pearl-c-sm120-v1-h3"]
sweep = "quick"
reps = 3
eager = true
setup = "benchmarks/harness/setup/pearl_c.sh"

[arm_settings."pouw:pearl-c-sm120-v1-h3"]
precision = "bfloat16"
control = "none"

[arm_settings."pouw:pearl-c-sm120-v1-h3".protocols_config.pouw]
device = "cuda"
kernel = "benchmarks/pouw/pearl_c_sm120"
cubin = "$PEARLC_CUBIN"
schedule = "deferred"

[preset]
id = "llama31-8b-1gpu-pouw-protocol"
model = "unsloth/Llama-3.1-8B"
revision = "3f0d51f8e5640f98f1a96ea9044a0e55c0a83814"
case = "LLAMA31_8B"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 4096
resident_kv_cache_memory_bytes = 8589934592
block_kv_cache_memory_bytes = 8589934592

[admission]
max_minutes = 120
