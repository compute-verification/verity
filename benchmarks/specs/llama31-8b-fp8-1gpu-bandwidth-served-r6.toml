schema = "verity-bench/vllm-spec/v0"
backend = "vllm"
id = "llama31-8b-fp8-1gpu-bandwidth-served-r6"
# llama31-8b-fp8-1gpu-bandwidth's arms and settings, plus stock FP8 as vLLM serves it, so PoUS's bandwidth audit has a
# ratio to compiled serving as well as to stock on its own graph path, at 6 reps, an even count, so drift over the run
# cancels in each arm's mean (the harness README's "How a point is timed"). The graph arms replay decode-only CUDA graphs at capture_sizes with no torch.compile (compilation mode 0,
# FULL_DECODE_ONLY); `stock-fp8@compiled` builds at vLLM's serving defaults (torch.compile, vLLM's own CUDA-graph mode
# and capture sizes). Compiled and graph-path FP8 tokens differ, so the compiled arm is uncontrolled and timed on its own
# gated tokens.
arms = ["stock-fp8", "bandwidth-plain", "bandwidth-audit", "stock-fp8@compiled"]
arm_modules = ["benchmarks.vllm_encoded.bench_arm:PLAIN", "benchmarks.vllm_encoded.bench_arm:AUDIT"]
sweep = "quick"
reps = 6
warmups = 2
max_warmups = 8
eager = false
setup = "benchmarks/harness/setup/vllm_encoded.sh"

[arm_settings."stock-fp8@compiled"]
control = "none"

[env]
FLASHINFER_CUDA_ARCH_LIST = "12.0f"
VERITY_VLLM_BENCH_KV_RECEIPTS = "on"

[preset]
id = "llama31-8b-fp8-1gpu-bandwidth-served-r6"
model = "/workspace/pouw/mvp-e2e/models/llama-3.1-8b-instruct"
model_digest = "98e25b0ecbb3eff924ea9fad4673feea9ea6457d2f45db5b5b60e88205de1daa"
precision = "fp8"
gpu_id = "rtx-pro-6000"
gpu_count = 1
vllm_pin = "d9105ea8001e0a6d77a96327d17515bb5791fb36"

[preset.engine_settings]
cuda_graphs = true
capture_sizes = [1, 8, 32, 128]
max_model_len = 8384
resident_gpu_memory_utilization = 0.40
block_gpu_memory_utilization = 0.80
max_num_batched_tokens = 16384
block_kv_cache_memory_bytes = 60129542144

[admission]
max_minutes = 120
