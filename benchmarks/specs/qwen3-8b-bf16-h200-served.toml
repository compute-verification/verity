arms = ["stock", "served-commit", "served-commit-noretain"]
arm_modules = ["served_commit.arm:SERVED_COMMIT", "served_commit.arm:SERVED_COMMIT_NORETAIN"]
sweep = "served"
reps = 3
eager = false

[preset]
id = "qwen3-8b-bf16-h200-served"
model = "Qwen/Qwen3-8B"
