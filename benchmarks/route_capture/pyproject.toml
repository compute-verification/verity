# The route capture (README.md). Not a package: its runs use a node's pinned vLLM venv; the suite runs the plugin on
# stand-ins for V1's and V2's model runners (the methods it wraps, as vLLM d9105ea80 has them) and torch's profiler, and
# reads back what it wrote (routes.py).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the plugin patches through the integration's hooks, routes.py reads traces with its kernel_trace, settings.py is built on
# verity_config's registry, and gap.py evaluates the class G decoder (`program.predict.dsa`, which reads most of the
# integration, the Definitions' registry, the circuits it builds and the seed rule's SHA-512 gates) on class G's workload row
# and the capture map; the row is a stored workload, which `config.row_file` checks against its directory's SHA256SUMS and
# fetches by its art id
inputs = [
    "fixtures/artifacts.json",
    "tools/config/verity_config",
    "verity/__init__.py",
    "verity/errors.py",
    "verity/settings.py",
    "verity/circuits",
    "verity/commitments",
    "verity/commitments/crypto",
    "verity/definitions",
    "verity/definitions/kernels",
    "adapters/vllm/verity_vllm",
    "adapters/vllm/manifests/capture-maps/glm-moe-dsa-eager-hopper-tp8-v0.json",
    "adapters/vllm/workloads/SHA256SUMS",
    "adapters/vllm/workloads/glm53__fp8__h200__tp8__b8__i256__o32__mixed-arrivals__greedy__eager.json",
          "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/pouw/__init__.py", "verity/protocols/spot/__init__.py", "verity/protocols/spot/device/__init__.py"]
