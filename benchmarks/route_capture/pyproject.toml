# The route capture (README.md). Not a package: its runs use a node's pinned vLLM venv; the suite runs the plugin on
# stand-ins for V1's and V2's model runners (the methods it wraps, as vLLM d9105ea80 has them) and torch's profiler, and
# reads back what it wrote (routes.py).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the plugin patches through the integration's hooks, routes.py reads traces with its kernel_trace, settings.py is built on
# verity_config's registry, and gap.py evaluates the class G decoder (`program.predict.dsa`, which reads most of the
# integration, the Definitions' registry and the circuits it builds) on class G's workload row and the capture map
inputs = [
    "tools/config/verity_config",
    "verity/__init__.py",
    "verity/errors.py",
    "verity/settings.py",
    "verity/ml/__init__.py",
    "verity/ml/circuits",
    "verity/ml/definitions",
    "verity/ml/kernels",
    "integrations/vllm/verity_vllm",
    "integrations/vllm/manifests/capture-maps/glm-moe-dsa-eager-hopper-tp8-v0.json",
    "integrations/vllm/workloads/glm53__fp8__h200__tp8__b8__i256__o32__mixed-arrivals__greedy__eager.json",
]
