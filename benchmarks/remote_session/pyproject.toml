# The remote bandwidth audit's sessions end to end: the verifier's process (`verifier.py`), the prover's (`prover.py`,
# its GPU backend `device.py` and `session.cu`, and `inplace.py`, its pass over vLLM's tensors where they are), and their
# wire (`wire.py`). Not a package: `run.sh` runs both on a GPU node (`inplace.sh` gates the in-place pass), and the suite
# runs both over a loopback socket with the driver's reference as the prover's backend
# (`uv run tools/verity/check/suites.py benchmarks/remote_session`). `serve.py` is vLLM serving as the prover, which
# `tests/test_vllm_serve.py` runs where vLLM, a GPU and the vLLM integration's `StoreBackend` are. `sampling_inputs.py`
# reads a run's `verifier.json` for the audit's side of a sampling plan: ε, the line and the serving cost. `auditor_line.py`
# reads a gate run's memory line on the auditor's clock, computed by the Lean verifier (its `line` request) and held
# exactly to `line.py`'s: each group's coin and last root from the challenger's signed
# release log, read through the auditor's ledger, the verifier's stamps only a cross-check; it credits a session only when
# its period committed the verifier that ran it, it and its period closed complete, the Lean accepted it, the host's pins
# log records its pin as main's, and the verifier bound the store to the pinned model; every line says it is conditional
# on NoOutsideCompute, and `--boundary` (off by default) holds each session's credit to the network certifiers' records
# of the gate node's boundary. That store, what a pinned
# checkpoint alone fixes, and the binding the verifier decides (`verifier.py --model`) are the remote audit's own
# (`verity/core/protocols/remote_bandwidth/store.py`); `store_layout.py` writes pins and synthetic checkpoints.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py", "verity/settings.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/profile.py", "verity/core/protocols/remote_bandwidth", "verity/ml/__init__.py",
          "verity/core/protocols/record.py",
          "verity/ml/circuits", "verity/ml/crypto", "verity/ml/commitments", "verity/ml/randomness",
          # the challenger's coins name their claim instance (sampled_proofs/challenger.py's `coin_claim`)
          "verity/core/claims/__init__.py",
          # the Lean verifier the sessions run beside audit.AuditRun, which computes auditor_line.py's line
          # (lean_verifier.py): what `lake build remote-audit-verifier` reads, the remote audit's package and its
          # path requires
          "verity/core/service/flock/Flock", "verity/core/service/flock/lakefile.toml",
          "verity/core/service/flock/lake-manifest.json", "verity/core/service/flock/lean-toolchain",
          "verity/core/primitives/randomness", "verity/core/difftest/lean",
          # a transcript replayed through both verifiers (the remote audit's lean/tests/replay.py, over the difftest)
          "verity/core/difftest/python",
          # engine.py's kv.so (test_store_layout imports it) opens through the benchmarks' one loader
          "benchmarks/word_codec/cuda_lib.py",
          # test_vllm_serve.py, where vLLM and a GPU are: the integration's store and what it imports
          "verity/core/protocols/bandwidth",
          # test_sampling_inputs.py: sampling_inputs.py prices an opening with sampled proofs' one cost fit
          "verity/core/protocols/sampled_proofs",
          # auditor_line.py --boundary: the network certifiers' records of the gate node's boundary and their audit
          "verity/core/protocols/certifier",
          # test_challengers.py: challengers.Gate against the auditor host's gate, its sessions served by serve.py
          "benchmarks/live_challenger/auditor.py", "benchmarks/live_challenger/host.json", "benchmarks/live_challenger/serve.py",
          "benchmarks/live_challenger/tests/stub_serve.py",
          "integrations/vllm/verity_vllm/settings.py", "integrations/vllm/verity_vllm/__init__.py", "integrations/vllm/verity_vllm/config.py",
          "integrations/vllm/verity_vllm/engine", "integrations/vllm/verity_vllm/protocols/remote_bandwidth"]
