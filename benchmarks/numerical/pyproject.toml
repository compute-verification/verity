[project]
name = "verity-numerical"
version = "0.1.0"
description = "Numerical work shared by the proof backends: the bench spine (result contract, workloads, lowerings, tables), source-close and independent references for the first subcircuit, the reference checker, witness generators, range lemmas, soundness accounting and adversarial search."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-vllm", "z3-solver>=4.13", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_numerical"]

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-vllm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the bench spine's tests drive every backend family, and the dot-product workload,
# over the repository's fixtures and census; tests/bench/test_bench_judge.py runs benchmarks/judge.py; test_unit_costs_menu.py
# holds the Lean menu (VStar.Menu.Pinned) to the pinned menu.json it is generated from.
inputs = ["verity/core/service/flock/VStar/Menu/Pinned.lean", "archive/direct", "verity/ml/flock", "archive/gkr", "archive/ligero-verify", "archive/sp1", "archive/sp1/benchmarks/dot_product", "benchmarks/judge.py", "benchmarks/census", "fixtures", "fixtures/redteam-3/logup-union/README.md"]
parallel = true
