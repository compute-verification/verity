[project]
name = "verity-numerical"
version = "0.1.0"
description = "Numerical work shared by the proof backends: the bench spine (result contract, workloads, lowerings, cell checks), source-close and independent references for the first subcircuit, the reference checker, witness generators and range lemmas."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-vllm", "z3-solver>=4.13", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_numerical"]

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-vllm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/bench/test_input_sets.py", "tests/bench/test_lowerings.py", "tests/bench/test_served_templates.py"]
# Test-only: the bench spine's tests drive Flock's lowerings over the repository's fixtures and census; test_unit_costs_menu.py
# holds the Lean menu (VStar.Menu.Pinned) to the pinned menu.json it is generated from; test_census_data.py reads each census
# workload's regression expectations, most of them fetched fixtures.
inputs = ["verity/protocols/flock/verifier/VStar/Menu/Pinned.lean", "verity/protocols/flock/prover", "verity/protocols/flock/pod", "verity/protocols/flock/agreement", "verity/protocols/flock/tool.py", "benchmarks/census", "fixtures",
          "adapters/vllm/tests/regression/expected",
          "adapters/vllm/tests/__init__.py", "adapters/vllm/tests/regression/__init__.py"]
parallel = true

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/bench/test_bench_contract.py"]
paths = ["benchmarks/numerical/python/verity_numerical/bench", "verity/protocols/flock/prover/python/verity_flock"]

[[tool.verity.tests.reads]]
tests = [
    "tests/bench/test_cell.py",
    "tests/bench/test_placement.py",
    "tests/bench/test_subcircuit_catalog.py",
    "tests/bench/test_unit_costs.py",
]
paths = ["verity/protocols/flock/prover/python/verity_flock/templates"]

[[tool.verity.tests.reads]]
tests = ["tests/bench/test_lowerings.py"]
paths = ["verity/commitments", "verity/commitments/crypto", "verity/protocols/flock/prover/python/verity_flock"]
