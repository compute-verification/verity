# The serve tax (README.md). Not a package: its runs use a node's pinned vLLM venv; the suite tests the metrics and the
# table on synthetic client records, the plugin's changes on a stand-in scheduler, the replay's window and comparison
# and the restore's on a synthetic arm, and the boundary state's capture and restore and the rebuild's bookkeeping on
# stand-ins for vLLM's engine core, stdlib only but for the tests of arrays, which skip without numpy.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# a test file that starts a program the read guard can't trace (bash, around run.sh): keyed on the suite's whole tree
untraced = ["tests/test_serve_tax.py"]
# `servetax_plugin` on a stand-in scheduler (tests/test_plugin.py): the integration's step trace and release order, and
# the modules they import; the driver and the replay read the run's id and paths through verity_config's SHARED settings;
# an arm names another benchmark's vLLM plugin by its file in this tree, which the driver's test checks is there; the
# serving cost is the benchmark kit's paired ratio, and its result.json the kit's writer's; the client's shim to the
# network certifier (cell_shim, tests/test_cell_shim.py) is run against the certifier itself, `warden.Warden` on a
# virtual clock, whose package imports the circuit language, the commitments and the sampled proofs' verifier; the arm
# behind the certifier names the certifier's program by its file in this tree, which its test (tests/test_certified.py,
# both sides on stand-ins for the processes they start) checks is there
inputs = [
    "verity/errors.py",
    "verity/circuits",
    "verity/claims",
    "verity/commitments",
    "verity/hardware",
    "verity/protocols/__init__.py",
    "verity/protocols/certifier",
    "verity/protocols/spot",
    "benchmarks/dsa_topk/dsa_topk.py",
    "benchmarks/network_traces/warden_serve.py",
    "benchmarks/harness/verity_bench/__init__.py",
    "benchmarks/harness/verity_bench/nsys.py",
    "benchmarks/harness/verity_bench/overhead.py",
    # overhead.paired calls the kit's, which reads its settings
    "benchmarks/harness/verity_bench/kit.py",
    "benchmarks/harness/verity_bench/settings.py",
    "benchmarks/harness/verity_bench/overhead_node.py",
    "verity/configuration/config/verity_config",
    "verity/__init__.py",
    "verity/settings.py",
    "adapters/vllm/verity_vllm/__init__.py",
    "adapters/vllm/verity_vllm/engine/__init__.py",
    "adapters/vllm/verity_vllm/engine/handle.py",
    "adapters/vllm/verity_vllm/engine/hooks.py",
    "adapters/vllm/verity_vllm/engine/step_trace.py",
    "adapters/vllm/verity_vllm/pipeline/__init__.py",
    "adapters/vllm/verity_vllm/pipeline/serve_admit.py",
    # the record of the value settings in force that an arm's meta.json and a replay's replay.json hold
    "adapters/vllm/verity_vllm/settings.py",
]
