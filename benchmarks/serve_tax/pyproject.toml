# The serve tax (README.md). Not a package: its runs use a node's pinned vLLM venv; the suite tests the metrics and the
# table on synthetic client records, the plugin's changes on a stand-in scheduler and the replay's window and comparison
# on a synthetic arm, stdlib only.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `servetax_plugin` on a stand-in scheduler (tests/test_plugin.py): the integration's step trace and release order, and
# the modules they import
inputs = [
    "integrations/vllm/verity_vllm/__init__.py",
    "integrations/vllm/verity_vllm/engine/__init__.py",
    "integrations/vllm/verity_vllm/engine/hooks.py",
    "integrations/vllm/verity_vllm/engine/step_trace.py",
    "integrations/vllm/verity_vllm/pipeline/__init__.py",
    "integrations/vllm/verity_vllm/pipeline/serve_admit.py",
]
