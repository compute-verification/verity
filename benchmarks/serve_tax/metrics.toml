# This directory's numbers, one [[metric]] each, by the rules of tests/test_metrics_registry.py,
# which enforces them.

[[metric]]
id = "vllm/serving-cost-glm53"
title = "Serving cost over stock vLLM"
owner = "vllm"
unit = "percent"
axis = "Extra compute to serve a model, as a percent of stock vLLM's; each point's member names its model, card and arm over its reference (GLM-5.3 on eight H200s, Llama 3.2 1B on one)."
better = "lower"
command = "research run --on NODE --source . --cwd source -- bash benchmarks/serve_tax/run.sh --model glm53"
every = "7d"
goal = "vllm/serving-cost-benchmark"
