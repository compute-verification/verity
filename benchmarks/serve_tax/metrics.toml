# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "vllm/serving-cost-glm53"
title = "Serving cost over stock vLLM"
owner = "vllm"
unit = "percent"
axis = "Extra compute to serve a model, as a percent of stock vLLM's; each point's member names its model, card and arm over its reference (GLM-5.3 on eight H200s, Llama 3.2 1B on one); the command's default arms are stock, stock again and the two-stage arm, which is refused by name (levels.TWO_LEVELS_REFUSED) before any GPU is held, so the command refuses until the levels' form takes a serve's boundary, and the stored readings stand."
better = "lower"
command = "research run --on NODE --source . --cwd source -- bash benchmarks/serve_tax/run.sh --model glm53"
every = "7d"
goal = "vllm/serving-cost-benchmark"
