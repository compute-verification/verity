# The bandwidth audit's GPU tagger and its tests. Not a package: `tagger.cu` runs on a GPU node (`run.sh`), and its CPU
# twins and the reference glue run here as a suite (`uv run tools/verity/check/suites.py benchmarks/bandwidth`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# tests/ reads tagger.cu's text (the twins' constants) and imports gpu.py and reference.py, which import the bandwidth audit
# and PoUS's verifier and geometry; reference.py reads the bandwidth audit's pinned vectors.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/claims/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/bandwidth", "verity/core/protocols/pous",
          "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto",
          "verity/ml/randomness",
          # PoUW's, PoUS's and the bandwidth audit's Python verifiers answer through Core.Answer's Python (`answer.py`).
          "verity/core/protocols/answer.py"]
