# The bandwidth audit v0's reference (`audit.py`, `tags.py`), its GPU tagger and their tests. Not a package: `tagger.cu`
# runs on a GPU node (`run.sh`), and the reference, its CPU twins and the reference glue run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/bandwidth`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# tests/ reads tagger.cu's text (the twins' constants) and imports the audit, gpu.py and reference.py, which stand on PoUS's
# store, setup, verifier and geometry; reference.py reads the audit's pinned vectors.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/claims/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/pous", "verity/ml/__init__.py",
          "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness"]
