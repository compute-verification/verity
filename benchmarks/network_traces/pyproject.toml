[project]
name = "verity-network-traces"
version = "0.0.0"
description = "Per-token timing traces of vLLM serving, for the network warden's calibration."
requires-python = ">=3.12"
dependencies = ["verity-network-warden"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity-network-warden = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
