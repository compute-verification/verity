[project]
name = "verity-network-traces"
version = "0.0.0"
description = "Per-token timing traces of vLLM serving, for the network certifier's calibration."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
# the repository root, for the tests that import `benchmarks.network_traces` (its proof drivers, a shared test's helpers)
pythonpath = ["../.."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_capture_loopback.py",
    "tests/test_certifier_piece.py",
    "tests/test_certifier_term.py",
    "tests/test_chain_record.py",
    "tests/test_chain_record_guard.py",
    "tests/test_kept_scan.py",
    "tests/test_negatives.py",
    "tests/test_out_request_values.py",
    "tests/test_scan_zk_challenger.py",
    "tests/test_scan_zk_lean_one.py",
    "tests/test_served_session.py",
    "tests/test_wipe_gate.py",
]
# record.py's mixes are workloads of the vLLM integration, which test_record loads; the auditor device's gate, whose
# session served_session starts, is live_challenger's auditor device. compile_slice_zk's engine class is vLLM 8eb1's trace
# header, read through the encodings' replay (with the modules `_encodings` loads beside it); the trace is in the
# encodings' fixtures, one fetched tree, which is listed whole so that suites.py fetches it. compile_slice_zk lowers and
# stages through one_stage's a0, a7 and a8 (with the population a0 and a7 read), and a8 reads Flock's proof format
# with its verifier's reader. test_certifier_piece holds the block record's certifier entry to the block record's
# schema and `block_record`; test_chain_record reads certifier/v0 cases from period_case
# (the period check's Python mirror, with verity_difftest's decoders, and its pinned slot entry's fixture).
# The certifier's zero-knowledge drivers' tests run on the drivers zk_drivers.py installs: one-stage's a7, a8 and
# prove_subprotocol (with the population a7 reads), Flock's proof-format reader (redigest, with the modules it loads
# beside it) and SPOT's template audit and challenger session; test_scan_zk_challenger's stream verifies with the Lean
# package core_spot's verifier, whose lakefile is the package it builds.
# demo_stub's endpoint records are read as the network certifier path's endpoint step reads them: `verity-vllm advice` (with the
# step trace and the records it imports, the engine handle the step trace finds a scheduler through, the registry it
# wraps the scheduler through with the ranks its parts run by, and its CLI, which served_session's endpoint step runs it
# through) and network-e2e's chain. certifier_piece is the network certifier's piece of one_stage's served_verdicts,
# whose pieces and record test_certifier_piece runs it through into the block record.
# leak_bounds counts K over the census's reference datacenter and the world, one link a machine: the world is the slowdown calculator's
# world fleet and its machine's GPUs, and the weights are the workload card's parameters. A scope's requests are by
# default the sampling plan's: the break-even planner's case, which it builds from Figure 1's lines (figure1.py,
# total_cost.py, the second stage's bound it imports and the cards they read); where asked, the census's request and
# GPU peak at the workload card's MACs a token.
inputs = ["benchmarks/census/deployments.json", "benchmarks/census/adversary.json", "benchmarks/census/hardware.json",
          "benchmarks/slowdown/data/reference.toml", "benchmarks/slowdown/data/hardware.toml",
          "benchmarks/spot_figures/cards", "benchmarks/spot_figures/cards.py", "benchmarks/spot_figures/figure1.py",
          "benchmarks/spot_figures/total_cost.py", "benchmarks/spot_figures/second_stage.py",
          "benchmarks/spot_figures/breakeven",
          "adapters/vllm/workloads", "benchmarks/network_e2e/chain.py",
          "verity/protocols/compose/verifier/live_challenger",
          "verity/protocols/proofs/spot/verifier/challenger/challenger_session.py",
          "verity/protocols/proofs/spot/prover/audit/local_challenger.py",
          "benchmarks/one_stage/a0.py", "benchmarks/one_stage/a7.py",
          "benchmarks/one_stage/a8.py", "benchmarks/one_stage/prove_subprotocol.py",
          "verity/protocols/proofs/spot/verifier/lean/lakefile.toml", "benchmarks/one_stage/r2_population.py",
          "verity/protocols/proofs/flock/prover/python/verity_flock",
          "benchmarks/network_e2e/encodings/replay.py", "benchmarks/network_e2e/encodings/replay_vectors.py",
          "benchmarks/network_e2e/encodings/cache_vectors.py", "benchmarks/network_e2e/encodings/derived.py",
          "tests/benchmarks/network_e2e/encodings/fixtures",
          "tests/verity/protocols/resource_accounting/network/verifier/network/fixtures/slot_entry.json",
          "tests/verity/protocols/resource_accounting/network/verifier/network/fixtures/select_entry.json",
          "verity/protocols/proofs/flock/prover/agreement/redigest.py", "verity/protocols/proofs/flock/prover/agreement/transcript_check.py",
          "verity/protocols/proofs/flock/prover/agreement/record_text.py",
          "benchmarks/one_stage/interfaces/verity_e2e_demo/schemas/block-record.v2.schema.json",
          "benchmarks/one_stage/interfaces/verity_e2e_demo/block_record.py", "benchmarks/census/deployments.json",
          "benchmarks/one_stage/interfaces/verity_e2e_demo/__init__.py", "benchmarks/one_stage/served_verdicts.py",
          "tests/verity/protocols/resource_accounting/network/verifier/network/period_case.py", "tools/difftest/python/verity_difftest",
          "verity/__init__.py", "verity/protocols/compose/__init__.py", "verity/protocols/compose/verifier/__init__.py",
          # test_kept_scan's window classes are the vLLM integration's (`program.predict.window_circuit`), which import
          # across its package and the PyTorch adapter's; demo_stub's `verity-vllm advice`, the encodings' replay and
          # compile_slice_zk's compiler read the vLLM package too. Both packages are listed whole, as they move often. SPOT's
          # prove_path, which test_kept_scan imports with the records_audit it imports, reads its sources' list.
          # test_certifier_term runs `verity bench certifier_term`'s runner, test_block_certifier holds the block certifier to
          # the block record's period-0 fixture, and test_certifier_piece holds the CLI's served_table to scan_zk's scan class.
          "adapters/vllm/verity_vllm", "adapters/torch/verity_torch",
          "benchmarks/certifier_term/run.py",
          "tests/benchmarks/one_stage/interfaces/fixtures/block-record-r2-period0.json",
          "benchmarks/prove_path/prove_path.py", "benchmarks/prove_path/records_audit.py",
          "benchmarks/prove_path/sources.json", "tools/verity/cli/verity_cli/served_table.py"]
# network-rows, the compiled audit of the network certifier's records, which test_certifier_piece builds in its package
# (as the piece does) and runs on the synthetic run's records; the Lean verifier, whose statement setup test_network_attester_zk
# and test_egress_zk run on their staged members.
artifacts = ["verity/protocols/resource_accounting/network/verifier/lean/.lake/build/bin/network-rows",
             "verity/protocols/proofs/flock/verifier/.lake/build/bin/verity-verify-proof"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_certifier_piece.py"]
paths = ["benchmarks/network_traces"]

[[tool.verity.tests.reads]]
tests = ["tests/test_compile_slice_zk.py"]
paths = ["benchmarks/network_e2e/encodings", "verity/protocols/resource_accounting/network"]

[[tool.verity.tests.reads]]
tests = ["tests/test_demo_stub.py"]
paths = ["adapters/vllm/verity_vllm/pipeline"]
