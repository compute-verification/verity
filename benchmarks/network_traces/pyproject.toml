[project]
name = "verity-network-traces"
version = "0.0.0"
description = "Per-token timing traces of vLLM serving, for the network certifier's calibration."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# record.py's mixes are workloads of the vLLM integration, which test_consistency loads. compile_slice_zk's engine class
# is vLLM 8eb1's trace header, read through the encodings' replay (with the modules `_encodings` loads beside it).
inputs = ["integrations/vllm/workloads", "benchmarks/network_e2e/encodings/replay.py",
          "benchmarks/network_e2e/encodings/replay_vectors.py", "benchmarks/network_e2e/encodings/cache_vectors.py",
          "benchmarks/network_e2e/encodings/derived.py",
          "benchmarks/network_e2e/encodings/tests/fixtures/vllm-8eb1/advice_trace.jsonl.gz"]
