[project]
name = "verity-network-traces"
version = "0.0.0"
description = "Per-token timing traces of vLLM serving, for the network certifier's calibration."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# record.py's mixes are workloads of the vLLM integration, which test_consistency loads; the auditor host's gate runs
# warden_serve.py's rehearsal, which test_warden_serve holds it to. test_active_replay builds `network-records`
# (certifier.lean_audit) and test_certifier_serve `sampled-proofs-verifier` (one_stage.verifier), whose lakefiles they list.
inputs = ["integrations/vllm/workloads", "benchmarks/live_challenger/auditor.py",
          "verity/core/protocols/network/lean/lakefile.toml", "verity/core/service/sampled_proofs/lakefile.toml"]
