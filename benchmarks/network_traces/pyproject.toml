[project]
name = "verity-network-traces"
version = "0.0.0"
description = "Per-token timing traces of vLLM serving, for the network certifier's calibration."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# record.py's mixes are workloads of the vLLM integration, which test_consistency loads. compile_slice_zk's scan reads
# C-Flock's proof format off its verifier's layout, which test_compile_slice_zk checks.
inputs = ["integrations/vllm/workloads", "verity/ml/flock/verifier/redigest.py",
          "verity/ml/flock/verifier/transcript_check.py"]
