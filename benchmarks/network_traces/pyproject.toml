[project]
name = "verity-network-traces"
version = "0.0.0"
description = "Per-token timing traces of vLLM serving, for the network certifier's calibration."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_active_replay.py",
    "tests/test_certified_io_abort.py",
    "tests/test_certifier_piece.py",
    "tests/test_certifier_serve.py",
    "tests/test_chain_record.py",
    "tests/test_compact_eos_phase12.py",
    "tests/test_compact_phase10.py",
    "tests/test_covert.py",
    "tests/test_leak_guard.py",
    "tests/test_negatives.py",
    "tests/test_out_request_values.py",
    "tests/test_replay.py",
    "tests/test_scan_zk_challenger.py",
    "tests/test_served_session.py",
    "tests/test_wipe_gate.py",
]
# record.py's mixes are workloads of the vLLM integration, which test_record loads; the auditor host's gate runs
# warden_serve.py's rehearsal, which test_warden_serve holds it to. compile_slice_zk's engine class is vLLM 8eb1's trace
# header, read through the encodings' replay (with the modules `_encodings` loads beside it); the trace is in the
# encodings' fixtures, one fetched tree, which is listed whole so that suites.py fetches it. leak_scan reads Flock's
# proof format with its verifier's reader. A served run's Commit windows are the vLLM integration's window advice, which
# window_chain joins for network-e2e's chain. scan_zk's draws take the challenger's coins through one_stage's a5_coins,
# whose local session is live_challenger's auditor host and serve.py (under its tests' stub); its honest round on them
# lowers and stages through one_stage's a0, a7, a8 and prove_leg (`warden_zk._one_stage`) and Flock's class statement, and
# its stream's verifier is the Lean package `core_spot`'s verifier executable, whose lakefile is the package it builds.
# chain_record writes the block record's certifier entry by block_certifier's block_leg, which test_block_certifier
# holds to the block record's schema, `block_record` and its period-0 fixture, and test_chain_record to the schema on
# certifier/v0 cases from period_case (the period check's Python mirror, with verity_difftest's decoders, and its pinned
# slot entry's fixture), which also re-decides them.
# demo_stub's endpoint records are read as the warden path's endpoint step reads them: `verity-vllm advice` (with the
# step trace and the records it imports, and its CLI, which served_session's endpoint step runs it through) and
# network-e2e's chain. certifier_piece is the network certifier's piece of
# one_stage's served_verdicts, whose pieces and record test_certifier_piece runs it through into the block record.
# leak_bounds counts K over the census's reference datacenter and the adversary resource model's world, one link a
# machine.
inputs = ["benchmarks/census/deployments.json", "benchmarks/census/adversary.json", "adapters/vllm/workloads",
          "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/pipeline/__init__.py", "adapters/vllm/verity_vllm/pipeline/window_advice.py",
          "adapters/vllm/verity_vllm/pipeline/advice.py", "adapters/vllm/verity_vllm/pipeline/advice_windows.py",
          "adapters/vllm/verity_vllm/pipeline/cli.py",
          "adapters/vllm/verity_vllm/config.py", "adapters/vllm/verity_vllm/settings.py",
          "adapters/vllm/verity_vllm/engine/__init__.py",
          "adapters/vllm/verity_vllm/engine/hooks.py", "adapters/vllm/verity_vllm/engine/step_trace.py",
          "adapters/vllm/verity_vllm/records/__init__.py", "adapters/vllm/verity_vllm/records/fields.py",
          "adapters/vllm/verity_vllm/records/workload.py", "benchmarks/network_e2e/chain.py",
          "verity/composite/device/live_challenger", "benchmarks/one_stage/a5_coins.py", "benchmarks/one_stage/a0.py",
          "benchmarks/one_stage/a7.py", "benchmarks/one_stage/a8.py", "benchmarks/one_stage/prove_leg.py",
          "benchmarks/one_stage/r2_population.py", "verity/protocols/flock/prover/python/verity_flock",
          "verity/protocols/spot/verifier/lean/lakefile.toml",
          "benchmarks/network_e2e/encodings/replay.py", "benchmarks/network_e2e/encodings/replay_vectors.py",
          "benchmarks/network_e2e/encodings/cache_vectors.py", "benchmarks/network_e2e/encodings/derived.py",
          "adapters/vllm/verity_vllm/pipeline/advice_code",
          "benchmarks/network_e2e/encodings/tests/fixtures",
          "verity/protocols/certifier/verifier/network/tests/fixtures/slot_entry.json",
          "verity/protocols/flock/agreement/redigest.py", "verity/protocols/flock/agreement/transcript_check.py",
          "benchmarks/one_stage/interfaces/verity_e2e_demo/schemas/block-record.v2.schema.json",
          "benchmarks/one_stage/interfaces/verity_e2e_demo/block_record.py",
          "benchmarks/one_stage/interfaces/verity_e2e_demo/__init__.py", "benchmarks/one_stage/served_verdicts.py",
          "benchmarks/one_stage/interfaces/tests/fixtures/block-record-r2-period0.json",
          "verity/protocols/certifier/verifier/network/tests/period_case.py", "verity/difftest/python/verity_difftest",
          "verity/__init__.py", "verity/composite/__init__.py", "verity/composite/device/__init__.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_block_certifier.py"]
paths = ["verity"]

[[tool.verity.tests.reads]]
tests = ["tests/test_certifier_piece.py"]
paths = ["benchmarks/network_traces"]

[[tool.verity.tests.reads]]
tests = ["tests/test_compact_phase10.py"]
paths = ["verity/protocols/certifier/verifier/tests"]

[[tool.verity.tests.reads]]
tests = ["tests/test_compile_slice_zk.py"]
paths = ["benchmarks/network_e2e/encodings", "verity/protocols/certifier"]

[[tool.verity.tests.reads]]
tests = ["tests/test_demo_stub.py"]
paths = ["adapters/vllm/verity_vllm/pipeline"]
