# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# one GPU of the node for MINUTES (55) plus the lease's margin; a node with no pinned-vLLM venv bootstraps one first
[[metric]]
id = "network-accounting/streamed-gap-p99.9"
title = "Tail gap between streamed tokens"
owner = "network-accounting"
unit = "ms"
axis = "The 99.9th percentile of the time between consecutive streamed chunks of one request, over the kept windows of one recording of vLLM serving the benchmark's mix on one GPU."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source --timeout 90m -- bash benchmarks/network_traces/run.sh"
every = "7d"
