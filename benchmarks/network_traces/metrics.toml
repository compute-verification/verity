# This directory's numbers, one [[metric]] each, by the rules of tests/test_metrics_registry.py,
# which enforces them.

# one GPU of the node, the card CARD pinned to the CPUs CORES, for MINUTES (55) plus the lease's margin; a node with
# no pinned-vLLM venv bootstraps one first
[[metric]]
id = "network-accounting/streamed-gap-p99.9"
title = "Tail gap in a workload's streaming"
owner = "network-accounting"
unit = "ms"
axis = "The 99.9th percentile of the time between consecutive streamed pieces of one response, over every response that completed in one recording of a workload on one card: the longest gaps, which the network attester's release schedule must absorb without the response's timing telling anything."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source --as network-accounting --timeout 90m -- bash benchmarks/network_traces/run.sh --on CARD --cores CORES"
every = "7d"
