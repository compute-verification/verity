# The advice's encodings (network accounting for arbitrary vLLM usage). `derived.py`: the fields of advice v0 (I1) that
# cost zero bits, the residual that remains and its bits per certifier window; `cache_vectors.py`: the certifier's
# CacheStep_v1 against derived's prefix rules, and its difftest vectors; `cache_pool_vectors.py`: CacheStep_v2 against
# the replay's block pool (`replay._KV`), and its difftest vectors; `sched_trace.py`: step traces from vLLM's
# own scheduler, which the tests read as fixtures (it needs vLLM). Not a package: the modules load by path (the
# directory's name shadows the stdlib's `encodings`), and they run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/network_e2e/encodings`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# derived.py builds and charges advice v0 with the certifier's I1 (verity.core.protocols.certifier.advice), which reads
# the package inits on the way; cache_vectors.py runs the certifier's CacheStep_v1 (`cache_step`, through `head_check`
# and the circuits it imports) and writes the certifier's difftest vectors, which a test reads back.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/certifier", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments",
          "verity/ml/crypto"]
