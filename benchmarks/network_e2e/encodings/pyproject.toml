# The advice's encodings (network certification for arbitrary vLLM usage). `derived.py`: the fields of advice v0 (I1) that
# cost zero bits, the residual that remains and its bits per certifier window; `cache_vectors.py`: the certifier's
# CacheStep_v1 against derived's prefix rules, and its difftest vectors; `cache_pool_vectors.py`: CacheStep_v2 against
# the advice decoder's block pool (`verity_vllm.pipeline.advice_code.pool.BlockPool`), and its difftest vectors;
# `compile_slice_pool.py`: CompileSlice_v2's pool calls against `BlockPool` over whole traces; `arith_vectors.py`: the
# certifier's arithmetic encoder against code.py, v1 and code_v1; `sched_trace.py`: step traces from vLLM's own
# scheduler, which the tests read as fixtures (it needs vLLM); `pool_row_trace.py`: vLLM's own block pool, driven by the
# replay's over whole traces, and the carried pool's row the vLLM integration exports from it; `pool_cut.py`: a trace
# cut at every window edge, where vLLM's pool, the replay's and CompileSlice_v6's window agree on the carried row.
# Those fixtures (`tests/fixtures/`; `tests/fixtures_draft/`, `vllm_trace.py`'s with a draft) and the certifier's
# vectors these modules write are fetched fixtures (`fixtures/artifacts.json`), which `suites.py` fetches before the
# suites that read them; one a module rewrote is registered there again. Not a package: the modules load by path (the directory's name shadows the stdlib's
# `encodings`), and they run here as a suite (`uv run tools/verity/check/suites.py benchmarks/network_e2e/encodings`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# derived.py builds and charges advice v0 with the certifier's I1 (verity.protocols.certifier.verifier.advice), which reads
# the package inits on the way; cache_vectors.py runs the certifier's CacheStep_v1 (`cache_step`, through `head_check`
# and the circuits it imports) and writes the certifier's difftest vectors, which a test reads back; test_arith_vectors
# holds the certifier's arith_encode vectors to what this directory's coders code now.
inputs = ["verity/__init__.py", "verity/errors.py", 
          "verity/protocols/certifier", 
          "verity/protocols/certifier/prover", "verity/circuits", "verity/commitments",
          "verity/commitments/crypto",
          # test_v1 runs the certifier's replay chain (`replay_chain`) over v1's windows, which imports sampled proofs'
          # produced and registered row helpers
          "verity/protocols/spot/verifier/__init__.py",
          "verity/protocols/spot/verifier/one_stage/__init__.py",
          "verity/protocols/spot/verifier/one_stage/partition.py",
          "verity/protocols/spot/verifier/one_stage/produced.py",
          "verity/protocols/spot/verifier/one_stage/registered.py",
          # test_pool_row and test_pool_cut export the carried pool's row with the integration's exporter
          # (`engine.pool_row`), which refuses with the integration's `Refused`
          "adapters/vllm/verity_vllm/engine/pool_row.py", "adapters/vllm/verity_vllm/errors.py",
          # test_tick serves the replay's scheduler behind the vLLM integration's certified-tick gate (`serve_admit`)
          "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/pipeline/__init__.py",
          "adapters/vllm/verity_vllm/pipeline/serve_admit.py", "adapters/vllm/verity_vllm/engine/__init__.py",
          "adapters/vllm/verity_vllm/engine/hooks.py",
          # the replay, the derived rules, the coder and advice v1's codec are the vLLM integration's advice code, which
          # replay.py, derived.py, code.py, code_v1.py and v1.py import and re-export
          "adapters/vllm/verity_vllm/pipeline/advice_code",
          "verity/protocols/__init__.py", "verity/protocols/spot/__init__.py",
          "verity/definitions/__init__.py", "verity/definitions/circuits/__init__.py", "verity/definitions/commitments/__init__.py", "verity/definitions/circuits/boolean/__init__.py", "verity/definitions/circuits/boolean/memcheck.py", "verity/definitions/commitments/gates/__init__.py", "verity/definitions/commitments/gates/block_key.py",
          # the certifier's `head_check` counts a Definition's ANDs with the census (`census.BooleanWork`), and the
          # advice code's codec imports it (`window_code`, the certifier's `window_charge`, `arith_encode`):
          # test_arith_vectors, the first test to load v1.py, reads it
          "verity/definitions/circuits/census.py"]
