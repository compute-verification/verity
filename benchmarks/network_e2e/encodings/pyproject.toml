[project]
name = "verity-network-encodings"
version = "0.0.0"
description = "Encodings of network accounting's advice (I1): the fields that cost zero bits, and the bits per certifier window that remain."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
