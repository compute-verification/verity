[project]
name = "verity-network-e2e"
version = "0.0.0"
description = "Network accounting end to end: a certifier-serve rehearsal, N2's verdicts, the proved head checks and the negatives, as one report."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# e2e.py runs certifier-serve's rehearsals and N2's verdicts through n2_zk, which it imports from there; the claim's
# zero-knowledge gaps are checked against the certifier README's.
inputs = ["benchmarks/network_traces", "verity/core/protocols/certifier/README.md"]
