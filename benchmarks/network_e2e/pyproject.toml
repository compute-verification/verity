[project]
name = "verity-network-e2e"
version = "0.0.0"
description = "Network certification's chain after N2: the advice and its bits, the endpoint's own advice and the prove path's adoption."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests bind the endpoint's own advice through chain_record (network_traces), which runs `verity-vllm advice --bind`, so the
# vLLM integration whole; the chain reads its window advice (`window_advice`). tests/test_stop_rule_definition.py reads
# `encodings/derived.py`, the encodings suite's module.
inputs = ["benchmarks/network_traces", "adapters/vllm/verity_vllm", "benchmarks/network_e2e/encodings/derived.py",
          "verity/__init__.py", "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/network/__init__.py", "verity/protocols/resource_accounting/network/verifier/__init__.py"]
