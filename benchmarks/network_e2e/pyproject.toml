[project]
name = "verity-network-e2e"
version = "0.0.0"
description = "Network certification's chain after N2: the advice and its bits, the endpoint's own advice and the prove path's adoption."
requires-python = ">=3.12"
dependencies = ["verity"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The chain imports `window_chain` from network_traces; its derived bits are `encodings/derived.py`'s (the encodings
# suite's module, loaded by path, over the vLLM integration's advice code). The endpoint's Commit windows are the vLLM
# integration's window advice (`window_advice`), which the chain reads.
inputs = ["benchmarks/network_traces", "benchmarks/network_e2e/encodings/derived.py",
          "adapters/vllm/verity_vllm/pipeline/advice_code",
          "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/pipeline/__init__.py",
          "adapters/vllm/verity_vllm/pipeline/window_advice.py",
          "verity/__init__.py", "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/certifier/__init__.py", "verity/protocols/accounting/certifier/verifier/__init__.py"]
