[project]
name = "verity-tc-probe"
version = "0.0.0"
description = "GPU probes that compare tensor-core instructions bit for bit with the primitive circuits' models."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-numerical", "numpy"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-numerical = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# verity/definitions/silicon/discrepancy_log.json: trust.py's dossiers cite the discrepancy log's entries, and tests/test_trust.py reads it.
# verity/configuration/config/verity_config: the probes read the run's id and lane through its SHARED settings.
inputs = ["benchmarks/census", "fixtures/bench-instances", "verity/definitions/silicon/discrepancy_log.json",
          "verity/configuration/config/verity_config",
          "verity/__init__.py", "verity/definitions/__init__.py", "verity/definitions/silicon/__init__.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_instances_hw.py"]
paths = ["*/pyproject.toml", "tools/research/src/research"]
