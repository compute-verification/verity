order = 367
path = "`np_kernel/`"
runs_on = "H200 (CPU: build, SASS gate and `cpu_check.cc`)"
what = "The lead's kernel (`verity/pouw/v2`: blc4a-t64-e7-s1 under ROT and FOLD, `layout.h`) with every k32 word exported and hashed: `run.sh` builds and SASS-gates it, checks every word and served output on the H200 and times Llama-3.2-1B's linears; `gate.py` makes its `GateRecord`, and `gate.json` holds the one that admits it (`gate.py --recorded` holds it to the tree's sources); `cpu_check.cc` holds the layout, the coin feed, ragged calls' padding rows and the fold's 2^22 window on the CPU; `serve.cu` is the kernel as a library a serving process calls, which `serve_lead.py` binds as the lead's `LeadBackend` on serve-openai's engine, and `served_lead.sh` builds, checks and serves it beside stock on the H200"
