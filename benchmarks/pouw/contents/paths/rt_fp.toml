order = 92
path = "`rt_fp/`"
runs_on = "CPU (the machine model's environment; `fx1_absorb.py`: ptxas and cuobjdump, a node's CUDA 13.0); `nvf4_mixed.sh`: one B200 or B300 under gpu-lease"
what = "RT-FP's red-team witnesses for the FP8/FP4 designs: FPX-DESIGN's variants' credited floor ♭ against a route that writes the same committed words for less (an int8 MMA, FPX-DESIGN's own int8-unit variant of the same design, or int8 MMAs on s8 limbs chained in one accumulator, at the L that writes the variant's words), `overcredit.py FPX_EPS OUT`; and `fx1_absorb.py OUT`, ptxas's sm_120a code for fx1's tail on IMMA words, on QMMA words with the extraction, and with it absorbed into fx1's IMAD (lane ops a word, registers, spills: absorbing it costs 32 registers or a MOV a word); and `nvf4_mixed.sh`, whether B200's kind::mxf4nvf4 stays exact when a row's four k16 blocks carry different integer UE4M3 scales (`nvf4_mixed.cu`: it calibrates which scale byte each block reads, then checks MMA chains from +0 and from the 1.5 2^23 binade and one-MMA mixed-magnitude windows against an int64 sum, with a no-MMA control); and `smallalpha.py OUT`, a Dither-2S word on the FP forms when the committed data keeps every operand on the FP grid (one fresh coin an operand leaves operands 0..3 on data whose floors are 0..2, so FP4 takes every word at split 1): the machine model's core ε on sm_120 (Dither-2S, FPX-DESIGN's fpx-g1s-fx1 and the record) with the FP forms at split 1, free and with the s32 conversion paid, and on the B200 record beside kind::mxf4nvf4; and `b300_proxy.py OVERCREDIT_OUT OUT`, overcredit's B200 pairs on a B300 proxy (DS-100 with UTCIMMA's DS_tensor ×30, the variants' ♭ at B200's FP rate) at q* ½ and 1.22, where the cheater leaves the tensor route for lanes at q* plus the fold with no extraction; and `h1_grid.py OUT`, smallalpha's control: the exact probability that a k-block of H1's U-carrying operands (U on ±1..±16) lands on one scaled E2M1 grid, under nvf4's and mxf4's scales"
