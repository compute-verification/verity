order = 92
path = "`rt_fp/`"
runs_on = "CPU (the machine model's environment; `fx1_absorb.py`: ptxas and cuobjdump, a node's CUDA 13.0); `nvf4_mixed.sh`: one B200 or B300 under gpu-lease"
what = "RT-FP's red-team witnesses for the FP8/FP4 designs: FPX-DESIGN's variants' credited floor ♭ against a route that writes the same committed words for less (an int8 MMA, FPX-DESIGN's own int8-unit variant of the same design, or int8 MMAs on s8 limbs chained in one accumulator, at the L that writes the variant's words), `overcredit.py FPX_EPS OUT`; and `fx1_absorb.py OUT`, ptxas's sm_120a code for fx1's tail on IMMA words, on QMMA words with the extraction, and with it absorbed into fx1's IMAD (lane ops a word, registers, spills: absorbing it costs 32 registers or a MOV a word); and `nvf4_mixed.sh`, whether B200's kind::mxf4nvf4 stays exact when a row's four k16 blocks carry different integer UE4M3 scales (`nvf4_mixed.cu`: it calibrates which scale byte each block reads, then checks MMA chains from +0 and from the 1.5 2^23 binade and one-MMA mixed-magnitude windows against an int64 sum, with a no-MMA control)"
