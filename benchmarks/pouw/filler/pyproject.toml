# The DRAM-free filler beside the decode step: its kernels (dcap.cu, pfill.cuh, flin.cuh, comm/tpcomm.cu) run on a GPU
# node through research run; the scorer, the arms and the kernels' host references run here as a suite
# (`uv run tools/verity/check/suites.py benchmarks/pouw/filler`).
[tool.pytest.ini_options]
testpaths = ["tests"]
# the directory's modules and the harness's ledger, which the tests import by name; no name is in both
pythonpath = [".", "../harness"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_pf_rounds.py", "tests/test_pfill_fold.py", "tests/test_pfill_r9.py", "tests/test_pfill_ref.py"]
# The scorer refuses an arm whose record the attempt ledger (harness/ledger.py) or the evidence store's canonical form, ids
# and manifest model would refuse (arms.record_problems), so the tests import both; the ledger takes its variant record's
# schema from verity.protocols.pouw.verifier.serving when that imports (`ledger.serving`). pfill.cuh and pfill_ref.py take
# their folds, key rules and lane starts from the receipts reference. capacity_of.py reads its σ through machine_model's
# capacity over its data's Π. The ledger reads its variables through PoUW's benchmarks' registry (benchmarks/pouw/settings.py).
inputs = ["benchmarks/pouw/harness", "benchmarks/pouw/settings.py", "verity/configuration/config/verity_config",
          "verity/protocols/pouw/receipts", "benchmarks/machine_model/verity_machine_model",
          "benchmarks/machine_model/data", "tools/research/src/research/__init__.py",
          "tools/research/src/research/store", "verity/__init__.py", "verity/settings.py", 
          "verity/protocols/pouw/verifier/__init__.py",
          "verity/protocols/pouw/verifier/serving.py",
          # serving.py takes its tags from the table of domain separators, verity.commitments.domains
          "verity/errors.py", "verity/commitments", "verity/commitments/crypto",
          # the tests' g++ builds of pfill.cuh include its SHA-512, pearl_c/sha512.cuh, which includes sha512_rows' sha512x.cuh
          "benchmarks/pouw/pearl_c/sha512.cuh", "verity/definitions/kernels/sha512.cuh",
          "verity/definitions/__init__.py", "verity/protocols/__init__.py", "verity/definitions/kernels/__init__.py", "verity/protocols/pouw/__init__.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_pfill_fp_score.py", "tests/test_psched_score.py"]
paths = ["benchmarks/pouw/filler"]
