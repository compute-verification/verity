[premise.sak-u]
rank = "4bU"
status = "assumed"
owner = "N-SAKU"
source = "SAK-U: the k-step partial sums of a product of literally uniform matrices of inner width w cost w MACs an entry. It credits no T1 term. An exact design (N-EXACT's X = A·P + E·Q, Y = R·B + T·F at width W >= K + rank Q + rank T) embeds a uniform instance at most min(rank Q, rank T) wide in its zero-data words, whose spans are orthogonal (Q·T = 0), so SAK-U alone leaves W - min(rank Q, rank T) >= K + max(rank Q, rank T), at least stock, uncertified (paper proof for linear embeddings; saku.py width_bound and ortho, checked). Composed with a per-word floor u(L) on the words outside the embedding, at least K(1 - u(L)/L) stays uncertified: half of stock at L 64 with W1's 32, a quarter with BamFloor's 48; at L 32 W1 credits everything SAK-U could. A served design's data lanes (K) are never uniform, so the same holds. Padded and de-noise-after designs: SakU.lean (honest_pays_both, denoise_cost)"

