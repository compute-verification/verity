# The HASH card's data (hash_card.py): the basis, the lead, the h readings in circulation, the designs and the rule
# for comparing them. pouw_space.toml prices every composed design; this file holds what pouw_space doesn't: measured
# figures carried from the lanes, the readings to reconcile, and the HASH proposals as their notes state them.

[basis]
title = "W1 at H32 (a register write 32 units, a stock MAC 1), hashing at ShaWrites' per-form constant R"
price = "w1-forms"
model = "llama-3.2-1b"
points = ["t512", "t512r512", "t8192"]
words_chunk = 262144
lead = { noise = "tag-blc4a-t64-rot", denoise = "served", format = "s8", density = "k32", operands = "w", rows = "l1w", hiding = "l1a", final = "none", forming = "none", derivation = "min" }
lead_name = "tag-blc4a-t64-rot/served/s8/k32/w/l1w/l1a/min"
h_definition = "h: the honest program's credited commitment work over stock, W1 units a useful MAC: SHA-512 at R per form (pouw_space price.sha_forms), plus any non-hash commitment work a design adds (a sketch's MACs, lookups), at W1"
source = "N-CARD final (note compute-research/20261029T1250Z-report-np-card), pouw_space at 5e6e05cc21; inbox/HASH.md's figure of merit"

# The prices an h may be stated at, in W1 units a hashed byte, and what each is.
