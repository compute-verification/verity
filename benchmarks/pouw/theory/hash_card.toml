# for comparing them. pouw_space.toml prices every composed design; this file holds what pouw_space doesn't: measured
# figures carried from the lanes, the readings to reconcile, and the HASH proposals as their notes state them.

[basis]
title = "W1 at H32 (a register write 32 units, a stock MAC 1), hashing at ShaWrites' per-form constant R"
price = "w1-forms"
model = "llama-3.2-1b"
points = ["t512", "t512r512", "t8192"]
words_chunk = 262144
lead = { noise = "tag-blc4a-t64-rot", denoise = "served", format = "s8", density = "k32", operands = "w", rows = "l1w", hiding = "l1a", final = "none", forming = "none", derivation = "min" }
lead_name = "tag-blc4a-t64-rot/served/s8/k32/w/l1w/l1a/min"
h_definition = "h: the honest program's credited commitment work over stock, W1 units a useful MAC: SHA-512 at R per form (pouw_space price.sha_forms), plus any non-hash commitment work a design adds (a sketch's MACs, lookups), at W1, counted wherever it runs (the prover or the auditor's device)"
source = "N-CARD final (note compute-research/20261029T1250Z-report-np-card), pouw_space at 5e6e05cc21; inbox/HASH.md's figure of merit; hashing wherever it runs: HASH.md §interim-1's card basis"

# Rulings on what a design needs of the rules, cited by a design's or a family's `rules`. A design's rule_change or
# rule_question clears only when every ruling it cites admits it (`admits`); `flag` is what the design then carries.
[ruling.one-hash-fold]
said = "HASH.md §interim-1, ruling 2 (coordinator, 21:15Z)"
admits = true
text = "an unkeyed fold sealed by SHA-512 sits within the one-hash rule: SHA-512 does all the binding, and the fold only carries the credit's cost premise, which goes to Daniel with the candidate as the change to PoUW's statement"
flag = "within the one-hash rule, sealed by SHA-512 (ruling 2); its cost premise goes to Daniel with the candidate, as the change to PoUW's statement"

[ruling.duo-moot]
said = "HASH.md §interim-1, ruling 3 (coordinator, 21:15Z)"
admits = true
text = "the Duo exception is moot here: it covers folds that bind in SHA-512's place, under H-mu+; every HASH design seals its fold under SHA-512, so by ruling 2 none needs the exception, keyed or not"
flag = "needs no Duo exception and no H-mu+, keyed or not: its fold is sealed by SHA-512 (ruling 3)"

[ruling.predicate-writes]
said = "HASH.md §interim-1, ruling 1 (coordinator, 21:15Z)"
admits = false
text = "predicate writes stay free in W1: pricing them as register writes would be a stronger hardware premise, and it buys only trunc-16's 2.0x; xor-m and trunc-16 stay closed, and a frontier with them priced is information only"
flag = "predicate writes stay free in W1 (ruling 1), so the write model under which it would stand is information only"

