# The designs the brief lists as known, priced on the card where the card composes them (`compose`), else carried.
# `swap` replaces the named slots of the lead's composition.
[known.r16k-words]
title = "the lead with its words in 16 KiB chunks (N-HIDE's module, L1 at 16 KiB rows)"
swap = { rows = "l1" }
status = "known"
what = "the chunk size the brief pairs with h = 233"

[known.r1]
title = "R1: the certifier hashes every word (N-ALT final)"
swap = { rows = "r256k", hiding = "r1" }
status = "closed"
what = "inbox/HASH.md: moves the hashing off the prover but ships the words, T2 97.5x-665x"

[known.k64]
title = "a word every 64 steps (road (b), N-DENSE)"
swap = { density = "k64-none" }
status = "refuted"
what = "inbox/HASH.md: the middle-segment skip (N-SAKU, proved premise-free) frees the uncommitted middle; carried from N-DENSE, since the card can't lay the lead's 1.1445·K-step depth out in 64-step words"

[known.module-sis]
title = "Module-SIS h = A·x mod 2^32 in place of SHA-512 (GD-SIS)"
status = "closed"
h = { value = 896.0, price = "w1-forms", unit = "int8 MACs a committed byte, W1 1 a MAC", label = "estimate", point = "any", model = "any", words_chunk = 0, baseline = "none" }
per_byte = true
rule_change = "a second primitive beside SHA-512 (the one-hash rule)"
what = "inbox/HASH.md: 896 int8 MACs a committed byte, and its opening in C-Flock is 24-36x SHA-512's rows; it never beats SHA-512 at any row size"
note = "compute-research/20261028T2230Z-report-gd-hash-reframe"

[known.linear-sketch]
title = "a linear sketch Σ r_t w_t over running words (H12, N-LIT)"
status = "refuted"
what = "inbox/HASH.md: it equals Σ_τ κ_τ Σ_{t≥τ} r_t, computable without the words, so the adversary's cost is about 0 and nothing is credited"

# HASH proposals, as each lane's note states them. Fields:
#   lane, agent, note, title, status (proposed | checked | measured | proved | refuted | closed)
#   compose / swap: a pouw_space composition the card prices itself (checked), or
#   bytes_per_mac: credited SHA-512 bytes a useful MAC at the basis's per-form price, or
#   h = { value, price, label, point, model, words_chunk, baseline }: h as the lane states it, converted by price, or
#   h = { ratio, baseline, label }: h over the lane's own lead's h (`baseline`), applied to the basis lead's
#   layout = { macs_per_word }: the useful MACs a word of the lead the lane priced against, flagged if not the basis's
#   extra_w1_per_mac: honest non-hash commitment work a useful MAC (W1)
#   t1, t2, t3 = { value, label }: worst over the basis's points (t2 the larger of sync and async)
#   drops: the lead's premises the design no longer takes; adds: [{ id, rank, part, status, falsification, owner }]
#   rule_change: the rule a design needs changed (another primitive, a revealed sketch)
