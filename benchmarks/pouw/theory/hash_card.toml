value = "no premise on operands buys h: served stride-k designs keep >= 1/31 words a data MAC (the lead's), outputs-only leaves >= stock uncredited, exact designs at most 1.3x (8B) / 3.2x (70B) at rank 4b and none on 1B"
label = "proved (paper); classes checked, run r20261029-190731-0ded"

[bound.read-every-word]
