# HASH proposals, as each lane's note states them. Fields:
#   lane, agent, note, title, status (proposed | checked | measured | proved | refuted | closed)
#   compose / swap: a pouw_space composition the card prices itself (checked), or
#   bytes_per_mac: credited SHA-512 bytes a useful MAC at the basis's per-form price, or
#   h = { value, price, label, point, model, words_chunk, baseline }: h as the lane states it, converted by price, or
#   h = { ratio, baseline, label }: h over the lane's own lead's h (`baseline`), applied to the basis lead's
#   layout = { macs_per_word }: the useful MACs a word of the lead the lane priced against, flagged if not the basis's
#   extra_w1_per_mac: honest non-hash commitment work a useful MAC (W1)
#   t1, t2, t3 = { value, label }: worst over the basis's points (t2 the larger of sync and async)
#   drops: the lead's premises the design no longer takes; adds: [{ id, rank, part, status, falsification, owner }]
#   combine = { m, rot }: one committed register for m words (xor-m; xorrot-m with rot = 1), derived by the card
#   fold = { seal_bytes_per_cell, writes_per_word }: every word folded into its cell's state, sealed with the final word
#   stated = { h, h_bare, t1, t1_dw }: the lane's own figures, compared (h_bare: before the fold's own writes)
#   rule_change: the rule a design needs changed (another primitive, a revealed sketch); rule_question: one asked
#   caveats: conditions another lane's note sets on the design, carried as flags
#   adds[].family: a premise another lane states under another name and rank ([family.*]); the card takes the highest
#   family.stands_if: the write model under which a refuted family's known adversaries no longer beat it (`model`: its name)

# Premise families: one statement two lanes name and rank differently, or one premise a lane states for several designs.
[family.xor-fold-writes]
what = "a program that outputs the XOR of a cell's words (m of them, or all of them in a pure XOR fold) writes each word and the XOR's three-input LOP3s"
stated = [{ lane = "SHA", name = "XorWrites_m", rank = "4a" }]
status = "refuted"
refuted_by = "under today's W1 (MH100w, predicate writes free): COUNTER's pack (run r20261029-202456-94fa, checked bit for bit; it counts IADD3s, not their carry predicates) undercuts the credit by 28-36% of stock (the XOR fold), 21-24% (xor-16) and 12-15% (xor-11) at the lead's layout; SHA's part Y (run r20261029-203316-fc3f, checked bit for bit, writes modelled) pays 1.396 a word against honest's 1.5 at m 16 (0.931x) and ties at m 11 (0.9997x); credit = stock alone is sound but leaves honest's words and fold uncredited (T1 about 77%)"
model = "predicate writes priced (B1)"
stands_if = "a predicate write is priced as a register write (shalb.py's B1 dataflow rung; SHA Ask 1): the best known adversary then pays 1.375-1.486x honest on a fresh-output IMMA and 1.031-1.115x on the served in-place IGMMA (1.000x against ptxas's 2 + 1/m at m 16); ASSUME's whole-cell fold is not priced so"

[family.trunc-writes]
what = "a program that outputs each word's low 16 bits, two halves a message register, writes 1.5 registers a word"
stated = [{ lane = "SHA", name = "TruncWrites_16", rank = "4a" }]
status = "refuted"
refuted_by = "under today's W1 (predicate writes free): SHA's part Z (run r20261029-203316-fc3f, bit for bit against honest's message registers, writes modelled) pays 1.370 a word against honest's 1.5 (0.913x)"
model = "predicate writes priced (B1)"
stands_if = "a predicate write is priced as a register write (B1): part Z then pays 1.875 a word (1.25x)"

[family.thin-fold]
what = "main's thinFold (Accounting.TS.thinFold): sigma folds two words a three-input instruction, XOR3 and IADD3 steps alternating, sealed with the cell's final word O'; FoldMaterial (a write count) and ThinFoldOpt"
stated = [{ lane = "ASSUME", name = "FoldMaterial + ThinFoldOpt", rank = 5 }]

[family.pair-writes]
what = "a program that outputs NH over a cell's running words, S = sum w(j)·w(j+1), writes one IMAD a pair"
stated = [{ lane = "SKETCH", name = "PairWrites", rank = "4a" }]
status = "refuted"
refuted_by = "COUNTER's decomp (note compute-research/20261029T2053Z-report-hash-counter-nh, run r20261029-204847-d62b, checked bit for bit on 600/600 instances): the lead's zero-data words split as x + R_t(i) + C_t(class, j), so each product's row-only and column-only sums are shared across columns and a tile class's rows, and the cross term runs as u8-digit IMMA chains; the cheapest prover pays 0.29-0.32x stock at the lead's layout, failing T1 by 68-71% of stock (146-149% under PairWrites' own credit)"

[family.fold-opt]
what = "FOLD-OPT (Accounting.Assumptions.TS): honest's fold program is the cheapest that outputs the fold, instantiated at a keyed fold (li, Duo, fx1, or SPARSE's multiply-xor)"
stated = [{ lane = "SPARSE", name = "FOLD-OPT", rank = "4a" }, { lane = "ASSUME", name = "FOLD-OPT", rank = 5 }]

