value = "h >= 108.60 for any noise (108.5906 rounded up; 126.2 at the lead's r); no design in the class cuts h by 1.17x"
label = "proved (the counting: HashFloor.lean on SHA's branch at 9aecd98f55, core Lean, axioms propext and Quot.sound; class C's credit bound is its definition, the hypothesis `credit`)"

[bound.zero-data-ceiling]
lane = "ASSUME"
note = "compute-research/20261029T1926Z-report-hash-assume"
