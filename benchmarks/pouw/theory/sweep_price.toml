# The premises. rank: CORE.md §2's ladder (0 theorem, 1 measured hardware floor, 2 CPU-checkable fact, 3 model
# faithfulness, 4 SAK, 5 hardness). status: proved, measured, ruled, assumed, scratch (proved outside the lock), open
# (stated, not yet proved or run), refuted. A premise closes T1 terms (`closes`), forces honest's committed registers
# (`forces_committed`), makes a word committed every L <= `word_forces_steps` force its L/32 steps, and may require others.
[premise.H32]
rank = 1
status = "measured"
owner = "CORE-H32"
source = "every register written costs >= 32 W1 units on the H200: h200Measured = h100Floor, run r20261029-021534-a5a3 (Lean h32H200Measured, h200MeasuredFloor on cursor/compute-research-core-h32-1e0b)"

[premise.W1]
rank = 3
status = "assumed"
owner = "SW-PREMISES"
source = "MH100w is faithful to the H200: CardWithinAccel, in the lock (CORE.md §2: model faithfulness, rank 3; SW-PREMISES interim #15)"

[premise.atomic-call]
rank = 0
status = "ruled"
owner = "Daniel"
source = "each A·B call is atomic, with fresh noise every call (Daniel, Wed 28 Oct 4:30 and 4:49 PM PDT; CORE.md §1, §2a)"

[premise.period-inventory]
rank = 3
status = "open"
owner = "SW-PREMISES"
source = "every device the prover runs in the monitoring period is counted on both sides of T1, the host's SHA-512 and AMX included; stated in DitherInstance.lean, held open, not in the lock (SW-PREMISES interim #18; SW-LEAN interim §2: what the final-word lemma's grid rests on)"

[premise.final-word-lemma]
rank = 0
status = "scratch"
owner = "SW-LEAN"
requires = ["atomic-call", "period-inventory"]
closes = ["final_word", "pre_noise_hashing", "final_rows"]
source = "SW-LEAN interim: finalWordTarget / finalWord_charged, proved in Security/Proofs/Pouw/Dimension/Scratch/SwLean.lean (cursor/compute-research-sw-lean-fa5d at 19904038b9, art:bef3acdfa62b1252ed4478a6915fd140997ab6a9bd2d1f4ee52030717e42ab9c; axioms clean, run r20261029-044839-bed3), in no lock; on the grid uniform in the call's input, so rank 0 given the atomic call and PeriodInventory. Padding rows, repeated rows and replayed requests make A_i·B free. With the call atomic, work before the noise inside the call (A's commitment, rows of final words) is charged too (CORE-SMELL C28)"

[premise.commit-forced]
rank = 0
status = "open"
owner = "SW-LEAN"
forces_committed = true
source = "SWEEP.md candidate 1. SW-LEAN interim: formed_charged (scratch, no atomicity needed) charges each committed register that moves with the salt and equals no coin word, pairwise-different ones once each, and is exact; beside the final-word lemma (allTarget) each operand register needs (a)-(d), proved for no concrete register yet, and two's-complement X fails (a) (the biased packing passes it, with a u8 x s8 product and a 128·colsum(Y) correction that nothing prices). NCP's R must have no fixed point with sign -1 (X3 = -A there is free: the shift by 24 avoids it); committed E1/F1 need an 8-bit coin grid"

[premise.tensor-semantics]
rank = 1
status = "open"
owner = "SW-SEM"
requires = ["H32"]
source = "SW-PREMISES interim #6 TensorSemantics: a tensor instruction's output register is the captured exact s8 k32 dot of its operand tiles plus its accumulator (P1Int, P2Local, the captured dots), at its measured price; rank 1 with H32's rank-3 completeness (SW-OLD ranks it 3). The bridge into MH100w (whose wgmma writes any function) isn't stated"

[premise.forming-counting]
rank = 0
status = "open"
owner = "SW-SEM"
requires = ["tensor-semantics"]
closes = ["forming"]
source = "CORE-TIME final §3; SW-PREMISES #6; SW-OLD top 3 #1 (Claim P, paper): with the tensor's semantics a program whose words are NCP's bilinear forms writes (3mK + 3nK)/4 formed registers or pays more tensor words; unproved"

[premise.merge-k64]
rank = 0
status = "open"
owner = "SW-SEM"
requires = ["tensor-semantics"]
word_forces_steps = 64
source = "SW-OLD top 3 #2: with tensor semantics, Theorems B and C (a merge saves <= L/2 at kappa = 1/2, a reused word <= L) make merges harmless up to L = 64 at H32's 32 a merge; needs B and C in Lean, kappa = 1/2 proved (only searched), c = 1 for s32 words (the hardest open item) and NCP's noise at rank >= L a chunk (A13). Fast bilinear schemes are priced separately (price.fast_matmul)"

[premise.own-products]
rank = 4
status = "assumed"
owner = "SW-SEM"
word_forces_steps = 1073741824
source = "SW-PREMISES interim #23 OwnProducts: a committed L-sum costs at least L/32 tensor writes, no bilinear exchange or wider instruction cheaper; rank 4 today (CORE-RANK), the only premise that commits less often than every k64"

[premise.lane-semantics]
rank = 3
status = "open"
owner = "SW-PREMISES"
source = "SW-PREMISES interim #16: each lane instruction computes its documented function exactly (Core/Accel Lane), stated for the instance's opcodes with listed gaps (BMSK, MUFU, conversions)"

[premise.one-instruction-minimal]
rank = 2
status = "open"
owner = "SW-PREMISES"
requires = ["lane-semantics"]
closes = ["noise_derivation"]
source = "SW-PREMISES interim #13: no single sm_90 lane instruction computes A + ((h & 63) - 31) bytewise from A and the raw XOF word, so the masked noise register is a distinct noise-dependent write; rank 2 once its CPU check runs (not yet run)"

[premise.SAK]
rank = 4
status = "assumed"
owner = "CORE-RANK"
source = "symmetric algorithmic knowledge on a distribution (CORE.md §2's rank 4): the Dither and Accel families' SAKMatmul"

[premise.ShaSpeed]
rank = 4
status = "assumed"
owner = "SW-HASH"
source = "CORE.md §2a: hashing is credited, no program computes SHA-512 faster than the best implementation; CORE-SMELL C27: SAK for SHA-512, rank 4, needed to delta* = (1% - the other terms) / hashing's work"

# The noise structures. Counts are a call's, in entries, as expressions in m (rows), n (columns) and K (depth):
# r the product's stacked K-blocks; formed_x / formed_y the formed operand entries; noise_x / noise_y the derived noise
# entries (one LOP3 a packed register from XOF bytes, CORE-SMELL C28); denoise the de-noise work in W1 units;
# pre_noise_bytes the bytes hashed before the noise (A's commitment feeds the call's seed).
[noise.ncp]
r = 3
formed_x = "3*m*K"
formed_y = "3*n*K"
noise_x = "m*K"
noise_y = "n*K"
denoise = "0"
pre_noise_bytes = "m*K"
operand_max = 126
served = "int7-pm63"
source = "verity/core/protocols/pouw/schemes/ncp.py: X = [A+E1 | A+E2 | -(A+E3)], Y = [B+F1; B+F2; B+F3], E2 = E1·R and F2 = -R·F1 word moves (word_perm), E3, F3 inside IADD3s; F1 fresh every call; the noise cancels inside the 3K-wide product, no de-noise; E1's seed reads root(A)"

# The designs: a noise × a commitment × a premise set. commit.L is the depth between committed words (32 = every k32
# step), commit.word_bits their width, commit.operands the formed and noise classes committed (formed_x, formed_y,
# noise_x, noise_y), commit.rows_mix_final whether every hm96 row mixes final words with noise-dependent ones.
[design.ncp-k32]
title = "NCP + the rank bound, every k32 word committed (tonight's #1, CORE-TIME / CORE-NCP finals)"
noise = "ncp"
commit = { L = 32, word_bits = 32, operands = [], rows_mix_final = true }
premises = ["H32", "W1", "atomic-call", "ShaSpeed"]
source = "CORE-TIME final; CORE-NCP final"

[design.ncp-k64-nosem]
title = "NCP, a word every 64 steps without the k32 semantics (a control: the uncommitted steps are gap)"
noise = "ncp"
commit = { L = 64, word_bits = 32, operands = ["formed_x", "formed_y", "noise_x", "noise_y"], rows_mix_final = true }
premises = ["H32", "W1", "atomic-call", "period-inventory", "final-word-lemma", "commit-forced", "ShaSpeed"]
source = "a control: density without candidate 2"

# The sweep: every combination of a word every L, the classes committed, how forming is charged when X and Y aren't
# committed (`count`: the counting lemma) and how the derivation is charged when E and F aren't (`min`:
# OneInstructionMinimal). Each takes `base`; L in `steps` adds that entry's premises, a committed class adds
# commit-forced, and `count` / `min` add `charge`'s. Named ncp-k<L>-<classes>[-count][-min].
[sweep.ncp]
noise = "ncp"
L = [32, 64, 128, 256, 512, 1024, 2048]
operands = { w = [], ef = ["noise_x", "noise_y"], xy = ["formed_x", "formed_y"], xyef = ["formed_x", "formed_y", "noise_x", "noise_y"] }
steps = { 64 = ["tensor-semantics", "merge-k64"], above = ["own-products"] }
charge = { count = ["tensor-semantics", "forming-counting"], min = ["lane-semantics", "one-instruction-minimal"] }
base = ["H32", "W1", "atomic-call", "period-inventory", "final-word-lemma", "ShaSpeed"]
source = "SWEEP.md candidates 1 (commit X and Y), 2 (the k32 semantics) and 3 (the final-word lemma); CORE-SMELL C28 (the noise's derivation)"

