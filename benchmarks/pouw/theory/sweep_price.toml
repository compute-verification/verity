# The noise structures. Counts are a call's, in entries, as expressions in m (rows), n (columns) and K (depth):
# r the product's stacked K-blocks; formed_x / formed_y the formed operand entries; noise_x / noise_y the derived noise
# entries (one LOP3 a packed register from XOF bytes, CORE-SMELL C28); denoise the de-noise work in W1 units;
# pre_noise_bytes the bytes hashed before the noise (A's commitment feeds the call's seed).
[noise.ncp]
r = 3
formed_x = "3*m*K"
formed_y = "3*n*K"
noise_x = "m*K"
noise_y = "n*K"
denoise = "0"
pre_noise_bytes = "m*K"
operand_max = 126
served = "int7-pm63"
lane_fix = { U = "3*n*K", "U'" = "4*m*K" }
coin_calls = { coinsncp = ["m*K", "n*K"] }
wide = "measured"
final_target = false
variant = "ncp-k32-sha512-fresh"
source = "verity/core/protocols/pouw/schemes/ncp.py's structure: X = [A+E1 | A+E2 | -(A+E3)], Y = [B+F1; B+F2; B+F3], E2 = E1·R and F2 = -R·F1 word moves (word_perm), E3, F3 inside IADD3s; the noise cancels inside the 3K-wide product, no de-noise; E1's seed reads root(A). The variant priced here is not the tree's ncp-v1 (SW-SMELL P5): k32 words, not every 16-deep step; SHA-512, not SHAKE256; F1 fresh every call, not per (epoch, weight); Y and c0 formed every call, not once per run (circuit/ncp2.py). lane_fix (SW-SMELL S9, entries at reg/4): route U makes X + beta u8 and Y s8, and Y's signed bytes cross zero under the noise, so each Y register takes a second write (24/m); route U' makes X s8 and Y + gamma u8, a second write a X register and the row init -gamma·sum_k A_ik (24/n + 8/n). c0 is fixed per weight on route U (SW-SMELL: the F's cancel in Y's column sums)"

[noise.ssn-a]
r = "32*ceil(K/28)/K"
formed_x = "0"
formed_y = "0"
noise_x = "4*m*ceil(K/28)"
noise_y = "0"
denoise = "0"
pre_noise_bytes = "m*K"
operand_max = 127
served = "ssn-a-b1-v1"
lane_fix = { none = "0" }
coin_calls = { coins = ["4*m*ceil(K/28)"] }
wide = "proportional"
final_target = true
variant = "ssn-a-b1-v1"
source = "SW-NOISE interim §4 (note compute-research/20261029T0511Z-report-sw-noise; noise_sweep.py on cursor/compute-research-sw-noise-5e1a at 2bd86b3343, run r20261029-050602-bc03, art:c5ef8493accf11159affbc36721a185e44d272bcafc12c533fb8f1fe65f733a4): served sparse noise. Each k32 step holds 28 of A's entries and one register a = h & 0x01010101 of a raw 32-bit coin word h a row (one LOP3 a row a step: the derivation, 4 entries a register); Y's 4 rows a step are the public W0, so nothing is formed (the producer writes A in the gapped layout by free moves) and nothing is de-noised; the noise is served, so the final word is a target and no final-word lemma is needed; stock int8 +-127 on both sides, so no lane fix and no wrap. Every k32 word is committed (L 32 only: at L 64 the step count ceil(K/28) is odd at K 8,192, and a word every L > 32 needs SW-SEM's credit, which SW-NOISE didn't price). The stacked width's extra GEMM is priced at the plain GEMM's time a MAC (estimate: no 28+4 kernel exists); coins are 4 XOF bytes a row a step"

# The hm96 row layouts: a_row is A's commitment's leaf ("row": one activation row of K bytes, the shortest chain before
# the call's noise; else bytes, capped at A's), row the leaf of the committed words and operands.
[layout.r16k]
a_row = 16384
row = 16384
source = "CORE-NCP's measured layout: 16 KiB rows everywhere (r20261029-013634-94e5)"

[layout.r256k]
a_row = "row"
row = 262144
source = "SW-HASH §5: 256 KiB rows save 10.7% of hash time a byte and leave 0.43% of it to hiding; A per activation row keeps its root's chain short"

[layout.r1m]
a_row = 262144
row = 1048576
source = "SW-HASH §7 (b): the fewest leaves, so the least hiding (0.12% at 1 MiB); A at 256 KiB rows trades a long chain before the noise for less hiding"

