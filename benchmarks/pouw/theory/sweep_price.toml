# The premises. rank: CORE.md §2's ladder (0 theorem, 1 measured hardware floor, 2 CPU-checkable fact, 3 model
# faithfulness, 4 SAK, 5 hardness). status: proved, measured, ruled, assumed, open (stated, not yet proved or measured),
# refuted. A premise closes T1 terms (`closes`), forces honest's committed registers (`forces_committed`), makes a
# committed word force its uncommitted steps (`word_forces_steps`), and may require others.
[premise.H32]
rank = 1
status = "measured"
owner = "CORE-H32"
source = "every register written costs >= 32 W1 units on the H200: h200Measured = h100Floor, run r20261029-021534-a5a3 (Lean h32H200Measured, h200MeasuredFloor on cursor/compute-research-core-h32-1e0b)"

[premise.W1]
rank = 3
status = "assumed"
owner = "SW-PREMISES"
source = "MH100w is faithful to the H200 (CORE.md §2: model faithfulness, rank 3); unmeasured as a whole"

[premise.atomic-call]
rank = 0
status = "ruled"
owner = "Daniel"
source = "each A·B call is atomic, with fresh noise every call (Daniel, Wed 28 Oct 4:30 and 4:49 PM PDT; CORE.md §1, §2a)"

[premise.final-word-lemma]
rank = 0
status = "open"
owner = "SW-LEAN"
requires = ["atomic-call"]
closes = ["final_word", "pre_noise_hashing", "final_rows"]
source = "CORE-TIME final §2: FinalWordTarget, DistinctWritesFloor at the call's own words (input, coin, formed operand words, constants), not their span; stated, not proved. With the call atomic, work before the noise inside the call (A's commitment, rows of final words) is charged too (CORE-SMELL C28)"

[premise.commit-forced]
rank = 0
status = "open"
owner = "SW-LEAN"
requires = ["final-word-lemma"]
forces_committed = true
source = "SWEEP.md candidate 1: a committed, pairwise-distinct, noise-dependent formed operand or noise register is a DistinctWrites target, so committing X and Y (and E, F) forces forming (and deriving). Needs the final-word lemma at a free set without the formed words (CORE-TIME's FreeCall holds them, which would leave them free), and distinctness where A or B has a zero 4-entry group (X1 = E1 there)"

[premise.k32-semantics]
rank = 3
status = "open"
owner = "SW-SEM"
requires = ["H32"]
word_forces_steps = true
source = "SWEEP.md candidate 2: a tensor instruction writes a k32 partial sum of its operand registers, not any function; with its counting lemma a word committed every L forces L/32 k32 steps. Rank provisional (3, model faithfulness) until SW-SEM rules"

[premise.forming-counting]
rank = 0
status = "open"
owner = "SW-SEM"
requires = ["k32-semantics"]
closes = ["forming"]
source = "CORE-TIME final §3: with the tensor's real semantics, a program whose words are NCP's bilinear forms writes (3mK + 3nK)/4 formed registers or pays more tensor words; neither part exists"

[premise.SAK]
rank = 4
status = "assumed"
owner = "CORE-RANK"
source = "symmetric algorithmic knowledge on a distribution (CORE.md §2's rank 4): the Dither and Accel families' SAKMatmul"

[premise.ShaSpeed]
rank = 4
status = "assumed"
owner = "SW-HASH"
source = "CORE.md §2a: hashing is credited, no program computes SHA-512 faster than the best implementation; CORE-SMELL C27: SAK for SHA-512, rank 4, needed to delta* = (1% - the other terms) / hashing's work"

# The noise structures. Counts are a call's, in entries, as expressions in m (rows), n (columns) and K (depth):
# r the product's stacked K-blocks; formed_x / formed_y the formed operand entries; noise_x / noise_y the derived noise
# entries (one LOP3 a packed register from XOF bytes, CORE-SMELL C28); denoise the de-noise work in W1 units;
# pre_noise_bytes the bytes hashed before the noise (A's commitment feeds the call's seed).
[noise.ncp]
r = 3
formed_x = "3*m*K"
formed_y = "3*n*K"
noise_x = "m*K"
noise_y = "n*K"
denoise = "0"
pre_noise_bytes = "m*K"
served = "int7-pm63"
source = "verity/core/protocols/pouw/schemes/ncp.py: X = [A+E1 | A+E2 | -(A+E3)], Y = [B+F1; B+F2; B+F3], E2 = E1·R and F2 = -R·F1 word moves (word_perm), E3, F3 inside IADD3s; F1 fresh every call; the noise cancels inside the 3K-wide product, no de-noise; E1's seed reads root(A)"

# The designs: a noise × a commitment × a premise set. commit.L is the depth between committed words (32 = every k32
# step), commit.word_bits their width, commit.operands the formed and noise classes committed (formed_x, formed_y,
# noise_x, noise_y), commit.rows_mix_final whether every hm96 row mixes final words with noise-dependent ones.
[design.ncp-k32]
title = "NCP + the rank bound, every k32 word committed (tonight's #1, CORE-TIME / CORE-NCP finals)"
noise = "ncp"
commit = { L = 32, word_bits = 32, operands = [], rows_mix_final = true }
premises = ["H32", "W1", "atomic-call", "ShaSpeed"]
source = "CORE-TIME final; CORE-NCP final"

[design.ncp-k64-nosem]
title = "NCP, a word every 64 steps without the k32 semantics (a control: the uncommitted steps are gap)"
noise = "ncp"
commit = { L = 64, word_bits = 32, operands = ["formed_x", "formed_y", "noise_x", "noise_y"], rows_mix_final = true }
premises = ["H32", "W1", "atomic-call", "final-word-lemma", "commit-forced", "ShaSpeed"]
source = "a control: density without candidate 2"

# The sweep: every combination of a word every L, the classes committed, and how forming is charged when X and Y aren't
# committed ("none", or the counting lemma). Each takes `base`; L > 32 adds k32-semantics, a committed class adds
# commit-forced, and the counting lemma adds forming-counting (and k32-semantics). Named ncp-k<L>-<classes>[-count].
[sweep.ncp]
noise = "ncp"
L = [32, 64, 128, 256]
operands = { w = [], ef = ["noise_x", "noise_y"], xy = ["formed_x", "formed_y"], xyef = ["formed_x", "formed_y", "noise_x", "noise_y"] }
forming = ["none", "count"]
base = ["H32", "W1", "atomic-call", "final-word-lemma", "ShaSpeed"]
source = "SWEEP.md candidates 1 (commit X and Y), 2 (the k32 semantics) and 3 (the final-word lemma); CORE-SMELL C28 (the noise's derivation)"

