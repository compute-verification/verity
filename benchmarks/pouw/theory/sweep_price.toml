# The PoUW sweep's card (sweep_price.py): every price, shape, point, premise, noise and design it reads, each with its
# source. `kind` is "measured" (a run id in `source`), "estimate" (its basis in `source`) or "arith" (exact from the
# definitions). The calculator refuses a design whose field is missing or "?", so an unpriced term can't rank.

schema = "sw-price/card/v1"

[price.reg]
value = 32
unit = "W1 units a 32-bit register written"
kind = "measured"
source = "CORE-H32 final: the H200's table is h100Floor (tc, ffma, int32, fp64, other all 32), run r20261029-021534-a5a3, replicate r20261029-014532-a2da; cheapest int32 writer 32.277 (IMAD beside LOP3)"

[price.entries_per_reg]
value = 4
unit = "int8 entries a 32-bit register"
kind = "arith"
source = "four packed int8 entries a register, so a formed or derived entry costs reg/4 = 8 at the floor"

[price.hash_work]
value = 1774.85
unit = "W1 units a hashed byte"
kind = "estimate"
source = "HASH-38's bar, the public best SHA-512 on the H200: 0.01803 compressions an SM-clock (r20261027-044217-d499, r20261027-062350-7163), 128 B a compression, priced at its issue time, 4096/(128 x 0.01803) (CORE-SMELL C27: pricing an issue-bound hash at its time; co-issue would raise it)"

[price.hash_work_committer]
value = 2123.4
unit = "W1 units a hashed byte"
kind = "estimate"
source = "GD-HASH's h_x at 16 KiB hm96 rows, framing and tree included (art:5cf3621a988a946e98dcb8d36eafbecc3496b898df7ae7f481f757f5308ff991); the committer, not the best possible"

[price.hash_rate]
value = 519.63e9
unit = "B/s"
kind = "measured"
source = "SHA-512 leaves and the level-form tree over 64 GiB of 16 KiB hm96 rows in 132.2461 ms, vy-dc-h200-5, run r20261029-013634-94e5 (CORE-NCP final)"

[price.coin_rate]
value = 4.449e9
unit = "SHA-512 compressions/s"
kind = "measured"
source = "the committer's leaves, run r20261029-013634-94e5 (CORE-NCP final); a fresh noise matrix's coins are one XOF byte an entry, 64 a compression"

[price.coin_bytes]
value = 2
unit = "hashed bytes a derived noise entry"
kind = "arith"
source = "one XOF byte a noise entry and 64 XOF bytes a 128-byte compression: each entry's coins cost two hashed bytes of credited work under ShaSpeed (the adversary needs the noise to write noise-dependent words)"

[price.mac_rate_peak]
value = 9.89e14
unit = "int8 MAC/s"
kind = "measured"
source = "CORE-TIME final: one H200's tensor peak, 127.99 k32 words/SM-clk x 132 SMs at 1.83 GHz"

[price.and_per_mac]
value = 129.9375
unit = "AND gates an int8 MAC"
kind = "estimate"
source = "CORE-TIME final's per-period tables: 2,079/16 AND gates an int8 MAC (relayed, not re-derived here)"

# Per monitoring period (AGENTS.md): the datacenter and the world, from the census.
[scale]
datacenter_gpus = 100000
window_s = 600
datacenter_source = "benchmarks/census/deployments.json dc-12500-machines-600s: 12,500 machines of 8 GPUs, 10-minute windows (its GPUs taken as H200s, an estimate)"
world_mac_per_year = 4.68e30
world_source = "benchmarks/census/adversary.json world-inference-2027: 9.36e30 FLOP a year, 2 FLOP a MAC"

