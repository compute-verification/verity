# The sweep: every combination of a word every L, how a word every L > 32 is credited (`credit`: SW-SEM's BamFloor at
# rank <= 3, or NoSharingGain), the classes committed, how forming is charged when X and Y aren't committed (`count`:
# the counting lemma), how the derivation is charged when E and F aren't (`min`: OneInstructionMinimal), the row layout,
# how the salt side's hiding is charged (`hiding`), and the route. Each takes `base`; a credit adds its premises, a
# committed class adds commit-forced, and `count`, `min`, `hiding` and `routes` add theirs. Named
# <noise>-k<L>[-<credit>]-<classes>[-count][-min]-<layout>[-<hiding>][-u2]. The k64 merge charge is refuted (SW-OLD
# final) and swept no more.
[sweep.ncp]
noise = "ncp"
L = [32, 64, 128, 256, 512, 1024, 2048]
credit = { bam = ["tensor-semantics", "class-semantics", "alg-suff-l", "bam-floor", "ncp-r-check"], nsg = ["tensor-semantics", "class-semantics", "no-sharing-gain", "ncp-r-check"] }
operands = { w = [], ef = ["noise_x", "noise_y"], xy = ["formed_x", "formed_y"], xyef = ["formed_x", "formed_y", "noise_x", "noise_y"] }
charge = { count = ["tensor-semantics", "class-semantics", "forming-counting"], min = ["lane-semantics", "one-instruction-minimal"] }
layouts = ["r16k", "r256k", "r1m"]
hiding = { open = [], salt = ["salt-forced"], mask = ["salt-forced", "mask-optimal"], hr = ["hiding-ruled"] }
routes = { U = [], mix = ["route-u2"] }
base = ["H32", "W1", "atomic-call", "period-inventory", "weights-distinct", "final-word-lemma", "ShaSpeed", "hash-compose"]
source = "SWEEP.md candidates 1 (commit X and Y), 2 (the k32 semantics) and 3 (the final-word lemma); CORE-SMELL C28 (the noise's derivation); SW-HASH §5, §7 (rows, hiding); SW-SMELL S9 (routes); SW-SEM interim (the credit a word every L)"

[sweep.ssn]
