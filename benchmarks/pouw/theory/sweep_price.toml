# The premises. rank: CORE.md §2's ladder (0 theorem, 1 measured hardware floor, 2 CPU-checkable fact, 3 model
# faithfulness, 4 SAK, 5 hardness). status: proved, measured, ruled, assumed, scratch (proved outside the lock), open
# (stated, not yet proved or run), refuted. A premise closes T1 terms (`closes`; hiding_salt credits the salt side's PRF
# and c as hashing, hiding_mask closes M_key·y, hiding the whole salt side), forces honest's committed registers
# (`forces_committed`), charges a committed word every L steps `word_units` W1 units (an expression in L and reg; `reg`
# without one, MH100w's anyFunctionCeiling), with the fast scheme's saving charged against it when `fast_saving`, and
# may require others.
[premise.H32]
rank = 1
status = "measured"
owner = "CORE-H32"
source = "every register written costs >= 32 W1 units on the H200: h200Measured = h100Floor, run r20261029-021534-a5a3 (Lean h32H200Measured, h200MeasuredFloor on cursor/compute-research-core-h32-1e0b)"

[premise.W1]
rank = 3
status = "assumed"
owner = "SW-PREMISES"
source = "MH100w is faithful to the H200: CardWithinAccel, in the lock (CORE.md §2: model faithfulness, rank 3; SW-PREMISES interim #15)"

[premise.atomic-call]
rank = 0
status = "ruled"
owner = "Daniel"
closes = ["pre_noise_hashing", "final_rows"]
source = "each A·B call is atomic, with fresh noise every call (Daniel, Wed 28 Oct 4:30 and 4:49 PM PDT; CORE.md §1, §2a). The call's noise seed reads root(A), so A's commitment is hashed by any program that gets the noise: credited hashing under ShaSpeed (SW-SMELL P3; CORE-SMELL C28), as are rows of final words"

[premise.hash-compose]
rank = 4
status = "open"
owner = "SW-LEAN"
source = "SW-SMELL P3: adding ShaSpeed's credit for hashed bytes to DistinctWrites' bound (MH100w) needs a composition of MH100w with ShaSpeed (Accel) that no lemma states; every design that credits hashing takes it, beside ShaSpeed"

[premise.weights-distinct]
rank = 2
status = "open"
owner = "SW-LEAN"
source = "SW-SMELL S8: the final-word lemma's distinctness fails on a zero or duplicate column of the fixed weights B (a free constant, or one target for two) and on padding rows; a CPU check per checkpoint (and real rows only), not yet run"

[premise.salt-forced]
rank = 0
status = "open"
owner = "SW-HASH"
closes = ["hiding_salt"]
source = "SW-HASH interim §7 (a): each drawn unit's proof checks y = PRF_ks(pos) against a committed ks, and c = H(salt_prefix ‖ y), so a fixed-salt prover is caught and ShaSpeed credits the PRF and c; M_key·y stays unforced. A protocol change, not built; the drawn unit's added proof work is outside the served step"

[premise.mask-optimal]
rank = 4
status = "open"
owner = "SW-HASH"
requires = ["salt-forced"]
closes = ["hiding_mask"]
source = "SW-HASH interim §7: honest's table product M_key·y (960 shared-memory loads and XORs a leaf, a GF(2) product) is the cheapest way to compute it; unstated, rank 4 like SAK for one map"

[premise.hiding-ruled]
rank = 0
status = "open"
owner = "Daniel (through the coordinator)"
closes = ["hiding"]
source = "SW-HASH interim §7 (c): zero knowledge is mandated, so the salt side's hiding work is credited by ruling, not by a premise about the adversary; no ruling yet"

[premise.route-u2]
rank = 0
status = "open"
owner = "SW-LEAN"
source = "SW-SMELL S9: route U' (X s8, Y + gamma u8, the row init) needs its own Lean definition of the checked values (mmWU is u8 x s8); with it honest takes, per linear, the cheaper of route U's Y lane fix (24/m) and route U''s (32/n)"

[premise.period-inventory]
rank = 3
status = "open"
owner = "SW-PREMISES"
source = "every device the prover runs in the monitoring period is counted on both sides of T1, the host's SHA-512 and AMX included; stated in DitherInstance.lean, held open, not in the lock (SW-PREMISES interim #18; SW-LEAN interim §2: what the final-word lemma's grid rests on)"

[premise.final-word-lemma]
rank = 0
status = "scratch"
owner = "SW-LEAN"
requires = ["atomic-call", "period-inventory", "weights-distinct"]
closes = ["final_word"]
source = "SW-LEAN interim: finalWordTarget / finalWord_charged, proved in Security/Proofs/Pouw/Dimension/Scratch/SwLean.lean (cursor/compute-research-sw-lean-fa5d at 19904038b9, art:bef3acdfa62b1252ed4478a6915fd140997ab6a9bd2d1f4ee52030717e42ab9c; axioms clean, run r20261029-044839-bed3), in no lock; on the grid uniform in the call's input, so rank 0 given the atomic call and PeriodInventory. Padding rows, repeated rows and replayed requests make A_i·B free, as do zero or equal weight columns (SW-SMELL S8: weights-distinct)"

[premise.commit-forced]
rank = 0
status = "open"
owner = "SW-LEAN"
forces_committed = true
source = "SWEEP.md candidate 1. SW-LEAN interim: formed_charged (scratch, no atomicity needed) charges each committed register that moves with the salt and equals no coin word, pairwise-different ones once each, and is exact; beside the final-word lemma (allTarget) each operand register needs (a)-(d), proved for no concrete register yet, and two's-complement X fails (a) (the biased packing passes it: route U's u8 x s8 product, whose c0 = -beta·colsum(Y) is fixed per weight, SW-SMELL). NCP's R must have no fixed point with sign -1 (X3 = -A there is free: the shift by 24 avoids it); committed E1/F1 need an 8-bit coin grid. It forces the committed register once, not route U's second write to it (lane_fix)"

[premise.tensor-semantics]
rank = 1
status = "open"
owner = "SW-SEM"
requires = ["H32"]
source = "SW-PREMISES interim #6 TensorSemantics: a tensor instruction's output register is the captured exact s8 k32 dot of its operand tiles plus its accumulator (P1Int, P2Local, the captured dots), at its measured price; rank 1 with H32's rank-3 completeness (SW-OLD ranks it 3). The bridge into MH100w (whose wgmma writes any function) isn't stated"

[premise.class-semantics]
rank = 1
status = "open"
owner = "SW-SEM"
requires = ["H32", "tensor-semantics"]
source = "SW-SEM interim (H100Sem.lean on cursor/compute-research-sw-sem-0bb6 at 7efe5af4cb): every instruction class semantic, .int, .other and .fp64 as well as the tensor (rank 1, the ISA as the H200 executes it). tcOnlyCeiling (proved): the tensor premise alone buys nothing, since a program with no tensor instruction meets it and writes any word at 32 by .other"

[premise.forming-counting]
rank = 0
status = "open"
owner = "SW-SEM"
requires = ["tensor-semantics", "class-semantics"]
closes = ["forming"]
source = "CORE-TIME final §3; SW-PREMISES #6; SW-OLD final pick 1 (Claim P with Theorem C, paper): with the tensor's semantics a program whose words are NCP's bilinear forms writes (3mK + 3nK)/4 formed registers or pays more tensor words; unproved. It takes every class semantic, not the tensor's alone: by SW-SEM's tcOnlyCeiling a program writing NCP's words by .other at 32 each forms nothing and meets the tensor premise"

[premise.merge-k64]
rank = 0
status = "refuted"
owner = "SW-SEM"
requires = ["tensor-semantics"]
word_units = "reg*L/32 if L <= 64 else reg"
fast_saving = true
source = "refuted by SW-OLD final (note compute-research/20261029T0450Z-report-sw-old, art:23672edccf40d63a2c04662f14ec099d1473d7ccc155c2c2cba7fffc96cbced7): Theorem B's kappa = 1 is asymptotically tight, about 35 saved a merge at L 64 against 32 a register, so merge counting certifies no more than write counting. Was SW-OLD top 3 #2 (kappa = 1/2 by search)"

[premise.alg-suff-l]
rank = 3
status = "open"
owner = "SW-SEM"
source = "SW-SEM interim AlgSuffL, A2's analogue for a word every L: nonlinear lanes (bit planes, nibbles, lookups) don't beat bilinear ones; model faithfulness, rank 3"

[premise.bam-floor]
rank = 2
status = "open"
owner = "SW-SEM"
requires = ["class-semantics", "alg-suff-l"]
word_units = "64 - 1024/L"
source = "SW-SEM interim BamFloor, the counting lemma: with every class semantic a committed word every L steps costs at least 64 - 1024/L (48 at L 64, 56 at L 128, 60 at L 256), which is all rank <= 3 premises certify; a floor over every program, so no fast scheme is charged against it. Its arithmetic core lcommitFloorArith and the rank fact innerProductRank are proved; the combinatorial step (a merge-free word's chain has L/32 registers of its own) is a prose sketch, rank 2 once proved"

[premise.no-sharing-gain]
rank = 5
status = "open"
owner = "SW-SEM"
requires = ["class-semantics"]
word_units = "reg*L/32"
fast_saving = true
source = "SW-SEM interim NoSharingGain (open, rank 4 to 5; priced at 5): a lower bound on matrix multiplication's cost, a committed L-sum costing L/32 registers with merges priced and operand ranges enforced; false without the operand ranges (one Strassen-Winograd level gains past L about 256-384), so the fast scheme's saving at the operands' range is charged against it. Replaces SW-PREMISES' OwnProducts (#23, rank 4)"

[premise.ncp-r-check]
rank = 2
status = "open"
owner = "SW-SEM"
source = "SW-SEM interim: NCP's noise isn't fresh (blocks 2 and 3 reuse E1 through R), so a bound for a word every L covers NCP only after a rank-modulo-earlier check per R; a CPU check, not yet run"

[premise.ssn-distinct]
rank = 0
