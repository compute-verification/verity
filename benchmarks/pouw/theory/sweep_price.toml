           ["router", 384, 7168, 61, 1.0], ["shared_gate_up", 6144, 7168, 61, 1.0], ["shared_down", 7168, 3072, 61, 1.0],
           ["expert_gate_up", 6144, 7168, 23424, 0.015625], ["expert_down", 7168, 3072, 23424, 0.015625]]
