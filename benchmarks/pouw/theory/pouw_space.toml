# The PoUW design space's card (pouw_space.py): every price, shape, point, premise and module it reads, each with its
# source, and the cards that name designs. `kind` is "measured" (a run id in `source`), "estimate" (its basis in
# `source`), "checked" (a CPU run) or "arith" (exact from the definitions). The calculator refuses a design whose field
# is missing or "?", so an unpriced term can't rank.

schema = "np-card/space/v1"

[price.reg]
value = 32
unit = "W1 units a 32-bit register written"
kind = "measured"
source = "CORE-H32 final: the H200's table is h100Floor (tc, ffma, int32, fp64, other all 32), run r20261029-021534-a5a3, replicate r20261029-014532-a2da; cheapest int32 writer 32.277 (IMAD beside LOP3)"

[price.entries_per_reg]
