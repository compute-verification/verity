source = "SW-PREMISES final #13: OneInstructionMinimal"

# Attacks (NIGHT.md §5): a design taking a premise or module an open attack targets (and, when `with_any` is given,
# one of those too) can't rank first. An attack the card prices as a term says so in `priced`.
[attack.chosen-rows]
status = "open"
targets = ["ssn-1l", "ssn-1l5", "ssn-a", "ssn2", "nsf", "lowrank1"]
priced = "coin_branch (identical rows; zero and prefix rows save more)"
source = "N-RED interim 1 A1, A1b, A2 (run r20261029-072732-aba9, checked word for word): a prover that reads the call's coins collapses identical rows to one vector a class, 19.3% / 66.0% / 100.2% of stock at m 64 / 512 / 8,192; rows equal to their last block 19.2-99.1%; zero tails 51.5-51.7% at every m. N-PREM interim 1 §2 (coin branch, simulated): ssn_1l 24.0% / 74.7% / 101.7% identical and 96-104% zero rows; ssn_a 1.2-10.0% identical and 8.6-42.8% zero; nsf about 100% on zero rows. ssn2 shares ssn_a's row lanes (its column bits are common to every row) and lowrank1's u is one coin byte a row (N-CARD's reading, unchecked by either lane)"

[attack.zero-data]
