# The space (NIGHT.md §2): a design is one module a slot, and the calculator enumerates every compatible composition.
# Each module contributes `fields`, expressions in m (rows), n (columns), K (depth), reg and epr and in other modules'
# fields, which the composition merges (a field defined twice is a card error, except that a module overrides
# [space]'s defaults and a noise's table for one de-noise overrides the noise's own fields); `premises` it takes
# (`premises_when`: [expression, premises] pairs); `needs`, the fields another module must provide; and `when`, an
# expression over the composition's fields at a probe shape that must hold. A module with `enumerate = false` is
# reachable only from a card. `name` is its fragment in the design's name ("" omits it). `like = "<id>"` copies a module
# of the same slot: its fields and de-noise tables merge under this module's, its premises add, its other keys are
# replaced. Counts are a call's, in entries unless named in W1 units (format_forming, a format's own work, is W1 units
# and adds to forming). The calculator refuses a design that leaves a field it reads unpriced, so an unpriced term
# can't rank.
[space]
slots = [["N", "noise"], ["D", "denoise"], ["F", "format"], ["C", "density"], ["C", "operands"], ["H", "rows"],
         ["H", "hiding"], ["P", "final"], ["P", "forming"], ["P", "derivation"]]
base = ["H32", "card-within-accel-w1", "adaptive-dw", "atomic-call", "row-bound", "period-inventory", "host-row", "ShaSpeed", "sha-writes", "carried-words", "hash-compose"]
fields = { pre_noise_bytes = "m*K", rows_mix_final = 1, word_bits = 32, format_forming = 0 }
probe = { m = 64, n = 2048, K = 2048 }
source = "NIGHT.md §2's axes; base: the DistinctWrites price at H32 in W1 (CardWithinAccelW1 at 32, N-W1), stated for programs that read the coins (adaptive-dw), the atomic call for A's commitment hashed before the noise and each row digest bound to (salt, forward, position) (N-COMPOSE), PeriodInventory with HostsCounted at θ's rows and its host row (N-FLOOR final), and the hashing credit (ShaWrites at ShaLB's count, ShaSpeed's form and the composition its theorems, with CarriedWords, NIGHT §1 default 1)"

# N, the noise. Fields: noise_x / noise_y the derived noise entries (one LOP3 a packed register from XOF bytes, CORE-SMELL
# C28), derive_extra the derivation's intermediates no commitment holds, dup the share of words the data repeats, n_max
# the most columns its distinctness lemma covers, branch_rows the row-words a call a prover that branches on the coins
# skips on m identical chosen rows (a row-word whose vector equals an earlier row's at this salt is a copy, free in
# MH100w: N-RED A1, N-PREM's coin branch; rep_sum and rep_bits are its exact expected counts, rep_lanes an estimate
# that takes the state to be the lanes' sums); `coins` the XOF bytes a call by the measured table that times them
# (also the coins' credited hashing, two hashed bytes a byte); `t3` the served format by F when served. [N.<id>.D.<d>]
# holds what the noise needs under de-noise d: r the stacked width over K, formed_x / formed_y the formed operand
# entries, denoise in W1 units, operand_max, wide_measured (1: T2 prices the extra width by GD-DENOISE's measured 3K
# call; 0: at the plain GEMM's time a MAC), fix_U / fix_U2 route U's and U''s second writes (SW-SMELL S9).
[N.ncp]
title = "NCP: E1, F1 fresh a call, E2 = E1·R, F2 = -R·F1 word moves, E3, F3 inside IADD3s"
fields = { noise_x = "m*K", noise_y = "n*K", derive_extra = "0", dup = 0, noise_max = 63, branch_rows = "0" }
coins = { coinsncp = ["m*K", "n*K"] }
premises_when = [["L > 32", ["ncp-r-check"]]]
variant = "ncp-k32-sha512-fresh"
source = "verity/core/protocols/pouw/schemes/ncp.py's structure; E1's seed reads root(A). The variant priced here is not the tree's ncp-v1 (SW-SMELL P5): k32 words, not every 16-deep step; SHA-512, not SHAKE256; F1 fresh every call, not per (epoch, weight); Y and c0 formed every call, not once per run (circuit/ncp2.py)"

