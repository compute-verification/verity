output_adds = 7
operand_adds = 8
max_levels = 4
tensor_max = 127
kind = "estimate"
source = "Strassen-Winograd on 2x2 blocks, the best-known bilinear scheme by additions: 7 products ([A summed, B summed] each), 7 output-block and 4 + 4 operand-block additions a level. A summed operand side whose range passes the s8 tensor's 127 is split into two s8 parts, so its product costs two k32 steps a side (P1's floor, scheme_floor; SW-OLD A11); FP16 at k16 costs the same. Charged against the k32 counting whenever it saves (a lower bound on the adversary's saving, not a proof that nothing saves more)"

