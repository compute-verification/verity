# The premises. rank: NIGHT.md §1's ladder (0 theorem, 1 measured hardware floor, 2 CPU-checkable fact, 3 model
# faithfulness or protocol premise, 4a algorithmic knowledge about a standardized public primitive (ShaSpeed on SHA-512),
# 4bU SAK on literally uniform operands, 4b SAK or an algorithmic restriction on our own noised operands, 5 hardness).
# part: the argument the premise serves, "matmul" (the default) or "hashing" (the credit for hashed bytes); a design's
# overall rank is the larger of its parts' (NIGHT §1 default 5). status: proved, measured, ruled, assumed, scratch
# (proved in Lean with clean axioms, in no lock), open (stated, not yet proved or run), refuted. An open premise ranks 5
# until settled. A premise closes T1 terms (`closes`; hiding_salt credits the salt side's PRF and c as hashing,
# hiding_mask closes M_key·y, hiding the whole salt side), forces honest's committed registers (`forces_committed`),
# charges a committed word every L steps `word_units` W1 units (an expression in L and reg; `reg` without one, MH100w's
# anyFunctionCeiling), with the fast scheme's saving charged against it when `fast_saving`, and may require others.
