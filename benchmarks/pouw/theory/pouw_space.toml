# H, the hashing: hm96 rows (a_row A's commitment's leaf, row the leaf of the committed words and operands; under a
# subtree layout the chunk a subtree leaf holds) and how the salt side's hiding is charged. The hiding term counts
# salts (N-HIDE): `layout` "l0" (the default) salts every leaf; "l1" one hm96 instance a call over a subtree of its
# committed values, plus `forward_salts` a forward; "l2" one instance a forward or a window (`forward_salts`), root(A_j)
# private. hash_time_ratio, when given, is the layout's hash time a byte against 16 KiB rows (T2).
[H.rows.r16k]
fields = { a_row = 16384, row = 16384 }
source = "CORE-NCP's measured layout: 16 KiB rows everywhere (r20261029-013634-94e5)"

[H.rows.r256k]
fields = { a_row = "K", row = 262144 }
source = "SW-HASH §5: 256 KiB rows save 10.7% of hash time a byte; A per activation row keeps its root's chain short"

[H.rows.r1m]
fields = { a_row = 262144, row = 1048576 }
source = "SW-HASH §7 (b): the fewest leaves, so the least hiding; A at 256 KiB rows trades a long chain before the noise for less hiding"

[H.rows.l1]
layout = "l1"
forward_salts = 1
fields = { a_row = "K", row = 16384, hash_time_ratio = 0.9307 }
premises = ["subtree-layout"]
source = "N-HIDE interim 1 §1-2 (L1): instance j covers call j-1's words and call j's A rows, its root root(A_j) in seed_j, so one salt a call and one more a forward (65 a forward on Llama, against 6.4e7 at 16 KiB rows); words in 16 KiB chunks at 0.9307 of 16 KiB rows' hash time (estimate, scaled from SW-HASH's leaf kernels); A's rows as subtree leaves, one an activation row (the card's chain count)"

[H.rows.l2f]
layout = "l2"
forward_salts = 1
fields = { a_row = "K", row = 16384, hash_time_ratio = 0.9307 }
premises = ["subtree-layout", "private-roots"]
source = "N-HIDE interim 1 §1-2 (L2 a forward): the forward's calls are leaves of one tree under one hm96 instance, root(A_j) private and opened in the unit's proof; one salt a forward"

[H.rows.l2w]
layout = "l2"
forward_salts = 0
fields = { a_row = "K", row = 16384, hash_time_ratio = 0.9307 }
premises = ["subtree-layout", "private-roots"]
source = "N-HIDE interim 1 §1-2 (L2 a window): one hm96 instance a window, about 0 salts a forward (N-HIDE: 1e-11 of stock at T 8,192)"

[H.hiding.open]
source = "the salt side's PRF, M_key·y and c charged as honest-only work (NIGHT.md §1 default 2)"

[H.hiding.salt]
premises = ["salt-forced"]
source = "SW-HASH §7 (a): the drawn unit's proof checks y = PRF_ks(pos) and c, so ShaSpeed credits them; M_key·y stays"

[H.hiding.mask]
premises = ["salt-forced", "mask-optimal"]
source = "SW-HASH §7 (a) and (b): the PRF and c forced, M_key·y closed by mask-optimal (rank 4a, likely false as worded: SW-SMELL final §2.4)"

[H.hiding.hr]
premises = ["hiding-ruled"]
source = "the hiding ruling, ruled out by NIGHT.md §1 default 2"

[H.hiding.cert]
premises = ["trusted-host", "certifier-salt"]
source = "R1b: the salt side from the certifier (premise certifier-salt)"

# P, the premise sets that close a term: the final word (the final-word lemma, when the final word is free), forming
# (the counting lemma, when the formed operands aren't committed) and the noise's derivation (OneInstructionMinimal).
[P.final.none]
name = ""
source = "the final word free in M0 when the noise cancels, and with it a whole segment (N-SAKU's skip, L/K)"

[P.final.fw]
