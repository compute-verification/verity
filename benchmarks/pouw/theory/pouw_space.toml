# The PoUW design space's card (pouw_space.py): every price, shape, point, premise and module it reads, each with its
# source, and the cards that name designs. `kind` is "measured" (a run id in `source`), "estimate" (its basis in
# `source`), "checked" (a CPU run) or "arith" (exact from the definitions). The calculator refuses a design whose field
# is missing or "?", so an unpriced term can't rank.

schema = "np-card/space/v1"

[price.reg]
value = 32
unit = "W1 units a 32-bit register written"
kind = "measured"
source = "CORE-H32 final: the H200's table is h100Floor (tc, ffma, int32, fp64, other all 32), run r20261029-021534-a5a3, replicate r20261029-014532-a2da; cheapest int32 writer 32.277 (IMAD beside LOP3)"

[price.entries_per_reg]
value = 4
unit = "int8 entries a 32-bit register"
kind = "arith"
source = "four packed int8 entries a register, so a formed or derived entry costs reg/4 = 8 at the floor"

[price.hash_work]
value = 883.0
unit = "W1 units a hashed byte"
kind = "measured"
source = "N-SHALB interim 2 §1 (note compute-research/20261029T0846Z-report-np-shalb; sha512_min.cuh's chain form, run r20261029-082755-3f9c on vy-dc-h200-5, art:775d93887e3480c696cfb46a7d9d5e5145d000c8c8f7422746d4f315a3a35eaa, bit-exact on the H200): two consecutive blocks of one chain share their boundary (H3 and H7 left as two terms and added in free IADD3 slots), 7,064 registers a pair, so 3,532 a chained compression, 3,532 x 32 / 128 a byte; a chain is the bulk of hm96 (2,049 of a 256 KiB leaf's 2,056 compressions). Was 3,534 (interim 1, independent compressions), which over-credits a chain by 2 registers, 6.5% of stock at SSN (N-FLOOR's incident 2). W1 counts registers, and CORE.md §2a takes the honest program to be the best, so every T1 term that prices hashing reads this; ShaLB with the chain clause is rank 4a and names its numbers (sha-writes)"

[price.hash_work_iv]
value = 877.5
unit = "W1 units a hashed byte"
kind = "measured"
source = "N-SHALB interim 2 §4: a compression from a constant chaining value (a digest's first block, the IV) writes 3,510 registers, 3,510 x 32 / 128 a byte; the row binding's prefix block (salt, forward, position) is that form. The other forms: 3,534 an independent compression (variable chaining value and block), 2,254 a constant block (SASS run r20261029-074922-d49c, art:89d31f3a0f7d7440f934833133332c825f2d05d4dfb724f8064aa938f5b38130)"

[price.hash_work_bar]
value = 1774.85
unit = "W1 units a hashed byte"
kind = "estimate"
source = "HASH-38's bar, the public best SHA-512 on the H200: 0.01803 compressions an SM-clock (r20261027-044217-d499, r20261027-062350-7163), 128 B a compression, priced at its issue time, 4096/(128 x 0.01803) (CORE-SMELL C27). A time price, not a register count: read only by the checks that reproduce CORE-SMELL C27 and C28, which priced hashing at it"

[price.sha_and]
value = 58120
unit = "AND gates a SHA-512 compression"
kind = "arith"
source = "N-SHALB interim 1, Per monitoring period: SHA-512's compression as a Boolean circuit, 58,120 AND gates (454 a hashed byte); the per-period table prints the credited hashing in these real AND gates beside its W1 at stock's AND rate (N-SMELL item 36)"

[price.hash_work_floor]
value = 908.0
unit = "W1 units a hashed byte, at H32's floor"
kind = "measured"
source = "SW-HASH final (note compute-research/20261029T0535Z-report-sw-hash, its sources table): SHA-512 a compression in the committer's build on sm_90a writes 3,632 registers, 116,224 W1 units at the floor table (h200Measured = h100Floor), SASS run r20261029-044108-5169; 116,224/128 a byte. The committer as served (N-SHALB confirms 3,632 rolled), 2.7% over hash_work's best count: its excess is the committer gap a needs list prints, and SW-HASH's leaf-time salt basis reads it (SW-HASH §9's floor column)"

