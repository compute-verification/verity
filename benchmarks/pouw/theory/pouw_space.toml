source = "N-FLOOR final §1 (note compute-research/20261029T0832Z-report-np-floor): the H200's own host, a Xeon Platinum 8468 (8 cores, 16 threads, KVM guest), hashes SHA-512 at 21.9 GB/s with an AVX-512 eight-lane kernel (sha512x8.c, FIPS 180-4 checked; runs r20261029-072411-22ce, r20261029-072843-21ae, r20261029-074657-fc32, art:7f1ba2ed7cce4aaef45cce3e8d98ba3dae361fb2fcdf8bd0ddfdfbc1907fe1ad), against OpenSSL's 6.59; f_host = 21.9/(519.6 + 21.9) = 4.04% of the hashing, 4.90% at θ's hostH200 row (30.0 GB/s). The host term (route H) prices it: the rows it hashes and their words, computed on AMX (15.6-19.6 T int8 MACs/s), leave the card"

