premises = ["ssn-distinct", "ssn-success-set"]
t3 = { s8 = "ssn-1l-b1-v1" }
variant = "ssn-1l-b1-v1"
source = "SW-NOISE final §4-5 (note compute-research/20261029T0551Z-report-sw-noise; noise_sweep.py on cursor/compute-research-sw-noise-5e1a at 2ba11b9bfa, art:d90a3d9d0ed503b9190dabc34367dd25ad30f3b247e2cfd0b855122c8a09fafc): c code lanes in step 1, S = 1 + ceil((K - (32 - c))/31) steps, S - 1 + c coin bits a row. A row's step costs a LOP3 (noise_x: candidate 1 forces it when committed) and, after step 1, a funnel-shift rotate except where the lane's bit is already at 24 (derive_extra, ssn_1l_layout: word 0's 32 - c bits, then 32 a word, so one rotate saved a whole coin word past the first); a code lane past 4 costs a rotate and a LOP3 a row (ssn_code5.py). Coins: the row's ceil((S - 1 + c)/32) whole coin words. B' is public apart from B, formed once at load; stock s8 x s8 at +-127, so no int7, sign fix or route"

