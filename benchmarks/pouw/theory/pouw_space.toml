fields = { r = "32*(S + ceil(bits/32))/K", formed_x = "0", formed_y = "0", denoise = "0", operand_max = 127, wide_measured = 0, derive_extra = "4*m*rot + 4*m*(c - 4) + m*bits" }
premises = ["ssn-cancel-distinct"]
t3 = "F"
