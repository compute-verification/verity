[P.forming.none]
name = ""
source = "forming charged at reg/4 an entry unless committed"

[P.forming.count]
when = "formed_x + formed_y > 0 and commit_formed_x + commit_formed_y < 2"
premises = ["tensor-semantics", "class-semantics", "forming-counting"]
source = "CORE-TIME final §3: the counting lemma charges forming"

[P.derivation.none]
