# N-SALT's cards for pouw_space.py (`--add benchmarks/pouw/theory/np_salt_cards.toml`): N-LIT's counter-mode pad and its
# keyed forms, and hm96's mask computed as committed int8 partials (FM), as hiding modules priced by their own `salt`
# (W1 at the floor a public digest: `unforced` all of it, `forced` what stays charged once its checking premise credits
# the rest). They enter only through cards (`enumerate = false`). salt.py prices and checks them; Salt.lean proves
# binding, the ideal-hybrid hiding and FM's bit 7.

[premise.pad-checked]
rank = 0
part = "hashing"
status = "open"
owner = "N-SALT"
closes = ["hiding_salt"]
source = "N-SALT: a window key ks, 64 bytes from the OS generator, is committed under its own hm96 leaf before the window's coins; each drawn unit's proof opens it, computes S = f(IV, ks ‖ salt_w) and checks each opened public digest: b = x ⊕ f(S, pos ‖ padding) (pad) or d = f(S, pos ‖ x ‖ padding) (keyed digest), so the pad's or the key's compression is forced and ShaWrites credits it at its count; the pad's 16 XORs stay. Binding is Salt.lean's pad_binding and keyed_binding (proved, premise-free); a pad the proof doesn't check binds nothing (pad_unchecked_unbound). A protocol change, not built"

[premise.pad-leaf-ruled]
rank = 3
part = "hashing"
status = "open"
owner = "the coordinator, for Daniel"
source = "N-SALT: the pad family's public digest is not an hm96 leaf (AGENTS.md: commitments are hm96 rows), so it needs a ruling. Its hiding is computational at SHA-512's PRF property keyed by a secret 64-byte block, which is hm96 PROTOCOL §3's generator convention, the one (a)'s derived salts and today's served salts already read, and prefix-keyed SHA-512 as a PRF has precedent (AMAC, Bellare-Bernstein-Tessaro; Ed25519's nonce); every pad input is fixed at 144 bytes, so the whole 512-bit output is released without AMAC's truncation, and multi-user security at about 2^44 keys a year is a non-issue at 512 bits (N-LIT H23); HMAC, if a named standard is wanted, costs 2 compressions a pad (N-LIT H24): Salt.lean's pad_reduction and pad_ideal_hiding (keyed_ideal_hiding) prove the ideal hybrid exact, with every position used once (a repeated position leaks: pad_repeat_leaks, keyed_repeat_leaks). Whoever holds ks reads every x in its scope (pad_key_reveals), so ks is never published"

[premise.fm-distinct]
rank = 2
part = "hashing"
status = "open"
owner = "N-SALT"
requires = ["salt-forced", "adaptive-dw"]
source = "N-SALT: FM's 48 k32 partials an output, P[i][w] = 128 · Σ ±M_key[i][j] · y_j over words <= w, are affine in y with pairwise distinct nonzero coefficient vectors on the pinned key (24,576 of 24,576 prefixes distinct, every 32-bit block at least 9 bits; salt.py check_fm, mutation caught), so they are pairwise distinct, non-constant functions of y (Salt.lean dot_distinct, dot_nonconstant, proved), and under DistinctWrites stated for programs that read the coins (adaptive-dw: y is PRF_ks(salt_w ‖ pos)) each committed partial is charged its k32 step's 32 MACs; with one fixed y they are constants, so it requires (a). Its bit 7 is hm96-sha512/v1's mask bit (Salt.lean fm_mask, proved; salt.py, checked on 4 literal and 4,096 closed-form salts). Like per2-distinct it reads DistinctOn's set semantics, not a span argument"

[H.hiding.pad]
name = "pad"
enumerate = false
premises = ["pad-checked", "pad-leaf-ruled"]
salt = { unforced = 116736, forced = 512 }
source = "N-LIT H20, N-SALT's construction: b = x ⊕ f(S, pos ‖ padding), one compression (116,224 at the floor, credited by pad-checked) and 16 XORs a public digest (512, charged); hm96's c and M_key·y gone; once a window ks's hm96 leaf and S (about 9.1e5 W1, outside the card)"

[H.hiding.keyed]
name = "keyed"
enumerate = false
premises = ["pad-checked", "pad-leaf-ruled"]
salt = { unforced = 116224, forced = 0 }
source = "N-SALT's keyed digest (N-HIDE's e3 shape): d = f(S, pos ‖ x ‖ padding), one compression a public digest (credited by pad-checked), no XOR"

[H.hiding.kleaf]
name = "kleaf"
enumerate = false
premises = ["pad-leaf-ruled", "row-bound"]
salt = { unforced = 0, forced = 0 }
source = "N-SALT's keyed leaf: the public digest's own hash started from S instead of the IV, its first block row-bound's (salt, forward, position) block with the length, which row-bound already spends a compression on (a frame-v3 node's message already carries (domain, level, index)); nothing is added a public digest. Its messages are prefix-free by that block (Salt.lean prefix_free_of_head, proved), so Bellare-Canetti-Krawczyk reduce its hiding to the compression function's PRF property, with no length extension; the drawn unit's proof opens ks and hashes from S"

[H.hiding.fm]
name = "fm"
enumerate = false
premises = ["salt-forced", "fm-distinct"]
salt = { unforced = 791892, forced = 28672 }
source = "N-SALT's forced mask: hm96-sha512/v1 kept bit for bit, M_key·y computed as an int8 tensor-core product whose 48 k32 partials an output are committed (786,432 MACs and 98,304 B hashed a salt, credited, outside the card's T2); the PRF and c credited by salt-forced; the interface, 384 formed registers, 496 gathered and 16 XORs (896 at 32, estimate), charged"

