# HIGHUTIL's period (period.py) and the vendored V31-GPU prover (v31.cu, v31.py, v31lib.py). Not a package: the tests run here as a
# suite (`uv run tools/verity/check/suites.py benchmarks/pouw/highutil`).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# v31.py's commitments and the coins' derivation (verity.ml), and commit_gpu's reference, which v31.py imports.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/commitments", "verity/ml/randomness",
          "verity/ml/crypto", "benchmarks/pouw/commit_gpu/reference.py"]
