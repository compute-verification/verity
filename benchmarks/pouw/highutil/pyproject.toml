# HIGHUTIL's period (period.py) over accel_v31's prover (benchmarks/pouw/accel_v31). Not a package: the tests run here as a
# suite (`uv run tools/verity/check/suites.py benchmarks/pouw/highutil`).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# v31.py's commitments and the coins' derivation (verity.ml), commit_gpu's reference, which v31.py imports, and the s8
# linear's Boolean lowering (verity.ml.circuits, which reads verity.ml.kernels), the AND credit's.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/ml/commitments", "verity/ml/randomness",
          "verity/ml/crypto", "verity/ml/circuits", "verity/ml/kernels", "benchmarks/pouw/commit_gpu/reference.py",
          "benchmarks/pouw/accel_v31/v31.py", "benchmarks/pouw/accel_v31/v31lib.py",
          "verity/core/__init__.py", "verity/core/protocols/__init__.py", "verity/core/protocols/pouw/__init__.py",
          "verity/ml/protocols/pouw/circuit"]
