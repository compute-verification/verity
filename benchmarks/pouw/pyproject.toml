          "tools/research/src/research/result.py", "tools/research/src/research/secret_hint.py",
          "tools/research/src/research/store", "tools/research/src/research/telemetry",
          "Security/Definitions/Accounting/Headline", "Security/Definitions/Accounting/HeadlineDc",
          "Security/Definitions/Pouw/Guarantees", "Security/Definitions/Accounting/Guarantees/HeadlineDc.lean",
          "Security/Definitions/Pouw/Guarantees/PearlCFlockTile.lean", "Security/lean-audit.json",
          "Security/Proofs/Accounting/Gates/Rows.lean",
          "benchmarks/pouw/exact_kit/exact_kit", "benchmarks/pouw/receipts", "benchmarks/pouw/filler",
          "benchmarks/pouw/machine_model", "benchmarks/pouw/README.md", "benchmarks/torch_gpu/sha512_rows/sha512x.cuh",
          "benchmarks/hash/dither/dither_a.py", "benchmarks/hash/dither/dither_fused.py",
          "benchmarks/hash/dither/j10r_ws.py",
          # test_mma_gate runs torch_gpu's build gates, which read the build through harness/sass_gate.py's mma_gate
          "benchmarks/torch_gpu/s8_linear/sass_gate.py", "benchmarks/torch_gpu/attn_bf16/sass_gate.py",
          "benchmarks/hash/dither/dither_one.py", "benchmarks/hash/dither/forms.py", "benchmarks/hash/dither/h1c.py",
