[project]
name = "verity-pouw-benchmarks"
version = "0.0.0"
description = "PoUW's benchmarks and their tests."
requires-python = ">=3.12"
dependencies = ["research", "verity-pouw", "verity-vllm", "numpy", "blake3>=1.0"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }
verity-pouw = { workspace = true }
verity-vllm = { workspace = true }

[tool.verity.tests]
# Test-only: test_hidden_zk_stage runs hidden_zk/stage.py, which stages through C-Flock's Python.
inputs = ["backends/flock/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
