[project]
name = "verity-pouw-benchmarks"
version = "0.0.0"
description = "PoUW's benchmarks and their tests."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-vllm", "numpy", "blake3>=1.0"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
research = { workspace = true }
verity-vllm = { workspace = true }

[tool.verity.tests]
# Test-only: test_hidden_zk_stage runs hidden_zk/stage.py, which stages through C-Flock's Python; the price twins read
# the repository's Lean record and the lifted guarantees' statements (harness/price_twins.py's REPO_AUDIT).
inputs = ["verity/ml/flock/python", "Security/lean-audit.json", "Security/Models/Pouw/Guarantees"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
