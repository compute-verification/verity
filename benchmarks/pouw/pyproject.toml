[project]
name = "verity-pouw-benchmarks"
version = "0.0.0"
description = "PoUW's benchmarks and their tests."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-difftest", "numpy", "blake3>=1.0", "scipy==1.18.1", "z3-solver>=4.13"]

[project.optional-dependencies]
# The team's run and store tool and the exact kit, which the suite's tests and the theory scripts use and the public tree
# doesn't hold (Pearl-C's kernels, which it does, need neither); the workspace installs both with every member.
research = ["research"]
exact-kit = ["verity-exact-kit"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
research = { workspace = true }
verity-vllm = { workspace = true }
verity-difftest = { workspace = true }
verity-exact-kit = { workspace = true }

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_ffill.py",
    "tests/test_pearl_c_hash_decode.py",
    "tests/test_pearl_c_hash_host.py",
    "tests/test_pearl_c_hash_wide.py",
    "tests/test_pearl_c_sm120.py",
    "tests/test_pearl_c_sm90.py",
    "tests/test_pearl_c_sm90_prefill.py",
    "tests/test_pearl_c_vllm.py",
    "tests/test_receipts_adopters.py",
    "tests/test_salt_bind.py",
    "tests/test_served_zk.py",
    "tests/test_theory_duo_kernel.py",
    "tests/test_theory_fold_kernel.py",
    "tests/test_theory_fold_root.py",
    "tests/test_theory_fold_wide3.py",
    "tests/test_theory_fold_wide32.py",
]
# test_lean_headline compares the headline instances' Lean data (security/Definitions/Accounting/Headline) with what
# lean_headline.py writes, and test_lean_headline_dc the data-centre ones' (security/Definitions/Accounting/HeadlineDc)
# with what lean_headline_dc.py writes, and each statement's ε literal in Models' HeadlineDc.lean against the export's
# ε/B_♭ pair.
# Test-only: test_hidden_zk_stage runs hidden_zk/stage.py, which stages through Flock's Python; harness/price_twins.py
# reads the lifted PoUW guarantees' sources (Definitions/Pouw/Guarantees) and Security's lock. Of `verity`, the
# difftest harness, vLLM's integration and `research`, what the
# tests import, in place of those trees; the Lean the served challenger's `lake build` reads is keyed by the binaries it
# builds (`artifacts`), and the C++ the tests compile is this suite's own but for the SHA-512 pearl_c/sha512.cuh includes
# (verity/definitions/kernels/sha512.cuh). verity/protocols/pouw/receipts, filler and
# machine_model are suites of their own, which this suite's tests read (test_receipts_adopters, test_opcode_probe),
# so they're named here. The theory scripts (`theory/`) import the exact kit's package. test_dither_a_step_chunks
# imports dither_one (and forms.py through dither_fused) on the CPU. test_contents reads the README,
# which holds no table (`contents.py` prints them). test_dither_zy_h1zy imports int8_exact, which imports
# verity_vllm.program.frontend's kernel_readback (the program files named below), and its CUDA tests import dither-a
# (benchmarks/hash/dither's dither_a.py and the modules it imports, and exactlin.py): its files alone, not their kernels'
# CUDA sources, and dither's registry (settings.py), which they read their variables through. test_served_h1_producer's
# H1 window commits its hiding tables through pouw_h1_requests.hiding_rows, whose ChaCha20 is verity.commitments.windows.rows'
# (the commit files named below: serving_rows and what it imports).
# test_served_units_summarize runs served_units' summarize.py, which scores the hidden_zk controls its job.sh sources.
# served_h1's producer loads dither's j10r_ws.py, which sizes a J10-R call's workspace from the loaded build.
# test_dither_j10r_form imports dither's J10-R host units (j10r_units.py, over served_h1's receipts) and forms.py.
# pouw_h1 imports its table commits' module and pouw_h1_served its word encodings' module, each named at its path
# before and after vllm's layout move.
# test_pearl_c_sm90_overhead_arm reads the overhead door's schemes and linears (verity_bench's overhead.py), which name
# pearl_c_sm90's arm.
# test_proved_ticks_placed places PoUW's compiled Program on a block of the datacenter model (benchmarks/datacenter's
# package, on pytest's `pythonpath`), with what that package imports of core: the registration log (registration.py, over
# site and wire) and PoUB's block size (its codec.py); its census imports the Boolean versions' lookup
# (verity/definitions' boolean.py), which loads no registry module for a Program already Boolean.
inputs_only = true
inputs = ["verity/__init__.py", "verity/settings.py", "verity/errors.py", 
