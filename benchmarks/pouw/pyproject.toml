# one process: 2,100 s beside a loaded check, too near suites.py's SUITE_TIMEOUT_S
timeout_s = 7200
# check runs it as three parts by test id (`lean-suites:verity-pouw-benchmarks:K/3`, `suites.py`'s `id_part_of`), each
# collecting every file and running the tests whose node id hashes to K, so that ci.toml's plans spread it over three shards
parts = 3
# Build outputs the served challenger's checks of record run or skip on (`check` runs this suite after its Lean steps).
artifacts = ["verity/protocols/pouw/verifier/lean/check/.lake/build/bin/pouw-check",
             "verity/protocols/pouw/verifier/lean/check/.lake/build/bin/pouw-check-difftest",
             "verity/protocols/spot/verifier/lean/.lake/build/bin/sampled-proofs-difftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_proved_ticks_placed imports `datacenter` (not an installed package) by path.
pythonpath = ["../datacenter"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_dc.py"]
paths = ["benchmarks/pouw/opcode_probe"]

[[tool.verity.tests.reads]]
tests = [
    "tests/test_dither_j10r_form.py",
    "tests/test_pearl_c4_real.py",
