# One filler period end to end on a development gate (`fill_period.py`). Not a package: the tests run here as a
# suite (`uv run tools/verity/check/suites.py benchmarks/pouw/fill_period`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: PoUW's fill rule (`fill.period_fill`), Dither's reference (`circuit.dither`) and the challenger's client.
# `window_salt.py` and `a5_coins.py` make the local gate; `benchmarks/live_challenger` is its auditor host (auditor.py,
# models.py), whose serve.py runs under its tests' stub of the Lean verifier's coins (stub_serve.py). B is the H200
# example's seeded served weights (`e2e_h200.served_weights`).
inputs = ["verity", "benchmarks/pouw/window_salt/window_salt.py", "benchmarks/one_stage/a5_coins.py",
          "benchmarks/live_challenger", "examples/h200/e2e_h200/__init__.py",
          "examples/h200/e2e_h200/served_weights.py"]
