# ---- exact paths
# ----------------------------------------------------------------------------------------------------------

[[path]]
format = "s8/u8"
native = "mma.sync m16n8k32 (IMMA.16832), m16n8k16, m8n8k16 (as 16816), 2:4 sparse m16n8k64 and k32"
exact = "s8·s8 into s32, exact (wraps mod 2^32 without .satfinite); every form 16 SMSP-cycles, 31.96 words/SM/clk"
isa = "PTX §9.7.14.5; data/forms.toml"

[[path]]
format = "e4m3/e5m2, e3m2/e2m3 (FP6), e2m1 under kind::f8f6f4"
native = "mma.sync m16n8k32 (QMMA.16832) at the FP8 rate; block-scaled kind::mxf8f6f4 (QMMA.SF.16832)"
exact = "each product exact; the k32 group sums in a 26-bit truncating adder (see [[fp8]]); an s8 operand needs 2 E4M3 slots a product (forms.toml split 2)"
isa = "PTX §9.7.14.5 kind::f8f6f4 (sm_120a)"

[[path]]
format = "NVFP4/MXFP4 (e2m1, block-scaled)"
native = "mma.sync m16n8k64 kind::mxf4nvf4 (OMMA.SF.16864) at twice the FP8 rate"
exact = "e2m1 has 15 values, so an s8 operand takes at least 3 slots a product under one pair of scales (forms.toml OMMASF16864 split 3)"
isa = "PTX §9.7.14.5 kind::mxf4nvf4 (sm_120a)"

[[path]]
format = "f16/bf16, tf32"
native = "HMMA.16816 (f32 or f16 accumulate), HMMA.1688 and 1684 tf32"
exact = "f16 integers to 2^11, bf16 to 2^8 a side; exact in the adder while a group fits"
isa = "PTX §9.7.14.5"

[[path]]
format = "f64"
native = "DMMA.8x8x4, 584 SMSP-cycles (1.75 MACs a SM-clock)"
exact = "exact for int8 products, at 1/585 of IMMA's rate"
isa = "PTX §9.7.14.5"

[[path]]
format = "b1, s4/u4"
native = "none: emulated by ptxas (b1 99-436, s4 k64 334, u4 k64 69.5 SMSP-cycles)"
exact = "–"
isa = "PTX lists them for sm_80+"

# ---- FP8 atom semantics --------------------------------------------------------------------------------------------

[[fp8]]
form = "mma.sync m16n8k32 kind::f8f6f4 .f32.e4m3.e4m3 (QMMA.16832), and .e5m2"
products = "exact"
group = "one group: the 32 products of the k32 step plus the incoming FP32 accumulator"
alignment = "every term rescaled to a 26-bit significand (the BF16 pipeline's adder) and aligned to the group's largest exponent by a truncating right shift (floor -133, unobservable: no FP8 product is below 2^-32)"
accumulation = "summed exactly, normalized to 26 bits by truncation, then to FP32 by truncation; the accumulator's 24 bits fit the 26-bit adder, so unlike Hopper's 14-bit FP8 adder it isn't truncated a step (the B200's tcgen05 kind::f8f6f4 is the same pipeline to the bit)"
promotion = "none needed: the FP32 accumulator chains step to step (Pearl's B200 path, pearl_kw.py Device b200: W = 25, width 26)"
rate = "1023.8 MACs/SM/clk (tensor.e4m3.k32), as every native form; MXFP8 (QMMA.SF) the same; no FP8 k16 form is timed"
source = "verity.ml.circuits.silicon models.BLACKWELL_SM120_E4M3_M16N8K32 (groups (32,), width 26, floor -133): RTX PRO 6000 Server Edition, fitted on 6,434,816 elements (0 mismatches; Ada's (16,16)/14 and Hopper's (32,)/14 refuted), evaluated on 25,040,128 (0), and on 25,041,024 at a 2,100 MHz lock (0); E5M2 BLACKWELL_SM120_E5M2_M16N8K32. NVIDIA documents state none of this"

