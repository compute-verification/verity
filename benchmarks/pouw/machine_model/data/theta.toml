# θ for the RTX PRO 6000 Blackwell Server Edition (sm_120; ACCEL CALIB): every rate, capacity and clock the accelerator
# model reads, each with its vendor document first (`sheet`, `grade`, `source`), then the census or a measured run
# (`measured`, `runs`), or the run that would measure it (`gap`). The schema is data/devices/sm_90/theta.toml's. The
# census is at the node's 2,092 MHz lock, and a SM-clock's rate holds at any clock; the whitepaper's figures are the
# Workstation Edition's at its 2,617 MHz boost (the same 188-SM GB202).
gpu = "RTX PRO 6000 Blackwell Server Edition (sm_120)"
sms = 188
sms_source = "RTX Blackwell whitepaper v1.1, Appendix A, Table 4 (pp. 46-47): 'SMs 188' for the RTX PRO 6000 Blackwell (Workstation and Max-Q); the Server Edition's page states none; the device reports 188"
# Duo's measured profile; LI has none on this card (no sm_120 kernel folds with LI): a timed LI e_l7qs closes it.
honest = ["e-l7qs"]
documents = [
  "WP: NVIDIA RTX Blackwell GPU Architecture whitepaper v1.1, Appendix A, Table 4 (pp. 46-47), RTX PRO 6000 Blackwell Workstation Edition column, footnote 1 'Peak rates are based on GPU Boost Clock', footnote 2 'Effective TOPS / TFLOPS using the Sparsity Feature'; p. 11 (INT32 unified with FP32)",
  "DS: NVIDIA RTX PRO 6000 Blackwell Server Edition product page and data sheet (Apr 2025), Technical Specifications (census rtx-pro-6000-server/*)",
  "CPG: CUDA C++ Programming Guide 12.9, §6.4.1 Table 7, CC 12.0 column; §20 Technical Specifications; §18.10 (CC 12.0)",
  "PTX: PTX ISA 9.4, §9.7.14 (mma.sync, kind::f8f6f4 and kind::mxf4nvf4 on sm_120a)",
]

[clocks.boost]
mhz = 2617
grade = "whitepaper (Workstation Edition)"
source = "WP Table 4: 'GPU Boost Clock (MHz) 2617', footnote 1: every peak rate is at it"
measured = "the Server Edition's page states no clock; its 'TF32 Tensor Core 234 TFLOPS' is the WP's rate a SM-clock at 2431 MHz (census rtx-pro-6000-server/bf16)"

[clocks.fmax]
mhz = 2430
grade = "measured (driver)"
source = "no Server Edition document states a clock"
measured = "nvidia-smi's maximum SM clock on the deployed node is 2430 MHz (census rtx-pro-6000-server/e4m3); the census is taken at the node's 2,092 MHz lock (machine_model README 'Devices')"

