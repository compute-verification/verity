# ---- the units outside the rates above: their rates, then a verdict a unit ----------------------------------
# A reduction unit is an adding route d reads, at an upper bound where no run has timed it. Every 32-bit add it makes
# moves a word through a shared-memory or L1 port (CPG 'Shared Memory': 32 banks, each 32 bits a clock), so 32 a
# SM-clock bounds each. Every add moves more than one word (a read-modify-write, and a bulk reduction's source read),
# so the true rate is lower: 32 over-allows the route, the safe side, and costs γ and ε at most what these routes
# lower d by. Only TMA's bulk reduction takes no lane: one instruction moves a whole bulk.

[[rate]]
key = "smem.atom"
what = "ATOMS.ADD.32 into shared memory, an add a lane"
unit = "adds/SM/clk"
sheet = 32
grade = "Programming Guide (an upper bound: the shared-memory port)"
source = "CPG 'Shared Memory': 32 banks, each 32 bits a clock; an atomic add reads and writes its word there; no document gives ATOMS's rate"
gap = "an ATOMS.ADD loop on the RTX PRO 6000 (GPU queue)"

[[rate]]
key = "l2.red"
what = "RED.E.ADD.32 into global memory, done at the L2, an add a lane"
unit = "adds/SM/clk"
sheet = 32
grade = "Programming Guide (an upper bound: the L1 port its request passes)"
source = "CPG §18.10 (CC 12.0): L1 and shared memory are one array, whose port takes 128 B a clock; no document gives the L2's atomic rate"
gap = "a RED.E.ADD loop over distinct lines on the RTX PRO 6000 (GPU queue); the L2's measured 18.05 B a SM-clock (l2.read) carries at most 4.5 such s32 adds"

[[rate]]
key = "dsmem.red"
what = "red.shared::cluster.add.u32 into a cluster peer's shared memory (DSMEM), an add a lane"
unit = "adds/SM/clk"
sheet = 32
grade = "Programming Guide (an upper bound: the peer's shared-memory port)"
source = "CPG 'Thread Block Clusters' and 'Distributed Shared Memory' (CC 9.0 and later); CPG 'Shared Memory': 32 banks × 32 bits a clock at the peer"
gap = "a red.shared::cluster loop at cluster size 2 on the RTX PRO 6000 (GPU queue)"

[[rate]]
key = "tma.red"
what = "cp.reduce.async.bulk.global.shared::cta.add.u32 (TMA bulk reduction, done at the L2), one instruction a bulk"
