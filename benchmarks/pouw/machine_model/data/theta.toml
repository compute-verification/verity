[[unit]]
key = "host.cpu"
what = "the host's CPUs (or any machine behind the NICs), hashing words the card sends them (NF4)"
verdict = "open"
rates = ["host.link", "sha512", "host.sha512", "host.int8", "host.dram"]
bound = 0.00254262
against = "sha512"
why = "the host computes every compression of data it holds, so for any host the words' bytes bound it: the no-fold receipt's v1 packs 32 four-byte words into a 1024-bit hiding leaf block under a binary tree, κ = 2 compressions a 128 B of words, so host.link's 64e9 B/s carry 1e9 compressions' worth a second, 1e9 / (188 SMs · 2,092 MHz, sha512's measured clock) = 0.00254262 a SM-clock; the share of device time it frees is that over the card's hashing rate whatever L is (the link runs through the tensor time too), up to hashing's own share. Our node binds first at its cores: 12 a GPU at host.sha512's 3.012e7 = 3.61e8 a second (Priority Core Turbo's 4.6 GHz on 8 cores a socket adds 3%), 9.19e-4 a SM-clock, 5.07% of the measured sha512. Its AMX: 12 cores at host.int8 = 4.79e13 exact s8 MACs a second, 9.51% of the WP's 1,007.6 TOPS dense (5.04e14 MACs)"
gap = "the prover chooses the host (P9), so a bound tighter than the link's needs the node's inventory from someone other than the prover, an open claim; κ of the receipt PROTO-DESIGN freezes (v2's 8-block leaves and 16-ary tree: about 1.1); sha512_mb, an AMX loop on the host (CPU only, cpu-3/4/5 only if their SKU is the 6776P) and a pinned device-to-host copy (GPU queue)"

# The built kernel's SASS a compression, for SHA-512's ceiling on the card's pipes (`sha_ceiling`): `alu` on the ALU
# pipe; `rotates` rotations or shifts (two SHF each) and `adds` 2-input 64-bit adds (built as `add_form`) may go to
# IMAD.
[sha512_mix]
alu = 3415
other = 0
rotates = 864
adds = 760
add_form = "IADD.64"
overlap = "yes: θ's census issues LOP3 and IMAD together at 4.0 warp instructions a SM-clock (alu.iadd3's runs); commit_gpu's SHA_ROT r3 (480 rotations, two IMAD.HI and two IMAD each) at 5.28 against 7.13 G/s fits IMAD.HI at about 16 lanes a SM-clock, not a shared pipe, so with IMAD.HI unmeasured here the ceiling without it is the one on measured rates"
source = "benchmarks/pouw/commit_gpu/README.md 'What decides the speed': our kernel's 1728 SHF (864 rotations and shifts), 927 LOP3 and 760 IADD.64 a block, every one on the integer pipe"

