# The cheater's table route on the H200 (`eps --lookups`): SCALAR-ROUTE as restated, as on sm_120 (data/table.toml).
# The H200's L2 bandwidth isn't measured, so the route is bound by its lane slots alone (no L2 facet; `--l2` sets
# one).
q = 1.22                  # lane instructions a table word
bytes = 3.5               # L2 bytes a table word (6.0 single-field: --lookup-bytes 6)
sms = 132
mhz = 1980                # f_max at default clocks
source = "SCALAR-ROUTE as restated (named assumption): a right fresh word costs >= 2.03 issue slots, or >= 1.22 slots and 3.5 B of table loads (6.0 B single-field); the H200's L2 unmeasured, so unbounded"
