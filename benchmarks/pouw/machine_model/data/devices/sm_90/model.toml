# The H200 (sm_90) as `eps` prices it (README "Devices"): the census of EPS1 DC
# (note:20261017T0452Z-draft-eps1-dc), and no vector solved for prices, so the constants only `solve` reads are left
# out. Two epochs: DC-90, and DC-90-ri, which refits the uniform instruction's price on the async-joint issue row
# (UNI,JI90_0) to its measured cost beside the saturated async tensor op (RT-ISA r2, note:20261017T1834Z-draft-rt-isa;
# the old 0.965-of-an-issue-slot price, scaled from a scalar-saturated stream, was optimistic). `current` stays DC-90;
# the refit is the vector DC-90-ri (read it with `eps --vector DC-90-ri`).
current = "DC-90"
epochs = ["DC-90", "DC-90-ri"]

# The CUDA lane classes a word on lanes may use: every lane class the census prices. LOP3, SHF and LEA.HI share ALU's
# pipe row A; FFMA has only the issue rows. No IDP4A or LDS kind is measured on sm_90. The uniform datapath (UNI, on
# UP and the issue rows) is measured but is not a lane class: it opens the uniform route.
cuda = ["FFMA", "IMAD", "ALU", "SHFL"]

[constants]
cycle_u = 300.08          # u in one SMSP-cycle: a unit, the same as data/'s (eps divides it out)
