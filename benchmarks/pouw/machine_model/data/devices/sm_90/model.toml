# The H200 (sm_90) as `eps` prices it (README "Devices"): the census of EPS1 DC, and no vector solved for prices, so the
# constants only `solve` reads are left
# out. Three epochs: DC-90; DS-90, the data-sheet vector, whose lines are
# census/DS-90.csv and close where they open, so it moves no other epoch's census (benchmarks/pouw/dc/census.py
# --write rewrites census.csv and keeps none of them); and DC-90-ri, which refits the uniform instruction's price on the
# async-joint issue row (UNI,JI90_0) to its measured cost beside the saturated async tensor op (RT-ISA r2; the old
# 0.965-of-an-issue-slot price, scaled from a scalar-saturated stream, was
# optimistic). `current` stays DC-90; the refit is the vector DC-90-ri (read it with `eps --vector DC-90-ri`).
current = "DC-90"
epochs = ["DC-90", "DS-90", "DC-90-ri"]

# The CUDA lane classes a word on lanes may use: every lane class the census prices. LOP3, SHF and LEA.HI share ALU's
# pipe row A; FFMA has only the issue rows. No IDP4A or LDS kind is measured on sm_90. The uniform datapath (UNI, on
# UP and the issue rows) is measured but is not a lane class: it opens the uniform route.
cuda = ["FFMA", "IMAD", "ALU", "SHFL"]

# The lane classes with a uniform-datapath form, so a filler of them may move there (one uniform instruction a lane
# instruction): UIMAD for IMAD, and ULOP3, UIADD3, USHF and ULEA for ALU's classes. The sm_90 uniform datapath is integer
# only (the Hopper SASS uniform opcodes: no UFFMA, UFADD or UFMUL, and no USHFL), so a filler with FFMA in its mix stays
# on lanes: a bit-exact fma.rn.f32 emulated in uniform integer instructions takes tens of them.
uniform_forms = ["IMAD", "ALU"]

[constants]
cycle_u = 300.08          # u in one SMSP-cycle: a unit, the same as data/'s (eps divides it out)
