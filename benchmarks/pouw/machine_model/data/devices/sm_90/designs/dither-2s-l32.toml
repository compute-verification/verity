# Dither-2S at L = 32 on the H200 (sm_90): two-sided dither serving the last checked word, duo receipts, P·V's peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest, its operand floor and the baseline are
# the H200's. Every Dither noise has the same floor here: no operand passes through a register.
name = "dither-2s-l32"
title = "Dither-2S, L = 32"
summary = "Dither-2S on the H200 at L = 32: two-sided dither serving the last checked word, duo receipts, P·V's peel"
honest = "dc90-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.00287
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 17.636 SMSP-cycles a 4096-MAC MMA on DC-90; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.287%: its tail 0.187%, the sums DG, S and X(0) 0.0796%, the served epilogue 0.0201%. With P·V's served output checked it is 0.220% (8B) / 0.0936% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of its tail instructions (4 mma.sync m16n8k32, 6.93 IMAD, 16.09 other), its sums by vfold (#2300, decision 91; 0.760 an entry) and served epilogue (6.15 a tile) at one an issue cycle, the peel on sm_90a's own instruction counts for the same kernel source (RT-ISA-7: static nvdisasm counts with ncu's rule applied, not ncu; eps_budget's SASS), on this device's Π (note:20261017T0320Z-draft-eps1-calc Round 10)"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.0
source = "f_H unmeasured on the H200 (EPS1 DC measured f_max = 1980 MHz at default clocks, 06:01Z): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 8 }
source = "dp4a at 8 IDP4A a word at L = 32, on IMAD's class as sm_120 prices it (no IDP4A kind in EPS1 DC's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
