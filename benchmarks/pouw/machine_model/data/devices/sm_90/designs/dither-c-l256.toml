# Dither-C at L = 256 on the H200 (sm_90): CO-Dither (co32c, cohalf), P·V on committed digit limbs, duo receipts. The
# noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest, its operand floor and the baseline are the
# H200's. Every Dither noise has the same floor here: no operand passes through a register.
name = "dither-c-l256"
title = "Dither-C, L = 256"
summary = "Dither-C on the H200 at L = 256: CO-Dither (co32c, cohalf), P·V on committed digit limbs, duo receipts"
honest = "dc90-l256"
L = 256
work = 1.0

[noise]
linears = "co32c"
lm_head = "co32c"
qk = "cohalf"
pv = "pv"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.0148
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭, ♭ 3.922 SMSP-cycles a 4096-MAC MMA on DC-90; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 8K prefill: the linears' co32c recombination 0.329%; lm_head's co32c recombination 1.94e-07%; QKᵀ's cohalf sums 0.112%; P·V's pv digits, epilogue and scaling 1.04%. With P·V's served output checked it is 1.48% (8B) / 0.717% (70B) there. Skip terms: the checked leaves' vector work only the served output needs at the TS model's gap (TS_EPS of TS_CHEAT, pv_ts), on sm_120's instruction counts for the same kernel source, on this device's Π"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.0
source = "f_H unmeasured on the H200 (f_max = 1980 MHz at default clocks, @h200-fmax): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε
name = "dp4a"
program = { IMAD = 64 }
source = "dp4a at 64 IDP4A a word at L = 256, on IMAD's class as sm_120 prices it (no IDP4A kind in this device's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
