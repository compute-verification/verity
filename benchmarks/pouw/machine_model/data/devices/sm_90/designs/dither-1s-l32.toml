# Dither-1S at L = 32 on the H200 (sm_90): one-sided dither, duo receipts on every committed word, the linears' peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest, its operand floor and the baseline are
# the H200's. Every Dither noise has the same floor here: no operand passes through a register.
name = "dither-1s-l32"
title = "Dither-1S, L = 32"
summary = "Dither-1S on the H200 at L = 32: one-sided dither, duo receipts on every committed word, the linears' peel"
honest = "dc90-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "one-sided"
lm_head = "clean"
qk = "one-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.123
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 17.636 SMSP-cycles a 4096-MAC MMA on DC-90; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 32K decode: the linears' one-sided strip 0.480%; QKᵀ's one-sided strip 11.7%; P·V's peel 0.113%: its tail 0.0740%, the sums DG, S and X(0) 0.0315%, the served epilogue 0.00797%. With P·V's served output checked it is 12.3% (8B) / 9.08% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of its tail instructions (4 mma.sync m16n8k32, 6.93 IMAD, 16.09 other), its sums by vfold (decision 91; 0.760 an entry) and served epilogue (6.15 a tile) at one an issue cycle; a one-sided strip's 2L executed products at ♭'s price a MAC, the peel on sm_90a's own instruction counts for the same kernel source (RT-ISA-7: static nvdisasm counts with ncu's rule applied, not ncu; eps_budget's SASS), on this device's Π; the clean lm_head skips nothing, its words are ♭'s"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.0
source = "f_H unmeasured on the H200 (EPS1 DC measured f_max = 1980 MHz at default clocks): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε
name = "dp4a"
program = { IMAD = 8 }
source = "dp4a at 8 IDP4A a word at L = 32, on IMAD's class as sm_120 prices it (no IDP4A kind in EPS1 DC's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
