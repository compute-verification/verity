# dither-2s-licpw-redux-l32 with an integer filler on the IMAD pipe in place of ffill (DC r12's route b), kept to price
# the comparison: two steps a MMA on a thread's words, each m = IMAD(w, 2, 1) and v = IMAD(v, m, c). No kernel or check
# exists; ffill (route a) is the headline's.
base = "dither-2s-licpw-redux-l32"
name = "dither-2s-licpw-redux-imad-l32"
title = "Dither-2S, LI-CP-W redux, IMAD filler (0.0313 a word), L = 32"
summary = "dither-2s-licpw-redux-l32 with an IMAD-pipe chain (two IMAD a step, two steps a MMA) in place of ffill's FFMA chains: route b of DC r12, for comparison"

[filler]
per_word = 0.03125
mix = { IMAD = 1 }
route = "lanes"
source = "DC r12 route b: v = IMAD(v, m, c) with m = IMAD(w, 2, 1) on a committed word w, two steps a MMA, 4/128 a committed word. The multiplier is odd so the chain doesn't contract: with the raw word as multiplier an even word shifts the history out 2-adically (the receipt reads only about the last 32 words), IMAD.HI and IMAD.WIDE's high half shrink it by w/2^32 a step, and a constant multiplier composes affinely. At credit floor, operands free: an IMAD filler binds JPI90_0 past about 0.045 a word (DC-90, q* 1.22: core 0.558% at 0.05, 1.058% at 0.07) and leaves JI90_0's slack below 0.025, so its window is 0.025 to 0.045. Here: DC-90 core 0.477%, ε_luck 0.075%, γ 1.677, binding JI90_0; DC-90-ri core 0.550% at q* 1.22 and 0.648% at ½ (the cheater runs 3.7% and 9.0% of it on the uniform datapath, at the model's one uniform instruction a lane instruction). Decision 76's 2% margin fails everywhere (redteam's margin, JI90_0 drives it): worst 1.407% and 3.264% on DC-90 at q* 1.22 and ½, 1.460% and 2.802% on DC-90-ri, and no IMAD filler up to 0.30 a word restores it. IMAD.HI costs about 2 IMAD on the IMAD pipe (4.18 a SM-clock alone against 2.0, uni.sh's IMAD forms) and has no window (DC-90 at 1.22: 0.913% at 0.02). FILL-OPT is its named assumption"
p = 0.0
luck = "Accounting.Guarantees.FillerLuck.PinnedFillBlocksDeficit: the chain is integer arithmetic mod 2^32 on committed words and the round's coins, so a check that recomputes the drawn tile's receipt reproduces it exactly and a wrong one fails whenever its tile is drawn; no kernel or check exists for it"

[skip.served]
eps = 0.004774
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip as dither-2s-licpw-redux-l32's, at this design's own ♭ (decision 90), 6.220 SMSP-cycles a 4096-MAC MMA on DC-90 (LI-CP and the IMAD filler); the most is at Llama-3.1-8B 2K prefill, all P·V's peel, and with P·V's served output checked it is 0.428% (8B) / 0.167% (70B) there"
