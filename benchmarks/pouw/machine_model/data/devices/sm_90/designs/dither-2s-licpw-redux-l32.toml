# LI-CP-W: the checkpoint XOR-reduced across the warp before the store (5 SHFL.BFLY and 5 LOP3 a lane a segment), so one
# 4-byte word a warp a segment leaves the SM instead of one a lane: receipt bytes 32x fewer Dither-2S with the LI fold
# at L = 32 on the H200 (sm_90): two-sided dither serving the last checked word and P·V's peel, LI receipts on every
# committed word and ffill's filler (benchmarks/pouw/dc/ffill.cuh: an IMAD and two FFMA on 3 of a thread's 128 words a
# MMA, 0.0703 a word, its receipt recomputed bit for bit). The noise is dither-2s-l32's, and ε_skip is this design's own
# at its ♭ (eps_budget's `design_skip`); the fold, honest and ε_mand are measured: LI binds honest on the H200's lane
# facet, so output counting closes the lane route.
name = "dither-2s-licpw-redux-l32"
title = "Dither-2S, LI-CP-W redux, ffill (0.0703 a word), L = 32"
summary = "Dither-2S on the H200 at L = 32: two-sided dither serving the last checked word, LI-CP-W receipts (a warp's checkpoint a segment), ffill's FFMA chains (0.0703 lane instructions a word, recomputed bit for bit), P·V's peel"
honest = "dc90-licpw-redux-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]
name = "li"          # LI plus the per-segment checkpoint: 4 LOP3, then one redux.sync.xor across the warp, and a store a lane a MMA (honest's kernel)
ALU = 0.53125
IMAD = 0.5
SHFL = 0.0234375

[fold_routes]       # the bit-exact checkpoint routes: four segments' words in one STG.128, an XOR on the uniform datapath, shared-memory and L2 atomics, a transpose through shared memory
source = "rt3_dc's lane loops (rt3_dc's cpatom.cuh; RT3-DC-1, -4, -6), each bit-exact on the H200 and the B200 (0 mismatches over 64 checkpoints and 256 final states), at their timed loops' SASS counts a 128-word segment a lane after LI's 64 LOP3 and 64 IMAD: CP_SEG4 (4 LOP3, REDUX, the IMAD.U32 taking its result, a quarter STG.128), CP_SEG4U (3 LOP3, 2 REDUX, ULOP3, a quarter STG.128; hand-assembled SASS, since ptxas puts that XOR on lanes, and the UR-to-R move unpriced), CP_ATS, CP_ATS2 and CP_ATS8 (a red.shared.xor into one word: 4 LOP3 and 1 ATOMS, 3 and 2, 0 and 8, then a quarter each LDS.128, STS.128 and STG.128), CP_RED, CP_RED2 and CP_RED8 (red.global.xor: 4 LOP3 and 1 REDG, 3 and 2, 0 and 8), and CP_XT (the warp's XOR by a transpose through shared memory: 4.5 LOP3, an STS, a quarter LDS.128 and a 32nd of an STG); and CP_RED, CP_RED2 and CP_RED8 through a generic address (red.relaxed.gpu.xor.b32, RT4-SHEET-7: rt4_sheet's red_generic.cu), which ptxas emits as ATOM.E.XOR.STRONG.GPU on sm_90a and sm_100a: the same counts with an ATOME32 for each REDG32, in its SASS for both archs, bit-exact on the H200 and the B200 (every global and generic red, red2 and red8 loop, 0 mismatches over 320 words each). Loop control and NOPs are left out. Each instruction is its census class (loads.class_of): ATOMS32, LDS128, STS128, STS32, STG128, STG32, REDUX, REDG32 cost one issue slot on the issue rows and nothing on the pipe rows, and ATOME32, which no run has timed, one slot on the issue row alone (RT4-SHEET-12), the sound price (each issues once; RT3-DC measured the same-address atomics slower, 32 SM-cycles a warp ATOMS and 54-81 a REDG, which no class-linear price separates from a conflict-free one); the H200's REDG32 also costs 290 SMSP-cycles on AT90, the L2's atomic row. The check reads the checkpoint word, not the program that wrote it, so the cheater folds by the cheapest mix of every route here and REDUX on Π, the floor program ♭ by the cheapest mix of the built ones (REDUX, these twelve loops and li-bulk at its measured cost), and honest by its kernel's REDUX. On DC-90 and DC-90-ri AT90 leaves the atomic unit spare capacity that lirmix says the chip doesn't have (CP_RED2 on one unit in eight slows the lane loop 7.6%), so a share of REDG routes lowers ♭'s credit and the cheater's cost alike, the conservative direction for both. After them come the counted folds, none built, on the cheater's menu so the bound prices them and FOLD-OPT is a premise about other folds only: on each lane route and the fold, RT4-SHEET-13's and -14's moves of LI (its XORs as a memory round trip of three issue slots, its multiplies as IMAD.WIDE, or both; a longer round trip and ptxas's IMAD.WIDE with its extra ALU price at least these class by class, so they add nothing, and the two-slot round trip is left off: li's XOR has three inputs, y ⊕ w ⊕ k, and one ATOM.E.XOR and one LD.E carry two), and li-bulk's BT1024 and trimmed W = ∞ members; li-bulk itself (RT4-SHEET-17, -21, -22, bit-exact on the H200 and L2-bound) is built, at its measured 3.27 SMSP-cycles a word. `counted` names them: the cheater may fold by them, and ♭ never does, since ♭ is credited only with programs a run has built"
