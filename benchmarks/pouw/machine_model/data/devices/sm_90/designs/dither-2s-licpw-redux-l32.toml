# LI-CP-W: the checkpoint XOR-reduced across the warp before the store (5 SHFL.BFLY and 5 LOP3 a lane a segment), so
# one 4-byte word a warp a segment leaves the SM instead of one a lane: receipt bytes 32x fewer
# Dither-2S with the LI fold at L = 32 on the H200 (sm_90): two-sided dither serving the last checked word and P·V's
# peel, LI receipts on every committed word and ffill's filler (benchmarks/pouw/dc/ffill.cuh: an IMAD and two FFMA on 3
# of a thread's 128 words a MMA, 0.0703 a word, its receipt recomputed bit for bit). The noise is dither-2s-l32's, and
# ε_skip is this design's own at its ♭ (eps_budget's `design_skip`); the fold, honest and ε_mand are DC-DESIGN's
# (note:20261017T0805Z-draft-dc-design §3, §4): LI binds honest on the H200's lane facet, so output counting closes the
# lane route.
name = "dither-2s-licpw-redux-l32"
title = "Dither-2S, LI-CP-W redux, ffill (0.0703 a word), L = 32"
summary = "Dither-2S on the H200 at L = 32: two-sided dither serving the last checked word, LI-CP-W receipts (a warp's checkpoint a segment), ffill's FFMA chains (0.0703 lane instructions a word, recomputed bit for bit), P·V's peel"
honest = "dc90-licpw-redux-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]
name = "li"          # LI plus the per-segment checkpoint: 4 LOP3, then one redux.sync.xor across the warp, and a store a lane a MMA (honest's kernel)
ALU = 0.53125
IMAD = 0.5
SHFL = 0.0234375

[fold_routes]       # li with the checkpoint's lane XOR in memory: a LOP3 and b red.global.xor (REDG) a segment, 2a + b ≥ 8
source = "RT2-HOPPER-1 (note:20261019T1140Z-draft-rt2-hopper): after LI's 64 LOP3 and 64 IMAD a lane a 128-word segment, the checkpoint's XOR of a lane's 8 chains and of the warp's 32 lanes can go to memory as red.global.xor.b32 (REDG.E.XOR), one issue slot each (the L2's atomic unit is unpriced, which only cheapens a route). CP_RED (4 LOP3 + 1 REDG) is bit-exact on the H200 (r20261019-120433-430c: 0 mismatches over 64 units against segment._li_absorb and warp_checkpoint; SASS r20261019-120314-32ce: LOP3 272, IMAD 256, REDG 4 a trip of 4 units), the others by XOR's associativity. With the MMA, (issue, ALU) a unit is (134, 136), (134, 134), (135, 132), (136, 130) and (137, 128), against REDUX's (136, 136). The check reads the checkpoint word, not the program that wrote it, so the cheater and the floor program ♭ fold by the cheapest mix of these and REDUX on Π, and honest by its kernel's REDUX"
cp-red = { ALU = 0.53125, IMAD = 0.5, REDG = 0.0078125 }     # 4 LOP3 + 1 REDG
cp-red2 = { ALU = 0.5234375, IMAD = 0.5, REDG = 0.015625 }   # 3 LOP3 + 2 REDG
cp-red4 = { ALU = 0.515625, IMAD = 0.5, REDG = 0.03125 }     # 2 LOP3 + 4 REDG
cp-red6 = { ALU = 0.5078125, IMAD = 0.5, REDG = 0.046875 }   # 1 LOP3 + 6 REDG
cp-red8 = { ALU = 0.5, IMAD = 0.5, REDG = 0.0625 }           # 8 REDG

[filler]
per_word = 0.0703125
mix = { FFMA = 2, IMAD = 1 }
route = "lanes"
source = "ffill (benchmarks/pouw/dc/ffill.cuh, ffill_ref.py): a thread's IMAD and two FFMA on 3 of its 128 accumulator words a MMA, 9/128 a committed word. At credit floor, operands free, q* 1.22 (the core ε, ε_luck in it): DC-90 core 0.539%, ε_luck 0.073%, γ 1.717, binding JI90_0; decision 76's 2% move leaves ε_machine 0 there but shifts the cheater to JI90_1, which raises ε_luck to 0.079% (worst 0.544%, redteam's margin; least_filler's least in this mix is 0.20 a word). DC-90-ri core 0.615%, ε_luck 0.097%, and the margin fails (worst 0.703%, JI90_0). At q* ½ it fails on both (worst 1.509% and 1.531%, JI90_0), and no filler in this mix up to 0.30 a word restores it. On DS-90 (the data-sheet vector) core 0.646%, γ 1.770. The integer step on ALU instead (IADD3 or LOP3) prices worse (DC-90 at 1.22: core 0.569%, worst 1.538%; JPA90_0 binds beside the fold's LOP3). FILL-OPT is its named assumption: a step's three instructions are an issue slot each and JI90_0 prices them alike; no sm_90 instruction does two exact binary32 FMAs in one issue (FFMA2 is sm_100's), wgmma's FP32 accumulation doesn't round each step to nearest even, FMUL then FADD rounds twice, DFMA then F2F costs two issues a step, and sm_90's uniform datapath has no FFMA (model.toml's uniform_forms). Open there: a last checkpoint guessed without the chains passes with probability 2^-32, and past |w| = 2^22 a step one lane absorbs saves an issue only if its whole warp absorbs it (ffill_ref.py)"
p = 0.0
luck = "Accounting.Guarantees.FillerLuck.PinnedFillBlocksDeficit, with the receipt F(D, C, τ) ffill_ref.receipt: a thread's two FFMA chains over its tile's committed words from the round's coins and the tile, which LI-CP-W's last checkpoint absorbs; every FMA is F32FmaV2 (fma.rn.f32: the exact a·b + c rounded once to nearest even, subnormals kept, every NaN 0x7FFFFFFF, the word sm_90's FFMA writes without .FTZ), so the check recomputes the drawn tile's receipt bit for bit and a wrong one fails whenever its tile is drawn. That holds whatever the GPU computes; ffill.sh's conformance on the H200 (ffill.cu's dumps against ffill_ref.py) is what an honest prover needs to pass, and has not run yet"

[skip.served]
eps = 0.005699
at = { "DC-90-ri" = 0.005699, "DS-90" = 0.008047 }
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 6.312 SMSP-cycles a 4096-MAC MMA on DC-90 (this design's own, decision 90) (LI-CP-W at the fold routes' cheapest mix, cp-red2, and ffill; 6.373 at REDUX); the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.570%. With P·V's served output checked it is 0.509% (8B) / 0.208% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of its tail instructions (4 mma.sync m16n8k32, 6.93 IMAD, 16.09 other), its sums by vfold (#2300, decision 91; 0.760 an entry) and served epilogue (6.15 a tile) at one an issue cycle, the peel on sm_90a's own instruction counts for the same kernel source (RT-ISA-7: static nvdisasm counts with ncu's rule applied, not ncu; eps_budget's SASS), on this device's Π (note:20261017T0320Z-draft-eps1-calc Round 10). On DC-90-ri (`at`) ♭ is DC-90's; on DS-90, ♭ 4.469 (cp-red2): 0.805% (Round 11)"

[mand.fold]
eps = 0.0
source = "named assumptions: LI-CP, its checkpoint by REDUX or any of the [fold_routes], at their lane instructions a word, is the cheapest implementation of the fold (FOLD-OPT; RT2-HOPPER-1 found the REDG checkpoints, and ♭ folds by their cheapest mix, so on DS-90 ε_machine first rises with ♭'s fold, 3 LOP3 + 2 REDG at 1.039 lane instructions a word, at 0.992, 4.5% under it) and the filler the cheapest of its work (FILL-OPT). With every absorbed word pinned (PIN), the receipt's luck is 0 for a skip that lands on one word of a segment: a checkpoint is injective in each word it absorbed (Lean Pouw.SecurityProofs.Receipt.LiCheckpointWordInjective, odd multipliers only); KLI₂₄, (RT), (G₃) and (HO_U) are not read (note:LI-ALT)"

[clock]
eps = 0.0
source = "f_H unmeasured on the H200 (EPS1 DC measured f_max = 1980 MHz at default clocks, 06:01Z): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 8 }
source = "dp4a at 8 IDP4A a word at L = 32, on IMAD's class as sm_120 prices it (no IDP4A kind in EPS1 DC's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
