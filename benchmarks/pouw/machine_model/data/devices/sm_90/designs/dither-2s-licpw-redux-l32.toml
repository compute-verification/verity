[filler]
per_word = 0.0703125
mix = { FFMA = 2, IMAD = 1 }
route = "lanes"
source = "ffill (benchmarks/pouw/dc/ffill.cuh, ffill_ref.py): a thread's IMAD and two FFMA on 3 of its 128 accumulator words a MMA, 9/128 a committed word. At credit floor, operands free, q* 1.22 (the core ε, ε_luck in it): DC-90 core 0.643%, ε_luck 0.074%, γ 2.344, binding JI90_0. The 2% margin's move fails there (worst 1.256%, redteam's margin): JI90_0 up 2% puts the cheater on CP_RED2's counted IMAD.WIDE moves (-wideh), which ♭, folding by the built routes alone, can't follow, and ε_machine opens to 0.613%. DC-90-ri core 0.718%, ε_luck 0.098%, and the margin fails (worst 1.380%, JI90_0). At q* ½ it fails on both (worst 1.256% and 1.380%, JI90_0), and at neither q* does a filler in this mix up to 0.30 a word restore it. On DS-90 (the data-sheet vector) core 0.808%, γ 2.406, and the margin fails (worst 1.686%, DS_issue). The integer step on ALU instead (IADD3 or LOP3) prices worse (DC-90 at 1.22: core 0.657%, worst 1.256%; JPA90_0 binds beside the fold's LOP3). FILL-OPT is its named assumption: a step's three instructions are an issue slot each and JI90_0 prices them alike; no sm_90 instruction does two exact binary32 FMAs in one issue (FFMA2 is sm_100's), wgmma's FP32 accumulation doesn't round each step to nearest even, FMUL then FADD rounds twice, DFMA then F2F costs two issues a step, and sm_90's uniform datapath has no FFMA (model.toml's uniform_forms). Open there: a last checkpoint guessed without the chains passes with probability 2^-32, and past |w| = 2^22 a step one lane absorbs saves an issue only if its whole warp absorbs it (ffill_ref.py)"
p = 0.0
luck = "Accounting.Guarantees.FillerLuck.PinnedFillBlocksDeficit, with the receipt F(D, C, τ) ffill_ref.receipt: a thread's two FFMA chains over its tile's committed words from the round's coins and the tile, which LI-CP-W's last checkpoint absorbs; every FMA is F32FmaV2 (fma.rn.f32: the exact a·b + c rounded once to nearest even, subnormals kept, every NaN 0x7FFFFFFF, the word sm_90's FFMA writes without .FTZ), so the check recomputes the drawn tile's receipt bit for bit and a wrong one fails whenever its tile is drawn. That holds whatever the GPU computes; ffill.sh's conformance on the H200 (ffill.cu's dumps against ffill_ref.py) is what an honest prover needs to pass, and has not run yet"

[skip.served]
eps = 0.005699
at = { "DC-90-ri" = 0.005699, "DS-90" = 0.008047 }
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 6.319 SMSP-cycles a 4096-MAC MMA on DC-90 (this design's own, decision 90) (LI-CP-W at the fold routes' cheapest mix, 0.697 cp-red and 0.303 cp-ats2, and ffill; 6.373 at REDUX); the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.569%. With P·V's served output checked it is 0.514% (8B) / 0.210% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of its tail instructions (4 mma.sync m16n8k32, 6.93 IMAD, 16.09 other), its sums by vfold (decision 91; 0.760 an entry) and served epilogue (6.15 a tile) at one an issue cycle, the peel on sm_90a's own instruction counts for the same kernel source (RT-ISA-7: static nvdisasm counts with ncu's rule applied, not ncu; eps_budget's SASS), on this device's Π. On DC-90-ri (`at`), ♭ with the fold loops' memory, control and warp-reduce classes the H200 timed beside the IGMMA on the JI90 lines, its fold by the built routes alone: 0.570%; on DS-90, ♭ 4.469 (cp-red2; 4.531 at REDUX): 0.805% (Round 11)"

[mand.fold]
eps = 0.0
source = "named assumptions: LI-CP, its checkpoint by REDUX or any of the [fold_routes], at their lane instructions a word, is the cheapest implementation of the fold (FOLD-OPT), and the filler the cheapest of its work (FILL-OPT). The menu is every bit-exact checkpoint loop the tree carries (rt3_dc's among them, the shared-memory and L2 atomics included; RT3-DC-1, -4), their memory and control classes at one issue slot and no pipe row, and REDG32 also 290 SMSP-cycles on AT90 (ATOME32, the same reduction through a generic address, has no AT90 line: AT90 was timed on REDG alone); on DC-90-ri the ones the H200 timed beside the IGMMA carry the JI90 lines too (and a later run for STS32, STS128, STG32, STG128 and ISETP). The cheater's menu also holds every counted fold known to come near it, unbuilt (RT4-SHEET-13, -14, -17, -22; [fold_routes] `counted`), so FOLD-OPT is a premise only about folds off the menu; ♭ folds by the built routes alone. FOLD-OPT has no slack as a premise: a fold cheaper than the menu's cheapest at the certificate falsifies it. The readings' slack is small: in the Lean bound, with ♭ held at its fold (cp-red2 on DS-90), a cheater whose every fold route is 0.058% cheaper takes DS-90 to 1% (RT3-DC-7; RT2-HOPPER-10: the 4.5% and 5.9% once quoted scaled ♭'s fold with the cheater's, which isn't FOLD-OPT's slack); DC-90-ri is over 1% already. It also covers li's XOR x ⊕ y ⊕ k, one LOP3 a half step: no IMAD- or FP-pipe program of 1 or 2 instructions computes it within the modelled menu IMAD, IMAD.HI, IDP.4A, IDP.2A and FFMA2 (IMAD.WIDE, HFMA2 and the ALU class outside it; FOLD-XOR k = 1; k = 2, all 1,456 two-instruction sequences unsat), a checked fact within that menu, not a proof over the chip; the cheapest known is 78 IMAD-pipe instructions (33 IMAD, 45 IMAD.HI). The Lean bound's DS-90 certificate, DS_issue alone, prices every instruction at one slot, so there it reads no pipe premise. With every absorbed word pinned (PIN), the receipt's luck is 0 for a skip that lands on one word of a segment: a checkpoint is injective in each word it absorbed (Lean Pouw.SecurityProofs.Receipt.LiCheckpointWordInjective, odd multipliers only); KLI₂₄, (RT), (G₃) and (HO_U) are not read"

[clock]
eps = 0.0
source = "f_H unmeasured on the H200 (EPS1 DC measured f_max = 1980 MHz at default clocks): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

