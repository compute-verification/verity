# Dither-2S with the LI fold at L = 32 on the H200 (sm_90): two-sided dither serving the last checked word and P·V's
# peel, LI receipts on every committed word and 0.02 verified FFMA a word. The noise is dither-2s-l32's, and ε_skip is
# this design's own at its ♭ (eps_budget's `design_skip`); the fold, honest and ε_mand are the LI designs': LI binds
# honest on the H200's lane facet, so output counting closes the lane route.
name = "dither-2s-li-l32"
title = "Dither-2S, LI, L = 32"
summary = "Dither-2S on the H200 at L = 32: two-sided dither serving the last checked word, LI receipts, P·V's peel"
honest = "dc90-li-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]
name = "li"          # LOP3 (^ d0 ^ k0) on one word, IMAD (·a0 + d1) on the next
ALU = 0.5
IMAD = 0.5

[filler]
per_word = 0.02
mix = { FFMA = 1 }
route = "lanes"
source = "DC-DESIGN: LI's ALU ½ + IMAD ½ leaves the ALU pipe 1.5% short of half issue on the H200, so 0.02 verified FFMA a word puts honest on JI90_0, whose lane threshold is 0.4999 at L = 32; FILL-OPT is its named assumption"
p = 0.0
luck = "Accounting.Guarantees.FillerLuck.PinnedFillBlocksDeficit, once the filler's receipt is recomputed bit for bit: FFMA is IEEE 754 binary32 fused multiply-add, rounded once (round to nearest even), so with its FTZ mode and NaN's encoding pinned the verifier reproduces every word exactly and a wrong receipt fails whenever its tile is drawn. The H200's FFMA filler and its check are ffill's (benchmarks/pouw/dc/ffill.cuh, ffill_ref.py: fresh words each step, two chains from the round's coins, 0.0703 a word in dither-2s-licpw-redux-l32); this design's 0.02 FFMA a word is priced, not built. FILL-OPT is where an FFMA chain is weak (with fixed operands it reaches a fixed point or overflows, after which its receipt costs nothing), which is why ffill feeds each step a committed word"

[skip.served]
eps = 0.00603
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 5.961 SMSP-cycles a 4096-MAC MMA on DC-90; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.603%: its tail 0.309%, the sums DG, S and X(0) 0.235%, the served epilogue 0.0593%. With P·V's served output checked it is 0.544% (8B) / 0.222% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of its tail instructions (4 mma.sync m16n8k32, 6.93 IMAD, 16.09 other), its sums by vfold (0.760 an entry) and served epilogue (6.15 a tile) at one an issue cycle, the peel on sm_90a's own instruction counts for the same kernel source (RT-ISA-7: static nvdisasm counts with ncu's rule applied, not ncu; eps_budget's SASS), on this device's Π"

[mand.fold]
eps = 0.0
source = "named assumptions: LI at 1 lane instruction a word is the cheapest implementation of the fold (FOLD-OPT) and the filler the cheapest of its work (FILL-OPT); LI's binding rests on KLI₂₄, (RT), (G₃) and (HO_U) ((HO) itself fails in serving)"

[clock]
eps = 0.0
source = "f_H unmeasured on the H200 (EPS1 DC measured f_max = 1980 MHz at default clocks): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε
name = "dp4a"
program = { IMAD = 8 }
source = "dp4a at 8 IDP4A a word at L = 32, on IMAD's class as sm_120 prices it (no IDP4A kind in EPS1 DC's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
