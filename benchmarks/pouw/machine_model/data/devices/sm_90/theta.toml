# ---- FP8 atom semantics (PEARLC-MODEL) -----------------------------------------------------------------------------

[[fp8]]
form = "wgmma m64nNk32 .f32.e4m3.e4m3 (QGMMA), and .e5m2"
products = "exact: an E4M3 product has an 8-bit significand, never overflows (448² < 2^18) and is never below 2^-18"
group = "one group: the 32 products of a k32 step plus the incoming FP32 accumulator"
alignment = "every term, the accumulator included, rescaled to a 14-bit significand and aligned to the group's largest exponent (floor -139, unobservable at or below -126) by a truncating right shift of its magnitude"
accumulation = "the aligned terms summed exactly, the sum normalized to 14 bits by truncation, then to FP32 by truncation (no rounding): the FP32 accumulator keeps 14 significand bits a step, which is the 'FP8 accumulation precision loss' DeepSeek-V3 reports"
promotion = "none in silicon. Software promotes: a fresh accumulator from +0 every N_C = 128 products (4 wgmma k32 steps), added to an FP32 total on the CUDA cores by one round-to-nearest-even FADD (DeepSeek-V3 technical report, arXiv:2412.19437, §3.3.2; Pearl's H100 replay, `pearl_kw.py` Device h100, windowed, W = 13)"
rate = "4095.6 MACs/SM/clk at N ≥ 64 (tensor.e4m3.k32); N < 64 unmeasured for FP8 (s8: N32 2729.9, N16 1637.9, N8 909.9)"
source = "verity.ml.circuits.silicon models.HOPPER_E4M3_K32 (Hawkeye: groups (32,), width 14, floor -139) and total_fp8.HOPPER_E4M3_WGMMA_K32, pinned on an H100 80GB HBM3: 35,289 tiles × 3, 144,543,744 words, 0 mismatches, groups (32,) and width 14 unique among 3,060 candidates; E5M2 the same pipeline (HOPPER_E5M2_K32, 25,554,432 elements, 0 mismatches). NVIDIA documents state none of this"

[[fp8]]
form = "mma.sync m16n8k32 .f32.e4m3.e4m3 (emulated on sm_90)"
products = "exact: the operands are converted to f16 (cvt.rn.f16x2.e4m3x2, exact) and multiplied by HMMA"
group = "two groups of 16 products (the k halves), each a HMMA.16816.F32"
alignment = "26-bit truncating adder a group (floor -133), as HMMA.16816.F32"
accumulation = "ptxas: two HMMA from +0 over the k halves, then FADDs (round-to-nearest-even) into the accumulator; Triton's MMAv2 lowering instead chains the accumulator through both HMMA (HOPPER_E4M3_MMAV2_K32: groups (16, 16), width 26, k order MMAV2_E4M3_K_ORDER)"
promotion = "the FADDs are FP32 adds on the FMA pipe, so the accumulator is not truncated to 14 bits"
rate = "1343.8 MACs/SM/clk (tensor.e4m3.k32.sync: half HMMA.16816's instruction rate), plus 4 FADD a mma.sync"
source = "total_fp8.HOPPER_E4M3_MMAV2_K32's docstring: ptxas's lowering measured on the H100 (25,040,128 words each, 0 mismatches); the chained form on the H200 in vLLM's fused_moe_kernel (638,976 words, 0 mismatches)"

