# θ for the H200 SXM 141 GB (ACCEL CALIB): every rate, capacity and clock the accelerator model reads, each with its
# vendor document first (`sheet`, `grade`, `source`), then the census or a measured run (`measured`, `runs`), or the run
# that would measure it (`gap`). A rate is a SM-clock's (MACs, results or bytes a SM-clock); `clock` names the clock its
# per-second figure is at, and `figure` is the number the document prints there (dense), which 2 · sheet · SMs · clock
# reproduces (`machine-model theta --check`). `machine-model theta` derives d, the exchange rate, B_RF and r_H against
# r_min from it; `machine-model render theta` tabulates it.
gpu = "H200 SXM 141 GB (sm_90a)"
sms = 132
sms_source = "H100 whitepaper V1.04, Table 3, H100 SXM5: 'SMs 132'; the H200 data sheet states none (its peaks are H100 SXM5's); the device reports 132 (sheet.toml)"
# Duo (provisional), LI (provisional), and RT-HOPPER's measured LI loop that folds its own wgmma accumulators.
honest = ["dc90-l32", "dc90-li-l32", "dc90-licpw-redux-l32"]
documents = [
  "DS: NVIDIA H200 data sheet (nvidia.com/en-us/data-center/h200), Technical Specifications, H200 SXM column; footnote 1 'Preliminary specifications', footnote 2 'With sparsity'",
  "WP: NVIDIA H100 Tensor Core GPU Architecture whitepaper V1.04, Table 3 (p. 39), H100 SXM5 column: the same GH100 die and SM count as the H200",
  "CPG: CUDA C++ Programming Guide 12.9, §6.4.1 Table 7 'Throughput of Native Arithmetic Instructions (results a clock a multiprocessor)', CC 9.0 column; §20 Table 'Technical Specifications per Compute Capability'; §18.8 (CC 9.0)",
  "PTX: PTX ISA 9.4, §9.7.14 (mma.sync) and §9.7.15 (wgmma.mma_async)",
]

[clocks.fmax]
mhz = 1980
grade = "whitepaper (H100 SXM5)"
source = "WP Table 3: 'GPU Boost Clock for FP64 Tensor Core Ops, FP32 and FP64 non Tensor Core Ops: 1980 MHz'; the DS states no clock"
measured = "the driver's maximum on vy-dc-h200 is 1980 MHz; under a saturated wgmma the event clock is 1518-1797 MHz while NVML reads 1905-1965 (RT-H200-EMP)"

[clocks.tensor]
mhz = 1830
grade = "whitepaper (H100 SXM5)"
source = "WP Table 3: 'GPU Boost Clock for FP8, FP16, BF16, TF32 Tensor Core Ops: 1830 MHz': the clock every DS tensor TOPS figure is at"
measured = "the best dense s8 loop does 1942.7 TOPS, 1.8% under the DS's 1979: 4095.6 MACs a SM-clock at about 1797 MHz"
measured_mhz = 1797

