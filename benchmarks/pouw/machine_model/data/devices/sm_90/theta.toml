what = "compressible memory (CU_MEM_ALLOCATION_COMP_GENERIC): generic compression of DRAM and L2 traffic"
verdict = "open"
why = "computes nothing, but a compressible operand (a degenerate workload's zeros) moves faster than hbm and l2.read price (A100 WP 'Compute Data Compression': up to 4× DRAM and L2 read bandwidth); the matmul words aren't bandwidth-bound at served K, so this reaches P2's bandwidth prices only"
gap = "a bandwidth probe of a compressible allocation of zeros against a plain one on the H200 (GPU queue)"

[[unit]]
key = "host.link"
what = "the host link: PCIe Gen5 x16 to the host CPUs and the NICs; no NVLink to a host (NVLink-C2C is GH200's, not HGX H200's)"
verdict = "none"
rates = ["host.link"]
why = "moves bytes and adds nothing; it bounds what host.cpu can take off the card"

[[unit]]
key = "host.cpu"
what = "the host's CPUs (or any machine behind the NICs), hashing words the card sends them (NF4)"
verdict = "open"
rates = ["host.link", "sha512", "host.sha512", "host.int8", "host.dram"]
bound = 0.00382614
against = "sha512"
why = "the host computes every compression of data it holds, so for any host the words' bytes bound it: the no-fold receipt's v1 packs 32 four-byte words into a 1024-bit hiding leaf block under a binary tree, κ = 2 compressions a 128 B of words, so host.link's 64e9 B/s carry 1e9 compressions' worth a second, 1e9 / (132 SMs · 1,980 MHz, sha512's measured clock) = 0.00382614 a SM-clock; the share of device time it frees is that over the card's hashing rate whatever L is (the link runs through the tensor time too), up to hashing's own share. Our node binds first at its cores: 8 a GPU at host.sha512's 2.934e7 = 2.35e8 a second, 8.98e-4 a SM-clock, 4.90% of the measured sha512. Its AMX: 8 cores at host.int8 = 3.11e13 exact s8 MACs a second, 3.15% of the DS's 1,979 TOPS dense (9.89e14 MACs). NVLink peers are cards the audit counts"
gap = "the prover chooses the host (P9), so a bound tighter than the link's needs the node's inventory from someone other than the prover, an open claim; κ of the receipt PROTO-DESIGN freezes (v2's 8-block leaves and 16-ary tree: about 1.1); sha512_mb, an AMX loop and a pinned device-to-host copy on the node (the H200 census batch, rule G)"

# The built kernel's SASS a compression, for SHA-512's ceiling on the card's pipes (`sha_ceiling`): `alu` on the ALU
# pipe, `imad` on the IMAD pipe, `other` elsewhere; `rotates` rotations or shifts (two SHF each) and `adds` 2-input
# 64-bit adds (built as `add_form`) may go to IMAD.
[sha512_mix]
alu = 3400
imad = 152
other = 56
rotates = 864
adds = 152
add_form = "IADD3 + IMAD.X"
overlap = "θ's joint rows: IADD3 and IMAD issue together under JI90_0 (d 21.6 measured); the moves untimed on the H200"
source = "commit_gpu's default build on sm_90 (RT-UNITS' reading, 'SHA-512 schedules'): 3,608 instructions, SHF 1,728 (864 rotations and shifts), LOP3 912, IADD3(.X) 760, 152 IMAD.X (the carry halves of 152 2-input adds), 56 other"

