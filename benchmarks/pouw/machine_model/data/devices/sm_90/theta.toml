# ---- the units RT-UNITS lists outside the rates above: their rates, then a verdict a unit ---------------------
# A reduction unit is an adding route d reads, at an upper bound where no run has timed it. Every 32-bit add it makes
# moves a word through a shared-memory or L1 port (CPG 'Shared Memory': 32 banks, each 32 bits a clock), so 32 a
# SM-clock bounds each. Every add moves more than one word (a read-modify-write, and a bulk reduction's source read),
# so the true rate is lower: 32 over-allows the route, the safe side, and costs γ and ε at most what these routes
# lower d by (RT-UNITS U12). Only TMA's bulk reduction takes no lane: one instruction moves a whole bulk.

