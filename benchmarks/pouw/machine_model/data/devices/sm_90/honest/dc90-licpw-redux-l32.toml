# Honest at L = 32 on the H200 (sm_90) with the LI fold and LI-CP-W's checkpoint reduced across the warp by ONE
# redux.sync.xor.b32 a segment. Measured (DC EPS1 r10): r9 could not time the loop because the sm_90 gate refuses a
# warp-collective op in a dynamic-trip OP_UNTIL loop (a clock read ends up inside a loop); a static-trip OP_LOOP variant
# (wgli_redux) keeps the clock reads outside the loop, so the redux gates, and times the honest loop beside the saturated
# wgmma: it folds the 512 committed words a warpgroup with LI and reduces each segment by one redux.sync.xor, running the
# wgmma at 0.5993 of its alone rate (the no-checkpoint loop wgli_base at 0.6309, the 5-shuffle fallback wgli_reduce at
# 0.4937), so 204.25 SMSP-cycles a MMA, 3.2% above the model's 197.96 (its 0.6184). The accumulator is in registers, so a
# committed word needs no TMEM load. One 4-byte word a warp a segment leaves the SM.
name = "dc90-licpw-redux-l32"
status = "measured"
source = "DC EPS1 r10, wgli_redux (r20261017-212548-5c53): the static-trip honest LI loop with the per-segment redux checkpoint runs the saturated wgmma at 0.5993 of its alone rate (wgli_base, no checkpoint, 0.6309), so the plain GEMM's 122.41 SMSP-cycles a MMA over 0.5993 is 204.25; LI is LOP3 and IMAD a pair of words, 128 committed words a lane a MMA at L = 32, plus the per-segment checkpoint reduced by one redux.sync.xor"
L = 32

[mma]
kind = "IGMMA.64x256x32.S8.S8"
class = "IGMMA_S8_N256"
words = 4096
depth = 32

[per_mma]       # warp instructions a MMA: the MMA and the fold
IGMMA_S8_N256 = 1
ALU = 68        # LI's 64 and the 4-LOP3 chain XOR a segment
IMAD = 64
SHFL = 3        # one redux.sync.xor at 2 SHFL and the store at 1

[measured]
cycles_per_mma = 204.25         # the plain GEMM's 122.41 SMSP-cycles a MMA over the measured tensor fraction 0.5993
source = "DC EPS1 r10, wgli_redux (r20261017-212548-5c53): the static-trip honest LI loop with the per-segment redux.sync.xor checkpoint, no filler, runs the saturated wgmma at 0.5993 of its alone IGMMA rate (the no-checkpoint loop wgli_base at 0.6309, the 5-shuffle fallback wgli_reduce at 0.4937), so the plain GEMM's 122.41 SMSP-cycles a MMA over 0.5993 is 204.25, 3.2% above the model's 197.96 (its implied 0.6184)"

[operands]      # the least operand delivery any program pays a MMA when the design names none
floor = { IGMMA_S8_N256 = 0.0 }
source = "wgmma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the warpgroup fences and commit groups are left out, so it is a lower bound"

[fold]          # lane instructions a committed word
name = "li"
ALU = 0.53125   # LI's 0.5 and the 4-LOP3 chain XOR a segment (0.03125)
IMAD = 0.5
SHFL = 0.0234375 # one redux.sync.xor priced at 2 SHFL, and the store at 1, a segment (3 / 128)
