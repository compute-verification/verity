# Dither-2S with the LI fold at L = 32 on the B200 (sm_100), with ¾ verified lane instruction a word and P·V's sums
# formed by vfold: dither-2s-li-l32's noise, fold and honest. With the operands free (the TS model's word-route demand
# prices delivery at 0), the cheater skips the 8 tcgen05.ld.x128 a MMA that bring the words to lanes, 8 of ♭'s 1033
# issue cycles (0.774%) at every q*; the filler adds 768 to ♭ and to the cheater, which takes ε_machine to 0.444% and,
# over the same B_♭, ε_skip to 0.483% (EPS1 DC r6). Its ε_skip is its own, ♭ with the filler, as the H200's LI designs'.
name = "dither-2s-li-fill-l32"
title = "Dither-2S, LI, ¾ filler, L = 32"
summary = "Dither-2S on the B200 at L = 32: two-sided dither, LI receipts, ¾ verified lane instruction a word, P·V's peel with vfold's sums"
honest = "dc100-li-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDTM_32X32B_X128 = 8 }
source = "tcgen05.mma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the accumulator's 32768 words leave TMEM by 8 tcgen05.ld.32x32b.x128 a MMA at L = 32 (4096 words each), which every tensor-route word pays to be folded on lanes"

[fold]
name = "li"          # LOP3 (^ d0 ^ k0) on one word, IMAD (·a0 + d1) on the next
ALU = 0.5
IMAD = 0.5

[filler]
per_word = 0.75
mix = { ALU = 1, IMAD = 1 }
route = "lanes"
source = "EPS1 DC r6: with the operands free, ε_machine is the 8 tcgen05.ld.x128 a MMA over ♭'s issue at any q* (no route but the tensor's writes a word), and ε_skip is over the same B_♭, so lane work a word dilutes both; core < 1% from 0.62 a word (γ 3.64), ¾ leaves 0.07% of margin. LOP3 and IMAD alternating, receipts checked like the fold's; FILL-OPT is its named assumption"
p = 0.0
luck = "Accounting.Guarantees.FillerLuck.PinnedFillBlocksDeficit: the ¾ lane chain's inputs (LOP3 and IMAD alternating) are public functions of the round's coins and its tile, as lane_fill's and lfill's are, and the check recomputes the drawn tile's receipt and compares it with the committed one, so a wrong receipt fails whenever its tile is drawn and nothing is left to guess; what a right receipt costs is FILL-OPT's"

[skip.served]
eps = 0.00483
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 7.035 SMSP-cycles a 4096-MAC MMA on DC-100 (the LDTM, the fold and the filler); the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.483%: its tail 0.257%, the sums DG, S and X(0) at vfold's 0.7265 warp instructions an entry 0.190%, the served epilogue 0.036%. With P·V's served output checked it is 0.383% (8B) / 0.150% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of BC-KERNEL r2's tail instructions (4 mma.sync m16n8k32, 4 IMAD, 11.5 other), its sums and served epilogue at one an issue cycle, on sm_120's instruction counts for the same kernel source, on this device's Π (note:20261017T0320Z-draft-eps1-calc Round 9, EPS1 DC r6)"

[mand.fold]
eps = 0.0
source = "named assumptions: LI at 1 lane instruction a word is the cheapest implementation of the fold (FOLD-OPT) and the filler the cheapest of its work (FILL-OPT); LI's binding rests on KLI₂₄ (decision 65), (RT), (G₃) and (HO_U) (decision 59; (HO) itself fails in serving)"

[clock]
eps = 0.0
source = "f_H unmeasured on the B200 (EPS1 DC measured f_max = 1965 MHz at default clocks, 06:01Z): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 8 }
source = "dp4a at 8 IDP4A a word at L = 32, on IMAD's class as sm_120 prices it (no IDP4A kind in EPS1 DC's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
