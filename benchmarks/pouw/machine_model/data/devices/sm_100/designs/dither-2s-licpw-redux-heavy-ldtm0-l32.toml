# dither-2s-licpw-redux-heavy-l32 with the floor program crediting no tcgen05.ld: the same honest kernel, its 8
# LDTM.32x32b.x128 a MMA still run, but ♭ (credit floor) no longer counts them. The operands-free cheater (decision 89)
# never pays them, so on DC-100-ri they were all of ε_machine (8 of ♭'s 1857 issue cycles a UTCIMMA, 0.431%); credited
# at 0 they leave ε_machine at 0 (core 0.900% → 0.471% on DC-100-ri, 0.472% → 0.420% on DS-100, where ♭ now binds
# DS_alu) and raise honest's time over the credit by 8/1849 (1.115 → 1.120); γ, honest over the plain GEMM, is
# unchanged. A lower credit is sound for any program.
base = "dither-2s-licpw-redux-heavy-l32"
name = "dither-2s-licpw-redux-heavy-ldtm0-l32"
title = "Dither-2S, LI-CP-W redux heavy fold, ♭ without LDTM, L = 32"
summary = "dither-2s-licpw-redux-heavy-l32 with the floor program crediting no tcgen05.ld: honest's 8 LDTM a MMA leave ε_machine and the credit"

[operands]
floor = { LDTM_32X32B_X128 = 0.0 }
source = "the floor program's operand-delivery floor φ_del is credited at 0: tcgen05.mma reads both operands from shared memory by descriptor, so delivery costs no warp instruction, and the accumulator's 8 tcgen05.ld.32x32b.x128 a MMA that honest runs to fold its words on lanes (dither-2s-licpw-redux-heavy-l32's φ_del) are not credited, since the operands-free cheater skips them. Honest still runs them: its time over the credit counts them, γ already did"

[skip.served]
eps = 0.004707
at = { "DC-100-ri" = 0.004707, "DS-100" = 0.004064 }
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip as dither-2s-licpw-redux-heavy-l32's, at this design's own ♭ (decision 90), the LI-CP fold with its extra rounds and no LDTM: on DC-100 ♭ is 7.2227 SMSP-cycles a 4096-MAC MMA (1849 an UTCIMMA, issue), 1849/1857 of the base's, so ε_skip is a little larger; on DS-100 ♭ is 7.2500 (1856, DS_alu, where the base's 1857 bound DS_issue). The most is at Llama-3.1-8B 2K prefill, all P·V's peel. On DC-100-ri (`at`) ♭ is DC-100's; on DS-100 the tail is at DS-100's price (run r20261019-051138-59fe)"
