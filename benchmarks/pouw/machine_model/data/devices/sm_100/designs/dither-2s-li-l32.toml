# Dither-2S with the LI fold at L = 32 on the B200 (sm_100): two-sided dither serving the last checked word and P·V's
# peel, LI receipts on every committed word. The noise is dither-2s-l32's, and ε_skip is this design's own at its ♭
# (eps_budget's `design_skip`); the fold, honest and ε_mand are measured: LI binds honest on the B200's lane
# facet, so output counting closes the lane route.
name = "dither-2s-li-l32"
title = "Dither-2S, LI, L = 32"
summary = "Dither-2S on the B200 at L = 32: two-sided dither serving the last checked word, LI receipts, P·V's peel"
honest = "dc100-li-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDTM_32X32B_X128 = 8 }
source = "tcgen05.mma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the accumulator's 32768 words leave TMEM by 8 tcgen05.ld.32x32b.x128 a MMA at L = 32 (4096 words each), which every tensor-route word pays to be folded on lanes"

[fold]
name = "li"          # LOP3 (^ d0 ^ k0) on one word, IMAD (·a0 + d1) on the next
ALU = 0.5
IMAD = 0.5

[skip.served]
eps = 0.00839
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭, ♭ 4.035 SMSP-cycles a 4096-MAC MMA on DC-100; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.839%: its tail 0.446%, the sums DG, S and X(0) 0.331%, the served epilogue 0.0626%. With P·V's served output checked it is 0.666% (8B) / 0.261% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of BC-KERNEL r2's tail instructions (4 mma.sync m16n8k32, 4 IMAD, 11.5 other), its sums by vfold and served epilogue at one an issue cycle, on sm_120's instruction counts for the same kernel source, on this device's Π"

[mand.fold]
eps = 0.0
source = "named assumptions: LI at 1 lane instruction a word is the cheapest implementation of the fold (FOLD-OPT); LI's binding rests on KLI₂₄, (RT), (G₃) and (HO_U) ((HO) itself fails in serving)"

[clock]
eps = 0.0
source = "f_H unmeasured on the B200 (f_max = 1965 MHz at default clocks, @b200-fmax): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε
name = "dp4a"
program = { IMAD = 8 }
source = "dp4a at 8 IDP4A a word at L = 32, on IMAD's class as sm_120 prices it (no IDP4A kind in this device's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
