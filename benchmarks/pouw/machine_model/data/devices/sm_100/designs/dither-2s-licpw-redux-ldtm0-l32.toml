# dither-2s-licpw-redux-heavy-l32 credited at what the checks read. Its fold is plain LI-CP-W redux, as honest runs it
# (dc100-licpw-redux-l32: ALU 544, IMAD 512, SHFL 24 a MMA) and PouwWarpCheck recomputes it (PouwLiAbsorb_v2: two half
# steps a chain a set, no extra keyed round), so ♭ credits none of the heavy design's extra keyed rounds, which no
# Definition reads. ♭ credits no tcgen05.ld either: honest still runs its 8
# LDTM.32x32b.x128 a MMA, but the operands-free cheater never pays them. Each lowers the credit, which is
# sound for any program. ♭ is 4.160 SMSP-cycles a 4096-MAC MMA on DC-100-ri, its checkpoint at the fold routes' cheapest
# mix (4.223 at REDUX; the heavy design's ♭ 7.254), so the skippable work is a larger share of it: core 0.815% on
# DC-100-ri, 0.698% on DS-100.
base = "dither-2s-licpw-redux-heavy-l32"
name = "dither-2s-licpw-redux-ldtm0-l32"
title = "Dither-2S, LI-CP-W redux, ♭ crediting no tcgen05.ld, L = 32"
summary = "Dither-2S on the B200 at L = 32, credited at what the checks read: the plain LI-CP-W redux fold and no tcgen05.ld in ♭ (honest runs its 8 LDTM a MMA; no extra keyed round)"

[operands]
floor = { LDTM_32X32B_X128 = 0.0 }
source = "the floor program's operand-delivery floor φ_del is credited at 0: tcgen05.mma reads both operands from shared memory by descriptor, so delivery costs no warp instruction, and the accumulator's 8 tcgen05.ld.32x32b.x128 a MMA that honest runs to fold its words on lanes are not credited, since the operands-free cheater skips them. Honest still runs them: its time over the credit counts them"

[fold]
name = "li"          # LI-CP-W redux: 0.53125 ALU, 0.5 IMAD, one redux.sync.xor and the store on SHFL
ALU = 0.53125
IMAD = 0.5
SHFL = 0.0234375

[fold_routes]       # the bit-exact checkpoint routes: four segments' words in one STG.128, an XOR on the uniform datapath, shared-memory and L2 atomics, a transpose through shared memory
source = "rt3_dc's lane loops (rt3_dc's cpatom.cuh; RT3-DC-1, -4, -6), each bit-exact on the H200 and the B200 (0 mismatches over 64 checkpoints and 256 final states), at their timed loops' SASS counts a 128-word segment a lane after LI's 64 LOP3 and 64 IMAD: CP_SEG4 (4 LOP3, REDUX, the IMAD.U32 taking its result, a quarter STG.128), CP_SEG4U (3 LOP3, 2 REDUX, ULOP3, a quarter STG.128; hand-assembled SASS, since ptxas puts that XOR on lanes, and the UR-to-R move unpriced), CP_ATS, CP_ATS2 and CP_ATS8 (a red.shared.xor into one word: 4 LOP3 and 1 ATOMS, 3 and 2, 0 and 8, then a quarter each LDS.128, STS.128 and STG.128), CP_RED, CP_RED2 and CP_RED8 (red.global.xor: 4 LOP3 and 1 REDG, 3 and 2, 0 and 8), and CP_XT (the warp's XOR by a transpose through shared memory: 4.5 LOP3, an STS, a quarter LDS.128 and a 32nd of an STG); and CP_RED, CP_RED2 and CP_RED8 through a generic address (red.relaxed.gpu.xor.b32, RT4-SHEET-7: rt4_sheet's red_generic.cu), which ptxas emits as ATOM.E.XOR.STRONG.GPU on sm_90a and sm_100a: the same counts with an ATOME32 for each REDG32, in its SASS for both archs, bit-exact on the H200 and the B200 (every global and generic red, red2 and red8 loop, 0 mismatches over 320 words each). Loop control and NOPs are left out. Each instruction is its census class (loads.class_of): ATOMS32, LDS128, STS128, STS32, STG128, STG32, REDUX, REDG32 cost one issue slot on the issue rows and nothing on the pipe rows, and ATOME32, which no run has timed, one slot on the issue row alone (RT4-SHEET-12), the sound price (each issues once; RT3-DC measured the same-address atomics slower, 32 SM-cycles a warp ATOMS and 54-81 a REDG, which no class-linear price separates from a conflict-free one); the B200 has no atomic row. sm_100a runs every form, and the B200 ran each bit for bit. The check reads the checkpoint word, not the program that wrote it, so the cheater and the floor program ♭ fold by the cheapest mix of these and REDUX on Π, and honest by its kernel's REDUX"
cp-seg4 = { ALU = 0.53125, IMAD = 0.5078125, REDUX = 0.0078125, STG128 = 0.001953125 }                   # 4 LOP3, REDUX, the IMAD.U32 taking its result, a quarter STG.128
cp-seg4u = { ALU = 0.5234375, IMAD = 0.5, REDUX = 0.015625, UNI = 0.0078125, STG128 = 0.001953125 }      # 3 LOP3, 2 REDUX, ULOP3, a quarter STG.128
cp-ats = { ALU = 0.53125, IMAD = 0.5, ATOMS32 = 0.0078125, LDS128 = 0.001953125, STS128 = 0.001953125, STG128 = 0.001953125 }   # 4 LOP3, ATOMS, a quarter each LDS.128, STS.128, STG.128
cp-ats2 = { ALU = 0.5234375, IMAD = 0.5, ATOMS32 = 0.015625, LDS128 = 0.001953125, STS128 = 0.001953125, STG128 = 0.001953125 }  # 3 LOP3, 2 ATOMS, the same quarters
cp-ats8 = { ALU = 0.5, IMAD = 0.5, ATOMS32 = 0.0625, LDS128 = 0.001953125, STS128 = 0.001953125, STG128 = 0.001953125 }          # 8 ATOMS, the same quarters
cp-red = { ALU = 0.53125, IMAD = 0.5, REDG32 = 0.0078125 }        # 4 LOP3, REDG
cp-red2 = { ALU = 0.5234375, IMAD = 0.5, REDG32 = 0.015625 }      # 3 LOP3, 2 REDG
cp-red8 = { ALU = 0.5, IMAD = 0.5, REDG32 = 0.0625 }              # 8 REDG
cp-red-generic = { ALU = 0.53125, IMAD = 0.5, ATOME32 = 0.0078125 }     # 4 LOP3, ATOM.E
cp-red2-generic = { ALU = 0.5234375, IMAD = 0.5, ATOME32 = 0.015625 }   # 3 LOP3, 2 ATOM.E
cp-red8-generic = { ALU = 0.5, IMAD = 0.5, ATOME32 = 0.0625 }           # 8 ATOM.E
cp-xt = { ALU = 0.53515625, IMAD = 0.5, STS32 = 0.0078125, LDS128 = 0.001953125, STG32 = 0.000244140625 }   # 4.5 LOP3, STS, a quarter LDS.128, a 32nd of an STG

[skip.served]
eps = 0.008145
at = { "DC-100-ri" = 0.008145, "DS-100" = 0.006981 }
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip at this design's own ♭, the plain LI-CP-W fold with its checkpoint at the fold routes' cheapest mix (DC-100: 4.160 SMSP-cycles a 4096-MAC MMA, 0.788 cp-red2 and 0.212 cp-red; DS-100: 4.169, 0.903 cp-red2 and 0.097 cp-red8; 0.8025% and 0.6849% at REDUX) and no LDTM, so the skippable work is a larger share of a smaller ♭ than the heavy design's. The most is at Llama-3.1-8B 2K prefill, all P·V's peel. On DC-100-ri (`at`) ♭ is DC-100's; on DS-100 the tail is at DS-100's price (RT-HB-HEAD)"

[mand.fold]
eps = 0.0
source = "named assumption: LI-CP-W, its checkpoint by REDUX or any of the [fold_routes], at their lane instructions a word, is the cheapest implementation of the fold (FOLD-OPT). The menu is every bit-exact checkpoint loop the tree carries (rt3_dc's among them, the shared-memory and L2 atomics included; RT3-DC-1, -4), their memory and control classes at one issue slot and no pipe row (the B200's census has no atomic row). FOLD-OPT has no slack as a premise: a fold cheaper than the menu's cheapest at the certificate falsifies it. The readings' slack is small: in the Lean bound, with ♭ held at its fold (cp-red2 and cp-red8 on DS-100), a cheater whose every fold route is 0.219% cheaper takes DS-100 to 1%, and 0.102% does DC-100-ri (RT3-DC-7; RT2-HOPPER-10: the 52% once quoted scaled ♭'s fold with the cheater's). On DS-100 it also covers li's XOR x ⊕ y ⊕ k, two words and a key in one LOP3: no IMAD- or FP-pipe program of 1 or 2 instructions computes it within the modelled menu IMAD, IMAD.HI, IDP.4A, IDP.2A and FFMA2 (IMAD.WIDE, HFMA2 and the ALU class outside it; FOLD-XOR k = 1; k = 2, all 1,456 two-instruction sequences unsat), a checked fact within that menu, not a proof over the chip; the cheapest known is 78 IMAD-pipe instructions (33 IMAD, 45 IMAD.HI). At the Lean bound's certificate (DS_issue ⅔ + DS_alu ⅓) a LOP3 costs 4/3 and an IMAD or FFMA ⅔, so FOLD-OPT there asks only that no 1-instruction program exists; with the certificate at DS_issue alone, li's XOR at its instruction count, which needs no pipe premise, the Lean bound is 0.9998%. FOLD-MIN's IMAD-pipe round (1 + 2|B|) is a keyed round's XOR with a constant, and plain li has no such round, every half step absorbing a word. There is no filler, so FILL-OPT is not read. With every absorbed word pinned (PIN), the receipt's luck is 0 for a skip that lands on one word of a segment: a checkpoint is injective in each word it absorbed (Lean Pouw.SecurityProofs.Receipt.LiCheckpointWordInjective, odd multipliers only); KLI₂₄, (RT), (G₃) and (HO_U) are not read"
