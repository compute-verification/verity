# dither-2s-licpw-redux-heavy-ldtm0-l32 with the fold the checks read: plain LI-CP-W redux, as honest runs it
# (dc100-licpw-redux-l32, ALU 544, IMAD 512, SHFL 24 an MMA) and PouwWarpCheck recomputes it (PouwLiAbsorb_v2: two half
# steps a chain a set, no extra keyed round). ♭ credits no tcgen05.ld and none of the heavy design's extra rounds, which
# no Definition reads (RT-LOGIC-12, RT-HB-HEAD-1).
base = "dither-2s-licpw-redux-heavy-ldtm0-l32"
name = "dither-2s-licpw-redux-ldtm0-l32"
title = "Dither-2S, LI-CP-W redux, ♭ crediting no tcgen05.ld, L = 32"
summary = "Dither-2S on the B200 at L = 32 with the fold the checks read (plain LI-CP-W redux) and ♭ crediting no tcgen05.ld: honest runs its 8 LDTM a MMA, the credit counts neither them nor any extra keyed round"

[fold]
name = "li"          # LI-CP-W redux: 0.53125 ALU, 0.5 IMAD, one redux.sync.xor and the store on SHFL
ALU = 0.53125
IMAD = 0.5
SHFL = 0.0234375

[skip.served]
eps = 0.008025
at = { "DC-100-ri" = 0.008025, "DS-100" = 0.006849 }
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip at this design's own ♭ (decision 90), plain LI-CP-W redux and no LDTM, so the skippable work is a larger share of a smaller ♭ than dither-2s-licpw-redux-heavy-ldtm0-l32's (0.4707% / 0.4064%). The most is at Llama-3.1-8B 2K prefill, all P·V's peel. On DC-100-ri (`at`) ♭ is DC-100's; on DS-100 the tail is at DS-100's price"

[mand.fold]
eps = 0.0
source = "named assumption: LI-CP-W redux, at its lane instructions a word, is the cheapest implementation of the fold (FOLD-OPT); there is no filler, so FILL-OPT is not read. With every absorbed word pinned (PIN), the receipt's luck is 0 for a skip that lands on one word of a segment: a checkpoint is injective in each word it absorbed (Lean Pouw.SecurityProofs.Receipt.LiCheckpointWordInjective, odd multipliers only); KLI₂₄, (RT), (G₃) and (HO_U) are not read (note:LI-ALT)"
