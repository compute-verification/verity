# dither-2s-licpw-redux-heavy-l32 credited at what the checks read. Its fold is plain LI-CP-W redux, as honest runs it
# (dc100-licpw-redux-l32: ALU 544, IMAD 512, SHFL 24 a MMA) and PouwWarpCheck recomputes it (PouwLiAbsorb_v2: two half
# steps a chain a set, no extra keyed round), so ♭ credits none of the heavy design's extra keyed rounds, which no
# Definition reads (RT-LOGIC-12, RT-HB-HEAD-1). ♭ credits no tcgen05.ld either: honest still runs its 8
# LDTM.32x32b.x128 a MMA, but the operands-free cheater (decision 89) never pays them. Each lowers the credit, which is
# sound for any program. ♭ is 4.204 SMSP-cycles a 4096-MAC MMA on DC-100-ri, its checkpoint at the fold routes' cheapest
# mix (4.223 at REDUX; the heavy design's ♭ 7.254), so the skippable work is a larger share of it: core 0.807% on
# DC-100-ri, 0.689% on DS-100.
base = "dither-2s-licpw-redux-heavy-l32"
name = "dither-2s-licpw-redux-ldtm0-l32"
title = "Dither-2S, LI-CP-W redux, ♭ crediting no tcgen05.ld, L = 32"
summary = "Dither-2S on the B200 at L = 32, credited at what the checks read: the plain LI-CP-W redux fold and no tcgen05.ld in ♭ (honest runs its 8 LDTM a MMA; no extra keyed round)"

[operands]
floor = { LDTM_32X32B_X128 = 0.0 }
source = "the floor program's operand-delivery floor φ_del is credited at 0: tcgen05.mma reads both operands from shared memory by descriptor, so delivery costs no warp instruction, and the accumulator's 8 tcgen05.ld.32x32b.x128 a MMA that honest runs to fold its words on lanes are not credited, since the operands-free cheater skips them. Honest still runs them: its time over the credit counts them"

[fold]
name = "li"          # LI-CP-W redux: 0.53125 ALU, 0.5 IMAD, one redux.sync.xor and the store on SHFL
ALU = 0.53125
IMAD = 0.5
SHFL = 0.0234375

[fold_routes]       # the H200's checkpoint routes: four segments' checkpoint words in one STG.128 (cp-seg4), one XOR on the uniform datapath (cp-seg4u)
source = "the H200's RT2-HOPPER-9 and -11 routes (dither-2s-licpw-redux-l32's [fold_routes], note:20261019T1140Z-draft-rt2-hopper): LI-CP-W with four segments' checkpoint words in one STG.128 (CP_SEG4), and with the XOR of two REDUXes on the uniform datapath (CP_SEG4U), in the design's classes. sm_100a has STG.128, REDUX and ULOP3, and both are the function the H200 runs bit for bit; on the B200 neither is run or timed. ♭ and the cheater fold by the cheapest mix of these and REDUX on Π, honest by its kernel's REDUX. The checkpoint's XOR in memory (REDG) is not on the menu: the B200's atomic unit is untimed, so FOLD-OPT's exclusion of it rests on the H200's (AT90) alone"
cp-seg4 = { ALU = 0.53125, IMAD = 0.5, SHFL = 0.017578125 }                       # 4 LOP3, REDUX, a quarter STG.128
cp-seg4u = { ALU = 0.5234375, IMAD = 0.5, SHFL = 0.033203125, UNI = 0.0078125 }   # 3 LOP3, 2 REDUX, ULOP3, a quarter STG.128

[skip.served]
eps = 0.008061
at = { "DC-100-ri" = 0.008061, "DS-100" = 0.006890 }
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip at this design's own ♭ (decision 90), the plain LI-CP-W fold with its checkpoint at the fold routes' cheapest mix (DC-100: 4.204 SMSP-cycles a 4096-MAC MMA, 0.924 cp-seg4 and 0.076 cp-seg4u; DS-100: 4.225, 19 cp-seg4 to 13 cp-seg4u; 0.8025% and 0.6849% at REDUX) and no LDTM, so the skippable work is a larger share of a smaller ♭ than the heavy design's. The most is at Llama-3.1-8B 2K prefill, all P·V's peel. On DC-100-ri (`at`) ♭ is DC-100's; on DS-100 the tail is at DS-100's price (RT-HB-HEAD, r20261019-083808-1f18)"

[mand.fold]
eps = 0.0
source = "named assumption: LI-CP-W, its checkpoint by REDUX or any of the [fold_routes], at their lane instructions a word, is the cheapest implementation of the fold (FOLD-OPT). It excludes the checkpoint's XOR in memory (REDG), on the H200's atomic rate alone, the B200's being untimed ([fold_routes]). Its slack is small: with ♭ held at its fold (19 cp-seg4 to 13 cp-seg4u on DS-100), a cheater whose every fold route is 0.31% cheaper takes DS-100 to 1%, and 0.19% does DC-100-ri (RT2-HOPPER-10: the 52% once quoted scaled ♭'s fold with the cheater's). On DS-100 it also covers li's XOR x ⊕ y ⊕ k, two words and a key in one LOP3: a 78-instruction IMAD-pipe program exists (33 IMAD, 45 IMAD.HI; bit-exact on the CPU and the B200; FOLD-XOR, #2769), and with it on the menu DS-100 stays 0.6891%. With the checkpoint routes on the menu the cheater's break-even is 3 IMAD- or FP-pipe instructions for it, so that value rests on no such program of 2 or fewer: of 2 DS-100 reads 0.890%, and of 1, li's XOR at its instruction count alone, which needs no pipe premise, 1.290%. This supersedes #2706's 'under 93 instructions', the 62.5 (the cheater's break-even with the checkpoint at REDUX alone: 0.7163% at 40, 1.0068% at 3, 1.328% at the count alone) and round 4's 2 with the REDG checkpoints. FOLD-MIN's IMAD-pipe round (1 + 2|B|) is a keyed round's XOR with a constant, and plain li has no such round, every half step absorbing a word (#2751). There is no filler, so FILL-OPT is not read. With every absorbed word pinned (PIN), the receipt's luck is 0 for a skip that lands on one word of a segment: a checkpoint is injective in each word it absorbed (Lean Pouw.SecurityProofs.Receipt.LiCheckpointWordInjective, odd multipliers only); KLI₂₄, (RT), (G₃) and (HO_U) are not read (note:LI-ALT)"
