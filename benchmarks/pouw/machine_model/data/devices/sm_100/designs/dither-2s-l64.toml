# Dither-2S at L = 64 on the B200 (sm_100): two-sided dither serving the last checked word, duo receipts, P·V's peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest, its operand floor and the baseline are
# the B200's. Every Dither noise has the same floor here: no operand passes through a register.
name = "dither-2s-l64"
title = "Dither-2S, L = 64"
summary = "Dither-2S on the B200 at L = 64: two-sided dither serving the last checked word, duo receipts, P·V's peel"
honest = "dc100-l64"
L = 64
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDTM_32X32B_X32 = 16 }
source = "tcgen05.mma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the accumulator's 32768 words leave TMEM by 16 tcgen05.ld.32x32b.x32 a MMA at L = 64 (1024 words each), which every tensor-route word pays to be folded on lanes"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.00656
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 7.844 SMSP-cycles a 4096-MAC MMA on DC-100; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.656%: its tail 0.453%, the sums DG, S and X(0) 0.170%, the served epilogue 0.0322%. With P·V's served output checked it is 0.511% (8B) / 0.222% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of BC-KERNEL r2's tail instructions (4 mma.sync m16n8k32, 4 IMAD, 11.5 other), its sums by vfold (decision 91) and served epilogue at one an issue cycle, on sm_120's instruction counts for the same kernel source, on this device's Π"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.0
source = "f_H unmeasured on the B200 (EPS1 DC measured f_max = 1965 MHz at default clocks): 0 here, so γ with the clock gap is γ, a lower bound"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 16 }
source = "dp4a at 16 IDP4A a word at L = 64, on IMAD's class as sm_120 prices it (no IDP4A kind in EPS1 DC's census); no LDS kind either, so its loads are unpriced"

[routes]
lanes = true
