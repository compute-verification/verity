# Honest at L = 32 on the B200 (sm_100) with the LI fold, as DC-DESIGN measured it: `tcliU_x128`, one thread issuing
# UTCIMMA.128x256x32.S8.S8 into TMEM while 8 lane warps bring the accumulator to registers by tcgen05.ld.32x32b.x128
# (LDTM_32X32B_X128, 4096 words a warp instruction) and fold each word with LI (LOP3 on one word, IMAD on the next).
# The lanes fold 107.7 words/SM/clk beside the saturated MMA, against the 256 it commits; every load shape and schedule
# tried folds about as many, so it is the load-and-wait latency, not issue or the TMEM read port.
name = "dc100-li-l32"
status = "measured"
source = "DC-DESIGN's tcliU_x128 (dc/probes/sm100_tcgen05.cu on cursor/dc-design-ea24, SASS gated at LDTM.x128 = 1, LOP3.LUT = 64, IMAD = 64 a trip, exact by OP_UNTIL; note:20261017T0805Z-draft-dc-design §2)"
L = 32

[mma]
kind = "UTCIMMA.128x256x32.S8.S8"
# tcgen05.mma m128n256k32 s8 into TMEM, issued by one thread: 32768 words, 512 SMSP-cycles on the tensor pipe, 256
# words/SM/clk
class = "UTCIMMA_M128_N256"
words = 32768
depth = 32

[per_mma]       # warp instructions a MMA: the MMA, the TMEM loads and the fold
UTCIMMA_M128_N256 = 1
LDTM_32X32B_X128 = 8
ALU = 512
IMAD = 512

[measured]
cycles_per_mma = 1216.6         # 32768 words x 4 SMSPs / 107.74 words/SM/clk
source = "DC-DESIGN, tcliU_x128 (r20261017-085236-51a6, r20261017-104307-644b: LDTM.x128 at 0.02630 a SM-clock, tensor at 1.000)"

[operands]      # the least operand delivery any program pays a MMA when the design names none
floor = { LDTM_32X32B_X128 = 8 }
source = "tcgen05.mma reads both operands from shared memory by descriptor (TMA fills it), so delivery costs no warp instruction a MMA; the accumulator's 32768 words leave TMEM by 8 tcgen05.ld.32x32b.x128 a MMA at L = 32 (4096 words each), which every tensor-route word pays to be folded on lanes"

[fold]          # lane instructions a committed word; the x128 loads are the tensor route's, as [operands] says
name = "li"
ALU = 0.5
IMAD = 0.5
