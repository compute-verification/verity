UTCHMMA_BF16_M128_N256 = { type = "bf16", m = 128, n = 256, k = 16, warps = 1 }
UTCHMMA_F16_M128_N256 = { type = "f16", m = 128, n = 256, k = 16, warps = 1 }
UTCHMMA_TF32_M128_N256 = { type = "tf32", m = 128, n = 256, k = 8, warps = 1 }
UTCIMMA_M128_N128 = { type = "s8", m = 128, n = 128, k = 32, warps = 1 }
