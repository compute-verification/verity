# DS-100 as a data sheet (note:20261019T0511Z-draft-mm-sheets, G1): each constant the data-sheet machine
# (`Accounting.TS.Sheet.machine`) reads on the B200, its value, the document that states it and its grade, and each
# DS-100 class's tensor form or pipe. `machine-model sheet --device sm_100` derives every DS-100 line from it and checks
# them against census/DS-100.csv; `--lean` prints the Lean module `lean` names, which the tests hold to it.
# Scope: one GPU's own SMs. A peer GPU's work over NVLink or NVSwitch is outside the sheet, and Device.lean's side
# channels don't list it (RT-SCOPE-1, note:20261019T0455Z-draft-rt-scope).
name = "B200"
gpu = "HGX B200 (sm_100a, 180 GB, 1000 W)"
vector = "DS-100"
lean = "Security/Definitions/Accounting/Sheets/B200.lean"

[fmax]
mhz = 1965
grade = "measured only (the driver's maximum)"
source = "no NVIDIA document read states a B200 clock (Blackwell Architecture Technical Brief V2.1, the Lenovo HGX B200 Product Guide, nvidia.com's HGX page); the driver's maximum at default clocks on the deployed B200 is 1965 MHz (sm_100/table.toml, EPS1 DC), and the tensor and clock probes saw at most 1957.1 MHz; the brief's 'FP64 Tensor Core 37 teraFLOPS' at the Guide's 64 FP64 results an SM clock over 148 SMs puts the FP64 clock at 1927 to 1980 MHz"

[sms]
value = 148
grade = "measured only"
source = "no NVIDIA document read gives the B200's SM count (Technical Brief V2.1 Table 3 says only '16 Blackwell Die for 8 GPUs'); the device reports 148 (sm_100/table.toml)"

# A2: a SMSP issues at most one warp instruction a SMSP-cycle, so every class holds DS_issue for 1. A2u: a uniform
# datapath instruction (UNI) takes that slot as a lane instruction does. `slots` is 1 for both, as `Sheet.machine`'s issue
# row is.
[issue]
slots = 1
grade = "Programming Guide"
source = "CUDA C++ Programming Guide 12.9 §18.9.1 (CC 10.x), the sentence of §18.8.1: '4 warp schedulers ... at every instruction issue time, each scheduler issues one instruction for one of its assigned warps'"

[uniform_issue]
slots = 1
grade = "measured only (no vendor document states it)"
source = "no vendor document gives a uniform instruction's issue cost: Nsight Compute §2.3.6 defines the uniform pipe with no rate, and CUDA Binary Utilities §4.4 lists the uniform opcodes CC 10.0 to 12.0 share; measured at saturation beside 4 tcgen05.mma in flight: with the uniform chain in, issue stays at 0.998 to 0.9996 warp instructions a SMSP-cycle and each uniform instruction displaces 0.95 to 1.10 lane instructions, with no dual issue (dc/probes/sm100_a2u.cu), and 0.924 of a slot beside a saturated lane stream (the census's UNI issue line, DC-100)"

[clocks.implied]
label = "implied clock (no document states one)"
mhz = 1854
grade = "none (derived: no document states it)"
source = "the clock at which every per-clock peak below reproduces the Technical Brief's dense figure to within half its last digit, which holds from 1835 to 1855 MHz, and the Lenovo guide's FP16 2.25 too from 1852 MHz; 111 MHz under f_max, as the H200's tensor clock is 150 MHz under its f_max (open premise B200-PEAK-PER-CLOCK: the per-clock peaks are measured, the clock they are quoted at is nowhere)"

[clocks.fp64]
label = "FP64 clock (no document states one)"
mhz = 1965
grade = "none (derived: no document states it)"
source = "f_max, the driver's maximum: the brief's 'FP64 Tensor Core 37 teraFLOPS' at the measured 64 MACs an SM clock over 148 SMs holds from 1927 to 1980 MHz, which the implied clock (1854 MHz, 35.1 teraFLOPS) misses; the H200's FP64 tensor clock is its f_max too (H100 whitepaper V1.04 Table 3)"

# Each operand type's dense MACs an SM clock (A3). `sheet` is the Technical Brief's dense figure in TOPS or TFLOPS,
# `sparse` false (the brief states dense and sparse apart), `tol` half its last printed digit, and `clock` the clock at
# which the per-clock peak reproduces it: 2 · macs · SMs · clock is the figure to within tol.
[peaks.s8]
macs = 8192
sheet = 4500
sparse = false
tol = 50
clock = "implied"
grade = "data sheet per second; per clock measured only"
source = "NVIDIA Blackwell Architecture Technical Brief V2.1, Table 3 'System Specifications for HGX B300 and HGX B200', Per GPU Specs, HGX B200: 'INT8 Tensor Core 4.5 | 9 petaOPS' (Dense | Sparse); Lenovo ThinkSystem NVIDIA HGX B200 180GB 1000W GPU Product Guide Table 2: '4.5 / 9 petaOPS'; measured UTCIMMA_M128_N256 512 SMSP-cycles (DC-100)"

[peaks.e4m3]
macs = 8192
sheet = 4500
sparse = false
tol = 50
clock = "implied"
grade = "data sheet per second; per clock measured only"
source = "Technical Brief V2.1 Table 3, HGX B200: 'FP8/FP6 Tensor Core 4.5 | 9 petaFLOPS'; measured UTCQMMA_E4M3 lines (DC-100)"

[peaks.e5m2]
macs = 8192
sheet = 4500
sparse = false
tol = 50
clock = "implied"
grade = "data sheet per second; per clock derived at the implied clock"
source = "Technical Brief V2.1 Table 3, HGX B200: 'FP8/FP6 Tensor Core 4.5 | 9 petaFLOPS', for both FP8 formats (PTX ISA 9.4 tcgen05.mma .kind::f8f6f4: e4m3, e5m2)"

[peaks.fp6]
macs = 8192
sheet = 4500
sparse = false
tol = 50
clock = "implied"
grade = "data sheet per second; per clock derived at the implied clock; its classes unmeasured"
source = "Technical Brief V2.1 Table 3, HGX B200: 'FP8/FP6 Tensor Core 4.5 | 9 petaFLOPS' (PTX ISA 9.4 .kind::f8f6f4: e2m3, e3m2); the CUDA C++ Programming Guide 12.9 §18.9.1 lists no FP6"

[peaks.f16]
macs = 4096
sheet = 2200
sparse = false
tol = 50
clock = "implied"
grade = "data sheet per second; per clock derived at the implied clock"
source = "Technical Brief V2.1 Table 3, HGX B200: 'FP16/BF16 Tensor Core 2.2 | 4.5 petaFLOPS'; Lenovo Product Guide Table 2: '2.25 / 4.5'; measured UTCHMMA_F16_M128_N256 (DC-100)"

[peaks.bf16]
macs = 4096
sheet = 2200
sparse = false
tol = 50
clock = "implied"
grade = "data sheet per second; per clock derived at the implied clock"
source = "Technical Brief V2.1 Table 3, HGX B200: 'FP16/BF16 Tensor Core 2.2 | 4.5 petaFLOPS'"

[peaks.tf32]
macs = 2048
sheet = 1100
sparse = false
tol = 50
clock = "implied"
grade = "data sheet per second; per clock derived at the implied clock"
source = "Technical Brief V2.1 Table 3, HGX B200: 'TF32 Tensor Core 1.1 | 2.2 petaFLOPS'; Lenovo Product Guide Table 2: '1.1 / 2.2'"

[peaks.fp4]
macs = 16384
sheet = 9000
sparse = false
tol = 500
clock = "implied"
grade = "data sheet per second; per clock measured"
source = "Technical Brief V2.1 Table 3, HGX B200: 'FP4 Tensor Core 9 | 18 petaFLOPS'; PTX ISA 9.4 tcgen05.mma .kind::mxf4 and .kind::mxf4nvf4 take twice .kind::f8f6f4's K; the Programming Guide 12.9 §18.9.1 lists no FP4, and DC-100's census measures no FP4 class; a probe timed kind::mxf4 (UTCOMMA) and kind::mxf4nvf4 (UTCOMMA.4X) alone at 16390 MACs an SM clock, 2.000 times kind::i8's 8195 at the same instruction rate (unpriced_fp4.cu)"

# FP4 (E2M1) operands in kind::f8f6f4, unscaled: the brief's FP4 figure is the block-scaled kinds', and the vendor's
# per-kind table puts kind::f8f6f4 at the FP8 rate whatever its operand types.
[peaks.fp4_f8f6f4]
macs = 8192
sheet = 4500
sparse = false
tol = 50
clock = "implied"
grade = "vendor documentation per kind (CUTLASS), at the data sheet's FP8 figure; per clock measured"
source = "NVIDIA CUTLASS, 'Blackwell SM100 GEMMs' (media/docs/cpp/blackwell_functionality.md at 1b5b7d3062): 'tcgen05.mma(.sp).cta_group::[1|2].kind::f8f6f4 | 2x Hopper Fp8 Tensor Core | Mixed precision MMA with A={f4,f6,f8} x B={f4,f6,f8}', against 'kind::mxf4.block_scale | 4x Hopper Fp8 Tensor Core'; so the kind's rate is the FP8 one, Technical Brief V2.1 Table 3, HGX B200: 'FP8/FP6 Tensor Core 4.5 | 9 petaFLOPS'; measured alone, kind::f8f6f4 with E2M1 operands at 8195 MACs an SM clock, E4M3's rate (unpriced_fp4.cu). On sm_120, all five kind::f8f6f4 types run at one QMMA rate"

# DMMA (`mma.sync .f64`): an int8 × int8 product is exact in f64, so it heads exact int8 words, and it has its row
# here, not 0 (RT-ISA-1). `element_words`: an f64 accumulator element takes two registers (A6-WIDE).
[peaks.f64]
macs = 64
sheet = 37
sparse = false
tol = 0.5
clock = "fp64"
element_words = 2
grade = "data sheet per second; per clock measured"
source = "Technical Brief V2.1 Table 3, HGX B200: 'FP64 Tensor Core 37 teraFLOPS'; the Programming Guide 12.9 §6.4.1 Table 7, CC 10.0: 64 64-bit floating-point results a clock a multiprocessor; measured alone, DMMA.8x8x4 at 64 MACs an SM clock, and beside a saturated tcgen05 kind::i8 form t + s = 0.939 to 0.952, so f64 shares the tensor pipe's time with the other types (unpriced.cu)"

# A6's ω for each tensor class (`omega` in sheet.py), read off the PTX accumulator fragments.
[omega]
grade = "PTX ISA"
source = "PTX ISA 9.4, the accumulator (D) fragments: mma.sync m16n8k32 .s32 four registers a lane (128 a warp instruction), m16n8k16 the same, .f64 m8n8k4 two f64 a lane (four registers, 128) and m16n8k4, k8 and k16 four (eight, 256); tcgen05.mma's accumulator is M × N 32-bit cells of tensor memory (32,768 at M128 N256), which its one issuing thread's instruction writes"

# Each Nsight Compute pipe's results an SM clock (A4).
[pipes.alu]
width = 64
grade = "Programming Guide and Nsight Compute"
source = "CUDA C++ Programming Guide 12.9 §6.4.1 Table 7, CC 10.0: 32-bit integer add 64, compare/minimum/maximum 64, bitwise AND/OR/XOR 64, shift 64 (results a clock a multiprocessor); Nsight Compute Kernel Profiling Guide §2.3.6: alu executes 'most bit manipulation and logic instructions ... integer instructions, excluding IMAD and IMUL'"

[pipes.imad]
width = 64
grade = "Programming Guide"
source = "CUDA C++ Programming Guide 12.9 §6.4.1 Table 7, CC 10.0: '32-bit integer multiply, multiply-add, extended-precision multiply-add' 64; Nsight Compute §2.3.6: IMUL and IMAD on FMA Heavy"

[pipes.shfl]
width = 32
grade = "Programming Guide"
source = "CUDA C++ Programming Guide 12.9 §6.4.1 Table 7, CC 10.0: 'warp shuffle' 32; Nsight Compute §2.3.6: lsu issues shuffles"

# The uniform datapath has no rate in any document (RT-MACHINE-4), so its width is the census's measured UP line:
# 128 over 1.9572915 SMSP-cycles a uniform instruction.
[pipes.uniform]
width = "256000000/3914583"
grade = "measured only (no vendor document states the uniform datapath's rate)"
source = "Nsight Compute §2.3.6 defines the uniform pipe ('a scalar unit') with no rate; the census's UP line (rows.csv): DC's uniform.cuh, the fastest form alone (uz_128x) at 0.5009 uniform instructions a SMSP-cycle, at a 2% margin 1.9572915 SMSP-cycles each (five runs); the width counts a uniform instruction as a warp instruction's 32 results, as the pipe row reads a width"

# Each DS-100 class: a tensor form (operand type, m, n, k, and the warps that issue one MMA: one thread issues a
# tcgen05.mma, so its whole m·n·k is one warp instruction's, PTX ISA 9.4 §9.7.18.10, which the device-average counts
# A3 reads spread over the SM's four SMSPs; Nsight Compute §2.3.6: 'one issuing thread can drive work across the four
# warp schedulers'), a pipe, or neither (issue only: FFMA at 128 results a clock is the issue ceiling, tcgen05.ld
# (LDTM) moves TMEM to registers on no row of the sheet). Every tensor type with a peak has an M128 N256 class
# (RT-B200-EMP-2, note:20261019T0520Z-draft-rt-b200-emp; the census measures none of them): kind::f16 BF16, kind::tf32,
# kind::f8f6f4 with E5M2, E2M3, E3M2 and E2M1 operands, kind::mxf8f6f4 E4M3, kind::mxf4 and kind::mxf4nvf4 at twice
# f8f6f4's K (PTX ISA 9.4 §9.7.18.10.10.1), and kind::i8 2:4 sparse (`sparse`: k its logical k, its dense MACs half
# m · n · k). Each is at its dense i8 twin's 512: FP4 in kind::f8f6f4 at the kind's own peak (`fp4_f8f6f4`), not the
# block-scaled kinds' FP4 figure, which would put it at 256. RT-ISA timed kind::mxf4, kind::mxf4nvf4 and kind::f8f6f4
# E2M1 alone at those lines (r20261019-090041-1ef5). Each `mma.sync .f64` shape is a DMMA class at the f64 peak
# (RT-ISA-1): DMMA.8x8x4 runs at it, and the m16n8 shapes are untimed.
# The census's memory, atomic and control classes (ATOMS32, ATOME32, LDS128, STS32, STS128, STG32, STG128, REDUX,
# REDG32, VIADD, NOROW and the catch-all UNLISTED) are issue only: no document gives them a line on a row of the
# sheet, so A2 prices each at its issue slot alone, as the measured catch-all is (DC-CENSUS-1,
# note:20261019T2245Z-draft-dc-census).
[kinds]
ALU = { pipe = "alu" }
ATOME32 = {}
ATOMS32 = {}
DMMA1684 = { type = "f64", m = 16, n = 8, k = 4, warps = 1 }
DMMA1688 = { type = "f64", m = 16, n = 8, k = 8, warps = 1 }
DMMA16816 = { type = "f64", m = 16, n = 8, k = 16, warps = 1 }
DMMA884 = { type = "f64", m = 8, n = 8, k = 4, warps = 1 }
FFMA = {}
IMAD = { pipe = "imad" }
IMMA16816_S8 = { type = "s8", m = 16, n = 8, k = 16, warps = 1 }
IMMA16832_S8 = { type = "s8", m = 16, n = 8, k = 32, warps = 1 }
LDS128 = {}
LDTM_16X128B_X8 = {}
