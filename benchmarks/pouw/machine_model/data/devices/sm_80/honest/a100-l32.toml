# Honest at L = 32 on the A100 as measured: egemm80's e32, e_l7qs's mainloop ported to sm_80 (16 warps, a
# 128x128 tile, k-stages of 128 by cp.async.cg into a 4-stage 128B-swizzled ring, one barrier a stage, LDSM.16.M88.4
# operands), duo receipts at LAG 7 with a LOP3 tie every 4th MMA, and the linears' peel as an IMMA.16832 tail a tile,
# 8192 x 8192 x 4096. Counts are the SASS's a mainloop MMA (egemm80.py: the k-stage loop at its KT - 1 trips a tile, every
# other instruction once a tile, so an over-count); the peel's MMAs are IMMA16832's 0.0156 above 1.
name = "a100-l32"
status = "measured"
source = "AMPERE r2's egemm80 e32 (benchmarks/pouw/edited_gemm/egemm80.cu, `egemm80.py summary`), bit-exact against derive.py's receipts by egemm80_ref.py"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 8.16 SMSP-cycles on the tensor pipe alone
class = "IMMA16832"
words = 128                     # 16 x 8 s32 accumulators
depth = 32

[per_mma]       # warp instructions a mainloop MMA by census class, everything the kernel issues (the fold included)
IMMA16832 = 1.0156
ALU = 9.7539
IMAD = 5.7715
NOROW = 1.0068
LDSM_X4 = 0.5078

[measured]
cycles_per_mma = 27.6427        # the 40 s hold's steady half at 1335 MHz NVML; 79fe's 27.6123
source = "egemm80 e32's hold, 8192 x 8192 x 4096; the interleaved bench's median 27.40 at 1350 MHz, plain p32 14.26; the 3-stage ring held 28.22"

[operands]      # the least operand delivery any program pays a MMA when the design names none
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10); sm_80 has the same fragments and 255 registers a thread"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a MMA at L = 32)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
