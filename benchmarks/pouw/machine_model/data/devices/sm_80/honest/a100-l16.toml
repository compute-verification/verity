# Honest at L = 16 on the A100 as AMPERE measured it: egemm80's e16 built with a 3-stage ring (EG80_NST=3, 0.5% faster
# here than the default 4: 23.76 in r20261017-101927-0c99), e_l7qs's mainloop on sm_80 (as a100-l32) with
# each k32 atom run as two IMMA.16816 passes, every k16 step's words absorbed, duo receipts at LAG 7 with a LOP3 tie every
# 4th MMA, and the linears' peel as an IMMA.16832 tail a tile, 8192 x 8192 x 4096. Counts are the SASS's a mainloop MMA
# (egemm80.py: the k-stage loop at its KT - 1 trips a tile, every other instruction once a tile, so an over-count); the
# peel's MMAs are the IMMA16832 line.
name = "a100-l16"
status = "measured"
source = "AMPERE r2's egemm80 e16 at EG80_NST=3 (benchmarks/pouw/edited_gemm/egemm80.cu, `egemm80.py summary`), bit-exact against derive.py's receipts by egemm80_ref.py (r20261017-093947-c786, r20261017-095346-e85c; note:20261017T0925Z-draft-eps1-ampere-r2)"
L = 16

[mma]
kind = "IMMA.16816.S32.S8.S8"   # mma.sync m16n8k16 s8: 4.16 SMSP-cycles on the tensor pipe alone
class = "IMMA16816"
words = 128                     # 16 x 8 s32 accumulators
depth = 16

[per_mma]       # warp instructions a mainloop MMA by census class, everything the kernel issues (the fold included)
IMMA16816 = 1
ALU = 8.8877
IMAD = 4.8188
NOROW = 0.7451
LDSM_X4 = 0.2539
IMMA16832 = 0.0078

[measured]
cycles_per_mma = 23.6241        # the 40 s hold's steady half at 1380 MHz NVML (SW power cap); c786's 23.6073
source = "egemm80 e16's hold, 8192 x 8192 x 4096 (r20261017-095346-e85c; first r20261017-093947-c786); the interleaved bench's median 23.89 at 1365 MHz"

[operands]      # the least operand delivery any program pays a MMA when the design names none
floor = { LDSM_X4 = 0.097222 }
source = "SPEC §3.4's register count for m16n8k16 (CALC): A in 2 registers a lane, B in 1, accumulators 4, no instruction writes more than 4; a register tile with 4ab + 2a + b <= 240 delivers >= (2a + b)/(4ab), least 7/72 at (a, b) = (6, 9) (the same count gives SPEC's 0.20 and 1/39 for m16n8k32)"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a MMA at L = 16)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
