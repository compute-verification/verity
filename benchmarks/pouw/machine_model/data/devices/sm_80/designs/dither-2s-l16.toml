# Dither-2S at L = 16 on the A100 (sm_80): two-sided dither serving the last checked word, duo receipts, P·V's peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest (IMMA.16816), its operand floor, the clock
# and the baseline are the A100's.
name = "dither-2s-l16"
title = "Dither-2S, L = 16"
summary = "Dither-2S on the A100 at L = 16: two-sided dither serving the last checked word, duo receipts, P·V's peel"
honest = "a100-l16"
L = 16
work = 1.0

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.097222 }
source = "SPEC §3.4's count for m16n8k16 (CALC): two-sided noise is fresh on both operands, so >= (2a + b)/(4ab) with 4ab + 2a + b <= 240, least 7/72 at (a, b) = (6, 9)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.pv-strip]
eps = 0.000674848
source = "SKIP's design A over Llama-3.1-8B and 70B x 2K, 8K, 32K by honest time, CHECKED-STRIP Result 3: at a one-hot P row P·V's whole strip is free, 0.131% at L = 32 (note:20261017T0340Z-draft-skip Result 3, 06:19Z); at L = 16, (L + 1)/33 of it: scaled from L = 32 by SKIP's strip widths (`../eps_budget.py`: every strip is L, L + 1, 2L or 2(L + 1) wide), the weights sm_120's honest time"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.021277
source = "EPS1 AMPERE r2 (note:20261017T0925Z-draft-eps1-ampere-r2, r20261017-093947-c786 and r20261017-095346-e85c, 40 s holds a kernel): f_max = 1410 MHz (NVML's max SM clock, which every light probe ran at, clocks never set), egemm80 e16 (EG80_NST=3) at L = 16 1380 MHz at steady state under the node's 400 W limit (SW power cap, throttle 0x4) in both runs, 1 − 1380/1410"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IDP4A = 4, LDS128 = 0.25 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on the FMA pipe's row on sm_80, with FFMA and IMAD), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_80: the uniform datapath is unmeasured (EPS1 AMPERE)
