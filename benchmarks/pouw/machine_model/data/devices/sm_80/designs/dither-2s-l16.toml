# Dither-2S at L = 16 on the A100 (sm_80): two-sided dither serving the last checked word, duo receipts, P·V's peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest (IMMA.16816), its operand floor, the clock
# and the baseline are the A100's.
name = "dither-2s-l16"
title = "Dither-2S, L = 16"
summary = "Dither-2S on the A100 at L = 16: two-sided dither serving the last checked word, duo receipts, P·V's peel"
honest = "a100-l16"
L = 16
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.097222 }
source = "SPEC §3.4's count for m16n8k16 (CALC): two-sided noise is fresh on both operands, so >= (2a + b)/(4ab) with 4ab + 2a + b <= 240, least 7/72 at (a, b) = (6, 9)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.00147
at = { "DS-80" = 0.001463 }
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 31.856 SMSP-cycles a 4096-MAC MMA on AMPERE-80; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.147%: its tail 0.0964%, the sums DG, S and X(0) 0.0422%, the served epilogue 0.00798%. With P·V's served output checked it is 0.114% (8B) / 0.0485% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of BC-KERNEL r2's tail instructions (4 mma.sync m16n8k32, 4 IMAD, 11.5 other), its sums by vfold (decision 91) and served epilogue at one an issue cycle, on sm_120's instruction counts for the same kernel source, on this device's Π. On DS-80 (`at`), ♭ 32.0: 0.146% (Round 11)"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.021277
source = "EPS1 AMPERE r2 (40 s holds a kernel): f_max = 1410 MHz (NVML's max SM clock, which every light probe ran at, clocks never set), egemm80 e16 (EG80_NST=3) at L = 16 1380 MHz at steady state in both runs, 1 − 1380/1410"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IDP4A = 4, LDS128 = 0.25 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on the IMAD pipe's row I on sm_80, with FFMA and IMAD), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_80: the uniform datapath is unmeasured (EPS1 AMPERE)
