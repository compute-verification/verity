# Dither-C at L = 32 on the A100 (sm_80): CO-Dither (co32c, cohalf), P·V on committed digit limbs, duo receipts.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest (IMMA.16832), its operand floor, the clock
# and the baseline are the A100's.
name = "dither-c-l32"
title = "Dither-C, L = 32"
summary = "Dither-C on the A100 at L = 32: CO-Dither (co32c, cohalf), P·V on committed digit limbs, duo receipts"
honest = "a100-l32"
L = 32
work = 1.0

[noise]
linears = "co32c"
lm_head = "co32c"
qk = "cohalf"
pv = "pv"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.025641 }
source = "CO-Dither's U is resident (B̃ a data-independent map of a resident matrix), so Dither's one-operand floor, least 1/39 at (a, b) = (1, 39)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.00363
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭, ♭ 16.114 SMSP-cycles a 4096-MAC MMA on AMPERE-80; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 8K prefill: the linears' co32c recombination 0.0809%; lm_head's co32c recombination 4.77e-08%; QKᵀ's cohalf sums 0.0275%; P·V's pv digits, epilogue and scaling 0.255%. With P·V's served output checked it is 0.363% (8B) / 0.176% (70B) there. Skip terms: the checked leaves' vector work only the served output needs at the TS model's gap (TS_EPS of TS_CHEAT, pv_ts), on sm_120's instruction counts for the same kernel source, on this device's Π"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.053191
source = "f_max = 1410 MHz (NVML's max SM clock, which every light probe ran at, clocks never set; @a100-fmax), egemm80 e32 at L = 32 1335 MHz at steady state over 40 s holds (@a100-egemm80), 1 − 1335/1410"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε
name = "dp4a"
program = { IDP4A = 8, LDS128 = 0.5 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on the IMAD pipe's row I on sm_80, with FFMA and IMAD), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_80: the uniform datapath is unmeasured
