# Dither-1S at L = 32 on the A100 (sm_80): one-sided dither, duo receipts on every committed word, the linears' peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest (IMMA.16832), its operand floor, the clock
# and the baseline are the A100's.
name = "dither-1s-l32"
title = "Dither-1S, L = 32"
summary = "Dither-1S on the A100 at L = 32: one-sided dither, duo receipts on every committed word, the linears' peel"
honest = "a100-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "one-sided"
lm_head = "clean"
qk = "one-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.025641 }
source = "SPEC §3.4: at the zero instance B̃ = ΠUᵀ repeats every 32 rows, so only A's fragment is delivered: >= 1/b with 4ab + 4a + 2b <= 240, least 1/39 at (a, b) = (1, 39)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.123
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 16.114 SMSP-cycles a 4096-MAC MMA on AMPERE-80; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 32K decode: the linears' one-sided strip 0.480%; QKᵀ's one-sided strip 11.7%; P·V's peel 0.113%: its tail 0.0740%, the sums DG, S and X(0) 0.0330%, the served epilogue 0.00624%. With P·V's served output checked it is 12.3% (8B) / 9.08% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of BC-KERNEL r2's tail instructions (4 mma.sync m16n8k32, 4 IMAD, 11.5 other), its sums by vfold (decision 91) and served epilogue at one an issue cycle; a one-sided strip's 2L executed products at ♭'s price a MAC, on sm_120's instruction counts for the same kernel source, on this device's Π; the clean lm_head skips nothing, its words are ♭'s"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.053191
source = "EPS1 AMPERE r2 (40 s holds a kernel): f_max = 1410 MHz (NVML's max SM clock, which every light probe ran at, clocks never set), egemm80 e32 at L = 32 1335 MHz at steady state under the node's 400 W limit (SW power cap, throttle 0x4) in both runs, 1 − 1335/1410"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IDP4A = 8, LDS128 = 0.5 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on the IMAD pipe's row I on sm_80, with FFMA and IMAD), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_80: the uniform datapath is unmeasured (EPS1 AMPERE)
