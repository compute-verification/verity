# Dither-1S at L = 16 on the A100 (sm_80): one-sided dither, duo receipts on every committed word, the linears' peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest (IMMA.16816), its operand floor, the clock
# and the baseline are the A100's.
name = "dither-1s-l16"
title = "Dither-1S, L = 16"
summary = "Dither-1S on the A100 at L = 16: one-sided dither, duo receipts on every committed word, the linears' peel"
honest = "a100-l16"
L = 16
work = 1.0

[noise]
linears = "one-sided"
lm_head = "clean"
qk = "one-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.010638 }
source = "SPEC §3.4's count for m16n8k16 (CALC): at the zero instance B̃ = ΠUᵀ repeats every 32 rows, so only A's fragment (2 registers a lane) is delivered: >= 1/(2b) with 4ab + 2a + b <= 240, least 1/94 at (a, b) = (1, 47)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.peel]
eps = 0.00315
source = "the linears' peel L/k, MAC-weighted over Llama-3.1-8B's linears (k = 4096 and 14336): 0.63% at L = 32 (note:20261017T0310Z-report-eps1-program §3, note:20261017T0031Z-draft-eps-budget); at L = 16, L/k: scaled from L = 32 by SKIP's strip widths (`../eps_budget.py`: every strip is L, L + 1, 2L or 2(L + 1) wide), the weights sm_120's honest time"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.021277
source = "EPS1 AMPERE r2 (note:20261017T0925Z-draft-eps1-ampere-r2, r20261017-093947-c786 and r20261017-095346-e85c, 40 s holds a kernel): f_max = 1410 MHz (NVML's max SM clock, which every light probe ran at, clocks never set), egemm80 e16 at L = 16 1380 MHz at steady state under the node's 400 W limit (SW power cap, throttle 0x4) in both runs, 1 − 1380/1410"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IDP4A = 4, LDS128 = 0.25 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on the FMA pipe's row on sm_80, with FFMA and IMAD), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_80: the uniform datapath is unmeasured (EPS1 AMPERE)
