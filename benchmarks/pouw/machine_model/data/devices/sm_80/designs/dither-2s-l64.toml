# Dither-2S at L = 64 on the A100 (sm_80): two-sided dither serving the last checked word, duo receipts, P·V's peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest (IMMA.16832), its operand floor, the clock
# and the baseline are the A100's.
name = "dither-2s-l64"
title = "Dither-2S, L = 64"
summary = "Dither-2S on the A100 at L = 64: two-sided dither serving the last checked word, duo receipts, P·V's peel"
honest = "a100-l64"
L = 64
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: two-sided {0,1} noise is fresh on both operands at every 32-step at every instance, so the register floor stays 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.00519
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 10.458 SMSP-cycles a 4096-MAC MMA on AMPERE-80; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.519%: its tail 0.367%, the sums DG, S and X(0) 0.128%, the served epilogue 0.0242%. With P·V's served output checked it is 0.434% (8B) / 0.192% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of BC-KERNEL r2's tail instructions (4 mma.sync m16n8k32, 4 IMAD, 11.5 other), its sums by vfold (decision 91) and served epilogue at one an issue cycle, on sm_120's instruction counts for the same kernel source, on this device's Π"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.063830
source = "EPS1 AMPERE r2 (40 s holds a kernel): f_max = 1410 MHz (NVML's max SM clock, which every light probe ran at, clocks never set), egemm80 e64 at L = 64 1320 MHz at steady state in both runs, 1 − 1320/1410"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε
name = "dp4a"
program = { IDP4A = 16, LDS128 = 1 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on the IMAD pipe's row I on sm_80, with FFMA and IMAD), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_80: the uniform datapath is unmeasured
