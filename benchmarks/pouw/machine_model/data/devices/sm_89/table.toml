# The cheater's table route on the L40S (`eps --lookups`): SCALAR-ROUTE as restated, as on sm_120 (data/table.toml).
# The L40S's L2 bandwidth isn't measured, so the route is bound by its lane slots alone (no L2 facet; `--l2` sets one).
q = 1.22                  # lane instructions a table word
bytes = 3.5               # L2 bytes a table word (6.0 single-field: --lookup-bytes 6)
sms = 142
mhz = 2520                # f_max
source = "SPEC's SCALAR-ROUTE as restated (named assumption): a right fresh word costs >= 2.03 issue slots, or >= 1.22 slots and 3.5 B of table loads (6.0 B single-field); the L40S's L2 unmeasured, so unbounded"
