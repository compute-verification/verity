# Dither-2S at L = 32 on the L40S (sm_89): two-sided dither serving the last checked word, duo receipts, P·V's peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest, its operand floor, the clock and the
# baseline are the L40S's.
name = "dither-2s-l32"
summary = "Dither-2S on the L40S at L = 32: two-sided dither serving the last checked word, duo receipts, P·V's peel"
honest = "ada-l32"
L = 32
work = 1.0

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: two-sided {0,1} noise is fresh on both operands at every 32-step at every instance, so the register floor stays 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10) (note:20261017T0324Z-draft-eps1-spec)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.pv-strip]
eps = 0.00131
source = "SKIP's design A over Llama-3.1-8B and 70B x 2K, 8K, 32K by honest time, CHECKED-STRIP Result 3: at a one-hot P row P·V's whole strip is free, 0.131% at L = 32 (note:20261017T0340Z-draft-skip Result 3, 06:19Z)"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.371032
source = "EPS1 ADA (note:20261017T0605Z-draft-eps1-ada, r20261017-070403-a5ff, 50 s a kernel): f_max = 2,520 MHz (light and zero-operand IMMA, no throttle reason), honest at L = 32 1585 MHz at thermal steady state under the node's enforced 325 W cap (SW power cap), 1 − 1585/2520"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IDP4A = 8, LDS128 = 0.5 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on its own row I4A on sm_89), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_89: ptxas 13.0 keeps warp-uniform chains on lanes (EPS1 ADA)
