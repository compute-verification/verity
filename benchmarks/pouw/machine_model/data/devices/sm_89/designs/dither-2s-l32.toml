# Dither-2S at L = 32 on the L40S (sm_89): two-sided dither serving the last checked word, duo receipts, P·V's peel.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest, its operand floor, the clock and the
# baseline are the L40S's.
name = "dither-2s-l32"
title = "Dither-2S, L = 32"
summary = "Dither-2S on the L40S at L = 32: two-sided dither serving the last checked word, duo receipts, P·V's peel"
honest = "ada-l32"
L = 32
work = 1.0
sums = "vfold"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: two-sided {0,1} noise is fresh on both operands at every 32-step at every instance, so the register floor stays 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.served]
eps = 0.00287
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 18.505 SMSP-cycles a 4096-MAC MMA on ADA-89; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: P·V's peel 0.287%: its tail 0.200%, the sums DG, S and X(0) 0.0725%, the served epilogue 0.0137%. With P·V's served output checked it is 0.225% (8B) / 0.0983% (70B) there. Skip terms: the peel's tail at the larger of 1.57 of ♭'s MACs a strip product and Π's price of BC-KERNEL r2's tail instructions (4 mma.sync m16n8k32, 4 IMAD, 11.5 other), its sums by vfold (decision 91) and served epilogue at one an issue cycle, on sm_120's instruction counts for the same kernel source, on this device's Π"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD). On the L40S duo's IMAD form (rotl(u, r) + y as IMAD.HI.U32 then IMAD: ALU 1 + IMAD 3 a word) is slower at every share of words: honest16 17% slower with 8 of a lane's 32 words in it, 129% with all 32; IMAD.HI.U32 is half IMAD's rate (EPS1 ADA r2, opcode_probe/sm89/uniform.cu's duo<W>)"

[clock]
eps = 0.371032
source = "EPS1 ADA (50 s a kernel): f_max = 2,520 MHz (light and zero-operand IMMA, no throttle reason), honest at L = 32 1585 MHz at thermal steady state under the node's enforced 325 W cap (SW power cap), 1 − 1585/2520"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5: Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IDP4A = 8, LDS128 = 0.5 }
source = "dp4a at 8 IDP4A a word at L = 32 (IDP4A on its own row I4A on sm_89), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = true      # UNI on UP, issue and JI89 (EPS1 ADA r2, opcode_probe/sm89/uniform.cu)
