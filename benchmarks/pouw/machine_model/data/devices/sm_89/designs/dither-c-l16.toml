# Dither-C at L = 16 on the L40S (sm_89): CO-Dither (co32c, cohalf), P·V on committed digit limbs, duo receipts.
# The noise, ε_skip and ε_mand are sm_120's design's (data/designs/); honest, its operand floor, the clock and the
# baseline are the L40S's.
name = "dither-c-l16"
title = "Dither-C, L = 16"
summary = "Dither-C on the L40S at L = 16: CO-Dither (co32c, cohalf), P·V on committed digit limbs, duo receipts"
honest = "ada-l16"
L = 16
work = 1.0

[noise]
linears = "co32c"
lm_head = "co32c"
qk = "cohalf"
pv = "pv"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.010638 }
source = "SPEC §3.4's count for m16n8k16 (CALC): CO-Dither's U is resident, so Dither's one-operand floor, least 1/94 at (a, b) = (1, 47)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.ts-time]
eps = 0.00088
source = "SKIP's Result 3 (calculator @07f901181): 0 by int8 products; <= 0.088% (8B) of prefill time with CHECKED-STRIP's TS vector work (co32c's recombination, cohalf's x = 12 route, pv's digits and epilogue), at L = 32 (note:20261017T0340Z-draft-skip, 06:19Z); vector work, not a strip, so kept at L = 32's value at L = 16"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.333333
source = "EPS1 ADA (note:20261017T0605Z-draft-eps1-ada, r20261017-070403-a5ff, 50 s a kernel): f_max = 2,520 MHz (light and zero-operand IMMA, no throttle reason), honest at L = 16 1680 MHz at thermal steady state under the node's enforced 325 W cap (SW power cap), 1 − 1680/2520"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IDP4A = 4, LDS128 = 0.25 }
source = "dp4a at 4 IDP4A a word at L = 16 (IDP4A on its own row I4A on sm_89), its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, scaled by L/32"

[routes]
lanes = true
uniform = false     # no uniform-datapath line on sm_89: ptxas 13.0 keeps warp-uniform chains on lanes (EPS1 ADA)
