# Honest at L = 16 on the L40S as measured: `honest16`, 8 IMMA.16816 then duo on each of their 32 words a
# lane (LOP3 + IMAD + LEA.HI a word), operands in registers. The fastest of 2, 4, 6 and 8 warps a SMSP is 8's,
# 26.85 words/SM/clk = 0.42 of the tensor pipe; occupancy doesn't move it, so it is the fold's cost, not latency.
name = "ada-l16"
status = "measured"
source = "EPS1 ADA's honest16 (opcode_probe/sm89/scalar.cu, SASS pinned at 8 IMMA.16816, 32 LOP3.LUT, 32 IMAD, 32 LEA.HI a step)"
L = 16

[mma]
kind = "IMMA.16816.S32.S8.S8"   # mma.sync m16n8k16 s8: 8 SMSP-cycles on the tensor pipe, 64 words/SM/clk (T1 tight)
class = "IMMA16816"
words = 128
depth = 16

[per_mma]       # warp instructions a MMA: the MMA and the fold (LEA.HI on ALU's row, as sm_120's duo counts it)
IMMA16816 = 1
ALU = 8
IMAD = 4

[measured]
cycles_per_mma = 19.069         # 128 words x 4 SMSPs / 26.85 words/SM/clk (19.07-20.39 over 2-8 warps a SMSP)
source = "EPS1 ADA, honest16_w8"

[operands]      # the least operand delivery any program pays a MMA when the design names none
floor = { LDSM_X4 = 0.097222 }
source = "SPEC §3.4's register count for m16n8k16 (CALC): A in 2 registers a lane, B in 1, accumulators 4, no instruction writes more than 4; a register tile with 4ab + 2a + b <= 240 delivers >= (2a + b)/(4ab), least 7/72 at (a, b) = (6, 9) (the same count gives SPEC's 0.20 and 1/39 for m16n8k32)"

[fold]
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
