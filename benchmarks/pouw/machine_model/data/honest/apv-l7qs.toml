# The adopted P.V a useful MMA as measured: apv_l7qs (benchmarks/pouw/edited_gemm/apv.cu), e_l7qs's mainloop over one
# unit (a head's 128-query tile x 128 channels over keys 0 .. 128(qt + 1) - 1, warp row w the 32-query block j = 4qt + w)
# with the tail stage P_A = [-U | -U | -U M_d | 64 M_d] against DG's [Y0 | Y1 | X_diag | 0] (O = T_last - U Y0 - W -
# 256 U Y1, absorbed) and the served epilogue f = (float(O + 64 S) s_q + z_q X_0) s_ch, Llama-3.1-8B's attention at
# 2,048 tokens (32 query heads, 8 KV heads, causal). Counts are the kernel's executed mix (ncu) a useful MMA, the
# strip's T-word MMAs: the tail's 4 MMAs a 128-cell tile make 1.1176 MMAs a useful one, so MMA = 1.1176 here and the
# duo fold (4 words a lane a useful MMA) sits inside per_mma at L = 32. WAIT is left out (0.1476 a useful MMA). The
# issue rows bind (JI3n_0, 21.47 a MMA against plain's 16.23 on KFFMA0) but the time is set by reading P from DRAM:
# eps_sched 0.48 here and 0.44 for apv_plain (the same units, no edit), and honest's time is 1.594x apv_plain's at
# 2,048 tokens (1.092x at 4,096, where both are DRAM-bound). The producers (U, P~, V, the X sums) are not in it.
name = "apv-l7qs"
status = "measured"
source = "BC-KERNEL's apv_l7qs (benchmarks/pouw/edited_gemm/apv.cu) at s = 2048, H = 32, rep = 4, `eps_profile.py OUT --toml`, census VF3n-16's classes, scaled by 2,490,368 / 2,228,224 MMAs to a useful MMA (bit-exact against checked_strip's pv_words and pv_served, apv_ref.py)"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a useful MMA by class, everything the kernel issues (the fold and the tail included)
MMA = 1.1176
ALU = 9.6599
IMAD = 4.4118
NOROW = 1.1446
LDSM_X4 = 0.5294
FFMA = 0.4723
LDG32 = 0.1624
UNI = 0.1033
SEL = 0.0783
IMADW = 0.0263
LDG128 = 0.0042
UTMA16K = 0.0041

[measured]
cycles_per_mma = 45.9903        # the hot median at its clock a useful MMA; ncu 47.2318; work bound 23.8570 on JI3n_0 (eps_sched 0.481)
source = "apv_l7qs at s = 2048, H = 32, rep = 4: hot 0.0668 ms against apv_plain's 0.0419"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a useful MMA at L = 32)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
