# The honest Dither-2S linear a MMA as D2S-KERNEL measured it: d_l7qs (benchmarks/pouw/edited_gemm/d2sgemm.cu), both
# operands dithered with fresh bits a call, no U and no peel, the last checked word served, duo receipts at L = 32 on
# e_l7qs's schedule (LAG 7, a LOP3 tie every 4th MMA, consumers sleeping on the stage barrier), 8192^3. Counts are the
# kernel's executed mix (ncu); WAIT, the barrier wait, is left out (it costs no time). The operand passes (d2quant,
# d2wedit) are separate launches and not in these counts.
name = "d2s-l7qs"
status = "measured"
source = "D2S-KERNEL's d_l7qs at 8192^3, `eps_profile.py OUT --mm benchmarks/pouw/machine_model --toml`, census VF3n-16's classes"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold included)
MMA = 1
ALU = 8.9586
IMAD = 4.0333
NOROW = 0.7931
LDSM_X4 = 0.5
UNI = 0.0879
SEL = 0.0708
UTMA16K = 0.0039
IMADW = 0.0025
VIMNMX = 0.0005

[measured]
cycles_per_mma = 26.1495        # the hot median at its clock; ncu 26.0065; work bound 20.9768 on JI3n_0 (VF3n-16)
source = "D2S-KERNEL's d_l7qs at 8192^3"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: two-sided {0,1} noise is fresh on both operands at every 32-step at every instance, so the register floor stays 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a MMA at L = 32)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
