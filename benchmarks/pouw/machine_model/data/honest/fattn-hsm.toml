# H1's softmax with S never stored, a MMA as measured: hsm (benchmarks/pouw/edited_gemm/fattn.cu), S recomputed as a
# plain GEMM W^ X^T (rows the queries) on the causal tiles of Llama-3.1-8B's attention at 2,048 tokens (32 query heads, 8
# KV heads), the softmax in its epilogue: e = LUT[min(umulhi(m - S, A), 255)] from shared memory, P_prob's bytes in one
# 8-byte store a row a lane (a quad transpose), e(0) and the row's sum of e (an atomicAdd). Every MMA is useful (no tail);
# it commits no words, so there is no fold. Counts are the kernel's executed mix (ncu) a MMA; WAIT is left out (0.1210 a
# MMA). It is latency-bound (eps_sched 0.54, issue 41%): the epilogue doesn't overlap the next tile's MMAs at one CTA a
# SM. 0.0731 ms here, and 1.0378 ms at 8,192 tokens at 47.7470 cycles a MMA.
name = "fattn-hsm"
status = "measured"
source = "BC-KERNEL's hsm (benchmarks/pouw/edited_gemm/fattn.cu) at s = 2048, H = 32, rep = 4, causal, `eps_profile.py OUT --toml`, census VF3n-16's classes (P_prob, s_q and z_q equal to the unfused reference's from h_l7qs's stored S, fattn_ref.py on the CPU)"
L = 32          # the loader's field; hsm commits nothing

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the softmax included)
MMA = 1
ALU = 6.5190
NOROW = 2.9913
IMAD = 2.6893
VIMNMX = 1.0086
LDS32 = 1.0080
SEL = 0.9272
LDSM_X4 = 0.5
SHFL = 0.5
UNI = 0.2227
IMADW = 0.2224
LDG32 = 0.1267
LDG128 = 0.0335
XU = 0.0285
UTMA16K = 0.0039

[measured]
cycles_per_mma = 49.7663        # the hot median at its clock; ncu 49.3428; work bound 23.0289 on JI3n_0 (eps_sched 0.535)
source = "hsm at s = 2048, H = 32, rep = 4, causal: hot 0.0731 ms"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]          # no committed words
name = "none"
