# The honest edited GEMM a MMA: Dither with duo receipts at L = 32 (the served GEMM). Provisional: the counts
# are the design's, not ncu's, with no overhead beyond operands and address math. The designs read the measured
# kernel (e-l7qs.toml); this one stays for the tests' hand arithmetic.
name = "dither-duo-l32"
status = "provisional"
source = "model.toml's [honest] (a 64x64 warp tile in a 128x128 block) plus the duo fold, 3 lane instructions a word (benchmarks/pouw/receipts)"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold included)
MMA = 1
LDS128 = 0.25   # operands: 4 KB a k32 step of the 64x64 warp tile, 32 MMAs
ALU = 8.125     # address math 0.125, and the fold's LOP3 and LEA.HI on 4 words a lane
IMAD = 4        # the fold's IMAD on 4 words a lane
TMA512 = 0.125  # the block's tiles into shared memory

[operands]      # the least operand delivery any program pays a MMA (`--operands floor`); the register floor replaces it
floor = { LDS128 = 0.2 }
source = "CALC's register-capacity estimate: a lane holds an a x b tile of m16n8k32 accumulators (4ab registers) and its operand fragments (4a + 2b), so (4a + 2b)/4 LDS.128 feed ab MMAs; under 255 registers the least is 0.2 a MMA (a = 5, b = 10). Honest's 64x64 tile pays 0.25, and its TMA and address math 0.25 more"

[fold]          # the fold inside per_mma, lane instructions a committed word (128 words a MMA at L = 32: 12 warp instructions)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
