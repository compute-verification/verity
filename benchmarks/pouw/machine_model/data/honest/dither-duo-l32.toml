# The honest edited GEMM a MMA: Dither with duo receipts at L = 32 (decision 45's served GEMM). Provisional: the counts
# are the design's, not ncu's; PROFILE (note:*-draft-eps1-profile) replaces them with the measured profile, and its
# measured SMSP-cycles a MMA go under [measured].
name = "dither-duo-l32"
status = "provisional"
source = "model.toml's [honest] (a 64x64 warp tile in a 128x128 block) plus the duo fold, 3 lane instructions a word (note:20261015T0432Z-draft-receipt-phi; benchmarks/pouw/receipts on cursor/receipts-ref-ea24)"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold included)
MMA = 1
LDS128 = 0.25   # operands: 4 KB a k32 step of the 64x64 warp tile, 32 MMAs
ALU = 8.125     # address math 0.125, and the fold's LOP3 and LEA.HI on 4 words a lane
IMAD = 4        # the fold's IMAD on 4 words a lane
TMA512 = 0.125  # the block's tiles into shared memory

[fold]          # the fold inside per_mma, lane instructions a committed word (128 words a MMA at L = 32: 12 warp instructions)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
