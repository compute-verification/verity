# co32c's linear with W' formed in shared memory, a MMA as measured: cw_l7qs, c_l7qs's mainloop and tail with the B tile
# edited in place each stage (W' = (W+64) + (U+64) + c, sign flipped, from the cached weight, cplane's 1-bit c plane and
# its U+64 rows; the column's 4 warps meet on a per-slot mbarrier before the tile's 3rd and 4th k-steps read it), 8192^3.
# Counts are the kernel's executed mix (ncu; the tail's MMAs included); WAIT, the barrier wait, is left out (0.3230 a MMA).
# The edit is 2.24 instructions a MMA over c_l7qs (1.22 at its floor, 4 a 4-byte word); c_l7qs is issue-bound, so the
# kernel runs 17% slower and the served linear (cquant, cplane, cw_l7qs) loses to cquant, cwedit, c_l7qs: 1.82x plain
# int8 with its quantizer at Llama-3.1-8B's linears at 2,048 tokens against 1.73x. The edit pass it saves (0.124 ms there)
# is 6.0% of the GEMM.
name = "cw-l7qs"
status = "measured"
source = "cw_l7qs (benchmarks/pouw/edited_gemm/cwgemm.cu) at 8192^3, `eps_profile.py OUT --toml`, census VF3n-16's classes (r20261017-091604-85e1; bit-exact against checked_strip's co32c_words and c_l7qs's receipts, cwgemm_ref.py)"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold and the edit included)
MMA = 1
ALU = 10.2319
IMAD = 4.1268
NOROW = 1.1194
LDSM_X4 = 0.5
UNI = 0.2762
SEL = 0.0711
LDS128 = 0.0618
STS128 = 0.0618
LDG128 = 0.0608
IMADW = 0.0334
LDG32 = 0.0314
UTMA16K = 0.0039

[measured]
cycles_per_mma = 30.5778        # the hot median at its clock; ncu 30.5743; work bound 22.7896 on JI3n_0 (eps_sched 0.255)
source = "cw_l7qs at 8192^3 (r20261017-091604-85e1): hot 2.6482 ms against c_l7qs's 2.2656 and plain's 1.5128; r20261017-093140-8f65 reproduces it (30.5261, 17.9030 instructions a MMA)"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10) (note:20261017T0324Z-draft-eps1-spec)"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a MMA at L = 32)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
