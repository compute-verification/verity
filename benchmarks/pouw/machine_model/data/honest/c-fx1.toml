# co32c's linear with fx1 (egemm.cu's fx_chain<FX1>) a MMA as measured: c_fx1, c_l7qs
# with one keyed IMAD a word (w * key_mul(1, 32(4T + E)), the tile position's word E) chained in front of duo on every
# absorbed word, the mainloop's and co32c's tail's (O', D_d), so f = 4; 8192^3 (m = 3 digits). Counts are the kernel's
# executed mix (ncu; the tail's MMAs included); WAIT, the barrier wait, is left out (0.2051 a MMA). fx1 adds exactly 4.00
# IMAD a MMA (one a word) and no ALU over c_l7qs, so the IMAD does not merge into duo's; the binding row moves from EALUB1
# to JI3s_0 and issue-slot use from 60.5% to 68.1%. The GEMM runs 1.675x plain int8 (c_l7qs 1.494x; estimated
# 1.693x), and Llama-3.1-8B's served linears (cquant, cwedit beside it, c_fx1) 1.83-1.99x at 2K-32K against 1.65-1.82x.
name = "c-fx1"
status = "measured"
source = "BC-KERNEL's c_fx1 (benchmarks/pouw/edited_gemm/cgemm.cu) at 8192^3, `eps_profile.py OUT --toml`, census VF3r-16's classes (bit-exact against cgemm_ref.py, which recomputes fx1's chain from the key, and rejects duo's receipts and a dropped IMAD)"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold included)
MMA = 1
ALU = 8.9558
IMAD = 8.0646
NOROW = 0.8580
LDSM_X4 = 0.5
UNI = 0.0919
SEL = 0.0711
UTMA16K = 0.0039
IMADW = 0.0024
VIMNMX = 0.0005

[measured]
cycles_per_mma = 29.2709        # the hot median at its clock; ncu 29.3092; work bound 21.3939 on JI3s_0 (eps_sched 0.269)
source = "c_fx1 at 8192^3: hot 2.5350 ms against c_l7qs's 2.2616 (26.1144 a MMA), egemm's fx1_l7qs's 2.5161 and plain's 1.5138; at 2048x28672x4096 31.2036 a MMA (1.665x plain, c_l7qs 1.504x)"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]          # the fold inside per_mma, lane instructions a committed word (16 warp instructions a MMA at L = 32)
name = "fx1"    # t = w*m (IMAD, m keyed by tile position); u = y ^ t ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 2
