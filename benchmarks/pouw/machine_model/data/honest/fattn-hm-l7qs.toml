# H1's QK^T with S never stored, a MMA as measured: hm_l7qs (benchmarks/pouw/edited_gemm/fattn.cu), h_l7qs's mainloop,
# cohalf tail and duo receipts op for op (gated equal to h_l7qs's receipts on every tile) on the causal tiles of
# Llama-3.1-8B's attention at 2,048 tokens (32 query heads, 8 KV heads), with each query column's max over its keys
# (3 shuffles and an atomicMax a column) in place of O's store. Counts are the kernel's executed mix (ncu) a MMA, 6 MMAs
# a 4 useful as h_l7qs (so a useful MMA is 1.5 of these); WAIT is left out (0.1578 a MMA). Without the store it is issue-
# bound (eps_sched 0.44, h_l7qs's 0.78): 0.1090 ms here, and 1.4792 ms at 8,192 tokens at 45.3714 cycles a MMA.
name = "fattn-hm-l7qs"
status = "measured"
source = "BC-KERNEL's hm_l7qs (benchmarks/pouw/edited_gemm/fattn.cu) at s = 2048, H = 32, rep = 4, causal, `eps_profile.py OUT --toml`, census VF3n-16's classes (receipts equal to h_l7qs's, P_prob, s_q, z_q, apv_fu's f and receipts equal to the unfused composition's, fattn_ref.py on the CPU)"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold and the column max included)
MMA = 1
ALU = 12.0218
IMAD = 4.6324
NOROW = 2.4181
VIMNMX = 1.0
LDSM_X4 = 0.5
SHFL = 0.5
UNI = 0.2998
SEL = 0.1130
IMADW = 0.0855
LDG128 = 0.0221
XU = 0.0208
UTMA16K = 0.0101

[measured]
cycles_per_mma = 49.4548        # the hot median at its clock; ncu 47.5029; work bound 27.4769 on JI3n_0 (eps_sched 0.441)
source = "hm_l7qs at s = 2048, H = 32, rep = 4, causal: hot 0.1090 ms; over every tile 0.1905 ms against h_l7qs's 0.4825 with S stored"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a MMA at L = 32)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
