# The honest edited GEMM a MMA as measured: e_l7qs, Dither with duo receipts at L = 32 (LAG 7, a LOP3 tie
# every 4th MMA, consumers sleeping on the stage barrier), 8192^3. Counts are the kernel's executed mix (ncu, the peel's
# MMAs included); WAIT, the barrier wait, is left out (it costs no time: eps_sched_work).
name = "e-l7qs"
status = "measured"
source = "PROFILE's e_l7qs at 8192^3, `eps_profile.py OUT --mm 8192 --toml`, census VF3l-16's classes"
L = 32

[mma]
kind = "IMMA.16832.S32.S8.S8"   # mma.sync m16n8k32 s8: 16 SMSP-cycles on the tensor pipe
words = 128                     # 16 x 8 s32 accumulators
depth = 32                      # k
form = "IMMA16832"              # its census kind (data/forms.toml): per_mma's MMA is one of these

[per_mma]       # warp instructions a MMA by class, everything the kernel issues (the fold included)
MMA = 1
ALU = 8.8796
IMAD = 4.0027
NOROW = 0.8619
LDSM_X4 = 0.5
UNI = 0.0919
SEL = 0.0711
UTMA16K = 0.0039
IMADW = 0.0024
VIMNMX = 0.0005

[measured]
cycles_per_mma = 26.1221        # the hot median at its clock; ncu 25.6955; work bound 22.4334 on JI3e_0
source = "PROFILE's e_l7qs at 8192^3"

[operands]      # the least operand delivery a program pays a MMA when the design names none (`--operands floor`)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: an IMMA.16832 needs A in 4 registers a lane and B in 2, no instruction writes more than 4, and a register tile with 4ab + 4a + 2b <= 240 delivers >= 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10)"

[fold]          # the fold inside per_mma, lane instructions a committed word (12 warp instructions a MMA at L = 32)
name = "duo"    # u = y ^ d ^ k (LOP3); y = u*a + z (IMAD); z = rotl(u, r) + y (LEA.HI)
ALU = 2
IMAD = 1
