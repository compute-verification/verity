# VF3q-16: VF3p-16 with the L2 random-row gather routes the CUDA-core table route uses (EPS1 DATASHEET r5, l2gather.cu, r20261017-071007-85c9): a data-dependent gather of a W-byte row from an L2-resident table at a fresh random index, by LDG.E.{64,128,256} (L2G8/L2G16/L2G32, 8/16/32 B a lane), texture (L2GT4, TLD) and the read-only cache (L2GN16, LDG.E.128.CONSTANT), each a copy route at π_c ≥ 16 (L2GT4 at π₃₂ ≥ 32). Like VF3m-16's word-writers, the credits that price the new routes lower τ (0.0588 -> 0.0585); the adopted design's margin (2.0) and U/F_low (1.1563) are unchanged.
