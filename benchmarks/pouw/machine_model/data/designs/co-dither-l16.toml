# Dither-C, peel P·V (co-dither) at L = 16 on the RTX PRO 6000: IMMA.16816, where T1 is tight (TENSOR), on the unmeasured
# e-l16-model. sm_120 gives IMMA.16816 a 16832's pipe time, so honest issues two MMAs a useful 16832's work (`work` 2),
# and the plain reference is a 16816 GEMM at the same time a MMA (γ low by about 1.5%: 16.25 vs 16.50 SMSP-cycles
# alone). Its ε_skip is its own, at its own ♭ (decision 90), with the base's vfold sums.
base = "dither-c-peel"
name = "co-dither-l16"
title = "Dither-C, peel P·V, L = 16"
summary = "co-dither at L = 16 on sm_120: co32c, cohalf QKᵀ, the peel's P·V, duo, IMMA.16816 (two a useful 16832; model honest)"
honest = "e-l16-model"
L = 16
work = 2.0

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.010638 }
source = "SPEC §3.4's count for m16n8k16 (CALC, devices-sm89 dither-c-l16): CO-Dither's U is resident, so Dither's one-operand floor, least 1/94 at (a, b) = (1, 47)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 4, LDS128 = 0.25 }   # lane instructions a word: 4 IDP4A at k = 16, operands for an 8x8 tile a lane
source = "dp4a at 4 IDP4A a word at L = 16 (halved from 8 at k = 32); its loads 2(a + b)/(ab) LDS.128 a word at a = b = 8, halved"

[skip.served]
eps = 0.00157
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 33.491 SMSP-cycles a 4096-MAC MMA on VF3r-16; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: the linears' co32c recombination 0.0439%; lm_head's co32c recombination 1.04e-07%; QKᵀ's cohalf sums 0.00372%; P·V's peel 0.109%: its tail 0.0615%, the sums DG, S and X(0) 0.0399%, the served epilogue 0.00756%. With P·V's served output checked it is 0.134% (8B) / 0.0593% (70B) there. Skip terms: the peel's tail at apv's issue model, 1.57 mainloop MACs a strip product, its sums by vfold (decision 91) and served epilogue at one an issue cycle; the checked leaves' vector work only the served output needs at the TS model's gap (TS_EPS of TS_CHEAT, pv_ts)"
