# Dither-C (decision 79; was Bc, CHECKED-STRIP's CO-Dither): co32c on the linears and lm_head (every limb a checked
# word), cohalf on QKᵀ, and P·V on committed digit limbs (`pv`, CHECKED-STRIP Result 3): P served round(P / s) + c with
# a fresh bit c and c's mean taken off in the epilogue, V served, Ycum's digits committed, so no product is unchecked;
# what the cheater gets free is vector work, the TS-time ε below (note:20261017T0340Z-draft-skip Result 3, 06:19Z;
# note:20261017T0030Z-draft-checked-strip). Perplexity +2.20% (8B WT-2 2K), +3.32% (70B C4 2K) with P in one block;
# +1.65% (8B) in blocks of 256 keys, whose TS ε grows as keys/256 (up to ≈ 1% of the whole at 32K, not priced here), on
# SKIP's `co32c-pv` arms, which are not on main yet (cursor/eps-pv-ea24).
name = "dither-c"
title = "Dither-C"
aliases = ["co-dither-pv", "Bc-pv", "co32c-pv"]
summary = "co32c linears and lm_head, cohalf QKᵀ, P·V on committed digit limbs (P in one block): every product a checked word, duo at L = 32"
ppl = ""

[noise]
linears = "co32c"
lm_head = "co32c"
qk = "cohalf"
pv = "pv"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.025641 }
source = "SPEC §3.4: CO-Dither's U is resident (B̃ a data-independent map of a resident matrix), so Dither's one-operand floor, least 1/39 at (a, b) = (1, 39); co32c's words are subset sums of wide U values, as fresh as Dither's (SKIP) (note:20261017T0324Z-draft-eps1-spec)"

[skip.ts-time]
eps = 0.00088
source = "SKIP's Result 3 (calculator @07f901181): 0 by int8 products; ≤ 0.088% (8B) / 0.057% (70B) of prefill time with CHECKED-STRIP's TS vector work, co32c's recombination with O committed, cohalf's x = 12 route and pv's digits and epilogue (P·V 0.84% of its own time at 2K, served output checked downstream; 1.96% with it free), the digit and epilogue constants unmeasured (note:20261017T0340Z-draft-skip, 06:19Z)"
