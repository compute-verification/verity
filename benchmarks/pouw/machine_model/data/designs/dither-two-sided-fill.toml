# Two-sided dither with verified lane filler: the filler dilutes what the cheater saves on operand delivery, which SPEC's
# conservative contract prices at 0 (note:20261017T0324Z-draft-eps1-spec §0.5), at the cost of γ. Its reading with
# `--upfill` (under 1% at q* ≥ 2.03 and γ 2.71, note:20261017T0320Z-draft-eps1-calc) is not adopted: decision 73 drops
# UPFILL, a uniform instruction taking an issue slot (EPS1 P10, r20261017-055801-e051).
name = "dither-two-sided-fill"
summary = "Two-sided dither, duo at L = 32, and 4.5 lane instructions a word of verified filler"
honest = "e-l7qs"
L = 32
work = 1.0

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: two-sided {0,1} noise is fresh on both operands at every 32-step at every instance, so the register floor stays 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10) (note:20261017T0324Z-draft-eps1-spec)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[filler]
per_word = 4.5
mix = { ALU = 1, IMAD = 1 }
route = "lanes"
source = "CALC: a lane chain of LOP3 and IMAD, receipts checked like the fold's (candidate); FILL-OPT (μ_x = 0) is its named assumption"

[skip.pv-strip]
eps = 0.00065
source = "SKIP's design A over Llama-3.1-8B and 70B x 2K, 8K, 32K, prefill and decode, by honest time: the one unchecked item is the second int8 limb of P·V's strip U·Y (prefill 0.065%, decode 0.059%; 0.060% by int8 products) (note:20261017T0340Z-draft-skip, 04:20Z)"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD), and the filler the cheapest of its work (FILL-OPT)"

[clock]
eps = 0.1391
source = "SPEC's P1 (note:20261017T0324Z-draft-eps1-spec, 04:47Z): the prover sets its own clocks, so f_max is the hardware's 2,430 MHz against honest at the node's 2,092 lock, 1 − 2092/2430, unless a trusted device attests the lock; at the lock every program runs 2,099.5-2,100.0 MHz (DATASHEET, r20261017-033131-4e67), and the default-clock gap is unmeasured"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 8, LDS128 = 0.5 }   # lane instructions a word: 8 IDP4A at k = 32, operands for an 8x8 tile a lane
source = "dp4a at 8 IDP4A a word (note:20261017T0310Z-report-eps1-program §3); its loads: 2(a + b)/(ab) LDS.128 a word at a = b = 8"

[routes]
lanes = true
uniform = true
