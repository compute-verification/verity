# Ap: design A with Bc's committed-digit P·V (`adopted-bd-lm-pv`, SKIP Result 3): both operands dithered, no U, the last
# checked word served, and P·V's strip digits committed, so no product is unchecked. Perplexity +1.38% (8B WT-2 2K).
name = "dither-two-sided-pv"
summary = "Ap: two-sided dither serving the last checked word, P·V on committed digit limbs, duo at L = 32"
honest = "e-l7qs"
L = 32
work = 1.0

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: two-sided {0,1} noise is fresh on both operands at every 32-step at every instance, so the register floor stays 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10) (note:20261017T0324Z-draft-eps1-spec)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.ts-time]
eps = 0.00053
source = "eps_budget.pv_block_point(…, \"Ap\", 0) at BC-KERNEL's measured digit, epilogue and scaling costs (7, 11.2, 12; note:20261017T0645Z-draft-bc-kernel): 0 by int8 products and by time off P·V, plus pv's TS vector work ≤ 0.053% (8B) / 0.016% (70B) of prefill time over 2K-32K, served output checked downstream; ≤ 0.155% / 0.073% with it free (CALC r5, note:20261017T0320Z-draft-eps1-calc)"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.1391
source = "SPEC's P1 (note:20261017T0324Z-draft-eps1-spec, 04:47Z): the prover sets its own clocks, so f_max is the hardware's 2,430 MHz against honest at the node's 2,092 lock, 1 − 2092/2430, unless a trusted device attests the lock; at the lock every program runs 2,099.5-2,100.0 MHz (DATASHEET, r20261017-033131-4e67), and the default-clock gap is unmeasured"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 8, LDS128 = 0.5 }   # lane instructions a word: 8 IDP4A at k = 32, operands for an 8x8 tile a lane
source = "dp4a at 8 IDP4A a word (note:20261017T0310Z-report-eps1-program §3); its loads: 2(a + b)/(ab) LDS.128 a word at a = b = 8"

[routes]
lanes = true
uniform = true
