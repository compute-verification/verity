# Dither-C with Dither-2S's P·V: co32c on the linears and lm_head, cohalf on QKᵀ, and the recorded w64 peel
# on P·V, whose whole strip is free at a one-hot P row, which Dither-C's pv closes. Its arm
# `co32c` is the one Dither-C perplexity measured on main.
base = "dither-c"
name = "dither-c-peel"
title = "Dither-C, peel P·V"
aliases = ["co-dither", "Bc"]
summary = "co32c linears and lm_head (every limb a checked word), cohalf QKᵀ, Dither-2S's P·V, duo at L = 32"
ppl = "co32c"
sums = "vfold"

[noise]
linears = "co32c"
lm_head = "co32c"
qk = "cohalf"
pv = "peel"

[skip.served]
eps = 0.00417
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 17.158 SMSP-cycles a 4096-MAC MMA on VF3r-16; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 2K prefill: the linears' co32c recombination 0.0854%; lm_head's co32c recombination 2.02e-07%; QKᵀ's cohalf sums 0.00725%; P·V's peel 0.325%: its tail 0.232%, the sums DG, S and X(0) 0.0777%, the served epilogue 0.0147%. With P·V's served output checked it is 0.345% (8B) / 0.160% (70B) there. Skip terms: the peel's tail at apv's issue model, 1.57 mainloop MACs a strip product, its sums by vfold (decision 91) and served epilogue at one an issue cycle; the checked leaves' vector work only the served output needs at the TS model's gap (TS_EPS of TS_CHEAT, pv_ts)"
