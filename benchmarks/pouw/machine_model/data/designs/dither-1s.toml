# Dither-1S, Dither as built: one-sided dither with the low-rank U, duo receipts on every committed word at L = 32.
name = "dither-1s"
title = "Dither-1S"
aliases = ["dither-duo", "record", "adopted"]
summary = "One-sided dither with the low-rank U (the design of record), duo receipts (3 a word) at L = 32"
ppl = "adopted"
sums = "vfold"

[noise]
linears = "one-sided"
lm_head = "clean"
qk = "one-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.025641 }
source = "SPEC §3.4: at the zero instance B̃ = ΠUᵀ repeats every 32 rows, so only A's fragment is delivered: >= 1/b with 4ab + 4a + 2b <= 240, least 1/39 at (a, b) = (1, 39)"

[skip.served]
eps = 0.123
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its issue-model price over the floor program's bound B_♭ (SPEC §2.9), ♭ 17.158 SMSP-cycles a 4096-MAC MMA on VF3r-16; the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode (decode's ♭ its compute alone), every served output free. At 8B 32K decode: the linears' one-sided strip 0.480%; QKᵀ's one-sided strip 11.7%; P·V's peel 0.129%: its tail 0.0926%, the sums DG, S and X(0) 0.0310%, the served epilogue 0.00586%. With P·V's served output checked it is 12.3% (8B) / 9.09% (70B) there. Skip terms: the peel's tail at apv's issue model, 1.57 mainloop MACs a strip product, its sums by vfold (decision 91) and served epilogue at one an issue cycle; a one-sided strip's 2L executed products at ♭'s price a MAC; the clean lm_head skips nothing, its words are ♭'s"
