source = "SPEC §3.4: at the zero instance B̃ = ΠUᵀ repeats every 32 rows, so only A's fragment is delivered: >= 1/b with 4ab + 4a + 2b <= 240, least 1/39 at (a, b) = (1, 39) (note:20261017T0324Z-draft-eps1-spec)"

[skip.served]
eps = 0.164
source = "eps_budget.py (benchmarks/pouw, `design_skip`): the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, prefill and decode, of the whole-model ε_skip by honest time, every served output free; at 8B 32K decode, QKᵀ's one-sided peel (L/d of its products) 14.3%, the clean lm_head 1.6%, the linears' peel 0.51%, P's 0.06%; softmax and forming checked by C1′ under one σ a request (decision 72), no deferred pass. Dither as recorded (forming unchecked, decode deferred) was 25.5% prefill and 90.9% decode (note:20261017T0340Z-draft-skip)"
