# Bc with P·V on committed digit limbs (`pv`, CHECKED-STRIP Result 3): P served round(P / s) + c with a fresh bit c and
# c's mean taken off in the epilogue, V served, Ycum's digits committed, so no product is unchecked; what the cheater
# gets free is vector work, the TS-time ε below (note:20261017T0340Z-draft-skip Result 3, 06:19Z;
# note:20261017T0030Z-draft-checked-strip). Perplexity +2.20% (8B WT-2 2K), +3.32% (70B C4 2K) with P in one block;
# +1.65% (8B) in blocks of 256 keys, whose TS ε grows as keys/256 (up to ≈ 1% of the whole at 32K, not priced here).
name = "co-dither-pv"
summary = "Bc with P·V on committed digit limbs (co32c-pv, P in one block): every product a checked word, duo at L = 32"
honest = "e-l7qs"
L = 32
work = 1.0

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.025641 }
source = "SPEC §3.4: CO-Dither's U is resident (B̃ a data-independent map of a resident matrix), so Dither's one-operand floor, least 1/39 at (a, b) = (1, 39); co32c's words are subset sums of wide U values, as fresh as Dither's (SKIP) (note:20261017T0324Z-draft-eps1-spec)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.ts-time]
eps = 0.00124
source = "eps_budget.pv_block_point(…, \"Bc\", 0) at BC-KERNEL's measured digit, epilogue and scaling costs (7, 11.2, 12; note:20261017T0645Z-draft-bc-kernel): 0 by int8 products; ≤ 0.124% (8B) / 0.072% (70B) of prefill time over 2K-32K with CHECKED-STRIP's TS vector work, co32c's recombination with O committed, cohalf's routes at x = 10.66 and pv's digits and epilogue, served output checked downstream (P·V 3.13% of its own time at 8B 2K); ≤ 0.217% / 0.117% with it free (CALC r5, note:20261017T0320Z-draft-eps1-calc)"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.1391
source = "SPEC's P1 (note:20261017T0324Z-draft-eps1-spec, 04:47Z): the prover sets its own clocks, so f_max is the hardware's 2,430 MHz against honest at the node's 2,092 lock, 1 − 2092/2430, unless a trusted device attests the lock; at the lock every program runs 2,099.5-2,100.0 MHz (DATASHEET, r20261017-033131-4e67), and the default-clock gap is unmeasured"

[luck]
delta = 4.547473508864641e-13
p = 0.75
checks = 48000
source = "SPEC §5 (note:20261017T0324Z-draft-eps1-spec): Theorem S at p = 3/4 over one week of 12.6 s rounds, δ′ = 2^-41 (note:20261016T0005Z-draft-luck-loss-round4 §1)"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 8, LDS128 = 0.5 }   # lane instructions a word: 8 IDP4A at k = 32, operands for an 8x8 tile a lane
source = "dp4a at 8 IDP4A a word (note:20261017T0310Z-report-eps1-program §3); its loads: 2(a + b)/(ab) LDS.128 a word at a = b = 8"

[routes]
lanes = true
uniform = true
