# Dither-2S: both operands dithered with fresh bits, no U, the last checked word served (SKIP's design A; the name,
# decision 79), so no peel on the linears, lm_head or QKᵀ; P·V keeps the recorded w64 peel.
name = "dither-2s"
title = "Dither-2S"
aliases = ["dither-two-sided", "A", "adopted-bd-lm"]
summary = "Two-sided dither serving the last checked word, duo at L = 32"
ppl = "adopted-bd-lm"

[noise]
linears = "two-sided"
lm_head = "two-sided"
qk = "two-sided"
pv = "peel"

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.2 }
source = "SPEC §3.4: two-sided {0,1} noise is fresh on both operands at every 32-step at every instance, so the register floor stays 1/b + 1/(2a), least 0.20 at (a, b) = (5, 10) (note:20261017T0324Z-draft-eps1-spec)"

[skip.served]
eps = 0.00327
source = "eps_budget.py (benchmarks/pouw, `design_skip`, `floor_skip`): Corollary D3's ε_skip, the skippable work at its model price over the floor program's bound B_♭ (SPEC §2.9, note:20261017T0324Z-draft-eps1-spec), the most over Llama-3.1-8B and 70B at 2K, 8K and 32K, every served output free (decode, by its products' compute, is below it); at 8B 2K prefill, P·V at BC-KERNEL r2's apv_l7qs, all of it free at a one-hot P row (CHECKED-STRIP Result 3; note:20261017T0340Z-draft-skip, 06:19Z): the peeled strip's tail at its issue model, 1.57 mainloop MACs a strip product (0.209%), the sums DG, S and X(0) at vsum's 35 instructions an entry (0.105%) and the served epilogue (0.013%) (note:20261017T0837Z-draft-bc-kernel-r2). With P·V's served output checked downstream it is 0.262% (8B) / 0.109% (70B). By honest time it is 0.557%: honest's latency above the model prices is γ's (note:20261017T0320Z-draft-eps1-calc Round 8)"
