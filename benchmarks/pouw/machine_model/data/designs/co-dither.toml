# CO-Dither: two-sided 0/1 dither, the served output committed as a checked word (note:20261017T0030Z-draft-checked-strip).
name = "co-dither"
summary = "CO-Dither at r = k/2 with a 7-bit served side (SKIP's B), duo at L = 32"
honest = "e-l7qs"
L = 32
work = 1.0
plain = 0.5         # the strip: k/2 products an output word on one int8 limb, unfolded (SKIP's `products`)

[operands]          # the noise's operand-delivery floor φ_del a MMA (`--operands floor`, and the floor program's)
floor = { LDSM_X4 = 0.025641 }
source = "SPEC §3.4: U on the peeled side is resident (B̃ a data-independent map of a resident matrix), so Dither's one-operand floor, least 1/39 at (a, b) = (1, 39) (note:20261017T0324Z-draft-eps1-spec)"

[fold]
name = "duo"
ALU = 2
IMAD = 1

[skip.pv-strip]
eps = 0.00052
source = "SKIP's design B over Llama-3.1-8B and 70B x 2K, 8K, 32K, prefill and decode, by honest time: one strip limb at r = k/2 leaves nothing on the linears and QKᵀ, and P·V's second limb as in A (prefill 0.052%, decode 0.047%) (note:20261017T0340Z-draft-skip, 04:20Z; at r = 32 the strip's second limb is unforced, 6.77%)"

[mand.fold]
eps = 0.0
source = "named assumption: duo at 3 lane instructions a word is the cheapest implementation of the fold (FOLD)"

[clock]
eps = 0.0
source = "DATASHEET: at the node's 2,100 MHz lock every program (honest at 519 W, tensor-only, zero operands, fold-only, FFMA) runs 2,099.5-2,100.0 MHz by clock64 over %globaltimer (note:20261017T0332Z-draft-eps1-datasheet, r20261017-033131-4e67)"

[luck]
delta = 9.094947017729282e-13
p = 0.75
checks = 121180
source = "note:20261016T0005Z-draft-luck-loss-round4 §2 (one week, γ_zk = 0.01, {±1})"

[baseline]          # honest's own lane program: its words belong to the baseline, not to ε (the brief §2)
name = "dp4a"
program = { IMAD = 8, LDS128 = 0.5 }   # lane instructions a word: 8 IDP4A at k = 32, operands for an 8x8 tile a lane
source = "dp4a at 8 IDP4A a word (note:20261017T0310Z-report-eps1-program §3); its loads: 2(a + b)/(ab) LDS.128 a word at a = b = 8"

[routes]
lanes = true
uniform = true
