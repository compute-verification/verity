# ε_adapt, SPEC's Theorem D under Daniel's one-σ order (05:07Z): the prover commits the circuit and its inputs, σ is
# drawn once, then the prover evaluates, so every operand is fixed before σ but enforced only by the sampled proofs, and
# a cheater can steer instances in unproved regions. Its size depends on the proof unit, a protocol choice
# (note:20261017T0324Z-draft-eps1-spec, final 05:34Z). `eps --adapt NAME` charges one; `default` is today's protocol.
default = "segment"

