# The per-family headline (`machine-model headline`, headline.py): each GPU family's design of record, the vector each
# reading prices it on, and the conditions its rows are stated under. Every number is computed from the design files
# and the vectors; what is written here is only which design, which vector, and the conditions no computation shows.
# The floor a row needs (½ or 1.22 slots) and its fillers' credit are computed and printed beside these. A design of
# record credits only work a check reads: the fold the served unit's Definition recomputes, and a filler at the theorem
# its check meets (decision 99; RT-LOGIC-12).
capacity = "ε is relative to the declared capacity, the reading's Π (decision 100): an error in Π is no term of ε"

[floor]             # (I3) ScalarRoute, the floor a vector- or table-headed word pays; a row names the one it needs
half = "the ½-slot floor ((I3) at q* = ½: Lean Accounting.SecurityProofs.TS.SheetScalarRouteHalf, from A6)"
issue = "the 1.22-slot issue floor (Theorem C, unproved in Lean: ClassPPacked is a stub, the per-opcode κ count not run)"

[reading.sheet]
title = "data sheet"
q = 0.5
conditions = ["Π the data sheet's peaks (DS vectors, A1–A5; decision 96)"]

[reading.measured]
title = "decision 89's measured reading"
q = 1.22
conditions = ["Π the measured census rows, the -ri vectors where they exist (decision 98; `current` stays DC-90 and DC-100)"]

[family.sm_120]
gpu = "RTX PRO 6000"
design = "dither-c-peel-fx1"
conditions = ["fx1 at 4 lane instructions a word is the cheapest fold (FOLD-OPT; ASSUME r2, #2289)"]
sheet = { vector = "DS-120" }
measured = { vector = "VF3r-16" }

[family.sm_90]
gpu = "H200"
design = "dither-2s-licpw-redux-p1-l32"
conditions = ["ffill is credited at p = 1: no check reads its chains (PouwWarpCheck's li absorbs H1's call words only; RT-LOGIC-12, decision 99)",
              "LI-CP-W, its checkpoint by REDUX or with the lane XOR in red.global.xor (REDG: a LOP3 and b REDG a segment, 2a + b ≥ 8; bit-exact on the H200, RT2-HOPPER-1), at their lane instructions a word, is the cheapest fold (FOLD-OPT, decision 94). The check reads the checkpoint word, so ♭ and the cheater fold by the routes' cheapest mix and honest's kernel by REDUX, γ unchanged: on DS-90 ♭ folds by 3 LOP3 + 2 REDG at 1.039 a word, and ε_machine first rises at 0.992, 4.5% under it (RT-HB-HEAD-2)",
              "LI-CP-W's receipt luck 0 needs every absorbed word pinned (PIN, decision 97)"]
sheet = { vector = "DS-90", conditions = ["A3 per SM clock, at the clock each tensor figure is stated at (SheetTensor; RT-H200-EMP-1): s8's 4096 MACs a SM-clock is the data sheet's figure over 132 SMs at the 1830 MHz tensor boost clock (H100 SXM5 whitepaper), and the H200's tensor lines are measured within 0.01% of the sheet's (r20261019-053910-d2c9). Read per second at f_max (1980 MHz, ×1.082 the figure's clock), A3 gives 3786 and this row is 2.780% (#2695's `sheet --eps` with REDG among the sheet's classes; 1.942% before the REDG routes): ε first moves with every tensor line 1.047× the sheet's, the tensor side of FOLD-OPT's 4.5% (MM-SHEETS)"] }
measured = { vector = "DC-90-ri", conditions = ["with ffill uncredited ♭ is LI-CP-W's alone, its checkpoint two thirds 3 LOP3 + 2 REDG and a third 8 REDG, and ε_machine is 0.047% (the cheater's words 99.95% on the tensor route); with ♭'s checkpoint at REDUX this row is 2.651% (the cheater's REDG checkpoint, RT2-HOPPER-1), and with no REDG route for either it was 1.263%. A check that reads ffill's chains would credit it and take DC-90-ri to 0.718% (RT-HB-HEAD-1)"] }

[family.sm_100]
gpu = "B200"
design = "dither-2s-licpw-redux-ldtm0-l32"
conditions = ["the fold credited is the one the checks read, plain LI-CP-W redux (PouwLiAbsorb_v2: no extra keyed round; RT-LOGIC-12)",
              "LI-CP-W, its checkpoint by REDUX or with the lane XOR in REDG (the H200's routes, untimed on the B200; RT2-HOPPER-1), at their lane instructions a word, is the cheapest fold (FOLD-OPT, decision 94): ♭ and the cheater fold by the routes' cheapest mix, and on DS-100 ε_machine first rises with ♭'s fold, 1.041 a word, at 0.499, 52% under it (RT-HB-HEAD-2)",
              "LI-CP-W's receipt luck 0 needs every absorbed word pinned (PIN, decision 97)"]
sheet = { vector = "DS-100", conditions = ["FOLD-OPT on DS-100 for li's XOR x ⊕ y ⊕ k (two words and a key, one LOP3): a 78-instruction IMAD-pipe program exists (33 IMAD, 45 IMAD.HI; bit-exact on the CPU and the B200; FOLD-XOR, #2769), and with it on the menu this row stays 0.6982%. With the REDG checkpoints on the menu the binding cheater's certificate is DS_issue ⅔ and DS_alu ⅓ (RT2-HOPPER-1), a LOP3 at 2 IMAD-pipe instructions, so the exact value rests only on no IMAD- or FP-pipe program for it of 1 instruction, and at 1, the fold at its instruction count alone, the row is 0.917%. This supersedes #2706's 'under 93 instructions' and the break-even of 62.5 with the checkpoint at REDUX (0.7163% at 40 instructions, 1.0068% at 3, 1.328% at the count alone)"] }
measured = { vector = "DC-100-ri" }

[family.sm_89]
gpu = "L40S"
design = "dither-2s-l16"
conditions = []
sheet = { vector = "DS-89", conditions = ["A2u: a uniform instruction takes an issue slot (in no vendor document; decision 84)"] }
measured = { vector = "ADA-89" }

[family.sm_80]
gpu = "A100"
design = "dither-2s-l16"
conditions = ["no uniform route in Π: sm_80's uniform datapath is unmeasured (EPS1 AMPERE; RT-DC r2)"]
sheet = { vector = "DS-80" }
measured = { vector = "AMPERE-80" }
