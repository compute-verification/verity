# The per-family headline (`machine-model headline`, headline.py): each GPU family's design of record, the vector each
# reading prices it on, and the conditions its rows are stated under. Every number is computed from the design files
# and the vectors; what is written here is only which design, which vector, and the conditions no computation shows.
# The floor a row needs (½ or 1.22 slots) and its fillers' credit are computed and printed beside these. A design of
# record credits only work a check reads: the fold the served unit's Definition recomputes, and a filler at the theorem
# its check meets (decision 99; RT-LOGIC-12).
capacity = "ε is relative to the declared capacity, the reading's Π (decision 100), which rests on accounting-declared-device (the auditor's inventory of the node): every GPU on the node declared, each the declared board and vBIOS, no SM clock above the top of that vBIOS's clock table; an error in Π is no term of ε"
scope = "ε is per node: an accepted window's node, its GPUs, host CPU and peer GPUs together, performed at least 1 − ε of the credited work; read per GPU, it needs LOC's host deduction (decision 37) and every billable GPU on the node credited each window (the README's \"The headline is per node\"; RT-SCOPE)"

[floor]             # (I3) ScalarRoute, the floor a vector- or table-headed word pays; a row names the one it needs
half = "the ½-slot floor ((I3) at q* = ½, from A6: proved in Lean as SheetScalarRouteHalf until the TS facet model's retirement)"
issue = "the 1.22-slot issue floor (Theorem C, unproved in Lean: its packed form is retired, the per-opcode κ count not run)"

[reading.sheet]
title = "data sheet"
q = 0.5
conditions = ["Π the data sheet's peaks (DS vectors, A1–A5; decision 96)"]
# stated on each row whose Π charges a uniform instruction on an issue row: no sheet gives a uniform rate, so without
# A2u the uniform route is free there (headline.py)
a2u = "A2u: a uniform instruction takes an issue slot (in no vendor document; decision 84; measured on sm_120 only, beside an issue-bound stream at 0.95 of issue, opcode_probe a2u.cu)"

[reading.measured]
title = "decision 89's measured reading"
q = 1.22
conditions = ["Π the measured census rows, the -ri vectors where they exist (decision 98; `current` stays DC-90 and DC-100)"]

[family.sm_120]
gpu = "RTX PRO 6000"
design = "dither-c-peel-fx1"
conditions = ["fx1 at 4 lane instructions a word is the cheapest fold (FOLD-OPT; ASSUME r2)"]
sheet = { vector = "DS-120" }
measured = { vector = "VF3r-16", conditions = ["not the retired Lean statement's reading: Sm120MeasuredHeadline reads VF3s-16 at q = q_T = 9/8 (0.591%; 7.791% at the ½ floor), because bit-exact census programs load VF3r-16's JI3s_0 at up to 1.0383, so (I1) on its rows is false (RT2-LOGIC-9); this row stays on VF3r-16 at 1.22 until the design records ε_skip at VF3s-16 and a reading takes a family's own q"] }

[family.sm_90]
gpu = "H200"
design = "dither-2s-licpw-redux-p1-l32"
conditions = ["ffill is credited at p = 1: no check reads its chains (PouwWarpCheck's li absorbs H1's call words only; RT-LOGIC-12, decision 99)",
              "LI-CP-W, its checkpoint by REDUX or by any bit-exact checkpoint loop the tree carries (the design's [fold_routes]: CP_SEG4, four segments' checkpoint words in one STG.128, and CP_SEG4U, one XOR a checkpoint on the uniform datapath, RT2-HOPPER-9, -11; rt3_dc's CP_ATS, CP_ATS2 and CP_ATS8 through shared-memory atomics, CP_RED, CP_RED2 and CP_RED8 through L2's, and CP_XT through a shared-memory transpose, RT3-DC-1, -4, bit-exact on the H200; and RT4-SHEET-7's CP_RED, CP_RED2 and CP_RED8 through a generic address, ATOM.E, bit-exact on the H200), at their instructions a word, is the cheapest fold (FOLD-OPT, decision 94). The loops' memory, control and warp-reduce classes cost one issue slot and no pipe row, the sound price (no row is asserted that nobody timed), and REDG32 also 290 SMSP-cycles on AT90, the L2's atomic row (RT2-HOPPER G5); ATOME32, the same reduction through a generic address, has no AT90 line (AT90 was timed on REDG alone), and on DC-90-ri the classes the H200 timed beside the IGMMA (ATOME32, ATOMS32, REDG32, LDS128, REDUX and the catch-all UNLISTED) carry the JI90 lines too. The check reads the checkpoint word, so the cheater folds by the routes' cheapest mix, the counted ones (none built: RT4-SHEET-13's and -14's moves of LI, li-bulk's BT1024 and trimmed W = ∞ members; the design's `counted`) among them, ♭ by the cheapest mix of the built ones (REDUX, the loops and li-bulk at its measured cost), and honest's kernel by REDUX, γ unchanged: on DS-90 ♭ folds by CP_RED2. FOLD-OPT has no slack as a premise (a fold cheaper than the cheapest route falsifies it); in the retired Lean bound a cheater whose every fold route is 0.058% cheaper takes DS-90 to 1% (RT3-DC-7; RT2-HOPPER-10: the 4.5% once quoted scaled ♭'s fold with the cheater's)",
              "LI-CP-W's receipt luck 0 needs every absorbed word pinned (PIN, decision 97)"]
sheet = { vector = "DS-90", conditions = ["A3 per SM clock, at the clock each tensor figure is stated at (SheetTensor; RT-H200-EMP-1): s8's 4096 MACs a SM-clock is the data sheet's figure over 132 SMs at the 1830 MHz tensor boost clock (H100 SXM5 whitepaper), and the H200's tensor lines are measured within 0.01% of the sheet's. Read per second at f_max (1980 MHz, ×1.082 the figure's clock), A3 gives 3786 and this row is 2.253% (`sheet --eps` with CP_SEG4 and CP_SEG4U on the menu): ε first moves with every tensor line 1.060× the sheet's (MM-SHEETS)"] }
measured = { vector = "DC-90-ri", conditions = ["with ffill uncredited ♭ is LI-CP-W's alone, its checkpoint by the built fold routes' cheapest mix (CP_RED2 and CP_RED8, global and generic tied, with ATOME32, REDUX and the loops' other classes the H200 timed beside the IGMMA on the JI90 lines:), its words all on the IGMMA; the cheater also folds by li-bulk's counted trimmed W = ∞ member, so ε_machine is 0.330% at q* = 1.22 and this row is over 1%. The retired Lean bound, at q = ½, is 1.412% (1.086% under (I3) at 3/5), with honest's IGMMA its one tensor form. A check that reads ffill's chains would credit it (RT-HB-HEAD-1)"] }

[family.sm_100]
gpu = "B200"
design = "dither-2s-licpw-redux-ldtm0-l32"
conditions = ["the fold credited is the one the checks read, plain LI-CP-W redux (PouwLiAbsorb_v2: no extra keyed round; RT-LOGIC-12)",
              "LI-CP-W, its checkpoint by REDUX or by any of the H200's bit-exact checkpoint loops, each bit-exact on the B200 too (RT2-HOPPER-9, -11, RT3-DC-1, -4) but RT4-SHEET-7's CP_RED, CP_RED2 and CP_RED8 through a generic address (ATOM.E, bit-exact on the B200), at their instructions a word, is the cheapest fold (FOLD-OPT, decision 94). Their memory and control classes cost one issue slot and no pipe row (the B200's census has no atomic row). ♭ and the cheater fold by the routes' cheapest mix (DS-100: CP_RED2 and CP_RED8; DC-100-ri: CP_RED2, which its generic twin ties on every row), honest by REDUX, γ unchanged. FOLD-OPT has no slack as a premise; in the retired Lean bound a cheater whose every fold route is 0.219% cheaper takes DS-100 to 1% (0.102% on DC-100-ri; RT3-DC-7; RT2-HOPPER-10: the 52% once quoted scaled ♭'s fold with the cheater's)",
              "LI-CP-W's receipt luck 0 needs every absorbed word pinned (PIN, decision 97)"]
sheet = { vector = "DS-100", conditions = ["FOLD-OPT on DS-100 for li's XOR x ⊕ y ⊕ k (two words and a key, one LOP3): no program of 1 or 2 instructions on DS-100's modelled IMAD/FP menu (IMAD, IMAD.HI, IDP.4A, IDP.2A and FFMA2; IMAD.WIDE, HFMA2 and the ALU class outside it) computes it bit-exactly for any k, a checked fact within that menu, not a proof over the B200 (FOLD-XOR k = 1; k = 2, all 1,456 two-instruction sequences unsat), so it takes at least 3; the cheapest known is 78 IMAD-pipe instructions (33 IMAD, 45 IMAD.HI; bit-exact on the CPU and the B200). At the retired Lean bound's π* (DS_issue ⅔ + DS_alu ⅓) a LOP3 costs 4/3 and an IMAD or FFMA ⅔, so FOLD-OPT there asks only that no 1-instruction program exists; with the whole certificate at DS_issue alone, li's XOR at its instruction count, which needs no pipe premise, the retired Lean bound is 0.9998%"] }
measured = { vector = "DC-100-ri" }

