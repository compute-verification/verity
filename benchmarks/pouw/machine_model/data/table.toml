# The table route: a fresh word made by register-indexed lookups (QSTAR). Below 2.03 issue slots a word on sm_120 a word
# must come from table loads, which at these sizes only L2 serves (fr16_c32: 1.906 measured). The LP prices such a word
# at q lane instructions in any CUDA mix plus `bytes` of L2 reads, against an L2 facet at `l2` bytes a second; honest's
# own L2 traffic is not charged, which gives the cheater all of L2. The values are SCALAR-ROUTE as restated
# (`--lookup-bytes 6` for single-field tables); `l2` is the most L2 has read in any pattern measured (FACET-BREAK: 7.10
# TB/s of coalesced L1-skipping reads, l2_g256cg_line_q16_w16), + 2%. A gather at fresh random rows is sector-bound at
# 3.85 TB/s (DATASHEET r5; FACET-BREAK's sector gather 3.87), which would price the route only if its lookups never
# share a sector.
status = "named assumption"
source = "SCALAR-ROUTE restated (a named assumption, resting on class P and ISA-CAP): a fresh word costs ≥ 2.03 issue slots, or ≥ 3.5 B of table loads and ≥ 1.22 slots (≥ 6.0 B for single-field tables); L2 at its measured 7.10 TB/s line + 2% (FACET-BREAK; QSTAR's 5–6 TB/s peak before), a random-row gather 3.85 TB/s (DATASHEET r5)"
