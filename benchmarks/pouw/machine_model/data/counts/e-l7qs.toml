# e_l7qs's executed warp instructions by census class as a closed form in the shape (verity_machine_model/counts.py):
# n_c = stage_c T k/128 + tile_c T + cross_c X + launch_c, T = (m/128)(n/128), X the raster's group crossings
# (`crossings`), at the 188 persistent CTAs of an RTX PRO 6000; `fit`'s
# coefficients on the observations below (ncu's SourceCounters, every SASS instruction's executions summed by class,
# WAIT left out), which `check` holds them to.
name = "e-l7qs"
kernel = "e_l7qs"
source = "PROFILE: ncu on e_l7qs at 18 shapes in 4 runs (22 observations), `eps_profile.py OUT --mm` (note:20261017T0444Z-draft-eps1-predict, r20261017-040135-d375 r20261017-041011-0965 r20261017-044318-93a5 r20261017-051201-3774); k2 fitted on 4 of its shapes and k3 on 3 predict the other observations within the tolerances below"
ctas = 188
tile = [128, 128, 128]
k3_above = 4096         # a longer k runs e_l7qs_k3 (the 3-atom peel)
shapes = [1024, 128, 256, 16128]   # egemm.cu's esetup: m % 1024 (the raster's groups), n % 128, k % 256, k <= 16128
exact = ["LDSM_X4", "MMA", "UTMA16K"]
bound_tolerance = 1e-4  # the model bound at n against at ncu's counts, relative

[tolerance]             # |ncu - n| <= tolerance n: the timing-dependent re-issues
default = 5e-3
ALU = 1e-4
IMAD = 1e-4
SEL = 5e-4
NOROW = 2e-3
UNI = 2e-3
VIMNMX = 1e-2           # 17 a tile, 0.001 a MMA: the per-tile re-issue at its largest

[variant.k2]               # the 2-atom peel
stage = { ALU = 4540.16, IMAD = 2051.05, LDSM_X4 = 256, MMA = 512, NOROW = 397.59, SEL = 36, UNI = 40.27, UTMA16K = 2 }
tile = { ALU = 3709.07, IMAD = 1404.1, IMADW = 80.53, LDSM_X4 = 128, MMA = 256, NOROW = 1189.03, SEL = 52.55, UNI = 460.07, UTMA16K = 2, VIMNMX = 17.15 }
cross = { ALU = 48.39, IMAD = -0.71, IMADW = -0.09, NOROW = 3.47, SEL = -0.03, UNI = -1.37, VIMNMX = -0.01 }
launch = { ALU = 82618, IMAD = 32761, IMADW = -94, NOROW = 89950, SEL = -879, UNI = 55658, VIMNMX = -211 }

[variant.k3]               # the 3-atom peel; cross is k2's (the same loop)
stage = { ALU = 4540.06, IMAD = 2051.02, LDSM_X4 = 256, MMA = 512, NOROW = 429.82, SEL = 36, UNI = 40.28, UTMA16K = 2 }
tile = { ALU = 3770.59, IMAD = 1424.36, IMADW = 80.82, LDSM_X4 = 192, MMA = 384, NOROW = 1028.3, SEL = 52.79, UNI = 460.26, UTMA16K = 2, VIMNMX = 17.2 }
cross = { ALU = 48.39, IMAD = -0.71, IMADW = -0.09, NOROW = 3.47, SEL = -0.03, UNI = -1.37, VIMNMX = -0.01 }
launch = { ALU = 99367, IMAD = 33464, IMADW = -102, NOROW = 94784, SEL = -826, UNI = 38327, VIMNMX = -208 }

