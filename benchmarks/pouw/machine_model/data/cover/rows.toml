# The coverage table (MODEL-COVER, CMP-166): the evidence for MODEL-MIN's one coverage premise, that every instruction a
# card executes is dominated by an envelope op (envelope.toml) at no fewer units of the same resource. It is evidence,
# not the trusted base: `machine-model cover` renders it, and tests/test_cover.py fails when an opcode has no row.
#
# A `[[row]]` covers the opcodes `ops` on `devices` (default both). With `forms` (regexes on the dotted SASS opcode) it
# covers only those forms, ahead of the plain row of its opcode; every opcode a device lists has a plain row there.
# `kinds` are the census kinds (regexes) it claims, `rate` the θ key (or a key a device) of its rate, `rate_value` a rate
# no θ key holds (MACs a SM-clock, logical for a sparse form) with its source, `fmt` a tensor row's weight class, and
# `units` a row's envelope units a warp instruction where it isn't one L unit a lane.
#
# Marks:
# - covered: dominated, and the rate the inequality reads is a document's or a run's, for this opcode or its pipe;
# - coarse: dominated by the argument stated, on a bound shared with other opcodes (a port, the issue slot, a tree of L
#   units), with no rate of its own;
# - hole: no argument yet that an envelope op dominates it; `severity` says how much it could matter;
# - absent: the opcode is in NVIDIA's family table, and the card can't execute it.
#
# The lowering probe is benchmarks/pouw/sass_census/lowering.sh (ptxas 13.0, sm_90a and sm_120a; no GPU).

# ---- tensor cores -----------------------------------------------------------------------------------------------------

[[row]]
ops = ["IMMA"]
forms = ['IMMA\.16832\..*']
what = "s8/u8 m16n8k32 (.SAT)"
kinds = ["IMMA16832.*", "MMA"]
mark = "covered"
envelope = "T"
fmt = "8"
rate = { sm_90 = "tensor.s8.k32.sync", sm_120 = "tensor.s8.k32" }
cost = "4,096 products × 1 = 4,096 T units a warp instruction"
argument = "each s32 output element is a function of its accumulator and a 32-element row and column (.SAT clamps it)"
source = "θ tensor.s8.k32 (census IMMA16832 M 16 SMSP-cycles, r20260930-111747-26f3); sm_90 θ tensor.s8.k32.sync"

