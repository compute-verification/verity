# The coverage table (MODEL-COVER, CMP-166): the evidence for MODEL-MIN's one coverage premise, that every instruction a
# card executes is dominated by an envelope op (envelope.toml: MODEL-MIN's `Accel.Op` and the entries MODEL-COVER
# proposes) at no fewer units of the same resource. It is evidence, not the trusted base: `machine-model cover` renders
# it, and tests/test_cover.py fails when an opcode has no row or a dominated row's rate exceeds its resource's ρ.
#
# A `[[row]]` covers the opcodes `ops` on `devices` (default both). With `forms` (regexes on the dotted SASS opcode) it
# covers only those forms, ahead of the plain row of its opcode; every opcode a device lists has a plain row there.
# `kinds` are the census kinds (regexes) it claims. `envelope` is the op that dominates it, with:
# - `pipe` for a `lane` or a `collective` (the row's resource is the pipe's), `resource` for a `move`, `atom` or `red` (a
#   store, or a list of them, one a rate), and `fmt` for an `mma` or `mmaSp` (a list is charged its largest weight);
# - `rate`, the θ key of the card's rate (a list, or one a device), or `rate_value` with its `rate_unit` where no θ key
#   holds it (a tensor row's is MACs a SM-clock, logical for a sparse form);
# - `units`, the op's units a warp instruction where it isn't 32 (a lane's or a word's);
# - `words`, a `lane`'s or a `collective`'s register words [in, out] a lane: at most its pipe's n_in and 2 out, or a
#   collective's 64 and 1.
# The test reads each rate in its op's units (a pipe's lanes, a store's words, tensor units at the format's weight) and
# fails a covered or coarse row whose rate exceeds its resource's ρ.
#
# Marks:
# - covered: dominated, and the rate the inequality reads is a document's or a run's, for this opcode or its pipe;
# - coarse: dominated by the argument stated, on a bound shared with other opcodes (a port, the issue slot), with no rate
#   of its own;
# - hole: no argument yet that an envelope op dominates it, or a run shows none does; `severity` says how much it could
#   matter;
# - absent: the opcode is in NVIDIA's family table, and the card can't execute it.
# A row whose op, pipe or format is a proposed entry rests on it: `machine-model cover` counts the table both ways, with
# the proposed entries and on `Accel.Op` alone (those rows as holes).
#
# Pipes: an opcode goes on the pipe a run or the CPG places it on. One that neither places goes on fma, marked coarse:
# fma charges only the issue slot every instruction takes, so a lane on it dominates any opcode of ≤ 4 words in and 2
# out, but RT's RM7 calls that a coarsening for an opcode a run places elsewhere.
#
# The lowering probe is benchmarks/pouw/sass_census/lowering.sh (ptxas 13.0, sm_90a and sm_120a; no GPU), and a row's
# "lowering probe" is its run r20261027-002822-0a69: 'verdict: 30/30 cases lower as expected'.

# ---- tensor cores -----------------------------------------------------------------------------------------------------

[[row]]
ops = ["IMMA"]
forms = ['IMMA\.16832\..*']
what = "s8/u8 m16n8k32 (.SAT)"
kinds = ["IMMA16832.*", "MMA"]
mark = "covered"
envelope = "mma"
fmt = "s8"
rate = { sm_90 = "tensor.s8.k32.sync", sm_120 = "tensor.s8.k32" }
cost = "4,096 products × 1 = 4,096 tensor units a warp instruction"
argument = "each s32 output element is a function of its accumulator and a 32-element row and column (.SAT clamps it)"
source = "θ tensor.s8.k32 (census IMMA16832 M 16 SMSP-cycles, r20260930-111747-26f3); sm_90 θ tensor.s8.k32.sync"

