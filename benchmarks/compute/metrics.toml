# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# it reads the served run of record's verifier side from the evidence store, so any CPU node with a --store-read key runs it
[[metric]]
id = "compute-accounting/verified-compute-share"
title = "Verified compute share"
owner = "compute-accounting"
unit = "share of multiply-adds"
axis = "Share of Llama 3.2 1B's multiply-adds that the verifier credits."
better = "higher"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/compute/run.py --from r20261106-165116-614b"
every = "7d"
goal = "compute-accounting/compute-share-climb"

# modeled from two recorded runs and the H200's card file, read from the evidence store, so any CPU node with a
# --store-read key runs it; one value a reading of the tensor clock (member clock.tensor, and clock.sm, the default)
[[metric]]
id = "compute-accounting/h200-capacity-credited-share"
title = "Honest prover's credited GPU capacity, modeled"
owner = "compute-accounting"
unit = "share of capacity"
axis = "Share of one H200's capacity at the data sheet's e4m3 ceiling that an honest Pearl+ prover is credited, modeled as its measured e4m3 rate over that ceiling times compute-accounting/verified-compute-share, at the card's sm clock and at its tensor clock."
better = "higher"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/compute/h200_share.py --from r20261106-165116-614b --duty r20261113-180927-646d"
every = "7d"
goal = "accounting/h200-97-percent"
