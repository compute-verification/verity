# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# run.py's three numbers are measured by a served run, serve.sh, whose last step (run.py --from its own run directory)
# writes them under that run, at the commit it ran: so their command is the served run itself, README.md's line. It takes
# a card and hours, past the default job, so the weekly rerun loop (infra/control/metrics_rerun.py) never launches it and
# its owner does; `run.py --from RUN` on a stored run is a reprint of that run's record, which writes no reading.
#
# RUN OF RECORD: r20261106-165116-614b, commit 4f816e9 (clean), the served run the h200 row reads: its command takes it
# as RUN_OF_RECORD, which its owner fills in from this line. The placeholder keeps the row off the weekly rerun loop,
# which launches no command that takes one, since it multiplies two stored runs' figures and so writes no reading. To move the row to another run, replace it in this line;
# tests/benchmarks/compute/test_compute.py holds the rows to these commands.

# the served run, on an idle H100 or H200 (serve.sh exits 3 on any other card)
[[metric]]
id = "compute-accounting/verified-compute-share"
title = "Verified compute share"
owner = "compute-accounting"
unit = "share of multiply-adds"
axis = "Share of Llama 3.2 1B's multiply-adds that the verifier credits."
better = "higher"
command = "research run --on NODE --project verity --source . --cwd clone --timeout 4h -- env WORK=/workspace bash benchmarks/compute/serve.sh"
every = "7d"
goal = "compute-accounting/benchmark-on-one-machine"

# the same run as the row above, by the same command, which writes all three: the share of the model's MACs Pearl+ can
# credit at the load, and the share of those its verifier credits, whose product is the row above
[[metric]]
id = "compute-accounting/creditable-share"
title = "Share Pearl+ can credit"
owner = "compute-accounting"
unit = "share of multiply-adds"
axis = "Share of Llama 3.2 1B's multiply-adds at the benchmark's load that Pearl+ can credit, its linears and its LM head where the run's passes hold the head's calls."
better = "higher"
command = "research run --on NODE --project verity --source . --cwd clone --timeout 4h -- env WORK=/workspace bash benchmarks/compute/serve.sh"
every = "7d"

[[metric]]
id = "compute-accounting/credited-of-creditable"
title = "Credited share of creditable work"
owner = "compute-accounting"
unit = "share of multiply-adds"
axis = "Share of the multiply-adds Pearl+ can credit in a served run that its verifier credits."
better = "higher"
command = "research run --on NODE --project verity --source . --cwd clone --timeout 4h -- env WORK=/workspace bash benchmarks/compute/serve.sh"
every = "7d"

# modeled from two recorded runs and the H200's card file, read from the evidence store, so any CPU node with a
# --store-read key runs it; one value a reading of the tensor clock (member clock.tensor, and clock.sm, the default)
[[metric]]
id = "compute-accounting/h200-capacity-credited-share"
title = "Honest prover's credited GPU capacity, modeled"
owner = "compute-accounting"
unit = "share of capacity"
axis = "Share of one H200's capacity at the data sheet's e4m3 ceiling that an honest Pearl+ prover is credited, modeled as its measured e4m3 rate over that ceiling times compute-accounting/verified-compute-share, at the card's sm clock and at its tensor clock."
better = "higher"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/compute/h200_share.py --from RUN_OF_RECORD --duty r20261113-180927-646d"
every = "7d"
goal = "accounting/h200-97-percent"
