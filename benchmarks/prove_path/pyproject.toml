# The prove path (prove_path.py). Not a package: the suite tests the advice's reading and the prover's and verifier's windows
# on the CPU TP stand-in (adapters/vllm's tests.pipeline.served_tp), without proving.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_kept_scan.py",
    "tests/test_prove_path.py",
    "tests/test_records_audit.py",
    "tests/test_run_request_values.py",
]
# `adapters/vllm`: advice_windows, the TP serving rows and the stand-in TP Commit the tests build; `benchmarks/one_stage`:
# a5, which prove_path imports; `verity`: what both import; `verity_numerical.bench`'s input sets and templates, which a5
# imports; `leak_scan.py`: the received-pieces scan served_tie_zk and served_statics_zk import.
inputs = ["verity", "adapters/vllm", "benchmarks/one_stage", "benchmarks/network_traces/leak_scan.py",
          "benchmarks/numerical/python/verity_numerical/__init__.py",
          "benchmarks/numerical/python/verity_numerical/bench/__init__.py",
          "verity/protocols/flock/prover/python/verity_flock/input_sets.py",
          "verity/protocols/flock/prover/python/verity_flock/subcircuit_templates.py",
          # the network certifier's run the certifier piece kept, which window-commit's scan reads (`kept_scan`):
          # certifier_piece and warden_chain, what they import, and the site.json and host.json that served_session and
          # auditor read on import
          "benchmarks/network_traces/certifier_piece.py", "benchmarks/network_traces/served_session.py",
          "benchmarks/network_traces/warden_chain.py", "benchmarks/network_traces/certifier_serve.py",
          "benchmarks/network_traces/warden_serve.py", "benchmarks/network_traces/active_replay.py",
          "benchmarks/network_traces/connection_rows_run.py",
          "benchmarks/network_traces/covert.py", "benchmarks/network_traces/replay.py",
          "benchmarks/network_traces/load_relay.py", "benchmarks/network_traces/stall_probe.py",
          "benchmarks/network_traces/site.json", "verity/composite/device/live_challenger/auditor.py",
          "verity/composite/device/live_challenger/host.json"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_prove_path.py"]
paths = ["verity"]

[[tool.verity.tests.reads]]
tests = ["tests/test_records_audit.py"]
paths = ["verity/definitions/ops"]
