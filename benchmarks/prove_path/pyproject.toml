# The prove path (prove_path.py). Not a package: the suite tests the advice's reading and the prover's and verifier's windows
# on the CPU TP stand-in (integrations/vllm's tests.pipeline.served_tp), without proving.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `integrations/vllm`: advice_windows, the TP serving rows and the stand-in TP Commit the tests build; `benchmarks/one_stage`:
# a5, which prove_path imports; `verity`: what both import; `verity_numerical.bench`'s input sets and templates, which a5
# imports; `leak_scan.py`: the received-pieces scan served_tie_zk and served_statics_zk import; the certifier piece's
# kept warden run, which window-commit's scan reads (`kept_scan`): certifier_piece and warden_chain, and what they import.
inputs = ["verity", "integrations/vllm", "benchmarks/one_stage", "benchmarks/network_traces/leak_scan.py",
          "benchmarks/network_traces/certifier_piece.py", "benchmarks/network_traces/served_session.py",
          "benchmarks/network_traces/warden_chain.py", "benchmarks/network_traces/certifier_serve.py",
          "benchmarks/network_traces/warden_serve.py", "benchmarks/network_traces/active_replay.py",
          "benchmarks/network_traces/covert.py", "benchmarks/network_traces/replay.py",
          "benchmarks/network_traces/load_relay.py", "benchmarks/network_traces/stall_probe.py",
          "benchmarks/live_challenger/auditor.py",
          "benchmarks/numerical/python/verity_numerical/__init__.py",
          "benchmarks/numerical/python/verity_numerical/bench/__init__.py",
          "benchmarks/numerical/python/verity_numerical/bench/input_sets.py",
          "benchmarks/numerical/python/verity_numerical/bench/templates.py"]
