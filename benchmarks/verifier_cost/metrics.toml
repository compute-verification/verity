[[metric]]
id = "proofs/verifier-seconds-served-description"
title = "Verifier time on circuit description"
owner = "proofs"
unit = "s"
axis = "Wall seconds of the Lean inference-only verifier on a CPU node reading Serve_v1's description at Llama 3.2 1B's sizes (16 layers, hidden 2048, vocabulary 128,256; B0's other constants) lifted to bits, best of three, a verifier that reads the description and never its unrolled gates; one line per configuration, its member naming the workload, the configuration, the lifting and the machine class, serve-v1-llama32-1b-boolean-cpu here and serve-v1-b0-boolean-cpu at B0's thirty layers."
better = "lower"
command = "research run --on auto --project verity --source . --cwd clone -- bash benchmarks/verifier_cost/job.sh measure --config llama32-1b --ir boolean"
every = "7d"
