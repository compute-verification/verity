[[metric]]
id = "proofs/verifier-seconds-served-description"
title = "Verifier time on circuit description"
owner = "proofs"
unit = "s"
axis = "Wall seconds of the Lean inference-only check on Serve_v1's thirty-layer B0 configuration lifted to bits, best of three, a check that reads the description and never its unrolled gates; each configuration run is listed beside it as a member."
better = "lower"
command = "research run --on auto --project verity --source . --cwd clone --cpus 16 --mem-gb 64 --timeout 3h -- bash benchmarks/verifier_cost/job.sh measure --config b0 --ir boolean"
every = "7d"
