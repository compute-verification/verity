# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# modeled: the formula evaluated in the run at the Lean's numerals, no measurement
[[metric]]
id = "compute-accounting/flock-session-knowledge-error"
title = "Flock session knowledge error, modeled"
owner = "compute-accounting"
unit = "log2 probability"
axis = "The log2 of one Flock zero-knowledge session's knowledge error at one table against a prover of 2^80 SHA-512 calls, the first row of the served error terms, modeled from NumbersDeploy's numerals under StrictBirthday and ListWithin."
better = "lower"
command = "research run --on auto --cwd source -- bash -c 'uv sync -q --all-packages --extra torch-cpu && uv run python benchmarks/served_errors/run.py'"
every = "7d"
