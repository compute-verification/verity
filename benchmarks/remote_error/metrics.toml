# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# Each is written for each fleet's week, month and year; the world's month, the one each id names, is written last.
[[metric]]
id = "soundness/remote-spot-crypto-error-log2"
title = "SPOT cryptography fooled"
owner = "soundness"
unit = "log₂ of error"
axis = "Log₂ of SPOT's cryptographic error in the remote application over the world's month, against the world's GPUs' SHA-512 calls: bound's formula proved in Lean under four open premises; value evaluated in Python; SPOT's part only, with PoUW (Pearl+) and the inference-only policy open and not in the total."
better = "lower"
command = "research run --on auto --cwd source -- uv run python benchmarks/remote_error/run.py"
every = "30d"

[[metric]]
id = "soundness/remote-spot-crypto-error-share-log2"
title = "SPOT cryptography per window"
owner = "soundness"
unit = "log₂ of error a machine-window"
axis = "Log₂ of SPOT's cryptographic error in the remote application over the world's month a machine-window audited: bound's formula proved in Lean under four open premises; value evaluated in Python; SPOT's part only."
better = "lower"
command = "research run --on auto --cwd source -- uv run python benchmarks/remote_error/run.py"
every = "30d"
