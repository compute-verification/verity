description = "FP4-g1 W4A8, served, GPTQ weights: the weights the whole E2M1 grid as integers (twice its values) in blocks of 16 with any UE4M3 integer scale m to 10 and one FP32 scale per output row, each the nearest level in row units moved by a fair coin of 1 and centred (m q + u - 1/2); the activations Dither-2S's int8 (floor plus a fair bit, per token), the linears' levels by GPTQ; on every linear and lm_head (each coin a fair bit a call (live in the design, seeded here), Dither-2S's, so the one int8 GEMM is the credited and served one, its rank-one terms taken off in the epilogue), after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); Dither-2S's int8 attention (run on the format by C1)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "native"
grid = "e2m1x2"
scale = "nvi10"
act = "dither"
weight = "g1"
act_grid = "int8"
gptq = true

[[linear]]
step = "native"
grid = "e2m1x2"
scale = "nvi10"
act = "dither"
weight = "g1"
act_grid = "int8"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
