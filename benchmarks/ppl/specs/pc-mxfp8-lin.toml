description = "format baseline in C2's scope, no PoUW: MXFP8: E4M3 in blocks of 32 along k with E8M0 scales on every linear and lm_head, rounded to nearest, products in FP32; attention plain int8 as in pc-int8; after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too), keys centred"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "fp"
fmt = "e4m3"
scale = "mx"

[[linear]]
step = "fp"
fmt = "e4m3"
scale = "mx"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
p_sink = true
