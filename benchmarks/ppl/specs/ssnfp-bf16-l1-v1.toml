description = "served sparse noise on the H200's BF16 MMA, binade-pinned (ssnfp): the linears' operands rounded to BF16, each row's accumulator at 1.5 2^p with p from the row's l1 bound, each k16 step's products truncated to 2^(p - 25) and the step's sum to 2^(p - 23) as the 26-bit adder and the 24-bit word do, and the +-1 coin lanes' noise served at 2^(p - 23); lm_head and attention bf16"
plain = "int8-channel127-v1"

[[linear]]
step = "ssnfp"
fmt = "bf16"
bound = "l1"
