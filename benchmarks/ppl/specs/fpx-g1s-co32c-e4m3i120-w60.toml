description = "FP8-g1 on co32c (Dither-C's 7-bit weights and attention; not H1, whose weights are +-110 and attention +-111: fpx-g1h-e4m3i120-w104), served: activations on E4M3's integers up to 120 per token, weights on those up to 60 per output row (moved by one they stay in co32c's 7-bit weight range, 63), on every linear and lm_head, each operand the nearest level moved by a fair coin of 1 and centred (q + b - 1/2) (the coin is co32c's operand bit, so the one int8 GEMM of the integers m q + b is the credited and served one, its rank-one terms taken off in the epilogue), after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); co32c's attention (cohalf Q K^T on 7 bits, P V as in adopted)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "native"
grid = "e4m3i60"
act_grid = "e4m3i120"
scale = "channel"
act = "g1"
weight = "g1"

[[linear]]
step = "native"
grid = "e4m3i60"
act_grid = "e4m3i120"
scale = "channel"
act = "g1"
weight = "g1"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
q_top = 63
k = "dither"
k_top = 63
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
