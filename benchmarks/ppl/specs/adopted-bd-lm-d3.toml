description = "adopted-bd-lm with a 3-bit dither: every coin on the linears, lm_head, Q and K is R uniform on {0..7}, served as floor(x / s) - 3 + R (the 1-bit dither's mean given x); the linears' scales absmax / 123 (served within [-126, 127]), Q's and K's keep x / s in [-125, 124) (served within [-128, 127]); V keeps its bit"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
dither_bits = 3

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
dither_bits = 3
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
qk_bits = 3
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
