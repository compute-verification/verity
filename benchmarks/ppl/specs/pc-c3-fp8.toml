description = "C3: Dither's 1-bit coins on the format's grid, every linear and lm_head: hybrid: Dither-2S's int8 activations (two E4M3 limbs, 2 products) against weights dithered on E4M3's integers per output row, after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); Dither-2S's int8 attention (run on the format by C1)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "native"
grid = "e4m3i"
scale = "channel"
act_grid = "int8"

[[linear]]
step = "native"
grid = "e4m3i"
scale = "channel"
act_grid = "int8"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
