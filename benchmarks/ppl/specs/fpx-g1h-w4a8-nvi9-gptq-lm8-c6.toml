description = "FP4-g1 W4A8 on H1 (co32c-u16-cohalf, the RTX PRO 6000's record), served, GPTQ weights, lm_head in FP8: the weights the whole E2M1 grid as integers (twice its values) in blocks of 16 with any UE4M3 integer scale m to 9 and one FP32 scale per output row (9 * 12 = 108 inside H1's weights, +-110; with their coin and H1's U on +-16 they stay in s8, 108 + 1 + 16), each the nearest level in row units moved by a fair coin of 1 and centred (m q + u - 1/2), by GPTQ; the activations H1's int8 (floor plus a fair bit, per token, to 126); lm_head FP8-g1 on H1 (activations E4M3's integers to 120, weights to 104) (each coin a fair bit a call (live in the design, seeded here), the record's operand bit, so the one int8 GEMM is the credited and served one, its rank-one terms taken off in the epilogue), after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); H1's attention (co32c-u16-cohalf's: cohalf Q K^T with Q and K dithered within +-111, P V as in adopted); every per-row scale (each token's and weight row's) the best of six clip ratios to 0.7 (squared error), the honest quantizer's choice"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "native"
grid = "e2m1x2"
scale = "nvi9"
act = "dither"
weight = "g1"
act_grid = "int8"
gptq = true
clip = 6

[[linear]]
step = "native"
grid = "e4m3i104"
act_grid = "e4m3i120"
scale = "channel"
act = "g1"
weight = "g1"
linears = ["lm_head"]
clip = 6

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
q_top = 111
k = "dither"
k_top = 111
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
