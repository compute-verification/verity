description = "vLLM's plain int8 step: the linears on int8, activations one scale per token (amax / 127) and weights one per row (top 127), rounded, no rotation, lm_head bf16; attention unrotated, Q per (head, token), P per row on [0, 127], V per channel, rounded; the LUT softmax with the sink its own block: key 0 out of the max and K's key 0 on its own scale, the head's from keys 1..s-1 of the window, L over a table 2^7 finer (P = e on [0, 127] as before)"

[[linear]]
step = "int8"

[[attention]]
step = "int8"
k_scale = "head"
k_sink = true
softmax = "lut"
lut_sink = true
lut_norm = 7
