description = "format baseline, no PoUW: FP8 E4M3, one scale per tensor, every matmul (linears, lm_head, both attention matmuls) rounded to nearest, products in FP32, after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too), keys centred"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "fp"
fmt = "e4m3"
scale = "tensor"

[[linear]]
step = "fp"
fmt = "e4m3"
scale = "tensor"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "fp"
fmt = "e4m3"
scale = "tensor"
