description = "C1: Dither-2S (adopted-bd-lm) run exactly on FP4 hardware by limb splitting, three balanced base-8 E2M1 digits per operand, 9 products at weights 8^n (block scales); every int8 product (linears, lm_head, QK and PV) recomputed from the planes, gated equal, and served"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
linears = ["lm_head"]

[[linear]]
step = "emulate"
route = "fp4-k9"

[[linear]]
step = "emulate"
route = "fp4-k9"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64

[[attention]]
step = "emulate"
route = "fp4-k9"
