description = "co32c-u16-cohalf (H1) with the LUT softmax with key 0 out of its max (m over keys 1..pos, key 0's weight against it), K per (layer, KV head) from the window's keys"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 111

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 111
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
q_top = 111
k = "dither"
k_top = 111
k_scale = "head"
softmax = "lut"
lut_sink = true
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
