description = "adopted-bd-lm-pv with P in blocks of 1024 keys (p_block = 1024, key 0 its own block): each block its own scale and strip, which bounds the fresh bit c's noise to half a step of the block's peak (gamma_PV about 1.09)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
p = "dither"
p_block = 1024
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
