description = "adopted-bd-lm (design A) with P·V as CO-Dither serves it: P round(P / s) + c on [0, 127], c a fresh bit where key <= query, its mean taken off in the epilogue, under the w64 peel; V dithered on 8 bits; everything else as adopted-bd-lm"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
p = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
