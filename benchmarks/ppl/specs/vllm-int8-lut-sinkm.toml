description = "vLLM's plain int8 step: the linears on int8, activations one scale per token (amax / 127) and weights one per row (top 127), rounded, no rotation, lm_head bf16; attention unrotated, Q per (head, token), P per row on [0, 127], V per channel, rounded; the LUT softmax with key 0 out of its max (m over keys 1..pos, key 0's weight against it), K per (layer, KV head) from the window's keys"

[[linear]]
step = "int8"

[[attention]]
step = "int8"
k_scale = "head"
softmax = "lut"
lut_sink = true
