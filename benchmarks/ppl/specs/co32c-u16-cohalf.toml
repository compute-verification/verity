description = "co32c-u16-cohalf (H1): Dither-2S's served values with the weights capped for a narrow peeled U on [-16, 16] (co32c's committed strip digits, U of width 33 instead of 129): linears and lm_head weights dithered within +-111 (served [-110, 111]), activations dithered on 8 bits; Q K^T as Dither-C's cohalf with its U on [-16, 16]: Q and K dithered within +-111; P V as in adopted-bd-lm"

