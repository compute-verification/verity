description = "co32c-u16-cohalf (H1) with the LUT softmax with the sink its own block: key 0 out of the max and K's key 0 on its own scale, the head's from keys 1..s-1 of the window, L over a table 2^7 finer (P = e on [0, 127] as before)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 111

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 111
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
q_top = 111
k = "dither"
k_top = 111
k_scale = "head"
k_sink = true
softmax = "lut"
lut_sink = true
lut_norm = 7
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
