description = "co32c-u16-cohalf (H1) with K one scale per (layer, KV head) from keys 1..s-1 of the window and key 0 on its own scale, float softmax: the float control of the LUT softmax with the sink its own block"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 111

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 111
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
q_top = 111
k = "dither"
k_top = 111
k_scale = "head"
k_sink = true
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
