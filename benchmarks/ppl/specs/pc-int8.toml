description = "plain int8: every matmul (linears, lm_head, attention) rounded to int8, one scale per token and per output row (P per row, key 0 alone), after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too), keys centred; no PoUW"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"

[[linear]]
step = "int8"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
p_sink = true
