description = "C1: Dither-2S (adopted-bd-lm) run exactly on E4M3 hardware by limb splitting, two E4M3 limbs per operand, the Karatsuba 3-product route (15 (P00 + P22) + 16 P11); every int8 product (linears, lm_head, QK and PV) recomputed from the planes, gated equal, and served"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
linears = ["lm_head"]

[[linear]]
step = "emulate"
route = "e4m3-k3"

[[linear]]
step = "emulate"
route = "e4m3-k3"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64

[[attention]]
step = "emulate"
route = "e4m3-k3"
