description = "adopted-bd-lm-d2 with the linears' and lm_head's activations rounded on +-127: only their weights dithered; everything else as in adopted-bd-lm-d2 (2-bit coins on every dithered operand of the linears, lm_head, Q and K)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "round"
weight = "dither"
dither_bits = 2

[[linear]]
step = "int8"
act = "round"
weight = "dither"
dither_bits = 2
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
qk_bits = 2
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
