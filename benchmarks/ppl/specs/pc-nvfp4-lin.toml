description = "format baseline in C2's scope, no PoUW: NVFP4: E2M1 in blocks of 16 along k with UE4M3 scales and one FP32 scale per tensor on every linear and lm_head, rounded to nearest, products in FP32; attention plain int8 as in pc-int8; after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too), keys centred"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "fp"
fmt = "e2m1"
scale = "nv"

[[linear]]
step = "fp"
fmt = "e2m1"
scale = "nv"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
p_sink = true
