description = "adopted-bd-lm-d2 with the 2-bit coins on Q and K only (x / s in [-127, 126)); the linears, lm_head and V keep their bits: where the 2-bit cost sits"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
qk_bits = 2
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
