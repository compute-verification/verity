description = "wide noise on every product: the linears as ncp (NCP-INT's exact product of 7-bit operands), Q K^T as co (CO-Dither at r = d/2: Q 7-bit plus a fresh bit, K dithered on 7 bits), P V as adopted (P's w64 peel, V dithered); SmoothQuant, rotations, kc and psink as in adopted"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "int8"
act_top = 63
weight_top = 63

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
q_top = 63
k = "dither"
k_top = 63
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
