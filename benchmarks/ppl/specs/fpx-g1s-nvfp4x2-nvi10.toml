description = "FP4-g1, served: the whole E2M1 grid as integers (twice its values) in blocks of 16 with any UE4M3 integer scale m to 10, one FP32 scale per token and per output row, on every linear and lm_head, each operand the nearest level in row units moved by a fair coin of 1 and centred (m q + b - 1/2) (the coin, a fair bit a call (live in the design, seeded here), is Dither-2S's, so the one int8 GEMM of the integers m q + b is the credited and served one, its rank-one terms taken off in the epilogue), after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); Dither-2S's int8 attention (run on the format by C1)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "native"
grid = "e2m1x2"
scale = "nvi10"
act = "g1"
weight = "g1"

[[linear]]
step = "native"
grid = "e2m1x2"
scale = "nvi10"
act = "g1"
weight = "g1"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
