description = "adopted-bd-lm-d4 with the linears' and lm_head's weights rounded on +-127 (no U): only their activations dithered; everything else as in adopted-bd-lm-d4 (4-bit coins on every dithered operand of the linears, lm_head, Q and K)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "round"
dither_bits = 4

[[linear]]
step = "int8"
act = "dither"
weight = "round"
dither_bits = 4
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
qk_bits = 4
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
