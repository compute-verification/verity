description = "FP8-g1's served path: E4M3's integers up to 120 (0..16, then E4M3's spacing; moved by one they stay in int8) per token and per output row on every linear and lm_head, both operands rounded to nearest (the gap-one twin is peeled off in the proof), after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); Dither-2S's int8 attention (run on the format by C1)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "native"
grid = "e4m3i120"
scale = "channel"
act = "round"
weight = "round"

[[linear]]
step = "native"
grid = "e4m3i120"
scale = "channel"
act = "round"
weight = "round"
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
