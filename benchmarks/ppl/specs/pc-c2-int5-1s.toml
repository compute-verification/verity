description = "C2: int5 one-sided (fp8-peel-w15's design), every linear and lm_head: activations dithered on -16..16 per token, weights rounded to +-15 per output row, served W + U with U in {0, 1} and peeled exactly, after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); Dither-2S's int8 attention (run on the format by C1)"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
act_top = 16
weight_top = 15

[[linear]]
step = "int8"
act = "dither"
act_top = 16
weight_top = 15
linears = ["lm_head"]

[[linear]]
step = "peel"
alphabet = "bit"
top = 16

[[linear]]
step = "peel"
alphabet = "bit"
top = 16
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
