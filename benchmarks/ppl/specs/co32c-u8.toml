description = "co32c-u8: Dither-2S's served values with the weights capped for a narrow peeled U on [-8, 8] (co32c's committed strip digits, U of width 17 instead of 129): linears and lm_head weights dithered within +-119 (served [-118, 119]), activations dithered on 8 bits; Q K^T both dithered on 8 bits (last checked word served); P V as in adopted-bd-lm"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 119

[[linear]]
step = "int8"
act = "dither"
weight = "dither"
weight_top = 119
linears = ["lm_head"]

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
