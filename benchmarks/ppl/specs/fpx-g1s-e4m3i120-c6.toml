description = "FP8-g1, served: E4M3's integers up to 120 per token and per output row on every linear and lm_head, each operand the nearest level moved by a fair coin of 1 and centred (q + b - 1/2) (the coin, a fair bit a call (live in the design, seeded here), is Dither-2S's, so the one int8 GEMM of the integers m q + b is the credited and served one, its rank-one terms taken off in the epilogue), after SmoothQuant 0.5 (kv_shared) and the rotations (lm_head rotated too); Dither-2S's int8 attention (run on the format by C1); every per-row scale (each token's and weight row's) the best of six clip ratios to 0.7 (squared error), the honest quantizer's choice"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "rotate"
linears = ["lm_head"]

[[linear]]
step = "native"
grid = "e4m3i120"
scale = "channel"
act = "g1"
weight = "g1"
clip = 6

[[linear]]
step = "native"
grid = "e4m3i120"
scale = "channel"
act = "g1"
weight = "g1"
linears = ["lm_head"]
clip = 6

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q = "dither"
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
