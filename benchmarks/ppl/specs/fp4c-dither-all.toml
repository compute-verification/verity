description = "FP4-contiguous (E2M1's ±2 in steps of 0.5, 9 levels) on both operands of every matmul, dithered (the level below or above by a fresh bit): the linears after SmoothQuant 0.5 and the rotation, attention rotated with centered keys and no key blocks"

[[linear]]
step = "smooth"
alpha = 0.5
