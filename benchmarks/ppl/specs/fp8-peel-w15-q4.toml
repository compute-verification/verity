description = "fp8-peel-w15 with the activations' dither on a coin-chosen 0.25 of every k64 word's positions, rounded on the same scale elsewhere; weights rounded to +-15 per output row, served W + U with U in {0, 1} on every position (period 32 in k) and peeled exactly, after SmoothQuant 0.5 and the rotation; the adopted int8 attention"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "int8"
act = "dither"
act_top = 16
weight_top = 15
density = 0.25

[[linear]]
step = "peel"
alphabet = "bit"
top = 16

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q_top = 63
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "q"
width = 64

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
