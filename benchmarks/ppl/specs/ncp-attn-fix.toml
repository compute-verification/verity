description = "ncp-v1's served linears with both attention matmuls on NCP's int7 domain and their fixes: Q K^T after a random Hadamard R of the head dimension, Q and K one scale per (head, token) on ±63; P on [0, 127], one scale per query row, served as P - 64 on NCP's int7 domain [-64, 63] and the offset added back exactly as 64 times V's causal prefix sum, with key 0 (the attention sink) in a P block of its own, read and scaled on its own; V one per (KV head, channel) on ±63; lm_head bf16"
plain = "int8-channel127-v1"

[[linear]]
step = "int8"
act_top = 63
weight_top = 63

[[attention]]
step = "rotate"
matmuls = ["qk"]

[[attention]]
step = "int8"
q_top = 63
k_top = 63
p_top = 127
v_top = 63
p_sink = true
