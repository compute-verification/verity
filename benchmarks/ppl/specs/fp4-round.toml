description = "the full E2M1 grid (0, ±0.5 … ±6) on both operands of every linear, rounded to the nearest level, after SmoothQuant 0.5 and the rotation; the adopted int8 attention"

[[linear]]
step = "smooth"
alpha = 0.5
kv_shared = true

[[linear]]
step = "rotate"

[[linear]]
step = "grid"
grid = "fp4"
act = "round"
weight = "round"

[[attention]]
step = "rotate"

[[attention]]
step = "center_keys"

[[attention]]
step = "int8"
q_top = 63
k = "dither"
v = "dither"
p_sink = true

[[attention]]
step = "peel"
operand = "q"
width = 64

[[attention]]
step = "peel"
operand = "p"
width = 64
offset = 64
