# The DSA indexer's canonical top-k (README.md). Not a package: the plugin and the stress run in a node's pinned vLLM venv;
# the suite tests the canonical row against the registered relation, the torch reference against it, the wrappers'
# dispatch on stand-in ops, and, where Triton is importable, the kernels in Triton's interpreter.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test_dsa_topk holds the canonical row to the registered relation's top-k set (verity.definitions.registry.dsa_topk)
inputs = ["verity/__init__.py", "verity/errors.py", "verity/circuits", "verity/definitions/kernels/__init__.py",
          "verity/definitions/kernels/tc.py", "verity/definitions/__init__.py", "verity/definitions/evidence.py",
          "verity/definitions/evidence.json", "verity/definitions/registry/__init__.py",
          "verity/definitions/registry/dsa_topk.py", "verity/definitions/registry/prims.py",
          "verity/definitions/circuits", "verity/definitions/ops", "verity/definitions/silicon"]
