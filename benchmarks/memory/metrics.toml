# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "memory-accounting/node-read-rate-uncertified"
title = "Llama 3.2 1B served on one node: the share of the node's memory read rate one session leaves uncertified, at the data sheet's read bandwidth"
owner = "memory-accounting"
unit = "share of the node's memory read rate left uncertified, at the data sheet's read bandwidth"
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/memory/run.py --from FIRE_RUN"
every = "7d"
goal = "memory-accounting/share-to-target"
