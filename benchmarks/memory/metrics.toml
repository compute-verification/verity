# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "memory-accounting/node-read-rate-uncertified"
title = "Uncertified memory reads"
owner = "memory-accounting"
unit = "share"
axis = "Share of a node's memory read rate that one session leaves uncertified, serving Llama 3.2 1B."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/memory/run.py --from FIRE_RUN"
every = "7d"
goal = "memory-accounting/share-to-target"

[[metric]]
id = "memory-accounting/one-machine-read-rate-uncertified"
title = "Uncertified memory reads, one card"
owner = "memory-accounting"
unit = "share"
axis = "Share of one card's memory read rate, at its own data sheet, that one session on one machine leaves uncertified, serving Llama 3.2 1B."
better = "lower"
command = "research run --on vy-spot-glm53 --project verity --source . --cwd source -- uv run python benchmarks/memory/run.py --local"
every = "7d"
goal = "memory-accounting/benchmark-on-one-machine"
