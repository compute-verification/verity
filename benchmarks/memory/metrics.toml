# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "memory-accounting/node-read-rate-uncertified"
title = "Uncertified memory reads"
owner = "memory-accounting"
unit = "share"
axis = "Share of a node's memory read rate that one session leaves uncertified, serving Llama 3.2 1B at two engine steps a second."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/memory/run.py PERIOD"
every = "7d"
goal = "memory-accounting/share-to-target"

[[metric]]
id = "memory-accounting/one-machine-read-rate-uncertified"
title = "Uncertified memory reads, one card"
owner = "memory-accounting"
unit = "share"
axis = "Share of one card's memory read rate, at its own data sheet, left uncertified while the card's memory is read in timed passes beside a served Llama 3.2 1B at two engine steps a second, one session on one machine."
better = "lower"
command = "research run --on NODE --gpus 1 --project verity --source . --cwd clone -- uv run python benchmarks/memory/run.py --local"
every = "7d"
goal = "memory-accounting/benchmark-on-one-machine"

[[metric]]
id = "memory-accounting/one-card-pass-time"
title = "One audit pass, one card"
owner = "memory-accounting"
unit = "ms a pass"
axis = "Median time of one timed pass over the store on one card's memory, beside a served Llama 3.2 1B at two engine steps a second, as the prover's calibration reports it; each point's member is its model and card."
better = "lower"
command = "research run --on NODE --gpus 1 --project verity --source . --cwd clone -- uv run python benchmarks/memory/run.py --local"
every = "7d"

[[metric]]
id = "memory-accounting/one-card-bare-read-rate"
title = "Bare read rate, one card"
owner = "memory-accounting"
unit = "TB a second"
axis = "Rate of the calibration's bare read of the store on one card's memory, as the prover reports it, in the session whose pass time beside it is measured; each point's member is its model and card."
better = "higher"
command = "research run --on NODE --gpus 1 --project verity --source . --cwd clone -- uv run python benchmarks/memory/run.py --local"
every = "7d"
