# The remote bandwidth audit's verifier on its auditor host: `host.py`, the gate every key of the host's research is
# forced to, and the run, replay and store put its units run as `auditor` (pods/nebius/verifier/). Not a package: the suite runs the
# gate in this process with its root steps (chown, systemctl) injected, holds its whitelist to verifier.py's own parser, and runs a
# run through `tests/stub_verifier.py` (a real session over the remote audit's in-process harness, `test_session.run`, at the
# paths the gate's command line names), whose record `fetch` ships and `replay` replays through both verifiers.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/profile.py", "verity/core/protocols/remote_bandwidth", "verity/ml/__init__.py",
          "verity/ml/circuits", "verity/ml/crypto", "verity/ml/commitments", "verity/ml/randomness",
          # the Lean verifier a session runs beside audit.Session, and the difftest a replay serves: their Lake packages
          "verity/core/service/flock/Flock", "verity/core/service/flock/lakefile.toml",
          "verity/core/service/flock/lake-manifest.json", "verity/core/service/flock/lean-toolchain",
          "verity/core/primitives/randomness", "verity/core/difftest/lean", "verity/core/difftest/python",
          # challengers.py's gate client, which verifier.py builds for --challenger gate
          "verity/core/claims/__init__.py", "verity/core/protocols/sampled_proofs",
          # verifier.py and its in-process harness, which the stub verifier runs
          "benchmarks/remote_session",
          # auditor_line.py --boundary, which the stub verifier's run is read with: the network certifiers' records and audit
          "verity/core/protocols/certifier", "verity/ml/protocols/__init__.py", "verity/ml/protocols/certifier",
          # the challenger's tunnel client, whose forced pty the challenger's tunnel key allows
          "benchmarks/live_challenger/serve.py",
          # the host's deployed files (the configuration the gate reads, the tunnel's ports), and the store's client its
          # publish imports from the pinned tree
          "tools/research/src/research"]
