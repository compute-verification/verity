# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# both arms in one run (run.sh): the stand-in arm on the node's CPUs, the model arm on one leased card of the node its
# owner picks, within its lease's 50 minutes
[[metric]]
id = "network-accounting/attester-added-first-byte"
title = "Network attester's wait to first byte"
owner = "network-accounting"
unit = "ms"
axis = "The mean extra time to a response's first byte through the network attester over straight to the endpoint, at four fifths of its stated capacity under the application's schedule, a line for each endpoint, the stand-in on a CPU and a model on a card: the schedule delays every response by its delay on purpose, so the number is what a request waits in all beyond the endpoint's own time."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source --as network-accounting --timeout 60m -- bash benchmarks/attester_load/run.sh --on CARD --cores CORES"
every = "7d"

[[metric]]
id = "network-accounting/attester-added-last-byte"
title = "Network attester's wait to last byte"
owner = "network-accounting"
unit = "ms"
axis = "The mean extra time to a response's last byte through the network attester over straight to the endpoint, at four fifths of its stated capacity under the application's schedule, a line for each endpoint, the stand-in on a CPU and a model on a card: the schedule releases a response's cells at set buckets on purpose, so the number is what a request waits in all beyond the endpoint's own time."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source --as network-accounting --timeout 60m -- bash benchmarks/attester_load/run.sh --on CARD --cores CORES"
every = "7d"

[[metric]]
id = "network-accounting/attester-tick-lateness"
title = "Network attester's late ticks"
owner = "network-accounting"
unit = "ms"
axis = "The 99th percentile of how late the network attester's ticks run at the full capacity its schedule states, a line for each endpoint, the stand-in on a CPU and a model on a card, the device's own cost of carrying that load: past its slack a tick faults and the stated capacity is not carried."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source --as network-accounting --timeout 60m -- bash benchmarks/attester_load/run.sh --on CARD --cores CORES"
every = "7d"
