# This directory's numbers, one [[metric]] each, by the rules of tests/test_metrics_registry.py,
# which enforces them.

# one GPU of the node for the model arm (vLLM from the node's VENV), within its lease's 50 minutes; the stub arm on its CPUs
[[metric]]
id = "network-accounting/attester-added-first-byte"
title = "Network attester's wait to first byte"
owner = "network-accounting"
unit = "ms"
axis = "The mean extra time to a response's first byte through the network attester over straight to the endpoint, at four fifths of its stated capacity under the application's schedule: the schedule delays every response by its delay on purpose, so the number is what a request waits in all beyond the endpoint's own time."
better = "lower"
command = "research run --on NODE --gpu-host --project verity --source . --cwd source --timeout 60m -- gpu-lease 1 --wait --max-min 50 -- uv run python benchmarks/attester_load/run.py --vllm-python /workspace/jobs/venv312/bin/python"
every = "7d"

[[metric]]
id = "network-accounting/attester-added-last-byte"
title = "Network attester's wait to last byte"
owner = "network-accounting"
unit = "ms"
axis = "The mean extra time to a response's last byte through the network attester over straight to the endpoint, at four fifths of its stated capacity under the application's schedule: the schedule releases a response's cells at set buckets on purpose, so the number is what a request waits in all beyond the endpoint's own time."
better = "lower"
command = "research run --on NODE --gpu-host --project verity --source . --cwd source --timeout 60m -- gpu-lease 1 --wait --max-min 50 -- uv run python benchmarks/attester_load/run.py --vllm-python /workspace/jobs/venv312/bin/python"
every = "7d"

[[metric]]
id = "network-accounting/attester-tick-lateness"
title = "Network attester's late ticks"
owner = "network-accounting"
unit = "ms"
axis = "The 99th percentile of how late the network attester's ticks run at the full capacity its schedule states, the device's own cost of carrying that load: past its slack a tick faults and the stated capacity is not carried."
better = "lower"
command = "research run --on NODE --gpu-host --project verity --source . --cwd source --timeout 60m -- gpu-lease 1 --wait --max-min 50 -- uv run python benchmarks/attester_load/run.py --vllm-python /workspace/jobs/venv312/bin/python"
every = "7d"

# CPU only: a stored stock serving run's requests replayed under each schedule of `pacing.py`, modeled until a run
# measures it. A rerun on the same run writes no new reading (the replay is deterministic): its figure moves only with
# the card file, `pacing.py`'s schedules or its reading of `network_attester.py`. So its command takes the run as
# RUN_OF_RECORD, which keeps the row off the weekly rerun loop, and its owner fills it in from this line.
#
# RUN OF RECORD: r20261116-122320-c688, the stock arm (`prod`) of GLM-5.3 at `agentic@4` on one 8×H200 node. To move
# the row to another run, replace it in this line.
[[metric]]
id = "network-accounting/serving-slowdown-under-pacing"
title = "Serving slowdown under pacing"
owner = "network-accounting"
unit = "percent"
axis = "The time a network attester's release schedule adds to serving a load, as a percent of stock's serving time for the same load, per schedule, model and card: pacing's own cost, never added to serving cost, and none where a request fails under the schedule."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/attester_load/pacing.py --from RUN_OF_RECORD --card h200x8"
every = "7d"
goal = "network/pacing-slowdown-own-number"

# written by the same command, beside the slowdown of each schedule, from `benchmarks/certifier_term/run.py`'s calculator
# alone (the schedule, not the replay), over a week, a month and a year of a datacenter's and of the world's compute
[[metric]]
id = "network-accounting/pacing-capacity-left"
title = "Exfiltration capacity a schedule leaves"
owner = "network-accounting"
unit = "GB"
axis = "The network attester's term of record at a release schedule, in GB over the monitoring period and compute each value names, at the plan's request count: the exfiltration capacity the schedule leaves, beside its serving slowdown under pacing."
better = "lower"
command = "research run --on auto --project verity --source . --cwd source --store-read -- uv run python benchmarks/attester_load/pacing.py --from RUN_OF_RECORD --card h200x8"
every = "7d"
goal = "network/pacing-slowdown-own-number"
