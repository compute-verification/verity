[project]
name = "verity-census"
version = "0.1.0"
description = "The census: hardware, networks, workloads and instance sets benchmarks are computed against, as data files with sources and a thin typed loader."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_census"]
