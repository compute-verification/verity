[[metric]]
id = "compute-research/unpriced-opcodes"
title = "Opcodes the model leaves unpriced"
owner = "compute-research"
unit = "opcodes"
axis = "The dotted SASS opcodes in a node's binaries, counted once a device family over the families of the registered devices (the machine model's devices whose census diff_menu.py's DEVICE_CENSUS reads), that diff_menu buckets as a gap or unknown, so the model gives them no price; the point's by_family gives each family's count, and a device leaving the registered devices takes its family's count out of the value."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source --pool research --as compute-research -- bash calibration/pouw/sass_census/run.sh dump"
every = "7d"
