# An H100 node: one h100-sxm-80gb card in a VM of a two-socket Xeon Platinum 8468 server. This file holds what the
# node's registration states that no card does (calibration/hardware/README.md): the cards it names, how many GPUs it
# carries, the host's own memory, one table a leaf, and the node's ways out: the interfaces that carry traffic off
# it, one table each, and the storage path. Each number is { value, unit, mark, source }, as in a card.
# A GPU's memory is its card's store.dram_installed, whole, and every clock and peak of a card is its card's: none is
# here.

node = "h100-sxm-80gb-x1"
name = "An H100 node: one card in a VM of a two-socket Xeon Platinum 8468 server"

[device]
sku = "h100-sxm-80gb"
count = { value = 1, unit = "card", mark = "measurement", source = "the run record of a VM of this kind, its hardware as the launcher reads it with nvidia-smi: hw.count 1, hw.sku 'NVIDIA H100 80GB HBM3' (art:2385ce3688ff, job.json)" }

# The host is the H200 node's: lscpu on a VM of this kind reads 'Model name: Intel(R) Xeon(R) Platinum 8468', 1 socket
# x 8 cores x 2 threads, 105 MiB of L3, and the amx_int8 flag (art:2385ce3688ff), as on the H200 node's VM.
[host]
sku = "xeon-platinum-8468-2s"

# The host's own memory. dram is the memory the VM is given, above the total free -b states, which leaves out what the
# kernel keeps; the server's DIMMs are not on record (a guest can't read them). The disks are the VM's block devices,
# each whole, mounted or not. One VM of this kind was read, and the file is the kind's.
#
# A leaf's rate is the most its bytes are read back at, whatever the node runs, a ceiling: the tightest bound on
# record. DRAM's is the host card's memory.bandwidth_max. A disk's is its own interface's where the disk states one,
# and else the host card's disk.read_max, the lanes into the server's sockets, which bounds the host's disks together
# too: these disks are virtio_blk devices the hypervisor gives the VM, the provider's network disks, which state no
# interface. No run has read a disk of this kind of node, so no measured rate stands beside a ceiling.
[memory.dram]
tier = "dram"
bytes = { value = 214748364800, unit = "B", mark = "measurement", source = "lsmem -b on a VM of this kind: 'Total online memory', 100 blocks of 2 GiB and none offline, 200 GiB (art:de21637e0919); free -b there gives a total of 211,069,927,424 B" }
rate = { value = 6.144e11, unit = "B/s", mark = "ceiling", source = "the host card's memory.bandwidth_max (xeon-platinum-8468-2s): the server's sixteen DDR5 channels at the fastest memory the processor takes. A program reads the node's DRAM over those channels and no other way, and the VM's share of them is not on record, so the whole server's stands" }

[memory.vda]
tier = "disk"
bytes = { value = 274877906944, unit = "B", mark = "measurement", source = "the node's own report on a VM of this kind: vda, a virtio_blk device, 256 GiB (art:de21637e0919, disks.json)" }
rate = { value = 661661538462, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-platinum-8468-2s), the PCI Express lanes and the chipset link into the server's sockets: the disk is a virtio_blk device, one the hypervisor gives the VM (art:de21637e0919: its driver virtio_blk, no model and no transport), and nothing on record states an interface of the disk's own, so its bytes are bounded only where they enter the server. A limit the provider sets on a disk of its kind and size is a setting and no ceiling" }

[memory.vdb]
tier = "disk"
bytes = { value = 1048576, unit = "B", mark = "measurement", source = "the node's own report on a VM of this kind: vdb, a virtio_blk device, 1 MiB (art:de21637e0919, disks.json)" }
rate = { value = 661661538462, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-platinum-8468-2s), the PCI Express lanes and the chipset link into the server's sockets: the disk is a virtio_blk device, one the hypervisor gives the VM (art:de21637e0919: its driver virtio_blk, no model and no transport), and nothing on record states an interface of the disk's own, so its bytes are bounded only where they enter the server. No limit of the provider's is on record for its megabyte" }

[memory.vdc]
tier = "disk"
bytes = { value = 199715979264, unit = "B", mark = "measurement", source = "the node's own report on a VM of this kind: vdc, a virtio_blk device, 186 GiB (art:de21637e0919, disks.json)" }
rate = { value = 661661538462, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-platinum-8468-2s), the PCI Express lanes and the chipset link into the server's sockets: the disk is a virtio_blk device, one the hypervisor gives the VM (art:de21637e0919: its driver virtio_blk, no model and no transport), and nothing on record states an interface of the disk's own, so its bytes are bounded only where they enter the server. A limit the provider sets on a disk of its kind and size is a setting and no ceiling" }

# The node's own way out: the interfaces a route of the node sends packets out of. There is one, eth0, and it reads
# no line rate: it is the hypervisor's virtio_net device, with no adapter of its own in the VM. So its table names it
# with what was read of it and states no rate. An interface with no rate registers no link, and no network attester
# is registered on it.
[interface.eth0]
driver = "virtio_net"
source = "the node's own report on a VM of this kind (art:de21637e0919, net.json): eth0, a device of the virtio_net driver, is up and is the one interface that leaves the node, a route of its main tables naming it. Its speed reads -1 and ethtool 'Speed: Unknown!', so the interface states no line rate. The others are the loopback and a bridge with no device behind it, which is down, and the node has no InfiniBand device"

# The storage path: the node's way out that is no interface. Every disk of the node is the provider's network disk,
# so what is written to one has left the server past every interface of the VM's, where no network attester can
# split it. It is stated once, naming the disk leaves that ride it, and it states no rate: its rate is the one that
# bounds the node's disks together, the host card's disk.read_max.
[storage]
leaves = ["vda", "vdb", "vdc"]
source = "each disk is a virtio_blk device the hypervisor gives the VM (art:de21637e0919, disks.json), the provider's network disk: such a disk can be attached to another machine or copied through the provider, and neither passes an interface of the VM's, so a byte written to one may have left the node"
