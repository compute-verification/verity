[[metric]]
id = "compute-research/eight-bit-mac-rate-over-sheet"
title = "Eight-bit MAC rate, higher ceiling"
owner = "compute-research"
unit = "higher ceiling share"
axis = "The most 8-bit multiply-accumulates a second any tensor_duty point reached over the host's wall clock, as a share of the dense 8-bit tensor ceiling at the higher of the card's clock readings (132 SMs x 4096 x clock.sm on the H200), each point carrying its rate, its share at every reading, the clock it held and its clock lock, and naming its card."
better = "lower"
command = "research run --on NODE --project verity --source . --cwd source -- env GPU_LEASE_WHO=compute-research gpu-lease 1 --wait --on CARD --cores CORES --max-min 75 -- bash calibration/tensor_duty/run.sh"
every = "7d"
