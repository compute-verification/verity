# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

# modeled: computed from data/ alone, on a CPU; each family at each reading is a member
[[metric]]
id = "compute-accounting/machine-model-design-epsilon"
title = "Machine model design epsilon"
owner = "compute-accounting"
unit = "percent"
axis = "The core ε, the share of credited work a node may leave undone, of the H200's Dither design of record on the machine model at the data-sheet reading (q* = ½), computed from the model's data."
better = "lower"
command = "research run --on auto --cwd source -- bash -lc 'uv sync -q --all-packages --extra torch-cpu && .venv/bin/python calibration/machine_model/run.py --out \"$OUT\"'"
every = "7d"
