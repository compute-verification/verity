# The machine model's constants. Units: u = 1/R* SMSP-cycle.

# The current vector. Each refit took over in turn: VF3l-16; VF3n-16, the JI3e refit; VF3o-16, its measured margin;
# VF3p-16, a uniform instruction on the issue rows; VF3q-16, the refit of every row its programs beat; VF3r-16, the 2-3-accumulator refit on per-form classes.
current = "VF3r-16"
# The card file (calibration/hardware/cards/) the sheet and the Lean headline read this device's ceilings from.
card = "rtx-pro-6000-server"
# The card file of the host the device sits in, which θ's host rates read (`host:PATH`).
host = "xeon-6776p-2s"

# Each epoch is a state of the census, named after the vector that introduced it, in order. A census
# line holds from its `since` epoch (empty: the first) through its `until` epoch (empty: the last); a line
# a later epoch refitted or dropped closes at the last epoch it held. VF3j-8 put the plain LDSM/STSM forms on the joint
# issue rows (the register-load variants VF3j-8 and VF3j-16 read), and every epoch after it keeps them. DS-120, the
# data-sheet vector, sits after VF with lines that close where they open, so it moves no other epoch's census;
# `eps --vector DS-120` reads its DS_* lines alone.
epochs = ["VF", "DS-120", "VF2", "VF3", "VF3c", "VF3d", "VF3e", "VF3f", "VF3g", "VF3h", "VF3i", "VF3i-strict-r8",
          "VF3i-strict",
          "VF3j", "VF3j-8", "VF3k-16", "VF3l-16", "VF3m-16", "VF3n-16", "VF3o-16",
          "VF3p-16", "VF3q-16", "VF3r-16", "VF3s-16"]

# The CUDA lane kinds, in constraint order.
cuda = ["FFMA", "VIMNMX", "HFMA2", "IMAD", "ALU", "F2FS", "XU", "SHFL", "NOROW", "SEL"]

[constants]
cycle_u = 300.08          # R*: u in one SMSP-cycle
