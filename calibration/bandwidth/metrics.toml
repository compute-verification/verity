# This directory's numbers, one [[metric]] each, by the rules of tests/test_metrics_registry.py,
# which enforces them.

[[metric]]
id = "memory-accounting/host-write-rate"
title = "Host memory write rate"
owner = "memory-accounting"
unit = "GB a second"
axis = "The fastest a host's cores wrote its memory in one run, with no wrong byte in what was checked, each point naming its processor and core count."
better = "higher"
command = "research run --on auto --cpus 48 --mem-gb 64 --project verity --cwd source -- bash calibration/bandwidth/run.sh write_host"
every = "7d"
