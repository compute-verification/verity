# The verified queue's flags, their one source: its loop (`research queue vqueue`) reads this file at `main` each tick
# (`DriveFlags`, `flags_at` in tools/research/src/research/queue.py), so a change here is a reviewed commit and needs no
# restart, and a temporary setting is a commit here too. The ready mark's preflight reads `landing_gates`, `warn_gates` and
# `land_into` here at `main`, each key alone (`gates_at`, `land_into_key`). tests/test_drive_toml.py fails on a key the strict
# parse doesn't take and on one whose code was deleted (`DELETED_KEYS`). Its owner is the handle whose `owns` in
# .agents/skills/using-slack/registry.json covers it.

# parsed (`DriveFlags`) and read by no other code. The loop's own `--on` overrides `on`, and the landing order is no key: it
# is the loop's priority file (`research queue vqueue --priority-file`), read each tick
command_line = ["on"]
# the machines (a machine, or `auto`) the verified queue's runs take, the run beside each candidate's check and each records
# run, each shard its share of them, unless the loop's `--on` names others
on = ["vy-nebius-cpu-1", "vy-nebius-cpu-2", "vy-nebius-cpu-4", "vy-nebius-cpu-5"]
# parsed (`DriveFlags`) and read by no other code: a candidate with a member that changes Lean, a lock or a spec takes a
# records run before its check, which regenerates its lock records (`research.vqueue_records`), unless the loop runs with
# `--no-records`
regenerate_locks = true
# scripts a head passes at its ready mark's preflight (`Preflight._gates`), each run as it is at `main`, so the change it
# judges can't weaken it, as `python3 PATH MAIN HEAD --json` (`run_gate`): exit 0 passes, 1 with its failures refuses, and
# anything else can't judge, a note that refuses nothing (`gate_refusal`). The verified queue's candidates run none.
# unread_gate (tools/verity/lean/unread_gate.py) refuses a change that grows a package's unread Lean modules past its limit
landing_gates = ["tools/verity/lean/unread_gate.py"]
# scripts the preflight runs as it runs the landing gates, whose failure refuses nothing: the ready mark prints it as a
# warning. A Markdown file a change puts over its size limit (tests/test_repository.py)
warn_gates = ["tools/check/gates/markdown_caps.py"]
# the check's steps whose failure holds no candidate where the whole check gates (the loop's `--gate check`): its verdict
# leaves them out beside policy.toml's `off_gate` (`vqueue_slim._gate`), and what a candidate failed of one that the run
# beside its base's check didn't is rung once, ratchet-gate's to the lane of each member whose merge it fails; nothing is
# held or ejected for it (`Loop._off_gate`)
warn_steps = ["ratchet-gate"]
# parsed (`DriveFlags`: "review", its one value) and read by no other code: the verified queue takes a PR on its land verdict,
# or on its ready mark alone under the low-risk lane (`World.ready`)
land = "review"
# the landing branch: "main", where the verified queue's loop lands each batch, and onto which the ready mark's preflight
# merges a head (`Preflight._fetch`). A mark's preflight and `research queue status` judge a head's merges of an old `next`
# against it, so a head that merged `main` is marked
land_into = "main"
# these three keys and `executor_enqueue` are parsed (`DriveFlags`) and read by no other code: the loop's `--gate` checks each
# candidate (graph2's task check with a run beside it, or the whole check as `--shards` shards)
after_landing_no_cache = false
after_landing_shards = 3
executor = "shadow"
# executor_enqueue = ["CMD", "ARG"]
# parsed (`DriveFlags`) and read by no other code
verdict_first = true
# the verdict carry (`research.carry`): a PR marked ready at its head with no land verdict there takes its newest verdict at an
# older head, a land by a non-owner, when each commit since merges, as the queue would, commits on `checked` or `main` or another
# PR's head with a land verdict and no hold, or changes only what the checks regenerate (pins, lock records); a hold at the head,
# or one newer than that land, keeps it. "off"; "shadow", the verified queue (`research queue vqueue`, `World._carry`) logs
# `would carry #N's land from OLD to NEW (why)` or `would not carry ...` and writes nothing; "on", it counts the PR as
# reviewed and writes nothing
verdict_carry = "on"
# these three keys are parsed (`DriveFlags`) and read by no other code
bottom_ring = ["@ci"]
bottom_wait_min = 30
restack_jobs = 3
# the low-risk lane: the verified queue takes a ready PR on its ready mark alone (no land verdict) when it isn't held and
# its change, against its merge base with `main`, touches nothing `lowrisk_excludes` names, or it is a move's PR, whatever
# it touches, whose map, from `main`, is certified rerun on its batch's tip; with `signed_verdicts` true, no move changing
# `SIGNED_GUARDS` (`World.ready`). false: no PR is taken without a land verdict, its own or one the verdict carry carries. `lowrisk_per_tick` is parsed
# (`DriveFlags`) and read by no other code
lowrisk_lane = true
lowrisk_per_tick = 20
# what keeps a change off the low-risk lane: a directory from the root (ending in `/`), one file by its path from the root (a
# `/` before its end), or a file name glob (no `/`: any directory).
# Lean, its locks and Lake files, the trusted hashes, the verifiers and the trusted places of tests/import_order.toml with
# their tests, and the soundness-path Python (AGENTS.md's soundness path); the data sheets the Site and the accounting
# read (hardware/: a changed figure changes a device's assumed capacity bound); the auditor's devices (every `attester/` and compose's `verifier/`: the
# network attester, the memory challenger, the challenger service and the verifier's auditor device) and what both auditor
# devices pin beside them and run or read as `auditor`: the challenger's (benchmarks/network_traces/, the network attester's
# rehearsals; the checkpoint manifest its model registry reads) and the verifier's (benchmarks/one_stage/, which its compose
# gate's `served_verdicts.sh compose` runs with that directory on sys.path; the fixture registration `bw_party --fixture`
# holds), with the memory line of record computed from the verifier's runs (auditor_line.py); and the guards that hold
# everything else to those rules: the Lean check (tools/verity/lean/), the
# whole-tree invariants (root tests/: the import order and its listing, verifier cost), the check and this file
# (tools/check/, and in tools/verity/check/ the merge drivers' shims that clones from before the move run), the graph
# lister that lists the executor's gating
# tasks (tools/verity/graph/), the merge drivers (.gitattributes), and the landing rules themselves (queue.py); and what
# runs with the control pod's or every agent's credentials once it is on main: infra/, the research tool (tools/research/),
# the move scripts and maps the loop runs and certifies a move against (tools/move/), the agent guard and its hooks
# (tools/agent-guard/, .cursor/), and the environment (pyproject.toml, uv.lock). Every `attester/` and `verifier/` is excluded
# whole, by its own entry or one above it, so a file added there later is too (tests/test_lowrisk_excludes.py), among them:
# the registration log's verifier (verity/protocols/registration/verifier/), not only its files' names;
# compose's verifier (verity/protocols/compose/verifier/), not only its lean/, onsite/ and remote/
lowrisk_excludes = ["*.lean", "lean-audit.json", "lakefile.*", "lean-toolchain", "lake-manifest.json", "TRUSTED.sha256",
                    "verity/runtime/", "verity/circuits/evaluate/", "verity/circuits/requirement/", "tools/difftest/", "record.py", "registration.py", "verity/protocols/resource_accounting/network/attester/", "verity/protocols/resource_accounting/network/verifier/", "verity/protocols/proofs/flock/verifier/sigma/", "verity/protocols/proofs/flock/verifier/", "verity/protocols/workload_classification/training_detection/inference_only/verifier/", "verity/protocols/interface/", "verity/protocols/compose/verifier/onsite/", "verity/protocols/resource_accounting/memory/poub/verifier/", "verity/protocols/resource_accounting/memory/pous/attester/", "tools/pous_grader/", "verity/protocols/resource_accounting/memory/pous/verifier/", "verity/protocols/resource_accounting/compute/pouw/verifier/", "verity/protocols/proofs/recursion/verifier/", "verity/protocols/compose/verifier/remote/", "verity/protocols/compose/verifier/lean/", "verity/protocols/proofs/spot/", "verity/protocols/proofs/spot_flock/verifier/", "verity/protocols/proofs/spot_flock_recursion/verifier/", "verity/protocols/tests/",
                    "verity/protocols/registration/verifier/", "verity/protocols/compose/verifier/",
                    "verity/party.py", "verity/protocol.py", "verity/config.py", "verity/channel.py", "verity/device.py", "verity/errors.py", "verity/tests/", "hardware/",
                    "verity/protocols/resource_accounting/memory/poub/attester/", "benchmarks/network_traces/", "adapters/vllm/manifests/checkpoints-int8.json",
                    "benchmarks/one_stage/", "verity/protocols/resource_accounting/memory/poub/verifier/bandwidth-mem69-v2.json", "benchmarks/remote_session/auditor_line.py",
                    "__init__.py",
                    "verity/circuits/", "verity/circuits/ops/", "verity/circuits/silicon/", "verity/circuits/kernels/", "verity/commitments/", "adapters/vllm/verity_vllm/commitments/", "adapters/vllm/tests/commitments/", "verity/commitments/crypto/", "verity/commitments/randomness/",
                    "tools/verity/lean/", "tests/", "tools/check/", "tools/verity/check/", "tools/verity/graph/", ".gitattributes",
                    "queue.py",
                    "infra/", "tools/research/", "tools/move/", "tools/agent-guard/", ".cursor/", "pyproject.toml", "uv.lock"]
# what the land verdicts gate (the loop's `--gate verdict`) keeps on the whole check before landing beyond
# `lowrisk_excludes`, written as its entries are: a candidate is plain, and lands on its members' land verdicts and the
# quick tier, only when no member's change, against its merge base with `main`, touches an entry of `lowrisk_excludes` that
# `verdict_plain` doesn't list, or of this list (`DriveFlags.plain_excludes`, `Loop._plain`); with `lowrisk_excludes` or this
# list empty, none is plain. What the gate reads of `lowrisk_excludes` keeps off Lean, its locks and Lake files, the
# verifiers, the soundness-path Python, the Lean check, the check and this file, the landing code (tools/research/) and the
# merge drivers; this adds the auditor's devices it doesn't name. A move's PR is never plain, whatever it touches, nor a
# change to a Lean input of the tree (`vqueue_slim.lean_inputs`)
verdict_excludes = ["verity/protocols/compose/verifier/", "verity/protocols/resource_accounting/memory/poub/attester/"]
# the entries of `lowrisk_excludes` the land verdicts gate doesn't read (`DriveFlags.plain_excludes`): each keeps a change
# off the low-risk lane so that a reader sees it before it lands, which its land verdict is, and none needs the whole check
# first. Each is written character for character as in `lowrisk_excludes`, and the parse refuses any other, one in
# `verdict_excludes` and a duplicate. Together they free no file under a `verifier/` or `attester/` directory, of a trusted
# place or the soundness path (tests/import_order.toml), no Lean, lock or Lake file, nothing under tools/research/,
# tools/move/, tools/verity/check/ or tools/verity/lean/, and none of the code an auditor's device runs outside an `attester/` or `verifier/`
# directory (tests/test_lowrisk_excludes.py): benchmarks/one_stage/, benchmarks/network_traces/ and
# benchmarks/remote_session/auditor_line.py stay on the whole check with the devices, and tools/move/, which the loop runs
# and certifies moves against, with tools/research/. The quick tier runs the root's suite on every
# change, a changed test module's slow tests too; `main`'s whole check after the landing runs every suite with its slow tests,
# the Lean steps, circuit-check and Flock's Rust build, and a red there reverts the PR it names
verdict_plain = [
    # the whole-tree invariants, which the quick tier runs (only three slow tests wait for the whole check)
    "tests/",
    # the environment and each suite's pytest and inputs tables: the quick tier runs every suite whose inputs hold the file,
    # uv.lock stays on the gate so a changed resolution takes the whole check, and each Lean package's and verifier's
    # pyproject.toml sits under a directory entry the gate reads
    "pyproject.toml",
    # a package's grouping file, outside the directories the gate reads whole; tests/test_boundaries.py, in the quick tier,
    # holds one in no place to the standard library, and the quick tier runs every suite whose inputs hold it
    "__init__.py",
    # the guard every agent's VM runs from origin/main: the quick tier runs its suite and the root's hook tests
    "tools/agent-guard/",
    # what runs with the control pod's credentials, which nothing in verity/ reads: the quick tier runs the root's suite and,
    # for ops/, verity-ops' and research's
    "infra/",
]
# count a ready mark or land verdict only when its `label_auth` label authenticates it as its author's, a Cursor identity token
# minted by the agent holding that handle in the registry or by a worker it delegated to (`research queue delegate`); ejections
# and holds count unsigned (`research.labelauth`). A PR reader's name (`review-36`) counts only under a delegation by the
# holder of the handle whose `staffs` in the registry names it. `ready`, `judge` and `review` sign what they can either way,
# and refuse what they can't once it is on. false: none is judged. "shadow": each counts as written, and the verified queue's
# loop logs each it counted that doesn't authenticate (an `unauthenticated` line of its decisions). true is refused while
# the low-risk lane could land a change to the registry, labelauth.py, queue.py or landing.py (`SIGNED_GUARDS`)
signed_verdicts = false
# days an open PR not marked ready at its head stays idle (its head commit, and its ready, eject and review labels there) before
# it is stale: `research queue status` says so (`research.stale`); 0 is off
stale_days = 3
# parsed (`DriveFlags`: 0, or at least `stale_days`) and read by no other code
stale_close_days = 7
# open PRs the stale rule never judges, each kept open by its owner with a reason
stale_keep = []
# parsed (`DriveFlags`) and read by no other code
close_unlandable = "log"
