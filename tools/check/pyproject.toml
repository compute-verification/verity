[project]
name = "verity-check"
version = "0.0.0"
description = "`check`, the one check a merge requires, and `suites`, the test runner it uses."
requires-python = ">=3.12"
dependencies = ["research"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests read the verifier's pin, replayable sets and agreement scripts (the agreement step's inputs), check.py's
# shipped-tree commit record, the flock-circuit build step's script and the patches its Rust tests cover, the repository
# lints the preflight names, and the Lean audit's tool directory: the sandbox lean_changed builds in, and the audit whose
# judgment of the guarantees it runs (a directory, since loading `audit.py` reads and writes its `__pycache__`).
inputs = ["READY.json", "backends/flock/check_build.sh", "backends/flock/flock-glue-b684b12.patch",
          "backends/flock/flock-gpu-link-b684b12.patch", "backends/flock/flock-link-b684b12.patch",
          "backends/flock/flock-sha512-b684b12.patch", "backends/flock/flock-vtime-b684b12.patch",
          "backends/flock/flock-zk-b684b12.patch", "backends/flock/verifier", "tests/test_no_wall_clock.py", "tests/test_repository.py",
          "tools/lean"]
