# The differential test's Lean half: `Difftest.serve`, the server every port's difftest executable runs, and an example
# port (`difftest-example`) that the harness's own tests drive, the annotation check's port (`annot-difftest`,
# `Circuits.Annot`), which the Python mirror's tests call through `verity_difftest.annot`, and the JSON parser's port
# (`flock-json-difftest`, `Base.JsonParse`). Code, not analysis: Lean core, the base and the circuit format.
name = "verity_difftest"
defaultTargets = ["Difftest", "AnnotDifftest", "FlockJsonDifftest", "difftest-example", "annot-difftest",
  "flock-json-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_base"
path = "../../../verity/circuits/base"

[[require]]
name = "core_circuits"
path = "../../../verity/circuits/lean"

[[lean_lib]]
name = "Difftest"

[[lean_lib]]
name = "AnnotDifftest"

[[lean_lib]]
name = "FlockJsonDifftest"

[[lean_exe]]
name = "difftest-example"
root = "DifftestExample"

[[lean_exe]]
name = "annot-difftest"
root = "AnnotDifftestMain"

[[lean_exe]]
name = "flock-json-difftest"
root = "FlockJsonDifftestMain"
