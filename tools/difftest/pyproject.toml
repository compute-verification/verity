[project]
name = "verity-difftest"
version = "0.1.0"
description = "The differential test of core's Lean, the verifier, against the Python that mirrors it: Hypothesis drives the Python and the Lean executable on the same inputs."
requires-python = ">=3.12"
dependencies = ["hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_difftest"]
