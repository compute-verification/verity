# The agent VM's guard: its shell and Task hooks, OOM recorder and boot script, and their tests. Not a package: the scripts
# are stdlib, run as files, and their tests run as a suite (`uv run tools/verity/check/suites.py tools/agent-guard`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the boot test and the shell hook's run shells and git, the kept session's runs tmux, and the names reader's makes its
# throwaway key with ssh-keygen, none of which the read guard can trace: keyed on the suite's whole tree
untraced = ["tests/test_agent_guard_boot.py", "tests/test_shell_hook.py", "tests/test_secret_files.py", "tests/test_envnames.py",
            "tests/test_pre_push.py", "tests/test_carriers.py", "tests/test_kept_session.py"]
# The tests hold the hooks to the hooks file Cursor reads, and the boot test copies it into a scratch workspace.
# two tests copy this package whole, its README with it; the kept session's holds research's name for it to the guard's
inputs = [".cursor/hooks.json", "tools/agent-guard/README.md", "tools/research/src/research/secret_hint.py"]
