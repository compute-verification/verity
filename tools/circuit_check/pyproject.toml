[project]
name = "verity-circuit-check"
version = "0.1.0"
description = "circuit-check: the standard property checks every Definition, subcircuit template and served row passes (correspondence with the reference evaluator on edge inputs, redundant and dead gates, the partition invariant, Boolean lowering pins)."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-flock", "verity-numerical", "numpy"]

[project.scripts]
circuit-check = "circuit_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_check"]

[tool.uv.sources]
verity = { workspace = true }
verity-vllm = { workspace = true }
verity-flock = { workspace = true }
verity-numerical = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
    "circuit_suite: one circuit-check target per test, the checks `circuit-check --all` runs; collected only under -m circuit_suite",
]
