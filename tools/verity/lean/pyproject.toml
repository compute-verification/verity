[project]
name = "verity-lean-audit"
version = "0.0.0"
description = "The Lean audit that `check` runs on every Lake package."
requires-python = ">=3.12"
dependencies = ["research"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests read this directory's README, so its Markdown is keyed (`suites.markdown`).
inputs = ["tools/verity/lean/README.md"]
