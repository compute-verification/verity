[project]
name = "verity-landq"
version = "0.0.0"
description = "A simulator that replays PR traffic through the verified queue's decide (research.vqueue, run by a snapshot driver), beside what the old path did with the same PRs."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_landq"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
