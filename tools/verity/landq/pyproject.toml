[project]
name = "verity-landq"
version = "0.0.0"
description = "The landing queue's decision logic as a pure reference model (`main` moves only to a candidate whose exact tree passed every gating task), and a simulator that replays PR traffic through it."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_landq"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
