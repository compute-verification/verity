[project]
name = "verity-graph"
version = "0.0.0"
description = "`verity graph`: the check as a task graph that depends only on the commit (graph/v2), its runners (result/v1) and the serial reference executor."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_graph"]
dev-mode-exact = true
