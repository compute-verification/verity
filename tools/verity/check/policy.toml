# The policy over what the runners (suites.py, circuit-check, check.py's steps) report: what of it gates and what may stay red
# (`research.policy` reads it). The verified queue reads it at the candidate it judges, so an allowance lands with the change it
# lets pass; `research merge` reads `off_gate` at the commit it merges; the quick tier's judge reads it at the tier's base on
# `main`. Its owner is the handle whose `owns` in .agents/skills/using-slack/registry.json covers it; `tests/test_policy_toml.py`
# holds it to the parse and to ci.toml's jobs.
schema = "policy/v0"

# The ci.toml jobs off the merge gate. A recorded check, whole or a shard, leaves them out (`check.py`'s OFF_GATE, from
# `declaration.load`), `research merge` requires them of no check, and the verified queue judges a candidate without them:
# graph2's circuit-check tasks gate nothing, and ratchet-gate runs in the run beside a candidate's graph2 check
# (`research.vqueue_slim`), off the gate there too. circuit-check returns to the gate once `circuit-check --all` fits inside the
# rest of the check (under 30 minutes); ratchet-gate judges the merges above the run's base, and no plan holds it. A job here
# has no `merge_requires`, and no job on the gate `needs` it or runs `after` it.
off_gate = ["circuit-check", "ratchet-gate"]

# Allowances: a failure the verified queue doesn't take as red while its allowance is unexpired: it ejects no culprit for it and
# holds no move of `main`. Expired, it is as if absent. `id`: `suite NAME` (every failure of that suite), `suite NAME::TEST`
# (one test: its suite then fails for nothing but allowed tests), or `circuit-check CHECK/CODE FAMILY` (one circuit-check
# failure, the Definition without its statics). Drop an entry once its failure is fixed.
