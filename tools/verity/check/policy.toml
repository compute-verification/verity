# Drive's policy over what the runners (suites.py, circuit-check, check.py's steps) report: what of it gates and what may stay red
# (`research.policy` reads it). Drive reads it at the commit it judges, so an allowance lands with the tip it lets pass; `research merge` reads
# `off_gate` at the commit it merges; the quick tier's judge reads it at the tier's base on `main`. Its owner is the handle
# whose `owns` in .agents/skills/using-slack/registry.json covers it; `tests/test_drive_policy.py` holds it to the parse and
# to ci.toml's jobs.
schema = "policy/v0"

# The ci.toml jobs off the merge gate. A recorded check, whole or a shard, leaves them out (`check.py`'s
# OFF_GATE, from `declaration.load`), `research merge` requires them of no check, and drive moves `main` without them: they run in drive's
# after-landing run (`--deferred`, every job), where a red names its culprit on `checked`. Under drive.toml's `executor = "on"`
# ratchet-gate runs in a train.sh run beside the executor's check instead, and is off the gate there too. circuit-check returns to the gate
# once `circuit-check --all` fits inside the rest of the check (under 30 minutes); ratchet-gate judges the merges above the
# run's base, and no plan holds it. A job here has no `merge_requires`, and no job on the gate `needs` it or runs `after` it.
off_gate = ["circuit-check", "ratchet-gate"]

# Allowances: a failure drive doesn't take as red while its allowance is unexpired. It names no culprit, reverts nothing,
# holds no promotion, and the after-landing run that failed only on such failures verifies its tip. Expired, it is as if absent,
# and drive's ring names it and rings its owner. `id`: `suite NAME` (every failure of that suite), `suite NAME::TEST` (one test:
# its suite then fails for nothing but allowed tests), or `circuit-check CHECK/CODE FAMILY` (one circuit-check failure, the
# Definition without its statics). Drop an entry once its failure is fixed.
