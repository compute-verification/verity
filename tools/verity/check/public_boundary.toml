# The public monorepo's boundary: the files of this repository its one-way export copies. This repository stays the only
# source of truth, and the export (`public_export.py`) copies the public set into a tree of fresh history. This file is the
# decided boundary: moving a path across it is a boundary decision, then one line here.
#
# A file is public when a `public` glob covers it, when a `needed` glob covers it and a public file needs it (directly or
# through other such files), or when a `when_closed` glob covers it and everything it needs is public. A `private` glob
# wins over all three, and every other file stays private. A public file that needs a file that isn't public is an edge,
# which `public_boundary.py` reports: what a file needs is its docstring's.
#
# A glob is a path from the root, `*` within one segment, `**` across any number, `{a,b}` either; it covers the path it
# names and everything under it.

# the whole-tree invariants: each test exported when everything it needs is public
when_closed = ["tests"]
# fetched fixtures (entries of fixtures/artifacts.json git doesn't track) the export ships as tracked files, so the public
# tree's tests read them with no store: each public, and each of its files at most a tracked file's limit
# (tests/test_repository.py). vLLM's stored workloads: every row file the integration's tests and stages read; and the
# vectors the network certifier's encodings are held to
