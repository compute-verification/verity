# Each entry: globs exported only as far as public files need them, the public groups whose files may pull them in
# ("*": any public file), and the kinds of need that may (`via`, `public_boundary.KINDS`; "*", the default: any). A file
# an entry pulled in may pull in the rest of that entry.
[[needed]]
why = "the shared vocabulary (AGENTS.md \"One vocabulary\": Core and Hash) and the claims' ids"
paths = ["security/*/{Core,Claims,Hash}{,.lean}", "security/{Definitions,Models}.lean"]
from = "*"

[[needed]]
why = "what a public file needs to build, run and pass the Lean check: its Lake package's files and lock, its suite's and distribution's pyproject, the packages above it"
paths = ["**/{lakefile.toml,lake-manifest.json,lean-toolchain,lean-audit.json,pyproject.toml,__init__.py,conftest.py}", "uv.lock"]
from = "*"
via = ["package"]

[[needed]]
why = "the errors and settings every unit of `verity` shares"
paths = ["verity/{errors,settings}.py"]
from = "*"

[[needed]]
why = "the challenger and service code SPOT needs"
paths = [
    "verity/{claims,commitments,configuration,definitions,difftest,hardware,protocols}",
    "security/{Properties,Proofs/Properties}/{Spot,Challenger}{,.lean}",
]
from = ["spot"]

[[needed]]
why = "the identity hash, and the parts of the table of domain separators PoUW's Lean reads: PoUW's and the shared ones"
paths = ["verity/commitments/identity/Identity/{Sha512,Tagged}.lean",
         "verity/commitments/identity/Identity/Domains/{Pouw,Shared}.lean"]
from = "*"

[[needed]]
why = "the accounting PoUW needs"
paths = ["security/*/Accounting{,.lean}", "security/Proofs/Properties/Accounting{,.lean}"]
from = ["pouw"]

[[needed]]
why = "the evaluator's arithmetic Pearl+'s Lean verdict recomputes (FP32, the casts and the tensor-core dots: the public `verity.circuits` Definitions as executable Lean), and its properties' proofs, which Pearl+'s analysis reads"
paths = ["verity/definitions/evaluate/Evaluate", "security/Proofs/Properties/Core/Evaluate.lean"]
from = "*"
via = ["lean import"]

[[needed]]
why = "the world a device runs in (`Core.World`: its clock, coins, links and signer's state), which the network certifier's device's driver reads"
paths = ["verity/hardware/world"]
from = ["certifier"]

[[needed]]
why = "the identity hash's properties' proofs, which the network certifier's checks' proofs read"
paths = ["security/Proofs/Properties/Hash"]
from = ["certifier"]

[[needed]]
why = "the ZK server's record as its Lean code runs it, stated and proved, which the recursive session's stop count is proved from"
paths = ["security/{Properties,Proofs/Properties}/Firewall.lean"]
from = ["flock"]

# Known residue: what the export copies knowing it still carries the process's words, each until the change that removes it
# (`until`). The export reports each entry's sites in what it copies: a line of a copied file under `paths` that `pattern`
# matches. A Lean lock's kept text is held closer: lane text in it, or the name of what the export leaves out, refuses the
# export unless an entry here covers it (the lock under `paths`, the text matching `pattern`).
[[residue]]
what = "the auditor ledger's `lane` field: a monitoring period's prover, as the v2 ledger's period-open and period-close name it"
pattern = '\bperiod\b[^\n]*\blane\b|\blane\b[^\n]*\bperiod\b'
paths = [
    "verity/protocols/pouw/verifier",
    "verity/protocols/spot/verifier/{README.md,__init__.py,consumers.py,one_stage,parties.py,pyproject.toml}",
    "verity/protocols/spot/verifier/{schedule.py,second_stage.py,service.py,tests}",
    "verity/protocols/spot/{candidates.py,costfit.py,device,optimize.py,plancheck.py}",
    "verity/protocols/spot/verifier/lean",
    "security/*/Pouw",
    "security/Proofs/Properties/Pouw",
    "adapters/vllm",
    "benchmarks/one_stage",
]
until = "the v3 ledger names a period's prover `prover`"

[[residue]]
what = "an open conjecture's test, which its lock entry must name, is a file the export leaves out"
pattern = 'benchmarks/pouw/tests/test_lean_headline\.py'
paths = ["security/lean-audit.json"]
until = "the test of `Accounting.Assumptions.TS.FoldOptFoldedAt` is public, or the conjecture's entry is private with it"
