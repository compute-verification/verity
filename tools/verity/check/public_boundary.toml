    "benchmarks/one_stage/{served_verdicts,served_pearlplus,served_composite}.sh",
    "benchmarks/one_stage/{served_verdicts,composite,served_cases,inference_only,served_integrity,served_shares}.py",
    # the block record the served verdicts write, which `served_verdicts.py` loads from `examples/h200/interfaces`
    "examples/h200/interfaces/verity_e2e_demo/block_record.py",
    "benchmarks/one_stage/{served_overhead,served_compare}.py",
    "benchmarks/one_stage/{pyproject.toml,README.md}",
    # the CPU reference of the int8 attention's gate, which vLLM's int8 attention tests hold the served kernels to
    "benchmarks/pouw/edited_gemm/{fattn_ref.py,pyproject.toml}",
