# The landing flags, their one source: the verified queue's loop (`research queue vqueue`), `research queue ready`, `review` and
# `status` read this file at `main` (`DriveFlags`, `flags_at` in tools/research/src/research/queue.py), so a change here is a
# reviewed commit and needs no restart. A reader ignores a key it doesn't read; `tests/test_drive_toml.py` holds the file to
# the strict parse, which catches a typo. Its owner is the handle whose `owns` in .agents/skills/using-slack/registry.json
# covers it.

# the machines the run beside each candidate's graph2 check runs on (`research.vqueue_slim`: a machine, or `auto`)
on = ["vy-nebius-cpu-1", "vy-nebius-cpu-2", "vy-nebius-cpu-4", "vy-nebius-cpu-5"]
# scripts each PR passes, run from `main` as `python3 PATH MAIN TOP --json`, TOP its head at the ready mark's preflight, which
# refuses what they refuse. unread_gate (tools/verity/lean/unread_gate.py) refuses a merge that grows a package's unread Lean
# modules past its cap
landing_gates = ["tools/verity/lean/unread_gate.py"]
# scripts run as the landing gates are, whose failure keeps no PR out: the ready mark prints it as a warning, and the owner
# fixes it in their next PR. A Markdown file a merge puts over its cap (tests/test_repository.py)
warn_gates = ["tools/verity/check/gates/markdown_caps.py"]
# the branch the ready mark's preflight and the records gate judge a head against: "checked", the old landing branch, frozen
# while `main` doesn't hold it (the verified queue counts a head on it as landed, and lands it on `main` in an aggregate), or
# "main"
land_into = "checked"
# the low-risk lane: the verified queue lands a ready PR whose change touches nothing `lowrisk_excludes` names on its ready
# mark alone, with no land verdict (`queue.lowrisk`). false: every PR needs a reviewer's land verdict
lowrisk_lane = true
# what keeps a change off the low-risk lane: a directory from the root (ending in `/`), or a file name glob (any directory).
# Lean, its locks and Lake files, the trusted hashes, the verifiers, and the soundness-path Python (AGENTS.md's SOUNDNESS_PATH
# under verity/ml/); and the guards that hold everything else to those rules: the Lean check (tools/verity/lean/), the
# whole-tree invariants (root tests/: the import boundaries, SOUNDNESS_PATH, verifier cost), the check and this file
# (tools/verity/check/), the merge drivers (.gitattributes), and the landing rules themselves (landing.py, queue.py, the
# loop's vqueue*.py); and what runs with the control pod's or every agent's credentials once it is on main: infra/, the
# research tool (tools/research/), the agent guard and its hooks (tools/agent-guard/, .cursor/), and the environment
# (pyproject.toml, uv.lock)
lowrisk_excludes = ["*.lean", "lean-audit.json", "lakefile.*", "lean-toolchain", "lake-manifest.json", "TRUSTED.sha256",
                    "verity/core/", "verity/ml/circuits/", "verity/ml/kernels/", "verity/ml/commitments/",
                    "verity/ml/crypto/", "verity/ml/randomness/",
                    "tools/verity/lean/", "tests/", "tools/verity/check/", ".gitattributes", "landing.py", "queue.py", "vqueue*.py",
                    "infra/", "tools/research/", "tools/agent-guard/", ".cursor/", "pyproject.toml", "uv.lock"]
# count a ready mark or land verdict only when its `label_auth` label authenticates it as its author's, a Cursor identity token
# minted by the agent holding that handle in the registry or by a worker it delegated to (`research queue delegate`); ejections
# and holds count unsigned (`research.labelauth`). `ready`, `judge` and `review` sign what they can either way, and refuse
# what they can't once it is on. true is refused while the low-risk lane could land a change to the registry, labelauth.py,
# queue.py or vqueue_loop.py (`SIGNED_GUARDS`)
signed_verdicts = false
# days an open PR not marked ready at its head stays idle (its head commit, and its ready, eject and review labels there) before
# it is stale: `research queue status` says so (`research.stale`); 0 is off
stale_days = 3
# open PRs the stale rule never judges, each kept open by its owner with a reason
stale_keep = []
