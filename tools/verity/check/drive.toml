# Drive's flags, their one source: `research queue drive` reads this file at `main` in the queue's clone on every tick
# (`DriveFlags`, `drive_flags` in tools/research/src/research/queue.py), so a change here is a reviewed commit and needs no
# restart, and a temporary setting is a commit here too. A `--config FILE` on drive's machine is refused, naming each key, unless
# every key it sets has this file's value; a command-line flag overrides its key only where `command_line` lets it. Before it
# syncs, each tick refuses, with the fix, a name used here that doesn't exist: the `land_into` branch and drive's push to it,
# each machine of `on`, each of `landing_gates` (`drive_names`). ci owns this file; infra runs drive from it on the control pod.

# the keys drive's command line may override: `--on` and `--first`, which the control pod's drive args (/data/drive/args) pass;
# any other flag there refuses the tick
command_line = ["on", "first"]
# the machines train.sh launches drive's Lean checks and its after-landing run on (a machine, or `auto`)
on = ["vy-nebius-cpu-1", "vy-nebius-cpu-2", "vy-nebius-cpu-4", "vy-nebius-cpu-5"]
# ready marks written before this don't count
marked_after = "2026-10-12T06:00:00Z"
# land a prefix whose Lean check passed by committing the lock records it regenerated on top
regenerate_locks = true
# ready PRs to put at the bottom of `next`, in this order, ahead of members that keep their place (a fix `main` needs)
first = [4888, 6498, 6547, 6552, 6508, 6546, 5915, 5334, 6248, 6037, 6241]
# scripts each PR passes, run from `main` as `python3 PATH MAIN TOP --json`: TOP is its head at the ready mark's preflight, and
# its merge onto `next` at the sync, which leaves out what they refuse (a Markdown file over its cap); the
# vLLM integration's lint ratchets don't grow, and a change to a lint is judged like source. A sync's TOP holds every PR
# below it, so a gate is priced at a sync's N PRs, not one:
# ratchet_gate caches each change's verdict and judges it once per `main` (uncached, one tick ran over 50 min).
# It is left out while `main` moves only on a full check of a prefix of `next`: that check runs the vLLM lints over the
# whole tree, and each move of `main` re-judged every member cold (a 514-PR rebuild took 70 min, about 8 s a merge).
landing_gates = ["tools/verity/check/gates/markdown_caps.py"]
# how `next` lands: "review", each member on a reviewer's land verdict (`research queue review`), a Lean change once a Lean check
# passed; the only landing there is. With `land_into = "checked"`, `main` holds only fully checked commits
land = "review"
# the branch the review landing fast-forwards and `next` is built on: "checked", whose tip drive's full check (`train.sh TIP
# MACHINES`, recorded) checks after each landing; `main` moves only to a commit of `checked` whose check passed every
# step on the merge gate (not circuit-check, `gate = false` in ci.toml), and a red step's culprit is reverted on `checked`,
# never on `main`. "main" lands on `main` and checks it after. Only drive's App pushes `checked`
land_into = "checked"
# the after-landing run reuses every pass whose declared inputs are unchanged, as any check does: it gates `main`, and a cold
# run (pytest 74 min, lean-audit 73 min, circuit-check hours) holds every landing; circuit-check reuses its per-target passes
# either way. The nightly `audit-main` (`--no-cache`, no circuit cache) checks every part cold, so it checks that reuse daily
after_landing_no_cache = false
# after_landing_shards = N runs the after-landing run as N runs at once, shard K of ci.toml's plan with N shards each (`train.sh
# --deferred STEPS --shard K/N`), so it takes about its longest shard; 1 (absent) is one run of every step
after_landing_shards = 3
# the most review-landing Lean checks running at once: one, and those stacked above it on `next` for Lean changes it doesn't hold
max_lean_checks = 10
# a sync merges PRs that change no Lean below Lean changes, so they don't wait for a Lean check (members on `next` never move)
nonlean_first = false
# while no Lean check of `next` runs, members with a land verdict go below those waiting for one, so a member waiting for its
# review holds only itself (nor below a running Lean check's commit); a held member goes to `next`'s top every sync, this on or not
reviewed_first = false
# off, as nonlean_first: next lands as one checked commit, and a reorder rebuilds what its check covers
# days an open PR not marked ready at its head stays idle (its head commit, and its ready, eject and review labels there) before
# it is stale: `research queue status` says so and drive rings its owner once a day (`research.stale`); 0 is off
stale_days = 3
# days idle before drive closes such a PR, with a comment, its branch kept; never one with a hold label, a draft that says
# "keep open", or one on `next`; 0 is off
stale_close_days = 7
# PRs the stale rule never judges, kept open by their owners with a reason
stale_keep = [2692, 2693, 2705, 2948, 3205, 3401, 3573]
