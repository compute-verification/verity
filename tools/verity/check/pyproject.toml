[project]
name = "verity-check"
version = "0.0.0"
description = "`check`, the one check, run by drive on each landing's tip before `main` moves, and `suites`, the test runner it uses."
requires-python = ">=3.12"
dependencies = ["research"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_after_lean.py",
    "tests/test_anchors.py",
    "tests/test_check.py",
    "tests/test_declaration.py",
    "tests/test_deferred_run.py",
    "tests/test_guard.py",
    "tests/test_lean_audit.py",
    "tests/test_lean_changed.py",
    "tests/test_lean_prebuild.py",
    "tests/test_lean_records.py",
    "tests/test_markdown_caps_gate.py",
    "tests/test_merge_map.py",
    "tests/test_merge_rows.py",
    "tests/test_move_check.py",
    "tests/test_mutants.py",
    "tests/test_node_keys.py",
    "tests/test_pins.py",
    "tests/test_placement.py",
    "tests/test_plan.py",
    "tests/test_post_train.py",
    "tests/test_preflight.py",
    "tests/test_record_clone.py",
    "tests/test_record_pool.py",
    "tests/test_records.py",
    "tests/test_settings.py",
    "tests/test_shard_plan.py",
    "tests/test_shards.py",
    "tests/test_shipped_checkout.py",
    "tests/test_slot.py",
    "tests/test_suite_parts.py",
    "tests/test_suites.py",
    "tests/test_tasks.py",
    "tests/test_verdicts.py",
]
# The tests read the verifier's pin, replayable sets and agreement scripts (the agreement step's inputs), check.py's
# shipped-tree commit record, the flock-circuit build step's script and the patches its Rust tests cover, the repository
# lints the preflight names (and the direct environment read's detector, by which test_settings counts the reads left
# outside settings.py), and the Lean audit's tool directory: the audit's job and the fast path (`lean_audit.py`,
# `lean_changed.py`, the pin `lean-deps.json`), the sandbox lean_changed builds in, and the audit tool both load (a
# directory, since loading `check.py` reads and writes its `__pycache__`) with the task graph's contract its module keys
# load, the security proofs' manifest and record (a
# shard's package), the Slack registry, whose handles are the owners `ci.toml` may name, and what of research the fixture
# fetch and the run tooling import beyond its `exports` (with `research run --pool`'s placement, which `--record --pool`
# reuses, the check view whose circuit-check reader the live record shares, and the executor's keys and labels, which
# `tasks.py costs` reads), the move script whose word maps move_check applies, the vLLM integration's ratchet gate,
# which the ratchet-gate step runs on a toy train, and the graph's test-file runner, whose `COMPILERS` suites.py's are held to.
inputs = [".agents/skills/using-slack/registry.json", "READY.json", "tools/move/rename.py", "tools/move/layout.py", "verity/protocols/flock/prover/check_build.sh", "verity/protocols/flock/prover/flock-glue-b684b12.patch",
          "verity/protocols/flock/prover/flock-gpu-link-b684b12.patch", "verity/protocols/flock/prover/flock-link-b684b12.patch",
          "verity/protocols/flock/prover/flock-sha512-b684b12.patch", "verity/protocols/flock/prover/flock-vtime-b684b12.patch",
          "verity/protocols/flock/prover/flock-zk-b684b12.patch", "verity/protocols/flock/agreement", "verity/protocols/flock/verifier",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "tests/test_no_wall_clock.py", "tests/test_repository.py",
          "tools/verity/lean", "tools/verity/graph/verity_graph/contract.py", "tools/verity/graph/verity_graph/runners/test_file.py", "security/Proofs/lake-manifest.json", "security/Proofs/lean-audit.json",
          "tools/research/src/research/checkview.py", "tools/research/src/research/store/custody.py", "tools/research/src/research/store/evict.py",
          "tools/research/src/research/store/fetchset.py", "tools/research/src/research/store/fixtures.py",
          "tools/research/src/research/store/labels_sync.py", "tools/research/src/research/executor.py",
          "tools/research/src/research/store/sealed.py", "tools/research/src/research/telemetry/cancel.py",
          "tools/research/src/research/telemetry/classify.py", "tools/research/src/research/telemetry/procs.py",
          "tools/research/src/research/telemetry/pyspy.py", "tools/research/src/research/telemetry/run.py",
          "tools/research/src/research/telemetry/scope.py", "tools/research/src/research/auto.py",
          "tools/research/src/research/pods/nebius/slot_only.py", "adapters/vllm/tools/ratchet_gate.py",
          "tests/lint/test_repo_env_reads.py",
          "tools/research/src/research/__init__.py", "tools/verity/graph/verity_graph/__init__.py", "tools/research/src/research/store/__init__.py", "tools/research/src/research/telemetry/__init__.py",
          "tools/verity/circuit_check/src/circuit_check/cli.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_settings.py"]
paths = ["tools/verity/check"]

[[tool.verity.tests.reads]]
tests = ["tests/test_shard_plan.py"]
paths = ["fixtures/artifacts.json"]

# `check.cc_manifests`, which every step list and check run reads: whether this tree's circuit-check lists its records
[[tool.verity.tests.reads]]
tests = ["tests/test_check.py", "tests/test_declaration.py", "tests/test_deferred_run.py", "tests/test_lean_slot.py", "tests/test_live.py",
         "tests/test_record_pool.py", "tests/test_records.py", "tests/test_settings.py", "tests/test_shard_plan.py", "tests/test_shards.py",
         "tests/test_verdicts.py"]
paths = ["tools/verity/circuit_check/src/circuit_check/cli.py"]
