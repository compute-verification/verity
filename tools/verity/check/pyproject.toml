[project]
name = "verity-check"
version = "0.0.0"
description = "`check`, the one check, run by drive on each landing's tip before `main` moves, and `suites`, the test runner it uses."
requires-python = ">=3.12"
dependencies = ["research"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests read the verifier's pin, replayable sets and agreement scripts (the agreement step's inputs), check.py's
# shipped-tree commit record, the flock-circuit build step's script and the patches its Rust tests cover, the repository
# lints the preflight names, and the Lean audit's tool directory: Lean's jobs (`lean_audit.py`, `lean_changed.py`, the pin
# `lean-deps.json`), the sandbox lean_changed builds in, and the audit whose judgment of the guarantees it runs (a
# directory, since loading `check.py` reads and writes its `__pycache__`), the security proofs' manifest and record (a
# shard's package), the Slack registry, whose handles are the owners `ci.toml` may name, and what of research the fixture
# fetch and the run tooling import beyond its `exports` (with `research run --pool`'s placement, which `--record --pool`
# reuses), and the move script whose word maps move_check applies.
inputs = [".agents/skills/using-slack/registry.json", "READY.json", "tools/move/rename.py", "tools/move/layout.py", "verity/ml/flock/check_build.sh", "verity/ml/flock/flock-glue-b684b12.patch",
          "verity/ml/flock/flock-gpu-link-b684b12.patch", "verity/ml/flock/flock-link-b684b12.patch",
          "verity/ml/flock/flock-sha512-b684b12.patch", "verity/ml/flock/flock-vtime-b684b12.patch",
          "verity/ml/flock/flock-zk-b684b12.patch", "verity/ml/flock/verifier", "verity/core/service/flock",
          "tests/test_no_wall_clock.py", "tests/test_repository.py",
          "tools/verity/lean", "Security/Proofs/lake-manifest.json", "Security/Proofs/lean-audit.json",
          "tools/research/src/research/store/custody.py", "tools/research/src/research/store/evict.py",
          "tools/research/src/research/store/fetchset.py", "tools/research/src/research/store/fixtures.py",
          "tools/research/src/research/store/labels_sync.py",
          "tools/research/src/research/store/sealed.py", "tools/research/src/research/telemetry/cancel.py",
          "tools/research/src/research/telemetry/classify.py", "tools/research/src/research/telemetry/procs.py",
          "tools/research/src/research/telemetry/pyspy.py", "tools/research/src/research/telemetry/run.py",
          "tools/research/src/research/telemetry/scope.py", "tools/research/src/research/auto.py",
          "tools/research/src/research/pods/nebius/slot_only.py"]
