# The jobs `check` runs, written as data: who owns each, which group it runs in, and what its failure means for the run. Which
# of them gate a merge, and what may stay red, is drive's policy (policy.toml), not this file's.
# `declaration.py` reads this file without running any of the commit's code. check.py takes its groups, their order and
# what halts the run from here, builds each job's command, and refuses a job this file doesn't declare: owners declare their
# jobs here, and `check` runs them.
schema = "ci/v0"

# Group 1: the test suites (tools/verity/check/suites.py), each suite owned by its package.
[[job]]
name = "pytest"
owner = "ci"
part = "tests"
group = 1

# Group 2: Flock's Rust build and tests, and the property checks every circuit passes.
[[job]]
name = "flock-circuit-build"
owner = "proofs"
part = "circuits"
group = 2
halts_on = "error: could not compile"

# Before circuit-check: a group stops at its first failed job, and circuit-check is off the merge gate, so its red must not keep
# this job, which is on it, from running.
[[job]]
name = "flock-rust-tests"
owner = "proofs"
part = "circuits"
group = 2
needs = ["flock-circuit-build"]

[[job]]
name = "circuit-check"
owner = "circuits"
part = "circuits"
group = 2
# its targets in 4 shards by the hash of each one's id, parts circuit-check:1/4 .. 4/4: a check that holds all four runs
# `circuit-check --all` whole; one that holds some runs `--all --shard K/4` for each, and `check.py --combine` joins the shards
# (`circuit-check --combine`), whose verdict is the unsharded run's
shards = 4
# Off the merge gate by drive's policy (policy.toml's `off_gate`): the plans keep it, so putting it back is one line there. Its red
# in drive's after-landing run names its culprit as any red does, and lands no PR touching its inputs until it passes.

# Group 3: the Lean verifier, its partition check, then the agreement with upstream's Rust verifier.
[[job]]
name = "lean-build"
owner = "proofs"
part = "lean"
group = 3

[[job]]
name = "lean-unit-cut"
owner = "proofs"
part = "lean"
group = 3
needs = ["lean-build"]

[[job]]
name = "lean-agreement"
owner = "proofs"
part = "lean"
group = 3
needs = ["lean-build"]
# parts named apart from their directory: a move that sends one elsewhere keeps it under the gate
merge_requires = ["verity/protocols/flock/prover/", "verity/protocols/flock/pod/", "verity/protocols/flock/agreement/", "verity/protocols/flock/tool.py",
                  "verity/protocols/flock/verifier/", "!README.md", "!PROTOCOL.md"]

# Group 4: every Lake package's audit. It builds only in scratch trees of its own, so nothing in group 3 waits on it.
[[job]]
name = "lean-audit"
owner = "lean"
part = "lean"
group = 4

# Group 5: the early Lean check on a merge (stale records, broken builds); its failure stops the whole run.
[[job]]
name = "lean-changed"
owner = "lean"
part = "lean"
group = 5
halts = true

# Group 6: the suites that use Lean, on the verifier lean-build built, beside the partition check and the agreement.
[[job]]
name = "lean-suites"
owner = "ci"
part = "tests"
group = 6
after = "lean-build"
# V*'s stager and its Lean mirror (VStar.In) stay in step: core_vstar's `part_in` difftest holds one to the other.
merge_requires = ["verity/protocols/flock/prover/python/verity_flock/rec_vstage.py", "verity/protocols/flock/prover/python/verity_flock/rec_outer.py",
                  "verity/protocols/flock/prover/python/verity_flock/rec_open.py", "verity/protocols/flock/prover/python/verity_flock/rec_residuals.py",
                  "verity/protocols/flock/prover/python/verity_flock/rec_cap.py", "verity/protocols/flock/prover/python/verity_flock/circuit.py",
                  "verity/protocols/spot/verifier/one_stage/registered.py", "verity/protocols/flock/verifier/VStar/In.lean",
                  "verity/protocols/recursion/verifier/vstar_cli/", "verity/protocols/recursion/verifier/recursive/"]

# Group 7: no merge above the check's base grows the vLLM integration's lint ratchets (`ratchet_gate.py`, as the base has it):
# on a train, each `Queue: #N` merge against the one below, so a failure names its PR.
[[job]]
name = "ratchet-gate"
owner = "vllm"
part = "tests"
group = 7
# Off the merge gate by drive's policy (policy.toml's `off_gate`) and out of the plans. It runs in drive's after-landing run
# (`--deferred`, every job, its base the last verified commit; sharded, in its last shard), where a red's culprit is the
# landing whose merge it names.

# The shard plans: `check.py --record --shard K/N --on POD` runs shard K of the plan with N shards, on a pod of the lander's
# choosing, and `check.py --record --combine RUN...` records their union as the commit's check (`research merge` re-reads the
# shards). These are written by hand and stay as fallbacks: `--shard auto[:MAX]` plans the shards from measured costs instead
# (`shards.py`, `check.py --shard-plan` prints the plan), N the fewest that reach the critical path. Balanced on a cold check's
# costs, whose longest part is the security analysis's audit.
# lean-audit runs on a scratch tree, so a shard audits without lean-build; the jobs that read lean-build's binaries `needs`
# it, or run `after` it, and a shard that holds one of them whole holds it too. lean-suites is split by suite: a shard that
# holds some of its parts and not lean-build builds the verifier again beside them, a short build.
# The spec and security/Properties are audited beside their proofs (security/Proofs, which their `proved_in` names), from one
# build of the proofs, so the three share a shard; a spec package a plan doesn't name goes with its provers
# (`declaration.resolve`), and no plan names the spec: its path is the analysis directory's bare name.
# The composition suite (verity-core-composition) declares three parts by test id (`[tool.verity.tests] parts`), so that no
# shard runs it whole: each plan puts one beside the security analysis's audit, one with the rest of lean-suites, and one with
# the Rust build.

# 3 pods: the security analysis's audit beside the suites; the rest of the Lean; the Rust build and the circuits.
[[plan]]
shards = [
    ["lean-audit:security/Proofs", "lean-audit:security/Properties", "pytest",
     "lean-suites:verity-core-composition:3/3"],
    ["lean-build", "lean-unit-cut", "lean-audit:*", "lean-suites:verity-core-composition:1/3", "lean-suites:*", "lean-agreement",
     "lean-changed"],
    ["flock-circuit-build", "circuit-check", "flock-rust-tests", "lean-suites:verity-core-composition:2/3"],
]

# 4 pods: the 3-pod plan with pytest on a pod of its own, and circuit-check's four shards one to each pod, so a cold
# circuit-check is no single pod's long pole.
[[plan]]
shards = [
    ["lean-audit:security/Proofs", "lean-audit:security/Properties", "circuit-check:1/4",
     "lean-suites:verity-core-composition:3/3"],
    ["lean-build", "lean-unit-cut", "lean-audit:*", "lean-suites:verity-core-composition:1/3", "lean-suites:*", "lean-agreement",
     "lean-changed", "circuit-check:2/4"],
    ["pytest", "circuit-check:3/4"],
    ["flock-circuit-build", "flock-rust-tests", "circuit-check:*", "lean-suites:verity-core-composition:2/3"],
]

# 5 pods: each of those apart.
[[plan]]
shards = [
    ["lean-audit:security/Proofs", "lean-audit:security/Properties", "lean-suites:verity-core-composition:3/3"],
    ["lean-audit:*", "lean-changed"],
    ["lean-build", "lean-unit-cut", "lean-suites:verity-core-composition:1/3", "lean-suites:*", "lean-agreement"],
    ["pytest"],
    ["flock-circuit-build", "circuit-check", "flock-rust-tests", "lean-suites:verity-core-composition:2/3"],
]
