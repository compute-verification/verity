[project]
name = "verity-circuit-check"
version = "0.1.0"
description = "circuit-check: the standard property checks every Definition, subcircuit template and served workload passes (correspondence with the reference evaluator on edge inputs, redundant and dead gates, the partition invariant, Boolean lowering pins)."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-flock", "verity-numerical", "numpy"]

[project.scripts]
circuit-check = "circuit_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_check"]

[tool.uv.sources]
verity = { workspace = true }
verity-vllm = { workspace = true }
verity-flock = { workspace = true }
verity-numerical = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_ambient.py",
    "tests/test_cache.py",
    "tests/test_cache_imports_and_moves.py",
    "tests/test_cache_redteam.py",
    "tests/test_circuit_check.py",
    "tests/test_metadata_listings.py",
    "tests/test_named_targets.py",
    "tests/test_shard.py",
    "tests/test_units.py",
]
# a pass can take up to an hour, past suites.py's SUITE_TIMEOUT_S
timeout_s = 7200
# its tests are independent; serially the suite is the check's critical path
parallel = true
# one xdist worker's share, which `--mem-gb` (else the cgroup's memory.max) divides by. Each worker of a run with a slow catalog
# test makes circuit-check's catalog before any test runs (conftest.py's `catalog`; `--quick` makes none) from what each catalog
# binding reaches, building no body: about 2.6 GiB. Where no record of this checker's version counts, the
# first worker builds that, a process forked per binding, while the others wait: its processes take what the workers' shares
# leave as they wait (conftest.py's `_budget`), each counted at what `heavy.json` says it grows.
# Built whole in each worker instead, the catalog takes a worker past 50 GB. A circuit-check a test starts
# keeps to this share too (conftest.py's `worker_slot_gb`).
worker_gb = 8
# In place of its dependencies' directories (`inputs_only`; `verity`'s brings the root's dev group, the whole workspace): the
# packages that define Definitions and templates, with their sidecars (`sidecars.discover` searches every package root, so a
# sidecar anywhere else is read outside these and fails the guard), and the modules they import. Test-only:
# test_sampled_replay.py (test_circuit_check.py's request Program), with verity_vllm/records, which its replay modules import.
# verity_vllm/engine/spec.py: what the package's lazy `EngineSpec` (in its `__all__`) imports when a session fixture resolves
# the package's names. verity_vllm/engine/__init__.py and served_seed.py: program/frontend/seed_rule.py's sidecar builds the
# served seed rule, whose domain tag and derivation are served_seed's.
# pouw/window.py: circuit/window_statement.py imports it (the statement on words and the entry row's layout), so building
# its unit reads it, and the catalog's records digest it as an import site of the PoUW modules they hold
# (`units._unchanged`).
# Read only to check the catalog's records (conftest.py):
# spot/service.py, which the records digest as such an import site too and which a whole build never imports, with
# spot/second_stage.py, which service.py imports, and spot/schedule.py, which second_stage.py imports.
# pouw/weights.py and spot/__init__.py: h1zy reads an
# H1 lane's chunks along K from weights (`chunks`), and weights imports one_stage. spot/challenger.py and
# claims/__init__.py: pouw/coins.py names its entropy's claim instance through the challenger's `coin_claim`.
inputs_only = true
inputs = ["verity/__init__.py", "verity/settings.py", "verity/errors.py", 
          "verity/protocols/spot/verifier/__init__.py",
          "verity/hardware/record.py",
          "verity/circuits", "verity/commitments", "verity/commitments/crypto", "verity/definitions/kernels", "verity/definitions/private_circuits",
          "verity/commitments/randomness", "verity/definitions", "verity/protocols/flock/prover/python/verity_flock", "verity/commitments/windows",
          "verity/protocols/pouw/verifier/__init__.py", "verity/protocols/pouw/verifier/audit.py", "verity/protocols/pouw/verifier/salt.py",
          "verity/protocols/pouw/verifier/protocol.py",
          # circuit/h1window.py imports both, so building the H1 units reads them.
          "verity/protocols/pouw/verifier/core_check.py", "verity/protocols/pouw/verifier/leaf_lanes.py",
          "verity/protocols/pouw/verifier/serving.py", "verity/protocols/pouw/verifier/registration.py", "verity/protocols/pouw/verifier/coins.py",
