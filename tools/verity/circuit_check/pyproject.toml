[project]
name = "verity-circuit-check"
version = "0.1.0"
description = "circuit-check: the standard property checks every Definition, subcircuit template and served row passes (correspondence with the reference evaluator on edge inputs, redundant and dead gates, the partition invariant, Boolean lowering pins)."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-flock", "verity-numerical", "numpy"]

[project.scripts]
circuit-check = "circuit_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_check"]

[tool.uv.sources]
verity = { workspace = true }
verity-vllm = { workspace = true }
verity-flock = { workspace = true }
verity-numerical = { workspace = true }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
    "circuit_suite: one circuit-check target per test, the checks `circuit-check --all` runs; collected only under -m circuit_suite",
]

[tool.verity.tests]
# its passes on vy-nebius-1 took up to an hour (3,634 s, 7 Oct), past suites.py's SUITE_TIMEOUT_S
timeout_s = 7200
# its tests are independent (122 passed under 12 xdist workers, r20261015-040240-480b); serially the suite was the check's
# critical path, 3,916-4,445 s on 14 Oct
parallel = true
# one xdist worker's share, which `--mem-gb` (else the cgroup's memory.max) divides by. A worker's peak is circuit-check's
# catalog, which each worker of a run with a slow catalog test builds before any test runs (conftest.py's `catalog`; `--quick`
# builds none), and which grows with the catalog. Built whole, as it is wherever no record of this checker's version counts (a
# host without `check`'s records, or any change to circuit_check's sources, which `cache.version` digests), a process peaks at
# 52.8 GB (49.2 GiB) in `targets.reachable`'s walk, then holds 36 GB, and its heaviest test takes it to 40 GB (one process,
# r20261022-105829-2a96, 22 Oct). Each of 5 workers peaked at 52.5-52.8 GB (r20261022-093136-5cbf), and 8 workers at a share of
# 32 were OOM-killed under a 256 GiB cap (r20261022-080440-0443). From records, a process peaks at 12.5 GB (r20261022-025816-1e70).
# The whole build's peak was 27.4 GB on 18 Oct (r20261018-081851-e1ef). A circuit-check a test starts keeps to this share too
# (conftest.py's `worker_slot_gb`).
worker_gb = 54
# In place of its dependencies' directories (`inputs_only`; `verity`'s brings the root's dev group, the whole workspace): the
# packages that define Definitions and templates, with their sidecars (`sidecars.discover` searches every package root, so a
# sidecar anywhere else is read outside these and fails the guard), and the modules they import. Test-only:
# test_sampled_replay.py (test_circuit_check.py's request Program). Read only to check the catalog's records (conftest.py):
# pouw/window.py and sampled_proofs/service.py, which the records digest as import sites of the PoUW modules they hold
# (`units._unchanged`), and which a whole build never imports. pouw/weights.py and sampled_proofs/__init__.py: h1zy reads an
# H1 lane's chunks along K from weights (`chunks`), and weights imports one_stage. sampled_proofs/challenger.py and
# claims/__init__.py: pouw/coins.py names its entropy's claim instance through the challenger's `coin_claim`.
inputs_only = true
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py", "verity/ml/__init__.py",
          "verity/core/protocols/sampled_proofs/__init__.py",
          "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto", "verity/ml/kernels", "verity/ml/private_circuits",
          "verity/ml/randomness", "verity/ml/flock/python/verity_flock", "verity/ml/windows",
          "verity/core/protocols/pouw/__init__.py", "verity/core/protocols/pouw/audit.py", "verity/core/protocols/pouw/salt.py",
          "verity/core/protocols/pouw/protocol.py",
          "verity/core/protocols/pouw/serving.py", "verity/core/protocols/pouw/registration.py", "verity/core/protocols/pouw/coins.py",
          "verity/core/protocols/sampled_proofs/challenger.py", "verity/core/claims/__init__.py",
          "verity/core/protocols/pouw/grind.py", "verity/core/protocols/pouw/circuit", "verity/core/protocols/pouw/schemes",
          "verity/core/protocols/pous/__init__.py", "verity/core/protocols/pous/circuit.py",
          "verity/core/protocols/pous/circuit.circuit-check.py", "verity/core/protocols/pous/circuit.circuit-check.json",
          "verity/core/protocols/pous/answer_circuit.py", "verity/core/protocols/pous/answer_circuit.circuit-check.py",
