[project]
name = "verity-cli"
version = "0.0.0"
description = "`verity`: the repository's one command (check, bench, example, lean), dispatching to the tools beside it."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
verity = "verity_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_cli"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
