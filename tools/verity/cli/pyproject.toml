[project]
name = "verity-cli"
version = "0.0.0"
description = "`verity`: the repository's one command (check, bench, run, config, --remote), dispatching to the tools beside it."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
verity = "verity_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_cli"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity run` and `verity config` (`tests/test_run.py`): `verity`, the configuration's checks
# (`verity.core.deploy.config`) and what step 0's declarations read (`WardenParams`, the law parser); step 0's table
# (`benchmarks/all_protocols/verity_all_protocols/deployment.py`) and the parties and product it wraps; and the example
# the test holds to `verity config new`.
inputs = ["verity", "benchmarks/all_protocols", "examples/toy-network/config.toml"]
