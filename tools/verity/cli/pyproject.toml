[project]
name = "verity-cli"
version = "0.0.0"
description = "`verity`: the repository's one command (check, bench, --remote), dispatching to the tools beside it."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
verity = "verity_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_cli"]
dev-mode-exact = true
