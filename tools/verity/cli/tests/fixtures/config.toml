# The deployment configuration of sampled-proofs and pouw and inference-only on the toy workload (`verity config new`), every party
# on local: `verity run` this file. Parameters it doesn't state are their declarations' defaults.
format = "verity/config/v0"
protocols = ["sampled-proofs", "pouw", "inference-only"]

[workload]
name = "toy"

[service]
law = "subset:8"

[program]
commit = "ed7f3bdcea6d1966c489c0b8e1cbccabe7cd89bc"

[[party]]
name = "workers"
machine = "local"
principal = "developer"

[[party]]
name = "challenger"
machine = "local"
principal = "auditor"

[[party]]
name = "firewall"
machine = "local"
principal = "developer"

[[party]]
name = "verifier"
machine = "local"
principal = "auditor"

[[channel]]
from = "workers"
to = "verifier"
messages = ["registration"]

[[channel]]
from = "verifier"
to = "challenger"
messages = ["open", "finish"]
after = ["registration"]

[[channel]]
from = "challenger"
to = "verifier"
messages = ["coins", "record"]
after = ["open"]

[[channel]]
from = "verifier"
to = "workers"
messages = ["draw"]
after = ["coins"]

[[channel]]
from = "workers"
to = "firewall"
messages = ["witness"]
after = ["draw"]

[[channel]]
from = "firewall"
to = "verifier"
messages = ["proof"]
after = ["draw"]
