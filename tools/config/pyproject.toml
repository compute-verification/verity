[project]
name = "verity-config"
version = "0.1.0"
description = "Strict configuration loading and canonical resource identities for Verity."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_config"]

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.verity.tests]
# In place of `verity` whole (`inputs_only`): the settings machinery its registries are built on.
inputs_only = true
inputs = ["verity/__init__.py", "verity/settings.py"]
exports = ["tools/config/verity_config"]
