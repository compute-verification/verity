[project]
name = "verity-config"
version = "0.1.0"
description = "Strict configuration loading and canonical resource identities for Verity."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_config"]

[tool.uv.sources]
verity = { workspace = true }

[tool.verity.tests]
exports = ["tools/config/verity_config"]
