[project]
name = "research"
version = "0.1.0"
description = "Shared tooling for executing, observing, and coordinating computational work during development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only, and to move: some tests exercise this repository's Tools, workspace and fixtures rather than the tool itself.
# test_store_vllm_tools loads the vLLM stage Tools and hashes their closure (integrations/vllm, verity,
# catalog, kernels, core);
# test_store_prov loads the tc_probe and bench_vu declarations (benchmarks/tc_probe, archive/direct), content-resolves a golden
# fixture (verity/ml/circuits/ops/tests/fixtures) and git-archives benchmarks/tc_probe and verity/ml/circuits/silicon;
# test_repo_replicas hashes every tracked fixture fixtures/artifacts.json registers (today under fixtures, integrations/vllm
# and verity/ml/circuits/ops/tests/fixtures). test_pythonpath and test_notes derive every workspace member's import root from the
# workspace's pyproject.toml files (research/pythonpath.py) and find each package in an untraced child, so those files are
# listed: moving a member's root selects this suite. tools/verity/check/tool.py stays: the train gate parses it on main, and
# test_jobs_vectors checks that it still can. infra/cluster: the console computes its usage rows with cluster.usage, and
# `research usage` runs `cluster usage`. tools/verity/check/slot.py and lean_slot.py: the quick tier and the Lean sandbox ship
# them to the node (test_queue, test_merge_gate, test_nebius_lean_sandbox).
inputs = [".agents/skills", "verity/README.md", ".gitignore", "archive/direct", "fixtures", "infra/ops", "integrations/vllm", "verity", "verity/ml/circuits", "verity/ml/kernels",
          "verity/core", "tools/verity/check/lean_slot.py", "tools/verity/check/slot.py", "tools/verity/check/tool.py", "benchmarks/tc_probe",
          "pyproject.toml", "verity/ml/flock/pyproject.toml", "archive/gkr/pyproject.toml", "benchmarks/numerical/pyproject.toml",
          "archive/sp1/pyproject.toml", "benchmarks/commitments/pyproject.toml", "benchmarks/network_traces/pyproject.toml",
          "benchmarks/pouw/pyproject.toml", "tools/verity/check/pyproject.toml", "tools/verity/circuit_check/pyproject.toml",
          "infra/cluster", "tools/verity/lean/pyproject.toml", "tools/verity/lean/run_daily.py", "benchmarks/native_peak/pyproject.toml",
          "benchmarks/tc_probe_fp4/pyproject.toml"]
parallel = true
# What the suites of packages depending on research read of it, and so key on in place of this directory: the store and its
# telemetry, running and recording a run (`python -m research`, its CLI's other commands imported only when run), the merge
# gate and queue `check` drives, and the pod registry; of the store and telemetry, the files a `research data fetch` and a run's
# record import, so the store's bucket index, custody and eviction aren't inputs of every dependent. Not the coordination tooling
# (Slack, notes, monitors, the steward) nor pods/nebius, which verity-ops declares. A dependent's test that reads another file
# of it fails the guard until it is listed.
exports = ["tools/research/src/research/__init__.py", "tools/research/src/research/__main__.py", "tools/research/src/research/cli.py",
           "tools/research/src/research/clone.py", "tools/research/src/research/compare.py", "tools/research/src/research/env.py",
           "tools/research/src/research/gates.py", "tools/research/src/research/merge.py", "tools/research/src/research/pythonpath.py",
           "tools/research/src/research/queue.py", "tools/research/src/research/quick_tier.py", "tools/research/src/research/record.py",
           "tools/research/src/research/remote.py", "tools/research/src/research/result.py", "tools/research/src/research/runs.py",
           "tools/research/src/research/secret_hint.py", "tools/research/src/research/timefmt.py",
           "tools/research/src/research/pods/__init__.py", "tools/research/src/research/pods/registry.py",
           "tools/research/src/research/pods/runpod.py",
           "tools/research/src/research/store/__init__.py", "tools/research/src/research/store/attempt.py",
           "tools/research/src/research/store/canon.py", "tools/research/src/research/store/cli.py",
           "tools/research/src/research/store/cli_prov.py", "tools/research/src/research/store/derivation.py",
           "tools/research/src/research/store/ids.py", "tools/research/src/research/store/index.py",
           "tools/research/src/research/store/kinds.py", "tools/research/src/research/store/local.py",
           "tools/research/src/research/store/model.py", "tools/research/src/research/store/remote.py",
           "tools/research/src/research/store/remote_s3.py", "tools/research/src/research/store/tool.py",
           "tools/research/src/research/store/tools_registry.py", "tools/research/src/research/store/vocab.py",
           "tools/research/src/research/telemetry/__init__.py", "tools/research/src/research/telemetry/cgroup.py",
           "tools/research/src/research/telemetry/events.py", "tools/research/src/research/telemetry/job.py",
           "tools/research/src/research/telemetry/source_identity.py"]
