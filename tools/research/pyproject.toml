[project]
name = "research"
version = "0.1.0"
description = "Shared tooling for executing, observing, and coordinating computational work during development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only, and to move: test_store_vllm_tools, test_repo_replicas, test_pythonpath and one test each in test_notes and
# test_store_prov exercise this repository's Tools, workspace and fixtures rather than the tool itself.
inputs = [".agents/skills", ".gitignore", "backends/direct", "fixtures", "integrations/vllm", "packages/verity", "tools/tc_probe"]
