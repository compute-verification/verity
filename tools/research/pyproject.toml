[project]
name = "research"
version = "0.1.0"
description = "Shared tooling for executing, observing, and coordinating computational work during development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only, and to move: some tests exercise this repository's Tools, workspace and fixtures rather than the tool itself.
# test_store_vllm_tools loads the vLLM stage Tools and hashes their closure (integrations/vllm, verity);
# test_store_prov loads the tc_probe and bench_vu declarations (tools/tc_probe, archive/direct), content-resolves a golden
# fixture (catalog/tests/fixtures) and git-archives tools/tc_probe and catalog/verity_catalog/silicon;
# test_repo_replicas hashes every tracked fixture fixtures/artifacts.json registers (today under fixtures, integrations/vllm
# and catalog/tests/fixtures). test_pythonpath and test_notes derive every workspace member's import root from the
# workspace's pyproject.toml files (research/pythonpath.py) and find each package in an untraced child, so those files are
# listed: moving a member's root selects this suite. tools/check/tool.py stays: the train gate parses it on main, and
# test_jobs_vectors checks that it still can. tools/check/slot.py and lean_slot.py: the quick tier and the Lean sandbox ship
# them to the node (test_queue, test_merge_gate, test_nebius_lean_sandbox).
inputs = [".agents/skills", ".gitignore", "archive/direct", "fixtures", "integrations/vllm", "verity",
          "catalog/tests/fixtures", "tools/check/lean_slot.py", "tools/check/slot.py", "tools/check/tool.py",
          "tools/tc_probe",
          "pyproject.toml", "backends/flock/pyproject.toml", "archive/gkr/pyproject.toml", "benchmarks/numerical/pyproject.toml",
          "archive/sp1/pyproject.toml", "benchmarks/commitments/pyproject.toml", "benchmarks/network_traces/pyproject.toml",
          "benchmarks/pouw/pyproject.toml", "verity/pyproject.toml", "verity/protocols/accounting/communication/warden/pyproject.toml",
          "verity/protocols/accounting/space/pous/pyproject.toml", "verity/protocols/accounting/work/pouw/pyproject.toml", "verity/protocols/verification/sampled_proofs/pyproject.toml",
          "tools/check/pyproject.toml", "tools/circuit_check/pyproject.toml", "tools/cluster/pyproject.toml",
          "tools/lean/pyproject.toml", "tools/native_peak/pyproject.toml", "tools/tc_probe_fp4/pyproject.toml"]
parallel = true
