# Test-only, and to move: some tests exercise this repository's Tools, workspace and fixtures rather than the tool itself.
# test_store_vllm_tools loads the vLLM stage Tools and hashes their closure (adapters/vllm, verity,
# catalog, kernels, core);
# test_store_prov loads the tc_probe declaration (benchmarks/tc_probe), content-resolves a golden
# fixture (verity/definitions/ops/tests/fixtures) and git-archives benchmarks/tc_probe and verity/definitions/silicon;
# test_repo_replicas hashes every tracked fixture fixtures/artifacts.json registers (today under fixtures, adapters/vllm
# and verity/definitions/ops/tests/fixtures). test_pythonpath and test_notes derive every workspace member's import root from the
# workspace's pyproject.toml files (research/pythonpath.py) and find each package in an untraced child, so those files are
# listed: moving a member's root selects this suite. tools/verity/check/tool.py stays: the train gate parses it on main, and
# test_jobs_vectors checks that it still can. infra/cluster: the console computes its usage rows with cluster.usage, and
# `research usage` runs `cluster usage`. tools/verity/check/slot.py and lean_slot.py: the quick tier and the Lean sandbox ship
# them to the node (test_queue, test_merge_gate, test_nebius_lean_sandbox). tools/verity/lean/merge.py and check.py: test_queue
# commits them into its origin so the queue's clone runs the `lean-audit` record driver it configures. tools/verity/check/suites.py
# and the settings it reads: test_queue commits them into its origin, so the preflight's tests select suites by its own `touched`.
# tools/verity/check/gates/markdown_caps.py and tests/test_repository.py: test_queue commits them into its origin, so its sync
# runs the Markdown caps' landing gate on the caps it reads. tools/verity/check/pins.py: test_queue commits it into its origin, so
# the sync's pin rebuild (`repinned`) reads the real `PINS`. tools/verity/graph/tests/key_vectors.json: test_executor holds
# the executor client's graph/v2 key rule to the vectors both sides of the contract reproduce. tools/verity/lean/lean_changed.py
# and the files its `--inputs-key` loads (lean_audit.py, settings.py, module_keys.py, headers.py, check.py, siblings.py, axiom_probe.py,
# tools/verity/check/common.py, slot.py, lean_slot.py, tools/verity/graph/verity_graph/contract.py): test_queue commits them
# into its origin, so the records gate keys each commit's Lean inputs with its own code (`lean_keys`). tools/move/rename.py,
# layout.py and restack.py: test_queue_moves_carry commits them into its origin and restacks a head across the moves they make.
inputs = [".agents/skills", "verity/README.md", ".gitignore", "fixtures", "infra/ops", "adapters/vllm", "verity", "verity/circuits", "verity/definitions/kernels",
          "tools/verity/check/lean_slot.py", "tools/verity/check/slot.py", "tools/verity/check/tool.py", "tools/verity/check/drive.toml", "benchmarks/tc_probe",
