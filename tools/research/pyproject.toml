[project]
name = "research"
version = "0.1.0"
description = "Shared tooling for executing, observing, and coordinating computational work during development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only, and to move: some tests exercise this repository's Tools, workspace and fixtures rather than the tool itself.
# test_store_vllm_tools loads the vLLM stage Tools and hashes their closure (integrations/vllm, packages/verity/src);
# test_store_prov loads the tc_probe and bench_vu declarations (tools/tc_probe, backends/direct), content-resolves a golden
# fixture (packages/verity/tests/ml/fixtures) and git-archives tools/tc_probe and packages/verity/src/verity/ml/tc;
# test_repo_replicas hashes every tracked fixture fixtures/artifacts.json registers (today under fixtures, integrations/vllm
# and packages/verity/tests/ml/fixtures).
inputs = [".agents/skills", ".gitignore", "backends/direct", "fixtures", "integrations/vllm", "packages/verity/src",
          "packages/verity/tests/ml/fixtures", "tools/tc_probe"]
parallel = true
