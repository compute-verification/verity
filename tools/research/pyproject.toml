          "benchmarks/harness/pyproject.toml", "benchmarks/commitments/pyproject.toml", "benchmarks/network_traces/pyproject.toml",
          "benchmarks/pouw/pyproject.toml", "tools/verity/check/pyproject.toml", "tools/verity/check/settings.py",
          "tools/verity/circuit_check/pyproject.toml",
          "infra/cluster", "tools/verity/lean/pyproject.toml", "tools/verity/lean/run_daily.py", "tools/verity/lean/merge.py",
          "tools/verity/lean/check.py", "tools/verity/check/suites.py", "tools/verity/check/gates/markdown_caps.py", "tests/test_repository.py", "tests/test_retired_terms.py", "tools/verity/check/pins.py", "benchmarks/native_peak/pyproject.toml",
          "benchmarks/tc_probe_fp4/pyproject.toml", "tools/move/rename.py", "tools/move/layout.py", "tools/move/restack.py",
          "tools/verity/graph/tests/key_vectors.json", "tools/verity/lean/lean_changed.py",
          "tools/verity/lean/lean_audit.py", "tools/verity/lean/module_keys.py", "tools/verity/lean/headers.py",
          "tools/verity/lean/siblings.py", "tools/verity/lean/axiom_probe.py", "tools/verity/lean/settings.py", "tools/verity/check/common.py",
          "tools/verity/graph/verity_graph/contract.py",
          "tools/verity/graph/verity_graph/__init__.py"]
parallel = true
# What the suites of packages depending on research read of it, and so key on in place of this directory: the store and its
# telemetry, running and recording a run (`python -m research`, its CLI's other commands imported only when run), the merge
# gate and queue `check` drives (with the Linear client the queue imports), the memory reservations a check slot holds (`mem`),
# and the pod registry; of the store and telemetry, the files a `research data fetch` and a run's record import, so the store's
# bucket index, custody and eviction aren't inputs of every dependent. Not the rest of the coordination tooling (Slack, notes,
# monitors, the steward) nor pods/nebius, which verity-ops declares. A dependent's test that reads another file of it fails the
# guard until it is listed.
exports = ["tools/research/src/research/__init__.py", "tools/research/src/research/__main__.py", "tools/research/src/research/cli.py",
