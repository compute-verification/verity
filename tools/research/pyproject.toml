[project]
name = "research"
version = "0.1.0"
description = "Shared tooling for executing, observing, and coordinating computational work during development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.verity.tests]
# What the suites of packages depending on research read of it, and so key on in place of this directory: the store and its
# telemetry, running and recording a run (`python -m research`, its CLI's other commands imported only when run), the merge
# gate and queue `check` drives (with the Linear client the queue imports), the suite layout rule the runner reads
# (`suite_layout`), the memory reservations a check slot holds (`mem`),
# and the pod registry; of the store and telemetry, the files a `research data fetch` and a run's record import, so the store's
# bucket index, custody and eviction aren't inputs of every dependent. Not the rest of the coordination tooling (Slack, notes,
# monitors, the steward) nor pods/nebius, which verity-ops declares. A dependent's test that reads another file of it fails the
# guard until it is listed.
exports = ["tools/research/src/research/__init__.py", "tools/research/src/research/__main__.py", "tools/research/src/research/cli.py",
           "tools/research/src/research/clone.py", "tools/research/src/research/compare.py", "tools/research/src/research/env.py",
           "tools/research/src/research/gates.py", "tools/research/src/research/launcher.py", "tools/research/src/research/linear.py",
           "tools/research/src/research/mem.py",
           "tools/research/src/research/merge.py", "tools/research/src/research/policy.py",
           "tools/research/src/research/pipefail.py",
           "tools/research/src/research/pythonpath.py", "tools/research/src/research/queue.py",
           "tools/research/src/research/quick_tier.py", "tools/research/src/research/record.py",
           "tools/research/src/research/remote.py", "tools/research/src/research/result.py", "tools/research/src/research/runs.py",
           "tools/research/src/research/treelock.py", "tools/research/src/research/withdraw.py",
           "tools/research/src/research/secret_hint.py", "tools/research/src/research/settings.py",
           "tools/research/src/research/suite_layout.py", "tools/research/src/research/timefmt.py",
           "tools/research/src/research/waitcap.py",
           "tools/research/src/research/pods/__init__.py", "tools/research/src/research/pods/registry.py",
           "tools/research/src/research/pods/runpod.py", "tools/research/src/research/pods/nebius/tool_rules.py",
           "tools/research/src/research/store/__init__.py", "tools/research/src/research/store/attempt.py",
           "tools/research/src/research/store/canon.py", "tools/research/src/research/store/cli.py",
           "tools/research/src/research/store/cli_prov.py", "tools/research/src/research/store/credentials.py",
           "tools/research/src/research/store/derivation.py",
           "tools/research/src/research/store/ids.py", "tools/research/src/research/store/index.py",
           "tools/research/src/research/store/kinds.py", "tools/research/src/research/store/local.py",
           "tools/research/src/research/store/model.py", "tools/research/src/research/store/remote.py",
           "tools/research/src/research/store/remote_s3.py", "tools/research/src/research/store/tool.py",
           "tools/research/src/research/store/tools_registry.py", "tools/research/src/research/store/vocab.py",
           "tools/research/src/research/telemetry/__init__.py", "tools/research/src/research/telemetry/cgroup.py",
