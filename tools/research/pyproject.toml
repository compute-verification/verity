[project]
name = "research"
version = "0.1.0"
description = "Shared tooling for executing, observing, and coordinating computational work during development."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]
