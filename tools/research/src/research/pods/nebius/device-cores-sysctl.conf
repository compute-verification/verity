# /etc/sysctl.d/90-vy-device-cores.conf on vy-nebius-2: kernel settings its device cores 120-127 need from boot (vy-device-cores
# sets the same at runtime). Automatic NUMA balancing unmaps pages to sample access faults and migrates them, which stalled
# the memory challenger on 124 for milliseconds at a time. vmstat_update every 10 s, not 1 s.
kernel.numa_balancing = 0
vm.stat_interval = 10
