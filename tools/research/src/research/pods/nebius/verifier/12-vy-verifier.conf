# The verifier host's tunnel accounts (vy-auditor-1; benchmarks/live_verifier/host.py, vy-verifier-setup): beside research (each
# key forced to vy-verifier-gate) and vy-admin (11-vy-admin.conf), two accounts that only forward, each to its own ports, their
# keys in root's files (vy-verifier-setup TUNNEL_KEYS) and their one command vy-verifier-tunnel. AllowUsers accumulates over
# directives; each Match block ends with this file. After installing, `sudo sshd -t && sudo systemctl reload ssh`.
AllowUsers prover challenger

# The audited node's `ssh -L` to the run's verifier on 127.0.0.1 (host.py's PORTS); it opens nothing else and listens nowhere.
Match User prover
	AuthorizedKeysFile /etc/vy/verifier-tunnel-keys.d/prover
	ForceCommand /usr/local/sbin/vy-verifier-tunnel
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:7951 127.0.0.1:7952 127.0.0.1:7953 127.0.0.1:7954 127.0.0.1:7955 127.0.0.1:7956 127.0.0.1:7957 127.0.0.1:7958
	PermitListen none
	AllowAgentForwarding no
	AllowStreamLocalForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitUserRC no
	GatewayPorts no

# vy-challenger-1's `ssh -R` of a session's port to this host's 127.0.0.1 (the challenger gate's 7811..7899, auditor.PORTS),
# where the verifier reaches its challenger; it opens nothing here.
Match User challenger
	AuthorizedKeysFile /etc/vy/verifier-tunnel-keys.d/challenger
	ForceCommand /usr/local/sbin/vy-verifier-tunnel
	AllowTcpForwarding remote
	PermitListen 127.0.0.1:7811 127.0.0.1:7812 127.0.0.1:7813 127.0.0.1:7814 127.0.0.1:7815 127.0.0.1:7816 127.0.0.1:7817 127.0.0.1:7818 127.0.0.1:7819 127.0.0.1:7820 127.0.0.1:7821 127.0.0.1:7822 127.0.0.1:7823 127.0.0.1:7824 127.0.0.1:7825 127.0.0.1:7826 127.0.0.1:7827 127.0.0.1:7828 127.0.0.1:7829 127.0.0.1:7830 127.0.0.1:7831 127.0.0.1:7832 127.0.0.1:7833 127.0.0.1:7834 127.0.0.1:7835 127.0.0.1:7836 127.0.0.1:7837 127.0.0.1:7838 127.0.0.1:7839 127.0.0.1:7840 127.0.0.1:7841 127.0.0.1:7842 127.0.0.1:7843 127.0.0.1:7844 127.0.0.1:7845 127.0.0.1:7846 127.0.0.1:7847 127.0.0.1:7848 127.0.0.1:7849 127.0.0.1:7850 127.0.0.1:7851 127.0.0.1:7852 127.0.0.1:7853 127.0.0.1:7854 127.0.0.1:7855 127.0.0.1:7856 127.0.0.1:7857 127.0.0.1:7858 127.0.0.1:7859 127.0.0.1:7860 127.0.0.1:7861 127.0.0.1:7862 127.0.0.1:7863 127.0.0.1:7864 127.0.0.1:7865 127.0.0.1:7866 127.0.0.1:7867 127.0.0.1:7868 127.0.0.1:7869 127.0.0.1:7870 127.0.0.1:7871 127.0.0.1:7872 127.0.0.1:7873 127.0.0.1:7874 127.0.0.1:7875 127.0.0.1:7876 127.0.0.1:7877 127.0.0.1:7878 127.0.0.1:7879 127.0.0.1:7880 127.0.0.1:7881 127.0.0.1:7882 127.0.0.1:7883 127.0.0.1:7884 127.0.0.1:7885 127.0.0.1:7886 127.0.0.1:7887 127.0.0.1:7888 127.0.0.1:7889 127.0.0.1:7890 127.0.0.1:7891 127.0.0.1:7892 127.0.0.1:7893 127.0.0.1:7894 127.0.0.1:7895 127.0.0.1:7896 127.0.0.1:7897 127.0.0.1:7898 127.0.0.1:7899
