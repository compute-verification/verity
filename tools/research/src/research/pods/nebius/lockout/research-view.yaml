# research's read-only view of node 1's cluster (vy-lockout kubeconfig): get, list and watch the scheduling state the lanes and the
# monitors read (pods and their logs, nodes, events, Jobs, Kueue's queues and workloads); no Secret, no ConfigMap, nothing written.
apiVersion: v1
kind: Namespace
metadata:
  name: vy-lockout
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-view
  namespace: vy-lockout
---
apiVersion: v1
kind: Secret
metadata:
  name: research-view-token
  namespace: vy-lockout
  annotations:
    kubernetes.io/service-account.name: research-view
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: research-view
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "nodes", "events", "namespaces", "resourcequotas", "limitranges"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["clusterqueues", "localqueues", "workloads", "resourceflavors", "admissionchecks", "workloadpriorityclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: research-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: research-view
subjects:
- kind: ServiceAccount
  name: research-view
  namespace: vy-lockout
