# /etc/systemd/system/UNIT.d/50-vy-root.conf (vy-lockout root-units): the loop runs as root, which alone keeps cluster-admin and
# reads other users' /proc once research has neither. Its environment file comes last, so its KUBECONFIG and PATH win.
[Service]
User=
Group=
WorkingDirectory=/
EnvironmentFile=/etc/vy/env/root.env
