# A coverage cell (a vLLM config run, --config-run 1) on the Nebius cluster: two chained managed-job tasks, both in queue circuits
# (which never borrows, so a reclaim can't preempt either). Interface agreed with the vLLM coordinator
# (lanes/nebius-infra/20260930T0729Z-answer-from-vllm-coordinator-config-run-split.md):
#   build: CPU only (0 GPU)   `row stage build  ROW ROLE REPO REV --config-run 1 --replay-k 460`   Build + the strict word check
#   gpu:   1 GPU (TP2: 2)     `row stage commit ROW ROLE REPO REV --config-run 1 --replay-k 460`   one instrumented engine run, the
#                              460-unit host replay, config_record.json: about 5-15 min for a small or medium cell
# Config runs have no Match stage. Both tasks use the same row directory on the host (SWEEP_DIR/<row>): the Commit reads the Build's
# Programs and manifest there. Each task runs its `row stage` as one `research run --tool vllm.<stage>` Attempt (the Commit citing the
# Build's artifact); the gpu task's carries ov.noisy (it runs beside Builds).
# Full rows (Build, Match, Commit) use config-run-row.yaml. This is the coverage default: the GPU is held only for the Commit.
# Needs #536 in the submitted tree: without it the GPU-less Build fails with "Device string must not be empty". Its build task
# finds libcuda.so.1 in /workspace/jobs/cuda-driver, which cluster_up.sh keeps in step with the host's driver.
#
#   VY_ROW_CLASS=dense tools/research/src/research/pods/nebius/sky/submit.sh config-run cov-k07 \
#     --env ROW=<row> --env ROLE=B1 --env REPO=Qwen/Qwen2.5-1.5B --env REVISION=<sha>
#   (or VY_BUILD_MEMORY=<GB> VY_GPU_MEMORY=<GB>, e.g. from `verity-vllm sweep plan`'s ram_gb, instead of a class)
#
# Memory per class, provisional (the coordinator's table; the sweep lane's measured peaks after its first 10 cells replace it):
#   class   build task   gpu task          rows
#   small   64 GB        64 GB             small dense, B <= 16 (bounded staging)
#   dense   160 GB       192 GB            1-7B dense, B 8-32   <- default below
#   long    160 GB       256 GB            long context 4096/512 (the measured Build peak is 124.5 GB, #11)
#   moe     256 GB       384 GB            OLMoE, Qwen3-30B-A3B
#   b64     256 GB       512 GB            batch 64
#   tp2     160 GB       384 GB, 2 GPUs    TP2 (per-rank Builds in one task; #499, until then TP cells are unsupported)
name: config-run

---

name: build

resources:
  infra: ssh/vy-nebius
  cpus: 4          # the request Kueue counts; a Build uses ~2-9 cores (15:52Z) and bursts onto idle ones: no CPU limit
  labels:
    budget-line: nebius-config-run
  memory: 160

envs:
  SRC: /workspace/research/checkout
  OMP_NUM_THREADS: "16"
  ROW: null
  ROLE: null
  REPO: null
  REVISION: null
  CAMPAIGN: nebius-sweep
  HF_HOME: /workspace/hf
  CUDA_HOME: /workspace/jobs/cuda-12.9
  TORCH_EXTENSIONS_DIR: /workspace/jobs/torch-extensions
  HF_HUB_OFFLINE: "1"
  SWEEP_DIR: /workspace/cp/sweep
  PY: /workspace/jobs/venv312/bin/python
  PY312: /workspace/jobs/venv312/bin/python
  RESEARCH_PY: /workspace/jobs/bin/py312
  RESEARCH_RUNS: /workspace/jobs/runs
  RESEARCH_STORE: /workspace/jobs/store   # on the host: an attempt that couldn't be pushed outlives the pod
  HOT_ROOT: /workspace/jobs/hot
  HOT_RELEASING_MARKER: /workspace/jobs/hot/releasing
  HOT_RELEASE_JSON: /workspace/jobs/hot/release.json
  GUARD_PRESERVE_FILE: /workspace/jobs/dm/guard.preserve
  BUILD_JOBS: auto
  BUILD_RAM_BUDGET_GB: "160"
  VERITY_UNIT_RULE_CACHE: /workspace/jobs/cache/unit-rules
  UV_CACHE_DIR: /workspace/jobs/cache/uv
  UV_PYTHON_INSTALL_DIR: /workspace/jobs/cache/python

secrets:
  R2_ENDPOINT: null
  R2_BUCKET: null
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null

setup: |
  set -euo pipefail
  # the job runs from the one copy of $SRC per tree content (job_tree.sh): uid 1000 can write it, a later sync can't change it, and
  # every job of the tree compiles its taps at the same paths, so they are built once
  SRC=$(bash "$SRC/tools/research/src/research/pods/nebius/sky/job_tree.sh" "$SRC"); export SRC
  [ -x /workspace/jobs/bin/uv ] || curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/workspace/jobs/bin UV_NO_MODIFY_PATH=1 sh
  [ -x /workspace/jobs/bin/py312 ] || printf '#!/bin/sh\nexec /workspace/jobs/bin/uv run --no-project --python 3.12 python "$@"\n' > /workspace/jobs/bin/py312
  chmod +x /workspace/jobs/bin/py312 2> /dev/null || true
  mkdir -p /workspace/jobs/hot /workspace/jobs/dm /workspace/jobs/cache/unit-rules "$SWEEP_DIR"
  cd "$SRC/integrations/vllm"
  bash "$SRC/tools/research/src/research/pods/nebius/sky/vllm_bootstrap.sh" --cases "$ROLE" --cpu --out "/workspace/jobs/bootstrap/$ROLE-cpu"     # skipped, without the lock, once this tree, role and venv passed

run: |
  set -euo pipefail
  export PATH=/workspace/jobs/venv312/bin:$PATH    # the venv's tools (ninja for vLLM/FlashInfer JIT builds)
  SRC=$(bash "$SRC/tools/research/src/research/pods/nebius/sky/job_tree.sh" --mine); export SRC
  export PATH=$CUDA_HOME/bin:$PATH
  export PYTHONPATH=$SRC/integrations/vllm:$SRC/tools/research/src CUDA_VISIBLE_DEVICES=
  # a pod with no GPU has no driver libraries, but importing vLLM's CUDA platform (#536) loads libcuda.so.1: the host's copy, which
  # can't reach a GPU without the /dev/nvidia* devices a GPU-less pod lacks (cluster_up.sh keeps it in step with the driver)
  export LD_LIBRARY_PATH=/workspace/jobs/cuda-driver${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
  # one Attempt per task, as `row chain` runs a stage: the workload is plain argv, from which the Tool reads the row's key params.
  # The gpu task reads this run id back from the row directory to cite the Build's artifact
  mkdir -p "$SWEEP_DIR/$ROW"
  run_id=r$(date -u +%Y%m%d-%H%M%S)-$(od -An -N2 -tx1 /dev/urandom | tr -d ' \n')
  echo "$run_id" > "$SWEEP_DIR/$ROW/two-task-build-run"
  /workspace/jobs/bin/uv run --no-project --python 3.12 python -m research run --id "$run_id" --tool vllm.build --project verity --cwd "$SRC" \
    --campaign "$CAMPAIGN" -- "$PY" -m verity_vllm.pipeline.cli row stage build "$ROW" "$ROLE" "$REPO" "$REVISION" --config-run 1 --replay-k 460

config:
  ssh:
    provision_timeout: -1
    pod_config:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: circuits
          kueue.x-k8s.io/priority-class: circuits
          verity.dev/build: "true"
      spec:
        terminationGracePeriodSeconds: 300   # a preempted job's research run finishes publishing its attempt
        containers:
        - volumeMounts:
          - {name: workspace, mountPath: /workspace}
        volumes:
        - {name: workspace, hostPath: {path: /workspace, type: Directory}}

---

name: gpu

resources:
  infra: ssh/vy-nebius
  accelerators: RTXPRO6000:1
  cpus: 8
  labels:
    budget-line: nebius-config-run
  memory: 192

envs:
  SRC: /workspace/research/checkout
  OMP_NUM_THREADS: "8"
  ROW: null
  ROLE: null
  REPO: null
  REVISION: null
  CAMPAIGN: nebius-sweep
  HF_HOME: /workspace/hf
  CUDA_HOME: /workspace/jobs/cuda-12.9
  TORCH_EXTENSIONS_DIR: /workspace/jobs/torch-extensions
  HF_HUB_OFFLINE: "1"
  SWEEP_DIR: /workspace/cp/sweep
  PY: /workspace/jobs/venv312/bin/python
  PY312: /workspace/jobs/venv312/bin/python
  RESEARCH_PY: /workspace/jobs/bin/py312
  RESEARCH_RUNS: /workspace/jobs/runs
  RESEARCH_STORE: /workspace/jobs/store   # on the host: an attempt that couldn't be pushed outlives the pod
  HOT_ROOT: /workspace/jobs/hot
  HOT_RELEASING_MARKER: /workspace/jobs/hot/releasing
  HOT_RELEASE_JSON: /workspace/jobs/hot/release.json
  GUARD_PRESERVE_FILE: /workspace/jobs/dm/guard.preserve
  OV_NOISY: "true"
  UV_CACHE_DIR: /workspace/jobs/cache/uv
  UV_PYTHON_INSTALL_DIR: /workspace/jobs/cache/python

secrets:
  R2_ENDPOINT: null
  R2_BUCKET: null
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null

setup: |
  set -euo pipefail
  # the job runs from the one copy of $SRC per tree content (job_tree.sh): uid 1000 can write it, a later sync can't change it, and
  # every job of the tree compiles its taps at the same paths, so they are built once
  SRC=$(bash "$SRC/tools/research/src/research/pods/nebius/sky/job_tree.sh" "$SRC"); export SRC
  mkdir -p /workspace/jobs/hot /workspace/jobs/dm
  cd "$SRC/integrations/vllm"
  bash "$SRC/tools/research/src/research/pods/nebius/sky/vllm_bootstrap.sh" --cases "$ROLE" --out "/workspace/jobs/bootstrap/$ROLE"     # skipped, without the lock, once this tree, role and venv passed

run: |
  set -euo pipefail
  export PATH=/workspace/jobs/venv312/bin:$PATH    # the venv's tools (ninja for vLLM/FlashInfer JIT builds)
  SRC=$(bash "$SRC/tools/research/src/research/pods/nebius/sky/job_tree.sh" --mine); export SRC
  export PATH=$CUDA_HOME/bin:$PATH
  export PYTHONPATH=$SRC/integrations/vllm:$SRC/tools/research/src
  # compiled kernels persist per tree on the host, so every cell of a tree after the first skips Triton's JIT of vLLM's
  # batch-invariant kernels (the TP2 lane's lines, 14:45Z). Eager rows only: a compiled row records triton_cache_dir in its
  # generated_kernels header. The fixed JIT build dirs only for trees whose native_jit stages its sources (#561); an older tree would
  # rewrite their build.ninja and cost fixed trees a rebuild
  case "$ROW" in *__bi-eager) export TRITON_CACHE_DIR=/workspace/jobs/cache/triton/$(basename "$SRC") VLLM_CACHE_ROOT=/workspace/jobs/cache/vllm/$(basename "$SRC");; esac
  if grep -q staged_sources "$SRC/integrations/vllm/verity_vllm/commit/committer/native_jit.py"; then
    export HIDDEN_GPU_BUILD=/workspace/jobs/cache/jit/hidden_gpu NATIVE_COLLECT_BUILD=/workspace/jobs/cache/jit/nc
  fi
  # the Commit's Attempt cites the Build task's artifact (--input build=art:...), as `row chain` does
  build_run=$(cat "$SWEEP_DIR/$ROW/two-task-build-run" 2> /dev/null || true)
  build_art=""
  [ -z "$build_run" ] || build_art=$(/workspace/jobs/bin/uv run --no-project --python 3.12 python -m research data show "$build_run" --json 2> /dev/null \
    | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d[0] if isinstance(d, list) else d; print((d.get("outputs") or {}).get("build", ""))' \
    2> /dev/null || true)
  echo "commit cites the Build: run ${build_run:-none}, artifact ${build_art:-none}"
  /workspace/jobs/bin/uv run --no-project --python 3.12 python -m research run --tool vllm.commit --project verity --cwd "$SRC" --campaign "$CAMPAIGN" \
    ${build_art:+--input "build=$build_art"} -- "$PY" -m verity_vllm.pipeline.cli row stage commit "$ROW" "$ROLE" "$REPO" "$REVISION" --config-run 1 --replay-k 460

config:
  ssh:
    provision_timeout: -1
    pod_config:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: circuits
          kueue.x-k8s.io/priority-class: circuits
          ov.noisy: "true"
      spec:
        terminationGracePeriodSeconds: 300   # a preempted job's research run finishes publishing its attempt
        containers:
        - volumeMounts:
          - {name: workspace, mountPath: /workspace}
        volumes:
        - {name: workspace, hostPath: {path: /workspace, type: Directory}}
