# A port-lane capture on the Nebius cluster (the sm_120 GEMM correspondence, the FA2 capture, the e4m3 step probe, the 188-SM
# kernels): queue circuits, priority circuits. It runs no Build, so it doesn't block a prover bench.
#
#   sky jobs launch -n capture-<what> tools/research/src/research/pods/nebius/sky/jobs/port-capture.yaml \
#     --env CMD='python -m tc_probe ...' --secret R2_ENDPOINT --secret R2_BUCKET --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY
#
# Resources: one GPU (a TP2 capture: --gpus RTXPRO6000:2), and the small-dense class's host peak, 94-188 GB, since a capture
# serves a model without a Build. No capture has a recorded peak on the PRO 6000 yet: take the first run's peak from its Attempt's
# telemetry and lower --memory.
# The job runs from the tree at $SRC on the host's /workspace (no upload): ship it first with
#   research pods sync vy-nebius-1 --dest /workspace/research/checkout   (or your own --dest, and --env SRC=...)
name: port-capture

resources:
  infra: ssh/vy-nebius
  accelerators: RTXPRO6000:1
  cpus: 16
  labels:
    budget-line: nebius-port-capture
  memory: 192

envs:
  SRC: /workspace/research/checkout
  OMP_NUM_THREADS: "16"     # SkyPilot's runner sets 1; match resources.cpus (--cpus overrides need --env OMP_NUM_THREADS too)
  CMD: null
  CAMPAIGN: vllm-sm120-port
  HF_HOME: /workspace/hf
  HF_HUB_OFFLINE: "1"
  RESEARCH_RUNS: /workspace/jobs/runs
  UV_CACHE_DIR: /workspace/jobs/cache/uv
  UV_PYTHON_INSTALL_DIR: /workspace/jobs/cache/python
  PY: /workspace/jobs/venv312/bin/python     # the stages' interpreter: the venv the setup's bootstrap builds (WORK=/workspace/jobs),
  PY312: /workspace/jobs/venv312/bin/python  # not the pod layout's /workspace/venv312

secrets:
  R2_ENDPOINT: null
  R2_BUCKET: null
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null

setup: |
  set -euo pipefail
  # the job runs from its own copy of $SRC: the job user (uid 1000) can't write the synced tree, which is research's, and a
  # later `research pods sync` of the same lane can't change the code under a running job (one copy per pod)
  JOB_SRC=/workspace/jobs/src/$(hostname)
  rm -rf "$JOB_SRC" && mkdir -p "$JOB_SRC" && cp -a "$SRC"/. "$JOB_SRC"/
  export SRC=$JOB_SRC
  [ -x /workspace/jobs/bin/uv ] || curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/workspace/jobs/bin UV_NO_MODIFY_PATH=1 sh
  cd "$SRC"
  cd integrations/vllm
  flock /workspace/jobs/.vllm-bootstrap.lock env WORK=/workspace/jobs HF_HOME=/workspace/hf bash verity_vllm/ops/pod_bootstrap.sh

run: |
  set -euo pipefail
  export SRC=/workspace/jobs/src/$(hostname)
  cd "$SRC"
  PYTHONPATH=$SRC/tools/research/src /workspace/jobs/bin/uv run --no-project --python 3.12 python -m research run --campaign "$CAMPAIGN" -- bash -c "cd \"$SRC\" && $CMD"

config:
  ssh:
    provision_timeout: -1
    pod_config:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: circuits
          kueue.x-k8s.io/priority-class: circuits
      spec:
        containers:
        - volumeMounts:
          - {name: workspace, mountPath: /workspace}
        volumes:
        - {name: workspace, hostPath: {path: /workspace, type: Directory}}
