# A timed prover run (a bench cell) on the Nebius cluster: queue provers, priority prover-bench.
#
#   sky jobs launch -n bench-<cell> tools/research/src/research/pods/nebius/sky/jobs/prover-bench.yaml \
#     --env CMD='...' --secret R2_ENDPOINT --secret R2_BUCKET --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY
#
# Benches run alongside Builds, so each is labelled ov.noisy=true (pod label, and OV_NOISY in the run's environment for its
# record). The quiet hour, 12:30-13:30Z, admits no config run (quiet_hour.sh): a bench re-measured then is submitted with
#   sed 's/ov.noisy: "true"/ov.noisy: "false"/; s/OV_NOISY: "true"/OV_NOISY: "false"/' prover-bench.yaml > /tmp/quiet-bench.yaml
# Record the clocks with every timed result.
# Resources: 18 vCPU, so the M0 prover's 17-core bursts aren't throttled mid-measurement; its RAM peak of 2-17 GiB.
name: prover-bench

resources:
  infra: ssh/vy-nebius
  accelerators: RTXPRO6000:1
  cpus: 18
  labels:
    budget-line: nebius-prover-bench
  memory: 24

workdir: .

envs:
  CMD: null
  CAMPAIGN: nebius-bench
  RESEARCH_RUNS: /workspace/research/runs
  CARGO_TARGET_DIR: /workspace/cache/cargo-target
  OV_NOISY: "true"

secrets:
  R2_ENDPOINT: null
  R2_BUCKET: null
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null

run: |
  set -euo pipefail
  nvidia-smi --query-gpu=clocks.sm,clocks.mem,clocks.max.sm --format=csv > clocks-before.csv || true
  PYTHONPATH=$PWD/tools/research/src python3 -m research run --campaign "$CAMPAIGN" --cwd source -- bash -c "$CMD"

config:
  ssh:
    provision_timeout: -1
    pod_config:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: provers
          kueue.x-k8s.io/priority-class: prover-bench
          ov.noisy: "true"
      spec:
        containers:
        - volumeMounts:
          - {name: workspace, mountPath: /workspace}
        volumes:
        - {name: workspace, hostPath: {path: /workspace, type: Directory}}
