# A timed prover run (a bench cell) on the Nebius cluster: queue provers, priority prover-bench, in a quiet window.
#
#   sky jobs launch -n bench-<cell> tools/research/src/research/pods/nebius/sky/jobs/prover-bench.yaml \
#     --env CMD='...' --secret R2_ENDPOINT --secret R2_BUCKET --secret AWS_ACCESS_KEY_ID --secret AWS_SECRET_ACCESS_KEY
#
# The quiet window is a required pod anti-affinity against pods labelled verity.dev/build=true (config runs). The scheduler enforces
# it both ways: the bench waits until no Build runs on the node, and no Build starts on a node while the bench runs. Keep cells
# short (minutes to about 1 h), since on one server a bench holds every Build back. Record the clocks with every timed result.
# Resources: 18 vCPU, so the M0 prover's 17-core bursts aren't throttled mid-measurement; its RAM peak of 2-17 GiB.
name: prover-bench

resources:
  infra: ssh/vy-nebius
  accelerators: RTXPRO6000:1
  cpus: 18
  labels:
    budget-line: nebius-prover-bench
  memory: 24

workdir: .

envs:
  CMD: null
  CAMPAIGN: nebius-bench
  RESEARCH_RUNS: /workspace/research/runs
  CARGO_TARGET_DIR: /workspace/cache/cargo-target

secrets:
  R2_ENDPOINT: null
  R2_BUCKET: null
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null

run: |
  set -euo pipefail
  nvidia-smi --query-gpu=clocks.sm,clocks.mem,clocks.max.sm --format=csv > clocks-before.csv || true
  PYTHONPATH=$PWD/tools/research/src python3 -m research run --campaign "$CAMPAIGN" --cwd source -- bash -c "$CMD"

config:
  ssh:
    provision_timeout: -1
    pod_config:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: provers
          kueue.x-k8s.io/priority-class: prover-bench
          verity.dev/quiet: "true"
      spec:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
              labelSelector:
                matchLabels: {verity.dev/build: "true"}
        containers:
        - volumeMounts:
          - {name: workspace, mountPath: /workspace}
        volumes:
        - {name: workspace, hostPath: {path: /workspace, type: Directory}}
