# Up to 3 small Commits at once on one GPU, as clients of an MPS daemon of the pod's own, on node 1.
# One Kueue workload in deployments-gpu requesting 1 GPU, so
# Kueue's GPU accounting is unchanged; the host runs no MPS daemon and its compute mode stays Default.
#
# The dispatcher (dispatch.py, PACK_COMMITS=1) spools config-run's gpu task of each eligible Commit (TP1, <= 4B, B <= 8, deferred
# replay; never TP2, Gemma-2, Pythia or 7B+) under /workspace/jobs/dispatch/pack/queue/, and keeps at most PACK_PODS of these
# pods. The pod is a pilot lease (sky/commit_pack.py): it takes the next spooled Commit as each one ends and exits when the spool
# stays empty, or at its 120-min wall. Each Commit runs exactly config-run's gpu task script, with the MPS client environment:
#   CUDA_MPS_PINNED_DEVICE_MEM_LIMIT=0=28G   CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=100   GPU_UTIL=0.20   REPLAY_DEFERRED=1
# After an MPS fault every Commit still running in the pod is stopped, and the dispatcher requeues each once as a normal 1-GPU
# Commit; its replay task follows as usual. Rollback: PACK_COMMITS=0 in the dispatcher, then let these pods finish or delete them
# (their claimed Commits requeue unpacked). The pod admits nothing new from 12:10Z (node 1's quota cutover) to the quiet hour's end
# (13:30Z), and at 12:28Z stops what still runs (the dispatcher requeues it unpacked) and exits. Each packed Commit's Attempt is
# labelled ov.mps_packed, and its replay must be 460/460 PASS or the dispatcher stops packing that model.
name: commit-pack

resources:
  infra: ssh/vy-nebius
  accelerators: RTXPRO6000:1
  cpus: 4          # the GPU queue's fixed 4 per GPU (the plan said 12: two pods would take 24 of the queue's 28 and idle its other
                   # GPUs); there is no CPU limit, so the 3 Commits burst onto the dispatcher's cores as a single Commit does
  labels:
    budget-line: nebius-config-run
  memory: 192        # 3 x the gpu task's 64 GB below batch 8 (a B8 Commit of a <= 4B model peaks near 16-32 GB of host memory)

envs:
  OMP_NUM_THREADS: "4"
  RESEARCH_RUNS: /workspace/jobs/runs
  RESEARCH_STORE: /workspace/jobs/store   # each Commit's own env sets it too; the pilot publishes nothing itself
  PACK_SPOOL: /workspace/jobs/dispatch/pack
  PACK_SLOTS: "3"
  PACK_MAX_WALL_S: "7200"
  PACK_MEM_LIMIT: "0=28G"
  PACK_GPU_UTIL: "0.20"   # of the whole GPU's 95 GiB, with the Commit's ~6 GiB of staging beside it inside PACK_MEM_LIMIT
  PACK_THREAD_PERCENTAGE: "100"
  OV_NOISY: "true"

secrets:
  R2_ENDPOINT: null
  R2_BUCKET: null
  AWS_ACCESS_KEY_ID: null
  AWS_SECRET_ACCESS_KEY: null

run: |
  set -euo pipefail
  export PATH=/workspace/jobs/venv312/bin:$PATH
  export TMPDIR=${TMPDIR:-/tmp}
  # no job tree of its own: each spooled Commit's script copies and bootstraps its tree as config-run's gpu task does
  pilot=$SRC/sky/commit_pack.py      # SRC: the dispatcher's own directory, whose sky/ is infra/nebius's
  echo "commit-pack: pilot $pilot sha256 $(sha256sum "$pilot" | cut -c1-12), GPU $(nvidia-smi --query-gpu=uuid --format=csv,noheader)"
  exec /workspace/jobs/bin/uv run --no-project --python 3.12 python "$pilot"

config:
  ssh:
    provision_timeout: -1
    pod_config:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: deployments-gpu
          kueue.x-k8s.io/priority-class: circuits-gpu
          ov.noisy: "true"
          verity.dev/commit-pack: "true"
      spec:
        terminationGracePeriodSeconds: 300
        containers:
        - volumeMounts:
          - {name: workspace, mountPath: /workspace}
        volumes:
        - {name: workspace, hostPath: {path: /workspace, type: Directory}}
