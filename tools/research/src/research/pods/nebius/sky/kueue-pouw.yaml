# LATER, not applied by cluster_up.sh: the PoUW server's queue, once a second server joins the vy-nebius pool.
# To add it:
#   1. launch it (NEBIUS_VM_NAME=vy-nebius-2 launch.sh ...) and add a security rule letting the two servers reach each other
#      (ingress from the security group itself, any protocol: k3s, flannel and the kubelet);
#   2. add its private address under vy-nebius's hosts in ~/.sky/ssh_node_pools.yaml, and rerun `sky ssh up --infra vy-nebius`;
#   3. label its node verity.dev/server=vy-nebius-2 skypilot.co/accelerator=rtxpro6000, then `kubectl apply -f kueue-pouw.yaml`;
#   4. PoUW jobs use the provers or circuits templates with kueue.x-k8s.io/queue-name: pouw.
# The flavor pins pouw's quota to its own server. To let circuits and provers borrow its idle GPUs too, add this flavor under their
# resourceGroups with nominalQuota 0: borrowing needs the flavor listed in the borrower's ClusterQueue.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: vy-nebius-2}
spec:
  nodeLabels: {verity.dev/server: vy-nebius-2}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: pouw}
spec:
  cohortName: nebius
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Any
    borrowWithinCohort: {policy: LowerPriority}
    withinClusterQueue: LowerPriority
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-2
      resources:
      - {name: nvidia.com/gpu, nominalQuota: 8}
      - {name: cpu, nominalQuota: 188}
      - {name: memory, nominalQuota: 1664Gi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: pouw, namespace: default}
spec: {clusterQueue: pouw}
