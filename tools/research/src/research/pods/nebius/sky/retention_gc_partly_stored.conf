# /etc/systemd/system/vy-retention-gc.service.d/30-partly-stored-runs.conf on the nodes deploy.toml names for it (`research deploy`
# installs it): the collector there also deletes the preserved runs whose files custody trimmed, 7 d after custody verified each,
# after writing what each loses to the deletion log (`research retention gc --partly-stored-runs`, retention.py). On every other
# node a pass lists those runs with the date they go, and leaves them.
[Service]
Environment=VY_GC_PARTLY_STORED_RUNS=1
