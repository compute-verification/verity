# Kueue on the Nebius cluster (Kueue v0.19.6, applied by cluster_up.sh). The weekly retune edits only this file: the nominalQuota
# lines below, from usage_report.py's summary.
#
# One cohort (nebius). GPU generation and CPU checking are separate queues (batch everything):
#   deployments-gpu  a vLLM deployment's GPU work (Commits; port captures): 6 GPUs (circuits' vLLM work first),
#                    a fixed 4 vCPU per GPU and 640 GiB, borrowing up to 320 GiB more (a batch-8 Commit requests 170 GB and peaks at 78 GB or less; 2 Oct 02:16Z). Every pod it runs requests at most 4 vCPU per GPU (test_nebius_sky) and bursts onto idle cores.
#                    It borrows up to 72 idle vCPU more: a leased Commit requests no GPU but up to 16 vCPU, so 24 + 8 admitted only two
#                    while 8 GPUs sat idle (2 Oct 14:25Z).
#   deployments-cpu  a vLLM deployment's CPU work (Builds, replay and checks): no GPU, and it can't borrow one. 640 GiB of its own (160 moved from the GPU queue, 2 Oct
#                    02:16Z: Builds wait on memory, Commits book little), and it borrows up to 384 GiB of idle memory, which the Commits reclaim from its Builds (priority 500) but not its replays (600).
#   provers          the provers' floor of 2 GPUs, one per proving lane, plus 1 borrowed. It borrows idle GPUs, CPU and memory from the cohort (one pool, borrowing
#                    both ways, no ceremony), and a borrowed job is evicted when the Commits reclaim their quota: a timed bench
#                    stays inside provers' own nominal quota (an earlier bench on borrowed quota was evicted mid-run, twice).
#   backfill         the dispatcher's standing tier (root via RC, 15:36Z): nominal quota 0, so everything it runs is borrowed idle quota,
#                    evicted first. It preempts nobody. LocalQueues backfill (the dispatcher) and pous-overflow (PoUW's untimed work).
#   circuits         draining since 16:10Z: nominal quota 0, and its in-flight vLLM deployments finish on borrowed idle quota. Delete it
#                    once it is empty.
# The deployments queues borrow idle quota (the GPU queue up to 2 of provers' GPUs), may evict backfill to borrow
# (borrowWithinCohort LowerPriority, at most priority 10), and reclaim their quota from lower-priority borrowers only. provers reclaims
# from anyone. Nothing is preempted within a queue (withinClusterQueue: Never; root 09:09Z, after captures threw away cov-k09-3's
# Build twice): priorities set admission order only.
# quiet_hour.sh holds the deployments queues' admissions 12:30-13:30Z (stopPolicy: Hold) so benches can re-measure without new Builds.
#
# Kueue admits by quota, not by what the scheduler can place: keep the sums at or under vy-nebius-1's allocatable (192 vCPU,
# ~1,690 GiB), less ~3 vCPU of pods outside Kueue and the jobs controller, or it admits pods that stay Pending. Quota is requests,
# not use: pods have no CPU limit and burst onto idle cores. The merge checks and pinned benches run outside Kueue on their own cores.
# While lanes still run GPU work directly on GPUs 4-7 (outside Kubernetes), cluster_up.sh holds those with a placeholder pod and
# applies this file with provers' GPU quota lowered by the GPUs held (4 -> 0). Cutover: VY_DIRECT_GPUS=none cluster_up.sh --apply.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: vy-nebius-1}
spec:
  nodeLabels: {verity.dev/server: vy-nebius-1}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: deployments-gpu}
spec:
  cohortName: nebius
  namespaceSelector: {}
  # StrictFIFO: a 2-GPU TP2 config-run-row at the head waits for its second GPU instead of every freed GPU going to the next
  # 1-GPU Commit at the same priority (under BestEffortFIFO the TP2 head waited 55 min, 20:15-21:10Z, and never saw 2 free).
  queueingStrategy: StrictFIFO
  preemption:
    reclaimWithinCohort: LowerPriority
    borrowWithinCohort: {policy: LowerPriority, maxPriorityThreshold: 10}
    withinClusterQueue: Never
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-1
      resources:
      - {name: nvidia.com/gpu, nominalQuota: "6", borrowingLimit: "2"}
      - {name: cpu, nominalQuota: "24", borrowingLimit: "72"}
      - {name: memory, nominalQuota: "640Gi", borrowingLimit: "320Gi"}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: deployments-cpu}
spec:
  cohortName: nebius
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: LowerPriority
    borrowWithinCohort: {policy: LowerPriority, maxPriorityThreshold: 10}
    withinClusterQueue: Never
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-1
      resources:
      - {name: nvidia.com/gpu, nominalQuota: "0", borrowingLimit: "0"}
      - {name: cpu, nominalQuota: "100", borrowingLimit: "16"}
      - {name: memory, nominalQuota: "640Gi", borrowingLimit: "384Gi"}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: circuits}
spec:
  cohortName: nebius
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Never
    borrowWithinCohort: {policy: Never}
    withinClusterQueue: Never
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-1
      resources:
      - {name: nvidia.com/gpu, nominalQuota: "0"}
      - {name: cpu, nominalQuota: "0"}
      - {name: memory, nominalQuota: "0"}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: provers}
spec:
  cohortName: nebius
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Any
    borrowWithinCohort: {policy: Never}
    withinClusterQueue: Never
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-1
      resources:
      # Proofs borrows every idle GPU, and the cohort's whole CPU and memory to go with them; Commits (600) reclaim from it (300).
      - {name: nvidia.com/gpu, nominalQuota: 2, borrowingLimit: "6"}
      - {name: cpu, nominalQuota: 64, borrowingLimit: "124"}
      - {name: memory, nominalQuota: 384Gi, borrowingLimit: "1280Gi"}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: backfill}
spec:
  cohortName: nebius
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Never
    borrowWithinCohort: {policy: Never}
    withinClusterQueue: Never
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-1
      resources:
      - {name: nvidia.com/gpu, nominalQuota: "0"}
      - {name: cpu, nominalQuota: "0"}
      - {name: memory, nominalQuota: "0"}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: deployments-gpu, namespace: default}
spec: {clusterQueue: deployments-gpu}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: deployments-gpu-pool, namespace: default}   # circuits' lease-pool GPU holders (n1_lease.py VY_POOL_LOCAL_QUEUE), outside the pacer's hold
spec: {clusterQueue: deployments-gpu}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: deployments-cpu, namespace: default}
spec: {clusterQueue: deployments-cpu}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: circuits, namespace: default}
spec: {clusterQueue: circuits}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: backfill, namespace: default}
spec: {clusterQueue: backfill}
---
# PoUW's overflow on node 1's idle GPUs (one pool, borrowing both ways): work that neither ranks nor times sm_120,
# so it runs as backfill, on borrowed quota, evicted first.
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: pous-overflow, namespace: default}
spec: {clusterQueue: backfill}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: provers, namespace: default}
spec: {clusterQueue: provers}
---
# Priorities, highest first. A job names one with the pod label kueue.x-k8s.io/priority-class.
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: capture}
value: 1100
description: short port-lane captures (jobs/port-capture.yaml), first to the next free circuits GPU
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: sweep-night}
value: 1000
description: the night's vLLM config sweep
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: circuits-gpu}
value: 600
description: a vLLM deployment's GPU work (Commits, one-GPU rows), admitted ahead of 0-GPU work (root 16:03Z)
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: circuits}
value: 500
description: a vLLM deployment's CPU work (Builds, replay, checks)
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: prover-bench}
value: 300
description: timed prover runs, in a quiet window (jobs/prover-bench.yaml)
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: dev}
value: 100
description: prover development and anything else that can wait
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: backfill}
value: 10
description: the dispatcher's standing backfill tier (queue backfill), on borrowed idle quota and evicted first
