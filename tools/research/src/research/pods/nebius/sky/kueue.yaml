# Kueue on the Nebius cluster (Kueue v0.19.6, applied by cluster_up.sh). The weekly retune edits only this file: the nominalQuota
# lines below, from usage_report.py's summary.
#
# One cohort (nebius), two ClusterQueues. provers may borrow circuits' idle capacity, and circuits reclaiming it preempts the
# borrower whatever its priority (reclaimWithinCohort: Any). circuits never borrows (borrowingLimit 0): a config run can't be
# checkpointed, so it must never sit on quota a reclaim could take back. Within provers only lower priorities are preempted;
# within circuits nothing is (withinClusterQueue: Never): its rows run 5-11 h uncheckpointed, so a priority there only orders the
# queue. A short capture (priority capture) takes the next free GPU ahead of queued rows and is never evicted by a later row.
# quiet_hour.sh holds circuits' admissions 12:30-13:30Z (stopPolicy: Hold) so benches can re-measure without new Builds.
#
# Kueue admits by quota, not by what the scheduler can place: keep the sums at or under vy-nebius-1's allocatable (192 vCPU,
# ~1,690 GiB), or it admits pods that stay Pending.
# CPU: the node's 192 vCPU less the merge-check slots' 88 cores (8-95, pinned direct work since 08:09Z): 104, as circuits 64
# (4 GPU cells x 16 vCPU) and provers 40. Kueue's quota is accounting; the slots' own pinning keeps checks on their cores.
# The split is circuits 4 GPUs, provers 4. While lanes still run GPU work directly on GPUs 4-7 (outside Kubernetes), cluster_up.sh
# holds those with a placeholder pod and applies this file with provers' GPU quota lowered by the GPUs held (4 -> 0); its GPU jobs
# borrow circuits' idle GPUs meanwhile. Cutover: VY_DIRECT_GPUS=none cluster_up.sh --apply.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: vy-nebius-1}
spec:
  nodeLabels: {verity.dev/server: vy-nebius-1}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: circuits}
spec:
  cohortName: nebius
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Any
    borrowWithinCohort: {policy: LowerPriority}
    withinClusterQueue: Never
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-1
      resources:
      - {name: nvidia.com/gpu, nominalQuota: 4, borrowingLimit: 0}
      - {name: cpu, nominalQuota: 64, borrowingLimit: 0}
      - {name: memory, nominalQuota: 1280Gi, borrowingLimit: 0}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: provers}
spec:
  cohortName: nebius
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Any
    borrowWithinCohort: {policy: LowerPriority}
    withinClusterQueue: LowerPriority
  resourceGroups:
  - coveredResources: [nvidia.com/gpu, cpu, memory]
    flavors:
    - name: vy-nebius-1
      resources:
      - {name: nvidia.com/gpu, nominalQuota: 4}
      - {name: cpu, nominalQuota: 40}
      - {name: memory, nominalQuota: 384Gi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: circuits, namespace: default}
spec: {clusterQueue: circuits}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: provers, namespace: default}
spec: {clusterQueue: provers}
---
# Priorities, highest first. A job names one with the pod label kueue.x-k8s.io/priority-class.
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: capture}
value: 1100
description: short port-lane captures (jobs/port-capture.yaml), first to the next free circuits GPU
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: sweep-night}
value: 1000
description: the night's vLLM config sweep
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: circuits}
value: 500
description: daytime config runs
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: prover-bench}
value: 300
description: timed prover runs, in a quiet window (jobs/prover-bench.yaml)
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: dev}
value: 100
description: prover development and anything else that can wait
