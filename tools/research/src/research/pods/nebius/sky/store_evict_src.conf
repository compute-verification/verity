# /etc/systemd/system/vy-store-evict-research.service.d/src.conf (vy-nebius-1 and vy-nebius-cpu-1; `research deploy` installs it):
# research's hourly store eviction also deletes the `research run` source trees under /workspace/research/src that are recoverable
# on the node and that nothing uses (store_evict.sh, `research data evict --src-dir`). "Nothing uses it" reads every process's cwd and maps
# (CAP_SYS_PTRACE) and its fd/ and environ (CAP_DAC_READ_SEARCH); without both the pass deletes nothing and says so. Recoverable:
# the tree is exactly its commit (git status), and that commit is on a ref of the node's own repository, which keeps
# refs/research/src/<sha> for every tree `research run` ships. It also prunes research's PYTHONPYCACHEPREFIX of the directories
# whose source is gone (VY_EVICT_PYCACHE).
[Service]
Environment=VY_EVICT_SRC=/workspace/research/src VY_EVICT_ORIGIN=/workspace/research/git/verity.git
Environment=VY_EVICT_PYCACHE=/workspace/research/cache/pycache
AmbientCapabilities=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
