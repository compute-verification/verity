# /etc/systemd/system/vy-store-evict-research.service.d/src.conf (vy-nebius-1; cluster_up.sh and `research deploy` install it):
# research's hourly store eviction also deletes the `research run` source trees under /workspace/research/src that are on origin
# and that nothing uses (store_evict.sh, `research data evict --src-dir`). "Nothing uses it" reads every process's cwd and maps
# (CAP_SYS_PTRACE) and its fd/ and environ (CAP_DAC_READ_SEARCH); without both the pass deletes nothing and says so. Origin is
# listed with `git ls-remote` as research, so research needs a read credential for it (or VY_EVICT_ORIGIN a mirror it can list).
[Service]
Environment=VY_EVICT_SRC=/workspace/research/src
AmbientCapabilities=CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
