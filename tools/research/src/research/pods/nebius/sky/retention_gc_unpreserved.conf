# /etc/systemd/system/vy-retention-gc.service.d/20-unpreserved-runs.conf on vy-nebius-2 and vy-nebius-cpu-1 to cpu-15 alone
# (`research deploy` installs it): the collector there also deletes the runs that ended without custody preserving them, once their record has
# expired (`research retention gc --unpreserved-runs`, retention.py). On every other node a pass lists those runs and leaves them.
[Service]
Environment=VY_GC_UNPRESERVED_RUNS=1
