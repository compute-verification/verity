# /etc/systemd/system/vy-store-evict{,-research}.service.d/timed.conf (vy-nebius-2): an eviction pass deletes hundreds of GB at a
# time, so on node 2 it never runs in a timed window, like vy-node-sweep (vy-node-sweep-n2.service).
[Service]
ExecCondition=/bin/grep -qs "timed False" /workspace/pouw/fill/status.txt
