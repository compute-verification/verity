# /etc/systemd/system/user-1001.slice.d/50-vy-headroom.conf on nodes 1 and 2 (1716G each; deploy.toml installs it): all of user 1001,
# every run and loop together, stops at 1600G, leaving the kernel, k3s and the system's services room (user.slice had peaked at 1696G).
# At MemoryMax logind can't create a login's session-N.scope (ENOMEM), so the login runs in ssh.service without its per-run cap,
# and `tele run` refuses to start its workload. No MemoryHigh: above it the kernel throttles every process in the slice, new logins
# included, and an admin can't get in to cancel the runs that filled it (cpu-1 at 647G of a 650G MemoryHigh, 08:39Z 8 Oct).
[Slice]
MemoryMax=1600G
