# /etc/systemd/system/user-1001.slice.d/50-vy-headroom.conf on nodes 1 and 2 (1716G each; deploy.toml installs it): all of user 1001,
# every run and loop together, stops at 1600G, leaving the kernel, k3s and the system's services room (user.slice had peaked at 1696G).
# Past MemoryHigh the slice reclaims (page cache first) before it reaches MemoryMax: at MemoryMax logind can't create a login's
# session-N.scope (ENOMEM), so the login runs in ssh.service without its per-run cap, and `tele run` refuses to start its workload.
[Slice]
MemoryHigh=1500G
MemoryMax=1600G
