// A node's unattended upgrades (/etc/apt/apt.conf.d/52vy-trust: apt reads it after 50unattended-upgrades, and its origins
// replace those of every file before it). Ubuntu's security pocket installs by itself once a day
// (apt-daily-upgrade.timer), the trust store with it, and a daemon restarts when its own package is upgraded. Nothing else
// is an origin: not -updates, and no third-party repository (NVIDIA's), so nothing of theirs moves unattended. The release
// pocket never changes; a security update's new dependency comes from it.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
#clear Unattended-Upgrade::Allowed-Origins;
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Allowed-Origins {
  "${distro_id}:${distro_codename}";
  "${distro_id}:${distro_codename}-security";
  "${distro_id}ESMApps:${distro_codename}-apps-security";
  "${distro_id}ESM:${distro_codename}-infra-security";
};
// Held for a planned window, with the node drained and rebooted, because under a run they break it or change nothing until
// a reboot: the kernel with its modules, headers, tools and firmware, microcode, the boot loader, and the NVIDIA driver
// with CUDA (a driver library newer than the loaded module stops every new GPU process: "Driver/library version
// mismatch"). Python regular expressions, matched at the start of a package's name. A held package is neither upgraded nor
// removed, and an update that needs one changed waits with it.
Unattended-Upgrade::Package-Blacklist {
  "linux-";
  "amd64-microcode";
  "intel-microcode";
  "grub";
  "shim";
  "nvidia-";
  "libnvidia-";
  "xserver-xorg-video-nvidia";
  "cuda";
};
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
// Never a reboot by itself: /var/run/reboot-required says when one is due, and the window takes it.
Unattended-Upgrade::Automatic-Reboot "false";
// Each pass writes what it upgraded, what it kept back and every failure to the journal (`journalctl -t unattended-upgrade`).
Unattended-Upgrade::SyslogEnable "true";
