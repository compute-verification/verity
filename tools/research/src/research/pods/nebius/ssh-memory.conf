# /etc/systemd/system/ssh.service.d/50-vy-memory.conf on every node (deploy.toml installs it; daemon-reload applies it, no restart):
# a login whose session-N.scope logind couldn't create (user-1001.slice at its MemoryMax: 157 on node 1 at 01:59Z 8 Oct, 109 on
# cpu-1 in the 06:00Z hour) runs in ssh.service, which otherwise has no cap. Such a login can run a shell, not a workload (`tele run`
# refuses one there). OOMPolicy=continue: the default, stop, would stop sshd at the first kill; the listener itself is at -1000.
[Service]
MemoryMax=32G
MemorySwapMax=0
OOMPolicy=continue
