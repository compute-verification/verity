# /etc/systemd/system/user@.service.d/vy-cpuset.conf: delegate cpuset to each user's systemd, so AllowedCPUs= on a
# `systemd-run --user` scope confines it. Without cpuset here the user manager ignores AllowedCPUs= without a word, and a
# workload's own `taskset` leaves the CPUs its job was given (infra/cluster submit.py's wrapper checks the scope holds its pin).
# A running user manager learns of it at `systemctl --user daemon-reexec`; its running units keep running.
[Service]
Delegate=cpu cpuset memory pids
