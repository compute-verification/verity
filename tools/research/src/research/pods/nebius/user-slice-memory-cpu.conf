# /etc/systemd/system/user-1001.slice.d/50-vy-headroom.conf on each CPU node (deploy.toml installs it): all of user 1001 stops at
# 93% of the machine's memory (700G of cpu-1's 755G), beside two full checks at most (slot.py; one peaks ~551G). Without it a
# node's runs filled its memory and froze it. At MemoryMax logind can't create a login's session-N.scope (ENOMEM), so the login
# runs in ssh.service without its per-run cap, and `tele run` refuses to start its workload.
# No MemoryHigh: above it the kernel throttles every process in the slice, new logins included, and an admin can't get in to
# cancel the runs that filled it.
[Slice]
MemoryMax=93%
