# /etc/systemd/system/user-1001.slice.d/50-vy-headroom.conf on vy-nebius-cpu-1 (755G; deploy.toml installs it): all of user 1001
# stops at 700G, beside two full checks at most (slot.py; one peaks ~551G). At MemoryMax logind can't create a login's
# session-N.scope (ENOMEM), so the login runs in ssh.service without its per-run cap, and `tele run` refuses to start its workload.
# No MemoryHigh: above it the kernel throttles every process in the slice, new logins included, and an admin can't get in to
# cancel the runs that filled it (cpu-1 at 647G of a 650G MemoryHigh, 08:39Z 8 Oct).
[Slice]
MemoryMax=700G
