# /etc/systemd/system/user-1001.slice.d/50-vy-headroom.conf on vy-nebius-cpu-1 (755G; deploy.toml installs it): all of user 1001
# stops at 700G, beside two full checks at most (slot.py; one peaks ~551G). Past MemoryHigh the slice reclaims (page cache first)
# before it reaches MemoryMax: at MemoryMax logind can't create a login's session-N.scope (ENOMEM), so the login runs in ssh.service
# without its per-run cap, and `tele run` refuses to start its workload.
[Slice]
MemoryHigh=650G
MemoryMax=700G
