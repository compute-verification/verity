# needrestart on a node (/etc/needrestart/conf.d/50-vy.conf). After an upgrade Ubuntu's apt hook restarts every service
# that still maps a replaced library or runs a changed script, unattended upgrades included; a node's services hold
# lanes' work, so here it only lists them (`sudo needrestart -b`), and a planned window restarts them. A daemon whose own
# package is upgraded still restarts with it.
$nrconf{restart} = 'l';
