# /etc/systemd/system/user@1001.service.d/50-vy-oom.conf on every node (deploy.toml installs it): a full user slice OOM-killed
# systemd --user and sd-pam on node 1 (7 Oct 02:03Z), since the default +100 makes the manager a pick. Units it starts still get
# DefaultOOMScoreAdjust=200; ssh session scopes are not its children. Takes effect when user@1001 next starts.
[Service]
OOMScoreAdjust=-900
