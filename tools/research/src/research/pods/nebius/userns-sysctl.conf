# An unprivileged process may make a user namespace: a check's Lean builds (tools/verity/lean/check.py's `unshare --user`)
# and a training job's steps (benchmarks/training_slowdown/training_slowdown/sandbox.py) run in one. Ubuntu 24.04's AppArmor
# refuses it by default. `sysctl -e -p FILE` applies it and passes over a key this kernel lacks.
kernel.apparmor_restrict_unprivileged_userns = 0
kernel.unprivileged_userns_clone = 1
