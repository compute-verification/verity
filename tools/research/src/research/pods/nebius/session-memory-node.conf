# /etc/systemd/system/session-.scope.d/50-vy-job-memory.conf on nodes 1 and 2 (deploy.toml installs it): each research run is an
# ssh login's session scope; past 900G (a full check peaks ~550G) the kernel OOM-kills its biggest process, not the machine and not
# the run's runner, which records the failure and why (OOMPolicy=continue: memory.oom.group 0). `tele run` reads MemoryMax here
# (research.telemetry.cgroup.session_cap) and won't start a workload from a cgroup without a cap of its own.
[Scope]
MemoryMax=900G
MemorySwapMax=0
OOMPolicy=continue
