# The lease loop, on every node that runs it from this file: each node with a lease unit or a deadline below, and every CPU
# node, where vm_setup.sh writes the unit at first boot. vy-nebius-stop, the command the loop stops its machine with, goes to
# the same nodes, and the two are installed together, so deploy keeps the pair in step. Install restarts no unit a setup
# script writes: after installing them, `sudo systemctl try-restart vy-lease`, which leaves a stopped loop stopped. Each
# start of the unit grants the boot lease (its ExecStartPre): a lease with less left is extended to it, a longer one is
