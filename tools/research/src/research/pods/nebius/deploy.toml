# ---- the verified queue's loop (`research queue vqueue`) on a CPU node's own disk, as the user vy-vqueue under
# vy-vqueue.service (vqueue/loop.sh says what it keeps and its three modes: dry-run, which writes nothing and is what it runs
# until its mode file says otherwise, shadow and live). Installing starts nothing. Then, as root: `vy-vqueue-setup` (the
# user, /var/lib/vy-vqueue, its own ssh key, /etc/vy/vqueue for the credentials root copies there by hand), gh at /usr/bin/gh,
# the loop's clone, ci's pinned tree and the loop's state under /var/lib/vy-vqueue, and `systemctl enable --now vy-vqueue`,
# which starts vy-vqueue-token.timer with it. The App's key is read by root's vy-vqueue-token.service alone (token.sh, with
# the control pod's gh_app_token.sh): the loop holds a one-hour token.

[[file]]
path = "/etc/systemd/system/vy-vqueue.service"
src = "tools/research/src/research/pods/nebius/vqueue/vy-vqueue.service"
nodes = ["vy-nebius-cpu-13"]
run = ["systemd:vy-vqueue"]
owner = "infra"

[[file]]
path = "/usr/local/lib/vy-vqueue/loop.sh"
src = "tools/research/src/research/pods/nebius/vqueue/loop.sh"
nodes = ["vy-nebius-cpu-13"]
run = ["systemd:vy-vqueue"]
owner = "infra"

