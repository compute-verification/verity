# What infra's loops, timers and services run on the Nebius nodes, and the file of this repository each one comes from.
# `research deploy drift` compares every entry with `main`; `research deploy install` installs entries from a pushed commit
# (`ops deploy`, infra/ops/verity_ops/deploy.py). A file that a node's `managed` pattern matches and no entry lists is reported as a stray.
#
# [[file]]: `path` on each of `nodes`, installed from `src`; `run` names the units that run it (`systemd:UNIT`,
# `user-systemd:UNIT`, never a tmux session: tests/test_deploy.py), so install restarts them; `owner` is the Slack handle that
# answers for it (.agents/skills/using-slack/registry.json); `hold` says why it isn't deployed yet, and install skips it. With
# `by` in place of `src`, the file is generated by that setup script (a systemd unit, a heredoc): drift checks only that it exists.
# [[tree]]: every file of the directory `src` at the commit, installed under `path`. A file of it not installed leaves drift
# clean, unless the tree has `required = true`: what runs from it needs all of it.
# The drop-ins infra writes (`*vy*`) and every `systemctl set-property` (system.control) are managed, so one made by hand is a stray.
# A node's `quiet`: a shell test on it; install restarts nothing there unless it succeeds.

[nodes.vy-nebius-1]
record = "/workspace/research/deploy/record.jsonl"
managed = [
  "/workspace/verity-guest/bin/*", "/workspace/verity-guest/*.sh", "/workspace/verity-guest/*.py",
  "/usr/local/bin/vy-*", "/usr/local/bin/gpu-lease*", "/usr/local/sbin/vy-*", "/usr/local/lib/vy-monitoring/*",
  "/usr/local/lib/vy-lean-cache/*", "/usr/local/lib/vy-lockout/*", "/etc/systemd/system/vy-*", "/workspace/jobs/dispatch/*.env",
  "/home/research/commit-release/*.py", "/etc/vy/env/*", "/etc/systemd/system/*.d/*vy*", "/etc/systemd/system.control/*/*",
]

[nodes.vy-nebius-2]
record = "/workspace/research/deploy/record.jsonl"
managed = [
  "/workspace/verity-guest/bin/*", "/workspace/verity-guest/*.sh", "/workspace/verity-guest/*.py",
  "/workspace/pouw/infra/bin/*", "/usr/local/bin/vy-*", "/usr/local/bin/gpu-lease*", "/usr/local/sbin/vy-*", "/usr/local/lib/vy-lockout/*",
  "/etc/systemd/system/vy-*", "/home/research/.config/systemd/user/*.service", "/home/research/.config/systemd/user/*.timer",
  "/etc/vy/env/*", "/etc/systemd/system/*.d/*vy*", "/etc/systemd/system.control/*/*",
]
# no timed window runs or waits, by the fill runner's status while it is fresh: a start can touch the GPUs (pouw-infra-util's NVML)
quiet = 'test -n "$(find /workspace/pouw/fill/status.txt -mmin -3)" && head -1 /workspace/pouw/fill/status.txt | grep -q "timed False, window waiting False,"'

[nodes.vy-nebius-cpu-1]
record = "/workspace/research/deploy/record.jsonl"
managed = ["/usr/local/bin/vy-*", "/usr/local/lib/vy-monitoring/*", "/etc/systemd/system/vy-*", "/etc/systemd/system/*.d/*vy*",
           "/etc/systemd/system.control/*/*"]

