# ==== services: the loops above as systemd units (pods/nebius/units/), each one's settings in an environment file from git
# (pods/nebius/env/, installed to /etc/vy/env/). A unit reads /etc/environment, /etc/vy/env/research.env, then
# /etc/vy/env/<unit>.env. Install restarts a running one when its unit or one of these files changes, or when a process of it
# still runs the old version of a file whose entry names it. Each loop's cutover from its tmux session is by hand, one at a time.

# ---- node 1

[[file]]
path = "/etc/systemd/system/vy-n1-lease@.service"
src = "tools/research/src/research/pods/nebius/units/vy-n1-lease@.service"
nodes = ["vy-nebius-1"]
run = ["systemd:vy-n1-lease@provers", "systemd:vy-n1-lease@circuits"]
owner = "infra"

[[file]]
path = "/etc/vy/env/vy-n1-lease@provers.env"
src = "tools/research/src/research/pods/nebius/env/vy-n1-lease@provers.env"
nodes = ["vy-nebius-1"]
run = ["systemd:vy-n1-lease@provers"]
owner = "infra"

