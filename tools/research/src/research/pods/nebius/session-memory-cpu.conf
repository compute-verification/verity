# /etc/systemd/system/session-.scope.d/50-vy-job-memory.conf on vy-nebius-cpu-1 (deploy.toml installs it): each research run is an
# ssh login's session scope; past 600G (one full check, peak ~551G) the kernel OOM-kills its biggest process, not the machine and not
# the run's runner, which records the failure and why (OOMPolicy=continue: memory.oom.group 0). `tele run` reads MemoryMax here
# (research.telemetry.cgroup.session_cap) and won't start a workload from a cgroup without a cap of its own.
[Scope]
MemoryMax=600G
MemorySwapMax=0
OOMPolicy=continue
