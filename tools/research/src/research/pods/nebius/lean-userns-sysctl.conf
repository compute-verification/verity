# /etc/sysctl.d/60-vy-lean-userns.conf on the nodes that build Lean: Ubuntu 24.04's AppArmor refuses unprivileged user
# namespaces by default, so `unshare --user --map-root-user` fails ("write failed /proc/self/uid_map"), check.py's
# `sandboxed()` probe fails, builds run unsandboxed, and only a sandboxed build's modules fill the artifact cache: every
# Lean build slot tree then builds Security/Proofs from source after each Lean-wide change.
kernel.apparmor_restrict_unprivileged_userns = 0
