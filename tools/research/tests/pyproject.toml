# Test-only, and to move: some tests exercise this repository's Tools, workspace and fixtures rather than the tool itself.
# test_store_vllm_tools loads the vLLM stage Tools and hashes their closure (adapters/vllm, verity,
# catalog, kernels, core);
# test_store_prov loads the tc_probe declaration (benchmarks/tc_probe), content-resolves a golden
# fixture (verity/circuits/ops/tests/fixtures) and git-archives benchmarks/tc_probe and verity/circuits/silicon;
# test_repo_replicas hashes every tracked fixture artifacts.json registers (today under adapters/vllm,
# verity/circuits/ops/tests/fixtures and benchmarks/numerical/bench-instances, named on its own so it stays an input wherever it
# sits). test_pythonpath and test_notes derive every workspace member's import root from the
# workspace's pyproject.toml files (research/pythonpath.py) and find each package in an untraced child, so those files are
# listed: moving a member's root selects this suite. tools/check/tool.py stays: the candidates' gate (`jobs/trains.py`) parses it on main, and
# test_jobs_vectors checks that it still can. infra/cluster: the console computes its usage rows with cluster.usage, and
# `research usage` runs `cluster usage`. tools/check/slot.py and lean_slot.py: the quick tier and the Lean sandbox ship
# them to the node (test_queue, test_merge_gate, test_nebius_lean_sandbox). tools/verity/lean/merge.py and check.py: test_queue
# commits them into its origin so the queue's clone runs the `lean-audit` record driver it configures. tools/check/suites.py
# and the settings it reads: test_queue commits them into its origin, so the preflight's tests select suites by its own `touched`.
# tools/check/merge_map.py and merge_rows.py: test_check_merge_drivers merges through them at either layout's place.
# tools/check/gates/markdown_caps.py and tests/test_repository.py: test_queue commits them into its origin, so its sync
# runs the Markdown size limits' landing gate on the limits it reads. tools/check/pins.py: test_queue commits it into its origin, so
# the sync's pin rebuild (`repinned`) reads the real `PINS`. tools/verity/graph/tests/key_vectors.json: test_executor holds
# the executor client's graph/v2 key rule to the vectors both sides of the contract reproduce. tools/verity/lean/lean_audit.py
# and the files it loads (settings.py, module_keys.py, headers.py, tools/check/common.py,
# tools/verity/graph/verity_graph/contract.py): test_vqueue_slim loads it (`vqueue_slim._declaration`), whose declaration names
# a candidate's Lean inputs. tools/move/rename.py,
# layout.py and restack.py: test_queue_moves_carry commits them into its origin and restacks a head across the moves they make;
# restack.py reads its move_lines.toml beside it (`MOVE_LINES`) when test_queue_cross crosses a head. The RTX PRO 6000 node file and card: test_nebius_check holds pods/nebius/check.py's figures to them.
# tools/agent-guard/pre_push.py: test_queue_identity holds the one identity the hook lets through beside a checkout's own to
# the identity a crossing's commits carry (`queue.IDENTITY`).
# tools/check/train.sh: test_landing launches the loop's own (`landing.OWN_TRAIN`) with the settings.py beside it.
inputs = ["tools/research", ".agents/skills", "verity/README.md", ".gitignore", "benchmarks/numerical/bench-instances", "infra/ops", "adapters/vllm", "verity", "verity/circuits", "verity/circuits/kernels",
          "tools/check/lean_slot.py", "tools/check/slot.py", "tools/check/tool.py", "tools/check/drive.toml", "benchmarks/tc_probe",
          "pyproject.toml", "tools/config/pyproject.toml", "verity/protocols/proofs/flock/prover/pyproject.toml", "benchmarks/numerical/pyproject.toml",
          "benchmarks/harness/pyproject.toml", "benchmarks/commitments/pyproject.toml", "benchmarks/network_traces/pyproject.toml",
          "benchmarks/pouw/pyproject.toml", "tools/check/pyproject.toml", "tools/check/settings.py", "tools/check/train.sh",
          "tools/verity/circuit_check/pyproject.toml",
          "infra/cluster", "tools/verity/lean/pyproject.toml", "tools/verity/lean/run_daily.py", "tools/verity/lean/merge.py",
          "tools/verity/lean/check.py", "tools/check/suites.py", "tools/check/gates/markdown_caps.py", "tests/lint/test_repo_silent_excepts.py", "tests/test_repository.py", "tests/test_retired_terms.py", "tools/check/pins.py", "benchmarks/native_peak/pyproject.toml",
          "benchmarks/tc_probe_fp4/pyproject.toml", "tools/move/rename.py", "tools/move/layout.py", "tools/move/restack.py",
          "tools/move/move_lines.toml", "tools/agent-guard/pre_push.py", "tools/verity/graph/tests/key_vectors.json",
          "tools/verity/lean/lean_audit.py", "tools/verity/lean/module_keys.py", "tools/verity/lean/headers.py",
          "tools/verity/lean/settings.py", "tools/check/common.py",
          "tools/verity/graph/verity_graph/contract.py",
          "tools/verity/graph/verity_graph/__init__.py",
          "hardware/nodes/rtx-pro-6000-server-x8.toml", "hardware/cards/rtx-pro-6000-server.toml",
          "tools/check/merge_map.py", "tools/check/merge_rows.py"]
parallel = true
# the suite takes about 11 minutes on 3 workers and over an hour in one process (`held_workers`; on fewer, `bound` stretches
# timeout_s in proportion)
workers = 3
timeout_s = 3600
timeout_workers = 3

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
