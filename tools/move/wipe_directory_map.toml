# The memory wipe's own directory: what `tools/move/layout.py --map tools/move/wipe_directory_map.toml` moves and
# rewrites. The wipe's Python and C leave PoUS's directory for `verity/protocols/accounting/memory/wipe/`, with the same
# inner layout, and its scheme declaration becomes `wipe/scheme.py`. Its Lean stays in the memory attester's Lake
# package (`pous/attester/lean/`), whose modules the onsite composition and Security read; its tests stay in PoUS's
# suites, whose helpers they share. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proof/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", verity_torch = "adapters/torch/verity_torch", input_datasets = "library/datasets/input_datasets", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "calibration/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proof/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", verity_torch = "adapters/torch/verity_torch", input_datasets = "library/datasets/input_datasets", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "calibration/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }

