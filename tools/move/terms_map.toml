[rewrite]
# Never rewritten: the term source and the lints and tables that spell the old words on purpose (the ratchet, the older
# retired-terms test, which research's message vocabulary reads, and its tests), records of what was (the earlier moves
# and their maps, changelogs, the rulings), the move tools' own tests, the frozen backends, replicated fixtures, files
# whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files. The ratchet's allowlist
# holds only paths and counts, so it is rewritten: its paths follow their files.
exclude = ["GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "tools/research/tests/test_slack.py", "tools/move/**", "tools/verity/check/tests/test_move_check.py",
           "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/lake-manifest.json"]

[keep]
# A domain tag or format id, a note, an artifact, a branch, a lane. Then what recorded data or another system reads: a
# quoted lowercase token, escaped inside a string too (a record key or a key path, a reason code, a role, a run's output
# file, a line of a server's protocol: `"draws"`, `"public.draw.units"`, `\"drawn\"`, `"firewall"`, `"draw.json"`,
# `b"draw\n"`; a capitalized one is a Lean name and follows it, and so do a path, a dotted Python module, a tracked source
# file's name, an f-string's code, pytest's argnames, an attribute set or read by name and a keyword passed as a dict,
# which follow their Python names), a two-part id (`"pouw/draw"`, the claim `uniform/flock-coin-server`), an upper-case
# snake-case name (an environment variable or a constant: `FC_FIREWALL`, `CR_N2_DRAW`, `FLOCK_DRAW_LAW`), a run's output
# file after a path, the systemd slice `firewall.slice`, a kebab-case name or a CLI flag (`--draw`, `--firewall-state`,
# `flock-firewall`, `verity-core-firewall`, `drawn-unit-bundle`), the attribute argparse makes of a flag (`a.draw`,
# `inner.draw`; not the profile's `a.draws` or a Lean `a.draw = `), a record key a Python name builds (`drawn_at`,
# `checks_before_draw` and the rest of that list, a keyword of `.update(`, `replay_draw`, `draw_k`) everywhere; the
# deployment's party and the recursion runs' mode `firewall` where shell, a flag's value or a message spells it bare
# (`MODES=firewall`, `--modes firewall`, `(firewall)`, `dials firewall`, `listen: firewall`, `GATE_ABSENT=firewall`), a5's
# coin family (`need 26 draw coins`), the module `verity_flock.firewall` (`python -m` runs it), the refusal
# `FIREWALL-REFUSED`, the stored label `C-Flock`, the audit record's `wrong_units`, `proof_unit` and the `"proof-unit"`
# kind, the public items' reasons `Spec.digest` hashes (`N, the window's proof units` and three more), the package
# directory `verity/core/service/firewall`; the structure `Accounting.TS.DrawnLayer` and its projection
# (names under it are renamed here, so `check.py --moved` reads each back only if the prefix is renamed in a move of its
# own); `law` where it touches a name (GLOSSARY.md keeps `law` identifiers); the other senses of law and draw (a power
# law, the law of large numbers, nvidia-smi's `power.draw`, a game's coin `Game.draw` and `Plays.drawVec`, which beside
# Flock's `Transcript.sample` would be ambiguous), the `round_digest` strings and the label `replay_set=warden/re-verify`;
# and what PoUB's kept `draw` names or shares with the rest of the tree: its modules (`Accounting.Remote.Draw`,
# `RemoteDraw`, `RemoteHeld.Draw`), `draw_salt` (PoUS's and the bandwidth audit's) and the guarantee `drawIsSubset`
# (`--moves` renames a guarantee by its lock's path, not its file's)
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+',
            '(?<![\w\\])(?<!parametrize\()(?<!r\(coins, )(?<!__\(self, )(?<!r\(OR, )(?<!r\(PHC, )(?<!r\(SVC, )(?<!r\(V\.D, )(?<!r\(plan_module, )(?<!\("coins", )[rbfRBF]{0,2}([\x22\x27])(?![A-Z])(?!drawn\1: tuple\()(?!(?:verity|research|circuit_check|cluster|benchmarks|tools|integrations|examples|demos|tests|infra)\w*\.)[^\s\x22\x27/{]*?(?i:draw|law|firewall|coin.server|_units?\b|faulty|δ_?link)[^\s\x22\x27/{]*(?<!\.py)(?<!\.sh)(?<!\.rs)(?<!\.lean)(?<!\.md)(?<!\.toml)\1',
            '\\[\x22\x27](?![A-Z])[^\s\x22\x27\\/{]*?(?i:draw|law|firewall|coin.server|_units?\b|faulty|δ_?link)[^\s\x22\x27\\/{]*\\[\x22\x27]',
            '[\x22\x27][a-z_-]+/[\w-]*(?i:draw|law|firewall|coin.server)[\w-]*[\x22\x27]', '\buniform/flock-coin-server\b',
            '\b[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*_(?:DRAWN|DRAWS|DRAW|LAW|FIREWALL)(?:_[A-Z0-9]+)*\b|\b(?:DRAWN|DRAWS|DRAW|LAW|FIREWALL)(?:_[A-Z0-9]+)+\b',
            '(?<=[/.])(?:draw|drawn|draws|firewall|law)\.(?:json|jsonl|log|bin|lock|txt|npz)\b', '\bfirewall\.slice\b',
            '(?<![\w-])-{0,2}(?:\w+-)+\w*(?i:draw|law|firewall)\w*(?:-\w+)*(?![\w-])',
            '(?<![\w-])-{0,2}\w*(?i:draw|law|firewall)\w*(?:-\w+)+(?![\w-])',
            '(?<![\w-])--\w*(?i:draw|law|firewall)\w*(?![\w-])',
            '(?<!a\.sizes, )\ba\.(?:draw|draws|drawn|undrawn|law|firewall)\b(?! = )',
            '\b(?:draw_k|draw_file|draws_dir|fresh_draws|os_draws|lean_refuses_drawn|lean_refuses_drawless|rec_inner_draw|replay_draw)\b',
            '\b(?:drawn_at|checks_before_draw|unit_draw|draw_counts|draw_coin|draw_after|served_is_lean_draw|draw_reason|draws_scan)\b',
            '\bdraw_salt\b', '\bdrawIsSubset\b', '\bverity_flock[./]firewall\b', '(?<=from verity_flock import )firewall\b',
            '\binner\.draw\b', '\b(?:every|need \d+) draw coins?\b', '(?<=listen: )firewall\b',
            '\bGATE_(?:ABSENT|PEERS|ROLE)=[^\x22\x27\n]*',
            '\b(?:FC|H1S?)_[A-Z0-9_]*FIREWALL[A-Z0-9_]*', 'FIREWALL-REFUSED', '[\x22\x27]C-Flock[\x22\x27]',
            '\bwrong_units\b', '\bproof_unit\b', '[\x22\x27]proof-unit[\x22\x27]', '\bservice/firewall\b',
            'N, the (?:window|round)\x27s proof units', 'one proof unit per registration: the link-window',
            'T proof units per registration, unit t the link-window\x27s bucket row t',
            '\bRemote\.Draw\b', '\bRemoteDraw\b', '\bRemote(?:Held|Audit)[./]Draw(?:Meets)?\b', '\b(?:to)?DrawnLayer\b',
            '\bGame\.draw\b', '\bdrawVec\b',
            '(?<=\.update\()(?:draw|draws|drawn|firewall)(?==)', '\b(draw|draws|drawn)(?==\w+\[\x22\1\x22\])',
            '(?<=\]\}, )draw(?==union_draw\[)', '\bdrawn(?==draws, exclusion_tiles)', '(?<=subcircuit=sub\.id, )draws(?==)',
            '(?<=rounds=len\(got\), )draws(?==)',
            '(?<=[\w.:/`-])[Ll]aws?\b|\b[Ll]aws?(?=[\w/(`-]|\.\w)',
            '\bpower[._ -]draws?\b', '(?i:\bpower draws?\b)', '(?i:power[- ]laws?|laws? of large numbers)',
            "(?:Amdahl|Moore|Little|Zipf|Kerckhoffs)'s laws?", 'round_digest[^\n]*', 'replay_set=warden/re-verify',
            '\bMODES\W{1,8}firewall\b', '(?<=,)firewall(?=,)', '--modes [\w,]+', '\(firewall\)', 'dials firewall']
strings = []

[keep_in]
# the firewall's Lake and uv package stays where it is (its modules follow `Firewall`), and so does the module
# `verity_flock.firewall`; the placement gate's role `firewall`; the games' coin `draw`; a name beside the name it would
# become in one scope (`WorkProfile`'s `drawn` and `sampled`, `network_verdict`'s parameter `drawn` and its local
# `sampled`, with the keyword its test passes); PoUB's remote audit, whose `draws` (the coins' draws) and `samples` (a
# window's sample cap), and `draw` (the pooled-draw term) and `sample`, are two things each, so its `draw` and `draws`
# and their modules wait for a name of its owner's; a vector file Rust includes by name; the vLLM pouw-serve options
# whose field is its flag's attribute; a versioned schema's file
