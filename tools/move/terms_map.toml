# The terminology clean: what `tools/move/rename.py --map tools/move/terms_map.toml` renames, GLOSSARY.md's older names
# to their terms (`tests/lint/test_repo_retired_terms.py` refuses each one's new uses). Phrases come before the words
# they hold, and a prose phrase before the identifier spelling of its word, so that prose reads in the term and code in
# its identifier: "the firewall" becomes "the ZK server", `firewall_state` `zk_server_state`. What recorded data or
# another system reads keeps its spelling ([keep]): record keys, wire kinds, CLI flags, environment variables, stored
# labels, domain tags and format ids. Declarations keep their place in the locks' records: `rename.py --moves` prints the
# renames that `tools/verity/lean/check.py --update --moved` takes.

