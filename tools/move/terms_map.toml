[rewrite]
# Never rewritten: the term source and its lint (they name the old words), records of what was (the earlier moves and
# their maps, changelogs, the rulings), the frozen backends, replicated fixtures, files whose bytes a digest pins
# (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/lint/allowlists/**", "tools/move/**",
           "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/lake-manifest.json"]

[keep]
# a domain tag or format id, a note, an artifact, a branch, a lane; then what recorded data or another system reads:
# the other senses of law (a power law, the law of large numbers), the stored label `C-Flock`, environment
# variables `FC_*FIREWALL*` and `H1*_*FIREWALL*`, CLI flags `--firewall*` and
# `--draw`, the refusal `FIREWALL-REFUSED`, a record's `law`, `wrong_units` and `proof_unit` keys and the
# `"proof-unit"` kind, nvidia-smi's `power.draw` and a GPU's power draw, the `round_digest` strings and the label
# `replay_set=warden/re-verify`
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+',
            '[\x22\x27]C-Flock[\x22\x27]', '\b(?:FC|H1S?)_[A-Z0-9_]*FIREWALL[A-Z0-9_]*', '--firewall[\w-]*', '--draw\b', 'FIREWALL-REFUSED',
            '[\x22\x27]law[\x22\x27]', '\bwrong_units\b', '\bproof_unit\b', '[\x22\x27]proof-unit[\x22\x27]',
            '\bpower[._ -]draws?\b', '(?i:\bpower draws?\b)', '(?i:power[- ]laws?|laws? of large numbers)',
            "(?:Amdahl|Moore|Little|Zipf|Kerckhoffs)'s laws?", 'round_digest[^\n]*', 'replay_set=warden/re-verify']
strings = []

[keep_in]
