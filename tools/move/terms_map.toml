# The terminology clean: what `tools/move/rename.py --map tools/move/terms_map.toml` renames, GLOSSARY.md's older names
# to their terms (`tests/lint/test_repo_retired_terms.py` refuses each one's new uses). Phrases come before the words
# they hold, and a prose phrase before the identifier spelling of its word, so that prose reads in the term and code in
# its identifier: "the firewall" becomes "the ZK server", `firewall_state` `zk_server_state`. Identifiers are renamed only
# where GLOSSARY.md's row says "until renamed" (`Flock.Firewall`, `DrawIsCoin`); a row's other identifiers stay, so "law"
# is renamed in prose only and `law`, `Law` and `drawLaw`'s `Law` stay. What recorded data or another system reads keeps
# its spelling ([keep]): record keys and reason codes (a quoted lowercase token), kebab-case names (CLI flags and the
# attributes argparse makes of them, binaries, executables, distributions, check steps, schema names), environment
# variables, stored labels, domain tags and format ids. A uv workspace member's directory stays where it is ([keep_in]):
# moving it is a `uv.lock` edit, which is its own layout move's. Declarations keep their place in the locks' records:
# `rename.py --moves` prints the renames that `tools/verity/lean/check.py --update --moved` takes.

