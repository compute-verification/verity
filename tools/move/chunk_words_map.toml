# A hash's compression input is a chunk: what `tools/move/rename.py --map tools/move/chunk_words_map.toml` renames,
# the Lean and Python names GLOSSARY.md's row lists "until renamed" for "a compression's 1024 bits": `ROW_BLOCK`
# (Flock's verifier, VStar and their Python mirrors in `verity_flock`), `shaBlock` (Flock's, VStar's and the bridge's
# compression step) and `blockBit` (where a bit of a compression's input sits: `Flock.HmRow`'s, the Hm discharge's and
# H1's), each as a whole name and as a part of one (`keeps_shaBlock`, `blockBit_lt`). Every `blockBit` is renamed, so
# a bare use resolves to the same declaration as before. The Lean snippets the prover's tests compile
# (`test_lean_verifier.py`, `test_pouw_rows.py`) change with the Lean.
#
# It leaves: the bare word "block" in every sense; `Randomness.block`, whose file `randomness_lean.json` pins by sha256
# (only its generator, which builds the Lean, rewrites that pin); the locks' records (`lean-audit.json`, regenerated at
# the close); GLOSSARY.md's row, which records the old names; and the retired-words lints' examples.

[words]
"ROW_BLOCK" = "ROW_CHUNK"
"shaBlock" = "shaChunk"
"blockBit" = "chunkBit"

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, fixtures, patches, the Glossary's older-names
# rows, the retired-words lints' examples), files whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line
# itself) and lock files. A `lean-audit.json` is read, not excluded: `rename.py` leaves its records itself, and
# `--moves` reads them for `tools/move/chunk_words_moves.json`.
exclude = ["tools/move/**", "**/fixtures/**", "**/*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock",
           "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py"]
