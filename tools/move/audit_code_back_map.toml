# The compute audit's commands back out of `verity/`: what `tools/move/layout.py --map tools/move/audit_code_back_map.toml`
# moves and rewrites.
#
# `verity` imports the standard library, its declared dependencies and itself, and nothing outside `benchmarks/` imports
# `benchmarks/` (`tests/test_boundaries.py`). The audit's commands that drive the adapter (`verity_vllm`), Flock's prover
# (`verity_flock`) and the benchmarks' scripts, the cost model's two files that read the adapter, and every test that
# loads one of them or reaches into `benchmarks/` go back to where they stood before `audit_code_map.toml`, under their
# names there; what loads none of them stays in SPOT (the verifier's member trees, served integrity and audit record,
# the challenger's session and party, the local challenger, `class_size.py` and the cost model's other files). The
# imports that name a moved file as a module are bare again (`import a5 as A5`), as before the move, and a hand commit
# after this one writes them.

