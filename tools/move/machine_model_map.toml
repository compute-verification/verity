# The machine model's move: what `tools/move/layout.py --map tools/move/machine_model_map.toml` moves and rewrites.
#
# `benchmarks/pouw/machine_model/` becomes `benchmarks/machine_model/`: the model prices any design's machine code on a
# card, it measures nothing of PoUW's, and the directories that import it are not all PoUW's. The row moves every file
# under the directory (the package, its data, its tests, its README and its `pyproject.toml`) and rewrites each path
# that names it: the workspace member and its directory in `uv.lock`, the suites' inputs, the fetched fixtures' rows,
# the launchers' `--mm` argument and the `Path(__file__)` anchors of the files that read its data by path.
#
# What stays:
# - the import name `verity_machine_model`: its root moves with the directory ([roots]), so no import and no dotted name
#   of the package changes; the distribution stays `verity-machine-model`;
# - the console script `machine-model` (`verity_machine_model.cli:main`), which is the directory's runner;
# - every Lean file's bytes ([rewrite] exclude), and so the text the three generators print into Lean ([rewrite.keep_in]);
# - every kernel source's bytes ([rewrite] exclude).
# One file is deleted ([drop]). Nothing is split or edited, and no file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"benchmarks/pouw/machine_model/" = "benchmarks/machine_model/"

[retired]
paths = ["benchmarks/pouw/machine_model/"]

[drop]
# The directory's row in the index of what `benchmarks/pouw/` holds (`contents.py paths`), whose test holds each row to
# a path under that directory: the model is no longer one of them.
paths = ["benchmarks/pouw/contents/paths/machine_model.toml"]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), the
# archive, files whose bytes a digest pins, every Lean file (a path in a Lean comment keeps the old name until an edit
# of that file takes it: a rewritten Lean file recompiles every module that imports it), and every kernel source, whose
# bytes change only with its owner's build check.
exclude = ["fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256",
           "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json", "**/*.lean",
           "**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.h"]
# Rewritten though a pattern above matches: the registry of fetched fixtures, three of which are the model's.
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md"]

[rewrite.keep_in]
# Three generators print the model's path into the docstring of a Lean file, and a test holds each Lean file to its
# generator's output byte for byte. The Lean files keep their bytes, so the text each generator prints keeps the old
# path too, until the change that writes those Lean files again. Each pattern is that text alone: the paths these files
# read the data by are `Path(__file__)` anchors and imports, which follow the move.
"benchmarks/pouw/lean_headline.py" = ["benchmarks/pouw/machine_model/data"]
"benchmarks/pouw/lean_headline_dc.py" = ["benchmarks/pouw/machine_model/data"]
"**/verity_machine_model/sheet.py" = ["benchmarks/pouw/machine_model/data/devices/sm_*"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`): the directory as a dotted path. Its tests are named
# that way; the package keeps `verity_machine_model`.
"benchmarks.pouw.machine_model" = "benchmarks.machine_model"
