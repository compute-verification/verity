# Pearl's "debit" in printed text: what `tools/move/rename.py --map tools/move/sweep_sweepcap_inert_work_printed_map.toml`
# renames, the phrases ("the replayed debit", "a row's debit") that a message, a comment or a doc says with a word before
# "debit", which no prose map reaches inside a string.
#
# Each entry is a phrase of two words, so it never stands in a name. It is here only if every place the phrase stands in the
# tree is a string, a comment or a doc (never code), and neither a Lean string literal nor a data file holds it: Pearl+'s
# verdict reasons ("the replayed debit ... exceeds the cap") are Lean's, shared with the stored verdicts, and stay for the
# Lean names pass.

[words]
"statement's debit" = "statement's inert work"
"verifier's debit" = "verifier's inert work"
"credited debit" = "credited inert work"
"record's debit" = "record's inert work"
"sample's debit" = "sample's inert work"
"column debits" = "column inert work"
"Skip's debit" = "Skip's inert work"
"card's debit" = "card's inert work"
"honest debit" = "honest inert work"
"served debit" = "served inert work"
"ship's debit" = "ship's inert work"
"tile's debit" = "tile's inert work"
"tree's debit" = "tree's inert work"
"word's debit" = "word's inert work"
"words' debit" = "words' inert work"
"local debit" = "local inert work"
"row's debit" = "row's inert work"
"rows' debit" = "rows' inert work"
"whose debit" = "whose inert work"
"Skip debit" = "Skip inert work"
"C's debit" = "C's inert work"
"its debit" = "its inert work"
"own debit" = "own inert work"
"no debit" = "no inert work"
"a debit" = "inert work"

