# The slowdown area's namespaces, by `tools/move/rename.py --map tools/move/slowdown_namespace_map.toml`.
#
# `tools/move/slowdown_area_map.toml` moved the bound's files to `Slowdown` and kept their declarations' names. This map
# renames them as the directory does: each declaration of a file under `security/*/Slowdown/`, and the bound's premises
# in `Definitions/Assumptions.lean` (`Cut.Assumptions`, `Formalism.Assumptions`), from `InferenceOnly.` to `Slowdown.`; the
# coverage floor's too (`CapabilityFloor*`, `CoversEfficientMethods`), which the accounting split moved into the area.
# A namespace that holds only those is one word; a declaration in a namespace the policy shares (`Guarantees`,
# `Assumptions`, `SecurityProofs`, the root) is its own. In the moved files, `namespace` and `end` lines follow.
# The policy's names keep `InferenceOnly.`, and so do the modules that stay (`[keep]`). The locks keep the old names
# (`[rewrite] exclude`) for `tools/verity/lean/check.py --update --moved` with the map `rename.py --moves` prints.

[words]

[[words_in]]
files = ["*"]
[words_in.words]
"InferenceOnly.Capability" = "Slowdown.Capability"
"InferenceOnly.Cover" = "Slowdown.Cover"
