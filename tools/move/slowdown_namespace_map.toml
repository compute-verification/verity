           "**/*.lock", "**/lean-audit.json", "tools/research/src/research/store/moves.json",
           "tools/research/tests/test_queue.py"]

[keep]
patterns = ['(?:Definitions|Proofs|Properties)\.InferenceOnly\b[\w.]*', '[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b',
            'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']
