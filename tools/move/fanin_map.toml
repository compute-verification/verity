# The retired word "legs" where it names a model's fan-in: what `tools/move/rename.py --map tools/move/fanin_map.toml`
# renames. The slowdown calculator's `Model.legs` (`Keyed`'s `d`, the least `d_in` of a layer's matrices, the measured
# a_in) becomes `Model.fanin`, beside `fanout`, and `derived_legs` `derived_fanin`, with the data files' key and the
# dictionaries circuit properties sets beside a_in. Only the files below: "legs" elsewhere (a Dot16 step's terms, the
# all-protocols runner's subprotocols) is another sense and another map's.
# `Model.legs` itself, bare `legs`, has no row: `leg_words_map.toml`'s `Legs` and `LEGS` fold onto it in the test of
# two maps, and the files below no longer hold it.

[words]

[[words_in]]
files = [
    "benchmarks/slowdown/slowdown/instances.py",
    "benchmarks/slowdown/tests/test_instances.py",
    "benchmarks/slowdown/tests/test_circuits.py",
    "benchmarks/slowdown/data/models.toml",
    "benchmarks/slowdown/data/reference.toml",
    "benchmarks/circuit_properties/run.py",
    "benchmarks/circuit_properties/README.md",
    "benchmarks/circuit_properties/tests/test_references.py",
]
words = { "derived_legs" = "derived_fanin" }
