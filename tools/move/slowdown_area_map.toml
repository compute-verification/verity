# The slowdown bound's own area, `Slowdown`, by `tools/move/rename.py --map tools/move/slowdown_area_map.toml`.
#
# `security/`'s `InferenceOnly` area held the inference-only policy and the slowdown bound together. A file goes to
# `Slowdown` in its tree when every declaration in it is the bound's: the `Slowdown*` statements and proofs, their
# premises, the work and product counts, the cuts, and the training bounds stated over the policy (the cover theorem,
# covering, fit, threads, layered, capability, the formalism, the remote bound). The policy stays: its definitions
# (`Policy`, `Complies*`, `freshInput`, `Reads`, `readsIn`), its premises (`Coverage`, `Sessions`, `ThetaRegistered`), its
# rules (`CompliesCK`, `PartitionCovers`, the rate rule, `ReadBound`), and the check (`Properties/InferenceOnly`, its
# proofs, and what a verdict carries). A file holding both stays, and each tree's `InferenceOnly.lean` with it.
#
# Each moved unit is two words: its path below `security/` and its module, which the path names (`Proofs` and its
# `Properties/` sit below `security/` by `srcDir = ".."`), so the files move and every import and path follows; a word
# also moves the modules below it and those it begins (`Fit` moves `FitRate`). It is a word map and not a layout map
# because `layout.py` names a module from the nearest lakefile, which `srcDir = ".."` defeats.

[words]
"Definitions/InferenceOnly/Assumptions/Capability" = "Definitions/Slowdown/Assumptions/Capability"
"Definitions.InferenceOnly.Assumptions.Capability" = "Definitions.Slowdown.Assumptions.Capability"
