# The Security/ layout move's renames: what `tools/move/rename.py --map tools/move/security_map.toml` renames.
#
# `Security/` is three trees, `Definitions/`, `Properties/` and `Proofs/`.
# - `Models/<Area>/{Assumptions,Guarantees}` folds into `Definitions/<Area>/{Assumptions,Guarantees}`: module `Models.<Area>.X`
#   becomes `Definitions.<Area>.X`. The aggregator `Models.lean` keeps its name and imports them until the follow-up folds
#   it into `Definitions.lean`.
# - The property proofs leave `Properties/Proofs/` for `Proofs/Properties/`, roots of `security_proofs`: module
#   `Properties.Proofs.X` becomes `Proofs.Properties.X`. `Properties/` keeps the statements.
# Declarations and namespaces keep their names, so no guarantee changes.

[words]
"Models.Accounting" = "Definitions.Accounting"
"Models.Core" = "Definitions.Core"
"Models.Flock" = "Definitions.Flock"
"Models.Hash" = "Definitions.Hash"
"Models.Nci" = "Definitions.Nci"
"Models.NetworkCertifier" = "Definitions.NetworkCertifier"
"Models.Pous" = "Definitions.Pous"
"Models.Pouw" = "Definitions.Pouw"
"Models/Accounting" = "Definitions/Accounting"
"Models/Core" = "Definitions/Core"
"Models/Flock" = "Definitions/Flock"
"Models/Hash" = "Definitions/Hash"
"Models/Nci" = "Definitions/Nci"
"Models/NetworkCertifier" = "Definitions/NetworkCertifier"
"Models/Pous" = "Definitions/Pous"
"Models/Pouw" = "Definitions/Pouw"
"Properties.Proofs" = "Proofs.Properties"
"Properties/Proofs" = "Proofs/Properties"
"Security/Models/" = "Security/Definitions/"
# The same renames as tests spell them: pathlib chains and a regex.
'"Models" / "Accounting"' = '"Definitions" / "Accounting"'
'"Models" / "Flock"' = '"Definitions" / "Flock"'
'"Models" / "Nci"' = '"Definitions" / "Nci"'
'"Models" / "Pous"' = '"Definitions" / "Pous"'
'"Models" / "Pouw"' = '"Definitions" / "Pouw"'
'Models\.Flock' = 'Definitions\.Flock'

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps and tests, changelogs, the rulings), the frozen
# backends, files whose bytes a digest pins, and the research harness's recorded moves.
exclude = ["tools/move/**", "archive/**", "tools/research/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md",
           "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "tools/verity/check/tests/test_move_check.py"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']
strings = []

[keep_in]
