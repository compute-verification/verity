# The retired word family DRAW in PoUB's and PoUS's Python names (MEM-152's retired words), by
# `python3 tools/move/rename.py --map tools/move/draw_poub_pous_names_map.toml`: compound identifiers, each renamed to the
# Glossary's sample, sampled or sampling (coins are flipped; a registration is issued), in the files that hold it. PoUS's
# `draw_salt` is renamed wherever it stands, the vLLM adapter's and the P2 stage benchmark's calls of it included. The bare
# words `draw`, `draws` and `drawn` are not here: they are the records' keys and the attributes that write them. No path
# moves and no Lean declaration is renamed. The certifier's paths are excluded while its quiet window lasts.

[words]
"draw_salt" = "sample_salt"

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "GLOSSARY.md", "tests/lint/**",
           "tests/test_retired_terms.py", "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[[words_in]]
files = ["verity/protocols/accounting/poub/verifier/session_parties.py"]
words = { "MAX_DRAWS" = "MAX_SAMPLES" }

