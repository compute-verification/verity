# The docstrings that name a parameter the docket_locals maps renamed: ``registration`` becomes ``docket`` where it
# names `stop_order`'s, `session_registered`'s or `_audited`'s parameter, or the replay bundle's checks' or
# two-stage's `sampled`.

[words]

[[words_in]]
files = ["verity/protocols/proofs/spot/prover/audit/two_stage.py"]
[words_in.words]
"stop docket ``registration`` (its digest" = "stop docket ``docket`` (its digest"

[[words_in]]
files = ["verity/protocols/proofs/spot/prover/tests/test_records_audit.py"]
[words_in.words]
"an audit record of ``registration`` (default" = "an audit record of ``docket`` (default"

[[words_in]]
files = ["verity/protocols/proofs/spot/verifier/one_stage/audit.py"]
[words_in.words]
"`registration`, only its own values" = "`docket`, only its own values"

[[words_in]]
files = ["benchmarks/one_stage/interfaces/verity_e2e_demo/replay_bundle.py", "benchmarks/two_stage/audit.py"]
[words_in.words]
"``registration``" = "``docket``"

[keep]
patterns = []
strings = []

[rewrite]
exclude = ["**/*.json", "**/*.jsonl", "**/*.toml", "**/*.lean", "**/fixtures/**", "tools/move/**",
           "tools/research/src/research/store/moves.json"]
