[rewrite]
# Never rewritten: records of what was, files a digest pins, locks, and what isn't Lean or its prose.
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/*.py", "benchmarks/**", "adapters/**", "tools/**"]

[keep]
# Format ids, notes, art ids, branches and lanes; record keys and tag strings that keep the word until a format
# version; the evidence's own `windows` key in the remote check.
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+',
            'lanes/[\w.-]+', '"(?:window|windows|session|sessions|period|periods|wrong|transcript|escape|horizon)"',
            '(?<=let \.arr ws := )e\.windows']
