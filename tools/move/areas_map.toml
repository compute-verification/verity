# The Security/ areas move's renames: what `tools/move/rename.py --map tools/move/areas_map.toml` renames.
#
# One area name across `Definitions/`, `Properties/` and `Proofs/` ("Areas, one name each"): the per-component property
# modules become modules of their area, statements (`Properties/`) and their proofs (`Proofs/Properties/`) together, and
# `Population` becomes `SampledProofs`, the sampled proofs service's name.
# - `Properties.{CertifierDevice,CertifierNetwork,NetworkCertifier,NetworkRecords}` become
#   `Properties.NetworkCertifier.{Device,DeviceOutput,Check,Records}`;
# - `Properties.NciDesc` becomes `Properties.Nci.Desc`, `Properties.Identity` `Properties.Hash.Identity`,
#   `Properties.Evaluate` `Properties.Core.Evaluate`, `Properties.RemoteAudit` `Properties.Accounting.Remote`;
# - `Definitions.Population` and `Proofs.Population` become `Definitions.SampledProofs` and `Proofs.SampledProofs`.
# Module names only: declarations and namespaces keep their names, so no guarantee changes. Six statement modules share
# their name with their namespace (`namespace Properties.CertifierDevice`), so [keep] holds a namespace where it is one: on
# a `namespace`, `end`, `open` or `export` line, and as the prefix of a declaration's name.
# Run it once, on a tree before the move: `Properties/NetworkCertifier` is both an old name and the new area.

[words]
"Properties/CertifierDevice" = "Properties/NetworkCertifier/Device"
"Properties/CertifierNetwork" = "Properties/NetworkCertifier/DeviceOutput"
"Properties/NetworkCertifier" = "Properties/NetworkCertifier/Check"
"Properties/NetworkRecords" = "Properties/NetworkCertifier/Records"
"Properties/NciDesc" = "Properties/Nci/Desc"
"Properties/Identity" = "Properties/Hash/Identity"
"Properties/Evaluate" = "Properties/Core/Evaluate"
"Properties/RemoteAudit" = "Properties/Accounting/Remote"
"Properties.CertifierDevice" = "Properties.NetworkCertifier.Device"
"Properties.CertifierNetwork" = "Properties.NetworkCertifier.DeviceOutput"
"Properties.NetworkCertifier" = "Properties.NetworkCertifier.Check"
"Properties.NetworkRecords" = "Properties.NetworkCertifier.Records"
"Properties.NciDesc" = "Properties.Nci.Desc"
"Properties.Identity" = "Properties.Hash.Identity"
"Properties.Evaluate" = "Properties.Core.Evaluate"
"Properties.RemoteAudit" = "Properties.Accounting.Remote"
"Definitions/Population" = "Definitions/SampledProofs"
"Proofs/Population" = "Proofs/SampledProofs"
"Definitions.Population" = "Definitions.SampledProofs"
"Proofs.Population" = "Proofs.SampledProofs"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps and tests, changelogs, the rulings), the frozen
# backends, files whose bytes a digest pins, and the research harness's recorded moves.
exclude = ["tools/move/**", "archive/**", "tools/research/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md",
           "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "tools/verity/check/tests/test_move_check.py"]

[keep]
# A namespace where it is one: a namespace line, and a declaration's name under one of the six namespaces a statement module
# shares (not `Proofs.Properties.*`, which are modules, nor `Runs`, a module under `Properties.CertifierNetwork`). The modules
# under `Properties.RemoteAudit` share their names with namespaces and declarations (`Line`, `Line.Record`), so one of them
# is a module only where a whole import line or a quoted string names it.
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+',
            '(?m)^[ \t]*(?:namespace|end|open|export)[ \t].*$',
            '(?<!Proofs\.)(?:(?<!import )(?<!")|(?!Properties\.RemoteAudit\.(?:Coins|Pooled|Schedule|Line(?:\.Premises|\.Record)?)(?:["\s]|$)))Properties\.(?:CertifierDevice|CertifierNetwork|NetworkCertifier|NetworkRecords|Identity|RemoteAudit)\.(?!Runs\b)[\w«]']
strings = []
