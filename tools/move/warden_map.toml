# The retired name "warden" leaves the tree: every use becomes the network certifier (GLOSSARY.md, "Older names").
#
# Names. Prose says "network certifier". The benchmarks and the certifier package hold two programs of the network
# certifier, the relay this word named and the proxy (`active.Proxy`, `grid.Certifier`, `certifier_serve.py`,
# `certifier-rehearse`), whose names already spell `certifier`, so an identifier of the relay takes the whole term:
# `network_certifier`, `NetworkCertifier`, `NETWORK_CERTIFIER`, `network-certifier-` in a flag or a tool's name. The Lean
# has no second device: its identifiers take `certifier` (`Kind.certifier`, beside `certifierCode` and
# `CertifierSchedule`), and the two modules named for the word are named for what they define, the cells
# (`NetworkCertifier.Cells`). Where the Lean's prose sets the relay beside the certifier's record of it, the word is
# "relay".
#
# Kept bytes ([keep]): a name that something outside this move's reach holds. To rename one, regenerate what holds it:
# - domain tags and format ids (`verity-network-warden/.../vN`, `verity/a5/warden-stand-in/v1`), which are hashed or
#   signed: a tag changes only as a new version, with every commitment, certificate and pinned vector made under it;
# - names staged into a circuit or a statement (`WardenRowIdentity`, `unit/warden-row`, `unit/a5-warden`,
#   `a5-warden/rest/`): the circuit-check pins and every kept proof of those units;
# - the word as a whole value, in quotes or as a path's segment: the link name, a link-window case's `kind` and its
#   key, a gate request's `device`, a class, a path label, a run's directory. The Lean's JSON reader, the difftest
#   vectors, the pinned fixtures and every kept run's records carry it: a new format version, and those regenerated;
# - a record's keys and a kept run's file names (`warden_run`, `warden_check`, `warden.json`,
#   `warden-registration.json`, the negatives' names): the leak guard's rows and every kept run that a later step reads;
# - the gate's verb `warden-rehearse` and its refusal `warden-fails`: the deployed gate and its callers' keys;
# - the trace corpus's labels (`warden-heavy`, `warden-smallkv`) and the fixture cut from it: the corpus artifact.
#
# Not this concept: an "active warden" and a "passive warden" in network steganography's sense, which the architecture
# and two Lean docstrings cite as that field's term.
#
# Left as they are ([rewrite] exclude): the files that name the retired word as the word (`tests/test_retired_terms.py`,
# the Glossary's "Older names" row), this directory's maps and toy fixtures, research's store vocabulary and
# `moves.json`, and replicated fixtures.

