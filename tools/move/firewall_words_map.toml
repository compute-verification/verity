# The retired word "firewall" in `benchmarks/` outside the proof system's directories, in the Glossary's words: what
# `tools/move/rename.py --map tools/move/firewall_words_map.toml` renames. GLOSSARY.md: "firewall"; `flock-firewall`,
# `Flock.Firewall`, `FC_FIREWALL*`, until renamed -> the ZK server. The word and every name the proof system spells
# (`FC_FIREWALL*`, `flock-firewall`, `--firewall`, `t.firewall*`, `H1_FIREWALL`, `H1S_*FIREWALL*`, `SC_FIREWALL_B`,
# `a.firewall`, `WZ.firewall`, `build-firewall.log`, ...) are `zk_server_map.toml`'s rows, and `def firewall` is
# `network_vocabulary_map.toml`'s: one map holds each word (`tools/move/tests/test_maps.py`). This map holds only what
# those give otherwise:
# - two phrases of "firewalled", which read "behind the ZK server";
# - the warden's party in `compile_slice_zk`'s environment, `WZ, "firewall"` -> `WZ, "zk_server"`;
# - the files a run writes, `firewall.sha256` and `firewall.txt` -> `zk-server.sha256` and `zk-server.txt`.
# It leaves ([rewrite], [keep]):
# - the proof system's own directories (`verity/protocols/proofs/`, `security/`, and proofs' under `benchmarks/`), the
#   rest of the tree, which `zk_server_map.toml` covers, `benchmarks/recursion_e2e/` and `recursion_figures/`, renamed
#   by their owner with the old spellings a recorded run carries, and the lints and the Glossary row that name the
#   word;
# - a path into the proof system's tree, spelled as it stands there;
# - what proofs' scripts under `benchmarks/` still share under the old word: the build lock `.firewall.lock` and
#   `firewall_env`, until proofs renames them there;
# - bytes a stored record or a digest takes in: the h1 summaries' keys `firewall`, `firewall_timed` and
#   `firewall_peak_rss_gb`, the SPOT party `firewall` (`"firewall"`, `GATE_ABSENT=firewall`), and domain tags.

[words]
"A firewalled prover's environment" = "The environment of a prover behind the ZK server"
"the first firewalled lane" = "the first lane behind the ZK server"
"WZ, \"firewall\"" = "WZ, \"zk_server\""
"firewall.sha256" = "zk-server.sha256"
"firewall.txt" = "zk-server.txt"

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock", "**/lean-audit.json", "**/lake-manifest.json", "GLOSSARY.md", "tests/test_retired_terms.py",
           "tests/lint/test_repo_retired_terms.py", "tests/lint/allowlists/**", ".agents/skills/friction/SKILL.md",
           "tools/research/tests/test_slack.py", "verity/protocols/proofs/**", "security/**",
           "benchmarks/one_stage/**", "benchmarks/remote_session/**", "benchmarks/recursion_e2e/**",
           "benchmarks/recursion_figures/**",
           "benchmarks/numerical/tests/checker/fixtures/typed-obligation-v0/**", "benchmarks/serve_tax/**",
           "benchmarks/replay_ladder/**", "benchmarks/commitments/**", "benchmarks/multi_unit/**",
           "benchmarks/private_circuit/**", "benchmarks/verifier_cost/**", "benchmarks/proof_throughput/**",
           "benchmarks/flock_s8_block/**", "benchmarks/sampling_plan/**", "benchmarks/spot_figures/**",
           "benchmarks/dsa_topk/**", "benchmarks/route_capture/**", "benchmarks/spot_proved/**", "benchmarks/unit_walk/**",
           "benchmarks/flock_kernels/**", "benchmarks/two_stage/**", "benchmarks/definitions/numerics/cuda/**"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b',
            'note:[\w./-]+',
            'art:[0-9a-f]+',
            '(?:goal:)?proofs/firewall-[\w-]+',
            'cursor/[\w./-]+',
            'lanes/[\w.-]+',
            'verity/protocols/proofs/[\w./-]*',
            'firewall_env',
            '\.firewall\.lock',
            '(?<!WZ, )"firewall"',
            '"firewall_(?:timed|peak_rss_gb)"',
            '`firewall/`',
            '\| `firewall` \|',
            'dials firewall',
            'listen: firewall',
            'GATE_ABSENT=firewall',
            '"firewall": \d+']

