# The retired "coin source" family (GLOSSARY.md: "coin source", "randomness source", "coin device" are the challenger's
# live-coin part): what `tools/move/rename.py --map tools/move/coin_source_words_map.toml` renames over the whole tree.
# - `CoinSource`, Flock's recursion algebra's coins by round (`Flock.RecAlgebra.CoinSource` and its `ofRounds`, `zeros`,
#   `round`, `drawnAll`; `verity_flock.rec_algebra.CoinSource`), is `RoundCoins`, in Lean, Python and prose;
# - `coin_source`, the name in code of where a run's coins come from (a parameter, an attribute, a local, a test's name),
#   is `coins_from`;
# - the prose "coin source(s)", by sense, file by file: a party's coins, a stream's or a window's coins' origin, the
#   challenger's entropy, a coin key, Flock's `RoundCoins`.
# It leaves every byte a stored record, a wire format or a digest takes: the key "coin_source" of a window's commitment,
# a served record and the Lean verifier's input (quoted, in backticks, and the keywords `.update(...)` or a test's
# `Run(**commits)` turns into keys), and SPOT's refusal `RAN_OUT` ("the randomness source ran out"), which verdicts record
# and the lock pins. GLOSSARY.md's retired-terms row and the lints that name the terms are not rewritten.

[words]
"CoinSource" = "RoundCoins"
"coin_source" = "coins_from"

[[words_in]]
files = ["**/protocols/test_pouw_h1.py"]
[words_in.words]
