[keep]
# the key of a stored record, a served record and the Lean verifier's input: quoted, in backticks (but a parameter's
# ``coin_source`` is), a keyword `.update(...)` turns into a key, and the key in a Lean refusal's text
patterns = ["[\"']coin_source[\"']", "`+coin_source`+(?! is\\b)", "\\.update\\([^\\n]*?\\bcoin_source(?==)",
            "\\(coin_source, when given"]

[keep_in]
# a test whose `Run(y, **commits)` makes each keyword a key of the record the code reads
"**/harness/tests/test_bench.py" = ["coin_source"]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the archive), files whose bytes a
# digest pins, lock files, the lints that name the retired terms and the Glossary's row of them.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "tests/test_retired_terms.py", "tests/lint/**"]
