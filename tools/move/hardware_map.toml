# The hardware data sheets' move: what `tools/move/layout.py --map tools/move/hardware_map.toml` moves and rewrites.
#
# The data sheets, one TOML file a card (`verity/hardware/cards/*.toml`) and one a kind of node
# (`verity/hardware/nodes/*.toml`), become `hardware/cards/*.toml` and `hardware/nodes/*.toml`: a top-level `hardware/`
# that holds data only. Each sheet has its own row, so a sheet a branch adds needs a row too. The two loaders were the
# packages that held the sheets (`cards/__init__.py`, `nodes/__init__.py`); each becomes a module of the same name
# (`verity/hardware/cards.py`, `verity/hardware/nodes.py`), so `verity.hardware.cards` and `verity.hardware.nodes` import
# as before and no import changes. Each loader finds its sheets by a `Path(__file__)` anchor, which the tool rewrites.
#
# What stays: every other file of `verity/hardware/` (the types, the registration log, the Lean generator, the tests),
# and every Lean file's and every kernel source's bytes ([rewrite] exclude). No root moves ([roots] old == new). The
# format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/hardware/cards/b200-sxm-180gb.toml" = "hardware/cards/b200-sxm-180gb.toml"
"verity/hardware/cards/dgx-h200.toml" = "hardware/cards/dgx-h200.toml"
"verity/hardware/cards/h200-sxm-141gb.toml" = "hardware/cards/h200-sxm-141gb.toml"
"verity/hardware/cards/nebius-vm-monotonic-raw.toml" = "hardware/cards/nebius-vm-monotonic-raw.toml"
"verity/hardware/cards/rtx-pro-6000-server.toml" = "hardware/cards/rtx-pro-6000-server.toml"
"verity/hardware/cards/xeon-6776p-2s.toml" = "hardware/cards/xeon-6776p-2s.toml"
"verity/hardware/cards/xeon-platinum-8468-2s.toml" = "hardware/cards/xeon-platinum-8468-2s.toml"
"verity/hardware/nodes/h200-sxm-141gb-x1.toml" = "hardware/nodes/h200-sxm-141gb-x1.toml"
"verity/hardware/nodes/rtx-pro-6000-server-x8.toml" = "hardware/nodes/rtx-pro-6000-server-x8.toml"
"verity/hardware/cards/__init__.py" = "verity/hardware/cards.py"
"verity/hardware/nodes/__init__.py" = "verity/hardware/nodes.py"

[tokens]
# the two directories no row moves whole, as a reference to one reads after the move: the sheets' place
"verity/hardware/cards/" = "hardware/cards/"
"verity/hardware/nodes/" = "hardware/nodes/"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row
paths = ["verity/hardware/cards/", "verity/hardware/nodes/"]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), the
# archive, files whose bytes a digest pins, every Lean file (a path in a Lean comment keeps the old name until an edit
# of that file takes it: a rewritten Lean file recompiles every module that imports it), every kernel source, whose
# bytes change only with its owner's build check, and the tree file (`tests/tree.toml`), whose not-yet lines name each
# path where it is before its move: a move doesn't edit it, and a line whose move landed is its owner's to delete.
exclude = ["fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256",
           "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json", "**/*.lean",
           "**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.h", "tests/tree.toml"]
# Rewritten though a pattern above matches: the registry of fetched fixtures and the fixtures' READMEs.
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md"]

[rewrite.keep_in]
# The Lean generator prints a card's path into the comment that opens each generated table
# (`security/Definitions/Core/Accel/H200.lean`, `Sm120.lean`), and a test holds each table to the generator's output byte
# for byte. The tables keep their bytes, so the text the generator prints keeps the old path too, until the change that
# writes the two tables again.
"verity/hardware/lean.py" = ["verity/hardware/cards", "verity/hardware/cards/*"]

