# The Python names that say rho for the slowdown: what `tools/move/rename.py --map tools/move/slowdown_python_map.toml`
# renames, on a tree `slowdown_calculator_names_map.toml` and `slowdown_prose_map.toml` have run on. They rename no
# path, module or Lean declaration, so the change they make is an ordinary one, reviewed as such; the suites that import
# the calculator are its evidence.
# - In the calculator (`verity/protocols/inference_only/slowdown/`): the class `Overhead` is `Slowdown` and its
#   number `Overhead.rho` is `Slowdown.value`; `theorem.overhead`, which returns one, is `theorem.slowdown`; an
#   estimate's field holding one, `Estimate.overhead`, is `Estimate.parts`, since the number has the name:
#   `Estimate.rho`, `Corner.rho` and `Point.rho` are `.slowdown`, as `min_cut.Bound.slowdown` already is;
#   `rho_worst` and `rho_best` are `slowdown_worst` and `slowdown_best`; and a local or a test's name that says rho
#   says slowdown.
# - Beside it, the names that hold the calculator's path or data: `RHO`, `RHO_HARDWARE` and `RHO_MODEL` are
#   `SLOWDOWN`, `SLOWDOWN_HARDWARE` and `SLOWDOWN_MODEL`; `rho_models`, `rho_shapes` and `rho_periods` are
#   `slowdown_models`, `slowdown_shapes` and `slowdown_periods`; a local that held its directory, its registry or its
#   shapes is named for what it holds.
# Each row is under a [[words_in]] that names its files: `rho` is another quantity's name in most of the tree.
# What stays: "overhead" where it is prose or another quantity (a family's κ overhead, a regime's proving overhead, a
# figure's per-block `overhead`, the `overheads` figure); `multiple` and `multiple_bound`; the stored keys (the
# board's `"rho"`, the circuit properties' `out["rho"]`: [keep]); SPOT's risk `level.rho(1)`, which the calculator's
# `tests/test_held_to_core.py` holds to core ([keep_in]); the symbol ρ; and the harness under
# `benchmarks/training_slowdown/`, whose two quantities get a map of their own.

[words]

# --- the calculator

# a `Slowdown`'s number is its `value`
[[words_in]]
files = ["verity/protocols/inference_only/slowdown/slowdown/theorem.py", "verity/protocols/inference_only/slowdown/tests/test_theorem.py", "verity/protocols/inference_only/slowdown/tests/test_envelopes.py"]
words = { "`rho` (the hardware multiple" = "`value` (the hardware multiple", ".rho" = ".value", "def rho" = "def value", "overhead(" = "slowdown(" }

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/tests/test_theorem.py"]
words = { "overhead," = "slowdown," }

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/tests/test_envelopes.py"]
words = { "multiple_bound, overhead" = "multiple_bound, slowdown" }

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/run.py"]
words = { "s.rho" = "s.value" }

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/slowdown/scenario.py"]
words = { "self.overhead.rho" = "self.parts.value", "overhead: Overhead" = "parts: Slowdown", "least, overhead" = "least, slowdown", "overhead(" = "slowdown(" }

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/README.md"]
words = { "overhead(" = "slowdown(" }

# an estimate's `Slowdown` is its `parts`
[[words_in]]
files = ["verity/protocols/inference_only/slowdown/slowdown/scenario.py", "verity/protocols/inference_only/slowdown/slowdown/analysis.py", "verity/protocols/inference_only/slowdown/run.py", "verity/protocols/inference_only/slowdown/periods.py", "verity/protocols/inference_only/slowdown/tests/test_analysis.py",
         "verity/protocols/inference_only/slowdown/tests/test_scenario.py", "verity/protocols/inference_only/slowdown/tests/test_circuits.py"]
words = { ".overhead" = ".parts" }

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/tests/test_attacks.py"]
words = { "p.rho" = "p.slowdown" }

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/**"]
words = { "Overhead.rho" = "Slowdown.value", "Overhead" = "Slowdown", "theorem.overhead" = "theorem.slowdown", "rho_worst" = "slowdown_worst", "rho_best" = "slowdown_best", "rhos" = "slowdowns", "test_attribution_splits_the_adversary_s_rate_and_each_ceiling_caps_rho" = "test_attribution_splits_the_adversary_s_rate_and_each_ceiling_caps_the_slowdown", "test_pouw_as_deployed_on_the_h200_certifies_so_little_that_rho_stays_near_one" = "test_pouw_as_deployed_on_the_h200_certifies_so_little_that_the_slowdown_stays_near_one", "test_rho_and_the_time_to_the_target_do_not_depend_on_gates_per_flop" = "test_the_slowdown_and_the_time_to_the_target_do_not_depend_on_gates_per_flop", "rho" = "slowdown" }

# --- beside it: the names that hold the calculator's path or data

[[words_in]]
files = ["benchmarks/circuit_properties/circuit_properties/references.py"]
words = { "rho_models" = "slowdown_models", "rho" = "calculator" }

[[words_in]]
files = ["benchmarks/circuit_properties/run.py", "benchmarks/circuit_properties/pyproject.toml"]
words = { "rho_shapes" = "slowdown_shapes", "rho" = "shapes" }

[[words_in]]
files = ["benchmarks/circuit_properties/tests/test_references.py"]
words = { "rho_models" = "slowdown_models", "rho_shapes" = "slowdown_shapes", "test_reading_rho_shadows_no_module_of_this_benchmark" = "test_reading_the_slowdown_calculator_shadows_no_module_of_this_benchmark", "rho" = "shapes" }

[[words_in]]
files = ["benchmarks/inference_only/policy.py"]
words = { "RHO" = "SLOWDOWN", "rho_periods" = "slowdown_periods" }

[[words_in]]
files = ["benchmarks/network_traces/leak_bounds.py", "benchmarks/network_traces/tests/test_certifier_term.py",
         "benchmarks/network_traces/tests/test_leak_bounds.py"]
words = { "RHO_HARDWARE" = "SLOWDOWN_HARDWARE", "RHO" = "SLOWDOWN" }

[[words_in]]
files = ["benchmarks/spot_figures/figure1.py"]
words = { "RHO_HARDWARE" = "SLOWDOWN_HARDWARE", "RHO_MODEL" = "SLOWDOWN_MODEL", "RHO" = "SLOWDOWN", "from_rho" = "from_registry", "rho" = "registry" }

[[words_in]]
files = ["verity/protocols/inference_only/nci/bracket.py"]
words = { "rho = Gamma" = "slowdown = Gamma", "or rho <" = "or slowdown <", '"rho": rho' = '"rho": slowdown' }

[[words_in]]
files = ["verity/protocols/inference_only/nci/tests/test_kappa.py"]
words = { "test_every_shape_is_rhos" = "test_every_shape_is_the_slowdown_calculators", "test_the_library_models_rho_also_has_are_its_sizes" = "test_the_library_models_the_slowdown_calculator_also_has_are_its_sizes", "rhos" = "theirs" }

[[words_in]]
files = ["tests/test_retired_terms.py"]
words = { "test_the_scan_reads_rho_terms" = "test_the_scan_reads_the_slowdown_calculators_terms", "faulty outputs outside rho" = "faulty outputs outside the calculator" }

[rewrite]
# Never rewritten: the earlier moves and their maps, the archive, lock files, and the cards a digest names.
exclude = ["tools/move/**", "archive/**", "uv.lock", "**/*.lock", "benchmarks/spot_figures/cards/**"]

[keep]
# stored keys, renamed with their schema: the circuit properties' output, the board's `search()`, and the board's key
# where the calculator's README quotes it
patterns = ['out\["rho"\]', 'search\(\*case\)\["rho"\]']
strings = ["the board's `\"rho\"`"]

[keep_in]
# SPOT's risk ρ(m), the integrity profile's
"verity/protocols/inference_only/slowdown/tests/test_held_to_core.py" = ["rho"]
