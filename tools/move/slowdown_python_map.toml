# --- the training harness: the record's slowdown. A key stays (`slowdown_harness_map.toml`'s header): where a block
# has the bare word, the key in its quotes or backticks is a row to itself, which stands before the bare word and keeps
# it. The printed phrases stand before the bare word too.

# the grade and its block: the row heads are `S = p x slowdown` and `record's slowdown`
[[words_in]]
files = ["benchmarks/training_slowdown/training_slowdown/grade.py",
         "benchmarks/training_slowdown/tests/test_grade.py"]
[words_in.words]
"\"rho\"" = "\"rho\""
"'rho'" = "'rho'"
"`rho`" = "`rho`"
"BOUND_IS_RHO" = "BOUND_IS_SLOWDOWN"
"rho's products term is this bound" = "the products term of the record's slowdown is this bound"
"rho is it" = "the record's slowdown is it"
"beside rho and never in it" = "beside the record's slowdown and never in it"
"'rho is unmeasured'" = "'the slowdown of the record is unmeasured'"
"rho is unmeasured" = "the record's slowdown is unmeasured"
"add(\"rho\"," = "add(\"record's slowdown\","
"rho: {" = "the record's slowdown: {"
"S = p x rho" = "S = p x slowdown"
"x rho {" = "x the record's slowdown {"
"(|C| x rho)" = "(|C| x the record's slowdown)"
"rho" = "slowdown"

