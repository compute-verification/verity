[[words_in]]
files = ["verity/protocols/inference_only/slowdown/**"]
words = { "Overhead.rho" = "Slowdown.value", "Overhead" = "Slowdown", "theorem.overhead" = "theorem.slowdown", "rho_worst" = "slowdown_worst", "rho_best" = "slowdown_best", "rhos" = "slowdowns", "test_attribution_splits_the_adversary_s_rate_and_each_ceiling_caps_rho" = "test_attribution_splits_the_adversary_s_rate_and_each_ceiling_caps_the_slowdown", "test_pouw_as_deployed_on_the_h200_certifies_so_little_that_rho_stays_near_one" = "test_pouw_as_deployed_on_the_h200_certifies_so_little_that_the_slowdown_stays_near_one", "test_rho_and_the_time_to_the_target_do_not_depend_on_gates_per_flop" = "test_the_slowdown_and_the_time_to_the_target_do_not_depend_on_gates_per_flop", "rho" = "slowdown" }

