"test_rho_is_the_bound_of_record_where_products_bind" = "test_the_records_slowdown_is_the_bound_of_record_where_products_bind"
"test_the_bound_of_record_is_the_calculators_and_rho_follows_it" = "test_the_bound_of_record_is_the_calculators_and_the_records_slowdown_follows_it"

