# - `CommOfPeriodLeakAccepted`: tests/lint/allowlists/repo_retired_terms.json, tools/verity/lean/tests/fixtures/merge/accounting-retired-import-onto-next.json
# - `IntegrityOfIntegrityPeriod`: tests/lint/allowlists/repo_retired_terms.json
# - `RateAudit/Session`: tests/lint/allowlists/repo_retired_terms.json
# - `RateAuditWindows`: verity/core/protocols/bandwidth/openings.py
# - `RateSessionSample`: verity/core/protocols/remote_bandwidth/audit.py, verity/core/protocols/remote_bandwidth/tests/test_remote_bandwidth.py
# - `RegisteredCircuit/Session`: tests/lint/allowlists/repo_retired_terms.json
# - `SketchBoundSession`: verity/core/protocols/remote_bandwidth/p2.py
# - `WindowsAt`: benchmarks/rho/rho/envelopes.py
# - `WorkOfH1CheckedCreditPeriod`: Security/Properties/lakefile.toml, tests/lint/allowlists/repo_retired_terms.json, tools/verity/lean/tests/fixtures/merge/accounting-retired-import-onto-next.json, tools/verity/lean/tests/test_merge.py
# Held, not renamed by this move:
# - `period`, `sessions`: bare lowercase words that prose shares; they wait for the build's references
# - `session`, `window`, `windows`: two senses each, in shared files
# - `Rate.DeployedSession` (to `Rate.DeployedRun`): `RateAudit.DeployedRun` is a module whose name its readers
#   import, and `move_check.py` certifies no rename to a name the base already spells; it waits for a reviewed
#   rename or another name
