# The period family in the Glossary's words in lean's areas (Security/{Definitions,Proofs}/{Core,Hash,Accounting} and
# Security/{Properties,Proofs/Properties}/Accounting): the entries of NET-118's draft map (network-accounting's, at
# eb226fa15d) that rename a declaration or module declared there, as `tools/move/rename.py --map
# tools/move/period_map.toml` renames them in one move; `period_map_2.toml` is its second stage. The draft's other entries
# rename what other areas declare and are theirs to move. Each renamed declaration keeps the rest of its name; the word
# becomes the Glossary's for what it denotes:
# - "window" for an execution phase (PoUW's, PoUB's, the network certifier's link-window) -> "execution phase"
#   (`ExecutionPhase`, `executionPhase`); for SPOT's served span with its audit -> "run"; for a span of ticks -> "period"
#   (its one definition is Core's `Verity.TickSpan`); for a location's gates over a cut of ticks (the dampener's, the
#   actual circuit's `Windows`/`WindowsAt`) -> "server block". A numeric, bit, index or concurrency window keeps the word.
# - "period" for the stretch a bound is about -> "monitoring period"; a certification period (`NetworkCheck.Period`,
#   LMS's and the period records'), a joint audit's period and Dither's noise period keep it.
# - "session" for PoUB's run over its execution phases and the memory challenger's -> "run"; for the live challenger's
#   gate session -> "challenge phase"; for a certifier's 32-byte id -> "attachment"; for Nci's prompt-sized blocks ->
#   "inference block". Flock's session (its own and the ZK server's) waits for a Glossary ruling and is not here.
# - "run" is already the Glossary's word wherever it means a run; its other senses (a contiguous range, a result,
#   `Compiler.run`) keep it.
# Format constants (`WINDOW_*`, `*_SESSION`, the `Domains` tags) and the code's record fields keep the word until a
# format version. Duplicates are merged by a refactor, not by this move: `Accounting.Window` becomes a use of
# `Verity.TickSpan`, `NetTiming.WindowCharge`'s `Window` and `Carry` uses of `NetworkCertifier.WindowCharge`'s, and
# `Verity.Sampled.Device.RunSetup` a use of `Properties.Challenger.Run`; `Accounting.Compose.PeriodRun` is deleted.
# Declarations keep their place in the locks' records: `rename.py --moves` prints the renames `check.py --update
# --moved` takes.

