# files and the one whose prose names it. A file the move renames is named by a pattern that matches it before
# and after the move (`Windows.lean`, `ServerBlocks.lean`), so the move runs again on its own commit.
files = [
    "Security/Definitions/Accounting/Guarantees/Actual.lean",
    "Security/Definitions/Accounting/Guarantees/Actual/Threaded.lean",
    "Security/Proofs/Accounting/Actual/[WS][ie][nr][dv]*.lean",
]
