  '''(?<=\.)(?<![^\w.]a\.)(?<![^\w.]I\.)(?<![^\w.]T\.)laws?\b''',
  '''(?<=\n    )law(?=: Mapping\[str, Any\]\n)''',
  '''(?<=registration=R\.digest\(rec\), )law(?==)''',
  '''(?<=d\.update\()law(?==)''',
  '''(?<=draw=result\["draw"\], )law(?==)''',
  '''(?<=replace\(w, )law(?==)''',
