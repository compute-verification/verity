# The retired word family LAW leaves the proof system's Python, Rust and shell: the sampling design (GLOSSARY.md).
# A name renames by its language's case (`law` -> `sampling_design`, `Law` -> `SamplingDesign`, `LAW` ->
# `SAMPLING_DESIGN`; `draw_law` -> `draw_design`), our flags `--law` and `--draw-law` to `--sampling-design` and
# `--draw-design`, the environment name `FLOCK_DRAW_LAW` to `FLOCK_DRAW_DESIGN`. Kept: every string literal holding the
# word (record keys such as "law", refusal codes such as R1-law, recorded case names, the messages the difftests compare
# with the Lean's kept literals), every attribute named `law` (other lanes' `Binding`, `Window`, `Component` and `Plan`
# carry one, and ours, `Draw.law`, is read outside), the keywords that write a "law" key or set another lane's field, the
# adapter's `served_tp --law`, `V3C_LAW` (the onsite demo sets it) and the square-root law. Outside our paths only the
# names other lanes import from us rename.

[words]

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md"]

