# The charge circuits into the interface: what `tools/move/layout.py --map tools/move/network_charge_map.toml` moves
# and rewrites. `arith_encode`, `charge_chain` and `window_charge` (their Definitions, references and book fields, with
# their circuit-check sidecars and pins) import only `verity/circuits` and `verity/commitments`; the carry rows'
# commitment they no longer hold is `verity_vllm.compiler.charge_rows`. Nothing is split, edited or deleted, and no
# file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }

[paths]
"verity/protocols/resource_accounting/network/verifier/arith_encode.py" = "verity/protocols/interface/charge/arith_encode.py"
"verity/protocols/resource_accounting/network/verifier/arith_encode.circuit-check.py" = "verity/protocols/interface/charge/arith_encode.circuit-check.py"
"verity/protocols/resource_accounting/network/verifier/arith_encode.circuit-check.json" = "verity/protocols/interface/charge/arith_encode.circuit-check.json"
"verity/protocols/resource_accounting/network/verifier/charge_chain.py" = "verity/protocols/interface/charge/charge_chain.py"
"verity/protocols/resource_accounting/network/verifier/charge_chain.circuit-check.py" = "verity/protocols/interface/charge/charge_chain.circuit-check.py"
"verity/protocols/resource_accounting/network/verifier/charge_chain.circuit-check.json" = "verity/protocols/interface/charge/charge_chain.circuit-check.json"
"verity/protocols/resource_accounting/network/prover/window_charge.py" = "verity/protocols/interface/charge/window_charge.py"
"verity/protocols/resource_accounting/network/prover/window_charge.circuit-check.py" = "verity/protocols/interface/charge/window_charge.circuit-check.py"
"verity/protocols/resource_accounting/network/prover/window_charge.circuit-check.json" = "verity/protocols/interface/charge/window_charge.circuit-check.json"

[retired]
paths = ["verity/protocols/resource_accounting/network/verifier/arith_encode.py", "verity/protocols/resource_accounting/network/verifier/arith_encode.circuit-check.py", "verity/protocols/resource_accounting/network/verifier/arith_encode.circuit-check.json", "verity/protocols/resource_accounting/network/verifier/charge_chain.py", "verity/protocols/resource_accounting/network/verifier/charge_chain.circuit-check.py", "verity/protocols/resource_accounting/network/verifier/charge_chain.circuit-check.json", "verity/protocols/resource_accounting/network/prover/window_charge.py", "verity/protocols/resource_accounting/network/prover/window_charge.circuit-check.py", "verity/protocols/resource_accounting/network/prover/window_charge.circuit-check.json"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), files
# whose bytes a digest pins, the archive, `move_check.py` and its test, and `tests/tree.toml`, the layout of record.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**", "archive/**",
           "tools/check/tests/test_move_check.py", "tools/check/move_check.py",
           "tools/research/src/research/store/moves.json", "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
"verity.protocols.resource_accounting.network.verifier.arith_encode" = "verity.protocols.interface.charge.arith_encode"
"verity.protocols.resource_accounting.network.verifier.charge_chain" = "verity.protocols.interface.charge.charge_chain"
"verity.protocols.resource_accounting.network.prover.window_charge" = "verity.protocols.interface.charge.window_charge"
