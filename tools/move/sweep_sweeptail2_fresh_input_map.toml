# "unregistered input" in two comments (GLOSSARY.md Older names: "unregistered input", "unregistered input bits" are fresh
# input, fresh input bits): what `tools/move/rename.py --map tools/move/sweep_sweeptail2_fresh_input_map.toml` renames. Each
# is one phrase in one file (`fresh_input_prose_map.toml` renames the "novel" words; these two spell the other older name).

scope = "prose"

[words]

[[words_in]]
files = ["benchmarks/one_stage/onsite_record.py"]
[words_in.words]
"audits' unregistered inputs, read off" = "audits' fresh input, read off"

[[words_in]]
files = ["benchmarks/one_stage/tests/test_served_cases.py"]
[words_in.words]
"unregistered input, an evidence key" = "fresh input, an evidence key"

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "tools/research/tests/test_slack.py", "tools/check/tests/test_move_check.py", ".agents/skills/friction/SKILL.md"]
