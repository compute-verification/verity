# The references to the slowdown calculator's directory that its move's tool doesn't follow: what `tools/move/rename.py
# --map tools/move/slowdown_calculator_refs_map.toml` renames, on the tree `slowdown_calculator_map.toml`'s move made.
# `layout.py` follows a path from the repository's root and a join from `Path(__file__)`; these two name the directory
# from another directory, and the tree doesn't pass the check until they follow it:
# - `protocols/inference_only/rho`, the directory from `verity/`, among the trees with an import root of their own in
#   `tests/test_boundaries.py` (`SEPARATE`): left as it is, the calculator's files belong to no unit;
# - `inference_only/rho/`, as `AGENTS.md` writes the directory from `verity/protocols/`.
# So this map runs right after that one and the two commits are one pull request (`tools/move/README.md`: a move that
# needs both stages two maps). Its commit alone moves nothing, so `move_check.py` certifies the two as one range,
# `verity check move BASE HEAD` from the commit before the calculator's move, and `stage.py`, which certifies each
# commit alone, stages the calculator's move and not this one:
#
#     python3 tools/move/rename.py --map tools/move/slowdown_calculator_refs_map.toml
#     git commit -a -m "Move by tools/move/slowdown_calculator_refs_map.toml" \
#         -m "Move: tools/move/slowdown_calculator_refs_map.toml"
#
# Each row is under a [[words_in]] that names its one file. The names and prose that say rho for the slowdown are the
# next maps' (`slowdown_prose_map.toml`, `slowdown_calculator_names_map.toml`, `slowdown_python_map.toml`).

[words]

[[words_in]]
files = ["tests/test_boundaries.py"]
words = { "protocols/inference_only/rho" = "protocols/inference_only/slowdown" }

[[words_in]]
files = ["AGENTS.md"]
words = { "inference_only/rho/" = "inference_only/slowdown/" }

[rewrite]
# Never rewritten: the earlier moves and their maps, and lock files.
exclude = ["tools/move/**", "uv.lock", "**/*.lock"]

[keep]
patterns = []
strings = []
