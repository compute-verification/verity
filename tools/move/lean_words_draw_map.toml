# The retired word "draw" in the Lean's names, in the Glossary's words: what `tools/move/rename.py --map
# tools/move/lean_words_draw_map.toml` renames. GLOSSARY.md: "draw", "drawn proof block", "drawn unit", "sampled unit"
# -> the sample, a sampled proof block; to sample, and coins are flipped. It runs after `lean_names_map.toml` and
# `lean_words_firewall_map.toml` in the chain, so its olds are spelled as those maps leave them. A name that holds the
# word and more is renamed by word ([words]), or in the files that spell it where its new name stands elsewhere
# ([[words_in]]); the word alone (`draw`, `Draw`, `drawn`, `draws`) only in the `.lean` files that spell it and not its
# new word, as a whole word. A draw of coins is a flip (`drawCoins` -> `flipCoins`); a name an earlier move already gave
# keeps it (`DrawnUnit` -> `SampledBlock`). Record keys, reason codes, domain tags and other one-token string literals
# keep their bytes ([keep]). Declarations keep their place in the locks' records: `rename.py --moves` prints the renames
# that `check.py --update --moved` takes.
# Left by this map: the bare word in the files that spell its new word (in a commit of their own, by hand, with a
# build); prose outside the Lean (a prose map's).

