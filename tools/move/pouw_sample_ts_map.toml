# The retired word DRAW in the names of PoUW's two TS modules: what `tools/move/rename.py --map
# tools/move/pouw_sample_ts_map.toml` renames. GLOSSARY.md's term is the sample, spelled as proofs' map spells its own
# (`Drawn` to `Sampled`):
# - `Definitions.Pouw.TS.Drawn` (`security/Definitions/Pouw/TS/Drawn.lean`, the sampled layer's definitions) to
#   `Definitions.Pouw.TS.Sampled`;
# - `Proofs.Pouw.TS.Drawn` (`security/Proofs/Pouw/TS/Drawn.lean`, their proofs) to `Proofs.Pouw.TS.Sampled`;
# - the module's short name `` `Drawn` `` in `Pouw/TS/Hashed.lean`'s prose.
# Each word is the whole dotted module name or its path, so the files move with every import, lakefile module list and
# lint allowlist entry that names them. Their namespaces (`Accounting.TS`, `Accounting.SecurityProofs.TS`, with
# `Plurality` and `SampledLayer`) don't hold the word, so no declaration's name changes.
#
# What stays:
# - every name the modules declare that a lock records: not this map's, for after the close;
# - in a `lean-audit.json`, the `reads` records keyed by the modules' names, which `tools/verity/lean/check.py --update`
#   re-keys (they still read `Definitions.Accounting.TS.Drawn`, the name before `accounting_split_pouw_map.toml`);
# - Flock's `Drawn` (`Proofs.Flock.SpotFlock.Drawn`, `Layout.Drawn`, the recursion's coin predicate) and every other
#   `Drawn` of the tree;
# - records of what was: the move tool's maps and tests, research's `moves.json`, GLOSSARY.md.

[words]

[[words_in]]
files = ["*"]

[words_in.words]
"Pouw.TS.Drawn" = "Pouw.TS.Sampled"
"Pouw/TS/Drawn" = "Pouw/TS/Sampled"

[[words_in]]
files = ["security/Definitions/Pouw/TS/Hashed.lean"]

[words_in.words]
"`Drawn`" = "`Sampled`"

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "GLOSSARY.md", "fixtures/**", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']
strings = []
