# The layout move's tools (`restack.py`) and their tests. Not a package: the scripts are stdlib and git, run as files, and their
# tests run as a suite (`uv run tools/check/suites.py tools/move`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
