# The generated moves (`layout.py`, `lean.py`, `rename.py`), `restack.py`, and their tests. Not a package: the scripts are
# stdlib and git, run as files, and their tests run as a suite (`uv run tools/verity/check/suites.py tools/move`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_layout.py", "tests/test_lean.py", "tests/test_rename.py", "tests/test_restack.py"]
# `lean.py` writes the merged locks with the Lean check's own `text` (tools/verity/lean/check.py), which tests/test_lean.py imports.
inputs = ["tools/verity/lean"]
