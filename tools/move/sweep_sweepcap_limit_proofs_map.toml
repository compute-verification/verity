# The plainer word for "cap" in proofs's prose: what `tools/move/rename.py --map tools/move/sweep_sweepcap_limit_proofs_map.toml`
# renames, "cap" where a comment, a docstring or Markdown's text says a limit or a bound that is not Pearl's (GLOSSARY.md,
# Cap: Pearl's cap is its inert-work bound, and the word keeps its other senses where the Glossary says so).
#
# Prose only (`scope = "prose"`), and only in the files listed, whose every "cap" is of one sense: a request's or a compiler's
# length limit, a tooling limit, a session's or a chunk's, which this lane's prose says "limit" for, and a slowdown's or a
# stacking gate's, which it says "bound" for. SPOT's served cap, the certifier's response cap, a soft cap and Flock's Merkle cap
# keep the word ([keep]); the names (`max_tokens_cap`, `HIT_CAP`, `rekey_cap`) are not prose and stay. The other way to clear
# these sites is `OWN_CAPS` in the retired-terms lint; the note says which suits each file.

scope = "prose"

[words]

[[words_in]]
files = [
    "benchmarks/one_stage/a5.py",
    "benchmarks/one_stage/a6.py",
    "benchmarks/one_stage/a7.py",
    "benchmarks/one_stage/advice_charge.py",
    "benchmarks/one_stage/m1_unit.py",
    "benchmarks/one_stage/onsite_record.py",
    "benchmarks/one_stage/tests/test_inference_only.py",
    "benchmarks/one_stage/tests/test_onsite_record.py",
    "benchmarks/proof_throughput/README.md",
    "benchmarks/proof_throughput/verity_proof_throughput/cli.py",
    "benchmarks/proof_throughput/verity_proof_throughput/workloads.py",
    "benchmarks/replay_ladder/README.md",
    "benchmarks/replay_ladder/ladder.py",
    "benchmarks/replay_ladder/prod_plan.py",
    "benchmarks/serve_tax/tp_restore.sh",
    "benchmarks/spot_figures/README.md",
    "benchmarks/spot_figures/binding.py",
    "benchmarks/spot_figures/cards.py",
    "benchmarks/spot_figures/figure1.py",
    "benchmarks/spot_figures/tests/test_cards.py",
    "benchmarks/spot_figures/tests/test_figure1.py",
    "benchmarks/spot_figures/tests/test_total_cost.py",
    "benchmarks/spot_figures/total_cost.py",
    "benchmarks/verifier_cost/flock_rows.sh",
    "benchmarks/verifier_cost/inference_only_glm.py",
    "benchmarks/verifier_cost/ledger_replay/ledger_replay.sh",
    "benchmarks/verifier_cost/registration.sh",
    "verity/commitments/frame_v3/vectors_sha512.py",
    "verity/protocols/accounting/registration/README.md",
    "verity/protocols/compose/device/live_challenger/serve.py",
    "verity/protocols/compose/device/live_challenger/tests/stub_serve.py",
    "verity/protocols/compose/device/live_challenger/tests/test_auditor_load.py",
    "verity/protocols/compose/device/live_challenger/tests/test_auditor_periods.py",
    "verity/protocols/compose/device/live_challenger/tests/test_serve.py",
    "verity/protocols/experimental/dither/PROTOCOL.md",
]

[words_in.words]
"a cap" = "a limit"
"A cap" = "A limit"
"caps" = "limits"
"Caps" = "Limits"
"cap" = "limit"
"Cap" = "Limit"

[[words_in]]
files = [
    "benchmarks/spot_figures/breakeven/levers.py",
    "benchmarks/spot_figures/breakeven/sweep.py",
]

[words_in.words]
"a cap" = "a bound"
"A cap" = "A bound"
"caps" = "bounds"
"Caps" = "Bounds"
"cap" = "bound"
"Cap" = "Bound"

[keep]
patterns = [
    '''(?i:served[ -]cap|response[ -]cap|soft[ -]cap|merkle[ -]cap|capability|cap ℓ|max_tokens cap)''',
    '''(?<![\w])cap-\w|\w-cap(?![\w])''',
]

[rewrite]
