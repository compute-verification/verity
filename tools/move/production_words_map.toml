[keep]
# a fixture an `art:` id names, a run's recorded result paths, the recorder module a profile id's method names,
# ARCHITECTURE.md's sentence that says the word is not used, the text the profile id and the artifact identity hash, and
# serve_tax's sampling mode and metric key, which its runs' records hold
strings = ["fp8_production_row_l0_qkv.npz", "production/workload_exercised.json", "production.py", 'called "production"',
           "none (production uninstrumented", "kernel of the production artifact", "pause_production_s", '"production"',
           "``production``", "--sampling production", "SAMPLING=production", "SAMPLING:-production",
           "or one of the corpus's, or production"]
patterns = ["\\d{8}T\\d{4}Z/production\\b"]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the archive), files whose bytes a
# digest pins (`rename.py` repins a `TRUSTED.sha256` line itself), lock files, the Glossary's row and the lint's lists
# of the word, and infra's service, whose "production" is its Vercel deployment.
# The kernel Definitions' registry too: `registry_version` hashes `prims` and `b1` whole, and its `conformance` texts are
# copied into recorded tables; with it, the adapter's test that quotes `prims`'s sentence.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock", "GLOSSARY.md", "tests/test_retired_terms.py",
           "tests/lint/test_repo_retired_terms.py",
           "**/definitions/registry/**", "**/program/test_lifted_tiny.py", "infra/slack-events/**"]
