# "production", the retired word (GLOSSARY.md: serving, or proving, by sense; the Rust and CUDA prover), as
# `tools/move/rename.py --map tools/move/production_words_map.toml` renames it on `architecture`. The word has two
# retired senses and several others, so no table renames it everywhere:
# - serving, in the files where "production" is the live inference path (vLLM's adapter, the kernels' CPU models and the
#   Definitions held to them, the circuits' targets, serve_tax, route_capture and the other serving benchmarks):
#   "production" is "serving" there, with "served like production" and "the production server" said as serving says them,
#   the difftest adapters' function `production` (what an adapter runs as serving runs it) is `serving`, and the test
#   names and the test module `test_production_vectors.py` that spell it follow, under the names the adapter's own
#   renames chose where they chose one (`test_sizes_past_class_g_refuse_by_name`,
#   `test_quant_linear_fp8_on_a_served_row`);
# - proving, in Flock's Lean proofs: "the production program", "the production statements" and "the production
#   configuration" are the proving ones, and "production `--zk`" is "the prover's `--zk`"; the prover's own build in
#   `flock-circuit.rs`;
# - neither: the LMS binding a deployment uses is "the deployed binding" (`lms.circuit-check.py`).
# It leaves every other sense: a word's or a value's production (Accounting's Lean, `requirement_units.py`, a7's
# production step, the claims), the certifier's frame production rate, a plane's production in the replay population,
# a "production module" that is not a test's (the dead-code census), and infra's Vercel production deployment
# (`infra/slack-events/`). It leaves the bytes a hash or a stored record takes in: the engine profile's `interception`
# (in the profile id), the target profile's `program_derivation` (in the artifact identity), serve_tax's sampling mode
# `production` (in each run's meta and request bodies) and its metric key `pause_production_s`. It leaves records: the fixture `fp8_production_row_l0_qkv.npz` an `art:` id names, a run's
# recorded result paths, the recorder module `production.py` that a profile id's method names, data files (fixtures,
# profiles, the census's and NCI's parameters), the goal id `vllm/production-vllm-reproducible`, the lint's own lists
# and the Glossary's row.

