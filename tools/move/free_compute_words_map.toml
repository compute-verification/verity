# The older names of free compute, U, and of its registered parts (GLOSSARY.md's retired-terms row: "uncertified
# capacity", "uncertified gates", "undeclared compute", "skippable work", "residual compute", "monitored residual" become
# free compute, U, whose registered part is ε_undecl + ε_skip): what `tools/move/rename.py --map
# tools/move/free_compute_words_map.toml` renames. Two of them stand in the tree:
# - "skippable work", in prose only, every site of it ε_skip's part, work the proofs could miss: a labelled program's `ns`
#   (work Verify neither checks nor needs, PoUW's TS and headline programs), the work SPOT's late cone bounds, and
#   Corollary D3's term. It becomes "ε_skip work" ("ε_skip's skippable work", "ε_skip's work"). The headline Lean
#   that `lean_headline.py` and `lean_headline_dc.py` write is excluded: its writers, which say "free compute",
#   rewrite it. The bare word "skippable" (`ε_skip = skippable / (honest - skippable)`, a component's skippable
#   share) is not this family and stays;
# - `Accounting.uncertifiedCapacity` (`Registration/Physical.lean`) and its lemmas `uncertifiedCapacity_eq`,
#   `uncertifiedCapacity_union_le` and `uncertifiedCapacity_le_sum` (`Proofs/Accounting/Actual`): β°_X, the capacity in
#   bits a tick of the uncertified links across a location's boundary. It is a link bandwidth, not free compute, so it
#   takes the name of what it is beside `linkCapacity` (β_X): `uncertifiedLinkCapacity`. Declarations keep their place in
#   the locks' records: `rename.py --moves` prints the renames `check.py --update --moved` takes.
#
# Left, each another sense or a question:
# - "undeclared compute" in `benchmarks/datacenter/datacenter/account.py`'s `FLEET_CLOSED` (no such compute reachable
#   from a block): unregistered hardware, by its sense, mended by hand;
# - training's `UncertifiedCap` (`Slowdown.ServingBlocks`): training's own name;
# - the retired-terms table, the lints that name the words, the lock's records, every other map.

[words]
"ε_skip's skippable work" = "ε_skip's work"
"skippable work" = "ε_skip work"
"Skippable work" = "ε_skip work"
"uncertifiedCapacity" = "uncertifiedLinkCapacity"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps), files whose bytes a digest pins and lock
# files (a `lean-audit.json`'s records `rename.py` leaves itself); the retired-terms table and the lints that name the
# words; the network certifier's files until network-accounting's rename is in; the vLLM registry's files a manifest
# hashes; the headline Lean its writers generate.
exclude = ["tools/move/**", "*.patch", "**/TRUSTED.sha256", "**/*.sha256", "uv.lock", "**/*.lock",
           "GLOSSARY.md", "tests/test_retired_terms.py", "tests/lint/test_repo_retired_terms.py",
           "verity/protocols/accounting/certifier/**", "security/**/Certifier/**",
           "adapters/vllm/verity_vllm/definitions/registry/ref_prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/b1.py",
           "security/Definitions/Pouw/Headline/Sm120.lean", "security/Definitions/Pouw/Headline/Sm120Measured.lean",
           "security/Definitions/Pouw/HeadlineDc/Sm90.lean", "security/Definitions/Pouw/HeadlineDc/Sm90Measured.lean",
           "security/Definitions/Pouw/HeadlineDc/Sm100.lean", "security/Definitions/Pouw/HeadlineDc/Sm100Measured.lean"]
