# The flat files' move: what `tools/move/layout.py --map tools/move/flat_files_map.toml` moves and rewrites.
#
# What a party is, what two parties exchange messages over, the registered hardware, what a protocol declares and the
# configuration become five files directly under `verity/`, and what runs parties over channels becomes `verity/runtime/`.
# `verity/hardware/site/` holds nothing after it, and `verity/configuration/` nothing but `config/`.
#
# - `verity/configuration/deploy/`: `party.py` to `verity/party.py`, `manifest.py` to `verity/protocol.py`, `config.py`
#   to `verity/config.py`, and the rest to `verity/runtime/` (its suite: `pyproject.toml`, `tests/`). `runtime.py` is
#   `verity/runtime/runner.py`, what runs the parties (`run`), so no module reads `verity.runtime.runtime`; the package's
#   `__init__.py` keeps its docstring.
# - `verity/configuration/wire/`: `__init__.py` (frames, messages, schemas, refusals) to `verity/channel.py`, the
#   handshake to `verity/runtime/handshake.py`, and its test to `verity/tests/tests/test_channel.py`, the flat files'
#   suite. Its `pyproject.toml` goes ([drop]): the flat files' suite reads what it read.
# - `verity/hardware/site/`: `__init__.py` (the Site's types and their bytes) to `verity/device.py`, its suite's
#   `pyproject.toml` to `verity/tests/pyproject.toml` and its test to `verity/tests/tests/test_device.py`. The flat files'
#   suite is laid out as `verity/protocols/tests/` is: a `pyproject.toml` directly under `verity/` would be the nearest
#   project file above every workspace member under `verity/`, and uv would no longer find them in the workspace.
# - `verity/configuration/__init__.py` is deleted with the package once nothing else is left in it: after the map that
#   moves `verity/configuration/config/` to `tools/config/`.
# No Python class, Lean name or lock record changes. The format is `layout_map.toml`'s. `verity_config`'s root is where
# that map leaves it, `tools/config/verity_config`; this map moves nothing under it, so it runs before that map or after.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/configuration/deploy/party.py" = "verity/party.py"
"verity/configuration/deploy/manifest.py" = "verity/protocol.py"
"verity/configuration/deploy/config.py" = "verity/config.py"
"verity/configuration/deploy/runtime.py" = "verity/runtime/runner.py"
"verity/configuration/deploy/" = "verity/runtime/"
"verity/configuration/wire/__init__.py" = "verity/channel.py"
"verity/configuration/wire/handshake.py" = "verity/runtime/handshake.py"
"verity/configuration/wire/tests/test_wire.py" = "verity/tests/tests/test_channel.py"
"verity/hardware/site/__init__.py" = "verity/device.py"
"verity/hardware/site/pyproject.toml" = "verity/tests/pyproject.toml"
"verity/hardware/site/tests/test_site.py" = "verity/tests/tests/test_device.py"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row, so a file only a
# branch has under one gets a row in that branch's rows file
paths = ["verity/configuration/deploy/", "verity/configuration/wire/", "verity/hardware/site/"]

[drop]
# the wire's suite: its test runs in the flat files' suite, whose pyproject lists what this one did
paths = ["verity/configuration/wire/pyproject.toml"]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean",
           # a Lake file is in its package's audit key: its comment naming the Site's module is rewritten in Lean's run
           "verity/protocols/spot/verifier/lean/lakefile.toml",
           # the layout of record: a landed move leaves its lines as written, for top to delete
           "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[split]
# references to a directory this move splits that stay right: "old file: old directory" = why
"demos/lifecycle/README.md: verity/configuration/deploy" = "prose naming the deployment layer, which is the runtime: its parties run by `run`"
"tests/import_order.toml: verity/configuration/deploy" = "the deployment layer's place, named by its first path: the runtime keeps it, and the listing's own commit after the move adds the files that leave for verity/"
"tools/verity/check/drive.toml: verity/configuration/deploy" = "the low-risk exclusions list the files that leave for verity/ beside it"
"verity/configuration/deploy/README.md: verity/configuration/deploy" = "the runtime's README names its own suite, verity/runtime"
"verity/protocols/pous/device/README.md: verity/configuration/deploy" = "prose naming the party runtime the wipe's parties run on"

[modules]
# the renames [paths] implies (`layout.py --modules`)
"verity.configuration.deploy" = "verity.runtime"
"verity.configuration.deploy.config" = "verity.config"
"verity.configuration.deploy.manifest" = "verity.protocol"
"verity.configuration.deploy.party" = "verity.party"
"verity.configuration.deploy.runtime" = "verity.runtime.runner"
"verity.configuration.wire" = "verity.channel"
"verity.configuration.wire.handshake" = "verity.runtime.handshake"
"verity.configuration.wire.tests.test_wire" = "verity.tests.tests.test_channel"
"verity.hardware.site" = "verity.device"
"verity.hardware.site.tests.test_site" = "verity.tests.tests.test_device"
