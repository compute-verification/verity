# "flock-verify", the name of the Rust verifier's thread pool (GLOSSARY.md Older names: `flock-verify` is `verity verify proof`):
# what `tools/move/rename.py --map tools/move/sweep_sweeptail2_verity_verify_map.toml` renames in `session_verify.rs`: the pool's
# thread name, which no program reads. It leaves the verdict ids `verdict flock-verify/<id>` that the Lean SPOT verifier emits and its
# difftest compares.

[words]

[[words_in]]
files = ["verity/protocols/proofs/flock/prover/live/src/session_verify.rs"]
[words_in.words]
"\"flock-verify\".into()" = "\"verity-verify\".into()"

[keep]
strings = ["verdict flock-verify/"]

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "tools/research/tests/test_slack.py", "tools/check/tests/test_move_check.py", ".agents/skills/friction/SKILL.md"]
