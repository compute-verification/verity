[rewrite]
# Never rewritten: the layout of record (`tests/tree.toml`, whose not-yet lines are deleted once the move lands),
# records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the archive), files
# whose bytes a digest pins, and Lean sources. Kernel sources are rewritten, each only where it names a moved path.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean", "tests/tree.toml",
           # what stays beside the kernels it named as `HERE`, its own directory, which a rewrite would make the
           # kernel's: the move's hand commit names the kernel directory where one of them loads it
           "benchmarks/pouw/pearl_c_sm120/fixture.py", "benchmarks/pouw/pearl_c_sm90/fixture.py",
           "benchmarks/pouw/pearl_c_sm90/glm53_passes.py", "benchmarks/pouw/pearl_c_sm90/glm53_profile.py",
           "benchmarks/pouw/pearl_c_sm90/glm53_timing.py", "benchmarks/pouw/pearl_c_sm90/grouped_check.py",
           "benchmarks/pouw/pearl_c_sm90/overhead_arm.py", "benchmarks/pouw/tests/test_pearl_c_sm90_glm53.py",
           # paths between the three directories, which move together: `simt_twin.py`'s join of a sibling, and the
           # header `PD_HOST_EXTRA` names, which `pearl_c_sm120/hash_decode_host.cpp` includes from its own directory
           "benchmarks/pouw/pearl_c/simt_twin.py", "verity/protocols/accounting/pouw/prover/kernels/pearl_c/simt_twin.py",
           "benchmarks/pouw/pearl_c_sm90/hash_prefill_host.cpp",
           "verity/protocols/accounting/pouw/prover/kernels/pearl_c_sm90/hash_prefill_host.cpp"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json"]

