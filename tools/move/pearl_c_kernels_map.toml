# The Pearl-C kernels' move: what `tools/move/layout.py --map tools/move/pearl_c_kernels_map.toml` moves and rewrites.
#
# PoUW's Pearl-C kernel directories, `benchmarks/pouw/pearl_c/`, `pearl_c_sm120/` and `pearl_c_sm90/`, become PoUW's
# prover's `verity/protocols/accounting/pouw/prover/kernels/` under the same names, siblings as they were, since their
# includes cross and their names key schemes. Each moves whole but for what drives a benchmark, which stays in
# `benchmarks/pouw/` under its old directory (the rows whose old and new paths are the same):
# - `fixture.py`, the check's builder, which reads the verifier's tests' vectors, and `ship.sh`, which runs it;
# - `card.sh`, run from a ship;
# - `debit.py`, whose check imports a benchmark's module;
# - the files that drive vLLM or a model (`glm53*.py`, `grouped_check.py`, `llama32_1b.py`), the overhead arm
#   (`overhead_arm.py` and its record) and `h200.sh`, a run script.
# The harness's `ieee_pin.cu`, the source of the SASS gate's pinned builds, goes beside the pins (`sass_pins.json`);
# `ieee_pin.py` and its job scripts stay with the harness.
#
# Kernel sources are rewritten, each only where a relative `#include` crosses the move's edge: `pearl_c/`'s includes
# of the circuits' headers, at their new depth, and other benchmarks' kernels' includes of `pearl_c/sha512.cuh`. The
# includes between the three directories are unchanged. What stays and named its own directory as the kernel's is not
# rewritten ([rewrite] exclude); the move's hand commit names the kernel's new directory where one of them loads it.
# No file is split or deleted; `layout.py` writes the `__init__.py` of `kernels/` and of each moved directory, since
# Python files move below the package root. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

