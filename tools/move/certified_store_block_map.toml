# The retired words "certified block" (an inference block's older name) in PoUS's period witnesses (MEM-152's retired
# words), by `python3 tools/move/rename.py --map tools/move/certified_store_block_map.toml`: `certifiedBlock` is the
# certified store's first memory block, so it is `certifiedStoreBlock`, beside `certifiedStore` and `certifiedPublic`.
# Proof-only names of one file that no lock records.

[words]

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "GLOSSARY.md", "tests/lint/**",
           "tests/test_retired_terms.py", "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[[words_in]]
files = ["security/Proofs/Pous/PeriodWitnesses.lean"]

[words_in.words]
"certifiedBlock" = "certifiedStoreBlock"
"certifiedBlock_eq" = "certifiedStoreBlock_eq"
"certifiedBlock_size" = "certifiedStoreBlock_size"
"certifiedBlock_digest" = "certifiedStoreBlock_digest"
