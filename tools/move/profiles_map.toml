# The fold half of `engine/profiles/` up to `observe/fold/profiles/`: what
# `tools/move/layout.py --map tools/move/profiles_map.toml` moves and rewrites (`engine/profiles/`'s fold data).
#
# What moves is what builds a fold `Profile`: the derived-profile finder and `profile_for_case` (`__init__.py`),
# `generic.build_profile`, the architecture pattern libraries (`gen_*`) and the κ base module with its golden-corpus twin.
# Each imports `observe.fold` and nothing in `engine/` imports it, so above `engine` its `observe.fold` imports point down.
# The model facts stay in `engine/profiles/` (family facts, HF configs, devices, transport, cases, the data files), since
# `engine/` reads them (`served`, `int8_fused`, `engine_profile`) and they import nothing from `observe/`.
# Whole modules move; nothing is split, edited or deleted, and `engine/profiles/` gets a new `__init__.py` ([create]).
# The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }
