# SPOT's cost model is the sampling plans' calibration: it leaves `verity/protocols/proofs/spot/prover/cost/` for
# `calibration/sampling_plan/`, its three tests for that suite. `tools/move/layout.py --map tools/move/cost_model_map.toml`
# moves and rewrites; its README is merged into the plans' by hand, the moved modules are named bare as the plans' scripts
# are, and `benchmarks/pouw/budget_sampling.json`, a record of a past commit, keeps its path.

[roots]
old = { circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", datacenter = "benchmarks/datacenter/datacenter", research = "tools/research/src/research", slowdown = "benchmarks/slowdown/slowdown", verity = "verity", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_machine_model = "calibration/machine_model/verity_machine_model", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm" }
