# PoUB's and PoUS's provers and PoUS's reference verifier out of `benchmarks/`: what
# `tools/move/layout.py --map tools/move/memory_provers_map.toml` moves and rewrites. These are the files that code
# outside `benchmarks/` loads (the vLLM adapter by path, the PoUS Lean check's difftest and the live verifier's host by
# name or by path); the harness stays in `benchmarks/` and loads them from where they land.
#
# - PoUB's prover goes to `verity/protocols/poub/prover/`, each file under the harness directory it came from
#   (`remote_session/`, `word_codec/`, `codec_tensor/`), so the three stay siblings and `../codec_tensor/reader.cu` and
#   `HERE.parent / "word_codec"` keep their meaning. `paged.py`, kv.cu's launchers over torch, goes beside `kv.py` and
#   `kv_bench.py`, which it imports, and the vectors `kv_bench.py`'s gate holds a library to go with it. They are not
#   a package: each is still loaded by path or with its directory on `sys.path`, under its own name (`prover`,
#   `device`, `kv`, `paged`).
# - PoUS's prover goes to `verity/protocols/pous/prover/p2/`, an import root of its own: the store with its toy store,
#   the GPU library and its wrapper are the package `p2_store` there, and `p2_gpu/`'s decode stays its sibling. The
#   harness keeps the name `p2_v1` for what stays in `benchmarks/pous/p2_v1/`.
# - PoUS's reference verifier (`reference.py`, `wire.py`, and `vectors.py` with the vectors it writes) goes to
#   `verity/protocols/pous/verifier/p2_v1/`, a package of `verity` loaded by name, so one module holds the reference
#   wherever it is imported from.
# - The bandwidth session's registration over the P2 store goes to PoUB's verifier, beside `p2_party.py`, which reads it.
#
# The load sites name each moved file by its path from the root before the move, so the move rewrites them. Nothing is
# split, edited or deleted. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", p2_store = "verity/protocols/pous/prover/p2/p2_store" }

[paths]
"benchmarks/remote_session/prover.py" = "verity/protocols/poub/prover/remote_session/prover.py"
"benchmarks/remote_session/device.py" = "verity/protocols/poub/prover/remote_session/device.py"
"benchmarks/remote_session/session.cu" = "verity/protocols/poub/prover/remote_session/session.cu"
"benchmarks/word_codec/cuda_lib.py" = "verity/protocols/poub/prover/word_codec/cuda_lib.py"
"benchmarks/word_codec/kv.cu" = "verity/protocols/poub/prover/word_codec/kv.cu"
"benchmarks/word_codec/kv.py" = "verity/protocols/poub/prover/word_codec/kv.py"
"benchmarks/word_codec/kv_bench.py" = "verity/protocols/poub/prover/word_codec/kv_bench.py"
"benchmarks/word_codec/tests/kv_vectors.json" = "verity/protocols/poub/prover/word_codec/kv_vectors.json"
