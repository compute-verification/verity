"benchmarks/pous/p2_v1/.gitignore" = "verity/protocols/pous/prover/p2/p2_store/.gitignore"
"benchmarks/pous/p2_v1/store-toy/" = "verity/protocols/pous/prover/p2/p2_store/store-toy/"
"benchmarks/pous/p2_gpu/p2dec.cu" = "verity/protocols/pous/prover/p2/p2_gpu/p2dec.cu"
"benchmarks/pous/p2_gpu/CGBN.commit" = "verity/protocols/pous/prover/p2/p2_gpu/CGBN.commit"
"benchmarks/pous/p2_v1/reference.py" = "verity/protocols/pous/verifier/p2_v1/reference.py"
