"benchmarks/pous/p2_v1/vectors.py" = "verity/protocols/pous/verifier/p2_v1/vectors.py"
"benchmarks/pous/p2_v1/vectors.json" = "verity/protocols/pous/verifier/p2_v1/vectors.json"
"benchmarks/pous/p2_v1/audit-vectors.json" = "verity/protocols/pous/verifier/p2_v1/audit-vectors.json"
"benchmarks/pous/p2_v1/audit-negative-vectors.json" = "verity/protocols/pous/verifier/p2_v1/audit-negative-vectors.json"
"benchmarks/pous/p2_v1/bandwidth-mem69-v2.json" = "verity/protocols/poub/verifier/bandwidth-mem69-v2.json"

# The harness imports its package by the name it has with `benchmarks/pous` on the path, `p2_v1`: each module of it that
# moves, under that name.
[aliases]
"p2_v1.store" = "p2_store.store"
"p2_v1.gpu" = "p2_store.gpu"
"p2_v1.reference" = "verity.protocols.pous.verifier.p2_v1.reference"
"p2_v1.wire" = "verity.protocols.pous.verifier.p2_v1.wire"
"p2_v1.vectors" = "verity.protocols.pous.verifier.p2_v1.vectors"

# The directories this move empties: a file a later branch adds under one has no row here, and the move stops on it.
[retired]
paths = ["benchmarks/pous/p2_gpu/", "benchmarks/pous/p2_v1/store-toy/"]

[drop]
paths = []

[rewrite]
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**", "benchmarks/numerical/reports/**", "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**", "verity/definitions/silicon/hawkeye/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**", "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**", "tools/verity/check/tests/test_suites.py", "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json", "benchmarks/tc_probe_fp4/fp4_emulation_1ad1aaa2.py", "benchmarks/network_e2e/tests/data/**", "benchmarks/hash/dither/j10b_ref.py", "benchmarks/hash/dither/j10ca_ref.py", "benchmarks/hash/dither/j10hb.py", "benchmarks/hash/dither/j10rtx.py", "benchmarks/hash/dither/j10served.py", "adapters/vllm/tools/migrate/superseded_quarantine.py", "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json", "adapters/vllm/manifests/definitions.json"]

# A moved file's `HERE = Path(__file__).resolve().parent` stays its own directory, because what it reaches through
# `HERE` moved with it: `prover.py` finds `device.py` beside itself, `device.py` and `reader.py` find `codec_tensor/`
# and `word_codec/` beside their directory, `kv_bench.py` and `paged.py` find `kv.py`, `reference.py` and `vectors.py`
# find the vectors beside themselves, and `store.py` finds its toy store and writes its layout beside itself (its
# `parents[1]` stays the directory that holds its own package). Each reaches the root by an anchor of its own
# (`Path(__file__).resolve().parents[N]`), which the move recounts.
[rewrite.keep_in]
"verity/protocols/poub/prover/remote_session/prover.py" = ["benchmarks/remote_session"]
"verity/protocols/poub/prover/remote_session/device.py" = ["benchmarks/remote_session"]
"verity/protocols/poub/prover/codec_tensor/reader.py" = ["benchmarks/codec_tensor"]
"verity/protocols/poub/prover/word_codec/kv_bench.py" = ["benchmarks/word_codec"]
"verity/protocols/poub/prover/word_codec/paged.py" = ["benchmarks/vllm_encoded"]
"verity/protocols/pous/verifier/p2_v1/reference.py" = ["benchmarks/pous/p2_v1"]
"verity/protocols/pous/verifier/p2_v1/vectors.py" = ["benchmarks/pous/p2_v1"]
"verity/protocols/pous/prover/p2/p2_store/store.py" = ["benchmarks/pous", "benchmarks/pous/p2_v1"]

