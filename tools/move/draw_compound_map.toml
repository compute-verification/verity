# The retired word family DRAW, its compound identifiers in the proof system's own tree (`verity/protocols/proofs/`, the
# proof system's areas of `security/`, and its scripts under `benchmarks/`), renamed to the Glossary's sample, sampled and
# sampling wherever each stands: whole words only, each a name whose new spelling stands nowhere, that no quoted token, flag
# or record key spells, and that stands mostly in those paths. The bare words, the namespaces and the wire keys are not here;
# [keep] holds every quoted token of the family, the keys a served record or a verifier's input carries.

