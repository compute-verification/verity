# The areas of `security/` carry their protocol's name (MEM-152's second half; ARCHITECTURE.md section 7, "The areas
# of `security/`"), by `python3 tools/move/rename.py --map tools/move/poub_area_map.toml`: PoUB's files leave the
# accounting area for an area `Poub`, and PoUS's for `Pous/Accounting/`, in each tree of `security/` (`Definitions`,
# `Properties`, `Proofs` and `Proofs/Properties`), keeping their paths below the area and their file names. Each row
# renames one module path and one module name, so the file moves and every `import`, Lake root and lock module follows.
# - PoUB: the remote audit's vocabulary (`Remote*`, `RemoteHeld`), its game (`RateAudit*`), the bandwidth audit's game
#   and its block tags and sketches (`Bandwidth*`, `Tag`, `Sketch`), and the remote protocol's bound receipts, stacking
#   and carriers (`BoundReceipt`, `BoundSketch`, `Stacking`, `Carrier`).
# - PoUS: its responder, wipe, capacity audit, memory lemma and ring window (`Responder`, `Wipe`, `Capacity`, `Memory`,
#   `Window`).
# `Accounting` keeps the device model the audits share and their joint guarantee; PoUW's files there are its lane's.
# Namespaces and declarations keep their names (`Accounting.Remote`, `Accounting.Rate`, `Properties.RemoteAudit`, which
# `poub_names_map.toml` renames): a module is renamed here, never a declaration, so the locks' records stay.

[words]
"Definitions.Accounting.Assumptions.RateAudit" = "Definitions.Poub.Assumptions.RateAudit"
"Definitions.Accounting.Assumptions.Remote" = "Definitions.Poub.Assumptions.Remote"
