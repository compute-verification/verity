# The retired word family DRAW in PoUB's and PoUS's Lean names that no lock record names (MEM-152's retired words), by
# `python3 tools/move/rename.py --map tools/move/draw_poub_pous_lean_map.toml`: theorems, definitions and local names, each
# renamed to the Glossary's sample, samples or sampled in every file that names it (Flock's `ReadTmplCmd.lean` only in a
# comment). Not here: the bare `draw`, `draws` and `drawn` and the `Draw` namespaces, which lock records name; `DrawMeets`,
# a module whose path would move; `value_draw`, which PoUW's coins share; `_draw`, a suffix other code spells. No
# declaration a `lean-audit.json` names is renamed, so `--moves` has nothing for the locks. The certifier's paths are
# excluded while its quiet window lasts.

[words]

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "GLOSSARY.md", "tests/lint/**",
           "tests/test_retired_terms.py", "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[[words_in]]
files = ["security/Proofs/Properties/Poub/Remote/Run.lean"]
words = { "drawnN" = "sampledN" }

[[words_in]]
files = ["security/Proofs/Poub/RateAudit/DeployedSketch.lean", "security/Proofs/Poub/RateAudit/DeployedSketchSum.lean"]
words = { "eDraw" = "eSample" }

[[words_in]]
files = ["verity/protocols/accounting/poub/verifier/lean/Poub/Difftest.lean"]
words = { "drawnRun" = "sampledRun" }

[[words_in]]
files = ["security/Proofs/Pous/EndToEndAt.lean"]
words = { "card_draw_le" = "card_sample_le", "pr_draw_le" = "pr_sample_le", "card_draws_le" = "card_samples_le", "pr_draws_le" = "pr_samples_le" }

[[words_in]]
files = ["security/Proofs/Properties/Pous/Wipe.lean"]
words = { "value_draw_pr" = "value_sample_pr" }

[[words_in]]
files = ["security/Proofs/Accounting/ReadUnit.lean"]
words = { "readUnitDrawn" = "readUnitSampled" }

[[words_in]]
files = ["security/Proofs/Accounting/ReadUnit.lean", "security/Proofs/Accounting/ReadUnit/Binding.lean", "security/Proofs/Accounting/ReadUnit/Deployed.lean"]
words = { "readUnitDrawnCR" = "readUnitSampledCR" }

[[words_in]]
files = ["security/Proofs/Accounting/ReadUnit/Binding.lean"]
words = { "expectedCR_of_draw" = "expectedCR_of_sample" }

[[words_in]]
files = ["security/Proofs/Accounting/ReadUnit/Binding.lean", "security/Proofs/Accounting/ReadUnit/Deployed.lean", "verity/protocols/proofs/flock/verifier/Flock/ReadTmplCmd.lean"]
words = { "readUnitDrawn_check" = "readUnitSampled_check" }

[[words_in]]
files = ["security/Proofs/Accounting/ReadUnit/Deployed.lean"]
words = { "readUnitDrawn_partsOf" = "readUnitSampled_partsOf", "readUnitDrawn_layout" = "readUnitSampled_layout" }

[[words_in]]
files = ["security/Proofs/Accounting/ReadUnit/Witnesses.lean"]
words = { "drawnHashed₀" = "sampledHashed₀" }

[[words_in]]
files = ["security/Proofs/Properties/Poub/Remote/SubprotocolWitnesses.lean"]
words = { "draws_zero" = "samples_zero", "drawTerm_pos" = "sampleTerm_pos" }

[[words_in]]
files = ["security/Properties/Pous/PeriodGame.lean", "verity/protocols/accounting/pous/device/lean/MemoryChallenger/Records.lean"]
words = { "drawIndices" = "sampleIndices" }
