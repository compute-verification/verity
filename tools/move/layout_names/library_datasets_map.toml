# The datasets' distribution under the root `library/`: what `tools/move/layout.py --map tools/move/library_datasets_map.toml`
# moves and rewrites, after protocol_names_map.toml. `input_datasets/` becomes `library/datasets/`, with its tests'
# mirror; the import name `input_datasets` stays. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proof/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", verity_torch = "adapters/torch/verity_torch", input_datasets = "input_datasets/input_datasets", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "calibration/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proof/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", verity_torch = "adapters/torch/verity_torch", input_datasets = "library/datasets/input_datasets", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "calibration/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }

[paths]
# The directory's parts, each its own row: a row for the whole directory would rename its import name.
"input_datasets/input_datasets/" = "library/datasets/input_datasets/"
"input_datasets/definitions/" = "library/datasets/definitions/"
"input_datasets/pyproject.toml" = "library/datasets/pyproject.toml"
"input_datasets/README.md" = "library/datasets/README.md"
"tests/input_datasets/" = "tests/library/datasets/"

[retired]
paths = ["input_datasets/", "tests/input_datasets/"]

[drop]
paths = []

[rewrite]
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "tools/check/tests/test_move_check.py", "tools/check/move_check.py",
           "tools/research/src/research/store/moves.json",
           "tests/verity/protocols/*/flock/prover/lean/RandomnessVectors.lean"]

[modules]
"input_datasets.definitions" = "library.datasets.definitions"
"tests.input_datasets" = "tests.library.datasets"
