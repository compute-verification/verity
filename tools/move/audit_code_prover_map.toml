# The compute audit's three verifier-side files that load the prover, moved after `audit_code_map.toml`:
# `tools/move/layout.py --map tools/move/audit_code_prover_map.toml`.
#
# `check_memo.py` loads the window's audit (`template_audit`), `records_audit.py` runs the window's and template's
# audits, and `compose_circuit.py` composes a template's circuit with Flock's prover (`verity_flock`). A file under
# `verifier/` may not load one under `prover/` or the prover's distribution, so the three go to `spot/prover/audit/`
# beside the commands that run them, with the tests that load them; `spot/verifier/one_stage/` keeps what loads
# neither (the member trees, the served window's integrity, the audit record).

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/proofs/spot/verifier/one_stage/check_memo.py" = "verity/protocols/proofs/spot/prover/audit/check_memo.py"
"verity/protocols/proofs/spot/verifier/one_stage/records_audit.py" = "verity/protocols/proofs/spot/prover/audit/records_audit.py"
"verity/protocols/proofs/spot/verifier/one_stage/compose_circuit.py" = "verity/protocols/proofs/spot/prover/audit/compose_circuit.py"
"verity/protocols/proofs/spot/verifier/tests/test_check_memo.py" = "verity/protocols/proofs/spot/prover/tests/test_check_memo.py"
"verity/protocols/proofs/spot/verifier/tests/test_records_audit.py" = "verity/protocols/proofs/spot/prover/tests/test_records_audit.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was, files whose bytes a digest pins, and every Lean input; as the earlier maps'.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean", "**/lakefile.toml",
           "tests/tree.toml", "**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.h", "**/*.c"]
include = ["**/fixtures/README.md", "**/fixtures/**/README.md"]


[modules]
"verity.protocols.proofs.spot.verifier.one_stage.check_memo" = "verity.protocols.proofs.spot.prover.audit.check_memo"
"verity.protocols.proofs.spot.verifier.one_stage.compose_circuit" = "verity.protocols.proofs.spot.prover.audit.compose_circuit"
"verity.protocols.proofs.spot.verifier.one_stage.records_audit" = "verity.protocols.proofs.spot.prover.audit.records_audit"
"verity.protocols.proofs.spot.verifier.tests.test_check_memo" = "verity.protocols.proofs.spot.prover.tests.test_check_memo"
"verity.protocols.proofs.spot.verifier.tests.test_records_audit" = "verity.protocols.proofs.spot.prover.tests.test_records_audit"
