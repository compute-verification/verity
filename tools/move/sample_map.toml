# The population's samples: what `tools/move/rename.py --map tools/move/sample_map.toml` renames (a draw is a sample;
# the coins stay coins). The population's uniform, independent and subset draws become samples (`uniformSample`,
# `indepSample`, `subsetSample`), the detection-pressure module `DrawPressure` moves to `SamplePressure`, and their
# lemmas follow; a task's `draw` (`Accounting.Slowdown.Task`), its input at each value of the coin, becomes its
# `sample`, where `Slowdown.lean` declares it and `CoverageToy.lean` builds one. Only these files are renamed.
# `Population.Exfil.Draw`, a second `Draw` beside the core's `Verity.Draw`, goes in its dedupe, and
# `Pouw.Window.subsetDraw` is the PoUW window's. Declarations keep their place in the locks' records: `rename.py
# --moves` prints the renames that `check.py --update --moved` takes.
[words]
"DrawPressure" = "SamplePressure"

[[words_in]]
files = ["Security/Definitions/Population.lean", "Security/Definitions/Population/*.lean",
         "Security/Proofs/Population.lean", "Security/Proofs/Population/*.lean"]
[words_in.words]
"uniformDraw" = "uniformSample"
"sum_missing_uniformDraw" = "sum_missing_uniformSample"
"uniformDraw_nonneg" = "uniformSample_nonneg"
"uniformDraw_isDist" = "uniformSample_isDist"
"indepDraw" = "indepSample"
"indepDraw_escapes" = "indepSample_escapes"
"indepDraw_acceptCoins" = "indepSample_acceptCoins"
"indepDraw_isDist" = "indepSample_isDist"
"pressure_indepDraw" = "pressure_indepSample"
"subsetDraw" = "subsetSample"
"subsetDraw_escape" = "subsetSample_escape"
"subsetDraw_escape_le" = "subsetSample_escape_le"
"subsetDraw_acceptProb" = "subsetSample_acceptProb"
"subsetDraw_acceptProb_le" = "subsetSample_acceptProb_le"
"pressure_subsetDraw" = "pressure_subsetSample"
"drawPressure" = "samplePressure"
"draw_tail_cum" = "sample_tail_cum"
"draw_tail_cumLag" = "sample_tail_cumLag"
"draw_ex_cumUpToLag" = "sample_ex_cumUpToLag"
"pressure_of_draw" = "pressure_of_sample"
"late_draw_dodges" = "late_sample_dodges"

[[words_in]]
files = ["Security/Definitions/Accounting/Slowdown.lean", "Security/Definitions/Accounting/CoverageToy.lean"]
[words_in.words]
"draw" = "sample"

[rewrite]
# host_map.toml's: records of what was (the earlier moves and their maps, changelogs, the rulings), the frozen backends,
# files whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']
strings = []

[keep_in]
