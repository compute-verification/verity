# One test the vLLM adapter's suite kept after `torch_adapter_map.toml`, whose only import of the adapters is the PyTorch
# adapter's (`verity_torch.correspondence.runtime`, which that map moved): what
# `tools/move/layout.py --map tools/move/torch_correspondence_test_map.toml` moves to the PyTorch adapter's suite, with the
# package `__init__.py` its new directory needs there.
#
# The roots and the excludes are `torch_train_step_map.toml`'s. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", verity_torch = "adapters/torch/verity_torch" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", verity_torch = "adapters/torch/verity_torch" }


[paths]
"adapters/vllm/tests/correspondence/test_descriptor_annotation_stream.py" = "adapters/torch/tests/correspondence/test_descriptor_annotation_stream.py"

[create]
"adapters/torch/tests/correspondence/__init__.py" = ""

[modules]
"adapters.vllm.tests.correspondence.test_descriptor_annotation_stream" = "adapters.torch.tests.correspondence.test_descriptor_annotation_stream"

[retired]
