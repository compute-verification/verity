# Remote, onsite and the rule that joins them, into the protocol that composes: what `tools/move/layout.py --map
# tools/move/compose_fix_map.toml` moves and rewrites.
#
# Remote and onsite are the two lists of protocols compose accepts, and the composition (`core_composition`,
# `Core.Composition`) is the rule that joins the protocols on one registration, which both require. All three go
# inside `verity/protocols/compose/`, under its `verifier/`, each Lake package a directory of its own: a protocol's
# directory holds only `verifier/`, `prover/`, `device/`, its README, its suite and its package files
# (`tests/tree.toml`'s `verity/protocols/NAME/`), so a Lake package's lakefile and sources can't sit at `compose/`
# itself.
#
# - `verity/protocols/remote/verifier/composition/` to `verity/protocols/compose/verifier/composition/`, with its suite
#   (`pyproject.toml`, `tests/`), whose name stays; `verity/protocols/remote/verifier/` (the Lake package `core_remote`)
#   to `verity/protocols/compose/verifier/remote/`; `verity/protocols/onsite/verifier/` (`core_onsite`, with the command
#   that picks between the two) to `verity/protocols/compose/verifier/onsite/`. Each moves whole and laid out as it was.
# - A Lean module is named from its package's root (`CoreComposition.Tie`, `CoreRemote`, `CoreOnsite`), so no Lean
#   module, declaration or lock record changes; what changes in a lakefile or a manifest is a path to these packages,
#   and nothing else. No `.lean` file's bytes change ([rewrite] exclude).
# - `remote/verifier/` holds the composition today, so the map splits it: a reference to remote's package as a whole
#   follows its larger part, remote's own, and each such reference is acknowledged in [split].
# - It replaces `compose_map.toml` (the composition to `compose/` itself) and `configurations_map.toml` (remote and
#   onsite to `verity/configurations/`), which the layout of record no longer has.
# Nothing is edited or deleted, and no file is added. The format is `layout_map.toml`'s. It runs after the chain that
# moves `verity_config` to `tools/config/` and before `protocol_groups_map.toml`; `live_challenger_map.toml`, which
# makes `compose/device/`, runs before it or after.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/remote/verifier/composition/" = "verity/protocols/compose/verifier/composition/"
"verity/protocols/remote/verifier/" = "verity/protocols/compose/verifier/remote/"
"verity/protocols/onsite/verifier/" = "verity/protocols/compose/verifier/onsite/"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row, and each row is a
# directory's, so a file only a branch has under one is carried
paths = ["verity/protocols/remote/", "verity/protocols/onsite/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean",
           # the layout of record: a landed move leaves its lines as written, for top to delete
           "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[split]
# references to a directory this move splits that stay right: "old file: old directory" = why
"benchmarks/one_stage/kept_composite.sh: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"benchmarks/prove_path/tests/test_remotetie.py: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"demos/vllm/README.md: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"security/Proofs/lake-manifest.json: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"security/Properties/lake-manifest.json: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"security/README.md: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"tools/verity/check/drive.toml: verity/protocols/remote/verifier" = "the low-risk exclusions list remote's package and the composition each, and each follows its own part"
"verity/protocols/inference_only/verifier/nci/README.md: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"verity/protocols/onsite/verifier/lake-manifest.json: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"verity/protocols/onsite/verifier/lakefile.toml: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"verity/protocols/pouw/verifier/README.md: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"verity/protocols/remote/verifier/composition/tests/test_composition_difftest.py: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"
"verity/protocols/spot/verifier/README.md: verity/protocols/remote/verifier" = "a reference to remote's package, the composite `core_remote`, which follows remote's own part; the composition goes to its own directory beside it"

[modules]
# the renames [paths] implies (`layout.py --modules`): each directory as a dotted path. No module lives in them: the
# packages are Lean, and the suite's files run as files.
"verity.protocols.onsite.verifier" = "verity.protocols.compose.verifier.onsite"
"verity.protocols.remote.verifier" = "verity.protocols.compose.verifier.remote"
"verity.protocols.remote.verifier.composition" = "verity.protocols.compose.verifier.composition"
