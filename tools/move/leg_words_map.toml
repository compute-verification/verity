# The retired word "leg" (GLOSSARY.md's retired-terms row: "leg" … the all-protocols runner's legs → subprotocol; the
# lint's `LEAN_WORDS`: leg → subprotocol): what `tools/move/rename.py --map tools/move/leg_words_map.toml` renames, in
# paths, modules, Lean names, code and prose, wherever "leg" names one subprotocol's part of a run, an audit, a record or
# a soundness statement:
# - the one-stage audit's proof subprotocol (`benchmarks/one_stage/prove_leg.{py,sh}` and its test move to
#   `prove_subprotocol`, with every import of the module and the shell's `LEG_*` settings);
# - the block record's code (`block_record.leg`, `LEGS`) and its prose; the record's own key `legs` stays (below);
# - the all-protocols period's subprotocol of PoUS, PoUB and the wipe (`period.leg`, `wipe_period.leg`,
#   `PousOption.leg`);
# - the Lean's legs of `Verity.Soundness` (the sampled, two-stage and recursive ones): the modules
#   `Proofs.Properties.Verity.Sampled.Window.Leg` and `Proofs.Properties.Verity.SampledTwo.Leg`, and `TwoLeg`, `twoLeg`.
# What it leaves: bytes a stored record, a digest or a caller holds ([keep]); the network certifier's files, which
# network-accounting renames itself with these spellings (the certifier's `block_leg` with them), but for the one-stage
# module's import and input path; and "leg" in another sense: the vLLM adapter's Match legs (a per-request, per-rank or
# compare part of a check, and a fold's time budget `leg_s`); a circuit's fan-in (slowdown's and circuit_properties' `legs`,
# the inference-only policy's `Layered` roots and its Lean, and the lock's reason that states it), which training renames
# in its own paths; a step of an argument (the V5 leg, the Rabin regeneration leg); a TCP connection's legs; a benchmark's
# variant or part (`commit_variants.sh`, the Dither run, the verifier-cost benchmark's Boolean part, a canary in a
# telemetry rule); a PoUW window's proofs and live rounds; a spider's legs and a novel's text.

[words]
"LEGS" = "SUBPROTOCOLS"
"Legs" = "Subprotocols"
"legs" = "subprotocols"
"LEG" = "SUBPROTOCOL"
"Leg" = "Subprotocol"
"leg" = "subprotocol"

# bytes a stored record or a caller holds: the block record's key `legs` (``legs.certifier``, `rec["legs"]`, the check's
# `composed:legs`) and its
# schema's `$defs/leg` and `"leg": {`; a quoted "leg" elsewhere names a function the map renames (`__all__`); the proof subprotocol's format id `verity/prove-leg/v0`, its receipt's text, its configuration
# name for hidden_zk and its run directory's names (`leg.json`, `leg.log`, `$OUT/leg`, `leg/wipe.json`); a claim id; the
# all-protocols runner's paths as they were; and the report's refusal of the retired word itself, with its test
[keep]
patterns = ["(?<=[\"'`])legs(?=[\"'`])", "(?<=composed:)legs\\b", "(?<=/ \")leg(?=\" /)", "(?<=\")leg(?=\": \\{)", "(?<![\\w-])legs\\.(?:integrity|pouw|pous|bandwidth|certifier|wipe)\\b",
            "\\$defs/legs?\\b", "prove-leg\\b", "(?<![\\w-])legs?\\.(?:json|log)\\b", "\\$(?:W|OUT)/leg\\b",
            "(?<![\\w/.-])leg/wipe\\.json", "all_protocols/legs/"]
strings = ["prove-leg verifier (prove_leg.py)", "leg_s=round", "ProveLegRegisteredDot",
           "(legs?|windows?|templates?", "says \"leg\", \"window\"", "(\"leg\", \"window\", \"template\")",
           "[\"leg\", \"Legs\", \"window\"", "test_the_word_leg_in_a_source_is_refused", "the leg's sessions",
           "says 'leg'", "sampled-leg-bridge", "block_leg"]

# "leg" in another sense, each file by a glob that still matches it after a directory move
[keep_in]
"**/verity_vllm/check/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"**/verity_vllm/pipeline/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"**/verity_vllm/records/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"**/verity_vllm/commit/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"**/verity_vllm/engine/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"**/verity_vllm/config.py" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"adapters/vllm/tests/check/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"adapters/vllm/tests/pipeline/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"adapters/vllm/tests/records/**" = ["LEGS", "Legs", "legs", "LEG", "Leg", "leg"]
"**/definitions/registry/b1_tp2.py" = ["legs", "leg"]
"benchmarks/slowdown/**" = ["LEGS", "Legs", "legs", "leg"]
"benchmarks/circuit_properties/**" = ["LEGS", "Legs", "legs", "leg"]
"benchmarks/nci/**" = ["legs", "leg"]
"security/Definitions/Slowdown/**" = ["LEGS", "Legs", "legs", "leg"]
"security/Proofs/Slowdown/**" = ["LEGS", "Legs", "legs", "leg"]
"security/lean-audit.json" = ["legs"]
"**/Bridge/CustodyZkP.lean" = ["leg"]
