# The retired word "law" outside the proof system's paths, in the Glossary's words: what `tools/move/rename.py --map
# tools/move/law_words_map.toml` renames. GLOSSARY.md: "law", "draw law", `law` identifiers, the Lean's `Law` -> the
# sampling design. A name takes proofs' spelling (`law_lean_map.toml`): its law part becomes `SamplingDesign`,
# `sampling_design` or `SAMPLING_DESIGN` (`WorkLaw` to `WorkSamplingDesign`); prose takes "sampling design". The
# adapter's test constants take the `DESIGN` its other tests already hold, so the adapter has one spelling.
# It renames the names whose definitions are on this side (the PoUW plan's `WorkLaw`, `CountLaw`, `TileLaw` and
# `window_laws`, the configuration's `default_law`, the adapter's `window_law` module, the served commit's `law_of`,
# test constants `LAW`), the Lean names proofs' map renamed where Python cites them (`Law.toJson`),
# and prose that names the sampling design by a possessive or a qualifier.
# Left by this map:
# - proofs' paths (`verity/protocols/proofs/`, the Flock and SPOT areas of `security/`, the lane's benchmarks, the
#   files `law_prose_map.toml` names), and the names defined there (`Law`, `selection_law`, `params_law`, `second_law`,
#   `core_law`, one-stage's `law_of`, `V3C_LAW`, `FLOCK_DRAW_LAW`): a use here takes proofs' spelling after its map;
# - the adapter's `law_of`, which proofs' files call as `serving_rows.law_of`: it renames with those callers;
# - the bare `law` in code and every Lean name, which follow proofs' map and lean's names move;
# - bytes a record, a wire format, a hash or a signature takes in: one-token strings (the key `law`), reason codes
#   (`R1-law`, `record-law`, `answer-public-law`), the claim id `accounting-ts-window-law`;
# - another sense: a probability law (`noise_law`, `_below_law`), a scaling, power or size law, a law of the courts;
# - network-accounting's files (the certifier, its benchmarks), which that lane runs this map's spellings over;
# - records of what was: GLOSSARY.md's table, the retired-terms lint, its allowlists and tests, the move tool's tests.

