# The retired word "law" outside the proof system's paths, in the Glossary's words: what `tools/move/rename.py --map
# tools/move/law_words_map.toml` renames. GLOSSARY.md: "law", "draw law", `law` identifiers, the Lean's `Law` -> the
# sampling design. A name takes proofs' spelling (`law_lean_map.toml`): its law part becomes `SamplingDesign`,
# `sampling_design` or `SAMPLING_DESIGN` (`WorkLaw` to `WorkSamplingDesign`); prose takes "sampling design". The
# adapter's test constants take the `DESIGN` its other tests already hold, so the adapter has one spelling.
# It renames the names whose definitions are on this side (the PoUW plan's `WorkLaw`, `CountLaw`, `TileLaw` and
# `window_laws`, the configuration's `default_law`, the adapter's `window_law` module, the served commit's `law_of`,
# test constants `LAW`), the Lean names proofs' map renamed where Python cites them (`Law.toJson`),
# and prose that names the sampling design by a possessive or a qualifier.
# Outside proofs' Lean paths (the files its `law_lean_map.toml` lists as its own), the Lean names other lanes declare
# take proofs' spelling (`serviceLaw` to `serviceSamplingDesign`, `law_ok` to `samplingDesign_ok`, `hLaw` to
# `hSamplingDesign`), and prose naming the sampling design ("the calls' laws", "draw laws") takes "sampling design".
# The bare `law` and `laws` in Python take `sampling_design(s)` in the files `[[words_in]]` lists: locals, parameters
# and their keywords, PoUW credit's `law` (the Lean's `PouwCheck.Credit.samplingDesign`), and the fields of `Plan`
# and of the configuration's `Component`.
# Left by this map:
# - proofs' paths (`verity/protocols/proofs/`, the Flock and SPOT areas of `security/`, proofs' Lean files, the lane's
#   benchmarks, the files `law_prose_map.toml` names), and the names defined there (`Law`, `selection_law`, `Draw.law`,
#   `V3C_LAW`, `FLOCK_DRAW_LAW`, `RecordCustodyZKJPLaw`, the binder `hlaw` its files share with ours);
# - the fields `Binding.law` and the period `Window.law`, which proofs' files read (`mine.law`), PoUS's `Claim.law`,
#   and every other attribute named `law`; the adapter's `served_tp --law`, which proofs' scripts pass;
# - bytes a record, a wire format, a configuration file, a hash or a signature takes in: every string that holds the
#   word (the record and configuration key `law`, `service.law`), reason codes (`R1-law`, `record-law`,
#   `answer-public-law`), the claim id `accounting-ts-window-law`, and refusal messages, which Lean twins throw in the
#   same words and tests match;
# - Lean's "law" of a distribution (the uniform law, the keys' law, the session game's law) and the machine's laws;
# - another sense: a probability law (`noise_law`, `_below_law`), a scaling, power or size law, a law of the courts;
# - network-accounting's files (the certifier, its benchmarks), which that lane runs this map's spellings over;
# - records of what was: GLOSSARY.md's table, the retired-terms lint, its allowlists and tests, the move tool's tests.

