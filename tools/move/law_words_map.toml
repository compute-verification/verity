# The retired word "law" outside the proof system's paths, in the Glossary's words: what `tools/move/rename.py --map
# tools/move/law_words_map.toml` renames. GLOSSARY.md: "law", "draw law", `law` identifiers, the Lean's `Law` -> the
# sampling design. A name takes `design` (as `parse_design` and `design_object` already do), prose "sampling design".
# It renames the names whose definitions are on this side (the PoUW plan's `WorkLaw`, `CountLaw`, `TileLaw` and
# `window_laws`, the configuration's `default_law`, the adapter's `window_law` module and its `law_of`, the served
# commit's `law_of`, test constants `LAW`) and prose that names the sampling design by a possessive or a qualifier.
# Left by this map:
# - proofs' paths (`verity/protocols/proofs/`, the Flock and SPOT areas of `security/`, `benchmarks/one_stage/`,
#   `benchmarks/remote_session/`), and the names defined there (`Law`, `selection_law`, `params_law`, `second_law`,
#   `core_law`, one-stage's `law_of`, `V3C_LAW`, `FLOCK_DRAW_LAW`): a use here takes proofs' spelling after its map;
# - the bare `law` in code and every Lean name, which follow proofs' map and lean's names move;
# - bytes a record, a wire format, a hash or a signature takes in: one-token strings (the key `law`, `sqrt_law`), reason
#   codes (`R1-law`, `record-law`, `answer-public-law`), the claim id `accounting-ts-window-law`;
# - another sense: a probability law (`noise_law`, `_below_law`), a scaling, power or size law, a law of the courts;
# - the network certifier's files and network-accounting's benchmarks, until that lane reads this map;
# - records of what was: GLOSSARY.md's table, the retired-terms lint, its allowlists and tests, the move tool's tests.

