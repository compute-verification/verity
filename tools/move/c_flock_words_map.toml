# Flock's older name: what `tools/move/rename.py --map tools/move/c_flock_words_map.toml` renames, "C-Flock" to Flock
# (GLOSSARY.md, Older names; Succinct's is "upstream Flock", and no site here means Succinct's). It renames the word in
# prose (comments, docstrings, Markdown, TOML comments) and in the messages and texts that name the proof system (a
# lowering's refusal, a report's line, a cost table's row, a census of pieces), with the tests that match those messages.
# The one spelling is "C-Flock": "C Flock" with a space is a Lean term's `_C FlockDeploy` or `TC Flock`, and `CFlock` is
# no name of this family (`PearlCFlockTile` is Pearl-C's Flock tile).
#
# It renames no code name. It leaves, since its bytes are a stored label or a recorded id: the candidate label `C-Flock`
# as a whole string or in backticks (`research.store.vocab.BACKEND_FAMILIES`, the bench cells' family, the lowerings'
# registry key and its users); the lowercase `c-flock:...` provenance ids circuit-check writes as `via`, the type name
# `c-flock-unit` and the key `c_flock_unit`; and the locks' texts, which only `check.py --update` writes, with the lock
# test's copies of them (`tools/verity/lean/tests/test_audit.py`).

[words]
"C-Flock" = "Flock"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, the rulings), the retired-terms
# lint and the Glossary's row, which name the older name as the older name, files whose bytes a digest pins, lock files
# and the locks' texts, move_check's own tests, fixtures and recorded reports, the census, and the vLLM registry's three
# files whose function sources enter a manifest's digest.
exclude = ["tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py", "GLOSSARY.md", "tools/move/**",
           ".agents/skills/friction/SKILL.md", "**/fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/uv.lock", "**/*.lock", "**/lean-audit.json", "tools/verity/lean/tests/test_audit.py",
           "tools/check/tests/test_move_check.py", "benchmarks/census/**",
           "benchmarks/numerical/tests/bench/data/**",
           "adapters/vllm/verity_vllm/definitions/registry/ref_prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/b1.py"]

[keep]
# The stored candidate label: `C-Flock` as a whole string literal or in backticks.
patterns = ['"C-Flock"', "'C-Flock'", '`C-Flock`']
strings = []
