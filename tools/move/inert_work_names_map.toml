[keep]
patterns = [
    '''(?<!\.D, )["'](?:pouw_pearl_c_served_debit/per-input|cross_group_beyond_debit_mean_worst|cross_group_beyond_debit_mean|cross_group_beyond_debit_max|worst_word_share_tile_cap_ok|debit_share_of_credit|debit_max_word_share|rejected_at_scheme_cap|pouw_pearl_c_served_debit|unneeded_positions|max_debit_over_cap|rows_over_row_cap|forming_elements|debit_atom_share|debit_eF_share|census_row_cap|debit_over_cap|over_cap_tiles|tile_cap_ok|debit_exact|debit_share)["']''',    # a record's keys
    '''["'](?:tile_cap|row_cap)["'](?=: str\()''',    # ... the k256 gate's header
    'max_debit_over_cap=',    # ... the replay's accept line
    '(?<!cap\.)Pc8\w*Cap\w*',    # a Definition staged into a circuit
    'pearlCGamma\w*',    # the Lean store's pin names
    '(?<!\w)(?:PEARLPLUS_OVER_CAP|test_cap_is_the_largest_power_of_two_a_statement_holds|coinPasses_overCap|capCheck_of_check)(?!\w)',    # a word inside another name: Pearl+'s over-cap variable, Recursion's, Accounting's and a workload's cap
    '''(?m)^\| Pearl's "debit" and "cap".*$''',    # the Glossary's row of older names
]

