# Pearl's retired "debit" and "cap" in the code's names: what `tools/move/rename.py --map
# tools/move/inert_work_names_map.toml` renames, GLOSSARY.md's row of Pearl's older names to its terms, in paths,
# modules, Python names and the Lean.
#
# Names. Pearl's debit is the inert work the replay prices (Lean's `Debit` and `debitOf`), so `debit` becomes
# `inert_work` as a name or one part of one (`InertWork`, `inertWorkOf`, `INERT_WORK`, `inert_work_units`), and takes no
# plural. Pearl's cap is two things, and each name takes the one it names: the inert-work share ι, which is ρ itself
# (`Cap1000` is ι = 1/1,000, `OfCap400` 1/400, `NAME_CAPS`, `row_cap_at`), becomes `inert_share`, and
# `CENSUS_ROW_CAP`, a row's share as a multiple of ρ, `CENSUS_ROW_INERT_SHARE_MULTIPLE`; the inert-work bound, ρ times
# a credit, which a tile or a row must not pass (`capOK`, `tile_cap`, `overCapTiles`, the circuit of
# `prover/circuit/cap.py` and the Lean `Pouw.PearlC.Cap` about it), becomes `inert_bound`. In a name that holds debit,
# cap is the bound beside it: `debit_over_cap` becomes `inert_work_over_bound`, and `_debit_cap`, which returns both,
# `_inert_work_and_bound`. An unneeded element is an inert element (`unneeded_positions` becomes `inert_positions`), and
# `forming_elements`, which counts them, `inert_elements`. A test name's verb "caps" becomes "bounds".
#
# Only names are here. The bare words, `cap` and `debit` as a local, a parameter or an attribute (`Device.cap`) and in
# prose, are left to a prose map and a tokens map after it: the names' form would misspell a sentence, and a bare local
# renamed in one form and not another would break the code. The cap circuit's module is renamed in the files that
# import it, in the forms they use it in, and the share's constants `CAP` and `CAPS` in the files that define and read
# them ([[words_in]]).
#
# Kept bytes ([keep]):
# - a record's keys (`debit_exact`, `forming_elements`, `max_debit_over_cap`, the census's and the k256 gate's columns,
#   a certificate's `census_row_cap`): kept runs, the committed vectors and the readers outside the tree carry them, so
#   a key changes only as a new format version, with a reader of both spellings;
# - names staged into a circuit (`Pc8TileCap` and the other `Pc8…Cap…` Definitions), which circuit-check pins;
# - the Lean store's pin names (`pearlCGamma…`), which the price-twin table reads as the store spells them;
# - a word inside another name it doesn't rename: `PEARLPLUS_OVER_CAP`, and the caps of Recursion
#   (`capCheck_of_check`), Accounting (`coinPasses_overCap`) and a proof-throughput workload;
# - the Glossary's row of older names.
#
# Not renamed, so not here: Pearl+'s `over_cap`, `--over-cap`, `over_cap_draws` and `PEARLPLUS_OVER_CAP`, a verdict's
# key, the CLI flag and the variable that sets it, which its Lean verifier and the stored verdicts share; and the names
# of a kernel source (`debit_sm90` and its build logs, the kernels `debit_fwd`, `debit_bounds` and `debit_flags`, which
# a launch names, and `DEBIT_CUBIN`).
#
# Left as they are ([rewrite] exclude): the retired-terms lint, which names the retired words as the words, this
# directory's maps and toy fixtures, research's store vocabulary and `moves.json`, fixtures, whose bytes tests pin, and
# kernel sources (`*.cu`, `*.cuh`, `*.c`, ...), whose rename a build must show leaves every cubin as it was.


