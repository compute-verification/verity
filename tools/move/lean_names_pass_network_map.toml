# The network verifier package's names, whole tokens only: its namespace, modules, Lake package and targets, executables and suite, wherever code spells them.
[words]

[[words_in]]
files = ["*"]
[words_in.words]
"NetworkCheck" = "NetworkVerifier"
"network-check" = "network-verifier"
"network_check" = "network_verifier"

[keep]
patterns = []

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "**/fixtures/**", "fixtures/**", "*.patch", "tools/research/src/research/store/**", "tests/tools/move/**", "GLOSSARY.md", "benchmarks/exfiltration/**", "benchmarks/harness/verity_bench/exfiltration*.py", "tests/benchmarks/harness/test_exfiltration*.py"]
