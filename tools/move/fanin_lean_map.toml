# The retired word "legs" where it names a root's reads of its thread in the slowdown bound's Lean: what
# `tools/move/rename.py --map tools/move/fanin_lean_map.toml` renames. A keyed reference circuit's `Layered.legs` becomes
# `Layered.fanin`, its fields `legs_reads`, `legs_thread`, `legs_card` and `legs_disjoint` become `fanin_*`, and the prose
# "`d` legs" "fan-in `d`" (a root's legs, "fan-in reads"), as `tools/move/fanin_map.toml` spells it in Python. Only the
# files below: "leg" elsewhere in the Lean (a protocol's part of a bound) is another sense and another map's.
# The field itself, bare `legs`, has no row: `leg_words_map.toml`'s `Legs` and `LEGS` fold onto it in the test of two
# maps, and the files below no longer hold it.

[words]

[[words_in]]
files = [
    "security/Definitions/Slowdown/Layered.lean",
    "security/Definitions/Slowdown/Witness.lean",
    "security/Definitions/Slowdown/Assumptions/Layered.lean",
    "security/Definitions/Slowdown/Guarantees/Layered.lean",
    "security/Proofs/Slowdown/Layered.lean",
]
[words_in.words]
"whose roots have `d` legs" = "whose roots have fan-in `d`"
"whose roots each have at least `d₀ = 17` legs" = "whose roots each have fan-in at least `d₀ = 17`"
"its legs the previous accumulator" = "its fan-in the previous accumulator"
"the legs of each chain's first root meet" = "the fan-in reads of each chain's first root meet"
"Each leg of a root" = "Each fan-in read of a root"
"and two legs never reach" = "and two fan-in reads never reach"
"its *legs*" = "its *fan-in*"
"whose legs are the previous step's" = "whose fan-in is the previous step's"
"has at least `d` legs whose" = "has at least `d` fan-in reads whose"
"whose legs' key paths" = "whose fan-in reads' key paths"
"A root's legs:" = "A root's fan-in:"
"legs_reads" = "fanin_reads"
"legs_thread" = "fanin_thread"
"legs_card" = "fanin_card"
"legs_disjoint" = "fanin_disjoint"

[rewrite]
exclude = ["tools/move/**", "**/lean-audit.json"]
