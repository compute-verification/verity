# The retired words "compile unit": what `tools/move/rename.py --map tools/move/compile_unit_words_map.toml` renames, by
# the Glossary's row ("the compile slice's proof block") and the vLLM adapter's own rename (`compile_slice_block`): prose
# in SPOT's audit (its README's target section, `prove_path`'s and `records_audit`'s docstrings and a help text), the
# period interface, the live challenger's `auditor.py` docstring and the network encodings' docstrings. No code name of the family
# stands outside the adapter, which renamed its own, and no Lean declaration is renamed.
# It leaves what a record stores: the network encodings' `FIELDS` "checker" texts (`enc-derived/tables` records),
# `prove_path`'s summary "gap", the onsite record's `CHARGED` and the chain report's advice line; the certifier's paths
# (13 sites), until network-accounting's rename is in; the lock records; and the lints and the Glossary row that name the
# old words.

[words]
"compile_units" = "compile_slice_blocks"
"compile_unit" = "compile_slice_block"
"Compile units" = "Compile slices' proof blocks"
"compile units" = "compile slices' proof blocks"
"Compile unit" = "Compile slice's proof block"
"compile unit" = "compile slice's proof block"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps), fixtures and vectors, files whose bytes a digest
# pins, lock files (the Lean locks' records and frozen reasons included), the vLLM registry, the certifier's paths (its
# lane renames them) and the two lints that name the retired words.
exclude = ["tools/move/**", "**/fixtures/**", "**/*vectors*.json", "**/*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/lean-audit.json", "benchmarks/numerical/tests/bench/data/**",
           "tests/test_retired_terms.py", "tests/lint/test_repo_retired_terms.py",
           "adapters/vllm/verity_vllm/definitions/registry/**",
           "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[keep]
# The Glossary's row of the older name, and the texts records store.
patterns = ['(?m)^\| "compile unit".*$', '"checker": "compile unit', 'until the compile unit exists \(README\.md\)',
            "the advice is the compile unit's input, not the window Program's",
            "the compile unit, which takes it hidden, isn't run here"]
