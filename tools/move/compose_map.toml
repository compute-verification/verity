# The move of the rule that joins protocols: what `tools/move/layout.py --map tools/move/compose_map.toml` moves and
# rewrites.
#
# `verity/protocols/remote/verifier/composition/`, the Lake package `core_composition` (`Core.Composition`), states how
# protocols on one registration compose. It sat inside remote's package directory and is no part of remote: it requires
# only the base package and the core interface, and remote and onsite require it. It becomes a protocol directory of its
# own, `verity/protocols/compose/`.
#
# - The directory moves whole and laid out as it was: the package's `.lean` files, lakefile, manifest, lock and
#   toolchain, and the suite beside them (`pyproject.toml`, `tests/`), whose name stays.
# - A Lean module is named from its package's root (`CoreComposition.Tie`), so no Lean module, declaration or lock
#   record changes; what changes in a lakefile or a manifest is a path to this package.
# - No directory is split, so the map has no [split] table and reads the same on any base.
# Nothing is edited or deleted, and no file is added. The format is `layout_map.toml`'s. `configurations_map.toml` runs
# after this map, on the commit it makes.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/remote/verifier/composition/" = "verity/protocols/compose/"

[retired]
# the directory this map empties: `layout.py` refuses a tracked file under one that has no row, and its row is a
# directory's, so a file only a branch has under it is carried
paths = ["verity/protocols/remote/verifier/composition/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[modules]
# the rename [paths] implies (`layout.py --modules`): the directory as a dotted path. No module lives in it: the package
# is Lean, and the suite's files run as files.
"verity.protocols.remote.verifier.composition" = "verity.protocols.compose"
