# "The verifier of record" is the verifier: what `tools/move/rename.py --map tools/move/verifier_of_record_words_map.toml`
# renames, file by file, where the phrase names the one verifier whose verdict counts and nothing else in its sentence
# answers to it (GLOSSARY.md's row): a command's help, comments, docstrings, a check's failure message, difftest's
# message with the test that matches it, and test names (`test_..._verifier_of_record_...` to `test_..._verifier_...`).
#
# It leaves the phrase where "of record" picks some verifiers out of others, which a bare "the verifier" would lose:
# SPOT's audit, whose verdicts carry `of_record`, with its verdict and refusal texts in Lean (`Spot.OneStage`,
# `Pieces`, `Record`, `Service`) and their Python mirrors (`service.py`, `one_stage/proofs.py`, `replay.py`, the
# difftests and tests that match them), which stored verdicts also carry; the negative controls' keys
# (`verifier-of-record-did-not-run (C2)`, `no-verifier-of-record (C2)`); report text that enters a record
# (`served_verdicts.py`, `pouw_piece.py`'s refusal); `InnerClaims.lean`, whose sha256 `inner_claims.json` pins; the
# network certifier's files, left out of word maps until its own rename is in; the locks' records; GLOSSARY.md's row;
# and the retired-words lints' examples.

[words]
# the test names, each whole
"test_no_verifier_of_record_walks_the_unrolled_circuit" = "test_no_verifier_walks_the_unrolled_circuit"
"test_a_period_of_statements_is_put_in_the_lean_form_by_the_verifier_of_record" = "test_a_period_of_statements_is_put_in_the_lean_form_by_the_verifier"
"test_the_verifier_of_record_holds_the_registered_history_root_to_the_writers_strings" = "test_the_verifier_holds_the_registered_history_root_to_the_writers_strings"
"test_the_verifier_of_record_holds_the_registered_history_root_to_the_writers_bodies" = "test_the_verifier_holds_the_registered_history_root_to_the_writers_bodies"
"test_the_verifier_of_record_samples_both_stages" = "test_the_verifier_samples_both_stages"
"test_the_verifier_of_record_serves_no_piece_that_takes_the_switch" = "test_the_verifier_serves_no_piece_that_takes_the_switch"

[[words_in]]
files = ["**/one_stage/m1_unit.py", "**/one_stage/served_verdicts.sh", "benchmarks/two_stage/pyproject.toml",
         "tests/test_verifier_cost.py", "tools/difftest/pyproject.toml", "**/verity_difftest/__init__.py",
         "tools/difftest/tests/test_example_port.py", "**/flock/prover/tests/test_lean_verifier.py",
         "**/spot/verifier/lean/lakefile.toml", "**/spot/verifier/lean/tests/test_wired_key_difftest.py",
         "**/spot/verifier/tests/test_two_stage.py"]
[words_in.words]
"verifier of record" = "verifier"

[[words_in]]
files = ["**/spot/prover/audit/template_audit.py"]
[words_in.words]
"Verifier of record" = "The verifier"

[[words_in]]
files = ["**/flock/prover/agreement/tool.py"]
[words_in.words]
"the verifier-of-record agreement job" = "the verifier's agreement job"

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, fixtures, patches, the Glossary's older-names
# rows, the retired-words lints' examples), files whose bytes a digest pins, lock files and the locks' records, and the
# network certifier's files.
exclude = ["tools/move/**", "**/fixtures/**", "**/*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock",
           "**/lean-audit.json", "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "**/flock/prover/tests/lean/InnerClaims.lean", "verity/protocols/accounting/certifier/**",
           "security/**/Certifier/**"]
