# The part of `verity/definitions/` a protocol names, into `verity/circuits/`: what `tools/move/layout.py --map
# tools/move/definitions_kept_map.toml` moves and rewrites.
#
# - Six directories move whole and laid out as they were: the primitive circuits' Definitions (`ops`), the GPUs' exact
#   semantics (`silicon`), the kernels, the universal circuit (`private_circuits`), and two Lake packages, the evaluator
#   (`evaluate`, `verity_evaluate`) and a circuit's requirement (`requirement`, `core_requirement`), each with its suite.
# - Each Python unit keeps its name (`ml.circuits.ops`, ...); `tests/test_boundaries.py` lists its new place beside the
#   old one, so the tree passes before and after the move.
# - A Lean module is named from its package's root, so no Lean module, declaration or lock record changes; what changes
#   in a lakefile or a manifest is a path to these packages.
# - Pinned files (`silicon/captures`, `silicon/hawkeye`) move unread, at either place.
# Nothing is edited or deleted, and no file is added. The format is `layout_map.toml`'s. `definitions_merge_map.toml`
# runs after this map, and `definitions_served_map.toml` after both.
[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/definitions/ops/" = "verity/circuits/ops/"
"verity/definitions/silicon/" = "verity/circuits/silicon/"
"verity/definitions/kernels/" = "verity/circuits/kernels/"
"verity/definitions/private_circuits/" = "verity/circuits/private_circuits/"
"verity/definitions/evaluate/" = "verity/circuits/evaluate/"
"verity/definitions/requirement/" = "verity/circuits/requirement/"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row
paths = ["verity/definitions/ops/", "verity/definitions/silicon/", "verity/definitions/kernels/", "verity/definitions/private_circuits/", "verity/definitions/evaluate/", "verity/definitions/requirement/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**",
           "verity/circuits/silicon/captures/**", "verity/circuits/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[modules]
# the renames [paths] implies (`layout.py --modules`)
"verity.definitions.evaluate" = "verity.circuits.evaluate"
"verity.definitions.kernels" = "verity.circuits.kernels"
"verity.definitions.ops" = "verity.circuits.ops"
"verity.definitions.private_circuits" = "verity.circuits.private_circuits"
"verity.definitions.requirement" = "verity.circuits.requirement"
"verity.definitions.silicon" = "verity.circuits.silicon"
