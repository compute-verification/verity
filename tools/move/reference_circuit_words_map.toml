# "reference circuit", the retired words (GLOSSARY.md: the reference training algorithm), as
# `tools/move/rename.py --map tools/move/reference_circuit_words_map.toml` renames them on `architecture`: the circuit a
# slowdown or inference-only guarantee measures training against (`c`, `r`, `C`), in the Slowdown, InferenceOnly,
# Accounting and Core Lean, prose only.
# It leaves every Lean name (none carries the words), "the reference training circuit" of `Assumptions/Layered.lean`, a
# Flock layout test's `_reference_circuit_description` (another sense: the layout's expected text), the locks' freeze
# reasons, the lint's own lists and the Glossary's rows.

[words]

[[words_in]]
files = ["security/**/*.lean"]
[words_in.words]
"reference circuits" = "reference training algorithms"
"reference circuit" = "reference training algorithm"

[rewrite]
exclude = ["tools/move/**", "**/lean-audit.json", "**/lakefile.*", "**/lake-manifest.json", "GLOSSARY.md",
           "tests/test_retired_terms.py", "tests/lint/test_repo_retired_terms.py",
           "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[keep]
patterns = []
strings = []
