# Pearl-C4, an experimental PoUW variant, out of `benchmarks/`: what `tools/move/layout.py --map
# tools/move/pearl_c4_experimental_map.toml` moves and rewrites.
#
# Pearl-C4's sm_120 kernel and its host references, `benchmarks/pouw/pearl_c4/{pearl_c4.cu,build.sh,sass.py,dev.py,
# run.sh,twin.py,fixture.py}`, become `verity/protocols/experimental/pearl_c4/prover/kernels/`, its vectorised F1'
# `f1_fast.py` the protocol's `prover/`, and the tests of those files the protocol's `tests/`. `run.sh` goes with
# `dev.py`: `build.sh` ships both beside the cubin and the card runs them there. What drives a run or replays one stays
# in `benchmarks/pouw/pearl_c4/` (the rows whose old and new paths are the same): `ship.sh`, which makes a build's tree
# a run's source; `replay.py`, `real.py` and `real_table.py`, which replay a device run's
# dump or a model's captures in the clear and read the benchmarks' settings registry; the README, which documents
# those; and `real.py`'s and `replay.py`'s tests. Kernel sources are rewritten, each only where a relative `#include`
# crosses the move's edge. What stays and names `pearl_c4/` as its own directory is not rewritten ([split]).
#
# Pearl-C4's scheme (`verity/protocols/accounting/pouw/prover/schemes/pearl_c4.py`, `pearl_c4_c_L.py`), its circuit
# (`prover/circuit/pc4.py`), its vectors and their tests stay in PoUW's package: PoUW's own circuits (`pc8`, `cap`,
# `rowk`, `plan`, `pearl_plus_tile`) load `pc4`, which loads the scheme, and PoUW loads nothing of `experimental/`. No
# file is split or deleted. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"benchmarks/pouw/pearl_c4/" = "verity/protocols/experimental/pearl_c4/prover/kernels/"
"benchmarks/pouw/pearl_c4/f1_fast.py" = "verity/protocols/experimental/pearl_c4/prover/f1_fast.py"
"benchmarks/pouw/pearl_c4/README.md" = "benchmarks/pouw/pearl_c4/README.md"
"benchmarks/pouw/pearl_c4/ship.sh" = "benchmarks/pouw/pearl_c4/ship.sh"
"benchmarks/pouw/pearl_c4/replay.py" = "benchmarks/pouw/pearl_c4/replay.py"
"benchmarks/pouw/pearl_c4/real.py" = "benchmarks/pouw/pearl_c4/real.py"
"benchmarks/pouw/pearl_c4/real_table.py" = "benchmarks/pouw/pearl_c4/real_table.py"
"benchmarks/pouw/tests/test_pearl_c4_f1_fast.py" = "verity/protocols/experimental/pearl_c4/tests/test_pearl_c4_f1_fast.py"
"benchmarks/pouw/tests/test_pearl_c4_fixture.py" = "verity/protocols/experimental/pearl_c4/tests/test_pearl_c4_fixture.py"
"benchmarks/pouw/tests/test_pearl_c4_sass.py" = "verity/protocols/experimental/pearl_c4/tests/test_pearl_c4_sass.py"
"benchmarks/pouw/tests/test_pearl_c4_twin.py" = "verity/protocols/experimental/pearl_c4/tests/test_pearl_c4_twin.py"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row
paths = []

[split]
# A reference to `benchmarks/pouw/pearl_c4/`, which the map splits, follows the kernels unless its row here names the
# part that stays: "old file: old directory" = why, or { to, why }.
"benchmarks/pouw/pearl_c4/build.sh: benchmarks/pouw/pearl_c4" = "the status of the sources it builds, the kernel directory"
"verity/protocols/accounting/pouw/prover/kernels/pearl_c/README.md: benchmarks/pouw/pearl_c4" = "the kernel that includes sha512.cuh"

[drop]
paths = []

[rewrite]
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json",
           "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**",
           "archive/**", "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json",
           "verity/definitions/silicon/captures/**", "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json", "benchmarks/network_e2e/tests/data/**",
           "adapters/vllm/manifests/**", "adapters/vllm/workloads/**", "adapters/vllm/data/**",
           "adapters/vllm/verity_vllm/pins/**", "adapters/vllm/tools/migrate/superseded_quarantine.py", "adapters/vllm/tests/migrate/test_superseded_quarantine.py",
           "**/*.lean", "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md",
           "**/lake-manifest.json", "adapters/vllm/manifests/definitions.json"]
root_prefixes = ["/opt/vy-verifier/current/"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"benchmarks.pouw.pearl_c4" = "verity.protocols.experimental.pearl_c4.prover.kernels"
"benchmarks.pouw.pearl_c4.f1_fast" = "verity.protocols.experimental.pearl_c4.prover.f1_fast"
"benchmarks.pouw.pearl_c4.real" = "benchmarks.pouw.pearl_c4.real"
"benchmarks.pouw.pearl_c4.real_table" = "benchmarks.pouw.pearl_c4.real_table"
"benchmarks.pouw.pearl_c4.replay" = "benchmarks.pouw.pearl_c4.replay"
"benchmarks.pouw.tests.test_pearl_c4_f1_fast" = "verity.protocols.experimental.pearl_c4.tests.test_pearl_c4_f1_fast"
"benchmarks.pouw.tests.test_pearl_c4_fixture" = "verity.protocols.experimental.pearl_c4.tests.test_pearl_c4_fixture"
"benchmarks.pouw.tests.test_pearl_c4_sass" = "verity.protocols.experimental.pearl_c4.tests.test_pearl_c4_sass"
"benchmarks.pouw.tests.test_pearl_c4_twin" = "verity.protocols.experimental.pearl_c4.tests.test_pearl_c4_twin"
