# `drew` becomes `sampled` in the Lean's names; a string literal keeps its bytes.
[words]

[[words_in]]
files = ["*.lean"]
[words_in.words]
"drew" = "sampled"

[keep]
patterns = ['"(?:[^"\\\n]|\\.)*\bdrew\b(?:[^"\\\n]|\\.)*"']

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "**/fixtures/**", "fixtures/**", "*.patch", "uv.lock", "tools/research/src/research/store/**", "tests/tools/move/**", "GLOSSARY.md"]
