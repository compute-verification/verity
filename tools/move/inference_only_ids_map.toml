# The inference-only policy's names that no move renames: what `tools/move/rename.py --map
# tools/move/inference_only_ids_map.toml` renames, on a tree the moves of `inference_only_map.toml` and
# `inference_only_check_map.toml` have run on (its files are named where those moves put them). `move_check.py` certifies a word that renames a path, a module or a Lean declaration;
# these rename an executable, a constant or a lock's reason, so the change they make is an ordinary one, reviewed as such.
# - `nci-` becomes `inference-only-` where it starts a name in kebab case: the check's executables (`nci-check`, the six
#   difftests') and `nci-phases`, in the lakefiles, the scripts that build and run them, and every mention.
# - The constants `NCI_SCRIPTS`, `NCI_CONSTS`, `NCI_CONSTANTS`, `NCI_PACKAGE`, `NCI_REFERENCE` and `NCI_CHECK`, and the
#   variable `NCI_COST_FLAGS`.
# - The check's lock's `runs` reasons, which name the check's Lean and its Python reference.
# - θ's names that `theta_map.toml` leaves: the Python reference's `check_baseline`, `check_baseline_unrolled` and
#   `expand_baseline` become `check_theta`, `check_theta_unrolled` and `expand_theta`; the executable
#   `nci-baseline-difftest` becomes `inference-only-theta-difftest`; and `BaselineRegistered`, an older name that three
#   files still give `ThetaRegistered`, becomes that name.
# - The check's directory in `AGENTS.md` and in the verifier package's docstring, which name it from the protocols'
#   directory and from the package's own: `inference_only/verifier/lean/` and `lean/`.
# What stays: a constant named `NCI` alone (three files name the check's package or the policy's protocol id so), a hand
# edit, since one word has one map and `inference_only_map.toml` has this one's; `benchmarks/nci/`'s own names and the
# slowdown calculator's `draft:nci-search` ([keep_in], [keep]); the ids that end in a version (`verity/nci-glm/v1`),
# until a format version ([keep]); and the lifecycle example's own `check_baseline`, its registration's check
# ([keep_in]).

[words]
"NCI_SCRIPTS" = "INFERENCE_ONLY_SCRIPTS"
"NCI_CONSTS" = "INFERENCE_ONLY_CONSTS"
"NCI_CONSTANTS" = "INFERENCE_ONLY_CONSTANTS"
"NCI_COST_FLAGS" = "INFERENCE_ONLY_COST_FLAGS"
"NCI_PACKAGE" = "INFERENCE_ONLY_PACKAGE"
"NCI_REFERENCE" = "INFERENCE_ONLY_REFERENCE"
"NCI_CHECK" = "INFERENCE_ONLY_CHECK"
"check_baseline" = "check_theta"
"expand_baseline" = "expand_theta"
"baseline-difftest" = "theta-difftest"
"BaselineRegistered" = "ThetaRegistered"

# A name in kebab case, whole: `nci-check`, never `inference_only-check`.
[[words_in]]
files = ["*"]
words = { "nci-" = "inference-only-" }

# The check's lock: its `runs` reasons (`rename.py` leaves a lock's records to `check.py --update --moved`).
[[words_in]]
files = ["verity/protocols/policy/inference_only/verifier/lean/lean-audit.json"]
words = { "NciCheck" = "InferenceOnlyCheck", "Nci.Complies'" = "InferenceOnly.Complies'", "nci_reference" = "inference_only_reference", "Baseline" = "Theta" }

# The check's place, where a file names it from another directory than the root, so that the move of its directory
# (`inference_only_check_map.toml`), which follows paths written whole, left the directory the move emptied.
[[words_in]]
files = ["AGENTS.md"]
words = { "`inference_only/verifier/inference_only/`" = "`inference_only/verifier/lean/`" }
[[words_in]]
files = ["verity/protocols/policy/inference_only/verifier/__init__.py"]
words = { "(`inference_only/`)" = "(`lean/`)" }
[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the rulings), the Glossary's table
# of older names, the retired-terms lints' own examples, the frozen backends, files whose bytes a digest pins
# (`rename.py` repins a `TRUSTED.sha256` line itself), lock files, move_check's own tests, and the Lean tools' fixtures,
# locks as they were on a past tree, which their tests read as such.
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "GLOSSARY.md",
           "tests/test_retired_terms.py", "fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock",
           "tools/verity/check/tests/test_move_check.py", "tools/verity/lean/tests/fixtures/**"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+',
            'lanes/[\w.-]+', 'draft:[\w.-]+']
strings = []

[keep_in]
"benchmarks/nci/**" = ["nci-"]
"demos/lifecycle/**" = ["check_baseline"]
