[rewrite]
# Never rewritten: records of what was, and files whose bytes a digest pins.
exclude = ["*.lean", "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**",
           "benchmarks/numerical/reports/**", "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json",
           "verity/ml/circuits/silicon/captures/**", "verity/ml/circuits/silicon/hawkeye/**",
           "integrations/vllm/manifests/**", "integrations/vllm/workloads/**", "integrations/vllm/data/**",
           "integrations/vllm/verity_vllm/pins/**",
           "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py",
           "tools/research/src/research/store/moves.json",
           "benchmarks/tc_probe_fp4/fp4_emulation_1ad1aaa2.py",
           # a recorded endpoint's registrations: the advice root binds the compiler's name as it was registered
           "benchmarks/network_e2e/tests/data/**"]
keep_dotted = ["verity_pouw.ncp_linear"]
# registered.py's docstring names the kernel as `pouw_cuda/registered_rows.cu`; moved a level deeper, the file-relative
# rewrite (`../pouw_cuda/...`) is not one move_check reads in prose, so the name stays as written
keep_in = { "integrations/vllm/verity_vllm/proto*/**registered.py" = ["integrations/vllm/verity_vllm/protocol_options/pouw_cuda/registered_rows.cu"] }
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]
