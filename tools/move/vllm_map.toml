# The vLLM integration's first layout move: what `tools/move/layout.py --map tools/move/vllm_map.toml` moves, renames and
# rewrites (Daniel, 24 Oct 05:34Z, thread 1792820329.429599: "articulate a vision for how that part of the repository should
# be structured"; the vision is note:20261024T0615Z-draft-verity-vllm-vision).
#
# Whole packages and modules move inside `integrations/vllm/`; nothing is split, edited or deleted, and no file is added:
# - `protocols/` mirrors `verity.core.protocols`, one package per protocol, each the prover side of that verifier. The
#   flat `protocol_options/` (25 `pouw_*` modules) becomes `protocols/pouw/` with its two schemes' packages `h1/` and
#   `pearl_c/`; the linear site (`linear/`) joins it; `store/`, the remote bandwidth audit's prover, becomes
#   `protocols/remote_bandwidth/`. The adapters keep their module names (`protocols.pouw`, `.pous`, `.sampled_proofs`),
#   which `protocols.adapter` imports as `f"{__name__}.{name}"`.
# - `predict/`, the Program ahead of time, joins `program/`; `collectives/`, the communicator sites, joins `engine/`.
# - `LLM`, the public engine, is `verity_vllm/llm.py`, and its engine spec `engine/spec.py`.
# - The tests move with what they test, file names unchanged (a test directory is a package, and a new one would need an
#   `__init__.py` this move doesn't add): `tests/protocols/` holds every protocol's tests until each package's tests split.
# The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }

