# The move of the inference-only policy's calculators: what `tools/move/layout.py --map tools/move/nci_rho_map.toml`
# moves and rewrites.
#
# `verity/protocols/inference_only/nci/` and `verity/protocols/inference_only/rho/` are calculators and the data they
# read: `nci/` holds the training methods' data and the figures the policy is argued with, and `rho/` computes the
# slowdown's lower bound from a registry of hardware, models and scenarios. Neither is a verifier, a prover or a device:
# no unit rule reads them, nothing under `verity/` imports their code, and their readers are benchmarks. They are the
# measuring side, so they go to `benchmarks/nci/` and `benchmarks/rho/`, and `verity/protocols/inference_only/` keeps
# the policy's check alone.
#
# - Each directory moves whole and laid out as it was: its modules, data, tests, `pyproject.toml` and `uv.lock`. Each
#   is a suite and no workspace member, so no distribution and no root `uv.lock` entry changes.
# - The two go in one map: each reads the other's files by a path relative to its own, which holds only while they sit
#   side by side.
# - No reader imports either by a dotted name: the benchmarks that import `rho` put its directory on `sys.path` by its
#   path, which the rewrite follows.
# - One Lean file is rewritten, in a doc comment: `security/Definitions/Nci/Guarantees/Remote.lean` names
#   `nci/tiers.py` from the root, and `tests/test_doc_paths.py` reads that path ([rewrite] include). A second is
#   included for the same reason, `security/Definitions/Nci/Remote.lean`: where its doc comments name the two
#   directories by the paths this map moves they are rewritten, and where they name `benchmarks/` already nothing
#   changes. No Lean module, declaration or lock record changes; `security/lean-audit.json` changes in the `test`
#   paths of the three conjectures whose tests are `nci`'s.
# - One file that names `rho/` is left as it is ([rewrite] exclude):
#   `benchmarks/training_slowdown/tests/test_one_calculator.py`. It writes the calculator's path in parts inside a toy
#   source, which the rewrite would shorten from six parts to four, and `move_check` takes no such edit as a path's.
#   And it finds a reach of the calculator by the path part `inference_only`, which `benchmarks/rho` lacks, so its
#   check changes with its paths.
# - The tree file is left as it is too ([rewrite] exclude): `tests/tree.toml`, whose not-yet lines name each path where
#   it is before its move. A move doesn't edit it: the two lines of this move's directories warn once it lands, and are
#   top's to delete.
# - No directory is split, so the map has no [split] table.
# Nothing is edited or deleted, and no file is added. What no row can write stays for the move's second commit, by
# hand: the two rows of `benchmarks/README.md`, which lists every directory of `benchmarks/`, and that test's paths
# and check. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/inference_only/nci/" = "benchmarks/nci/"
"verity/protocols/inference_only/rho/" = "benchmarks/rho/"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row, and each row is a
# directory's, so a file only a branch has under one is carried where its directory goes
paths = ["verity/protocols/inference_only/nci/", "verity/protocols/inference_only/rho/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`), and so are the two whose doc comments name a moved file or
# directory from the root; lakefiles and Lake manifests are too. The last two entries are the test and the tree file
# the header names.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean",
           "benchmarks/training_slowdown/tests/test_one_calculator.py", "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json",
           "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean",
           "security/Definitions/Nci/Guarantees/Remote.lean", "security/Definitions/Nci/Remote.lean"]

[modules]
# the renames [paths] implies (`layout.py --modules`): each directory as a dotted path. No file names either.
"verity.protocols.inference_only.nci" = "benchmarks.nci"
"verity.protocols.inference_only.rho" = "benchmarks.rho"
