# The proof block's fixed words: what `tools/move/rename.py --map tools/move/block_fixed_map.toml` renames (a unit is
# a proof block). The premise `Accounting.Assumptions.TS.UnitFixed`, that a run's fixed and folded words are at least
# those of the blocks it didn't sample, becomes `BlockFixed`, and the guarantee `UnitFixedOfWords` and its lemma
# follow. Declarations keep their place in the locks' records: `rename.py --moves` prints the renames that `check.py
# --update --moved` takes.
[words]
"UnitFixed" = "BlockFixed"
"unitFixed" = "blockFixed"

[rewrite]
# host_map.toml's: records of what was (the earlier moves and their maps, changelogs, the rulings), the frozen backends,
# files whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']
strings = []

[keep_in]
