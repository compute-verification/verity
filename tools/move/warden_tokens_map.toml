# The retired name "warden", third step: the tokens the two certified moves leave (`warden_term_map.toml` renames the
# prose, `warden_map.toml` the paths, modules and Lean declarations). Each kind below is a name a move's certificate
# can't cover, so this map's commit is generated and reviewed, not certified: run it after those two.
#
# The tokens, by kind:
# - constants (`WARDEN`, `WARDEN_REQUESTS`, `WARDEN_SEED`): `WARDEN` as one part of the name becomes
#   `NETWORK_CERTIFIER`. Each name has its own row, and the name `WARDEN` one row for each form it is written in
#   (`corpus.WARDEN`, `WARDEN =`, a script's `$WARDEN`), since the word alone is `warden_map.toml`'s and no row here is
#   keyed on it;
# - hyphenated names of tools, threads and scratch directories (`warden-serve`, `warden-zk`, `warden-publisher`);
# - plurals in identifiers (`wardens`, a test's `..._the_wardens_...`);
# - sentences in string literals (a message, a help text, a log line), which say "network certifier" as prose does;
# - the attributes the kept flags' declarations name (`dest=`: `a.network_certifier_run`, `a.network_certifier`), and a
#   function and a parameter of that name;
# - names that programs only write, which nothing reads back by name: a kept run's file names, a record's keys, a
#   negative's name, a dictionary's keys and a test's own values, each with its row below;
# - the word alone in quotes where programs only write it: the process label the serve program gives the stall
#   probe, the key of two programs' summaries, and the directory `scan_zk.py` and `egress_zk.py` make under `--out`;
#   and one path's segment, the scratch directory `scan_zk.sh` rehearses into, which no later run reads.
#   No row can take these, since the same quoted word is a link window's kind, the gate's device value, a kept
#   trace's key and a class, and the same segment is a kept run's directory, which [keep] holds: they are renamed
#   by hand in the change that runs this map. A run kept from before it holds the older label, key or directory
#   name.
#
# Kept bytes ([keep]), each a name that something a program must agree with holds: a file or a key a program in the
# tree reads back from a kept run, a caller's launch line, a signed value, or bytes a digest takes in.
# `warden_map.toml`'s header says what to regenerate to rename one:
# - domain tags, format ids, circuit names and the names staged into a circuit; the word as a whole value, a path's
#   segment or a class;
# - a report's key and a kept run's file that a program reads back (`"warden_run"`, quoted; `warden.json`);
# - the gate's verb `warden-rehearse`, which the deployed gate serves, and `warden-fails`, the link name of a window's
#   fails certificate (`<link>-fails`), which signed certificates hold;
# - the trace corpus's labels (`warden-heavy`, `warden-smallkv`);
# - a message code makes from a kept value (`f"device {device}"`, `f"on the {path} path"`): no phrase below rewords
#   one, and a test builds its text from the value;
# - the names a caller outside the tree sets, in a launch line or a settings file: the environment variables
#   `A5_WARDEN_RUN`, `CR_WARDEN_RUN`, `N2_WARDEN_RUN`, `SC_WARDEN_RUN`, `A5_WARDEN_UNITS` and
#   `WARDEN_SERVE_C_ALLOCATOR`, and the flags `--warden-run` and `--warden`. A map of their own renames them with
#   their callers.
#
# Not this concept, and left as they are: as `warden_map.toml` has them.

