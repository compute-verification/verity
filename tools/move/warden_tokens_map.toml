[keep]
patterns = [
    '[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b',          # a domain tag or a format id
    'note:[\w./-]+',
    'art:[0-9a-f]+',
    'cursor/[\w./-]+',                                # a branch
    '"warden"',                                       # the word as a whole value
    """'warden'(?![a-z])""",
    '''["']warden:''',
    '(?<!certifier/)(?<=/)warden(?![\w-]|\.\w)',      # ... as a path's segment
    '(?<![\w./-])warden/(?=[\w$<{*])',
    'CR_PATH(?::-\}")?(?: = |=)warden',               # ... as a command's value, which reaches a quoted one
    '--class (?:test\|served\|)?warden',
    'N2_CLASS=warden',
    'negatives\.py warden',
    'client or warden',
    'served or warden\)',
    '''["'/]warden_(?:run(?!": None\}\)\))|check|endpoint|endpoint_served|certificates|cores|cores_busy|cpu_s|invol|cost|costs)["'/]''',
    'warden\.json\b',
    'warden-(?:registration|rehearse|fails|heavy|smallkv)',
    '(?m)^\| "warden", "network warden".*$',          # the Glossary's row of older names
]
strings = [
    "WardenRowIdentity",
    "unit/warden-row",
    "unit/a5-warden",
    "a5-warden/rest/",
    "prover-root-under-the-wardens-certificate",
    "not-the-wardens",
    "window-naming-another-warden-root",
    "functions as an active warden",
    "an *active warden*",
    "a passive warden",
    "this key reads only: a warden rehearsal",
    '"on the warden path"',
]

[rewrite]
exclude = [
    "tools/move/**",
    "tools/research/**",
    "tests/test_retired_terms.py",
    "archive/**",
    "**/fixtures/**",
    "**/CHANGELOG.md",
    "*.patch",
    "**/TRUSTED.sha256",
    "uv.lock",
    "**/*.lock",
]
