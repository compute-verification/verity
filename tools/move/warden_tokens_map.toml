[keep]
patterns = [
    '[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b',          # a domain tag or a format id
    'note:[\w./-]+',
    'art:[0-9a-f]+',
    'cursor/[\w./-]+',                                # a branch
    '"warden"',                                       # the word as a whole value
    """'warden'(?![a-z])""",
    '''["']warden:''',
    '(?<!certifier/)(?<!"g1/)(?<=/)warden(?![\w-]|\.\w)',   # ... as a path's segment, a test's own value apart
    '(?<![\w./-])warden/(?=[\w$<{*])',
    'CR_PATH(?::-\}")?(?: = |=)warden',               # ... as a command's value, which reaches a quoted one
    '--class (?:test\|served\|)?warden',
    'N2_CLASS=warden',
    'negatives\.py warden',
    'client or warden',
    'served or warden\)',
    '''["']warden_run["'](?!: None\}\)\))''',        # a report's key, quoted; a namespace's field written as one apart
    'warden\.json\b',
    'warden-(?:rehearse|fails|heavy|smallkv)',
    '(?<![A-Z0-9])(?:A5|CR|N2|SC)_WARDEN_RUN(?![A-Z0-9_])',   # a variable a caller outside the tree sets, which the
                                                      # row for `WARDEN_RUN` would reach
    '--warden(?:-run)?(?![\w-])',                            # ... and a flag such a caller passes
    '(?m)^\| "warden", "network warden".*$',          # the Glossary's row of older names
]
strings = [
    "WardenRowIdentity",
    "unit/warden-row",
    "unit/a5-warden",
    "a5-warden/rest/",
    "functions as an active warden",
    "an *active warden*",
    "a passive warden",
    "this key reads only: a warden rehearsal",
    '"on the warden path"',
]

