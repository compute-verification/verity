# The retired name "warden", third step: the tokens the two certified moves leave (`warden_term_map.toml` renames the
# prose, `warden_map.toml` the paths, modules and Lean declarations). Each kind below is a name a move's certificate
# can't cover, so this map's commit is generated and reviewed, not certified: run it after those two.
#
# The tokens, by kind:
# - constants and environment variables (`WARDEN`, `WARDEN_REQUESTS`, `CR_WARDEN_RUN`, `A5_WARDEN_UNITS`): `WARDEN` as
#   one part of the name becomes `NETWORK_CERTIFIER`. Each name has its own row, and the name `WARDEN` one row for each
#   form it is written in (`corpus.WARDEN`, `WARDEN =`, a script's `$WARDEN`), since the word alone is
#   `warden_map.toml`'s and no row here is keyed on it;
# - flags and what argparse makes of them (`--warden-run` and `a.warden_run`, `--warden` and `a.warden`);
# - hyphenated names of tools, threads and scratch directories (`warden-serve`, `warden-zk`, `warden-publisher`);
# - plurals in identifiers (`wardens`, a test's `..._the_wardens_...`);
# - sentences in string literals (a message, a help text, a log line), which say "network certifier" as prose does.
#
# Kept bytes ([keep]), each a name something outside a commit's reach holds; `warden_map.toml`'s header says what to
# regenerate to rename one:
# - domain tags, format ids and circuit names; the word as a whole value, a path's segment or a class;
# - a record's keys and a kept run's file names (`"warden_run"`, `warden_check`, `warden.json`,
#   `warden-registration.json`) and the negatives' names;
# - the gate's verb `warden-rehearse` and its refusal `warden-fails`: the deployed gate serves them;
# - the trace corpus's labels (`warden-heavy`, `warden-smallkv`);
# - a message code makes from a kept value (`f"{label} thread"`, `f"device {device}"`), which a test spells whole: no
#   phrase below rewords "warden thread", "warden ticker" or "device warden".
#
# Not this concept, and left as they are: as `warden_map.toml` has them.

