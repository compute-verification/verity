# The pouw verifier package's names, whole tokens only: its namespace, modules, Lake package and targets, executables and suite, wherever code spells them.
[words]

[[words_in]]
files = ["*"]
[words_in.words]
"PouwCheck" = "PouwVerifier"
"pouw-check" = "pouw-verifier"
"pouw_check" = "pouw_verifier"

[keep]
patterns = []

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "**/fixtures/**", "fixtures/**", "*.patch", "tools/research/src/research/store/**", "tests/tools/move/**", "GLOSSARY.md"]
