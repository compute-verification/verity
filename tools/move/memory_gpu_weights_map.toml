# The seeded weights' generator beside the prover that loads it: what `tools/move/layout.py --map
# tools/move/memory_gpu_weights_map.toml` moves and rewrites.
#
# `served_weights.py` generates the seeded weights PoUS's store holds (`SHAPES`, `tensors`, `stream`, `manifest`), and
# PoUS's prover loads it by its module name (`p2_store/store.py`'s `GENERATOR`). It goes to PoUS's prover as a module
# of `verity`, since every reader names it by module from the root (`-m`, an `importlib` default, an import);
# `p2/` is an import root of its own (`p2_store`), which those readers would have to put on `sys.path`. The staging
# decode's timing, the receipts kernel and the bandwidth stage stay in `benchmarks/torch_gpu/p2_stage/`. No file is
# split, edited beyond its
# paths or deleted. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"benchmarks/torch_gpu/p2_stage/served_weights.py" = "verity/protocols/accounting/pous/prover/served_weights.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, lock files and Lean sources.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "**/*vectors*.json",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "tools/research/src/research/store/moves.json",
           "**/*.lean", "tests/tree.toml"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"benchmarks.torch_gpu.p2_stage.served_weights" = "verity.protocols.accounting.pous.prover.served_weights"
