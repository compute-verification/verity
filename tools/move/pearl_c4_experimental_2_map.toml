# Pearl-C4's scheme, tile circuit and vectors out of PoUW's package, the second step after
# `pearl_c4_experimental_map.toml`: what `tools/move/layout.py --map tools/move/pearl_c4_experimental_2_map.toml` moves
# and rewrites.
#
# Pearl-C4's tile check as a circuit (`prover/circuit/pc4.py`) and its row cut along k (`pc4_rowk.py`), each with its
# circuit-check sidecar, and its scheme's scalar reference (`prover/schemes/pearl_c4.py`, `pearl_c4_c_L.py`) become
# `verity/protocols/experimental/pearl_c4/prover/`; its pinned vectors (`pearl_c4_vectors.py`, `vectors/pearl_c4.json`,
# and its public input regions' `pearl_c4_regions_vectors.py`, `vectors/pearl_c4_regions.json`) and their tests (the
# scheme's `test_pouw_pearl_c4.py` and the circuit's `test_circuit_pc4*.py` and `test_circuit_whole4_lean.py`) its
# `tests/`, as Dither's are laid out. What PoUW's other circuits shared with `pc4` (`tile_units`) and what the row cut
# shares (`rowk`) stay, so PoUW loads nothing of `experimental/`. No file is split or deleted. The format is
# `layout_map.toml`'s.

