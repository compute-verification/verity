# The Lean names pass: written by `python3 tools/move/lean_names_pass.py`, run by
# `python3 tools/move/rename.py --map tools/move/lean_names_pass_map.toml`. Edit the script, not this file.
# Declarations keep their place in the locks' records: `rename.py --moves` prints the renames that
# `tools/verity/lean/check.py --update --moved` takes.

[words]
"Definitions.Accounting" = "Definitions.ResourceAccounting"
"Definitions/Accounting" = "Definitions/ResourceAccounting"
"Properties.Accounting" = "Properties.ResourceAccounting"
"Properties/Accounting" = "Properties/ResourceAccounting"
"Proofs.Accounting" = "Proofs.ResourceAccounting"
"Proofs/Accounting" = "Proofs/ResourceAccounting"
"Definitions.Assumptions.Accounting" = "Definitions.Assumptions.ResourceAccounting"
"Definitions/Assumptions/Accounting" = "Definitions/Assumptions/ResourceAccounting"
# The network attester (GLOSSARY.md: the Lean package `NetworkCertifier` and the names that follow it), with
# the Python names that follow the Lean's (`NetworkCertifierParams`, `NetworkCertifierProfile`).
"NetworkCertifier" = "NetworkAttester"
"networkCertifier" = "networkAttester"

# --- 2. The areas that take their protocol's name: registration's files leave the accounting area.
[[words_in]]
files = ["*"]
[words_in.words]
"Definitions.Accounting.Registration" = "Definitions.Registration"
"Definitions/Accounting/Registration" = "Definitions/Registration"
"Properties.Accounting.Registration" = "Properties.Registration"
"Properties/Accounting/Registration" = "Properties/Registration"

# --- 1. The ontology's names in the Lean.
# The resource accounting layer's area: its modules by their tree's prefix, everywhere.

# The root namespace, in the 665 Lean files whose every `Accounting` is it (a glob matches the
# area's directory under its old name and its new, so the map reruns as a no-op).
[[words_in]]
files = ["security/Definitions/[AR]*ccounting/**", "security/Definitions/Assumptions/**", "security/Definitions/Certifier/**", "security/Definitions/Compose/**", "security/Definitions/Core/**", "security/Definitions/Poub/**", "security/Definitions/Pous/**", "security/Definitions/Pouw/**", "security/Definitions/Registration/**", "security/Definitions/Slowdown/**", "security/Proofs/[AR]*ccounting/**", "security/Proofs/Certifier/**", "security/Proofs/Compose/**", "security/Proofs/Core/**", "security/Proofs/Flock/SoundAtBridge/**", "security/Proofs/Poub/**", "security/Proofs/Pous/**", "security/Proofs/Pouw/ChainWork.lean", "security/Proofs/Pouw/CoinFlow.lean", "security/Proofs/Pouw/CoinFlow/**", "security/Proofs/Pouw/FillerLuck.lean", "security/Proofs/Pouw/HMu.lean", "security/Proofs/Pouw/HMu/**", "security/Proofs/Pouw/Headline/**", "security/Proofs/Pouw/HeadlineDc/**", "security/Proofs/Pouw/LiveCredit.lean", "security/Proofs/Pouw/MonitoringPeriod.lean", "security/Proofs/Pouw/MonitoringPeriod/**", "security/Proofs/Pouw/MonitoringPeriodJ10R.lean", "security/Proofs/Pouw/MonitoringPeriodJ10R/**", "security/Proofs/Pouw/MonitoringPeriodJ10RStrata.lean", "security/Proofs/Pouw/MonitoringPeriodJ10RStrata/**", "security/Proofs/Pouw/PerRunJoint.lean", "security/Proofs/Pouw/PerRunNecessity.lean", "security/Proofs/Pouw/PerRunPouw.lean", "security/Proofs/Pouw/PerRunPriced.lean", "security/Proofs/Pouw/PerRunStop.lean", "security/Proofs/Pouw/PerRunTruncation.lean", "security/Proofs/Pouw/Pouw.lean", "security/Proofs/Pouw/PouwWitness.lean", "security/Proofs/Pouw/PouwWork.lean", "security/Proofs/Pouw/RequirementPouw.lean", "security/Proofs/Pouw/ServedFreed.lean", "security/Proofs/Pouw/ServedFreed/**", "security/Proofs/Pouw/ServedValues.lean", "security/Proofs/Pouw/ServedValues/**", "security/Proofs/Pouw/ServedWork.lean", "security/Proofs/Pouw/ServedWork/**", "security/Proofs/Pouw/TS.lean", "security/Proofs/Pouw/TS/**", "security/Proofs/Properties/**", "security/Proofs/Registration/**", "security/Proofs/Slowdown/**", "security/Properties/[AR]*ccounting/**", "security/Properties/Attest.lean", "security/Properties/Certifier/**", "security/Properties/Compose/**", "security/Properties/InferenceOnly/**", "security/Properties/Poub/**", "security/Properties/Pous/**", "security/Properties/Pouw/**", "security/Properties/Ties.lean", "security/Properties/Verity/**"]
[words_in.words]
"Accounting" = "ResourceAccounting"

# Outside the Lean, the root's names at the start of a dotted name.
[[words_in]]
files = ["*.json", "*.py", "*.md", "*.toml", "*.sh", "*.txt"]
[words_in.words]
"Accounting." = "ResourceAccounting."

# The network attester in the Lean's prose; a string literal keeps its bytes ([keep]): a verifier's message.
# `network_certifier` stays: in the Lean it names the Python modules, which keep their names.
[[words_in]]
files = ["*.lean"]
[words_in.words]
"network certifiers'" = "network attesters'"
"network certifier's" = "network attester's"
"network certifiers" = "network attesters"
"network certifier" = "network attester"
"Network certifier" = "Network attester"

# --- 3. The older words left in the Lean's names.
[[words_in]]
files = ["security/Proofs/Flock/EndToEnd/Period/Union.lean", "security/Proofs/Flock/EndToEnd/**", "security/Proofs/WeightSecurity/Stop.lean"]
[words_in.words]
"monitoringPeriod_monitoringPeriod" = "monitoringPeriod_horizon"

[keep_paths]
# PoUS's own `Pous.Accounting` keeps its directories, though some of its files open the root namespace.
"security/*/Pous/Accounting*" = ["Accounting"]

[keep]
patterns = [
    '[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b',
    '(?:Pous|Flock|Soundness|FlockSoundness)[./]Accounting\b',
    '"(?:(?!NetworkCertifier)(?:[^"\\\n]|\\.|\\\n))*[Nn]etwork certifier(?:(?!NetworkCertifier)(?:[^"\\\n]|\\.|\\\n))*"',
    '\*\*Accounting\.\*\*',
]

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "**/fixtures/**", "fixtures/**", "*.patch",
           "**/TRUSTED.sha256", "uv.lock", "tools/research/src/research/store/**"]
