# compute-accounting's rows of the examples-and-benchmarks reorg (note:memory-accounting/20261027T0040Z-draft-reorg-examples-
# benchmarks, phase 1): what `tools/move/layout.py --map tools/move/reorg_compute_map.toml` moves and rewrites. `examples/<name>/`
# holds one end-to-end example each, a protocol or composite on a workload and a placement with its commands (Daniel, 25 Oct);
# `benchmarks/` holds measurement only.
#
# - `benchmarks/all_protocols` (`onsite` on the torch_loop toy) stays: TORCHLOOP-OUT deletes it with the toy.
# - `benchmarks/e2e_h200` (the one-H200 walking skeleton's driver and its CPU replay) is `examples/h200/`, and
#   `benchmarks/e2e_demo` (its interfaces: the drawn-unit replay bundle and the block record, with their schemas) is
#   `examples/h200/interfaces/`, a suite nested in the example's. Their modules keep their names (`e2e_h200`,
#   `verity_e2e_demo`), which `benchmarks/one_stage` and `benchmarks/network_traces` reach by path.
# - PoUW's sub-examples stay for phase 2: `benchmarks/pouw`'s own suite reads them (served_zk, h1_prove, h1_lanes,
#   pearl_c_vllm's e2e.py, served_h1's coins.py), and `clear` and `hidden_zk` are tools other trees import or run. The window
#   on stand-in values (`benchmarks/pouw/e2e_120`) is dead, and #5032 deletes it.
# - The judge (`benchmarks/judge.py`) and its latency table stay: benchmarks/numerical's suite runs the judge.
# - An example's directory spells its name with `_` for `-`, as `verity example NAME` reads it, and as `layout.py` needs for a
#   module path through it.
# - Neither layout.py nor move_check follows a path joined to a name bound to `Path(__file__)` (`HERE.parent / "e2e_demo"`), or a
#   relative path in Markdown: the commit after the move re-points the three such joins (network_traces' `chain_record.py` and
#   `test_chain_record.py`, commit_slots' `overlap.py`) and commit_slots' README, each from the root.
# Nothing is split, edited or deleted, and no file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }

[paths]
"benchmarks/e2e_h200/" = "examples/h200/"
"benchmarks/e2e_demo/" = "examples/h200/interfaces/"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and this map, changelogs, research's recorded moves), and files
# whose bytes a digest pins.
exclude = ["*.lean", "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**",
           "tools/verity/check/tests/test_suites.py", "tools/verity/check/tests/test_move_check.py",
           "tools/research/src/research/store/moves.json",
           # its two `../../e2e_h200/` (a relative path in Markdown, which move_check doesn't resolve) are re-pointed with the
           # sibling anchors, in the commit after the move
           "benchmarks/torch_gpu/commit_slots/README.md"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`): the moved directories and scripts as dotted paths from the root
# (no import uses them)
"benchmarks.e2e_demo" = "examples.h200.interfaces"
"benchmarks.e2e_h200" = "examples.h200"
