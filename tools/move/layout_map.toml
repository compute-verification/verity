# The repository's layout move: what `tools/move/layout.py` moves, renames and rewrites.
#
# [paths] maps an old path prefix (a file, or a directory ending in "/") to its new one; the longest prefix that matches a
# tracked file decides where it goes. Python module names follow from the paths and [roots] (`layout.py` derives every
# rename); [modules] lists the renames at package level, and the script fails when what it derives disagrees with them.
# [aliases] adds old names that no file in the tree carries any more, for readers of old data.

[roots]
# import name -> its package directory, before and after; a module outside every root is named by its path from the root
