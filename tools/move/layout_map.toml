# The repository's layout move: what `tools/move/layout.py` moves, renames and rewrites (the platform layout).
#
# [paths] maps an old path prefix (a file, or a directory ending in "/") to its new one; the longest prefix that matches a
# tracked file decides where it goes, and a row that maps a directory to itself keeps it where it is. Python module names follow from the paths and [roots] (`layout.py` derives every rename);
# [modules] lists the renames at package level, and the script fails when what it derives disagrees with them. [aliases]
# adds old names that no file in the tree carries any more. [retired] lists the old paths the move empties, and [drop] the
# files it deletes (an `__init__.py` of a package level that goes, a pyproject whose distribution folds into `verity`).
# The hand fixups that followed the generated move, as a commit of their own: `tools/move/fixups/platform.py`, removed once
# the move landed (`git show 7d291b14d:tools/move/fixups/platform.py`).

[roots]
