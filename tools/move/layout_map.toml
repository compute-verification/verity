[create]
# new files: path = contents (the map is their source: a rerun writes them again when they differ, and never rewrites them)
"catalog/verity_catalog/__init__.py" = '''
"""Public data the trusted base reads by digest: silicon semantics and Definitions, and the targets."""
'''
"kernels/verity_kernels/__init__.py" = '''
"""Registered fast code, by op and device (untrusted): each kernel is checked against its Definition."""
'''
"experimental/verity_experimental/__init__.py" = '''
"""Constructions, schemes and circuits under development or kept for study, by area (untrusted; `verity` never imports it)."""
'''
"verity/primitives/__init__.py" = '''
"""The primitives every protocol is built from: circuits, randomness, commitments and crypto."""
'''
"verity/protocols/__init__.py" = '''
"""The protocols: verification, accounting (work, space, communication) and compliance."""
'''
"verity/pyproject.toml" = '''# The suite of verity/tests: invariants of the whole of `verity` (what it may import, a package in every directory). The root's
# pyproject.toml is the `verity` distribution; each directory under verity/ with tests is a suite of its own.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
parallel = true
'''
"verity/claims/pyproject.toml" = '''# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py"]
'''
"verity/primitives/randomness/pyproject.toml" = '''# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py", "verity/primitives/__init__.py"]
'''
"verity/primitives/circuits/pyproject.toml" = '''# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests register the catalog's Definitions before decoding, and tests/evaluation self-checks every registered kernel
# against its Definition (the kernels and the silicon models they read).
inputs = ["verity", "catalog", "kernels"]
parallel = true
'''
"verity/primitives/commitments/pyproject.toml" = '''# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests/test_leaves.py reads the typed-obligation fixtures through the frozen SP1 backend's statement codec, and the
# frame tests run experimental's multiproof.
inputs = ["verity", "catalog", "kernels", "experimental", "archive/sp1/python/verity_sp1", "fixtures/typed-obligation-v0"]
parallel = true
'''
"verity/protocols/pyproject.toml" = '''# A suite of `verity`'s tests (the root's pyproject.toml is the distribution): those of verity/protocols' own modules; each
# protocol under it is a suite of its own.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests/test_profile.py builds a Program with partition levels from the catalog's GEMM.
inputs = ["verity", "catalog", "kernels"]
'''
"catalog/pyproject.toml" = '''[project]
name = "verity-catalog"
version = "0.0.0"
description = "Public data the trusted base reads by digest: silicon semantics and Definitions, and the targets (the census is beside it, data only)."
requires-python = ">=3.12"
dependencies = ["verity", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_catalog"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: a Definition registers its kernel lazily (verity_kernels, which imports the catalog, so it is no dependency here).
# tests/test_tc_probe_families.py imports the tensor-core probe's tile generation (tools/tc_probe/tc_probe.py), and
# targets.target reads the frozen backends' family names (verity_sp1). tests/test_discrepancy_log.py checks that each evidence
# ref in verity_catalog/silicon/discrepancy_log.json exists, which the guard can't see, so every ref outside this directory is
# listed here (its test_every_evidence_path_is_an_input_of_this_suite fails on one that isn't).
inputs = ["kernels", "archive/sp1/python/verity_sp1", "tools/tc_probe", "tools/tc_probe_fp4/probe.py",
          "benchmarks/numerical/python/verity_numerical/reference/hawkeye_close.py",
          "benchmarks/numerical/tests/checker/test_fp8.py",
          "benchmarks/numerical/tests/reference/hawkeye_harness.cpp",
          "benchmarks/numerical/tests/reference/test_hawkeye_close.py",
          "benchmarks/numerical/tests/reference/test_normalisation_d3.py"]
parallel = true
'''
"kernels/pyproject.toml" = '''[project]
name = "verity-kernels"
version = "0.0.0"
description = "Registered fast code, by op and device (untrusted): each kernel is checked against its Definition."
requires-python = ">=3.12"
dependencies = ["verity", "verity-catalog", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hash_gpu/ beside it is the frozen backends' CUDA hashing, imported by path (archive/direct puts kernels/ on sys.path)
packages = ["verity_kernels"]
dev-mode-exact = true
'''
"experimental/pyproject.toml" = '''[project]
name = "verity-experimental"
version = "0.0.0"
description = "Constructions, schemes and circuits under development or kept for study, by area (untrusted; `verity` never imports it)."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_experimental"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the Lean-evaluated exfiltration vectors record the sha256 of the soundness package's files they were generated
# from (tests/sampled_proofs/lean/generate.sh), and a test compares them with the tree.
inputs = ["backends/flock/verifier/lean/soundness/FlockSoundness/Audit/Influence.lean",
          "backends/flock/verifier/lean/soundness/FlockSoundness/Audit/Law.lean",
          "backends/flock/verifier/lean/soundness/FlockSoundness/Audit/Stratified.lean",
          "backends/flock/verifier/lean/soundness/FlockSoundness/Audit/StratifiedMiss.lean",
          "backends/flock/verifier/lean/soundness/lake-manifest.json",
          "backends/flock/verifier/lean/soundness/lean-toolchain"]
parallel = true
'''

[rewrite]
# Never rewritten: records of what was, and files whose bytes a digest pins.
exclude = ["*.lean", "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock",
           "backends/numerical/reports/**", "benchmarks/numerical/reports/**",
           "backends/numerical/tests/bench/data/**", "benchmarks/numerical/tests/bench/data/**",
           "**/price_twins.json", "tools/move/**",
           "catalog/verity_catalog/silicon/captures/**", "catalog/verity_catalog/silicon/hawkeye/**",
           "tools/check/tests/test_suites.py",                   # its synthetic trees borrow the old names
           "tools/check/tests/test_move_check.py",               # so do its synthetic moves
           "tools/research/src/research/store/moves.json",       # each move's old paths, kept as they were
           "tools/tc_probe_fp4/fp4_emulation_1ad1aaa2.py"]       # verbatim at 1ad1aaa2: t1_merged.emulation_gate pins its bytes
# Old paths that are keys outside the tree, never rewritten: the frozen evidence artifact is laid out at its former repository
# paths (`verity_numerical.bench.frozen`), and labels cite them.
keep = ["backends/numerical/reports", "backends/numerical/reports/*", "backends/*/results", "backends/*/results/*",
        "backends/*/results_*", "backends/*/results.*"]
# Kept only in the files a glob matches: vLLM's `census/` is a run directory's census phase (census/census.json, traces/),
# never the repository's census data, which no file of the integration names.
keep_in = {"integrations/vllm/**" = ["census", "census/*"]}
# Dotted names that are no module, never rewritten, nor anything below them: PoUW's torch op (`verity_pouw.ncp_linear.default`)
# is in the library namespace `verity_pouw`, which its registration names.
keep_dotted = ["verity_pouw.ncp_linear"]
# Rewritten although excluded above: data keyed by repository path (their pinned digests must not change).
include = ["fixtures/artifacts.json", "backends/flock/tests/fixtures/randomness_lean.json",
           "experimental/tests/sampled_proofs/fixtures/exfiltration_lean.json",
           "**/lake-manifest.json", "fixtures/tc/README.md", "catalog/verity_catalog/silicon/captures/README.md",
           "fixtures/discrepancy_log.json"]
