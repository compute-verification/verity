# The repository's layout move: what `tools/move/layout.py` moves, renames and rewrites.
#
# [paths] maps an old path prefix (a file, or a directory ending in "/") to its new one; the longest prefix that matches a
# tracked file decides where it goes. Python module names follow from the paths and [roots] (`layout.py` derives every
# rename); [modules] lists the renames at package level, and the script fails when what it derives disagrees with them.
# [aliases] adds old names that no file in the tree carries any more, for readers of old data.

[roots]
# import name -> its package directory, before and after; a module outside every root is named by its path from the root
# (`benchmarks.pouw.pearl_c4.replay`), and imports only by path. Outside verity/, a top-level directory is a grouping and each
# distribution under it a directory with a name of its own (catalog/verity_catalog/), so the repository's root is never an
# import root.
old = { verity = "packages/verity/src/verity", verity_sampled_proofs = "protocols/sampled_proofs/verity_sampled_proofs", verity_pous = "protocols/pous/verity_pous", verity_pouw = "protocols/pouw/verity_pouw", verity_network_warden = "protocols/network_warden/verity_network_warden", verity_sp1 = "backends/sp1/python/verity_sp1", verity_numerical = "backends/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", verity_flock = "backends/flock/python/verity_flock", research = "tools/research/src/research", circuit_check = "tools/circuit_check/src/circuit_check", cluster = "tools/cluster/src/cluster" }
new = { verity = "verity", verity_catalog = "catalog/verity_catalog", verity_kernels = "kernels/verity_kernels", verity_experimental = "experimental/verity_experimental", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", verity_flock = "backends/flock/python/verity_flock", research = "tools/research/src/research", circuit_check = "tools/circuit_check/src/circuit_check", cluster = "tools/cluster/src/cluster" }

