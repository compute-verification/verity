# The repository's layout move: what `tools/move/layout.py` moves, renames and rewrites (the platform layout, Notion hub
# 'Verity repository', draft of 7 Oct 2026).
#
# [paths] maps an old path prefix (a file, or a directory ending in "/") to its new one; the longest prefix that matches a
# tracked file decides where it goes, and a row that maps a directory to itself keeps it where it is (the Lean that
# `tools/move/lean.py` moves). Python module names follow from the paths and [roots] (`layout.py` derives every rename);
# [modules] lists the renames at package level, and the script fails when what it derives disagrees with them. [aliases]
# adds old names that no file in the tree carries any more. [retired] lists the old paths the move empties, and [drop] the
# files it deletes (an `__init__.py` of a package level that goes, a pyproject whose distribution folds into `verity`).

[roots]
# import name -> its package directory, before and after; a module outside every root is named by its path from the root
# (`benchmarks.pouw.pearl_c4.replay`), and imports only by path.
old = { verity = "verity", verity_catalog = "catalog/verity_catalog", verity_kernels = "kernels/verity_kernels", verity_experimental = "experimental/verity_experimental", verity_flock = "backends/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/circuit_check/src/circuit_check", cluster = "tools/cluster/src/cluster" }
new = { verity = "verity", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }

[paths]
