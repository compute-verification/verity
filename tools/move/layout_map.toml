[distributions]
# distributions that the move folds into `verity`: their dependents depend on `verity`, their members leave the workspace,
# and their pyprojects become suite-only (pytest and [tool.verity.tests], with `verity` among the inputs)
merged = ["verity-catalog", "verity-kernels", "verity-experimental"]
# distributions the move makes, by directory (their pyprojects are in [create])
new = { "verity-cli" = "tools/verity/cli" }

[create]
# new files: path = contents (the map is their source: a rerun writes them again when they differ, and never rewrites them)
"verity/ml/__init__.py" = '''
"""Python and CUDA: the provers, the Python versions of core's circuits (`circuits`, with `ops`, what models compute, and
`silicon`, what the GPUs actually compute), and the kernels. Nothing here affects soundness."""
'''
"verity/experimental/__init__.py" = '''
"""Work in progress, including today's Python verifiers (the protocols, commitments, randomness) until their Lean versions
land in core/. core/ never imports it."""
'''
"verity/experimental/protocols/__init__.py" = '''
"""The protocols in Python: PoUW, PoUS, the network certifier and sampled proofs, with the integrity profile (`profile`)."""
'''
"tools/verity/cli/pyproject.toml" = '''[project]
name = "verity-cli"
version = "0.0.0"
description = "`verity`: the repository's one command (check, bench, --remote), dispatching to the tools beside it."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
verity = "verity_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_cli"]
dev-mode-exact = true
'''
"tools/verity/cli/verity_cli/__init__.py" = '''
"""`verity`: the repository's one command, dispatching to the tools beside it.

    verity check [ARGS]             the check a merge requires (check/check.py)
    verity check tests [ARGS]       the test suites whose inputs changed (check/suites.py)
    verity check lean [ARGS]        the Lean check (lean/audit.py)
    verity check circuits [ARGS]    the property checks every circuit passes (circuit-check)
    verity check move BASE HEAD     certify a pure move (check/move_check.py)
    verity bench NAME [ARGS]        benchmarks/NAME's runner (run.py or run.sh)
    verity check --remote POD       `check` on POD, recorded as an Attempt (check.py --record --on POD)
"""
from __future__ import annotations

import os
import subprocess
import sys
from pathlib import Path

HERE = Path(__file__).resolve().parents[2]
ROOT = HERE.parents[1]
CHECK_PARTS = {"tests": HERE / "check" / "suites.py", "lean": HERE / "lean" / "audit.py",
               "move": HERE / "check" / "move_check.py"}


def _run(argv: list[str]) -> int:
    return subprocess.run(argv, cwd=ROOT).returncode


def _check(args: list[str]) -> int:
    if args and args[0] == "circuits":
        return _run([sys.executable, "-c", "import sys; from circuit_check.cli import main; sys.exit(main())", *args[1:]])
    if args and args[0] in CHECK_PARTS:
        return _run([sys.executable, str(CHECK_PARTS[args[0]]), *args[1:]])
    if "--remote" in args:
        i = args.index("--remote")
        if i + 1 >= len(args):
            raise SystemExit("verity check --remote POD: name the pod")
        args = [*args[:i], "--record", "--on", args[i + 1], *args[i + 2:]]
    return _run([sys.executable, str(HERE / "check" / "check.py"), *args])


def _bench(args: list[str]) -> int:
    names = sorted(p.name for p in (ROOT / "benchmarks").iterdir() if p.is_dir() and not p.name.startswith((".", "_")))
    if not args or args[0] not in names:
        raise SystemExit("verity bench NAME [ARGS]: NAME is one of " + ", ".join(names))
    d = ROOT / "benchmarks" / args[0]
    for runner, argv in (("run.py", [sys.executable]), ("run.sh", ["bash"])):
        if (d / runner).exists():
            return _run([*argv, str(d / runner), *args[1:]])
    raise SystemExit(f"benchmarks/{args[0]} has no run.py or run.sh: run its tool through `research run`")


def main(argv: list[str] | None = None) -> int:
    args = list(sys.argv[1:] if argv is None else argv)
    if not args or args[0] in ("-h", "--help"):
        print(__doc__)
        return 0
    if args[0] == "check":
        return _check(args[1:])
    if args[0] == "bench":
        return _bench(args[1:])
    raise SystemExit(f"verity: no command {args[0]!r}\\n{__doc__}")


if __name__ == "__main__":
    sys.exit(main())
'''

[rewrite]
# Never rewritten: records of what was, and files whose bytes a digest pins.
exclude = ["*.lean", "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock",
           "benchmarks/numerical/reports/**", "benchmarks/numerical/tests/bench/data/**",
           "**/price_twins.json", "tools/move/**",
           "catalog/verity_catalog/silicon/captures/**", "catalog/verity_catalog/silicon/hawkeye/**",
           "verity/ml/circuits/silicon/captures/**", "verity/ml/circuits/silicon/hawkeye/**",
           "tools/check/tests/test_suites.py", "tools/verity/check/tests/test_suites.py",          # synthetic trees borrow old names
           "tools/check/tests/test_move_check.py", "tools/verity/check/tests/test_move_check.py",  # so do its synthetic moves
           "tools/research/src/research/store/moves.json",       # each move's old paths, kept as they were
           "tools/tc_probe_fp4/fp4_emulation_1ad1aaa2.py",       # verbatim at 1ad1aaa2: t1_merged.emulation_gate pins its bytes
           "benchmarks/tc_probe_fp4/fp4_emulation_1ad1aaa2.py"]
# Old paths that are keys outside the tree, never rewritten: the frozen evidence artifact is laid out at its former repository
# paths (`verity_numerical.bench.frozen`), and labels cite them.
keep = ["backends/numerical/reports", "backends/numerical/reports/*", "backends/*/results", "backends/*/results/*",
        "backends/*/results_*", "backends/*/results.*"]
# Kept only in the files a glob matches: vLLM's `census/` is a run directory's census phase (census/census.json, traces/),
# never the repository's census data, which no file of the integration names.
keep_in = {"integrations/vllm/**" = ["census", "census/*"]}
# Dotted names that are no module, never rewritten, nor anything below them: PoUW's torch op (`verity_pouw.ncp_linear.default`)
# is in the library namespace `verity_pouw`, which its registration names.
keep_dotted = ["verity_pouw.ncp_linear"]
# Rewritten although excluded above: data keyed by repository path (their pinned digests must not change).
include = ["fixtures/artifacts.json", "backends/flock/tests/fixtures/randomness_lean.json",
           "verity/ml/flock/tests/fixtures/randomness_lean.json",
           "experimental/tests/sampled_proofs/fixtures/exfiltration_lean.json",
           "verity/experimental/tests/sampled_proofs/fixtures/exfiltration_lean.json",
           "**/lake-manifest.json", "catalog/verity_catalog/silicon/captures/README.md",
           "verity/ml/circuits/silicon/captures/README.md"]
