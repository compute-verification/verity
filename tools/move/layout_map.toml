"verity/primitives/__init__.py" = "verity/ml/__init__.py"
"verity/primitives/circuits/" = "verity/ml/circuits/"
"catalog/verity_catalog/definitions/" = "verity/ml/circuits/ops/"
"catalog/verity_catalog/silicon/" = "verity/ml/circuits/silicon/"
