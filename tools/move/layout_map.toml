"kernels/verity_kernels/" = "verity/ml/kernels/"
"kernels/hash_gpu/" = "verity/ml/kernels/hash_gpu/"
# C-Flock keeps its distribution and import name (`verity_flock` depends on verity-vllm and verity-numerical, which depend on
# `verity`, so it can't fold into `verity`); its verifier's Lean is lean.py's
"backends/flock/" = "verity/ml/flock/"
"backends/flock/verifier/lean/" = "backends/flock/verifier/lean/"

# --- experimental/: work in progress, including today's Python verifiers until their Lean versions land in core/
"experimental/verity_experimental/" = "verity/experimental/"
"experimental/tests/" = "verity/experimental/tests/"
"experimental/pyproject.toml" = "verity/experimental/pyproject.toml"
"verity/primitives/commitments/" = "verity/experimental/commitments/"
"verity/primitives/crypto/" = "verity/experimental/crypto/"
"verity/primitives/randomness/" = "verity/experimental/randomness/"
"verity/claims/" = "verity/experimental/claims/"
"verity/protocols/" = "verity/experimental/protocols/"
"verity/protocols/accounting/work/pouw/" = "verity/experimental/protocols/pouw/"
"verity/protocols/accounting/space/pous/" = "verity/experimental/protocols/pous/"
"verity/protocols/accounting/communication/certifier/" = "verity/experimental/protocols/certifier/"
