# The protocols' groups: what `tools/move/layout.py --map tools/move/protocol_groups_map.toml` moves and rewrites.
#
# Inside `verity/protocols/` the protocols sit in two layers on the proofs, each group a directory of its own:
# `proofs/` holds flock, with spot and recursion on it, what the other protocols call to prove; `accounting/` holds
# pouw, pous, poub and the network certifier, which account for compute, memory and network; `policy/` holds
# inference_only, on accounting. Policy is on accounting, both use the proofs, and the proofs use neither.
#
# - Each protocol's directory moves whole and laid out as it was, one level down: its Python, its Lake packages, its
#   suites and their pyprojects, its Rust and CUDA.
# - Python module names follow the paths (`verity.protocols.pouw` becomes `verity.protocols.accounting.pouw`), and
#   Flock's distribution `verity_flock` keeps its name from its new root.
# - A Lean module is named from its package's root (`Flock.Firewall`, `PouwCheck`), so no Lean module, area,
#   declaration or lock record changes; what changes in a lakefile or a manifest is a path between packages.
# - `interface/`, `remote/`, `onsite/`, `tests/` and the loose files of `verity/protocols/` stay where they are.
# - No directory is split. `verity/` is part moved, and the four Rust files that climb from Flock's live crate to the
#   root read to `layout.py` as naming it; [split] says why its rewrite is right.
# Nothing is edited or deleted, and no file is added but the groups' `__init__.py`, which `layout.py` writes below the
# package root `verity`. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/flock/" = "verity/protocols/proofs/flock/"
"verity/protocols/spot/" = "verity/protocols/proofs/spot/"
"verity/protocols/recursion/" = "verity/protocols/proofs/recursion/"
"verity/protocols/pouw/" = "verity/protocols/accounting/pouw/"
"verity/protocols/pous/" = "verity/protocols/accounting/pous/"
"verity/protocols/poub/" = "verity/protocols/accounting/poub/"
"verity/protocols/certifier/" = "verity/protocols/accounting/certifier/"
"verity/protocols/inference_only/" = "verity/protocols/policy/inference_only/"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row, and each row is a
# directory's, so a file only a branch has under one is carried
paths = ["verity/protocols/flock/", "verity/protocols/spot/", "verity/protocols/recursion/", "verity/protocols/pouw/",
         "verity/protocols/pous/", "verity/protocols/poub/", "verity/protocols/certifier/",
         "verity/protocols/inference_only/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`, by its path before and after the move); lakefiles and Lake
# manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json",
           "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/proofs/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/proofs/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean",
           "verity/protocols/proofs/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean",
           # pins and vectors that record their sources' paths, which `pins.py` and their tests read at those paths
           "verity/protocols/flock/prover/tests/fixtures/randomness_lean.json",
           "verity/protocols/proofs/flock/prover/tests/fixtures/randomness_lean.json",
           "verity/protocols/flock/prover/tests/fixtures/inner_claims.json",
           "verity/protocols/proofs/flock/prover/tests/fixtures/inner_claims.json",
           "verity/protocols/spot/verifier/tests/fixtures/exfiltration_lean.json",
           "verity/protocols/proofs/spot/verifier/tests/fixtures/exfiltration_lean.json",
           "verity/protocols/spot/verifier/tests/fixtures/exfiltration_two_lean.json",
           "verity/protocols/proofs/spot/verifier/tests/fixtures/exfiltration_two_lean.json",
           "verity/protocols/spot/verifier/tests/fixtures/history_read_vector.json",
           "verity/protocols/proofs/spot/verifier/tests/fixtures/history_read_vector.json",
           "verity/protocols/pouw/verifier/tests/vectors/pearl_c_u.json",
           "verity/protocols/accounting/pouw/verifier/tests/vectors/pearl_c_u.json"]
# the verifier pod's install directory, a checkout of the tree (`tools/research/src/research/pods/nebius/verifier/`)
root_prefixes = ["/opt/vy-verifier/current/"]

[split]
# references to a directory this move splits that stay right: "old file: old directory" = why
"verity/protocols/flock/prover/live/src/circuit.rs: verity" = "`../../../../..` is joined to the crate's directory (`CARGO_MANIFEST_DIR`, `live/`), not the file's: it names the root, and the rewrite climbs one level more, as the crate does"
"verity/protocols/flock/prover/live/src/firewall.rs: verity" = "`../../../../..` is joined to the crate's directory (`CARGO_MANIFEST_DIR`, `live/`), not the file's: it names the root, and the rewrite climbs one level more, as the crate does"
"verity/protocols/flock/prover/live/src/lookup.rs: verity" = "`../../../../..` is joined to the crate's directory (`CARGO_MANIFEST_DIR`, `live/`), not the file's: it names the root, and the rewrite climbs one level more, as the crate does"
"verity/protocols/flock/prover/live/src/sha512_native.rs: verity" = "`../../../../..` is joined to the crate's directory (`CARGO_MANIFEST_DIR`, `live/`), not the file's: it names the root, and the rewrite climbs one level more, as the crate does"

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`): each directory as a dotted path, one group deeper.
# `verity_flock` keeps its name: its root moves with Flock.
"verity.protocols.certifier" = "verity.protocols.accounting.certifier"
"verity.protocols.flock" = "verity.protocols.proofs.flock"
"verity.protocols.inference_only" = "verity.protocols.policy.inference_only"
"verity.protocols.poub" = "verity.protocols.accounting.poub"
"verity.protocols.pous" = "verity.protocols.accounting.pous"
"verity.protocols.pouw" = "verity.protocols.accounting.pouw"
"verity.protocols.recursion" = "verity.protocols.proofs.recursion"
"verity.protocols.spot" = "verity.protocols.proofs.spot"
