# The memory challenger's timed-audit process out of benchmarks: what
# `tools/move/layout.py --map tools/move/pous_challenger_process_map.toml` moves and rewrites. `benchmarks/` is measurement
# only, and PoUS's Lean check holds its verdict to this process's, so it goes to the device it is. The device imports PoUS,
# and PoUS never imports it.
#
# - `benchmarks/pous/band_gpu/memory_challenger.py`, the timed audit's verifier process (the responder's wire client and
#   `protocol.TimedAudit`'s audits against it), moves to `verity/core/devices/memory_challenger/timed_audit.py`, so
#   `band_gpu.memory_challenger` becomes `verity.core.devices.memory_challenger.timed_audit`. `band_gpu` is a root
#   (`[roots]`), since its importers put `benchmarks/pous` on the import path and import it as a top-level package.
# Nothing is edited or deleted, and no file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", band_gpu = "benchmarks/pous/band_gpu" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", band_gpu = "benchmarks/pous/band_gpu" }

[paths]
"benchmarks/pous/band_gpu/memory_challenger.py" = "verity/core/devices/memory_challenger/timed_audit.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), and files
# whose bytes a digest pins.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"band_gpu.memory_challenger" = "verity.core.devices.memory_challenger.timed_audit"
