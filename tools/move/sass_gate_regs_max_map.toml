# The retired word "cap" (Pearl's inert-work bound) in the remote session's SASS gate (MEM-152's retired words), by
# `python3 tools/move/rename.py --map tools/move/sass_gate_regs_max_map.toml`: `CAP` is the register limit a kernel
# the table's `capped` names is held to, so it is `REGS_MAX`. The table's stored key `capped` stays.

[words]

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "GLOSSARY.md", "tests/lint/**",
           "tests/test_retired_terms.py", "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[[words_in]]
files = ["benchmarks/remote_session/sass_gate.py"]

[words_in.words]
"CAP" = "REGS_MAX"
