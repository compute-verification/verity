# The inference-only check's place: what `tools/move/layout.py --map tools/move/inference_only_check_map.toml` moves and
# rewrites. The check's directory, `verity/protocols/policy/inference_only/verifier/inference_only/` once
# `inference_only_map.toml` gives it that name, is `verity/protocols/policy/inference_only/verifier/`: its README and
# its Lean package `lean/` stand beside the policy's manifest and tests, as a protocol's `verifier/` holds its `lean/`,
# and no path says inference_only twice. It runs after `inference_only_map.toml` and after
# `slowdown_calculator_map.toml`, whose package root it names.
# Nothing is split, edited or deleted, and no file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", slowdown = "benchmarks/slowdown/slowdown" }

[paths]
"verity/protocols/policy/inference_only/verifier/inference_only/" = "verity/protocols/policy/inference_only/verifier/"

[retired]
paths = ["verity/protocols/policy/inference_only/verifier/inference_only/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), files
# whose bytes a digest pins, the archive, `move_check.py` and its test, and `tests/tree.toml`, the layout of record.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**", "archive/**",
           "tools/verity/check/tests/test_move_check.py", "tools/verity/check/move_check.py",
           "tools/research/src/research/store/moves.json", "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"verity.protocols.policy.inference_only.verifier.inference_only" = "verity.protocols.policy.inference_only.verifier"
