# The retired word "law" in the Lean's names, in the Glossary's words: what `tools/move/rename.py --map
# tools/move/lean_words_law_map.toml` renames. GLOSSARY.md: "law", "draw law", the Lean's `Law` -> the sampling design.
# It runs after `lean_names_map.toml` and the firewall and draw maps in the chain, so its olds are spelled as those maps
# leave them. A name that holds the word and more is renamed by word ([words]), or in the files that spell it where its
# new name stands elsewhere ([[words_in]]); the word alone (`Law`, `law`) only in the `.lean` files that spell it and
# not its new word, as a whole word. Names on "law" in another sense, a probability law, take `dist` (`piLaw`,
# `prodLaw`, `prCoin_law`, the two `RealizesIntegrity...` fields `law`), and the coins' laws of an execution phase and
# of a session `CoinsUniform`. Record keys, reason codes and other one-token string literals keep their bytes ([keep]).
# Declarations keep their place in the locks' records: `rename.py --moves` prints the renames that `check.py --update
# --moved` takes.
# Left by this map: the bare word in the files that spell its new word (`Verity.Law` -> `Verity.Design` among them: in a
# commit of their own, by hand, with a build); prose outside the Lean (a prose map's).

