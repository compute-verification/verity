# The Glossary's older names in lean's Lean, renamed in one move: what `tools/move/rename.py --map
# tools/move/glossary_names_map.toml` renames. It is one move rather than one per family, because each move lands alone
# and restacks every head above it. Declarations keep their place in the locks' records: `rename.py --moves` prints the
# renames that `check.py --update --moved` takes.
#
# - The size ratio. c·B/T₀ is a size ratio: the Glossary keeps "slowdown" for slowdown(𝒢, 𝒜, η). `Verity.slowdown`,
#   which Theorem 3 reads, becomes `Verity.sizeRatio`. `Nci.slowdown`, the slowdown factor ρ, is another declaration and
#   keeps its name, so the bare word is renamed only in the Core files that declare and read `Verity.slowdown`.
# - The composition's registered circuit ("declared circuit" is its older name). `Accounting.Compose.Declared`, the
#   circuit as the IR binds it, becomes `RegisteredCircuit`, and its definitions follow (`Declared.atDraw` becomes
#   `RegisteredCircuit.atDraw`, and so on). `Accounting.Gates.Declared`, every declared bound earned, is another word (a
#   declared interval, not a declared circuit) and stays. So the bare word is renamed only in the files that read the
#   composition's `Declared`, and the `Gates.Declared` module they import is kept.
# - The remote audit's sample (a draw is a sample; the coins stay coins). The namespace `Accounting.Remote.Draw`, the
#   session that samples receipts at each window's coin, becomes `Accounting.Remote.Sample`, with its `Session`, `Coins`
#   and `Receipts`, and its module moves with it. The proofs' own `Accounting.SecurityProofs.Remote.Draw` and
#   `Remote.DrawMeets` stand: their module opens them as `namespace Draw` inside `Accounting.SecurityProofs.Remote`,
#   where no word matches, so [keep] holds every qualified reference to them too.
# - PoUW's period premises on the sample. `DrawIsCoin`, `TileDrawIsCoin` and `StrataDrawIsCoin`, that the units a window
#   samples are its coin's, become `*SampleIsCoin`. `RegisteredBeforeDraw`, that each registration is fixed before its
#   window samples, becomes `RegisteredBeforeSample`. Their honest instances follow.
# - The proof block's fixed words (a unit is a proof block). The premise `Accounting.Assumptions.TS.UnitFixed`, that a
#   run's fixed and folded words are at least those of the blocks it didn't sample, becomes `BlockFixed`, and the
#   guarantee `UnitFixedOfWords` and its lemma follow.
[words]
"Verity.slowdown" = "Verity.sizeRatio"
"Remote.Draw" = "Remote.Sample"
"Remote/Draw" = "Remote/Sample"
"DrawIsCoin" = "SampleIsCoin"
"drawIsCoin" = "sampleIsCoin"
"RegisteredBeforeDraw" = "RegisteredBeforeSample"
"registeredBeforeDraw" = "registeredBeforeSample"
"UnitFixed" = "BlockFixed"
"unitFixed" = "blockFixed"

# The size ratio.
[[words_in]]
files = [
    "Security/Definitions/Core/Formalism.lean",
    "Security/Definitions/Core/Guarantees/Formalism.lean",
    "Security/Proofs/Core/Formalism.lean",
]
words = { "slowdown" = "sizeRatio" }

# The composition's registered circuit, with the Security lock for the assumption `Declared.Wf` and the frozen
# texts that name it, which `--update --moved` doesn't rename.
[[words_in]]
files = [
    "Security/Definitions/Accounting/Assumptions/Compose.lean",
    "Security/Definitions/Accounting/Compose.lean",
    "Security/Definitions/Accounting/ComposePeriod.lean",
    "Security/Definitions/Accounting/Guarantees/Compose.lean",
    "Security/Definitions/Accounting/Guarantees/ComposePeriod.lean",
    "Security/Definitions/Accounting/JointBridge/CreditedWords.lean",
    "Security/Definitions/Accounting/Served.lean",
    "Security/Definitions/Pouw/Assumptions/RelativeSecurity.lean",
    "Security/Proofs/Accounting/Compose/CircuitWork.lean",
    "Security/Proofs/Accounting/Compose/CircuitWorkSeeded.lean",
    "Security/Proofs/Accounting/Compose.lean",
    "Security/Proofs/Accounting/ComposePeriod/Covers.lean",
    "Security/Proofs/Accounting/ComposePeriod/Honest.lean",
    "Security/Proofs/Accounting/ComposePeriod.lean",
    "Security/Proofs/Accounting/Compose/ServiceCovers.lean",
    "Security/Proofs/Accounting/JointBridge/HonestH200.lean",
    "Security/Proofs/Accounting/TS/HeldSound.lean",
    "Security/Proofs/Accounting/TS/Session/Held/Assumptions.lean",
    "Security/Proofs/Accounting/TS/Session/Held/Guarantees.lean",
    "Security/Proofs/Accounting/TS/Session/Held/Layer.lean",
    "Security/Proofs/Pouw/Period/Honest.lean",
    "Security/Proofs/Pouw/PeriodJ10R/Honest.lean",
    "Security/Proofs/Pouw/PeriodJ10R.lean",
    "Security/Proofs/Pouw/PeriodJ10R/Nontrivial.lean",
    "Security/Proofs/Pouw/Period.lean",
    "Security/Proofs/Pouw/ServedValues/Honest.lean",
    "Security/Proofs/Pouw/ServedValues.lean",
    "Security/Proofs/Properties/Accounting/Served.lean",
    "Security/Properties/Accounting/Compose.lean",
    "Security/Properties/Accounting/JointBridge/WorkOfH1CheckedCreditPeriod.lean",
    "Security/Properties/Accounting/Served.lean",
    "Security/Properties/Pouw/PeriodJ10R.lean",
    "Security/Properties/Pouw/Period.lean",
    "Security/Properties/Pouw/ServedValues.lean",
    "Security/Properties/Pouw/ServedFreed.lean",
    "Security/Properties/Pouw/ServedWork.lean",
    "Security/Proofs/Pouw/PeriodJ10RStrata.lean",
    "Security/Proofs/Pouw/PeriodJ10RStrata/Honest.lean",
    "Security/Properties/Pouw/PeriodJ10RStrata.lean",
    "Security/lean-audit.json",
]
words = { "Declared" = "RegisteredCircuit" }

# The remote audit's sample.
[[words_in]]
files = [
    "Security/Definitions/Accounting/Remote/Draw.lean",
    "Security/Definitions/Accounting/Remote/SketchLine.lean",
]
words = { "Draw.pooled" = "Sample.pooled", "Draw.Coins" = "Sample.Coins" }

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the rulings), the frozen backends,
# files whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line itself), lock files, move_check's own
# tests, which spell `SampleIsCoin` as a name already taken, and the Lean tools' fixtures, locks as they were on a past
# tree, which their tests read as such (`Remote.Draw.Coins` in the merge fixtures).
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "tools/verity/check/tests/test_move_check.py",
           "tools/verity/lean/tests/fixtures/**"]

[keep]
# `Gates.Declared`: the gate model's declared bounds, a module `Served` imports; "Declared circuit": prose. The
# proofs' own `SecurityProofs.Remote.Draw` stands.
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+',
            'lanes/[\w.-]+', 'Gates\.Declared\b', 'Declared circuit',
            'SecurityProofs\.Remote\.Draw']
strings = []

[keep_in]
