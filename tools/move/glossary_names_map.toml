# The Glossary's older names in lean's Lean, renamed in one move: what `tools/move/rename.py --map
# tools/move/glossary_names_map.toml` renames. It is one move rather than one per family, because each move lands alone
# and restacks every head above it. Declarations keep their place in the locks' records: `rename.py --moves` prints the
# renames that `check.py --update --moved` takes.
#
# - Trace and transcript, swapped back to the Glossary's words. Core's `Verity.Circuit.Transcript`, one run's value for
#   every gate, is a trace, so it becomes `Verity.Circuit.Trace`. The claims layer's `Claims.Trace`, a run's messages,
#   each party's oracle calls and the decision, is a transcript, so it becomes `Claims.Transcript`, and `Trace.seen`,
#   its fields and `Claims.Recursion.abortTrace` follow. Both change in one move, so no namespace holds both meanings at
#   once (`Accounting.PeriodRun.transcript`, the trace a node committed in the period, is `period_trace_map.toml`'s).
#   Each word is renamed only in the files that use that name and no other `Transcript` or `Trace`, so
#   `Flock.Transcript`, `Pouw.Transcript`, `Pouw.PearlC.Transcript`, `FlockComplete.Trace` and
#   `Accounting.Remote.Held.Trace` keep theirs. The files fall in three groups:
#   - the dotted names in the two declaring modules, the vocabulary guard's keys and `ZkStep`, which also opens
#     `Flock.Transcript`;
#   - `Transcript` where it names `Verity.Circuit.Transcript` (as `C.Transcript` and `Circuit.Transcript`), and in the
#     two `TileCheck` modules, where `(τ : Transcript)` is `Pouw.PearlC.Transcript` ([keep]);
#   - `Trace` where it names `Claims.Trace`.
#   A module under `Population` is listed under `SampledProofs` too, its name after the Security areas move. A module in
#   a namespace under `Claims` that means another `Transcript` must name it in full (`Flock.Transcript`), since
#   `Claims.Transcript` comes before an opened name there.
# - The size ratio. c·B/T₀ is a size ratio: the Glossary keeps "slowdown" for slowdown(𝒢, 𝒜, η). `Verity.slowdown`,
#   which Theorem 3 reads, becomes `Verity.sizeRatio`. `Nci.slowdown`, the slowdown factor ρ, is another declaration and
#   keeps its name, so the bare word is renamed only in the Core files that declare and read `Verity.slowdown`.
# - The composition's registered circuit ("declared circuit" is its older name). `Accounting.Compose.Declared`, the
#   circuit as the IR binds it, becomes `RegisteredCircuit`, and its definitions follow (`Declared.atDraw` becomes
#   `RegisteredCircuit.atDraw`, and so on). `Accounting.Gates.Declared`, every declared bound earned, is another word (a
#   declared interval, not a declared circuit) and stays. So the bare word is renamed only in the files that read the
#   composition's `Declared`, and the `Gates.Declared` module they import is kept.
# - The remote audit's sample (a draw is a sample; the coins stay coins). The namespace `Accounting.Remote.Draw`, the
#   session that samples receipts at each window's coin, becomes `Accounting.Remote.Sample`, with its `Session`, `Coins`
#   and `Receipts`, and its module moves with it. The proofs' own `Accounting.SecurityProofs.Remote.Draw` and
#   `Remote.DrawMeets` stand: their module opens them as `namespace Draw` inside `Accounting.SecurityProofs.Remote`,
#   where no word matches, so [keep] holds every qualified reference to them too.
# - PoUW's period premises on the sample. `DrawIsCoin`, `TileDrawIsCoin` and `StrataDrawIsCoin`, that the units a window
#   samples are its coin's, become `*SampleIsCoin`. `RegisteredBeforeDraw`, that each registration is fixed before its
#   window samples, becomes `RegisteredBeforeSample`. Their honest instances follow.
# - The proof block's fixed words (a unit is a proof block). The premise `Accounting.Assumptions.TS.UnitFixed`, that a
#   run's fixed and folded words are at least those of the blocks it didn't sample, becomes `BlockFixed`, and the
#   guarantee `UnitFixedOfWords` and its lemma follow.
[words]
"Verity.slowdown" = "Verity.sizeRatio"
"Remote.Draw" = "Remote.Sample"
"Remote/Draw" = "Remote/Sample"
"DrawIsCoin" = "SampleIsCoin"
"drawIsCoin" = "sampleIsCoin"
"RegisteredBeforeDraw" = "RegisteredBeforeSample"
"registeredBeforeDraw" = "registeredBeforeSample"
"UnitFixed" = "BlockFixed"
"unitFixed" = "blockFixed"

