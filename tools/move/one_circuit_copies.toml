# Every decoder, evaluator and structure walk of C, each marked THE one, a caller of it, a twin (a Python mirror of a Lean
# function held by a difference test), or a copy. `basis` is "read" (the file and line were read) or "inferred" (from a
# search, not from reading every caller). An entry's owner is `research msg owners <path>`.

[[decoder]]
path = "verity/circuits/codec.py"
fn = "decode_program"
line = 1000
schemas = "v2 (v0, v1 refused: E_SCHEMA)"
callers = "served path, verifiers, benchmarks, tests"
role = "THE one (Python)"
basis = "read"

