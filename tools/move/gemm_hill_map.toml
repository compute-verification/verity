# Flock's GEMM hillclimb and slowdown probes are measurement: they leave Flock's pod directory for
# `benchmarks/proof_throughput/`, their test for its suite. `tools/move/layout.py --map tools/move/gemm_hill_map.toml`
# moves and rewrites. The pod scripts that run them (71-gemm-slowdown.sh, 74-gemm-hill.sh, 76-read-gadget.sh) stay.

[paths]
"verity/protocols/proofs/flock/prover/pod/gemm_hill.py" = "benchmarks/proof_throughput/gemm_hill.py"
"verity/protocols/proofs/flock/prover/pod/gemm_slowdown.py" = "benchmarks/proof_throughput/gemm_slowdown.py"
"tests/verity/protocols/proofs/flock/prover/test_gemm_hill.py" = "tests/benchmarks/proof_throughput/test_gemm_hill.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was, files whose bytes a digest pins, every Lean input and lock.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "tools/research/src/research/store/moves.json", "**/*.lean",
           "**/lean-audit.json"]
