# The retired word "law" in PoUS's setup proof's Python name (MEM-152's retired words), by
# `python3 tools/move/rename.py --map tools/move/law_pous_setup_proof_map.toml`: the function `setup_proof.law(blocks)`,
# which gives the sampling design, is `setup_proof.sampling_design`, with its test. The claim's field `law`, the evidence
# record's key `"law"` that it writes and `PousCheck`'s Lean field keep the word, as stored bytes and their mirror.

[words]

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "GLOSSARY.md", "tests/lint/**",
           "tests/test_retired_terms.py", "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[[words_in]]
files = ["verity/protocols/accounting/pous/verifier/setup_proof.py"]
words = { "def law(blocks" = "def sampling_design(blocks", "(`law`), each sampled block" = "(`sampling_design`), each sampled block", "the sampling design (`law`)" = "the sampling design (`sampling_design`)", "\"base\", \"law\", \"leaf_bytes\", \"register\", \"supplied\"" = "\"base\", \"leaf_bytes\", \"register\", \"sampling_design\", \"supplied\"" }

[[words_in]]
files = ["verity/protocols/accounting/pous/prover/setup_proof.py", "verity/protocols/accounting/pous/verifier/README.md"]
words = { "setup_proof.law" = "setup_proof.sampling_design" }

[[words_in]]
files = ["verity/protocols/accounting/pous/verifier/tests/test_pous_setup_proof.py"]
words = { "V.law" = "V.sampling_design", "test_law_samples_8828_at_any_size" = "test_sampling_design_samples_8828_at_any_size" }
