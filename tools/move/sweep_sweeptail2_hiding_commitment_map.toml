# the hiding commitment): what `tools/move/rename.py --map tools/move/sweep_sweeptail2_hiding_commitment_map.toml` renames. The
# phrase stands across a line break in both, so each row is the words before the break; `salted` alone has other senses and is
# renamed only here.

