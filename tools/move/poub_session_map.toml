# PoUB's session, the verifier's side, out of benchmarks: what `tools/move/layout.py --map tools/move/poub_session_map.toml`
# moves and rewrites. `benchmarks/` is measurement only, and live_verifier's host runs this verifier on the auditor's host,
# so it goes into PoUB's package (`verity/core/protocols/remote_bandwidth/session/`).
#
# - `verifier.py` (the verifier's process), `lean_verifier.py` (the Lean verifier it runs beside `audit.AuditRun`),
#   `checks.py` (its worker processes), `challengers.py` (where a session's coins come from) and `wire.py` (the framed
#   messages between the two processes) move under their own names, so `benchmarks.remote_session.wire` becomes
#   `verity.core.protocols.remote_bandwidth.session.wire`. Their importers name them by package (an edit before the move).
# - The prover's side stays: `prover.py`, `device.py` and `inplace.py` import core, torch and `benchmarks.word_codec`, and
#   `auditor_line.py`, the analysis of a gate run's records, reads the certifier's audit.
# - The package's `__init__.py` lands before the move.
# Nothing is edited or deleted, and no file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }

[paths]
"benchmarks/remote_session/verifier.py" = "verity/core/protocols/remote_bandwidth/session/verifier.py"
"benchmarks/remote_session/lean_verifier.py" = "verity/core/protocols/remote_bandwidth/session/lean_verifier.py"
"benchmarks/remote_session/checks.py" = "verity/core/protocols/remote_bandwidth/session/checks.py"
"benchmarks/remote_session/challengers.py" = "verity/core/protocols/remote_bandwidth/session/challengers.py"
"benchmarks/remote_session/wire.py" = "verity/core/protocols/remote_bandwidth/session/wire.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), and files
# whose bytes a digest pins.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"benchmarks.remote_session.challengers" = "verity.core.protocols.remote_bandwidth.session.challengers"
"benchmarks.remote_session.checks" = "verity.core.protocols.remote_bandwidth.session.checks"
"benchmarks.remote_session.lean_verifier" = "verity.core.protocols.remote_bandwidth.session.lean_verifier"
"benchmarks.remote_session.verifier" = "verity.core.protocols.remote_bandwidth.session.verifier"
"benchmarks.remote_session.wire" = "verity.core.protocols.remote_bandwidth.session.wire"
