# The layout move of Flock's prover, to `verity/flock/prover`: what `tools/move/layout.py --map
# tools/move/layout_04_flock_prover_map.toml` moves and rewrites. 423 files in 128 rows. Written by
# `tools/move/layout_maps.py`, which states the rule: edit that, not this.
# A moved file's new path is its component's new directory, then the name of the directory it is in today, then its
# path below that; the name is left out where the new directory, less `verifier/`, `prover/` or `device/`, already
# ends in it. A directory is one row where all of it goes one way; a directory this move shares with another is one
# row a file. Nothing is edited or deleted.
# Rows that depart from that rule:
# - `verity/ml/flock/python/verity_flock/` to `verity/flock/prover/python/verity_flock/`: a module goes with its
#   import package: eleven bench drivers are modules of `verity_flock`, which the rule would leave in a second
#   `verity/flock/python/verity_flock/` with no `__init__.py`, outside the distribution that keeps the name.
# The layout's maps run in the order of their names. This one renames no package another map takes modules out of, so
# its place among them is free. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/ml/flock/tests/" = "verity/flock/prover/tests/"
"verity/ml/flock/README.md" = "verity/flock/prover/README.md"
"verity/ml/flock/check_build.sh" = "verity/flock/prover/check_build.sh"
"verity/ml/flock/cuda/" = "verity/flock/prover/cuda/"
"verity/ml/flock/cuda_chunk_patch.py" = "verity/flock/prover/cuda_chunk_patch.py"
"verity/ml/flock/cuda_circuit_patch.py" = "verity/flock/prover/cuda_circuit_patch.py"
"verity/ml/flock/cuda_live_patch.py" = "verity/flock/prover/cuda_live_patch.py"
"verity/ml/flock/cuda_sha512_patch.py" = "verity/flock/prover/cuda_sha512_patch.py"
"verity/ml/flock/flock-glue-b684b12.patch" = "verity/flock/prover/flock-glue-b684b12.patch"
"verity/ml/flock/flock-gpu-link-b684b12.patch" = "verity/flock/prover/flock-gpu-link-b684b12.patch"
"verity/ml/flock/flock-link-b684b12.patch" = "verity/flock/prover/flock-link-b684b12.patch"
