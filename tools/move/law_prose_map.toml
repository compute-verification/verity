# The LAW family's prose in the proof system's paths: what `tools/move/rename.py --map tools/move/law_prose_map.toml`
# renames. GLOSSARY.md's term for "law" and "draw law" is the sampling design; this map gives a comment, a docstring and
# Markdown's text that term, in the files the proofs lane holds (SPOT, Flock and recursion under `verity/protocols/proofs/`,
# their areas of `security/`, SPOT's two-stage Lean, the commitments' sampling of units, and the lane's benchmarks).
# `law_lean_map.toml` and `law_code_map.toml` rename the identifiers after it, so a name in backticks waits for them.
#
# Where a sentence says "law" for the distribution of a random variable (a joint law, the uniform law, equal in law), the
# word is "distribution", as `terms_map.toml` gave the noise and coin laws, and so is a game's, a run's, a tape's, a
# transcript's or a coin's law; the monad laws become the monad identities. Those phrases come first. A hyphenated name
# (`R1-law`, the recorded case names such as "registration-law-another-k") is a recorded token and keeps its spelling,
# and so does the record key `"law"` where a docstring shows a record ([keep]). The map renames prose only
# (`scope = "prose"`), so it moves no path and renames no declaration.
scope = "prose"

[words]

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "tests/test_retired_terms.py", "tests/lint/test_repo_retired_terms.py"]

[keep]
patterns = ['\w-[Ll]aws?\b', '\b[Ll]aws?-\w', '''["']laws?["']''']

