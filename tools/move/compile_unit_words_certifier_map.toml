# `compile_unit_words_map.toml`'s words in network-accounting's files, which that map excludes: what `tools/move/rename.py --map
# tools/move/compile_unit_words_certifier_map.toml` renames, to that map's targets, in `verity/protocols/accounting/certifier/**`
# and `security/**/Certifier/**` alone ([rewrite] exclude names every other path).
# Kept bytes ([keep]): that map's own, `warden_map.toml`'s and `warden_tokens_map.toml`'s, and what a passing run or a
# hash reads: a domain tag or format id, a one-token string (a record or JSON key, a kind, a file name, an env
# variable), a flag, a test's byte seed, an env variable in shell, the public items' reasons a spec's digest takes in
# (`S.Public(...)`, `scan_zk.spec_of`'s). Fault, refusal and help texts, docstrings, comments and names take the words.

[words]
"compile_units" = "compile_slice_blocks"
"compile_unit" = "compile_slice_block"
"Compile units" = "Compile slices' proof blocks"
"compile units" = "compile slices' proof blocks"
"Compile unit" = "Compile slice's proof block"
"compile unit" = "compile slice's proof block"

[keep]
patterns = [
    "(?m)^\\| \"compile unit\".*$",
    "\"checker\": \"compile unit",
    "until the compile unit exists \\(README\\.md\\)",
    "the advice is the compile unit's input, not the window Program's",
    "the compile unit, which takes it hidden, isn't run here",
    "[\\w.-]+(?:/[\\w.-]+)*/v\\d+(?:\\.\\d+)*\\b",
    "note:[\\w./-]+",
    "art:[0-9a-f]+",
    "cursor/[\\w./-]+",
    "\"warden\"",
    "'warden'(?![a-z])",
    "[\"']warden:",
    "(?<!certifier/)(?<=/)warden(?![\\w-]|\\.\\w)",
    "(?<![\\w./-])warden/(?=[\\w$<{*])",
    "CR_PATH(?::-\\}\")?(?: = |=)warden",
    "--class (?:test\\|served\\|)?warden",
    "N2_CLASS=warden",
    "negatives\\.py warden",
    "client or warden",
    "served or warden\\)",
    "[\"'/]warden_(?:check|endpoint|endpoint_served|certificates|cores|cores_busy|cpu_s|invol|cost|costs)[\"'/]",
    "warden\\.json\\b",
    "warden(?=-\\w)",
    "(?<=-)warden",
    "(?<!\\w)warden_run(?!\\w)",
    "\\ba\\.warden\\b",
    "(?<![\\w-])(?:[Tt]he|[Aa]|no|its|each|this|that|same|whose|active|honest|kept|synthetic|byte-cell|▶|\\w+'s) warden(?![\\w-])",
    "(?<!\\w)warden's",
    "(?<![\\w./-])warden (?:link-windows?|execution phases?|rehearsals?|ordinal|profile|traces?|tests|ports?|rows?|runs?|path|link|view|windows?|cells?|thread|ticker|arrival|admission|release|check|bucket|program|beside|in front)\\b",
    "(?<![\\w./-])(?:device|another|client /) warden(?![\\w-])",
    "warden \\((?:its |\\{WARDEN)",
    "max ms \\| warden ",
    "(?m)^\\| \"warden\", \"network warden\".*$",
    "(?<!certifier/)(?<!\"g1/)(?<=/)warden(?![\\w-]|\\.\\w)",
    "[\"']warden_run[\"'](?!: None\\}\\)\\))",
    "warden-(?:rehearse|fails|heavy|smallkv)",
    "(?<![A-Z0-9])(?:A5|CR|N2|SC)_WARDEN_RUN(?![A-Z0-9_])",
    "--warden(?:-run)?(?![\\w-])",
    "(?<![\\w])[bB]\"[^\"\\n]*\"",
    "(?<![\\w])[bB]'[^'\\n]*'",
    "(?<![\\w-])--[A-Za-z][\\w-]*",
    "\"[\\w.\\-/\\[\\]*:]+\"",
    "(?<![\\w'])'[\\w.\\-/\\[\\]*:]+'(?![\\w'])",
    "(?s)S\\.Public\\((?:[^()]|\\([^()]*\\))*\\)",
    "(?s)public = \\[\\(\"population\", .*?if started\\)\\]",
    "\\$\\{?[A-Z][A-Z0-9_]*",
    "(?m)^[ \\t]*(?:export[ \\t]+)?[A-Z][A-Z0-9_]*=(?!=)",
]
strings = [
    "WardenRowIdentity",
    "unit/warden-row",
    "unit/a5-warden",
    "a5-warden/rest/",
    "functions as an active warden",
    "an *active warden*",
    "a passive warden",
