# The two-stage design's words, the part `stage2_words_map.toml` left: what `tools/move/rename.py --map
# tools/move/interior_commitment_words_map.toml` renames, "deferred interiors" to GLOSSARY.md's "interior commitments"
# (a sampled replay block's interior, committed between the two stages): the SPOT figure's caption and label for the
# layer-of-a-token design with the test that matches them, and the docstrings of the two-stage compute-credit witness.
#
# It leaves: "inner sample" (`innerSample`, `InnerSample`, `INNER_SAMPLE`, `inner_sample`) in the recursion layer,
# where it is the inner session's sample, the draw the recursive proof re-reads, and not a two-stage design's second
# stage; "the first draw" in `network_e2e/chain.py` and its test, the audit's first sample (the `draw` family's word);
# "the second draw" in `circuit_properties/work.py`, a second random draw of a test point; the stored figure cards
# (`spot_figures/cards/`, each kept with the art id it came from); `SamplingGeneric/TwoCount.lean`, whose sha256
# `exfiltration_two_lean.json` pins; GLOSSARY.md's row; and the retired-words lints' examples.

[words]

[[words_in]]
files = ["**/spot_figures/figure1.py", "**/spot_figures/render.py", "**/spot_figures/tests/test_figure1.py"]
[words_in.words]
"Deferred interiors" = "Interior commitments"

[[words_in]]
files = ["**/Witnesses/SamplingTwoWork.lean"]
[words_in.words]
"deferred interiors" = "interior commitments"

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, fixtures, patches, stored figure cards, the
# Glossary's older-names rows, the retired-words lints' examples), files whose bytes a digest pins, lock files and the
# locks' records.
exclude = ["tools/move/**", "**/fixtures/**", "**/*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock",
           "**/lean-audit.json", "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "benchmarks/spot_figures/cards/**"]
