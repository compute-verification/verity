# The training step's tests out of the vLLM adapter, after `torch_adapter_map.toml`: what
# `tools/move/layout.py --map tools/move/torch_train_step_map.toml` moves and rewrites. Two of that map's splits:
#   adapters/vllm/tests/program/train_step_lf.py, which imports only torch, moves whole;
#   adapters/vllm/tests/program/test_train_step.py, which tests the PyTorch translator, moves whole, and a commit after
#   the move cuts back to the vLLM suite (`adapters/vllm/tests/program/test_rule_lists.py`) its one check that reads
#   vLLM's rules: that a training rule set holds no rule of `VLLM_RULES`.
#
# The roots and the excludes are `torch_adapter_map.toml`'s. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", verity_torch = "adapters/torch/verity_torch" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter", verity_torch = "adapters/torch/verity_torch" }

[paths]
"adapters/vllm/tests/program/test_train_step.py" = "adapters/torch/tests/frontend/test_train_step.py"
"adapters/vllm/tests/program/train_step_lf.py" = "adapters/torch/tests/frontend/train_step_lf.py"

[modules]
"adapters.vllm.tests.program.test_train_step" = "adapters.torch.tests.frontend.test_train_step"
"adapters.vllm.tests.program.train_step_lf" = "adapters.torch.tests.frontend.train_step_lf"

[retired]
paths = []

[drop]
paths = []

[rewrite]
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**", "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**", "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py", "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json", "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**", "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**", "adapters/vllm/tools/migrate/superseded_quarantine.py", "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean", "**/lakefile.toml", "tests/tree.toml", "**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.h", "**/*.c", "adapters/vllm/tests/lint/allowlists/**", "adapters/vllm/tests/by_name_allowlist.json", "adapters/vllm/tests/dead_code_census.py", "tests/lint/test_repo_retired_terms.py", "adapters/vllm/verity_vllm/pipeline/build.py", "adapters/vllm/verity_vllm/observe/fold/memory.py", "adapters/vllm/verity_vllm/observe/fold/views.py", "tools/check/tests/test_suites.py", "tools/check/tests/test_move_check.py"]
