# Network accounting's retired Lean names (the Glossary's draw, wrong, horizon, dampener, warden and tap), renamed to
# their current terms: sample, incorrect, pooled (a monitoring period's pooled reading), slowdown and network certifier.
# Every name is renamed where it is declared and everywhere it is read; a lock's records are left to the Lean check's
# `--update --moved` (`rename.py --moves` prints the moves).
#
# Rerun it on a tree that still has the old names, such as a branch made before it landed, once that branch has merged
# `main`:
#   python3 tools/move/rename.py --map tools/move/na_retired_map.toml
# Its globs match both layouts of the remote audit's Lean (`Security/*/Accounting/Remote*` and `Security/*/RemoteAudit*`).
#
# [words] rename each word wherever it stands, as a name or one part of one; each table lists its longer words first,
# since a table's words are tried in order. A homonym another area declares (`pr_draws_le` in Pous, `WindowLaw` in the
# bridge, `drawOf`, `drawsOf`, `drawnOf`, `recordDraw`) or a word a field, binder or JSON key shares (`wrong`, `draws`,
# `drawn`, `horizon`) is renamed only in network accounting's files, as a whole word or at the receiver it is read on.
# The Lean check's and the queue's own code and fixtures (tools/verity/lean, tools/research) are left out: their
# examples are synthetic or pinned to historical locks.

