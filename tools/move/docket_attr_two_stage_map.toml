# `two_stage.First`'s docket, its first stage's, and `two_stage.Replayed`'s, its interior's: their attribute
# `registration` becomes `docket`, with every read of it. One map holds both, since the two classes declare the field on
# the same line. In these files `got` and `again` are a `First` (`two_stage.first`, `two_stage.resume`), `r` a `Replayed`
# (`two_stage.replayed`) and `r.first` a `Resumed`'s or a `Replayed`'s `First`; the keys `"registration"` keep their word.

[words]

[[words_in]]
files = ["verity/protocols/proofs/spot/prover/audit/two_stage.py"]
[words_in.words]
"registration: S.WindowCommitmentRecord" = "docket: S.WindowCommitmentRecord"
"self.registration" = "self.docket"
"again.registration" = "again.docket"
"r.first.registration" = "r.first.docket"
"r.registration" = "r.docket"

[[words_in]]
files = ["benchmarks/one_stage/tests/test_two_stage_second.py"]
[words_in.words]
"got.registration" = "got.docket"
"again.registration" = "again.docket"
"r.registration" = "r.docket"

[[words_in]]
files = ["adapters/vllm/tests/pipeline/test_two_stage_driver.py"]
[words_in.words]
"got.registration" = "got.docket"
"again.registration" = "again.docket"
"r.first.registration" = "r.first.docket"

[[words_in]]
files = ["benchmarks/one_stage/tests/test_stop_audit.py"]
[words_in.words]
"r.first.registration" = "r.first.docket"

[keep]
patterns = []
strings = []

[rewrite]
exclude = ["**/*.json", "**/*.jsonl", "**/*.toml", "**/*.lean", "**/fixtures/**", "tools/move/**",
           "tools/research/src/research/store/moves.json"]
