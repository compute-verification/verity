# The certifier map in Lean's prose: "the certifier" becomes the network attester (the device) and network
# attestation (the protocol), in comments and docstrings of `.lean` files only. No declaration, string literal or
# path moves (lean_names.tsv and lean_strings.tsv list those, with their non-Lean twins).

scope = "prose"

[words]

[[words_in]]
files = ["**/*.lean"]
[words_in.words]
"imports the certifier" = "imports network attestation"
"the certifier program" = "network attestation's program"
"the certifier's toy Definition" = "network attestation's toy Definition"
"the certifier's Definition" = "network attestation's Definition"
"the certifier's piece" = "network attestation's piece"
"The certifier's piece" = "Network attestation's piece"
"the certifier piece" = "the network attestation piece"
"the certifier's case" = "network attestation's case"
"the certifier's chain" = "network attestation's chain"
"The certifier's chain" = "Network attestation's chain"
"the certifier's scan" = "network attestation's scan"
"the certifier's offline check" = "network attestation's offline check"
"the certifier's serving program" = "network attestation's serving program"
"the certifier's own assumptions" = "network attestation's own assumptions"
"certifier's own assumptions" = "network attestation's own assumptions"
"the certifier's period" = "the attestation period"
"certifier's period" = "attestation period"
"certifier period" = "attestation period"
"Network certification" = "Network attestation"
"network certification" = "network attestation"
"the certifier's answer" = "network attestation's answer"
"the split network certifier's step" = "network attestation's split step"
"neither the certifier nor" = "neither network attestation nor"
"the adapter nor the certifier" = "the adapter nor network attestation"
"the adapter and the certifier" = "the adapter and network attestation"
"the certifier-only" = "the attester-only"
"Network certifiers" = "Network attesters"
"network certifiers" = "network attesters"
"Network certifier" = "Network attester"
"network certifier" = "network attester"
"NETWORK CERTIFIER" = "NETWORK ATTESTER"
"The certifiers" = "The network attesters"
"the certifiers" = "the network attesters"
"The certifier" = "The network attester"
"the certifier" = "the network attester"
"A certifier" = "A network attester"
"a certifier" = "a network attester"
"certifier's" = "network attester's"
"certifiers'" = "network attesters'"

[keep]
patterns = [
    '''[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b''',
]

