# The layout move of the inference-only policy, to `verity/protocols/inference_only`: what `tools/move/layout.py
# --map tools/move/layout_moves/layout_10_inference_only_map.toml` moves and rewrites. 106 files in 22 rows. Written
# by `tools/move/layout_maps.py`, which states the rule: edit that, not this.
# A moved file's new path is its component's new directory, then the name of the directory it is in today, then its
# path below that; the name is left out where the new directory, less `verifier/`, `prover/` or `device/`, already
# ends in it. A directory is one row where all of it goes one way; a directory this move shares with another is one
# row a file. Nothing is edited or deleted.
# The layout's maps run in the order of their names. This one renames no package another map takes modules out of, so
# its place among them is free. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

