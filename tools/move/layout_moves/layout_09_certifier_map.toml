# The layout move of network certification, to `verity/protocols/certifier`: what `tools/move/layout.py --map
# tools/move/layout_moves/layout_09_certifier_map.toml` moves and rewrites. 272 files in 13 rows. Written by
# `tools/move/layout_maps.py`, which states the rule: edit that, not this.
# A moved file's new path is its component's new directory, then the name of the directory it is in today, then its
# path below that; the name is left out where the new directory, less `verifier/`, `prover/` or `device/`, already
# ends in it. A directory is one row where all of it goes one way; a directory this move shares with another is one
# row a file. Nothing is edited or deleted.
# Rows that depart from that rule:
# - `verity/core/protocols/network/lean/` to `verity/protocols/certifier/verifier/network/lean/`: the network check's
#   Lake package: the rule puts it on `verifier/lean/`, where the certifier program's Lake package goes, which it
#   requires; it takes `network/lean/`, beside the suite that builds it.
# The layout's maps run in the order of their names. This one renames no package another map takes modules out of, so
# its place among them is free. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"benchmarks/network_traces/block_certifier.py" = "verity/protocols/certifier/verifier/network_traces/block_certifier.py"
"benchmarks/network_traces/certifier_serve.py" = "verity/protocols/certifier/device/network_traces/certifier_serve.py"
"benchmarks/network_traces/load_relay.py" = "verity/protocols/certifier/device/network_traces/load_relay.py"
"benchmarks/network_traces/scan_period.py" = "verity/protocols/certifier/verifier/network_traces/scan_period.py"
"benchmarks/network_traces/warden_chain.py" = "verity/protocols/certifier/verifier/network_traces/warden_chain.py"
"benchmarks/network_traces/warden_serve.py" = "verity/protocols/certifier/device/network_traces/warden_serve.py"
"benchmarks/network_traces/wipe_egress.py" = "verity/protocols/certifier/verifier/network_traces/wipe_egress.py"
"verity/core/devices/certifier/" = "verity/protocols/certifier/device/"
"verity/core/protocols/certifier/" = "verity/protocols/certifier/verifier/"
"verity/core/protocols/network/lean/" = "verity/protocols/certifier/verifier/network/lean/"
"verity/core/protocols/network/pyproject.toml" = "verity/protocols/certifier/verifier/network/pyproject.toml"
"verity/core/protocols/network/tests/" = "verity/protocols/certifier/verifier/network/tests/"
"verity/ml/protocols/certifier/" = "verity/protocols/certifier/prover/"

[tokens]
# directories no row moves whole, as a reference to one reads after the move
"verity/core/protocols/network/" = "verity/protocols/certifier/verifier/network/"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), and files whose bytes a digest pins.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz",
           "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256", "**/lake-manifest.json.lock",
           "tools/move/**", "archive/**", "benchmarks/numerical/reports/**", "benchmarks/numerical/tests/bench/data/**",
           "**/price_twins.json", "verity/ml/circuits/silicon/captures/**", "verity/ml/circuits/silicon/hawkeye/**", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "integrations/vllm/manifests/**", "integrations/vllm/workloads/**", "integrations/vllm/data/**",
           "integrations/vllm/verity_vllm/pins/**", "tools/verity/check/tests/test_suites.py", "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/tc_probe_fp4/fp4_emulation_1ad1aaa2.py", "benchmarks/network_e2e/tests/data/**", "benchmarks/hash/dither/j10b_ref.py", "benchmarks/hash/dither/j10ca_ref.py",
           "benchmarks/hash/dither/j10hb.py", "benchmarks/hash/dither/j10rtx.py", "benchmarks/hash/dither/j10served.py", "integrations/vllm/tools/migrate/superseded_quarantine.py",
           "integrations/vllm/tests/migrate/test_superseded_quarantine.py"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json", "integrations/vllm/manifests/definitions.json"]

[modules]
