"benchmarks.network_traces.warden_serve" = "verity.protocols.certifier.device.network_traces.warden_serve"
"benchmarks.network_traces.wipe_egress" = "verity.protocols.certifier.verifier.network_traces.wipe_egress"
"verity.core.devices.certifier" = "verity.protocols.certifier.device"
"verity.core.protocols.certifier" = "verity.protocols.certifier.verifier"
"verity.core.protocols.network.lean" = "verity.protocols.certifier.verifier.network.lean"
"verity.core.protocols.network.tests" = "verity.protocols.certifier.verifier.network.tests"
