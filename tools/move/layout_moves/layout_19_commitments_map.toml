# The layout move of commitments, hashes, signatures and the challenge derivation, to `verity/commitments`: what
# `tools/move/layout.py --map tools/move/layout_moves/layout_19_commitments_map.toml` moves and rewrites. 140 files
# in 45 rows. Written by `tools/move/layout_maps.py`, which states the rule: edit that, not this.
# A moved file's new path is its component's new directory, then the name of the directory it is in today, then its
# path below that; the name is left out where the new directory, less `verifier/`, `prover/` or `device/`, already
# ends in it. A directory is one row where all of it goes one way; a directory this move shares with another is one
# row a file. Nothing is edited or deleted.
# The layout's maps run in the order of their names. This one runs after `layout_01_definitions_map.toml`,
# `layout_09_poub_map.toml`, `layout_18_vllm_map.toml`: it renames a package that those maps take modules out of, and
# would rename their modules with it. The format is `layout_map.toml`'s.

