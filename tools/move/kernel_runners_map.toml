# Kernels' benchmark runners out of `verity/`: what `tools/move/layout.py --map tools/move/kernel_runners_map.toml`
# moves and rewrites. Each runner builds and times a kernel whose sources stay in `verity/` and names them by path;
# nothing in `verity/` runs them. served_zk's `run.sh` runs a job beside it by name, so it goes with its jobs. Nothing
# is split, edited or deleted, and no file is added. The format is `layout_map.toml`'s.

