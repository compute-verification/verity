# PoUW's serving code out of the vLLM adapter into PoUW's prover: what `tools/move/layout.py --map
# tools/move/pouw_serving_map.toml` moves and rewrites (ARCHITECTURE.md, "Code that has to be written": PoUW's serving code
# in one package under `protocols/accounting/pouw/`, reached by one call).
#
# The adapter's `protocols/pouw/` package, one directory per scheme below it as before (`h1/`, `pearl_c/`, `lead/`), becomes
# `verity/protocols/accounting/pouw/prover/serving/`, with the lead's commitment (`commit/lead_rows.py`), the Pearl+ served
# document's schema (`records/pearl_served.py`) and H1's sample and gate sessions (`pipeline/serve_h1_draw.py`,
# `serve_h1_gate.py`). What stays in the adapter is its side of the call: the option module (`protocols/pouw/__init__.py`,
# which the selector loads by name), and H1's three modules that reach into vLLM, flattened beside it (`h1_hooks.py`, the
# model's linears and their hooks; `h1_ranks.py`, the TP worker extension; `h1_settings.py`, the settings read from a built
# engine). The unit tests of the moved code that read nothing else of the adapter go to PoUW's prover tests; the tests that
# drive vLLM or the adapter's engine stay with the adapter.
#
# What stays: the layout of record (`tests/tree.toml`), every Lean file's bytes and every kernel source's ([rewrite]
# exclude). No root moves ([roots] old == new). No file is split or deleted. The format is `layout_map.toml`'s.

