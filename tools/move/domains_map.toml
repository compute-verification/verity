# The domain table's move into the public `core_randomness`: what `tools/move/rename.py --map tools/move/domains_map.toml`
# renames. `Identity/Domains.lean` has no imports and declares into `namespace Domains`, so only its module and its path
# change: every `import Identity.Domains` (PoUW's commit, window and check), the layers that list it, and the difftest
# that reads the table by path. Run it once, on a tree before the move.
#
# A pure move leaves `Identity.lean` importing `Randomness.Domains`, which `core_identity` doesn't require, and nothing in
# `core_randomness` rooting it, which the Lean check refuses as an orphan: the commit after the move drops that import and
# adds `Randomness.Domains` to the `Randomness` library's `roots` and its lean-audit roots. `Randomness.lean` stays as it
# is, since the randomness vectors pin its digest.

[words]
"primitives/identity/Identity/Domains" = "primitives/randomness/Randomness/Domains"
"Identity/Domains" = "Randomness/Domains"
"Identity.Domains" = "Randomness.Domains"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), and files
# whose bytes a digest pins.
exclude = ["tools/move/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "tools/verity/check/tests/test_move_check.py",
           "tools/research/src/research/store/moves.json"]
