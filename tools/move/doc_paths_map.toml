# The paths the comments and docstrings of the analysis's Lean (`security/`) still write as they stood before the layout
# move, each to where that move put its file: `tools/move/rename.py --map tools/move/doc_paths_map.toml` rewrites them.
# The layout's maps leave every Lean file's bytes alone, since a module's source is in its build key, so these wait for a
# move that compiles the Lean again. A row is one file's old path and its new one, as `layout_one_map.toml`'s rows give
# it; it is a whole word, so a `::symbol` or `:LINE` after it stays. Only `security/`'s Lean is read (the files
# `tests/test_doc_paths.py` reads); none of these paths stands outside a comment there, so no declaration, statement or
# string changes, and `rename.py --moves` prints `{}`.
#
# Not here, because no row can write them: a path whose file was deleted (the sentence needs a person), and a Lean name
# the doc-path test reads as a file (an entry of its `NOT_PATHS`).

[words]

[[words_in]]
files = ["security/*.lean"]

[words_in.words]
