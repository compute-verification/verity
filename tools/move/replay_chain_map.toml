# vLLM's scheduler replay, its step (`replay_step`, `ReplayStep_v1`) and the state chained between its step blocks
# (`replay_chain`), go from the network certifier to the vLLM adapter's compiler beside the compile slice that calls them
# (ARCHITECTURE.md: the adapter holds the compiler): what `tools/move/layout.py --map tools/move/replay_chain_map.toml`
# moves and rewrites. Each Definition moves with its circuit-check sidecar and pins and its tests; the step's fixture
# stays beside its writer (`benchmarks/network_e2e/encodings/replay_vectors.py`), and a hand commit after the move points
# the moved test at it. The certifier's lengths-row test, which reads the chain's layout, is its owner's to move.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
[paths]
"verity/protocols/accounting/certifier/verifier/replay_step.py" = "adapters/vllm/verity_vllm/compiler/replay_step.py"
"verity/protocols/accounting/certifier/verifier/replay_step.circuit-check.py" = "adapters/vllm/verity_vllm/compiler/replay_step.circuit-check.py"
"verity/protocols/accounting/certifier/verifier/replay_step.circuit-check.json" = "adapters/vllm/verity_vllm/compiler/replay_step.circuit-check.json"
"verity/protocols/accounting/certifier/verifier/replay_chain.py" = "adapters/vllm/verity_vllm/compiler/replay_chain.py"
"verity/protocols/accounting/certifier/verifier/replay_chain.circuit-check.py" = "adapters/vllm/verity_vllm/compiler/replay_chain.circuit-check.py"
"verity/protocols/accounting/certifier/verifier/replay_chain.circuit-check.json" = "adapters/vllm/verity_vllm/compiler/replay_chain.circuit-check.json"
"verity/protocols/accounting/certifier/verifier/tests/test_network_certifier_replay_step.py" = "adapters/vllm/tests/compiler/test_network_certifier_replay_step.py"
"verity/protocols/accounting/certifier/verifier/tests/test_network_certifier_replay_chain.py" = "adapters/vllm/tests/compiler/test_network_certifier_replay_chain.py"

[modules]
"verity.protocols.accounting.certifier.verifier.replay_chain" = "verity_vllm.compiler.replay_chain"
"verity.protocols.accounting.certifier.verifier.replay_step" = "verity_vllm.compiler.replay_step"
"verity.protocols.accounting.certifier.verifier.tests.test_network_certifier_replay_chain" = "adapters.vllm.tests.compiler.test_network_certifier_replay_chain"
"verity.protocols.accounting.certifier.verifier.tests.test_network_certifier_replay_step" = "adapters.vllm.tests.compiler.test_network_certifier_replay_step"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the archive), files whose bytes a
# digest pins (`rename.py` repins a `TRUSTED.sha256` line itself), lock files, and the certifier's lengths-row test, whose
# owner moves its one test of the chain.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock", "verity/protocols/accounting/certifier/verifier/tests/test_network_certifier_lengths_row.py"]
