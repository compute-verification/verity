"CERTIFIER_CLOCK" = "ATTESTER_CLOCK"
"CERTIFIER_EMPTY" = "ATTESTER_EMPTY"
"CERTIFIER_FRAME" = "ATTESTER_FRAME"
"CERTIFIER_START" = "ATTESTER_START"
"certifier_cells" = "attester_cells"
"CERTIFIER_MARK" = "ATTESTER_MARK"
