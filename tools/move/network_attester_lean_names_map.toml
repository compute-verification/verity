[keep]
patterns = [
    "[\\w.-]+(?:/[\\w.-]+)*/v\\d+(?:\\.\\d+)*\\b",
    "(?<!\\w)(?:rLeakCertifierChecked_of_rLeakCertifier|rLeakCertifier_of_rLeakCertifierChecked|test_network_certifier_registered|witnessCertifier_jitter_varies|witnessCertifier_assumptions|test_network_certifier_rows|CERTIFIER_SCAN_OK_ROW_SALT|rLeakCertifierChecked_of|freeL_certifierRun_miss|network_certifier_serve|network_certifier_rows|test_network_certifier|ImportWithinCertifier|RLeakCertifierChecked|CertifierSeesImports|certifierCode_length|certifierLane_length|certifier_cells_read|HelpWithinCertifier|CertifierRegisters|certifierEntriesOf|certifierLog_valid|CertifierSchedule|certifierCode_fst|certifierLane_fst|certifier_program|network_certifier|certifierCode_eq|certifierLane_eq|certifierVal_mem|witnessCertifier|CertifierDevice|CertifierSigned|RLeakCertifier|CertifierColl|certifierCode|certifierLane|certifierLog|certifierRun|certifierVal|aCertifier|iCertifier|rCertifier|Certifier)(?!\\w)",
]

