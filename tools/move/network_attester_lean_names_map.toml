# The certifier map's Lean names: each compound name a `.lean` file declares or reads that the non-Lean maps keep,
# renamed in Lean and in every other file that spells it, so both sides move in one commit. A domain tag's value
# (`.../vN`) stays. lean_names.tsv lists every name, and `named` there what this map leaves to lean.

