# "declared circuit" and "declared work", the retired words (GLOSSARY.md: the registered circuit, and the registered
# circuit's work), as `tools/move/rename.py --map tools/move/declared_words_map.toml`
# renames them on `architecture`. Each site is renamed by its sense, in the files that hold it:
# - the circuit D the developer registers, which a "declared circuit" names in Accounting's, Compose's, Core's and the
#   certifier's Lean, PoUW's tile sessions, SPOT, compose's verifiers, the registration log and the one-stage audit, is the
#   registered circuit ("the registered declared circuit" of `Core/Formalism.lean` too); SPOT's one-stage test that names
#   it follows;
# - "the declared work" of a cheating pool (`Spot/ChiPool.lean`) and of the remote slowdown's bound (compose's remote
#   README) is the registered circuit's work.
# It leaves every other sense of "declared" and "declaration" (a suite's declared inputs, a declared type, the
# registration log's declarations of a day, a vLLM workload manifest's "declared workload") and every Lean name
# (`Accounting.Compose.Declared`, `Core.Registration.Declared`, `declared`, `RunsDeclared`, `DeclaredHold`), so no lock
# record changes. It leaves the bytes of messages a lock's records unfold or a stored record holds: SPOT's challenger's
# refusals (`Spot.Challenger.circuitReason`, with the Python challenger and the tests that quote them), the
# inference-only check's refusal of an unnamed record (with the two tests that quote it), and the one-stage onsite
# record's open count `one-program-a-day`. It leaves training's paths (the Slowdown and InferenceOnly Lean, the policy's
# code), the served shares' "declared work" beside the "declared utilization" of another family, the lint's own lists and
# the Glossary's rows.

