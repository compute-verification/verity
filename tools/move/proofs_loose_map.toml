# The loose paths of Flock and SPOT: what `tools/move/layout.py --map tools/move/proofs_loose_map.toml` moves and
# rewrites.
#
# A protocol's directory holds `verifier/`, `prover/`, `device/`, its README, its `PROTOCOL.md`, its `__init__.py`, its
# `pyproject.toml` and its `tests/` (`tests/tree.toml`). Eight paths of `verity/protocols/flock/` and
# `verity/protocols/spot/` are none of those. Each goes into the part of its protocol it belongs to:
#
# - `flock/pod/`, the scripts that set a pod up and run Flock's prover and its measuring cells on it, joins the three
#   pod scripts already in `flock/prover/pod/`. No file name is in both directories.
# - `flock/tool.py`, the store's declaration of two of those scripts' runs, goes beside them, to the top of
#   `flock/prover/`.
# - `flock/agreement/`, what runs Flock's Lean verifier and holds it to upstream's Rust verifier, goes to
#   `flock/prover/agreement/`. Upstream's verifier is a cross-check and never a verifier, and three of the directory's
#   scripts import the prover's distribution (`verity_flock`), which no file under a `verifier/` may.
# - `flock/sigma/`, the Lake package `core_sigma` (the difftest port of the Lean verifier's `Flock.Sigma.check`) with
#   its suite, goes under the verifier it ports: `flock/verifier/sigma/`. It stays a Lake package of its own, nested in
#   the directory of `flock_verifier`, which it requires; its lakefile, manifest, lock, toolchain and suite move with
#   it, and the suite's name stays.
# - `spot/candidates.py`, `spot/costfit.py`, `spot/optimize.py` and `spot/plancheck.py`, the sampling planner, its cuts,
#   its fitted cost model and the wrapper that asks Lean what a plan certifies, go to `spot/prover/`: nothing trusts the
#   planner, and no file of SPOT's verifier but its tests reads one of the four.
#
# - Each directory moves whole and laid out as it was. No directory a row names is split, so the map has no [split]
#   table.
# - A Lean module is named from its package's root (`SigmaDifftest`), so no Lean module, declaration or lock record
#   changes; what changes in a lakefile or a manifest is a path to or from `core_sigma`.
# - The Python modules that are imported by name follow their files ([modules]).
# Nothing is edited or deleted. The one file added is the empty `__init__.py` that makes `spot/prover/` a package. The
# format is `layout_map.toml`'s. The map names paths under `verity/protocols/flock/` and `verity/protocols/spot/` as
# they are before any move of those two directories, so it runs before a map that moves either directory whole.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/flock/pod/" = "verity/protocols/flock/prover/pod/"
"verity/protocols/flock/tool.py" = "verity/protocols/flock/prover/tool.py"
"verity/protocols/flock/agreement/" = "verity/protocols/flock/prover/agreement/"
"verity/protocols/flock/sigma/" = "verity/protocols/flock/verifier/sigma/"
"verity/protocols/spot/candidates.py" = "verity/protocols/spot/prover/candidates.py"
"verity/protocols/spot/costfit.py" = "verity/protocols/spot/prover/costfit.py"
"verity/protocols/spot/optimize.py" = "verity/protocols/spot/prover/optimize.py"
"verity/protocols/spot/plancheck.py" = "verity/protocols/spot/prover/plancheck.py"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row, and each row is a
# directory's, so a file only a branch has under one is carried
paths = ["verity/protocols/flock/pod/", "verity/protocols/flock/agreement/", "verity/protocols/flock/sigma/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too. The tree file
# (`tests/tree.toml`) is left as it is: each not-yet line names its path where it is before the move, and a line whose
# move landed is its owner's to delete.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "tests/tree.toml", "**/*.lean"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[modules]
# the renames [paths] implies (`layout.py --modules`). `verity.protocols.flock.prover.tool` and the four of
# `verity.protocols.spot.prover` are imported by name; the three directories' are their paths as dotted names, and no
# module is imported under one: their Python runs as files, and `core_sigma` is Lean.
"verity.protocols.flock.agreement" = "verity.protocols.flock.prover.agreement"
"verity.protocols.flock.pod" = "verity.protocols.flock.prover.pod"
"verity.protocols.flock.sigma" = "verity.protocols.flock.verifier.sigma"
"verity.protocols.flock.tool" = "verity.protocols.flock.prover.tool"
"verity.protocols.spot.candidates" = "verity.protocols.spot.prover.candidates"
"verity.protocols.spot.costfit" = "verity.protocols.spot.prover.costfit"
"verity.protocols.spot.optimize" = "verity.protocols.spot.prover.optimize"
"verity.protocols.spot.plancheck" = "verity.protocols.spot.prover.plancheck"
