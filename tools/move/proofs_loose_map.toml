# A proposal for proofs, staged into nothing until proofs rules: the loose files of Flock's and SPOT's directories, and
# what is left of `fixtures/`, each where it is read. What `tools/move/layout.py --map tools/move/proofs_loose_map.toml`
# moves and rewrites.
#
# - Flock's pod scripts run its prover, so `verity/protocols/flock/pod/` joins the three already in
#   `verity/protocols/flock/prover/pod/` (no name meets), and `tool.py`, the store's declaration of those runs, goes
#   with them, as `verity/protocols/flock/prover/tool.py`.
# - `verity/protocols/flock/sigma/`, the difftest of Flock's Σ-protocol (a Lake package and its suite), goes beside the
#   verifier it tests, as `verity/protocols/flock/verifier/sigma/`, a Lake package of its own inside that directory.
# - `verity/protocols/flock/agreement/`, the agreement with upstream's Rust verifier, which nothing trusts and the
#   check runs, leaves `verity/` for `tools/flock_agreement/`. The store's tool registry names its declaration by module,
#   `tools.flock_agreement.tool` after the move, imported from the root as the tools moved before it are.
# - SPOT's planner (`candidates.py`, `costfit.py`, `optimize.py`: nothing trusts a plan) goes to
#   `verity/protocols/spot/prover/`; `plancheck.py`, the driver of the Lean check of a plan, goes to
#   `verity/protocols/spot/verifier/`. Their tests stay in the verifier's suite, which reads the planner as a test.
# - `fixtures/typed-obligation-v0/` goes beside the target reader that defines the format it holds,
#   `verity/definitions/circuits/targets/` (`definitions_merge_map.toml` carries it to `verity/circuits/targets/`, so this
#   map runs before that one). `fixtures/proof-format-v3/` has no reader since the archive went, and is dropped.
# Python modules follow their files ([modules]); no Lean module, declaration or lock record changes, and what changes in a
# lakefile or a manifest is a path between packages. The format is `layout_map.toml`'s. It runs after chain 1 and before
# `protocol_groups_map.toml`.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/flock/pod/" = "verity/protocols/flock/prover/pod/"
"verity/protocols/flock/tool.py" = "verity/protocols/flock/prover/tool.py"
"verity/protocols/flock/sigma/" = "verity/protocols/flock/verifier/sigma/"
"verity/protocols/flock/agreement/" = "tools/flock_agreement/"
"verity/protocols/spot/candidates.py" = "verity/protocols/spot/prover/candidates.py"
"verity/protocols/spot/costfit.py" = "verity/protocols/spot/prover/costfit.py"
"verity/protocols/spot/optimize.py" = "verity/protocols/spot/prover/optimize.py"
"verity/protocols/spot/plancheck.py" = "verity/protocols/spot/verifier/plancheck.py"
"fixtures/typed-obligation-v0/" = "verity/definitions/circuits/targets/typed-obligation-v0/"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row
paths = ["verity/protocols/flock/pod/", "verity/protocols/flock/sigma/", "verity/protocols/flock/agreement/", "fixtures/typed-obligation-v0/", "fixtures/proof-format-v3/"]

[drop]
# the vectors whose one reader, D-SP1's guest, was deleted with the archive
paths = ["fixtures/proof-format-v3/README.md", "fixtures/proof-format-v3/vectors.json"]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean",
           # the layout of record: a landed move leaves its lines as written, for top to delete
           "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[modules]
# the renames [paths] implies (`layout.py --modules`)
"verity.protocols.flock.agreement" = "tools.flock_agreement"
"verity.protocols.flock.pod" = "verity.protocols.flock.prover.pod"
"verity.protocols.flock.sigma" = "verity.protocols.flock.verifier.sigma"
"verity.protocols.flock.tool" = "verity.protocols.flock.prover.tool"
"verity.protocols.spot.candidates" = "verity.protocols.spot.prover.candidates"
"verity.protocols.spot.costfit" = "verity.protocols.spot.prover.costfit"
"verity.protocols.spot.optimize" = "verity.protocols.spot.prover.optimize"
"verity.protocols.spot.plancheck" = "verity.protocols.spot.verifier.plancheck"
