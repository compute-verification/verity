# The LAW family's Lean names in the proof system's paths: what `tools/move/rename.py --map tools/move/law_lean_map.toml`
# renames. GLOSSARY.md's term for "law", "draw law" and the Lean's `Law` is the sampling design: `Law` becomes
# `SamplingDesign` (`Verity.SamplingDesign`, `Flock.Draw.SamplingDesign`, `Flock.Audit.SamplingDesign`), `law`
# `samplingDesign`, and a compound renames its law part the same way (`flockLaw` `flockSamplingDesign`, `lawWhy`
# `samplingDesignWhy`). "Draw law" compounds rename their law part alone (`drawLaw` `drawDesign`), since `drawLaw` and
# `law` stand side by side in many files and the draw part is the DRAW family's. A module named for its law moves with
# its imports (`Flock/Audit/Law.lean` to `Flock/Audit/SamplingDesign.lean`).
#
# A law that is the distribution of a random variable takes "distribution" instead: the coin map's (`CoinMapLaw`,
# `LawHolds`, `law_send` and their agreement forms in SPOT's two-stage Lean, and there `lawAt` and `hLaw`), the
# joined coupling's, and the products of PMFs (`prodLaw`, `piLaw`).
#
# In our paths (the first two tables) every LAW name renames. In every other Lean file (the last table) only `Law`, `law`
# and the names our files declare rename, since those files read our structures, fields, constructors and lemmas; the
# rest of their LAW names, and their prose, are their owners'. The Lake files' module lists take the same names, and the
# few files that name a moved module by its path (SPOT's test inputs, the Audit README) take its new path.
#
# What stays ([keep]): every string literal that holds a LAW word, so the record key `"law"`, the refusal code `R1-law`
# and the refusal messages the Python mirror's difftest compares keep their bytes until a format version; hyphenated
# names (recorded case names); and the prose of other lanes' Lean files. `Verity.SamplingDesign.escape` is the field
# lean's chain renames to `missProb`. Declarations keep their place in the locks' records: `rename.py --moves` prints the
# renames `tools/verity/lean/check.py --update --moved` takes.




#
# Names holding both retired words (draw and law) have one final name, the same row in TWOLEG's
# `draw_compound_map.toml`: draw becomes sample (sampled, samples), law beside it Design, law apart from it
# samplingDesign. Each intermediate spelling either map left reaches the final name too.
#
# Python, Rust and shell names rename by their language's case (`law` -> `sampling_design`, `Law` ->
# `SamplingDesign`, `LAW` -> `SAMPLING_DESIGN`), our flags `--law` and `--draw-law` to `--sampling-design` and
# `--sample-design`, `FLOCK_DRAW_LAW` to `FLOCK_SAMPLE_DESIGN`. Kept there: every string literal holding the word (record
# keys such as "law", refusal codes such as R1-law, recorded case names, the messages the difftests compare with the
# Lean's kept literals, but those naming the flag `--draw-law`), every attribute named `law` (other lanes' `Binding`, `Window`, `Component` and `Plan` carry
# one, and ours, `Draw.law`, is read outside: our Python and shell table's `.law`, which [keep_in] holds there (a Rust
# field renames with its readers), never
# a keep pattern, which would keep a Lean projection of a renamed field too), the keywords that write a "law" key or set another lane's field, the
# adapter's `served_tp --law`, `V3C_LAW` (the onsite demo sets it) and the square-root law. Outside our paths only the
# names other lanes import from us rename; `_law` takes `_design`, the name `law_words_map.toml` gives the served table's
# hook. A file another lane moves is named where it sits now, by a glob that holds while it moves inside its owner's
# directory.

