# Trace and transcript swapped back to the Glossary's words: what `tools/move/rename.py --map
# tools/move/trace_transcript_map.toml` renames. Core's `Verity.Circuit.Transcript`, one run's value for every gate, is a
# trace, so it becomes `Verity.Circuit.Trace`; the claims layer's `Claims.Trace`, a run's messages, each party's oracle
# calls and the decision, is a transcript, so it becomes `Claims.Transcript`, with `Trace.seen`, its fields and
# `Claims.Recursion.abortTrace`. `Accounting.PeriodRun.transcript`, the trace a node committed in the period, becomes
# `Accounting.PeriodRun.trace`. All in one move, so no namespace holds both meanings at once. Declarations keep their
# place in the locks' records: `rename.py --moves` prints the renames that `check.py --update --moved` takes.
#
# Each word is renamed only in the files that use that name and no other `Transcript` or `Trace`, so `Flock.Transcript`,
# `Pouw.Transcript`, `Pouw.PearlC.Transcript`, `FlockComplete.Trace` and `Accounting.Remote.Held.Trace` keep theirs:
# - the dotted names in the two declaring modules, the vocabulary guard's keys and `ZkStep`, which also opens
#   `Flock.Transcript`;
# - `Transcript` where it names `Verity.Circuit.Transcript` (as `C.Transcript` and `Circuit.Transcript`), and in the two
#   `TileCheck` modules, where `(τ : Transcript)` is `Pouw.PearlC.Transcript` ([keep]);
# - `Trace` where it names `Claims.Trace`;
# - `transcript` in the modules that declare, build or read `PeriodRun.transcript`, where every `transcript` is that trace.
# A module under `Population` is listed under `SampledProofs` too, its name after the Security areas move.

