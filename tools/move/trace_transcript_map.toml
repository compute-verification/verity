# Trace and transcript, swapped back to the Glossary's words: what `tools/move/rename.py --map
# tools/move/trace_transcript_map.toml` renames, in one move. Core's `Verity.Circuit.Transcript`, one run's value for
# every gate, is a trace, so it becomes `Verity.Circuit.Trace`. The claims layer's `Claims.Trace`, a run's messages, each
# party's oracle calls and the decision, is a transcript, so it becomes `Claims.Transcript`, and `Trace.seen`, its fields
# and `Claims.Recursion.abortTrace` follow. `Flock.Transcript`, `Pouw.Transcript`, `Pouw.PearlC.Transcript`,
# `FlockComplete.Trace` and `Accounting.Remote.Held.Trace` keep their names. Declarations keep their place in the locks'
# records: `rename.py --moves` prints the renames that `check.py --update --moved` takes.
#
# Each word is renamed only in the files where every `Transcript` or `Trace` outside comments resolves to that
# declaration, as the build's `.ilean` references have it, apart from the two [keep] patterns:
# - the dotted names in the two declaring modules, the vocabulary guard's keys, `ZkStep` (which also opens
#   `Flock.Transcript`) and `Verity.Recursive` (which spells both in full);
# - `Transcript` where it is `Verity.Circuit.Transcript` (`C.Transcript`, `Circuit.Transcript`, ...);
# - `Trace` where it is `Claims.Trace`.
# A module in a namespace under `Claims` that means another `Transcript` names it in full (`_root_.Flock.Transcript`),
# since `Claims.Transcript` comes before an opened name there.
[words]
"abortTrace" = "abortTranscript"

[[words_in]]
files = [
    "Security/Definitions/Core/Circuit.lean",
    "Security/Definitions/Core/Interaction.lean",
    "Security/Proofs/Flock/Claims/KS/ZkStep.lean",
    "Security/Proofs/Properties/Verity/Recursive.lean",
    "tests/test_lean_vocabulary.py",
]
words = { "Verity.Circuit.Transcript" = "Verity.Circuit.Trace", "Claims.Trace" = "Claims.Transcript" }

