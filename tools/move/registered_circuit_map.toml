# The registered circuit: what `tools/move/rename.py --map tools/move/registered_circuit_map.toml` renames ("declared
# circuit" is an older name for the registered circuit). The stacked guarantee `DeclaredCircuitRequirement`, its
# witnesses and the scheduled requirement become `RegisteredCircuit*`, and their modules
# (`Security/{Definitions,Proofs,Properties}/Accounting/**/DeclaredCircuit*`) move with them. Declarations keep their
# place in the locks' records: `rename.py --moves` prints the renames that `check.py --update --moved` takes.
[words]
"DeclaredCircuit" = "RegisteredCircuit"

[rewrite]
# host_map.toml's: records of what was (the earlier moves and their maps, changelogs, the rulings), the frozen backends,
# files whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']
strings = []

[keep_in]
