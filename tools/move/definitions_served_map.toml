# The served kernels' circuits, out of `verity/` into the vLLM adapter: what `tools/move/layout.py --map
# tools/move/definitions_served_map.toml` moves and rewrites.
#
# - The kernel Definitions (`registry`), their fast evaluators (`numerics`), the Boolean versions, the word replay, a
#   Definition's encoding and the evidence ids (the top-level modules left once `definitions_kept_map.toml` has moved
#   the proof-block cut), and the suite (`pyproject.toml`, `tests/`) move to `verity_vllm.definitions`, laid out as
#   they were, so the suite stays one suite with its own settings.
# - `verity/definitions/__init__.py` moves with them, so nothing is left under `verity/definitions/` once
#   `definitions_lake_map.toml` has moved the two Lake packages.
# Nothing is edited or deleted, and no file is added. The format is `layout_map.toml`'s. It runs after
# `definitions_kept_map.toml` and `definitions_merge_map.toml`, which move the Python packages left under
# `verity/definitions/`.
[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/definitions/registry/" = "adapters/vllm/verity_vllm/definitions/registry/"
"verity/definitions/numerics/" = "adapters/vllm/verity_vllm/definitions/numerics/"
"verity/definitions/tests/" = "adapters/vllm/verity_vllm/definitions/tests/"
"verity/definitions/boolean.py" = "adapters/vllm/verity_vllm/definitions/boolean.py"
"verity/definitions/encoding.py" = "adapters/vllm/verity_vllm/definitions/encoding.py"
"verity/definitions/evidence.json" = "adapters/vllm/verity_vllm/definitions/evidence.json"
"verity/definitions/evidence.py" = "adapters/vllm/verity_vllm/definitions/evidence.py"
"verity/definitions/replay.py" = "adapters/vllm/verity_vllm/definitions/replay.py"
"verity/definitions/README.md" = "adapters/vllm/verity_vllm/definitions/README.md"
"verity/definitions/pyproject.toml" = "adapters/vllm/verity_vllm/definitions/pyproject.toml"
"verity/definitions/__init__.py" = "adapters/vllm/verity_vllm/definitions/__init__.py"

[retired]
# the directories this map empties: `layout.py` refuses a tracked file under one that has no row
paths = ["verity/definitions/registry/", "verity/definitions/numerics/", "verity/definitions/tests/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
# Nor the lakefiles of `verity/protocols/proofs/flock/sigma/` and of the requirement package (at either place, so whether or
# not the Lake packages' map ran first), whose comments name `boolean.sigma_check` and `circuits.requirement`: they are
# left for a hand edit beside the Lake packages' move, so this map changes no Lean input.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**",
           "verity/circuits/silicon/captures/**", "verity/circuits/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean",
           "verity/protocols/proofs/flock/sigma/lakefile.toml", "verity/definitions/requirement/lakefile.toml",
           "verity/circuits/requirement/lakefile.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "verity/protocols/proofs/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/proofs/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/proofs/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[modules]
# the renames [paths] implies (`layout.py --modules`)
"verity.definitions" = "verity_vllm.definitions"
"verity.definitions.boolean" = "verity_vllm.definitions.boolean"
"verity.definitions.encoding" = "verity_vllm.definitions.encoding"
"verity.definitions.evidence" = "verity_vllm.definitions.evidence"
"verity.definitions.numerics" = "verity_vllm.definitions.numerics"
"verity.definitions.registry" = "verity_vllm.definitions.registry"
"verity.definitions.replay" = "verity_vllm.definitions.replay"
"verity.definitions.tests" = "verity_vllm.definitions.tests"
