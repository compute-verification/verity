# The retired word "firewall" in the Lean's names, in the Glossary's words: what `tools/move/rename.py --map
# tools/move/lean_words_firewall_map.toml` renames. GLOSSARY.md: "firewall", Flock.Firewall, until renamed -> the ZK
# server. It runs after `lean_names_map.toml` in the chain and before the draw and law maps, so its olds are spelled as
# the names map leaves them. `Flock.Firewall` -> `Flock.ZkServer` (namespace, modules and paths); the executable's root
# `FlockFirewall` becomes `FlockZkServerMain`, since `FlockZkServer` is the ZK server's library. The recursion's ZK server
# package: its library `Firewall` -> `CoreZkServer` (modules, imports, paths), the namespace `Core.Firewall` ->
# `Core.ZkServer`, its executables' roots (`FirewallMain` -> `CoreZkServerMain` and three more). A name that holds the
# word and more is renamed by word ([words]); the word alone (`Firewall`) only in the `.lean` files that spell it and not
# `ZkServer` or the package's library, as a whole word. Domain tags, the reason code `FIREWALL-REFUSED`, flock-circuit's
# Rust `Firewall` (`Firewall::new`) and Lean's macro scopes (`_@.M`) keep their bytes ([keep]). Declarations keep their place in the locks' records: `rename.py --moves` prints the renames that
# `check.py --update --moved` takes.
# Left by this map: what names no Lean declaration or module, which `move_check.py` can't certify: the commands and
# variables (`flock-firewall`, `core-firewall`, `FC_FIREWALL*`, the Lake package `core_firewall`), in
# `lean_words_zk_server_commands_map.toml`, and the package's directory, in `lean_words_zk_server_layout_map.toml`, each
# after this one; `benchmarks/recursion_figures/figures.py`, which spells `Flock.ZkServer` already; prose outside the
# Lean (a prose map's).

