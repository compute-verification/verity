# The population's incorrect proof blocks: what `tools/move/rename.py --map tools/move/incorrect_map.toml` renames (a
# block that doesn't compute its outputs is incorrect; "wrong unit" and "faulty" are older names). `Dataflow.wrong` and
# `DynPopulation.wrong`, the units a run's assignment makes incorrect, become `incorrect`, `optWrong` `optIncorrect`,
# and their lemmas follow. Only the population's files are renamed: `Verity.Partition.wrong` is sampled proofs', renamed
# with its Flock `wrong`, so the bridge's right side, `P.wrong X`, stays. Declarations keep their place in the locks'
# records: `rename.py --moves` prints the renames that `check.py --update --moved` takes.
[words]

[[words_in]]
files = ["Security/Definitions/Population.lean", "Security/Definitions/Population/*.lean",
         "Security/Proofs/Population.lean", "Security/Proofs/Population/*.lean"]
[words_in.words]
"wrong" = "incorrect"
"optWrong" = "optIncorrect"
"optWrong_some" = "optIncorrect_some"
"mem_optWrong_of_write_none" = "mem_optIncorrect_of_write_none"
"mem_optWrong_of_read_none" = "mem_optIncorrect_of_read_none"
"wrong_eq" = "incorrect_eq"
"wrong_eq_empty" = "incorrect_eq_empty"
"wrong_lift_subset" = "incorrect_lift_subset"
"wrong_fill_subset" = "incorrect_fill_subset"
"long_value_wrong" = "long_value_incorrect"
"mem_wrong_iff" = "mem_incorrect_iff"
"correct_of_not_mem_wrong" = "correct_of_not_mem_incorrect"
"wrong_pad" = "incorrect_pad"
"wrong_pad_of_mem" = "incorrect_pad_of_mem"
"wrong_padOver" = "incorrect_padOver"
"wrong_padOver_of_mem" = "incorrect_padOver_of_mem"
"wrong_freeze" = "incorrect_freeze"
"wrong_freeze_of_off_downAt" = "incorrect_freeze_of_off_downAt"
"wrong_freeze_of_off_padDown" = "incorrect_freeze_of_off_padDown"

[rewrite]
# host_map.toml's: records of what was (the earlier moves and their maps, changelogs, the rulings), the frozen backends,
# files whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock"]

[keep]
# `P.wrong X`: the partition's wrong units, `Verity.Partition.wrong`, on the bridge's right side.
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+',
            '= P\.wrong X :=']
strings = []

[keep_in]
