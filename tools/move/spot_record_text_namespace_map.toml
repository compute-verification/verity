# The record text reader's namespace: what `tools/move/rename.py --map tools/move/spot_record_text_namespace_map.toml`
# renames. `record_text_map.toml` moved `Spot/RecordText.lean` under SPOT's verifier and left its declarations in the
# policy's namespace; this gives them SPOT's, as every other module under `Spot/` has.
# - `InferenceOnlyCheck.RecordText` becomes `Spot.RecordText`, in the module and its users (the policy's check and the
#   policy's properties and their proofs).
# - Four files name the reader's declarations as `RecordText.x`, which resolved through `InferenceOnlyCheck` (three proofs
#   inside `InferenceOnlyCheck.Record.SecurityProofs`, and the rows protocol, which opens it); there they become
#   `Spot.RecordText.x`.
# It moves no file and changes nothing else. A lock's records keep the old full names for `check.py --update --moved`,
# whose renames `--moves` prints.

[words]
"InferenceOnlyCheck.RecordText" = "Spot.RecordText"

[[words_in]]
files = ["security/Proofs/Properties/InferenceOnly/RecordWhole.lean",
         "security/Proofs/Properties/InferenceOnly/RecordBlocks.lean",
         "security/Proofs/Properties/InferenceOnly/RecordJson.lean",
         "verity/protocols/policy/inference_only/verifier/lean/InferenceOnlyCheck/RowsProtocol.lean"]
words = { "RecordText." = "Spot.RecordText." }

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the Glossary's older names), files
# whose bytes a digest pins, lock files, and move_check's own tests.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "GLOSSARY.md", "fixtures/**", "**/fixtures/**", "*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "tools/verity/check/tests/test_move_check.py",
           "tools/verity/check/move_check.py", "tools/research/src/research/store/moves.json"]
