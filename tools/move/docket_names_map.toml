# SPOT's record of a window takes its own name, the docket: what `tools/move/rename.py --map
# tools/move/docket_names_map.toml` renames in the prose (comments, docstrings, Markdown's text) of SPOT's Python and
# documents (`verity/protocols/proofs/spot/`, `spot_flock/` and `benchmarks/one_stage/`). "Registration" names one thing,
# the accounting protocol that runs once before any challenge (`verity/protocols/accounting/registration/`, its registration
# log); SPOT's record of what a window is committed to before any coin (the circuit's digest, its pieces, the sampling rule,
# the committed roots) is the docket, and its log, the log of a prover's dockets. The module's path is
# `docket_paths_map.toml`'s, the names SPOT alone defines `docket_code_map.toml`'s, SPOT's Lean `docket_lean_map.toml`'s.
#
# The map is prose only: a name in code, a string literal or backticks keeps its spelling, since SPOT's files call names
# other lanes define under the same word (`rows.registration`, `warden_rows.check_registration`,
# `window_weights.weights_registration`, `boundary_stop.stop_registration`, the certifier service's `registration`). What
# else keeps its name:
# - a registered value, and the verb: a value is registered before any coin (`registered`, `register`, `registers`,
#   `Registered`, `registered.py`), and a docket registers it;
# - an integration's registration of registered values (vLLM's weights, advice and per-expert tables registrations, the
#   committer's), and the serve's first record of the registration log (its deployment record);
# - the site registration, the auditor's and the deployment's registration, records of the registration log;
# - the accounting protocol's names in SPOT's files: the registration log, `accounting.registration`, `RegistrationLog`;
# - what a served record or a verifier's input already carries, until a format version: the formats
#   `verity/registration/v1`, `v2` and `verity/registration-receipt/v1`, the keys `"registration"`, `stream_registration`
#   and every quoted name that holds the word, the message type `Registration`, the run directory's `registration.json`
#   and the fixtures' file names;
# - environment variables and upper-case constants (`H1_REGISTRATION`), which a script and its Python spell alike;
# - the CLI flags and subcommands (`--registration`, `--window-registration`, `weights-registration`, ...), which scripts
#   outside these directories pass;
# - the R-check codes (`R1`..`R8`), as codes;
# - Lean's names (`docket_lean_map.toml`), and each Lean module a Python string or prose names here (`Spot.Registration`,
#   `Spot/Registration.lean`, `Registration.check`).
#
# A plural noun "registration records" becomes "docket records", which reads both as a noun and where "records" is the verb
# ("the root the window's registration records for it").

scope = "prose"

[words]
"a registration record" = "a docket"
"A registration record" = "A docket"
"registration record" = "docket"
"Registration record" = "Docket"
"registrations" = "dockets"
"Registrations" = "Dockets"
"registration" = "docket"
"Registration" = "Docket"

[keep]
patterns = [
  # the accounting protocol
  '[Rr]egistration log',
  'accounting[./]registration[\w./]*(?: import registration)?',
  'RegistrationLog',
  'Core\.Registration',
  # formats, keys and file names a record or an input carries
  'verity/registration[\w./-]*',
  'registration-receipt[\w./-]*',
  '(?<![\w"\x27])"[^"\n{}]*[Rr]egistration[^"\n{}]*"',
  '''(?<![\w"'])'[^'\n{}]*[Rr]egistration[^'\n{}]*'''',
  '[\w-]*[Rr]egistration[\w-]*\.(?:json|jsonl|txt|log|toml|csv|out|err)',
  # environment variables and constants, which scripts and their Python name alike
  '[A-Z0-9_]*REGISTRATION[A-Z0-9_]*',
  # CLI flags and subcommands
  '--[\w-]*registration[\w-]*',
  '\w+-registration[\w-]*',
  'registration-[\w-]+',
  # names SPOT imports from another lane, which follow that lane's rename
  'WeightsRegistration',
  # an integration's registration of registered values, and the serve's first record of the registration log
  '(?:weights|advice|tables\x27?|[Cc]ommitter\x27s|rank\x27s|own window) registration\w*',
  'registration (?:of the per-expert|of the values|as the first record)',
  'first registration record',
  'step registration\w*',
  'registration (?:of step|without it)',
  'registrations, sessions',
  # the registration protocol's record of a site: the site's, the auditor's and the deployment's registration
  '(?:[Ss]ite|[Aa]uditor\x27s(?:\s+record and)?|deployment\x27s)\s+registration\w*',
  'registration of the auditor\x27s',
  'registration, which checks',
  'certifier-key record, its registration',
  'registration\x27s params and log',
  'registration at ``site``',
  'over one registration',
  'registration\x27s link figures',
  'the registration asserts',
  '[Dd]ay\x27s registration',
  'registration opens at its registered',
  'registration record \(`SC\.DEPLOYMENT`\)',
  # vLLM's advice registration, which a window's record names
  'ℓ_a its registration',
  'window\x27s registration(?: \(``|; its roots|, and the roots|\. Its rotary| records for)',
  # the message type and a verdict record's key
  'Registration \{block\}',
  'stream_registration',
  # Lean's names, which `docket_lean_map.toml` renames
  'Spot[./]Registration[\w./]*',
  'Registration\.[A-Za-z]\w*',
]
strings = []

[rewrite]
# Never rewritten: every file outside SPOT's Python, `spot_flock/` and `benchmarks/one_stage/` but the module's dotted name,
# every Lean file and lock, fixtures, pins and vectors, kernel sources, the move maps and research's recorded moves.
exclude = ["**/*.json", "**/*.jsonl", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.csv", "**/*.txt",
           "**/*.c", "**/*.circuit-check.json", "**/*.cpp", "**/*.cu", "**/*.cuh", "**/*.h", "**/*.lean",
           "**/*vectors*.json", "**/CHANGELOG.md", "**/TRUSTED.sha256", "**/fixtures/**", "**/lake-manifest.json",
           "**/lean-audit.json", ".agents/**", ".cursor/**", ".gitattributes", ".gitignore", ".python-version",
           "AGENTS.md", "ARCHITECTURE.md", "GLOSSARY.md", "adapters/**", "artifacts.json", "benchmarks/README.md",
           "benchmarks/bandwidth/**", "benchmarks/bool_build_cost/**", "benchmarks/census/**",
           "benchmarks/certifier_term/**", "benchmarks/certifier_timing/**", "benchmarks/circuit_properties/**",
           "benchmarks/codec_tensor/**", "benchmarks/commitments/**", "benchmarks/communication/**",
           "benchmarks/compile_cost/**", "benchmarks/compute/**", "benchmarks/datacenter/**",
           "benchmarks/definitions/**", "benchmarks/dsa_topk/**", "benchmarks/exfiltration/**",
           "benchmarks/f32_exhaustive/**", "benchmarks/flock_kernels/**", "benchmarks/flock_s8_block/**",
           "benchmarks/harness/**", "benchmarks/hash/**", "benchmarks/inference_only/**",
           "benchmarks/int8_class_rate/**", "benchmarks/kv_filler/**", "benchmarks/landing/**",
           "benchmarks/machine_model/**", "benchmarks/memory/**", "benchmarks/mempool/**", "benchmarks/moe_align/**",
           "benchmarks/multi_unit/**", "benchmarks/native_peak/**", "benchmarks/nci/**", "benchmarks/network_e2e/**",
           "benchmarks/network_sim/**", "benchmarks/network_traces/**", "benchmarks/numerical/**",
           "benchmarks/overhead/**", "benchmarks/pous/**", "benchmarks/pouw/**", "benchmarks/ppl/**",
           "benchmarks/private_circuit/**", "benchmarks/prod_repro/**", "benchmarks/proof_status/**",
           "benchmarks/proof_throughput/**", "benchmarks/property_redteam/**", "benchmarks/prove/**",
           "benchmarks/prove_path/**", "benchmarks/rate_squaring/**", "benchmarks/recursion_e2e/**",
           "benchmarks/recursion_figures/**", "benchmarks/remote_session/**", "benchmarks/replay_determinism/**",
           "benchmarks/replay_ladder/**", "benchmarks/rho/**", "benchmarks/route_capture/**",
           "benchmarks/sampling_plan/**", "benchmarks/scan_cost/**",            "benchmarks/serve_tax/**",
           "benchmarks/slowdown/**", "benchmarks/served_commit/**",
           # vLLM's advice registration, which they charge
           "benchmarks/one_stage/advice_charge.py", "benchmarks/one_stage/tests/test_advice_charge.py", "benchmarks/served_errors/**", "benchmarks/served_units/**",
           "benchmarks/spot_figures/**", "benchmarks/spot_proved/**", "benchmarks/stacked_share/**",
           "benchmarks/tc_probe/**", "benchmarks/tc_probe_fp4/**", "benchmarks/tensor_duty/**",
           "benchmarks/torch_gpu/**", "benchmarks/training_slowdown/**", "benchmarks/tree/**",
           "benchmarks/two_stage/**", "benchmarks/unit_block/**", "benchmarks/unit_lowering/**",
           "benchmarks/unit_walk/**", "benchmarks/verifier_cost/**", "benchmarks/vllm_encoded/**",
           "benchmarks/word_codec/**", "demos/**", "hardware/**", "infra/**", "pyproject.toml", "ruff.toml",
           "security/**", "tests/**", "tools/**", "uv.lock", "verity/README.md", "verity/__init__.py",
           "verity/channel.py", "verity/circuits/**", "verity/claims/**", "verity/commitments/**", "verity/config.py",
           "verity/definitions/**", "verity/device.py", "verity/errors.py", "verity/hardware/**", "verity/party.py",
           "verity/protocol.py", "verity/protocols/__init__.py", "verity/protocols/accounting/**",
