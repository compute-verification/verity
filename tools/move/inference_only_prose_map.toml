# The inference-only policy in prose: what `tools/move/rename.py --map tools/move/inference_only_prose_map.toml` renames,
# the policy's older name NCI where a comment, a docstring or Markdown's text says it (GLOSSARY.md, Older names). The
# names in code are `inference_only_map.toml`'s.
#
# This move renames prose only (`scope = "prose"`): never code, a string, backticks or a data file, so it moves no path,
# renames no declaration and leaves every lock and pin as it is. Under that scope a word in capitals alone is a constant's
# name and stays, so each row is a phrase: "NCI's" is "the inference-only policy's", "the NCI check" is "the inference-only
# check", and a heading or a sentence that opens with the name opens with "The".
# What it leaves, each for a hand edit: NCI in a data file's comment (a lakefile, a pyproject, `public_boundary.toml`) and
# in a string (a figure's title, an error's text, a lock's reasons); NCI and "novel communication intensity" for the
# quantity, a block's fresh input bits per gate, which is no policy; `verity/protocols/inference_only/nci`'s own prose, which follows its
# directory's name; and the sentence of the check's README that says the older names stay, which names them in quotes.
scope = "prose"

[words]
# --- a heading or a sentence that opens with the name
"# NCI's policy" = "# The inference-only policy"
"# NCI's" = "# The inference-only policy's"
"**NCI's policy" = "**The inference-only policy"
"**NCI's" = "**The inference-only policy's"
"# NCI over" = "# The inference-only policy over"
"# NCI in reads form" = "# The inference-only policy in reads form"
"# NCI from the bits" = "# The inference-only policy from the bits"
"NCI's slowdown factor" = "The inference-only policy's slowdown factor"
"NCI's transfer gates" = "The inference-only policy's transfer gates"
"NCI's main theorem" = "The inference-only policy's main theorem"
"NCI's protocol accepts" = "The inference-only policy's protocol accepts"
"So NCI compliance" = "So compliance with the inference-only policy"
"NCI compliance" = "Compliance with the inference-only policy"
# --- the check, its package and its difftests
"NCI policy" = "inference-only policy"
"NCI check" = "inference-only check"
"NCI package's" = "inference-only check's"
"NCI difftests" = "inference-only difftests"
"NCI difftest" = "inference-only difftest"
"NCI's check" = "the inference-only check"
"NCI's policy" = "the inference-only policy"
# --- the policy
"an NCI floor" = "a floor by the inference-only policy"
"NCI and the accounting" = "the inference-only policy and the accounting"
"dampener (NCI," = "dampener (the inference-only policy,"
"NCI's" = "the inference-only policy's"

[rewrite]
# Never rewritten: the term source and the lints and tables that spell the old words on purpose, records of what was
# (the earlier moves and their maps, changelogs, the rulings), the move tools' own tests, the frozen backends, replicated
# fixtures, files whose bytes a digest pins and lock files; and `verity/protocols/inference_only/nci`, whose prose follows its name.
exclude = ["GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "tools/research/tests/test_slack.py", "tools/move/**", "tools/verity/check/tests/test_move_check.py",
           "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/lake-manifest.json", "verity/protocols/inference_only/nci/**"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+',
            'lanes/[\w.-]+']
strings = []
