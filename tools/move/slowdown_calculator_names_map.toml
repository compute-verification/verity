# The slowdown calculator's names that its move leaves: what `tools/move/rename.py --map
# tools/move/slowdown_calculator_names_map.toml` renames, on a tree `slowdown_calculator_map.toml`'s move has run on (its
# files are named where that move puts them). They rename no path, module or Lean declaration, so the change they make is
# an ordinary one, reviewed as such.
# - Its outputs: `rho.md` and `rho.json` are `slowdown.md` and `slowdown.json`.
# - The references the move's tools don't follow: `HERE.parent / "rho"` in the runner that puts the calculator on
#   `sys.path`, its directory among the trees with an import root of their own (`tests/test_boundaries.py`), and
#   `rho/params.py` in a comment of the circuit properties' suite, a path from the calculator's directory that its
#   move keeps there ([rewrite] keep_in).
# - The calculator named "rho" in the benchmarks' prose: "rho's" is "the slowdown calculator's".
# What stays: the command `verity bench rho` where a document still gives it (the command runs a directory of
# `benchmarks/`, so none runs the calculator: a hand edit), the symbol ρ, every `rho` that is a number
# (`Overhead.rho`, `Estimate.rho`, the JSON's `rho`), and the red team's codec, whose `rho` is a function of its own
# ([keep_in]).

[words]

[[words_in]]
files = ["verity/protocols/inference_only/slowdown/**"]
words = { "rho.md" = "slowdown.md", "rho.json" = "slowdown.json" }

[[words_in]]
files = ["verity/protocols/inference_only/nci/statement.py"]
words = { 'HERE.parent / "rho"' = 'HERE.parent / "slowdown"' }

[[words_in]]
files = ["tests/test_boundaries.py"]
words = { "protocols/inference_only/rho" = "protocols/inference_only/slowdown" }

[[words_in]]
files = ["benchmarks/circuit_properties/pyproject.toml"]
words = { "rho/params.py" = "slowdown/params.py" }

[[words_in]]
files = ["benchmarks/**", "verity/protocols/inference_only/nci/**", "verity/protocols/inference_only/slowdown/**"]
words = { "rho's" = "the slowdown calculator's" }

[rewrite]
# Never rewritten: the earlier moves and their maps, lock files, and the cards a digest names.
exclude = ["tools/move/**", "uv.lock", "**/*.lock", "benchmarks/spot_figures/cards/**"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+',
            'lanes/[\w.-]+']
strings = []

[keep_in]
"benchmarks/property_redteam/**" = ["rho's"]
