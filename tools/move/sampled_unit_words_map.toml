# The retired words "sampled unit": what `tools/move/rename.py --map tools/move/sampled_unit_words_map.toml` renames, by
# the Glossary's row ("the sample, a sampled proof block"): prose in SPOT's second stage and second window (Python and
# Lean), the committed-values properties, the period interface's `NotImplementedError` messages, PoUW's credit and the
# onsite record's docstrings; the refusal `PARTS_WHY` ("a sampled unit is in no rank member"), in
# `spot/verifier/second_window.py` and `Spot/SecondWindow.lean` together, which no test matches; and six test names, each
# its one definition (in SPOT's wires and wired-key difftests, `test_optimize`, `test_prove_path`,
# `test_window_audit_wiring` and the served-integrity tests). No Lean declaration is renamed.
# It leaves: the onsite record's `REPROOF` descriptions, which the record stores; "unsampled unit", which no entry matches
# (the word "unit" alone is its own family); the fixtures; the certifier's paths, until network-accounting's rename is in;
# the lock records; and the lints and the Glossary row that name the old words.

[words]
"sampled_units" = "sampled_proof_blocks"
"sampled_unit" = "sampled_proof_block"
"Sampled units" = "Sampled proof blocks"
"sampled units" = "sampled proof blocks"
"Sampled unit" = "Sampled proof block"
"sampled unit" = "sampled proof block"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps), fixtures and vectors, files whose bytes a digest
# pins, lock files (the Lean locks' records and frozen reasons included), the vLLM registry, the certifier's paths (its
# lane renames them) and the two lints that name the retired words.
exclude = ["tools/move/**", "**/fixtures/**", "**/*vectors*.json", "**/*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/lean-audit.json", "benchmarks/numerical/tests/bench/data/**",
           "tests/test_retired_terms.py", "tests/lint/test_repo_retired_terms.py",
           "adapters/vllm/verity_vllm/definitions/registry/**",
           "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]

[keep]
# The Glossary's row of the older names, and the onsite record's stored re-proof descriptions.
patterns = ['(?m)^\| "draw".*$', "the sampled units' and those ", "each sampled unit's opening as it was proved",
            "the audit record, each sampled unit's verdict"]
