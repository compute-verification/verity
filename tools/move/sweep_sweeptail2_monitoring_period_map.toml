# `PeriodError` and `IntegrityHorizon`, the identifiers of the Python side that spell the retired `*Period*` and `*Horizon*`
# (GLOSSARY.md Older names: "horizon", `*Horizon*` and `*Period*` names are the monitoring period, `horizon` its pooled reading):
# what `tools/move/rename.py --map tools/move/sweep_sweeptail2_monitoring_period_map.toml` renames.
# - `PeriodError`, the error of `verity.protocol`'s monitoring-period validation (no `.lean` file declares it), is
#   `MonitoringPeriodError`, with the two test modules that import it.
# - `IntegrityHorizon`, cited in the cost model's docstrings and printed report lines for the Lean guarantee that is now
#   `Flock.Guarantees.IntegrityPooled`, is `IntegrityPooled`.
# It leaves the certification period (`NetworkCheck.Period`), an auditor party's `Attest.Period` and its `SignedPeriod`, PoUW's
# credit period and its protocol id `verity/pouw/period/v1`, the Definition ids of the period check's cases (`NetworkPeriodScan*`),
# Kubernetes' `terminationGracePeriodSeconds`, and every Lean declaration. The one-stage record's `POOLED` text and `statement`
# value carry `IntegrityHorizon` in a window report's record, so `benchmarks/one_stage/onsite_record.py` and its test are excluded.
# The map is `scope = "prose"`: `IntegrityHorizon` in a printed report line of `cost/h200.py` is a string, a hand edit.

scope = "prose"

[words]
"PeriodError" = "MonitoringPeriodError"
"IntegrityHorizon" = "IntegrityPooled"

[keep]
strings = ["NetworkCheck.Period", "NetworkCheck/Period", "Attest.Period", "SignedPeriod", "AttestPeriod", "verity/pouw/period/v1", "pouw-period", "NetworkPeriodScan", "terminationGracePeriodSeconds"]

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "tools/research/tests/test_slack.py", "tools/check/tests/test_move_check.py", ".agents/skills/friction/SKILL.md", "benchmarks/one_stage/onsite_record.py", "benchmarks/one_stage/tests/test_onsite_record.py"]
