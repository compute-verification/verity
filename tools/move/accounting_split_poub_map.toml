# The accounting area's split by protocol, into `Poub`, by `tools/move/rename.py --map tools/move/accounting_split_poub_map.toml`.
#
# `security/`'s `Accounting` area holds the Lean of seven protocols. Each family of it (the first name under an
# `Accounting/` of a tree, or under its `Guarantees/` and `Assumptions/`) goes to the area of the protocol it states, in
# each tree (`Definitions/`, `Properties/`, `Proofs/` and `Proofs/Properties/`):
# - `Pouw`: `TS` (the receipt rounds), `Headline`, `HeadlineDc`, `PerRun*`, `HMu`, `BoundReceipt`, `BoundSketch`,
#   `CoinFlow`, `Filler`, `FillerLuck`, `CostModel`, `ChainWork`, `Confidence`, `Bridges`, `CreditedWords`, `Pouw*`;
# - `Poub`: `RateAudit*`, `Bandwidth*`;
# - `Compose`: `Compose`, `ComposeMonitoringPeriod`, `Joint*` (three audits on one device), `Remote*` (the remote audit's
#   Held, Draw, Fork, Sketch), `Additive`, `Stacking`, `Stages`, `Parties`, `PeriodBinding`;
# - `Certifier`: `JointBridge`, `Bridge`, `NetWitness`, `Assumptions/RemoteOutside`;
# - `Pous`: `Responder`, `Memory`, `Wipe`, `Tag`;
# - `Registration`: `Sheets`, `Assumptions/Sheet`, `Capacity`, `Carrier`, `Device`, `Physical`;
# - `Slowdown` (the slowdown bound's area, `slowdown_area_map.toml`'s): `Slowdown`, `Coverage*`, `ServingBlocks`,
#   `Guarantees/Actual`. `Definitions/Accounting/Slowdown.lean` becomes `Definitions/Slowdown/Tasks.lean`, after its
#   heading, since `Slowdown/Slowdown.lean` is taken.
# What stays in `Accounting` is the shared accounting vocabulary: `Actual`, `Gates`, `ReadUnit`, `RegisteredCircuit`, `Requirement`,
# `Served`, `Window`, `Schedule`, `Lemmas`, `Prob`, `Defs`, `Sanity`, the `Guarantees` and `Assumptions` not named above,
# and each tree's `Accounting.lean`, whose imports follow the modules. A file goes where its family goes, also where its
# own text names another protocol more.
#
# Each moved unit is two words: its path below `security/` and its module, which the path names (`Proofs` and its
# `Properties/` sit below `security/` by `srcDir = ".."`), so the files move and every import and path follows. A word
# matches after a `/` or a `.`, so `Properties/Accounting/X` also moves `Proofs/Properties/Accounting/X`. Declarations
# keep their namespaces (`Accounting.TS.*`), but for the properties tree's, which spell their module
# (`Properties.Accounting.JointBridge.*` becomes `Properties.Certifier.JointBridge.*`); the locks' records keep the old
# names for `tools/verity/lean/check.py --update --moved` with the map `rename.py --moves` prints. It is a word map and
# not a layout map because `layout.py` names a module from the nearest lakefile, which `srcDir = ".."` defeats.
# The split is seven maps, one for each destination, since `rename.py` records a directory's move only when it has
# one destination. A word matches as the first part of a longer name (`Joint` in `JointBridge`), so the certifier's
# map runs before compose's; they run in this order: `accounting_split_pouw_map.toml`, `accounting_split_poub_map.toml`, `accounting_split_certifier_map.toml`, `accounting_split_compose_map.toml`, `accounting_split_pous_map.toml`, `accounting_split_registration_map.toml`, `accounting_split_slowdown_map.toml`.

