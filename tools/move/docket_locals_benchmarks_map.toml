# A window's docket as a parameter or local in one-stage's and two-stage's benchmarks: `registration` becomes `docket`
# in the replay bundle's checks (`replay_bundle.check`, `check_reads`, `check_step`, `_check_commitment`), their
# tests' fixture and SPOT's `prove_bundle` call, `benchmarks/two_stage/audit.py` and `a3.lean_split`. The summaries'
# key `registration`, the advice registration of `test_onsite_record`, PoUB's memory-map registration (`a7`,
# `plan_shards`) and the negatives' helpers keep their word.

[words]

[[words_in]]
files = ["benchmarks/one_stage/interfaces/verity_e2e_demo/replay_bundle.py"]
[words_in.words]
"(registration" = "(docket"
", registration" = ", docket"
"=registration" = "=docket"
"registration is" = "docket is"
"registration," = "docket,"
"registration:" = "docket:"
"registration=" = "docket="
"registration[" = "docket["

[[words_in]]
files = ["benchmarks/one_stage/interfaces/tests/test_replay_bundle.py"]
[words_in.words]
"registration(" = "docket("
"registration)" = "docket)"
"registration=" = "docket="

[[words_in]]
files = ["verity/protocols/proofs/spot/prover/audit/prove_bundle.py"]
[words_in.words]
"registration=" = "docket="

[[words_in]]
files = ["benchmarks/two_stage/audit.py"]
[words_in.words]
"registration)" = "docket)"
"registration." = "docket."
"registration:" = "docket:"

[[words_in]]
files = ["benchmarks/one_stage/a3.py"]
[words_in.words]
"registration," = "docket,"
"registration:" = "docket:"

[keep]
patterns = []
strings = []

[rewrite]
exclude = ["**/*.json", "**/*.jsonl", "**/*.toml", "**/*.lean", "**/fixtures/**", "tools/move/**",
           "tools/research/src/research/store/moves.json"]
