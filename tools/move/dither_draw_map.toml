# Dither's local names for the sampling coin: what `tools/move/rename.py --map tools/move/dither_draw_map.toml` renames.
# The Glossary retires "draw" for "sample"; `draw_compound_map.toml` renamed the family's compound names to sample,
# sampled and sampling and left the bare words, so Dither's own locals take its spellings here, in its one file alone:
# - `dither_so.py`: the execution phase's end takes the coin and its time as `sample, sample_at` (from the round pipe's
#   `draw`, which is `benchmarks/pouw/served_h1/coins.py`'s and stays), times it as `t_sample`, keeps both in the
#   in-process record as "sample" and "sample_at" (the record holds the pipe and tensors; nothing stores it), checks it as
#   `sample_why`, and `rehashed_calls` takes the count the coin picks as `sampled`.
# What stays: the keys stored records carry (`draw_coin`, `draw_after`, `draw_after_manifest_root`, `draw_reason`,
# `rounds_after_draw`, `receipts_after_draw`), the round pipe's `draw`, the PoUW window's `Wd.DRAW`, nvidia-smi's
# `power.draw`, and every other `draw` of the tree.

[words]

[[words_in]]
files = ["benchmarks/hash/dither/dither_so.py"]
words = { "draw, draw_at = " = "sample, sample_at = ", "draw_at" = "sample_at", "t_draw" = "t_sample", "draw_why" = "sample_why", "drawn" = "sampled", "\"draw\": draw," = "\"sample\": sample,", "rec[\"draw\"]" = "rec[\"sample\"]" }

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs), files whose bytes a digest pins
# (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock"]

[keep]
patterns = []
strings = []
