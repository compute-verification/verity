# PoUB's Lean verifier's test module `test_drawn` is `test_sampled` (MEM-152's retired words), by
# `python3 tools/move/rename.py --map tools/move/draw_poub_test_module_map.toml`: its path, its test, its import in
# `test_protocol.py` and its line in the package's test inputs. The retired-terms allowlist follows the path.

[words]
"test_drawn" = "test_sampled"

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "GLOSSARY.md", "tests/lint/*.py",
           "tests/test_retired_terms.py", "verity/protocols/accounting/certifier/**", "security/**/Certifier/**",
           "verity/protocols/accounting/pouw/**"]
