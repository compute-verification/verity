# Pearl's "cap" in names that name only the bound: what `tools/move/rename.py --map
# tools/move/sweep_sweepcap_inert_bound_names_map.toml` renames, each compound name `names.tsv` found to be Pearl's alone
# (`CAP_ROW_WORDS`, `CAP_CHUNKS`, `_cap_ok`, `_over_the_cap`), whole, as `inert_bound` takes the word in it.
#
# Not here: a bare `cap` in code (the share ι by one symbol, the bound by another: `names.tsv`'s ASK lines), a registered
# Definition's name, a leaf role, a record key and Pearl+'s `over_cap` (its HELD lines), and Lean.

