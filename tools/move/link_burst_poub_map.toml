# The retired word "link window" in its PoUB sense, a link's burst `B_l` (MEM-152's retired words), by
# `python3 tools/move/rename.py --map tools/move/link_burst_poub_map.toml`: the constant `timing.LINK_WINDOW_BYTES`, the
# blocks one boundary link may bring in a burst, is `timing.LINK_BURST_BYTES`. The network sense, an execution phase's
# transfer blocks on one link, is `link_window_words_map.toml`'s.

[words]
"LINK_WINDOW_BYTES" = "LINK_BURST_BYTES"

[rewrite]
exclude = ["tools/move/**", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "GLOSSARY.md", "tests/lint/**",
           "tests/test_retired_terms.py", "verity/protocols/accounting/certifier/**", "security/**/Certifier/**"]
