# The compute audit's move into SPOT: what `tools/move/layout.py --map tools/move/audit_code_map.toml` moves and
# rewrites.
#
# ARCHITECTURE.md's row "The compute audit's cost model, and the commands that run an audit on a served run" moves
# proofs' scripts under `benchmarks/` into SPOT's `prover/`, `verifier/` and `device/`
# (`verity/protocols/proofs/spot/`); the measured proving costs they are fitted to stay under `benchmarks/` as data.
#
# - The verifier's side goes to `spot/verifier/one_stage/`: the member trees, the served window's integrity, the audit
#   record, the verifier's checks asked once (`check_memo.py`), its own copy of a template's circuit, and a window's
#   audit from its records alone.
# - The auditor's device takes the challenger's session, its host and the two-stage audit as the challenger runs it.
# - The commands that run the prover and the verifier together go to `spot/prover/audit/`, since a file under
#   `verifier/` may not load one under `prover/`; the cost model goes to `spot/prover/cost/`, beside the planner.
# - Each file's tests go with it when they load only moving files; a test that also loads a script left under
#   `benchmarks/` stays there and imports the moved file. Two tests whose names SPOT's verifier tests already hold
#   take the `one_stage_` prefix.
# - Files named for a run (`a0`, `a5`, `r2`) take the name of what they do, since no run's id stands under `verity/`.
# Stays under `benchmarks/`: `sampling_plan/inputs.py` and its JSON inputs, `one_stage/zk_cost.py` and `a8_cost.py`
# (the measured costs), the demo's orchestration (`one_stage/served_verdicts.py` and `.sh`, which the demo's
# configuration takes) and `one_stage/interfaces/`. The imports that name a moved script as a bare module off
# `sys.path` (`import a5 as A5`) are no module `layout.py` derives, and a hand commit after the move rewrites them.

