# compute-accounting's names off the vocabulary guard's KNOWN list (`tests/test_lean_vocabulary.py`): what
# `tools/move/rename.py --map tools/move/known_compute_map.toml` renames. Each homonym takes the name of what it is, in
# Security's Pouw and Accounting areas, PoUW's code Lean and Python, and benchmarks/pouw. A [[words_in]] block names the
# files where its bare word means that declaration; [keep] holds the other declarations of the same word in those files
# (the canonical `Verity.Accel.Machine`, a circuit's `Transcript`, a cost model's `Prog` field) and every module name, so
# no file moves. Declarations keep their place in the locks' records: `rename.py --moves` prints the map that
# `check.py --update --moved` takes. It reruns on a later tree, so a branch carried across it runs it again after merging.

[words]

[keep]
patterns = ['(?m)^import .*$', '\b(?:Definitions|Proofs|Properties|Models)\.[\w.]+', '\b(?:Verity\.)?Accel\.Machine\b',
            '(?:\bC|toCircuit|Circuit)\.Transcript\b', '(?m)^[ \t]+Prog :=', '\b(?:CM[₀-₉]?|M|m|Pous|Mc|toyMc|tm)\.Prog\b',
            '\b(?:Served|Discharge|Slots)\.Layout\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']
strings = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the rulings), the frozen backends,
# files whose bytes a digest pins, the research harness's recorded moves, and the guard's own list, edited by hand.
exclude = ["tools/move/**", "archive/**", "tools/research/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md",
           "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "tools/verity/check/tests/test_move_check.py", "tests/test_lean_vocabulary.py"]

