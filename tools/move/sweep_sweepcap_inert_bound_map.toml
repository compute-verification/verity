    "tools/check/tests/test_move_check.py",
    "archive/**",
    ".agents/skills/friction/SKILL.md",
    "**/CHANGELOG.md",
    "fixtures/**",
    "**/fixtures/**",
    "*.patch",
    "**/TRUSTED.sha256",
    "uv.lock",
    "**/*.lock",
    "**/lake-manifest.json",
    "**/*.lean",
    "**/lean-audit.json",
    "**/*.cu",
    "**/*.cuh",
    "**/*.c",
    "**/*.cc",
    "**/*.cpp",
    "**/*.h",
    "**/*.hpp",
    "benchmarks/pouw/harness/price_twins.json",
