# The retired word family DRAW's bare words (`draw`, `drawn`, `draws`, `Draw`, `Drawn`) in memory accounting's Lean
# and Python, which `draw_compound_map.toml` leaves to each owner: renamed to the Glossary's sample, sampled, samples.
#
# Two parts, namespaces first.
# - `tools/move/rename.py --map tools/move/draw_bare_map.toml` renames our `Draw` namespaces' qualified names and our
#   `Draw` modules' paths, as whole words in every file that spells them (`[[words_in]]`, files "*"):
#   `Accounting.Remote.Draw` and `.Assumptions`, `Accounting.SecurityProofs.Remote.Draw` (`Remote.Draw`), and the
#   modules `…/Remote/Draw` and `…/RemoteHeld/Draw`, wherever the area that holds them stands.
# - `tools/move/draw_bare.py code` then renames the unqualified bare words in code and in backticked names alone, never
#   in prose or a string literal, in the files `[code.files]` lists. `draw_bare.py plan --write` writes that list: our
#   files where no other owner's declaration of the word is reachable through the file's imports (Lean) or imported
#   (Python), and no record serializes a field by its name. Every other file of ours that spells a bare word in code
#   is in `[code.by_hand]`, renamed by hand and built; `[code.tokens]` holds the hand edits the build needs.
# Prose is left for its own map, and PoUW's files in the accounting area (`TS`, `Headline*`, `Compose*`, `HMu`,
# `Pouw*`, `TS.Drawn` among them) for its lane.

[rewrite]
exclude = [
  "tools/move/**",
  "GLOSSARY.md",
  "tests/lint/**",
  "tests/test_retired_terms.py",
  "tools/verity/lean/tests/fixtures/**",
  # the certifier's files, which network accounting reruns each map over
  "verity/protocols/accounting/certifier/**",
  "security/**/Certifier/**",
]

[keep]
strings = [
  "\"draw\"",
  "\"drawn\"",
  "\"draws\"",
  "\"unit_draw\"",
  "'draw'",
  "'drawn'",
  "'draws'",
  "draw/0",
  "draw/second/0",
]
patterns = [
  "draw: (?:coins: )?",
]

[words]

[[words_in]]
files = ["*"]

[words_in.words]
"Remote.Draw" = "Remote.Sample"
"RemoteHeld.Draw" = "RemoteHeld.Sample"
"Remote/Draw" = "Remote/Sample"
"RemoteHeld/Draw" = "RemoteHeld/Sample"

[code]
# the words `draw_bare.py code` renames, in code and backticks only
words = { Draw = "Sample", Drawn = "Sampled", draw = "sample", drawn = "sampled", draws = "samples" }
# other owners' names our files spell, kept: Flock's and SPOT's `Draw` namespaces, Core's module and `Draw.Subset`,
# PoUW's and SPOT's properties, Flock's sampling module, the game's `draw`
keep = [
  "Flock\\.Draw\\b",
  "Spot\\.Draw\\b",
  "Core\\.Draw\\b",
  "Draw\\.Subset\\b",
  "Pouw\\.Draw\\b",
  "Sampling\\.Draws\\b",
  "Game\\.draw\\b",
]

# the hand edits the build needs, by file (a glob, which an area's move leaves standing): each name, renamed where it
# stands in code: our `Draw` namespaces, where a file of `[code.by_hand]` names them unqualified
[code.tokens]
"security/Definitions/*/Remote/Sample.lean" = ["Draw.pooled"]
"security/Proofs/*/RemoteHeld/Sample.lean" = ["namespace Draw", "end Draw", "Draw.pooledSampleLive"]
"security/Proofs/*/RemoteHeld/DrawMeets.lean" = ["Draw.arrange_lt", "Draw.prfAdvantage_honest", "Draw.four_le_words"]

# `[code.files]` (each file's words) and `[code.by_hand]` (each file's reason) follow, as `draw_bare.py plan --write`
# writes them on the moved tree
