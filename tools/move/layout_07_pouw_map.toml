"benchmarks.pouw.budget" = "verity.protocols.pouw.budget"
"benchmarks.pouw.clear" = "verity.protocols.pouw.clear"
"benchmarks.pouw.eps_budget" = "verity.protocols.pouw.eps_budget"
"benchmarks.pouw.gamma" = "verity.protocols.pouw.gamma"
"benchmarks.pouw.grind_price" = "verity.protocols.pouw.grind_price"
"benchmarks.pouw.period_cost" = "verity.protocols.pouw.period_cost"
