# The declarations that leave the inference-only policy's mixed files for the slowdown bound's area: what
# `tools/move/rename.py --map tools/move/slowdown_split_map.toml` renames outside the Lean that moved them. A declaration
# moved into `Slowdown` takes its namespace from its new file (`InferenceOnly.Guarantees.Inference` becomes
# `Slowdown.Guarantees.Inference`); this map renames the other places that name it in full. Whole words only: each word
# is a full declaration name.

[words]

[[words_in]]
files = ["*"]

[words_in.words]
"InferenceOnly.Guarantees.Inference" = "Slowdown.Guarantees.Inference"
"InferenceOnly.SecurityProofs.Inference" = "Slowdown.SecurityProofs.Inference"
"InferenceOnly.SecurityProofs.threaded_reads_by" = "Slowdown.SecurityProofs.threaded_reads_by"
"InferenceOnly.slowdown" = "Slowdown.slowdown"
"InferenceOnly.SecurityProofs.piece" = "Slowdown.SecurityProofs.piece"
"InferenceOnly.SecurityProofs.mem_dark" = "Slowdown.SecurityProofs.mem_dark"
"InferenceOnly.SecurityProofs.card_le_dark_add_inter" = "Slowdown.SecurityProofs.card_le_dark_add_inter"
"InferenceOnly.SecurityProofs.mem_piece" = "Slowdown.SecurityProofs.mem_piece"
"InferenceOnly.SecurityProofs.piece_subset" = "Slowdown.SecurityProofs.piece_subset"
"InferenceOnly.SecurityProofs.piece_subset_computed" = "Slowdown.SecurityProofs.piece_subset_computed"
"InferenceOnly.SecurityProofs.into_piece_subset" = "Slowdown.SecurityProofs.into_piece_subset"
"InferenceOnly.SecurityProofs.card_piece_le" = "Slowdown.SecurityProofs.card_piece_le"
"InferenceOnly.SecurityProofs.freshInput_piece" = "Slowdown.SecurityProofs.freshInput_piece"
"InferenceOnly.SecurityProofs.sum_card_filter_piece" = "Slowdown.SecurityProofs.sum_card_filter_piece"
"InferenceOnly.SecurityProofs.ofContainment_S" = "Slowdown.SecurityProofs.ofContainment_S"

[rewrite]
exclude = ["tools/move/**", "**/lean-audit.json"]
