# SPOT's record of a window is the docket (`docket_names_map.toml`): what `tools/move/rename.py --map
# tools/move/docket_lean_map.toml` renames in SPOT's Lean and in every name of it the tree spells. The namespace
# `Spot.Registration` becomes `Spot.Docket`, its module `Spot/Registration.lean` `Spot/Docket.lean`, each of its names a
# file that opens `Spot` spells as `Registration.NAME` becomes `Docket.NAME` (`[[words_in]]` below: the files that name
# no other `Registration` namespace's, which `Core.Site.Registration`, `Site.Registration`, PoUB's `RemoteAudit`
# `Registration` and `verity.device`'s are, and keep), and the theorem about its check's empty log, `registration_nil`,
# `docket_nil`. The Lean locks' records keep the old names for `tools/verity/lean/check.py --update --moved`, whose map
# `rename.py --moves` prints.
#
# What keeps its name:
# - the keys and words a record or a verifier's input carries, which Lean's string literals spell (`"registration"`,
#   `registration_deadline` and `Spot.Stream`'s `registrationDeadline`, the formats `verity/registration/v1`, `v2`);
# - `Spot.MonitoringPeriod`'s `registration` and `registrationOf`, the circuit the monitoring period's registration
#   committed, which is the accounting protocol's registration and not a docket;
# - the directory `benchmarks/verifier_cost/registration/`, a measurement's name.

[words]
"Spot.Registration" = "Spot.Docket"
"Spot/Registration" = "Spot/Docket"

