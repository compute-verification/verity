# The edited GEMM's analysis and measurement scripts, back to PoUW's benchmarks: what
# `tools/move/layout.py --map tools/move/edited_gemm_measures_map.toml` moves and rewrites.
#
# `pouw_gemm_kernels_map.toml` took them with the kernels into `verity/`, where what they import (`exact_kit`, the
# ACCEL machine model, torch) is refused. The depth-R fold check goes beside the other fold checks in
# `benchmarks/pouw/theory/`; the ncu profile pricers and torch's SDPA baseline go to `benchmarks/pouw/edited_gemm_profile/`
# (not the retired `benchmarks/pouw/edited_gemm/`, so no file returns to a path it was moved from); their tests join the
# pouw suite. The kernels, their CPU references and the drivers stay. No file is split, added or deleted. The format is
# `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/protocols/accounting/pouw/prover/kernels/edited_gemm/egemm_depthr_check.py" = "benchmarks/pouw/theory/egemm_depthr_check.py"
"verity/protocols/accounting/pouw/prover/kernels/edited_gemm/tests/test_egemm_depthr.py" = "benchmarks/pouw/tests/test_theory_egemm_depthr.py"
"verity/protocols/accounting/pouw/prover/kernels/edited_gemm/eps_profile.py" = "benchmarks/pouw/edited_gemm_profile/eps_profile.py"
"verity/protocols/accounting/pouw/prover/kernels/edited_gemm/vprod_profile.py" = "benchmarks/pouw/edited_gemm_profile/vprod_profile.py"
"verity/protocols/accounting/pouw/prover/kernels/edited_gemm/flash_ref.py" = "benchmarks/pouw/edited_gemm_profile/flash_ref.py"
"verity/protocols/accounting/pouw/prover/kernels/edited_gemm/tests/test_eps_profile.py" = "benchmarks/pouw/tests/test_edited_gemm_eps_profile.py"
"verity/protocols/accounting/pouw/prover/kernels/edited_gemm/tests/test_vprod_profile.py" = "benchmarks/pouw/tests/test_edited_gemm_vprod_profile.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: the layout of record (`tests/tree.toml`), records of what was (the earlier moves and their maps,
# changelogs, research's recorded moves, the archive), files whose bytes a digest pins, and Lean sources.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/circuits/silicon/captures/**",
           "verity/circuits/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "**/*.lean", "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"verity.protocols.accounting.pouw.prover.kernels.edited_gemm.egemm_depthr_check" = "benchmarks.pouw.theory.egemm_depthr_check"
"verity.protocols.accounting.pouw.prover.kernels.edited_gemm.eps_profile" = "benchmarks.pouw.edited_gemm_profile.eps_profile"
"verity.protocols.accounting.pouw.prover.kernels.edited_gemm.flash_ref" = "benchmarks.pouw.edited_gemm_profile.flash_ref"
"verity.protocols.accounting.pouw.prover.kernels.edited_gemm.tests.test_egemm_depthr" = "benchmarks.pouw.tests.test_theory_egemm_depthr"
"verity.protocols.accounting.pouw.prover.kernels.edited_gemm.tests.test_eps_profile" = "benchmarks.pouw.tests.test_edited_gemm_eps_profile"
"verity.protocols.accounting.pouw.prover.kernels.edited_gemm.tests.test_vprod_profile" = "benchmarks.pouw.tests.test_edited_gemm_vprod_profile"
"verity.protocols.accounting.pouw.prover.kernels.edited_gemm.vprod_profile" = "benchmarks.pouw.edited_gemm_profile.vprod_profile"
