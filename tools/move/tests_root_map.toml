# Every test under `verity/` to the root, mirrored by path: `verity/A/B/tests/X` becomes `tests/verity/A/B/X`, what
# `tools/move/layout.py --map tools/move/tests_root_map.toml` moves and rewrites. A sizing move on a scratch branch: it
# lands nowhere. The two suites whose pyproject sits in their own `tests/` (`verity/tests/`, `verity/protocols/tests/`)
# move whole, pyproject and inner `tests/` with them. No file is split or deleted. The roots and the excludes are
# `audit_code_back_map.toml`'s. The format is `layout_map.toml`'s.

