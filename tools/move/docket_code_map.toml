# SPOT's record of a window is the docket (`docket_names_map.toml`): what `tools/move/rename.py --map
# tools/move/docket_code_map.toml` renames in code, the names SPOT alone defines for its docket, with every caller in the
# tree. A name another lane defines under the word keeps it here, though SPOT's files call it (`rows.registration`,
# `warden_rows.check_registration`, `commit.registration`, the certifier service's `registration`,
# `window_weights.weights_registration` and `registration_pins`, `boundary_stop.stop_registration`, `WeightsRegistration`),
# and so do the names SPOT's code shares with them under the same word: the attribute, keyword and local `registration`,
# `registrations` and `_registration`. Also kept:
# - `Check.registration_deadline`, which is the window parameters' key `registration_deadline`, the flag
#   `--registration-deadline` and `Spot.Stream`'s key;
# - `optimize.registration_count` and `registration_sample`, the price of a docket in the cost model, whose row key
#   `registration_sample` `benchmarks/spot_figures/` and its fixtures read;
# - an integration's registration of registered values, its own window record and a window's committed rows
#   (`weights_registration_of_serve`, `registration_roots`, `public_registration`, `step_registration`,
#   `RegistrationSize`: `docket_code_back_map.toml`);
# - Lean's names, every Lean file and lock (`docket_lean_map.toml`), data files and fixtures.

[words]
"one_stage.registration" = "one_stage.docket"
"_stratified_registration" = "_stratified_docket"
"_registration_members" = "_docket_members"
"_registration_verdict" = "_docket_verdict"
"_registration_token" = "_docket_token"
"ServedRegistration" = "ServedDocket"
"_work_registration" = "_work_docket"
"h1_registration" = "h1_docket"

[keep]
patterns = [
  # a test's name that names vLLM's weights registration
  'weights_registration_roots\w*',
  # the vLLM adapter's test of its own H1 registration's bytes
  'test_h1_registration\w*',
]
strings = []

[rewrite]
exclude = ["**/*.json", "**/*.jsonl", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.csv", "**/*.txt", "**/*.lean",
           "**/CHANGELOG.md", "**/TRUSTED.sha256", "**/fixtures/**", "tools/move/**",
           "tools/research/src/research/store/moves.json"]
