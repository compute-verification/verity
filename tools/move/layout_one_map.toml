# which leaves `benchmarks/pouw`.
# `benchmarks/pouw/contents/paths/clear.toml`: the entry of `benchmarks/pouw`'s contents for `clear/`, which leaves
# `benchmarks/pouw`.
# `benchmarks/pouw/contents/paths/np_kernel.toml`: the entry of `benchmarks/pouw`'s contents for `np_kernel/`, which
# goes to `archive/`.
paths = ["benchmarks/pouw/contents/filler/receipts.toml", "benchmarks/pouw/contents/paths/clear.toml", "benchmarks/pouw/contents/paths/np_kernel.toml"]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that
# writes a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz",
           "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256", "**/lake-manifest.json.lock",
           "tools/move/**", "archive/**", "benchmarks/numerical/reports/**", "benchmarks/numerical/tests/bench/data/**",
           "**/price_twins.json", "verity/ml/circuits/silicon/captures/**", "verity/ml/circuits/silicon/hawkeye/**", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "integrations/vllm/manifests/**", "integrations/vllm/workloads/**", "integrations/vllm/data/**",
           "integrations/vllm/verity_vllm/pins/**", "tools/verity/check/tests/test_suites.py", "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/tc_probe_fp4/fp4_emulation_1ad1aaa2.py", "benchmarks/network_e2e/tests/data/**", "benchmarks/hash/dither/j10b_ref.py", "benchmarks/hash/dither/j10ca_ref.py",
           "benchmarks/hash/dither/j10hb.py", "benchmarks/hash/dither/j10rtx.py", "benchmarks/hash/dither/j10served.py", "integrations/vllm/tools/migrate/superseded_quarantine.py",
           "integrations/vllm/tests/migrate/test_superseded_quarantine.py", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**", "adapters/vllm/data/**",
           "adapters/vllm/verity_vllm/pins/**", "adapters/vllm/tools/migrate/superseded_quarantine.py", "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md",
           "**/lake-manifest.json", "integrations/vllm/manifests/definitions.json", "adapters/vllm/manifests/definitions.json",
           "verity/ml/flock/tests/lean/RandomnessVectors.lean", "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean", "verity/core/protocols/spot/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean", "verity/core/protocols/spot/tests/lean/ExfiltrationTwoVectors.lean", "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

