# The layout move of the whole layout: what `tools/move/layout.py --map tools/move/layout_one_map.toml` moves and
# rewrites. 5316 files in 436 rows. Written by `tools/move/layout_maps.py`, which states the rule: edit that, not
# this.
# A moved file's new path is its component's new directory, then the name of the directory it is in today, then its
# path below that; the name is left out where the new directory, less `verifier/`, `prover/` or `device/`, already
# ends in it. A directory is one row where all of it goes one way; a directory this move shares with another is one
# row a file. Nothing is edited or deleted.
# Rows that depart from that rule:
# - `verity/ml/flock/verifier/` to `verity/protocols/flock/agreement/`: the agreement with upstream's verifier, which
#   nobody trusts: the rule puts its scripts in `verity/protocols/flock/verifier/`, the trusted root of the Lean
#   verifier's Lake package, and its README on that package's.
# - `verity/ml/flock/python/verity_flock/` to `verity/protocols/flock/prover/python/verity_flock/`: a module goes
#   with its import package: eleven bench drivers are modules of `verity_flock`, which the rule would leave in a
#   second `verity/protocols/flock/python/verity_flock/` with no `__init__.py`, outside the distribution that keeps
#   the name.
# - `verity/core/service/spot/` to `verity/protocols/spot/verifier/lean/`: SPOT's Lake package: the rule puts its
#   `pyproject.toml` on the Python verifier's in `verity/protocols/spot/verifier/`; the Lean takes `lean/`, as each
#   protocol's Lean is its `lean/`.
# - `verity/core/service/vstar/recursive/` to `verity/protocols/recursion/verifier/recursive/`: the recursive audit's
#   Lake package: the rule gives `verity/protocols/recursion/verifier/vstar/recursive/`, where `vstar/` names only
#   the command package's directory it sits in today.
# - `verity/core/protocols/record.py` to `verity/hardware/record.py`: the rule gives
#   `verity/hardware/protocols/record.py`: a `protocols/` segment that names nothing, and a package whose
#   `__init__.py` no moved file brings.
# - `verity/core/protocols/registration.py` to `verity/hardware/registration.py`: as `record.py`: the rule gives
#   `verity/hardware/protocols/registration.py`.
# - `verity/core/protocols/profile.py` to `verity/protocols/spot/verifier/profile.py`: the integrity profile: the
#   rule gives `verity/protocols/spot/verifier/protocols/profile.py`, a second `protocols/` segment that names
#   nothing.
# - `integrations/vllm/verity_vllm/` to `adapters/vllm/verity_vllm/`: a module stays in its import package: the rule
#   names a module of a subpackage by that subpackage and gives `adapters/vllm/commitments/`, beside `verity_vllm`
#   and in no package, for `verity_vllm/commitments/`. The adapter's directory moves whole and the distribution keeps
#   the name `verity_vllm`.
# - `verity/ml/commitments/leaves.py` to `adapters/vllm/verity_vllm/commitments/leaves.py`: a module goes into an
#   import package: the rule gives `adapters/vllm/commitments/`, beside `verity_vllm` and in no package, where it
#   would be imported as `adapters.vllm.commitments.leaves`.
# - `verity/ml/commitments/vllm_v1/` to `adapters/vllm/verity_vllm/commitments/vllm_v1/`: as `leaves.py`: the
#   commitment scheme named for vLLM goes into `verity_vllm`.
# - `verity/core/devices/memory_challenger/` to `verity/protocols/pous/device/`: the memory challenger's package, one
#   directory row: the rule puts it in `device/memory_challenger/`, beside the module `memory_challenger.py`, two
#   things under one import name. The row takes along one archived file inside the package's Lake package
#   (`lean/scripts/replay.py`), which a row of its own would split.
# - `verity/core/protocols/remote_bandwidth/` to `verity/protocols/poub/verifier/`: PoUB's reference, session and
#   Lean verifier, one directory row: the rule names the protocol twice (`poub/verifier/remote_bandwidth/`).
# - `examples/README.md` to `demos/README.md`: the demos' index: the rule gives
#   `demos/dither_full_util/examples/README.md`, inside one demo.
# - `verity/core/service/vstar/` to `verity/protocols/recursion/verifier/vstar_cli/`: V*'s command package: the rule
#   gives `verity/protocols/recursion/verifier/vstar/`, the name V*'s own Lean has in Flock's verifier (`VStar/`,
#   which stays in that Lake package); `vstar_cli/` says this one is the command.
# - `verity/core/protocols/certifier/lean/` to `verity/protocols/certifier/device/program/lean/`: the certifier
#   program's Lake package: the rule puts it on `device/lean/`, where the certifier device's Lake package goes (two
#   lakefiles, manifests, locks and toolchains on one path).
# - `verity/ml/commitments/tests/test_leaves.py` to `adapters/vllm/tests/commitments/test_leaves.py`: the test of
#   `leaves.py`, which goes into the adapter: it goes into the adapter's suite with the module it tests; left with
#   its own suite, a test under `verity/` would import an adapter.
# - `verity/ml/commitments/tests/test_vllm_v1.py` to `adapters/vllm/tests/commitments/test_vllm_v1.py`: the test of
#   `vllm_v1/`, which goes into the adapter: with the code it tests, as `test_leaves.py`.
# - `examples/h200/e2e_h200/served_weights.py` to `benchmarks/torch_gpu/p2_stage/served_weights.py`: the served
#   weights' reader goes beside the GPU stage that reads it; the demo's other files stay.
# - `examples/h200/interfaces/` to `benchmarks/one_stage/interfaces/`: the drawn-unit replay bundle and the block
#   record, with their schemas, fixtures and suite, go beside the one-stage audit, their main reader, which is live;
#   the demo's other files stay.
# - `verity/core/protocols/pyproject.toml` to `verity/protocols/tests/pyproject.toml`: the suite of the protocols'
#   own two tests, whole, in a directory with no workspace member below it (its tests go with it, to
#   `verity/protocols/tests/tests/`): the rule gives `verity/protocols/pyproject.toml`, between the root and Flock's
#   prover, and uv finds a member's workspace at the first `pyproject.toml` above it. `verity/hardware/`, where
#   `record.py` goes, has a suite of its own on that path.
# - `verity/core/protocols/pous/wipe_stream.c` to `verity/protocols/pous/verifier/wipe_stream.c`: the streamed wipe's
#   native fill goes beside `wipe_stream.py`, the one module that builds it, by the name of the file beside itself;
#   the rule parts the two (`device/wipe_stream.c`).
# This one map is the whole layout: no order, and nothing runs before or after it. The format is `layout_map.toml`'s.

