  "benchmarks/pouw/theory/**",
  "benchmarks/pouw/sass_census/**",
  "benchmarks/pouw/tensor_kinds/**",
  "benchmarks/pouw/facet_break/**",
  "benchmarks/pouw/tests/test_lean_headline.py",
  "benchmarks/pouw/tests/test_lean_headline_dc.py",
  "tests/benchmarks/pouw/tests/test_lean_headline.py",
  "tests/benchmarks/pouw/tests/test_lean_headline_dc.py",
  "tests/benchmarks/pouw/test_lean_headline.py",
  "tests/benchmarks/pouw/test_lean_headline_dc.py",
  "tests/verity/protocols/resource_accounting/compute/pouw/verifier/receipts/fixtures/receipt_folds_r9.py",
]

