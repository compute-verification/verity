# The retired word family DRAW in PoUW's own tree (compute accounting): every draw identifier, string and docstring
# of `verity/protocols/resource_accounting/compute/pouw/`, `benchmarks/pouw/` and `benchmarks/compute/` (Python), renamed
# to the Glossary's sample, sampled, samples and sampling (a coin is flipped), at its definition and at every user in
# every lane's files (`[[words_in]]` of each outside file, whole phrases: `alias.name`, `name=`, an imported name, a
# name given to setattr, and the text of each of our messages that file's tests match).
# Kept as spelled ([keep]): every quoted token of the family (a record key, a coin label, a Lean subcommand, a difftest
# port, a wire reply), but a quoted identifier name (a lazy export, a setattr); the flags a README, another lane's script
# or a Lean executable calls (`--draws`, `--draw-session`) and their parsed attributes; other CLIs' flags; SPOT's `Draw`
# objects and draw module; `pouw/draw`, `power.draw`; and each message a Lean verifier states in the same words. The
# Lean (`**/*.lean`, the locks) waits for lean's pass. Our scripts take only the flags renamed here: their comments'
# draw words are `power.draw`, file names and case names.
# Generated by DRAWMAP's scratch generator (gen.py, kept in the evidence store with its analyses).

[rewrite]
exclude = [
  "tools/move/**",
  "GLOSSARY.md",
  "tests/lint/**",
  "tests/test_retired_terms.py",
  "**/*.lean",
  "**/lean-audit.json",
  "**/lake-manifest.json",
  "**/lakefile.toml",
  "security/**",
  "archive/**",
  "**/CHANGELOG.md",
  "**/TRUSTED.sha256",
  "uv.lock",
  "benchmarks/pouw/dc/**",
