# ONE-14: the protocols' circuit builders move out of core into `verity.ml.definitions`, so that core's Python reaches
# neither the catalog (`verity.ml.circuits.ops`, `.silicon`) nor the kernels (`verity.ml.kernels`): what
# `tools/move/layout.py --map tools/move/one14_map.toml --no-lock` moves, renames and rewrites
# (note:proofs/20261026T0332Z-report-onethm, row ONE-14; Linear CIR-111).
#
# Whole modules move; nothing is split, edited or deleted, and no file is added (the three packages they land in are
# added before the move):
# - PoUW's circuits (`pouw/circuit/`) and named schemes (`pouw/schemes/`), with their sidecars and pins, to
#   `verity/ml/definitions/pouw/`; `live_reads`, the live-read tables PoUW's credit reads, stays in core beside it.
# - PoUS's four circuit modules to `verity/ml/definitions/pous/`.
# - The certifier's Boolean Definitions to `verity/ml/definitions/certifier/`, all but `head_check` and `served`, which
#   the link-window verdict (`active`) reads.
# - The tests stay in each protocol's `tests/`, which import the builders from their new place.
# The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }

