# DRY RUN of the ml/ move (Daniel's draft "Verity repository", 7 Oct 2026): what `tools/move/layout.py --map
# tools/move/ml_map.toml` moves, renames and rewrites. Same format as `layout_map.toml`.
#
# ml/ holds Python and CUDA: provers, Python circuits and kernels. Its code can't affect soundness or hiding, so it never
# holds a verifier. The draft places ml/ under verity/ (verity/{core,ml,experimental}/), so here it is `verity/ml/`, import
# name `verity.ml`, inside the root's `verity` distribution:
#   circuits/silicon/   what the GPUs compute: the catalog's silicon models and their Definitions        (lane: circuits)
#   circuits/ops/       what models compute: the vLLM integration's registry of model-op Definitions   (lane: circuits)
#   circuits/targets/   the subcircuits benchmark cells are named by                                     (lane: circuits)
#   kernels/            fast code checked against a Definition                                         (lane: compute-accounting)
#   provers/flock/      C-Flock's prover; its verifier of record stays at backends/flock/verifier/       (lane: compute-accounting)
# A registry module that imports an outside system (torch, vllm, triton) stays in the integration: integrations/ is the
# only place that imports one. C-Flock keeps its own distribution and import name (`verity_flock`): it depends on the
# vLLM integration and the benchmark tooling, which `verity` can't depend on.

[roots]
old = { verity = "verity", verity_catalog = "catalog/verity_catalog", verity_kernels = "kernels/verity_kernels", verity_experimental = "experimental/verity_experimental", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", verity_flock = "backends/flock/python/verity_flock", research = "tools/research/src/research", circuit_check = "tools/circuit_check/src/circuit_check", cluster = "tools/cluster/src/cluster" }
new = { verity = "verity", verity_experimental = "experimental/verity_experimental", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", verity_flock = "verity/ml/provers/flock/python/verity_flock", research = "tools/research/src/research", circuit_check = "tools/circuit_check/src/circuit_check", cluster = "tools/cluster/src/cluster" }

[paths]
# --- ml/circuits/silicon: the catalog's silicon semantics and the primitive circuits' Definitions (lane: circuits)
"catalog/verity_catalog/__init__.py" = "verity/ml/circuits/__init__.py"
"catalog/verity_catalog/silicon/" = "verity/ml/circuits/silicon/"
"catalog/verity_catalog/definitions/" = "verity/ml/circuits/silicon/definitions/"
"catalog/verity_catalog/targets/" = "verity/ml/circuits/targets/"
"catalog/tests/" = "verity/ml/circuits/silicon/tests/"
"catalog/pyproject.toml" = "verity/ml/circuits/silicon/pyproject.toml"

# --- ml/circuits/ops: the vLLM integration's registry of model-op Definitions (lane: circuits)
"integrations/vllm/verity_vllm/program/registry/" = "verity/ml/circuits/ops/"
# ... except what imports an outside system (torch, vllm, triton): difftests against vLLM's kernels and a capture CLI
"integrations/vllm/verity_vllm/program/registry/layer_norm_difftest.py" = "integrations/vllm/verity_vllm/properties/difftests/layer_norm_difftest.py"
"integrations/vllm/verity_vllm/program/registry/moe_difftest.py" = "integrations/vllm/verity_vllm/properties/difftests/moe_difftest.py"
"integrations/vllm/verity_vllm/program/registry/sampling_topp_difftest.py" = "integrations/vllm/verity_vllm/properties/difftests/sampling_topp_difftest.py"
"integrations/vllm/verity_vllm/program/registry/mla_capture.py" = "integrations/vllm/verity_vllm/properties/difftests/mla_capture.py"
"integrations/vllm/verity_vllm/program/registry/quarantine/act/silu_mul_difftest.py" = "integrations/vllm/verity_vllm/properties/difftests/silu_mul_difftest.py"
"integrations/vllm/verity_vllm/program/registry/quarantine/collective/allreduce_difftest.py" = "integrations/vllm/verity_vllm/properties/difftests/allreduce_difftest.py"
# the integration's tests that import nothing of it but the registry follow it (test_dsa, test_spec, test_padded_commit_tiny,
# test_lifted_dense_b1_padrev and test_registry_one_process import its test helpers or its frontend, so they stay)
"integrations/vllm/tests/program/test_boolean_activation.py" = "verity/ml/circuits/ops/tests/test_boolean_activation.py"
"integrations/vllm/tests/program/test_boolean_dense.py" = "verity/ml/circuits/ops/tests/test_boolean_dense.py"
"integrations/vllm/tests/program/test_boolean_silu.py" = "verity/ml/circuits/ops/tests/test_boolean_silu.py"
"integrations/vllm/tests/program/test_gateset_api.py" = "verity/ml/circuits/ops/tests/test_gateset_api.py"
"integrations/vllm/tests/program/test_held_tables.py" = "verity/ml/circuits/ops/tests/test_held_tables.py"
"integrations/vllm/tests/program/test_lifted_dense_b1.py" = "verity/ml/circuits/ops/tests/test_lifted_dense_b1.py"
"integrations/vllm/tests/program/test_pad_prims.py" = "verity/ml/circuits/ops/tests/test_pad_prims.py"
"integrations/vllm/tests/program/test_registered_value_chains.py" = "verity/ml/circuits/ops/tests/test_registered_value_chains.py"
"integrations/vllm/tests/program/test_splits_for_v1.py" = "verity/ml/circuits/ops/tests/test_splits_for_v1.py"
"integrations/vllm/tests/program/test_superseded_kept.py" = "verity/ml/circuits/ops/tests/test_superseded_kept.py"
"integrations/vllm/tests/program/test_topp_split_halves.py" = "verity/ml/circuits/ops/tests/test_topp_split_halves.py"

# --- ml/kernels: fast code, each kernel checked against its Definition (lane: compute-accounting)
"kernels/" = "verity/ml/kernels/"
"kernels/verity_kernels/" = "verity/ml/kernels/"

# --- ml/provers: C-Flock's prover, Python, CUDA and its Rust patches on upstream Flock (lane: compute-accounting). Its
# verifier of record (Lean) is core-bound and stays where it is until core/ exists.
"backends/flock/" = "verity/ml/provers/flock/"
"backends/flock/verifier/" = "backends/flock/verifier/"

[tokens]
# directories that no row moves whole, as they read in text after the move (each rewrite is reported as approximate)
"catalog/verity_catalog" = "verity/ml/circuits"

[pyproject."pyproject.toml"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`); every module under one follows it unless a longer entry
# says otherwise
"backends.flock" = "verity.ml.provers.flock"
"backends.flock.verifier" = "backends.flock.verifier"
"catalog.tests" = "verity.ml.circuits.silicon.tests"
"integrations.vllm.tests.program.test_boolean_activation" = "verity.ml.circuits.ops.tests.test_boolean_activation"
"integrations.vllm.tests.program.test_boolean_dense" = "verity.ml.circuits.ops.tests.test_boolean_dense"
"integrations.vllm.tests.program.test_boolean_silu" = "verity.ml.circuits.ops.tests.test_boolean_silu"
"integrations.vllm.tests.program.test_gateset_api" = "verity.ml.circuits.ops.tests.test_gateset_api"
"integrations.vllm.tests.program.test_held_tables" = "verity.ml.circuits.ops.tests.test_held_tables"
"integrations.vllm.tests.program.test_lifted_dense_b1" = "verity.ml.circuits.ops.tests.test_lifted_dense_b1"
"integrations.vllm.tests.program.test_pad_prims" = "verity.ml.circuits.ops.tests.test_pad_prims"
"integrations.vllm.tests.program.test_registered_value_chains" = "verity.ml.circuits.ops.tests.test_registered_value_chains"
"integrations.vllm.tests.program.test_splits_for_v1" = "verity.ml.circuits.ops.tests.test_splits_for_v1"
"integrations.vllm.tests.program.test_superseded_kept" = "verity.ml.circuits.ops.tests.test_superseded_kept"
"integrations.vllm.tests.program.test_topp_split_halves" = "verity.ml.circuits.ops.tests.test_topp_split_halves"
"kernels" = "verity.ml.kernels"
"verity_catalog" = "verity.ml.circuits"
"verity_catalog.definitions" = "verity.ml.circuits.silicon.definitions"
"verity_catalog.silicon" = "verity.ml.circuits.silicon"
"verity_catalog.targets" = "verity.ml.circuits.targets"
"verity_kernels" = "verity.ml.kernels"
"verity_vllm.program.registry" = "verity.ml.circuits.ops"
"verity_vllm.program.registry.layer_norm_difftest" = "verity_vllm.properties.difftests.layer_norm_difftest"
"verity_vllm.program.registry.mla_capture" = "verity_vllm.properties.difftests.mla_capture"
"verity_vllm.program.registry.moe_difftest" = "verity_vllm.properties.difftests.moe_difftest"
"verity_vllm.program.registry.quarantine.act.silu_mul_difftest" = "verity_vllm.properties.difftests.silu_mul_difftest"
"verity_vllm.program.registry.quarantine.collective.allreduce_difftest" = "verity_vllm.properties.difftests.allreduce_difftest"
"verity_vllm.program.registry.sampling_topp_difftest" = "verity_vllm.properties.difftests.sampling_topp_difftest"

[aliases]

[distributions]
# folded into `verity`: their dependents depend on `verity`, their members leave the workspace, and their pyprojects become
# suite-only
merged = ["verity-catalog", "verity-kernels"]
new = {}

[create]
"verity/ml/__init__.py" = '''
"""Python and CUDA: provers, Python circuits and kernels (untrusted: nothing here can affect soundness or hiding, since the
verifiers are core's). Nothing in core imports it."""
'''
"verity/ml/circuits/ops/pyproject.toml" = '''# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity"]
'''

[rewrite]
# Never rewritten: records of what was, and files whose bytes a digest pins.
exclude = ["*.lean", "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**",
           # recorded runs and the rulings say what was, in the paths of their day
           "benchmarks/numerical/tests/bench/data/**", ".agents/skills/friction/SKILL.md",
           "catalog/verity_catalog/silicon/captures/**", "catalog/verity_catalog/silicon/hawkeye/**",
           "verity/ml/circuits/silicon/captures/**", "verity/ml/circuits/silicon/hawkeye/**",
           "tools/check/tests/test_suites.py",                   # its synthetic trees borrow the old names
           "tools/check/tests/test_move_check.py",               # so do its synthetic moves
           "tools/research/src/research/store/moves.json",       # each move's old paths, kept as they were
           "tools/tc_probe_fp4/fp4_emulation_1ad1aaa2.py"]       # verbatim at 1ad1aaa2: t1_merged.emulation_gate pins its bytes
keep = []
keep_in = {"integrations/vllm/**" = ["census", "census/*"]}
keep_dotted = []
# Rewritten although excluded above: data keyed by repository path (their pinned digests must not change).
include = ["fixtures/artifacts.json", "backends/flock/tests/fixtures/randomness_lean.json",
           "verity/ml/provers/flock/tests/fixtures/randomness_lean.json",
           "experimental/tests/sampled_proofs/fixtures/exfiltration_lean.json",
           "**/lake-manifest.json", "catalog/verity_catalog/silicon/captures/README.md",
           "verity/ml/circuits/silicon/captures/README.md"]
