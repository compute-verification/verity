# Calibration's own root: what chooses a parameter or tests an assumption leaves `hardware/` and `benchmarks/`
# for `calibration/`, each directory whole with its tests (`tests/X/` to `tests/calibration/...`). Written by
# the calibration regenerator from its list; `tools/move/layout.py --map tools/move/calibration_map.toml` moves
# and rewrites. Lean files and Lean locks are never rewritten.

[roots]
old = { circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", exact_kit = "benchmarks/pouw/exact_kit/exact_kit", research = "tools/research/src/research", verity = "verity", verity_bench = "benchmarks/harness/verity_bench", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_graph = "tools/verity/graph/verity_graph", verity_machine_model = "benchmarks/machine_model/verity_machine_model", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_ops = "infra/ops/verity_ops", verity_proof_throughput = "benchmarks/proof_throughput/verity_proof_throughput", verity_torch = "adapters/torch/verity_torch", verity_vllm = "adapters/vllm/verity_vllm" }
new = { circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", exact_kit = "benchmarks/pouw/exact_kit/exact_kit", research = "tools/research/src/research", verity = "verity", verity_bench = "benchmarks/harness/verity_bench", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_graph = "tools/verity/graph/verity_graph", verity_machine_model = "calibration/machine_model/verity_machine_model", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_ops = "infra/ops/verity_ops", verity_proof_throughput = "benchmarks/proof_throughput/verity_proof_throughput", verity_torch = "adapters/torch/verity_torch", verity_vllm = "adapters/vllm/verity_vllm" }

[paths]
"benchmarks/census/" = "calibration/census/"
"benchmarks/machine_model/" = "calibration/machine_model/"
"tests/benchmarks/machine_model/" = "tests/calibration/machine_model/"

[retired]
# the paths this map empties
paths = [
    "benchmarks/census/",
    "benchmarks/machine_model/",
    "tests/benchmarks/machine_model/",
]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was, files whose bytes a digest pins, every Lean input and lock.
exclude = [
    "fixtures/**",
    "**/fixtures/**",
    "**/*vectors*.json",
    "**/*vectors*.txt.gz",
    "**/CHANGELOG.md",
    "*.patch",
    "**/TRUSTED.sha256",
    "**/lake-manifest.json.lock",
    "tools/move/**",
    "archive/**",
    "**/numerical/tests/bench/data/**",
    "**/price_twins.json",
    "verity/circuits/silicon/captures/**",
    "verity/circuits/silicon/hawkeye/**",
    "tools/research/src/research/store/moves.json",
    "**/network_e2e/tests/data/**",
    "adapters/vllm/manifests/**",
    "adapters/vllm/workloads/**",
    "adapters/vllm/data/**",
    "adapters/vllm/verity_vllm/pins/**",
    "adapters/vllm/tools/migrate/superseded_quarantine.py",
    "**/migrate/test_superseded_quarantine.py",
    "**/*.lean",
    "**/lakefile.toml",
    "tests/tree.toml",
    "**/*.cu",
    "**/*.cuh",
    "**/*.cpp",
    "**/*.h",
    "**/*.c",
    "benchmarks/pouw/pearl_c_sm90/**",
    "**/lean-audit.json",
    "benchmarks/machine_model/verity_machine_model/lean_headline.py",
    "benchmarks/machine_model/verity_machine_model/lean_headline_dc.py",
    "benchmarks/machine_model/verity_machine_model/sheet.py",
    "calibration/machine_model/verity_machine_model/lean_headline.py",
    "calibration/machine_model/verity_machine_model/lean_headline_dc.py",
    "calibration/machine_model/verity_machine_model/sheet.py",
    "verity/protocols/resource_accounting/compute/pouw/prover/kernels/gpu_kit/README.md",
    "benchmarks/numerical/bench-instances/v1/manifest.json",
    "benchmarks/numerical/bench-instances/v1/tu-k16.index.json",
    "benchmarks/numerical/bench-instances/v1/vu-k1536-neg.index.json",
    "benchmarks/numerical/bench-instances/v1/vu-k1536.index.json",
    "tests/adapters/vllm/tests/query/fixtures/pouw_row_binding.json.gz",
    "tests/adapters/vllm/verity_vllm/definitions/fixtures/fa2_train_bwd_sm120.npz",
    "tests/verity/circuits/ops/fixtures/golden/ada_bf16_m16n8k16.json",
    "tests/verity/circuits/ops/fixtures/gpu-nan-2026-09-28/fp32_ops.json",
    "tests/verity/circuits/ops/fixtures/tc-sm120-k32-e2m1-2026-09-30/records.json",
    "verity/circuits/silicon/discrepancy_log.json",
    "verity/circuits/silicon/hawkeye/PIN.json",
]
include = [
    "**/fixtures/README.md",
    "**/fixtures/**/README.md",
    "tools/move/pyproject.toml",
]

[modules]
"benchmarks.census" = "calibration.census"
"benchmarks.machine_model" = "calibration.machine_model"
"tests.benchmarks.machine_model" = "tests.calibration.machine_model"
