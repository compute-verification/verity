# The plainer word for "cap" in vllm's prose: what `tools/move/rename.py --map tools/move/sweep_sweepcap_limit_vllm_map.toml`
# renames, "cap" where a comment, a docstring or Markdown's text says a limit or a bound that is not Pearl's (GLOSSARY.md,
# Cap: Pearl's cap is its inert-work bound, and the word keeps its other senses where the Glossary says so).
#
# Prose only (`scope = "prose"`), and only in the files listed, whose every "cap" is of one sense: a request's or a compiler's
# length limit, a tooling limit, a session's or a chunk's, which this lane's prose says "limit" for, and a slowdown's or a
# stacking gate's, which it says "bound" for. SPOT's served cap, the certifier's response cap, a soft cap and Flock's Merkle cap
# keep the word ([keep]); the names (`max_tokens_cap`, `HIT_CAP`, `rekey_cap`) are not prose and stay. The other way to clear
# these sites is `OWN_CAPS` in the retired-terms lint; the note says which suits each file.

