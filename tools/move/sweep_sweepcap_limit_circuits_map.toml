# The plainer word for "cap" in circuits's prose: what `tools/move/rename.py --map tools/move/sweep_sweepcap_limit_circuits_map.toml`
# renames, "cap" where a comment, a docstring or Markdown's text says a limit or a bound that is not Pearl's (GLOSSARY.md,
# Cap: Pearl's cap is its inert-work bound, and the word keeps its other senses where the Glossary says so).
#
# Prose only (`scope = "prose"`), and only in the files listed, whose every "cap" is of one sense: a request's or a compiler's
# length limit, a tooling limit, a session's or a chunk's, which this lane's prose says "limit" for, and a slowdown's or a
# stacking gate's, which it says "bound" for. SPOT's served cap, the certifier's response cap, a soft cap and Flock's Merkle cap
# keep the word ([keep]); the names (`max_tokens_cap`, `HIT_CAP`, `rekey_cap`) are not prose and stay. The other way to clear
# these sites is `OWN_CAPS` in the retired-terms lint; the note says which suits each file.

scope = "prose"

[words]

[[words_in]]
files = [
    "adapters/vllm/tests/acquire/test_fa2_tap_geometry.py",
    "adapters/vllm/tests/commit/hidden_stream.py",
    "adapters/vllm/tests/commit/test_binding_negatives.py",
    "adapters/vllm/tests/commit/test_native_collect_plan_cache.py",
    "adapters/vllm/tests/commit/test_openings_after_release.py",
    "adapters/vllm/tests/commit/test_pinned_pool_exact.py",
    "adapters/vllm/tests/commit/test_served_record.py",
    "adapters/vllm/tests/program/test_fa3_launch_context.py",
    "adapters/vllm/tests/program/test_splits_for.py",
    "adapters/vllm/tests/properties/test_glm53_multimem_replay.py",
    "adapters/vllm/tests/query/test_program_view_columns.py",
    "adapters/vllm/verity_vllm/acquire/served_device.py",
    "adapters/vllm/verity_vllm/commit/binding.py",
    "adapters/vllm/verity_vllm/commit/committer/pinned_pool.py",
    "adapters/vllm/verity_vllm/definitions/numerics/dense_rows.py",
    "adapters/vllm/verity_vllm/definitions/registry/lifted.py",
    "adapters/vllm/verity_vllm/definitions/registry/mhc.py",
    "adapters/vllm/verity_vllm/definitions/registry/stop_rule.py",
    "adapters/vllm/verity_vllm/definitions/registry/tp_allreduce.py",
    "adapters/vllm/verity_vllm/program/frontend/stop_rule.py",
    "adapters/vllm/verity_vllm/program/predict/weights_tie.py",
    "adapters/vllm/verity_vllm/query/manifest/format.py",
    "benchmarks/served_commit/README.md",
    "benchmarks/served_commit/rows_floor.py",
    "benchmarks/served_commit/tp_decode.py",
    "tools/verity/circuit_check/tests/test_parallel.py",
    "verity/circuits/boundary.py",
    "verity/circuits/ops/boolean/norm_quant.circuit-check.py",
    "verity/circuits/partition.py",
    "verity/circuits/partition_v2.py",
    "verity/circuits/parts.py",
    "verity/circuits/requirement_units.circuit-check.py",
    "verity/circuits/requirement_units.py",
    "verity/circuits/tests/test_ir_boundary.py",
    "verity/circuits/tests/test_requirement_units.py",
    "verity/circuits/tests/test_stacking.py",
]

[words_in.words]
"a cap" = "a limit"
"A cap" = "A limit"
"caps" = "limits"
"Caps" = "Limits"
"cap" = "limit"
"Cap" = "Limit"

[keep]
patterns = [
    '''(?i:served[ -]cap|response[ -]cap|soft[ -]cap|merkle[ -]cap|capability|cap ℓ|max_tokens cap)''',
    '''(?<![\w])cap-\w|\w-cap(?![\w])''',
]

[rewrite]
exclude = [
