# The network attester's last two programs under `benchmarks/network_traces/`, into the attester's `prover/` beside
# `block_certifier.py` and `scan_period.py`: what `tools/move/layout.py --map tools/move/network_chain_wipe_map.toml`
# moves and rewrites. `network_attester_chain.py` is the chain's reader of a network attester's run (its deployment
# held to the auditor's record, its certificates, its certified I/O, N2's link and the rows audit's case), and
# `wipe_egress.py` the count of what can leave a node over a memory wipe's session. Each one's test goes to the
# prover's `tests/`. No root moves ([roots] old == new). No file is split or deleted. The format is `layout_map.toml`'s.
#
# What no map writes, and so follows the move by hand: the chain's test's cases that run `benchmarks/` code
# (`chain_record`, `leak_guard`), which a test under `verity/` can't import, back into a test of `benchmarks/`; the
# gate's synthetic run the chain's tests build, which tests of both suites read, as a helper of the prover's tests; a
# bare import of a moved test module (`from test_network_attester_chain import ...`); the moved files' own `sys.path`
# entries for `benchmarks.network_traces`; and the import listing's rows (`tests/import_order.toml`).

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"benchmarks/network_traces/network_attester_chain.py" = "verity/protocols/resource_accounting/network/prover/network_attester_chain.py"
"benchmarks/network_traces/wipe_egress.py" = "verity/protocols/resource_accounting/network/prover/wipe_egress.py"
"benchmarks/network_traces/tests/test_network_attester_chain.py" = "verity/protocols/resource_accounting/network/prover/tests/test_network_attester_chain.py"
"benchmarks/network_traces/tests/test_wipe_egress.py" = "verity/protocols/resource_accounting/network/prover/tests/test_wipe_egress.py"

[retired]
# the paths this map empties
paths = [
    "benchmarks/network_traces/network_attester_chain.py",
    "benchmarks/network_traces/wipe_egress.py",
    "benchmarks/network_traces/tests/test_network_attester_chain.py",
    "benchmarks/network_traces/tests/test_wipe_egress.py",
]

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), files
# whose bytes a digest pins, every Lean file and every kernel source.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/circuits/silicon/captures/**",
           "verity/circuits/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**", "**/*.lean", "tests/tree.toml",
           "**/*.cu", "**/*.cuh", "**/*.cpp", "**/*.h", "**/*.c"]
include = ["**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "adapters/vllm/manifests/README.md"]
root_prefixes = ["/opt/vy-challenger/current/", "/opt/vy-verifier/current/"]

[modules]
# the rename [paths] implies (`layout.py --modules`)
"benchmarks.network_traces.network_attester_chain" = "verity.protocols.resource_accounting.network.prover.network_attester_chain"
"benchmarks.network_traces.tests.test_network_attester_chain" = "verity.protocols.resource_accounting.network.prover.tests.test_network_attester_chain"
"benchmarks.network_traces.tests.test_wipe_egress" = "verity.protocols.resource_accounting.network.prover.tests.test_wipe_egress"
"benchmarks.network_traces.wipe_egress" = "verity.protocols.resource_accounting.network.prover.wipe_egress"
