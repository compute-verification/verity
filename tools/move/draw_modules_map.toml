# The retired word family DRAW in the modules and namespaces the proof system's own paths declare: each module's path
# and name, the namespaces `Spot.Draw`, `FlockSoundness.PlanDraw`, `DrawnAt`, `Properties.Challenger.Drawn` and
# `Flock.Test.FullDraw`, and, in the files that read `Spot.Draw` unqualified (inside `namespace Spot` or under `open Spot`),
# each `Draw.X` of a name `Spot.Draw` declares. `Flock.Draw` (the commitments base), Accounting's and PoUW's `Draw` are
# their owners': [keep] holds every `Draw.X` another namespace qualifies.

[rewrite]
exclude = ["tools/move/**", "GLOSSARY.md", "tests/lint/**", "tests/test_retired_terms.py"]

[keep]
patterns = ["(?<![\\w.])(?!Spot\\b)(?!_root_\\b)[A-Za-z_][\\w']*\\.Draw\\.[\\w']+"]

[words]

[[words_in]]
files = ["*"]

