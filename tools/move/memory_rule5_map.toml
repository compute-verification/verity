# PoUB's and PoUS's provers, PoUS's reference verifier and the onsite pieces out of `benchmarks/`: what
# `tools/move/layout.py --map tools/move/memory_rule5_map.toml` moves and rewrites. These are the files that code outside
# `benchmarks/` loads (the vLLM integration by path, the verifiers' difftests and the live verifier's host by name or by
# path); the harness stays in `benchmarks/` and loads them from where they land.
#
# - PoUB's prover goes to `verity/protocols/poub/prover/`, each file under the harness directory it came from
#   (`remote_session/`, `word_codec/`, `codec_tensor/`, `vllm_encoded/`), so the four stay siblings and
#   `../codec_tensor/reader.cu` and `HERE.parent / "word_codec"` keep their meaning. They are not a package: each is still
#   loaded by path or with its directory on `sys.path`, under its own name (`prover`, `device`, `kv`, `paged`).
# - PoUS's prover (`p2_v1/`'s store with its toy store, GPU library and its wrapper, `p2_gpu/`'s decode) goes to
#   `verity/protocols/pous/prover/`, the two directories still siblings. It keeps the package name `p2_v1` and is loaded
#   by path: the harness's `benchmarks/pous/p2_v1/__init__.py` adds the prover's directory to its `__path__`.
# - PoUS's reference verifier (`reference.py`, `wire.py` and the vectors that pin them) goes to
#   `verity/protocols/pous/verifier/p2_v1/`, a package loaded by name: [aliases] rewrites every `from p2_v1 import
#   reference` and `wire` to it, so one module holds the reference wherever it is imported from.
# - The bandwidth session's registration over the P2 store goes to PoUB's verifier, which reads it.
# - The onsite pieces' two scripts go to `workloads/onsite_served/`.
#
# Three files of the same directories stay, because each reaches what stays by a path the move does not carry:
# `benchmarks/pous/p2_v1/vectors.py` (`ROOT = HERE.parents[2]`), `benchmarks/pous/streamed_wipe/served_wipe.sh`
# (`$HERE/demo.sh`, `ROOT=$(cd "$HERE/../../.." && pwd)`) and `benchmarks/pous/served_piece.py` (it imports the harness).
# So do `benchmarks/remote_session/inplace.py` and `benchmarks/vllm_encoded/paged.cu`.
#
# The load sites name each moved file by its path from the root before the move, so the move rewrites them and nothing
# else changes. Nothing is split, edited or deleted. The format is `layout_map.toml`'s.

