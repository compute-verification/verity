# A moved file whose `HERE = Path(__file__).resolve().parent` must stay its own directory, because what it reaches through
# `HERE` moved with it: `device.py` finds `codec_tensor/` beside its directory, `paged.py` finds `word_codec/`,
# `reference.py` finds its vectors beside itself, and `store.py` finds its toy store and writes its layout beside itself
# (its `parents[1]` stays the directory that holds its own package). The other three (`prover.py`, `reader.py`,
# `kv_bench.py`) climb from `HERE` to the root, which the move does not recount, so their `HERE` is rewritten to name the
# harness directory they left: the climb still ends at the root, and `kv_bench.py` still reads the KV vectors there.
# `kv_bench.py`'s docstring keeps the vectors' name as written.
[rewrite.keep_in]
"verity/protocols/poub/prover/remote_session/device.py" = ["benchmarks/remote_session"]
"verity/protocols/poub/prover/vllm_encoded/paged.py" = ["benchmarks/vllm_encoded"]
"verity/protocols/pous/verifier/p2_v1/reference.py" = ["benchmarks/pous/p2_v1"]
"verity/protocols/pous/prover/p2_v1/store.py" = ["benchmarks/pous", "benchmarks/pous/p2_v1"]
"verity/protocols/poub/prover/word_codec/kv_bench.py" = ["benchmarks/word_codec/tests/kv_vectors.json"]


