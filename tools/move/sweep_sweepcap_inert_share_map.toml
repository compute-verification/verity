# The inert-work share ι in prose: what `tools/move/rename.py --map tools/move/sweep_sweepcap_inert_share_map.toml` renames,
# the phrases where Pearl's cap is the share itself (GLOSSARY.md, Older names: "cap", `Device.cap`, now the inert-work share
# ι), "cap ρ" and "the device's cap". A share written as "cap 1/400" stays: prose scope takes no word with a slash.
#
# Prose only (`scope = "prose"`). Every other prose "cap" of Pearl's is the inert-work bound
# (`sweep_sweepcap_inert_bound_map.toml`), which runs after this one.

scope = "prose"

[words]

[[words_in]]
files = [
    "benchmarks/pouw/harness/price_twins.py",
    "benchmarks/pouw/pearl_c_vllm/served_inert_work.py",
    "benchmarks/pouw/tests/test_price_twins_accounting.py",
    "verity/protocols/accounting/pouw/prover/circuit/pearl_plus_tile.py",
]

[words_in.words]
"debit cap ρ" = "inert-work share ρ"
"cap ρ" = "inert-work share ρ"
"device's cap" = "device's inert-work share"

[keep]
patterns = ["(?<![\\w])cap-\\w|\\w-cap(?![\\w])"]

[rewrite]
exclude = [
    "GLOSSARY.md",
    "tests/lint/test_repo_retired_terms.py",
    "tests/test_retired_terms.py",
    "tools/move/**",
    "tools/research/**",
    "tools/sweep/**",
    "tools/check/tests/test_move_check.py",
    "archive/**",
    ".agents/skills/friction/SKILL.md",
    "**/CHANGELOG.md",
    "fixtures/**",
    "**/fixtures/**",
    "*.patch",
    "**/TRUSTED.sha256",
    "uv.lock",
    "**/*.lock",
    "**/lake-manifest.json",
    "**/*.lean",
    "**/lean-audit.json",
    "**/*.cu",
    "**/*.cuh",
    "**/*.c",
    "**/*.cc",
    "**/*.cpp",
    "**/*.h",
    "**/*.hpp",
    "benchmarks/pouw/harness/price_twins.json",
    "benchmarks/slowdown/**",
    "benchmarks/nci/**",
    "benchmarks/training_slowdown/**",
    "benchmarks/circuit_properties/**",
    "benchmarks/inference_only/**",
    "verity/protocols/policy/inference_only/**",
    "verity/protocols/accounting/certifier/**",
    "benchmarks/network_traces/**",
    "benchmarks/network_e2e/**",
    "benchmarks/certifier_*/**",
    "adapters/vllm/verity_vllm/definitions/registry/ref_prims.py",
    "adapters/vllm/verity_vllm/definitions/registry/prims.py",
    "adapters/vllm/verity_vllm/definitions/registry/b1.py",
    "**/*.sha256",
]
