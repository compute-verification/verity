# Names `docket_code_map.toml` gave the docket's word that are not SPOT's record of a window: an integration's
# registration of registered values or its own window record, and the commitment of a window's values. What
# `tools/move/rename.py --map tools/move/docket_code_back_map.toml` renames back, with every caller in the tree:
# - `public_registration`: what a run publishes of vLLM's advice registration (`served_verdicts.py`);
# - `step_registration`: the demo's `commit-slots-step-registration` record of a step's slots (`replay_bundle.py`);
# - `RegistrationSize`: the window's committed rows as `verity.commitments.periods.rows.write` writes them.

[words]
"public_docket" = "public_registration"
"step_docket" = "step_registration"
"DocketSize" = "RegistrationSize"

[keep]
patterns = []
strings = []

[rewrite]
exclude = ["**/*.json", "**/*.jsonl", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.csv", "**/*.txt", "**/*.lean",
           "**/CHANGELOG.md", "**/TRUSTED.sha256", "**/fixtures/**", "tools/move/**",
           "tools/research/src/research/store/moves.json"]
