# "reference circuit" in security's README, across a line break (GLOSSARY.md Older names: "reference circuit" is the reference
# training algorithm): what `tools/move/rename.py --map tools/move/sweep_sweeptail2_reference_training_algorithm_map.toml`
# renames.

scope = "prose"

[words]

[[words_in]]
files = ["security/README.md"]
[words_in.words]
"to reproduce a reference\ncircuit" = "to reproduce the reference\ntraining algorithm"

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "tools/research/tests/test_slack.py", "tools/check/tests/test_move_check.py", ".agents/skills/friction/SKILL.md"]
