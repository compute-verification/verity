# The network certifier's programs, out of `benchmarks/network_traces/` into the certifier's `device/` and `prover/`:
# what `tools/move/layout.py --map tools/move/certifier_programs_map.toml` moves and rewrites.
#
# `device/` takes what a served run starts on the auditor's side of the link: the relay's serving loop
# (`warden_serve.py`) and the parts and flags it runs with (`runner_parts.py`, `runner_cli.py`), the certifier's key
# (`certifier_key.py`), the offline check that writes the registrations' file (`connection_rows_run.py`), the load relay
# (`load_relay.py`), and the guard on what a record releases (`leak_guard.py`, `released_keys.py`, each with its
# declared data). `prover/` takes the zero-knowledge drivers that prove the certifier's checks (`scan_zk.py`,
# `egress_zk.py`, `warden_zk.py`, `n2_zk.py`, `n2_tie_zk.py`, `leak_scan.py`), the period's scan
# (`scan_period.py`), the block certifier and its window chain (`block_certifier.py`, `window_chain.py`) and the stop
# verdicts (`stop_verdicts.py`). Each file's tests, and the fixture only they read, go to the destination's `tests/`.
#
# What stays in `benchmarks/network_traces/`: the measurements and the rehearsals' records (captures, probes, the load
# bench, `record.py`, `replay.py`, the deviations, the egress wipe), the served session and its settings, the chain's
# record and the cases run over it (`chain_record.py`, `warden_chain.py`, `certifier_piece.py`, `negatives.py`,
# `kind_scan.py`, `leak_bounds.py`), the demo endpoint and stub, the shell drivers (`*.sh`), and the test of what the
# drivers copy into a job's output (`test_out_request_values.py`); and the compiled slice's driver (`compile_slice_zk.py`,
# with its test), which reads vLLM's scheduler, whose modules go to the vLLM adapter, which nothing under `verity/` may
# import. No root moves ([roots] old == new). No file is split
# or deleted. The format is `layout_map.toml`'s.
#
# What no map writes, and so follows the move by hand: a bare import of a moved module (`import warden_serve`, found by
# the `sys.path` entry of `benchmarks/network_traces/`) and a moved module's bare import of one that stays, the suites'
# declarations of the new `tests/` directories, and the import listing's rows (`tests/import_order.toml`).

