# "declared utilization", the retired phrase (GLOSSARY.md Older names: "certified share", "declared utilization"; now utilization):
# what `tools/move/rename.py --map tools/move/sweep_sweeptail2_utilization_map.toml` renames, in the eight comments and docstrings of
# `benchmarks/one_stage/` and its tests that still say it (`scope = "prose"`: the ninth, `inference_only.py`'s `--utilization` help
# string, is a hand edit). "declared work" beside it is
# `declared_words_map.toml`'s and stays. It leaves GLOSSARY.md's row and the lint's list.

scope = "prose"

[words]
"declared utilization" = "utilization"
"Declared utilization" = "Utilization"

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "**/fixtures/**", "*.patch", "**/TRUSTED.sha256",
           "uv.lock", "**/*.lock", "GLOSSARY.md", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "tools/research/tests/test_slack.py", "tools/check/tests/test_move_check.py", ".agents/skills/friction/SKILL.md"]
