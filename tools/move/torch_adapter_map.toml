# The PyTorch adapter out of the vLLM adapter: what `tools/move/layout.py --map tools/move/torch_adapter_map.toml`
# moves and rewrites (ARCHITECTURE.md: `adapters/torch/`, with `vllm/` on it, and one translator from PyTorch to
# circuits).
#
# The translator that does its work with no vLLM, `verity_vllm.program.frontend` without the rules for vLLM's own ops,
# becomes `verity_torch.frontend` in the distribution `verity-torch` (`adapters/torch/`, made before the move with its
# package's `__init__.py` files), with its tests in `adapters/torch/tests/frontend/`. Four modules the translator
# imports that are not about vLLM go with it, to the package's top: `program/inputs.py`, `program/prune.py`,
# `program/dsa_table.py` and `correspondence/runtime.py`. The three plain-PyTorch bindings of `rules/vllm_bindings/`
# go to `rules/bindings/`.
#
# What stays in the vLLM adapter: every rule for one of vLLM's own ops, the package's `__init__.py`, which the modules
# that stay still need, and the files that hold both PyTorch's rules and vLLM's until they split along `TORCH_RULES`
# and `VLLM_RULES`:
#   adapters/vllm/tests/program/test_bf16_gemm.py
#   adapters/vllm/tests/program/test_derive_hf5.py
#   adapters/vllm/tests/program/test_derive_negative.py
#   adapters/vllm/tests/program/test_derive_transfer.py
#   adapters/vllm/tests/program/test_harden_moe.py
#   adapters/vllm/tests/program/test_moe_pad_route_a3.py
#   adapters/vllm/tests/program/test_moe_pad_stage2.py
#   adapters/vllm/tests/program/test_rule_lists.py
#   adapters/vllm/tests/program/test_train_step.py (cut: moved by `torch_train_step_map.toml`, its check that a training
#     rule set holds no rule of `VLLM_RULES` back in `adapters/vllm/tests/program/test_rule_lists.py`)
#   adapters/vllm/tests/program/train_step_lf.py (moved whole by `torch_train_step_map.toml`)
#   adapters/vllm/verity_vllm/program/frontend/README.md
#   adapters/vllm/verity_vllm/program/frontend/derive_examples.py
#   adapters/vllm/verity_vllm/program/frontend/rules/README.md
#   adapters/vllm/verity_vllm/program/frontend/rules/__init__.py
#   adapters/vllm/verity_vllm/program/frontend/rules/family.py
#   adapters/vllm/verity_vllm/program/frontend/rules/padding.py
#   adapters/vllm/verity_vllm/program/frontend/rules/profile.py
#   adapters/vllm/verity_vllm/program/frontend/rules/vocab.py
#
# What stays as it is: the layout of record (`tests/tree.toml`), every Lean file and every kernel source, the lists of
# paths relative to the vLLM adapter, whose entries for a file that left it are stale whatever they say, and three
# files whose paths are relative to a package's directory, which a commit after the move points at the new one, with
# the dependencies on `verity-torch` ([rewrite] exclude). One root is added (`verity_torch`). No file is split or
# deleted. The format is `layout_map.toml`'s.

