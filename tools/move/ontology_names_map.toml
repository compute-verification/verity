# The network attester in the code's names: what `tools/move/rename.py --map tools/move/ontology_names_map.toml` renames,
# after `ontology_words_map.toml` renamed the prose. `network_certifier` becomes `network_attester` as a name or one part of
# one: 92 files' names (`network_certifier_serve.py`, `test_network_certifier_*.py`, `network_certifier_zk.sh`), their
# modules and every import, and the code that spells them. `move_check.py` certifies a word of a names move only where it
# renames a path, a module or a Lean declaration, and this word renames files.
#
# Not here, each with its reason (`ontology_words_map.toml` counts them):
# - `NetworkCertifier`, `NetworkCertifierParams`, `NetworkCertifierProfile`: the Lean package `NetworkCertifier` is the
#   only path the word names, and its rename is lean's (`ontology_moves.json`); the Python names follow it in one move.
# - `NETWORK_CERTIFIER*`: constants and environment variables, which name no path.
# - `network-certifier` and `verity-network-certifier/...`: the party's name (signed into its key messages), domain tags
#   and format ids, which change only with a new format version.
#
# Kept bytes ([keep]): what a stored record or a caller holds.
# - the whole value `"network_certifier"`: a placement record's party key (`parties`), scan_zk's member key, the
#   exfiltration figure's id, which kept runs and published metrics hold;
# - `network_certifier_run`: a report's key and the attribute its flag `--warden-run` declares;
# - domain tags and format ids, as every word map keeps them.
#
# Left as they are ([rewrite] exclude): the Lean (comments that name a Python file by its old name, 29; lean's), this
# directory's maps, the archive, changelogs, fixtures and research's `moves.json`.

[words]
"network_certifier" = "network_attester"

[keep]
patterns = [
    '[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b',          # a domain tag or a format id
    'note:[\w./-]+',
    'art:[0-9a-f]+',
    'cursor/[\w./-]+',                                # a branch
    '"network_certifier"',                            # the word as a whole value
    "'network_certifier'",
    'network_certifier_run\b',                        # a report's key and its flag's attribute
    '\bconfig\([^()\n]*?\bnetwork_certifier=',        # config()'s keyword places the party network-certifier by its name
]

[rewrite]
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "**/fixtures/**", "fixtures/**", "*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/*.lean", "tools/research/src/research/store/**"]
