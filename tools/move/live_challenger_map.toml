# The live challenger's move: what `tools/move/layout.py --map tools/move/live_challenger_map.toml` moves and rewrites.
#
# `verity/composite/device/live_challenger/` is the proof system's challenger as it runs on the auditor's host: the
# service over `verity.protocols.spot.device.remote`, its gate, its coin link and its suite. It was the one thing under
# `verity/composite/`, a directory the layout does not have. It goes beside the client it serves, as
# `verity/protocols/spot/device/live_challenger/`, and `verity/composite/` goes away.
#
# - The directory moves whole and laid out as it was: the service's files, `host.json`, the two scripts and the suite
#   (`pyproject.toml`, `tests/`).
# - Its modules follow it ([modules]): `verity.composite.device.live_challenger` becomes
#   `verity.protocols.spot.device.live_challenger`. The files run by path, so no import statement names either.
# - `verity/composite/__init__.py` and `verity/composite/device/__init__.py` marked the two packages above it and hold
#   nothing: `layout.py` deletes each as the mark of a package the move empties, and a list that named one names the
#   package levels above the moved files instead. `verity/protocols/spot/device/` is a package already.
# - The auditor's host runs the service from its pinned tree, `/opt/vy-challenger/current/`, and the units and the gate
#   installed there name the file from it: the map lists that directory as standing for the root ([rewrite]
#   root_prefixes), so each of those paths follows the move.
# - No directory is split, so the map has no [split] table and reads the same on any base.
# Nothing else is edited or deleted, and no file is added. The format is `layout_map.toml`'s. This map runs after
# `difftest_map.toml`, on the commit that one makes.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "verity/configuration/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/composite/device/live_challenger/" = "verity/protocols/spot/device/live_challenger/"

[retired]
# the directory this map empties: `layout.py` refuses a tracked file under one that has no row, and its row is a
# directory's, so a file only a branch has under it is carried
paths = ["verity/composite/device/live_challenger/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json",
           "adapters/vllm/manifests/definitions.json", "adapters/vllm/manifests/README.md",
           "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]
# the auditor's host's pinned tree, which the installed units and the gate name the service's file from
root_prefixes = ["/opt/vy-challenger/current/"]

[modules]
# the rename [paths] implies (`layout.py --modules`): the directory as a dotted path, which its package's modules follow
"verity.composite.device.live_challenger" = "verity.protocols.spot.device.live_challenger"
