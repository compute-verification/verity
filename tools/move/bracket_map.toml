# The board's bracket module: what `tools/move/rename.py --map tools/move/bracket_map.toml` renames.
# `verity/protocols/inference_only/nci/slowdown.py`, which computes a board row's slowdown bracket, becomes `verity/protocols/inference_only/nci/bracket.py`, and
# its test `tests/test_slowdown.py` becomes `tests/test_bracket.py`, so that the directory holds no module named
# `slowdown` when the slowdown calculator's package takes that name (`slowdown_calculator_map.toml`, which runs after
# this map): two of the directory's files import the calculator's package beside this module.
# - The module, where a file of the directory names it: `import slowdown`, `from slowdown import`, and `slowdown.` at the
#   start of a name (`slowdown.search`, in code, a docstring or a JSON string).
# - The file, where a path or its name cites it: `verity/protocols/inference_only/nci/slowdown.py`, `slowdown.py` in the directory's README,
#   the slowdown calculator's suite inputs and docstrings, its tests' `/ "nci" / "slowdown.py"`, and the lints' allowlist.
# What stays: the word slowdown wherever it is the quantity (a sentence that ends in it too, [keep]); every other
# `slowdown` of the tree, since the module's words are held to this directory, the calculator's and the root's tests;
# and the label `nci_slowdown` the calculator's tests give the module they load by path.
# To give the module another name, replace `bracket` in the four rows below.

[words]
"nci/tests/test_slowdown" = "nci/tests/test_bracket"

[[words_in]]
files = ["verity/protocols/inference_only/nci/**", "verity/protocols/inference_only/rho/**", "tests/**"]
words = { "slowdown." = "bracket.", "import slowdown" = "import bracket", "from slowdown" = "from bracket" }

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs), files whose bytes a digest pins
# (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tools/move/**", "archive/**", "**/CHANGELOG.md", "fixtures/**", "*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock"]

[keep]
# the quantity at the end of a sentence
patterns = ['slowdown\.(?![A-Za-z_])']
strings = []
