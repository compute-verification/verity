# The retired words "wrong unit", "incorrect unit" and "faulty set": what `tools/move/rename.py --map
# tools/move/wrong_units_words_map.toml` renames, after `GLOSSARY.md` (an incorrect proof block, and correct; the
# incorrect set F) and the retired-words lint, with the targets `terms_map.toml`'s rows already name.
#
# Prose says "incorrect proof block(s)" and "incorrect set(s)". In code, `NetTiming.faultySets` (the possible incorrect
# sets at δ) and the period check's `AuditTerms.faultySets` take `incorrectSets`, a name `incorrect_units` holds takes
# `incorrect_blocks` (`cmp_incorrect_blocks`, the test profile's `incorrect_blocks`), and SPOT's one test named for the
# bound takes "incorrect_block".
#
# Left as they are, since a reader or a record takes their bytes: the audit record's key `wrong_units` (the Glossary's
# row, until a format version), with what writes, reads or mirrors it (`wrong_units_bound`, `audit.wrong_units`, Lean's
# `wrongUnits`); the network certifier's stored key `faulty_sets`, beside `faulty_bits` and `faulty_entries`; the
# record's rule ("at most `bound` wrong units") and the block record's unit label `"wrong units"`, which fixtures hold;
# and the other senses: PoUW's commitment unit with a wrong leaf (`..._first_wrong_unit`) and one-stage's negative case
# of a member checked as another (`wrong_unit`, its key `"wrong-unit"`), which no word here names.

[words]
"test_the_wrong_unit_bound_matches_worst_case_and_scales" = "test_the_incorrect_block_bound_matches_worst_case_and_scales"
"A wrong unit" = "An incorrect proof block"
"a wrong unit" = "an incorrect proof block"
"A faulty set" = "An incorrect set"
"a faulty set" = "an incorrect set"
"Wrong units" = "Incorrect proof blocks"
"wrong units" = "incorrect proof blocks"
"Wrong unit" = "Incorrect proof block"
"wrong unit" = "incorrect proof block"
"Incorrect units" = "Incorrect proof blocks"
"incorrect units" = "incorrect proof blocks"
"Incorrect unit" = "Incorrect proof block"
"incorrect unit" = "incorrect proof block"
"incorrect-units" = "incorrect-blocks"
"incorrect-unit" = "incorrect-block"
"Faulty sets" = "Incorrect sets"
"faulty sets" = "incorrect sets"
"Faulty set" = "Incorrect set"
"faulty set" = "incorrect set"
"faultySets" = "incorrectSets"
"incorrect_units" = "incorrect_blocks"

[keep]
strings = ["\"wrong units\"", "an accepted transcript has at most `bound` wrong units"]

[rewrite]
# Never rewritten: records of what was (the other maps, changelogs, the archive), fixtures, files whose bytes a digest
# pins, lock files, the Glossary's table of older names, the retired-words lint, and the registry's sources a manifest's
# digest takes in.
exclude = ["tests/lint/test_repo_retired_terms.py", "tools/move/**", "**/fixtures/**", "*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/moves.json", "GLOSSARY.md", "tests/test_retired_terms.py",
           "adapters/vllm/verity_vllm/definitions/registry/ref_prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/b1.py"]
