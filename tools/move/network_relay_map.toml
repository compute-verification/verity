# The network attester's id form's completion framing is the adapter's, and its id relay a benchmark's: the serving
# side's code that answers the network attester's id requests from a server, which no verifier reads.

[roots]
old = { verity = "verity", verity_vllm = "adapters/vllm/verity_vllm" }
new = { verity = "verity", verity_vllm = "adapters/vllm/verity_vllm" }

[paths]
"verity/protocols/accounting/network/prover/id_relay.py" = "benchmarks/network_e2e/ids_front.py"
"verity/protocols/accounting/network/prover/ids_protocol.py" = "adapters/vllm/verity_vllm/pipeline/ids_protocol.py"
"tests/verity/protocols/accounting/network/prover/test_id_relay.py" = "tests/benchmarks/network_e2e/test_id_relay.py"

[modules]
"tests.verity.protocols.accounting.network.prover.test_id_relay" = "tests.benchmarks.network_e2e.test_id_relay"
"verity.protocols.accounting.network.prover.ids_protocol" = "verity_vllm.pipeline.ids_protocol"

[rewrite]
# Never rewritten: records of what was, and files whose bytes a digest pins.
exclude = ["*.lean", "fixtures/**", "**/fixtures/**", "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock", "tools/move/**", "tools/research/src/research/store/moves.json"]
