# PoUB's prover out of the vLLM adapter: what `tools/move/layout.py --map tools/move/poub_node_store_map.toml` moves and
# rewrites (memory-accounting, MEM-321, the row "PoUS's and PoUB's code in the vLLM adapter goes to our provers").
#
# The node's store (`NodeMemory`, its interface, its plan, its memory map and the reference check of its openings) is
# PoUB's prover's, and reads nothing of vLLM, so it goes whole to `verity/protocols/accounting/poub/prover/node_store/`,
# beside the prover's `remote_session/` and `word_codec/`. What attaches it to vLLM stays in the adapter's
# `protocols/remote_bandwidth/`: `binder` (the engine's hooks) and `remote` (the option), which a code change after this
# move cuts so that the serving loop comes here too. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/proofs/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"adapters/vllm/verity_vllm/protocols/remote_bandwidth/interface.py" = "verity/protocols/accounting/poub/prover/node_store/interface.py"
"adapters/vllm/verity_vllm/protocols/remote_bandwidth/plan.py" = "verity/protocols/accounting/poub/prover/node_store/plan.py"
"adapters/vllm/verity_vllm/protocols/remote_bandwidth/memory_map.py" = "verity/protocols/accounting/poub/prover/node_store/memory_map.py"
"adapters/vllm/verity_vllm/protocols/remote_bandwidth/registry.py" = "verity/protocols/accounting/poub/prover/node_store/registry.py"
"adapters/vllm/verity_vllm/protocols/remote_bandwidth/verify.py" = "verity/protocols/accounting/poub/prover/node_store/verify.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**", "**/*.lean", "tests/tree.toml"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
"verity_vllm.protocols.remote_bandwidth.interface" = "verity.protocols.accounting.poub.prover.node_store.interface"
"verity_vllm.protocols.remote_bandwidth.memory_map" = "verity.protocols.accounting.poub.prover.node_store.memory_map"
"verity_vllm.protocols.remote_bandwidth.plan" = "verity.protocols.accounting.poub.prover.node_store.plan"
"verity_vllm.protocols.remote_bandwidth.registry" = "verity.protocols.accounting.poub.prover.node_store.registry"
"verity_vllm.protocols.remote_bandwidth.verify" = "verity.protocols.accounting.poub.prover.node_store.verify"
