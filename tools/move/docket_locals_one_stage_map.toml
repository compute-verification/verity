# One-stage's docket, SPOT's record of a window, as a parameter or local: `registration` becomes `docket` in the
# one-stage verifier's functions (`audit`, `draw`, `verifier`, `served_integrity`, `produced`), the keyword
# `template_audit` hands `audit_record`, and their tests. The keys `"registration"` and `registration_digest` keep
# their word, as do attributes (`.registration`) and the difftest's Lean twins (`registration`, `REGISTRATION`).

[words]

[[words_in]]
files = ["verity/protocols/proofs/spot/verifier/one_stage/audit.py"]
[words_in.words]
"in registration" = "in docket"
"registration is" = "docket is"
"registration)" = "docket)"
"registration," = "docket,"
"registration." = "docket."
"registration:" = "docket:"
"registration[" = "docket["

