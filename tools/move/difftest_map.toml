# The difftest harness's move: what `tools/move/layout.py --map tools/move/difftest_map.toml` moves and rewrites.
#
# `verity/difftest/` holds the differential test of each Lean against its Python: the distribution `verity_difftest`
# (`python/verity_difftest/`) with its suite (`tests/`), and its Lake package `difftest` (`lean/`). The Python is a tool
# the protocols' tests use and no part of what `verity` ships, so it goes beside the other tools, as `tools/difftest/`.
# The Lake package is Lean that eleven Lake packages under `verity/` require by path, and a copy of `verity/` alone must
# still build them, so it stays under `verity/`, beside the base packages it requires, as `verity/circuits/difftest/`.
#
# - The directory splits in two ([paths], the longest row wins): `lean/` to `verity/circuits/difftest/`, and the rest
#   (`pyproject.toml`, `README.md`, `python/`, `tests/`) to `tools/difftest/`, laid out as it was.
# - The import name `verity_difftest` stays: its root moves ([roots]), so no Python module is renamed and no import
#   changes. What changes is each path to the directory: the root pyproject's workspace member, `uv.lock`'s
#   distribution directory, a suite's inputs, and the lists that name the directory.
# - A Lean module is named from its package's root (`Difftest`, `AnnotDifftest`), so no Lean module, declaration or
#   lock record changes; what changes in a lakefile or a manifest is the path of each package that requires `difftest`.
# - A reference to `verity/difftest` as a whole follows the larger part, `tools/difftest/`, unless [split] names the
#   part the file means.
# Nothing is edited or deleted, and no file is added. The format is `layout_map.toml`'s. It runs last of the six, after
# `live_challenger_map.toml`, on the commit that map makes. It is the one that moves a Lake package, so the five before it
# can run without it.

[roots]
old = { verity = "verity", verity_difftest = "verity/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "tools/difftest/python/verity_difftest", verity_flock = "verity/protocols/flock/prover/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "adapters/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"verity/difftest/" = "tools/difftest/"
"verity/difftest/lean/" = "verity/circuits/difftest/"

[split]
# A reference to `verity/difftest` as a whole follows its larger part, `tools/difftest/`; each one here means the
# harness's Python or its distribution, or names it where the Lake package's own files are covered another way:
# "old file: old directory" = why (`layout.py` fails on any other, and on an entry no reference needs).
"AGENTS.md: verity/difftest" = "the map's line for the Python held to each Lean, which is `tools/difftest/`"
"pyproject.toml: verity/difftest" = "the workspace member, the distribution `verity_difftest`, whose pyproject is at `tools/difftest/`"
"uv.lock: verity/difftest" = "the distribution `verity-difftest`'s editable source, at `tools/difftest/`"
"tools/verity/check/drive.toml: verity/difftest" = "a low-risk exclude: the Lake package's files stay excluded by `verity/circuits/` and by `*.lean`, `lakefile.*` and `lake-manifest.json`"
"verity/README.md: verity/difftest" = "the Python that mirrors each Lean to it, which is `tools/difftest/`"
"verity/difftest/README.md: verity/difftest" = "the harness's README, whose title names its own directory, `tools/difftest/`"
"verity/commitments/identity/tests/test_identity_difftest.py: verity/difftest" = "the harness this suite drives its Lean through, `verity_difftest`"
"verity/definitions/requirement/tests/test_requirement_difftest.py: verity/difftest" = "the harness this suite drives its Lean through, `verity_difftest`"
"verity/protocols/pous/verifier/check/tests/test_setup_difftest.py: verity/difftest" = "the harness this suite drives its Lean through, `verity_difftest`"
"verity/protocols/pouw/verifier/lean/check/README.md: verity/difftest" = "the shared harness's `ProtocolPort`, in `verity_difftest`"
"verity/protocols/pouw/verifier/lean/window/README.md: verity/difftest" = "the shared harness's Python, `verity_difftest`"
"verity/protocols/spot/verifier/lean/pyproject.toml: verity/difftest" = "a suite input: the Lake package stays covered by its `verity/circuits` entry"
"tests/tree.toml: verity/difftest" = "the layout's not-yet entry for the directory this map splits, which its `to` describes; it follows the larger part"
"verity/periods/tests/test_periods_difftest.py: verity/difftest" = "the harness this suite drives its Lean through, `verity_difftest`"
"tests/import_order.toml: verity/difftest" = "the place of the distribution `verity_difftest` in the import order, which is `tools/difftest/`; the Lake package falls in `verity/circuits`' row, and the listing's own commit after the moves settles both"

[retired]
# the directory this map empties: `layout.py` refuses a tracked file under one that has no row, and its row is a
# directory's, so a file only a branch has under it is carried
paths = ["verity/difftest/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), files whose bytes a digest pins, and Lean sources. A module's source is in its build key, so a path
# rewritten in a comment would compile the module again, and every module that imports it. A `.lean` file that writes
# a path outside a comment is still rewritten (`include`); lakefiles and Lake manifests are too.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "tools/move/**", "archive/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/definitions/silicon/captures/**",
           "verity/definitions/silicon/hawkeye/**", "tools/verity/check/tests/test_suites.py",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json",
           "benchmarks/network_e2e/tests/data/**", "adapters/vllm/manifests/**", "adapters/vllm/workloads/**",
           "adapters/vllm/data/**", "adapters/vllm/verity_vllm/pins/**",
           "adapters/vllm/tools/migrate/superseded_quarantine.py",
           "adapters/vllm/tests/migrate/test_superseded_quarantine.py", "**/*.lean"]
include = ["**/fixtures/README.md", "**/fixtures/**/README.md",
           "**/lake-manifest.json", "adapters/vllm/manifests/definitions.json",
           "verity/protocols/flock/prover/tests/lean/RandomnessVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationVectors.lean",
           "verity/protocols/spot/verifier/tests/lean/ExfiltrationTwoVectors.lean"]

[modules]
# the renames [paths] implies (`layout.py --modules`): the directory and its Lake package as dotted paths. No module is
# named by either: the distribution's modules are `verity_difftest`'s, named from its root, the suite's files run as
# files, and the Lake package holds no Python
"verity.difftest" = "tools.difftest"
"verity.difftest.lean" = "verity.circuits.difftest"
