# The slowdown calculator's older words: what `tools/move/rename.py --map tools/move/slowdown_calculator_terms_map.toml`
# renames in `verity/protocols/inference_only/rho/`, prose, identifiers and registry keys alike, to the terms GLOSSARY.md gives. It runs before
# `slowdown_calculator_map.toml` moves the directory, and renames no path, module or Lean declaration, so the change it
# makes is an ordinary one, reviewed as such.
# - Unregistered hardware: "dark" is "unregistered" (the leaves, the pool, the gates, the share, the term and the figure
#   named so), and in a compound name `unreg`, as `eps_unreg` has it: `ε_dark`, `mfu_dark`, `dark_mfu`, `L_dark`,
#   `dark_share` and `_dark`.
# - Server blocks: "serving block" is "server block", as `ServerBlock` has it.
# - The reference training algorithm: "reference construction".
# - The slowdown: the tests' names and the constant that say "dampener" (`slowdown_map.toml` renames the Lean they pin).
# What it leaves, each for a name of its own: "envelope" (`envelopes.py`, the `envelopes.*` keys), "horizon", "monitored"
# and "unmonitored", "uncertified", "allowance" (`Allowance`, `CLASSES`, `Cap`), "tier", "route", `T_0`, "link-window",
# and `overhead`, `Overhead` and `Overhead.rho` for the slowdown.

[words]

[[words_in]]
files = ["verity/protocols/inference_only/rho/**"]
words = { "ε_dark" = "ε_unreg", "mfu_dark" = "mfu_unreg", "dark_mfu" = "unreg_mfu", "L_dark" = "L_unreg", "dark_share" = "unreg_share", "_dark" = "_unreg", "dark" = "unregistered", "Dark" = "Unregistered", "serving blocks" = "server blocks", "serving block" = "server block", "Serving blocks" = "Server blocks", "Serving block" = "Server block", "serving-block" = "server-block", "Serving-block" = "Server-block", "reference construction" = "reference training algorithm", "REMOTE_DAMPENER" = "REMOTE_SLOWDOWN" }

# The tests' names.
[[words_in]]
files = ["verity/protocols/inference_only/rho/tests/**"]
words = { "test_with_no_dark_leaves_the_overhead_is_the_inverse_of_the_counted_share_times_the_efficiency" = "test_with_no_unregistered_leaves_the_overhead_is_the_inverse_of_the_counted_share_times_the_efficiency", "test_the_padded_size_ratio_is_the_dark_leaves_plus_the_monitored_weight" = "test_the_padded_size_ratio_is_the_unregistered_leaves_plus_the_monitored_weight", "test_the_bound_counts_the_dark_leaves_at_capacity_and_an_attack_at_its_mfu" = "test_the_bound_counts_the_unregistered_leaves_at_capacity_and_an_attack_at_its_mfu", "test_a_construction_gets_the_dark_leaves_at_their_own_mfu" = "test_a_construction_gets_the_unregistered_leaves_at_their_own_mfu", "test_a_bound_holds_uncertified_and_dark_gates_and_every_block_at_u_and_an_attack_at_w" = "test_a_bound_holds_uncertified_and_unregistered_gates_and_every_block_at_u_and_an_attack_at_w", "test_the_serving_block_is_a_server_between_two_wipes_and_k_wipe_per_server" = "test_the_server_block_is_a_server_between_two_wipes_and_k_wipe_per_server", "test_overhead_weights_serving_blocks_by_their_gates" = "test_overhead_weights_server_blocks_by_their_gates", "test_at_the_serving_block_only_the_linear_counts_cap" = "test_at_the_server_block_only_the_linear_counts_cap", "test_a_serving_block_contributes_its_least_cut_and_never_more_than_its_capacity" = "test_a_server_block_contributes_its_least_cut_and_never_more_than_its_capacity", "test_with_nothing_else_bounding_the_padded_size_ratio_is_lean_dampener_remote_at_full_capacity" = "test_with_nothing_else_bounding_the_padded_size_ratio_is_lean_slowdown_remote_at_full_capacity", "test_the_remote_overhead_is_lean_remote_dampener_at_the_references_mfu" = "test_the_remote_overhead_is_lean_remote_slowdown_at_the_references_mfu" }

[rewrite]
# Never rewritten: the earlier moves and their maps, and lock files.
exclude = ["tools/move/**", "uv.lock", "**/*.lock"]

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+',
            'lanes/[\w.-]+', 'draft:[\w.-]+']
strings = []
