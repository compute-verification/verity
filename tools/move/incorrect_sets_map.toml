[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, the rulings), the frozen backends,
# files whose bytes a digest pins (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tools/move/**", "archive/**", ".agents/skills/friction/SKILL.md", "**/CHANGELOG.md", "fixtures/**",
           "*.patch", "**/TRUSTED.sha256", "uv.lock", "**/*.lock"]

[keep]
# A Flock audit's `wrong` field: declared, read in its own `cover` and as `A.wrong`, set as `wrong := P.wrong` (or at
# `t`, `Xt`), read off `analysisC`, and by its full name `FlockSoundness.Audit.Analysis.wrong`, which `--moves` reads
# without its file; a window's `WindowRec.wrong`; "a wrong", and the field in `OneStage`'s prose.
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+',
            '(?m)^  wrong(?= : Tr → )', '(?<=u ∈ )wrong(?= X → ksFail)', '(?<![\w.])A\.wrong(?!\w)',
            '(?<!\w)Analysis\.wrong(?!\w)',
            '(?m)^  wrong(?=(?: \w+)? := )', '(?<=Kr hlow\)\.)wrong', 'WindowRec\.wrong(?!\w)',
            '(?<!\w)[Aa]\s+wrong(?!\w)', '`Tr`, `wrong`', 'wrong\(X\) ∈ 𝓑']
strings = []

[keep_in]
