# The sets of incorrect proof blocks in the Glossary's word: what `tools/move/rename.py --map
# tools/move/incorrect_sets_map.toml` renames (a proof block that doesn't compute its outputs is incorrect; "wrong unit" is
# the older name). Core's `Verity.Partition.wrong`, Flock's `FlockSoundness.Audit.Partition.wrong` and the population's
# `Population.Dataflow.wrong` and `Population.DynPopulation.wrong` become `incorrect`, `Population.Dataflow.optWrong`
# becomes `optIncorrect`, and their lemmas follow. Declarations keep their place in the locks' records: `rename.py --moves`
# prints the renames that `check.py --update --moved` takes.
#
# Every other declaration spelled `wrong` keeps it: a Flock audit's own `wrong` field (`OneStage`'s and `Extraction`'s,
# which its constructions set to a partition's set), `Flock.Guarantees.WindowRec.wrong` (a window's count), Pouw's
# `UnitStmts.wrong` and `StageGame.wrong`, the sampled trace's and the pooled law's sets, Nci's certificates and the
# end-to-end statements' fields. So `wrong` is renamed only in the files where each use the build resolves is one of the
# five sets (a build with the five marked deprecated names every such use), and [keep] holds the audit field and
# `WindowRec.wrong` where those files name them beside a partition's set. `move_check.py` scopes no word to a file that
# already spells its new name, so Flock's `mem_wrong` is renamed by its full name in the two files that also name Core's
# `mem_incorrect`, and `wrong_eq`, also a field of Accounting's joint bridge, only where Spot declares it. Prose keeps "a
# wrong", which "incorrect" would leave without its article.
[words]
"Audit.Partition.mem_wrong" = "Audit.Partition.mem_incorrect"

