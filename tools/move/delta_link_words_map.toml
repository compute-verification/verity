# The binding error, the code half: what `tools/move/rename.py --map tools/move/delta_link_words_map.toml` renames, the
# older name `δ_link` (the link term) and its Lean spelling `δlink`, to GLOSSARY.md's term ε_bind, the binding error, and
# its Lean spelling `εbind` (as `terms_map.toml`, the prose half, already wrote them). It renames what that prose-only
# move left: `δ_link` in backticks and in strings, and the Lean name `δlink`, a binder in most theorems, the definition
# `Flock.SoundAtBridge.RowsSession.δlink` and its read `s.δlink`, and a window's per-call `δlink_c`; with them the
# Python test that matches `audit_count`'s statement text (`test_audit_profile.py`'s `AUDIT_COUNT`).
#
# It leaves: GLOSSARY.md (its older-names row is where the old spelling is recorded), the locks' records (a renamed
# binder changes a guarantee's statement, regenerated at the close), `benchmarks/one_stage/onsite_record.py`, whose
# `POOLED` and `unvalued` text a window report's record carries, and the three Lean sources whose sha256
# `exfiltration_lean.json` pins (`Influence.lean`, `Stratified.lean`, `ExfiltrationVectors.lean`): only its generator,
# which builds the Lean, rewrites that pin. No caller names a `δlink` binder (`(δlink := …)`), so a binder left in those
# files breaks no reference. `LinkSound`, which the Glossary's row also retires, is
# not this map's: its target `BindSound` is declared already.

[words]
"δlink_c" = "εbind_c"
"δ_link" = "ε_bind"
"δlink" = "εbind"

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+']

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, fixtures, patches, the Glossary's
# older-names row, the retired-words lints' examples), files whose bytes a digest pins (`rename.py` repins a
# `TRUSTED.sha256` line itself), lock files and the record text named above. A `lean-audit.json` is read, not
# excluded: `rename.py` leaves its records itself, and `--moves` reads them for `tools/move/delta_link_words_moves.json`.
exclude = ["tools/move/**", "**/fixtures/**", "**/*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock", "GLOSSARY.md", "benchmarks/one_stage/onsite_record.py",
           "security/Proofs/Flock/Soundness/Audit/Influence.lean", "security/Proofs/Flock/Soundness/Audit/Stratified.lean",
           "**/tests/lean/ExfiltrationVectors.lean", "tests/lint/test_repo_retired_terms.py", "tests/test_retired_terms.py",
           "adapters/vllm/verity_vllm/definitions/registry/ref_prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/prims.py", "adapters/vllm/verity_vllm/definitions/registry/b1.py"]
