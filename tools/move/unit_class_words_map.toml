# The retired words "unit class", "verification unit" and the proof-unit names: what `tools/move/rename.py --map
# tools/move/unit_class_words_map.toml` renames, by the Glossary's rows ("proof block; a unit class is a size class, or
# Flock's proof-block class", and "verification unit" to "proof block"), in their senses:
# - the size class: the public size class of a proof block's outputs, a power of two from 16 to 262,144 bits. Every code
#   name of the family is in this sense: `partition_v2.UNIT_CLASS_MAX`, `UNIT_CLASSES` and `unit_class` (and their mirrors
#   in SPOT's `one_stage/partition.py` and `proofs.py`), the Lean's `Claims.Sampling.unitClassMax` and `unitClass`,
#   `Spot.Partition.UNIT_CLASS_MAX`, `UNIT_CLASSES` and `unitClass`, `Spot.OneStageZk.UNIT_CLASS_MAX`, and the lemmas
#   `unitClass_of_le`, `unitClass₀` and `SitsAt.unitClass_map`; they become `SIZE_CLASS_MAX`, `SIZE_CLASSES`,
#   `size_class`, `sizeClassMax` and `sizeClass` (the lemma `sizeClass_of_le_max`), beside the claims' `sizeClasses`. AGENTS.md's "`UNIT_CLASS_MAX` = 16"
#   is renamed with the constant;
# - Flock's proof-block class: the class a META definition's instances share (`verity_flock.class_statement`), in prose
#   and messages ("a unit class (META definition) has no templated statement", in Python and the Lean verifier, each with
#   the test that matches it), and `template_audit.unit_class`, which returns the instance class's `class_sha512`, becomes
#   `proof_block_class`;
# - a proof block: "verification unit" in prose (the TC relation's chain from `zero_state` to the committed word, the
#   census schemas' descriptions), the certifier's `_PROOF_UNIT` (its proof block's Definition) and one test name.
# It leaves what a digest, a circuit file or a stored record holds: Flock's template id `unit-class` and its instances'
# ids (`unit-class/NAME`, `unit-class-NAME`, the `flock-circuit unit-class/x` headers), which no [words] entry matches; a
# `Spec`'s public-item reasons ("N, the window's proof units", ...), which its digest hashes; the `"proof-unit"` kind of
# circuit-check's Boolean export; the `unit_class` key of a circuit-check failure record (`checks.py`); the stored
# instance text "the one unit class" (`proof_throughput`'s `instances.py` and its JSON); the census test's literal
# "verification unit", which checks the data no longer holds it; `vu_*` names and "VU" (the Glossary keeps them for Flock's
# statement layout); the lock records; and the lints and the Glossary rows that name the old words.

[words]
# --- the size class, its code names (`Flock.Bridge.unitClass_of_le` takes `_max`: `Claims.Sampling`, which its file
# opens, already declares `sizeClass_of_le`)
"unitClass_of_le" = "sizeClass_of_le_max"
"UNIT_CLASS_MAX" = "SIZE_CLASS_MAX"
"UNIT_CLASSES" = "SIZE_CLASSES"
"unitClassMax" = "sizeClassMax"
"unitClass" = "sizeClass"
"unit_class" = "size_class"
# --- a proof block
"PROOF_UNIT" = "PROOF_BLOCK"
"proof_units" = "proof_blocks"
"Verification units" = "Proof blocks"
"verification units" = "proof blocks"
"Verification unit" = "Proof block"
"verification unit" = "proof block"
# --- Flock's proof-block class, in prose and messages
"unit classes" = "proof-block classes"
"unit class" = "proof-block class"

# The template audit's class of an instance set is Flock's proof-block class (its `class_sha512`)
[[words_in]]
files = ["**/spot/prover/audit/template_audit.py"]
[words_in.words]
"unit_class" = "proof_block_class"

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps), fixtures and vectors, files whose bytes a digest
# pins, lock files (the Lean locks' records and frozen reasons included), and the two lints
# that name the retired words.
exclude = ["tools/move/**", "**/fixtures/**", "**/*vectors*.json", "**/*.patch",
           "**/TRUSTED.sha256", "uv.lock", "**/*.lock", "**/lean-audit.json", "benchmarks/numerical/tests/bench/data/**",
           "tests/test_retired_terms.py", "tests/lint/test_repo_retired_terms.py",
           "adapters/vllm/verity_vllm/definitions/registry/**"]

[keep]
# Never rewritten wherever they stand: the Glossary's rows of older names, the stored instance text of
# `proof_throughput`, and the census test's literal, which checks that the data no longer holds the old word.
patterns = ['(?m)^\| "proof unit".*$', '(?m)^\| "verification unit".*$', 'class_lanes of the one unit class',
            '"verification unit" not in']

[keep_in]
# a key of a circuit-check failure record, which reports store
"**/circuit_check/src/circuit_check/checks.py" = ["unit_class"]
