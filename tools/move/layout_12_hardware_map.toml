# The layout move of the machine model, Site and registration, to `verity/hardware`: what `tools/move/layout.py --map
# tools/move/layout_12_hardware_map.toml` moves and rewrites. 262 files in 3 components, in 6 rows.
# A moved file's new path is its component's new directory, then the name of the directory it is in today, then its
# path below that; the name is left out where the new directory, less `verifier/`, `prover/` or `device/`, already
# ends in it. A directory is one row where all of it goes one way; a directory this move shares with another is one
# row a file. Nothing is edited, split or deleted.
# Rows that depart from that rule:
# - `benchmarks/pouw/machine_model/` to `verity/hardware/machine_model/`: the machine model: the plain rule gives
#   `verity/hardware/pouw/machine_model/`, where `pouw/` names only the benchmark directory it sits in today.
# - `verity/core/protocols/record.py` to `verity/hardware/record.py`: the plain rule gives
#   `verity/hardware/protocols/record.py`, a package named for the directory the file left, whose `__init__.py` no
#   moved file brings.
# - `verity/core/protocols/registration.py` to `verity/hardware/registration.py`: as `record.py`: the plain rule
#   gives `verity/hardware/protocols/registration.py`.
# The layout's maps run in the order of their names. This one renames no package another map takes modules out of, so
# its place among them is free. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "benchmarks/pouw/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_config = "tools/config/verity_config", verity_machine_model = "verity/hardware/machine_model/verity_machine_model", datacenter = "benchmarks/datacenter/datacenter" }

[paths]
"benchmarks/pouw/machine_model/" = "verity/hardware/machine_model/"
"verity/core/primitives/world/" = "verity/hardware/world/"
"verity/core/protocols/record.py" = "verity/hardware/record.py"
"verity/core/protocols/registration.py" = "verity/hardware/registration.py"
"verity/core/protocols/tests/test_record.py" = "verity/hardware/tests/test_record.py"
"verity/core/site/" = "verity/hardware/site/"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves, the
# archive), and files whose bytes a digest pins.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz",
           "**/CHANGELOG.md", "*.patch", "**/TRUSTED.sha256", "**/lake-manifest.json.lock",
           "uv.lock", "tools/move/**", "archive/**", "benchmarks/numerical/reports/**",
           "benchmarks/numerical/tests/bench/data/**", "**/price_twins.json", "verity/ml/circuits/silicon/captures/**", "verity/ml/circuits/silicon/hawkeye/**",
           "verity/definitions/silicon/captures/**", "verity/definitions/silicon/hawkeye/**", "integrations/vllm/manifests/**", "integrations/vllm/workloads/**",
           "integrations/vllm/data/**", "integrations/vllm/verity_vllm/pins/**", "tools/verity/check/tests/test_suites.py", "tools/verity/check/tests/test_move_check.py",
           "tools/research/src/research/store/moves.json", "benchmarks/tc_probe_fp4/fp4_emulation_1ad1aaa2.py", "benchmarks/network_e2e/tests/data/**", "benchmarks/hash/dither/j10b_ref.py",
           "benchmarks/hash/dither/j10ca_ref.py", "benchmarks/hash/dither/j10hb.py", "benchmarks/hash/dither/j10rtx.py", "benchmarks/hash/dither/j10served.py",
           "integrations/vllm/tools/migrate/superseded_quarantine.py", "integrations/vllm/tests/migrate/test_superseded_quarantine.py"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json", "integrations/vllm/manifests/definitions.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"benchmarks.pouw.machine_model" = "verity.hardware.machine_model"
"verity.core.primitives.world" = "verity.hardware.world"
"verity.core.protocols.record" = "verity.hardware.record"
"verity.core.protocols.registration" = "verity.hardware.registration"
"verity.core.protocols.tests.test_record" = "verity.hardware.tests.test_record"
"verity.core.site" = "verity.hardware.site"
