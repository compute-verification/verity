# The audit commands with no adapter or Flock import: what `tools/move/layout.py --map tools/move/audit_compose_map.toml`
# moves and rewrites. The composites' verdict on a served run's cases (`composite.py`, `served_composite.sh`) and the
# cases it reads (`served_cases.py`, with `inference_only_lean.py`, which it loads by name) assemble several protocols'
# cases, so they are compose's prover side; R2's other partition is SPOT's audit, and takes a name that is no run id.
# Each test goes with its file, but `test_served_cases.py`, which also reads `v1_case.py`, a script that stays. Nothing is split, edited or deleted. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_cli = "tools/verity/cli/verity_cli", research = "tools/research/src/research" }
new = { verity = "verity", verity_cli = "tools/verity/cli/verity_cli", research = "tools/research/src/research" }

[paths]
"benchmarks/one_stage/composite.py" = "verity/protocols/compose/prover/composite.py"
"benchmarks/one_stage/served_composite.sh" = "verity/protocols/compose/prover/served_composite.sh"
"benchmarks/one_stage/served_cases.py" = "verity/protocols/compose/prover/served_cases.py"
"benchmarks/one_stage/inference_only_lean.py" = "verity/protocols/compose/prover/inference_only_lean.py"
"benchmarks/one_stage/r2_population.py" = "verity/protocols/proofs/spot/prover/audit/other_population.py"
"tests/benchmarks/one_stage/test_composite.py" = "tests/verity/protocols/compose/prover/test_composite.py"
"tests/benchmarks/one_stage/test_r2_population.py" = "tests/verity/protocols/proofs/spot/prover/test_other_population.py"

[retired]
paths = []

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), files
# whose bytes a digest pins, `move_check.py` and its test, and `tests/tree.toml`, the layout of record.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**", "tests/tools/move/**",
           "tests/tools/check/test_move_check.py", "tools/check/move_check.py",
           "tools/research/src/research/store/moves.json", "tests/tree.toml", "**/*.lean", "**/lean-audit.json"]
include = []

[modules]
"benchmarks.one_stage.composite" = "verity.protocols.compose.prover.composite"
"benchmarks.one_stage.inference_only_lean" = "verity.protocols.compose.prover.inference_only_lean"
"benchmarks.one_stage.r2_population" = "verity.protocols.proofs.spot.prover.audit.other_population"
"benchmarks.one_stage.served_cases" = "verity.protocols.compose.prover.served_cases"
"tests.benchmarks.one_stage.test_composite" = "tests.verity.protocols.compose.prover.test_composite"
"tests.benchmarks.one_stage.test_r2_population" = "tests.verity.protocols.proofs.spot.prover.test_other_population"
