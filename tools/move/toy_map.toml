# The toy's move out of `integrations/`: what `tools/move/layout.py --map tools/move/toy_map.toml` moves, renames and
# rewrites (Daniel, 25 Oct 11:43 PM PDT, CMP-147: examples get a top-level `examples/`, one directory per example, each
# holding its workload, its placement and the command that runs it; `integrations/` stays one directory per outside system).
#
# - `integrations/torch_loop/`, the toy's model, serving loop, compiler, checkpoint and weights, becomes `examples/toy/`, and
#   its import package `verity_torch_loop` becomes `verity_toy`.
# - The toy's command, `benchmarks/all_protocols/run.sh`, joins it as `examples/toy/run.sh` (`verity example toy`). The
#   runner it starts (`verity_all_protocols`), the legs and the composition stay in `benchmarks/all_protocols/` until
#   CMP-144 moves them into core.
# Nothing is split, edited or deleted, and no file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_torch_loop = "integrations/torch_loop/verity_torch_loop", verity_all_protocols = "benchmarks/all_protocols/verity_all_protocols" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_sp1 = "archive/sp1/python/verity_sp1", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli", verity_toy = "examples/toy/verity_toy", verity_all_protocols = "benchmarks/all_protocols/verity_all_protocols" }

[paths]
"integrations/torch_loop/" = "examples/toy/"
"integrations/torch_loop/verity_torch_loop/" = "examples/toy/verity_toy/"
"benchmarks/all_protocols/run.sh" = "examples/toy/run.sh"

[retired]
paths = ["integrations/torch_loop/"]

[drop]
paths = []

[rewrite]
# Never rewritten: records of what was (the earlier moves and this map, changelogs, research's recorded moves), and files
# whose bytes a digest pins.
exclude = ["*.lean", "fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**",
           "tools/verity/check/tests/test_suites.py", "tools/verity/check/tests/test_move_check.py",
           "tools/research/src/research/store/moves.json"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`); every module under one follows it unless a longer entry
# says otherwise
"integrations.torch_loop" = "examples.toy"
"verity_torch_loop" = "verity_toy"
