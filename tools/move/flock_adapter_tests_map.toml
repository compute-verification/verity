[drop]
paths = []

[rewrite]
# Never rewritten: records of what was, files whose bytes a digest pins, `move_check.py` and its test, `tests/tree.toml`,
# and circuit-check's checks, which @circuits owns.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**", "archive/**",
