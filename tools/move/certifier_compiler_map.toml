# The compile slice, vLLM's prefix cache and the served rows (the registered compiler's pieces) go from the network
# certifier to the vLLM adapter, which holds the compiler (ARCHITECTURE.md): what `tools/move/layout.py --map
# tools/move/certifier_compiler_map.toml` moves and rewrites. Each Definition moves with its circuit-check sidecar and pins
# and its tests. The advice format and its charge (`advice`, `arith_encode`, `charge_chain`, `window_charge`),
# `replay_chain` and `replay_step` stay, since trusted code or the certifier's own tests read them; the fixtures stay
# beside their writers and their other readers, and a hand commit after the move points the moved tests at them.

