# A sampling design's stages, by their Glossary names: what `tools/move/rename.py --map tools/move/stage2_words_map.toml`
# renames. `GLOSSARY.md` retires "stage 2" and "stage 1" for the second stage and the first stage (the row of a
# two-stage design). Only the places where the word names a sampling design's stage are renamed, each by a glob:
# - the Lean field `stage2` of `security/`'s sampling designs (the rounds after the sample, its sessions) becomes
#   `secondStage`: its declarations, every `L.stage2`, `c.stage2`, `D.stage2` and `Compiled.stage2` that reads it, the
#   theorem `record_stage2`, and the docstrings that name the field;
# - the first stage's hand-off of SPOT's two-stage driver (`two_stage.py`) becomes `first_stage`: `First.stage1()`,
#   `STAGE1`, the `second` command's `--stage1` (now `--first-stage`) and the scripts and tests that pass it, as
#   `spot/verifier/second_stage.py` and the summary's `first_stage` already say.
# Left, stored bytes: the hand-off's format id `verity-vllm/two-stage/stage1/v0`, its file name `stage1.json` and the
# `"stage1"` key of the second stage's `summary.json`, which `verity_bench/served_record.py` reads back from kept runs
# (the summary also has a `first_stage` key already); the kernel registry's files whose source enters a manifest's
# digest. Left as other senses:
# the pipeline stages of vLLM's Gumbel sampler and MLA kernels (`_fwd_kernel_stage2` and `_fwd_grouped_kernel_stage1`
# are vLLM's names); `moe_pad`'s project "Stage 2" and its tests; a transcendental's algorithm stages; the advice
# parser's stages; Flock's `stage` wire constructor and the `stage1` net of its tests; a16z's security stages in Flock's
# soundness design and the verifier README's stages that Level 3 cites; the numerical checker's fixtures (`stage-1`,
# `stage-2`); the job queue's "Stage 1.5"; `DStage` and `JStage`.

[words]

[[words_in]]
files = ["security/**"]
[words_in.words]
"record_stage2" = "record_secondStage"
"stage2" = "secondStage"

[[words_in]]
files = ["**/two_stage.py", "**/test_two_stage_*.py", "**/two_stage_small.sh", "**/sampled_two_small.sh",
         "**/stop_audit_small.sh"]
[words_in.words]
"--stage1" = "--first-stage"
"STAGE1" = "FIRST_STAGE"
"stage1" = "first_stage"

[keep]
patterns = ['[\w.-]+(?:/[\w.-]+)*/v\d+(?:\.\d+)*\b', 'note:[\w./-]+', 'art:[0-9a-f]+', 'cursor/[\w./-]+', 'lanes/[\w.-]+',
            '"stage1"(?=: str\()', '\bstage1\.json\b']

[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, fixtures, patches), files whose bytes a
# digest pins (`rename.py` repins a `TRUSTED.sha256` line itself) and lock files.
exclude = ["tests/lint/test_repo_retired_terms.py", "tools/move/**", "**/fixtures/**", "**/*.patch", "**/TRUSTED.sha256", "uv.lock",
           "**/*.lock", "adapters/vllm/verity_vllm/definitions/registry/ref_prims.py",
           "adapters/vllm/verity_vllm/definitions/registry/prims.py", "adapters/vllm/verity_vllm/definitions/registry/b1.py"]
