# The public split's move: what `tools/move/layout.py --map tools/move/public_split_map.toml` moves and rewrites, so the
# public monorepo's files (`tools/verity/check/public_boundary.toml`) need none it doesn't copy.
#
# - The bench spine's templates and input sets get a public home in Flock, their main reader: `verity_flock` already holds
#   the per-template lowering modules (`verity_flock/templates/`, a package, hence `subcircuit_templates`). The generator
#   (`bench/generate.py`), the result contract and the census readers stay in `benchmarks/numerical`, which then imports
#   them from `verity_flock`.
# - The fixtures public tests read move beside those tests: the commit-slot layout (`verity/ml/commitments/tests`) and the
#   captured row-101 input sets (`verity/ml/flock/tests`). The bench's `test_cell.py` spells its slice from `__file__`, so the
#   move rewrites it, and its `DATA` anchor keeps reading the data that stays.
# `Identity/Domains.lean`'s move into `core_randomness` renames a Lean module, which this script doesn't rewrite: it is the
# window's word map's. Nothing is split, edited or deleted, and no file is added. The format is `layout_map.toml`'s.

[roots]
old = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }
new = { verity = "verity", verity_difftest = "verity/core/difftest/python/verity_difftest", verity_flock = "verity/ml/flock/python/verity_flock", verity_numerical = "benchmarks/numerical/python/verity_numerical", verity_vllm = "integrations/vllm/verity_vllm", research = "tools/research/src/research", circuit_check = "tools/verity/circuit_check/src/circuit_check", cluster = "infra/cluster/src/cluster", verity_cli = "tools/verity/cli/verity_cli" }

[paths]
"benchmarks/numerical/python/verity_numerical/bench/templates.py" = "verity/ml/flock/python/verity_flock/subcircuit_templates.py"
"benchmarks/numerical/python/verity_numerical/bench/templates.circuit-check.py" = "verity/ml/flock/python/verity_flock/subcircuit_templates.circuit-check.py"
"benchmarks/numerical/python/verity_numerical/bench/templates.circuit-check.json" = "verity/ml/flock/python/verity_flock/subcircuit_templates.circuit-check.json"
"benchmarks/numerical/python/verity_numerical/bench/input_sets.py" = "verity/ml/flock/python/verity_flock/input_sets.py"
"benchmarks/torch_gpu/commit_slots/fixtures/commit-slots-v1.json" = "verity/ml/commitments/tests/fixtures/commit-slots-v1.json"
"benchmarks/numerical/tests/bench/data/captured-101/" = "verity/ml/flock/tests/data/captured-101/"

[retired]
paths = []

[drop]
paths = []


[rewrite]
# Never rewritten: records of what was (the earlier moves and their maps, changelogs, research's recorded moves), and files
# whose bytes a digest pins.
exclude = ["fixtures/**", "**/fixtures/**", "**/*vectors*.json", "**/*vectors*.txt.gz", "**/CHANGELOG.md", "*.patch",
           "**/TRUSTED.sha256", "**/lake-manifest.json.lock", "uv.lock", "tools/move/**",
           "tools/verity/check/tests/test_move_check.py", "tools/research/src/research/store/moves.json"]
include = ["fixtures/artifacts.json", "**/fixtures/README.md", "**/fixtures/**/README.md", "**/lake-manifest.json"]

[modules]
# the renames [paths] and [roots] imply (`layout.py --modules`)
"verity_numerical.bench.input_sets" = "verity_flock.input_sets"
"verity_numerical.bench.templates" = "verity_flock.subcircuit_templates"
