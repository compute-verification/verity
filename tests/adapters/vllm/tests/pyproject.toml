# The suite of the distribution `verity-vllm`: a virtual member that depends on it, so the suite keys on what the
# distribution's dependents read, and `tools/check/suites.py` names it as the distribution.
[project]
name = "verity-vllm-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["verity-vllm[research]"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
# Run from this directory: fixtures are read relative to it.  CUDA / vLLM / pod-tree tests skip or fail by name off-pod.
testpaths = ["."]
addopts = "-q -p no:cacheprovider"
# tests/regression (the reference regression; skipped unless VERITY_REGRESSION=1) is run explicitly: `pytest tests/regression -m regression`.
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
    "boolean_sweep: a random Boolean-vs-word sweep; skipped unless VERITY_VLLM_BOOLEAN_SWEEPS=1 (circuit-check's word_view checks the equality, off the merge gate)",
    "regression: the v1 reference regression checks (tests/regression); opt in with VERITY_REGRESSION=1",
    "pod: reads > 100 MB or rebuilds for minutes/hours -- run on a pod, never on the laptop",
    "weak: PASS-side only or a rule no reference row exercises (see the check module's docstring)",
    "rebuild: recomputes from a row's Programs (a manifest rebuild, a component decode); skipped unless VERITY_REGRESSION_REBUILD=1, as after each train on main (tools/check/post_train.py)",
]

[tool.verity.tests]
# In place of its dependencies' directories (`inputs_only`): `verity` whole, since the code identity (`source_identity.code_identity`,
# which tests/pipeline computes over this tree) hashes every file of it; of `research`, what the
# package imports (`research.store.tool`, `research.telemetry.source_identity`) and the store CLI that `store_io` starts for a
# fetch and `records.data` starts as `python -m research` (its `__main__`), and the run fixture
# tests/regression/test_attempt_resolution.py resolves. Test-only: tests/pipeline checks the fixtures
# this package registers and the demo's stored workload (adapters/vllm/tools/served_run/workloads/SHA256SUMS); tests/program/test_fp8_moe.py replays the Hopper e4m3 k32 step's pinned vectors (under `verity`);
# tests/engine's int8 tests run benchmarks/ppl's int8 steps as their oracle;
# tests/store/test_remote_session.py runs the remote session's prover and verifier (`store.remote`), and the verifier
# imports lean_verifier.py, challengers.py and store_layout.py; tests/protocol_options/test_pouw_h1_circuits.py parses a
# period-open's --circuit-files with infra's gate (verity/protocols/compose/verifier/live_challenger/auditor.py), and the in-process gate
# (tests/protocol_options/challenger_host.py) runs infra's model registry (verity/protocols/compose/verifier/live_challenger/models.py);
# tests/pipeline/test_served_unit_rows.py pins the statements of the served GLM-5.3 partitions' chunked templates
# (benchmarks/one_stage/glm53_*.json), and tests/tools/test_description_sizes.py holds the description of every template
# they name to its size (each glm53_*_tp8_step*.json, so a partition file added there is listed here);
# tests/protocols/test_pous_option.py encodes and spot-checks C* with P2's store (verity/protocols/resource_accounting/memory/pous/prover/p2/p2_store/store.py and the
# reference decode it imports) and imports the store's load (load.py, with the library's wrapper gpu.py); tests/tools/test_ratchet_gate.py commits the repository's lints (tests/lint/test_repo_env_reads.py,
# test_repo_ruff.py, test_repo_silent_excepts.py, test_repo_lane_text.py and test_repo_retired_terms.py) into the repositories it gates.
# The tests build and run the Lake packages whose lakefiles they list: tests/pipeline/test_row_tables_stream.py
# `spot-verifier`, tests/protocol_options/test_pouw_h1.py `pouw-check-difftest` and test_remote_session.py
# `poub-verifier`.
# The root ruff.toml is what ruff.toml extends, and tests/lint/test_ruff_vllm.py reads its selection.
# verity_vllm/definitions is a suite of its own, which this suite's directory leaves out; the package imports it throughout.
# The package imports the PyTorch adapter (adapters/torch/verity_torch) throughout, and tests/program/test_inputs.py reads its
# rules' sources.
# tests/commit/test_census_and_memory_map.py builds `core_requirement` (verity/circuits/requirement) against the
# difftest harness's Lean (tools/difftest), and loads that package's test_requirement_difftest.py by its path.
# tests/pipeline/test_serve_h1.py loads adapters/torch's test_pouw_h1_receipts.py by its path, for its lanes-form Window;
# tests/protocols/test_pous_option.py runs the memory challenger, which reads the configuration hashes the verity command
# commits (tools/verity/cli/verity_cli/configurations.toml).
inputs_only = true
inputs = ["adapters/vllm", "verity", "adapters/vllm/verity_vllm/definitions", "adapters/torch/verity_torch", "hardware/cards", "verity/README.md",
          "tools/config/verity_config", "artifacts.json", "adapters/vllm/tools/served_run/workloads/SHA256SUMS",
          ".gitignore",
          "verity/protocols/proofs/spot/verifier/lean/lakefile.toml", "verity/protocols/resource_accounting/compute/pouw/verifier/lean/check/lakefile.toml",
          "verity/protocols/resource_accounting/memory/poub/verifier/lean/lakefile.toml",
          "benchmarks/ppl/steps.py", "benchmarks/ppl/matmul.py", "benchmarks/ppl/gates.py", "benchmarks/ppl/spec.py", "benchmarks/ppl/methodology.py", "benchmarks/ppl/model.py",
          "benchmarks/ppl/windows.py", "benchmarks/ppl/datasets.json",
          "verity/protocols/resource_accounting/memory/poub/prover/remote_session/prover.py",
          "verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm/fattn_ref.py",
          "verity/protocols/resource_accounting/memory/poub/verifier/session/verifier.py",
          "verity/protocols/resource_accounting/memory/poub/verifier/session/wire.py",
          "verity/protocols/resource_accounting/memory/poub/verifier/session/checks.py", "verity/protocols/resource_accounting/memory/poub/verifier/session/lean_verifier.py", "verity/protocols/resource_accounting/memory/poub/verifier/session/challengers.py",
          "benchmarks/remote_session/store_layout.py", "verity/protocols/compose/verifier/live_challenger/auditor.py", "verity/protocols/compose/verifier/live_challenger/host.json",
          "verity/protocols/compose/verifier/live_challenger/models.py", "verity/protocols/resource_accounting/compute/pouw/prover/sass_gate.py",
          "benchmarks/pous/p2_v1/__init__.py", "verity/protocols/resource_accounting/memory/pous/prover/p2/p2_store/load.py", "verity/protocols/resource_accounting/memory/pous/prover/p2/p2_store/gpu.py",
          "verity/protocols/resource_accounting/memory/pous/prover/p2/p2_store/store.py", "verity/protocols/resource_accounting/memory/pous/prover/p2/p2_store/tensors.py", "verity/protocols/resource_accounting/memory/pous/verifier/p2_v1/reference.py",
          "benchmarks/one_stage/glm53_all_families_tp8_step16.json", "benchmarks/one_stage/glm53_sparse_mla_tp8_step16.json",
          "benchmarks/one_stage/glm53_prefill_tp8_step0.json", "benchmarks/one_stage/glm53_prefill_tp8_step0_core.json",
          "benchmarks/one_stage/glm53_moe_w13_tp8_step16.json", "benchmarks/one_stage/glm53_moe_w2_tp8_step16.json",
          "benchmarks/one_stage/glm53_silu_mul_v2_tp8_step16.json", "benchmarks/one_stage/glm53_silu_mul_v2_tp8_step16_stratified.json",
          "ruff.toml", "tests/lint/test_repo_env_reads.py", "tests/lint/test_repo_ruff.py", "tests/lint/test_repo_silent_excepts.py",
          "tests/lint/test_repo_lane_text.py", "tests/lint/test_repo_retired_terms.py",
          "tools/research/src/research/__init__.py", "tools/research/src/research/cli.py", "tools/research/src/research/clone.py",
          "tools/research/src/research/compare.py", "tools/research/src/research/env.py", "tools/research/src/research/pythonpath.py",
          "tools/research/src/research/record.py", "tools/research/src/research/remote.py", "tools/research/src/research/result.py",
          "tools/research/src/research/runs.py", "tools/research/src/research/secret_hint.py", "tools/research/src/research/timefmt.py", "tools/research/src/research/waitcap.py",
          "tools/research/src/research/treelock.py", "tools/research/src/research/store", "tools/research/src/research/telemetry", "tests/tools/research/fixtures/run_v0.2",
          "tools/research/src/research/pipefail.py",
          "tools/research/src/research/withdraw.py",
          "tools/research/src/research/__main__.py", "tools/difftest",
          "tests/adapters/torch/tests/pouw/test_pouw_h1_receipts.py", "tools/verity/cli/verity_cli/configurations.toml"]
parallel = true
# verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm/fattn_ref.py is the int8 attention tests' oracle (tests/engine), beside benchmarks/ppl's linears;
# tests/engine/int8_attention_sass.py reads the int8 attention kernels' SASS with the PoUW SASS gate's nvdisasm parser
# (verity/protocols/resource_accounting/compute/pouw/prover/sass_gate.py)
# a worker's peak grows with its share of the suite, since what its tests leave held isn't returned: 6.2 GB on 14 workers, 12 GB on
# 8 (test_codec's alias test takes 6.3 GB over the 5.6 GB held before it), 15.5 GB on 5. `--mem-gb`, or a job's memory cgroup,
# divides by this, so a 16 GB job runs the suite on at most two workers. tools/suite_parts.py runs it as 8 parts at once, each on
# its job's CPUs (a sixth on 4 workers: 8.5, 6.2, 6.0 and 3.5 GB)
worker_gb = 8
# the full suite takes about 10,000 s on 5 workers, past suites.py's SUITE_TIMEOUT_S; `--quick` leaves out the tests over 5 s
# (their `slow` marks). On fewer workers the bound stretches in proportion (suites.py's `bound`): a whole check on an 11-core
# slot runs it on 2 or 3
timeout_s = 14400
timeout_workers = 5
# check runs it as three parts by test id (`lean-suites:verity-vllm:K/3`, `suites.py`'s `id_part_of`), each collecting every
# file and running the tests whose node id hashes to K, so that ci.toml's plans put one part beside the security analysis's
# audit and two beside the Rust build: whole, on the workers a shard's memory gives it when the audit isn't deferred, it ran
# longest of any gating step
parts = 3
