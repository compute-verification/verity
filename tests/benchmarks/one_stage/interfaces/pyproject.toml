# The E2E demo's interfaces: the drawn-unit replay bundle and the block record. Not a package: the suite checks the drawn-unit replay bundle
# (`verity_e2e_demo.replay_bundle`) and the block record (`verity_e2e_demo.block_record`) against their schemas and
# fixtures.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../benchmarks/one_stage/interfaces"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: windows, commitments, the Definitions a unit replays and core's registered values.
# `verity/commitments/cuda/commit_slots/slots.py`: kernels' commit call, which builds the bundle's step commitments.
# `benchmarks/census/deployments.json`: the reference deployment test_block_record holds the block record's to.
inputs = ["verity", "verity/commitments/cuda/commit_slots/slots.py", "benchmarks/census/deployments.json", "benchmarks/one_stage/interfaces"]
