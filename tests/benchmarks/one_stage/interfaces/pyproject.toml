# The E2E demo's interfaces: the block record. Not a package: the suite checks the block record
# (`verity_e2e_demo.block_record`) against its schema and fixtures.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../benchmarks/one_stage/interfaces"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `calibration/census/deployments.json`: the reference deployment test_block_record holds the block record's to.
# block_record derives the record's subprotocols from the onsite application
inputs = ["applications/onsite_full.toml", "verity", "calibration/census/deployments.json", "benchmarks/one_stage/interfaces"]
