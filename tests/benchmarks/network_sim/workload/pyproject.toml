[project]
name = "verity-netsim-workload"
version = "0.0.0"
description = "The workload's Programs: a Boolean MLP and verity_vllm's serving Program, which benchmarks/verifier_cost reads."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-torch"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
verity-vllm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["."]
# `workload` is imported as a package from the directory above it.
pythonpath = ["../../../../benchmarks/network_sim"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["benchmarks/network_sim/workload"]
