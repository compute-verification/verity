[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_statement.py"]
# The calculator's lower bound cites guarantees by name; the tests check that the lock lists them. ReferenceLayered's
# falsification test (test_tiers.py) checks the parameters its Lean statements state against tiers.py's, with the
# Dot width read from the BF16 GEMM's step (gemm.py's GEMM_HOPPER).
inputs = [
  # the output bits an incorrect proof block injects are the widest public size class of a block's outputs (tiers.py
  # reads verity.circuits.partition_v2, which imports its package)
  "verity/__init__.py",
  "verity/circuits",
  "security/lean-audit.json",
  "security/Definitions/Slowdown/Assumptions/Layered.lean",
  "security/Definitions/Slowdown/Guarantees/Layered.lean",
  "verity/circuits/ops/boolean/gemm.py",
  # tiers.CARD pins the RTX PRO 6000 Server Edition's card file, and CREDITED_CLOCK_HZ the card file's clock.sm, read
  # through verity.device (test_tiers.py)
  "verity/device.py",
  "calibration/hardware/cards/rtx-pro-6000-server.toml",
  # the slowdown D is the slowdown calculator's (statement.py, fit.py, imported by path)
  "benchmarks/slowdown/slowdown/__init__.py",
  "benchmarks/slowdown/slowdown/theorem.py",
  # a model's shape is the slowdown calculator's (kappa.py reads its models, imported by path), whose registry reads
  # core's monitoring periods and per-window delta, and the H200 servers' cards
  "benchmarks/slowdown/slowdown/instances.py",
  "benchmarks/slowdown/slowdown/params.py",
  "benchmarks/slowdown/data",
  "verity/device.py",
  "calibration/hardware/cards/h200-sxm-141gb.toml",
  "calibration/hardware/cards/dgx-h200.toml",
  "verity/__init__.py",
  "verity/errors.py",
  "verity/protocol.py",
  "verity/channel.py",
  "verity/protocols/proofs/spot/verifier/profile.py",
          "adapters/vllm/verity_vllm/definitions/__init__.py", "verity/protocols/__init__.py",
          "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/compute/__init__.py",
          "verity/protocols/workload_classification/__init__.py", "verity/protocols/workload_classification/training_detection/__init__.py", "verity/circuits/ops/__init__.py",
          "verity/protocols/workload_classification/training_detection/inference_only/__init__.py", "verity/protocols/resource_accounting/compute/pouw/__init__.py",
          "verity/protocols/proofs/spot/__init__.py", "verity/circuits/ops/boolean/__init__.py",
          "benchmarks/slowdown/__init__.py", "verity/protocols/resource_accounting/compute/pouw/prover/__init__.py",
          "verity/protocols/proofs/spot/verifier/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/prover/circuit/__init__.py", "benchmarks/nci"]
