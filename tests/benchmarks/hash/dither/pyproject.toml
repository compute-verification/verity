# Dither's harness. Not a package: its launchers and benches run on GPU hosts, per their headers; dbw.py's calibration
# beside serving and its report run here as a suite on a fake side.
[tool.pytest.ini_options]
testpaths = ["."]

[tool.verity.tests]
# The modules read their variables through this directory's registry (settings.py), on verity_config.settings.
inputs = ["tools/config/verity_config", "verity", "benchmarks/hash/dither"]
