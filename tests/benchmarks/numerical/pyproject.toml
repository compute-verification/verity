# The suite of the distribution `verity-numerical`: a virtual member that depends on it, so the suite keys on what the
# distribution's dependents read, and `tools/check/suites.py` names it as the distribution.
[project]
name = "verity-numerical-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["verity-numerical"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the bench spine's tests drive Flock's lowerings over the repository's fixtures and census; test_unit_costs_menu.py
# holds the Lean menu (VStar.Menu.Pinned) to the pinned menu.json it is generated from; test_census_data.py reads each census
# workload's regression expectations, most of them fetched fixtures.
inputs = ["verity/protocols/proofs/flock/verifier/VStar/Menu/Pinned.lean", "verity/protocols/proofs/flock/prover", "verity/protocols/proofs/flock/prover/pod", "verity/protocols/proofs/flock/prover/agreement", "verity/protocols/proofs/flock/prover/tool.py", "benchmarks/census",
          "tests/adapters/vllm/tests/regression/expected",
          "tests/adapters/vllm/tests/__init__.py", "tests/adapters/vllm/tests/regression/__init__.py"]
parallel = true
