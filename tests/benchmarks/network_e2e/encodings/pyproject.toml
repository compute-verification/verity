# The advice's encodings (network attestation for arbitrary vLLM usage). `derived.py`: the fields of advice v0 (I1) that
# cost zero bits, the residual that remains and its bits per attester window; `cache_vectors.py`: the attester's
# CacheStep_v1 against derived's prefix rules, and its difftest vectors; `replay_input.py`: a step trace or a
# derived-format one as the replay's input; `arith_vectors.py`:
# network attestation's arithmetic encoder against code.py, v1 and code_v1; `sched_trace.py`: step traces from
# vLLM's own scheduler, which the tests read as fixtures (it needs vLLM).
# Those fixtures (`tests/fixtures/`; `tests/fixtures_draft/`, `vllm_trace.py`'s with a draft) and the attester's
# vectors these modules write are fetched fixtures (`artifacts.json`), which `suites.py` fetches before the
# suites that read them; one a module rewrote is registered there again. Not a package: the modules load by path (the directory's name shadows the stdlib's
# `encodings`), and they run here as a suite (`uv run tools/check/suites.py benchmarks/network_e2e/encodings`).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# derived.py builds and charges advice v0 with network attestation's I1
# (verity_vllm.pipeline.advice_code.format), which reads the package inits on the way;
# cache_vectors.py runs network attestation's CacheStep_v1 (`cache_step`, through `head_check` and the circuits it
# imports) and writes network attestation's difftest vectors, which a test reads back; test_arith_vectors holds
# network attestation's arith_encode vectors to what this directory's coders code now.
inputs = ["verity/__init__.py", "verity/errors.py", 
          "verity/protocols/resource_accounting/network", 
          "verity/protocols/resource_accounting/network/prover", "verity/circuits", "verity/commitments",
          "verity/commitments/crypto",
          # test_v1 runs network attestation's replay chain (`replay_chain`) over v1's windows, which imports
          # SPOT's produced and registered row helpers
          "verity/protocols/proofs/spot/verifier/__init__.py",
          "verity/protocols/proofs/spot/verifier/one_stage/__init__.py",
          "verity/protocols/proofs/spot/verifier/one_stage/partition.py",
          "verity/protocols/proofs/spot/verifier/one_stage/produced.py",
          "verity/protocols/proofs/spot/verifier/one_stage/registered.py",
          "adapters/vllm/verity_vllm/errors.py",
          # test_tick serves the replay's scheduler behind the vLLM integration's certified-tick gate (`serve_admit`)
          "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/pipeline/__init__.py",
          "adapters/vllm/verity_vllm/pipeline/serve_admit.py", "adapters/vllm/verity_vllm/engine/__init__.py",
          "adapters/vllm/verity_vllm/engine/hooks.py",
          # the gate is the engine's admission (`verity_vllm.engine.admission`), with the engine driver, the runner's and
          # the scheduler's steps it imports and the messages it speaks, on network attestation's admission and its
          # scheme, which reads the scheme interface, the registry of schemes, SPOT's workload and the hook types
          "adapters/vllm/verity_vllm/engine/admission.py", "adapters/vllm/verity_vllm/engine/engine_driver.py",
          "adapters/vllm/verity_vllm/engine/runner_step.py", "adapters/vllm/verity_vllm/engine/scheduler_step.py",
          "adapters/vllm/verity_vllm/messages.py", "verity/channel.py", "verity/hooks.py", "verity/protocol.py",
          "verity/protocols/resource_accounting/scheme.py", "verity/protocols/compose/__init__.py",
          "verity/protocols/compose/schemes.py", "verity/protocols/proofs/spot/prover/__init__.py",
          "verity/protocols/proofs/spot/prover/workload.py",
          # test_served_window compiles the served run's windows against the compile slice's fixtures
          "tests/adapters/vllm/tests/compiler/fixtures/compile_slice_w1.json",
          "tests/adapters/vllm/tests/compiler/fixtures/compile_slice_w1_class.json",
          "tests/adapters/vllm/tests/compiler/fixtures/compile_slice_w212.json",
          "tests/adapters/vllm/tests/compiler/fixtures/compile_slice_w212_class.json",
          "tests/adapters/vllm/tests/compiler/fixtures/compile_slice_w212_class_async.json",
          # test_arith_vectors' coders charge a window through the interface's charge circuits
          "verity/protocols/interface/__init__.py", "verity/protocols/interface/charge",
          # the replay, the derived rules, the coder and advice v1's codec are the vLLM integration's advice code, which
          # replay.py, derived.py, code.py, code_v1.py and v1.py import and re-export
          "adapters/vllm/verity_vllm/pipeline/advice_code",
          # the compile slice and its pieces, the vLLM integration's compiler, which the cache and replay vectors and their tests import
          "adapters/vllm/verity_vllm/compiler",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/proofs/spot/__init__.py",
          "adapters/vllm/verity_vllm/definitions/__init__.py", "verity/circuits/boolean/memcheck.py", "verity/commitments/gates/block_key.py",
          # network attestation's `head_check` counts a Definition's ANDs with the census
          # (`census.BooleanWork`), and the advice code's codec imports it (`window_code`, network
          # attestation's `window_charge`, `arith_encode`):
          # test_arith_vectors, the first test to load v1.py, reads it
          "verity/circuits/census.py", "benchmarks/network_e2e/encodings"]
