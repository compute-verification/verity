# `verity bench attester_load` (`run.py`). Not a package: its schedule, its guard and what it writes for a fixed arm
# (`uv run tools/check/suites.py benchmarks/attester_load`).
[tool.pytest.ini_options]
testpaths = ["."]

[tool.verity.tests]
# The tests read the scan class's schedule from `scan_zk.py` in process and write a fixed arm's result through the
# harness kit's writer, which reads its settings through verity_config.
inputs = ["benchmarks/attester_load", "verity",
    "benchmarks/harness/verity_bench/__init__.py",
    "benchmarks/harness/verity_bench/kit.py",
    "benchmarks/harness/verity_bench/kit_report.py",
    "benchmarks/harness/verity_bench/settings.py",
    "tools/config"]
