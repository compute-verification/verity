          "adapters/vllm/verity_vllm/program/__init__.py", "adapters/vllm/verity_vllm/program/frontend/__init__.py",
          "adapters/torch/verity_torch/frontend/correspond.py",
          "adapters/vllm/verity_vllm/program/frontend/kernel_readback.py",
          "adapters/torch/verity_torch/frontend/provenance.py",
          "adapters/torch/verity_torch/frontend/errors.py",
          "adapters/torch/verity_torch/frontend/program_identity.py",
          "adapters/torch/verity_torch/frontend/strided_views.py",
          "adapters/torch/verity_torch/frontend/value_types.py",
          "tools/research/src/research/__init__.py", "tools/research/src/research/env.py", "tools/research/src/research/record.py",
          "tools/research/src/research/result.py", "tools/research/src/research/secret_hint.py",
          "tools/research/src/research/store", "adapters/vllm/verity_vllm/pipeline/private_names.json", "tools/research/src/research/telemetry",
          "security/Definitions/Pouw", "security/Proofs/Pouw", "security/Proofs/Properties/Pouw", "security/lean-audit.json",
          "security/Proofs/ResourceAccounting/Gates/Rows.lean",
          "benchmarks/pouw/exact_kit/exact_kit", "verity/protocols/accounting/compute/pouw/verifier/receipts", "benchmarks/pouw/filler", "verity/protocols/accounting/compute/pouw/prover/kernels/filler",
