          "verity/protocols/registration/verifier/registration.py", "verity/protocols/registration/verifier/site_log.py",
          "verity/protocols/accounting/memory/poub/__init__.py", "verity/device.py",
          "verity/channel.py", "adapters/vllm/verity_vllm/definitions",
