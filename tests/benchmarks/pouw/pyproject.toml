[project]
name = "verity-pouw-benchmarks"
version = "0.0.0"
description = "PoUW's benchmarks and their tests."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-difftest", "numpy", "blake3>=1.0", "scipy==1.18.1", "z3-solver>=4.13"]

[project.optional-dependencies]
# The team's run and store tool and the exact kit, which the suite's tests and the theory scripts use (Pearl-C's kernels
# need neither); the workspace installs both with every member.
research = ["research"]
exact-kit = ["verity-exact-kit"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
verity = { workspace = true }
research = { workspace = true }
verity-vllm = { workspace = true }
verity-difftest = { workspace = true }
verity-exact-kit = { workspace = true }

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_pearl_c_hash_decode.py",
    "test_pearl_c_hash_host.py",
    "test_pearl_c_hash_wide.py",
    "test_pearl_c_sm120.py",
    "test_pearl_c_sm90.py",
    "test_pearl_c_sm90_prefill.py",
    "test_pearl_c_vllm.py",
    "test_receipts_adopters.py",
    "test_salt_bind.py",
    "test_sass_census_dump.py",
    "test_served_zk.py",
    "test_theory_fold_wide3.py",
]
# test_lean_headline compares the headline instances' Lean data (security/Definitions/Pouw/Headline) with what
# lean_headline.py writes, and test_lean_headline_dc the data-centre ones' (security/Definitions/Pouw/HeadlineDc)
# with what lean_headline_dc.py writes, and each statement's ε literal in Models' HeadlineDc.lean against the export's
# ε/B_♭ pair.
# Test-only: test_hidden_zk_stage runs ../../../benchmarks/pouw/hidden_zk/stage.py, which stages through Flock's Python; ../../../benchmarks/pouw/harness/price_twins.py
# reads the lifted PoUW guarantees' sources (Definitions/Pouw/Guarantees) and Security's lock, and its
# `repository_names` every Lean file of the audit's trees' Pouw/ (Definitions, Proofs, Proofs/Properties), so those are
# inputs whole (test_ledger's reads entry below). Of `verity`, the
# difftest harness, vLLM's integration and `research`, what the
# tests import, in place of those trees; the Lean the served challenger's `lake build` reads is keyed by the binaries it
# builds (`artifacts`), and the C++ the tests compile is this suite's own but for the SHA-512 pearl_c/sha512.cuh includes
# (verity/commitments/cuda/sha512.cuh). verity/protocols/accounting/compute/pouw/verifier/receipts, filler and
# machine_model are suites of their own, which this suite's tests read (test_receipts_adopters, test_opcode_probe),
# so they're named here. The theory scripts (`theory/`) import the exact kit's package. test_contents reads the README,
# which holds no table (`contents.py` prints them).
# test_served_units_summarize runs served_units' summarize.py, which scores the hidden_zk controls its job.sh sources.
# pouw_h1 imports its table commits' module and pouw_h1_served its word encodings' module, each named at its path
# before and after vllm's layout move. bench_arm's live coins open their session through verity_vllm.pipeline.commit_coins.
# test_pearl_c_sm90_overhead_arm reads the overhead door's schemes and linears (verity_bench's overhead.py), which name
# pearl_c_sm90's arm, and the kernel scheme Pearl+ declares on a card (verity_bench's schemes.py, over the declarations).
# test_proved_ticks_placed places PoUW's compiled Program on a block of the datacenter model (benchmarks/datacenter's
# package, on pytest's `pythonpath`), with what that package imports of core: the registration log (registration.py, over
# site and wire) and PoUB's block size (its codec.py); its census imports the Boolean versions' lookup
# (verity_vllm.definitions' boolean.py), which loads no registry module for a Program already Boolean.
# test_pearl_c_vllm holds a Pearl+ answer's named assumption to its def in Definitions/Pouw/Assumptions/PearlC/TTOutRev1.lean
# and the H100's record of it in Proofs/Pouw/PearlC/Records.lean.
# test_pearl_c_sm90_grouped imports verity_torch.pouw's packages and its Pearl-C device run (run_device, lanes_device,
# served_y_device); hidden_zk's stage.py imports verity.protocols.experimental's package files above the modules named below.
# test_salt_bind's served window reads vLLM's registered Definitions (verity_vllm.definitions) whole.
inputs_only = true
inputs = ["verity/lean_process.py", "verity/__init__.py", "tools/config/verity_config/verity_settings.py", "verity/errors.py", 
          "verity/protocols/proof/spot/verifier/profile.py", "verity/protocols/accounting/compute/pouw/verifier", "verity/protocols/proof/spot",
          "verity/protocols/accounting/compute/pouw/prover", "verity/protocols/accounting/network/prover",
          "verity/protocols/accounting/network",
          "tools/difftest", "verity/circuits", "verity/commitments", "verity/commitments/crypto",
          "verity/circuits/kernels", "verity/commitments/randomness", "verity/protocols/proof/flock/prover/python", "verity/commitments/periods",
          "calibration/hardware/cards", "calibration/hardware/architectures",
          "tools/config/verity_config",
          "adapters/vllm/verity_vllm/settings.py", "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/config.py",
