          "verity/protocols/accounting/memory/poub/scheme.py", "verity/protocols/accounting/memory/poub/verifier",
          "verity/protocols/accounting/memory/pous",
          "verity/protocols/policy/__init__.py", "verity/protocols/policy/training_detection/__init__.py",
          "verity/protocols/policy/training_detection/inference_only/__init__.py",
          "verity/protocols/policy/training_detection/inference_only/scheme.py",
          "adapters/torch/verity_torch/pouw/pearl_plus_op.py", "adapters/vllm/verity_vllm/messages.py"]
parallel = true
worker_gb = 4
typical_worker_gb = 2
workers = 8
# one process: 2,100 s beside a loaded check, too near suites.py's SUITE_TIMEOUT_S
timeout_s = 7200
# check runs it as three parts by test id (`lean-suites:verity-pouw-benchmarks:K/3`, `suites.py`'s `id_part_of`), each
# collecting every file and running the tests whose node id hashes to K, so that ci.toml's plans spread it over three shards
parts = 3
# Build outputs the served challenger's checks of record run or skip on (`check` runs this suite after its Lean steps).
artifacts = ["verity/protocols/accounting/compute/pouw/verifier/lean/check/.lake/build/bin/pouw-verifier",
             "verity/protocols/accounting/compute/pouw/verifier/lean/check/.lake/build/bin/pouw-verifier-difftest",
             "verity/protocols/proof/spot/verifier/lean/.lake/build/bin/spot-difftest"]

[tool.pytest.ini_options]
testpaths = ["."]
# test_proved_ticks_placed imports `datacenter` (not an installed package) by path.
pythonpath = ["../../../benchmarks/datacenter"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_pearl_c_sm90_glm53.py"]
paths = ["benchmarks/pouw", "tools/config/verity_config", "verity"]

[[tool.verity.tests.reads]]
tests = ["test_ledger.py"]
paths = ["security/Definitions/Pouw", "security/Proofs/Pouw", "security/Proofs/Properties/Pouw"]

[[tool.verity.tests.reads]]
tests = ["test_facet_break.py"]
paths = ["calibration/machine_model/verity_machine_model", "calibration/pouw/opcode_probe"]

[[tool.verity.tests.reads]]
tests = ["test_pearl_c_sm120.py", "test_pearl_c_sm90.py"]
paths = ["tests/verity/protocols/accounting/compute/pouw/verifier", "verity/circuits/kernels"]

[[tool.verity.tests.reads]]
tests = ["test_pearl_c_sm90_grouped.py"]
paths = ["tests/verity/protocols/accounting/compute/pouw/verifier"]

[[tool.verity.tests.reads]]
tests = ["test_pearl_c_sm90_prefill.py"]
paths = ["benchmarks/pouw/pearl_c_sm120", "verity/protocols/accounting/compute/pouw/prover/kernels/pearl_c_sm120"]

[[tool.verity.tests.reads]]
tests = ["test_receipts_adopters.py"]
paths = ["benchmarks/pouw/filler", "verity/protocols/accounting/compute/pouw/prover/kernels/filler"]

[[tool.verity.tests.reads]]
tests = ["test_salt_bind.py"]
paths = ["tests/verity/protocols/accounting/compute/pouw/verifier/lean/check", "tests/verity/protocols/accounting/compute/pouw/verifier"]

[[tool.verity.tests.reads]]
tests = ["test_served_zk.py"]
paths = ["tests/verity/protocols/accounting/compute/pouw/verifier"]

[[tool.verity.tests.reads]]
tests = ["test_theory_cpw.py"]
paths = ["verity/protocols/accounting/compute/pouw/verifier", "verity/circuits", "verity/circuits/kernels"]
