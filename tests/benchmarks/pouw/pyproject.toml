          "adapters/vllm/verity_vllm/protocols/spot.py",
          "adapters/torch/verity_torch/pouw/pearl_c/whole_calls.py",
          "adapters/torch/verity_torch/__init__.py", "adapters/torch/verity_torch/pouw/__init__.py",
          "adapters/torch/verity_torch/pouw/pearl_c/__init__.py",
          "adapters/torch/verity_torch/pouw/pearl_c/lanes_device.py",
          "adapters/torch/verity_torch/pouw/pearl_c/run_device.py",
          "adapters/torch/verity_torch/pouw/pearl_c/served_y_device.py",
