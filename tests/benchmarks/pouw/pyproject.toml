          "verity/protocols/run/schemes.py", "verity/protocols/accounting/scheme.py",
          "verity/protocols/accounting/compute/pouw/scheme.py", "verity/hooks.py", "verity/protocol.py",
          # served_step.undeclared names every declared scheme with an option, so run.schemes.load imports each
          # declaration (test_pearl_c_vllm_run); Pearl+'s imports the adapters' pearl_plus_op and messages
