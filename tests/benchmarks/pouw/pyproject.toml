          "adapters/vllm/verity_vllm/protocols/interface.py",
          "verity/protocols/accounting/compute/pouw/prover/serving/device.py",
          "verity/protocols/accounting/compute/pouw/prover/serving/coins/challenger.py",
          "verity/protocols/accounting/compute/pouw/prover/serving/coins/sample.py",
          "adapters/torch/verity_torch/pouw/credit_gate_device.py",
          "adapters/torch/verity_torch/pouw/row_table_device.py",
          "verity/protocols/accounting/compute/pouw/prover/serving/coins/requests.py",
          "verity/protocols/accounting/compute/pouw/prover/serving/coins/window.py",
          "adapters/torch/verity_torch/pouw/pearl_c/passes.py",
          "verity/protocols/accounting/compute/pouw/prover/serving/pearl_c/__init__.py",
          "adapters/torch/verity_torch/pouw/pearl_c/graphs.py",
          "adapters/torch/verity_torch/pouw/pearl_c/grouped.py",
          "adapters/torch/verity_torch/pouw/pearl_c/host.py",
