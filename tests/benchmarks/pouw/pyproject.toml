          "adapters/vllm/verity_vllm/pipeline/__init__.py", "adapters/vllm/verity_vllm/pipeline/commit_coins.py",
          "verity/commitments/periods/rows.py", "adapters/vllm/verity_vllm/errors.py",
          "adapters/vllm/verity_vllm/engine", "adapters/vllm/verity_vllm/protocols/linear",
          "adapters/vllm/verity_vllm/protocols/__init__.py",
