# The DRAM-free filler beside the decode step: its kernels (dcap.cu, pfill.cuh and flin.cuh, in PoUW's prover, and
# ../../../../benchmarks/pouw/filler/comm/tpcomm.cu) run on a GPU node through research run; the scorer, the arms and the kernels' host references run here
# as a suite
# (`uv run tools/check/suites.py benchmarks/pouw/filler`).
[tool.pytest.ini_options]
testpaths = ["."]
# the directory's modules and the harness's ledger, which the tests import by name; no name is in both
pythonpath = ["../../../../benchmarks/pouw/filler", "../../../../benchmarks/pouw/harness"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The scorer refuses an arm whose record the attempt ledger (harness/ledger.py) or the evidence store's canonical form, ids
# and manifest model would refuse (arms.record_problems), so the tests import both; the ledger takes its variant record's
# schema from verity.protocols.resource_accounting.compute.pouw.verifier.serving, which it imports outright. pfill.cuh and pfill_ref.py take
# their folds, key rules and lane starts from the receipts reference. capacity_of.py reads its σ through machine_model's
# capacity over its data's Π. The ledger reads its variables through PoUW's benchmarks' registry (benchmarks/pouw/settings.py).
inputs = ["benchmarks/pouw/harness", "verity/protocols/resource_accounting/compute/pouw/prover/kernels/filler", "benchmarks/pouw/settings.py", "tools/config/verity_config",
          "verity/protocols/resource_accounting/compute/pouw/verifier/receipts", "benchmarks/machine_model/verity_machine_model",
          "benchmarks/machine_model/data", "tools/research/src/research/__init__.py",
          "tools/research/src/research/store", "verity/__init__.py", "tools/config/verity_config/verity_settings.py", 
          "verity/protocols/resource_accounting/compute/pouw/verifier/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/serving.py",
          # serving.py takes its tags from the table of domain separators, verity.commitments.domains
          "verity/errors.py", "verity/commitments", "verity/commitments/crypto",
          # the tests' g++ builds of pfill.cuh include its SHA-512, pearl_c/sha512.cuh, which includes sha512_rows' sha512x.cuh
          "verity/protocols/resource_accounting/compute/pouw/prover/kernels/pearl_c/sha512.cuh", "verity/commitments/cuda/sha512.cuh",
          "adapters/vllm/verity_vllm/definitions/__init__.py", "verity/protocols/__init__.py",
          "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/compute/__init__.py", "verity/circuits/kernels/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/__init__.py", "benchmarks/pouw/filler"]
