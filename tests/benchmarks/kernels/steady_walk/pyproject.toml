[tool.pytest.ini_options]
testpaths = ["."]

[tool.verity.tests]
# test_steady_walk writes steady_walk.py's result through the harness kit's writer, its member's card from the card files,
# and reads the spec pairs it compares.
inputs = ["benchmarks/kernels/steady_walk.py", "benchmarks/kernels/metrics.toml",
          "benchmarks/harness/specs/glm53-flock-steady-head-block.toml",
          "benchmarks/harness/specs/glm53-flock-steady-head-block-walk.toml",
          "benchmarks/harness/specs/llama32-1b-flock-steady-gemm.toml",
          "benchmarks/harness/specs/llama32-1b-flock-steady-gemm-walk.toml",
          "benchmarks/kernels/wide_leaf/statement.toml",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/overhead.py",
          "benchmarks/harness/verity_bench/settings.py", "calibration/hardware/cards", "tools/config/verity_config",
          "verity/__init__.py", "verity/channel.py", "verity/device.py", "verity/errors.py"]
