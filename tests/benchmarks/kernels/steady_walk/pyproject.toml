[tool.pytest.ini_options]
testpaths = ["."]

[tool.verity.tests]
# test_steady_walk writes steady_walk.py's result through the harness kit's writer and reads the two specs it compares.
inputs = ["benchmarks/kernels/steady_walk.py", "benchmarks/kernels/metrics.toml",
          "benchmarks/harness/specs/glm53-flock-steady-head-block-h200.toml",
          "benchmarks/harness/specs/glm53-flock-steady-head-block-h200-walk.toml",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "tools/config/verity_config", "verity/__init__.py", "verity/errors.py"]
