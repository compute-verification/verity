# The exact W8A8 linear at the large model's shapes on the H200 (s8_wgmma.cu), sm_120 (int8_fused) and any card (int_mm.py).
# Not a package: the scripts run on a GPU node (run.sh) and the kernel builds on a CPU node (build.sh); the CPU twin of
# ScaledMmS8Coordinate_v1 they check against (fixture.py), int_mm.py's eager linear and PTX audit, wgmma.py's host side and
# the SASS gate run here as a suite (`uv run tools/check/suites.py benchmarks/kernels/s8_linear`), the twin held
# to the Definition's evaluator.
[tool.pytest.ini_options]
testpaths = ["."]

[tool.verity.tests]
# tests/ evaluate the Definition (verity.circuits, which imports no other unit) and the twin's bf16 cast (verity.circuits.kernels.tc);
# wgmma.py reads its variables through settings.py, on verity_config.settings; the SASS gate is the harness's build gate;
# a call to wgmma.py naming no SM count reads the H200's from its card through verity.device.
inputs = ["verity/__init__.py", "tools/config/verity_config/verity_settings.py", "verity/errors.py", "verity/circuits",
          "verity/device.py", "verity/channel.py", "hardware/cards/h200-sxm-141gb.toml",
          "verity/circuits/kernels/__init__.py", "verity/circuits/kernels/tc.py", "tools/config/verity_config",
          "verity/protocols/resource_accounting/compute/pouw/prover/sass_gate.py", "benchmarks/kernels/ship_nvcc.sh",
          "benchmarks/kernels/ship_probe.sh", "benchmarks/kernels/job_nvcc.sh", "benchmarks/kernels/ship.sh",
          "benchmarks/kernels/ship_clock.c", "adapters/vllm/verity_vllm/definitions/__init__.py", "verity/circuits/ops",
          "verity/circuits/silicon", "benchmarks/kernels/s8_linear"]
