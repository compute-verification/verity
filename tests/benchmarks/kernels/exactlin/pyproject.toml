# The int8-exact linear's benches. Not a package: its benches run on GPU hosts, per their headers, on the integration's
# kernels (verity_vllm.engine.int8_fused).
[tool.pytest.ini_options]
testpaths = ["."]

[tool.verity.tests]
# test_kbench_record writes kbench.py's result through the harness kit's writer, its member's card from the card files.
inputs = ["adapters/vllm/verity_vllm/engine/int8_fused.py", "benchmarks/kernels/exactlin",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/overhead.py",
          "benchmarks/harness/verity_bench/settings.py", "calibration/hardware/cards", "tools/config/verity_config", "verity/__init__.py",
          "verity/channel.py", "verity/device.py", "verity/errors.py"]
