# The wide level-0 leaf's bench. Not a package: run.sh runs on a GPU node, per its header. The suite holds wleaf.py's
# result: what it writes through the harness kit's writer from the steps' verdicts, its member's card from the card
# files; and its lease's refusal of a card off the NUMA node of the run's CPUs.
[tool.pytest.ini_options]
testpaths = ["."]

[tool.verity.tests]
inputs = ["benchmarks/kernels/wide_leaf",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/overhead.py",
          "benchmarks/harness/verity_bench/settings.py", "benchmarks/harness/verity_bench/metric_versions.py", "benchmarks/harness/verity_bench/metric_versions.json", "benchmarks/harness/verity_bench/steady_cards.py", "calibration/hardware/cards",
          "tools/config/verity_config", "verity/__init__.py", "verity/channel.py", "verity/device.py", "verity/errors.py"]
