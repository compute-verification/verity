# The perplexity bench for interventions on matmuls (README.md). Not a package: `run.py eval` runs on a GPU node
# (`job.sh`, through `run.py submit`), and its methodology, specs, gates and engine run here on a tiny model as a suite
# (`uv run tools/check/suites.py benchmarks/ppl`). Needs torch and numpy (the workspace's torch-cpu extra).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../benchmarks/ppl"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests read this directory: its modules, specs/, datasets.json, windows.lock.json and baseline.json, and its
# README (the plugin example runs as written, and the README holds no table: `run.py tables` prints them); the compute
# benchmark's load (the model it serves); and the kit, which `run.py metrics` reports through.
inputs = ["benchmarks/ppl/README.md", "benchmarks/ppl", "benchmarks/compute/load.toml",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "tools/config/verity_config", "verity/__init__.py"]
