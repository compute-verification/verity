# `verity bench compute` (`run.py`): the share of a served model's MACs that Pearl+ credits over the tokens a served run
# served, read from the verifier's side of the run's record. Not a package: the suite holds the printer and the model's
# MAC count to the small record under tests/fixtures, with a stand-in for the evidence store, so nothing is fetched in
# it (`uv run tools/check/suites.py benchmarks/compute`).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../benchmarks/compute"]

[tool.verity.tests]
# run.py reads the run's output directory through verity_config's SHARED registry, which is built on tools/config/verity_config/verity_settings.py
inputs = ["tools/config/verity_config", "verity/__init__.py", "tools/config/verity_config/verity_settings.py",
          # the shared result: the kit's writer, and capacity from the registered hardware's Site and card files
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py", "benchmarks/harness/verity_bench/kit_report.py",
          "benchmarks/harness/verity_bench/settings.py", "calibration/hardware/cards",
          # the useful-work scheme by its registered name: the registry, the hooks it checks, and the packages that register
          "benchmarks/harness/verity_bench/schemes.py", "verity/hooks.py", "verity/protocols/__init__.py",
          "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/scheme.py",
          "verity/protocols/resource_accounting/compute/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/scheme.py", "verity/protocols/experimental/__init__.py",
          "verity/protocols/experimental/dither/__init__.py", "verity/protocols/experimental/dither/scheme.py",
          "verity/device.py", "verity/errors.py", "verity/runtime/__init__.py",
          "verity/channel.py", "verity/runtime/handshake.py", "verity/runtime/framing.py", "verity/party.py",
          "tests/verity/tests/test_channel.py", "benchmarks/compute"]

#  refuses a name no compute scheme is declared under by loading every declaration to name them
# (): test_compute.py's refusal reads every declared scheme's package as it imports
[[tool.verity.tests.reads]]
tests = ["test_compute.py"]
paths = [
    "verity/circuits/__init__.py",
