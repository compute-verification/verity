    "adapters/vllm/verity_vllm/pipeline/boundary_stop.py",
    "adapters/vllm/verity_vllm/pipeline/boundary_tables.py",
    "adapters/vllm/verity_vllm/pipeline/boundary_windows.py",
    "adapters/vllm/verity_vllm/records",
    "tools/config/verity_config",
    "verity/__init__.py",
    "tools/config/verity_config/verity_settings.py",
    "adapters/vllm/verity_vllm/__init__.py",
    "adapters/vllm/verity_vllm/engine/__init__.py",
    "adapters/vllm/verity_vllm/engine/handle.py",
    # a stand-in's checkpoint directory (`standin`): the adapter's cut of the model's registered config
