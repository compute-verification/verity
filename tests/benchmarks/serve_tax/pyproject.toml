# The serve tax (README.md). Not a package: its runs use a node's pinned vLLM venv; the suite tests the metrics and the
# table on synthetic client records, the plugin's changes on a stand-in scheduler, the replay's window and comparison
# and the restore's on a synthetic arm, and the boundary state's capture and restore and the rebuild's bookkeeping on
# stand-ins for vLLM's engine core, stdlib only but for the tests of arrays, which skip without numpy.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# a test file that starts a program the read guard can't trace (bash, around run.sh): keyed on the suite's whole tree
untraced = ["test_serve_tax.py", "test_profile.py"]
# `servetax_plugin` on a stand-in scheduler (tests/test_plugin.py): the integration's step trace and release order, and
# the modules they import; the driver and the replay read the run's id and paths through verity_config's SHARED settings;
# an arm names another benchmark's vLLM plugin by its file in this tree, which the driver's test checks is there; the
# serving cost is the benchmark kit's paired ratio, and its result.json the kit's writer's; the client's shim to the
# network certifier (cell_shim, tests/test_cell_shim.py) is run against the network attester itself on a
# virtual clock, whose package imports the circuit language, the commitments and SPOT's verifier; the arm
# behind the network attester names the network attester's program by its file in this tree, which its test (tests/test_certified.py,
# both sides on stand-ins for the processes they start) checks is there
inputs = ["benchmarks/serve_tax", "benchmarks/production.toml", "verity/errors.py",
    "verity/circuits",
    "verity/commitments",
    # the record entry (`Record`): SPOT's challenger imports it, and the network attester's `active` imports SPOT's verifier
    "verity/channel.py",
    "verity/protocols/__init__.py",
    "verity/protocols/resource_accounting/__init__.py",
    "verity/protocols/resource_accounting/network",
    "verity/protocols/proofs/__init__.py",
    "verity/protocols/proofs/spot",
    "benchmarks/dsa_topk/dsa_topk.py",
    "verity/protocols/resource_accounting/network/attester/network_attester_serve.py",
    "benchmarks/harness/verity_bench/__init__.py",
    "benchmarks/harness/verity_bench/nsys.py",
    "benchmarks/harness/verity_bench/overhead.py",
    # overhead.paired calls the kit's, which reads its settings
    "benchmarks/harness/verity_bench/kit.py",
    "benchmarks/harness/verity_bench/kit_report.py",
    "benchmarks/harness/verity_bench/settings.py",
    "benchmarks/harness/verity_bench/overhead_node.py",
    # a profile's job (tests/test_profile.py): the profiles' reader, and the code whose refusals a profile's result
    # quotes, the boundary commitment's and the modules it imports
    "benchmarks/harness/verity_bench/profiles.py",
    # --feature's scheme by name (`serve_tax.feature`): the kit's reader of the schemes' table, the table, and the
    # schemes it registers
    "benchmarks/harness/verity_bench/schemes.py",
    "verity/protocols/resource_accounting/scheme.py",
    "verity/protocols/experimental/__init__.py",
    "verity/protocols/experimental/dither/__init__.py",
    "verity/protocols/experimental/dither/scheme.py",
    "verity/protocols/resource_accounting/compute/pouw/scheme.py",
    "verity/protocols/resource_accounting/compute/pouw/prover/schemes/__init__.py",
    "verity/protocols/resource_accounting/compute/pouw/verifier/__init__.py",
    "verity/protocols/resource_accounting/compute/pouw/verifier/kernel_schemes.py",
    "verity/protocols/resource_accounting/compute/pouw/verifier/protocol.py",
    "adapters/vllm/verity_vllm/commit/__init__.py",
    "adapters/vllm/verity_vllm/commit/history_tables.py",
    "adapters/vllm/verity_vllm/engine/sampler_capture.py",
    "adapters/vllm/verity_vllm/pipeline/boundary_logits.py",
