# PoUS's benchmarks and their tests. Not a package: the drivers run on a GPU pod (torch/Triton), their CPU reference
# invariants run here as a suite (`uv run tools/check/suites.py benchmarks/pous`), so `check` keeps them pinned.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_pous_harness.py",
    "test_pous_onsite_cases.py",
    "test_pous_p2_bandwidth.py",
    "test_pous_p2v1.py",
    "test_pous_served_case.py",
    "test_pous_served_piece_sh.py",
    "test_pous_served_wipe.py",
]
# tests/ checks the harness against PoUS itself (verity.protocols.resource_accounting.memory.pous.verifier) and the census's hardware ids;
# pod.sh runs bench/placement.py's deployment gate (GATE_ROLE). Of `verity`, what the tests import, and what the `lake` they
# run and the Lean programs they start (pous-timed-audit, memory-challenger-verdict) read, which no tracer sees: those
# packages and their path dependencies (each lakefile's `[[require]]`).
inputs = ["verity/protocols/proofs/spot/verifier/challenger/coins.py", "verity/protocols/proofs/spot/verifier/one_stage/link_points.py",
          "verity/__init__.py", "verity/errors.py", "verity/ports.py", "verity/protocols/resource_accounting/memory/pous",
          # served_piece.py reads PoUS's declaration through the schemes' one table
          "verity/protocols/compose/__init__.py", "verity/protocols/compose/schemes.py",
          # and attaches it on the adapter's exchange; the case's tests load SPOT's prover and the table's poub declaration
          "adapters/vllm/verity_vllm/messages.py", "verity/protocols/proofs/spot/prover/__init__.py",
          "verity/protocols/proofs/spot/prover/workload.py", "verity/protocols/resource_accounting/memory/poub/scheme.py",
          "verity/protocols/interface", "verity/protocols/resource_accounting/memory/pous/prover",
          "verity/protocols/proofs/flock/verifier", "verity/commitments/identity", "verity/commitments/randomness",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "verity/commitments/lms", "tools/difftest", "verity/protocols/resource_accounting/memory/pous/attester",
          "verity/commitments", "verity/commitments/crypto",
          "verity/commitments/randomness",
          "calibration/census/hardware.json", "benchmarks/numerical/python/verity_numerical/bench/placement.py",
          # PoUB over the P2 store, which ../../../benchmarks/pous/p2_v1/serve.py runs, and what it imports; its party's
          # Lean verifier, `poub-verifier`, which `p2_parties` has `lake` build in poub/lean
          "verity/protocols/resource_accounting/memory/poub/verifier", "verity/protocols/proofs/spot/verifier/profile.py",
          "verity/protocols/resource_accounting/memory/poub/prover/__init__.py", "verity/protocols/resource_accounting/memory/poub/prover/audit_prover.py",
          "verity/protocols/resource_accounting/memory/poub/prover/p2_prover.py", "verity/protocols/resource_accounting/memory/poub/prover/p2_party_prover.py",
          "verity/protocols/proofs/spot/verifier/__init__.py", "verity/protocols/proofs/spot/verifier/challenger/challenger.py",
          "verity/protocols/proofs/spot/verifier/challenger/remote.py", "verity/circuits",
          # PoUB's poub/prover/p2_stage/bandwidth.py serves the store through the staging decode, whose modules it imports;
          # test_pous_p2_bandwidth.py loads it and runs it as a script
          # block_record.py (test_pous_served_piece.py, test_pous_served_case.py load it) derives the record's subprotocols
          # from the onsite application, so it loads each scheme the application lists by its declaration
          "applications/onsite_full.toml", "verity/protocols/proofs/spot/scheme.py", "verity/protocols/proofs/spot/verifier/parties.py",
          "verity/protocols/resource_accounting/network",
          "verity/protocols/workload_classification/__init__.py", "verity/protocols/workload_classification/training_detection/__init__.py",
          "verity/protocols/workload_classification/training_detection/inference_only/__init__.py", "verity/protocols/workload_classification/training_detection/inference_only/scheme.py",
          "verity/protocols/resource_accounting/memory/poub/prover/p2_stage/__init__.py",
          "verity/protocols/resource_accounting/memory/poub/prover/p2_stage/bandwidth.py",
          "verity/protocols/resource_accounting/memory/poub/prover/p2_stage/layout.py", "verity/protocols/resource_accounting/memory/poub/prover/p2_stage/stage.py",
          # the weight store's placement reads the committed configurations' hashes (`period.deployment`,
          # `memory_attester.COMMITTED`), which say whether trusted-device's premise holds
          "tools/verity/cli/verity_cli/configurations.toml",
          # served_piece.py holds the served weights as C* through the vLLM adapter, which imports these
          "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/config.py",
          "adapters/vllm/verity_vllm/settings.py", "tools/config/verity_config/verity_settings.py", "adapters/vllm/verity_vllm/records/__init__.py",
          "adapters/vllm/verity_vllm/records/fields.py", "adapters/vllm/verity_vllm/records/workload.py",
          "adapters/vllm/verity_vllm/protocols/__init__.py", "adapters/vllm/verity_vllm/protocols/interface.py",
          "adapters/vllm/verity_vllm/engine/__init__.py",
          "adapters/vllm/verity_vllm/engine/hooks.py", "verity/hooks.py", "adapters/vllm/verity_vllm/errors.py",
          "adapters/vllm/verity_vllm/records/schema_ids.py",
          # the adapter's pous.py reads its option from PoUS's declaration (memory/pous/scheme.py), which imports these
          "verity/hooks.py", "verity/protocols/resource_accounting/scheme.py",
          # its test reads the answer back as the composed run does: its row (and the core answer's decoder, with what
          # that module imports) and the block record's subprotocol
          "benchmarks/one_stage/served_verdicts.py", "benchmarks/one_stage/interfaces/verity_e2e_demo/block_record.py",
          "calibration/census/deployments.json",
          "verity/protocols/resource_accounting/compute/pouw/verifier/__init__.py", "verity/protocols/resource_accounting/compute/pouw/verifier/audit.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/coins.py", "verity/protocols/resource_accounting/compute/pouw/verifier/core_check.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/verifier.py",
          "verity/protocols/proofs/spot/verifier/one_stage/docket.py",
          # served_piece.py reads the bandwidth session's rate by the kit's reader of a card's file (`kit.datasheet_bandwidth`): ours to call
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "verity/device.py", "calibration/hardware/cards", "tools/config/verity_config",
          "verity/protocols/proofs/spot/verifier/one_stage/draw.py",
          "verity/protocols/proofs/spot/verifier/one_stage/verdict.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/protocol.py", "verity/protocols/resource_accounting/compute/pouw/verifier/salt.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/window.py", "verity/protocols/proofs/spot/verifier/one_stage/__init__.py",
          "verity/protocols/proofs/spot/verifier/one_stage/partition.py",
          "verity/protocols/proofs/spot/verifier/one_stage/registered.py",
          # the deployment layer and its wire, which the memory attester's and the wipe's sides are started through
          # (`verity.runtime.stream.Side`) and the challenger's parties run on
          "verity/config.py", "verity/party.py", "verity/protocol.py", "verity/runtime", "verity/channel.py", "tests/verity/tests/test_channel.py",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/compute/__init__.py", "verity/protocols/resource_accounting/memory/__init__.py", "verity/protocols/resource_accounting/memory/poub/__init__.py", "verity/protocols/proofs/spot/__init__.py", "verity/protocols/proofs/spot/verifier/challenger/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/__init__.py", "benchmarks/numerical/python/verity_numerical/__init__.py", "benchmarks/one_stage/interfaces/verity_e2e_demo/__init__.py", "benchmarks/numerical/python/verity_numerical/bench/__init__.py",
          # p2_store/store.py gives the store as the circuit requirement's `Store`, whose module reads the census
          "adapters/vllm/verity_vllm/definitions/__init__.py",
          "verity/circuits/census.py", "verity/circuits/requirement.py",
          # the P2 store's default weights generator (`p2_store/store.py`'s `GENERATOR`), which its test lays out and commits
          "verity/protocols/resource_accounting/memory/pous/prover/served_weights.py",
          # and the salt file its salts are read from
          "verity/commitments/salt_file.py",
          # the lease script served_piece.sh and served_wipe.sh take where a node has no gpu-lease: their tests check
          # that it is where the scripts look for it
          "tools/research/src/research/pods/sh/gpu_lease.sh", "benchmarks/pous"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_pous_wipe_resume.py"]
paths = ["verity/config.py", "verity/party.py", "verity/protocol.py", "verity/runtime", "verity/protocols/resource_accounting/memory/pous", "verity/channel.py", "tests/verity/tests/test_channel.py"]
