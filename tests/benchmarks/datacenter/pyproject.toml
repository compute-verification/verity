[project]
name = "verity-datacenter"
version = "0.1.0"
description = "A datacenter as Verity accounts for it: a Program, the hardware it runs on, the binding between them, and what the audits let us conclude."
requires-python = ">=3.12"
# The logical layer is verity.circuits' Program, and the commitments are verity.commitments'.
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datacenter"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../benchmarks/datacenter"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# examples.py reads the RTX PRO 6000 node's file and its cards through verity.device (load_node reads every card), and
# its figures through the session's sheets (which list every node file); the served circuits' Definitions
# (`verity_vllm.definitions`) its tests import, with the package they sit in
inputs = ["calibration/hardware/cards", "calibration/hardware/nodes", "calibration/hardware/architectures",
          "benchmarks/poub_session/sheets.py", "tests/verity/protocols/resource_accounting/memory/poub/figures.json", "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/definitions", "benchmarks/datacenter",
          # what loading the bandwidth audit's declaration reads, through which its codec is read (`scheme.part`)
          "verity/__init__.py", "verity/channel.py", "verity/circuits", "verity/commitments", "verity/device.py",
          "verity/errors.py", "verity/hooks.py", "verity/party.py", "verity/protocol.py",
          "verity/protocols/__init__.py", "verity/protocols/compose", "verity/protocols/proofs/__init__.py",
          "verity/protocols/proofs/spot/__init__.py", "verity/protocols/proofs/spot/verifier",
          "verity/protocols/registration/__init__.py", "verity/protocols/registration/verifier/__init__.py",
          "verity/protocols/registration/verifier/registration.py",
          "verity/protocols/registration/verifier/site_log.py", "verity/protocols/resource_accounting/__init__.py",
          "verity/protocols/resource_accounting/memory/__init__.py",
          "verity/protocols/resource_accounting/memory/poub/__init__.py",
          "verity/protocols/resource_accounting/memory/poub/scheme.py",
          "verity/protocols/resource_accounting/memory/poub/verifier",
          "verity/protocols/resource_accounting/memory/pous/__init__.py",
          "verity/protocols/resource_accounting/memory/pous/attester",
          "verity/protocols/resource_accounting/memory/pous/verifier",
          "verity/protocols/resource_accounting/scheme.py",
]
