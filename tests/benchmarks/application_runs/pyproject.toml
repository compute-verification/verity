# `benchmarks/application_runs/run.py`: one application run's verdicts that accept, of how many, and its minutes, written
# by the run that measures. Not a package: its tests run in the workspace environment, with `verity run` stood in for.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../benchmarks/application_runs"]

[tool.verity.tests]
inputs = ["benchmarks/application_runs",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          # the kit's settings, read through verity_config's registry
          "tools/config/verity_config", "verity/__init__.py"]
