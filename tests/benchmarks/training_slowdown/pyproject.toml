# Training's slowdown code (the `training_slowdown` package) and its suite. Not a distribution: the suite and its commands
# run from this directory.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../benchmarks/training_slowdown"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (bash, around the queued job's script; git, for the run's
# commit): keyed on the suite's whole tree
untraced = ["test_command.py", "test_grade.py", "test_job_shell.py", "test_repeats.py",
            "test_resume.py", "test_routes.py", "test_run.py", "test_sandbox.py", "test_windows.py"]
# `verity`: the circuits' Definitions the gate prices compile and the Boolean gather the counter's tests price; the lf
# model (`train_step_lf.py`), loaded by path, whose shapes the policy states; the slowdown calculator
# (`benchmarks/slowdown`), whose registry, fleets, periods and min-cut module (the bound and its rows
# of β(k)) `calculator.py` reads, and nothing else here does (tests/test_one_calculator.py); the inference-only
# policy's calibrations, which the calculator's registry loads from outside its directory; and the census's
# deployments, whose reference window `calculator.py` reads
# The command's and the config's: of that registry too, the [policy.*] tables, whose names are the policies a config
# may give (`config.py`); and `tools/config/verity_config`, the command's $OUT through its SHARED settings
# `benchmarks/training_slowdown/grader`: the suite nested here, whose sources tests/test_one_calculator.py holds to the
# one module that reaches the calculator with the rest of this directory. `adapters/torch/verity_torch`: the
# training-step frontend whose step test_program_reading reads as a Program, which `adapters/vllm/verity_vllm`
# imports; and
# `benchmarks/circuit_properties/circuit_properties`, the reading of a Program's work it holds beside a trace's. The
# library writes its metric into the run's result with the harness kit's writer (`benchmarks/harness/verity_bench`)
inputs = ["benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py", "benchmarks/harness/verity_bench/kit_report.py",
          "benchmarks/harness/verity_bench/settings.py",
          "verity", "adapters/vllm/verity_vllm", "adapters/torch/verity_torch",
          "tests/adapters/torch/tests/frontend/train_step_lf.py",
          "tests/adapters/vllm/tests/__init__.py", "tests/adapters/vllm/tests/program/__init__.py",
          "benchmarks/slowdown", "hardware/cards/h200-sxm-141gb.toml", "hardware/cards/dgx-h200.toml",
          "benchmarks/census/deployments.json",
          "benchmarks/nci/calibrations.json", "tools/config/verity_config",
          "benchmarks/training_slowdown/grader", "benchmarks/circuit_properties/circuit_properties", "adapters/torch", "benchmarks/training_slowdown"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_one_calculator.py"]
paths = ["benchmarks/training_slowdown"]
