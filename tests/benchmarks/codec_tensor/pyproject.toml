# The tensor-core wide-word codec's benchmark and its tests. Not a package: `wt.cu` and `bench.py` run on a GPU node,
# and the byte-exact reference with the kernel's tensor-core decomposition and lane-by-lane carries (`wide.py`)
# run here as a suite (`uv run tools/check/suites.py benchmarks/codec_tensor`), on PoUB's
# codec (`wide.py`'s field, keys and rounds).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test_sketching checks the sketches' arithmetic on the host (sketching.py, numpy and the stdlib modules it
# imports); test_sketch_receipt and test_redteam_impl the GEMM's and attention's blocks under the PoUB
# driver's receipts (and its commitments).
inputs = ["verity/protocols/resource_accounting/memory/poub/prover/codec_tensor/reader.py",
          "verity/protocols/resource_accounting/memory/poub/prover/codec_tensor/sketch_receipt.py",
          "verity/protocols/resource_accounting/memory/poub/prover/codec_tensor/sketching.py",
          "verity/protocols/resource_accounting/memory/poub/prover/codec_tensor/reader.cu",
          "verity/protocols/resource_accounting/memory/poub/prover/codec_tensor/sha512.cuh",
          "verity/protocols/resource_accounting/memory/poub/prover/word_codec/kv.py",
          "verity/protocols/resource_accounting/memory/poub/prover/word_codec/kv_bench.py", "benchmarks/word_codec/kv_exhaust.py",
          "benchmarks/word_codec/kv_twin.py",
          "verity/protocols/resource_accounting/memory/poub/prover/word_codec/cuda_lib.py",  # the loader bench.py's and kv_bench.py's kernels open through
          "verity/__init__.py", "verity/errors.py", 
          "verity/protocols/resource_accounting/memory/poub/verifier",
          "verity/protocols/proofs/spot/verifier/profile.py",  # with verity/circuits, what store.store_salt's audit import reads
          "verity/protocols/proofs/spot/verifier/__init__.py",
          "hardware/cards", "verity/device.py", "verity/channel.py",  # kv_bench.py reads the RTX PRO 6000's card
          "verity/protocols/proofs/spot/verifier/challenger/challenger.py", "verity/protocols/proofs/spot/verifier/challenger/remote.py",
          "verity/commitments/crypto",
          "verity/circuits", "verity/commitments", "verity/commitments/randomness",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/memory/__init__.py", "verity/protocols/resource_accounting/memory/poub/__init__.py", "verity/protocols/proofs/spot/__init__.py", "verity/protocols/proofs/spot/verifier/challenger/__init__.py", "benchmarks/codec_tensor"]
