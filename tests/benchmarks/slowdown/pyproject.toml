[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../benchmarks/slowdown"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Every estimate's status is read from the locks (../../../benchmarks/slowdown/slowdown/lean.py), and the tests check each cited Lean name is in one.
# test_min_cut pins ../../../benchmarks/slowdown/slowdown/min_cut.py to the min-cut bound's (alphaHE, shareF, workHEOn, and HE's,
# HEShared's and HECharged's conclusions). tests/test_hardware.py holds the locations to the census's devices and the
# world fleets to its adversary.
# The monitoring periods are core's reporting grid's (../../../benchmarks/slowdown/slowdown/params.py: `verity/protocol.py`, which imports the wire).
# The registry also reads the inference-only policy's calibrations (../../../benchmarks/slowdown/slowdown/params.py). It reads
# no census: data/ states the reference datacenter's machines and the world's active parameters, and
# tests/test_params.py and tests/test_hardware.py hold them to the census's deployments and adversary. The H200
# servers' memory and links are their cards' (../../../benchmarks/slowdown/slowdown/params.py CARDED, through the Site's reader, `verity.device`).
inputs = ["security/lean-audit.json", "security/Properties/lean-audit.json",
          "security/Definitions/Slowdown/Cut.lean", "security/Definitions/Slowdown/Guarantees/Cut.lean",
          "benchmarks/census/hardware.json", "benchmarks/census/adversary.json",
          "verity/__init__.py", "verity/errors.py", 
          "verity/protocol.py", "verity/channel.py", "verity/circuits",
          "benchmarks/census/deployments.json", "benchmarks/nci/calibrations.json",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/workload_classification/__init__.py", "verity/protocols/workload_classification/training_detection/__init__.py", "verity/protocols/proofs/spot/__init__.py", "verity/protocols/proofs/spot/verifier/__init__.py",
          "verity/protocols/workload_classification/training_detection/inference_only/__init__.py",
          "verity/device.py", "hardware/cards/h200-sxm-141gb.toml", "hardware/cards/dgx-h200.toml", "benchmarks/slowdown"]
