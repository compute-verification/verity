# p512 squaring rates and their tests. Not a package: the GPU forms (`sq.cu`, `sq.sh`) and the host's AVX-512 IFMA
# (`ifma.c`, `ifma.sh`) run on a GPU node, by name through `run.sh`; their CPU twins, the host build's gate,
# `sass_mix.py`, `gamma.py` and the runner's test run here as a suite
# (`uv run tools/check/suites.py benchmarks/rate_squaring`).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../benchmarks/rate_squaring"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_host_and_gamma.py", "test_run.py"]
# gamma.py reads the RTX PRO 6000 node's file and its cards through verity.device (load_node reads every card)
inputs = ["verity/__init__.py", "verity/device.py", "verity/channel.py", "verity/errors.py", "hardware/cards",
          "hardware/nodes/rtx-pro-6000-server-x8.toml", "benchmarks/rate_squaring",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "tools/config/verity_config", "verity/__init__.py", "verity/errors.py"]
