# The recursion profile (README.md): `job.sh`, which runs 85-rec-reprice.sh's steps on a node, and `rec_profile.py`, which
# reads the records they leave. Not a package: `run.py` is the runner `verity bench recursion` calls, stdlib only, and the
# suite reads records it writes itself.
[tool.pytest.ini_options]
testpaths = ["."]
# the suite imports the scripts beside it by their module names, as they import each other
pythonpath = ["../../../benchmarks/recursion_e2e"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# settings.py declares the job's variables in a verity_config `Registry` and checks them with its `check` (stdlib only);
# record.py writes the run's numbers through the harness kit (stdlib only with verity_config).
inputs = ["benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/settings.py",
          "benchmarks/harness/verity_bench/kit.py", "benchmarks/harness/verity_bench/kit_report.py", "tools/config/verity_config",
          "verity/errors.py", "verity/__init__.py", "tools/config/verity_config/verity_settings.py", "benchmarks/recursion_e2e"]
