# p512 squaring rates and their tests. Not a package: the GPU forms (`sq.cu`) and the host's AVX-512 IFMA
# (`ifma.c`) run on a GPU node, by name through `run.sh` (`verity calibrate rate_squaring sq|ifma`); their CPU twins, the host build's gate,
# `sass_mix.py`, `gamma.py` and the runner's test run here as a suite
# (`uv run tools/check/suites.py calibration/rate_squaring`).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../calibration/rate_squaring"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# gamma.py reads the RTX PRO 6000 node's file and its cards through verity.device (load_node reads every card)
inputs = ["verity/__init__.py", "verity/device.py", "verity/channel.py", "verity/errors.py", "calibration/hardware/cards",
          "calibration/hardware/nodes/rtx-pro-6000-server-x8.toml", "calibration/rate_squaring",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "tools/config/verity_config", "verity/__init__.py", "verity/errors.py"]
