# PoUB's device ceilings. Not a package: the probes (`chip.cu`, `write.cu`, `write_host.c`) run on a GPU node or a host,
# each a probe of the one runner, `run.sh` (`verity calibrate bandwidth chip|write_gpu|write_host`). The runner, the
# probes' results (`result.py`) and `chip_ur.py`'s rewrite of a cubin are tested here as a suite (`uv run tools/check/suites.py calibration/bandwidth`).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../calibration/bandwidth"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_run.py"]
inputs = ["calibration/bandwidth",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "tools/config/verity_config", "verity/__init__.py", "verity/errors.py"]

