# The tensor-duty sweep, the falsification test of its card's clock.tensor. Not a package: duty.cu and run.sh run on an
# sm_90a GPU under gpu-lease, and the suite holds summarize.py's verdicts (the card's tensor rate, and the FP32 add's
# time price beside the tensor pipe) on made-up points and the wgmma headers to their generator.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../calibration/tensor_duty"]

[tool.verity.tests]
# summarize.py finds its card and reads the bound from it with the Site's reader (`verity.device`, which imports
# `verity.errors` and the wire, `verity.channel`), over the harness kit's cards directory, and writes its metric with the
# kit's writer
# (`benchmarks/harness/verity_bench`: `kit` and its `settings`, which read `verity_config`).
inputs = ["verity/__init__.py", "verity/errors.py", "calibration/hardware/cards", "verity/device.py",
          "verity/channel.py", "calibration/tensor_duty",
          "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "tools/config/verity_config"]
