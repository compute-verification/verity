# The suite of the distribution `verity-machine-model`: a virtual member that depends on it, so the suite keys on what the
# distribution's dependents read, and `tools/check/suites.py` names it as the distribution.
[project]
name = "verity-machine-model-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["verity-machine-model"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../calibration/machine_model"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests read this directory (the package and data/) and the perplexity arms the designs name.
# data/ holds the SASS opcode tables `machine-model cover` holds a row for each of.
# They read the Lean sheets `machine-model sheet --lean` prints.
# θ reads the card files through the Site's readers (`verity.device`, which imports the wire, `verity.channel`), which
# the workspace environment brings; the opcode table reads them so too.
# run.py writes its metric with the harness kit's writer (`kit` and its `settings`, which read `verity_config`).
inputs = ["benchmarks/ppl/specs", "security/Definitions/Registration/Sheets",
          "verity/__init__.py", "verity/errors.py", "calibration/hardware/cards", "verity/device.py",
          "verity/channel.py", "benchmarks/harness/verity_bench/__init__.py", "benchmarks/harness/verity_bench/kit.py",
          "benchmarks/harness/verity_bench/kit_report.py", "benchmarks/harness/verity_bench/settings.py",
          "tools/config/verity_config"]
