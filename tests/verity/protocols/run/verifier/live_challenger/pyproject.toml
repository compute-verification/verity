# The proof system's challenger on its auditor device: `serve.py` over `verity.protocols.proof.spot.verifier.challenger.remote`, which
# `auditor.py` runs there as the auditor user, one session a window under its signed ledger (`run.sh`: a development
# session elsewhere). Not a package: the suite runs serve.py as a process over loopback with a test key, the Lean verifier's
# coins stubbed (`tests/stub_serve.py`).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../../.."]   # the repository root: its tests import others' as `tests.X`, the tests of X

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_auditor_load.py",
    "test_auditor_rt4.py",
    "test_auditor_network_attester.py",
    "test_coin_link.py",
    "test_serve.py",
]
# The load's verbs read and write the store with `verity/protocols/accounting/network/attester/load_relay.py`, which commits with the
# network attester's transfer rows and PoUS's P2 scheme. The rehearsal unit's RuntimeMaxSec bounds the gate's --minutes.
inputs = ["verity/lean_process.py", "verity/protocols/accounting/network/attester/load_relay.py", "verity/protocols/accounting/network", "verity/protocols/accounting/memory/pous",
          "verity/channel.py", "verity/release.py",
          "tools/research/src/research/pods/nebius/challenger/vy-certifier@.service",
          "verity/__init__.py", "verity/errors.py", 
          "verity/protocols/proof/spot/verifier/profile.py", "verity/protocols/proof/spot/verifier/__init__.py",
          "verity/protocols/proof/spot/verifier/challenger/challenger.py", "verity/protocols/proof/spot/verifier/challenger/coins.py",
          "verity/protocols/proof/spot/verifier/challenger/remote.py",
          # test_auditor_network_attester holds a network certifier run's published files to the network attester's manifest (its verifier's
          # `parties.py`), a deployment-layer party over SPOT's; test_auditor_network_attester_serve runs the network attester prover's
          # `scan_zk`, which proves through SPOT's service
          "verity/config.py", "verity/party.py", "verity/protocol.py",
          "verity/protocols/proof/spot/verifier/parties.py", "verity/protocols/proof/spot/verifier/service.py",
          "verity/protocols/proof/spot/verifier/consumers.py",
          "verity/protocols/proof/spot/verifier/window_place.py", "verity/protocols/proof/spot/verifier/levels.py",
          "verity/protocols/proof/spot/verifier/one_stage", "verity/circuits",
          "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness", "verity/protocols/accounting/compute/pouw/verifier",
          "verity/circuits/kernels/__init__.py", "verity/circuits/kernels/tc.py",
          "adapters/vllm/verity_vllm/definitions/__init__.py", "verity/protocols/__init__.py", "verity/protocols/proof/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/compute/__init__.py", "verity/protocols/accounting/memory/__init__.py", "verity/protocols/accounting/compute/pouw/__init__.py", "verity/protocols/proof/spot/__init__.py", "verity/protocols/proof/spot/verifier/challenger/__init__.py",
          "verity/protocols/accounting/compute/pouw/prover",
          # test-only: test_auditor_models builds its H1 Program through PoUW's prover circuits, which register with the
          # scheme interface (and it the hooks); scan_zk takes its port from verity.ports
          "verity/protocols/accounting/scheme.py", "verity/hooks.py", "verity/ports.py",
          "tests/verity/circuits/stand_in.py",
          "verity/protocols/run/__init__.py", "verity/protocols/run/verifier/__init__.py",
          "verity/circuits/ops/__init__.py", "verity/circuits/ops/fp32.py", "verity/circuits/ops/gemm.py", "verity/circuits/ops/ncp.py", "verity/circuits/ops/prims.py", "verity/circuits/ops/prims_evidence.json", "verity/circuits/ops/scalar.py", "verity/circuits/ops/sqrt.py", "verity/circuits/silicon/__init__.py", "verity/circuits/silicon/cast.py", "verity/circuits/silicon/errors.py", "verity/circuits/silicon/fp.py", "verity/circuits/silicon/fp32.py", "verity/circuits/silicon/fp4.py", "verity/circuits/silicon/instructions.py", "verity/circuits/silicon/instructions_evidence.json", "verity/circuits/silicon/integer.py", "verity/circuits/silicon/integer_evidence.json", "verity/circuits/silicon/models.py", "verity/circuits/silicon/models_evidence.json", "verity/circuits/silicon/term.py", "verity/circuits/silicon/total.py", "verity/circuits/silicon/total_fp8.py", "verity/circuits/silicon/total_fp8_evidence.json", "verity/circuits/ops/boolean/__init__.py", "verity/circuits/ops/boolean/cast.py", "verity/circuits/ops/boolean/elementwise.py", "verity/circuits/ops/boolean/gemm.py", "verity/circuits/ops/boolean/int8.py", "verity/circuits/ops/boolean/scalar.py", "verity/circuits/ops/boolean/softmax.py", "verity/circuits/ops/boolean/sqrt.py", "verity/protocols/run/verifier/live_challenger"]
