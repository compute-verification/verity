# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.verity.tests]
# PoUW's serving code (`serving/`), tested on the CPU or skipped without a GPU.
inputs = ["verity", "security", "tools/config/verity_config"]
parallel = true

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
