[project]
name = "verity-pouw-window-difftest"
version = "0.0.0"
description = "The difftest of `pouw_window` against `verity.protocols.accounting.compute.pouw.verifier.window`."
requires-python = ">=3.12"
dependencies = []

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_difftest.py", "test_known_rows.py", "test_lanes.py", "test_reg_file.py"]
# Test-only: the harness (`verity_difftest`, which the workspace installs, and the Lean `lake` builds through the path require);
# the Python held to the Lean: `window.py` (with the switch, `verifier.py`, and its pinned vectors), `h1zy.py`
# (`test_lanes.py`), and h1_lanes' known rows (`test_known_rows.py`: `benchmarks/pouw/h1_lanes/leaf.py` with
# `verity/protocols/accounting/compute/pouw/prover/lowering/h1unit.py`, which import most of PoUW's protocol and the proof system's one-stage modules,
# so both trees are named whole), with the core they import (the integrity profile, `verity.ml`'s circuits, commitments,
# crypto, randomness and kernels' tensor-core reference, and `verity.errors`), and Flock's Python (`verity_flock`),
# which lowers the statements whose input wires it holds `PouwWindow.Lanes` to; what `lake` reads through the path
# requires: PoUW's commitments (`pouw_commit`, in PoUW's tree), the proof system's Lean (`core_spot`) with the
# core protocol interface and the LMS verifier, core's identity and randomness, and Flock's verifier with its
# configuration.
inputs = ["verity/lean_process.py", "tools/difftest", "verity/__init__.py", 
          "verity/channel.py",
          "verity/protocols/accounting/compute/pouw/verifier", "verity/protocols/accounting/compute/pouw/prover",
          "verity/protocols/proof/spot/verifier/profile.py", "verity/protocols/proof/spot",
          "benchmarks/pouw/h1_lanes/leaf.py", "verity/protocols/accounting/compute/pouw/prover/lowering/h1unit.py",
          # leaf.py's H1 form (`h1_prove/h1form.py`) and the settings it reads them from
          "benchmarks/pouw/h1_prove/h1form.py", "benchmarks/pouw/settings.py", "tools/config/verity_config",
          "verity/circuits/kernels/__init__.py", "verity/circuits/kernels/tc.py", "verity/protocols/proof/flock/prover/python", "verity/commitments/periods",
          "verity/errors.py", "verity/circuits", "verity/commitments", "verity/commitments/crypto",
          "verity/commitments/randomness", "verity/commitments/identity", "verity/commitments/randomness",
          "verity/protocols/proof/spot/verifier/lean/lakefile.toml", "verity/protocols/proof/spot/verifier/lean/lake-manifest.json",
          "verity/protocols/proof/spot/verifier/lean/lean-toolchain", "verity/protocols/proof/spot/verifier/lean/Spot.lean",
          "verity/protocols/proof/spot/verifier/lean/Spot", "verity/protocols/interface",
          "verity/commitments/lms/lean/lakefile.toml", "verity/commitments/lms/lean/lake-manifest.json",
          "verity/commitments/lms/lean/lean-toolchain", "verity/commitments/lms/lean/Lms.lean",
          "verity/commitments/lms/lean/Lms",
          "verity/protocols/proof/flock/verifier/lakefile.toml", "verity/protocols/proof/flock/verifier/lake-manifest.json",
          "verity/protocols/proof/flock/verifier/lean-toolchain", "verity/protocols/proof/flock/verifier/Flock",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          # `test_lanes.py` holds `leaf_lanes.py`'s reads and known rows to `PouwWindow.Lanes`, with the proof system's
          # one-stage modules it imports
          "verity/protocols/accounting/compute/pouw/verifier/leaf_lanes.py", "verity/protocols/proof/spot/verifier/one_stage/__init__.py",
          "verity/protocols/proof/spot/verifier/one_stage/partition.py",
          "verity/protocols/proof/spot/verifier/one_stage/produced.py",
          "verity/protocols/proof/spot/verifier/one_stage/registered.py",
          # PoUW's prover reads the resource scheme's declarations (`prover/schemes`, `serving/pearl_c/window.py`)
          "verity/protocols/accounting/scheme.py", "verity/hooks.py",
          "verity/circuits/ops", "verity/circuits/silicon", "verity/protocols/__init__.py", "verity/protocols/proof/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/compute/__init__.py", "verity/protocols/accounting/compute/pouw/__init__.py",
          "adapters/vllm/verity_vllm/definitions/__init__.py"]
