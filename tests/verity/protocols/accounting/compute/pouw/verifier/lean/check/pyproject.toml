[project]
name = "verity-pouw-verifier-difftest"
version = "0.0.0"
description = "The difftest of `pouw_verifier` against `verity.protocols.accounting.compute.pouw.verifier.core_check`, `credit` and `period_check`."
requires-python = ">=3.12"
dependencies = []

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the harness (`verity_difftest`); the switch, `verifier.py`; the Python held to the Lean, `core_check.py`,
# `credit.py` and `period_check.py`, and what they import (`window.py`, `weights.py`, `coins.py`, `audit.py` and `protocol.py`, the proof system's challenger and
# one-stage's registered domains (`one_stage/registered.py` and the `partition.py` it imports), one-stage's proof
# verification (`one_stage/proofs.py`, its `verifier.py` and what that imports, with the integrity profile and the
# proof system), and what they import: `verity.ml`'s circuits codec, commitments, crypto and randomness, and `verity.errors`) with the packages
# above them; what `lake` reads through the path requires: the core protocol interface, the window's Lean and what it
# requires (PoUW's commitments, the proof system's Lean with the LMS verifier, core's identity and randomness, Flock's
# verifier with its configuration), and Pearl+'s Lean with the evaluator it requires. The leaf statements' files credit builds are `leaf_lanes.py`'s, with
# what it imports (PoUW's `circuit/` seeds, one-stage's `produced.py`, and the `verity.circuits.kernels` `tc.py` they reach).
inputs = ["verity/protocols/proof/spot/verifier/one_stage/lean_child.py", "verity/protocols/proof/spot/verifier/one_stage/settings.py", "verity/lean_process.py", "verity/protocols/proof/spot/verifier/one_stage/link_points.py", "verity/protocols/proof/spot/verifier/challenger/remote.py",
          "tools/difftest", "verity/__init__.py",
          "verity/channel.py",
          "verity/protocols/accounting/compute/pouw/verifier/__init__.py",
          "verity/protocols/accounting/compute/pouw/verifier/kernel_schemes.py",
          "verity/protocols/accounting/compute/pouw/verifier/window.py", "verity/protocols/accounting/compute/pouw/verifier/core_check.py",
          "verity/protocols/accounting/compute/pouw/verifier/period_check.py",
          "verity/protocols/accounting/compute/pouw/verifier/verifier.py", "verity/protocols/accounting/compute/pouw/verifier/salt.py",
          "verity/protocols/accounting/compute/pouw/verifier/credit.py", "verity/protocols/accounting/compute/pouw/verifier/weights.py",
          "verity/protocols/accounting/compute/pouw/verifier/coins.py", "verity/protocols/accounting/compute/pouw/verifier/audit.py",
          "verity/protocols/accounting/compute/pouw/verifier/protocol.py", "verity/commitments/randomness",
          "verity/protocols/proof/spot/verifier/__init__.py", "verity/protocols/proof/spot/verifier/challenger/challenger.py",
          "verity/protocols/proof/spot/verifier/one_stage/__init__.py",
          "verity/protocols/proof/spot/verifier/one_stage/registered.py",
          "verity/protocols/proof/spot/verifier/one_stage/partition.py",
          "verity/protocols/proof/spot/verifier/one_stage/proofs.py",
          "verity/protocols/proof/spot/verifier/one_stage/one_circuit.py",
          "verity/protocols/proof/spot/verifier/one_stage/verifier.py",
          "verity/protocols/proof/spot/verifier/one_stage/caller.py",
          "verity/protocols/proof/spot/verifier/one_stage/audit.py",
          "verity/protocols/proof/spot/verifier/one_stage/draw.py",
          "verity/protocols/proof/spot/verifier/one_stage/hello.py",
          "verity/protocols/proof/spot/verifier/one_stage/docket.py",
          "verity/protocols/proof/spot/verifier/one_stage/verdict.py",
          "verity/protocols/proof/spot/verifier/challenger/coins.py", "verity/protocols/proof/spot/verifier/service.py",
          "verity/protocols/proof/spot/verifier/profile.py",
          "verity/protocols/accounting/compute/pouw/verifier/leaf_lanes.py", "verity/protocols/accounting/compute/pouw/verifier/live_reads.py",
          "verity/protocols/accounting/compute/pouw/prover/__init__.py", "verity/protocols/accounting/compute/pouw/prover/circuit",
          # pouw/grind.py: credit reads it through circuit/h1zy.py.
          "verity/protocols/accounting/compute/pouw/verifier/grind.py",
          "verity/protocols/proof/spot/verifier/one_stage/produced.py",
          "verity/circuits/kernels/__init__.py", "verity/circuits/kernels/tc.py",
          "verity/protocols/proof/spot/verifier/lean/lakefile.toml", "verity/protocols/proof/spot/verifier/lean/lake-manifest.json",
          "verity/protocols/proof/spot/verifier/lean/lean-toolchain", "verity/protocols/proof/spot/verifier/lean/Spot.lean",
          "verity/protocols/proof/spot/verifier/lean/Spot",
          "verity/errors.py", "verity/circuits", "verity/commitments", "verity/commitments/crypto",
          "verity/protocols/interface", "verity/protocols/accounting/compute/pouw/verifier/lean/window",
          "verity/protocols/accounting/compute/pouw/verifier/lean/commit", "verity/protocols/accounting/compute/pouw/verifier/lean/pearlplus",
          "verity/commitments/identity", "verity/commitments/randomness",
          "verity/commitments/lms/lean/lakefile.toml", "verity/commitments/lms/lean/lake-manifest.json",
          "verity/commitments/lms/lean/lean-toolchain", "verity/commitments/lms/lean/Lms.lean",
          "verity/commitments/lms/lean/Lms",
          "verity/protocols/proof/flock/verifier/lakefile.toml", "verity/protocols/proof/flock/verifier/lake-manifest.json",
          "verity/protocols/proof/flock/verifier/lean-toolchain", "verity/protocols/proof/flock/verifier/Flock",
          "adapters/vllm/verity_vllm/definitions/__init__.py",
          "verity/protocols/__init__.py", "verity/protocols/proof/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/compute/__init__.py", "verity/protocols/accounting/compute/pouw/__init__.py", "verity/protocols/proof/spot/__init__.py",
          "verity/protocols/proof/spot/verifier/challenger/__init__.py", "verity/circuits/base", "verity/circuits/lean",
          "verity/commitments/lean", "verity/protocols/accounting/compute/pouw/verifier/lean/check"]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_coins.py",
    "test_difftest.py",
    "test_live_verified_difftest.py",
]
# check runs it as three parts by test id (`lean-suites:verity-pouw-verifier-difftest:K/3`, `suites.py`'s `id_part_of`), each
# collecting every file and running the tests whose node id hashes to K, so that ci.toml's plans spread its one process over
# three shards
parts = 3
