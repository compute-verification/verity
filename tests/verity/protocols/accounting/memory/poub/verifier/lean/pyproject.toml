# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity` and `verity_difftest`.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../../../../../verity/protocols/accounting/memory/poub/verifier/lean"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_sampled.py", "test_honest_log.py",
    "test_gamma.py",
    "test_line.py",
    "test_p2.py",
    "test_p2_parties.py",
    "test_p2_party.py",
    "test_p2_signed_bytes.py",
    "test_pooled.py",
    "test_protocol.py",
    "test_registry.py",
    "test_replay.py",
    "test_schedule.py",
    "test_session.py",
    "test_refresh_lean.py",
    "test_refresh_attacks.py",
    "test_span.py",
    "test_units.py",
]
# The references: the audit, its codec, receipts and coins, the memory line and its pooled bound, on the commitments,
# the randomness and the profile; the difftest's Python half; and what `lake` builds: this package and,
# through its path requires, Flock's verifier's Lean, core's randomness, the difftest server and the core protocol
# interface (`Poub.Protocol`, which `test_protocol.py` holds to the period hook, `period.py`). The schedule check
# (`schedule.py`) is a reference too.
inputs = ["verity/lean_process.py", "verity/__init__.py", "verity/errors.py", 
          # PoUB's declaration, which the prover's side reads (`period_prover`), and the interface it is declared in
          "verity/protocols/accounting/memory/poub/scheme.py", "verity/protocols/accounting/scheme.py",
          "verity/hooks.py",
          "verity/protocols/proof/spot/verifier/profile.py",
          # the γ terms' ledger and the session verifier that holds the Lean's to it (`test_gamma.py`)
          "verity/protocols/accounting/memory/poub/verifier/ledger.py", "verity/protocols/accounting/memory/poub/verifier/timing.py",
          "verity/protocols/accounting/memory/poub/verifier/store.py", "verity/protocols/accounting/memory/poub/verifier/session",
          "verity/protocols/accounting/memory/poub/verifier/__init__.py",
          "verity/protocols/accounting/memory/poub/verifier/audit.py",
          # refresh's slot schedule, which `audit.py` imports
          "verity/protocols/accounting/memory/poub/verifier/rota.py",
          "verity/protocols/accounting/memory/poub/verifier/codec.py",
          "verity/protocols/accounting/memory/poub/verifier/wire.py",
          "verity/protocols/accounting/memory/poub/verifier/coins.py",
          "verity/protocols/accounting/memory/poub/verifier/receipts.py",
          "verity/protocols/accounting/memory/poub/verifier/line.py",
          "verity/protocols/accounting/memory/poub/verifier/pooled.py",
          "verity/protocols/accounting/memory/poub/verifier/schedule.py",
          "verity/protocols/accounting/memory/poub/verifier/period.py", "verity/protocols/interface",
          "verity/protocols/proof/spot/verifier/__init__.py",
          "verity/protocols/proof/spot/verifier/challenger/challenger.py",
          "verity/protocols/proof/spot/verifier/challenger/remote.py",
          # the proof service's draw, which `audit.receipt_sample` draws each window's sample by, and the one_stage
          # modules it imports
          "verity/protocols/proof/spot/verifier/challenger/coins.py",
          "verity/protocols/proof/spot/verifier/one_stage/__init__.py",
          "verity/protocols/proof/spot/verifier/one_stage/draw.py",
          "verity/protocols/proof/spot/verifier/one_stage/partition.py",
          "verity/protocols/proof/spot/verifier/one_stage/verdict.py", "verity/circuits", "verity/commitments",
          "verity/commitments/crypto",
          "verity/commitments/randomness", "tools/difftest/python",
          "verity/protocols/proof/flock/verifier/Flock", "verity/protocols/proof/flock/verifier/lakefile.toml",
          "verity/protocols/proof/flock/verifier/lake-manifest.json", "verity/protocols/proof/flock/verifier/lean-toolchain",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "verity/commitments/randomness", "verity/circuits/difftest",
          # the P2 store (`p2.py`, `Poub.P2`): PoUS's setup, P2 and vk, whose Lean leaf and path check
          # (`pous/check`'s `PousCheck.Merkle`) `lake` builds; its sessions' party (`p2_parties.py`), whose
          # sessions test_p2_party.py runs on the Lean of record
          # (`p2_lean.py`), and their core case (`p2_case.py`), which test_p2_case.py holds to the session's answer and
          # to PoUS's store; the configurations of pous_check's other requires, which `lake` reads to resolve them; and
          # the committed C*, whose registration, openings and a session test_p2.py replays
          "verity/protocols/accounting/memory/poub/verifier/p2.py", "verity/protocols/accounting/memory/poub/verifier/p2_parties.py",
          # the remote session's manifest, whose parties and channels the declaration (`scheme.py`) reads
          "verity/protocols/accounting/memory/poub/verifier/session_parties.py",
          # the honest provers and the period's prover side (`period_prover.py`, on `verifier_party.py`'s lines)
          "verity/protocols/accounting/memory/poub/prover/__init__.py", "verity/protocols/accounting/memory/poub/prover/audit_prover.py",
          "verity/protocols/accounting/memory/poub/prover/p2_prover.py", "verity/protocols/accounting/memory/poub/prover/period_prover.py",
          "verity/protocols/accounting/memory/poub/prover/p2_party_prover.py",
          "verity/protocols/accounting/memory/poub/verifier/verifier_party.py",
          "verity/protocols/accounting/memory/poub/verifier/p2_lean.py", "verity/protocols/accounting/memory/poub/verifier/p2_case.py",
          "verity/protocols/accounting/memory/pous", "verity/protocols/accounting/memory/wipe",
          "verity/protocols/accounting/memory/pous/prover", "verity/protocols/accounting/memory/wipe/prover",
          "verity/commitments/identity/lakefile.toml",
          "verity/commitments/identity/lake-manifest.json", "verity/commitments/identity/lean-toolchain",
          # the memory attester's party, whose kept setup (`keep`) test_p2_party.py registers a store from
          "verity/protocols/accounting/memory/pous/attester/__init__.py",
          "verity/protocols/accounting/memory/pous/attester/challenger_party.py",
          "verity/protocols/accounting/memory/pous/attester/lean/lakefile.toml",
          "verity/protocols/accounting/memory/pous/attester/lean/lake-manifest.json",
          "verity/protocols/accounting/memory/pous/attester/lean/lean-toolchain", "verity/commitments/attest/lean/lakefile.toml",
          "verity/commitments/attest/lean/lake-manifest.json", "verity/commitments/attest/lean/lean-toolchain",
          "verity/commitments/lms/lean/lakefile.toml",
          "verity/commitments/lms/lean/lake-manifest.json", "verity/commitments/lms/lean/lean-toolchain",
          "tests/verity/protocols/accounting/memory/poub/verifier/fixtures/p2-c-star.bin",
          "tests/verity/protocols/accounting/memory/poub/verifier/fixtures/p2-store.json",
          # a window decided from a span (`span.py`, `Poub.Span`): the opening unit's rows (`opening.py`,
          # `commitments/gates/block_check.py`), and the sampled proof system's one-stage audit, which `lake` builds
          "verity/protocols/accounting/memory/poub/verifier/span.py", "verity/protocols/accounting/memory/poub/verifier/opening.py",
          "verity/protocols/accounting/memory/poub/verifier/commitments",
          "verity/protocols/proof/spot/verifier/lean/Spot", "verity/protocols/proof/spot/verifier/lean/lakefile.toml",
          "verity/protocols/proof/spot/verifier/lean/lake-manifest.json",
          "verity/protocols/proof/spot/verifier/lean/lean-toolchain",
          # the honest one-window log the honest witnesses' premise reads (`HonestLogAccepted`), which
          # test_honest_log.py holds to `honest_log.py`'s case
          "security/Properties/Poub/Remote/HonestLog/Case.lean",
          # the deployment layer and its wire, which the period hook's verifier side is started through
          # (`verity.runtime.stream.Side`)
          "verity/config.py", "verity/party.py", "verity/protocol.py", "verity/runtime", "verity/channel.py", "tests/verity/tests/test_channel.py",
          "verity/protocols/__init__.py", "verity/protocols/proof/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/memory/__init__.py", "verity/protocols/accounting/memory/poub/__init__.py", "verity/protocols/proof/spot/__init__.py", "verity/protocols/proof/spot/verifier/challenger/__init__.py", "verity/protocols/accounting/memory/poub/verifier/lean"]
