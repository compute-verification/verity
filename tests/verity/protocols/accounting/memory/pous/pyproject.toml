# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# PoUS's prover's weight store (`../../../../../../verity/protocols/accounting/memory/pous/prover/weight_store.py`) and the P2 store's package it loads from its files;
# the two locks the schemes' Lean names are read from
inputs = ["verity", "security/lean-audit.json", "security/Properties/lean-audit.json"]
