# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_pous_wipe_store.py", "test_pous_wipe_stream.py"]
# What the tests import of `verity`, and PoUS's statements in Security with the lock and the pins they check them against,
# and the rest of the trusted layer's import closure that ../../../../../../../tools/pous_grader/TRUSTED.sha256 hashes (Core's Game, the named assumption
# TimedINC): test_pous_trusted fails while a file it hashes is outside these, naming the lines to add.
inputs = ["verity/lean_process.py", "verity/protocols/accounting/memory/pous/attester/timed_audit.py", "verity/__init__.py", "verity/errors.py",
          "verity/circuits",
          "verity/protocols/accounting/memory/pous/prover", "verity/protocols/accounting/memory/wipe/prover",
          # the wipe's declaration, whose attach runs the subprotocol (`wipe_served`), and the interface it is declared in
          "verity/protocols/accounting/memory/pous/scheme.py", "verity/protocols/accounting/memory/wipe/scheme.py",
          "verity/protocols/accounting/scheme.py",
          "verity/hooks.py",
          "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness", "verity/channel.py", "verity/runtime", "tests/verity/tests/test_channel.py", "verity/config.py", "verity/party.py", "verity/protocol.py",
          "verity/protocols/accounting/memory/pous/attester/__init__.py",
          "verity/protocols/accounting/memory/pous/attester/challenger_party.py",
          "verity/protocols/accounting/memory/wipe/attester/wipe_challenger.py",
          "security/Definitions/Pous.lean", "security/Definitions/Pous", "security/Proofs/Pous",
          "security/Definitions/Core/Game.lean", "security/Definitions/Assumptions/Pous.lean",
          "security/Proofs/Core/Game/Basic.lean",
          "security/lean-audit.json", "security/lakefile.toml", "security/lake-manifest.json", "security/lean-toolchain",
          "security/Proofs/lakefile.toml", "security/Proofs/lake-manifest.json",
          "tools/pous_grader/README.md",
          # the grader's package and the memory attester's modules, each by its own path: the tests read them wherever
          # they are, in this suite's directory or outside it
          "tools/pous_grader", "verity/protocols/accounting/memory/pous/attester/memory_attester.py",
          "verity/protocols/accounting/memory/pous/attester/challenger_session.py",
          "verity/protocols/accounting/memory/pous/attester/continuous.py",
          "verity/protocols/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/memory/__init__.py",
          "verity/protocols/accounting/memory/pous/__init__.py",
          # the memory attester's key as a deployment starts it, and the wipe's native streamer, which the conftest
          # and the wipe's store tests build and run
          "verity/protocols/accounting/memory/pous/attester/onsite.py",
          "verity/protocols/accounting/memory/wipe/attester/wipe_stream.py",
          "verity/protocols/accounting/memory/wipe/attester/wipe_stream.c",
          # SPOT's registered reads, which PoUS's served weights (`pous.prover.served_weights`) name, and its one-stage
          # door, whose verdict on each sampled block the setup's check reads (`pous.verifier.setup_proof.check`), with
          # the integrity profile the door's audit loads
          "verity/protocols/proof/__init__.py", "verity/protocols/proof/spot/__init__.py",
          "verity/protocols/proof/spot/verifier/__init__.py", "verity/protocols/proof/spot/verifier/profile.py",
          "verity/protocols/proof/spot/verifier/one_stage", "verity/protocols/proof/spot/verifier/challenger",
          "verity/protocols/proof/spot/verifier/levels.py", "verity/protocols/proof/spot/verifier/service.py",
          "verity/protocols/proof/spot/verifier/window_place.py",
          "verity/protocols/accounting/memory/pous/verifier", "verity/protocols/accounting/memory/wipe/verifier"]
