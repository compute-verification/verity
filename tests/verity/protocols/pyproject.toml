# A suite of `verity`'s tests (the root's pyproject.toml is the distribution): those of verity/protocols' own modules; each
# protocol under it is a suite of its own.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests/test_profile.py builds a Program with partition levels from the catalog's GEMM; tests/test_scheme.py
# resolves Dither's declaration in a registered circuit of its Definitions, and holds `run.schemes`' list to every
# declaration module under the resource accounting, experimental, sampled proofs' and workload classification protocols.
inputs = ["verity", "verity/circuits", "verity/circuits/kernels", "verity/commitments", "verity/protocols/proof/spot",
          "verity/protocols/experimental", "verity/protocols/accounting", "verity/protocols/run",
          "verity/protocols/policy"]
