[project]
name = "verity-core-sampled-proofs"
version = "0.0.0"
description = "The difftest of sampled proofs' one-stage audit in Lean (core_spot) against one_stage's Python."
requires-python = ">=3.12"
# `verity` and `verity-difftest` come from the workspace environment, which the tests run in.
dependencies = ["hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_challenger_difftest.py",
    "test_difftest.py",
    "test_harm_bound.py",
    "test_history_difftest.py",
    "test_period_difftest.py", "test_members_check.py",
    "test_members_twin.py", "test_wires_difftest.py", "test_prog_calls_total.py",
]
# Test-only: `lake` builds this package and, through its path requires, the core protocol interface, the difftest
# harness's Lean, Flock's verifier library and the LMS verifier; the tests import the harness's Python and the
# reference, one_stage with the profile, and what they import of verity.ml (the circuits, the partition object, the
# commitments' domains, and LMS for the challenger's signed record), and the storage session's release and the values
# its supplied functions take at it (`test_supplied_difftest.py`, with the circuits' own test of the same).
inputs = ["tests/verity/circuits/stand_in.py", "tests/verity/circuits/pous_session_vectors.json", "tests/verity/circuits/test_supplied.py", "verity/__init__.py", "verity/errors.py", "verity/protocols",
          "verity/protocols/proof/flock/verifier",
          "verity/circuits", "verity/commitments", "adapters/vllm/verity_vllm/definitions", "tools/difftest",
          "verity/channel.py",
          "verity", "tests/verity/commitments/periods/test_interface.py", "adapters/vllm/verity_vllm/__init__.py",
          "calibration/hardware/cards/rtx-pro-6000-server.toml"]
