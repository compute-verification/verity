# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the difftest's samples are the clear audit's, a reference tool's; `verity_difftest` drives the Lean side
inputs = ["verity", "verity/protocols/resource_accounting/compute/pouw/prover/clear", "tools/difftest/python/verity_difftest"]
