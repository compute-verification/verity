# The served (prefill) edited GEMM: egemm.cu and its profile/probe scripts run on a GPU node through research run; the
# tests of the CPU judges and summaries run here as a suite (`uv run tools/check/suites.py
# verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm`).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../../../../../../verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# d2sgemm_ref.py's tests read floored_gemm's
# derive.py (tile_receipts) and the ref.py it loads; cgemm_ref.py's also read the construction it recomputes a tile
# through, co_words.py, beside it. test_egemm_ref.py holds egemm_ref.py to the receipt folds'
# reference: `verity.protocols.resource_accounting.compute.pouw.verifier.receipts.receipt_conform`'s check, with the receipt_folds.py and vectors.json it
# reads and the packages above it, which import nothing. egemm_ref.py loads the r9 twin from the receipts' fixture.
inputs = ["verity/protocols/resource_accounting/compute/pouw/prover/kernels/floored_gemm/derive.py", "verity/protocols/resource_accounting/compute/pouw/prover/kernels/floored_gemm/ref.py",
          "verity/__init__.py", "verity/protocols/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/compute/__init__.py", "verity/protocols/resource_accounting/compute/pouw/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/prover/__init__.py", "verity/protocols/resource_accounting/compute/pouw/prover/kernels/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/__init__.py", "verity/protocols/resource_accounting/compute/pouw/verifier/receipts/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/receipts/receipt_conform.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/receipts/receipt_folds.py", "verity/protocols/resource_accounting/compute/pouw/verifier/receipts/vectors.json",
          "tests/verity/protocols/resource_accounting/compute/pouw/verifier/receipts/fixtures/receipt_folds_r9.py", "verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm"]
