# The edited GEMM: its kernels and their gate scripts run on a GPU node through research run; the
# tests of the CPU references run here as a suite (`uv run tools/check/suites.py
# verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm`).
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../../../../../../verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# cgemm_ref.py's tests read floored_gemm's derive.py (tile_receipts) and the ref.py it loads, and the construction it
# recomputes a tile through, co_words.py, beside it; apv_ref.py and cpv_ref.py import cgemm_ref.py through its package.
inputs = ["verity/protocols/resource_accounting/compute/pouw/prover/kernels/floored_gemm/derive.py", "verity/protocols/resource_accounting/compute/pouw/prover/kernels/floored_gemm/ref.py",
          "verity/__init__.py", "verity/protocols/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/compute/__init__.py", "verity/protocols/resource_accounting/compute/pouw/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/prover/__init__.py", "verity/protocols/resource_accounting/compute/pouw/prover/kernels/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/prover/kernels/edited_gemm"]
