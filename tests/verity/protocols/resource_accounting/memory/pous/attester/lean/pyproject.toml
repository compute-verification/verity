[project]
name = "memory-challenger-lean"
version = "0.0.0"
description = "The differential tests of the memory challenger's and the streamed wipe's verdicts in Lean (this directory's Lake package) against verity.protocols.resource_accounting.memory.pous.attester.memory_challenger and streamed_wipe; verdict.py, the Lean verdict behind memory_challenger.verdict's signature; and wipe_verdict.py, the streamed wipe's verdict decided by the Lean."
requires-python = ">=3.12"
dependencies = ["verity", "verity-difftest", "hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../../../../../verity/protocols/resource_accounting/memory/pous/attester/lean"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds this package and, through its path requires, Flock's verifier's Lean, core's randomness, LMS,
# the auditor parties' period checks, the protocol interface and the difftest server; the sessions are signed by the PoUS
# tests' test signer, read by path.
inputs = ["verity/protocols/proofs/flock/verifier/Flock", "verity/protocols/proofs/flock/verifier/lakefile.toml",
          "verity/protocols/proofs/flock/verifier/lake-manifest.json", "verity/protocols/proofs/flock/verifier/lean-toolchain",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "verity/commitments/randomness", "verity/commitments/lms/lean", "verity/commitments/attest/lean",
          "verity/protocols/interface",
          "verity/circuits/difftest", "tests/verity/protocols/resource_accounting/memory/pous/verifier/pous_test_signer.py",
          "verity/__init__.py", "verity/commitments/__init__.py", "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/memory/__init__.py", "verity/commitments/attest/__init__.py",
          "verity/protocols/resource_accounting/memory/pous/__init__.py", "verity/protocols/resource_accounting/memory/pous/attester/__init__.py"]
