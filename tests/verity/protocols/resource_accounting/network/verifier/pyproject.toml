# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["../../../../../.."]   # the repository root: its tests import others' as `tests.X`, the tests of X
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_network_attester_transfer_blocks_lean.py",
    "test_network_attester_period.py",
    "test_network_attester_registered.py",
    "test_network_attester_service.py",
    "test_network_attester_tie_service.py",
]
# the served circuits' Definitions (`verity_vllm.definitions`) its tests import, with the package they sit in
inputs = ["verity", "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/definitions"]
# check runs it as three parts by test id (`lean-suites:verity/protocols/resource_accounting/network/verifier:K/3`, `suites.py`'s
# `id_part_of`), each collecting every file and running the tests whose node id hashes to K, so that ci.toml's plans spread it
# over three shards: in one process it ran longest of the one-process suites beside the security analysis's audit
parts = 3

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_network_attester_blocks.py"]
paths = ["verity/circuits", "verity/circuits/kernels"]

[[tool.verity.tests.reads]]
tests = [
    "test_network_attester_lean_difftest.py",
    "test_network_attester_tie_service.py",
    "test_network_check_lean_difftest.py",
]
paths = ["verity"]

# `lake build NetworkCheck.Registered` and the script it then runs: the check's Lake package (its lakefile and its Lean),
# the script, and the packages the module's imports are in (the Site and what it imports)
[[tool.verity.tests.reads]]
tests = ["test_network_attester_registered.py"]
paths = [
    "verity/circuits/base",
    "verity/protocols/resource_accounting/network/verifier/lean",
    "tests/verity/protocols/resource_accounting/network/verifier/lean",
    "verity/protocols/interface",
]
