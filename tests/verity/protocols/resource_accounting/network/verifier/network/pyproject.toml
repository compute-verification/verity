# The network certificate check's port (`lean/`, `network-check serve`) against `audit.py`: a suite of `verity`'s tests,
# run in the workspace's environment against the editable `verity`, after `check`'s Lean steps (`AFTER_LEAN`), since it
# skips without `lake`. `lake` builds `lean/` and, through its path requires, the core protocol interface, the attester
# program, the LMS port and Flock's verifier, all under `verity/`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_lean_audit.py",
    "test_inference_only_protocol.py",
    "test_inference_only_record_check.py",
    "test_network_check_protocol.py",
    "test_network_period_protocol.py",
    "test_network_records_protocol.py",
    "test_network_span_protocol.py",
]
# `verity_difftest`, through which the network checks' tests speak to their Lean executables
# the served circuits' Definitions (`verity_vllm.definitions`) its tests import, with the package they sit in
inputs = ["verity", "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/definitions", "tools/difftest/python/verity_difftest"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_inference_only_theta_difftest.py"]
paths = ["verity/circuits", "verity/commitments", "adapters/vllm/verity_vllm/definitions", "verity/protocols/proofs/flock/prover", "verity/protocols/proofs/flock/prover/pod", "verity/protocols/proofs/flock/prover/agreement", "verity/protocols/proofs/flock/prover/tool.py", "verity/protocols/resource_accounting/network/prover", "verity/protocols/resource_accounting/memory/pous/prover", "verity/protocols/resource_accounting/compute/pouw/prover", "verity/protocols/resource_accounting/memory/poub/verifier/commitments", "verity/commitments/periods"]

[[tool.verity.tests.reads]]
tests = [
    "test_inference_only_desc_difftest.py",
    "test_inference_only_desc_fuzz.py",
    "test_inference_only_desc_liveness.py",
    "test_inference_only_lean_difftest.py",
]
paths = ["verity"]

[[tool.verity.tests.reads]]
tests = ["test_inference_only_record_check.py", "test_inference_only_record_difftest.py"]
paths = ["verity"]

[[tool.verity.tests.reads]]
tests = ["test_inference_only_rows_protocol.py"]
paths = ["verity"]
