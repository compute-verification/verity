# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests here run the drivers with no proof drivers installed (`proof_drivers`): what needs them is under
# tests/benchmarks/network_traces. The period check's Python mirror test_scan_zk reads takes verity_difftest's decoders
# and the served circuits' sampling Definitions (`verity_vllm.definitions`), with the package they sit in.
inputs = ["verity", "tools/difftest/python/verity_difftest", "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/definitions"]
