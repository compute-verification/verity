# A suite of `verity`'s tests: compose's prover side, onsite's and remote's cases from their subprotocols' cases
# (`composite.py`, on a stub executable). They run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_composite.py"]
inputs = [
    "verity/__init__.py",
    "verity/errors.py",
    "verity/channel.py",
    "verity/protocols/__init__.py",
    "verity/protocols/compose",
    "verity/circuits",
    "verity/commitments",
]
