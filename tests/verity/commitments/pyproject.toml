# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: test_block_check holds the check-3 units to PoUB's codec and receipts. test_layout reads commit_slots'
# interface fixture, whose layout is slots._layout_json's.
inputs = ["verity", "verity/circuits", "verity/circuits/kernels", "adapters/vllm/verity_vllm/settings.py", "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/check", "verity/commitments/hm96/PROTOCOL.md",
          "verity/protocols/resource_accounting/memory/poub/verifier", "tests/verity/commitments/fixtures/commit-slots-v1.json"]
parallel = true
worker_gb = 8
