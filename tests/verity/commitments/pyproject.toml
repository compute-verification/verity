# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: test_block_check holds the check-3 units to PoUB's codec and receipts.
inputs = ["verity", "verity/circuits", "verity/circuits/kernels", "adapters/vllm/verity_vllm/settings.py", "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/check", "verity/commitments/hm96/PROTOCOL.md",
          "verity/protocols/accounting/memory/poub/verifier"]
parallel = true
worker_gb = 8
typical_worker_gb = 5

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_lms_sign_lean_difftest.py"]
paths = ["verity/commitments/crypto"]

[[tool.verity.tests.reads]]
tests = ["test_session_coins.py"]
paths = ["verity/commitments/lean/Commitments/SessionCoins.lean"]
