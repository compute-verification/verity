# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity", "verity/circuits", "verity/commitments", "verity/circuits/kernels"]
# not `parallel`: the suite takes about as long as its one slow test, so in one process it runs beside the parallel suites,
# which run one after another, and xdist would shorten nothing
