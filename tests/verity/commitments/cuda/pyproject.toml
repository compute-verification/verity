# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_commit_gpu_salts.py", "test_row_commit.py", "test_sha512.py", "test_sha512_stream.py"]
# Test-only: test_row_commit holds row_commit.cuh to verity.commitments' frame-v3 and hm96 references, vectors and gates,
# which import verity.circuits, verity.commitments.crypto and verity.errors; test_sha512_stream holds sha512_stream to the
# randomness module's pinned vectors.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/commitments", "verity/circuits",
          "verity/commitments/crypto", "tests/verity/commitments/randomness/vectors.json",
          "adapters/vllm/verity_vllm/definitions/__init__.py"]
