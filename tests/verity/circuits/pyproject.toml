# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests register the catalog's Definitions before decoding, tests/evaluation self-checks every registered kernel
# against its Definition (the kernels and the silicon models they read), tests/test_stacking holds property/v1's table to
# Lean's registry, and tests/test_lean_gates recomputes the circuit model's rows from s8, census/v1 and property/v1.
# the served circuits' Definitions (`verity_vllm.definitions`) its tests import, with the package they sit in
inputs = ["verity", "adapters/vllm/verity_vllm/__init__.py", "adapters/vllm/verity_vllm/definitions", "verity/circuits", "verity/circuits/kernels", "security/Definitions/ResourceAccounting/Gates/Registry.lean",
          "security/Proofs/ResourceAccounting/Gates/Rows.lean",
          # `verity`'s settings registry, which tests/test_settings.py tests, with the package it sits in
          "tools/config/verity_config/verity_settings.py", "tools/config/verity_config"]
parallel = true

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_codec_stream.py"]
paths = ["verity"]

[[tool.verity.tests.reads]]
tests = ["test_supplied.py"]
paths = ["verity/protocols/proof/spot/verifier/lean/Spot/Supplied.lean"]

[[tool.verity.tests.reads]]
tests = ["test_settings.py"]
paths = ["verity/circuits", "verity/circuits/ops", "verity/circuits/silicon"]
