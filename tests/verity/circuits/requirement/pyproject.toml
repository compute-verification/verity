# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["test_requirement_difftest.py"]
# Test-only: the reference is `verity.circuits.requirement` (with its census path), and two of its Programs are rows
# of the Definitions (`verity_vllm.definitions.registry`: `b1`, over `prims`, with the package's `__init__.py`, which
# importing it runs); the census loads PoUW's segment Definitions
# by name (`verity.protocols.resource_accounting.compute.pouw.prover`), whose imports reach PoUB's record, PoUW's circuits, SPOT's
# service, the commitments and the hashes; `lake` builds this package against the difftest harness's Lean, required by
# path, and the base packages the harness requires (`Base.Canon` and what it imports). The memory-map test, which holds
# the vLLM adapter's builder to this package's Lean, is the adapter's (`tests/adapters/vllm/tests/commit/`).
inputs = ["verity/circuits", "verity/circuits/kernels/__init__.py", "verity/circuits/kernels/tc.py", "verity/__init__.py", "tools/config/verity_config/verity_settings.py",
          "verity/errors.py", "tools/difftest", "adapters/vllm/verity_vllm/definitions",
          "adapters/vllm/verity_vllm/__init__.py", "verity/channel.py",
          "verity/protocols/proofs/spot/verifier/profile.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier", "verity/protocols/resource_accounting/memory/poub/verifier",
          "verity/protocols/resource_accounting/compute/pouw/prover",
          "verity/protocols/proofs/spot/verifier/__init__.py", "verity/protocols/proofs/spot/verifier/challenger/challenger.py",
          "verity/protocols/proofs/spot/verifier/challenger/remote.py", "verity/protocols/proofs/spot/verifier/one_stage",
          "verity/protocols/proofs/spot/verifier/service.py", "verity/protocols/proofs/spot/verifier/challenger/coins.py",
          "verity/protocols/proofs/spot/verifier/second_stage.py", "verity/protocols/proofs/spot/verifier/schedule.py",
          "verity/protocols/proofs/spot/verifier/window_place.py",
          "verity/commitments/periods", "verity/commitments",
          "verity/commitments/crypto", "verity/commitments/randomness",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/compute/__init__.py", "verity/protocols/resource_accounting/memory/__init__.py", "verity/protocols/resource_accounting/memory/poub/__init__.py",
          "verity/protocols/resource_accounting/compute/pouw/__init__.py", "verity/protocols/proofs/spot/__init__.py",
          "verity/protocols/proofs/spot/verifier/challenger/__init__.py", "verity/circuits/base", "verity/circuits/lean"]
