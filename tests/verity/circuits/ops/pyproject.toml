# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: a Definition registers its kernel lazily (verity.circuits.kernels, which imports the catalog, so it is no dependency here).
# tests/test_tc_probe_families.py imports the tensor-core probe's tile generation (benchmarks/tc_probe/tc_probe.py).
# tests/test_discrepancy_log.py checks that each evidence ref in verity/circuits/silicon/discrepancy_log.json exists, which the
# guard can't see, so every ref outside this directory is listed here (its test_every_evidence_path_is_an_input_of_this_suite fails on one that isn't).
inputs = ["verity", "security", "verity/circuits/kernels", "adapters/vllm/verity_vllm/settings.py", "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/check", "benchmarks/tc_probe", "benchmarks/tc_probe_fp4/probe.py",
          "benchmarks/numerical/python/verity_numerical/reference/hawkeye_close.py",
          "tests/benchmarks/numerical/checker/test_fp8.py",
          "tests/benchmarks/numerical/reference/hawkeye_harness.cpp",
          "tests/benchmarks/numerical/reference/test_hawkeye_close.py",
          "tests/benchmarks/numerical/reference/test_normalisation_d3.py",
          "benchmarks/numerical/python/verity_numerical/__init__.py", "benchmarks/numerical/python/verity_numerical/reference/__init__.py",
          # `verity`'s settings registry, whose opt-in flags (`VERITY_ML_*`) some tests read, with the package it sits in
          "tools/config/verity_config/verity_settings.py", "tools/config/verity_config"]
parallel = true
worker_gb = 10
