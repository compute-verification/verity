# The suite of the distribution `input-datasets`: a virtual member that depends on it, so the suite keys on what the
# distribution's dependents read, and `tools/check/suites.py` names it as the distribution.
[project]
name = "input-datasets-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["input-datasets"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q -p no:cacheprovider"

[tool.verity.tests]
# serve_load.py, whose fixed load the generator is held to, and the workload file the recorded definition reads, which
# the runner fetches before the suite as an entry of artifacts.json under these inputs
inputs = ["adapters/vllm/tools/served_run/serve_load.py", "adapters/vllm/workloads/workload_qwen05_32x16_1req.json"]
