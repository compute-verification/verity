# The agent VM's guard: its shell and Task hooks, OOM recorder and boot script, and their tests. Not a package: the scripts
# are stdlib, run as files, and their tests run as a suite (`uv run tools/check/suites.py tools/agent-guard`).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests hold the hooks to the hooks file Cursor reads, and the boot test copies it into a scratch workspace.
# two tests copy this package whole, its README with it; the kept session's holds research's name for it to the guard's;
# the Fable rule's holds the guard's lead ids to launch_coordinator's; the shim's runs research's at_main.py as it does;
# `inbox.py send` loads research's timefmt.py by path for its stamp check
inputs = [".cursor/hooks.json", "tools/agent-guard/README.md", "tools/research/src/research/secret_hint.py",
          "infra/cursor/launch_coordinator.py", "tools/research/src/research/at_main.py",
          "tools/research/src/research/timefmt.py", "tools/agent-guard"]
