# The suite of the workspace member `verity-check`, which stays a member where it is: a virtual member with its
# dependencies, which `tools/check/suites.py` names as the member.
[project]
name = "verity-check-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["research"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_after_lean.py",
    "test_anchors.py",
    "test_check.py",
    "test_cold_start.py",
    "test_declaration.py",
    "test_deferred_run.py",
    "test_guard.py",
    "test_lean_audit.py",
    "test_lean_changed.py",
    "test_lean_prebuild.py",
    "test_lean_records.py",
    "test_markdown_caps_gate.py",
    "test_merge_map.py",
    "test_merge_rows.py",
    "test_move_check.py",
    "test_mutants.py",
    "test_node_keys.py",
    "test_pins.py",
    "test_placement.py",
    "test_plan.py",
    "test_post_train.py",
    "test_preflight.py",
    "test_record_clone.py",
    "test_record_pool.py",
    "test_records.py",
    "test_settings.py",
    "test_shard_plan.py",
    "test_shards.py",
    "test_shipped_checkout.py",
    "test_slot.py",
    "test_suite_parts.py",
    "test_suites.py",
    "test_tasks.py",
    "test_verdicts.py",
]
# The tests read the verifier's pin, replayable sets and agreement scripts (the agreement step's inputs), check.py's
# shipped-tree commit record, the flock-circuit build step's script and the patches its Rust tests cover, the repository
# lints the preflight names (and the direct environment read's detector, by which test_settings counts the reads left
# outside settings.py), and the Lean audit's tool directory: the audit's job and the fast path (`lean_audit.py`,
# `lean_changed.py`, the pin `lean-deps.json`), the sandbox lean_changed builds in, and the audit tool both load (a
# directory, since loading `check.py` reads and writes its `__pycache__`) with the task graph's contract its module keys
# load, the security proofs' manifest and record (a
# shard's package), the Slack registry, whose handles are the owners `ci.toml` may name, and what of research the fixture
# fetch and the run tooling import beyond its `exports` (with `research run --pool`'s placement, which `--record --pool`
# reuses, the check view whose circuit-check reader the live record shares, the executor's keys and labels, which
# `tasks.py costs` reads, `jobuser`, which names the job unit `clone.not_over` asks for a run's processes before a
# machine's clone is made, and the queue loop's key of what lean-agreement reads, which test_check holds to what it opens), the move script whose word maps move_check applies, and the vLLM integration's ratchet gate,
# which the ratchet-gate step runs on a toy train, the `verity` command, whose `verity check` the cold-start smoke runs, and
# the test files of the one-stage audit's two longest tests (benchmarks/one_stage's and the vLLM adapter's), which ci.toml's
# plans place by their parts.
inputs = ["tools/check", ".agents/skills/using-slack/registry.json", "READY.json", "tools/move/rename.py", "tools/move/layout.py", "verity/protocols/proofs/flock/prover/check_build.sh", "verity/protocols/proofs/flock/prover/flock-glue-b684b12.patch",
          "verity/protocols/proofs/flock/prover/flock-gpu-link-b684b12.patch", "verity/protocols/proofs/flock/prover/flock-link-b684b12.patch",
          "verity/protocols/proofs/flock/prover/flock-sha512-b684b12.patch", "verity/protocols/proofs/flock/prover/flock-vtime-b684b12.patch",
          "verity/protocols/proofs/flock/prover/flock-wide-b684b12.patch",
          "verity/protocols/proofs/flock/prover/flock-zk-b684b12.patch", "verity/protocols/proofs/flock/prover/agreement", "verity/protocols/proofs/flock/verifier",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "tests/test_no_wall_clock.py", "tests/test_repository.py",
          "tools/verity/lean", "tools/verity/graph/verity_graph/contract.py", "security/Proofs/lake-manifest.json", "security/Proofs/lean-audit.json",
          "tools/research/src/research/checkview.py", "tools/research/src/research/store/custody.py", "tools/research/src/research/store/evict.py",
          "tools/research/src/research/store/fetchset.py", "tools/research/src/research/store/fixtures.py",
          "tools/research/src/research/store/labels_sync.py", "tools/research/src/research/executor.py",
          "tools/research/src/research/store/sealed.py", "tools/research/src/research/telemetry/cancel.py",
          "tools/research/src/research/telemetry/classify.py", "tools/research/src/research/telemetry/procs.py",
          "tools/research/src/research/telemetry/pyspy.py", "tools/research/src/research/telemetry/run.py",
          "tools/research/src/research/telemetry/scope.py", "tools/research/src/research/auto.py",
          "tools/research/src/research/jobuser.py", "tools/research/src/research/vqueue_slim.py",
          "tools/research/src/research/pods/nebius/slot_only.py", "adapters/vllm/tools/ratchet_gate.py",
          "tests/lint/test_repo_env_reads.py",
          "tools/research/src/research/__init__.py", "tools/research/src/research/store/__init__.py", "tools/research/src/research/telemetry/__init__.py",
          "tools/verity/circuit_check/src/circuit_check/cli.py", "tools/verity/cli/verity_cli/__init__.py",
          "tests/benchmarks/one_stage/test_served_cases.py", "tests/benchmarks/one_stage/test_two_stage_driver.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["test_settings.py"]
paths = ["tools/check"]

[[tool.verity.tests.reads]]
tests = ["test_shard_plan.py"]
paths = ["artifacts.json"]

[[tool.verity.tests.reads]]
tests = ["test_shards.py"]
paths = ["tests/benchmarks/one_stage/test_served_cases.py", "tests/benchmarks/one_stage/test_two_stage_driver.py"]

# `check.cc_manifests`, which every step list and check run reads: whether this tree's circuit-check lists its records
[[tool.verity.tests.reads]]
tests = ["test_check.py", "test_declaration.py", "test_deferred_run.py", "test_lean_slot.py", "test_live.py",
         "test_record_pool.py", "test_records.py", "test_settings.py", "test_shard_plan.py", "test_shards.py",
         "test_verdicts.py"]
paths = ["tools/verity/circuit_check/src/circuit_check/cli.py"]
