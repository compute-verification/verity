# The move codemods (`layout.py`, `rename.py`, `restack.py`, `stage.py`) and their tests (README.md). Not a package: the
# scripts are stdlib and git, run as files, and their tests run as a suite (`uv run tools/check/suites.py tools/move`).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `tests/test_stage.py` stages moves in toy repositories holding these, as a move's base holds them: the certificate and
# the pins list it reads; and it types README.md's node recipe as printed
inputs = ["tools/check/move_check.py", "tools/check/pins.py", "tools/move/README.md", "tools/move"]
