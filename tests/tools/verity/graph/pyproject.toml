# The suite of the distribution `verity-graph`: a virtual member that depends on it, so the suite keys on what the
# distribution's dependents read, and `tools/check/suites.py` names it as the distribution.
[project]
name = "verity-graph-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["verity-graph"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "test_build.py",
    "test_circuit_binding.py",
    "test_graph.py",
    "test_invariants.py",
    "test_lean_listing.py",
    "test_lean_runner.py",
    "test_local.py",
    "test_test_file.py",
]
# The listing digests every file a task reads, which is most of the tree and some of its Markdown, and the invariants list the
# whole tree: a listed `.md` keys its Markdown too (`suites.markdown`).
inputs = [".", "tools/verity/graph/README.md"]
parallel = true
