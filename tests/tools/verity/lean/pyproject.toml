[project]
name = "verity-lean-audit"
version = "0.0.0"
description = "The Lean audit that `check` runs on every Lake package."
requires-python = ">=3.12"
dependencies = ["research"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests read this directory's README, so its Markdown is keyed (`suites.markdown`), and load `lean_audit.py`, which loads
# `tools/check/common.py`, and `module_keys.py`, which loads `verity_graph/contract.py`, whose key vectors
# (`key_vectors.json`) `test_module_keys.py` reproduces; `test_lean_changed.py` loads `lean_changed.py`, which loads the check tool's
# `lean_slot.py` and `slot.py`; `test_siblings.py` runs `verity lean try --siblings`, the CLI's. `test_moved.py` runs the
# install command's shim, and `lean_changed.py` reads research's record of the layout moves (`moved.py`). `test_warm.py`
# loads `warm.py`, which loads the check tool's `verdicts.py` and with it `settings.py`.
inputs = ["tools/verity/lean/README.md", "tools/check/common.py", "tools/check/lean_slot.py",
          "tools/check/slot.py", "tools/check/verdicts.py", "tools/check/settings.py",
          "tools/verity/graph/verity_graph/contract.py", "tools/verity/cli/verity_cli/__init__.py",
          "tools/lean/setup.sh", "tools/research/src/research/store/moves.json",
          "tools/research/src/research/__init__.py", "tools/research/src/research/store/__init__.py", "tools/verity/lean"]
# check runs it as three parts by test id (`lean-suites:verity-lean-audit:K/3`, `suites.py`'s `id_part_of`), each collecting
# every file and running the tests whose node id hashes to K, so that ci.toml's plans spread its one process over three shards
parts = 3
