          "verity/protocols/resource_accounting/compute/pouw/verifier/__init__.py", "verity/protocols/resource_accounting/compute/pouw/verifier/audit.py", "verity/protocols/resource_accounting/compute/pouw/verifier/salt.py",
          "verity/protocols/resource_accounting/compute/pouw/verifier/protocol.py",
