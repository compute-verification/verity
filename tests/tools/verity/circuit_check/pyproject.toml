# The suite of the distribution `verity-circuit-check`: a virtual member that depends on it, so the suite keys on what the
# distribution's dependents read, and `tools/check/suites.py` names it as the distribution.
[project]
name = "verity-circuit-check-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["verity-circuit-check"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree.
# Among them every file with a test that asks for the catalog (conftest.py's `catalog` and `suite`, or its `build`): where a
# binding's record doesn't count, its session has it built by a `circuit-check --all --records-only` started without the read
# tracer (conftest.py's `_untraced`), so that `check`'s circuit-check takes the record it stores.
untraced = [
    "test_ambient.py",
    "test_attention_split.py",
    "test_cache.py",
    "test_cache_expiry.py",
    "test_cache_imports_and_moves.py",
    "test_cache_redteam.py",
    "test_catalog_fixture.py",
    "test_circuit_check.py",
    "test_metadata_files.py",
    "test_metadata_listings.py",
    "test_named_targets.py",
    "test_shard.py",
    "test_split_prims_serve.py",
    "test_units.py",
]
# a pass can take up to an hour, past suites.py's SUITE_TIMEOUT_S
timeout_s = 7200
# its tests are independent; serially the suite is the check's critical path
parallel = true
# one xdist worker's share, which `--mem-gb` (else the cgroup's memory.max) divides by. Each worker of a run with a slow catalog
# test makes circuit-check's catalog before any test runs (conftest.py's `catalog`; `--quick` makes none) from what each catalog
# binding reaches, building no body: about 2.6 GiB. Where a binding's record doesn't count, the
# first worker has the bindings without one built and their records stored (`circuit-check --all --records-only`, a process
# forked per binding) while the others wait: its processes take what the workers' shares
# leave as they wait (conftest.py's `_budget`), each counted at what its owner's unkeyed file says it grows (`cli.heavy`).
# Built whole in each worker instead, the catalog takes a worker past 50 GB. A circuit-check a test starts
# keeps to this share too (conftest.py's `worker_slot_gb`).
worker_gb = 8
# each worker builds that catalog before any test runs, so the workers' count bounds the suite's run: at least this many,
# beside whatever runs with it (`suites.py`'s `held_workers`), where a short last run or a longer suite beside it would leave
# it a few
workers = 14
# In place of its dependencies' directories (`inputs_only`; `verity`'s brings the root's dev group, the whole workspace): the
# packages that define Definitions and templates, with their sidecars (`sidecars.discover` searches every package root, so a
# sidecar anywhere else is read outside these and fails the guard), and the modules they import. Test-only:
# test_sampled_replay.py (test_circuit_check.py's request Program), with verity_vllm/records, which its replay modules import.
# verity_vllm/engine/spec.py: what the package's lazy `EngineSpec` (in its `__all__`) imports when a session fixture resolves
# the package's names. verity_vllm/engine/__init__.py and served_seed.py: program/frontend/seed_rule.py's sidecar builds the
# served seed rule, whose domain tag and derivation are served_seed's.
# pouw/window.py: circuit/window_statement.py imports it (the statement on words and the entry row's layout), so building
# its unit reads it, and the catalog's records digest it as an import site of the PoUW modules they hold
# (`units._unchanged`).
# Read only to check the catalog's records (conftest.py):
# spot/service.py, which the records digest as such an import site too and which a whole build never imports, with
# spot/second_stage.py, which service.py imports, and spot/schedule.py, which second_stage.py imports.
# pouw/weights.py and spot/__init__.py: h1zy reads an
# H1 lane's chunks along K from weights (`chunks`), and weights imports one_stage. spot/challenger.py:
# pouw/coins.py names its entropy's claim instance through the challenger's `coin_claim`.
# verity_config: conftest.py reads the session's variables through the suite's registry (settings.py), built on its registry.
inputs_only = true
inputs = ["tools/verity/circuit_check", "verity/__init__.py", "tools/config/verity_config/verity_settings.py", "verity/errors.py", 
