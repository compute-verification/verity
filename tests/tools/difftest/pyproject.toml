# The suite of the distribution `verity-difftest`: a virtual member that depends on it, so the suite keys on what the
# distribution's dependents read, and `tools/check/suites.py` names it as the distribution.
[project]
name = "verity-difftest-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["verity-difftest"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds lean/ (in this directory) and, through its path requires, the base packages (`Base.Canon`
# and what it imports; `Base.JsonParse`, the JSON parser's port). The annotation port's test builds `annot-difftest`,
# which reads `Circuits.Annot`, `Circuits.AnnotExpand` and what they import (`verity_difftest.annot.INPUTS`), and holds
# it to `verity.circuits.query_ast`. The protocol-mode tests build the core protocol interface's example
# (`core-protocol-example`) and the canonical reader's port (`core-canonical-json-difftest`), which read the interface
# package and, of Flock's verifier, which it requires by path, the
# package's configuration, the names it imports the base modules by (`Flock.Bytes`, `Flock.Canon`, `Flock.Hash`) and
# the packages that one requires.
inputs = ["verity/protocols/interface", "verity/protocols/proofs/flock/verifier/lakefile.toml", "verity/protocols/proofs/flock/verifier/lake-manifest.json",
          "verity/protocols/proofs/flock/verifier/lean-toolchain", "verity/protocols/proofs/flock/verifier/Flock/Bytes.lean",
          "verity/protocols/proofs/flock/verifier/Flock/Canon.lean", "verity/protocols/proofs/flock/verifier/Flock/Hash.lean",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "verity/__init__.py", "verity/circuits",
          # the JSON parser's port reads the recorded public files' headers (`RECORDED_FIXTURES`), fetched fixtures
          "tests/verity/protocols/proofs/flock/prover/fixtures/forged-proofs", "tests/verity/protocols/proofs/flock/prover/fixtures/public-inputs",
          "tests/verity/protocols/proofs/flock/prover/fixtures/public-inputs-blocks", "tests/verity/protocols/proofs/flock/prover/fixtures/rec-coins",
          "tests/verity/protocols/proofs/flock/prover/fixtures/rec-links", "tests/verity/protocols/proofs/flock/prover/fixtures/zk-sessions",
          "verity/protocols/__init__.py",
          # the JSON parser's port reads the JSON the verifiers' tests hold (`VERIFIER_FIXTURES`), which `Core.canonicalJson` reads
          "tests/verity/protocols/resource_accounting/network/verifier/network/fixtures", "tests/verity/protocols/resource_accounting/network/verifier/fixtures",
          "tests/verity/protocols/resource_accounting/memory/poub/verifier/fixtures", "verity/protocols/resource_accounting/memory/poub/verifier/vectors.json",
          "tests/verity/protocols/resource_accounting/memory/pous/verifier/fixtures", "tests/verity/protocols/resource_accounting/compute/pouw/verifier/vectors",
          "tests/verity/protocols/proofs/recursion/verifier/zk_server/fixtures",
          "tests/verity/protocols/proofs/flock/prover/fixtures/inner-trees-served", "tests/verity/protocols/proofs/spot/verifier/fixtures"]
