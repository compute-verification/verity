# The import order: the tree's directories, and files listed on their own, bottom first.  A file belongs to its own entry
# where it has one, else to the deepest directory listed here above it, "." holding the rest, and loads only what its
# own row or an earlier row holds: a Python import (at load, inside a function, or a module named in a string), a Lean
# import, a Lake package required by path.  A Python load is read by name; a load by file is read only into
# `benchmarks/`.  The entries of one row may load each other.
# `tests/test_boundaries.py` reads this file and nothing else for the order, for "a verifier loads no prover code", for
# the distributions of their own under `verity/`, and for which place of `verity` may import which (`place`, below).
# Tests are no loaders, except into the last row.  `infra`, the last, is loaded by no other row.
#
# A new directory under `verity/` is in its parent's row until it is listed here.
#
# The order, the distributions and each place's `paths` and `trusted` mark are kept by hand.  The tables after them are
# the tree's own, written by `uv run tools/check/import_order.py`, and the test holds this file to what it writes.

order = [
    ["tools/config", "verity"],
    ["verity/circuits"],
    ["tools/difftest"],
    ["verity/commitments"],
    ["verity/protocols/proof/flock/verifier"],
    ["verity/protocols/interface"],
    ["verity/circuits/call_scope.py", "verity/circuits/cross_call.py", "verity/circuits/tiny.py", "verity/circuits/word.py"],
    ["verity/channel.py", "verity/config.py", "verity/party.py", "verity/protocol.py", "verity/runtime"],
    ["verity/device.py"],
    ["verity/protocols/accounting/scheme.py"],
    ["verity/commitments/periods"],
    ["verity/protocols/proof/spot"],
    ["verity/protocols/proof/flock"],
    ["verity/protocols/proof/recursion"],
    ["verity/protocols/proof/spot_flock"],
    ["verity/protocols/proof/spot_flock_recursion"],
    ["verity/protocols/registration"],
    ["verity/protocols/accounting/memory/pous", "verity/protocols/accounting/memory/wipe"],
    ["verity/protocols/accounting/memory/poub"],
    ["verity/protocols/accounting/compute/pouw"],
    ["verity/protocols/experimental"],
    ["verity/protocols/policy/training_detection/inference_only"],
    ["verity/protocols/accounting/network"],
    ["verity/protocols/run/verifier"],
    ["verity/protocols/run/verifier/onsite"],
    ["verity/protocols/run"],
    ["security"],
    ["library/datasets"],
    ["adapters"],
    ["tools"],
    ["applications"],
    ["benchmarks", "calibration"],
    [".", "tests"],
    ["infra"],
]

# The directories under `verity/` with an import root of their own: each is a distribution of its own, which `verity`
# never loads by name, a verifier least of all.  A directory covers the files of its own row under it, so
# `verity/protocols/proof/flock` leaves out `verity/protocols/proof/flock/verifier`.  Each entry names its owner and exactly one of
# the date it becomes part of `verity`, held to `verity`'s rules, and the reason it stays a distribution of its own; the
# entries that still name neither are `NO_DATE_OR_REASON` in the test, which only shrinks.  This list only shrinks too:
# a directory under `verity/` that is not listed here is `verity`'s.
[[distribution]]
directory = "verity/protocols/proof/flock"
owner = "proofs"
reason = "Flock's distribution (`verity_flock`) and its verifier's scripts"

[[distribution]]
directory = "verity/protocols/accounting/memory/pous/verifier/check"
owner = "memory-accounting"
reason = "the PoUS Lean check (`pous-verifier`), whose Python is run by path beside `benchmarks/pous`: its difftest generator, which its `lean-audit.json` runs, and `interop.py`, which holds it to the wire's Python reference through `verity_difftest`"

[[distribution]]
directory = "verity/protocols/accounting/memory/poub/prover"
owner = "memory-accounting"
reason = "PoUB's prover, which runs on a GPU through torch, which `verity` never imports: loaded by path under its own names (`prover`, `device`, `kv`, `paged`) by the vLLM adapter and by its harness in `benchmarks/`; the session's prover party (`session_prover.py`), which only tests load by name; and the honest provers, the period's prover side and the P2 session's (`audit_prover.py`, `p2_prover.py`, `period_prover.py`, `opening_prover.py`, `p2_party_prover.py`), which tests, `benchmarks/` and the vLLM adapter load by name; and the P2 session's staging (`p2_stage/`: `bandwidth.py`, run as a script, and the `stage` and `layout` it loads), which `benchmarks/` loads by path under those names"
known = ["verity/protocols/accounting/memory/poub/scheme.py"]
known_reason = "PoUB's declaration hands the prover out by name (`PROVER`): its binder to `POUB.attach` and its process `poub-session`, each module imported on its first use, on the machine that serves, so that an adapter gets the prover through the scheme and imports no protocol; importing the declaration loads none of it"

[[distribution]]
directory = "verity/protocols/accounting/memory/pous/prover/p2"
owner = "memory-accounting"
reason = "PoUS's P2 prover, which runs on a GPU through torch, which `verity` never imports: loaded by path as the package `p2_store` by PoUS's `weight_store` (whose tensors are its `tensors.py`), the vLLM adapter and its harness in `benchmarks/`"

[[distribution]]
directory = "verity/protocols/run/verifier/live_challenger"
owner = "proofs"

[[distribution]]
directory = "verity/protocols/accounting/memory/poub/attester/live_verifier"
owner = "memory-accounting"

[[distribution]]
directory = "verity/protocols/accounting/compute/pouw/prover/clear"
owner = "compute-accounting"

[[distribution]]
directory = "verity/protocols/accounting/compute/pouw/prover/lowering"
owner = "compute-accounting"
reason = "H1's lowering (`h1unit.py`) runs Flock's staging (`verity_flock`) for the KnownRows difftest's writer (`benchmarks/pouw/h1_lanes/leaf.py`); goes with H1's Lean change"

[[distribution]]
directory = "verity/protocols/accounting/compute/pouw/verifier/receipts"
owner = "compute-accounting"

# One form opens a trusted place's `loaded_by`: a scheme's declaration is the one file that by design names its verifier
# and states its parties, so a scheme's `scheme.py`, and no other file of that scheme, may load two trusted places: its
# own verifier's, and the one that holds the parties' types (`verity/protocol.py`).  That is at most two lines a scheme.
#
# A Python script under a Lean package's `lean/` directory is run by path and decides no verdict: it is in no place,
# nothing loads it, and it may load the Python it holds the Lean to.

# The ties against the order: for a pair of rows, the first listed before the second, each file of the first that loads a
# file of the second.  It only shrinks: the test refuses a file not listed here (cut the tie instead: move what the
# loader needs down to its row or an earlier one, or pass it in), a listed file that no longer loads the later row, and
# a pair no file needs any more, which it names to delete.
