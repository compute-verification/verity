[[against]]
loader = "verity/protocols/certifier/verifier"
loaded = "verity/protocols/certifier/prover"
ties = [
    ["verity/protocols/certifier/verifier/network_traces/chain_record.py", "verity/protocols/certifier/prover/__init__.py"],
    ["verity/protocols/certifier/verifier/network_traces/chain_record.py", "verity/protocols/certifier/prover/ingress_scan.py"],
    ["verity/protocols/certifier/verifier/network_traces/leak_bounds.py", "verity/protocols/certifier/prover/__init__.py"],
    ["verity/protocols/certifier/verifier/network_traces/leak_bounds.py", "verity/protocols/certifier/prover/ingress_scan.py"],
