# What each verifier's and each device's Python loads, and what loads it, by `verifier/` or `device/` directory under
# `verity/`: `loads`, the places outside it that its files load; `reaches`, the places those load in turn, and so on;
# `loaded_by`, the Python files under `verity/` outside every verifier and device that load it, tests included.  A
# place is another entry of this table, or outside them the directory one level below a row (the row, for a file
# directly in it).  Where a directory holds two things that were held apart before they shared it, a file or a
# sub-directory of it is an entry of its own, and the directory's entry is the rest: `verity/spot/verifier` beside its
# `profile.py`, PoUS's part of `verity/protocols/pous/device` beside the memory challenger's two files, the remote
# bandwidth audit beside `commitments`, the opening check of the store.  A load between two entries of one directory
# is then held as any other.  Until a protocol's Lean verifier decides its verdicts, `reaches` is the soundness path of
# its Python verifier.  All three only shrink: the test refuses a place or a file the tree adds and one it no longer
# has.
