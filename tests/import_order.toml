[[against]]
loader = "verity/protocols/pous"
loaded = "Security"
ties = [
    ["verity/protocols/pous/lean/submissions/reference.lean", "Security/Proofs/Pous/Statements.lean"],
]

# What each verifier's Python loads, by `verifier/` directory under `verity/`: `loads`, the places outside it that its
# files load, and `reaches`, the places those load in turn, and so on.  A place is a protocol's `verifier/`, `prover/` or
# `device/` directory, or the row of a file under none.  Until a protocol's Lean verifier decides its verdicts these are
# the soundness path of its Python verifier.  Both only shrink: the test refuses a place the tree adds and a place
# nothing reaches any more.
[[verifier]]
directory = "verity/protocols/certifier/verifier"
loads = ["verity", "verity/circuits", "verity/commitments", "verity/windows", "verity/spot/device",
    "verity/spot/verifier", "verity/protocols/pous/verifier", "verity/protocols/certifier/device",
    "verity/protocols/certifier/prover", "benchmarks"]
reaches = ["verity", "verity/circuits", "verity/commitments", "verity/definitions", "verity/configuration",
    "verity/hardware", "verity/windows", "verity/spot/device", "verity/spot/verifier", "verity/flock",
    "verity/flock/prover", "verity/protocols/pous/device", "verity/protocols/pous/verifier",
    "verity/protocols/poub/verifier", "verity/protocols/pouw/prover", "verity/protocols/pouw/verifier",
    "verity/protocols/certifier/device", "verity/protocols/certifier/prover", "integrations", "benchmarks"]

[[verifier]]
directory = "verity/protocols/poub/verifier"
loads = ["verity", "verity/circuits", "verity/commitments", "verity/configuration", "verity/spot/device",
    "verity/spot/verifier", "verity/protocols/pous/device", "verity/protocols/pous/verifier"]
reaches = ["verity", "verity/circuits", "verity/commitments", "verity/configuration", "verity/hardware",
    "verity/spot/device", "verity/spot/verifier", "verity/protocols/pous/device", "verity/protocols/pous/verifier"]

[[verifier]]
directory = "verity/protocols/pous/verifier"
loads = ["verity", "verity/difftest", "verity/commitments", "verity/configuration", "verity/protocols/pous/device"]
reaches = ["verity", "verity/difftest", "verity/commitments", "verity/configuration", "verity/protocols/pous/device"]

[[verifier]]
directory = "verity/protocols/pouw/verifier"
loads = ["verity", "verity/circuits", "verity/commitments", "verity/spot/device", "verity/spot/verifier"]
reaches = ["verity", "verity/circuits", "verity/commitments", "verity/hardware", "verity/spot/device",
    "verity/spot/verifier"]

[[verifier]]
directory = "verity/spot/verifier"
loads = ["verity", "verity/circuits", "verity/commitments", "verity/configuration", "verity/spot/device"]
reaches = ["verity", "verity/circuits", "verity/commitments", "verity/configuration", "verity/hardware",
    "verity/spot/device"]
