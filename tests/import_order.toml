# The import order: the tree's directories, bottom first.  A file belongs to the deepest directory listed here above it,
# "." holding the rest, and loads only what its own row or an earlier row holds: a Python import (at load, inside a
# function, or a module named in a string), a Lean import, a Lake package required by path.  A Python load is read by
# name; a load by file is read only into `benchmarks/`.  The directories of one row may load each other.  `tests/test_boundaries.py` reads this file and nothing else for the order, for "a verifier loads
# no prover code", for the distributions of their own under `verity/`, and for what a verifier's or a device's Python
# loads and what loads it.  Tests are no loaders, except into the last row.  `infra`, the last, is loaded by no other
# row.
#
# A new directory under `verity/` is in its parent's row until it is listed here.

order = [
    ["fixtures", "verity"],
    ["verity/circuits"],
    ["verity/difftest"],
    ["verity/commitments"],
    ["verity/protocols/flock/verifier"],
    ["verity/protocols/interface"],
    ["verity/definitions"],
    ["verity/configuration"],
    ["verity/hardware"],
    ["verity/commitments/windows"],
    ["verity/protocols/spot"],
    ["verity/protocols/flock"],
    ["verity/protocols/recursion"],
    ["verity/protocols/pous"],
    ["verity/protocols/poub"],
    ["verity/protocols/pouw"],
    ["verity/protocols/inference_only"],
    ["verity/protocols/certifier"],
    ["verity/protocols/remote"],
    ["verity/protocols/onsite"],
    ["verity/composite"],
    ["security"],
    ["adapters"],
    ["tools"],
    ["demos"],
    ["benchmarks"],
    [".", "tests"],
    ["infra"],
]

# The directories under `verity/` with an import root of their own: each is a distribution of its own, which `verity`
# never loads by name, a verifier least of all.  A directory covers the files of its own row under it, so
# `verity/protocols/flock` leaves out `verity/protocols/flock/verifier`.  Each entry names its owner and exactly one of
# the date it becomes part of `verity`, held to `verity`'s rules, and the reason it stays a distribution of its own; the
# entries that still name neither are `NO_DATE_OR_REASON` in the test, which only shrinks.  This list only shrinks too:
# a directory under `verity/` that is not listed here is `verity`'s.
[[distribution]]
directory = "verity/protocols/flock"
owner = "proofs"
reason = "Flock's distribution (`verity_flock`) and its verifier's scripts"

[[distribution]]
directory = "verity/difftest"
owner = "proofs"
reason = "the differential test of the Lean against its Python (`verity_difftest`, which their tests import, on Hypothesis)"

[[distribution]]
directory = "verity/protocols/pous/verifier/check"
owner = "memory-accounting"
reason = "the PoUS Lean check (`pous-check`), whose Python is run by path beside `benchmarks/pous`: its difftest generator, which its `lean-audit.json` runs, and `interop.py`, which holds it to the wire's Python reference through `verity_difftest`"

[[distribution]]
directory = "verity/configuration/config"
owner = "ci"

[[distribution]]
directory = "verity/protocols/inference_only/rho"
owner = "training"
date = "2026-11-16"

[[distribution]]
directory = "verity/protocols/inference_only/nci"
owner = "compute-accounting"

[[distribution]]
directory = "verity/composite/device/live_challenger"
owner = "proofs"

[[distribution]]
directory = "verity/protocols/poub/device/live_verifier"
owner = "memory-accounting"

[[distribution]]
directory = "verity/protocols/pouw/clear"
owner = "compute-accounting"

[[distribution]]
directory = "verity/protocols/pouw/receipts"
owner = "compute-accounting"

# The ties against the order: for a pair of rows, the first listed before the second, each file of the first that loads a
# file of the second.  It only shrinks: the test refuses a file not listed here (cut the tie instead: move what the
# loader needs down to its row or an earlier one, or pass it in), a listed file that no longer loads the later row, and
# a pair no file needs any more, which it names to delete.
