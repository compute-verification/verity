# The import order: the tree's directories, bottom first.  A file belongs to the deepest directory listed here above it,
# "." holding the rest, and loads only what its own row or an earlier row holds: a Python import (at load, inside a
# function, or a module named in a string), a Lean import, a Lake package required by path.  The directories of one row
# may load each other.  `tests/test_boundaries.py` reads this file and nothing else for the order, for "a verifier loads
# no prover code", for the distributions of their own under `verity/`, and for what a verifier's or a device's Python
# loads and what loads it.  Tests are no loaders, except into the last row.  `archive` is loaded by no live row, and
# `infra`, the last, by no other row.
#
# A new directory under `verity/` is in its parent's row until it is listed here.

order = [
    ["fixtures", "verity"],
    ["verity/flock/verifier"],
    ["verity/difftest"],
    ["verity/circuits"],
    ["verity/commitments"],
    ["verity/definitions"],
    ["verity/configuration"],
    ["verity/hardware"],
    ["verity/windows"],
    ["verity/spot"],
    ["verity/flock"],
    ["verity/protocols/pous"],
    ["verity/protocols/poub"],
    ["verity/protocols/pouw"],
    ["verity/protocols/inference_only"],
    ["verity/protocols/certifier"],
    ["verity/composite"],
    ["Security"],
    ["integrations"],
    ["tools"],
    ["workloads"],
    ["benchmarks"],
    [".", "tests"],
    ["archive"],
    ["infra"],
]

# The directories under `verity/` with an import root of their own: each is a distribution of its own, which `verity`
# never loads, a verifier least of all.  A directory covers the files of its own row under it, so `verity/flock` leaves
# out `verity/flock/verifier`.  Each entry names its owner and either the date it becomes part of `verity`, held to
# `verity`'s rules, or the reason it stays a distribution of its own.  It only shrinks: a directory under `verity/`
# that is not listed here is `verity`'s.
[[distribution]]
directory = "verity/flock"
owner = "proofs"
reason = "Flock's distribution (`verity_flock`) and its verifier's scripts"

[[distribution]]
directory = "verity/difftest"
owner = "proofs"
reason = "the differential test of the Lean against its Python (`verity_difftest`, which their tests import, on Hypothesis)"

[[distribution]]
directory = "verity/protocols/pous/verifier/check"
owner = "memory-accounting"
reason = "the PoUS Lean check (`pous-check`), whose Python is run by path beside `benchmarks/pous`: its difftest generator, which its `lean-audit.json` runs, and `interop.py`, which holds it to the wire's Python reference through `verity_difftest`"

[[distribution]]
directory = "verity/configuration/config"
owner = "ci"

[[distribution]]
directory = "verity/protocols/inference_only/rho"
owner = "training"

[[distribution]]
directory = "verity/protocols/inference_only/nci"
owner = "compute-accounting"

[[distribution]]
directory = "verity/composite/device/live_challenger"
owner = "proofs"

[[distribution]]
directory = "verity/protocols/poub/device/live_verifier"
owner = "memory-accounting"

[[distribution]]
directory = "verity/protocols/pouw/clear"
owner = "compute-accounting"

# The ties against the order: for a pair of rows, the first listed before the second, each file of the first that loads a
