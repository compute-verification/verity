# The repository's layout of record, which tests/test_tree.py holds the tracked tree to at five levels: the root,
# verity/, verity/protocols/, each group's directory there and each protocol's directory.
#
# [[tree]] is the tree: each entry's path and what it means.  An entry the tree has and main doesn't hold yet carries
# the owner who brings it and the day, which top drops once it lands.  `protocol = true` marks the protocols,
# and the `verity/protocols/NAME/` entries say what each of their directories may hold; a group is a directory of
# verity/protocols/ that holds protocols, and the `verity/protocols/GROUP/` entries say what else it may hold.  The
# shape is not changed here without asking top.
#
# [[not_yet]] is what main holds and the tree doesn't: each path, where it goes (`to`), its owner and the day.  A day
# is a date, 6 PM PST on it unless it gives a time.  A move that lands leaves its line for top to delete: the stale
# line only warns, as bookkeeping, and the metric counts it until then.  A move needn't edit this file; a new stray
# entry still fails.  An owner of "unowned" waits for top to assign the line; its place and day may be "unowned" too.  `arriving = true` marks a path
# an admitted change brings that main doesn't hold yet.  The list only shrinks: test_tree.py holds its length.
#
# [[open]] is what is not ruled: the question, who answers it and by when.

# ---- the root ------------------------------------------------------------------------------------------------------

