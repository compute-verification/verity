# The served window under remote's subprotocols (verity/remote/v1): SPOT, PoUW's Pearl+ run verdict and the
# inference-only policy. No auditor's device is at the site: the developer's parties are on the prover node
# and the auditor's on its own machine. `verity run THIS --dry-run` resolves every party.
format = "verity/config/v0"
protocols = ["sampled-proofs", "pearl-plus", "inference-only"]

[workload]
name = "served-window"

[workload.params]
model = "unsloth/Llama-3.2-1B"
revision = "9535bd9b1d1dea6acafbdc4813b728796aeb28da"
precision = "bfloat16"
slots = 4
window-steps = 2
load = "fixed"

[service]
law = "rate:1/3481648"

[program]
commit = "b041d20d6f80892ab43dc88994e41c9f4b3a4002"

[params."verity/pouw/pearl-plus/v1"]
class = "4,27,2"
tie-uniform = true

[[party]]
name = "workers"
machine = "prover-node"
principal = "developer"

[[party]]
name = "challenger"
machine = "auditor-remote"
principal = "auditor"

[[party]]
name = "firewall"
machine = "prover-node"
principal = "developer"

[[party]]
name = "verifier"
machine = "auditor-remote"
principal = "auditor"

[[channel]]
from = "challenger"
to = "verifier"
messages = ["Challenger"]

[[channel]]
from = "verifier"
to = "challenger"
messages = ["Done"]

[[channel]]
from = "firewall"
to = "verifier"
messages = ["Firewall"]

[[channel]]
from = "workers"
to = "verifier"
messages = ["Registration"]

[[channel]]
from = "challenger"
to = "workers"
messages = ["PearlSalt"]
