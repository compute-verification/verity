[project]
name = "verity"
version = "0.1.0"
description = "Verity core: IR (computation representation), exact ML/hardware semantics, verification obligations, commitments, resource accounting."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]
