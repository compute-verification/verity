[project]
name = "verity"
version = "0.1.0"
description = "Verity core: IR (programs, partitions), the evaluator, exact tensor-core semantics, challenge randomness, single statements and integrity profiles, commitment schemes, claim ids."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]
