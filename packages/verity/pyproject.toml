[project]
name = "verity"
version = "0.1.0"
description = "Verity core: IR (programs, partitions), the evaluator, exact tensor-core semantics, challenge randomness, single statements and integrity profiles, commitment schemes, claim ids."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "verity-primitives-circuits"]

[tool.uv.sources]
verity-primitives-circuits = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests/proofs/test_tc_probe_families.py imports the tensor-core probe's tile generation (tools/tc_probe/tc_probe.py),
# and the tests read the repository's fixtures and census. tests/proofs/test_discrepancy_log.py checks that each evidence ref in
# fixtures/discrepancy_log.json exists, which the guard can't see, so every ref outside the paths above is listed here (its
# test_every_evidence_path_is_an_input_of_this_suite fails on one that isn't).
inputs = ["census", "fixtures/discrepancy_log.json", "fixtures/hawkeye", "fixtures/tc", "fixtures/typed-obligation-v0", "tools/tc_probe",
          "backends/numerical/python/verity_numerical/reference/hawkeye_close.py",
          "backends/numerical/tests/checker/test_fp8.py",
          "backends/numerical/tests/reference/hawkeye_harness.cpp",
          "backends/numerical/tests/reference/test_hawkeye_close.py",
          "backends/numerical/tests/reference/test_normalisation_d3.py",
          "tools/tc_probe_fp4/probe.py"]
parallel = true
