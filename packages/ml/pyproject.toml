[project]
name = "verity-ml"
version = "0.1.0"
description = "Exact hardware semantics of ML primitives (tensor-core accumulator steps, casts) and their IR registrations."
requires-python = ">=3.11"
dependencies = ["verity-ir"]

[tool.uv.sources]
verity-ir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_ml"]
