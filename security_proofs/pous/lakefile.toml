name = "security_proofs_pous"
defaultTargets = ["Pous"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[require]]
name = "pous"
path = "../../protocols/pous/lean"

# The proofs of `protocols/pous/lean`'s guarantees and every lemma behind them, untrusted: the spec's lock says what they prove. Named by
# globs, not roots: a root is a prefix of the spec's module names, and Lake would look for those modules here too.
[[lean_lib]]
name = "Pous"
roots = []
globs = ["Pous", "Pous.SecurityProofs", "Pous.SecurityProofs.Audit.SampledAudit", "Pous.SecurityProofs.B5.ExPostFacto", "Pous.SecurityProofs.B5.StackedOneWay", "Pous.SecurityProofs.Chain.Family", "Pous.SecurityProofs.Chain.FamilyRounds", "Pous.SecurityProofs.Chain.Flat", "Pous.SecurityProofs.Chain.PubFamily", "Pous.SecurityProofs.Chain.PubRounds", "Pous.SecurityProofs.Continuous.*", "Pous.SecurityProofs.Dense.DenseMeets", "Pous.SecurityProofs.Dense.DenseReCert", "Pous.SecurityProofs.Dense.SegTagged", "Pous.SecurityProofs.Graded.Band", "Pous.SecurityProofs.Graded.Tail", "Pous.SecurityProofs.Graded.Theorem", "Pous.SecurityProofs.P2.Count", "Pous.SecurityProofs.P2.Domain", "Pous.SecurityProofs.P2.Margin", "Pous.SecurityProofs.P2.RingBasic", "Pous.SecurityProofs.P2.RingTight", "Pous.SecurityProofs.P2.RingTrunc", "Pous.SecurityProofs.P2.Rows", "Pous.SecurityProofs.P3.Column.BandComb", "Pous.SecurityProofs.P3.Column.BandTwoWay", "Pous.SecurityProofs.P3.Column.BandWeights", "Pous.SecurityProofs.P3.Column.TwoWay", "Pous.SecurityProofs.P3.InvertibleCore", "Pous.SecurityProofs.P3.Refutation", "Pous.SecurityProofs.Pebbling.B1IndepSet", "Pous.SecurityProofs.Pebbling.B2Stacking", "Pous.SecurityProofs.Pebbling.B3Chain", "Pous.SecurityProofs.Pebbling.FischClaims1314", "Pous.SecurityProofs.Rebuild.Clock", "Pous.SecurityProofs.Rebuild.Exclusion", "Pous.SecurityProofs.Rebuild.Window", "Pous.SecurityProofs.SecureErasure.*", "Pous.SecurityProofs.Thm1.Theorem1iTimed", "Pous.SecurityProofs.Thm1.Theorem1ii", "Pous.SecurityProofs.Thm1.Theorem1iiSeq", "Pous.SecurityProofs.Thm1.Theorem1iiTimed", "Pous.SecurityProofs.Thm1.Theorem1iiiTimed", "Pous.SecurityProofs.TrackA.A1Compression", "Pous.SecurityProofs.TrackA.A3Prime", "Pous.SecurityProofs.TrackA.A6Rederive", "Pous.SecurityProofs.TrackA.FibreCount"]
