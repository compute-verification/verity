name = "security_proofs_pouw"
defaultTargets = ["Pouw"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[require]]
name = "pouw"
path = "../../protocols/pouw/lean"

# The proofs of `protocols/pouw/lean`'s guarantees and every lemma behind them, untrusted: the spec's lock says what they prove. Named by
# globs, not roots: a root is a prefix of the spec's module names, and Lake would look for those modules here too.
