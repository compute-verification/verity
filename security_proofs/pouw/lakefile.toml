name = "security_proofs_pouw"
defaultTargets = ["PouwProofs"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[require]]
name = "pouw"
path = "../../protocols/pouw/lean"

# The proofs of the spec's guarantees and every lemma behind them, untrusted: the spec's lock says what they
# prove. Their modules take a root of their own (PouwProofs), since Lean loads a module from the first search-path
# entry with a directory for its root; declarations keep their namespaces.
[[lean_lib]]
name = "PouwProofs"
