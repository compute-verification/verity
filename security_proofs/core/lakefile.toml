name = "security_proofs_core"
defaultTargets = ["Verity"]

[leanOptions]
autoImplicit = false

# The one Mathlib revision every Lake package in the tree builds with (`tests/test_lean_packages.py`).

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

# Verity core's Lean: the model every protocol states its guarantees in (circuits, partitions, declarations, games),
# under the four names (`Protocol`, `Assumptions`, `Guarantees`, `SecurityProofs`), and statements about `verity`'s own
# definitions (`verity.ml.tc`).

[[require]]
name = "verity"
path = "../../packages/verity/lean"

# The proofs of `packages/verity/lean`'s guarantees and every lemma behind them, untrusted: the spec's lock says what they prove. Named by
# globs, not roots: a root is a prefix of the spec's module names, and Lake would look for those modules here too.
[[lean_lib]]
name = "Verity"
roots = []
globs = ["Verity", "Verity.SecurityProofs", "Verity.SecurityProofs.Boolean", "Verity.SecurityProofs.Circuit", "Verity.SecurityProofs.Fp32", "Verity.SecurityProofs.Game.*", "Verity.SecurityProofs.TC", "Verity.SecurityProofs.TC.Ampere.*", "Verity.SecurityProofs.TC.AmpereSound", "Verity.SecurityProofs.TC.Boundary", "Verity.SecurityProofs.TC.Gadgets", "Verity.SecurityProofs.TC.Proofs.*", "Verity.SecurityProofs.TC.Sound"]
