[project]
name = "verity"
version = "0.1.0"
description = "Verity core: the circuits format and its evaluator, challenge randomness, commitments and crypto, and the protocols (verification, accounting, compliance)."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# torch from the PyTorch CPU index, for CPU machines and `check`: about 0.2 GB, where the members' `torch` extras take PyPI's
# CUDA build (about 3 GB). The two conflict, so a command names the one it wants.
torch-cpu = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Exact mode serves `verity` alone from the tree (it needs `editables`, in the dev group); plain editable mode would put the
# repository's root on every sys.path, and with it every top-level directory as an import name.
packages = ["verity"]
dev-mode-exact = true
exclude = ["verity/**/tests", "verity/**/pyproject.toml"]

[tool.hatch.build.targets.sdist]
only-include = ["verity"]
exclude = ["verity/**/tests", "verity/**/pyproject.toml"]

[tool.uv]
conflicts = [
    [{ extra = "torch-cpu" }, { package = "verity-vllm", extra = "torch" }],
    [{ extra = "torch-cpu" }, { package = "verity-native-peak", extra = "torch" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["tools/research", "tests/tools/research", "tools/config", "tests/tools/config", "infra/cluster", "tests/infra/cluster", "infra/ops", "tests/infra/ops", "benchmarks/numerical", "tests/benchmarks/numerical", "benchmarks/harness", "tests/benchmarks/harness", "adapters/vllm", "tests/adapters/vllm/tests", "tests/infra/slack-events", "verity/protocols/proofs/flock/prover", "tests/verity/protocols/proofs/flock/prover", "tools/verity/circuit_check", "tests/tools/verity/circuit_check", "tools/check", "tests/tools/check", "tests/tools/verity/lean", "tests/benchmarks/native_peak", "tests/benchmarks/tc_probe", "tests/benchmarks/tc_probe_fp4", "tests/benchmarks/commitments", "tests/benchmarks/pouw", "benchmarks/machine_model", "tests/benchmarks/machine_model", "tests/benchmarks/network_traces", "tests/benchmarks/network_e2e", "tests/benchmarks/attester_timing", "tools/verity/cli", "tests/tools/verity/cli", "tools/verity/graph", "tests/tools/verity/graph", "tools/difftest", "tests/tools/difftest", "tests/verity/protocols/resource_accounting/memory/pous/verifier/check", "tests/verity/commitments/identity", "tests/verity/protocols/compose/verifier/lean", "tests/verity/circuits/evaluate", "tests/verity/protocols/proofs/recursion/verifier/zk_server", "tests/verity/protocols/proofs/spot/verifier/lean", "tests/verity/protocols/resource_accounting/compute/pouw/verifier/lean/window", "tests/verity/protocols/resource_accounting/compute/pouw/verifier/lean/check", "tests/verity/protocols/resource_accounting/memory/pous/attester/lean", "benchmarks/pouw/exact_kit", "tests/benchmarks/pouw/exact_kit", "benchmarks/proof_throughput", "tests/benchmarks/proof_throughput", "tests/benchmarks/harness/specs", "adapters/torch", "tests/adapters/torch/tests"]
exclude = ["infra/slack-events/service"]               # a Vercel project's root, which Vercel installs on its own

[tool.uv.sources]
research = { workspace = true }
verity-config = { workspace = true }
verity-ops = { workspace = true }
cluster = { workspace = true }
verity = { workspace = true }
verity-numerical = { workspace = true }
verity-bench = { workspace = true }
verity-vllm = { workspace = true }
verity-flock = { workspace = true }
verity-circuit-check = { workspace = true }
torch = { index = "pytorch-cpu", extra = "torch-cpu" }
verity-cli = { workspace = true }
verity-graph = { workspace = true }
verity-difftest = { workspace = true }
verity-exact-kit = { workspace = true }
verity-proof-throughput = { workspace = true }
verity-torch = { workspace = true }
verity-machine-model = { workspace = true }

[dependency-groups]
# pyyaml: the tests of node 1's dispatcher and pack pilot (research/pods/nebius), which render Job templates with it on the
# node's own venv; without it those test modules skip. Not a dependency of `research`, which stays stdlib only. editables:
# hatch's exact editable mode, which uv doesn't install by itself. ruff and mypy: the ruff baselines, adapters/vllm's
# (tests/adapters/vllm/tests/lint/test_ruff.py) and the rest of the tree's (tests/lint/test_repo_ruff.py), and the integration's
# type errors (tests/adapters/vllm/tests/lint/test_mypy.py), pinned because another version finds other things.
dev = ["editables>=0.5", "jsonschema>=4.26", "pytest>=8", "pytest-xdist>=3.6", "pyyaml>=6", "ruff==0.17.2", "mypy==1.20.2", "research", "verity-config", "cluster", "verity-ops", "verity-numerical", "verity-bench", "verity-vllm", "verity-flock", "verity-circuit-check", "verity", "numpy", "verity-cli", "verity-difftest", "verity-proof-throughput"]

[tool.pytest.ini_options]
# The repository's own suite: invariants of the whole tree. Every other directory with tests configures its own suite in its
# pyproject.toml; `uv run tools/check/suites.py` runs them all.
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
pythonpath = ["."]   # the repository root before tests/, whose tests/verity/ would otherwise shadow the `verity` package

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/lint/test_device_figures.py",
    "tests/lint/test_repo_env_reads.py",
    "tests/lint/test_repo_lane_text.py",
    "tests/lint/test_repo_retired_terms.py",
    "tests/lint/test_repo_ruff.py",
    "tests/lint/test_repo_silent_excepts.py",
    "tests/test_agent_guard_hook.py",
    "tests/test_benchmarks_index.py",
    "tests/test_boundaries.py",
    "tests/test_cli_conventions.py",
    "tests/test_doc_paths.py",
    "tests/test_documented_commands.py",
    "tests/test_domains.py",
    "tests/test_flock_json.py",
    "tests/test_flock_literals.py",
    "tests/test_gate_paths.py",
    "tests/test_glossary_lean_names.py",
    "tests/test_lean_packages.py",
    "tests/test_lean_vocabulary.py",
    "tests/test_literal_addresses.py",
    "tests/test_lowrisk_excludes.py",
    "tests/test_merge_drivers.py",
    "tests/test_module_strings.py",
    "tests/test_no_environment_in_asserts.py",
    "tests/test_no_wall_clock.py",
    "tests/test_one_translator.py",
    "tests/test_pins.py",
    "tests/test_protocol_specs.py",
    "tests/test_provider_names.py",
    "tests/test_pythonpath_entries.py",
    "tests/test_repository.py",
    "tests/test_retired_terms.py",
    "tests/test_seed_ports.py",
    "tests/test_shell_verifier_env.py",
    "tests/test_tree.py",
    "tests/test_verifier_cost.py",
    "tests/test_vllm_boundary.py",
    "tests/test_vllm_public_api.py",
    "tests/test_wipe_counted_callers.py",
]
inputs = [".", "AGENTS.md"]   # its lints read the docs: a listed `.md` keys its Markdown too (`suites.markdown`)
testpaths = ["tests", "tests/tools/research", "tests/infra/ops", "tests/benchmarks/native_peak", "tests/verity", "tests/benchmarks/numerical", "tests/verity/protocols/proofs/flock/prover", "tests/tools/verity/circuit_check", "tests/tools/verity/lean", "verity/protocols", "tests/verity/circuits/ops", "tests/benchmarks/pouw"]
markers = ["slow: full rechecks that take minutes (bench-instances full recheck); opt in with `--slow`"]
