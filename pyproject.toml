[project]
name = "verity-workspace"
version = "0.0.0"
description = "Verity monorepo root; a uv workspace, not a package."
requires-python = ">=3.12"
dependencies = ["research", "cluster", "verity", "verity-sp1", "verity-numerical", "verity-vllm", "verity-sampled-proofs", "verity-pous", "verity-network-warden", "verity-pouw", "verity-flock", "verity-circuit-check"]

[project.optional-dependencies]
# torch from the PyTorch CPU index, for CPU machines and `check`: about 0.2 GB, where the members' `torch` extras take PyPI's
# CUDA build (about 3 GB). The two conflict, so a command names the one it wants.
torch-cpu = ["torch>=2.4"]

[tool.uv]
package = false
conflicts = [
    [{ extra = "torch-cpu" }, { package = "verity-vllm", extra = "torch" }],
    [{ extra = "torch-cpu" }, { package = "verity-gkr", extra = "torch" }],
    [{ extra = "torch-cpu" }, { package = "verity-direct", extra = "torch" }],
    [{ extra = "torch-cpu" }, { package = "verity-native-peak", extra = "torch" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["tools/research", "tools/cluster", "packages/verity", "verity/primitives/circuits", "backends/sp1", "backends/numerical", "integrations/vllm", "protocols/sampled_proofs", "protocols/pous", "protocols/network_warden", "protocols/pouw", "backends/flock", "tools/circuit_check", "tools/check", "tools/lean", "tools/native_peak", "tools/tc_probe", "tools/tc_probe_fp4", "benchmarks/commitments", "backends/gkr", "backends/direct", "benchmarks/pouw", "benchmarks/network_traces"]

[tool.uv.sources]
research = { workspace = true }
cluster = { workspace = true }
verity = { workspace = true }
verity-primitives-circuits = { workspace = true }
verity-sp1 = { workspace = true }
verity-numerical = { workspace = true }
verity-vllm = { workspace = true }
verity-sampled-proofs = { workspace = true }
verity-pous = { workspace = true }
verity-network-warden = { workspace = true }
verity-pouw = { workspace = true }
verity-flock = { workspace = true }
verity-circuit-check = { workspace = true }
torch = { index = "pytorch-cpu", extra = "torch-cpu" }

[dependency-groups]
# pyyaml: the tests of node 1's dispatcher and pack pilot (research/pods/nebius), which render Job templates with it on the
# node's own venv; without it those test modules skip. Not a dependency of `research`, which stays stdlib only.
dev = ["jsonschema>=4.26", "pytest>=8", "pytest-xdist>=3.6", "pyyaml>=6"]

[tool.pytest.ini_options]
# The repository's own suite: invariants of the whole tree. Every other directory with tests configures its own suite in its
# pyproject.toml; `uv run tools/check/suites.py` runs them all.
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["."]
testpaths = ["tests", "tools/research/tests", "tools/native_peak/tests", "packages/verity/tests", "backends/sp1/tests", "backends/numerical/tests", "backends/gkr/tests", "backends/flock/tests", "tools/circuit_check/tests", "tools/lean/tests", "protocols", "benchmarks/pouw/tests"]
markers = ["slow: full rechecks that take minutes (bench-instances full recheck); opt in with `--slow`",
           "circuit_suite: one circuit-check target per test (tools/circuit_check); `check` runs these as `circuit-check --all`"]
