[project]
name = "verity-workspace"
version = "0.0.0"
description = "Verity monorepo root; a uv workspace, not a package."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-sp1", "verity-numerical", "verity-vllm", "verity-sampled-proofs", "verity-pous", "verity-one-stage", "verity-pouw", "verity-flock", "verity-circuit-check"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/research", "packages/verity", "backends/sp1", "backends/numerical", "integrations/vllm", "protocols/sampled_proofs", "protocols/pous", "protocols/one_stage", "protocols/pouw", "backends/flock", "tools/circuit_check", "tools/check", "tools/lean", "tools/native_peak", "tools/tc_probe", "benchmarks/commitments", "benchmarks/pouw", "backends/gkr", "backends/direct"]

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-sp1 = { workspace = true }
verity-numerical = { workspace = true }
verity-vllm = { workspace = true }
verity-sampled-proofs = { workspace = true }
verity-pous = { workspace = true }
verity-one-stage = { workspace = true }
verity-pouw = { workspace = true }
verity-flock = { workspace = true }
verity-circuit-check = { workspace = true }

[dependency-groups]
dev = ["jsonschema>=4.26", "pytest>=8"]

[tool.pytest.ini_options]
# The repository's own suite: invariants of the whole tree. Every other directory with tests configures its own suite in its
# pyproject.toml; `uv run tools/check/suites.py` runs them all.
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["."]
