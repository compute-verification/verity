# The full-utilization demo's rung on the ladder (examples/README.md, CMP-176): level 0, with no runner yet. Its placement is
# CMP-176's plan. Level 1 needs its run of record on the H200, the one that counts, and a run.sh that calls its runner once
# that runner is on main.
protocol = "pouw"
workload = "none"              # an 8B model's linear layers at M = 16,384, s8, on seeded weights registered before the coin
level = 0

[placement]
prover = "gpu-node"            # the demo H200 (vy-nebius-1's RTX PRO 6000 is the development rig)
challenger = "auditor-host"    # vy-challenger-1, a live session each period

[evidence]
