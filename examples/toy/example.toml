# The CPU toy's rung on the ladder (examples/README.md), placed where its run of record ran: every party of the one run on
# vy-nebius-cpu-4, the verifier's coins in-process on the prover's node (the report's gap 4). Level 2 needs the auditor's
# roles on auditor-host: the live-gate run (CMP-90, coins from vy-challenger-1) is cited here once #4726 and #4980 land.
protocol = "onsite"
workload = "torch_loop"
level = 1

[placement]
prover = "cpu-node"      # vy-nebius-cpu-4: the toy's loop and every prover side
store = "cpu-node"       # vy-nebius-cpu-4: PoUS's store and the wipe's
verifier = "cpu-node"    # vy-nebius-cpu-4: the Lean verifiers and onsite check, in the same run
challenger = "cpu-node"  # vy-nebius-cpu-4: in-process verifier coins, no gate
certifier = "cpu-node"   # vy-nebius-cpu-4: the network certifier beside the server

[evidence]
# S1's run of record (`run.sh --of-record --wired --windows 2 --tie-tamper 0`, from #4721, all on main at 54713f8166) and its
# run record: w0, one egress byte changed, rejected; w1, honest, accepted over all six subprotocols, onsite agreeing
runs = ["r20261026-161826-eb34", "art:2ea4be595bb673c6122718cf2995842c9240e0b5c2f671877aca1088de1ed1a9"]
