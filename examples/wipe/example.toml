# The streamed wipe's doneness (examples/README.md): run moved, proof none. Placed needs a run of record with every
# auditor role on an auditor host: the memory challenger through its gate (demo.sh --challenger) and the verdict judged
# there too (wipe.case.json replayed with wipe-protocol), not on the GPU node. Stated needs Pous.Guarantees.StreamedWipe
# with its honest and nontrivial lemmas in [evidence].
protocol = "pous"
workload = "none"
run = "moved"
proof = "none"

[placement]
prover = "gpu-node"          # the GPU whose memory is wiped (wipe_store.Cuda)
challenger = "auditor-host"  # wipe_party, through the auditor host's gate (--challenger)
verifier = "gpu-node"        # wipe_period's verdict, the Lean's and the Python's, on the prover's node
