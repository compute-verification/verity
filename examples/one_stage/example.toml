# The one-stage audit's doneness (examples/README.md). Runs needs a run of record through pod.sh, or a CPU test that runs a
# driver; placed needs the verifier and the challenger on auditor-host, off the pod the prover runs on.
protocol = "sampled_proofs"
workload = "vllm"
run = "moved"
proof = "none"

[placement]
prover = "cpu-node"      # pod.sh's CPU pod: M0, C-Flock's circuit prover
verifier = "cpu-node"    # the same pod: the verifier's draw and the Lean verifier (one_stage.verifier)
challenger = "cpu-node"  # the same pod: a local challenger's coins, or the verifier's own

[evidence]
