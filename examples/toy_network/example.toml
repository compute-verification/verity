# The toy network example's doneness (examples/README.md). Every party is on one CPU machine (config.toml's `local`), so
# placed needs the challenger, the network certifier and the verifier moved off it. Its proof is none: no guarantee is
# stated yet over the verdict the product composes.
protocol = ["sampled_proofs", "certifier"]
workload = "torch_loop"
run = "runs"
proof = "none"

[placement]
prover = "local"      # the workers and the firewall
verifier = "local"
challenger = "local"
certifier = "local"   # the network certifier

[evidence]
# `verity run` of a configuration `verity config new` wrote, two periods on vy-nebius-cpu-4 at fc8938eb47, both
# accepted (README.md)
runs = ["r20261027-064850-9e47"]
