# The toy's rung on the ladder (examples/README.md), placed where its run of record ran: every role on one CPU node
# (vy-nebius-cpu-4 and vy-nebius-cpu-5, parties.sh). Level 2 needs the verifier and the challenger on an auditor host.
protocol = "sampled_proofs"
workload = "torch_loop"
level = 1

[placement]
prover = "cpu-node"      # the workers and the firewall
verifier = "cpu-node"    # the Lean verifier and the product
challenger = "cpu-node"  # core parties.Challenger, hosted by benchmarks/one_stage/challenger_party.py

[evidence]
# parties.sh on 287319c1e6: honest accepted, tampered rejected, an absent certifier rejected by the product
# parties.sh on fe6fccf4cf (the deploy-core parties): the same three, and the four roles as four processes over TCP
# accepted
runs = ["r20261027-013034-fbf3", "r20261027-053345-b27b"]
