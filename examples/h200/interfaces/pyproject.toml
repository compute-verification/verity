# The E2E demo's interfaces (P-CMP-1, CMP-95 items 5 and 6). Not a package: the suite checks the drawn-unit replay bundle
# (`verity_e2e_demo.replay_bundle`) and the block record (`verity_e2e_demo.block_record`) against their schemas and
# fixtures, and builds a fresh bundle from the torch loop's window.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../../integrations/torch_loop"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: windows, commitments, the Definitions a unit replays and core's registered values.
# `integrations/torch_loop`: the window a fresh bundle is built from (`replay_bundle.torch_loop_window`).
inputs = ["verity", "integrations/torch_loop"]
