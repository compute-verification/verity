# The toy's integrity by sampled proofs: one run of the torch loop (integrations/torch_loop) audited by the proof service.
# `verity run examples/toy-network/config.toml --local` runs every role on this machine; on several,
# each machine runs `verity run CONFIG --party ROLE` for the roles placed on it. The roles are README.md's.
format = "verity/config/v0"
protocols = ["sampled-proofs"]

# The toy's shape: one decode step of one request of three tokens, a member at most `cap` units, one sampling block.
[workload]
name = "toy"
requests = [3]
steps = 1
cap = 8
blocks = 1

# The proof service's selection: a uniform subset of 8 members of each sampling block. What the draw establishes (the
# bound on wrong units at its δ) is the verdict's, never the configuration's.
[service]
law = "subset:8"

[[party]]
name = "workers"
machine = "prover-1"
principal = "prover"

[[party]]
name = "firewall"
machine = "prover-1"
principal = "prover"

[[party]]
name = "challenger"
machine = "auditor-1"
principal = "auditor"

[[party]]
name = "verifier"
machine = "auditor-1"
principal = "auditor"

# A sampling block's registration (its circuit, root and window) goes to the verifier before any coin is drawn.
[[channel]]
from = "workers"
to = "verifier"
messages = ["registration"]

# The verifier asks for the block's one session only after its registration is in: live coins, drawn after the commitment.
[[channel]]
from = "verifier"
to = "challenger"
messages = ["open", "finish"]
after = "registration"

# The session's coins, released to the verifier's client once the commitment is signed; then its signed record
# (commitment, releases, close), its ledger and pins log.
[[channel]]
from = "challenger"
to = "verifier"
messages = ["coins", "record"]
after = "open"

# The members the coins drew.
[[channel]]
from = "verifier"
to = "workers"
messages = ["draw"]
after = "coins"

# The drawn members' witnesses go to the firewall on the prover's own machine only (WitnessPathPrivate).
[[channel]]
from = "workers"
to = "firewall"
messages = ["witness"]
after = "draw"
private = true

# Each drawn member's zero-knowledge proof, one at a time, through the firewall.
[[channel]]
from = "firewall"
to = "verifier"
messages = ["proof"]
after = "draw"
