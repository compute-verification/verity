# The vLLM demo's level (examples/README.md): the remote protocol, sampled proofs and PoUW, on one sampling period of
# Llama-3.2-1B INT8 served by vLLM on vy-dc-h200's H200 (README.md), PoUW on the served model. Its run is moved: no run of
# record of the remote verdict has passed, since PoUW's verdict on the served run is a development run under the challenger's
# development key and credits nothing, and an H1 window isn't yet a verity/pouw/v1 case, so the composite can't accept. Its
# proof is none: sampled proofs' guarantee (Flock.Guarantees.SampledKSLiveV3) is proved, but no theorem yet carries it to
# Claims.Sampling.KS, which NetTiming.Guarantees.SampledAuditAccepted takes (benchmarks/prove_path/README.md); PoUW's proof
# layer needs AcceptedLive, which no served path meets; and remote's composed soundness isn't in Lean
# (verity/core/protocols/remote/README.md).
protocol = "remote"
workload = "vllm"
run = "moved"
proof = "none"

[placement]
endpoint = "gpu-node"                # vy-dc-h200's one H200
prover = "gpu-node"                  # the endpoint's node
challenger = "auditor-host"          # vy-challenger-1's gate: PoUW's coins, and sampled proofs' with PP_CHALLENGER
verifier = "gpu-node"                # NOT PLACED: the Lean verifier, on the endpoint's node
certifier = "gpu-node"               # NOT PLACED: the network certifier, onsite's, may run on the endpoint's node
memory_challenger = "gpu-node"       # NOT PLACED: PoUS's memory challenger, onsite's, may run on the endpoint's node

[evidence]
# empty until a run of record of the served H200 run passes the remote verdict
runs = []
