# The vLLM example's level (examples/README.md): the remote protocol's integrity half, sampled proofs, on a served vLLM
# sampling period (README.md). The next level needs the Lean verifier off the prover's node; its runs of record ran it on
# the GPU node with the endpoint and the prover. Its proof is none: sampled proofs' guarantee
# (Flock.Guarantees.SampledKSLiveV3) is proved, but no theorem yet carries it to Claims.Sampling.KS, which
# NetTiming.Guarantees.SampledAuditAccepted takes (benchmarks/prove_path/README.md).
protocol = "sampled_proofs"
workload = "vllm"
run = "runs"
proof = "none"

[placement]
endpoint = "gpu-node"        # one leased RTX PRO 6000
prover = "gpu-node"          # the endpoint's node
verifier = "gpu-node"        # the Lean verifier, on the endpoint's node
challenger = "auditor-host"  # the challenger's host, through its gate (PP_CHALLENGER)

[evidence]
# the workload's Commit of record (commit.sh), the serve run the audit of record read (serve.sh), and that audit's run on
# the challenger's coins (benchmarks/prove_path/README.md)
runs = ["r20261024-055630-5377", "r20261025-092311-15a1", "r20261025-100403-334e"]
