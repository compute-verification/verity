# The vLLM demo's level (examples/README.md): the remote protocol, sampled proofs and PoUW, on one sampling block of
# Llama-3.2-1B INT8 served by vLLM on the endpoint's H200 node (README.md), PoUW on the served model. Its run is moved:
# no run of record of the remote verdict has passed, since PoUW's verdict on the served run is a development run under the
# challenger's development key and credits nothing, and an H1 commitment's served execution blocks aren't yet a
# verity/pouw/v1 case, so the composite can't accept. Its proof is none: sampled proofs' guarantee
# (Flock.Guarantees.SampledKSLiveV3) is proved, but the remote protocol has no guarantee in Lean for it to instantiate
# (verity/core/protocols/remote/README.md, "The open gap"), and PoUW's proof layer needs AcceptedLive, which no served
# path meets.
protocol = "remote"
workload = "vllm"
run = "moved"
proof = "none"

[placement]
endpoint = "gpu-node"                # the endpoint's H200 node
prover = "gpu-node"                  # the endpoint's node
challenger = "auditor-host"          # the challenger's auditor host, through its gate: PoUW's coins, and sampled
                                     # proofs' with PP_CHALLENGER
verifier = "gpu-node"                # NOT PLACED: the Lean verifier, on the endpoint's node
certifier = "gpu-node"               # NOT PLACED: the network certifier, onsite's, may run on the endpoint's node
memory_challenger = "gpu-node"       # NOT PLACED: PoUS's memory challenger, onsite's, may run on the endpoint's node

[evidence]
# empty until a run of record of the served H200 run passes the remote verdict
runs = []
