# The H200 walking skeleton's step driver, run by `verity example h200`, and its CPU replay of drawn units
# (`replay.py`, `cpu_step.py`). Not a package: its tests run in the workspace environment (torch from the workspace's
# torch-cpu extra), and `run.py` puts this directory on its path.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = [
    # the Definitions replay evaluates, P2's keys, and the commitments the commit call builds on
    "verity",
    # the per-step commit call (`row_tables.step_roots`, and `host_step`'s C++ twin with the sources it builds)
    "integrations/vllm/verity_vllm/__init__.py",
    "integrations/vllm/verity_vllm/commit/__init__.py",
    "integrations/vllm/verity_vllm/commit/row_tables.py",
    "integrations/vllm/verity_vllm/commit/row_tables_device.py",
    "integrations/vllm/verity_vllm/protocols/pouw/pouw_cuda/ncp2.cuh",
    "integrations/vllm/verity_vllm/protocols/pouw/pouw_cuda/row_table.cuh",
    "integrations/vllm/verity_vllm/protocols/pouw/pouw_cuda/row_table_host.cpp",
    "integrations/vllm/verity_vllm/protocols/pouw/pouw_cuda/row_table.cu",
    # kernels' per-slot commit call and the SHA-512 engine its host twin builds
    "benchmarks/torch_gpu/commit_slots/slots.py",
    "benchmarks/torch_gpu/commit_slots/slots_gpu.py",
    "benchmarks/torch_gpu/sha512_rows",
    # the settings engine sha512_rows' engine and commit_slots' step read their variables through
    "tools/config/verity_config",
    # the P2 v4 reference encode and decode the store runs
    "benchmarks/pous/p2_v1/__init__.py",
    "benchmarks/pous/p2_v1/reference.py",
    # the drawn-unit bundle's cross-step reads `kv_reads.py` opens and checks (`replay_bundle.open_reads`, `check_reads`)
    "demos/h200/interfaces/verity_e2e_demo",
]
