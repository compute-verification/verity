# The served window under 5 of onsite's seven subprotocols, the ones `protocols` lists, each
# party on its machine. The deploy bindings hold every host and address, this file none
# (demos/onsite_served/README.md). The set is no composite's, so `verity run THIS` refuses it by name
# (`composite`): protocol soundness covers onsite's seven and remote's three alone.
format = "verity/config/v0"
protocols = ["sampled-proofs", "pouw", "inference-only", "certifier", "wipe"]

[workload]
name = "served-window"

[workload.params]
model = "verity-int8/Llama-3.2-1B-INT8"
revision = "15b0976d400d796ee589e7737d03a919526bf800"
precision = "verity_int8"
slots = 4
window-steps = 16
load = "varied"

[service]
law = "subset:1"

[program]
commit = "b041d20d6f80892ab43dc88994e41c9f4b3a4002"

[[party]]
name = "workers"
machine = "prover-node"
principal = "developer"

[[party]]
name = "challenger"
machine = "gate-host"
principal = "auditor"

[[party]]
name = "firewall"
machine = "prover-node"
principal = "developer"

[[party]]
name = "verifier"
machine = "auditor-host"
principal = "auditor"

[[party]]
name = "network-certifier"
machine = "gate-host"
principal = "auditor"

[[party]]
name = "memory-challenger"
machine = "auditor-host"
principal = "auditor"

[[party]]
name = "prover"
machine = "prover-node"
principal = "developer"

[[channel]]
from = "challenger"
to = "verifier"
messages = ["Challenger"]

[[channel]]
from = "verifier"
to = "challenger"
messages = ["Done"]

[[channel]]
from = "firewall"
to = "verifier"
messages = ["Firewall"]

[[channel]]
from = "workers"
to = "verifier"
messages = ["Registration", "H1Record"]
after = ["H1Coins"]

[[channel]]
from = "challenger"
to = "workers"
messages = ["H1Coins"]

[[channel]]
from = "network-certifier"
to = "workers"
messages = ["out-opening"]

[[channel]]
from = "network-certifier"
to = "verifier"
messages = ["out-record"]

[[channel]]
from = "memory-challenger"
to = "prover"
messages = ["Fill", "FillDone", "Read", "End"]

[[channel]]
from = "prover"
to = "memory-challenger"
messages = ["FillAck", "Answer"]

[[channel]]
from = "memory-challenger"
to = "verifier"
messages = ["WipeReport"]
after = ["End"]
