# The lifecycle demo: the onsite and remote composites stepped through registration, operation, close, audit and
# accounting on a tiny model, run by `verity demo lifecycle`. Not a package: its tests run in the workspace environment,
# and `run.py` puts this directory on its path.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = [
    # the deployment runtime, circuits, commitments, LMS, sampled proofs' draw, PoUW's grid and the composition's
    # reference (verity/protocols/compose/tests/reference.py), which the demo runs
    "verity",
]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_lifecycle.py"]
paths = [
    "verity/protocols/inference_only/verifier/nci/lean/scripts/baseline_difftest_vectors.py",
    "verity/protocols/inference_only/verifier/nci/lean/scripts/difftest_vectors.py",
]
