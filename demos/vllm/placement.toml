# The vLLM example's placement: the node each of its runs goes to, how `research run` starts it there, and what that node holds.
# `run.sh` (`verity example vllm`) reads it and hands the run's script its node's paths as its environment, so no script names a
# node or a path on one. A node's paths are the [node.NAME] table; a run's own variables are its env table.

[node.vy-nebius-1]
# the RTX PRO 6000 node: vLLM's venv, CUDA for the collector's JIT build and the checkpoint's HF cache
VENV = "/workspace/jobs/venv312"
CUDA_HOME = "/workspace/jobs/cuda-12.9"
HF_HOME = "/workspace/hf"
# commit.sh's workload dirs, LLAMA_ROOT/<commit run>/<workload>; COMMIT_RUN is the Commit of record the endpoint commits under
LLAMA_ROOT = "/workspace/research/vllm-llama1b-commit"
COMMIT_RUN = "r20261024-055630-5377"
# no endpoint on n1 serves with less free on its serve dir's filesystem
DISK_FLOOR_GB = "300"

[node.vy-nebius-1.serving]
# the endpoint's taps of record, which only the runs that serve get: a workload's Build, Match and Commit pick theirs (HIDDEN_SO would override that)
HIDDEN_SO = "/workspace/cp/fa2/build/matReqG/verity_fa2_matReqG.so"
NORM_TAP_SO = "/workspace/cp/norm_tap/build/verity_norm_tap.so"

[run.window]
# one served window through every subprotocol; the prover and the Lean verifier run on the serving node, after the lease ends.
# The sampled proofs' coins are the verifier's own unless PP_CHALLENGER names the live challenger (vy-challenger-1 through
# infra's gate: `--env PP_CHALLENGER=gate:USER@HOST` with PP_PEER, PP_CHALLENGER_KEY and PP_GATE_KEY). CLASSES is V2's class,
# whose window circuit the run needs; the class of record's is measured after it and gates nothing
node = "vy-nebius-1"
research = ["--cwd", "clone", "--timeout", "4h"]
wrap = ["env", "CHECK_SLOTS=/workspace/research/locks/gpu/slots", "python3", "tools/verity/check/slot.py", "--by", "vllm", "--"]
env = { LEASE_MEM_GB = "256", CLASSES = "4,32,4" }

[run.commit]
# once per workload: its Build, Match and Commit of record (a GPU leased only for the Match capture and the Commit's engine)
node = "vy-nebius-1"
research = ["--cwd", "source", "--mem-gb", "192", "--timeout", "6h"]
env = { GPU_LEASE_WHO = "vllm-llama1b-commit" }

[run.serve]
# the endpoint alone, serving until UNTIL (network accounting's long windows), on one leased GPU
node = "vy-nebius-1"
research = ["--cwd", "source", "--timeout", "200m"]
wrap = ["env", "CHECK_SLOTS=/workspace/research/locks/gpu/slots", "python3", "tools/verity/check/slot.py", "--by", "vllm", "--",
        "gpu-lease", "1", "--wait", "--mem-gb", "256", "--"]
env = { PORT = "18084", UNTIL = "13:30", SERVE_ROOT = "/workspace/research/vllm-serve-seal" }
