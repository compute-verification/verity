# This directory's numbers, one [[metric]] each: benchmarks/README.md's "Metrics"; tests/test_metrics_registry.py
# enforces it.

[[metric]]
id = "vllm/remote-demo-minutes"
title = "The remote demo: minutes from its first command to its verdict"
owner = "vllm"
unit = "minutes"
better = "lower"
command = "research run --cwd source -- python3 demos/vllm/minutes.py FIRST_RUN [RUN ...] VERDICT_RUN"
every = "7d"
floor = 60
goal = "demos/remote-demo"
