# The served window under the network certifier, SPOT and the memory wipe (verity/onsite-network/v0, a
# deployment of its own, never onsite), each party on its machine, and the key the auditor pinned for
# its memory attester.
# `verity run` records each period's verdict under that id, undecided unless the line says who
# combined it: no composite takes it.
format = "verity/config/v0"
protocols = ["sampled-proofs", "certifier", "wipe"]

[workload]
name = "served-window"

[workload.params]
model = "verity-int8/Llama-3.2-1B-INT8"
revision = "15b0976d400d796ee589e7737d03a919526bf800"
precision = "verity_int8"
slots = 4
window-steps = 16
load = "varied"

[service]
law = "rate:1/3481648"

[program]
commit = "b041d20d6f80892ab43dc88994e41c9f4b3a4002"

[[party]]
name = "workers"
machine = "prover-node"
principal = "developer"

[[party]]
name = "challenger"
machine = "gate-host"
principal = "auditor"

[[party]]
name = "firewall"
machine = "prover-node"
principal = "developer"

[[party]]
name = "verifier"
machine = "auditor-host"
principal = "auditor"

[[party]]
name = "network-certifier"
machine = "gate-host"
principal = "auditor"

[[party]]
name = "memory-challenger"
machine = "auditor-host"
principal = "auditor"

[[party]]
name = "prover"
machine = "prover-node"
principal = "developer"

[[pin]]
party = "memory-challenger"
protocol = "wipe"
scheme = "lms-sha512/n64-w1-h20/v0"
key-sha512 = "c5f12219aa878038c8e947b0b7c8b4cd90530168603e3eb94f99a1eec793cb4198fe0cb364d3709ecf8055dc89d86a729d58a046e8871cc21da6cbc9009a7252"

[[channel]]
from = "challenger"
to = "verifier"
messages = ["Challenger"]

[[channel]]
from = "verifier"
to = "challenger"
messages = ["Done"]

[[channel]]
from = "firewall"
to = "verifier"
messages = ["Firewall"]

[[channel]]
from = "workers"
to = "verifier"
messages = ["Registration"]

[[channel]]
from = "network-certifier"
to = "workers"
messages = ["out-opening", "records", "cells-salts"]

[[channel]]
from = "network-certifier"
to = "verifier"
messages = ["out-record", "certificate", "registration", "deployment", "groups"]

[[channel]]
from = "memory-challenger"
to = "prover"
messages = ["Fill", "FillDone", "Read", "End"]

[[channel]]
from = "prover"
to = "memory-challenger"
messages = ["FillAck", "Answer"]

[[channel]]
from = "memory-challenger"
to = "verifier"
messages = ["WipeReport"]
after = ["End"]
