# The vLLM integration's ruff rules (`ruff check integrations/vllm`). Of the rules its `# noqa` comments name, the bug classes
# (pyflakes F, of which they name F401, F811, F821 and F841; B018; S102, S307, S310) and the conventions its suppressions show
# (BLE001, E402, E731), with UP017, the code study's B006, B008 and B015 (note:20261025T0140Z-report-vllm-code-quality-study),
# and RUF100, which finds a stale `noqa`. The style rules a few comments also name (ANN001, ANN201, PLC0415, N812, D401, SLF001,
# I001, SIM115, D107, ARG002, E702, E741, PERF203) have thousands of findings the code never suppressed, so they're off and
# those comments are stale. tests/lint/test_ruff.py holds the findings to tests/lint/allowlists/ruff.json, which only shrinks,
# and the ratchet gate judges a change here by running the base's copy on the change's tree. The formatter stays off.
target-version = "py312"
# the same files on every machine, whatever a checkout ignores
respect-gitignore = false
# captured output (Inductor's generated kernels), not ours
extend-exclude = ["fixtures"]
# so `[format] exclude` holds for a file named on the command line too
force-exclude = true

[lint]
select = ["B006", "B008", "B015", "B018", "BLE001", "E402", "E731", "F", "RUF100", "S102", "S307", "S310", "UP017"]

[lint.per-file-ignores]
# a pytest fixture imported from a sibling module and taken as an argument
"tests/**" = ["F811"]
# Programs in the frontend's notation, whose `Arr["N", BF16]` names a dimension with a string that pyflakes reads as a name
"verity_vllm/program/frontend/examples.py" = ["F821"]
"tests/program/b1_authored.py" = ["F821"]
"tests/program/serve3_authored.py" = ["F821"]
"tests/program/test_frontend_rulings.py" = ["F821"]
"tests/program/test_torch_frontend.py" = ["F821"]

[format]
exclude = ["*"]
