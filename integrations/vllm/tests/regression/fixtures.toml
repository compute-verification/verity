# labelled decision (Draft 3 §7): the seeded-Gumbel step segmentation, accepted as a correction of v1 (sanctions under every engine)
[[rows."llama32-1b__bf16__l40s__tp1__b1__i256__o32__mixed__stoch-t0.8-p0.95__bi-eager".decisions]]
check = "step_segmentation"
since = "lane/vllm-by-name-residue"
since_commit = "4132fc366ee89bb0f90445db34aa928eeceb8ea0"
finding = "GP-01 seeded-Gumbel step segmentation"
status = "accepted"
accepted_by = "Daniel Reuter (delegated to the vLLM coordinator)"
accepted_at = "2026-09-23T22:08Z"
ruling = "A correction, not a regression: at v1-reference #101 records 1 step for its 32 sampling events; the current code cuts 32 steps, each ending at a sampling event (steps == cap == sampling events, no unsegmented member). v1's single segment is the defect."
reason = "v1's request_component cut a request body at TokenSelect_v1 only, so this row's 32 GumbelTopPTokenSelect_v1 instances left ONE segment: steps 1 for cap 32, 31 chronology members with no programmed instance set, component_steps_equal_cap false (the record of run r20260923-203359-97e0 at v1-reference). lane/vllm-by-name-residue cuts at every sampling event (verity_vllm.ir.sampling_event.is_sampling_event): 32 steps == cap == the 32 sampling events the Build counted (result.json spec_histogram), every segment ending at a sampling event, no unsegmented member. A correction of the v1 segmentation, not a regression; component program_digest and n_nodes unchanged (harness run 2026-09-23, vyv-v2cpu3)."
expected = { component_steps_equal_cap = true, unsegmented_members = 0, requests = { r0 = { cap = 32, steps = 32, sampling_events = 32, n_nodes = 46654, program_digest = "079ee0a8e3e0355b2600b8576588edb4d5df56bb21f3ff707e9117a8e843c1de", step_nodes_sha256 = "053c8718ce4f641e9a0398a0bbf14245bba546afa80e1f457d6be2000d0bfecb" } } }

