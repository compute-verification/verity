[project]
name = "verity-vllm"
version = "0.1.0"
description = "Verity x vLLM integration: runtime capture, definitions and Torch-derived Programs for vLLM, Match/Commit, the qualification sweep."
requires-python = ">=3.12"
dependencies = [
    "research",
    "verity",
    "verity-config",
    "numpy>=1.26",
]

[project.scripts]
verity-vllm = "verity_vllm.pipeline.cli:main"

[project.optional-dependencies]
# The CPU half (compare / replay / gates / derivation tests) needs torch; the pod runtime adds vLLM through pod_bootstrap.sh.
torch = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "verity_vllm",
]

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-config = { workspace = true }
[tool.pytest.ini_options]
# Run from this directory: fixtures are read relative to it.  CUDA / vLLM / pod-tree tests skip or fail by name off-pod.
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
# tests/regression (the reference regression; skipped unless VERITY_REGRESSION=1) is run explicitly: `pytest tests/regression -m regression`.
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
    "boolean_sweep: a random Boolean-vs-word sweep; skipped unless VERITY_VLLM_BOOLEAN_SWEEPS=1 (circuit-check's word_view checks the equality on every merge)",
    "regression: the v1 reference regression checks (tests/regression); opt in with VERITY_REGRESSION=1",
    "pod: reads > 100 MB or rebuilds for minutes/hours -- run on a pod, never on the laptop",
    "weak: PASS-side only or a rule no reference row exercises (see the check module's docstring)",
    "rebuild: recomputes from a row's Programs (a manifest rebuild, a component decode); skipped unless VERITY_REGRESSION_REBUILD=1, as after each train on main (tools/verity/check/post_train.py)",
]

[tool.verity.tests]
# In place of its dependencies' directories (`inputs_only`): `verity` whole, since the code identity (`source_identity.code_identity`,
# the hot Commit worker's key, which tests/pipeline computes over this tree) hashes every file of it; of `research`, what the
# package imports (`research.store.tool`, `research.telemetry.source_identity`) and the store CLI that `store_io` starts for a
# fetch and `records.data` starts as `python -m research` (its `__main__`), and the run fixture
# tests/regression/test_attempt_resolution.py resolves. Test-only: tests/pipeline checks the fixtures
# this package registers and the example's stored workload (demos/vllm/workloads/SHA256SUMS); tests/program/test_fp8_moe.py replays the Hopper e4m3 k32 step's pinned vectors (under `verity`);
# tests/engine's int8 tests run benchmarks/ppl's int8 steps as their oracle;
# tests/store/test_remote_session.py runs the remote session's prover and verifier (`store.remote`), and the verifier
# imports lean_verifier.py, challengers.py and store_layout.py; tests/protocol_options/test_pouw_h1_circuits.py parses a
# period-open's --circuit-files with infra's gate (benchmarks/live_challenger/auditor.py), and the in-process gate
# (tests/protocol_options/challenger_host.py) runs infra's model registry (benchmarks/live_challenger/models.py);
# tests/protocols/test_pous_option.py encodes and spot-checks C* with P2's store (benchmarks/pous/p2_v1/store.py and the
# reference decode it imports); tests/tools/test_ratchet_gate.py commits the repository's lints (tests/lint/test_repo_env_reads.py,
# test_repo_ruff.py, test_repo_silent_excepts.py and test_repo_lane_text.py) into the repositories it gates.
# The tests build and run the Lake packages whose lakefiles they list: tests/pipeline/test_row_tables_stream.py
# `sampled-proofs-verifier`, tests/protocol_options/test_pouw_h1.py `pouw-check-difftest` and test_remote_session.py
# `remote-audit-verifier`.
inputs_only = true
inputs = ["verity", "verity/README.md", "tools/config/verity_config", "fixtures/artifacts.json", "demos/vllm/workloads/SHA256SUMS", ".gitignore",
          "verity/core/service/sampled_proofs/lakefile.toml", "verity/core/protocols/pouw/lean/check/lakefile.toml",
          "verity/core/protocols/remote_bandwidth/lean/lakefile.toml",
          "benchmarks/ppl/steps.py", "benchmarks/ppl/matmul.py", "benchmarks/ppl/gates.py", "benchmarks/ppl/spec.py", "benchmarks/ppl/methodology.py", "benchmarks/ppl/model.py",
          "benchmarks/ppl/windows.py", "benchmarks/ppl/datasets.json", "benchmarks/pouw/edited_gemm/fattn_ref.py",
          "benchmarks/remote_session/prover.py", "benchmarks/remote_session/verifier.py", "benchmarks/remote_session/wire.py",
          "benchmarks/remote_session/checks.py", "benchmarks/remote_session/lean_verifier.py", "benchmarks/remote_session/challengers.py",
          "benchmarks/remote_session/store_layout.py", "benchmarks/live_challenger/auditor.py", "benchmarks/live_challenger/host.json",
          "benchmarks/live_challenger/models.py", "benchmarks/pouw/harness/sass_gate.py",
          "benchmarks/pous/p2_v1/__init__.py", "benchmarks/pous/p2_v1/store.py", "benchmarks/pous/p2_v1/reference.py",
          "tests/lint/test_repo_env_reads.py", "tests/lint/test_repo_ruff.py", "tests/lint/test_repo_silent_excepts.py",
          "tests/lint/test_repo_lane_text.py",
          "tools/research/src/research/__init__.py", "tools/research/src/research/cli.py", "tools/research/src/research/clone.py",
          "tools/research/src/research/compare.py", "tools/research/src/research/env.py", "tools/research/src/research/pythonpath.py",
          "tools/research/src/research/record.py", "tools/research/src/research/remote.py", "tools/research/src/research/result.py",
          "tools/research/src/research/runs.py", "tools/research/src/research/secret_hint.py", "tools/research/src/research/timefmt.py", "tools/research/src/research/waitcap.py",
          "tools/research/src/research/store", "tools/research/src/research/telemetry", "tools/research/tests/fixtures/run_v0.2",
          "tools/research/src/research/withdraw.py",
          "tools/research/src/research/__main__.py"]
parallel = true
# benchmarks/pouw/edited_gemm/fattn_ref.py is the int8 attention tests' oracle (tests/engine), beside benchmarks/ppl's linears;
# tests/engine/int8_attention_sass.py reads the int8 attention kernels' SASS with the PoUW SASS gate's nvdisasm parser
# (benchmarks/pouw/harness/sass_gate.py)
# a worker's peak grows with its share of the suite, since what its tests leave held isn't returned: 6.2 GB on 14 workers, 12 GB on
# 8 (test_codec's alias test takes 6.3 GB over the 5.6 GB held before it), 15.5 GB on 5. `--mem-gb`, or a job's memory cgroup,
# divides by this, but suites.py's default `--jobs` counts 9 GB a process, so a 16 GB job runs the suite in one process unless
# `--jobs` says more. tools/suite_parts.py runs it as 8 parts at once, each on its job's CPUs (a sixth on 4 workers: 8.5, 6.2, 6.0
# and 3.5 GB)
worker_gb = 8
# the full suite takes about 10,000 s on 5 workers, past suites.py's SUITE_TIMEOUT_S; `--quick` leaves out the tests over 5 s
# (their `slow` marks)
timeout_s = 14400
