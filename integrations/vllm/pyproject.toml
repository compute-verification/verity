[project]
name = "verity-vllm"
version = "0.1.0"
description = "Verity x vLLM integration: runtime capture, definitions and Torch-derived Programs for vLLM, Match/Commit, the qualification sweep."
requires-python = ">=3.12"
dependencies = [
    "research",
    "verity",
    "verity-sampled-proofs",
    "verity-pous",
    "verity-pouw",
    "numpy>=1.26",
    "blake3>=1.0",
]

[project.scripts]
verity-vllm = "verity_vllm.pipeline.cli:main"

[project.optional-dependencies]
# The CPU half (compare / replay / gates / derivation tests) needs torch; the pod runtime adds vLLM through pod_bootstrap.sh.
torch = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "verity_vllm",
]

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-sampled-proofs = { workspace = true }
verity-pous = { workspace = true }
verity-pouw = { workspace = true }

[tool.pytest.ini_options]
# Run from this directory: fixtures are read relative to it.  CUDA / vLLM / pod-tree tests skip or fail by name off-pod.
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
# tests/regression (R19 reference regression; skipped unless VERITY_REGRESSION=1) is run explicitly: `pytest tests/regression -m regression`.
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
    "regression: R19 reference regression checks (tests/regression); opt in with VERITY_REGRESSION=1",
    "pod: reads > 100 MB or rebuilds for minutes/hours -- run on a pod, never on the laptop",
    "weak: PASS-side only or a rule no reference row exercises (see the check module's docstring)",
    "rebuild: recomputes from a row's Programs (a manifest rebuild, a component decode); skipped unless VERITY_REGRESSION_REBUILD=1, as after each train on main (tools/check/post_train.py)",
]

[tool.verity.tests]
# Test-only: tests/pipeline checks the fixtures this package registers; tests/program/test_fp8_moe.py replays the Hopper e4m3
# k32 step's pinned vectors through the block-scaled GEMMs.
inputs = ["fixtures/artifacts.json", ".gitignore", "fixtures/tc/vectors/fp8-hopper-wgmma-k1536.json",
          "fixtures/tc/vectors/fp8-hopper-wgmma-k32.json"]
parallel = true
