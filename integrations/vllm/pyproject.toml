[project]
name = "verity-vllm"
version = "0.1.0"
description = "Verity x vLLM integration: runtime capture, definitions and Torch-derived Programs for vLLM, Match/Commit, the qualification sweep."
requires-python = ">=3.12"
dependencies = [
    "verity",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The CPU half (compare / replay / gates / derivation tests) needs torch; the pod runtime adds vLLM through pod_bootstrap.sh.
torch = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "verity_vllm",
    "verity_vllm_adapter",
    "verity_vllm_numerics",
    "verity_vllm_sampler",
    "verity_capture",
    "e2e",
    "record_v5",
]

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
# Run from this directory: fixtures are read relative to it.  CUDA / vLLM / pod-tree tests skip or fail by name off-pod.
testpaths = ["tests/ir", "verity_capture"]
addopts = "-q -p no:cacheprovider"
