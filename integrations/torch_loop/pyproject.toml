# A minimal PyTorch serving loop, an integration of Verity's (`verity.ml.windows.interface`). Not a package: its tests run in
# the workspace environment (torch from the workspace's torch-cpu extra), and `examples/prove-path/run.sh` (PP_TORCH_LOOP)
# puts this directory on its path.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `verity`: the interface it implements and core's registration and partition, which its tests hold the written window to;
# `examples/prove-path`: the records audit its PoUW window's audit drives (`pouw_audit`).
# `benchmarks/live_challenger` (its `models.py`, the auditor's gate, which the checkpoint role's test holds the role's files
# to), `a5_coins.py` and `benchmarks/pouw/window_salt`: the local gate a live PoUW window's salt session opens on.
inputs = ["verity", "examples/prove-path", "benchmarks/live_challenger", "benchmarks/one_stage/a5_coins.py",
          "benchmarks/pouw/window_salt"]
