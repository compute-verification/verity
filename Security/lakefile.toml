# The security analysis's spec, on Mathlib: Definitions, each component's vocabulary, named assumptions and guarantee
# statements. The proofs are the nested package `Proofs/` (security_proofs).
name = "security"
defaultTargets = ["Definitions"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "Definitions"
