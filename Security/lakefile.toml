# The security analysis's trusted text: Definitions (each component's vocabulary) and Models (its named assumptions
# and guarantee statements), on Mathlib. The proofs are the nested package `Proofs/` (security_proofs).
name = "security"
defaultTargets = ["Definitions", "Models"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "Definitions"

[[lean_lib]]
name = "Models"
