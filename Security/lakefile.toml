# The security analysis's trusted text, `Definitions`: each component's vocabulary, and its named assumptions and
# guarantee statements (`Definitions.<Area>.{Assumptions,Guarantees}`), on Mathlib. The properties of the code are the
# nested package `Properties/` (security_properties), and the proofs `Proofs/` (security_proofs).
name = "security"
defaultTargets = ["Definitions"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "Definitions"
