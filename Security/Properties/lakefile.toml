# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Composition`, `Onsite`, `Remote`: the composition of core protocols, and onsite and
# remote Verity). Its modules sit beside the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`, and
# it requires the code it states properties of, never `security`, so its statements read no Mathlib.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "pouw_window"
path = "../../verity/experimental/core/protocols/pouw/window"

[[require]]
name = "core_onsite"
path = "../../verity/experimental/core/protocols/onsite"

[[require]]
name = "core_remote"
path = "../../verity/experimental/core/protocols/remote"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Proofs.Pouw", "Properties.Composition", "Properties.Onsite", "Properties.Remote",
  "Properties.Proofs.Composition", "Properties.Proofs.Onsite", "Properties.Proofs.Remote"]
