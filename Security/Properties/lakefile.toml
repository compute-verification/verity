# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Pouw.Check`: its check as a core protocol; `Nci`: the NCI check; `CertifierDevice`:
# the network certifier device's `step` over traces and its issuer; `NetworkCertifier`: the network certificate check;
# `CertifierNetwork`: the check accepts the device's own output).
# It may require `security` (Definitions, Models) and the code it states properties of, never `security_proofs`. Its
# modules sit beside the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`: `Properties.<Protocol>`
# states, `Properties.Proofs.<Protocol>` proves. A property whose proof needs `security_proofs` is stated here and proved
# there.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/core/protocols/pouw/lean/window"

[[require]]
name = "pouw_check"
path = "../../verity/core/protocols/pouw/lean/check"

[[require]]
name = "nci_check"
path = "../../verity/core/protocols/network/nci/lean"

[[require]]
name = "certifier_device"
path = "../../verity/core/devices/certifier/lean"

[[require]]
name = "network_check"
path = "../../verity/core/protocols/network/lean"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Pouw.Check", "Properties.Proofs.Pouw", "Properties.Proofs.Pouw.Check",
  "Properties.Nci", "Properties.Proofs.Nci", "Properties.CertifierDevice", "Properties.Proofs.CertifierDevice",
  "Properties.NetworkCertifier", "Properties.Proofs.NetworkCertifier", "Properties.CertifierNetwork"]
