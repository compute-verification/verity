# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Pouw.Check`: its check as a core protocol; `Nci`: the NCI check). It may require
# `security` (Definitions, Models) and the code it states properties of, never `security_proofs`. Its modules sit beside
# the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`: `Properties.<Protocol>` states,
# `Properties.Proofs.<Protocol>` proves.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/experimental/core/protocols/pouw/window"

[[require]]
name = "pouw_check"
path = "../../verity/experimental/core/protocols/pouw/check"

[[require]]
name = "nci_check"
path = "../../verity/experimental/core/protocols/network/nci/lean"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Pouw.Check", "Properties.Proofs.Pouw", "Properties.Proofs.Pouw.Check",
  "Properties.Nci", "Properties.Proofs.Nci"]
