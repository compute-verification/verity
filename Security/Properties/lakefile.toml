  "Properties.Pouw.Credit",
  "Properties.Nci", "Properties.Nci.Threads", "Properties.CertifierDevice", "Properties.Pous",
  "Properties.Pous.TimedAudit", "Properties.Pous.MemoryChallenger", "Properties.Pous.Wipe", "Properties.Pous.EndToEnd",
  "Properties.Pous.Period", "Properties.Pous.EndToEndAt", "Properties.Pous.PeriodAt", "Properties.Pous.PeriodDeployed",
  "Properties.Pous.PeriodGame",
  "Properties.Accounting.JointBridge.SpaceOfPeriodHeld", "Properties.Attest", "Properties.NetworkCertifier",
  "Properties.NetworkCertifier.LinkWindow", "Properties.CertifierNetwork",
  "Properties.CertifierNetwork.Runs", "Properties.Identity", "Properties.NciDesc", "Properties.NciDesc.Verdict",
  "Properties.NciDesc.Cover", "Properties.Nci.Baseline", "Properties.SampledProofs", "Properties.SampledProofs.Draw",
  "Properties.SampledProofs.Halt", "Properties.Evaluate", "Properties.NetworkRecords", "Properties.NetworkPeriod",
  "Properties.Accounting.Requirement", "Properties.Accounting.Compose", "Properties.RemoteAudit",
  "Properties.RemoteAudit.Coins", "Properties.RemoteAudit.Pooled", "Properties.Accounting.Served",
