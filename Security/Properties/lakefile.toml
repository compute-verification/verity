# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Pouw.Check`: its check as a core protocol; `Pouw.Commit`: its commitments, salts and
# draws; `Nci`: the NCI check; `CertifierDevice`: the network certifier device's `step` over traces and its issuer; `Pous`:
# the PoUS setup check, its timed audit and the memory challenger's verdict; `NetworkCertifier`: the network certificate
# check; `NetworkRecords`: the records check over every published record; `CertifierNetwork`: the device's output as
# the check reads it, and what an accepted run of the device is; `Proofs.CertifierNetwork`: the check accepts the
# device's own output, completeness rather than a property; `Identity`: core's identity hash is C-Flock's
# SHA-512; `SampledProofs`: sampled proofs' one-stage audit as a core protocol; `Evaluate`: the descriptor v1
# evaluator's primitives, each equal to the `Definitions.Core` definition it copies). It may require `security` (Definitions, Models) and the code it states properties of, never
# `security_proofs`. Its modules sit beside the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`:
# `Properties.<Protocol>` states, `Properties.Proofs.<Protocol>` proves. A property whose proof needs `security_proofs` is
# stated here and proved there.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/core/protocols/pouw/lean/window"

[[require]]
name = "pouw_check"
path = "../../verity/core/protocols/pouw/lean/check"

[[require]]
name = "pouw_commit"
path = "../../verity/core/protocols/pouw/lean/commit"

[[require]]
name = "nci_check"
path = "../../verity/core/protocols/network/nci/lean"

[[require]]
name = "certifier_device"
path = "../../verity/core/devices/certifier/lean"

[[require]]
name = "pous_check"
path = "../../verity/core/protocols/pous/check"

[[require]]
name = "core_memory_challenger"
path = "../../verity/core/devices/memory_challenger/lean"

[[require]]
name = "network_check"
path = "../../verity/core/protocols/network/lean"

[[require]]
name = "core_sampled_proofs"
path = "../../verity/core/service/sampled_proofs"

[[require]]
name = "verity_evaluate"
path = "../../verity/core/primitives/evaluate"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Pouw.Check", "Properties.Pouw.Commit", "Properties.Proofs.Pouw",
  "Properties.Proofs.Pouw.Check", "Properties.Proofs.Pouw.Commit", "Properties.Nci", "Properties.Proofs.Nci",
  "Properties.CertifierDevice", "Properties.Proofs.CertifierDevice", "Properties.Pous", "Properties.Proofs.Pous",
  "Properties.Pous.TimedAudit", "Properties.Pous.MemoryChallenger", "Properties.Pous.EndToEnd", "Properties.Proofs.Pous.TimedAudit",
  "Properties.Proofs.Pous.MemoryChallenger", "Properties.NetworkCertifier", "Properties.Proofs.NetworkCertifier",
  "Properties.CertifierNetwork", "Properties.Proofs.CertifierNetwork", "Properties.CertifierNetwork.Runs",
  "Properties.Proofs.CertifierNetwork.Runs", "Properties.Identity", "Properties.Proofs.Identity",
  "Properties.SampledProofs", "Properties.Proofs.SampledProofs", "Properties.Evaluate", "Properties.Proofs.Evaluate",
  "Properties.NetworkRecords", "Properties.Proofs.NetworkRecords"]
