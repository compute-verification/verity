# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions, one `Properties.<Protocol>` module per component, whose docstring says what it states. It may require
# `security` (Definitions, Models) and the code it states properties of, never `security_proofs`. Its modules sit beside
# the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`: `Properties.<Protocol>` states,
# `Proofs.Properties.<Protocol>` proves. A property whose proof needs `security_proofs` is stated here and proved there.
# This comment lists no component, so two branches that each add one change only `[[require]]` and `roots`, which
# `tools/verity/lean/merge.py --lakefile` merges.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/core/protocols/pouw/lean/window"

[[require]]
name = "pouw_check"
path = "../../verity/core/protocols/pouw/lean/check"

[[require]]
name = "pouw_commit"
path = "../../verity/core/protocols/pouw/lean/commit"

[[require]]
name = "nci_check"
path = "../../verity/core/protocols/network/nci/lean"

[[require]]
name = "certifier_device"
path = "../../verity/core/devices/certifier/lean"

[[require]]
name = "pous_check"
path = "../../verity/core/protocols/pous/check"

[[require]]
name = "core_memory_challenger"
path = "../../verity/core/devices/memory_challenger/lean"

[[require]]
name = "network_check"
path = "../../verity/core/protocols/network/lean"

[[require]]
name = "core_sampled_proofs"
path = "../../verity/core/service/sampled_proofs"

[[require]]
name = "verity_evaluate"
path = "../../verity/core/primitives/evaluate"

[[require]]
name = "remote_audit"
path = "../../verity/core/protocols/remote_bandwidth/lean"

[[require]]
name = "core_requirement"
path = "../../verity/core/primitives/requirement"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Pouw.Check", "Properties.Pouw.Commit", "Proofs.Properties.Pouw",
  "Proofs.Properties.Pouw.Check", "Proofs.Properties.Pouw.Commit", "Properties.Pouw.Strata",
  "Proofs.Properties.Pouw.Strata", "Properties.Pouw.Credit", "Properties.Nci", "Properties.Nci.Threads", "Proofs.Properties.Nci",
  "Properties.CertifierDevice", "Proofs.Properties.CertifierDevice", "Properties.Pous", "Proofs.Properties.Pous",
  "Properties.Pous.TimedAudit", "Properties.Pous.MemoryChallenger", "Properties.Pous.EndToEnd", "Proofs.Properties.Pous.TimedAudit",
  "Proofs.Properties.Pous.MemoryChallenger", "Proofs.Properties.Pous.Run", "Properties.NetworkCertifier", "Proofs.Properties.NetworkCertifier",
  "Properties.CertifierNetwork", "Proofs.Properties.CertifierNetwork", "Properties.CertifierNetwork.Runs",
  "Proofs.Properties.CertifierNetwork.Runs", "Properties.Identity", "Proofs.Properties.Identity",
  "Properties.NciDesc", "Proofs.Properties.Nci.DescAgree", "Proofs.Properties.Nci.Walk",
  "Proofs.Properties.Nci.Resolve", "Proofs.Properties.Nci.Width", "Proofs.Properties.Nci.Novel",
  "Properties.SampledProofs", "Proofs.Properties.SampledProofs", "Properties.SampledProofs.Draw",
  "Properties.SampledProofs.Halt", "Proofs.Properties.SampledProofs.Halt",
  "Properties.Evaluate", "Proofs.Properties.Evaluate",
  "Properties.NetworkRecords", "Proofs.Properties.NetworkRecords", "Properties.Accounting.Requirement",
  "Proofs.Properties.Accounting.Requirement", "Properties.Accounting.Compose", "Properties.RemoteAudit",
  "Proofs.Properties.RemoteAudit", "Properties.Accounting.Served", "Proofs.Properties.Accounting.Served"]
