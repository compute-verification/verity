# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Pouw.Check`: its check as a core protocol; `Pouw.Commit`: its commitments, salts and
# draws; `Nci`: the NCI check; `CertifierDevice`: the network certifier device's `step` over traces and its issuer; `Pous`:
# the PoUS setup check). It may require `security` (Definitions, Models) and the code it states properties of, never
# `security_proofs`. Its modules sit beside the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`:
# `Properties.<Protocol>` states, `Properties.Proofs.<Protocol>` proves.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/core/protocols/pouw/lean/window"

[[require]]
name = "pouw_check"
path = "../../verity/core/protocols/pouw/lean/check"

[[require]]
name = "pouw_commit"
path = "../../verity/core/protocols/pouw/lean/commit"

[[require]]
name = "nci_check"
path = "../../verity/core/protocols/network/nci/lean"

[[require]]
name = "certifier_device"
path = "../../verity/core/devices/certifier/lean"

[[require]]
name = "pous_check"
path = "../../verity/core/protocols/pous/check"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Pouw.Check", "Properties.Pouw.Commit", "Properties.Proofs.Pouw",
  "Properties.Proofs.Pouw.Check", "Properties.Proofs.Pouw.Commit", "Properties.Nci", "Properties.Proofs.Nci",
  "Properties.CertifierDevice", "Properties.Proofs.CertifierDevice", "Properties.Pous", "Properties.Proofs.Pous"]
