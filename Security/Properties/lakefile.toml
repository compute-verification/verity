# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Nci`: the NCI check; `CertifierDevice`: the network certifier device's `step` over
# traces and its issuer). It may require `security` (Definitions, Models) and the code it
# states properties of, never `security_proofs`. Its modules sit beside the trusted text's (`srcDir = ".."`) under a root
# of their own, `Properties`: `Properties.<Protocol>` states, `Properties.Proofs.<Protocol>` proves.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/experimental/core/protocols/pouw/window"

[[require]]
name = "nci_check"
path = "../../verity/experimental/core/protocols/network/nci/lean"

[[require]]
name = "certifier_device"
path = "../../verity/experimental/core/devices/certifier/lean"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Proofs.Pouw", "Properties.Nci", "Properties.Proofs.Nci",
  "Properties.CertifierDevice", "Properties.Proofs.CertifierDevice"]
