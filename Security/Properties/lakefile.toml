# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Pouw.Check`: its check as a core protocol; `Evaluate`: the descriptor v1 evaluator's
# primitives, each equal to the `Definitions.Core` definition it copies). Its modules sit beside the trusted text's
# (`srcDir = ".."`) under a root of their own, `Properties`, and it requires the code it states properties of, and
# `security` for the definitions the evaluator's are equal to. Its statements read no Mathlib: they import only
# `Definitions.Core` modules that import nothing of it (`layers` in `lean-audit.json`).
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "pouw_window"
path = "../../verity/experimental/core/protocols/pouw/window"

[[require]]
name = "pouw_check"
path = "../../verity/experimental/core/protocols/pouw/check"

[[require]]
name = "verity_evaluate"
path = "../../verity/experimental/core/primitives/evaluate"

[[require]]
name = "security"
path = ".."

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Pouw.Check", "Properties.Proofs.Pouw", "Properties.Proofs.Pouw.Check",
  "Properties.Evaluate", "Properties.Proofs.Evaluate"]
