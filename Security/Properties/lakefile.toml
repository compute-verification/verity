# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `NetworkCertifier`: the network certificate check). Its modules sit beside the trusted
# text's (`srcDir = ".."`) under a root of their own, `Properties`. It requires the code it states properties of, and
# `security` (Definitions and Models) for a statement that reads the model or a named assumption; never `security_proofs`.
# A property whose proof needs `security_proofs` is stated here and proved there.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/experimental/core/protocols/pouw/window"

[[require]]
name = "network_check"
path = "../../verity/experimental/core/protocols/network/lean"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Proofs.Pouw", "Properties.NetworkCertifier", "Properties.Proofs.NetworkCertifier"]
