# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions, one `Properties.<Protocol>` module per component, whose docstring says what it states. It may require
# `security` (Definitions, Models) and the code it states properties of, never `security_proofs`. Its modules sit beside
# the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`: `Properties.<Protocol>` states,
# `Proofs.Properties.<Protocol>` proves. A property whose proof needs `security_proofs` is stated here and proved there.
# This comment lists no component, so two branches that each add one change only `[[require]]` and `roots`, which
# `tools/verity/lean/merge.py --lakefile` merges.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/core/protocols/pouw/lean/window"

[[require]]
name = "pouw_check"
path = "../../verity/core/protocols/pouw/lean/check"

[[require]]
name = "pouw_commit"
path = "../../verity/core/protocols/pouw/lean/commit"

[[require]]
name = "nci_check"
path = "../../verity/core/protocols/network/nci/lean"

[[require]]
name = "certifier_device"
path = "../../verity/core/devices/certifier/lean"

[[require]]
name = "pous_check"
path = "../../verity/core/protocols/pous/check"

[[require]]
name = "core_memory_challenger"
path = "../../verity/core/devices/memory_challenger/lean"

[[require]]
name = "network_check"
path = "../../verity/core/protocols/network/lean"

[[require]]
name = "core_sampled_proofs"
path = "../../verity/core/service/sampled_proofs"

[[require]]
name = "verity_evaluate"
path = "../../verity/core/primitives/evaluate"

[[require]]
name = "remote_audit"
path = "../../verity/core/protocols/remote_bandwidth/lean"

[[require]]
name = "core_requirement"
path = "../../verity/core/primitives/requirement"

[[require]]
name = "core_composition"
path = "../../verity/core/protocols/composition"

[[require]]
name = "core_onsite"
path = "../../verity/core/protocols/onsite"

[[require]]
name = "flock_verifier"
path = "../../verity/core/service/flock"

