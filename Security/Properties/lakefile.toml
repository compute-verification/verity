# The security analysis's properties of the Lean code: what each component's executable Lean does, stated against its
# functions (`Pouw`: PoUW's window; `Nci`: the NCI check; `NetworkCertifier`: the network certificate check). It may
# require `security` (Definitions, Models) and the code it states properties of, never `security_proofs`. Its modules sit
# beside the trusted text's (`srcDir = ".."`) under a root of their own, `Properties`: `Properties.<Protocol>` states,
# `Properties.Proofs.<Protocol>` proves. A property whose proof needs `security_proofs` is stated here and proved there.
name = "security_properties"
srcDir = ".."
defaultTargets = ["Properties"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "security"
path = ".."

[[require]]
name = "pouw_window"
path = "../../verity/experimental/core/protocols/pouw/window"

[[require]]
name = "nci_check"
path = "../../verity/experimental/core/protocols/network/nci/lean"

[[require]]
name = "network_check"
path = "../../verity/experimental/core/protocols/network/lean"

[[lean_lib]]
name = "Properties"
roots = ["Properties.Pouw", "Properties.Proofs.Pouw", "Properties.Nci", "Properties.Proofs.Nci",
  "Properties.NetworkCertifier", "Properties.Proofs.NetworkCertifier"]
