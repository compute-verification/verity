# The security analysis's proofs (untrusted): every proof of a guarantee `security` states, C-Flock's level3 and
# soundness among them. Its modules sit beside the trusted text's (`srcDir = ".."`) under a root of their own, `Proofs`.
name = "security_proofs"
srcDir = ".."
defaultTargets = ["Proofs"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "b2e456fc48db5bff1b69c7469fde73f9b83e94c2"

[[require]]
name = "security"
path = ".."

[[require]]
name = "flock_verifier"
path = "../../verity/core/service/flock"

[[require]]
name = "certifier_program"
path = "../../verity/core/protocols/certifier/lean"

[[require]]
name = "core_randomness"
path = "../../verity/core/primitives/randomness"

# V*'s circuits as core code (`VStar`), which the bridge (`Proofs.Flock.VBridge.OfVStar`) is stated over
[[require]]
name = "core_vstar"
path = "../../verity/core/service/vstar"

# The properties a proof here proves (`Properties`), stated against the code where that proof needs this package.
[[require]]
name = "security_properties"
path = "../Properties"

[[lean_lib]]
name = "Proofs"
roots = ["Proofs.Core", "Proofs.Nci", "Proofs.Pous", "Proofs.Pouw", "Proofs.NetworkCertifier", "Proofs.Flock",
  "Proofs.Accounting", "Proofs.Hash", "Proofs.SampledProofs", "Proofs.Properties.Pouw", "Proofs.Properties.Pouw.Check",
  "Proofs.Properties.Pouw.Commit", "Proofs.Properties.Pouw.LiveSalt", "Proofs.Properties.Pouw.Strata",
  "Proofs.Properties.Nci", "Proofs.Properties.NetworkCertifier.Device", "Proofs.Properties.Pous",
  "Proofs.Properties.Pous.TimedAudit", "Proofs.Properties.Pous.MemoryChallenger", "Proofs.Properties.Pous.Run",
  "Proofs.Properties.NetworkCertifier.Check", "Proofs.Properties.NetworkCertifier.DeviceOutput", "Proofs.Properties.NetworkCertifier.DeviceOutput.Runs",
  "Proofs.Properties.Hash.Identity", "Proofs.Properties.Nci.DescVerdict", "Proofs.Properties.Nci.DescAgree",
  "Proofs.Properties.Nci.Walk", "Proofs.Properties.Nci.Resolve", "Proofs.Properties.Nci.BodiesOk",
  "Proofs.Properties.Nci.Width", "Proofs.Properties.Nci.Novel", "Proofs.Properties.Nci.BaselineSteps",
  "Proofs.Properties.Nci.Baseline", "Proofs.Properties.Nci.OperandsResolve", "Proofs.Properties.Nci.Agrees",
  "Proofs.Properties.SampledProofs", "Proofs.Properties.SampledProofs.Halt", "Proofs.Properties.Core.Evaluate",
  "Proofs.Properties.NetworkCertifier.Records", "Proofs.Properties.Accounting.Requirement", "Proofs.Properties.Accounting.Remote",
  "Proofs.Properties.Accounting.Remote.Coins", "Proofs.Properties.Accounting.Remote.Frozen", "Proofs.Properties.Accounting.Remote.Order",
  "Proofs.Properties.Accounting.Remote.Pooled", "Proofs.Properties.Accounting.Served", "Proofs.Properties.Accounting.Remote.Line",
  "Proofs.Properties.Accounting.Remote.Schedule", "Proofs.Properties.Accounting.Remote.Shared",
  "Proofs.Properties.Accounting.Remote.SharedLink", "Proofs.Properties.Accounting.Remote.Live",
  "Proofs.Properties.Pouw.LiveSalt.Ledger", "Proofs.Properties.Nci.ReadsExact",
  "Proofs.Properties.Nci.BodiesOk.ReadsDecoded"]
