# The security analysis's proofs (untrusted): every proof of a guarantee `security` states, C-Flock's level3 and
# soundness among them. Its modules sit beside the trusted text's (`srcDir = ".."`) under a root of their own, `Proofs`.
name = "security_proofs"
srcDir = ".."
defaultTargets = ["Proofs"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "b2e456fc48db5bff1b69c7469fde73f9b83e94c2"

[[require]]
name = "security"
path = ".."

[[require]]
name = "flock_verifier"
path = "../../verity/core/service/flock"

[[require]]
name = "certifier_program"
path = "../../verity/core/protocols/certifier/lean"

[[require]]
name = "core_randomness"
path = "../../verity/core/primitives/randomness"

# V*'s circuits as core code (`VStar`), which the bridge (`Proofs.Flock.VBridge.OfVStar`) is stated over
[[require]]
name = "core_vstar"
path = "../../verity/core/service/vstar"

# The properties a proof here proves (`Properties`), stated against the code where that proof needs this package.
[[require]]
name = "security_properties"
path = "../Properties"

[[lean_lib]]
name = "Proofs"
roots = ["Proofs.Core", "Proofs.Nci", "Proofs.Pous", "Proofs.Pouw", "Proofs.NetworkCertifier", "Proofs.Flock",
  "Proofs.Accounting", "Proofs.Hash", "Proofs.Population", "Proofs.Properties.Pouw", "Proofs.Properties.Pouw.Check",
  "Proofs.Properties.Pouw.Commit", "Proofs.Properties.Pouw.LiveSalt", "Proofs.Properties.Pouw.LiveSalt.Ledger",
  "Proofs.Properties.Pouw.LiveSalt.Canon", "Proofs.Properties.Pouw.LiveSalt.Coin", "Proofs.Properties.Pouw.Strata",
  "Proofs.Properties.Nci", "Proofs.Properties.CertifierDevice", "Proofs.Properties.Pous",
  "Proofs.Properties.Pous.TimedAudit", "Proofs.Properties.Pous.MemoryChallenger", "Proofs.Properties.Pous.Run",
  "Proofs.Properties.Pous.Setup", "Proofs.Properties.Pous.RunAt",
  "Proofs.Properties.NetworkCertifier", "Proofs.Properties.CertifierNetwork", "Proofs.Properties.CertifierNetwork.Runs",
  "Proofs.Properties.Identity", "Proofs.Properties.Nci.DescVerdict", "Proofs.Properties.Nci.DescAgree",
  "Proofs.Properties.Nci.Walk", "Proofs.Properties.Nci.Resolve", "Proofs.Properties.Nci.BodiesOk",
  "Proofs.Properties.Nci.Width", "Proofs.Properties.Nci.Novel", "Proofs.Properties.Nci.BaselineSteps",
  "Proofs.Properties.Nci.Baseline", "Proofs.Properties.Nci.OperandsResolve", "Proofs.Properties.Nci.Agrees",
  "Proofs.Properties.SampledProofs", "Proofs.Properties.SampledProofs.Halt", "Proofs.Properties.Evaluate",
  "Proofs.Properties.NetworkRecords", "Proofs.Properties.NetworkPeriod", "Proofs.Properties.Accounting.Requirement",
  "Proofs.Properties.RemoteAudit",
  "Proofs.Properties.RemoteAudit.Coins", "Proofs.Properties.RemoteAudit.Frozen", "Proofs.Properties.RemoteAudit.Order",
  "Proofs.Properties.RemoteAudit.Pooled", "Proofs.Properties.Accounting.Served", "Proofs.Properties.RemoteAudit.Line",
  "Proofs.Properties.RemoteAudit.Schedule", "Proofs.Properties.RemoteAudit.Shared",
  "Proofs.Properties.RemoteAudit.SharedLink", "Proofs.Properties.RemoteAudit.Live",
  "Proofs.Properties.RemoteAudit.Component",
  "Proofs.Properties.Pouw.LiveSalt.Ledger", "Proofs.Properties.Nci.ReadsExact",
  "Proofs.Properties.Nci.BodiesOk.ReadsDecoded", "Proofs.Properties.Composition", "Proofs.Properties.Nci.Protocol",
  "Proofs.Properties.Verity.Soundness", "Proofs.Properties.Verity.Subprotocols"]
