[project]
name = "verity-pous"
version = "0.0.0"
description = "Proof of useful space, design C: auditor-secret filler, timed linear-MAC audits, CPU reference challenger (prototype)."
requires-python = ">=3.12"
dependencies = ["verity", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_pous"]

[tool.uv.sources]
verity = { workspace = true }
