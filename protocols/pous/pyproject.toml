[project]
name = "verity-pous"
version = "0.1.0"
description = "POUS P3: the two-layer invertible labelling, its public decoder, the timed audit and adversary replay, as a spec-level reference for the Lean model."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_pous"]

[tool.uv.sources]
verity = { workspace = true }
