[project]
name = "verity-sampled-proofs"
version = "0.1.0"
description = "Sampled proofs: the two-stage sampling law, its draws from the verifier's own randomness, and verification plans over Verity Programs."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_sampled_proofs"]

[tool.uv.sources]
verity = { workspace = true }
