[project]
name = "verity-pouw"
version = "0.1.0"
description = "Proof of useful work: one generic protocol (workload, commitments, beacon salt, work-weighted audit, profile) with schemes behind it (NCP, Pearl)."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_pouw"]

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
