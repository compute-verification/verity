[project]
name = "verity-pouw"
version = "0.1.0"
description = "Proof of useful work: one generic protocol (workload, commitments, beacon salt, work-weighted audit, profile) with schemes behind it (NCP, Pearl)."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_pouw"]

[tool.uv.sources]
verity = { workspace = true }

[tool.verity.tests]
# Test-only: the Lean package's FP8 vector generator (lean/scripts/fp8atom_vectors.py, which test_lean_package.py runs)
# reads the HOPPER wgmma model replays and the RTX 4090 captures.
inputs = ["fixtures/tc/vectors/fp8-hopper-wgmma-k1536.json", "fixtures/tc/vectors/fp8-hopper-wgmma-k32.json",
          "packages/verity/tests/ml/fixtures/golden/ada_e4m3_m16n8k32.json"]
parallel = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]
