[project]
name = "verity-pouw"
version = "0.0.0"
description = "Proof of useful work: device-bound seeds, noised dot products, tickets, work claims over an integrity allowance (prototype)."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_pouw"]

[tool.uv.sources]
verity = { workspace = true }
