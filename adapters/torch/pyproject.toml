[project]
name = "verity-torch"
version = "0.1.0"
description = "Verity's PyTorch adapter: the translator from a PyTorch module, graph or op to circuits, which the vLLM adapter sits on."
requires-python = ">=3.12"
dependencies = [
    "verity",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "verity_torch",
]

[tool.uv.sources]
verity = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
]
