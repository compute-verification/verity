[project]
name = "verity-torch"
version = "0.1.0"
description = "Verity's PyTorch adapter: the translator from a PyTorch module, graph or op to circuits, which the vLLM adapter sits on."
requires-python = ">=3.12"
dependencies = [
    "verity",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "triton"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "verity_torch",
]

[tool.uv.sources]
verity = { workspace = true }

[tool.verity.tests]
# the translator reads the served kernels' Definitions from the vLLM adapter, which depends on this package, so they are
# inputs rather than a dependency; loading them reads the package's `__init__.py`
inputs = [
    "adapters/vllm/verity_vllm/__init__.py",
    "adapters/vllm/verity_vllm/definitions",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "slow: takes over about 5 s; deselect with -m 'not slow'",
]
