# Where each of the served run's runs goes and what its node holds, which run.sh reads; ${NAME} is a launch's parameter.

row = "llama32-1b__int8__h200__tp1__b4__i256__o32__mixed__greedy__bi-eager"
tied_row = "llama32-1b__bf16__h200__tp1__b4__i256__o32__mixed__greedy__bi-eager"

[node.vy-spot-glm53]
VENV = "/workspace/venv312"
CUDA_HOME = "/usr/local/cuda-12.9"
# CUDA 12.9 has no nvdisasm, which cuobjdump needs for the Pearl-C cubin's SASS
NVDISASM_PATH = "/usr/local/cuda-13.0/bin"
HF_HOME = "/workspace/research/vllm-servedproof/hf"
LLAMA_ROOT = "/workspace/research/vllm-servedproof/llama"
FLOCK_WORK = "/workspace/research/vllm-servedproof/flock-work"
DISK_FLOOR_GB = "60"
HIDDEN_SO = "/workspace/research/vllm-servedproof/taps/fa2/build/fa3_matReqG/verity_fa3_matReqG.so"
NORM_TAP_SO = "/workspace/research/vllm-servedproof/taps/norm_tap/build/verity_norm_tap.so"
SERVE_ROOT = "/workspace/research/vllm-servedproof/serve-root"
# the commit the taps were built at
TAPS_AT = "962b517e613e5c0eece1dce159083c3ee4ec85d0"

[node.vy-spot-glm53.builds]
# each row's setup run whose traced Build passed
"llama32-1b__int8__h200__tp1__b4__i256__o32__mixed__greedy__bi-eager" = "r20261115-161425-7366"
"llama32-1b__bf16__h200__tp1__b4__i256__o32__mixed__greedy__bi-eager" = "r20261116-212008-a373"

[node.vy-spot-glm53.env_files]
# each a mode-600 file on the node that sets the address its variable names, which no file of the tree holds
VY_CHALLENGER_1_HOST = "/root/.config/verity/challenger-1.env"
VY_AUDITOR_2_HOST = "/root/.config/verity/auditor-2.env"

[node.vy-spot-glm53.bindings]
# for a run on the auditor's coins, by binding key: `run.sh bindings APPLICATION` binds each to every party of the application whose
# piece reads it
gate = "research@${VY_CHALLENGER_1_HOST}"
peer = "vy-spot-glm53"
key = "tests/benchmarks/pouw/fixtures/challenger-key.json"
gate-key = "${HOME}/.ssh/vllm_lane_ed25519"
address = "${VY_AUDITOR_2_HOST}:47611"

[node.vy-nebius-cpu-14]

[run.setup]
node = "vy-spot-glm53"
research = ["--cwd", "clone", "--custody-ttl", "24h", "--timeout", "6h"]
wrap = ["taskset", "-c", "${CORES}"]
send_workload = true
env = { CARD = "${CARD}", CORES = "${CORES}", END = "${END}", GPU_LEASE_WHO = "vllm-served-run-setup" }

[run.setup.tie]

[run.window]
node = "vy-spot-glm53"
research = ["--cwd", "clone", "--custody-ttl", "24h", "--timeout", "6h"]
wrap = ["taskset", "-c", "${CORES}"]
send_workload = true

[run.window.env]
CARD = "${CARD}"
CORES = "${CORES}"
END = "${END}"
LEASE_MIN = "${LEASE_MIN:-}"
PRODUCT = "remote"
COMPOSE_OFF_NODE = "1"
COMPOSE_NODE = "vy-nebius-cpu-14"
LEASE_MEM_GB = "128"
GPU_LEASE_WHO = "vllm-served-run"

[run.window.plain]
env = { POUW = "h1", H1_GATE = "", V3C_CLASS = "", COMPOSITE = "" }

[run.window.tie]
# V3C_AUDIT_MEM_GB above node A's memory defers the records audit off the node
env = { POUW = "pearlplus", PEARLPLUS_TIE = "1", V3C_CLASS = "4,32,4", V3C_LAW = "${V3C_LAW:-stratified-rate:1/2097152}", PRECISION = "bfloat16", V3C_AUDIT_MEM_GB = "2100", POUW_TIMEOUT = "300m", PEARLPLUS_LEAN_TIMEOUT = "13500" }

[run.window.coins.gate]
main_line = true
env = { PP_CHALLENGER = "gate:research@${VY_CHALLENGER_1_HOST}", PP_GATE_KEY = "${HOME}/.ssh/vllm_lane_ed25519", PP_CHALLENGER_KEY = "tests/benchmarks/pouw/fixtures/challenger-key.json" }

[run.window.coins.development]
env = { PP_CHALLENGER = "local", PEARLC_CHALLENGER_GATE = "", DEVELOPMENT = "1" }

[run.compose]
node = "vy-nebius-cpu-14"
research = ["--cwd", "clone", "--custody-ttl", "24h", "--timeout", "120m"]
send = ["${HANDOFF}/compose.tar", "${HANDOFF}/compose.tar.sha256"]

[run.copy]
node = "vy-spot-glm53"
research = ["--cwd", "clone", "--custody-ttl", "24h", "--timeout", "3h"]
env = { SERVED_RUN = "${SERVED_RUN}", AUDIT_NODE = "${AUDIT_NODE}" }

[run.audit]
node = "${AUDIT_NODE}"
research = ["--cwd", "clone", "--custody-ttl", "24h", "--timeout", "8h"]
env = { SERVED_RUN = "${SERVED_RUN}", V3C_PEER = "${AUDIT_NODE}", V3C_AUDIT_TIMEOUT = "${V3C_AUDIT_TIMEOUT:-}", V3C_WARM_JOBS = "${V3C_WARM_JOBS:-}" }

[run.audit.coins.gate]
main_line = true
env = { PP_GATE_KEY = "~/.ssh/vllm_lane_ed25519", PP_CHALLENGER_KEY = "tests/benchmarks/pouw/fixtures/challenger-key.json" }

[run.audit.coins.development]
