# `verity run --bindings` for `demos/onsite_network.toml` with the workload on node A; each ${NAME} is filled where the workload runs
# (`run.sh settings MODEL -- CMD`), from the node's env files (placement.toml's env_files) and its environment.
[challenger.sampled-proofs]
gate = "research@${VY_CHALLENGER_1_HOST}"
