# The inputs `verity-vllm workload ROW` reads that a row id doesn't give, for each stored row the generator reproduces byte for
# byte (`SHA256SUMS`).  [checkpoint."<model>__<dtype>"]: the row id's first two fields' repository, revision, case and the
# sha256 of the tokenizer.json its prompts are tokenized with, or tokenizer_of: the checkpoint whose tokenizer.json, the
# same file, can be read without a key.  [row."<row id>"]: what the row adds, each key optional:
# note_prefix (the text its note starts with), arrival_rule ("round": the arrive_step rule before realized_arrive_steps),
# arrivals (when not the id's: staggered for "<...>-arrivals", else none), shared_prefix, target and reasons (as --target and --reason).

