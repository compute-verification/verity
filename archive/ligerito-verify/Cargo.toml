[package]
name = "verity-ligerito-verify"
version = "0.1.0"
edition = "2021"
description = "Independent verifier for the Ligerito backend (archive/direct/ligerito): recursive Ligero PCS over BabyBear with F_{p^6} challenges, coefficient-basis Reed-Solomon, BLAKE3 Merkle multi-openings, partial sumcheck; plus the zero-check sumcheck verifier and the LGTO proof reader.  No dependencies, no shared code with the Python prover or with ligero-verify (the primitives are copied, not linked)."

[dependencies]
# none

[lib]
name = "ligerito_verify"
path = "src/lib.rs"

[[bin]]
name = "ligerito-verify"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
lto = "fat"
