[project]
name = "verity-direct"
version = "0.0.0"
description = "B-Ligero, frozen: its Python provers and tests."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-numerical", "numpy", "blake3>=1.0"]

[project.optional-dependencies]
torch = ["torch>=2.4"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-numerical = { workspace = true }

[tool.pytest.ini_options]
# The other test directories here (tests/, encode/tests/, ligero/v2/tests/, ligerito/) need torch or a GPU, or are Rust,
# and were never part of `check`; archive/README.md lists them.
testpaths = ["ligero/tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["archive/ligero-verify", "benchmarks/census"]
