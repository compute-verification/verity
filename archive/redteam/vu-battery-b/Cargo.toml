[package]
name = "redteam-vu-b"
version = "0.1.0"
edition = "2021"
description = "Red-team battery against the Candidate B full-VU prover (verity-direct ChainAir): adversarial traces through the real prove/verify, the trace evaluator, and the challenger audit."

[[bin]]
name = "redteam-vu-b"
path = "src/main.rs"

[dependencies]
verity-direct = { path = "../../direct" }
p3-field = "=0.4.3-succinct"
p3-goldilocks = "=0.4.3-succinct"
p3-baby-bear = "=0.4.3-succinct"
p3-matrix = "=0.4.3-succinct"
p3-uni-stark = "=0.4.3-succinct"
p3-challenger = "=0.4.3-succinct"
p3-keccak = "=0.4.3-succinct"
serde_json = "1.0"

[profile.release]
opt-level = 3
debug = false

# the same patched p3-fri and BabyBear^6 p3-baby-bear as verity-direct (archive/direct/Cargo.toml): a patch
# applies per root manifest
[patch.crates-io]
p3-baby-bear = { path = "../../direct/vendor/p3-baby-bear" }
p3-fri = { path = "../../direct/vendor/p3-fri" }
