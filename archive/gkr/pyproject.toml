[project]
name = "verity-gkr"
version = "0.0.0"
description = "A-GKR, frozen: its Python drivers and tests."
requires-python = ">=3.12"
dependencies = ["research", "verity", "verity-numerical", "numpy", "blake3>=1.0"]

[project.optional-dependencies]
torch = ["torch>=2.4"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.uv.sources]
research = { workspace = true }
verity = { workspace = true }
verity-numerical = { workspace = true }

[tool.pytest.ini_options]
# The test directories under packed/, gpu/v2/, tensor/ and verifier/ need torch, a GPU or cargo, and were never part of
# `check`; archive/README.md lists them.
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["archive/direct", "benchmarks/census"]
