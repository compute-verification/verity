# The onsite applications' varied load (applications/onsite_compute.toml, onsite_network.toml): served_verdicts.sh's
# LOAD=varied at its defaults, four requests (REQUESTS, its SLOTS) at 1000 a second (RATE) with prompts of 16 to 24 tokens
# (PROMPTS) and at most 4 outputs (MAX_TOKENS), seed 1 (SEED), to the int8 checkpoint at revision
# 15b0976d400d796ee589e7737d03a919526bf800. Each record keeps its arrival (`at_s`, seconds from the start), played by
# `timed("column", name="at_s")`. The token ids are unsloth/Llama-3.2-1B's tokenizer.json at revision
# 9535bd9b1d1dea6acafbdc4813b728796aeb28da, the int8 checkpoint's same file (adapters/vllm/workloads/generation.toml's
# tokenizer_of), with BOS, as serve-openai's /tokenize returns them: each head is one of the six questions in Llama 3's
# user header, the tail the assistant header, the filler its notes.
kind = "timed-completion-requests"

