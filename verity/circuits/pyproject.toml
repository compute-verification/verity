# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_ruff.py"]
# Test-only: tests register the catalog's Definitions before decoding, tests/evaluation self-checks every registered kernel
# against its Definition (the kernels and the silicon models they read), tests/test_stacking holds property/v1's table to
# Lean's registry, and tests/test_lean_gates recomputes the circuit model's rows from s8, census/v1 and property/v1.
# tests/test_ruff runs ruff, which the guard doesn't trace, under the repository's one configuration (ruff.toml).
inputs = ["verity", "verity/circuits", "verity/definitions/kernels", "Security/Definitions/Accounting/Gates/Registry.lean",
          "Security/Proofs/Accounting/Gates/Rows.lean", "ruff.toml"]
parallel = true

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_codec_stream.py"]
paths = ["verity"]

[[tool.verity.tests.reads]]
tests = ["tests/test_population_recorded.py"]
paths = ["verity/errors.py", "verity/circuits", "verity/definitions/kernels"]

[[tool.verity.tests.reads]]
tests = ["tests/test_settings.py"]
paths = ["verity/circuits"]
