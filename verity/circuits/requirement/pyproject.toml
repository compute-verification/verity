# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_census_and_memory_map.py", "tests/test_requirement_difftest.py"]
# Test-only: the reference is `verity.circuits.requirement` (with its census path), and two of its Programs are rows
# of the Definitions (`verity.definitions.registry`: `b1`, over `prims`); the memory-map test holds the vLLM
# integration's builder (`verity_vllm.protocols.remote_bandwidth.memory_map.Lines`) on request Programs
# `verity_vllm.program.predict.build` builds, whose imports reach most of
# `verity_vllm` and, through it and the builder, PoUB's record (`Replay`, `codec`), PoUW's
# circuits, SPOT's service (`pipeline.serving_rows` resolves a rate law by it), the commitments and the hashes; `lake` builds this package against the difftest harness's Lean, required by
# path, and the base packages the harness requires (`Base.Canon` and what it imports).
inputs = ["verity/circuits", "verity/circuits/kernels/__init__.py", "verity/circuits/kernels/tc.py", "verity/__init__.py", "tools/config/verity_config/verity_settings.py",
          "verity/errors.py", "tools/difftest", "verity/definitions",
          "verity/channel.py",
          "adapters/vllm/verity_vllm",
          "verity/protocols/proofs/spot/verifier/profile.py",
          "verity/claims/__init__.py", "verity/protocols/accounting/pouw/verifier", "verity/protocols/accounting/poub/verifier",
          "verity/protocols/accounting/pouw/prover",
          "verity/protocols/proofs/spot/verifier/__init__.py", "verity/protocols/proofs/spot/device/challenger.py",
          "verity/protocols/proofs/spot/device/remote.py", "verity/protocols/proofs/spot/verifier/one_stage",
          "verity/protocols/proofs/spot/verifier/service.py", "verity/protocols/proofs/spot/device/coins.py",
          "verity/protocols/proofs/spot/verifier/second_stage.py", "verity/protocols/proofs/spot/verifier/schedule.py",
          "verity/protocols/proofs/spot/verifier/window_place.py",
          "verity/commitments/windows", "verity/commitments",
          "verity/commitments/crypto", "verity/commitments/randomness",
          "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/accounting/__init__.py", "verity/protocols/accounting/poub/__init__.py",
          "verity/protocols/accounting/pouw/__init__.py", "verity/protocols/proofs/spot/__init__.py",
          "verity/protocols/proofs/spot/device/__init__.py", "verity/circuits/base", "verity/circuits/lean"]
