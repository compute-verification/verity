# A test suite of the `verity` distribution (the repository root's pyproject.toml), not a distribution.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py", "verity/primitives/__init__.py", "verity/errors.py", "verity/ml", "packages/verity/tests/ml/fixtures", "fixtures/tc"]
parallel = true
