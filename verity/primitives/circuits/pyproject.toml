[project]
name = "verity-primitives-circuits"
version = "0.1.0"
description = "Verity core's circuits primitive: the IR and the evaluator."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ir", "evaluation"]
exclude = ["tests"]
sources = { "" = "verity/primitives/circuits" }
dev-mode-dirs = ["../../.."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["packages/verity", "fixtures/tc"]
parallel = true
