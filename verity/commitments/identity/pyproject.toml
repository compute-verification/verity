[project]
name = "core-identity"
version = "0.1.0"
description = "The differential test of core_identity, the identity hash in Lean (streaming SHA-512, tagged SHA-512), against verity.commitments.identity: the core difftest harness drives identity-difftest."
requires-python = ">=3.12"
dependencies = ["verity", "verity-difftest", "hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_identity_difftest.py"]
# Test-only: `lake` builds this package and, through its path requires, the difftest harness's Lean and these files of
# Flock's verifier (`Flock.Hash`, `Flock.Canon` and what they import, and the package's configuration).
inputs = ["verity/difftest/lean", "verity/protocols/flock/verifier/lakefile.toml",
          "verity/protocols/flock/verifier/lake-manifest.json", "verity/protocols/flock/verifier/lean-toolchain",
          "verity/protocols/flock/verifier/Flock/Field.lean", "verity/protocols/flock/verifier/Flock/Bytes.lean",
          "verity/protocols/flock/verifier/Flock/Hash.lean", "verity/protocols/flock/verifier/Flock/Canon.lean",
          "verity/__init__.py", "verity/commitments/__init__.py"]
