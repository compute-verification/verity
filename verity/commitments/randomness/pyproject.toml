# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py", 
          "verity/commitments/__init__.py",
          "verity/errors.py", "verity/commitments/identity.py", "verity/commitments/indexed.py", "verity/commitments/limits.py", "verity/commitments/merkle.py", "verity/commitments/scheme.py", "verity/commitments/crypto/__init__.py", "verity/commitments/crypto/blake3.py"]
