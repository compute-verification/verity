# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: test_hm96 looks up the claims hm96's PROTOCOL.md cites in verity.claims, and test_block_check holds the
# check-3 units to PoUB's codec and receipts. test_layout reads commit_slots' interface fixture,
# whose layout is slots._layout_json's.
inputs = ["verity", "verity/circuits", "verity/definitions/kernels", "verity/claims", "adapters/vllm/verity_vllm/settings.py", "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/check", "verity/commitments/hm96/PROTOCOL.md",
          "verity/protocols/poub/verifier", "verity/commitments/tests/fixtures/commit-slots-v1.json"]
parallel = true
worker_gb = 8

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_lms_sign_lean_difftest.py"]
paths = ["verity/commitments/crypto"]
