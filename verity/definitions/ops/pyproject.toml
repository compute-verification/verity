# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: a Definition registers its kernel lazily (verity.definitions.kernels, which imports the catalog, so it is no dependency here).
# tests/test_tc_probe_families.py imports the tensor-core probe's tile generation (benchmarks/tc_probe/tc_probe.py).
# tests/test_discrepancy_log.py checks that each evidence ref in verity/definitions/silicon/discrepancy_log.json exists, which the
# guard can't see, so every ref outside this directory is listed here (its test_every_evidence_path_is_an_input_of_this_suite fails on one that isn't).
inputs = ["verity", "Security", "verity/definitions/kernels", "adapters/vllm/verity_vllm/settings.py", "adapters/vllm/verity_vllm/__init__.py",
          "adapters/vllm/verity_vllm/check", "benchmarks/tc_probe", "benchmarks/tc_probe_fp4/probe.py",
          "benchmarks/numerical/python/verity_numerical/reference/hawkeye_close.py",
          "benchmarks/numerical/tests/checker/test_fp8.py",
          "benchmarks/numerical/tests/reference/hawkeye_harness.cpp",
          "benchmarks/numerical/tests/reference/test_hawkeye_close.py",
          "benchmarks/numerical/tests/reference/test_normalisation_d3.py"]
parallel = true

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_boundaries.py", "tests/test_census_products.py"]
paths = ["verity/circuits"]

[[tool.verity.tests.reads]]
tests = ["tests/test_trace_cache.py"]
paths = ["verity"]
