# The descriptor v1 evaluator: `verity.circuits.evaluation.reference.evaluate` on a Program, as executable Lean. It reads the
# Program through C-Flock's verifier (`Flock.Program`: decode, layout, scope resolution) and adds the primitives' semantics;
# it is code, so it requires nothing of `security/` (root AGENTS.md, "Lean").
name = "verity_evaluate"
defaultTargets = ["Evaluate", "verity-evaluate"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_base"
path = "../../circuits/base"

[[require]]
name = "core_circuits"
path = "../../circuits/lean"

[[require]]
name = "verity_difftest"
path = "../../../tools/difftest/lean"

[[lean_lib]]
name = "Evaluate"

[[lean_exe]]
name = "verity-evaluate"
root = "Evaluate.Main"
