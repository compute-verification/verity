# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_census_and_memory_map.py", "tests/test_requirement_difftest.py"]
# Test-only: the reference is `verity.definitions.circuits.requirement` (with its census path), and two of its Programs are rows
# of the Definitions (`verity.definitions.registry`: `b1`, over `prims`); the memory-map test holds the Commit's
# builder (`verity_vllm.protocols.remote_bandwidth.commit_map`) on request Programs `verity_vllm.program.predict.build`
# builds, whose imports reach most of
# `verity_vllm` and, through it and the builder, PoUB's record (`Replay`, `codec`), PoUW's
# circuits, SPOT's service (`pipeline.serving_rows` resolves a rate law by it), the commitments and the hashes; `lake` builds this package against the difftest harness's Lean and these
# files of Flock's verifier (`Flock.Canon` and what it imports, and the package's configuration), both required by
# path.
inputs = ["verity/circuits", "verity/definitions/kernels/__init__.py", "verity/definitions/kernels/tc.py", "verity/__init__.py", "verity/settings.py",
          "verity/errors.py", "verity/ml/__init__.py", "verity/difftest", "verity/definitions",
          "verity/hardware/record.py",
          "integrations/vllm/verity_vllm",
          "verity/core/__init__.py", "verity/core/protocols/__init__.py", "verity/spot/verifier/profile.py",
          "verity/claims/__init__.py", "verity/protocols/pouw/verifier", "verity/protocols/poub/verifier",
          "verity/ml/protocols/__init__.py", "verity/protocols/pouw/prover",
          "verity/spot/verifier/__init__.py", "verity/spot/device/challenger.py",
          "verity/spot/device/remote.py", "verity/spot/verifier/one_stage",
          "verity/spot/verifier/service.py", "verity/spot/device/coins.py",
          "verity/spot/verifier/second_stage.py", "verity/spot/verifier/schedule.py",
          "verity/windows", "verity/commitments",
          "verity/commitments/crypto", "verity/commitments/randomness",
          "verity/flock/verifier/lakefile.toml", "verity/flock/verifier/lake-manifest.json",
          "verity/flock/verifier/lean-toolchain", "verity/flock/verifier/Flock/Field.lean",
          "verity/flock/verifier/Flock/Bytes.lean", "verity/flock/verifier/Flock/Canon.lean"]
