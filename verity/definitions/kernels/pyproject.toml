# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_row_commit.py", "tests/test_sha512.py"]
# Test-only: test_row_commit holds row_commit.cuh to verity.commitments' frame-v3 and hm96 references, vectors and gates,
# which import verity.circuits, verity.commitments.crypto and verity.errors.
inputs = ["verity/__init__.py", "verity/ml/__init__.py", "verity/errors.py", "verity/commitments", "verity/circuits",
          "verity/commitments/crypto"]
