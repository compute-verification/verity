# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity`: the deployment layer, the wire it reads frames with, and S1's LMS for the parties'
# test keys (the handshake signs with them). The parties and the manifest are named by their files, so they stay inputs
# wherever they sit.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/configuration/wire/__init__.py",
          "verity/configuration/wire/handshake.py", "verity/configuration/deploy/party.py",
          "verity/configuration/deploy/manifest.py",
          "verity/commitments/crypto",
          "verity/configuration/__init__.py",
          "verity/commitments/__init__.py", "verity/commitments/identity.py", "verity/commitments/indexed.py", "verity/commitments/limits.py", "verity/commitments/merkle.py", "verity/commitments/scheme.py"]
