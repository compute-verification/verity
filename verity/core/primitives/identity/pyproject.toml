[project]
name = "core-identity"
version = "0.1.0"
description = "The differential test of core_identity, the identity hash in Lean (streaming SHA-512, tagged SHA-512), against verity.ml.commitments.identity: the core difftest harness drives identity-difftest."
requires-python = ">=3.12"
dependencies = ["verity", "verity-difftest", "hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds this package and, through its path requires, the difftest harness's Lean and these files of
# Flock's verifier (`Flock.Hash`, `Flock.Canon` and what they import, and the package's configuration).
inputs = ["verity/core/difftest/lean", "verity/core/proof_system/flock/lakefile.toml",
          "verity/core/proof_system/flock/lake-manifest.json", "verity/core/proof_system/flock/lean-toolchain",
          "verity/core/proof_system/flock/Flock/Field.lean", "verity/core/proof_system/flock/Flock/Bytes.lean",
          "verity/core/proof_system/flock/Flock/Hash.lean", "verity/core/proof_system/flock/Flock/Canon.lean"]
