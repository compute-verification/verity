[project]
name = "verity-core-evaluate"
version = "0.0.0"
description = "The Lean evaluator of descriptor v1 (`verity-evaluate`, this directory's Lake package), difftested against the Python reference."
requires-python = ">=3.12"
# No dependencies: the tests run in the workspace's environment, against the editable `verity`, and `inputs` keys them
# on it.
dependencies = []

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `lake build` reads this package and C-Flock's verifier (verity/core/service/flock), which it requires by path; the Python
# reference is verity.ml.circuits, with the word primitives the vLLM integration registers (its registry package, and the
# package's own `__init__`s it imports through), the row primitives' vectors `Security` pins, the vLLM integration's
# `store_io`, through which the GPU captures held in the evidence store are fetched (and what the store CLI it starts reads of
# the `research` package), and the L40S captures of SiLU and RoPE the benchmarks hold. The tests build
# `verity-evaluate` themselves, from those sources, and so declare no `artifacts`; `check` runs them after its Lean steps
# (`AFTER_LEAN`), since that build writes into the verifier's `.lake`.
inputs = ["verity", "integrations/vllm/verity_vllm/__init__.py", "integrations/vllm/verity_vllm/program/__init__.py",
          "verity/ml/definitions/registry", "Security/Definitions/Pouw/PearlC/RowPrimVectors.lean",
          "integrations/vllm/tests/regression/store_io.py",
          "tools/research/src/research/__init__.py", "tools/research/src/research/__main__.py",
          "tools/research/src/research/cli.py", "tools/research/src/research/waitcap.py", "tools/research/src/research/clone.py", "tools/research/src/research/compare.py",
          "tools/research/src/research/env.py", "tools/research/src/research/record.py", "tools/research/src/research/remote.py",
          "tools/research/src/research/result.py", "tools/research/src/research/runs.py",
          "tools/research/src/research/withdraw.py",
          "tools/research/src/research/secret_hint.py", "tools/research/src/research/timefmt.py",
          "tools/research/src/research/store", "tools/research/src/research/telemetry",
          "benchmarks/numerical/tests/bench/data/captured-101/slices/silumul-v1-i8192",
          "benchmarks/numerical/tests/bench/data/captured-101/slices/rope-head-d64"]
# Each xdist worker starts its own evaluator; `verity_difftest.build` takes its lock, so the workers build one at a time.
parallel = true
