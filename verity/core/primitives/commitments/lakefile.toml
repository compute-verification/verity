# Commitments and the draw as executable Lean: frame-v3, the tree every committed value is opened from (`FV3`), and
# the unit draw, the challenger's coins sampling the units with exact samplers (`Draw`). Lean core and the bytes and
# hashes below (`core_base`). The declarations keep the namespace `Flock`.
name = "core_commitments"
defaultTargets = ["Commitments"]

[leanOptions]
autoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_base"
path = "../base"

[[lean_lib]]
name = "Commitments"
