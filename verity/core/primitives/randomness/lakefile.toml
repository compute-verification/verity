# `verity.ml.randomness` v2 as executable Lean: `derive`, the counter-mode stream, `shard` and the exact samplers, on
# C-Flock's SHA-512 and `Flock.Draw`; and what those derivations and every commitment are keyed by: the table of domain
# separators (`Randomness.Domains`), streaming SHA-512 and the tagged SHA-512 identity hash (`Randomness.Sha512`,
# `Randomness.Tagged`), which `core_identity` re-exports. PoUW, PoUS and the one-stage audit import it; the soundness
# proofs' keyed-draw theorems are about it. No Mathlib.
name = "core_randomness"
defaultTargets = ["Randomness"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[lean_lib]]
name = "Randomness"
roots = ["Randomness", "Randomness.Domains", "Randomness.Tagged"]
