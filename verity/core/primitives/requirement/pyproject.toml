# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the reference is `verity.ml.circuits.requirement`, and two of its Programs are rows of the vLLM registry
# (`b1`, over `prims`); `lake` builds this package against the difftest harness's Lean and these files of C-Flock's
# verifier (`Flock.Canon` and what it imports, and the package's configuration), both required by path.
inputs = ["verity/ml/circuits", "verity/ml/kernels/__init__.py", "verity/ml/kernels/tc.py", "verity/__init__.py",
          "verity/errors.py", "verity/ml/__init__.py", "verity/core/difftest",
          "integrations/vllm/verity_vllm/__init__.py", "integrations/vllm/verity_vllm/program/__init__.py",
          "integrations/vllm/verity_vllm/program/registry/__init__.py",
          "integrations/vllm/verity_vllm/program/registry/b1.py",
          "integrations/vllm/verity_vllm/program/registry/prims.py",
          "verity/core/service/flock/lakefile.toml", "verity/core/service/flock/lake-manifest.json",
          "verity/core/service/flock/lean-toolchain", "verity/core/service/flock/Flock/Field.lean",
          "verity/core/service/flock/Flock/Bytes.lean", "verity/core/service/flock/Flock/Canon.lean"]
