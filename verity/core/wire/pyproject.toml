# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity`: the wire, the commitments' canonical JSON it is held to, and S1's LMS, the handshake's
# party keys in deployment.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/ml/__init__.py", "verity/ml/circuits",
          "verity/ml/commitments", "verity/ml/crypto"]
