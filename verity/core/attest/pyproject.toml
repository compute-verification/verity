# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The tests hold the period tree to `verity.ml.commitments.merkle` and sign with `verity.ml.crypto.lms`'s HSS keys.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/ml/__init__.py",
          "verity/ml/commitments", "verity/ml/crypto"]
