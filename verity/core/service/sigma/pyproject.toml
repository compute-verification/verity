# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the reference is the Python mirror, the vLLM integration's `program.boolean.sigma_check`, over its composites
# and registry and the descriptors `verity.ml.circuits` encodes and decodes (with what those import of core: the PoUW
# circuit's Boolean profile through the registry); `lake` builds this package against C-Flock's verifier and the difftest
# harness, both required by path.
inputs = ["integrations/vllm/verity_vllm", "verity/ml/circuits", "verity/ml/kernels", "verity/ml/randomness",
          "verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/core/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/pouw/__init__.py", "verity/core/protocols/pouw/protocol.py",
          "verity/core/protocols/pouw/circuit", "verity/core/protocols/pouw/schemes", "verity/core/service/flock",
          "verity/core/difftest"]
