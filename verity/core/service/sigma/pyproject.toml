# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the reference is the Python mirror, `verity.ml.definitions.boolean.sigma_check`, over the Definitions'
# composites and registry and the descriptors `verity.ml.circuits` encodes and decodes (with what those import of core:
# the PoUW circuit's Boolean profile through the registry); `lake` builds this package against C-Flock's verifier and
# the difftest harness, both required by path, and `flock-verify sigma-check` is C-Flock's verifier.
inputs = ["verity/ml/definitions", "integrations/vllm/verity_vllm", "verity/ml/circuits", "verity/ml/kernels",
          "verity/ml/randomness",
          "verity/__init__.py", "verity/settings.py", "verity/errors.py", "verity/ml/__init__.py", "verity/core/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/pouw/__init__.py", "verity/core/protocols/pouw/protocol.py",
          "verity/core/protocols/pouw/live_reads.py", "verity/ml/protocols/__init__.py", "verity/ml/protocols/pouw/__init__.py",
          "verity/ml/protocols/pouw/circuit", "verity/ml/protocols/pouw/schemes", "verity/core/service/flock",
          "verity/core/difftest"]
# Build outputs the tests run (`check` runs this suite after its Lean steps): the difftest server, and the verifier's command.
artifacts = ["verity/core/service/sigma/.lake/build/bin/sigma-difftest",
             "verity/core/service/flock/.lake/build/bin/flock-verify"]
