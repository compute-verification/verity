# V*'s `vstar` command and its difftest port (lane rec-v0's outer statement). The library `VStar` (each Ligerito level's
# `RecOpen{LANES, H}` statement and each `InnerRepCheck{S}` part of the algebra, emitted as the `flock-circuit` file
# `Flock.Circuit` parses) is in C-Flock's verifier's package, whose `Flock.RecVStar` holds a V* statement's circuit file to it.
name = "core_vstar"
defaultTargets = ["vstar", "vstar-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../flock"

[[require]]
name = "verity_difftest"
path = "../../difftest/lean"

[[lean_exe]]
name = "vstar"
root = "VStarMain"

[[lean_exe]]
name = "vstar-difftest"
root = "VStarDifftest"
