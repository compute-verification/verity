# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the references are Flock's Python builders (verity_flock) over core's forms, gadgets and codec, and a
# statement's bindings are the one-stage audit's partition (`one_stage.partition`, which `rec_residuals.statement` reads)
# and its registered values (`one_stage.registered`, which the stagers commit V*'s port inputs under);
# `lake` builds this package against Flock's verifier and the difftest harness, both required by path.
inputs = ["verity/ml/flock/python", "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto", "verity/ml/kernels",
          "verity/ml/randomness", "verity/__init__.py", "verity/errors.py", "verity/ml/__init__.py", "verity/core/service/flock",
          "verity/core/difftest", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/sampled_proofs/__init__.py",
          "verity/core/protocols/sampled_proofs/one_stage/__init__.py",
          "verity/core/protocols/sampled_proofs/one_stage/partition.py",
          "verity/core/protocols/sampled_proofs/one_stage/registered.py"]
# Each test builds what it runs (`verity_difftest.build`, one at a time across processes) and opens its own server, so the
# 2100 s of tests (the longest 440 s) spread over workers.
parallel = true
