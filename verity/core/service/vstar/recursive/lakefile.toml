# Sampled proofs' recursive audit as a `Core.BlobProtocol` (`verity/sampled-proofs/recursive/v1`, `VStar.Recursive`): one-stage
# v2's audit with its verdict of record V*'s compiled check (`flock-verify verify --zk` once per V* part, at that part's
# recursive inputs) on the blobs; and sampled proofs (`verity/sampled-proofs/v1`), whichever of one-stage v2 and the
# recursive audit the auditor's params name. `vstar-recursive` is its command (`id | check | serve | verdicts`). Code, not
# analysis: Lean core, C-Flock, the interface and the one-stage audit.
name = "core_vstar_recursive"
defaultTargets = ["VStarRecursive", "vstar-recursive"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "core_protocol"
path = "../../../protocols/interface"

[[require]]
name = "flock_verifier"
path = "../../flock"

[[require]]
name = "core_sampled_proofs"
path = "../../sampled_proofs"

[[lean_lib]]
name = "VStarRecursive"

[[lean_exe]]
name = "vstar-recursive"
root = "VStarRecursiveMain"
