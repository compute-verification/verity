# Sampled proofs' one-stage audit as a `Core.Protocol` (`verity/sampled-proofs/one-stage/v1`): the registration record and
# its R1–R6, the partition, the draw's checks, the verdict and the integrity profile, ported from
# `verity/core/protocols/sampled_proofs/one_stage`. Code, not analysis: Lean core, C-Flock and the interface.
name = "core_sampled_proofs"
defaultTargets = ["SampledProofs", "sampled-proofs-one-stage", "sampled-proofs-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "core_protocol"
path = "../../protocols/interface"

[[require]]
name = "flock_verifier"
path = "../flock"

[[require]]
name = "verity_difftest"
path = "../../difftest/lean"

[[lean_lib]]
name = "SampledProofs"

[[lean_exe]]
name = "sampled-proofs-one-stage"
root = "SampledProofs.Main"

[[lean_exe]]
name = "sampled-proofs-difftest"
root = "SampledProofs.DifftestMain"
