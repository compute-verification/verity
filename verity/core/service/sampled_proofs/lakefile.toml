# Sampled proofs' one-stage audit as a `Core.Protocol` (`verity/sampled-proofs/one-stage/v1`): the registration record and
# its R1–R7 (v1 and v2 records), the partition, the draw's checks, the verdict, the integrity profile and the whole audit
# record: the audit's definition, which `verity/core/protocols/sampled_proofs/one_stage` mirrors and its difftest holds to
# it. `sampled-proofs-verifier` is the verifier of record the Python calls (`one_stage.verifier`). Code, not analysis: Lean
# core, C-Flock and the interface.
name = "core_sampled_proofs"
defaultTargets = ["SampledProofs", "sampled-proofs-one-stage", "sampled-proofs-one-stage-zk", "sampled-proofs-difftest",
  "sampled-proofs-verifier"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "core_protocol"
path = "../../protocols/interface"

[[require]]
name = "flock_verifier"
path = "../flock"

# The proof service's challenger signs its record with LMS (`SampledProofs.ChallengerRecord`).
[[require]]
name = "lms"
path = "../../primitives/lms/lean"

[[require]]
name = "verity_difftest"
path = "../../difftest/lean"

[[lean_lib]]
name = "SampledProofs"

[[lean_exe]]
name = "sampled-proofs-one-stage"
root = "SampledProofs.Main"

[[lean_exe]]
name = "sampled-proofs-one-stage-zk"
root = "SampledProofs.ZkMain"

[[lean_exe]]
name = "sampled-proofs-difftest"
root = "SampledProofs.DifftestMain"

[[lean_exe]]
name = "sampled-proofs-verifier"
root = "SampledProofs.VerifierMain"
