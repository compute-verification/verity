# The differential test's Lean half: `Difftest.serve`, the server every port's difftest executable runs, and an example
# port (`difftest-example`) that the harness's own tests drive, and the annotation check's port (`annot-difftest`, C-Flock's
# `Flock.Annot`), which the Python mirror's tests call through `verity_difftest.annot`. Code, not analysis: Lean core and
# C-Flock's verifier.
name = "verity_difftest"
defaultTargets = ["Difftest", "AnnotDifftest", "difftest-example", "annot-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[lean_lib]]
name = "Difftest"

[[lean_lib]]
name = "AnnotDifftest"

[[lean_exe]]
name = "difftest-example"
root = "DifftestExample"

[[lean_exe]]
name = "annot-difftest"
root = "AnnotDifftestMain"
