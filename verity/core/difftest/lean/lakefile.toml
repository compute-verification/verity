# The differential test's Lean half: `Difftest.serve`, the server every port's difftest executable runs, and an example
# port (`difftest-example`) that the harness's own tests drive. Code, not analysis: Lean core and C-Flock's canonical JSON.
name = "verity_difftest"
defaultTargets = ["Difftest", "difftest-example"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[lean_lib]]
name = "Difftest"

[[lean_exe]]
name = "difftest-example"
root = "DifftestExample"
