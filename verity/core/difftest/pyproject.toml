[project]
name = "verity-difftest"
version = "0.1.0"
description = "The differential test of core's Lean, the verifier of record, against the Python that mirrors it: Hypothesis drives the Python and the Lean executable on the same inputs."
requires-python = ">=3.12"
dependencies = ["hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_difftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_example_port.py", "tests/test_protocol_port.py"]
# Test-only: `lake` builds lean/ (in this directory) and, through its path requires, the base packages (`Base.Canon`
# and what it imports; `Base.JsonParse`, the JSON parser's port). The annotation port's test builds `annot-difftest`,
# which reads `Circuits.Annot`, `Circuits.AnnotExpand` and what they import (`verity_difftest.annot.INPUTS`), and holds
# it to `verity.ml.circuits.query_ast`. The protocol-mode tests build the core protocol interface's example
# (`core-protocol-example`), which reads the interface package and, of Flock's verifier, which it requires by path, the
# package's configuration, the names it imports the base modules by (`Flock.Bytes`, `Flock.Canon`, `Flock.Hash`) and
# the packages that one requires.
inputs = ["verity/core/protocols/interface", "verity/core/service/flock/lakefile.toml", "verity/core/service/flock/lake-manifest.json",
          "verity/core/service/flock/lean-toolchain", "verity/core/service/flock/Flock/Bytes.lean",
          "verity/core/service/flock/Flock/Canon.lean", "verity/core/service/flock/Flock/Hash.lean",
          "verity/core/primitives/base", "verity/core/primitives/circuits", "verity/core/primitives/commitments",
          "verity/__init__.py", "verity/ml/__init__.py", "verity/ml/circuits",
          # the JSON parser's port reads the recorded public files' headers (`RECORDED_FIXTURES`), fetched fixtures
          "verity/ml/flock/tests/fixtures/forged-proofs", "verity/ml/flock/tests/fixtures/public-inputs",
          "verity/ml/flock/tests/fixtures/public-inputs-blocks", "verity/ml/flock/tests/fixtures/rec-coins",
          "verity/ml/flock/tests/fixtures/rec-links", "verity/ml/flock/tests/fixtures/zk-sessions"]
