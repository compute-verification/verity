[project]
name = "verity-difftest"
version = "0.1.0"
description = "The differential test of core's Lean, the verifier of record, against the Python that mirrors it: Hypothesis drives the Python and the Lean executable on the same inputs."
requires-python = ">=3.12"
dependencies = ["hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_difftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds lean/ (in this directory) and, through its path require, these files of Flock's verifier
# (`Flock.Canon` and what it imports, and the package's configuration); the protocol-mode tests build the core protocol
# interface's example (`core-protocol-example`), which reads the same files and the interface package.
inputs = ["verity/core/protocols/interface", "verity/core/proof_system/flock/lakefile.toml", "verity/core/proof_system/flock/lake-manifest.json",
          "verity/core/proof_system/flock/lean-toolchain", "verity/core/proof_system/flock/Flock/Field.lean",
          "verity/core/proof_system/flock/Flock/Bytes.lean", "verity/core/proof_system/flock/Flock/Canon.lean"]
