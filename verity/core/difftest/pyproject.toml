[project]
name = "verity-difftest"
version = "0.1.0"
description = "The differential test of core's Lean, the verifier of record, against the Python that mirrors it: Hypothesis drives the Python and the Lean executable on the same inputs."
requires-python = ">=3.12"
dependencies = ["hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_difftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds lean/ (in this directory) and, through its path require, these files of C-Flock's verifier
# (`Flock.Canon` and what it imports, and the package's configuration); the protocol-mode tests build the core protocol
# interface's example (`core-protocol-example`), which reads the same files and the interface package.
inputs = ["verity/core/protocols/interface", "verity/core/service/flock/lakefile.toml", "verity/core/service/flock/lake-manifest.json",
          # The Python `Core.Answer` (`verity.core.protocols.answer`, with the packages it is imported through) is held
          # to that example's outcomes and to the harness's own framing.
          "verity/__init__.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/answer.py",
          "verity/core/service/flock/lean-toolchain", "verity/core/service/flock/Flock/Field.lean",
          "verity/core/service/flock/Flock/Bytes.lean", "verity/core/service/flock/Flock/Canon.lean"]
