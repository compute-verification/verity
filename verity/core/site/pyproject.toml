# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity`: the Site, and the wire's canonical JSON its digests are taken over.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/wire"]
