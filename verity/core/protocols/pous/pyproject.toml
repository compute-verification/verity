# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_pous_wipe_store.py", "tests/test_pous_wipe_stream.py"]
# What the tests import of `verity`, and PoUS's statements in Security with the lock and the pins they check them against.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/claims/__init__.py",
          "verity/core/attest/__init__.py", "verity/core/protocols/__init__.py", "verity/ml/__init__.py", "verity/circuits",
          "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness", "verity/core/wire", "verity/core/deploy",
          "Security/Definitions/Pous.lean", "Security/Definitions/Pous", "Security/Definitions/Pous", "Security/Proofs/Pous",
          "Security/lean-audit.json", "Security/lakefile.toml", "Security/lake-manifest.json", "Security/lean-toolchain",
          "Security/Proofs/lakefile.toml", "Security/Proofs/lake-manifest.json",
          "verity/core/protocols/pous/lean/README.md"]
