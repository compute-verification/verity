# The interface every core protocol implements: its parameters, commitment and evidence read from canonical bytes, one
# check, and an outcome (verdict, public outputs, profile) written as canonical JSON. Each protocol's package requires
# this one and C-Flock's verifier (for its canonical JSON, bytes and hashes); none needs Mathlib. It also holds the code's
# ticks, spans and monitoring period (`CoreProtocol.Period`), whose difftest port `core-periods-difftest` serves through
# the difftest harness's Lean.
name = "core_protocol"
defaultTargets = ["CoreProtocol", "core-protocol-example"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "verity_difftest"
path = "../../difftest/lean"

[[lean_lib]]
name = "CoreProtocol"

# Not a default target: the difftest harness builds it by name (`verity_difftest.build`).
[[lean_exe]]
name = "core-periods-difftest"
root = "CoreProtocol.PeriodDifftestMain"

[[lean_exe]]
name = "core-protocol-example"
root = "CoreProtocol.ExampleMain"
