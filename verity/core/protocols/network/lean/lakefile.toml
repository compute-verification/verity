name = "network_check"
defaultTargets = ["NetworkCheck", "network-check-difftest", "network-check", "network-records", "network-period",
  "network-rows"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

# The period's check reads a tied audit's wires as the sampled audit does (`Spot.Wires`, `Summary.drawnOk`),
# and the rows form reads its draw at its own δ by one-stage's bound (`Spot.Bound.boundOf`).
[[require]]
name = "core_spot"
path = "../../../service/spot"

[[require]]
name = "flock_verifier"
path = "../../../service/flock"

# The period's check reads a scan's layout off its description as NCI's check does (`NciCheck.Desc`'s layout checks).
[[require]]
name = "nci_check"
path = "../nci/lean"

# The check is a core protocol, reads the Program's grid from the certifier program (`expectedRow`, Σ_sync) and verifies
# certificates with the LMS port.
[[require]]
name = "core_protocol"
path = "../../interface"

[[require]]
name = "certifier_program"
path = "../../certifier/lean"

[[require]]
name = "lms"
path = "../../../primitives/lms/lean"

# `tagged_sha512` is core's identity hash.
[[require]]
name = "core_identity"
path = "../../../primitives/identity"

[[lean_lib]]
name = "NetworkCheck"

[[lean_exe]]
name = "network-check-difftest"
root = "NetworkCheck.DifftestMain"

[[lean_exe]]
name = "network-check"
root = "NetworkCheck.Main"

[[lean_exe]]
name = "network-records"
root = "NetworkCheck.RecordsMain"

[[lean_exe]]
name = "network-period"
root = "NetworkCheck.PeriodMain"

[[lean_exe]]
name = "network-rows"
root = "NetworkCheck.RowsMain"
