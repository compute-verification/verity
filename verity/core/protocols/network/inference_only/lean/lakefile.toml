# The NCI policy's check, the verifier's side: given a declaration (a descriptor v1 Program and its baseline θ) and a
# declared division into isolation units, decide `InferenceOnly.Complies Γ α` for that division (`Security/Definitions/InferenceOnly.lean`).
# It reads the Program with C-Flock's decoder (`Flock.Program`), required by path, and imports nothing else but Lean core
# and the core interface (`core_protocol`, for `InferenceOnlyCheck.Protocol`): no Mathlib and nothing of Security. The difftest
# holds it to the Python reference in `scripts/inference_only_reference.py`.
# `nci-check` runs `InferenceOnlyCheck.Desc`, the check at the size of the description, then θ's provenance (`InferenceOnlyCheck.Theta`),
# and `nci-check --unrolled` the reference. `inference-only` is the same check as the core protocol
# `verity/inference-only/v0` (`InferenceOnlyCheck.Protocol`), the inference-only policy's subprotocol of onsite and remote.
name = "inference_only_check"
defaultTargets = ["InferenceOnlyCheck", "nci-difftest", "nci-desc-difftest", "nci-desc-liveness", "nci-desc-fuzz", "nci-baseline-difftest",
  "nci-count-difftest", "nci-check", "inference-only"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../../service/flock"

[[require]]
name = "core_protocol"
path = "../../../interface"

[[lean_lib]]
name = "InferenceOnlyCheck"

[[lean_exe]]
name = "nci-difftest"
root = "InferenceOnlyCheck.DifftestMain"

[[lean_exe]]
name = "nci-desc-difftest"
root = "InferenceOnlyCheck.DescDifftestMain"

[[lean_exe]]
name = "nci-desc-liveness"
root = "InferenceOnlyCheck.DescLivenessMain"

[[lean_exe]]
name = "nci-desc-fuzz"
root = "InferenceOnlyCheck.DescFuzzMain"

[[lean_exe]]
name = "nci-baseline-difftest"
root = "InferenceOnlyCheck.ThetaDifftestMain"

[[lean_exe]]
name = "nci-count-difftest"
root = "InferenceOnlyCheck.CountDifftestMain"

[[lean_exe]]
name = "nci-check"
root = "InferenceOnlyCheck.CheckMain"

[[lean_exe]]
name = "inference-only"
root = "InferenceOnlyCheck.ProtocolMain"
