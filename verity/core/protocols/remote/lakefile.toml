# Remote Verity as one `Core.Protocol` (`verity/remote/v0`): the composition of integrity (sampled proofs) and work
# (PoUW). Its executable is the core CLI (`remote id | check | serve`),
# which the difftest drives. Code: no Mathlib.
name = "core_remote"
defaultTargets = ["CoreRemote", "remote"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# The ported components: sampled proofs' one-stage audit (integrity) and PoUW's window check (work).
[[require]]
name = "core_sampled_proofs"
path = "../../service/sampled_proofs"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# Integrity's choice of form: one-stage v2's audit or the recursive audit, V*'s compiled check (`VStar.Recursive`).
[[require]]
name = "core_vstar_recursive"
path = "../../service/vstar/recursive"

[[lean_lib]]
name = "CoreRemote"

[[lean_exe]]
name = "remote"
root = "RemoteMain"
