# Remote Verity as one `Core.Protocol` (`verity/remote/v0`): the composition of integrity (sampled proofs), work (PoUW's period)
# and the inference-only policy (`verity/inference-only/v0`). Its executable is the core CLI (`remote id | check |
# serve`), which the difftest drives. Code: no Mathlib.
name = "core_remote"
defaultTargets = ["CoreRemote", "remote"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# The ported subprotocols: sampled proofs' one-stage audit (integrity) and PoUW's period (work).
[[require]]
name = "core_spot"
path = "../../service/spot"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# The inference-only policy: its check as a core protocol (`InferenceOnlyCheck.Protocol`).
[[require]]
name = "inference_only_check"
path = "../network/inference_only/lean"

# Integrity: sampled proofs in the form its params name, one-stage v2's audit or the recursive audit, V*'s compiled
# check (`VStar.Recursive.Sampled`, `verity/sampled-proofs/v1`).
[[require]]
name = "core_vstar_recursive"
path = "../../service/vstar/recursive"

[[lean_lib]]
name = "CoreRemote"

[[lean_exe]]
name = "remote"
root = "RemoteMain"
