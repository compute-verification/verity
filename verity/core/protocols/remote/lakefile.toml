# Remote Verity as one `Core.Protocol` (`verity/remote/v0`): the composition of integrity (sampled proofs), work (PoUW)
# and the inference-only policy (`verity/inference-only/v0`). Its executable is the core CLI (`remote id | check |
# serve`), which the difftest drives. Code: no Mathlib.
name = "core_remote"
defaultTargets = ["CoreRemote", "remote"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# The ported subprotocols: sampled proofs' one-stage audit (integrity) and PoUW's window check (work).
[[require]]
name = "core_sampled_proofs"
path = "../../service/sampled_proofs"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# The inference-only policy: its check as a core protocol (`NciCheck.Protocol`).
[[require]]
name = "nci_check"
path = "../network/nci/lean"

[[lean_lib]]
name = "CoreRemote"

[[lean_exe]]
name = "remote"
root = "RemoteMain"
