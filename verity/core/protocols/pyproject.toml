# A suite of `verity`'s tests (the root's pyproject.toml is the distribution): those of verity/core/protocols' own modules; each
# protocol under it is a suite of its own.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests/test_profile.py builds a Program with partition levels from the catalog's GEMM.
inputs = ["verity", "verity/ml/circuits", "verity/ml/kernels"]
