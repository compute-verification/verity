# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity`: the audit's codec, receipts and record, on the commitments, the randomness and the
# profile; its coins on the one challenger, local and as a service.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/profile.py", "verity/core/protocols/sampled_proofs/__init__.py",
          "verity/core/claims/__init__.py",
          "verity/core/protocols/sampled_proofs/challenger.py", "verity/core/protocols/sampled_proofs/remote.py",
          "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments",
          "verity/ml/crypto", "verity/ml/randomness",
          # PoUS's setup, P2 and vk, which a P2 store is under (`p2.py`)
          "verity/core/protocols/pous",
          # the deployment layer and its wire, which the session's parties run on (`session_parties.py`)
          "verity/core/wire", "verity/core/deploy",
          # the circuit model's codec rows and the primitives' range rows, which test_encode_chain.py and
          # test_gate_ranges.py recompute from codec.encode_word, the f32 evaluators and property/v1's rules, and
          # Exp2Lut127's table, which test_gate_ranges.py holds to vLLM's (fixtures/exp2_lut127.json)
          "Security/Proofs/Accounting/Gates.lean", "Security/Definitions/Accounting/Gates/Ranges.lean",
          # main's first-parent history, sampled_proofs' fixture, which test_remote_coins.py holds a session's pin to
          "verity/core/protocols/sampled_proofs/tests/fixtures/main-first-parent.txt",
          # core's model pin, whose every role's checkpoint_sha512 test_store.py recomputes with the store's own
          # canonical JSON, held to the circuits codec's
          "verity/core/protocols/pouw/lean/check/models.json",
          # the claims registry, which test_ledger.py holds the memory line's named PRF claim to
          "verity/core/claims/__init__.py"]
