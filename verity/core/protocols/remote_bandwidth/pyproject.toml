# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity`: the audit's codec, receipts and record, on the commitments, the randomness and the
# profile, the plan's numpy checks in the kernels, and property/v1 with its census, which the post-seed verdict runs.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/profile.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments",
          "verity/ml/crypto", "verity/ml/kernels", "verity/ml/randomness",
          # the circuit model's codec rows and the primitives' range rows, which test_encode_chain.py and
          # test_gate_ranges.py recompute from codec.encode_word, the f32 evaluators and property/v1's rules, and
          # Exp2Lut127's table, which test_gate_ranges.py holds to vLLM's (fixtures/exp2_lut127.json)
          "Security/Proofs/Accounting/Gates.lean", "Security/Definitions/Accounting/Gates/Ranges.lean"]
