# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity`: the audit's codec, receipts and record, on the commitments, the randomness and the profile.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/profile.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments",
          "verity/ml/crypto", "verity/ml/randomness"]
