# The remote bandwidth audit's verifier as executable Lean (`verity/remote-bandwidth/v0`), its definition: a window's
# receipt checks (`RemoteAudit.verifyWindow`), the session's bookkeeping (`RemoteAudit.Session`) and the verifier's
# registrations (`RemoteAudit.Registry`), which `audit.py` is held to by the difftest (`remote-audit-difftest`), and the
# verifier's process the driver runs (`remote-audit-verifier`, `RemoteAudit.Verifier`), the session as a core
# protocol (`remote-audit-protocol`, `RemoteAudit.Protocol`, onsite's bandwidth component), and a P2 store's receipts
# and openings (`RemoteAudit.P2`) and its sessions, of record in the verifier's process (`RemoteAudit.P2Session`),
# which `p2.py` and `p2_party.py` are held to by the same difftest, and such a session as a core protocol
# (`remote-audit-p2-protocol`, `RemoteAudit.P2Protocol`, which replays its case, `p2_case.py`). Code: Lean core and
# the packages below, no Mathlib and nothing of Security.
name = "remote_audit"
defaultTargets = ["RemoteAudit", "remote-audit-difftest", "remote-audit-verifier", "remote-audit-protocol",
  "remote-audit-p2-protocol"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../service/flock"

[[require]]
name = "core_randomness"
path = "../../../primitives/randomness"

[[require]]
name = "verity_difftest"
path = "../../../difftest/lean"

# A P2 store's openings are checked on PoUS's vk (`RemoteAudit.P2`), by PoUS's own leaf and path check
# (`PousCheck.Merkle`).
[[require]]
name = "pous_check"
path = "../../pous/check"

[[require]]
name = "core_protocol"
path = "../../interface"

[[lean_lib]]
name = "RemoteAudit"

[[lean_exe]]
name = "remote-audit-difftest"
root = "RemoteAudit.DifftestMain"

[[lean_exe]]
name = "remote-audit-verifier"
root = "RemoteAudit.VerifierMain"

[[lean_exe]]
name = "remote-audit-protocol"
root = "RemoteAudit.ProtocolMain"

[[lean_exe]]
name = "remote-audit-p2-protocol"
root = "RemoteAudit.P2ProtocolMain"
