# The remote bandwidth audit's verifier as executable Lean (`verity/remote-bandwidth/v0`), its definition: a window's
# receipt checks (`Poub.verifyWindow`), the session's bookkeeping (`Poub.Session`) and the verifier's
# registrations (`Poub.Registry`), which `audit.py` is held to by the difftest (`poub-difftest`), and the
# verifier's process the driver runs (`poub-verifier`, `Poub.Verifier`), the session as a core
# protocol (`poub-protocol`, `Poub.Protocol`, onsite's bandwidth component), and a P2 store's receipts
# and openings (`Poub.P2`), which `p2.py` is held to by the same difftest. Code: Lean core and the packages
# below, no Mathlib and nothing of Security.
name = "poub"
defaultTargets = ["Poub", "poub-difftest", "poub-verifier", "poub-protocol"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../service/flock"

[[require]]
name = "core_randomness"
path = "../../../primitives/randomness"

[[require]]
name = "verity_difftest"
path = "../../../difftest/lean"

# A P2 store's openings are checked on PoUS's vk (`Poub.P2`), by PoUS's own leaf and path check
# (`PousCheck.Merkle`).
[[require]]
name = "pous_check"
path = "../../pous/check"

[[require]]
name = "core_protocol"
path = "../../interface"

[[lean_lib]]
name = "Poub"

[[lean_exe]]
name = "poub-difftest"
root = "Poub.DifftestMain"

[[lean_exe]]
name = "poub-verifier"
root = "Poub.VerifierMain"

[[lean_exe]]
name = "poub-protocol"
root = "Poub.ProtocolMain"
