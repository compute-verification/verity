# The remote bandwidth audit's verifier as executable Lean (`verity/remote-bandwidth/v0`), its definition: a window's
# receipt checks (`RemoteAudit.verifyWindow`), the session's bookkeeping (`RemoteAudit.Session`) and the verifier's
# registrations (`RemoteAudit.Registry`), which `audit.py` is held to by the difftest (`remote-audit-difftest`), and the
# post-seed verdict (`RemoteAudit.PostSeed`, property/v1 on the writers' Program), which `audit.post_seed` runs
# (`remote-audit-verdict`). Code: Lean core and the packages below, no Mathlib and nothing of Security.
name = "remote_audit"
defaultTargets = ["RemoteAudit", "remote-audit-difftest", "remote-audit-verdict"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../service/flock"

[[require]]
name = "core_randomness"
path = "../../../primitives/randomness"

[[require]]
name = "verity_difftest"
path = "../../../difftest/lean"

[[lean_lib]]
name = "RemoteAudit"

[[lean_exe]]
name = "remote-audit-difftest"
root = "RemoteAudit.DifftestMain"

[[lean_exe]]
name = "remote-audit-verdict"
root = "RemoteAudit.VerdictMain"
