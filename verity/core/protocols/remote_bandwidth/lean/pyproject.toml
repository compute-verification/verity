# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity` and `verity_difftest`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The references: the audit, its codec, receipts and coins, the store binding, the memory line and its pooled bound, on
# the commitments, the randomness and the profile; core's pin (models.json),
# which the binding's test reads as a pin; the difftest's Python half; and what `lake` builds: this package and,
# through its path requires, C-Flock's verifier's Lean, core's randomness and the difftest server. The schedule check
# (`schedule.py`) is a reference too.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/profile.py", "verity/core/protocols/remote_bandwidth/__init__.py",
          "verity/core/protocols/remote_bandwidth/audit.py", "verity/core/protocols/remote_bandwidth/codec.py",
          "verity/core/protocols/remote_bandwidth/coins.py", "verity/core/protocols/remote_bandwidth/receipts.py",
          "verity/core/protocols/remote_bandwidth/store.py", "verity/core/protocols/remote_bandwidth/line.py",
          "verity/core/protocols/remote_bandwidth/pooled.py", "verity/core/protocols/remote_bandwidth/schedule.py",
          "verity/core/protocols/pouw/lean/check/models.json",
          "verity/core/protocols/sampled_proofs/__init__.py", "verity/core/protocols/sampled_proofs/challenger.py",
          "verity/core/protocols/sampled_proofs/remote.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto",
          "verity/ml/randomness", "verity/core/difftest/python",
          "verity/core/service/flock/Flock", "verity/core/service/flock/lakefile.toml",
          "verity/core/service/flock/lake-manifest.json", "verity/core/service/flock/lean-toolchain",
          "verity/core/primitives/randomness", "verity/core/difftest/lean"]
