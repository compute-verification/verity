[project]
name = "verity-core-composition"
version = "0.0.0"
description = "The difftest of onsite's and remote's Lean (core_composition, core_onsite, core_remote) against the trial's composition rule with reject dominance."
requires-python = ">=3.12"
dependencies = ["verity-difftest"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds the onsite and remote packages beside this one (each product's executable, whose `serve` the
# harness drives) and, through their path requires, the core interface, C-Flock's verifier, and the ported components'
# Lean: sampled proofs' one-stage audit (with the LMS verifier and the difftest harness's Lean) and PoUW's check (with
# its window, commitments, and core's identity and randomness), the network certificate check (with the certifier
# program) and NCI's check (`network/nci/lean`). The reference runs the ported components' Python: PoUW's
# `core_check` and what it imports, and sampled proofs' one-stage difftest (`one_stage`, the integrity profile, the
# proof service) with its generators, PoUW's check cases, the network check's difftest (the certifier's `Audit`)
# and NCI's protocol difftest (`nci_reference`, under `network/nci/lean/scripts`), with their generators, each from
# its own suite's tests; with them what they import of `verity.ml` and `verity.errors`.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/ml", "verity/core/__init__.py", "verity/core/claims",
          "verity/core/difftest", "verity/core/protocols/__init__.py", "verity/core/protocols/profile.py",
          "verity/core/protocols/onsite", "verity/core/protocols/remote", "verity/core/protocols/interface",
          "verity/core/protocols/pouw", "verity/core/protocols/sampled_proofs",
          "verity/core/protocols/network", "verity/core/protocols/certifier",
          "verity/core/service/sampled_proofs", "verity/core/service/flock", "verity/core/primitives/lms/lean",
          "verity/core/primitives/identity", "verity/core/primitives/randomness"]
