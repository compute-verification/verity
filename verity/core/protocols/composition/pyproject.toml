[project]
name = "verity-core-composition"
version = "0.0.0"
description = "The difftest of onsite's and remote's Lean (core_composition, core_onsite, core_remote) against the trial's composition rule with reject dominance, over stub components and onsite's real space and bandwidth components."
requires-python = ">=3.12"
dependencies = ["verity", "verity-difftest", "hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds the onsite and remote packages beside this one (each product's executable, whose `serve` the
# harness drives) and, through their path requires, the core interface, C-Flock's verifier's Lean, and onsite's real
# components' packages with theirs: `pous_check` (the memory challenger's, LMS's, identity's and randomness's Lean) and
# `remote_audit` (the difftest server's). `periods.py` makes those components' cases with their period hooks
# (`pous/period.py`, `remote_bandwidth/period.py`) and signs PoUS's with the memory challenger's tests' deployed key
# (`mc_cases.py`, which reads the PoUS tests' test signer by path).
# Of `verity` and the difftest harness, what the tests import: these in place of both trees.
inputs_only = true
inputs = ["verity/core/protocols/onsite", "verity/core/protocols/remote",
          "verity/core/protocols/interface",
          "verity/core/service/flock/lakefile.toml", "verity/core/service/flock/lake-manifest.json",
          "verity/core/service/flock/lean-toolchain", "verity/core/service/flock/Flock",
          "verity/core/protocols/pous", "verity/core/protocols/remote_bandwidth",
          "verity/core/devices/memory_challenger/lean", "verity/core/primitives/lms/lean",
          "verity/core/primitives/identity", "verity/core/primitives/randomness", "verity/core/difftest",
          "verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/claims/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/profile.py",
          "verity/core/protocols/sampled_proofs/__init__.py", "verity/core/protocols/sampled_proofs/challenger.py",
          "verity/core/protocols/sampled_proofs/remote.py", "verity/ml/__init__.py", "verity/ml/circuits",
          "verity/ml/commitments", "verity/ml/crypto", "verity/ml/randomness"]
