# The two composites, onsite (`verity/onsite/v0`) and remote (`verity/remote/v0`), each one `Core.Protocol` built by one
# constructor (`Core.Onsite.restrict`): onsite's subprotocols are sampled proofs, PoUW, PoUS's run check, the remote
# bandwidth session and the network certifier over the period (`verity/certifier/v0`), and remote is onsite restricted to
# sampled proofs and PoUW. Their executables are the core CLI (`onsite id | check | serve`, `remote id | check | serve`),
# which the difftest drives, and `product IDS ...`, the composite of the subprotocols IDS lists. Code: no Mathlib.
name = "core_onsite"
defaultTargets = ["CoreOnsite", "onsite", "remote", "product"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# Sampled proofs' one-stage audit and PoUW's window check, the subprotocols remote restricts onsite to.
[[require]]
name = "core_sampled_proofs"
path = "../../service/sampled_proofs"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# The network certifier's period check (`NetworkCheck.Period`), with the certifier program and the LMS
# verifier it reads certificates with.
[[require]]
name = "network_check"
path = "../network/lean"

# PoUS's check of a run, on the memory challenger's Lean.
[[require]]
name = "pous_check"
path = "../pous/check"

# The remote bandwidth audit's session.
[[require]]
name = "remote_audit"
path = "../remote_bandwidth/lean"

[[lean_lib]]
name = "CoreOnsite"

[[lean_exe]]
name = "onsite"
root = "OnsiteMain"

[[lean_exe]]
name = "remote"
root = "RemoteMain"

# A configuration's composite: `Core.Onsite.ofIds` of the subprotocols its `protocols` lists, onsite or remote, any other
# set refused (`product IDS id | check | serve`).
[[lean_exe]]
name = "product"
root = "ProductMain"
