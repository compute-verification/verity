# Onsite Verity as one `Core.Protocol` (`verity/onsite/v0`): the composition of integrity (sampled proofs), the
# inference-only policy (`verity/inference-only/v0`), work (PoUW's period credit, `verity/pouw/period/v1`), space (PoUS's
# run check), bandwidth (the remote bandwidth session), communication (the network certifier over the period,
# `verity/certifier/v0`) and the wipe (`verity/wipe/v0`). Its executable is the core CLI (`onsite id | check | serve`),
# which the difftest drives, whose `check` also takes the period's circuit files by path (CorePeriodFiles.lean). Code: no
# Mathlib.
name = "core_onsite"
defaultTargets = ["CoreOnsite", "onsite", "CoreRemoteNetwork", "remote-network", "CoreRemoteNetworkNoPouw",
  "remote-network-no-pouw", "CoreComposites", "product", "CorePeriodFiles"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# The ported subprotocols: sampled proofs' one-stage audit (integrity) and PoUW's period credit (work,
# `PouwCheck.Period`).
[[require]]
name = "core_sampled_proofs"
path = "../../service/sampled_proofs"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# The inference-only policy: its check as a core protocol (`NciCheck.Protocol`).
[[require]]
name = "nci_check"
path = "../network/nci/lean"

# Communication: the network certifier's period check (`NetworkCheck.Period`), with the certifier program and the LMS
# verifier it reads certificates with.
[[require]]
name = "network_check"
path = "../network/lean"

# Space: PoUS's check of a run, on the memory challenger's Lean.
[[require]]
name = "pous_check"
path = "../pous/check"

# Bandwidth: the remote bandwidth audit's P2 session on PoUS's store (`RemoteAudit.P2Protocol`).
[[require]]
name = "remote_audit"
path = "../remote_bandwidth/lean"

# The wipe: the memory challenger's streamed-label wipe verdict (`MemoryChallenger.WipeProtocol`, `verity/wipe/v0`).
[[require]]
name = "core_memory_challenger"
path = "../../devices/memory_challenger/lean"

# Remote, which `product` names, and whose subprotocols remote with the network certifier composes.
[[require]]
name = "core_remote"
path = "../remote"

[[lean_lib]]
name = "CoreOnsite"

[[lean_exe]]
name = "onsite"
root = "OnsiteMain"

# Remote with the network certifier (`verity/remote-network/v0`): remote's subprotocols and the network certifier's
# period, under remote's ties and its own (CoreRemoteNetwork.lean). Its executable is the core CLI (`remote-network id | check |
# serve`), whose `check` also takes the period's circuit files by path (CorePeriodFiles.lean).
[[lean_lib]]
name = "CoreRemoteNetwork"

[[lean_exe]]
name = "remote-network"
root = "RemoteNetworkMain"

# Remote with the network certifier, without PoUW (`verity/remote-network-no-pouw/v0`): its subprotocols but PoUW's period,
# under remote's record subprotocols and its egress tie (CoreRemoteNetworkNoPouw.lean). Its executable is the core CLI
# (`remote-network-no-pouw id | check | serve`), whose `check` also takes the period's circuit files by path
# (CorePeriodFiles.lean).
[[lean_lib]]
name = "CoreRemoteNetworkNoPouw"

[[lean_exe]]
name = "remote-network-no-pouw"
root = "RemoteNetworkNoPouwMain"

# The composite a configuration's subprotocols make, onsite, remote, or remote with the network certifier with PoUW or
# without, and no other: `product IDS id | check | serve` (CoreComposites.lean).
[[lean_lib]]
name = "CoreComposites"

[[lean_exe]]
name = "product"
root = "ProductMain"

# The command line of the composites with the network certifier's period, whose `check` takes the circuit files the
# period lists by path after `--circuits`, within a budget (`--read-gb N`), in place of among the blobs
# (CorePeriodFiles.lean).
[[lean_lib]]
name = "CorePeriodFiles"
