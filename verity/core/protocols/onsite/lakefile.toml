# Onsite Verity as one `Core.Protocol` (`verity/onsite/v0`): the composition of integrity (sampled proofs), work (PoUW's
# period credit, `verity/pouw/period/v1`), space (PoUS's run check), bandwidth (the remote bandwidth session) and
# communication (the network certifier over the period, `verity/certifier/v0`). Its executable is the core CLI (`onsite id | check | serve`), which the difftest
# drives. Code: no Mathlib.
name = "core_onsite"
defaultTargets = ["CoreOnsite", "onsite", "CoreComposites", "product"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# The ported subprotocols: sampled proofs' one-stage audit (integrity) and PoUW's period credit (work,
# `PouwCheck.Period`).
[[require]]
name = "core_sampled_proofs"
path = "../../service/sampled_proofs"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# Communication: the network certifier's period check (`NetworkCheck.Period`), with the certifier program and the LMS
# verifier it reads certificates with.
[[require]]
name = "network_check"
path = "../network/lean"

# Space: PoUS's check of a run, on the memory challenger's Lean.
[[require]]
name = "pous_check"
path = "../pous/check"

# Bandwidth: the remote bandwidth audit's session.
[[require]]
name = "remote_audit"
path = "../remote_bandwidth/lean"

# Remote, the other composite `product` names.
[[require]]
name = "core_remote"
path = "../remote"

[[lean_lib]]
name = "CoreOnsite"

[[lean_exe]]
name = "onsite"
root = "OnsiteMain"

# The composite a configuration's subprotocols make, onsite or remote, and no other: `product IDS id | check | serve`
# (CoreComposites.lean).
[[lean_lib]]
name = "CoreComposites"

[[lean_exe]]
name = "product"
root = "ProductMain"
