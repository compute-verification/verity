# Onsite Verity as one `Core.Protocol` (`verity/onsite/v0`): the composition of integrity (sampled proofs), work (PoUW),
# space (PoUS's run check), bandwidth (the PoUB session) and communication (the network certifier over the
# period, `verity/certifier/v0`). Its executable is the core CLI (`onsite id | check | serve`), which the difftest
# drives. Code: no Mathlib.
name = "core_onsite"
defaultTargets = ["CoreOnsite", "onsite", "CoreProduct", "product"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# The ported components: sampled proofs' one-stage audit (integrity) and PoUW's window check (work).
[[require]]
name = "core_sampled_proofs"
path = "../../service/sampled_proofs"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# Communication: the network certifier's period check (`NetworkCheck.Period`), with the certifier program and the LMS
# verifier it reads certificates with.
[[require]]
name = "network_check"
path = "../network/lean"

# Space: PoUS's check of a run, on the memory challenger's Lean.
[[require]]
name = "pous_check"
path = "../pous/check"

# Bandwidth: PoUB's session.
[[require]]
name = "poub_check"
path = "../poub/lean"

[[lean_lib]]
name = "CoreOnsite"

[[lean_exe]]
name = "onsite"
root = "OnsiteMain"

# A configuration's product: `Core.Composition.product` over exactly the components its `protocols` lists (onsite for all
# five), `product IDS id | check | serve` (CoreProduct.lean).
[[lean_lib]]
name = "CoreProduct"

[[lean_exe]]
name = "product"
root = "ProductMain"
