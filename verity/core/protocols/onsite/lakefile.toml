# Onsite Verity as one `Core.Protocol` (`verity/onsite/v0`): the composition of sampled proofs, PoUW (its period credit,
# `verity/pouw/period/v1`), PoUS (its run check), the remote bandwidth audit (its session), the network certifier (over
# the period, `verity/certifier/v0`) and the wipe (`verity/wipe/v0`). Its executable is the core CLI
# (`onsite id | check | serve`), which the difftest
# drives. Code: no Mathlib.
name = "core_onsite"
defaultTargets = ["CoreOnsite", "onsite", "CoreProduct", "product"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "core_composition"
path = "../composition"

# The ported components: sampled proofs' one-stage audit (integrity) and PoUW's period credit (work,
# `PouwCheck.Period`).
[[require]]
name = "core_sampled_proofs"
path = "../../service/sampled_proofs"

[[require]]
name = "pouw_check"
path = "../pouw/lean/check"

# Communication: the network certifier's period check (`NetworkCheck.Period`), with the certifier program and the LMS
# verifier it reads certificates with.
[[require]]
name = "network_check"
path = "../network/lean"

# The registration check onsite runs before composing: NCI's check of record (`NciCheck.Protocol`, `verity/nci/v1`).
[[require]]
name = "nci_check"
path = "../network/nci/lean"

# Space: PoUS's check of a run, on the memory challenger's Lean.
[[require]]
name = "pous_check"
path = "../pous/check"

# Bandwidth: the remote bandwidth audit's session.
[[require]]
name = "remote_audit"
path = "../remote_bandwidth/lean"

# The wipe: the memory challenger's streamed-label wipe verdict (`MemoryChallenger.WipeProtocol`, `verity/wipe/v0`).
[[require]]
name = "core_memory_challenger"
path = "../../devices/memory_challenger/lean"

[[lean_lib]]
name = "CoreOnsite"

[[lean_exe]]
name = "onsite"
root = "OnsiteMain"

# A configuration's product: `Core.Composition.productB` over exactly the components its `protocols` lists (onsite for all
# six), `product IDS id | check | serve` (CoreProduct.lean).
[[lean_lib]]
name = "CoreProduct"

[[lean_exe]]
name = "product"
root = "ProductMain"
