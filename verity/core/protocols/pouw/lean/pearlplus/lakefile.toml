# Pearl+'s run verdict as executable Lean (`PouwCheck.PearlPlus`), the port of `verify_passes`
# (`benchmarks/pouw/pearl_c_vllm/verify_run.py`, protocol `verity/pouw/pearl-plus/v1`): the retained passes' records and give-up
# (V-EX), their epoch, the run's commitment and the verifier's coin record (`after-coin`), the work-weighted draw over every
# pass's tickets and the exclusion tiles, and each drawn tile's openings and -h3 words (Pearl-C v1 on the H100's record), with
# the served y's openings and unscale. It is code, so it requires nothing of `Security/`: PoUW's commitments (`pouw_commit`)
# and the evaluator's FP32, FP8 and tensor-core steps (`verity_evaluate`). `pouw-pearlplus` reads a run's pass files and its
# coins and prints the verdict; `tests/test_pearlplus_difftest.py` holds it to the Python.
name = "pouw_pearlplus"
defaultTargets = ["PouwPearlPlus", "pouw-pearlplus"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "pouw_commit"
path = "../commit"

[[require]]
name = "verity_evaluate"
path = "../../../../primitives/evaluate"

[[lean_lib]]
name = "PouwPearlPlus"

[[lean_exe]]
name = "pouw-pearlplus"
root = "PouwPearlPlus.Main"
