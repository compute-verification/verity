[project]
name = "verity-pouw-check-difftest"
version = "0.0.0"
description = "The difftest of `pouw_check` against `verity.core.protocols.pouw.core_check`."
requires-python = ">=3.12"
dependencies = []

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the harness (`verity_difftest`); the switch, `verifier.py`; the Python held to the Lean, `core_check.py`
# and `credit.py`, and what they import (`window.py`, `weights.py`, `coins.py`, `audit.py` and `protocol.py`, the proof system's challenger and
# one-stage's registered domains (`one_stage/registered.py` and the `partition.py` it imports), one-stage's proof
# verification (`one_stage/proofs.py`, its `verifier.py` and what that imports, with the integrity profile and the
# proof system), and what they import: `verity.ml`'s circuits codec, commitments, crypto and randomness, and `verity.errors`) with the packages
# above them; what `lake` reads through the path requires: the core protocol interface, the window's Lean and what it
# requires (PoUW's commitments, the proof system's Lean with the LMS verifier, core's identity and randomness, C-Flock's
# verifier with its configuration). The leaf statements' files `pouw-leaf-own-window` checks are `leaf_lanes.py`'s, with
# what it imports (PoUW's `circuit/` seeds, one-stage's `produced.py`, and the `verity.ml.kernels` `tc.py` they reach).
inputs = ["verity/core/difftest", "verity/__init__.py", "verity/core/__init__.py",
          "verity/core/protocols/__init__.py", "verity/core/protocols/pouw/__init__.py",
          "verity/core/claims/__init__.py",
          "verity/core/protocols/pouw/window.py", "verity/core/protocols/pouw/core_check.py",
          "verity/core/protocols/pouw/verifier.py", "verity/core/protocols/pouw/salt.py",
          "verity/core/protocols/pouw/credit.py", "verity/core/protocols/pouw/weights.py",
          "verity/core/protocols/pouw/coins.py", "verity/core/protocols/pouw/audit.py",
          "verity/core/protocols/pouw/protocol.py", "verity/ml/randomness",
          "verity/core/protocols/sampled_proofs/__init__.py", "verity/core/protocols/sampled_proofs/challenger.py",
          "verity/core/protocols/sampled_proofs/one_stage/__init__.py",
          "verity/core/protocols/sampled_proofs/one_stage/registered.py",
          "verity/core/protocols/sampled_proofs/one_stage/partition.py",
          "verity/core/protocols/sampled_proofs/one_stage/proofs.py",
          "verity/core/protocols/sampled_proofs/one_stage/verifier.py",
          "verity/core/protocols/sampled_proofs/one_stage/audit.py",
          "verity/core/protocols/sampled_proofs/one_stage/draw.py",
          "verity/core/protocols/sampled_proofs/one_stage/hello.py",
          "verity/core/protocols/sampled_proofs/one_stage/registration.py",
          "verity/core/protocols/sampled_proofs/one_stage/verdict.py",
          "verity/core/protocols/sampled_proofs/coins.py", "verity/core/protocols/sampled_proofs/service.py",
          "verity/core/protocols/profile.py",
          "verity/core/protocols/pouw/leaf_lanes.py", "verity/core/protocols/pouw/circuit",
          "verity/core/protocols/sampled_proofs/one_stage/produced.py",
          "verity/ml/kernels/__init__.py", "verity/ml/kernels/tc.py",
          "verity/core/service/sampled_proofs/lakefile.toml", "verity/core/service/sampled_proofs/lake-manifest.json",
          "verity/core/service/sampled_proofs/lean-toolchain", "verity/core/service/sampled_proofs/SampledProofs.lean",
          "verity/core/service/sampled_proofs/SampledProofs",
          "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto",
          "verity/core/protocols/interface", "verity/core/protocols/pouw/lean/window",
          "verity/core/protocols/pouw/lean/commit", "verity/core/primitives/identity", "verity/core/primitives/randomness",
          "verity/core/primitives/lms/lean/lakefile.toml", "verity/core/primitives/lms/lean/lake-manifest.json",
          "verity/core/primitives/lms/lean/lean-toolchain", "verity/core/primitives/lms/lean/Lms.lean",
          "verity/core/primitives/lms/lean/Lms",
          "verity/core/service/flock/lakefile.toml", "verity/core/service/flock/lake-manifest.json",
          "verity/core/service/flock/lean-toolchain", "verity/core/service/flock/Flock"]
