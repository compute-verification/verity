# PoUW's commitments as executable Lean: the epoch coins' check, the protocol's bindings, the roots of its row and tile
# trees, and the salts and draw keys it derives (`verity.core.protocols.pouw`: `coins`, `protocol.tagged`, `audit`; the
# clear audit's draws, `benchmarks/pouw/clear`), with the difftest against the Python. It is code, so it requires nothing
# of `Security/`; it reads C-Flock's SHA-2, frame-v3 trees and hm96 leaves (`flock_verifier`) and core's randomness
# (`core_randomness`), and requires core's tagged SHA-512 identity (`core_identity`) for PoUW's window, which reads it.
name = "pouw_commit"
defaultTargets = ["PouwCommit", "pouw-commit-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../../service/flock"

[[require]]
name = "core_randomness"
path = "../../../../primitives/randomness"

[[require]]
name = "core_identity"
path = "../../../../primitives/identity"

[[lean_lib]]
name = "PouwCommit"

[[lean_exe]]
name = "pouw-commit-difftest"
root = "PouwCommit.DifftestMain"
