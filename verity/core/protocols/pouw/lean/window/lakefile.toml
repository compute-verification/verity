# PoUW's audit window as executable Lean (`verity/core/protocols/pouw/window.py`): the grid, the draw size K′ and the
# `sampling` item, the public items, and the window's advice: its entry rows, side trees, window statement and the tile
# instances' public inputs, which read PoUW's frame-v3-sha512 domains and C-Flock's hm96 (`pouw_commit`), and a live
# window's round coins, which read the proof system's challenger (`core_sampled_proofs`'s `SampledProofs.Challenger`).
# Its properties are stated in `Security/Properties/Pouw.lean`. `PouwWindow.Difftest` and the difftest server, which hold it
# to the Python, run on the shared harness (`verity_difftest`), which nothing under the root `PouwWindow` imports.
# `pouw-leaf-own` is the leaf verifier's check of a drawn-leaf statement's `--registered` file against the accepted
# registration and produced record (`PouwWindow.RegFile`), and of each of its sessions' draws against the draw policy, every
# unit (`PouwWindow.FullDraw`).
name = "pouw_window"
defaultTargets = ["PouwWindow", "pouw-window-difftest", "pouw-leaf-own"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "verity_difftest"
path = "../../../../difftest/lean"

[[require]]
name = "pouw_commit"
path = "../commit"

[[require]]
name = "core_sampled_proofs"
path = "../../../../service/sampled_proofs"

[[lean_lib]]
name = "PouwWindow"
roots = ["PouwWindow", "PouwWindow.Difftest"]

[[lean_exe]]
name = "pouw-window-difftest"
root = "PouwWindow.DifftestMain"

[[lean_exe]]
name = "pouw-leaf-own"
root = "PouwWindow.LeafOwnMain"
