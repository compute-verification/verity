[project]
name = "verity-pouw-window-difftest"
version = "0.0.0"
description = "The difftest of `pouw_window` against `verity.core.protocols.pouw.window`."
requires-python = ">=3.12"
dependencies = []

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the harness (`verity_difftest`, which the workspace installs, and the Lean `lake` builds through the path require);
# the switch, `verifier.py`; the Python held to the Lean, `window.py`, the packages above it and the core it imports
# (the proof service's challenger, `verity.ml`'s circuits codec, commitments, crypto and randomness, and
# `verity.errors`), and its pinned vectors; what `lake` reads through the path requires: PoUW's commitments
# (`pouw_commit`), the proof service's Lean (`core_sampled_proofs`) with the core protocol interface and the LMS verifier,
# core's identity and randomness, and C-Flock's verifier with its configuration.
inputs = ["verity/core/difftest", "verity/__init__.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/core/protocols/pouw/__init__.py", "verity/core/protocols/pouw/window.py",
          "verity/core/protocols/pouw/verifier.py",
          "verity/core/protocols/pouw/tests/vectors/window.json",
          "verity/core/protocols/sampled_proofs/__init__.py", "verity/core/protocols/sampled_proofs/challenger.py",
          "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto",
          "verity/ml/randomness",
          "verity/core/protocols/pouw/lean/commit", "verity/core/primitives/identity", "verity/core/primitives/randomness",
          "verity/core/service/sampled_proofs/lakefile.toml", "verity/core/service/sampled_proofs/lake-manifest.json",
          "verity/core/service/sampled_proofs/lean-toolchain", "verity/core/service/sampled_proofs/SampledProofs.lean",
          "verity/core/service/sampled_proofs/SampledProofs", "verity/core/protocols/interface",
          "verity/core/primitives/lms/lean/lakefile.toml", "verity/core/primitives/lms/lean/lake-manifest.json",
          "verity/core/primitives/lms/lean/lean-toolchain", "verity/core/primitives/lms/lean/Lms.lean",
          "verity/core/primitives/lms/lean/Lms",
          "verity/core/service/flock/lakefile.toml", "verity/core/service/flock/lake-manifest.json",
          "verity/core/service/flock/lean-toolchain", "verity/core/service/flock/Flock"]
