# PoUS's memory challenger's verdicts as executable Lean: its record formats and crypto, `verdict` on a record as its
# caller holds it (`memory-challenger-verdict`) and as a core protocol (`memory-challenger`), and the streamed-label wipe's
# `verdict` on a record (`streamed-wipe-verdict`) and as a core protocol (`wipe-protocol`). Code: Lean core and the
# packages below, no Mathlib and nothing of Security.
name = "core_memory_challenger"
defaultTargets = ["MemoryChallenger", "memory-challenger", "memory-challenger-test", "memory-challenger-verdict",
                  "streamed-wipe-verdict", "wipe-protocol", "wipe-protocol-test", "memory-challenger-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../service/flock"

[[require]]
name = "core_randomness"
path = "../../../primitives/randomness"

[[require]]
name = "lms"
path = "../../../primitives/lms/lean"

[[require]]
name = "core_attest"
path = "../../../attest/lean"

[[require]]
name = "core_protocol"
path = "../../../protocols/interface"

[[require]]
name = "verity_difftest"
path = "../../../difftest/lean"

[[lean_lib]]
name = "MemoryChallenger"

# `verdict` under the accepted schemes (S1's LMS at its deployed parameters): the interface's command line.
[[lean_exe]]
name = "memory-challenger"
root = "MemoryChallenger.Main"

# `verdict` under the test signers' schemes alone, with a protocol id of its own, for the difftest.
[[lean_exe]]
name = "memory-challenger-test"
root = "MemoryChallenger.TestMain"

# `verdict` on a record as `memory_challenger.verdict`'s caller holds it, the whole `Verdict` back (`verdict.py`).
[[lean_exe]]
name = "memory-challenger-verdict"
root = "MemoryChallenger.VerdictMain"

# `streamed_wipe.verdict` on a record as its caller holds it, the whole `Verdict` back (`wipe_verdict.py`).
[[lean_exe]]
name = "streamed-wipe-verdict"
root = "MemoryChallenger.WipeVerdictMain"

# The streamed wipe's verdict as a core protocol, `verity/wipe/v0` under the accepted schemes: the interface's command
# line, onsite's wipe component.
[[lean_exe]]
name = "wipe-protocol"
root = "MemoryChallenger.WipeProtocolMain"

# The same under the test signers' schemes alone, with a protocol id of its own, for the difftest.
[[lean_exe]]
name = "wipe-protocol-test"
root = "MemoryChallenger.WipeProtocolTestMain"

[[lean_exe]]
name = "memory-challenger-difftest"
root = "MemoryChallenger.DifftestMain"
