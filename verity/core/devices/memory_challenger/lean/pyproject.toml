[project]
name = "memory-challenger-lean"
version = "0.0.0"
description = "The differential tests of the memory challenger's verdict in Lean (this directory's Lake package) against verity.core.protocols.pous.memory_challenger, and verdict.py, the Lean verdict behind memory_challenger.verdict's signature."
requires-python = ">=3.12"
dependencies = ["verity", "verity-difftest", "hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: `lake` builds this package and, through its path requires, C-Flock's verifier's Lean, core's randomness, LMS,
# the protocol interface and the difftest server; the sessions are signed by the PoUS tests' test signer, read by path.
inputs = ["verity/core/service/flock/Flock", "verity/core/service/flock/lakefile.toml",
          "verity/core/service/flock/lake-manifest.json", "verity/core/service/flock/lean-toolchain",
          "verity/core/primitives/randomness", "verity/core/primitives/lms/lean", "verity/core/protocols/interface",
          "verity/core/difftest/lean", "verity/core/protocols/pous/tests/pous_test_signer.py"]
