# The NVIDIA RTX PRO 6000 Blackwell Server Edition: the one source of its numbers (verity/hardware/README.md).
# Each number is { value, unit, mark, source }. mark: "ceiling" (no program on this SKU and firmware exceeds it, what the
# model's premises need), "measurement" (a measured value, so only a lower bound on the ceiling) or "placeholder"
# (neither, open). Per-SM rates are a SM-clock's. Security/Definitions/Core/Accel/Sm120.lean is held to this file.

sku = "rtx-pro-6000-server"
name = "NVIDIA RTX PRO 6000 Blackwell Server Edition"
die = "GB202"
arch = "sm_120a"
board = "900-2G153-0000-000"
vbios = "98.02.8D.00.01"
lean = "Security/Definitions/Core/Accel/Sm120.lean"
nodes = "vy-nebius-1: eight cards, all this SKU and vBIOS (r20261027-032043-e2d1; the SKU first read in r20261027-015942-eb08)"

[sm]
count = { value = 188, unit = "SM", mark = "ceiling", source = "NVIDIA RTX PRO Blackwell GPU Architecture whitepaper v1.1, Appendix A, Table 4: 188 SMs (the Workstation Edition, the same GB202)" }

[clock]
sm = { value = 2430, unit = "MHz", mark = "ceiling", source = "r20261027-032043-e2d1 (nvidia-smi -q, all eight cards: max, application, default application and max customer boost clocks 2430 MHz); r20261027-031620-6643 (NVML: SM and memory clock offset ranges [0, 0], supported graphics clocks top at 2430); r20261017-181535-5132 (every lock, application clock and offset above 2430 MHz refused or clamped)" }
memory = { value = 12481, unit = "MHz", mark = "ceiling", source = "r20261027-032043-e2d1 (max and application memory clock 12481 MHz); r20261027-031620-6643 (supported memory clocks [12481, 405], offset range [0, 0])" }

[power]
limit = { value = 600, unit = "W", mark = "ceiling", source = "r20261027-032043-e2d1 (power limit 600 W: default 600, min 300, max 600, all eight cards)" }

# The stores. Registers in 32-bit words an SM; the rest in bytes.
[store]
reg = { value = 65536, unit = "word/SM", mark = "ceiling", source = "whitepaper v1.1: a 256 KB register file an SM, 64 Ki 32-bit registers" }
reg_extra = { value = 3371, unit = "word/SM", mark = "ceiling", source = "the uniform registers (63 a warp at 48 warps, 3024 words), the predicates (7 bits a thread at 1536 threads, 336 words) and the uniform predicates (7 bits a warp, 11 words)" }
smem = { value = 131072, unit = "B/SM", mark = "ceiling", source = "whitepaper v1.1: 128 KB of L1 and shared memory an SM" }
l2 = { value = 134217728, unit = "B", mark = "ceiling", source = "whitepaper v1.1, Table 4: L2 128 MB, taken as 128 MiB" }
dram = { value = 103079215104, unit = "B", mark = "ceiling", source = "product page, 'GPU Memory 96 GB GDDR7', taken as 96 GiB" }
chip = { value = 263163904, unit = "B", mark = "ceiling", source = "all of the card's on-chip storage, S_chip's device term: 188 SMs' registers, L1 and shared memory, L1.5, instruction caches, uniform registers and warp state, the L2, the TLB and 1 MiB of buffers (ra-pcie-exhaust #1852, chip.cu, runs art:2b6cac05 to art:90de6479)" }

# The resources' rates, each a SM-clock (the Lean's rho is SMs x this x the SM clock).
[rate]
tensor = { value = 1024, unit = "s8 MAC/SM-clock", mark = "ceiling", source = "whitepaper v1.1, Table 4: FP8 1007.6 dense TFLOPS over 2 x 188 SMs at its 2617 MHz boost is 1024 MACs a SM-clock; IMMA.16832 runs s8 at the same rate, 4096 MACs in 16 tensor cycles of a sub-partition (measured 1023.8, r20261017-041103-d35d)" }
issue = { value = 4, unit = "warp instruction/SM-clock", mark = "ceiling", source = "whitepaper v1.1: four sub-partitions, one warp scheduler each, one warp instruction a clock" }
alu = { value = 64, unit = "lane/SM-clock", mark = "measurement", source = "the DS-120 SASS census: LOP3 at two cycles a warp instruction on a sub-partition; CUDA C++ Programming Guide 12.9 section 6.4.1 Table 7, CC 12.0, gives 32-bit integer add 128 (IADD3 at 128 is open in Security/Definitions/Core/Accel/README.md)" }
imad = { value = 64, unit = "lane/SM-clock", mark = "ceiling", source = "CUDA C++ Programming Guide 12.9 section 6.4.1 Table 7, CC 12.0: 32-bit integer multiply and multiply-add 64 (the DS-120 census measures IMAD at 64)" }
shfl = { value = 32, unit = "lane/SM-clock", mark = "ceiling", source = "CUDA C++ Programming Guide 12.9 section 6.4.1 Table 7: warp shuffle 32" }
f64 = { value = 2, unit = "lane/SM-clock", mark = "ceiling", source = "CUDA C++ Programming Guide 12.9 section 6.4.1 Table 7, CC 12.0: 64-bit floating-point multiply-add 2" }
sfu = { value = 16, unit = "lane/SM-clock", mark = "ceiling", source = "CUDA C++ Programming Guide 12.9 section 6.4.1 Table 7: reciprocal, square root, logarithm, exponential, sine and cosine 16" }
smem = { value = 32, unit = "bank word/SM-clock", mark = "ceiling", source = "CUDA C++ Programming Guide 12.9, 'Shared Memory': 32 banks of one 32-bit word a clock" }
l2 = { value = 5, unit = "word/SM-clock", mark = "measurement", source = "measured 18.6 bytes an SM-clock of one read pattern at 2092 MHz, r20261017-065855-c8a9, rounded up to 5 words; open until a ceiling with its argument replaces it" }

[memory]
bus = { value = 512, unit = "bit", mark = "ceiling", source = "product page: 512-bit GDDR7" }
transfers = { value = 2, unit = "transfer/clock", mark = "ceiling", source = "the product page's 1597 GB/s over 512 bits is 24.96 Gb/s a pin: two transfers a clock of the 12481 MHz nvidia-smi reports" }
bandwidth = { value = 1.597568e12, unit = "B/s", mark = "ceiling", source = "clock.memory x memory.transfers x memory.bus / 8; the product page's 'Memory Bandwidth 1597 GB/s'" }
read = { value = 1.539e12, unit = "B/s", mark = "measurement", source = "the fastest bare read of an encoded store measured on the card, 1,539.26 GB/s in the honest remote session of 14 Oct (prover r20261014-193057-8fec), rounded down; ra-word-codec's 1.488e12 (#1840, r20261012-051505-ed9d, art:51a27942) is a slower kernel's. memory.bandwidth bounds every write too: labels written at 1,528.98 GB/s by TMA bulk stores at most (r20261020-211937-b9c0)" }

# The card's SHA-512 compressions a second.
[hash]
sha512 = { value = 7.0e9, unit = "compression/s", mark = "measurement", source = "block-sha512's 33 compressions a block over 2,097,152 blocks in 9.87 ms (#1916, art:dea3a309)" }

# The squaring ceiling at each codec width (the remote audit's Assumption 5): one card's share of a node of eight with
# its host, s x (1 + h) times the reference, s the card's best form over the reference and h the host's 128 cores at
# their IFMA bound over eight reference cards, 12.5%.
[squaring]
p1024 = { value = 2.50333e10, unit = "squaring/s", mark = "ceiling", source = "1.67 x kv.cu's reference 1.499e10: s = 1.364 x 2463/2262, about 1.485, for kv.cu's FOLD 6 at ILP 1 (2.044e10 a second) less its MOV and SEL, modeled and not built, and s x (1 + h) = 1.67; below Karatsuba's own model (s = 1.68, 1.885 with the host)" }
p512 = { value = 8.03871e10, unit = "squaring/s", mark = "ceiling", source = "1.567 x codec-mix's reference 5.13e10, the host's h = 12.5% as at p1024" }

# The tensor units a MAC of each operand format uses (rate.tensor counts s8 MACs).
[weight]
s8 = { value = 1, unit = "tensor unit/MAC", mark = "ceiling", source = "rate.tensor's unit (IMMA.16832)" }
u8 = { value = 1, unit = "tensor unit/MAC", mark = "ceiling", source = "IMMA.16832 runs u8 as s8" }
b1 = { value = 1, unit = "tensor unit/MAC", mark = "ceiling", source = "the card has no b1 MMA (ptxas emulates every form at 99-436 SMSP-cycles, r20260930-111747-26f3): an op the card lacks only adds programs to the model" }
e4m3 = { value = 1, unit = "tensor unit/MAC", mark = "ceiling", source = "whitepaper v1.1, Table 4: FP8 1007.6 dense TFLOPS, the s8 rate (QMMA.16832, kind::f8f6f4)" }
e5m2 = { value = 1, unit = "tensor unit/MAC", mark = "ceiling", source = "as e4m3 (QMMA.16832, kind::f8f6f4)" }
e2m1 = { value = 1, unit = "tensor unit/MAC", mark = "ceiling", source = "kind::f8f6f4 runs e2m1 at the FP8 rate (QMMA.16832)" }
f16 = { value = 2, unit = "tensor unit/MAC", mark = "ceiling", source = "whitepaper v1.1, Table 4: FP16 503.8 dense TFLOPS, half the FP8 rate" }
bf16 = { value = 2, unit = "tensor unit/MAC", mark = "ceiling", source = "whitepaper v1.1, Table 4: BF16 503.8 dense TFLOPS" }
tf32 = { value = 4, unit = "tensor unit/MAC", mark = "ceiling", source = "whitepaper v1.1, Table 4: TF32 251.9 dense TFLOPS" }
nvf4 = { value = 0.5, unit = "tensor unit/MAC", mark = "ceiling", source = "whitepaper v1.1, Table 4: FP4 2015.2 dense TFLOPS, twice the FP8 rate (OMMA.SF.16864, 8192 MACs in 16 cycles)" }
mxf4 = { value = 0.5, unit = "tensor unit/MAC", mark = "ceiling", source = "as nvf4 (OMMA.SF.16864)" }
f64 = { value = 32, unit = "tensor unit/MAC", mark = "measurement", source = "no document gives sm_120's DMMA rate; measured 1.75 MACs a SM-clock (DMMA.8x8x4, r20261017-041103-d35d), and the 32 MACs a SM-clock this weight allows is 18 times that" }

# The model's own ranges (Accel.Card's exact and text).
[model]
exact = { value = 31, unit = "bit", mark = "ceiling", source = "PTX ISA 9.0 mma: integer MMAs accumulate in .s32, so a dot is exact at most while |C| + sum |a*b| < 2^31 (P1, Card.Exact); captured exact within it (models.BLACKWELL_SM120_S8_M16N8K32, _WRAP)" }
instruction_bytes = { value = 16, unit = "B/instruction", mark = "ceiling", source = "an instruction is 128 bits from Volta on (CUDA Binary Utilities 12.9), so code fits in store.dram / 16 instructions" }

# The node's host: its CPUs (benchmarks/rho's host_ops), and its DRAM, caches and boundary link (the remote bandwidth
# audit's node, verity/hardware/node.py). The server's, not the card's.
[host]
cpu = "Intel Xeon 6776P (Granite Rapids)"
source = "lscpu on vy-nebius-1, r20261027-022153-5141: the VM sees 2 x 48 cores of the physical 2 x 64"
sockets = { value = 2, unit = "socket", mark = "measurement", source = "lscpu on vy-nebius-1's VM, r20261027-022153-5141; the server's own socket count is not attested" }
cores = { value = 64, unit = "core/socket", mark = "ceiling", source = "Intel ARK 243691 (Xeon 6776P: 64 cores)" }
amx = { value = 1024, unit = "INT8 MAC/cycle/core", mark = "ceiling", source = "Intel Optimization Reference Manual 248966-049 section 20.3 Table 20-2 (TDPBSSD, 16,384 MACs, 16-cycle throughput); measured 1,024.1, r20261027-022153-5141" }
turbo = { value = 3.9, unit = "GHz", mark = "ceiling", source = "Intel ARK 243691: max turbo 3.9 GHz (all-core turbo 3.6); Intel publishes no AMX clock, so the ceiling takes max turbo on every core" }
priority_turbo = { value = 4.6, unit = "GHz", mark = "ceiling", source = "Intel ARK 243691: Priority Core Turbo 4.6 GHz, which the operator may enable in the BIOS" }
priority_cores = { value = 8, unit = "core/socket", mark = "ceiling", source = "Intel ARK 243691: Priority Core Turbo on at most 8 cores a socket" }
ops = { value = 1.0452992e15, unit = "op/s", mark = "ceiling", source = "2 ops a MAC x amx x sockets x (priority_cores x priority_turbo + (cores - priority_cores) x turbo), 1.0453e15 (1.0224e15 without Priority Core Turbo)" }
dram_read = { value = 6.068e11, unit = "B/s", mark = "measurement", source = "eight cards' pinned H2D and 56 CPU readers at once, 319.2 + 287.6 GB/s, the most any reader mix measured; DRAM caps the sum, not the root complex (r20261015-081037-5ecf, art:3250e5915dd8, note:20261015T0731Z-draft-model-constants)" }
dram_bandwidth = { value = 8.192e11, unit = "B/s", mark = "ceiling", source = "16 channels of DDR5-6400 (2 sockets x 8 channels x 6400 MT/s x 8 B); it bounds every write too: 16 cores wrote labels at 207.69 GB/s at most (r20261020-212232-6ba5, benchmarks/bandwidth/write_host.c)" }
chip = { value = 1000341504, unit = "B", mark = "ceiling", source = "all of the host's on-chip storage, both sockets whatever share its VM gets: each socket's 336 MiB of L3 and 2 MiB of uncore queues, and each of 128 cores' 2 MiB of L2, 48 KiB of L1d, 64 KiB of L1i and 64 KiB of registers and buffers; the cache sizes are r20261020-212232-6ba5's lscpu, the 64 KiB a core and 2 MiB a socket allowances (note:20261024T0330Z-report-redteam-night (f)4)" }
link_window = { value = 6291456, unit = "B", mark = "measurement", source = "what the boundary link lands in memory at once beyond its rate: net.ipv4.tcp_rmem's max on vy-nebius-2 (eth0's ring, 1,024 descriptors at a 1,500-byte MTU, holds less; r20261019-004759-4580)" }
