# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test_cards.py holds the B200's data sheet to its card file. test_package.py imports the record, the registration
# log and the Site, a suite of its own, in an interpreter of its own: they import the wire. test_policy.py holds the DGX
# H200's card to the inference-only policy's data, which states the same line rate.
inputs = ["verity/__init__.py", "verity/errors.py", "security/Definitions/Accounting/Sheets/B200.lean",
          "benchmarks/rho/data/hardware.toml", "verity/device.py", "verity/channel.py", "hardware/cards",
          "hardware/nodes"]
