# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test_lean.py holds the Lean card tables and the B200's data sheet to the card files, and reads the stores, resources
# and formats of Isa.lean.
inputs = ["verity/__init__.py", "verity/errors.py", "security/Definitions/Core/Accel/Isa.lean",
          "security/Definitions/Core/Accel/H200.lean", "security/Definitions/Core/Accel/Sm120.lean",
          "security/Definitions/Accounting/Sheets/B200.lean"]
