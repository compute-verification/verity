# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test_cards.py holds the B200's data sheet to its card file. test_package.py imports the wire, where the record entry
# is, and the Site, in an interpreter of its own. test_sheet_lean.py holds the H200's figures as a value (Sheet.lean's
# sheetCard) to its card file.
inputs = ["verity/__init__.py", "verity/errors.py", "security/Definitions/Accounting/Sheets/B200.lean",
          "security/Proofs/Core/Accel/Sheet.lean", "verity/device.py", "verity/channel.py", "hardware/cards",
          "hardware/nodes"]
