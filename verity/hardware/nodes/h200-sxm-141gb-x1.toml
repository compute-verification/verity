# An H200 node: one h200-sxm-141gb card in a VM of a two-socket Xeon Platinum 8468 server. This file holds what the
# node's registration states that no card does (verity/hardware/README.md): the cards it names, how many GPUs it
# carries, and the host's own memory, one table a leaf. Each number is { value, unit, mark, source }, as in a card.
# A GPU's memory is its card's store.dram, whole, and every clock and peak of a card is its card's: none is here.
# No run has read the interfaces that carry traffic off a node of this kind, so the file has no interface table and
# the node's entry registers no link.

node = "h200-sxm-141gb-x1"
name = "An H200 node: one card in a VM of a two-socket Xeon Platinum 8468 server"

[device]
sku = "h200-sxm-141gb"
count = { value = 1, unit = "card", mark = "measurement", source = "nvidia-smi -q on each of the two H200 nodes: 'Attached GPUs : 1', an NVIDIA H200 (art:72daa20de42c, art:28ff838a63c9)" }

[host]
sku = "xeon-platinum-8468-2s"

# The host's own memory. dram is the memory the VM is given, above the total free -b and MemTotal state, which leave
# out what the kernel keeps; the server's DIMMs are not on record (a guest can't read them). The disks are the VM's
# block devices, each whole, mounted or not. One VM of this kind was read, and the file is the kind's.
#
# A leaf's rate is the most its bytes are read back at, whatever the node runs, a ceiling: the tightest bound on
# record. DRAM's is the host card's memory.bandwidth_max. A disk's is its own interface's where the disk states one
# (a drive of the server's own: its link's lanes at their rate, less the coding), and else the host card's
# disk.read_max, the lanes into the server's sockets, which bounds the host's disks together too: these disks are
# virtio_blk devices the hypervisor gives the VM, the provider's network disks, which state no interface. No run has
# read a disk of this kind of node, so no measured rate stands beside a ceiling.
[memory.dram]
tier = "dram"
bytes = { value = 214748364800, unit = "B", mark = "measurement", source = "infra's read, by hand, on a VM of this kind 19 s after its boot: lsmem -b, 'Total online memory', 100 blocks of 2 GiB and none offline, 200 GiB (art:260d54fc36b1); free -b there gives a total of 211,069,931,520 B" }
rate = { value = 6.144e11, unit = "B/s", mark = "ceiling", source = "the host card's memory.bandwidth_max (xeon-platinum-8468-2s): the server's sixteen DDR5 channels at the fastest memory the processor takes. A program reads the node's DRAM over those channels and no other way, and the VM's share of them is not on record, so the whole server's stands" }

[memory.vda]
tier = "disk"
bytes = { value = 274877906944, unit = "B", mark = "measurement", source = "infra's read, by hand, on a VM of this kind 19 s after its boot: lsblk -b, vda, the boot disk, 256 GiB (art:260d54fc36b1)" }
rate = { value = 661661538462, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-platinum-8468-2s), the PCI Express lanes and the chipset link into the server's sockets: the disk is a virtio_blk device, one the hypervisor gives the VM (the read of its bytes lists it as vda, the name that driver gives: art:260d54fc36b1), and nothing on record states an interface of the disk's own, so its bytes are bounded only where they enter the server. A limit the provider sets on a disk of its kind and size is a setting and no ceiling" }

[memory.vdb]
tier = "disk"
bytes = { value = 1048576, unit = "B", mark = "measurement", source = "infra's read, by hand, on a VM of this kind 19 s after its boot: lsblk -b, vdb, 1 MiB, not mounted (art:260d54fc36b1)" }
rate = { value = 661661538462, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-platinum-8468-2s), the PCI Express lanes and the chipset link into the server's sockets: the disk is a virtio_blk device, one the hypervisor gives the VM (the read of its bytes lists it as vdb, the name that driver gives: art:260d54fc36b1), and nothing on record states an interface of the disk's own, so its bytes are bounded only where they enter the server. No limit of the provider's is on record for its megabyte" }

[memory.vdc]
tier = "disk"
bytes = { value = 499289948160, unit = "B", mark = "measurement", source = "infra's read, by hand, on a VM of this kind 19 s after its boot: lsblk -b, vdc, the data disk, 465 GiB (art:260d54fc36b1)" }
rate = { value = 661661538462, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-platinum-8468-2s), the PCI Express lanes and the chipset link into the server's sockets: the disk is a virtio_blk device, one the hypervisor gives the VM (the read of its bytes lists it as vdc, the name that driver gives: art:260d54fc36b1), and nothing on record states an interface of the disk's own, so its bytes are bounded only where they enter the server. A limit the provider sets on a disk of its kind and size is a setting and no ceiling" }
