# An RTX PRO 6000 node: eight rtx-pro-6000-server cards in the VM of a two-socket Xeon 6776P server. This file holds
# what the node's registration states that no card does (verity/hardware/README.md): the cards it names, how many GPUs
# it carries, the host's own memory, one table a leaf, and the interfaces that carry traffic off the node, one table
# each. Each number is { value, unit, mark, source }, as in a card. A GPU's memory is its card's store.dram, whole,
# and every clock and peak of a card is its card's: none is here.

node = "rtx-pro-6000-server-x8"
name = "An RTX PRO 6000 node: eight cards in the VM of a two-socket Xeon 6776P server"

[device]
sku = "rtx-pro-6000-server"
count = { value = 8, unit = "card", mark = "measurement", source = "nvidia-smi on the node lists eight NVIDIA RTX PRO 6000 Blackwell Server Edition cards, indices 0 to 7 (art:ad5919199280)" }

[host]
sku = "xeon-6776p-2s"

# The host's own memory. dram is the memory the VM is given, above MemTotal, which leaves out what the kernel keeps;
# the server's DIMMs are not on record (a guest can't read them). The disks are the VM's block devices, each whole,
# mounted or not.
#
# A leaf's rate is the most its bytes are read back at, whatever the node runs, a ceiling: the tightest bound on
# record. DRAM's is the host card's memory.bandwidth_max. A disk's is its own interface's where the disk states one
# (a drive of the server's own: its link's lanes at their rate, less the coding), and else the host card's
# disk.read_max, the lanes into the server's sockets, which bounds the host's disks together too: these disks are
# virtio_blk devices the hypervisor gives the VM, the provider's network disks, which state no interface.
[memory.dram]
tier = "dram"
bytes = { value = 1872605741056, unit = "B", mark = "measurement", source = "lsmem -b on the node's VM: 'Total online memory', 872 blocks of 2 GiB and none offline, 1,744 GiB (art:ad5919199280); /proc/meminfo's MemTotal there is 1,843,153,899,520 B" }
rate = { value = 1.1264e12, unit = "B/s", mark = "ceiling", source = "the host card's memory.bandwidth_max (xeon-6776p-2s): the server's sixteen DDR5 channels at the fastest memory the processor takes. A program reads the node's DRAM over those channels and no other way, and the VM's share of them is not on record, so the whole server's stands" }

[memory.vda]
tier = "disk"
bytes = { value = 274877906944, unit = "B", mark = "measurement", source = "lsblk -b on the node's VM: vda, the boot disk, 256 GiB (art:ad5919199280)" }
rate = { value = 698092307693, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-6776p-2s), the PCI Express lanes into the server's sockets and the USB ports counted with them: the disk is a virtio_blk device, one the hypervisor gives the VM, with no model and no transport of its own (art:bb5d32c3c5ee), so no interface of the disk's is on record and its bytes are bounded only where they enter the server. The provider's limit for a disk of its kind and size, 120 MiB/s, is a setting and no ceiling: a run read 0.224 GB/s from it (art:53c2656f4c56)" }

[memory.vdb]
tier = "disk"
bytes = { value = 1048576, unit = "B", mark = "measurement", source = "lsblk -b on the node's VM: vdb, 1 MiB, not mounted (art:ad5919199280)" }
rate = { value = 698092307693, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-6776p-2s), the PCI Express lanes into the server's sockets and the USB ports counted with them: as memory.vda, a virtio_blk device with no model and no transport of its own (art:bb5d32c3c5ee). No limit of the provider's is on record for its megabyte, which a run read over and over at 1.523 GB/s (art:53c2656f4c56)" }

[memory.vdc]
tier = "disk"
bytes = { value = 5991479377920, unit = "B", mark = "measurement", source = "lsblk -b on the node's VM: vdc, the data disk, 5,580 GiB (art:ad5919199280); the same VM's was 5,392,331,440,128 B when its disks' read was measured (art:53c2656f4c56), and the larger stands" }
rate = { value = 698092307693, unit = "B/s", mark = "ceiling", source = "the host card's disk.read_max (xeon-6776p-2s), the PCI Express lanes into the server's sockets and the USB ports counted with them: as memory.vda, a virtio_blk device with no model and no transport of its own; the link its PCI device reports, 2.5 GT/s on one lane, is the hypervisor's emulation and bounds nothing (art:bb5d32c3c5ee). The provider's limit for a disk of its kind and size, 2 GiB/s, is a setting and no ceiling: a run read 2.564 GB/s from it (art:53c2656f4c56), about ten times what that link would carry" }

# The node's own way out: the interfaces a route of the node sends packets out of, each at its line rate, each way.
# None of the auditor's hardware sits on one, so each registers as a boundary link that no certifier splits.
[interface.eth0]
rate = { value = 400000000000, unit = "bit/s", mark = "measurement", source = "/sys/class/net/eth0/speed on the node's VM reads 400000 Mb/s, and ethtool the same at full duplex with the link detected (art:8e47f2512256). eth0, a device of the mlx5_core driver, is the one interface a route of the node's main tables names, the default route among them; the others are the loopback and a bridge with no device behind it, which is down. No latency of it is on record and nothing reads one, so its link registers at latency 0" }
