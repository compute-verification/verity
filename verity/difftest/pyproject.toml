[project]
name = "verity-difftest"
version = "0.1.0"
description = "The differential test of core's Lean, the verifier of record, against the Python that mirrors it: Hypothesis drives the Python and the Lean executable on the same inputs."
requires-python = ">=3.12"
dependencies = ["hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_difftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_example_port.py", "tests/test_protocol_port.py"]
# Test-only: `lake` builds lean/ (in this directory) and, through its path require, these files of Flock's verifier
# (`Flock.Canon` and what it imports, and the package's configuration); the protocol-mode tests build the core protocol
# interface's example (`core-protocol-example`), which reads the same files and the interface package. The annotation
# port's test builds `annot-difftest`, which reads `Flock.Annot`, `Flock.AnnotExpand` and what they import
# (`verity_difftest.annot.INPUTS`), and holds it to `verity.circuits.query_ast`.
inputs = ["verity/protocols/interface", "verity/protocols/flock/verifier/lakefile.toml", "verity/protocols/flock/verifier/lake-manifest.json",
          "verity/protocols/flock/verifier/lean-toolchain", "verity/protocols/flock/verifier/Flock/Field.lean",
          "verity/protocols/flock/verifier/Flock/Bytes.lean", "verity/protocols/flock/verifier/Flock/Canon.lean",
          "verity/protocols/flock/verifier/Flock/JsonParse.lean",  # the JSON parser's port
          "verity/protocols/flock/verifier/Flock/Annot.lean", "verity/protocols/flock/verifier/Flock/AnnotExpand.lean",
          "verity/protocols/flock/verifier/Flock/Hash.lean", "verity/protocols/flock/verifier/Flock/Program.lean",
          "verity/protocols/flock/verifier/Flock/Sizes.lean", "verity/protocols/flock/verifier/Flock/Steps.lean",
          "verity/__init__.py", "verity/ml/__init__.py", "verity/circuits",
          # the JSON parser's port reads the recorded public files' headers (`RECORDED_FIXTURES`), fetched fixtures
          "verity/protocols/flock/prover/tests/fixtures/forged-proofs", "verity/protocols/flock/prover/tests/fixtures/public-inputs",
          "verity/protocols/flock/prover/tests/fixtures/public-inputs-blocks", "verity/protocols/flock/prover/tests/fixtures/rec-coins",
          "verity/protocols/flock/prover/tests/fixtures/rec-links", "verity/protocols/flock/prover/tests/fixtures/zk-sessions",
          "verity/protocols/__init__.py"]
