# A suite of `verity`'s tests: the Lean evaluator (`verity-evaluate`, this directory's Lake package) against the Python reference.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# `lake build` reads this package and C-Flock's verifier (verity/core/service/flock), which it requires by path; the Python
# reference is verity.ml.circuits.
inputs = ["verity"]
