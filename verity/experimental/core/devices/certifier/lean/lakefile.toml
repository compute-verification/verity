# The active network certifier device: `active.py`'s proxy as a pure state machine over the reference's certifiers and
# online prover, in executable Lean. It reuses `certifier_program`'s schedule and `network_check`'s grid parameters; no
# Mathlib and nothing of Security.
name = "certifier_device"
defaultTargets = ["CertifierDevice", "certifier-device-difftest", "certifier-device-smoke"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "certifier_program"
path = "../../../../protocols/certifier/lean"

[[require]]
name = "network_check"
path = "../../../protocols/network/lean"

[[lean_lib]]
name = "CertifierDevice"

[[lean_exe]]
name = "certifier-device-difftest"
root = "CertifierDevice.DifftestMain"

[[lean_exe]]
name = "certifier-device-smoke"
root = "CertifierDevice.SmokeMain"
