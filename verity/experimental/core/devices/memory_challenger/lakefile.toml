# PoUS's memory challenger as executable Lean: its record formats and crypto, `verdict` as a core protocol, and the
# challenger itself as a pure `step` with a driver over `Core.World`. Code: Lean core and the packages below, no Mathlib.
name = "core_memory_challenger"
defaultTargets = ["MemoryChallenger", "memory-challenger", "memory-challenger-test", "memory-challenger-difftest", "memory-challenger-drive"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../../core/service/flock"

[[require]]
name = "core_randomness"
path = "../../primitives/randomness"

[[require]]
name = "lms"
path = "../../primitives/lms/lean"

[[require]]
name = "core_world"
path = "../../primitives/world"

[[require]]
name = "core_protocol"
path = "../../protocols/interface"

[[require]]
name = "verity_difftest"
path = "../../difftest/lean"

[[lean_lib]]
name = "MemoryChallenger"

# `verdict` under the accepted schemes (S1's LMS at its deployed parameters): the interface's command line.
[[lean_exe]]
name = "memory-challenger"
root = "MemoryChallenger.Main"

# `verdict` under the test signers' schemes alone, with a protocol id of its own, for the difftest.
[[lean_exe]]
name = "memory-challenger-test"
root = "MemoryChallenger.TestMain"

[[lean_exe]]
name = "memory-challenger-difftest"
root = "MemoryChallenger.DifftestMain"

# `drive` over an in-memory world (`MemoryChallenger.MemoryWorld`), for the difftest of the driver.
[[lean_exe]]
name = "memory-challenger-drive"
root = "MemoryChallenger.DriveMain"
