# V*'s circuits as executable Lean (lane rec-v0's outer statement): each Ligerito level's `RecOpen{LANES, H}` statement and
# each `InnerRepCheck{S}` part of the algebra, emitted as the `flock-circuit` file `Flock.Circuit` parses. Code, not
# analysis: Lean core and C-Flock's verifier (its circuit builder `Flock.HmNets`, hashes and canonical JSON), no Mathlib.
name = "core_vstar"
defaultTargets = ["VStar", "vstar", "vstar-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../../core/service/flock"

[[require]]
name = "verity_difftest"
path = "../../difftest/lean"

[[lean_lib]]
name = "VStar"

[[lean_exe]]
name = "vstar"
root = "VStarMain"

[[lean_exe]]
name = "vstar-difftest"
root = "VStarDifftest"
