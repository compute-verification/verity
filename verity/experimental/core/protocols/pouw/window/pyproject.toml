[project]
name = "verity-pouw-window-difftest"
version = "0.0.0"
description = "The difftest of `pouw_window` against `verity.experimental.protocols.pouw.window`."
requires-python = ">=3.12"
dependencies = []

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the harness (`verity_difftest`, which the workspace installs, and the Lean `lake` builds through the path require);
# the reference, `window.py`, the packages above it and the core it imports (`verity.ml`'s circuits codec, commitments and
# crypto, and `verity.errors`); what `lake` reads through verity_difftest's path require on C-Flock's verifier (`Flock.Canon`
# and what it imports, and the package's configuration).
inputs = ["verity/experimental/core/difftest", "verity/__init__.py", "verity/experimental/__init__.py", "verity/experimental/protocols/__init__.py",
          "verity/experimental/protocols/pouw/__init__.py", "verity/experimental/protocols/pouw/window.py",
          "verity/errors.py", "verity/ml/__init__.py", "verity/ml/circuits", "verity/ml/commitments", "verity/ml/crypto",
          "verity/core/service/flock/lakefile.toml", "verity/core/service/flock/lake-manifest.json",
          "verity/core/service/flock/lean-toolchain", "verity/core/service/flock/Flock/Field.lean",
          "verity/core/service/flock/Flock/Bytes.lean", "verity/core/service/flock/Flock/Canon.lean"]
