# PoUW's check of one audit window as a core protocol (`core_protocol`'s `Core.Protocol`), the port of
# `verity/experimental/protocols/pouw/core_check.py`: the verifier's parameters, the window's registration and its digest,
# the proof service's answer, and PoUW's rule over them. Lean core only; its properties are stated in
# `Security/Properties/Pouw/Check.lean`, and the difftest (`tests/test_difftest.py`, on the shared harness) holds
# `pouw-check serve` to the Python on generated cases.
name = "pouw_check"
defaultTargets = ["PouwCheck", "pouw-check"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "core_protocol"
path = "../../interface"

[[require]]
name = "pouw_window"
path = "../window"

[[lean_lib]]
name = "PouwCheck"

[[lean_exe]]
name = "pouw-check"
root = "PouwCheck.Main"
