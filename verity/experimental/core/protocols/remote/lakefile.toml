# Remote Verity as one `Core.Protocol` (`verity/remote/v0`): the composition of integrity (sampled proofs) and work
# (PoUW), each a stub until its port lands. Its executable is the core CLI (`remote id | check | serve`); `remote-difftest`
# serves its `answer` to the difftest. Code: no Mathlib.
name = "core_remote"
defaultTargets = ["CoreRemote", "remote", "remote-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "flock_verifier"
path = "../../../../core/service/flock"

[[require]]
name = "core_protocol"
path = "../interface"

[[require]]
name = "verity_difftest"
path = "../../difftest/lean"

[[require]]
name = "core_composition"
path = "../composition"

[[lean_lib]]
name = "CoreRemote"

[[lean_exe]]
name = "remote"
root = "RemoteMain"

[[lean_exe]]
name = "remote-difftest"
root = "RemoteDifftest"
