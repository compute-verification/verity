# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the spec's §7 vectors: the setup difftest's generator copies them for PousCheck (test_pous_setup_lean_difftest.py)
inputs = ["verity", "Security", "benchmarks/pous/p2_v1/vectors.json"]
