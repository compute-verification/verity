name = "verity"
defaultTargets = ["Verity"]

[leanOptions]
autoImplicit = false

# The one Mathlib revision every Lake package in the tree builds with (`tests/test_lean_packages.py`).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

# Verity core's Lean: the model every protocol states its guarantees in (circuits, partitions, declarations, games),
# under the four names (`Protocol`, `Assumptions`, `Guarantees`, `SecurityProofs`), and statements about `verity`'s own
# definitions (`verity_catalog.silicon`).
[[lean_lib]]
name = "Verity"
roots = ["Verity.Assumptions", "Verity.Guarantees", "Verity.Protocol", "Verity.SecurityProofs.Fp32.Vectors", "Verity.SecurityProofs.Prims.Vectors", "Verity.SecurityProofs.Scalar.Vectors", "Verity.SecurityProofs.TC.Vectors"]
