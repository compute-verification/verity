[project]
name = "pous-check"
version = "0.1.0"
description = "The differential test of pous_check, the PoUS setup check in Lean, against the Python reference: the core difftest harness drives its functions (pous-setup-difftest), its protocol (pous-setup) and the composed check of a recorded run (pous-run serve, against run.check_at); interop.py, the timed audit's wire (pous-audit-difftest serve) against wire.py on the spec's vectors; timed_audit.py, the strict timed audit's verdict of record (pous-timed-audit) against memory_challenger.verdict; and test_verdict_difftest.py, the verdict unit's code (pous-verdict-difftest) against the Definition verdict_circuit.PousVerdict, compiled."
requires-python = ">=3.12"
dependencies = ["verity", "verity-difftest", "hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_interop.py"]
paths = ["benchmarks/pous/p2_v1"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_interop.py",
    "tests/test_run.py",
    "tests/test_run_protocol.py",
    "tests/test_setup_difftest.py",
    "tests/test_timed_audit.py",
    "tests/test_verdict_difftest.py",
]
# Test-only: `lake` builds this package and, through its path requires, the core protocol interface and C-Flock's verifier's
# Lean (`Flock/`, which PousCheck reaches through Flock.HmRow, and the package's configuration); the vectors are `p2_v1`'s
# files, which the vector tests read. `interop.py` holds the Lean to the wire's Python reference (`p2_v1`'s package, `wire.py`
# and `reference.py`, which pins the files) on the audit files. `timed_audit.py` holds the Lean to the
# memory challenger's verdict (`verity/protocols/pous/device/timed_audit.py`), and drives its strict audit
# against the harness's responder.
# `test_run.py` holds `PousCheck.Run` to `run.py`: `lake` builds the memory challenger's Lean package and LMS's through the
# path requires, and the test draws its sessions with that package's `tests/mc_cases.py`, which signs with the PoUS tests'
# test signer, read by path. `test_run_protocol.py` holds `PousCheck.RunProtocol` (onsite's PoUS component) to `run.py`
# and the period hook (`period.py`) on the same sessions and on the hook's own periods. `test_verdict_difftest.py` holds
# `PousCheck.Verdict` to `verdict_circuit.py`'s Definition, compiled and run by `verity.circuits`' evaluator.
# Of `verity` and the difftest harness (whose Lean `lake` builds too), what the tests import: these in place of both trees.
inputs_only = true
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/claims/__init__.py",
          "verity/core/protocols/__init__.py", "verity/protocols/pous", "verity/ml/protocols/__init__.py",
          "verity/protocols/pous/prover", "verity/difftest", "verity/ml/__init__.py",
          "verity/circuits", "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness",
          "verity/protocols/interface", "verity/commitments/identity", "verity/commitments/randomness", "verity/protocols/flock/verifier/Flock",
          "verity/protocols/flock/verifier/lakefile.toml", "verity/protocols/flock/verifier/lake-manifest.json",
          "verity/protocols/flock/verifier/lean-toolchain", "benchmarks/pous/p2_v1/vectors.json",
          "benchmarks/pous/p2_v1/__init__.py", "benchmarks/pous/p2_v1/reference.py", "benchmarks/pous/p2_v1/wire.py",
          "benchmarks/pous/p2_v1/audit-vectors.json", "benchmarks/pous/p2_v1/audit-negative-vectors.json",
          "benchmarks/pous/band_gpu/__init__.py",
          "verity/core/devices/__init__.py", "verity/protocols/pous/device/__init__.py",
          "verity/protocols/pous/device/timed_audit.py", "benchmarks/pous/band_gpu/harness.py",
          "verity/protocols/pous/device/lean", "verity/commitments/attest/lean", "verity/commitments/lms/lean",
          # the deployment layer and its wire, which the period hook's memory challenger is started through
          # (`deploy.stream.Side`) and runs on
          "verity/configuration/deploy", "verity/configuration/wire",
          "verity/configuration/__init__.py", "verity/protocols/__init__.py"]
