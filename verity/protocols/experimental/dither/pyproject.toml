# Dither, an experimental PoUW variant: its circuit (prover/dither.py) and the circuit's test, which runs
# here as a suite (`uv run tools/verity/check/suites.py verity/protocols/experimental/dither`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py", "verity/errors.py", "verity/protocols/__init__.py", "verity/protocols/accounting/__init__.py",
          "verity/protocols/experimental/__init__.py",
          "verity/circuits", "verity/commitments", "adapters/vllm/verity_vllm/definitions/boolean.py", "adapters/vllm/verity_vllm/definitions/evidence.json", "adapters/vllm/verity_vllm/definitions/numerics/derived_rows.py", "adapters/vllm/verity_vllm/definitions/numerics/topp_stage_twins.py", "adapters/vllm/verity_vllm/definitions/registry/boolean_dsa_norm.py", "adapters/vllm/verity_vllm/definitions/registry/boolean_fp8.circuit-check.json", "adapters/vllm/verity_vllm/definitions/registry/boolean_fp8.circuit-check.py", "adapters/vllm/verity_vllm/definitions/registry/catalog.circuit-check.py", "adapters/vllm/verity_vllm/definitions/registry/catalog.py", "adapters/vllm/verity_vllm/definitions/registry/dsa_topk_mask_cut.circuit-check.py", "adapters/vllm/verity_vllm/definitions/registry/dsa_topk_mask_cut.py", "adapters/vllm/verity_vllm/definitions/registry/dsa_topk_reads.circuit-check.py", "adapters/vllm/verity_vllm/definitions/registry/dsa_topk_reads.py", "adapters/vllm/verity_vllm/definitions/registry/sampled_accept.circuit-check.py", "adapters/vllm/verity_vllm/definitions/registry/sampled_accept.py", "adapters/vllm/verity_vllm/definitions/registry/topp_stages.circuit-check.py", "adapters/vllm/verity_vllm/definitions/registry/topp_stages.py", "adapters/vllm/verity_vllm/definitions/tests/catalog_ids.json", "adapters/vllm/verity_vllm/definitions/tests/test_boolean_find.py", "adapters/vllm/verity_vllm/definitions/tests/test_call_scope.py", "adapters/vllm/verity_vllm/definitions/tests/test_dsa_topk_reads.py", "adapters/vllm/verity_vllm/definitions/tests/test_topp_stages.py", "adapters/vllm/verity_vllm/definitions/tests/test_word.py", "verity/protocols/accounting/pouw"]
