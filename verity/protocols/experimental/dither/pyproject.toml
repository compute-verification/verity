# Dither, an experimental PoUW variant: its circuit (prover/dither.py), its GPU kernels (prover/kernels/) and two of
# their front ends (prover/h1r.py, prover/j10r_ws.py), and the circuit's and h1u.cu's tests, which run here as a suite
# (`uv run tools/check/suites.py verity/protocols/experimental/dither`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity/__init__.py", "verity/errors.py", "verity/protocols/__init__.py", "verity/protocols/resource_accounting/__init__.py",
          "verity/protocols/experimental/__init__.py",
          "verity/circuits", "verity/commitments", "adapters/vllm/verity_vllm/definitions", "verity/protocols/resource_accounting/compute/pouw",
          # h1zy loads PoUW's leaf_lanes and weights, which load SPOT's one-stage verifier and its challenger
          "verity/channel.py", "verity/protocols/proofs/__init__.py", "verity/protocols/proofs/spot/__init__.py",
          "verity/protocols/proofs/spot/verifier/challenger/__init__.py", "verity/protocols/proofs/spot/verifier/challenger/challenger.py",
          "verity/protocols/proofs/spot/verifier/challenger/coins.py", "verity/protocols/proofs/spot/verifier/challenger/remote.py",
          "verity/protocols/proofs/spot/verifier/__init__.py", "verity/protocols/proofs/spot/verifier/profile.py",
          "verity/protocols/proofs/spot/verifier/one_stage"]
