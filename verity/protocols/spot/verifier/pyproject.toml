# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_challenger_coins.py",
    "tests/test_coins.py",
    "tests/test_plancheck.py", "tests/test_form_refusals.py",
    "tests/test_proofs.py",
    "tests/test_service.py",
    "tests/test_service_fleet.py",
    "tests/test_service_history.py",
    "tests/test_service_sessions.py",
    "tests/test_service_window.py",
    "tests/test_verifier.py",
]
# Test-only: the Lean-evaluated exfiltration vectors record the sha256 of the soundness package's files they were generated
# from (tests/lean/generate.sh), and a test compares them with the tree. The catalog's Definitions register their kernels
# (verity.definitions.kernels) lazily. test_proofs.py fetches its fixture through Flock's `verifier/ci.py`, whose child
# `python -m research data fetch` imports the research files listed last.
inputs = ["verity", "security/Proofs/Flock/Soundness/Audit/Influence.lean",
          "security/Proofs/Flock/Soundness/Audit/Law.lean",
          "security/Proofs/Flock/Soundness/Audit/Stratified.lean",
          "security/Proofs/Flock/Soundness/Audit/StratifiedMiss.lean",
          "security/Proofs/Flock/SamplingGeneric/TwoCount.lean",
          "security/Proofs/Flock/SamplingGeneric/TwoTable.lean",
          "security/Definitions/Claims/SamplingTwo.lean",
          "security/Proofs/lake-manifest.json",
          "security/Proofs/lean-toolchain", "verity/circuits", "verity/definitions/kernels",
          "tools/research/src/research/__init__.py", "tools/research/src/research/__main__.py",
          "tools/research/src/research/cli.py", "tools/research/src/research/clone.py",
          "tools/research/src/research/compare.py", "tools/research/src/research/env.py",
          "tools/research/src/research/record.py", "tools/research/src/research/remote.py",
          "tools/research/src/research/result.py", "tools/research/src/research/runs.py",
          "tools/research/src/research/secret_hint.py", "tools/research/src/research/timefmt.py",
          "tools/research/src/research/waitcap.py", "tools/research/src/research/treelock.py",
          "tools/research/src/research/store/__init__.py", "tools/research/src/research/store/attempt.py",
          "tools/research/src/research/store/canon.py", "tools/research/src/research/store/cli.py",
          "tools/research/src/research/store/cli_prov.py", "tools/research/src/research/store/derivation.py",
          "tools/research/src/research/store/ids.py", "tools/research/src/research/store/index.py",
          "tools/research/src/research/store/kinds.py", "tools/research/src/research/store/local.py",
          "tools/research/src/research/store/model.py", "tools/research/src/research/store/remote.py",
          "tools/research/src/research/store/remote_s3.py", "tools/research/src/research/store/tool.py",
          "tools/research/src/research/store/tools_registry.py", "tools/research/src/research/store/vocab.py",
          "tools/research/src/research/telemetry/__init__.py", "tools/research/src/research/telemetry/cgroup.py",
          "tools/research/src/research/telemetry/events.py", "tools/research/src/research/telemetry/job.py"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_proofs.py"]
paths = ["tools/research/src/research"]
