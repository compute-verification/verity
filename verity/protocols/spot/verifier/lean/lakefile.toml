# Sampled proofs' one-stage audit as a `Core.Protocol` (`verity/sampled-proofs/one-stage/v1`): the registration record and
# its R1–R7 (v1 and v2 records), the partition, the draw's checks, the verdict, the integrity profile and the whole audit
# record: the audit's definition, which `verity/protocols/spot/verifier/one_stage` mirrors and its difftest holds to
# it. `sampled-proofs-verifier` is the verifier of record the Python calls (`one_stage.verifier`). Code, not analysis: Lean
# core, C-Flock and the interface.
name = "core_spot"
defaultTargets = ["Spot", "sampled-proofs-one-stage", "sampled-proofs-one-stage-zk", "sampled-proofs-difftest",
  "sampled-proofs-verifier", "site-difftest", "sampled-proofs-plancheck"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_protocol"
path = "../../../interface"

[[require]]
name = "flock_verifier"
path = "../../../flock/verifier"

# The proof system's challenger signs its record with LMS (`Spot.ChallengerRecord`).
[[require]]
name = "lms"
path = "../../../../commitments/lms/lean"

[[require]]
name = "verity_difftest"
path = "../../../../../tools/difftest/lean"

[[lean_lib]]
name = "Spot"

[[lean_exe]]
name = "sampled-proofs-one-stage"
root = "Spot.Main"

[[lean_exe]]
name = "sampled-proofs-one-stage-zk"
root = "Spot.ZkMain"

[[lean_exe]]
name = "sampled-proofs-difftest"
root = "Spot.DifftestMain"

[[lean_exe]]
name = "sampled-proofs-verifier"
root = "Spot.VerifierMain"

# The planner's designs checked in exact arithmetic (`Spot.PlanCheck`), which
# `verity/protocols/spot/plancheck.py` calls.
[[lean_exe]]
name = "sampled-proofs-plancheck"
root = "Spot.PlanCheckMain"

# The Site's port (`CoreProtocol.Site`), which `tests/test_site_difftest.py` holds to `verity.hardware.site`: the
# registration log is the proof service's record, and this package requires both the interface and the harness.
[[lean_exe]]
name = "site-difftest"
root = "Spot.SiteDifftestMain"
