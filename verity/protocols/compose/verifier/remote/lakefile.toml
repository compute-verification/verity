# Remote Verity as one `Core.Protocol`: the composition of integrity (SPOT), work and the inference-only policy
# (`verity/inference-only/v0`). The composite of record is `verity/remote/v1`, whose work is Pearl+'s run verdict
# (`remote-v1`); `verity/remote/v0`, whose work is H1's period, is development only (`remote`, which the difftest
# drives; no configuration names it). Each executable is the core CLI (`id | check | serve`). Code: no Mathlib.
name = "core_remote"
defaultTargets = ["CoreRemote", "remote", "remote-v1"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../../proofs/flock/verifier"

[[require]]
name = "core_protocol"
path = "../../../interface"

[[require]]
name = "core_composition"
path = "../lean"

# The ported subprotocols: SPOT's one-stage audit (integrity) and PoUW's period (work).
[[require]]
name = "core_spot"
path = "../../../proofs/spot/verifier/lean"

[[require]]
name = "pouw_verifier"
path = "../../../resource_accounting/compute/pouw/verifier/lean/check"

# The inference-only policy: its check as a core protocol (`InferenceOnlyCheck.Protocol`).
[[require]]
name = "inference_only_verifier"
path = "../../../workload_classification/training_detection/inference_only/verifier/lean"

# Integrity: SPOT in the form its params name, one-stage v2's audit or the recursive audit, V*'s compiled
# check (`VStar.Recursive.Sampled`, `verity/sampled-proofs/v1`).
[[require]]
name = "core_vstar_recursive"
path = "../../../proofs/spot_flock/verifier/lean"

# Work in the composite of record: Pearl+'s run verdict as a core protocol (`PouwCheck.PearlPlus.Protocol`).
[[require]]
name = "pouw_pearlplus"
path = "../../../resource_accounting/compute/pouw/verifier/lean/pearlplus"

[[lean_lib]]
name = "CoreRemote"

[[lean_exe]]
name = "remote"
root = "RemoteMain"

[[lean_exe]]
name = "remote-v1"
root = "RemoteV1Main"
