# Remote Verity as one `Core.Protocol`: the composition of integrity (sampled proofs), work and the inference-only policy
# (`verity/inference-only/v0`). The composite of record is `verity/remote/v1`, whose work is Pearl+'s run verdict
# (`remote-v1`); `verity/remote/v0`, whose work is H1's period, is development only (`remote`, which the difftest
# drives; no configuration names it). Each executable is the core CLI (`id | check | serve`). Code: no Mathlib.
name = "core_remote"
defaultTargets = ["CoreRemote", "remote", "remote-v1"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../flock/verifier"

[[require]]
name = "core_protocol"
path = "../../interface"

[[require]]
name = "core_composition"
path = "composition"

# The ported subprotocols: sampled proofs' one-stage audit (integrity) and PoUW's period (work).
[[require]]
name = "core_spot"
path = "../../spot/verifier/lean"

[[require]]
name = "pouw_check"
path = "../../pouw/verifier/lean/check"

# The inference-only policy: its check as a core protocol (`NciCheck.Protocol`).
[[require]]
name = "nci_check"
path = "../../inference_only/verifier/nci/lean"

# Integrity: sampled proofs in the form its params name, one-stage v2's audit or the recursive audit, V*'s compiled
# check (`VStar.Recursive.Sampled`, `verity/sampled-proofs/v1`).
[[require]]
name = "core_vstar_recursive"
path = "../../recursion/verifier/recursive"

# Work in the composite of record: Pearl+'s run verdict as a core protocol (`PouwCheck.PearlPlus.Protocol`).
[[require]]
name = "pouw_pearlplus"
path = "../../pouw/verifier/lean/pearlplus"

[[lean_lib]]
name = "CoreRemote"

[[lean_exe]]
name = "remote"
root = "RemoteMain"

[[lean_exe]]
name = "remote-v1"
root = "RemoteV1Main"
