# Onsite and remote Verity's common part: a composition of core protocols as one `Core.Protocol` (each component run
# through its own `answer` on its case, reject dominating, the commitment the SHA-512 binding of the components' digests),
# and the stub components that stand in until their ports land. Code: Lean core, the base package (`core_base`) for
# canonical JSON, bytes and SHA-512, and the core interface; no Mathlib and nothing of C-Flock's verifier.
name = "core_composition"
defaultTargets = ["CoreComposition"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_base"
path = "../../../../circuits/base"

[[require]]
name = "core_protocol"
path = "../../../interface"

[[lean_lib]]
name = "CoreComposition"
