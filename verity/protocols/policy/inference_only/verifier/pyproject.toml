# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the manifest's test holds its verifier to SPOT's declaration (`verity.protocols.proofs.spot.verifier.parties`).
inputs = ["verity"]
