# The NCI policy's check, the verifier's side: given a declaration (a descriptor v1 Program and its baseline θ) and a
# declared division into isolation units, decide `InferenceOnly.CompliesRate Γ α` for that division
# (`security/Definitions/InferenceOnly.lean`). It reads the Program with the circuit format's decoder (`Circuits.Program`, in
# `core_circuits`), required by path,
# and imports nothing else but Lean core and the core interface (`core_protocol`, for `InferenceOnlyCheck.Protocol`): no Mathlib
# and nothing of Security. The difftest holds it to the Python reference in `scripts/inference_only_reference.py`.
# `inference-only-check` runs `InferenceOnlyCheck.Desc`, the check at the size of the description, then θ's provenance (`InferenceOnlyCheck.Theta`),
# and `inference-only-check --unrolled` the reference. `inference-only` is the same check as the core protocol
# `verity/inference-only/v0` (`InferenceOnlyCheck.Protocol`), the inference-only policy's subprotocol of onsite and remote.
name = "inference_only_check"
defaultTargets = ["InferenceOnlyCheck", "inference-only-difftest", "inference-only-desc-difftest", "inference-only-desc-liveness", "inference-only-desc-fuzz", "inference-only-theta-difftest",
  "inference-only-count-difftest", "inference-only-check", "inference-only"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_circuits"
path = "../../../../../circuits/lean"

[[require]]
name = "core_protocol"
path = "../../../../interface"

# SPOT's reader of an execution phase's circuit record (`Spot.Wires`), the one parse the record form reads it through.
[[require]]
name = "core_spot"
path = "../../../../proofs/spot/verifier/lean"

[[lean_lib]]
name = "InferenceOnlyCheck"

[[lean_exe]]
name = "inference-only-difftest"
root = "InferenceOnlyCheck.DifftestMain"

[[lean_exe]]
name = "inference-only-desc-difftest"
root = "InferenceOnlyCheck.DescDifftestMain"

[[lean_exe]]
name = "inference-only-desc-liveness"
root = "InferenceOnlyCheck.DescLivenessMain"

[[lean_exe]]
name = "inference-only-desc-fuzz"
root = "InferenceOnlyCheck.DescFuzzMain"

[[lean_exe]]
name = "inference-only-record-difftest"
root = "InferenceOnlyCheck.RecordDifftestMain"

[[lean_exe]]
name = "inference-only-record-check"
root = "InferenceOnlyCheck.RecordCheckMain"

[[lean_exe]]
name = "inference-only-theta-difftest"
root = "InferenceOnlyCheck.ThetaDifftestMain"

[[lean_exe]]
name = "inference-only-count-difftest"
root = "InferenceOnlyCheck.CountDifftestMain"

[[lean_exe]]
name = "inference-only-check"
root = "InferenceOnlyCheck.CheckMain"

[[lean_exe]]
name = "inference-only"
root = "InferenceOnlyCheck.ProtocolMain"
