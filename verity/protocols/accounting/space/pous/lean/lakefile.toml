name = "pous"
defaultTargets = ["Pous"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "Pous"
roots = ["Pous.Assumptions", "Pous.Guarantees", "Pous.Protocol", "Pous.SecurityProofs.Accounting.Numbers", "Pous.SecurityProofs.Sanity"]

# The open targets (`sorry`). Not a default target.
[[lean_lib]]
name = "PousTargets"

# The grader's allowed axioms and pinned targets, compiled into the grader. Not a default target.
[[lean_lib]]
name = "Grader"
roots = ["Grader.Registry"]

# The grader: kernel replay, pinned-type match and axiom audit (`Grader/Main.lean`). It imports only `Lean`.
[[lean_exe]]
name = "pous-grader"
root = "Grader.Main"
