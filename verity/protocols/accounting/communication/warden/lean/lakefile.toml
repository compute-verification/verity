# The network warden's program: the executable forms of the warden's definitions that the difftest runs, and the
# difftest against the Python audit. It imports only Lean. What it computes is `verity/Security`'s trusted text
# (`Definitions/Warden/`), and `security_proofs` (`Proofs/Warden/Code.lean`) proves the two agree.
name = "warden_program"
defaultTargets = ["Warden", "warden-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Warden"

[[lean_exe]]
name = "warden-difftest"
root = "Warden.DifftestMain"
