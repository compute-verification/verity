[project]
name = "verity-network-warden"
version = "0.1.0"
description = "Network transparency: the bucketed warden's grid semantics, the clock-sync advice, the exact audit and the active warden, as a spec-level reference for the Lean package network-timing."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_network_warden"]

[tool.uv.sources]
verity = { workspace = true }
verity-warden-calibration = { workspace = true }

# test_network_warden_active replays the honest prover's sync choice (`warden_calibration.choose_syncs`)
[dependency-groups]
dev = ["verity-warden-calibration"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.verity.tests]
# test_network_warden_lean_difftest runs the Lean package's difftest generator and compares its output with the
# SHA-256 the lock pins (`runs` in lean-audit.json)
inputs = ["protocols/network_warden/lean/scripts/difftest_vectors.py", "protocols/network_warden/lean/lean-audit.json"]
