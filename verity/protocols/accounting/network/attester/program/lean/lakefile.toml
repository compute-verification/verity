# The network attester's program: the executable forms of the attester's definitions, and their difftests against
# advice v1's charge references (`arith_encode.reference_charge`, and `window_charge.reference_window` for the whole
# window). It imports only Lean. What it computes is `security`'s
# trusted text (`Definitions/Certifier/`), and `security_proofs` (`Proofs/Certifier/Code.lean`) proves the
# two agree.
name = "certifier_program"
defaultTargets = ["NetworkAttester"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[lean_lib]]
name = "NetworkAttester"
