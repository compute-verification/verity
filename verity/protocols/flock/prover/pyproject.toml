[project]
name = "verity-flock"
version = "0.1.0"
description = "Flock backend family: the committed GEMM-coordinate relation and its keyed-BLAKE3 row leaves in one binary-field proof (flock-pure), with the pinned unit lowering."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "numpy", "blake3>=1.0"]

[project.optional-dependencies]
# the numerical bench (its contract, cell, generator suites and frozen instance sets), which Flock's bench drivers,
# `instances` and their tests import where they run
bench = ["verity-numerical"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_flock"]

[tool.uv.sources]
verity = { workspace = true }
verity-vllm = { workspace = true }
verity-numerical = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_arena_layout.py",
    "tests/test_challenger_audit.py",
    "tests/test_circuit.py",
    "tests/test_class_statement.py",
    "tests/test_class_statement_redteam_1178.py",
    "tests/test_flock_rows.py",
    "tests/test_flock_rows_vectors.py",
    "tests/test_hm96_leaves.py",
    "tests/test_inner_registered.py",
    "tests/test_ir_lowering.py",
    "tests/test_ir_sampling.py",
    "tests/test_lean_coin_tree.py",
    "tests/test_lean_forged_proofs.py",
    "tests/test_lean_hidden_outputs.py",
    "tests/test_lean_out_group_slot.py",
    "tests/test_lean_plain_hidden_tables.py",
    "tests/test_lean_public_inputs.py",
    "tests/test_lean_rec_cap_guards.py",
    "tests/test_lean_record_checks.py",
    "tests/test_lean_region_words.py",
    "tests/test_lean_registered_bit_rows.py",
    "tests/test_lean_registered_reads.py",
    "tests/test_lean_session_tables.py",
    "tests/test_lean_shared_reads.py",
    "tests/test_lean_typed_reads.py",
    "tests/test_lean_typed_statement.py",
    "tests/test_lean_typed_template.py",
    "tests/test_lean_verifier.py",
    "tests/test_lean_verify_members.py",
    "tests/test_lean_width_refusals.py",
    "tests/test_lean_zk.py",
    "tests/test_lean_zk_mask.py",
    "tests/test_ligerito_folds.py",
    "tests/test_pod_lean_verdicts.py",
    "tests/test_pouw_rows.py",
    "tests/test_read_tmpl.py", "tests/test_read_tmpl_stager.py",
    "tests/test_rec_algebra.py",
    "tests/test_rec_inner_stage.py",
    "tests/test_ring_switch.py",
    "tests/test_sha512_leaves.py",
    "tests/test_stage_typed.py",
    "tests/test_stream_zk_server.py",
    "tests/test_typed_statement.py",
    "tests/test_witness_host.py", "tests/test_zc_round1.py", "tests/test_zerocheck_fused.py",
]
# Test-only. Of Security, only what the tests and their Lean read: Lake and `lean` run outside the read guard, so
# tests/test_security_inputs.py holds this list to the import closure under Security of every module they build or import.
inputs = [
    # test_lean_verifier.py's `lake build Proofs.Flock.Verifier` and the scratch files importing it: the module's closure
    "security/Proofs/Flock/Verifier.lean", "security/Proofs/Flock/Verifier",
    # what Lake reads to load security_proofs, and security and security_properties, which it requires by path
    "security/Proofs/lakefile.toml", "security/Proofs/lake-manifest.json", "security/Proofs/lean-toolchain",
    "verity/hardware/record.py",
    "security/lakefile.toml", "security/lake-manifest.json", "security/lean-toolchain",
    "security/Properties/lakefile.toml", "security/Properties/lake-manifest.json", "security/Properties/lean-toolchain",
    # test_lean_verifier.py and test_audit_profile.py read the audit layer's files and its lifted statements
    "security/Proofs/Flock/Soundness/Audit", "security/Proofs/Flock/Lemmas/Audit.lean",
    # test_randomness_spec.py hashes the spec fixtures/randomness_lean.json was generated from
    "security/Proofs/Flock/Soundness/PlanDraw.lean",
    # tests import circuit-check's targets and read the census
    "tools/verity/circuit_check", "benchmarks/census",
    # the Lean verifier's stratified sample against the one-stage protocol's, and the Lean spec of verity.commitments.randomness against
    # its pinned vectors
    "verity/protocols/spot", "verity/commitments/randomness", "verity/commitments/randomness/tests",
    # the Lean decoder's width refusals against the codec, on the NCI difftest's mistyped descriptors
    "verity/protocols/inference_only/verifier/nci/lean/scripts",
    # test_coin_schedule.py holds the prover's coin schedule to the Lean verifier's, and test_rec_live.py the inner coin
    # tree to RecVStar's
    "verity/protocols/flock/verifier/Flock/Zk.lean", "verity/protocols/flock/verifier/Flock/RecVStar.lean",
    # test_lean_rec_cap_guards.py builds Flock.Test.RecCap, which the Lean check no longer does; its imports reach it through
    # the flock-verify artifact
    "verity/protocols/flock/verifier/Flock/Test/RecCap.lean",
    # `flock-firewall live` starts from this directory, where the guard reads its argument `live` as the crate's directory
    "verity/protocols/flock/prover/live/PROTOCOL.md",
    # test_honest_reqs.py's difftest: the harness, and the package `lake` builds its port in under the harness's build
    # lock, the release side's (its Flock.Firewall.Honest is C-Flock's, which the flock-firewall artifact keys)
    "verity/difftest/python/verity_difftest", "verity/difftest/lean", "verity/protocols/recursion/verifier/firewall",
          "verity/__init__.py", "verity/commitments/__init__.py", "verity/hardware/__init__.py", "verity/protocols/__init__.py"]
parallel = true
# an xdist worker peaked at 15.6 GB (38 of them OOM'd a 600 GiB check); `--mem-gb` divides by this
worker_gb = 16
# 9,765 s on one worker beside a loaded check, past suites.py's SUITE_TIMEOUT_S
timeout_s = 14400
# Build outputs the Lean tests run or skip on (`check` runs this suite after its Lean steps have built them).
artifacts = ["verity/protocols/flock/verifier/.lake/build/bin/flock-verify",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-firewall",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-frame-tape",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-rec-sparse",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-witness",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-rec-opening",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-rec-links",
             "security/.lake/packages/mathlib/.lake/build"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_backend.py"]
paths = ["verity/protocols/flock/prover/python/verity_flock"]

[[tool.verity.tests.reads]]
tests = ["tests/test_backend_bench.py"]
paths = ["benchmarks/numerical/python/verity_numerical/bench", "verity/protocols/flock/prover/python/verity_flock"]

[[tool.verity.tests.reads]]
tests = ["tests/test_challenger_audit.py"]
# `lake build sampled-proofs-difftest`: its package and those it requires by path
paths = [
    "verity/circuits/base",
    "verity/circuits/lean",
    "verity/commitments/lean",
    "verity/commitments/lms/lean",
    "verity/protocols/interface",
    "verity/protocols/flock/verifier",
    "verity/protocols/spot/verifier/lean",
]

[[tool.verity.tests.reads]]
tests = ["tests/test_stream_zk_server.py"]
# the challenger each verifier is on (`pod/challenger.sh` starts it), and `lake build` of its Lean and its audit's and
# of the Lean verifier's two executables: their packages and those they require by path
paths = [
    "verity/circuits/base",
    "verity/circuits/lean",
    "verity/commitments/lean",
    "verity/commitments/lms/lean",
    "verity/composite/device/live_challenger",
    "verity/protocols/interface",
    "verity/protocols/flock/verifier",
    "verity/protocols/spot/verifier/lean",
]

[[tool.verity.tests.reads]]
tests = [
    "tests/test_circuit.py",
    "tests/test_inner_registered.py",
    "tests/test_ir_lowering.py",
    "tests/test_ir_sampling.py",
    "tests/test_lean_registered_bit_rows.py",
    "tests/test_stage_typed.py",
    "tests/test_typed_statement.py",
]
paths = ["verity/protocols/flock/prover/python/verity_flock/templates"]

[[tool.verity.tests.reads]]
tests = ["tests/test_class_statement.py"]
paths = [
    "benchmarks/numerical/python/verity_numerical/bench",
    "adapters/vllm/verity_vllm",
    "tools/verity/circuit_check/src/circuit_check",
    "verity",
