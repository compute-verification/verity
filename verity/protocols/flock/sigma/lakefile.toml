# The σ-lift check's difftest port: `Flock.Sigma.check` (in C-Flock's verifier's package) held to
# `verity.definitions.boolean.sigma_check`, the Python that mirrors it.
name = "core_sigma"
defaultTargets = ["sigma-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../verifier"

[[require]]
name = "verity_difftest"
path = "../../../../tools/difftest/lean"

[[lean_exe]]
name = "sigma-difftest"
root = "SigmaDifftest"
