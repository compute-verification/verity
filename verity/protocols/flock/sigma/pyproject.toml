# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the reference is the Python mirror, `verity.definitions.boolean.sigma_check`, over the Definitions'
# composites and registry and the descriptors `verity.circuits` encodes and decodes (with what those import of core:
# the PoUW circuit's Boolean profile through the registry); `lake` builds this package against Flock's verifier and
# the difftest harness, both required by path, and `flock-verify sigma-check` is Flock's verifier.
inputs = ["verity/definitions", "adapters/vllm/verity_vllm", "verity/circuits", "verity/definitions/kernels",
          "verity/commitments/randomness",
          "verity/__init__.py", "verity/settings.py", "verity/errors.py", "verity/ml/__init__.py", "verity/core/__init__.py",
          "verity/core/protocols/__init__.py", "verity/protocols/pouw/verifier/__init__.py", "verity/protocols/pouw/verifier/protocol.py",
          "verity/protocols/pouw/verifier/live_reads.py", "verity/ml/protocols/__init__.py", "verity/protocols/pouw/prover/__init__.py",
          "verity/protocols/pouw/prover/circuit", "verity/protocols/pouw/prover/schemes", "verity/protocols/flock/verifier",
          "verity/difftest"]
# Build outputs the tests run (`check` runs this suite after its Lean steps): the difftest server, and the verifier's command.
artifacts = ["verity/protocols/flock/sigma/.lake/build/bin/sigma-difftest",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-verify"]
