# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: the reference is the Python mirror, `verity.definitions.boolean.sigma_check`, over the Definitions'
# composites and registry and the descriptors `verity.circuits` encodes and decodes (with what those import of core:
# the PoUW circuit's Boolean profile through the registry; and of the commitments: a registered Definition that hashes
# builds on their SHA-512 gates, whose package loads their hash code); `lake` builds this package against Flock's verifier
# and the difftest harness, both required by path, and `flock-verify sigma-check` is Flock's verifier.
inputs = ["verity/definitions", "adapters/vllm/verity_vllm", "verity/circuits", "verity/definitions/kernels",
          "verity/commitments/randomness", "verity/commitments", "verity/commitments/crypto", "verity/__init__.py",
          "verity/settings.py", "verity/errors.py", "verity/protocols/pouw/verifier/__init__.py",
          "verity/protocols/pouw/verifier/protocol.py", "verity/protocols/pouw/verifier/live_reads.py",
          "verity/protocols/pouw/prover/__init__.py",
          "verity/protocols/pouw/prover/circuit", "verity/protocols/pouw/prover/schemes", "verity/protocols/flock/verifier",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean", "verity/difftest",
          "verity/commitments/__init__.py", "verity/protocols/__init__.py", "verity/protocols/pouw/__init__.py"]
# Build outputs the tests run (`check` runs this suite after its Lean steps): the difftest server, and the verifier's command.
artifacts = ["verity/protocols/flock/sigma/.lake/build/bin/sigma-difftest",
             "verity/protocols/flock/verifier/.lake/build/bin/flock-verify"]
