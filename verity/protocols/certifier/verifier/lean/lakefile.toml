name = "network_check"
defaultTargets = ["NetworkCheck", "network-check-difftest", "network-check", "network-records", "network-period"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../../flock/verifier"

# The period's check reads a scan's layout off its description as NCI's check does (`NciCheck.Desc`'s layout checks).
[[require]]
name = "nci_check"
path = "../../../inference_only/verifier/nci/lean"

# The check is a core protocol, reads the Program's grid from the certifier program (`expectedRow`, Σ_sync) and verifies
# certificates with the LMS port.
[[require]]
name = "core_protocol"
path = "../../../interface"

[[require]]
name = "certifier_program"
path = "../../device/program/lean"

# The period's check holds each answer's bound to one-stage's own bound of the registration's sample (`Spot.Bound`,
# `Spot.Record.profileDraw`): the sampled-proofs verifier's definition, and no second one here.
[[require]]
name = "core_spot"
path = "../../../spot/verifier/lean"

[[require]]
name = "lms"
path = "../../../../commitments/lms/lean"

# `tagged_sha512` is core's identity hash.
[[require]]
name = "core_identity"
path = "../../../../commitments/identity"

[[lean_lib]]
name = "NetworkCheck"

[[lean_exe]]
name = "network-check-difftest"
root = "NetworkCheck.DifftestMain"

[[lean_exe]]
name = "network-check"
root = "NetworkCheck.Main"

[[lean_exe]]
name = "network-records"
root = "NetworkCheck.RecordsMain"

[[lean_exe]]
name = "network-period"
root = "NetworkCheck.PeriodMain"
