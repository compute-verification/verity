# Sampled proofs' recursive audit as a `Core.BlobProtocol` (`verity/sampled-proofs/recursive/v1`, `VStar.Recursive`): one-stage
# v1's live audit with its verdict of record V*'s compiled check (`flock-verify verify --zk` once per V* part, at that part's
# recursive inputs) on the blobs; and sampled proofs (`verity/sampled-proofs/v1`), whichever of one-stage v2 and the
# recursive audit the auditor's params name, one-stage v1 refused. `vstar-recursive` is its command (`id | check | serve |
# verdicts`, and sampled proofs' as `vstar-recursive sampled id | check | serve`). Code, not analysis: Lean core, C-Flock,
# the interface and the one-stage audit.
name = "core_vstar_recursive"
defaultTargets = ["VStarRecursive", "vstar-recursive"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_protocol"
path = "../../../../interface"

[[require]]
name = "flock_verifier"
path = "../../../flock/verifier"

[[require]]
name = "core_spot"
path = "../../../spot/verifier/lean"

[[lean_lib]]
name = "VStarRecursive"

[[lean_exe]]
name = "vstar-recursive"
root = "VStarRecursiveMain"

# The two-stage form (`VStar.Recursive.SampledTwo`, `id | check | serve`), which nothing dispatches to: its difftest drives it.
[[lean_exe]]
name = "sampled-two"
root = "SampledTwoMain"

# A test's executable: the two-stage form's check with its switch on (`SampledTwoOnMain`), which the form's accept test
# drives on one honest play. No party runs it.
[[lean_exe]]
name = "sampled-two-on"
root = "SampledTwoOnMain"

# A test's executable: the two-stage form's descriptor check (`SampledTwoDescMain`) on one play, and on the play with
# two templates of one name, which it must refuse. No party runs it; nothing in the form calls the check yet.
[[lean_exe]]
name = "sampled-two-desc"
root = "SampledTwoDescMain"
