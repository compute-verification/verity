# Sampled proofs' one-stage audit as a `Core.Protocol` (`verity/sampled-proofs/one-stage/v1`): the registration record and
# its R1–R7 (v1 and v2 records), the partition, the draw's checks, the verdict, the integrity profile and the whole audit
# record: the audit's definition, which `verity/protocols/proofs/spot/verifier/one_stage` mirrors and its difftest holds to
# it. `sampled-proofs-verifier` is the verifier of record the Python calls (`one_stage.verifier`). Code, not analysis: Lean
# core, C-Flock and the interface.
name = "core_spot"
defaultTargets = ["Spot", "sampled-proofs-one-stage", "sampled-proofs-one-stage-zk", "spot-monitoring-period",
  "sampled-proofs-difftest", "sampled-proofs-verifier", "sampled-proofs-wired-key-dev",
  "sampled-proofs-plancheck"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "core_protocol"
path = "../../../../interface"

[[require]]
name = "flock_verifier"
path = "../../../flock/verifier"

# The proof system's challenger signs its record with LMS (`Spot.ChallengerRecord`).
[[require]]
name = "lms"
path = "../../../../../commitments/lms/lean"

[[require]]
name = "verity_difftest"
path = "../../../../../circuits/difftest"

[[lean_lib]]
name = "Spot"

[[lean_exe]]
name = "sampled-proofs-one-stage"
root = "Spot.Main"

[[lean_exe]]
name = "sampled-proofs-one-stage-zk"
root = "Spot.ZkMain"

# SPOT's period (`verity/sampled-proofs/period/v1`, `Spot.MonitoringPeriod.protocol`): every window of a lane's
# monitoring period held to one accepting one-stage audit on its proofs.
[[lean_exe]]
name = "spot-monitoring-period"
root = "Spot.MonitoringPeriodMain"

[[lean_exe]]
name = "sampled-proofs-difftest"
root = "Spot.DifftestMain"

[[lean_exe]]
name = "sampled-proofs-verifier"
root = "Spot.VerifierMain"

# Development plays only, never an accept of record: round 2 with the wired key's switch on, which the build of
# record holds off (`Spot.SecondStage.WIRED_KEY`). Only its difftest runs it; no audit, script or benchmark does.
[[lean_exe]]
name = "sampled-proofs-wired-key-dev"
root = "Spot.WiredKeyDevMain"

# The planner's designs checked in exact arithmetic (`Spot.PlanCheck`), which
# `verity/protocols/proofs/spot/plancheck.py` calls.
[[lean_exe]]
name = "sampled-proofs-plancheck"
root = "Spot.PlanCheckMain"
