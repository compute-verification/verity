# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_challenger_session.py",
    "tests/test_challenger_session_reserve.py",
]
artifacts = [
    "verity/protocols/proofs/flock/verifier/.lake/build/bin/verity-verify-proof",
    "verity/protocols/proofs/flock/verifier/.lake/build/bin/flock-firewall",
]
# The scripts under `benchmarks/` the moved audit commands still load off `sys.path`, and what their `benchmarks/` suites read
inputs = [
    "verity",
    "benchmarks/one_stage",
    "benchmarks/prove_path",
    "benchmarks/sampling_plan",
    "benchmarks/network_traces",
    "tools/config/verity_config",
    "verity/protocols/accounting/pouw/prover/clear",
    "verity/protocols/accounting/pouw/prover/kernels/pearl_c",
    "benchmarks/pouw/pearl_c_sm120",
    "benchmarks/pouw/pearl_c_sm90",
    "benchmarks/pouw/pearl_c_vllm",
    "benchmarks/pouw/tests/test_pearl_c_vllm.py",
    "benchmarks/pouw/tests/test_pearl_c_hash_decode.py",
    "benchmarks/pouw/tests/test_pearl_c_sm90_prefill.py",
    "benchmarks/pouw/run_result.py",
    "benchmarks/pouw/settings.py",
    "hardware/cards",
    "verity/protocols/proofs/spot/verifier/lean/lakefile.toml",
    "verity/protocols/compose/device/live_challenger",
    "tools/difftest/python/verity_difftest",
    "benchmarks/spot_proved/stage.py",
    "benchmarks/served_units/stage.py",
    "tools/verity/circuit_check/src/circuit_check/__init__.py",
