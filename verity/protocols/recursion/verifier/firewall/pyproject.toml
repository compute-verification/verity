[project]
name = "verity-core-firewall"
version = "0.1.0"
description = "Tests only: the firewall's release side in Lean (core_firewall) against Python's verity_flock.firewall and the frozen cases of the Rust reference it replaced."
requires-python = ">=3.12"
dependencies = ["verity-flock", "verity-difftest", "hypothesis>=6.100"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = [
    "tests/test_firewall_release_agreement.py",
    "tests/test_firewall_release_protocol.py",
    "tests/test_firewall_session_loop.py",
]
# `lake` builds this package and, through its path requires, Flock's verifier (`Flock.Firewall.Contract` and what it
# imports; its `flock-firewall contract` decides the references' transcripts) and the core protocol interface.
inputs = ["verity/protocols/flock/verifier", "verity/protocols/interface"]
