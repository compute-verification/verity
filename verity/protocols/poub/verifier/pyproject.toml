# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity`: the audit's codec, receipts and record, on the commitments, the randomness and the
# profile; its coins on the one challenger, local and as a service.
inputs = ["verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/hardware/record.py",
          "verity/protocols/spot/verifier/profile.py", "verity/protocols/reporting.py",
          "verity/protocols/spot/verifier/__init__.py",
          "verity/claims/__init__.py",
          "verity/protocols/spot/device/challenger.py", "verity/protocols/spot/device/remote.py",
          # one_stage's registration, which core_check imports, and its draw and verdict
          "verity/protocols/spot/verifier/one_stage/__init__.py",
          "verity/protocols/spot/verifier/one_stage/draw.py",
          "verity/protocols/spot/verifier/one_stage/registration.py",
          "verity/protocols/spot/verifier/one_stage/verdict.py",
          "verity/ml/__init__.py", "verity/circuits", "verity/commitments",
          "verity/commitments/crypto", "verity/commitments/randomness",
          # PoUS's setup, P2 and vk, which a P2 store is under (`p2.py`)
          "verity/protocols/pous",
          "verity/ml/protocols/__init__.py", "verity/protocols/pous/prover",
          # the deployment layer and its wire, which the session's parties run on (`session_parties.py`)
          "verity/configuration/wire", "verity/configuration/deploy",
          # the circuit model's codec rows and the primitives' range rows, which test_encode_chain.py and
          # test_gate_ranges.py recompute from codec.encode_word, the f32 evaluators and property/v1's rules, and
          # Exp2Lut127's table, which test_gate_ranges.py holds to vLLM's (fixtures/exp2_lut127.json)
          "security/Proofs/Accounting/Gates.lean", "security/Definitions/Accounting/Gates/Ranges.lean",
          # main's first-parent history, spot' fixture, which test_remote_coins.py holds a session's pin to
          "verity/protocols/spot/verifier/tests/fixtures/main-first-parent.txt",
          # core's model pin, whose every role's checkpoint_sha512 test_store.py recomputes with the store's own
          # canonical JSON, held to the circuits codec's
          "verity/protocols/pouw/verifier/lean/check/models.json",
          # the claims registry, which test_ledger.py holds the memory line's named PRF claim to
          "verity/claims/__init__.py",
          # PoUW's core answer form and what it imports, which test_p2_party.py holds a session's answer to
          "verity/protocols/pouw/verifier/__init__.py", "verity/protocols/pouw/verifier/audit.py",
          "verity/protocols/pouw/verifier/coins.py", "verity/protocols/pouw/verifier/core_check.py",
          "verity/protocols/pouw/verifier/protocol.py", "verity/protocols/pouw/verifier/salt.py",
          "verity/protocols/pouw/verifier/window.py", "verity/protocols/spot/verifier/one_stage/__init__.py",
          "verity/protocols/spot/verifier/one_stage/partition.py",
          "verity/protocols/spot/verifier/one_stage/registered.py",
          "verity/configuration/__init__.py", "verity/definitions/__init__.py", "verity/definitions/circuits", "verity/definitions/ops", "verity/definitions/silicon", "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/poub/__init__.py", "verity/protocols/pouw/__init__.py", "verity/protocols/spot/__init__.py", "verity/protocols/spot/device/__init__.py"]
