# PoUB's verifier on its auditor host: `host.py`, the gate every key of the host's research is
# forced to, and the run, replay and store put its units run as `auditor` (pods/nebius/verifier/). Not a package: the suite runs the
# gate in this process with its root steps (chown, systemctl) injected and holds its whitelist to verifier.py's own parser
# (`tests/gate_harness.py`, which the remote session's run through the gate, `benchmarks/remote_session/tests/`, shares).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_host.py"]
inputs = ["verity/__init__.py", "verity/errors.py", 
          "verity/hardware/record.py",
          "verity/protocols/spot/verifier/profile.py", "verity/protocols/poub/verifier", 
          "verity/circuits", "verity/commitments/crypto", "verity/commitments", "verity/commitments/randomness",
          # the difftest the replay module imports
          "verity/difftest/python",
          # challengers.py's gate client, which verifier.py builds for --challenger gate
          "verity/claims/__init__.py", "verity/protocols/spot",
          # the host's deployed files (the configuration the gate reads, the tunnel's ports), and the store's client its
          # publish imports from the pinned tree
          "tools/research/src/research",
          "verity/hardware/__init__.py", "verity/protocols/__init__.py", "verity/protocols/poub/__init__.py",
          "verity/protocols/poub/device/__init__.py",
          "verity/composite/__init__.py", "verity/composite/device/__init__.py", "verity/composite/device/live_challenger/__init__.py"]
