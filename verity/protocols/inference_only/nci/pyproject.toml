[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_statement.py"]
# The calculator's lower bound cites guarantees by name; the tests check that the lock lists them. ReferenceLayered's
# falsification test (test_tiers.py) checks the parameters its Lean statements state against tiers.py's, with the
# Dot width read from the BF16 GEMM's step (gemm.py's GEMM_HOPPER).
inputs = [
  # the output bits an incorrect proof block injects are the widest public size class of a block's outputs (tiers.py
  # reads verity.circuits.partition_v2, which imports its package)
  "verity/__init__.py",
  "verity/circuits",
  "security/lean-audit.json",
  "security/Definitions/Nci/Assumptions/Layered.lean",
  "security/Definitions/Nci/Guarantees/Layered.lean",
  "verity/definitions/ops/boolean/gemm.py",
  # tiers.CARD pins the ACCEL model's sm_120 card table, and CREDITED_CLOCK_HZ PoUW's H1 record (test_tiers.py)
  "security/Definitions/Core/Accel/Sm120.lean",
  "verity/protocols/pouw/prover/circuit/h1device.py",
  # the slowdown D is the slowdown calculator's (statement.py, fit.py, imported by path)
  "verity/protocols/inference_only/rho/rho/__init__.py",
  "verity/protocols/inference_only/rho/rho/theorem.py",
  # a model's shape is the slowdown calculator's (kappa.py reads its models, imported by path), whose registry reads
  # core's monitoring periods and per-window delta
  "verity/protocols/inference_only/rho/rho/instances.py",
  "verity/protocols/inference_only/rho/rho/params.py",
  "verity/protocols/inference_only/rho/data",
  "verity/__init__.py",
  "verity/errors.py",
  "verity/protocols/reporting.py",
  "verity/protocols/spot/verifier/profile.py",
          "verity/definitions/__init__.py", "verity/protocols/__init__.py", "verity/definitions/ops/__init__.py", "verity/protocols/inference_only/__init__.py", "verity/protocols/pouw/__init__.py", "verity/protocols/spot/__init__.py", "verity/definitions/ops/boolean/__init__.py", "verity/protocols/inference_only/rho/__init__.py", "verity/protocols/pouw/prover/__init__.py", "verity/protocols/spot/verifier/__init__.py", "verity/protocols/pouw/prover/circuit/__init__.py"]
