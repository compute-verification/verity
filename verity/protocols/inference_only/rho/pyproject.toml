[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Every estimate's status is read from the locks (rho/lean.py), and the tests check each cited Lean name is in one.
# tests/test_envelopes.py holds the remote regime to tiers.py's terms at its DEFAULTS (imported by path), and
# tests/test_hardware.py holds the locations to the census's devices and the world fleets to its adversary.
# test_classes and test_attacks cross-check the threaded class and the shard attack against verity/protocols/inference_only/nci's
# implementations, imported by path (slowdown.py imports catalog.py). families.Nci reads the `verity/protocols/inference_only/nci` library's algorithms
# and their traits. test_envelopes pins theorem.multiple_bound to the Lean text of the remote slowdown's definition
# and guarantee, and test_min_cut pins rho/min_cut.py to the min-cut bound's (alphaHE, shareF, and HE's and
# HEShared's conclusions).
# The monitoring periods are core's reporting grid's (rho/params.py), stdlib only. The output bits an incorrect proof
# block injects are the widest public size class of a block's outputs (rho/params.py and tiers.py read
# verity.circuits.partition_v2, which imports its package). The registry also reads core's per-window delta
# (profile.py, which imports verity.circuits) and the inference-only policy's calibrations (rho/params.py). It reads
# no census: data/ states the reference datacenter's machines and the world's active parameters, and
# tests/test_params.py and tests/test_hardware.py hold them to the census's deployments and adversary.
inputs = ["Security/lean-audit.json", "Security/Properties/lean-audit.json", "verity/protocols/inference_only/nci/tiers.py",
          "Security/Definitions/Nci/Remote.lean", "Security/Definitions/Nci/Guarantees/Remote.lean",
          "Security/Definitions/Nci/Cut.lean", "Security/Definitions/Nci/Guarantees/Cut.lean",
          "benchmarks/census/hardware.json", "benchmarks/census/adversary.json", "verity/protocols/inference_only/nci/slowdown.py",
          "verity/protocols/inference_only/nci/catalog.py", "verity/protocols/inference_only/nci/algorithms.json",
          "verity/__init__.py", "verity/errors.py", "verity/core/__init__.py", "verity/core/protocols/__init__.py",
          "verity/protocols/reporting.py", "verity/ml/__init__.py", "verity/circuits",
          "verity/protocols/spot/verifier/profile.py", "benchmarks/census/deployments.json", "verity/protocols/inference_only/nci/calibrations.json"]
