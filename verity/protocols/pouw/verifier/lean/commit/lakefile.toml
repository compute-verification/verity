# PoUW's commitments as executable Lean: the epoch coins' check, the protocol's bindings, the roots of its row and tile
# trees, and the salts and draw keys it derives (`verity.protocols.pouw.verifier`: `coins`, `protocol.tagged`, `audit`; the
# clear audit's draws, `verity/protocols/pouw/clear`), with the difftest against the Python. It is code, so it requires nothing
# of `security/`; it reads C-Flock's SHA-2 and hm96 leaves (`flock_verifier`), core's randomness (`core_randomness`) and core's tagged SHA-512
# identity (`core_identity`).
name = "pouw_commit"
defaultTargets = ["PouwCommit", "pouw-commit-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../../../flock/verifier"

[[require]]
name = "core_randomness"
path = "../../../../../commitments/randomness"

[[require]]
name = "core_identity"
path = "../../../../../commitments/identity"

[[lean_lib]]
name = "PouwCommit"

[[lean_exe]]
name = "pouw-commit-difftest"
root = "PouwCommit.DifftestMain"
