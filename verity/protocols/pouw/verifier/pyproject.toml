# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.verity.tests]
# test_lean_package.py reads the README's Lean names (the suite's own Markdown is outside its key).
# Test-only: PoUW's Lean FP8 vector generator (lean/scripts/fp8atom_vectors.py, which test_lean_package.py runs)
# reads the HOPPER wgmma model replays and the RTX 4090 captures. The schemes import the catalog, whose Definitions register
# their kernels (verity.definitions.kernels) lazily. The schemes' end-to-end tests and the epoch-coin vectors run the clear audit
# and the work law, a reference tool's.
inputs = ["verity", "security", "verity/protocols/pouw/verifier/README.md", "verity/definitions/silicon/captures/vectors/fp8-hopper-wgmma-k1536.json", "verity/definitions/silicon/captures/vectors/fp8-hopper-wgmma-k32.json",
          "verity/definitions/ops/tests/fixtures/golden/ada_e4m3_m16n8k32.json", "verity/circuits", "verity/definitions/kernels",
          "verity/protocols/pouw/clear"]
parallel = true
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_pouw_credit_statements.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

# What these test files read that their source doesn't name (a tree a test walks, a module it loads by a name it computes,
# what a program it starts reads): the graph's test-file tasks are keyed on it.

[[tool.verity.tests.reads]]
tests = ["tests/test_pouw_epoch_coins.py"]
paths = ["verity/protocols/pouw/verifier", "verity/protocols/spot"]
