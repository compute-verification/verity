name = "network_verifier"
defaultTargets = ["NetworkVerifier", "network-verifier-difftest", "network-verifier", "network-records", "network-period",
  "network-rows", "network-span"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../../../proofs/flock/verifier"

# The period's check reads a scan's layout off its description as the inference-only check does (`InferenceOnlyCheck.Desc`'s layout checks).
[[require]]
name = "inference_only_verifier"
path = "../../../../workload_classification/training_detection/inference_only/verifier/lean"

# The check is a core protocol, reads the Program's grid from the attester program (`expectedRow`, Σ_sync) and verifies
# certificates with the LMS port.
[[require]]
name = "core_protocol"
path = "../../../../interface"

[[require]]
name = "certifier_program"
path = "../../attester/program/lean"

[[require]]
name = "lms"
path = "../../../../../commitments/lms/lean"

# `tagged_sha512` is core's identity hash.
[[require]]
name = "core_identity"
path = "../../../../../commitments/identity"

[[lean_lib]]
name = "NetworkVerifier"

[[lean_exe]]
name = "network-verifier-difftest"
root = "NetworkVerifier.DifftestMain"

[[lean_exe]]
name = "network-verifier"
root = "NetworkVerifier.Main"

[[lean_exe]]
name = "network-records"
root = "NetworkVerifier.RecordsMain"

[[lean_exe]]
name = "network-period"
root = "NetworkVerifier.PeriodMain"

[[lean_exe]]
name = "network-rows"
root = "NetworkVerifier.RowsMain"

[[lean_exe]]
name = "network-span"
root = "NetworkVerifier.SpanMain"
