# The network attester's program: the executable forms of the attester's definitions that the difftest runs, and the
# difftests against the Python audit and against advice v1's charge references (`arith_encode.reference_charge`, and
# `window_charge.reference_window` for the whole window). It imports only Lean. What it computes is `security`'s
# trusted text (`Definitions/Certifier/`), and `security_proofs` (`Proofs/Certifier/Code.lean`) proves the
# two agree.
name = "certifier_program"
defaultTargets = ["NetworkAttester", "certifier-difftest", "certifier-charge-difftest", "certifier-window-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[lean_lib]]
name = "NetworkAttester"

[[lean_exe]]
name = "certifier-difftest"
root = "NetworkAttester.DifftestMain"

[[lean_exe]]
name = "certifier-charge-difftest"
root = "NetworkAttester.ChargeDifftestMain"

[[lean_exe]]
name = "certifier-window-difftest"
root = "NetworkAttester.WindowDifftestMain"
