# A suite of `verity`'s tests: they run in the workspace's environment, against the editable `verity`.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_pous_wipe_store.py", "tests/test_pous_wipe_stream.py"]
# What the tests import of `verity`, and PoUS's statements in Security with the lock and the pins they check them against,
# and the rest of the trusted layer's import closure that ../../../../../../tools/pous_grader/TRUSTED.sha256 hashes (Core's Game, the named assumption
# TimedINC): test_pous_trusted fails while a file it hashes is outside these, naming the lines to add.
inputs = ["verity/__init__.py", "verity/errors.py",
          "verity/circuits",
          "verity/protocols/resource_accounting/memory/pous/prover",
          "verity/commitments", "verity/commitments/crypto", "verity/commitments/randomness", "verity/channel.py", "verity/runtime", "tests/verity/tests/test_channel.py", "verity/config.py", "verity/party.py", "verity/protocol.py",
          "verity/protocols/resource_accounting/memory/pous/attester/__init__.py",
          "verity/protocols/resource_accounting/memory/pous/attester/challenger_party.py",
          "verity/protocols/resource_accounting/memory/pous/attester/wipe_challenger.py",
          "security/Definitions/Pous.lean", "security/Definitions/Pous", "security/Proofs/Pous",
          "security/Definitions/Core/Game.lean", "security/Definitions/Assumptions/Pous.lean",
          "security/Proofs/Core/Game/Basic.lean",
          "security/lean-audit.json", "security/lakefile.toml", "security/lake-manifest.json", "security/lean-toolchain",
          "security/Proofs/lakefile.toml", "security/Proofs/lake-manifest.json",
          "tools/pous_grader/README.md",
          # the grader's package and the memory challenger's modules, each by its own path: the tests read them wherever
          # they are, in this suite's directory or outside it
          "tools/pous_grader", "verity/protocols/resource_accounting/memory/pous/attester/memory_challenger.py",
          "verity/protocols/resource_accounting/memory/pous/attester/challenger_session.py",
          "verity/protocols/resource_accounting/memory/pous/attester/continuous.py",
          "verity/protocols/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/memory/__init__.py",
          "verity/protocols/resource_accounting/memory/pous/__init__.py",
          # the memory challenger's key as a deployment starts it, and the wipe's native streamer, which the conftest
          # and the wipe's store tests build and run
          "verity/protocols/resource_accounting/memory/pous/attester/onsite.py",
          "verity/protocols/resource_accounting/memory/pous/attester/wipe_stream.py",
          "verity/protocols/resource_accounting/memory/pous/attester/wipe_stream.c",
          # SPOT's registered reads, which PoUS's served weights (`pous.prover.served_weights`) name
          "verity/protocols/proofs/__init__.py", "verity/protocols/proofs/spot/__init__.py",
          "verity/protocols/proofs/spot/verifier/__init__.py",
          "verity/protocols/proofs/spot/verifier/one_stage/__init__.py",
          "verity/protocols/proofs/spot/verifier/one_stage/partition.py",
          "verity/protocols/proofs/spot/verifier/one_stage/registered.py"]
