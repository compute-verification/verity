# The PoUS check as a program: what the verifier checks at setup and in the timed audit, and a run composed of the setup
# and a memory challenger's session (`PousCheck.Run`), in executable Lean, reading the formats the Python reference
# writes. It imports Lean core, Flock's executable primitives, the core protocol interface, the core primitives (the
# identity hash, randomness's derivation and exact samplers) and the memory challenger's verdict only. Its properties are stated in
# `security/Properties/Pous.lean`; it moves into `verity/protocols/resource_accounting/memory/pous` once they are proved.
name = "pous_verifier"
defaultTargets = ["PousVerifier", "pous-setup", "pous-setup-difftest", "pous-audit-difftest", "pous-timed-audit", "pous-run",
  "pous-run-protocol", "pous-signed-run", "pous-verdict-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../../../../proofs/flock/verifier"

[[require]]
name = "core_protocol"
path = "../../../../../interface"

[[require]]
name = "core_identity"
path = "../../../../../../commitments/identity"

[[require]]
name = "core_randomness"
path = "../../../../../../commitments/randomness"

[[require]]
name = "verity_difftest"
path = "../../../../../../circuits/difftest"

[[require]]
name = "core_memory_attester"
path = "../../attester/lean"

[[lean_lib]]
name = "PousVerifier"

[[lean_exe]]
name = "pous-setup"
root = "PousVerifier.SetupProtocolMain"

[[lean_exe]]
name = "pous-setup-difftest"
root = "PousVerifier.SetupDifftestMain"

[[lean_exe]]
name = "pous-audit-difftest"
root = "PousVerifier.DifftestMain"

[[lean_exe]]
name = "pous-timed-audit"
root = "PousVerifier.TimedAuditMain"

[[lean_exe]]
name = "pous-run"
root = "PousVerifier.RunMain"

[[lean_exe]]
name = "pous-run-protocol"
root = "PousVerifier.RunProtocolMain"

[[lean_exe]]
name = "pous-signed-run"
root = "PousVerifier.SignedRunMain"

[[lean_exe]]
name = "pous-verdict-difftest"
root = "PousVerifier.VerdictDifftestMain"
