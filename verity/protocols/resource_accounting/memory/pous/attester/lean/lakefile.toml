# PoUS's memory challenger's verdicts as executable Lean: its record formats and crypto, `verdict` on a record as its
# caller holds it (`memory-challenger-verdict`) and as a core protocol (`memory-challenger`), and the streamed-label wipe's
# `verdict` on a record (`streamed-wipe-verdict`) and as a core protocol (`wipe-protocol`). Code: Lean core and the
# packages below, no Mathlib and nothing of Security.
name = "core_memory_attester"
defaultTargets = ["MemoryAttester", "memory-challenger", "memory-attester-test", "memory-attester-verdict",
                  "streamed-wipe-verdict", "wipe-protocol", "wipe-protocol-test", "wipe-count-test",
                  "memory-attester-difftest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "flock_verifier"
path = "../../../../../proofs/flock/verifier"

[[require]]
name = "core_randomness"
path = "../../../../../../commitments/randomness"

[[require]]
name = "lms"
path = "../../../../../../commitments/lms/lean"

[[require]]
name = "core_attest"
path = "../../../../../../commitments/attest/lean"

[[require]]
name = "core_protocol"
path = "../../../../../interface"

[[require]]
name = "verity_difftest"
path = "../../../../../../circuits/difftest"

[[lean_lib]]
name = "MemoryAttester"

# `verdict` under the accepted schemes (S1's LMS at its deployed parameters): the interface's command line.
[[lean_exe]]
name = "memory-challenger"
root = "MemoryAttester.Main"

# `verdict` under the test signers' schemes alone, with a protocol id of its own, for the difftest.
[[lean_exe]]
name = "memory-attester-test"
root = "MemoryAttester.TestMain"

# `verdict` on a record as `memory_challenger.verdict`'s caller holds it, the whole `Verdict` back (`verdict.py`).
[[lean_exe]]
name = "memory-attester-verdict"
root = "MemoryAttester.VerdictMain"

# `streamed_wipe.verdict` on a record as its caller holds it, the whole `Verdict` back (`wipe_verdict.py`).
[[lean_exe]]
name = "streamed-wipe-verdict"
root = "MemoryAttester.WipeVerdictMain"

# The streamed wipe's verdict as a core protocol, `verity/wipe/v0` under the accepted schemes: the interface's command
# line, onsite's wipe component.
[[lean_exe]]
name = "wipe-protocol"
root = "MemoryAttester.WipeProtocolMain"

# The same under the test signers' schemes alone, with a protocol id of its own, for the difftest.
[[lean_exe]]
name = "wipe-protocol-test"
root = "MemoryAttester.WipeProtocolTestMain"

# The wipe's component with its count held (`MemoryChallenger.WipeProtocol.countedTest`), under the test signers'
# schemes alone, for the difftest. No executable serves it under the accepted schemes.
[[lean_exe]]
name = "wipe-count-test"
root = "MemoryAttester.WipeCountTestMain"

[[lean_exe]]
name = "memory-attester-difftest"
root = "MemoryAttester.DifftestMain"
