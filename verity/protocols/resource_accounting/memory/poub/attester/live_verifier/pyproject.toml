# PoUB's verifier on its auditor device: `host.py`, the gate every key of the host's research is
# forced to, and the run, replay and store put its units run as `auditor` (pods/nebius/verifier/). Not a package: the suite runs the
# gate in this process with its root steps (chown, systemctl) injected, holds its whitelist to verifier.py's own parser, and runs a
# run through `tests/stub_verifier.py` (a real session over PoUB's in-process harness, `session_harness.run`, at the
# paths the gate's command line names), whose record `fetch` ships and `replay` replays through both verifiers.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# test files that start a program the read guard can't trace (git, lake, a compiler, a shell): keyed on the suite's whole tree
untraced = ["tests/test_host.py"]
inputs = ["verity/__init__.py", "verity/errors.py", 
          "verity/channel.py",
          "verity/protocols/proofs/spot/verifier/profile.py", "verity/protocols/resource_accounting/memory/poub/verifier", 
          "verity/circuits", "verity/commitments/crypto", "verity/commitments", "verity/commitments/randomness",
          # the Lean verifier a session runs beside audit.AuditRun, and the difftest a replay serves: their Lake
          # packages
          "verity/protocols/proofs/flock/verifier/Flock", "verity/protocols/proofs/flock/verifier/lakefile.toml",
          "verity/protocols/proofs/flock/verifier/lake-manifest.json", "verity/protocols/proofs/flock/verifier/lean-toolchain",
          "verity/circuits/base", "verity/circuits/lean", "verity/commitments/lean",
          "verity/commitments/randomness", "verity/circuits/difftest", "tools/difftest/python",
          # challengers.py's gate client, which verifier.py builds for --challenger gate
          "verity/protocols/proofs/spot",
          # verifier.py and its in-process harness, which the stub verifier runs
          "tests/verity/protocols/resource_accounting/memory/poub/__init__.py", "tests/verity/protocols/resource_accounting/memory/poub/session_harness.py",
          "verity/protocols/resource_accounting/memory/poub/prover/remote_session/prover.py", "verity/protocols/resource_accounting/memory/poub/prover/__init__.py",
          "verity/protocols/resource_accounting/memory/poub/prover/audit_prover.py", "verity/protocols/resource_accounting/memory/poub/prover/remote_session/device.py",
          # the challenger's tunnel client, whose forced pty the challenger's tunnel key allows
          "verity/protocols/compose/verifier/live_challenger/serve.py",
          # the store's reader its publish imports from the pinned tree
          "tools/research/src/research/__init__.py", "tools/research/src/research/secret_hint.py", "tools/research/src/research/store",
          "verity/protocols/__init__.py", "verity/protocols/proofs/__init__.py", "verity/protocols/resource_accounting/__init__.py", "verity/protocols/resource_accounting/memory/__init__.py", "verity/protocols/resource_accounting/memory/poub/__init__.py",
          "verity/protocols/resource_accounting/memory/poub/attester/__init__.py",
          "verity/protocols/compose/__init__.py", "verity/protocols/compose/verifier/__init__.py", "verity/protocols/compose/verifier/live_challenger/__init__.py",
          # the sender's witness rule, which the compose gate's own (host.py's `witness`) is held to, and the compose
          # script's settings rule, which `compose_settings` is
          "benchmarks/one_stage/served_verdicts.py", "benchmarks/one_stage/served_verdicts.sh"]
