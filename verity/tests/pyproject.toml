# The suite of verity/tests: invariants of the whole of `verity` (what it may import, a package in every directory). The root's
# pyproject.toml is the `verity` distribution; each directory under verity/ with tests is a suite of its own. This one lives in
# verity/tests, not verity/: a pyproject.toml at verity/ would stop uv's workspace discovery for a member nested under it
# (verity/ml/provers/flock).
[tool.pytest.ini_options]
testpaths = ["."]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity"]
parallel = true
