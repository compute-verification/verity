# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# The catalog's test loads every registry module, which reads `verity.ml` and, until the Definitions move here, the
# integration's package they live in.
inputs = ["verity", "integrations/vllm/verity_vllm"]
