# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
inputs = ["verity", "verity/ml/circuits", "verity/ml/commitments", "verity/ml/kernels"]
parallel = true
