# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests/test_leaves.py reads the typed-obligation fixtures through the frozen SP1 backend's statement codec (which
# raises vLLM's check codes), and the frame tests run experimental's multiproof.
inputs = ["verity", "verity/ml/circuits", "verity/ml/kernels", "verity/experimental", "archive/sp1/python/verity_sp1", "integrations/vllm/verity_vllm/__init__.py",
          "integrations/vllm/verity_vllm/check", "fixtures/typed-obligation-v0"]
parallel = true
