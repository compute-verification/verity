[project]
name = "verity-flock"
version = "0.1.0"
description = "Flock backend family: the committed GEMM-coordinate relation and its keyed-BLAKE3 row leaves in one binary-field proof (flock-pure), with the pinned unit lowering."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-numerical", "numpy", "blake3>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_flock"]

[tool.uv.sources]
verity = { workspace = true }
verity-vllm = { workspace = true }
verity-numerical = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only. Of Security, only what the tests and their Lean read: Lake and `lean` run outside the read guard, so
# tests/test_security_inputs.py holds this list to the import closure under Security of every module they build or import.
inputs = [
    # test_lean_verifier.py's `lake build Proofs.Flock.Verifier` and the scratch files importing it: the module's closure
    "Security/Proofs/Flock/Verifier.lean", "Security/Proofs/Flock/Verifier",
    # what Lake reads to load security_proofs, and security and security_properties, which it requires by path
    "Security/Proofs/lakefile.toml", "Security/Proofs/lake-manifest.json", "Security/Proofs/lean-toolchain",
    "verity/core/protocols/record.py",
    "Security/lakefile.toml", "Security/lake-manifest.json", "Security/lean-toolchain",
    "Security/Properties/lakefile.toml", "Security/Properties/lake-manifest.json", "Security/Properties/lean-toolchain",
    # test_lean_verifier.py and test_audit_profile.py read the audit layer's files and its lifted statements
    "Security/Proofs/Flock/Soundness/Audit", "Security/Definitions/Flock/Guarantees/Audit.lean",
    # test_randomness_spec.py hashes the spec fixtures/randomness_lean.json was generated from
    "Security/Proofs/Flock/Soundness/PlanDraw.lean",
    # tests import circuit-check's targets and read the census
    "tools/verity/circuit_check", "benchmarks/census",
    # the Lean verifier's stratified draw against the one-stage protocol's, and the Lean spec of verity.ml.randomness against
    # its pinned vectors
    "verity/core/protocols/sampled_proofs", "verity/core/primitives/randomness", "verity/ml/randomness/tests",
    # test_coin_schedule.py holds the prover's coin schedule to the Lean verifier's
    "verity/core/service/flock/Flock/Zk.lean",
    # test_lean_rec_cap_guards.py builds Flock.Test.RecCap, which the Lean check no longer does, and the RecCapSmall it imports;
    # their other imports reach it through the flock-verify artifact
    "verity/core/service/flock/Flock/Test/RecCap.lean", "verity/core/service/flock/Flock/Test/RecCapSmall.lean",
]
parallel = true
# an xdist worker peaked at 15.6 GB (38 of them OOM'd a 600 GiB check); `--mem-gb` divides by this
worker_gb = 16
# 9,765 s on one worker beside a loaded check, past suites.py's SUITE_TIMEOUT_S
timeout_s = 14400
# Build outputs the Lean tests run or skip on (`check` runs this suite after its Lean steps have built them).
artifacts = ["verity/core/service/flock/.lake/build/bin/flock-verify",
             "verity/core/service/flock/.lake/build/bin/flock-firewall",
             "verity/core/service/flock/.lake/build/bin/flock-rec-sparse",
             "verity/core/service/flock/.lake/build/bin/flock-witness",
             "verity/core/service/flock/.lake/build/bin/flock-rec-opening",
             "verity/core/service/flock/.lake/build/bin/flock-rec-links",
             "Security/.lake/packages/mathlib/.lake/build"]
