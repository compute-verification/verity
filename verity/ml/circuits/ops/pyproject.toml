# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
#: the integration too: ops imports its kernel twins and C++ models (`verity_vllm.program.kernels`) and one test loads its
#: applied split (`tools/migrate/superseded_quarantine.py`)
inputs = ["verity", "integrations/vllm"]
