# A suite of `verity`'s tests (the root's pyproject.toml is the distribution).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests register the catalog's Definitions before decoding, tests/evaluation self-checks every registered kernel
# against its Definition (the kernels and the silicon models they read), and tests/test_stacking holds property/v1's table to
# Lean's registry.
inputs = ["verity", "verity/ml/circuits", "verity/ml/kernels", "Security/Definitions/Accounting/Gates/Registry.lean"]
parallel = true
