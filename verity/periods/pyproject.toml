[project]
name = "verity-core-periods"
version = "0.0.0"
description = "The tests of verity.periods, and its difftest against the code's CoreProtocol.Period: the core difftest harness drives core-periods-difftest."
requires-python = ">=3.12"
dependencies = ["verity", "verity-difftest", "hypothesis>=6.100"]

# Not an installable package: a workspace member so that its tests run in the workspace environment.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# What the tests import of `verity` beside this unit, and what `lake` reads to build `core-periods-difftest`: the core
# interface's package, the difftest harness's Lean, and these files of Flock's verifier (`Flock.Canon` and what it
# imports, and the package's configuration).
inputs = ["verity/__init__.py", "verity/protocols/interface",
          "verity/difftest/lean", "verity/protocols/flock/verifier/lakefile.toml",
          "verity/protocols/flock/verifier/lake-manifest.json", "verity/protocols/flock/verifier/lean-toolchain",
          "verity/protocols/flock/verifier/Flock/Field.lean", "verity/protocols/flock/verifier/Flock/Bytes.lean",
          "verity/protocols/flock/verifier/Flock/Canon.lean"]
