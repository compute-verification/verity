[package]
name = "verity-ligero-verify"
version = "0.1.0"
edition = "2021"
description = "Independent verifier for Candidate B's B-Ligero chain proofs (backends/direct/ligero: BabyBear Ligero with statement-bound SHAKE-256 challenges, BLAKE3 Merkle, BLAKE2b statement digest / HM96 coin commitments). No torch, no shared code."

[dependencies]
# none (no registry access on the pods; every primitive is written from the protocol document)

[[bin]]
name = "ligero-verify"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
lto = "fat"
