[project]
name = "verity-flock"
version = "0.1.0"
description = "Flock backend family: the committed GEMM-coordinate relation and its keyed-BLAKE3 row leaves in one binary-field proof (flock-pure), with the pinned unit lowering."
requires-python = ">=3.12"
dependencies = ["verity", "verity-vllm", "verity-numerical", "numpy", "blake3>=1.0", "verity-catalog", "verity-experimental", "verity-kernels"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_flock"]

[tool.uv.sources]
verity = { workspace = true }
verity-vllm = { workspace = true }
verity-numerical = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# Test-only: tests import B-Ligero (through verity_numerical) and circuit-check's targets, read the census, and check the Lean
# verifier's stratified draw against the one-stage protocol's, and the Lean spec of verity.primitives.randomness against its pinned vectors.
inputs = ["archive/direct", "catalog/census", "verity/primitives/randomness/tests", "verity/protocols/verification/sampled_proofs", "tools/circuit_check"]
parallel = true
# Build outputs the Lean tests run or skip on (`check` runs this suite after its Lean steps have built them).
artifacts = ["backends/flock/verifier/lean/.lake/build/bin/flock-verify",
             "backends/flock/verifier/lean/level3/.lake/packages/mathlib/.lake/build"]
