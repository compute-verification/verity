name = "flock_verifier"
version = "0.1.0"
defaultTargets = ["flock-verify", "flock-rows", "FlockProofs"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Flock"

# Level-3 theorems about the executable's own definitions that need no library beyond Lean's core.
[[lean_lib]]
name = "FlockProofs"

[[lean_exe]]
name = "flock-verify"
root = "Main"

# The rows `Flock.Derive.derive` gives a circuit type, as flock-ir-unit/v2; the Python layout is held to it.
[[lean_exe]]
name = "flock-rows"
root = "FlockRows"
