name = "flock_verifier"
version = "0.1.0"
defaultTargets = ["flock-verify", "flock-rows", "FlockProofs", "flock-audit", "flock-audit-tape"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Flock"

# Level-3 theorems about the executable's own definitions that need no library beyond Lean's core.
[[lean_lib]]
name = "FlockProofs"

# The one-stage audit's auditor as a program that drives its run (Prog, its frames and workers), beside the verifier.
[[lean_lib]]
name = "FlockAudit"

[[lean_exe]]
name = "flock-verify"
root = "Main"

# The rows `Flock.Derive.derive` gives a circuit type, as flock-ir-unit/v2; the Python layout is held to it.
[[lean_exe]]
name = "flock-rows"
root = "FlockRows"

[[lean_exe]]
name = "flock-audit"
root = "AuditMain"

# A test harness: flock-audit with its coins from a tape.
[[lean_exe]]
name = "flock-audit-tape"
root = "AuditTape"
