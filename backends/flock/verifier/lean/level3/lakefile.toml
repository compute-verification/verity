name = "flock_level3"
defaultTargets = ["FlockLevel3"]

[leanOptions]
autoImplicit = false

# The Mathlib revision the flock-soundness package pins (through ArkLib), so both proofs packages see one Mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

# The executable verifier: the theorems here are about its definitions.
[[require]]
name = "flock_verifier"
path = ".."

[[lean_lib]]
name = "FlockLevel3"
