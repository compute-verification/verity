name = "FlockSoundness"
defaultTargets = ["FlockSoundness"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# ArkLib at a pinned commit; VCVio, CompPoly, PolyFun and Mathlib come in at the revisions
# ArkLib's own lake-manifest pins (recorded in this package's lake-manifest.json).
[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "b2e456fc48db5bff1b69c7469fde73f9b83e94c2"

# The executable's arithmetic and the verifier lane's proofs of `Arith.Correct` for it (`Instance.lean`);
# the same Mathlib pin, so one Mathlib serves both.
[[require]]
name = "flock_level3"
path = "../level3"

# Classic (non-module) files on purpose: `#print axioms` must see the proof bodies of every
# imported declaration, which a module importer does not load (ArkLib docs/wiki/module-system.md).
[[lean_lib]]
name = "FlockSoundness"
