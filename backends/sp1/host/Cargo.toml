[package]
name = "veritor-zk-host"
version.workspace = true
edition.workspace = true

[dependencies]
sp1-sdk = { version = "=6.4.0", features = ["profiling"] }
veritor-zk-common = { workspace = true }
serde = { workspace = true }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
# Buffered proof save/load; same bincode 1.x the SDK serialises with (Cargo.lock).
bincode = "1.3"

[build-dependencies]
sp1-build = "=6.4.0"

[features]
# GPU proving through the SDK's stock `sp1-gpu-server` (`SP1_PROVER=cuda`).
# Off by default so the laptop build pulls no CUDA dependencies.
cuda = ["sp1-sdk/cuda"]
# Groth16/PLONK wrapping with the in-process gnark FFI instead of Docker
# (needs Go and libclang on the build host).  These stages are what gives an
# SP1 proof its zero-knowledge property; core/compressed proofs are not ZK.
native-gnark = ["sp1-sdk/native-gnark"]
# DIAGNOSTIC builds (never sound, never a result): build.rs forwards these to
# the embedded guest, which then skips the authentication (or only the path
# folding) and commits an unmistakable verdict byte.  See backends/sp1/README.md.
unsound-skip-authentication = ["veritor-zk-common/unsound-skip-authentication"]
unsound-skip-path-fold = ["veritor-zk-common/unsound-skip-path-fold"]
# Relation-only guest: the `--witness` file is the compact input (K || x || W);
# the statement is ignored.  The arithmetic baseline; see the README.
unsound-relation-only = ["veritor-zk-common/unsound-relation-only"]
# The Table 2 bare statement: build.rs forwards this to the guest, whose ELF then proves `bare`'s statement; the
# `bare-*` subcommands build its input from a frozen tier, and `verify --statement` checks its public values.
relation-bare = ["veritor-zk-common/relation-bare"]
# Sound: build.rs forwards this to the guest so the sampling profiler can see
# the interpreter's dispatch / operand assembly / arithmetic separately.
attribution = ["veritor-zk-common/attribution"]
