[project]
name = "verity-sp1"
version = "0.1.0"
description = "SP1 backend driver: runs the veritor-zk-host binary over verity.proofs statements and accepts proofs against the approved guest identity."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_sp1"]

[tool.uv.sources]
verity = { workspace = true }
