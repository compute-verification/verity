[package]
name = "verity-tcdot-guest"
version.workspace = true
edition.workspace = true

[dependencies]
sp1-zkvm = "=6.4.0"
veritor-zk-common = { workspace = true, features = ["relation-bare"] }

[features]
# For the witness-operands fork (build_fork.sh OPERANDS=witness): TC_DOT_BF16 takes each step's operands from the input
# stream, so a bf16-ampere VU is its own buffers (see main.rs).  The host's feature of the same name selects it.
stream-operands = []
