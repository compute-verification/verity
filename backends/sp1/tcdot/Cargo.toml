# modified SP1 (TC_DOT chip): its own workspace, because every SP1 crate resolves to the fork.
#
# The fork is upstream succinctlabs/sp1 v6.4.0 (f66b4bff5) plus sp1-patches/0001-0004, checked out at ./sp1 by
# build_fork.sh (gitignored; pinned by FORK_HEAD).  The SP1 workspace wires its internal crates by path, so patching
# the entry points pulls the whole fork tree.
[workspace]
resolver = "2"
members = ["guest", "host"]
# The fork checkout is its own workspace; without this cargo resolves its crates' `workspace = true` fields here.
exclude = ["sp1"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
veritor-zk-common = { path = "../common" }
sha2 = "0.10.9"

[patch.crates-io]
sp1-sdk = { path = "sp1/crates/sdk" }
sp1-zkvm = { path = "sp1/crates/zkvm/entrypoint" }
sp1-build = { path = "sp1/crates/build" }
sp1-core-executor = { path = "sp1/crates/core/executor" }
# The SP1 SHA-256 precompile, as in ../Cargo.toml.
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
