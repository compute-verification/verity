[package]
name = "verity-tcdot-host"
version.workspace = true
edition.workspace = true

[dependencies]
sp1-sdk = "=6.4.0"
# The fork's reference kernel: the host routes each step by the chip's own operand-contract check.
sp1-core-executor = "=6.4.0"
veritor-zk-common = { workspace = true, features = ["relation-bare"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
bincode = "1.3"

[build-dependencies]
sp1-build = "=6.4.0"

[features]
# GPU proving through the fork's sp1-gpu-server (`SP1_PROVER=cuda`; the stock prebuilt server has no TcDotBf16 chip).
cuda = ["sp1-sdk/cuda"]
