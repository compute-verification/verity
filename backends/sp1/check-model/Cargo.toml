[package]
name = "veritor-check-model"
version = "0.1.0"
edition = "2021"
publish = false

# A dependency-free `no_std` crate, member of the zk/sp1 workspace, so
# Charon/Aeneas see only this code: the plan validator, the planned operand
# assembly and the int8-q7 interpreter of zk/sp1/common, restructured into the
# Aeneas-supported subset. The workspace pins `stable`; Charon compiles the
# crate itself, so translate with its nightly:
#   RUSTUP_TOOLCHAIN=nightly-2026-08-18 charon cargo --preset=aeneas
# The differential test against production lives in zk/sp1/common/tests/model.rs.

[dependencies]

[features]
# `Debug` derives for the tests in zk/sp1/common/tests/model.rs; off for the
# translation, so the generated Lean has no `core::fmt` axiom.
debug = []

[lib]
path = "src/lib.rs"
