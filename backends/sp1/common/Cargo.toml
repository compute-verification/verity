[package]
name = "veritor-zk-common"
version.workspace = true
edition.workspace = true

[dependencies]
sha2 = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = "1"
# The Aeneas-translatable restructuring of the validator and interpreter
# (zk/sp1/check-model), tested against this crate in tests/model.rs.
veritor-check-model = { path = "../check-model", features = ["debug"] }

[features]
# Nested cycle-tracker scopes inside the checker (the guest turns this on; it
# only adds a few constant prints per phase, never per obligation).
scopes = []
# Keep the interpreter's dispatch / operand-assembly / arithmetic / output
# comparison and the decoders out of line so the SP1 sampling profiler
# (TRACE_FILE=...) can attribute cycles to them.  Sound; a few cycles per call.
attribution = []
# Compile the injection point for an external plan validator
# (`kernel::verify_with_plan_validator`, used by the guest's `lean-plan`
# feature).  NEVER part of the production build: without this feature the
# kernel has no way to substitute any check.
lean-plan-bridge = []
# DIAGNOSTIC BUILDS -- NEVER SOUND, NEVER A RESULT.  Both make the checker
# accept openings it did not authenticate, so the achievable cycle floor of
# the authentication pass can be measured.  A build with either feature
# announces itself on stdout and commits a verdict byte (0xEE / 0xEF) that no
# sound verifier accepts; see `public_values` and zk/sp1/README.md.
#
# Skip the leaf hashing and the path folding entirely (values are still
# decoded, public inputs still compared, gates still recomputed).
unsound-skip-authentication = []
# Hash every leaf but skip only the path folding, to separate the two costs.
unsound-skip-path-fold = []
# Run ONLY the relation: no statement, no witness, no opening table, no leaf
# hashing.  The guest reads a compact input (K || x || W) and commits
# sha256(input) || sha256(output word) || 0xEE (`relation_only`).  The
# arithmetic baseline of the zkVM path; measures nothing about verification.
unsound-relation-only = []
# The Table 2 bare statement (`bare`, authentication excluded): its own guest ELF, which reads a batch of VUs'
# rows as private input and commits sha256(statement bytes) || verdict over the public output words.  Sound for
# that statement.  Only adds the module (declared last), so the checker's ELF is untouched.
relation-bare = []
# The committed statement (`committed`): the bare relation, and the guest hashes every x row and W column
# (`sha256/row/v1`, SP1's SHA-256 precompile) and commits the digests, which the verifier checks against frame-v3 roots.
relation-committed = ["relation-bare"]
# The same statement over vllm-v1 trees (`committed_vllm`): the guest hashes each row as a vllm-v1 position leaf.
relation-committed-vllm = ["relation-committed"]

# The native oracle of the per-format arithmetic (the modules it checks exist only with the bare statement).
[[example]]
name = "format_oracle"
required-features = ["relation-bare"]
