[package]
name = "veritor-zk-guest"
version.workspace = true
edition.workspace = true

[dependencies]
sp1-zkvm = "=6.4.0"
sha2 = { workspace = true }
veritor-zk-common = { workspace = true, features = ["scopes"] }

[features]
# Out-of-line interpreter helpers for the SP1 sampling profiler (sound).
attribution = ["veritor-zk-common/attribution"]
# Pass-throughs of the DIAGNOSTIC features of veritor-zk-common: a guest built
# with either is UNSOUND and announces itself (see src/main.rs, zk/sp1/README.md).
unsound-skip-authentication = ["veritor-zk-common/unsound-skip-authentication"]
unsound-skip-path-fold = ["veritor-zk-common/unsound-skip-path-fold"]
