[project]
name = "verity-numerical"
version = "0.1.0"
description = "Campaign-side numerical work shared by the proof backends: source-close and independent references for the frozen target, the reference checker, witness generators, range lemmas and adversarial search."
requires-python = ">=3.12"
dependencies = ["verity", "verity-census", "z3-solver>=4.13", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/verity_numerical"]

[tool.uv.sources]
verity = { workspace = true }
verity-census = { workspace = true }
