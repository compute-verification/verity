[package]
name = "verity-gkr"
version = "0.1.0"
edition = "2021"
description = "Candidate A: data-parallel GKR + logUp fractional-sumcheck lookups over Goldilocks for the WP2 transition-unit checker (ARITHMETIC_DIAGNOSTIC)"

[dependencies]
# none: Goldilocks + cubic extension, SHA-256 (Fiat-Shamir) and the circuit/witness parsers are in-tree so the
# build needs no registry access on the pod.

[profile.release]
opt-level = 3
debug = 1
