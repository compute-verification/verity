[package]
name = "verity-direct"
version = "0.1.0"
edition = "2021"
description = "Candidate B diagnostic: the WP2 transition-unit contracts as direct AIR constraints, proved with Plonky3 uni-stark over Goldilocks (NON_ZK_PROOF_DIAGNOSTIC)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "direct-unit"
path = "src/main.rs"

[dependencies]
p3-air = "=0.4.3-succinct"
p3-field = "=0.4.3-succinct"
p3-goldilocks = "=0.4.3-succinct"
p3-baby-bear = "=0.4.3-succinct"
p3-matrix = "=0.4.3-succinct"
p3-uni-stark = "=0.4.3-succinct"
p3-fri = "=0.4.3-succinct"
p3-dft = "=0.4.3-succinct"
p3-commit = "=0.4.3-succinct"
p3-merkle-tree = "=0.4.3-succinct"
p3-symmetric = "=0.4.3-succinct"
p3-keccak = "=0.4.3-succinct"
p3-challenger = "=0.4.3-succinct"
p3-util = "=0.4.3-succinct"
p3-maybe-rayon = { version = "=0.4.3-succinct", features = ["parallel"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
sha2 = "0.10"
# profiling only: `RUST_LOG=info direct-unit vu-bench ...` prints Plonky3's uni-stark spans with their durations
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
debug = false

# lane b-bind (2026-09-22): p3-fri 0.4.3-succinct with the openings absorbed before the batch challenge alpha
# (`vendor/p3-fri/src/two_adic_pcs.rs`, marked `verity patch`); TRANSCRIPT_CHECKLIST "openings before alpha",
# red team F19 residual.  The transcript differs from upstream 0.4.3.
[patch.crates-io]
p3-fri = { path = "vendor/p3-fri" }
