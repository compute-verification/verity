[project]
name = "verity-sp1"
version = "0.0.0"
description = "The SP1 construction's dependencies; its source ships with verity."
requires-python = ">=3.12"
dependencies = ["verity", "tomli-w"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
