[project]
name = "verity"
version = "0.0.0"
description = "Verity: its primitives, its protocols (verification, accounting, compliance, and the products that compose them) and the runner."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["verity-sp1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity"]
exclude = ["**/*.lean", "**/.lake", "**/pyproject.toml"]

[tool.uv.workspace]
members = ["verity/protocols/verification/proofs/sp1"]

[tool.uv.sources]
verity = { workspace = true }
verity-sp1 = { workspace = true }
