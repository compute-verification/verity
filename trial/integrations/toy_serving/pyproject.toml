[project]
name = "toy-serving"
version = "0.0.0"
description = "A toy serving engine that plays the developer, the way vLLM would."
requires-python = ">=3.12"
dependencies = ["verity"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toy_serving"]
