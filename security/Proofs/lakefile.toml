# The security analysis's proofs (untrusted): every proof of a guarantee `security` states, C-Flock's level3 and
# soundness among them. Its modules sit beside the spec's (`srcDir = ".."`) under a root of their own, `Proofs`.
name = "security_proofs"
srcDir = ".."
defaultTargets = ["Proofs"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
backward.proofsInPublic = true

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib"
rev = "b2e456fc48db5bff1b69c7469fde73f9b83e94c2"

[[require]]
name = "security"
path = ".."

[[require]]
name = "flock_verifier"
path = "../../verity/protocols/flock/verifier"

[[require]]
name = "certifier_program"
path = "../../verity/protocols/certifier/device/program/lean"

[[require]]
name = "core_randomness"
path = "../../verity/commitments/randomness"

# V*'s circuits as core code (`VStar`), which the bridge (`Proofs.Flock.VBridge.OfVStar`) is stated over
[[require]]
name = "core_vstar"
path = "../../verity/protocols/recursion/verifier/vstar_cli"

# Sampled proofs' recursive configuration (`VStar.Recursive`), whose acceptance `Proofs.Properties.Verity.Recursive` relates to
# `RecursiveKSAt`'s event
[[require]]
name = "core_vstar_recursive"
path = "../../verity/protocols/recursion/verifier/recursive"

# The properties a proof here proves (`Properties`), stated against the code where that proof needs this package.
[[require]]
name = "security_properties"
path = "../Properties"

