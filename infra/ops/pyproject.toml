[project]
name = "verity-ops"
version = "0.1.0"
description = "Operations on the shared machines: deploys to the Nebius nodes and keepers."
requires-python = ">=3.11"
dependencies = ["research"]

[project.scripts]
ops = "verity_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_ops"]

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# deploy installs research's pod tooling and reads its pods/nebius/deploy.toml, the environment files and units it names and the
# keeper; its test reads the Slack registry for owners. What verity_ops imports of research is research's `exports`, and the
# telemetry modules its run cancelling and classifying import, and research.flags (the old flag names deploy still reads). The agent
# watch's relay (infra/control) is tested here too, with research.slack.
inputs = ["tools/research/src/research/pods", ".agents/skills/using-slack/registry.json",
          "infra/control/agent_watch_relay.py", "infra/control/agent_watch_timers.json", "infra/control/agent_watch_nodes.json",
          "tools/research/src/research/slack.py", "tools/research/src/research/linear.py",
          "tools/research/src/research/notes_sync.py",
          "tools/research/src/research/telemetry/cancel.py", "tools/research/src/research/telemetry/classify.py",
          "tools/research/src/research/telemetry/scope.py",
          "tools/research/src/research/telemetry/procs.py", "tools/research/src/research/telemetry/pyspy.py",
          "tools/research/src/research/telemetry/run.py", "tools/research/src/research/flags.py",
          # the control pod's cloud watch, tested here: its code, its config and the boot script whose loops it watches
          "infra/control/cloud_watch.py", "infra/control/cloud_watch.toml", "infra/control/post_start.sh",
          # and the control disk relay's notes-sync rule
          "infra/control/control_disk_alert.py",
          # its watchers supervisor, VM stops and top's loops, with their configs, and the dead-man's switch that reads its heartbeat
          "infra/control/watchers.py", "infra/control/watchers.toml", "infra/control/vm_stop.py", "infra/control/vm_stop.toml",
          "infra/control/top_watch.py", "infra/control/deadman/api/deadman.py", "infra/control/deadman/vercel.json",
          # drive's loop, whose checkout per verb is tested here
          "infra/control/drive.sh"]
parallel = true
