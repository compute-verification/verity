[project]
name = "verity-ops"
version = "0.1.0"
description = "Operations on the shared machines: deploys to the Nebius nodes and keepers."
requires-python = ">=3.11"
dependencies = ["research"]

[project.scripts]
ops = "verity_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_ops"]

[tool.uv.sources]
research = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# deploy installs research's pod tooling and reads its pods/nebius/deploy.toml, the environment files and units it names and the
# keeper; its test reads the Slack registry for owners. What verity_ops imports of research is research's `exports`.
inputs = ["tools/research/src/research/pods", ".agents/skills/using-slack/registry.json"]
parallel = true
