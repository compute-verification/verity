# benchmarks' jobs on the queue: one recorded run per sweep point, dispatched by `verity-bench run SPEC`
# (benchmarks/harness/verity_bench/jobs.py names the kind by the spec's GPU count).

[kinds.vllm-bench-1gpu]
phase = "gpu1"
max_wall_min = 120
question = "At this sweep point, do the spec's vLLM arms pass their token and arm gates, and what does each add over stock?"
outputs = ["$RESEARCH_RUN_DIR/out/benchmark.json", "$RESEARCH_RUN_DIR/out/table.md", "$RESEARCH_RUN_DIR/out/resolved-spec.json"]
restart = "requeue"
