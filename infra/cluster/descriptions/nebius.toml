# vy-nebius-1 and vy-nebius-2 as one cluster, as their owners describe them on 30 Sep 2026, with Daniel's defaults for the
# cutover plan's decisions (research-notes lanes/infra/20260930T1858Z-handoff-from-pous-one-cluster-to-infra-cutover-plan).
# Node 2's agent plans from the copy in its pinned tree; `cluster validate` checks it, the tests plan against it, and `cluster
# policy diff` compares its [policy] with the nodes' live values. GPU UUIDs stay out: each lease records its own.
#
# Between the nodes only TCP 22 passes, inside the subnet too (the steward, 15:12Z): a node reaches the other's agent or
# queue only over SSH. Sizes here are what jobs declare, and declarations don't match use today (the steward, 18:05Z: CPU
# requests about 4x use; memory off both ways, a Commit asking 192 GB and using 6, a 4k Build asking 32-48 and using
# 100-127), so the planner's memory and CPU checks are only as good as the requests until jobs declare measured sizes.

[cluster]
name = "nebius"
drain_s = 7200  # admissions end 2 h before the stop, leaving the final backups (13:30Z) and custody before 14:55Z

[priorities]
service = 1000  # the node's own daemons: sampler, exporters, the node agent
timed = 900     # quiet whole-node windows
session = 700   # a lease taken by hand: a kernel inner loop, a debugger
# capture > work > bench is kueue.yaml's order, which is policy (the steward, 30 Sep 19:40Z): capture 1100 > sweep-night
# 1000 > a vLLM deployment's GPU work 600 > its CPU work 500 > prover-bench 300 > dev 100 > backfill 10
capture = 600   # port captures
work = 500      # a lane's queued work: vLLM deployments, sweep-night
bench = 300     # M0's pinned prover benches
dev = 100
fill = 10       # backfill: sweeps, censuses, anything that resumes from checkpoints

[nodes.vy-nebius-1]
gpu_model = "rtx-pro-6000"
owner = "verity"
memory_gib = 1690
stops_at = "2026-10-14T15:00:00Z"  # the VM's /etc/research/deadline
system_cpus = "0-7"  # k3s and the system (the steward's CPU map, 07:13Z)
numa = { 0 = "0-95", 1 = "96-191" }
# The merge-train check slots: never preempted, never borrowed, never used by other work (research coordinator, 17:22Z), slot
# d on 128-159 since 2 Oct. The provers' slices, the dispatcher's VY_PROVER_CPUS, which no other job may share (Daniel, 11:33 PM
# PDT 30 Sep; 160-191 since slot d took 128-159); a job naming no pool gets 96-127.
pools = { checks = "8-95,128-159", provers = "160-191" }
# A GPU job pinned here runs under node 1's gpu-lease, on a GPU n1_lease.py (infra/nebius) lends from a Kueue holder in provers.
gpu_executor = "n1-lease"
gpus = [
  { index = 0, numa = 0 }, { index = 1, numa = 0 }, { index = 2, numa = 0 }, { index = 3, numa = 0 },
  { index = 4, numa = 1 }, { index = 5, numa = 1 }, { index = 6, numa = 1 }, { index = 7, numa = 1 },
]

# Kueue's GPU quotas on node 1 (kueue.yaml, infra/nebius fc0217812): what a workstream owns it gets back from any borrower.
[[workstreams]]
name = "provers"          # borrows every idle GPU; Commits (600) reclaim from it (300) (Daniel, 10:58 PM PDT 30 Sep)
node = "vy-nebius-1"
gpus = 2
borrow_gpus = 6

[[workstreams]]
name = "deployments-gpu"  # borrowable, and borrowed GPUs go back when its Commits arrive
node = "vy-nebius-1"
gpus = 6
borrow_gpus = 2

[nodes.vy-nebius-2]
gpu_model = "rtx-pro-6000"
owner = "pous"
memory_gib = 1690
stops_at = "2026-10-14T15:00:00Z"  # the VM's /etc/research/deadline
numa = { 0 = "0-95", 1 = "96-191" }
# GPUs 0-3 on NUMA 0 and 4-7 on NUMA 1, no NVLink, the NIC on NUMA 1 (node2-ops read it at 19:09Z, 30 Sep).
gpus = [
  { index = 0, numa = 0 }, { index = 1, numa = 0 }, { index = 2, numa = 0 }, { index = 3, numa = 0 },
  { index = 4, numa = 1 }, { index = 5, numa = 1 }, { index = 6, numa = 1 }, { index = 7, numa = 1 },
]

# Verity on node 2 (decision 1 at Daniel's default): idle capacity only, preemptible, never in a window, GPUs included.
# CPUs, memory and job caps are pous infra's interim terms (research-notes, 20260930T1629Z).
# Its CPUs sit inside check slots a and b: a guest runs at nice 19 in the user slice (0-119 since vy-device-cores), so it takes
# only what the checks leave idle (infra, 12 Oct). Renewed to the VM's stop.
[[shares]]
project = "verity"
node = "vy-nebius-2"
cpus = "48-95"
max_memory_gib = 1024
max_job_memory_gib = 256
max_jobs = 6
until = "2026-10-14T15:00:00Z"

# PoUW on node 1 (decision 1's other half): overflow onto idle GPUs, preemptible, evicted first, off the reserved CPUs
# 0-95, and only work that neither ranks nor times sm_120 kernels (such jobs pin node = "vy-nebius-2"). On node 1 it
# enters through a Kueue LocalQueue on `backfill` that the steward owns; this share is the rule that queue keeps.
[[shares]]
project = "pous"
node = "vy-nebius-1"
cpus = "96-191"
until = "2026-10-14T15:00:00Z"

# Policy: the values node services read from outside git today (a tmux pane's environment, Kueue's objects, slot and CPU-map
# files), as agreed on 3 Oct 2026, each under the handle who decides a change (`owner`, which covers every key below it).
# `cluster policy show` prints them, each with where it is read; `cluster policy diff` reads each from its node, read-only,
# and names every key where the live value differs (policy.py). `vy-nebius-1.pools.*` are the node's `pools` above. A change
# that should end on its own is an override (`cluster policy override ... --until T`), recorded on the key's node, not here.
[policy.vy-nebius-1]
owner = "infra"
direct-gpus = "none"            # /etc/vy/direct-gpus: gpu-lease's direct runs get no GPU (the 30 Sep cutover)
direct-cpus = "0-95,128-159"    # /etc/vy/direct-cpus: a direct run's CPUs, the non-benchmark ones (96-127 are the --queue GPU jobs', 6 Oct)
user-cpuset = { delegate = "cpu cpuset memory pids" }   # user@.service.d/vy-cpuset.conf, so a user scope's AllowedCPUs holds (#855)
# /workspace/research/locks/lean-slots (lean_slot.py): the cap of 4, split by infra and proofs (16:25Z)
lean-slots = { check = 2, audit = 2 }
# /workspace/research/locks/slots (slot.py): the merge-check slots, the `checks` pool
check-slots = { c = "8-31", a = "32-63 only=trains", b = "64-95", d = "128-159" }

# tmux n1-lease: the provers' lease pool (n1_lease.py's environment). Up to 8 holders, 4 of them on borrowed quota while every
# waiter is --preemptible, until 2 h before the 12:30Z quiet hold (coordinator 15:00Z; 6 left borrowing dead, 18:26Z).
[policy.vy-nebius-1.lease-pool.provers]
max = 8
borrow = 4
borrow-until = "2026-10-04T10:30:00Z"

# tmux n1-lease-circuits: circuits' pool on deployments-gpu, outside the pacer's hold (deployments-gpu-pool)
[policy.vy-nebius-1.lease-pool.circuits]
name = "circuits"
dir = "/run/gpu-lease-circuits"
queue = "deployments-gpu"
local-queue = "deployments-gpu-pool"
priority = "circuits-gpu"
max = 6
idle-s = 30   # circuits' ask, 2 Oct 10:21Z

# Kueue's ClusterQueues: sky/kueue.yaml's quotas, which cluster_up.sh applies; the GPU quotas of provers and deployments-gpu
# are the workstreams' above, and policy.py checks they agree. Only the quiet hour and the disk guard hold a queue (stopPolicy).
[policy.vy-nebius-1.kueue.provers]
stop-policy = "None"
gpu = { nominal = 2, borrowing = 6 }
cpu = { nominal = 64, borrowing = 124 }
memory = { nominal = "384Gi", borrowing = "1280Gi" }

[policy.vy-nebius-1.kueue.deployments-gpu]
stop-policy = "None"
gpu = { nominal = 6, borrowing = 2 }
cpu = { nominal = 24, borrowing = 72 }
memory = { nominal = "640Gi", borrowing = "320Gi" }

[policy.vy-nebius-1.kueue.deployments-cpu]
stop-policy = "None"
gpu = { nominal = 0, borrowing = 0 }
cpu = { nominal = 100, borrowing = 16 }
memory = { nominal = "640Gi", borrowing = "384Gi" }

[policy.vy-nebius-1.kueue.backfill]   # nominal 0: everything it runs is borrowed idle quota
stop-policy = "None"
gpu = { nominal = 0 }
cpu = { nominal = 0 }
memory = { nominal = 0 }

[policy.vy-nebius-1.kueue.circuits]   # draining since 1 Oct: delete it once it is empty
stop-policy = "None"
gpu = { nominal = 0 }
cpu = { nominal = 0 }
memory = { nominal = 0 }

# Node 2 as read at 19:40Z on 3 Oct, outside a timed window. No /etc/vy/direct-* here: gpu-lease's direct runs aren't capped.
[policy.vy-nebius-2]
owner = "infra"
user-cpuset = { delegate = "cpu cpuset memory pids" }
# two full-check slots that stop taking checks 90 min before every booked window, so a check started before it ends in time
# (infra, 12 Oct); 120-127 are isolcpus (kernel cmdline)
check-slots = { a = "0-63 windows=/workspace/pouw/fill/windows lead=90 mem=560", b = "64-119 windows=/workspace/pouw/fill/windows lead=90 mem=560" }
# /workspace/pouw/fill/cpu-sets: compute accounting's verifies, 4 at a time in 40 GB each, on slot d's cores
fill.cpu-sets = { bc-e6a46970-b6ef-5738-af64-182b143075d4 = "0-47 4 40" }
# /workspace/pouw/fill/windows: the booked timed windows, as `fill.window."START" = MINUTES` (START in UTC, to the minute).
# None is booked ahead; one that has ended is no longer compared.
