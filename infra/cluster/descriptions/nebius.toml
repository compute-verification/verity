# vy-nebius-2, as its owner describes it, with the decided defaults for the cutover plan's decisions.
# Its agent plans from the copy in its pinned tree; `cluster validate` checks it, the tests plan against it, and `cluster
# policy diff` compares its [policy] with the node's live values. GPU UUIDs stay out: each lease records its own.
#
# Sizes here are what jobs declare, and declarations don't match use today (CPU requests about 4x use; memory off both ways),
# so the planner's memory and CPU checks are only as good as the requests until jobs declare measured sizes.

[cluster]
name = "nebius"
drain_s = 7200  # admissions end 2 h before the stop, leaving the final backups (13:30Z) and custody before 14:55Z
# A node's stop is its live /etc/research/deadline: node 2's agent reads it every tick, and `research run --queue` reads each
# node's over ssh (`cluster submit --stop`). A node's stops_at here is only the fallback for when that can't be read.

[priorities]
service = 1000  # the node's own daemons: sampler, exporters, the node agent
timed = 900     # quiet whole-node windows
session = 700   # a lease taken by hand: a kernel inner loop, a debugger
gate = 650      # drive's merge-path gates: ahead of every lane job in node 2's cpu-hold line
capture = 600   # port captures
work = 500      # a lane's queued work: vLLM deployments, sweep-night
bench = 300     # M0's pinned prover benches
dev = 100
fill = 10       # backfill: sweeps, censuses, anything that resumes from checkpoints

[nodes.vy-nebius-2]
gpu_model = "rtx-pro-6000"
owner = "pous"
memory_gib = 1690
stops_at = "2026-10-24T15:00:00Z"  # the fallback for the VM's /etc/research/deadline
numa = { 0 = "0-95", 1 = "96-191" }
# GPUs 0-3 on NUMA 0 and 4-7 on NUMA 1, no NVLink, the NIC on NUMA 1.
gpus = [
  { index = 0, numa = 0 }, { index = 1, numa = 0 }, { index = 2, numa = 0 }, { index = 3, numa = 0 },
  { index = 4, numa = 1 }, { index = 5, numa = 1 }, { index = 6, numa = 1 }, { index = 7, numa = 1 },
]

# Verity on node 2 (decision 1, at its default): idle capacity only, preemptible, never in a window, GPUs included.
# CPUs, memory and job limits are pous infra's interim terms (research-notes, 20260930T1629Z).
# Its CPUs sit inside check slots a (0-63) and b (64-119), so no core of it is outside a check's. A guest's CPU job claims
# `cpus` of them in whole cores of its own (`research cpu-hold`, waiting while none are free) at nice 0; nice never made it
# yield to a check, which runs in a session scope beside user@.service (every queued run and fill job), weighted the same. A
# guest's GPU job's runner keeps all of them at nice 19. It lasts until the VM's stop, renewals included.
[[shares]]
project = "verity"
node = "vy-nebius-2"
cpus = "48-95"
max_memory_gib = 1024
max_job_memory_gib = 256
max_jobs = 6
until = "stops_at"

# Policy: the values node services read from outside git today (slot and CPU-map files), as agreed, each under the handle who decides a change (`owner`, which covers every key below it).
# `cluster policy show` prints them, each with where it is read; `cluster policy diff` reads each from its node, read-only,
# and names every key where the live value differs (policy.py). A change
# that should end on its own is an override (`cluster policy override ... --until T`), recorded on the key's node, not here.
# Node 2 as read with its fill runner down since a boot (`policy diff` reads it as quiet from
# gpu-lease's state), every key as declared. No /etc/vy/direct-* here: gpu-lease's direct runs aren't capped.
[policy.vy-nebius-2]
owner = "infra"
# vy-device-cores owns node 2's cpusets: user.slice 0-119, its device cores 120-127, so `cluster policy apply` only
# plans this drop-in here (policy_apply.PLAN_ONLY) and never `systemctl revert`s it
user-cpuset = { delegate = "cpu cpuset memory pids" }
# two full-check slots (node 2 runs for check capacity) that stop taking checks 90 min before
# every booked window, so a check started before it ends in time; b ends at 119 because 120-127 are
# vy-device-cores' device cores (isolcpus on the kernel cmdline, user.slice 0-119)
check-slots = { a = "0-63 windows=/workspace/pouw/fill/windows lead=90 mem=560", b = "64-119 windows=/workspace/pouw/fill/windows lead=90 mem=560" }
# /workspace/pouw/fill/cpu-sets: compute accounting's verifies, 4 at a time in 40 GB each, on 0-47, inside check slot a since
# slot d left node 2
fill.cpu-sets = { bc-e6a46970-b6ef-5738-af64-182b143075d4 = "0-47 4 40" }
# /workspace/pouw/fill/windows: the booked timed windows, as `fill.window."START" = MINUTES` (START in UTC, to the minute).
# None is booked ahead; one that has ended is no longer compared.
