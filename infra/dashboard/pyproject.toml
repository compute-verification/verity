# The dashboard's goal as a number (`run.py`). Not a package: the suite checks the count on made-up dashboard data, so
# nothing is read from the site (`uv run tools/check/suites.py infra/dashboard`).
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes over about 5 s; deselect with -m 'not slow'"]

[tool.verity.tests]
# the runner writes its result with the platform's own helper
inputs = [
    "tools/research/src/research/result.py",
]
