# The VMs vm_stop.py stops through the Nebius API (deployed as /data/watchers/vm_stop.toml, read every pass). Each names a machine of
# the registry (machines.d), which gives its host and, unless the entry does, its instance id and deadline. Rules: `deadline`,
# `idle` (the H200 rule) and `lease` (a vy-dc-* VM's ~/.research/lease); vm_stop.py's docstring states each. A VM launched for a
# few hours can be appended on the pod at once; put it here in the next PR.

# circuits' eu-north1 H200s, which can't stop themselves (INF-58); s1 was deleted 15:13Z 19 Oct with its disks (top, CIR-52)
[[vm]]
name = "vy-glm53-eu"
rules = ["idle", "deadline"]

[[vm]]
name = "vy-glm53-eu2"
rules = ["idle", "deadline"]

# us-north1: its attached account can't stop it
[[vm]]
name = "vy-glm53-cpu-2"
rules = ["deadline"]

# the registry has neither its id nor its deadline
[[vm]]
name = "vy-dc-l40s"
rules = ["lease", "deadline"]
id = "computeinstance-e00pw70ghyxsjjcy6n"
deadline = "2026-10-20T04:00:00Z"
